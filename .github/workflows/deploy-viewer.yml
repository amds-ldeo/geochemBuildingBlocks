name: Deploy custom bblocks-viewer

on:
  workflow_run:
    workflows: ["Validate and process Building Blocks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-viewer:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get GitHub Pages URL
        id: pages-url
        run: |
          FALLBACK="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          URL=$(gh api repos/${{ github.repository }}/pages --jq '.html_url // empty' 2>/dev/null) || true
          # Validate the SHAPE, not just non-emptiness. When Pages is not enabled the API 404s and
          # `gh` prints its error body to STDOUT, so 2>/dev/null does not suppress it and --jq never
          # applies: URL captures the raw JSON, which is non-empty, so an -z test passes it straight
          # through. That JSON then interpolates into PAGES_URL="..." in a later step, its embedded
          # quotes break the assignment, and the runner tries to execute a fragment of the error
          # body (exit 127). Anything that is not an http(s) URL is not a Pages URL.
          case "$URL" in
            https://*|http://*) ;;
            *) URL="$FALLBACK" ;;
          esac
          # Guarantee the trailing slash the config.js/index.html templates concatenate onto.
          case "$URL" in */) ;; *) URL="$URL/" ;; esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Read repo title from bblocks-config.yaml
        id: config
        run: |
          TITLE=$(grep '^name:' bblocks-config.yaml | sed 's/^name: *//')
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Augment register.json with resolvedSchema URLs
        run: python tools/augment_register.py

      - name: Generate custom validation report
        run: python tools/generate_custom_report.py --input build/tests/report.json --output build/tests/report.html

      - name: Generate config.js and index.html
        env:
          PAGES_URL: ${{ steps.pages-url.outputs.url }}
          TITLE: ${{ steps.config.outputs.title }}
        run: |
          BASE_PATH=$(echo "$PAGES_URL" | sed 's|https\?://[^/]*||')
          cat > config.js << EOF
          window.bblocksRegister = '${PAGES_URL}build/register.json';
          window.bblocksViewer = {
            title: "${TITLE}",
            showImported: 0,
            baseUrl: '${BASE_PATH}',
          };
          EOF
          cat > index.html << EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <link rel="icon" href="https://smrgeoinfo.github.io/bblocks-viewer/favicon.ico" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>OGC Location Building Blocks</title>
            <script src="${PAGES_URL}config.js"></script>
            <script type="module" crossorigin src="https://smrgeoinfo.github.io/bblocks-viewer/assets/index.js"></script>
            <link rel="stylesheet" href="https://smrgeoinfo.github.io/bblocks-viewer/assets/index.css">
          </head>
          <body>
            <div id="app"></div>
          </body>
          </html>
          EOF
          cp index.html 404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages if the repo has no Pages site yet, instead of requiring someone to click
          # through Settings. The amds-ldeo move left this repo without one, so every deploy-viewer
          # run failed and the published viewer 404s — a manual step that has to be repeated on
          # every fork or move is a step that gets missed.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
