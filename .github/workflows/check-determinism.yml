# Fail when a generator's output depends on something other than its source.
#
# "Regenerate and compare" is the premise of check-schema-drift.yml, and it
# cannot hold against a generator that varies per process. One did:
# _collector_map took the FIRST match out of a set, so which of several
# substring-matching members won depended on string hash randomisation, and
# three consecutive runs over unchanged sources produced three different
# Solution-MC-ICPMS examples. The drift check did not catch it -- it passed on
# the run that happened to agree with what was committed. It was noticed only
# because a human saw two examples moving between regenerations.
#
# The two passes use DIFFERENT fixed hash seeds rather than the default random
# one. Two default runs are each random and may coincide, so a passing result
# would mean little; a deterministic generator gives identical bytes under any
# seed, while anything iterating a set of strings almost certainly differs
# between seed 1 and seed 2.
#
# Scoped to the example stage, which is where this class of bug lives: the
# emitters parse free-text workbook cells by recognising known tokens, which
# means set and dict membership over strings. The schema stages are a
# straight structural walk of their sources. Widen it if that stops being true.
name: Check generators are deterministic

on:
  push:
    branches: [main]
  # NO paths filter, deliberately, because this is a REQUIRED check. A required check that does
  # not run sits pending forever, so filtering by path would deadlock every PR that happens to
  # touch none of the listed files. It costs a few minutes per PR to always report; a merge that
  # cannot happen costs more.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: determinism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  twice:
    name: Regenerate twice and compare
    runs-on: ubuntu-latest
    steps:
      # WITH the submodule, unlike the other workflows here. build_tapp_examples reads the
      # publication columns out of each TAPP's .xlsx twin, so the example stage cannot run
      # without tapp/ -- it failed for all 16 workbook-based techniques on this check's first
      # run, which is how we learned CI had never exercised example generation at all.
      #
      # This does not undo the `update = none` in .gitmodules. That setting exists to stop OGC's
      # postprocess workflow from running `git submodule update --remote` and COMMITTING a bumped
      # pointer, as it did in c0194f7e4. Checking the pinned revision out read-only, in a job that
      # commits nothing, is a different act.
      - name: Checkout repository
        uses: actions/checkout@v4

      # `submodules: true` on actions/checkout is NOT enough, which cost one red run to learn:
      # .gitmodules sets `update = none`, actions/checkout honours it, and the submodule ends up
      # registered but empty -- the examples stage then failed on
      # 'tapp/Current TAPPs/EPMA_TAPP_v88.csv' for all 16 workbook-based techniques. The explicit
      # --checkout is the same flag CLAUDE.md says a fresh clone needs, for the same reason.
      #
      # This does not undo `update = none`. That exists to stop OGC's postprocess workflow from
      # running `git submodule update --remote` and COMMITTING a bumped pointer, as it did in
      # c0194f7e4. Checking the PINNED revision out, in a job that commits nothing, is a
      # different act -- note there is no --remote here.
      - name: Populate the tapp submodule
        run: git submodule update --init --checkout tapp

      # Fail loudly if the submodule is empty rather than 16 stages in, since that is how this
      # was first discovered.
      - name: Verify the delivery is present
        run: |
          n=$(ls "tapp/Current TAPPs"/*.csv 2>/dev/null | wc -l)
          echo "$n delivered TAPP table(s) present"
          if [ "$n" -lt 16 ]; then
            echo "::error::tapp/ is not populated ($n tables). The examples stage reads each"
            echo "technique's workbook from there, so it cannot run."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt
      # THE Data Type CHECKS LIVE HERE BECAUSE THE DATA DOES. They compare each sidecar's Data
      # Type column against its workbook's, and the delivered workbooks are under
      # "tapp/Current TAPPs" -- this is the only job that populates that submodule.
      #
      # They were put in check-examples.yml first, which does not, and the floor tripwire caught
      # it on the first run: 1637 pairs compared against 3477 locally. Worth recording that the
      # tripwire is the only thing that caught it -- with the delivered tables absent, every
      # remaining pair agreed and the check itself reported a clean 0 disagreements. It would have
      # gone green over less than half its corpus, which is the exact failure the floors in both
      # these workflows exist to stop, and it took a floor to find it in a check that has one.
      #
      # Placed before the two regeneration passes so a Data Type defect fails in seconds rather
      # than after six minutes of work it would invalidate anyway.
      # Neither of the two Data Type columns is validated against the other, and only one is
      # read. schema_path_emitter._load_rows and build_tapp.unit take it from the WORKBOOK; the
      # in docs/<name>.schemapaths.csv is seeded from the workbook by bootstrap_schemapaths.py and
      # then frozen, so one hand-edit of either file diverges them permanently with no signal.
      #
      # 17 items had diverged when this was added: the sidecar NAMED the unit (`Numeric (kV)`)
      # while the workbook only asserted one existed (`Number + unit`). Reconciling them changed
      # no emitted schema -- all 17 sit on a direct `ada:<name>Default` property, which drops the
      # unit, rather than on the `schema:additionalProperty` placement that pins it as a const. The
      # gate is still worth having, for the reason the divergence lasted: editing the unread file
      # regenerates clean and changes nothing, so neither file can tell you it is the stale one.
      #
      # --emitters covers a second reading of the same cell, and that one DID ship a failure: the
      # schema emitter learned that a cell can mean a QuantitativeValue object and the example
      # emitter kept returning a bare 1, so a -P0 example failed the schema generated from its own
      # cell. Both run with --self-test first, because both report 0 and a 0 from a check that
      # cannot fire is this repository's most expensive failure mode.
      - name: Prove the Data Type check can fire
        run: python tools/check_data_type_agreement.py --self-test

      - name: Check each sidecar Data Type against its workbook
        id: dtypes
        run: |
          set -o pipefail
          python tools/check_data_type_agreement.py --emitters --strict 2>&1 | tee /tmp/dtypes.log

      # Same tripwire as every other step here: a check that compared nothing exits 0 and reads
      # as assurance. 3477 items are compared today; the floor catches pairing collapsing -- a
      # sidecar rename, or a workbook moving out of the two directories workbook_for searches --
      # not ordinary movement as TAPPs are added.
      - name: Assert the Data Type comparison found its pairs
        if: always() && steps.dtypes.outcome != 'cancelled'
        run: |
          total=$(sed -n 's/^items whose Data Type agrees *: *\([0-9]\+\).*/\1/p' /tmp/dtypes.log | tail -1)
          if [ -z "$total" ]; then
            echo "::error::check_data_type_agreement.py printed no count, so what it did cannot"
            echo "be established. Treating that as a failure rather than a pass."
            exit 1
          fi
          echo "$total item(s) compared"
          if [ "$total" -lt 2500 ]; then
            echo "::error::only $total item(s) were compared, against 3477 when this check was"
            echo "written. Either sidecars stopped pairing with their workbooks, or the Data Type"
            echo "column was renamed -- in which case _column returns {} and every pair agrees"
            echo "vacuously."
            exit 1
          fi

      - name: Explain a Data Type failure
        if: failure() && steps.dtypes.outcome == 'failure'
        run: |
          echo "A sidecar Data Type disagrees with its workbook's."
          echo
          echo "    python tools/check_data_type_agreement.py"
          echo
          echo "The WORKBOOK is the file that is read, so decide which value is right and put it"
          echo "THERE. Editing only the sidecar regenerates clean and changes nothing."
          echo
          echo "For a draft under draftTAPPs/ both files are ours and the sidecar may well hold"
          echo "the better value -- it did in all 17 cases that prompted this check. For a"
          echo "delivered table under tapp/Current TAPPs/ the workbook IS the delivery: fix the"
          echo "sidecar instead, and do not quietly reword a delivered cell."
          echo
          echo "After editing a draft workbook, refresh its .xlsx twin in the same change:"
          echo
          echo "    python tools/make_draft_xlsx_twin.py --refresh <NAME> --write"
          echo
          echo "check-determinism reads the twin, not the .csv, so a stale twin fails there"
          echo "instead -- with an error that points at the generator rather than at this edit."
          echo
          echo "If instead the failure names a Data Type cell whose EXAMPLE fails its own schema,"
          echo "nothing in the workbooks is wrong: schema_path_emitter.leaf_for and"
          echo "schema_path_example_emitter.placeholder disagree about what that cell asks for."
          echo "Fix whichever is wrong, and have the example emitter IMPORT the predicate from the"
          echo "schema emitter rather than restate the test -- restating it is how they drifted."

      - name: Pass 1 (PYTHONHASHSEED=1)
        env:
          PYTHONHASHSEED: '1'
        run: python tools/regenerate.py --from examples

      # Hash the generated examples rather than keeping two copies of the tree.
      - name: Record pass 1
        run: |
          find _sources -name 'example*.json' -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/pass1.sha

      # Back to the committed state, so pass 2 starts where pass 1 did and the
      # comparison is between two generations, not between a generation and
      # whatever the previous one left behind.
      - name: Restore
        run: git checkout -- _sources

      - name: Pass 2 (PYTHONHASHSEED=2)
        env:
          PYTHONHASHSEED: '2'
        run: python tools/regenerate.py --from examples

      - name: Record pass 2
        run: |
          find _sources -name 'example*.json' -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/pass2.sha

      - name: Compare
        run: |
          if diff -q /tmp/pass1.sha /tmp/pass2.sha > /dev/null; then
            echo "Both passes produced identical bytes for every generated example."
            exit 0
          fi

          echo "::error::A generator's output changed between two runs over identical sources."
          echo
          echo "Files that differ between the two passes:"
          # Second field is the path; report only the ones whose hash moved.
          join -j 2 <(sort -k2 /tmp/pass1.sha) <(sort -k2 /tmp/pass2.sha) \
            | awk '$2 != $3 { print "  " $1 }'
          echo
          echo "The two passes differ only in PYTHONHASHSEED, so the output depends on"
          echo "the iteration order of a set or dict of strings somewhere in the"
          echo "generator. Look for a membership scan whose FIRST hit is taken --"
          echo "next((m for m in members if ...)) over a set was the last one -- and"
          echo "make the choice explicit: longest match, or sorted order."
          echo
          echo "This also invalidates check-schema-drift until it is fixed: that job"
          echo "compares one generation against the committed artifacts, which is"
          echo "meaningless if a second generation would differ from the first."
          exit 1
