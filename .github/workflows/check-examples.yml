# Fail when a committed example does not validate against its own block's schema.
#
# This check did not exist until 2026-10-08, and its absence had already cost
# something concrete. #63 added stemTAPP and ebsdTAPP; its tapp schemas required a
# root ada:procedureAuthorDescription that none of the three draft instances
# carried, so all three failed the JSON Schema gate from the day they landed. The
# pull request was reported as green and merged, because every check it ran was
# green -- none of them validated an example. The defect sat on main until someone
# happened to run tools/validate_examples.py by hand.
#
# That is the failure mode CLAUDE.md calls out: a rule that never runs looks
# exactly like a rule that passes. The four existing workflows check whether
# generated artifacts are CURRENT (check-schema-drift), whether a generator is
# DETERMINISTIC (check-determinism), and whether the OGC postprocess succeeds
# (process-bblocks). None of them asks whether the content is VALID.
#
# Two things about how this runs, both deliberate:
#
#  1. NO --live. validate_examples.py reads each block's committed
#     resolvedSchema.json by default and re-resolves from source only under
#     --live. Its own docstring records why: live re-resolution "stopped finishing
#     at all" once the composition modules widened the reference graph, with three
#     runs killed after 3, 8 and 9 hours pegged at 100% CPU. The default mode is
#     also the honest one here -- resolvedSchema.json is what downstream
#     validators actually read, so it is what should be tested.
#
#  2. NO tapp submodule, unlike check-determinism. That job needs tapp/ because
#     build_tapp_examples reads publication columns out of each .xlsx twin. This
#     one only reads files already in the tree, so it needs neither the submodule
#     nor the network -- resolve_schema's _ALLOW_FETCH is False by default and the
#     remote blocks are served from the committed vendor/remote/ cache.
name: Check examples validate

on:
  push:
    branches: [main]
  # NO paths filter, matching check-schema-drift and check-determinism, and for the same
  # reason: if this becomes a REQUIRED check, one that does not run sits pending forever and
  # deadlocks every pull request that happens to touch none of the listed paths. An example can
  # also break without being edited -- #63's three broke because a SCHEMA gained a required
  # property -- so a filter on example paths would have missed the case this exists for.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate committed examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate every example against its block's schema
        id: validate
        run: |
          set -o pipefail
          python tools/validate_examples.py 2>&1 | tee /tmp/validate.log

      # A gate that validated NOTHING would exit 0 and report green, which is the same
      # failure this workflow exists to stop -- so assert it actually found a corpus. The
      # floor is a tripwire for "found nothing", not a target: 644 examples pass today, and
      # the count is expected to move as blocks are added or archived (mBB's went 152 -> 130
      # when ddiProperties was archived). Raise it only if it starts hiding a real drop.
      - name: Assert the corpus was actually found
        if: always() && steps.validate.outcome != 'cancelled'
        run: |
          total=$(sed -n 's/.*(of \([0-9]\+\) total).*/\1/p' /tmp/validate.log | tail -1)
          if [ -z "$total" ]; then
            echo "::error::validate_examples.py printed no 'Results:' line, so what it did"
            echo "cannot be established. Treating that as a failure rather than a pass."
            exit 1
          fi
          echo "$total example(s) validated"
          if [ "$total" -lt 400 ]; then
            echo "::error::only $total example(s) were found, against 644 when this check was"
            echo "written. Either a large part of _sources has gone, or the glob stopped"
            echo "matching -- a gate reporting success over a handful of files is worse than"
            echo "no gate, because it reads as assurance."
            exit 1
          fi

      # The step above cannot see every example. validate_examples.py globs
      # example*.json, and 46 blocks have no such file -- their examples are
      # snippets[].code strings inside examples.yaml, which a glob cannot reach.
      # 26 of those 58 snippets failed their own block's schema when first
      # measured, among them seven still carrying the retired object-form
      # ada:componentType and all fourteen adaProfile/*/detail examples missing a
      # required property. The OGC postprocess did see them -- it wrote a
      # validation_failed.txt per example -- and still concluded success, so
      # nothing ever failed. They are at 0 now; this is what keeps them there.
      - name: Validate the inline examples the glob cannot reach
        id: inline
        run: python tools/validate_inline_examples.py 2>&1 | tee /tmp/inline.log

      # Same reasoning as the corpus assertion above. The tool already exits 1 on
      # finding nothing at all; this catches the subtler case where it still finds
      # some but the set has collapsed.
      - name: Assert the inline corpus was actually found
        if: always() && steps.inline.outcome != 'cancelled'
        run: |
          total=$(awk '$2 == "inline" { print $1 }' /tmp/inline.log | tail -1)
          if [ -z "$total" ]; then
            echo "::error::validate_inline_examples.py printed no count, so what it"
            echo "did cannot be established. Treating that as a failure, not a pass."
            exit 1
          fi
          echo "$total inline snippet(s) validated"
          if [ "$total" -lt 40 ]; then
            echo "::error::only $total inline snippet(s) were found, against 58 when"
            echo "this check was written. Either examples.yaml snippets have gone, or"
            echo "discovery stopped matching."
            exit 1
          fi

      # Neither step above can see this class at all, in either direction.
      #
      # CDIF's additionalProperty SHACL reports a URI or CURIE serialized as a string
      # literal at sh:Violation severity -- 740 of ~2,499 violations, the largest single
      # class, cleared by #77 across 345 example files. Two things make it invisible to a
      # corpus of examples. A schema is a set of restrictions, so losing one only makes it
      # more PERMISSIVE and every instance that validated still validates. And a `contains`
      # pin that stops MATCHING its converted value makes instances more likely to validate,
      # not less: the constraint is still present and still bites, it just no longer bites
      # the thing it was written for. bios:LabProcess was exactly that, and #79 fixed it.
      #
      # The violations were also invisible until #67, which fixed five module rules.shacl
      # files that would not parse. While they did not parse, no shape was ever evaluated.
      #
      # docs/ADDITIONALTYPE_POLICY.md states both clauses. Clause 2 is green today and has
      # no allowlist, so any violation here is a regression. Clause 1 has recorded open debt
      # in docs/additionaltype_policy_open.json, which fails closed in both directions -- an
      # unlisted violation fails, and so does a listed entry that no longer violates.
      - name: Enforce the additionalType / propertyID serialization policy
        id: policy
        run: python tools/check_additionaltype_policy.py 2>&1 | tee /tmp/policy.log

      # Same tripwire as the two above: a check that examined nothing exits 0 and reads as
      # assurance. 2189 declarations today; the floor catches discovery collapsing, not
      # ordinary movement as blocks are added or archived.
      - name: Assert the policy check examined the sources
        if: always() && steps.policy.outcome != 'cancelled'
        run: |
          total=$(sed -n 's/^declarations examined *: *\([0-9]\+\).*/\1/p' /tmp/policy.log | tail -1)
          if [ -z "$total" ]; then
            echo "::error::check_additionaltype_policy.py printed no count, so what it did"
            echo "cannot be established. Treating that as a failure rather than a pass."
            exit 1
          fi
          echo "$total declaration(s) examined"
          if [ "$total" -lt 1500 ]; then
            echo "::error::only $total declaration(s) were examined, against 2189 when this"
            echo "check was written. Either a large part of _sources has gone, or the walk"
            echo "stopped matching."
            exit 1
          fi

      - name: Explain a policy failure
        if: failure() && steps.policy.outcome == 'failure'
        run: |
          echo "A schema:additionalType or schema:propertyID declaration breaks the"
          echo "serialization policy in docs/ADDITIONALTYPE_POLICY.md."
          echo
          echo "    python tools/check_additionaltype_policy.py"
          echo "    python tools/check_additionaltype_policy.py --list   # all, by shape"
          echo
          echo "Rule A -- a pinned CURIE or URI must be expressed as an IRI reference."
          echo "Pin each branch of the discriminator, as #79 did for bios:LabProcess:"
          echo
          echo "    contains:"
          echo "      anyOf:"
          echo "      - const: bios:LabProcess"
          echo "      - type: object"
          echo "        required: ['@id']"
          echo "        properties: {'@id': {const: bios:LabProcess}}"
          echo
          echo "Widening it to {type: object} instead would match ANY member and satisfy the"
          echo "discriminator silently, which is worse than the narrow form because it fails"
          echo "nothing. A pin naming a FREE LABEL is correct as a bare string -- the rule"
          echo "keys on the value, not on the presence of a pin."
          echo
          echo "Rule B -- a value-type declaration must admit the IRI-reference form, and the"
          echo "open sites are recorded in docs/additionaltype_policy_open.json. If you fixed"
          echo "one, remove its entry in the same change; a stale entry fails on purpose."

      - name: Explain a failure
        if: failure() && steps.validate.outcome == 'failure'
        run: |
          echo "An example does not validate against its own block's schema."
          echo
          echo "The named file and the failing constraint are in the step above. Reproduce it"
          echo "locally with the same command, or narrow to one block:"
          echo
          echo "    python tools/validate_examples.py"
          echo "    python tools/validate_examples.py -f <block-name-substring>"
          echo
          echo "Two causes worth ruling out before editing the example, because both have"
          echo "happened here:"
          echo
          echo "  1. A SCHEMA gained a required property the example was never going to carry."
          echo "     That is how #63's three draft TAPP instances broke -- build_tapp minted a"
          echo "     required root property from a sidecar row whose value the path-driven"
          echo "     example emitter writes somewhere else entirely. Fix the schema, not the"
          echo "     example, when the information is already present under another path."
          echo
          echo "  2. The artifacts are STALE. This job reads each block's committed"
          echo "     resolvedSchema.json, so an example can fail against a schema that no"
          echo "     longer matches its source. If check-schema-drift is also red, fix that"
          echo "     first -- regenerate and re-run, because this result may be about an"
          echo "     artifact nobody meant to ship."
