name: Validate Building Blocks (branch CI)

# Runs the OGC bblocks postprocess (validate + annotate + build register/tests) on
# feature branches and pull requests, WITHOUT the GitHub Pages deploy. The main
# process-bblocks.yml workflow declares an `environment: github-pages` on its job,
# which is protected to `main` and rejects any other branch before validation runs —
# so this is the pre-merge CI signal for feature work. No Pages environment, no deploy
# steps, contents:read only.

on:
  push:
    branches-ignore:
      - main            # main is validated + deployed by process-bblocks.yml
      - gh-pages
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and annotate (no pages)
    runs-on: ubuntu-latest
    # Both triggers above fire for a branch that has an open PR, so every push ran
    # this twice -- two identical 9-12 minute postprocess runs per push, visible in
    # PR #23's history as pairs at 17:51 and 18:42. Keep the `push` trigger, because
    # a feature branch with no PR yet still needs a signal, and skip the duplicate by
    # running the pull_request event only for forks, where the push event never
    # reaches this repository.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: OGC bblocks postprocess (validate + annotate)
        uses: opengeospatial/bblocks-postprocess/full@v1
        with:
          register_file: build/register.json
          items_dir: _sources
          generated_docs_path: build/generateddocs
          annotated_path: build/annotated
          test_outputs_path: build/tests
          config_file: bblocks-config.yaml
          base_url: https://amds-ldeo.github.io/geochemBuildingBlocks/
          fail_on_error: 'true'
          clean: 'true'
          deploy_viewer: false
          skip_permissions: 'true'

      - name: Upload build/tests report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bblocks-tests-report
          path: build/tests/
          if-no-files-found: ignore
