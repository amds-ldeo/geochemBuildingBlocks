# Fail when a source edit has landed without regenerating what is built
# from it.
#
# schema.yaml is authoritative; resolvedSchema.json and *Schema.json are
# built from it. An edit that lands in the source and in nothing that
# validates against it is invisible, because the sources still look
# right. On 2026-08-26 regenerating this repository with no source edits
# at all rewrote 9,269 lines across 34 files -- drift that had
# accumulated silently because nothing checked.
#
# It runs the WHOLE chain, not the last two stages. Until 2026-10-16 this job ran only
# `resolve_schema.py --all` and `regenerate_schema_json.py`, so it re-derived
# resolvedSchema.json and *Schema.json from schema.yaml and stopped there. But ~169 of the 242
# schema.yaml under _sources/ are THEMSELVES generated -- tapp/ and detail/ by build_tapp and
# build_pathdriven, profile/ by build_profile, BaseSchema/modules/* by build_module_bb -- out of
# the TAPP tables in the `tapp/` submodule plus the docs/*.schemapaths.csv sidecars. Nothing
# compared those against their sources, so a sidecar edit committed without regenerating, or a
# schema.yaml built from a superseded delivery, passed every check in the repository. The job's
# own NAME claimed otherwise, which is what made this worth fixing rather than documenting: a
# check called "regenerate and diff" that regenerates two stages of nine reads as cover it does
# not provide.
#
# Measured on 752a236a7b before enabling it: a full `tools/regenerate.py` over clean main
# changes ZERO files, so the comparison is meaningful rather than permanently red. That had to
# be measured, not assumed -- CLAUDE.md records that regenerating the source-derived STEM and
# EBSD blocks DESTROYS content no generator can reinvent (ebsd -15 JSON paths, stem -41). That
# loss is real, but it belongs to the per-technique `regenerate.py --tapp <ONE>` path, which
# this job does not use; the full run reproduces both blocks byte-for-byte. If that ever stops
# being true, fix the generator or exclude those blocks EXPLICITLY here -- never narrow the diff
# until it passes.
#
# The check does not repair anything. Committing a regeneration on the
# author's behalf would restore byte-parity while leaving the habit
# intact, and these artifacts are what consumers read.
name: Check generated schemas are current

on:
  push:
    branches: [main]
  # NO paths filter, deliberately, because this is a REQUIRED check. A required check that does
  # not RUN is not neutral -- it sits pending and the PR can never merge -- so filtering by path
  # would deadlock every PR that happens to touch none of the listed files.
  #
  # It became required after it twice failed to stop what it had detected: #31 merged with a red
  # determinism check and #32 merged with red drift, both because auto-merge waits only on
  # REQUIRED checks and this one was advisory. #32 left registry/monitoredPropertyColumns'
  # artifacts stale on main for two days as a result.
  #
  # Affordable now for a reason that was not true before: caching the parsed source files took a
  # full --all from ~62 minutes to under 6, and this job from 59m to 3m37s. At an hour a run,
  # filtering was a reasonable trade; at three minutes it is not.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-drift:
    name: Regenerate and diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pinned, because this job regenerates artifacts and diffs them against what is
      # committed: a library whose formatting differs from the author's turns that comparison
      # into a whole-file rewrite and reports drift that is not drift.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # New requirement of regenerating the whole chain: the table-driven stages read the
      # delivery under "tapp/Current TAPPs". `.gitmodules` sets `update = none`, so
      # actions/checkout leaves the submodule registered and EMPTY -- and `submodules: true` is
      # NOT enough, which cost check-determinism.yml a red run to learn. The explicit
      # --checkout is what populates it.
      #
      # `update = none` is itself load-bearing: it stops OGC's postprocess from running
      # `git submodule update --remote` and COMMITTING a bumped pointer, as it did in c0194f7e4,
      # which broke TAPP_CONFIGS for 13 of 16 techniques on main.
      - name: Populate the tapp submodule
        run: git submodule update --init --checkout tapp

      # A missing delivery no longer fails open: tapp_source.require_delivery() refuses the
      # superseded inline TAPPS<date>/ drop as of #130, so regeneration exits non-zero rather
      # than quietly building from the wrong tables. This floor catches the narrower case that
      # refusal cannot see -- a submodule that IS populated but holds no tables, where every
      # stage would succeed over nothing and this job would report a clean diff.
      - name: Assert the delivery is populated
        run: |
          n=$(ls "tapp/Current TAPPs"/*.csv 2>/dev/null | wc -l)
          echo "$n delivered table(s)"
          # 16, matching check-determinism.yml's floor and the 16 composed entries in
          # composed_tapps.json. It was written as 30 against "33 when this step was written" and
          # CI caught that on the first run: 33 is the count of ENTRIES in that directory -- 16
          # .csv tables, their 16 .xlsx twins, and one .md -- not the count of tables. The glob
          # here is *.csv, so the threshold has to be the table count. Taking a number from one
          # measurement and using it as the floor for a different one is how that happened.
          if [ "$n" -lt 16 ]; then
            echo "::error::only $n table(s) under 'tapp/Current TAPPs', against 16 delivered"
            echo "today. The table-driven stages would regenerate little or nothing, and the"
            echo "diff below would then be clean for the wrong reason."
            exit 1
          fi

      # Unlike the same check in metadataBuildingBlocks, this one is NOT
      # offline: 31 sources $ref building blocks in that repository by
      # absolute URL, and resolve_schema.py fetches them at build time.
      # So the resolved output depends on what that repository has
      # published, and a red check here means one of two things --
      # someone edited a source here without regenerating, or an
      # upstream block changed. The diff says which.
      # The whole chain in dependency order, through regenerate.py rather than the individual
      # tools: the stages are a chain and running them out of order fails SILENTLY (modules
      # before simplify, resolve before build_profile's second pass -- both known incidents
      # produced a green validate_examples). Nine stages, ~17 minutes measured locally, of
      # which resolve is ~6.
      - name: Regenerate everything from its sources
        run: |
          set -o pipefail
          python tools/regenerate.py 2>&1 | tee regen.log

      # A stage that never ran cannot drift, so a truncated run would report a clean diff.
      # regenerate.py returns 1 on any stage failure and `set -o pipefail` surfaces that, but a
      # run cut short -- a timeout, a cancelled job -- can still reach the diff with stages
      # missing, so count them.
      - name: Assert every stage ran
        run: |
          n=$(grep -c '^\[' regen.log || true)
          echo "$n stage(s) ran"
          if [ "$n" -ne 9 ]; then
            echo "::error::$n of 9 stages appear in the log, so the regeneration was partial and"
            echo "the comparison below would be clean only for the stages that did run."
            grep '^\[' regen.log | sed 's/^/  /' || true
            exit 1
          fi

      # A failed fetch is a warning that returns None and leaves the run
      # at exit 0, so a network hiccup produces a quietly degraded
      # resolution that would show up below as drift. Comparing that
      # against the committed artifacts would report a problem that does
      # not exist, so stop instead.
      #
      # Reads regen.log rather than the old resolve.log: regenerate.py runs the resolve stage
      # with stream=True, so resolve_schema.py's warnings reach this log verbatim. That is not
      # incidental -- every OTHER stage is captured and printed only on failure, so a warning
      # from one of those would NOT appear here. Keep resolve streaming.
      - name: Refuse to compare a degraded run
        run: |
          if grep -q "WARNING: Failed to fetch" regen.log; then
            echo "::error::A referenced schema could not be fetched, so this"
            echo "resolution is incomplete and cannot be compared against the"
            echo "committed artifacts. This is an infrastructure failure, not"
            echo "drift. Re-run the job."
            echo
            grep "WARNING: Failed to fetch" regen.log | sed 's/^/  /'
            exit 1
          fi
          echo "All referenced schemas resolved."

      - name: Report drift
        run: |
          # Scoped to _sources: build/ is regenerated and committed by
          # the postprocess workflow, so it is expected to lag here.
          if git diff --quiet -- _sources; then
            echo "Generated schemas match their sources."
            exit 0
          fi

          echo "::error::Generated schemas are stale. Either a source was edited without regenerating what is built from it, or a referenced upstream block has changed."
          echo
          echo "Files that regeneration changed:"
          git diff --name-only -- _sources | sed 's/^/  /'
          echo
          echo "To fix, from the repo root:"
          echo "  git submodule update --init --checkout tapp   # --checkout is required"
          echo "  python tools/regenerate.py"
          echo "then commit the result."
          echo
          echo "Use regenerate.py, not the individual tools: the stages are a dependency chain"
          echo "and running them out of order fails silently. For one technique,"
          echo "regenerate.py --tapp <TAPP> still runs the shared stages first -- but do NOT"
          echo "call a stage tool directly for one technique, which produces a poorer result"
          echo "than the same stage inside regenerate.py."
          echo
          echo "If the files listed are under STEM or EBSD, stop. Those blocks are SOURCE-DERIVED"
          echo "and a regeneration cannot reinvent protocol constants read out of method"
          echo "descriptions and instrument exports. Read the .provenance.md beside the example"
          echo "before committing anything."
          echo
          echo "Note: parameterValues and parameterTemplates reformat"
          echo "wholesale on any regeneration. If you only meant to touch"
          echo "one technique, git checkout those two afterwards."
          echo
          echo "===== full diff ====="
          # Untruncated on purpose. A reviewer reading this log is
          # deciding whether the drift is a forgotten regeneration or an
          # upstream change, and the file list alone cannot tell those
          # apart.
          git --no-pager diff -- _sources
          exit 1

      # Counts what the resolved schemas CONSTRAIN and compares that to
      # docs/constraint_census.json. The drift check above compares bytes,
      # which catches a forgotten regeneration but says nothing about
      # whether a regeneration LOST a constraint -- and dropping a
      # constraint only makes a schema more permissive, so
      # validate_examples stays green through it. Twice has.
      #
      # Runs here rather than as its own required check: adding a required
      # context is the thing that deadlocks PRs when it does not report,
      # and this needs no separate signal. It also runs AFTER regeneration,
      # so it censuses what the sources actually produce, not what happens
      # to be committed.
      - name: Constraint census
        run: python tools/constraint_census.py

      # The census above catches a constraint vanishing from the schema. This catches the other
      # shape: a constraint still present that no longer BITES, because a conditional stopped
      # matching, a branch moved to an anyOf where it constrains nothing, or a $ref now resolves
      # somewhere more permissive. Each case mutates a real example and requires the result to be
      # REJECTED, for a named reason -- validate_examples can only prove the opposite direction.
      #
      # A SHACL shape whose SPARQLTarget selects NO focus node reports CONFORMANCE -- not
      # "skipped", not "0 of 0" -- so it is indistinguishable from a shape that ran and found
      # nothing wrong. Every technique profile was in that state until 2026-10-16: the targets
      # matched `schema:additionalType "dcat:CatalogRecord"` as a string literal while records and
      # all 111 examples carry `{"@id": "dcat:CatalogRecord"}`, an IRI, which in SPARQL never
      # equals a literal of the same spelling. 35 shapes selected nothing, and the OGC postprocess
      # ran them and recorded SHACL as a passing test item the whole time.
      #
      # The lint is text-only and needs no dependency, which is why it can live in a required
      # check: neither rdflib nor pyshacl is pinned in requirements.txt. The stronger form,
      # `--execute`, actually runs each target against its examples and needs rdflib; run it
      # locally when touching shapes.
      #
      # Here rather than its own required check, for the same reason as the census and the
      # counterexamples: no separate signal is needed.
      - name: SHACL targets can select
        run: python tools/check_shacl_targets.py

      # Here rather than its own required check, for the same reason as the census: no separate
      # signal is needed, and a required context that fails to report deadlocks the PR.
      - name: Counterexamples still rejected
        run: python tools/validate_counterexamples.py

      # Structural completeness of every building block: required files present,
      # schema.yaml in agreement with its *Schema.json, SHACL shapes covering the
      # schema's properties, examples covering them. Until 2026-10-16 nothing in
      # CI ran this audit, and the audit itself printed "246 passed, 5 failed"
      # and exited 0 -- so six checks reported into a shell that ignored them.
      # docs/SILENT_SUCCESS.md section 9 has the measurement.
      #
      # Here rather than as its own required check, for the same reason as the two
      # steps above. It is in a REQUIRED workflow deliberately: "Check examples
      # validate" is not required, and a red non-required check does not delay
      # auto-merge at all (section 4).
      #
      # --checks omits `resolved` and `examples` on purpose, and the omission
      # costs no signal:
      #
      #   * Measured on main at a1cb6fbdb8, the full six-check audit and this
      #     four-check subset report the SAME five failures -- 246 passed, 5
      #     failed either way. The two omitted checks contribute nothing today.
      #   * They are also the slow ones: timed on the same tree, the subset takes
      #     13.6s and the full six-check audit 11m25s. Section 3 is about a
      #     safeguard too slow to be used.
      #   * And both duplicate a check that already exists, more strictly.
      #     `resolved` compares only the TOP-LEVEL property keys of a fresh
      #     resolution against the committed resolvedSchema.json; the step above
      #     regenerates all nine stages and byte-diffs the result. `examples`
      #     validates example*.json against resolvedSchema.json, which is
      #     tools/validate_examples.py, run by check-examples.yml.
      #
      # Re-add them here if either stops being covered elsewhere. The baseline
      # records which checks wrote it, so the audit itself reports a run narrower
      # than its manifest rather than silently reading absence as success.
      - name: Building block audit
        run: python tools/audit_building_blocks.py --checks files,schema-json,shacl,coverage

      # Only reachable when the diff is clean, so this catches the other
      # half: a generated file that regeneration does not produce at all.
      - name: Check for untracked generated files
        run: |
          UNTRACKED=$(git ls-files --others --exclude-standard -- _sources)
          if [ -n "$UNTRACKED" ]; then
            echo "::error::Regeneration produced files that are not committed."
            echo "$UNTRACKED" | sed 's/^/  /'
            exit 1
          fi
          echo "No untracked generated files."
