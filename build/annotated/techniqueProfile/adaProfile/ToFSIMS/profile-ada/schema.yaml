$schema: https://json-schema.org/draft/2020-12/schema
title: ADA ToF-SIMS Product Profile
description: Technique-specific profile for Time-of-Flight Secondary Ion Mass Spectrometry
  (ToF-SIMS) products. Extends the base ADA product profile with constraints on valid
  ToF-SIMS component types.
allOf:
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/adaProduct/schema.yaml
- type: object
  properties:
    schema:additionalType:
      description: Must include a ToF-SIMS product type identifier.
      contains:
        enum:
        - Time-of-flight secondary ion mass spectrometry (TOFSIMS)
        - Time-of-Flight Secondary Ion Mass Spectrometry
        - Time-of-Flight Secondary Ion Mass Spectrometer
      x-jsonld-id: http://schema.org/additionalType
    schema:distribution:
      description: Distribution items for adaToFSIMS. Archive hasPart items must have
        ada:componentType from technique-specific or universal values.
      type: array
      items:
        type: object
        properties:
          schema:hasPart:
            items:
              type: object
              anyOf:
              - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/adaProduct/schema.yaml#/$defs/universalComponentTypeBranch
              - properties:
                  ada:componentType:
                    type: string
                    enum:
                    - ada:TOFSIMSCollection
                    - ada:peaks
                required:
                - ada:componentType
            x-jsonld-id: http://schema.org/hasPart
      x-jsonld-id: http://schema.org/distribution
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            required:
            - '@id'
            additionalProperties: false
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaToFSIMS
          x-jsonld-id: http://purl.org/dc/terms/conformsTo
      x-jsonld-id: http://schema.org/subjectOf
x-jsonld-prefixes:
  schema: http://schema.org/
  ada: https://ada.astromat.org/metadata/
  cdi: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/
  csvw: http://www.w3.org/ns/csvw#
  prov: http://www.w3.org/ns/prov#
  spdx: http://spdx.org/rdf/terms#
  nxs: https://manual.nexusformat.org/classes/
  dcterms: http://purl.org/dc/terms/
  geosparql: http://www.opengis.net/ont/geosparql#
