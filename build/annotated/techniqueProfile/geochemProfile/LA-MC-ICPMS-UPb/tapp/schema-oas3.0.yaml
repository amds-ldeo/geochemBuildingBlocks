                      schema:valueName:
                        enum:
                        - instrumentSerialNumberOrLabIdentifierDefault
                      schema:name:
                        enum:
                        - Instrument Serial Number or Lab Identifier
                      ada:dataType:
                        enum:
                        - string
                      ada:fieldScope:
                        enum:
                        - session
                      schema:readonlyValue: {}
