                        description: 'Method used to calibrate the relative gain (amplification
                          factor) of each Faraday cup amplifier at the start of or
                          during each analytical session. Relative gain differences
                          between amplifiers cause systematic errors in isotope ratios
                          if uncorrected. Common approaches: instrument internal gain
                          calibration routine (measures signal in each cup sequentially
                          using a common beam), amplifier rotation procedure, or measurement
                          of a known isotope ratio solution in each cup. For instruments
                          with SEM detectors, also describes the SEM-to-Faraday cross-calibration
                          sequence. Specify frequency (per session, per block, weekly).'
                        type: object
