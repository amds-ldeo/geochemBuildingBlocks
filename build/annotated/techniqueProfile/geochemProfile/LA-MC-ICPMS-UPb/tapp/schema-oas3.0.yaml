                          using a common beam), amplifier rotation procedure, or measurement
                          of a known isotope ratio solution in each cup. For instruments
                          with SEM detectors, also describes the SEM-to-Faraday cross-calibration
                          sequence. Specify frequency (per session, per block, weekly).'
                        type: object
                        properties:
                          '@id':
                            enum:
                            - ada:parameter/laMcicpmsUPbTAPP/faradayCupGainCalibrationMethod
                          '@type':
                            enum:
                            - - schema:PropertyValue
                          schema:propertyID:
                            enum:
                            - - '@id': ada:parameter/laMcicpmsUPbTAPP/faradayCupGainCalibrationMethod
                          schema:name:
                            enum:
                            - Faraday Cup Gain Calibration Method
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                      minContains: 0
                      maxContains: 1
                    - contains:
                        title: Signal Smoothing
                        description: 'Description of any signal smoothing device or
                          approach installed between the ablation cell and the ICP-MS
                          to reduce pulse-to-pulse signal variability. Note: active
                          signal smoothing devices (e.g., squid, SCFAST) are generally
                          incompatible with high-resolution raster mapping because
                          they degrade spatial resolution by mixing aerosol from successive
                          laser shots. For mapping analyses, report "None" explicitly.'
                        type: object
                        properties:
                          '@id':
                            enum:
                            - ada:parameter/laMcicpmsUPbTAPP/signalSmoothingDefault
                          '@type':
                            enum:
                            - - schema:PropertyValueSpecification
                          schema:valueName:
                            enum:
                            - signalSmoothingDefault
                          schema:name:
                            enum:
                            - Signal Smoothing
                          ada:dataType:
                            enum:
                            - string
                          ada:fieldScope:
                            enum:
                            - session
                          schema:readonlyValue: {}
                          ada:tier:
                            enum:
                            - R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      minContains: 0
                      maxContains: 1
                    - contains:
                        title: Peak Flatness Method and Threshold
                        description: 'Method used to verify that every collector sits
                          on a flat region of its peak top simultaneously, and the
                          acceptance threshold applied before analysis begins. Specific
                          to simultaneous collection: a sequential instrument centres
                          one mass at a time, whereas a multi-collector array must
                          have all cups on flat peak tops at once or the measured
                          ratio carries a peak-shape bias that no downstream correction
                          removes. Typically assessed by scanning across the peak
                          plateau, or by comparing ratios measured at slightly offset
                          mass positions.'
                        type: object
                        properties:
                          '@id':
                            enum:
                            - ada:parameter/laMcicpmsUPbTAPP/peakFlatnessMethodAndThreshold
                          '@type':
                            enum:
                            - - schema:PropertyValue
                          schema:propertyID:
                            enum:
                            - - '@id': ada:parameter/laMcicpmsUPbTAPP/peakFlatnessMethodAndThreshold
                          schema:name:
                            enum:
                            - Peak Flatness Method and Threshold
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                      minContains: 0
                      maxContains: 1
                    - contains:
                        title: Spike / Outlier Filtering Approach
                        description: Method used to identify and remove anomalous
                          signal spikes arising from micronuggets, inclusions, cracks,
                          or instrument artifacts during time-resolved signal processing.
                          Editable because the specific implementation may vary between
                          sessions while remaining within the procedure framework.
                        type: object
                        properties:
                          '@id':
                            enum:
                            - ada:parameter/laMcicpmsUPbTAPP/spikeOutlierFilteringApproachDefault
                          '@type':
                            enum:
                            - - schema:PropertyValueSpecification
                          schema:valueName:
                            enum:
                            - spikeOutlierFilteringApproachDefault
                          schema:name:
                            enum:
                            - Spike / Outlier Filtering Approach
                          ada:dataType:
                            enum:
                            - string
                          ada:fieldScope:
                            enum:
                            - session
                          schema:readonlyValue: {}
                          ada:tier:
                            enum:
                            - R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      minContains: 0
                      maxContains: 1
                    - contains:
                        title: Isotope Dilution Data Reduction Method
                        description: Mass balance approach used to calculate sample
                          mass fractions from spike-sample isotope ratio measurements
                          in isotope dilution (ID) analysis. Record 'None' if isotope
                          dilution is not used.
                        type: object
                        properties:
                          '@id':
                            enum:
                            - ada:parameter/laMcicpmsUPbTAPP/isotopeDilutionDataReductionMethod
                          '@type':
                            enum:
                            - - schema:PropertyValue
                          schema:propertyID:
                            enum:
                            - - '@id': ada:parameter/laMcicpmsUPbTAPP/isotopeDilutionDataReductionMethod
                          schema:name:
                            enum:
                            - Isotope Dilution Data Reduction Method
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                      minContains: 0
                      maxContains: 1
                    - contains:
                        title: Calibration Factor and Determination Method
                        description: 'An externally-calibrated factor that converts
                          the measured quantity into the reported quantity, how it
                          was determined, and its uncertainty. Applies where the conversion
                          depends on a factor calibrated against a reference of independently
                          known value, rather than on the instrument response alone.
                          Distinct from the fields that name the calibration material
                          and that state which approach applies to which analyte,
                          where the technique has them: this field records the resulting
                          factor itself.'
                        type: object
                        properties:
                          '@id':
                            enum:
                            - ada:parameter/laMcicpmsUPbTAPP/calibrationFactorAndDeterminationMethodDefault
                          '@type':
                            enum:
                            - - schema:PropertyValueSpecification
                          schema:valueName:
                            enum:
                            - calibrationFactorAndDeterminationMethodDefault
                          schema:name:
                            enum:
                            - Calibration Factor and Determination Method
                          ada:dataType:
                            enum:
                            - string
                          ada:fieldScope:
                            enum:
                            - session
                          schema:readonlyValue: {}
                          ada:tier:
                            enum:
                            - R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      minContains: 0
                      maxContains: 1
                    - contains:
                        title: Analysis Inclusion and Rejection Criteria
                        description: 'The rules determining which individual analyses
                          contribute to a reported aggregate result, together with
                          the outcome of applying them: how many analyses were acquired,
                          how many were included, and on what grounds any were excluded.
                          Distinct from within-analysis outlier filtering, which removes
                          anomalous points inside a single analysis: this field decides
                          which whole analyses enter the reported value. Criteria
                          and outcome are combined in one field because neither is
                          interpretable without the other, following the precision/accuracy
                          precedent.'
                        type: object
                        properties:
                          '@id':
                            enum:
                            - ada:parameter/laMcicpmsUPbTAPP/analysisInclusionAndRejectionCriteria
                          '@type':
                            enum:
                            - - schema:PropertyValue
                          schema:propertyID:
                            enum:
                            - - '@id': ada:parameter/laMcicpmsUPbTAPP/analysisInclusionAndRejectionCriteria
                          schema:name:
                            enum:
                            - Analysis Inclusion and Rejection Criteria
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                      minContains: 0
                      maxContains: 1
                    - contains:
                        title: Double-Spike Inversion Algorithm
                        description: 'Mathematical algorithm used to simultaneously
                          solve for the true sample isotope ratio and the mass fractionation
                          factor from the measured spike-sample mixture. Common implementations:
                          iterative Newton-Raphson solution, matrix algebraic approach,
                          or published software (e.g., Rudge et al. 2009 Double Spike
                          Toolbox). Specify the algorithm or software reference and
                          version. Record ''N/A'' if double-spike method is not used.
                          Record ''N/A'' where the procedure does not use a double
                          spike.'
                        type: object
                        properties:
                          '@id':
                            enum:
                            - ada:parameter/laMcicpmsUPbTAPP/doubleSpikeInversionAlgorithm
                          '@type':
                            enum:
                            - - schema:PropertyValue
                          schema:propertyID:
                            enum:
                            - - '@id': ada:parameter/laMcicpmsUPbTAPP/doubleSpikeInversionAlgorithm
                          schema:name:
                            enum:
                            - Double-Spike Inversion Algorithm
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                      minContains: 0
                      maxContains: 1
                    - contains:
                        title: Intermediate Daughter Disequilibrium Correction
                        description: "Correction for initial disequilibrium in intermediate
                          daughter products of the U decay chains \u2014 principally
                          230Th, and where relevant 231Pa \u2014 together with the
                          Th/U or Pa/U partitioning value assumed and its source.
                          Unique to U-Pb among dating systems, because the chains
                          are long enough for intermediate-daughter disequilibrium
                          at crystallisation to bias the 206Pb/238U date, most severely
                          in young samples. Record 'None' with a justification where
                          no correction was applied. Condon et al. (2024) write \"we
                          recommend these dates be reported corrected for initial
                          230Th and 231Pa daughter isotope disequilibrium\" \u2014
                          recommended rather than required, hence Advanced."
                        type: object
                        properties:
                          '@id':
                            enum:
                            - ada:parameter/laMcicpmsUPbTAPP/intermediateDaughterDisequilibriumCorrection
                          '@type':
                            enum:
                            - - schema:PropertyValue
                          schema:propertyID:
                            enum:
                            - - '@id': ada:parameter/laMcicpmsUPbTAPP/intermediateDaughterDisequilibriumCorrection
                          schema:name:
                            enum:
                            - Intermediate Daughter Disequilibrium Correction
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                      minContains: 0
                      maxContains: 1
                    - contains:
                        title: Constants and Reference Values Used
                        description: Physical constants and reference values used
                          in data reduction to calculate the final reported quantity
                          (e.g., decay constants for age calculation, standard isotope
                          ratios, or other citable reference values used in a correction
                          or calculation), together with their source. Distinct from
                          the Group 6 reference-material fields, which document accepted
                          values for specific calibration/validation materials rather
                          than universal physical constants. Record "None" if no citable,
                          revisable physical constants feed into this procedure's
                          data reduction.
                        type: object
                        properties:
                          '@id':
                            enum:
                            - ada:parameter/laMcicpmsUPbTAPP/constantsAndReferenceValuesUsedDefault
                          '@type':
                            enum:
                            - - schema:PropertyValueSpecification
                          schema:valueName:
                            enum:
                            - constantsAndReferenceValuesUsedDefault
                          schema:name:
                            enum:
                            - Constants and Reference Values Used
                          ada:dataType:
                            enum:
                            - string
                          ada:fieldScope:
                            enum:
                            - session
                          schema:readonlyValue: {}
                          ada:tier:
                            enum:
                            - R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      minContains: 0
                      maxContains: 1
                    - contains:
                        title: Pulse/Analog Detector Nonlinearity Correction
                        description: ''
                        type: object
                        properties:
                          '@id':
                            enum:
                            - ada:parameter/laMcicpmsUPbTAPP/pulseAnalogDetectorNonlinearityCorrection
                          '@type':
                            enum:
                            - - schema:PropertyValueSpecification
                          schema:valueName:
                            enum:
                            - pulseAnalogDetectorNonlinearityCorrection
                          schema:name:
                            enum:
                            - Pulse/Analog Detector Nonlinearity Correction
                          ada:dataType:
                            enum:
                            - string
                          ada:fieldScope:
                            enum:
                            - session
                          schema:readonlyValue:
                            enum:
                            - true
                          ada:tier:
                            enum:
                            - R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                        readOnly: true
                      minContains: 0
                      maxContains: 1
                    - contains:
                        title: Normalization/Standards-Based Correction
                        description: ''
                        type: object
                        properties:
                          '@id':
                            enum:
                            - ada:parameter/laMcicpmsUPbTAPP/normalizationStandardsBasedCorrection
                          '@type':
                            enum:
                            - - schema:PropertyValueSpecification
                          schema:valueName:
                            enum:
                            - normalizationStandardsBasedCorrection
                          schema:name:
                            enum:
                            - Normalization/Standards-Based Correction
                          ada:dataType:
                            enum:
                            - string
                          ada:fieldScope:
                            enum:
                            - session
                          schema:readonlyValue:
                            enum:
                            - true
                          ada:tier:
                            enum:
                            - R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                        readOnly: true
                      minContains: 0
                      maxContains: 1
          allOf:
          - contains:
              properties:
                schema:name:
                  enum:
                  - Sample preparation
              required:
              - schema:name
          - contains:
              properties:
                schema:name:
                  enum:
                  - Data acquisition
              required:
              - schema:name
          - contains:
              properties:
                schema:name:
                  enum:
                  - Data reduction
              required:
              - schema:name
    ada:targetSelectionCriteriaDefault:
      description: "The rules governing which part of the sample is analysed, and
        why. Covers the criteria applied when choosing grains, aliquots, spots, or
        a region of interest \u2014 size, morphology, clarity, freedom from inclusions
        or alteration, phase identity, or spatial position. Distinct from Target Material,
        which states the material type the procedure is designed for: this field states
        how, within such a sample, the analysed portion is picked out."
      type: string
    schema:additionalProperty:
      type: array
      items:
        anyOf:
        - title: Pre-Analysis Imaging and Screening
          description: Imaging or other characterisation performed before the measurement
            in order to select or locate the analysed target, including the technique,
            instrument and settings used, and how individual analyses are linked back
            to the images. Distinct from any imaging the procedure performs as its
            own measurement. Where the imaging is performed on a separate instrument,
            it should also be recorded in the Group 1 coupling fields.
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/preAnalysisImagingAndScreeningDefault
            '@type':
              enum:
              - - schema:PropertyValueSpecification
            schema:valueName:
              enum:
              - preAnalysisImagingAndScreeningDefault
            schema:name:
              enum:
              - Pre-Analysis Imaging and Screening
            ada:dataType:
              enum:
              - string
            ada:fieldScope:
              enum:
              - session
            schema:readonlyValue: {}
            ada:tier:
              enum:
              - R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Transect Rate, Mapping Rate or Step Size
          description: "For continuous line scan (transect) and raster mapping: the
            stage translation speed in \xB5m s\u207B\xB9. This is the procedure-level
            parameter that, together with spot size and repetition rate, determines
            spatial resolution along the scan direction. For mapping, the mapping
            rate (mm\xB2 h\u207B\xB9) may be reported as an alternative when scan
            speed is session-variable. For stepped line profiles: the distance between
            successive spot positions in \xB5m."
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/transectRateMappingRateOrStepSizeDefault
            '@type':
              enum:
              - - schema:PropertyValueSpecification
            schema:valueName:
              enum:
              - transectRateMappingRateOrStepSizeDefault
            schema:name:
              enum:
              - Transect Rate, Mapping Rate or Step Size
            ada:dataType:
              enum:
              - string
            ada:fieldScope:
              enum:
              - session
            schema:readonlyValue: {}
            ada:tier:
              enum:
              - R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Plasma / Make-up Gas Addition
          description: "Additional gas(es) mixed into the carrier stream downstream
            of the ablation cell, with the procedure-registered target flow rate.
            Ar make-up gas is standard. Small N\u2082 additions can enhance sensitivity
            for some elements. If N\u2082 is not added, state \"None\" explicitly
            to distinguish from not reported."
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/plasmaMakeUpGasAdditionDefault
            '@type':
              enum:
              - - schema:PropertyValueSpecification
            schema:valueName:
              enum:
              - plasmaMakeUpGasAdditionDefault
            schema:name:
              enum:
              - Plasma / Make-up Gas Addition
            ada:dataType:
              enum:
              - string
            ada:fieldScope:
              enum:
              - session
            schema:readonlyValue: {}
            ada:tier:
              enum:
              - R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Instrument Warm-up / Session Duration Limit
          description: Minimum warm-up time required after plasma ignition before
            analyses begin, and any maximum session duration enforced to maintain
            stable operating conditions. These constraints are part of the procedure
            and cannot be varied by the analyst.
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/instrumentWarmUpSessionDurationLimit
            '@type':
              enum:
              - - schema:PropertyValue
            schema:propertyID:
              enum:
              - - '@id': ada:parameter/laMcicpmsUPbTAPP/instrumentWarmUpSessionDurationLimit
            schema:name:
              enum:
              - Instrument Warm-up / Session Duration Limit
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: Multi-Run Sequential Analysis Design
          description: Whether the procedure uses a single acquisition pass or multiple
            sequential runs on the same sample location, each optimized for different
            analytical objectives. For multi-run designs, describe the number of runs,
            their purpose, key laser and instrument settings per run, and how outputs
            of one run feed into data reduction of another. Not applicable to raster
            mapping, where each spatial location is visited exactly once.
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/multiRunSequentialAnalysisDesign
            '@type':
              enum:
              - - schema:PropertyValue
            schema:propertyID:
              enum:
              - - '@id': ada:parameter/laMcicpmsUPbTAPP/multiRunSequentialAnalysisDesign
            schema:name:
              enum:
              - Multi-Run Sequential Analysis Design
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: Number of Blocks per Measurement
          description: Number of measurement blocks acquired per sample or standard
            solution introduction. In MC-ICP-MS, data are structured as blocks of
            cycles; each block typically begins with a baseline (on-peak zero) measurement
            before the analytical cycles. Multiple blocks per sample allow inspection
            of signal stability and within-measurement drift. Procedure specifies
            the standard number; analyst may adjust for samples with low signal or
            for high-precision requirements.
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/numberOfBlocksPerMeasurementDefault
            '@type':
              enum:
              - - schema:PropertyValueSpecification
            schema:valueName:
              enum:
              - numberOfBlocksPerMeasurementDefault
            schema:name:
              enum:
              - Number of Blocks per Measurement
            ada:dataType:
              enum:
              - integer
            ada:fieldScope:
              enum:
              - session
            schema:readonlyValue: {}
            ada:tier:
              enum:
              - R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Number of Cycles per Block
          description: "Number of measurement cycles acquired per block. One cycle
            corresponds to a single set of simultaneous Faraday cup readings integrated
            for the duration specified in Integration Time per Cycle. Total integration
            time per sample = (Number of Cycles per Block) \xD7 (Integration Time
            per Cycle) \xD7 (Number of Blocks per Measurement). Procedure specifies
            the standard value; analyst may adjust within procedure bounds."
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/numberOfCyclesPerBlockDefault
            '@type':
              enum:
              - - schema:PropertyValueSpecification
            schema:valueName:
              enum:
              - numberOfCyclesPerBlockDefault
            schema:name:
              enum:
              - Number of Cycles per Block
            ada:dataType:
              enum:
              - integer
            ada:fieldScope:
              enum:
              - session
            schema:readonlyValue: {}
            ada:tier:
              enum:
              - R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Integration Time per Cycle
          description: "Duration of signal integration per measurement cycle (seconds).
            Determines counting statistics per cycle. Longer integration times improve
            shot-noise precision but increase the impact of signal drift within the
            integration window. For high-gain (10\xB9\xB2 or 10\xB9\xB3 \u03A9) amplifier
            channels, longer integration times are often required to accumulate sufficient
            charge. Procedure specifies the standard integration time; analyst may
            confirm or adjust within procedure bounds. Where different isotope channels
            use different integration schemes, record the time for each channel."
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/integrationTimePerCycleDefault
            '@type':
              enum:
              - - schema:PropertyValueSpecification
            schema:valueName:
              enum:
              - integrationTimePerCycleDefault
            schema:name:
              enum:
              - Integration Time per Cycle
            ada:dataType:
              enum:
              - number
            ada:fieldScope:
              enum:
              - session
            schema:readonlyValue: {}
            ada:tier:
              enum:
              - R
            schema:unitText:
              enum:
              - s
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Baseline Measurement Approach
          description: 'Method and timing for measuring the ion beam baseline (on-peak
            zero) during acquisition, and the portion of the acquisition it is taken
            from. Three approaches are in use and the choice depends on how sample
            reaches the plasma: deflecting the ion beam (beam-off or electrostatic
            deflector); aspirating an acid blank, which applies only to solution introduction;
            or, for laser ablation, collecting a defined number of laser-off cycles
            at the start of the same block, since no blank can be aspirated mid-ablation.
            State which, and how many cycles or how long.'
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/baselineMeasurementApproach
            '@type':
              enum:
              - - schema:PropertyValue
            schema:propertyID:
              enum:
              - - '@id': ada:parameter/laMcicpmsUPbTAPP/baselineMeasurementApproach
            schema:name:
              enum:
              - Baseline Measurement Approach
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: Uncertainty Propagation Method
          description: 'The approach used to propagate analytical uncertainty through
            the data reduction chain to the final reported value. State which sources
            are included in the propagation: counting statistics, calibration standard
            uncertainty, internal standard uncertainty, drift correction, and any
            systematic contributions. Distinct from Uncertainty Level, which states
            the convention at which the resulting uncertainty is quoted.'
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/uncertaintyPropagationMethodDefault
            '@type':
              enum:
              - - schema:PropertyValueSpecification
            schema:valueName:
              enum:
              - uncertaintyPropagationMethodDefault
            schema:name:
              enum:
              - Uncertainty Propagation Method
            ada:dataType:
              enum:
              - string
            ada:fieldScope:
              enum:
              - session
            schema:readonlyValue: {}
            ada:tier:
              enum:
              - R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Matrix Offset Correction (LIEF)
          description: Whether an empirical correction was applied to account for
            systematic differences in laser-induced elemental fractionation (LIEF)
            patterns between the external calibration standard and the sample matrix.
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/matrixOffsetCorrection
            '@type':
              enum:
              - - schema:PropertyValue
            schema:propertyID:
              enum:
              - - '@id': ada:parameter/laMcicpmsUPbTAPP/matrixOffsetCorrection
            schema:name:
              enum:
              - Matrix Offset Correction (LIEF)
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: Mass Fractionation Law
          description: "Mathematical law used to parameterize instrumental isotope
            mass fractionation as a function of mass difference. The exponential law
            (Mar\xE9chal et al. 1999) is most widely used and theoretically best justified
            for MC-ICP-MS. The linear law assumes fractionation proportional to mass
            difference. The power law is an alternative formulation. For double-spike
            procedures, the law is embedded in the inversion algorithm and must be
            consistent between spike calibration and sample data reduction."
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/massFractionationLaw
            '@type':
              enum:
              - - schema:PropertyValue
            schema:propertyID:
              enum:
              - - '@id': ada:parameter/laMcicpmsUPbTAPP/massFractionationLaw
            schema:name:
              enum:
              - Mass Fractionation Law
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: Double-Spike Isotope Pair
          description: The pair of enriched isotopes used to construct the double
            spike. Both isotopes must be naturally rare, free from isobaric interferences,
            and chosen to minimize error magnification in the inversion. The double
            spike composition must be accurately calibrated before use. Specify both
            isotope masses and the spike certificate or calibration reference. Record
            'N/A' if double-spike method is not used. Record 'N/A' where the procedure
            does not use a double spike.
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/doubleSpikeIsotopePair
            '@type':
              enum:
              - - schema:PropertyValue
            schema:propertyID:
              enum:
              - - '@id': ada:parameter/laMcicpmsUPbTAPP/doubleSpikeIsotopePair
            schema:name:
              enum:
              - Double-Spike Isotope Pair
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: Double-Spike Mixing Ratio
          description: "Target proportion of double-spike signal relative to total
            analyte signal in the spiked mixture, expressed as spike fraction (0\u20131)
            or spike:sample ratio. An optimal mixing ratio minimizes error propagation
            through the double-spike inversion; the optimum is analyte-system specific
            and is typically determined using the Double Spike Toolbox or equivalent.
            The achieved mixing ratio may deviate from the target within acceptable
            bounds (typically \xB120% of optimal); the double-spike inversion corrects
            for actual mixing ratios. Record 'N/A' if double-spike method is not used.
            Record 'N/A' where the procedure does not use a double spike."
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/doubleSpikeMixingRatioDefault
            '@type':
              enum:
              - - schema:PropertyValueSpecification
            schema:valueName:
              enum:
              - doubleSpikeMixingRatioDefault
            schema:name:
              enum:
              - Double-Spike Mixing Ratio
            ada:dataType:
              enum:
              - string
            ada:fieldScope:
              enum:
              - session
            schema:readonlyValue: {}
            ada:tier:
              enum:
              - R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Age Datum / Reference Epoch
          description: 'The zero point from which the reported age is measured, where
            this is not the present day, and the date it corresponds to. Record ''Present
            day'' where the conventional datum applies. Explicitly required wherever
            the datum is not the present: year of sample collection for luminescence
            (Mahan et al. 2023), end of irradiation for 40Ar/39Ar decay corrections
            (Schaen et al. 2021).'
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/ageDatumReferenceEpochDefault
            '@type':
              enum:
              - - schema:PropertyValueSpecification
            schema:valueName:
              enum:
              - ageDatumReferenceEpochDefault
            schema:name:
              enum:
              - Age Datum / Reference Epoch
            ada:dataType:
              enum:
              - string
            ada:fieldScope:
              enum:
              - session
            schema:readonlyValue: {}
            ada:tier:
              enum:
              - R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Discordance Definition and Values
          description: "How discordance between the 206Pb/238U, 207Pb/235U and 207Pb/206Pb
            chronometers is defined for this procedure, and the discordance values
            obtained. Several definitions are in circulation and they are not interchangeable,
            so the formula must be stated. Genuinely specific to U-Pb: it is the only
            system in routine use with two independent decay schemes in the same mineral,
            so agreement between them is an internal consistency test no other system
            can run. The rule for excluding discordant analyses, and how many were
            excluded, belong in Analysis Inclusion and Rejection Criteria. Condon
            et al. (2024) write that for samples older than a few hundred million
            years \"it is also useful to provide a measure of discordance\" \u2014
            useful and age-conditional rather than required, hence Advanced."
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/discordanceDefinitionAndValues
            '@type':
              enum:
              - - schema:PropertyValue
            schema:propertyID:
              enum:
              - - '@id': ada:parameter/laMcicpmsUPbTAPP/discordanceDefinitionAndValues
            schema:name:
              enum:
              - Discordance Definition and Values
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: Error Correlation Between Reported Quantities
          description: The correlation coefficient between pairs of reported quantities
            whose uncertainties are not independent, together with the pair it applies
            to and how it was obtained. Concordia and isochron regressions cannot
            be reconstructed without it.
