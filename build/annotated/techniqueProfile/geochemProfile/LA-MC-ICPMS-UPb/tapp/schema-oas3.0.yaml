      - contains:
          title: Pre-Analysis Imaging and Screening
          description: Imaging or other characterisation performed before the measurement
            in order to select or locate the analysed target, including the technique,
            instrument and settings used, and how individual analyses are linked back
            to the images. Distinct from any imaging the procedure performs as its
            own measurement. Where the imaging is performed on a separate instrument,
            it should also be recorded in the Group 1 coupling fields.
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/preAnalysisImagingAndScreeningDefault
            '@type':
              enum:
              - - schema:PropertyValueSpecification
            schema:valueName:
              enum:
              - preAnalysisImagingAndScreeningDefault
            schema:name:
              enum:
              - Pre-Analysis Imaging and Screening
            ada:dataType:
              enum:
              - string
            ada:fieldScope:
              enum:
              - session
            schema:readonlyValue: {}
            ada:tier:
              enum:
              - R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: Transect Rate, Mapping Rate or Step Size
          description: "For continuous line scan (transect) and raster mapping: the
            stage translation speed in \xB5m s\u207B\xB9. This is the procedure-level
            parameter that, together with spot size and repetition rate, determines
            spatial resolution along the scan direction. For mapping, the mapping
            rate (mm\xB2 h\u207B\xB9) may be reported as an alternative when scan
            speed is session-variable. For stepped line profiles: the distance between
            successive spot positions in \xB5m."
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/transectRateMappingRateOrStepSizeDefault
            '@type':
              enum:
              - - schema:PropertyValueSpecification
            schema:valueName:
              enum:
              - transectRateMappingRateOrStepSizeDefault
            schema:name:
              enum:
              - Transect Rate, Mapping Rate or Step Size
            ada:dataType:
              enum:
              - string
            ada:fieldScope:
              enum:
              - session
            schema:readonlyValue: {}
            ada:tier:
              enum:
              - R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: Plasma / Make-up Gas Addition
          description: "Additional gas(es) mixed into the carrier stream downstream
            of the ablation cell, with the procedure-registered target flow rate.
            Ar make-up gas is standard. Small N\u2082 additions can enhance sensitivity
            for some elements. If N\u2082 is not added, state \"None\" explicitly
            to distinguish from not reported."
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/plasmaMakeUpGasAdditionDefault
            '@type':
              enum:
              - - schema:PropertyValueSpecification
            schema:valueName:
              enum:
              - plasmaMakeUpGasAdditionDefault
            schema:name:
              enum:
              - Plasma / Make-up Gas Addition
            ada:dataType:
              enum:
              - string
            ada:fieldScope:
              enum:
              - session
            schema:readonlyValue: {}
            ada:tier:
              enum:
              - R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: Instrument Warm-up / Session Duration Limit
          description: Minimum warm-up time required after plasma ignition before
            analyses begin, and any maximum session duration enforced to maintain
            stable operating conditions. These constraints are part of the procedure
            and cannot be varied by the analyst.
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/instrumentWarmUpSessionDurationLimit
            '@type':
              enum:
              - - schema:PropertyValue
            schema:propertyID:
              enum:
              - - '@id': ada:parameter/laMcicpmsUPbTAPP/instrumentWarmUpSessionDurationLimit
            schema:name:
              enum:
              - Instrument Warm-up / Session Duration Limit
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: Multi-Run Sequential Analysis Design
          description: Whether the procedure uses a single acquisition pass or multiple
            sequential runs on the same sample location, each optimized for different
            analytical objectives. For multi-run designs, describe the number of runs,
            their purpose, key laser and instrument settings per run, and how outputs
            of one run feed into data reduction of another. Not applicable to raster
            mapping, where each spatial location is visited exactly once.
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/multiRunSequentialAnalysisDesign
            '@type':
              enum:
              - - schema:PropertyValue
            schema:propertyID:
              enum:
              - - '@id': ada:parameter/laMcicpmsUPbTAPP/multiRunSequentialAnalysisDesign
            schema:name:
              enum:
              - Multi-Run Sequential Analysis Design
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: Number of Blocks per Measurement
          description: Number of measurement blocks acquired per sample or standard
            solution introduction. In MC-ICP-MS, data are structured as blocks of
            cycles; each block typically begins with a baseline (on-peak zero) measurement
            before the analytical cycles. Multiple blocks per sample allow inspection
            of signal stability and within-measurement drift. Procedure specifies
            the standard number; analyst may adjust for samples with low signal or
            for high-precision requirements.
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/numberOfBlocksPerMeasurementDefault
            '@type':
              enum:
              - - schema:PropertyValueSpecification
            schema:valueName:
              enum:
              - numberOfBlocksPerMeasurementDefault
            schema:name:
              enum:
              - Number of Blocks per Measurement
            ada:dataType:
              enum:
              - integer
            ada:fieldScope:
              enum:
              - session
            schema:readonlyValue: {}
            ada:tier:
              enum:
              - R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: Number of Cycles per Block
          description: "Number of measurement cycles acquired per block. One cycle
            corresponds to a single set of simultaneous Faraday cup readings integrated
            for the duration specified in Integration Time per Cycle. Total integration
            time per sample = (Number of Cycles per Block) \xD7 (Integration Time
            per Cycle) \xD7 (Number of Blocks per Measurement). Procedure specifies
            the standard value; analyst may adjust within procedure bounds."
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/numberOfCyclesPerBlockDefault
            '@type':
              enum:
              - - schema:PropertyValueSpecification
            schema:valueName:
              enum:
              - numberOfCyclesPerBlockDefault
            schema:name:
              enum:
              - Number of Cycles per Block
            ada:dataType:
              enum:
              - integer
            ada:fieldScope:
              enum:
              - session
            schema:readonlyValue: {}
            ada:tier:
              enum:
              - R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: Integration Time per Cycle
          description: "Duration of signal integration per measurement cycle (seconds).
            Determines counting statistics per cycle. Longer integration times improve
            shot-noise precision but increase the impact of signal drift within the
            integration window. For high-gain (10\xB9\xB2 or 10\xB9\xB3 \u03A9) amplifier
            channels, longer integration times are often required to accumulate sufficient
            charge. Procedure specifies the standard integration time; analyst may
            confirm or adjust within procedure bounds. Where different isotope channels
            use different integration schemes, record the time for each channel."
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/integrationTimePerCycleDefault
            '@type':
              enum:
              - - schema:PropertyValueSpecification
            schema:valueName:
              enum:
              - integrationTimePerCycleDefault
            schema:name:
              enum:
              - Integration Time per Cycle
            ada:dataType:
              enum:
              - number
            ada:fieldScope:
              enum:
              - session
            schema:readonlyValue: {}
            ada:tier:
              enum:
              - R
            schema:unitText:
              enum:
              - s
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: Baseline Measurement Approach
          description: 'Method and timing for measuring the ion beam baseline (on-peak
            zero) during acquisition, and the portion of the acquisition it is taken
            from. Three approaches are in use and the choice depends on how sample
            reaches the plasma: deflecting the ion beam (beam-off or electrostatic
            deflector); aspirating an acid blank, which applies only to solution introduction;
            or, for laser ablation, collecting a defined number of laser-off cycles
            at the start of the same block, since no blank can be aspirated mid-ablation.
            State which, and how many cycles or how long.'
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/baselineMeasurementApproach
            '@type':
              enum:
              - - schema:PropertyValue
            schema:propertyID:
              enum:
              - - '@id': ada:parameter/laMcicpmsUPbTAPP/baselineMeasurementApproach
            schema:name:
              enum:
              - Baseline Measurement Approach
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: Uncertainty Propagation Method
          description: 'The approach used to propagate analytical uncertainty through
            the data reduction chain to the final reported value. State which sources
            are included in the propagation: counting statistics, calibration standard
            uncertainty, internal standard uncertainty, drift correction, and any
            systematic contributions. Distinct from Uncertainty Level, which states
            the convention at which the resulting uncertainty is quoted.'
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/uncertaintyPropagationMethodDefault
            '@type':
              enum:
              - - schema:PropertyValueSpecification
            schema:valueName:
              enum:
              - uncertaintyPropagationMethodDefault
            schema:name:
              enum:
              - Uncertainty Propagation Method
            ada:dataType:
              enum:
              - string
            ada:fieldScope:
              enum:
              - session
            schema:readonlyValue: {}
            ada:tier:
              enum:
              - R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: Matrix Offset Correction (LIEF)
          description: Whether an empirical correction was applied to account for
            systematic differences in laser-induced elemental fractionation (LIEF)
            patterns between the external calibration standard and the sample matrix.
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/matrixOffsetCorrection
            '@type':
              enum:
              - - schema:PropertyValue
            schema:propertyID:
              enum:
              - - '@id': ada:parameter/laMcicpmsUPbTAPP/matrixOffsetCorrection
            schema:name:
              enum:
              - Matrix Offset Correction (LIEF)
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: Mass Fractionation Law
          description: "Mathematical law used to parameterize instrumental isotope
            mass fractionation as a function of mass difference. The exponential law
            (Mar\xE9chal et al. 1999) is most widely used and theoretically best justified
            for MC-ICP-MS. The linear law assumes fractionation proportional to mass
            difference. The power law is an alternative formulation. For double-spike
            procedures, the law is embedded in the inversion algorithm and must be
            consistent between spike calibration and sample data reduction."
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/massFractionationLaw
            '@type':
              enum:
              - - schema:PropertyValue
            schema:propertyID:
              enum:
              - - '@id': ada:parameter/laMcicpmsUPbTAPP/massFractionationLaw
            schema:name:
              enum:
              - Mass Fractionation Law
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: Double-Spike Isotope Pair
          description: The pair of enriched isotopes used to construct the double
            spike. Both isotopes must be naturally rare, free from isobaric interferences,
            and chosen to minimize error magnification in the inversion. The double
            spike composition must be accurately calibrated before use. Specify both
            isotope masses and the spike certificate or calibration reference. Record
            'N/A' if double-spike method is not used. Record 'N/A' where the procedure
            does not use a double spike.
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/doubleSpikeIsotopePair
            '@type':
              enum:
              - - schema:PropertyValue
            schema:propertyID:
              enum:
              - - '@id': ada:parameter/laMcicpmsUPbTAPP/doubleSpikeIsotopePair
            schema:name:
              enum:
              - Double-Spike Isotope Pair
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: Double-Spike Mixing Ratio
          description: "Target proportion of double-spike signal relative to total
            analyte signal in the spiked mixture, expressed as spike fraction (0\u20131)
            or spike:sample ratio. An optimal mixing ratio minimizes error propagation
            through the double-spike inversion; the optimum is analyte-system specific
            and is typically determined using the Double Spike Toolbox or equivalent.
            The achieved mixing ratio may deviate from the target within acceptable
            bounds (typically \xB120% of optimal); the double-spike inversion corrects
            for actual mixing ratios. Record 'N/A' if double-spike method is not used.
            Record 'N/A' where the procedure does not use a double spike."
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/doubleSpikeMixingRatioDefault
            '@type':
              enum:
              - - schema:PropertyValueSpecification
            schema:valueName:
              enum:
              - doubleSpikeMixingRatioDefault
            schema:name:
              enum:
              - Double-Spike Mixing Ratio
            ada:dataType:
              enum:
              - string
            ada:fieldScope:
              enum:
              - session
            schema:readonlyValue: {}
            ada:tier:
              enum:
              - R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: Age Datum / Reference Epoch
          description: 'The zero point from which the reported age is measured, where
            this is not the present day, and the date it corresponds to. Record ''Present
            day'' where the conventional datum applies. Explicitly required wherever
            the datum is not the present: year of sample collection for luminescence
            (Mahan et al. 2023), end of irradiation for 40Ar/39Ar decay corrections
            (Schaen et al. 2021).'
          type: object
          properties:
            '@id':
              enum:
              - ada:parameter/laMcicpmsUPbTAPP/ageDatumReferenceEpochDefault
            '@type':
