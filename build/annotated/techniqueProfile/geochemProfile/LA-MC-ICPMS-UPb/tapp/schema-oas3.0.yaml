x-defs:
  ogch.BaseSchema.tappDefinition:
    title: Technique-Aligned Protocol Profile (TAPP) Definition v3
    description: "A registered Technique-Aligned Protocol Profile (TAPP) definition
      modeled as a PLAN \u2014 prov:Plan / bios:LabProtocol (also cdi:Activity + schema:Action
      for the DDI-CDI process/action description). It is a reusable procedure that
      prescribes an analysis; the analysis OCCURRENCE is the prov:Activity in adaProduct.prov:wasGeneratedBy,
      which references this plan via prov:used. Because the TAPP is a plan, its instrument
      / bios:computationalTool / bios:reagent are directly-specified resources (not
      prov:used entities). The TAPP identity (name, technique, instrument, location)
      lives at the top level. The standard workflow is encoded in schema:actionProcess
      as a schema:HowTo containing an ordered sequence of cdi:Activity + schema:Action
      steps (sample preparation, calibration, acquisition, data processing, quality
      control). Each workflow step carries its own parameters, reagents, and instruments.
      TAPP-level parameters that apply across all steps remain at the top level in
      schema:additionalProperty. Integrates Bioschemas vocabulary for computational
      tools and reagents, DDI-CDI for activity sequence, and dqv:hasQualityMeasurement
      for quality metrics."
    type: object
    properties:
      '@context':
        type: object
        description: JSON-LD context declaring the namespace prefixes used in a method
          definition. Required for the document to be a valid JSON-LD instance. Bound
          prefixes must include schema (always), cdi (DDI-CDI), and ada (ADA vocabulary).
          Additional prefixes (bios, dqv, prov, skos) are recommended when those vocabularies
          are used in the body of the definition.
        properties:
          schema:
            enum:
            - http://schema.org/
          ada:
            enum:
            - https://ada.astromat.org/metadata/
          cdi:
            enum:
            - http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/
          bios:
            enum:
            - https://bioschemas.org/
          dqv:
            enum:
            - http://www.w3.org/ns/dqv#
          prov:
            enum:
            - http://www.w3.org/ns/prov#
          skos:
            enum:
            - http://www.w3.org/2004/02/skos/core#
        required:
        - schema
        - ada
        - cdi
      '@id':
        type: string
        description: Persistent URI for this TAPP definition in the registry.
      '@type':
        type: array
        items:
          type: string
        minItems: 5
        allOf:
        - contains:
            enum:
            - prov:Plan
        - contains:
            enum:
            - cdi:Activity
        - contains:
            enum:
            - schema:Action
        - contains:
            enum:
            - ada:TAPPDefinition
        - contains:
            enum:
            - bios:LabProtocol
        description: "Must include prov:Plan, cdi:Activity, schema:Action, ada:TAPPDefinition,
          and bios:LabProtocol. The TAPP is a PLAN (prov:Plan / bios:LabProtocol)
          \u2014 a reusable procedure description that prescribes the analysis, NOT
          the analysis occurrence (that is the prov:Activity in adaProduct.prov:wasGeneratedBy,
          which references this plan via prov:used). As a plan, its instrument / bios:computationalTool
          / bios:reagent are directly-specified resources (bios:LabProtocol convention),
          not prov:used entities."
      schema:name:
        type: string
        title: Method Name
        description: Short descriptive name with version (e.g. "JEOL-8530F WDS Major
          Element Glass v2.1").
        x-jsonld-id: http://schema.org/name
      schema:identifier:
        description: DOI or other persistent ID for this method definition.
        anyOf:
        - type: string
        - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.identifier
        x-jsonld-id: http://schema.org/identifier
      schema:description:
        type: string
        description: Human-readable summary of the method, may be auto-generated from
          constant parameters at registration time.
        x-jsonld-id: http://schema.org/description
      schema:version:
        type: string
        description: Semantic version string (e.g. "2.1.0").
        x-jsonld-id: http://schema.org/version
      schema:datePublished:
        title: Method Start Date
        type: string
        description: ISO 8601 date when this method configuration was first used.
        x-jsonld-id: http://schema.org/datePublished
      schema:dateModified:
        type: string
        description: ISO 8601 date of last update to this definition.
        x-jsonld-id: http://schema.org/dateModified
      schema:additionalType:
        description: Further classification of the activity type (e.g. schema:CreateAction
          for a production method).
        type: array
        items:
          type: string
        x-jsonld-id: http://schema.org/additionalType
      schema:measurementTechnique:
        title: Technique
        description: The analytical technique this method implements. Must be a DefinedTerm
          from a controlled vocabulary of techniques.
        type: array
        items:
          $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.definedTerm
        x-jsonld-id: http://schema.org/measurementTechnique
      schema:object:
        description: Target material(s) this method is designed to analyse (e.g. silicate
          glass, olivine, spinel), modeled as DefinedTerm(s) or free text; and/or
          the sample(s) analysed, modeled as iSamples material-sample objects (the
          "Samples analyzed" shape carried over from geochemProduct).
        type: array
        items:
          anyOf:
          - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.tappDefinition/$defs/DefinedTerm
          - type: string
          - type: object
            description: Samples analyzed
            properties:
              '@type':
                type: array
                items:
                  type: string
                allOf:
                - contains:
                    enum:
                    - schema:Thing
                - contains:
                    enum:
                    - https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                minItems: 2
              schema:additionalType:
                type: array
                items:
                  type: string
                x-jsonld-id: http://schema.org/additionalType
              schema:identifier:
                type: array
                items:
                  type: string
                x-jsonld-id: http://schema.org/identifier
              schema:name:
                description: Sample name/identifier as used in the lab.
                type: string
                x-jsonld-id: http://schema.org/name
              schema:additionalProperty:
                description: Per-sample PropertyValue entries (e.g. analysis location);
                  technique profiles constrain these.
                type: array
                items:
                  type: object
                x-jsonld-id: http://schema.org/additionalProperty
        x-jsonld-id: http://schema.org/object
      schema:instrument:
        description: 'Instrument specification(s) for this method: a single instrument
          object, or an array of instruments when the method uses more than one (e.g.
          LA-ICP-MS = a laser ablation system plus the ICP-MS). Use schema:hasPart
          for instrument sub-components (spectrometers, detectors, ICP source, sample
          introduction system). Path-driven technique overlays select a specific instrument
          by schema:additionalType and constrain its sub-component tree.'
        anyOf:
        - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.instrument
        - type: array
          items:
            $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.instrument
        x-jsonld-id: http://schema.org/instrument
      bios:computationalTool:
        description: Software tools used for data acquisition, reduction, and processing.
          Each tool carries name, version, and optional URL.
        type: array
        items:
          $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.tappDefinition/$defs/ComputationalTool
        x-jsonld-id: https://bioschemas.org/computationalTool
      bios:reagent:
        description: Reference materials, calibration standards, and chemical reagents
          used across this method. Reagents specific to a single workflow step should
          be placed on that step instead.
        type: array
        items:
          $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.tappDefinition/$defs/Reagent
        x-jsonld-id: https://bioschemas.org/reagent
      schema:location:
        title: Laboratory
        description: Laboratory where this method was developed. Optional; omit for
          methods that are instrument-generic.
        x-jsonld-id: http://schema.org/location
        allOf:
        - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.laboratory
      schema:creator:
        title: Method Author
        description: Person or organisation who defined or is responsible for this
          method.
        anyOf:
        - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.person
        - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.organization
        - type: object
          required:
          - '@id'
          additionalProperties: false
          properties:
            '@id':
              type: string
        x-jsonld-id: http://schema.org/creator
      schema:actionProcess:
        description: The standard workflow for this method, expressed as a schema:HowTo
          containing an ordered sequence of workflow steps. Each step is a cdi:Activity
          + schema:Action describing a distinct phase (sample preparation, calibration,
          acquisition, data processing, quality control). Steps carry their own parameters,
          reagents, instruments, and sub-steps.
        x-jsonld-id: http://schema.org/actionProcess
        allOf:
        - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.tappDefinition/$defs/WorkflowHowTo
      schema:additionalProperty:
        type: array
        description: Method-level Advanced-protocol parameters that apply across all
          workflow steps. Editable parameters are schema:PropertyValueSpecification
          entries (a default the analyst may override); read-only parameters are schema:PropertyValue
          entries carrying the fixed protocol value. Replaces the former ada:methodParameters.
          Technique TAPP profiles constrain the allowed entries via $refs to the parameterTemplates
          (specifications) and parameterValues (values) registries. Step-specific
          parameters should be placed on the appropriate workflow step instead.
        items:
          anyOf:
          - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.tappDefinition/$defs/MethodParameter
          - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.tappDefinition/$defs/MethodParameterValue
        x-jsonld-id: http://schema.org/additionalProperty
      ada:analyteTemplate:
        description: Template for per-analyte (element-specific) parameters. Defines
          the columns that appear in the element table, each with scope, datatype,
          and constraints. Analyte rows become schema:variableMeasured entries in
          metadata records. Typically associated with the acquisition workflow step.
        type: object
        properties:
          ada:analyteColumns:
            type: array
            description: Columns of the per-analyte parameter table. Must include
              exactly one column with schema:valueName "analyte" that identifies the
              analyzed constituent named in each row.
            minItems: 1
            items:
              $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.tappDefinition/$defs/AnalyteColumn
            contains:
              $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.tappDefinition/$defs/AnalyteIdentifierColumn
            maxContains: 1
            x-jsonld-id: https://ada.astromat.org/metadata/analyteColumns
          ada:defaultAnalytes:
            type: array
            description: "The analytes (analyzed constituents) this method targets
              by default \u2014 the ROWS of the per-analyte table. Each is a bare
              string or a schema:DefinedTerm identifying the analyte; per-analyte
              column VALUES live in the analysis record, not here."
            items:
              anyOf:
              - type: string
              - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.tappDefinition/$defs/DefinedTerm
            x-jsonld-id: https://ada.astromat.org/metadata/defaultAnalytes
        required:
        - ada:analyteColumns
        x-jsonld-id: https://ada.astromat.org/metadata/analyteTemplate
      ada:channelTemplate:
        description: Template for per-channel parameters, a channel being an instrument
          selection position (a mass, a Faraday cup, an energy-loss edge, an X-ray
          line). Declares the channel domain and the columns that repeat over it.
          The domain is declared by different fields per technique -- Monitored Isotopes
          for ICP-MS, Collector Configuration for MC-ICP-MS, EELS Edges for TEM.
        type: object
        properties:
          ada:channelColumns:
            type: array
            description: Columns of the per-channel parameter table. Must include
              exactly one column with schema:valueName "channel" identifying the selection
              position named in each row.
            minItems: 1
            items:
              $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.tappDefinition/$defs/ChannelColumn
            contains:
              $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.tappDefinition/$defs/ChannelIdentifierColumn
            maxContains: 1
            x-jsonld-id: https://ada.astromat.org/metadata/channelColumns
          ada:defaultChannels:
            type: array
            description: "The channels this procedure defines by default \u2014 the
              ROWS of the channel table. Each is a bare string or a schema:DefinedTerm
              identifying the channel; per-channel column VALUES live in the analysis
              record's collectorConfiguration array, not here."
            items:
              anyOf:
              - type: string
              - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.tappDefinition/$defs/DefinedTerm
            x-jsonld-id: https://ada.astromat.org/metadata/defaultChannels
        required:
        - ada:channelColumns
        x-jsonld-id: https://ada.astromat.org/metadata/channelTemplate
      ada:reportedPropertyTemplate:
        description: 'Template for the variables this procedure REPORTS and their
          units, as distinct from ada:analyteTemplate which records what was acquired.
          Declares the reported-property domain and the columns that repeat over it.
          It also states the procedure''s scope boundary: a derived quantity inside
          this list is in scope, anything beyond it belongs to a separate, coupled
          procedure.'
        type: object
        properties:
          ada:reportedPropertyColumns:
            type: array
            description: Columns of the reported-property table. Must include exactly
              one column with schema:valueName "reportedProperty" identifying the
              reported variable named in each row.
            minItems: 1
            items:
              $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.tappDefinition/$defs/ReportedPropertyColumn
            contains:
              $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.tappDefinition/$defs/ReportedPropertyIdentifierColumn
            maxContains: 1
            x-jsonld-id: https://ada.astromat.org/metadata/reportedPropertyColumns
          ada:defaultReportedProperties:
            type: array
            description: "The reported properties this procedure defines by default
              \u2014 the ROWS of the reported- property table. Each is a bare string
              or a schema:DefinedTerm identifying the property; per-property column
              VALUES live in the analysis record, not here."
            items:
              anyOf:
              - type: string
              - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.tappDefinition/$defs/DefinedTerm
            x-jsonld-id: https://ada.astromat.org/metadata/defaultReportedProperties
        required:
        - ada:reportedPropertyColumns
        x-jsonld-id: https://ada.astromat.org/metadata/reportedPropertyTemplate
      dqv:hasQualityMeasurement:
        description: Quality measurements that characterize the method's expected
          performance (e.g. analytical precision, accuracy, counting statistics error).
          Uses the CDIF qualityMeasure building block.
        type: array
        items:
          $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.tappDefinition/$defs/QualityMeasure
        x-jsonld-id: http://www.w3.org/ns/dqv#hasQualityMeasurement
      schema:relatedLink:
        title: Method References
        type: array
        description: Publications, Zenodo records, or other references reports describing
          or evaluating this method.
        items:
          $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.labeledLink
        x-jsonld-id: http://schema.org/relatedLink
      schema:funding:
        title: Funding Source
        type: array
        items:
          $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.monetaryGrant
        x-jsonld-id: http://schema.org/funding
      schema:variableMeasured:
        title: Reported Variables
        description: "Variables / properties this procedure reports (e.g. detection
          limit, limit of quantification, calibration factor, uncertainty propagation
          method), each modeled as a schema:PropertyValueSpecification (a procedure-level
          default, carrying schema:defaultValue) or a schema:PropertyValue (a measured
          value, carrying schema:value), keyed by schema:name. A technique profile
          enumerates the reported properties it defines; a dataset instance overrides
          each schema:defaultValue with a schema:value. Left open here \u2014 the
          technique overlay narrows it."
        type: array
        items:
          type: object
          properties:
            '@type':
              type: array
              items:
                type: string
            schema:name:
              type: string
              x-jsonld-id: http://schema.org/name
            ada:dataType:
              type: string
              x-jsonld-id: https://ada.astromat.org/metadata/dataType
            schema:defaultValue:
              x-jsonld-id: http://schema.org/defaultValue
            schema:value:
              x-jsonld-id: http://schema.org/value
        x-jsonld-id: http://schema.org/variableMeasured
    required:
    - '@context'
    - '@type'
    - schema:name
    - schema:measurementTechnique
    $defs:
      WorkflowHowTo:
        type: object
        description: The method's standard workflow expressed as a schema:HowTo. Contains
          an ordered array of workflow steps in schema:step, where each step is a
          cdi:Activity + schema:Action.
        properties:
          '@type':
            type: array
            items:
              type: string
            contains:
              enum:
              - schema:HowTo
            minItems: 1
          '@id':
            type: string
          schema:name:
            type: string
            description: Name of the workflow (e.g. "EPMA WDS analytical workflow").
            x-jsonld-id: http://schema.org/name
          schema:description:
            type: string
            description: Overview of the workflow.
            x-jsonld-id: http://schema.org/description
          schema:url:
            type: string
            format: uri
            description: URL to a published protocol document.
            x-jsonld-id: http://schema.org/url
          schema:step:
            type: array
            description: Ordered sequence of workflow steps. Each step is a cdi:Activity
              + schema:Action describing a distinct phase of the analytical procedure.
              Must include exactly one sample-preparation step (schema:name "Sample
              preparation" with schema:additionalType containing "bios:LabProcess");
              its schema:position is left to the protocol author.
            items:
              $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.tappDefinition/$defs/WorkflowStep
            contains:
              type: object
              description: a sample preparation step is required.
              properties:
                schema:name:
                  x-jsonld-id: http://schema.org/name
                  enum:
                  - Sample preparation
                schema:additionalType:
                  type: array
                  contains:
                    enum:
                    - bios:LabProcess
                  x-jsonld-id: http://schema.org/additionalType
              required:
              - schema:name
              - schema:additionalType
            maxContains: 1
            x-jsonld-id: http://schema.org/step
        required:
        - '@type'
        - schema:step
      WorkflowStep:
        type: object
        description: A single step in the analytical workflow, modeled as a cdi:Activity
          + schema:Action. Each step describes a distinct phase such as sample preparation,
          instrument calibration, data acquisition, data processing, or quality control.
          Steps carry their own parameters, instruments, reagents, and may contain
          sub-steps via schema:actionProcess.
        properties:
          '@type':
            type: array
            items:
              type: string
            minItems: 2
            allOf:
            - contains:
                enum:
                - cdi:Activity
            - contains:
                enum:
                - schema:Action
          '@id':
            type: string
          schema:name:
            type: string
            description: Name of this workflow step (e.g. "Sample preparation").
            x-jsonld-id: http://schema.org/name
          schema:description:
            type: string
            description: Detailed description of what this step involves.
            x-jsonld-id: http://schema.org/description
          schema:position:
            type: integer
            description: Ordinal position in the workflow sequence (1-based).
            x-jsonld-id: http://schema.org/position
          schema:additionalType:
            description: Further classification of this step (e.g. bios:LabProcess
              for wet-lab steps, schema:CreateAction for production steps).
            type: array
            items:
              type: string
            x-jsonld-id: http://schema.org/additionalType
          schema:instrument:
            description: Instrument or equipment used in this step.
            anyOf:
            - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.instrument
            - type: object
              additionalProperties: false
              properties:
                '@id':
                  type: string
              required:
              - '@id'
            x-jsonld-id: http://schema.org/instrument
          bios:computationalTool:
            description: Software tools used in this step.
            type: array
            items:
              $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.tappDefinition/$defs/ComputationalTool
            x-jsonld-id: https://bioschemas.org/computationalTool
          bios:reagent:
            description: Reference materials, standards, or reagents used in this
              step.
            type: array
            items:
              $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-MC-ICPMS-UPb/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.tappDefinition/$defs/Reagent
            x-jsonld-id: https://bioschemas.org/reagent
          prov:used:
            description: Input entities consumed or referenced by this step (e.g.
              prepared sample from a prior step).
            type: array
            items:
              anyOf:
              - type: string
              - type: object
                required:
                - '@id'
                additionalProperties: false
                properties:
                  '@id':
                    type: string
            x-jsonld-id: http://www.w3.org/ns/prov#used
          schema:result:
            description: Output entity produced by this step (can be referenced as
              input by a subsequent step).
            anyOf:
            - type: string
            - type: object
              required:
