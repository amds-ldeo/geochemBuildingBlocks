                        - ada:parameter/laMcicpmsUPbTAPP/detectorConfiguration
                      '@type':
                        enum:
                        - - schema:PropertyValue
                      schema:propertyID:
                        enum:
                        - - '@id': ada:parameter/laMcicpmsUPbTAPP/detectorConfiguration
                      schema:name:
