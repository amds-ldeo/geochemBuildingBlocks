$schema: https://json-schema.org/draft/2020-12/schema
title: ADA Direct Shear Strength Product Profile
description: Path-driven technique-specific profile for ADA Direct Shear Strength
  Product Profile. Extends the base ADA product profile with the DSSM analysis-instance
  detail on the schema:Dataset root, narrows prov:used to the dssmTAPP protocol, and
  constrains valid component types on schema:distribution.hasPart.
allOf:
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/geochemProduct/schema.yaml
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/DSSM/detail/schema.yaml
- type: object
  properties:
    prov:wasGeneratedBy:
      description: 'Pin the dssmTAPP definition and the instrument where prov:used
        carries them. Constraint-only if/then, never a narrowed anyOf: prov:used items
        are role-keyed wrappers, and an anyOf here would allOf-merge with the base
        union and exclude item shapes the base allows.'
      type: array
      items:
        type: object
        properties:
          prov:used:
            type: array
            items:
              allOf:
              - if:
                  type: object
                  required:
                  - schema:instrument
                then:
                  properties:
                    schema:instrument:
                      type: array
                      minItems: 1
                      items:
                        $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/instrument/schema.yaml
              - if:
                  type: object
                  properties:
                    '@type':
                      contains:
                        const: ada:TAPPDefinition
                  required:
                  - '@type'
                then:
                  $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/DSSM/tapp/schema.yaml
    schema:additionalType:
      description: Must include a DSSM product type identifier.
      contains:
        enum:
        - Direct Shear Strength Measurement (DSSM)
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaDSSM
