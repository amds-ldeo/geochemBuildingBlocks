$schema: https://json-schema.org/draft/2020-12/schema
title: ADA Ion Chromatography-Mass Spectrometry Product Profile
description: Path-driven technique-specific profile for ADA Ion Chromatography-Mass
  Spectrometry Product Profile. Extends the base ADA product profile with the ICMS
  analysis-instance detail on the schema:Dataset root, and pins the product type and
  the profile it declares conformance to.
allOf:
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/geochemProduct/schema.yaml
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/IC-MS/detail/schema.yaml
- type: object
  properties:
    schema:additionalType:
      description: Must include a ICMS product type identifier.
      contains:
        enum:
        - Ion Chromatography-Mass Spectrometry
        - Ion Chromatography-Mass Spectrometry (ICMS)
        - Ion Chromatography
        - Liquid Chromatography-Mass Spectrometry
      title: Product Type
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaICMS
      title: About This Record
