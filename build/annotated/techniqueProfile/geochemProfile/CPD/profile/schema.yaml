$schema: https://json-schema.org/draft/2020-12/schema
title: ADA Curation Photo-Documentation Product Profile
description: Path-driven technique-specific profile for ADA Curation Photo-Documentation
  Product Profile. Extends the base ADA product profile with the CPD analysis-instance
  detail on the schema:Dataset root, and pins the product type and the profile it
  declares conformance to.
allOf:
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/geochemProduct/schema.yaml
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/CPD/detail/schema.yaml
- type: object
  properties:
    schema:additionalType:
      description: Must include a CPD product type identifier.
      contains:
        enum:
        - Curation Photo-Documentation
        - Curation Photo-Documentation (CPD)
      title: Product Type
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaCPD
      title: About This Record
