$schema: https://json-schema.org/draft/2020-12/schema
title: ADA STHM-AFM Product Profile
description: Path-driven technique-specific profile for ADA STHM-AFM Product Profile.
  Extends the base ADA product profile with the STHMAFM analysis-instance detail on
  the schema:Dataset root, and pins the product type and the profile it declares conformance
  to.
allOf:
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/geochemProduct/schema.yaml
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/STHM-AFM/detail/schema.yaml
- type: object
  properties:
    schema:additionalType:
      description: Must include a STHMAFM product type identifier.
      contains:
        enum:
        - Scanning Thermal Microscopy with AFM
        - Scanning Thermal Microscopy with AFM (STHMAFM)
      title: Product Type
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaSTHMAFM
      title: About This Record
