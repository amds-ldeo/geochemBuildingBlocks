$schema: https://json-schema.org/draft/2020-12/schema
title: ADA FIB-SEM Product Profile
description: Path-driven technique-specific profile for ADA FIB-SEM Product Profile.
  Extends the base ADA product profile with the SEMFIBSEM analysis-instance detail
  on the schema:Dataset root, narrows prov:used to the semFibsemTAPP protocol, and
  constrains valid component types on schema:distribution.hasPart.
allOf:
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/geochemProduct/schema.yaml
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM-FIBSEM/detail/schema.yaml
- type: object
  properties:
    prov:wasGeneratedBy:
      description: 'Pin the semFibsemTAPP definition and the instrument where prov:used
        carries them. Constraint-only if/then, never a narrowed anyOf: prov:used items
        are role-keyed wrappers, and an anyOf here would allOf-merge with the base
        union and exclude item shapes the base allows.'
      type: array
      items:
        type: object
        properties:
          prov:used:
            type: array
            items:
              allOf:
              - if:
                  type: object
                  required:
                  - schema:instrument
                then:
                  properties:
                    schema:instrument:
                      type: array
                      minItems: 1
                      items:
                        $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/instrument/schema.yaml
              - if:
                  type: object
                  properties:
                    '@type':
                      contains:
                        const: ada:TAPPDefinition
                  required:
                  - '@type'
                then:
                  $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM-FIBSEM/tapp/schema.yaml
    schema:additionalType:
      description: Must include a SEMFIBSEM product type identifier.
      contains:
        enum:
        - Focused ion beam-scanning electron microscopy
        - Scanning electron microscopy
    schema:distribution:
      description: Each distribution item is EITHER a monolithic single-file dataset
        whose ada:componentType is a SEMFIBSEM-specific or universal value (and may
        carry cdi:isStructuredBy), OR a bundle whose schema:hasPart members each carry
        such a componentType (the ADA/SAMIS archive form).
      type: array
      items:
        anyOf:
        - type: object
          required:
          - ada:componentType
          properties:
            ada:componentType:
              type: string
              anyOf:
              - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/geochemProduct/schema.yaml#/$defs/universalComponentType
              - enum:
                - ada:FIBSEMVolume
                - ada:FIBSEMImage
                - ada:FIBSEMSegmentation
                - ada:FIBSEMTabular
        - type: object
          required:
          - schema:hasPart
          properties:
            schema:hasPart:
              items:
                type: object
                anyOf:
                - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/geochemProduct/schema.yaml#/$defs/universalComponentTypeBranch
                - properties:
                    ada:componentType:
                      type: string
                      enum:
                      - ada:FIBSEMVolume
                      - ada:FIBSEMImage
                      - ada:FIBSEMSegmentation
                      - ada:FIBSEMTabular
                  required:
                  - ada:componentType
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaSEMFIBSEM
