    ada:samplingUnit:
      description: "The physical subdivision of the sample to which one row of reported
        values corresponds \u2014 the unit that is analysed and reported, as distinct
        from the sample as a whole. State the unit type at procedure level and the
        units actually analysed at analysis level. Where units nest (e.g. confined
        tracks within grains), state both levels."
      anyOf:
      - type: string
        enum:
        - Whole sample
        - Aliquot
        - Grain
        - Spot
        - Analysis point
        - Phase
        - Sub-volume
        - Region of interest
        - N/A
        - None
        - missing
      - type: string
    ada:targetSelectionCriteriaDefault:
      description: "The rules governing which part of the sample is analysed, and
        why. Covers the criteria applied when choosing grains, aliquots, spots, or
        a region of interest \u2014 size, morphology, clarity, freedom from inclusions
        or alteration, phase identity, or spatial position. Distinct from Target Material,
        which states the material type the procedure is designed for: this field states
        how, within such a sample, the analysed portion is picked out."
      type: string
    schema:instrument:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              schema:additionalType:
                contains:
                  enum:
                  - SEM
            required:
            - schema:additionalType
          then:
            properties:
              schema:manufacturer:
                type: object
                properties:
                  schema:name:
                    description: Manufacturer of the instrument that performs the
                      measurement, recorded as a controlled value so that procedures
                      can be found by vendor. Where a procedure couples a sample-introduction
                      system to an analysing instrument, this records the analysing
                      instrument. Instrument Model gives the specific designation.
                    type: string
                    enum:
                    - JEOL
                    - Zeiss
                    - FEI / Thermo Fisher Scientific
                    - Hitachi
                    - Tescan
                    - Phenom
                    - Unknown
                    - N/A
                    - None
                    - missing
                    readOnly: true
              schema:model:
                type: object
                properties:
                  schema:name:
                    description: Model designation of the instrument that performs
                      the measurement, including any generation or configuration suffix.
                      Conventionally written with the manufacturer name included;
                      Instrument Manufacturer records the vendor separately, as a
                      controlled value, so that procedures remain findable by vendor.
                    type: string
                    readOnly: true
              schema:hasPart:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            enum:
                            - Electron source
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:description:
                          description: Type of electron gun used in the instrument.
                          anyOf:
                          - type: string
                            enum:
                            - Cold-FEG
                            - Schottky FEG
                            - LaB6 / CeB6
                            - Tungsten (W)
                            - Unknown
                            - N/A
                            - None
                            - missing
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              enum:
                              - Cold-FEG
                              - Schottky FEG
                              - LaB6 / CeB6
                              - Tungsten (W)
                              - Unknown
                              - N/A
                              - None
                              - missing
                              readOnly: true
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            enum:
                            - SEDetector
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:name:
                          description: Type of secondary electron detector used. Everhart-Thornley
                            (ET) detector is the standard off-axis collector sensitive
                            to SE2 and some BSE; in-lens (TLD) detectors collect high-resolution
                            SE1 signal at short working distances; GSED/ESED detectors
                            operate in VP/ESEM mode by using the chamber gas as the
                            signal amplification medium.
                          anyOf:
                          - type: string
                            enum:
                            - Everhart-Thornley (ET)
                            - In-lens / TLD (through-the-lens)
                            - GSED (VP/ESEM)
                            - ESED (VP/ESEM)
                            - N/A
                            - None
                            - missing
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              enum:
                              - Everhart-Thornley (ET)
                              - In-lens / TLD (through-the-lens)
                              - GSED (VP/ESEM)
                              - ESED (VP/ESEM)
                              - N/A
                              - None
                              - missing
                              readOnly: true
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            enum:
                            - BSEDetector
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:name:
                          description: Type of backscattered electron detector. Solid-state
                            diode detectors (single or segmented) are standard; YAG
                            scintillator detectors offer high sensitivity at low voltage.
                            Segmented detectors can operate in composition mode (segments
                            summed) or topography mode (differential signal between
                            segments). In-lens BSE detectors provide improved BSE
                            collection at short working distances.
                          anyOf:
                          - type: string
                            enum:
                            - Solid-state diode (single)
                            - Solid-state diode (segmented, composition mode)
                            - Solid-state diode (segmented, topography mode)
                            - In-lens BSE
                            - YAG scintillator
                            - N/A
                            - None
                            - missing
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              enum:
                              - Solid-state diode (single)
                              - Solid-state diode (segmented, composition mode)
                              - Solid-state diode (segmented, topography mode)
                              - In-lens BSE
                              - YAG scintillator
                              - N/A
                              - None
                              - missing
                              readOnly: true
                allOf:
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          enum:
                          - Electron source
                    required:
                    - schema:additionalType
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          enum:
                          - SEDetector
                    required:
                    - schema:additionalType
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          enum:
                          - BSEDetector
                    required:
                    - schema:additionalType
              schema:description:
                description: 'Broad platform type of the instrument. ''Standard SEM'':
                  dedicated electron-only SEM column. ''FIB-SEM dual-beam'': combined
                  focused ion beam and SEM columns (enables TEM specimen preparation,
                  3D serial sectioning, ion-beam milling). ''VP-SEM / ESEM'': variable-pressure
                  or environmental SEM for imaging uncoated, hydrated, or charging
                  specimens. An instrument may combine categories (e.g., FIB-SEM with
                  VP capability).'
                anyOf:
                - type: string
                  enum:
                  - Standard SEM
                  - FIB-SEM dual-beam
                  - VP-SEM / ESEM
                  - FIB-SEM dual-beam + VP
                  - N/A
                  - None
                  - missing
                  readOnly: true
                - type: array
                  items:
                    type: string
                    enum:
                    - Standard SEM
                    - FIB-SEM dual-beam
                    - VP-SEM / ESEM
                    - FIB-SEM dual-beam + VP
                    - N/A
                    - None
                    - missing
                    readOnly: true
              ada:acceleratingVoltageDefault:
                description: Electron beam accelerating voltage in kilovolts. Affects
                  X-ray generation depth (EDS/WDS), EBSD pattern quality, imaging
                  resolution, and beam penetration. Low voltages (1-5 kV) improve
                  surface sensitivity and reduce beam damage; high voltages (15-20
                  kV) improve X-ray generation for quantitative analysis.
                anyOf:
                - type: number
                - type: string
              ada:workingDistanceDefault:
                description: Distance between the objective lens pole piece and the
                  specimen surface in millimetres. Affects spatial resolution, depth
                  of focus, EDS X-ray take-off angle, and EBSD geometry.
                anyOf:
                - type: number
                - type: string
        - if:
            properties:
              schema:additionalType:
                contains:
                  enum:
                  - FIBSEM
            required:
            - schema:additionalType
          then:
            properties:
              schema:hasPart:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            enum:
                            - Ion Beam Source
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:name:
                          description: Ion beam source type in a FIB-SEM dual-beam
                            system. Gallium LMIS (Ga+) is the most common ion source;
                            xenon plasma FIB (PFIB) provides higher material removal
                            rates for large-volume milling; helium and neon ion microscopes
                            (GFIS) provide nanometre-resolution imaging and low-damage
                            milling.
                          anyOf:
                          - type: string
                            enum:
                            - Gallium LMIS (Ga+)
                            - Xenon plasma FIB (PFIB)
                            - Helium GFIS
                            - Neon GFIS
                            - N/A
                            - None
                            - missing
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              enum:
                              - Gallium LMIS (Ga+)
                              - Xenon plasma FIB (PFIB)
                              - Helium GFIS
                              - Neon GFIS
                              - N/A
                              - None
                              - missing
                              readOnly: true
                allOf:
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          enum:
                          - Ion Beam Source
                    required:
                    - schema:additionalType
      allOf:
      - contains:
          properties:
            schema:additionalType:
              contains:
                enum:
                - SEM
          required:
          - schema:additionalType
      - contains:
          properties:
            schema:additionalType:
              contains:
                enum:
                - FIBSEM
          required:
          - schema:additionalType
    bios:computationalTool:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              ada:toolRole:
                enum:
                - acquisition
            required:
            - ada:toolRole
          then:
            properties:
              schema:name:
                description: Instrument control, automation and data acquisition software
                  used to collect the raw data, including version number. Distinct
                  from Data Processing Software(s), which covers everything applied
                  to the data after acquisition.
                anyOf:
