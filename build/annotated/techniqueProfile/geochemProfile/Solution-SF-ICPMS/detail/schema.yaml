$schema: https://json-schema.org/draft/2020-12/schema
title: Solution SF-ICP-MS Analysis Detail
description: Dataset-level analysis-instance detail for solution SF-ICP-MS, reusing
  CDIF/schema.org slots on the schema:Dataset root.
allOf:
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/group1/schema.yaml#/$defs/AnalysisIdentification
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/reportingCore/schema.yaml#/$defs/AggregationQc_Analysis
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/solutionIntroduction/schema.yaml#/$defs/AnalysisIdentification
- type: object
  properties:
    prov:wasGeneratedBy:
      type: array
      items:
        type: object
        properties:
          prov:used:
            type: array
            items:
              type: object
              allOf:
              - if:
                  required:
                  - bios:computationalTool
                then:
                  properties:
                    bios:computationalTool:
                      type: array
                      items:
                        allOf:
                        - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/geochemProduct/schema.yaml#/$defs/UsedComputationalTool
                        - type: object
                          allOf:
                          - if:
                              properties:
                                ada:toolRole:
                                  const: acquisition
                              required:
                              - ada:toolRole
                            then:
                              properties:
                                schema:name:
                                  description: Name and version of the software used
                                    to control the instrument and acquire raw mass
                                    spectrum data.
                                  anyOf:
                                  - type: string
                                  - type: array
                                    items:
                                      type: string
                          - if:
                              properties:
                                ada:toolRole:
                                  const: dataReduction
                              required:
                              - ada:toolRole
                            then:
                              properties:
                                schema:name:
                                  description: 'Name and version of the software used
                                    for data reduction: blank correction, internal
                                    standard normalization, calibration, and concentration
                                    calculation. Include version number.'
                                  anyOf:
                                  - type: string
                                  - type: array
                                    items:
                                      type: string
                          required:
                          - ada:toolRole
              - if:
                  required:
                  - schema:instrument
                then:
                  properties:
                    schema:instrument:
                      type: array
                      items:
                        allOf:
                        - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/instrument/schema.yaml
                        - type: object
                          allOf:
                          - if:
                              properties:
                                schema:additionalType:
                                  contains:
                                    const: ICPMS
                              required:
                              - schema:additionalType
                            then:
                              properties:
                                schema:hasPart:
                                  type: array
                                  items:
                                    type: object
                                    allOf:
                                    - if:
                                        properties:
                                          schema:additionalType:
                                            contains:
                                              const: ICP Source
                                        required:
                                        - schema:additionalType
                                      then:
                                        properties:
                                          schema:additionalProperty:
                                            type: array
                                            items:
                                              anyOf:
                                              - title: Auxiliary Gas Flow Rate
                                                description: Flow rate of the intermediate
                                                  (auxiliary) argon gas stream between
                                                  torch body and injector tube (L/min).
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/solutionSficpmsTAPP/auxiliaryGasFlowRate
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/solutionSficpmsTAPP/auxiliaryGasFlowRate
                                                  schema:name:
                                                    const: Auxiliary Gas Flow Rate
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                              - title: Coolant (Plasma) Gas Flow Rate
                                                description: Flow rate of the outer
                                                  (coolant) argon gas stream (L/min).
                                                  Influences plasma temperature and
                                                  oxide ion formation.
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/solutionSficpmsTAPP/coolantGasFlowRate
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/solutionSficpmsTAPP/coolantGasFlowRate
                                                  schema:name:
                                                    const: Coolant (Plasma) Gas Flow
                                                      Rate
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                              - title: RF Power
                                                description: Radiofrequency forward
                                                  power applied to the plasma (W).
                                                  Controls ionization efficiency and
                                                  oxide production rates.
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/solutionSficpmsTAPP/rfPower
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/solutionSficpmsTAPP/rfPower
                                                  schema:name:
                                                    const: RF Power
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                            allOf:
                                            - contains:
                                                title: Auxiliary Gas Flow Rate
                                                description: Flow rate of the intermediate
                                                  (auxiliary) argon gas stream between
                                                  torch body and injector tube (L/min).
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/solutionSficpmsTAPP/auxiliaryGasFlowRate
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/solutionSficpmsTAPP/auxiliaryGasFlowRate
                                                  schema:name:
                                                    const: Auxiliary Gas Flow Rate
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                              minContains: 0
                                              maxContains: 1
                                            - contains:
                                                title: Coolant (Plasma) Gas Flow Rate
                                                description: Flow rate of the outer
                                                  (coolant) argon gas stream (L/min).
                                                  Influences plasma temperature and
                                                  oxide ion formation.
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/solutionSficpmsTAPP/coolantGasFlowRate
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/solutionSficpmsTAPP/coolantGasFlowRate
                                                  schema:name:
                                                    const: Coolant (Plasma) Gas Flow
                                                      Rate
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                              minContains: 0
                                              maxContains: 1
                                            - contains:
                                                title: RF Power
                                                description: Radiofrequency forward
                                                  power applied to the plasma (W).
                                                  Controls ionization efficiency and
                                                  oxide production rates.
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/solutionSficpmsTAPP/rfPower
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/solutionSficpmsTAPP/rfPower
                                                  schema:name:
                                                    const: RF Power
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                              minContains: 0
                                              maxContains: 1
                                    - if:
                                        properties:
                                          schema:additionalType:
                                            contains:
                                              const: Sample Introduction System
                                        required:
                                        - schema:additionalType
                                      then:
                                        properties:
                                          schema:additionalProperty:
                                            type: array
                                            items:
                                              anyOf:
                                              - title: Make-up Gas Flow Rate
                                                description: Supplementary argon flow
                                                  added downstream of a desolvation
                                                  system to maintain total gas delivery
                                                  to the plasma (L/min). Record 'N/A'
                                                  if no desolvation system is used.
                                                  Record 'N/A' where Desolvation System
                                                  is 'None'.
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/solutionSficpmsTAPP/makeUpGasFlowRate
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/solutionSficpmsTAPP/makeUpGasFlowRate
                                                  schema:name:
                                                    const: Make-up Gas Flow Rate
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                              - title: Nebulizer Gas Flow Rate
                                                description: Flow rate of the carrier
                                                  argon gas delivered through the
                                                  nebulizer (L/min). Controls aerosol
                                                  transport and strongly influences
                                                  signal sensitivity and stability.
                                                  Adjusted daily to optimize signal.
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/solutionSficpmsTAPP/nebulizerGasFlowRate
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/solutionSficpmsTAPP/nebulizerGasFlowRate
                                                  schema:name:
                                                    const: Nebulizer Gas Flow Rate
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                              - title: Sample Uptake Rate
                                                description: "Peristaltic pump speed
                                                  or self-aspiration flow rate for
                                                  sample introduction (\xB5L/min or
                                                  mL/min)."
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/solutionSficpmsTAPP/sampleUptakeRate
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/solutionSficpmsTAPP/sampleUptakeRate
                                                  schema:name:
                                                    const: Sample Uptake Rate
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                            allOf:
                                            - contains:
                                                title: Make-up Gas Flow Rate
                                                description: Supplementary argon flow
                                                  added downstream of a desolvation
                                                  system to maintain total gas delivery
                                                  to the plasma (L/min). Record 'N/A'
                                                  if no desolvation system is used.
                                                  Record 'N/A' where Desolvation System
                                                  is 'None'.
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/solutionSficpmsTAPP/makeUpGasFlowRate
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/solutionSficpmsTAPP/makeUpGasFlowRate
                                                  schema:name:
                                                    const: Make-up Gas Flow Rate
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                              minContains: 0
                                              maxContains: 1
                                            - contains:
                                                title: Nebulizer Gas Flow Rate
                                                description: Flow rate of the carrier
                                                  argon gas delivered through the
                                                  nebulizer (L/min). Controls aerosol
                                                  transport and strongly influences
                                                  signal sensitivity and stability.
                                                  Adjusted daily to optimize signal.
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/solutionSficpmsTAPP/nebulizerGasFlowRate
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/solutionSficpmsTAPP/nebulizerGasFlowRate
                                                  schema:name:
                                                    const: Nebulizer Gas Flow Rate
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                              minContains: 0
                                              maxContains: 1
                                            - contains:
                                                title: Sample Uptake Rate
                                                description: "Peristaltic pump speed
                                                  or self-aspiration flow rate for
                                                  sample introduction (\xB5L/min or
                                                  mL/min)."
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/solutionSficpmsTAPP/sampleUptakeRate
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/solutionSficpmsTAPP/sampleUptakeRate
                                                  schema:name:
                                                    const: Sample Uptake Rate
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                              minContains: 0
                                              maxContains: 1
                                    - if:
                                        properties:
                                          schema:additionalType:
                                            contains:
                                              const: Torch
                                        required:
                                        - schema:additionalType
                                      then:
                                        properties:
                                          schema:additionalProperty:
                                            type: array
                                            items:
                                              title: Torch Depth
                                              description: Distance between the load
                                                coil and the sampling cone tip (mm),
                                                also called injector depth or torch
                                                position depending on the instrument
                                                manufacturer. Affects ion transmission
                                                efficiency, oxide formation, and doubly-charged
                                                species production. The procedure
                                                specifies a target value optimised
                                                during initial setup; the analyst
                                                confirms or fine-adjusts during session
                                                tuning.
                                              type: object
                                              properties:
                                                '@id':
                                                  const: ada:parameter/solutionSficpmsTAPP/torchDepth
                                                '@type':
                                                  const:
                                                  - schema:PropertyValue
                                                schema:propertyID:
                                                  const:
                                                  - '@id': ada:parameter/solutionSficpmsTAPP/torchDepth
                                                schema:name:
                                                  const: Torch Depth
                                                schema:value:
                                                  type: string
                                              required:
                                              - '@id'
                                              - '@type'
                                              - schema:propertyID
                                              - schema:name
                                              - schema:value
                                            allOf:
                                            - contains:
                                                title: Torch Depth
                                                description: Distance between the
                                                  load coil and the sampling cone
                                                  tip (mm), also called injector depth
                                                  or torch position depending on the
                                                  instrument manufacturer. Affects
                                                  ion transmission efficiency, oxide
                                                  formation, and doubly-charged species
                                                  production. The procedure specifies
                                                  a target value optimised during
                                                  initial setup; the analyst confirms
                                                  or fine-adjusts during session tuning.
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/solutionSficpmsTAPP/torchDepth
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/solutionSficpmsTAPP/torchDepth
                                                  schema:name:
                                                    const: Torch Depth
                                                  schema:value:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                              minContains: 0
                                              maxContains: 1
                                  allOf:
                                  - contains:
                                      properties:
                                        schema:additionalType:
                                          contains:
                                            const: ICP Source
                                      required:
                                      - schema:additionalType
                                  - contains:
                                      properties:
                                        schema:additionalType:
                                          contains:
                                            const: Sample Introduction System
                                      required:
                                      - schema:additionalType
                                schema:additionalProperty:
                                  type: array
                                  items:
                                    anyOf:
                                    - title: Doubly-Charged Species Monitor
                                      description: Mass ratio monitored to estimate
                                        doubly-charged ion (M2+) formation during
                                        instrument tuning. Doubly-charged ions appear
                                        at half the nominal mass of the parent ion
                                        and can interfere with lighter analyte masses.
                                        In SF-ICP-MS, doubly-charged species are not
                                        suppressed by collision cells and require
                                        monitoring through plasma tuning. Ba2+/Ba+
                                        (m/z 69/138) is the most common proxy.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/solutionSficpmsTAPP/doublyChargedSpeciesMonitor
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/solutionSficpmsTAPP/doublyChargedSpeciesMonitor
                                        schema:name:
                                          const: Doubly-Charged Species Monitor
                                        schema:value:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                    - title: Doubly-Charged Species Production
                                      description: Measured percentage of doubly-charged
                                        ion production for the monitored species at
                                        the time of instrument tuning. Record both
                                        the acceptance threshold and the measured
                                        value. Elevated doubly-charged production
                                        indicates incomplete ionization and potential
                                        interference on elements at approximately
                                        half the mass of abundant matrix components.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/solutionSficpmsTAPP/doublyChargedSpeciesProduction
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/solutionSficpmsTAPP/doublyChargedSpeciesProduction
                                        schema:name:
                                          const: Doubly-Charged Species Production
                                        schema:value:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                    - title: Mass Resolution Setting
                                      description: "Mass resolution mode(s) used in
                                        this procedure. Sector-field instruments allow
                                        selection of low resolution (LR; m/\u0394m
                                        \u2248 300\u2013400), medium resolution (MR;
                                        m/\u0394m \u2248 2500\u20135000), or high
                                        resolution (HR; m/\u0394m \u2248 10,000).
                                        Multi-resolution procedures assign individual
                                        analytes to specific modes (documented in
                                        Group 4 under Mass Resolution Assignment).
                                        Procedure registers the mode(s) in use; analyst
                                        confirms at session start."
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/solutionSficpmsTAPP/massResolutionSetting
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/solutionSficpmsTAPP/massResolutionSetting
                                        schema:name:
                                          const: Mass Resolution Setting
                                        schema:value:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                    - title: Memory Effect Mitigation
                                      description: Procedure applied to identify and
                                        minimize carry-over of high-concentration
                                        elements between successive sample introductions.
                                        For solution ICP-MS, mitigation is implemented
                                        primarily at measurement time through extended
                                        rinse periods (see Wash Time Between Samples,
                                        Group 4). At data processing level, documents
                                        any flagging or exclusion of measurements
                                        preceded by high-concentration samples or
                                        standards where the required washout time
                                        may not have been achieved.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/solutionSficpmsTAPP/memoryEffectMitigation
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/solutionSficpmsTAPP/memoryEffectMitigation
                                        schema:name:
                                          const: Memory Effect Mitigation
                                        schema:value:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                  allOf:
                                  - contains:
                                      title: Doubly-Charged Species Monitor
                                      description: Mass ratio monitored to estimate
                                        doubly-charged ion (M2+) formation during
                                        instrument tuning. Doubly-charged ions appear
                                        at half the nominal mass of the parent ion
                                        and can interfere with lighter analyte masses.
                                        In SF-ICP-MS, doubly-charged species are not
                                        suppressed by collision cells and require
                                        monitoring through plasma tuning. Ba2+/Ba+
                                        (m/z 69/138) is the most common proxy.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/solutionSficpmsTAPP/doublyChargedSpeciesMonitor
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/solutionSficpmsTAPP/doublyChargedSpeciesMonitor
                                        schema:name:
                                          const: Doubly-Charged Species Monitor
                                        schema:value:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                    minContains: 0
                                    maxContains: 1
                                  - contains:
                                      title: Doubly-Charged Species Production
                                      description: Measured percentage of doubly-charged
                                        ion production for the monitored species at
                                        the time of instrument tuning. Record both
                                        the acceptance threshold and the measured
                                        value. Elevated doubly-charged production
                                        indicates incomplete ionization and potential
                                        interference on elements at approximately
                                        half the mass of abundant matrix components.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/solutionSficpmsTAPP/doublyChargedSpeciesProduction
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/solutionSficpmsTAPP/doublyChargedSpeciesProduction
                                        schema:name:
                                          const: Doubly-Charged Species Production
                                        schema:value:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                    minContains: 0
                                    maxContains: 1
                                  - contains:
                                      title: Mass Resolution Setting
                                      description: "Mass resolution mode(s) used in
                                        this procedure. Sector-field instruments allow
                                        selection of low resolution (LR; m/\u0394m
                                        \u2248 300\u2013400), medium resolution (MR;
                                        m/\u0394m \u2248 2500\u20135000), or high
                                        resolution (HR; m/\u0394m \u2248 10,000).
                                        Multi-resolution procedures assign individual
