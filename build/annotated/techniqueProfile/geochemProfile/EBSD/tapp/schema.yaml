$schema: https://json-schema.org/draft/2020-12/schema
title: Electron Backscatter Diffraction Technique-Aligned Procedure Profile (ebsdTAPP)
description: 'Electron backscatter diffraction extension of the base TAPP definition,
  for ADA''s SEMEBSDGrainImageMap component type. ONE laboratory instance: all 14
  distinct method-description documents behind 4305 references are from Curtin University,
  on a Tescan MIRA3 with an Oxford Instruments AZtec v5.1 Symmetry EBSD-EDS system.
  The native layer is seeded from those documents rather than from ADA subject fields,
  which carry no EBSD-specific property at all -- the 1354 records hold only channel1-3
  and imageType. Constant across all 14 and therefore protocol-level: 70 degree stage
  tilt, camera gain 2, a 1.2 degree maximum mean angular deviation and an XMax 150
  mm SDD detector. Generated from draftTAPPs/EBSD_TAPP_draft_v2.csv by tools/build_tapp.py.'
allOf:
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/tappDefinition/schema.yaml
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/core/schema.yaml#/$defs/ProcedureIdentification
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/ProcedureIdentification
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/calibrationFactor/schema.yaml#/$defs/ProcedureIdentification
- type: object
  properties:
    schema:creator:
      type: object
      properties:
        schema:description:
          description: 'Provenance of this TAPP definition: how the definition itself
            came to be, as distinct from the method it describes. Use it to state
            that the definition was transcribed from a published protocol, derived
            from existing metadata records rather than authored by the laboratory,
            or produced automatically and reviewed by a person. Optional -- a laboratory-authored
            TAPP needs nothing here. Recorded on schema:creator.schema:description.'
          type: string
          readOnly: true
      required:
      - schema:description
    ada:targetMaterial:
      description: General description of the material type(s) this procedure is designed
        to analyse.
      anyOf:
      - type: string
        enum:
        - Silicate mineral
        - Silicate glass
        - Oxide
        - Sulfide
        - Carbonate
        - Phosphate
        - Metal or alloy
        - Organic matter
        - Bulk regolith or soil
        - Meteorite (bulk)
        - Ice or hydrate
        - Synthetic analogue
        - N/A
        - None
        - missing
      - type: string
      readOnly: true
    schema:object:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              '@type':
                contains:
                  const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
            required:
            - '@type'
          then:
            properties:
              schema:additionalProperty:
                type: array
                items:
                  $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Procedure_preAnalysisImagingAndScreening
                allOf:
                - contains:
                    $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Procedure_preAnalysisImagingAndScreening
                  minContains: 0
                  maxContains: 1
    ada:instrumentManufacturer:
      description: Manufacturer of the instrument that performs the measurement, recorded
        as a controlled value. Where a procedure couples a sample-introduction system
        to an analysing instrument, this records the analysing instrument. Instrument
        Model gives the specific designation.
      type: string
      enum:
      - WITec
      - Renishaw
      - HORIBA
      - Bruker
      - Thermo Fisher Scientific
      - Custom-built
      - Unknown
      - N/A
      - None
      - missing
      readOnly: true
    ada:instrumentModel:
      description: Model designation of the instrument that performs the measurement,
        including any generation or configuration suffix. Conventionally written with
        the manufacturer name included; Instrument Manufacturer records the vendor
        separately, as a controlled value, so that procedures remain findable by vendor.
      type: string
      readOnly: true
    ada:constantsAndReferenceValuesUsedDefault:
      description: Physical constants and reference values used in data reduction
        to calculate the final reported quantity (e.g., decay constants for age calculation,
        standard isotope ratios, or other citable reference values used in a correction
        or calculation), together with their source. Distinct from the Group 6 reference-material
        fields, which document accepted values for specific calibration/validation
        materials rather than universal physical constants. Record "None" if no citable,
        revisable physical constants feed into this procedure's data reduction.
      type: string
    schema:instrument:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              schema:additionalType:
                contains:
                  const: SEM
                schema:inDefinedTermSet: ada:vocab/instrumentType
            required:
            - schema:additionalType
          then:
            properties:
              ada:acceleratingVoltageDefault:
                description: Electron beam accelerating voltage.
                anyOf:
                - type: number
                - type: string
              ada:beamCurrentDefault:
                description: Beam current at the sample.
                anyOf:
                - type: number
                - type: string
              schema:hasPart:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: EBSD Detector
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        ada:ebsdCameraSpeedSetting:
                          description: 'Named camera speed mode of the EBSD detector.
                            Recorded separately from the pattern resolution it implies:
                            the two are distinct settings even though the source states
                            them together as "Speed 1 (622 x 512 pixels)".'
                          anyOf:
                          - type: string
                            enum:
                            - Speed 1
                            - missing
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              enum:
                              - Speed 1
                              - missing
                              readOnly: true
                        ada:ebsdPatternResolution:
                          description: Pattern resolution in detector pixels, the
                            second half of the source's "Speed 1 (622 x 512 pixels)".
                          anyOf:
                          - type: string
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              readOnly: true
                        ada:ebsdCameraGain:
                          description: Gain applied to the EBSD camera.
                          anyOf:
                          - type: integer
                          - type: string
                          readOnly: true
                      required:
                      - ada:ebsdCameraGain
                      - ada:ebsdCameraSpeedSetting
                      - ada:ebsdPatternResolution
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: EDS Detector
                          schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:model:
                          type: object
                          properties:
                            schema:name:
                              description: EDS detector coupled to the EBSD system.
                              type: string
                              readOnly: true
                          required:
                          - schema:name
                      required:
                      - schema:model
                allOf:
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          const: EBSD Detector
                    required:
                    - schema:additionalType
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          const: EDS Detector
                        schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                    required:
                    - schema:additionalType
            required:
            - ada:acceleratingVoltageDefault
            - ada:beamCurrentDefault
      allOf:
      - contains:
          properties:
            schema:additionalType:
              contains:
                const: SEM
              schema:inDefinedTermSet: ada:vocab/instrumentType
          required:
          - schema:additionalType
    ada:stageTilt:
      description: Specimen tilt toward the EBSD detector.
      anyOf:
      - type: number
      - type: string
      readOnly: true
    schema:actionProcess:
      type: object
      properties:
        schema:step:
          type: array
          items:
            type: object
            allOf:
            - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/tappDefinition/schema.yaml#/$defs/WorkflowStep
            - if:
                properties:
                  schema:name:
                    const: Data reduction
                required:
                - schema:name
              then:
                properties:
                  ada:houghResolutionDefault:
                    description: Hough transform resolution used for band detection.
                    anyOf:
                    - type: integer
                    - type: string
                  ada:minimumBandsForIndexing:
                    description: Minimum number of Kikuchi bands required to index
                      a pattern.
                    anyOf:
                    - type: integer
                    - type: string
                    readOnly: true
                  ada:maximumMeanAngularDeviation:
                    description: Upper threshold on mean angular deviation (MAD) for
                      an accepted solution.
                    anyOf:
                    - type: number
                    - type: string
                    readOnly: true
                  ada:crystalStructureFileSourcesDefault:
                    description: Databases the match units / crystal structure files
                      were drawn from.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                required:
                - ada:crystalStructureFileSourcesDefault
                - ada:houghResolutionDefault
                - ada:maximumMeanAngularDeviation
                - ada:minimumBandsForIndexing
            - if:
                properties:
                  schema:name:
                    const: Data acquisition
                required:
                - schema:name
              then:
                properties:
                  ada:edsChannelsDefault:
                    description: Number of channels EDS spectra are collected on.
                    anyOf:
                    - type: integer
                    - type: string
                  ada:edsProcessTimeDefault:
                    description: AZtec process time setting for EDS.
                    anyOf:
                    - type: integer
                    - type: string
                required:
                - ada:edsChannelsDefault
                - ada:edsProcessTimeDefault
          allOf:
          - contains:
              properties:
                schema:name:
                  const: Data reduction
              required:
              - schema:name
          - contains:
              properties:
                schema:name:
                  const: Data acquisition
              required:
              - schema:name
  required:
  - ada:targetMaterial
  - ada:instrumentManufacturer
  - ada:instrumentModel
  - ada:constantsAndReferenceValuesUsedDefault
  - ada:stageTilt
