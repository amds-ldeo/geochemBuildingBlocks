$schema: https://json-schema.org/draft/2020-12/schema
title: ADA TIMS Product Profile
description: Path-driven technique-specific profile for ADA TIMS Product Profile.
  Extends the base ADA product profile with the TIMS analysis-instance detail on the
  schema:Dataset root, and pins the product type and the profile it declares conformance
  to.
allOf:
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/geochemProduct/schema.yaml
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/TIMS/detail/schema.yaml
- type: object
  properties:
    schema:additionalType:
      description: Must include a TIMS product type identifier.
      contains:
        enum:
        - Thermal ionization mass spectrometry
        - Thermal ionization mass spectrometry (TIMS)
      title: Product Type
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaTIMS
      title: About This Record
x-bblocks-metadata:
  itemIdentifier: ogch.techniqueProfile.geochemProfile.TIMS.profile
  register: https://amds-ldeo.github.io/geochemBuildingBlocks/build/register.json
  version: '0.1'
  dateOfLastChange: '2026-11-12'
