$schema: https://json-schema.org/draft/2020-12/schema
title: TEM Analysis Detail
description: Detail block for TEM hasPart items. Discriminates on ada:componentType,
  carries analysis-level required properties and an @id reference to a registered
  temTAPP definition, and per-dataset schema:additionalProperty entries constrained
  via $refs to the parameterValues registry plus a catch-all. Generated by tools/build_tapp.py.
allOf:
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/core/schema.yaml#/$defs/AnalysisIdentification
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/aggregation/schema.yaml#/$defs/AnalysisIdentification
- type: object
  properties:
    prov:wasGeneratedBy:
      type: array
      items:
        type: object
        properties:
          schema:actionProcess:
            type: object
            properties:
              schema:step:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:name:
                          const: Sample preparation
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items:
                            title: Sample Preparation Details
                            description: "Detailed description of section preparation
                              conditions: FIB milling voltages and currents; final
                              thinning conditions and target foil thickness; protective
                              coating type and deposition method (e.g., e-beam vs.
                              ion-beam Pt or C strip \u2014 e-beam deposition causes
                              less surface damage); any post-FIB surface cleanup (e.g.,
                              low-energy Ar+ ion polishing in a Fischione NanoMill,
                              final 0.5\u20132 kV Ga+ thinning); sample transfer and
                              storage environment (ambient air, dry N\u2082 atmosphere,
                              vacuum transfer holder, glovebox); plasma cleaning before
                              loading. Analysts record session-specific observations
                              and deviations from the procedure standard. Includes
                              preparation artifacts noted (Ga implantation, amorphization,
                              curtaining)."
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/temTAPP/samplePreparationDetails
                              '@type':
                                const:
                                - schema:PropertyValue
                              schema:propertyID:
                                const:
                                - '@id': ada:parameter/temTAPP/samplePreparationDetails
                              schema:name:
                                const: Sample Preparation Details
                              schema:value:
                                type: string
                            required:
                            - '@id'
                            - '@type'
                            - schema:propertyID
                            - schema:name
                            - schema:value
                          allOf:
                          - contains:
                              title: Sample Preparation Details
                              description: "Detailed description of section preparation
                                conditions: FIB milling voltages and currents; final
                                thinning conditions and target foil thickness; protective
                                coating type and deposition method (e.g., e-beam vs.
                                ion-beam Pt or C strip \u2014 e-beam deposition causes
                                less surface damage); any post-FIB surface cleanup
                                (e.g., low-energy Ar+ ion polishing in a Fischione
                                NanoMill, final 0.5\u20132 kV Ga+ thinning); sample
                                transfer and storage environment (ambient air, dry
                                N\u2082 atmosphere, vacuum transfer holder, glovebox);
                                plasma cleaning before loading. Analysts record session-specific
                                observations and deviations from the procedure standard.
                                Includes preparation artifacts noted (Ga implantation,
                                amorphization, curtaining)."
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/temTAPP/samplePreparationDetails
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/temTAPP/samplePreparationDetails
                                schema:name:
                                  const: Sample Preparation Details
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            minContains: 0
                            maxContains: 1
                  - if:
                      properties:
                        schema:name:
                          const: Data Reduction
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items:
                            anyOf:
                            - title: EELS Plural Scattering Correction
                              description: Method applied to correct for multiple
                                inelastic scattering events (plural scattering) that
                                broaden edge fine structure. Critical for specimens
                                thicker than ~0.5 inelastic mean free paths. Record
                                'N/A' where EELS is not listed in Spectroscopic Detector(s).
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/temTAPP/eelsPluralScatteringCorrection
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/temTAPP/eelsPluralScatteringCorrection
                                schema:name:
                                  const: EELS Plural Scattering Correction
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            - title: Image Processing Methods Applied
                              description: Image processing steps applied to TEM or
                                STEM images during or after acquisition. Non-linear
                                processing steps that could affect quantitative interpretation
                                should be documented explicitly.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/temTAPP/imageProcessingMethodsApplied
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/temTAPP/imageProcessingMethodsApplied
                                schema:name:
                                  const: Image Processing Methods Applied
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/calibrationFactor/schema.yaml#/$defs/Param_Analysis_calibrationFactorAndDeterminationMethod
                          allOf:
                          - contains:
                              title: EELS Plural Scattering Correction
                              description: Method applied to correct for multiple
                                inelastic scattering events (plural scattering) that
                                broaden edge fine structure. Critical for specimens
                                thicker than ~0.5 inelastic mean free paths. Record
                                'N/A' where EELS is not listed in Spectroscopic Detector(s).
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/temTAPP/eelsPluralScatteringCorrection
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/temTAPP/eelsPluralScatteringCorrection
                                schema:name:
                                  const: EELS Plural Scattering Correction
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            minContains: 0
                            maxContains: 1
                          - contains:
                              title: Image Processing Methods Applied
                              description: Image processing steps applied to TEM or
                                STEM images during or after acquisition. Non-linear
                                processing steps that could affect quantitative interpretation
                                should be documented explicitly.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/temTAPP/imageProcessingMethodsApplied
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/temTAPP/imageProcessingMethodsApplied
                                schema:name:
                                  const: Image Processing Methods Applied
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            minContains: 0
                            maxContains: 1
                          - contains:
                              $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/calibrationFactor/schema.yaml#/$defs/Param_Analysis_calibrationFactorAndDeterminationMethod
                            minContains: 0
                            maxContains: 1
                  - if:
                      properties:
                        schema:name:
                          const: Data reduction
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items:
                            $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/core/schema.yaml#/$defs/Param_Analysis_constantsReferenceValues
                          allOf:
                          - contains:
                              $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/core/schema.yaml#/$defs/Param_Analysis_constantsReferenceValues
                            minContains: 0
                            maxContains: 1
                allOf:
                - contains:
                    properties:
                      schema:name:
                        const: Data Reduction
                    required:
                    - schema:name
                - contains:
                    properties:
                      schema:name:
                        const: Data reduction
                    required:
                    - schema:name
          schema:additionalProperty:
            type: array
            items:
              anyOf:
              - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/targetSelection/schema.yaml#/$defs/Param_Analysis_targetSelectionCriteria
              - title: Sample Holder
                description: Type of specimen holder used. Cryo holders (liquid N2
                  to ~110 K) are critical for minimizing beam-induced damage to organic
                  matter and beam-sensitive phases. Heating holders enable in-situ
                  experiments.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/sampleHolder
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/sampleHolder
                  schema:name:
                    const: Sample Holder
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - title: Spectroscopic Detector(s)
                description: Spectroscopic detectors present and used under this procedure.
                  EDS and EELS parameter fields in Group 4 apply only when the corresponding
                  detector is listed here.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/spectroscopicDetector
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/spectroscopicDetector
                  schema:name:
                    const: Spectroscopic Detector(s)
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - title: Analytical Sub-mode
                description: 'Sub-mode(s) of imaging or diffraction performed under
                  this procedure. TEM Imaging options: BF-TEM, DF-TEM, HRTEM, EFTEM.
                  STEM Imaging options: HAADF, ABF, BF-STEM, ADF, MAADF. Electron
                  Diffraction options: SAED, CBED, Nanobeam diffraction, Precession
                  ED, 4D-STEM. Multiple values apply when the procedure covers more
                  than one sub-mode within a given analytical mode.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/analyticalSubMode
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/analyticalSubMode
                  schema:name:
                    const: Analytical Sub-mode
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - title: EFTEM Energy Window
                description: 'Energy window(s) used for EFTEM elemental mapping: center
                  energy, width, and acquisition method (three-window or jump-ratio).
                  Record ''N/A'' where EFTEM is not listed in Analytical Sub-mode.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eftemEnergyWindow
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/eftemEnergyWindow
                  schema:name:
                    const: EFTEM Energy Window
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - title: HAADF Collection Angles
                description: Inner and outer collection angles of the HAADF detector
                  in milliradians (mrad). The inner angle determines the boundary
                  between diffracted and thermally diffuse scattered electrons; larger
                  inner angles yield stronger Z-contrast and reduced Bragg contrast.
                  Inner angle is most critical and can be derived from camera length
                  and detector geometry. In HAADF-STEM a shorter camera length increases
                  the inner angle, yielding more thermally diffuse (Z-contrast) and
                  less Bragg-diffraction signal.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/haadfCollectionAngles
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/haadfCollectionAngles
                  schema:name:
                    const: HAADF Collection Angles
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - title: STEM Probe Diameter
                description: 'Nominal or measured diameter of the focused electron
                  probe at the sample, reported in nm. Serves as a direct spatial
                  resolution proxy for STEM imaging and STEM-EDS/EELS analysis. Related
                  to, but distinct from, Convergence Semi-Angle: the two quantities
                  are connected via aberration coefficients, defocus, and probe current,
                  which are not always published. Report whichever is known; if both
                  are known, report both fields. Also governs STEM-EDS and STEM-EELS
                  acquisition where those detectors are used.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemProbeDiameter
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/stemProbeDiameter
                  schema:name:
                    const: STEM Probe Diameter
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - title: STEM Probe Current
                description: Probe current in picoamperes (pA) or nanoamperes (nA).
                  Higher current improves EDS/EELS signal but increases beam damage
                  risk, especially for organic matter and hydrous minerals. Also governs
                  STEM-EDS and STEM-EELS acquisition where those detectors are used.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemProbeCurrent
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/stemProbeCurrent
                  schema:name:
                    const: STEM Probe Current
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - title: STEM Dwell Time per Pixel
                description: Time spent acquiring signal at each pixel during STEM
                  scanning in milliseconds. Longer dwell improves signal-to-noise
                  but increases total specimen dose; for dose-sensitive materials,
                  minimize dwell and compensate with frame averaging. Also governs
                  STEM-EDS and STEM-EELS acquisition where those detectors are used.
                  For 4D-STEM dwell time see '4D-STEM Dwell Time per Probe Position'.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemDwellTimePerPixel
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/stemDwellTimePerPixel
                  schema:name:
                    const: STEM Dwell Time per Pixel
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - title: STEM Scan Dimensions
                description: "Number of pixels in the STEM scan frame (X \xD7 Y pixels).
                  Combined with calibrated pixel size, defines the field of view.
                  Also governs STEM-EDS and STEM-EELS acquisition where those detectors
                  are used."
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemScanDimensions
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/stemScanDimensions
                  schema:name:
                    const: STEM Scan Dimensions
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - title: STEM Frame Averaging
                description: Number of frames averaged (with drift correction if applicable)
                  to produce the final STEM image. Averaging reduces noise while limiting
                  per-frame dose. Also governs STEM-EDS and STEM-EELS acquisition
                  where those detectors are used.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemFrameAveraging
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/stemFrameAveraging
                  schema:name:
                    const: STEM Frame Averaging
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - title: Camera Length
                description: "Nominal camera length in millimeters used for diffraction
                  pattern acquisition. Controls the mapping between reciprocal-space
                  scattering angle and detector position; must be calibrated to convert
                  pixel distances to d-spacings. In STEM mode, also sets HAADF/ABF
                  detector collection angles. Calibration to absolute d-spacings is
                  required \u2014 see 'Diffraction Calibration Reference'. Camera
                  length choice affects HAADF Z-contrast purity: a shorter camera
                  length (e.g. 30 mm) shifts the inner angle toward thermal diffuse
                  scatter; a longer one (e.g. 150 mm) admits more Bragg scatter."
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/cameraLength
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/cameraLength
                  schema:name:
                    const: Camera Length
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - title: Selected-Area Aperture Size
                description: Diameter of the selected-area aperture used in SAED mode,
                  defining the specimen region that contributes to the diffraction
                  pattern.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/selectedAreaApertureSize
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/selectedAreaApertureSize
                  schema:name:
                    const: Selected-Area Aperture Size
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - title: Precession Angle
                description: Precession semi-angle in degrees for precession electron
                  diffraction (PED). Hollow-cone illumination reduces dynamical diffraction
                  effects and produces more kinematical-like intensities. Not applicable
                  to SAED, CBED, or standard 4D-STEM. Record 'N/A' where Precession
                  ED is not listed in Analytical Sub-mode.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/precessionAngle
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/precessionAngle
                  schema:name:
                    const: Precession Angle
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - title: 4D-STEM Scan Grid and Area
                description: "Number of probe positions in the 4D-STEM dataset (scan
                  pixels \xD7 scan pixels) and the physical area covered. Probe step
                  size is the physical area divided by scan pixel count. Record 'N/A'
                  where 4D-STEM is not listed in Analytical Sub-mode."
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemScanGridAndArea4D
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/stemScanGridAndArea4D
                  schema:name:
                    const: 4D-STEM Scan Grid and Area
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - title: 4D-STEM Dwell Time per Probe Position
                description: Time spent acquiring each diffraction pattern in the
                  4D-STEM dataset in milliseconds. Longer dwell improves signal-to-noise
                  for weakly diffracting phases (e.g., smectite 001 reflection at
                  ~1.24 nm) but increases total specimen dose; risk of beam damage
                  to phyllosilicates and organic matter must be balanced against data
                  quality. Record 'N/A' where 4D-STEM is not listed in Analytical
                  Sub-mode.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemDwellTimePerProbePosition4D
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/stemDwellTimePerProbePosition4D
                  schema:name:
                    const: 4D-STEM Dwell Time per Probe Position
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - title: Diffraction Camera Length Calibration Method
                description: Method used to calibrate the camera length constant and
                  convert pixel distances in diffraction patterns to d-spacings or
                  reciprocal lattice vectors.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/diffractionCameraLengthCalibrationMethod
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/diffractionCameraLengthCalibrationMethod
                  schema:name:
                    const: Diffraction Camera Length Calibration Method
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - title: EDS Acquisition Mode
                description: Mode of EDS data acquisition. Record 'N/A' where EDS
                  is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/edsAcquisitionMode
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/edsAcquisitionMode
                  schema:name:
                    const: EDS Acquisition Mode
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - title: EDS Live Time per Point or Pixel
                description: EDS spectral acquisition live time per analysis point
                  (point/line mode) or per pixel (spectrum image) in seconds. Also
                  referred to as "EDS Acquisition Time" in EPMA and some SEM-EDS contexts,
                  where the per-pixel distinction is less relevant. Record 'N/A' where
                  EDS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/edsLiveTimePerPointOrPixel
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/edsLiveTimePerPointOrPixel
                  schema:name:
                    const: EDS Live Time per Point or Pixel
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - title: EDS Energy Range
                description: Energy range of EDS spectrum acquisition in keV. Record
                  'N/A' where EDS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/edsEnergyRange
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/edsEnergyRange
                  schema:name:
                    const: EDS Energy Range
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - title: EELS Acquisition Mode
                description: Mode of EELS data acquisition. Record 'N/A' where EELS
                  is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsAcquisitionMode
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/eelsAcquisitionMode
                  schema:name:
                    const: EELS Acquisition Mode
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - title: EELS Edges
                description: 'Ionization edge(s) acquired by EELS, specified by element
                  symbol and edge label (e.g., Fe L2,3; O K). Provides the EELS-specific
                  counterpart to the Analyte field: while Analyte lists elements,
                  EELS Edges documents which ionization edges were used and their
                  approximate energy loss positions. The procedure registers the full
                  intended edge suite; analysts confirm or narrow this list at analysis
                  time. Record ''N/A'' where EELS is not listed in Spectroscopic Detector(s).'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsEdges
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/eelsEdges
                  schema:name:
                    const: EELS Edges
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - title: EELS Acquisition Time per Spectrum
                description: Exposure time per individual EELS spectrum (or per pixel
                  for spectrum images) in seconds. Record 'N/A' where EELS is not
                  listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsAcquisitionTimePerSpectrum
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/eelsAcquisitionTimePerSpectrum
                  schema:name:
                    const: EELS Acquisition Time per Spectrum
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - title: EELS Energy Loss Range
                description: Energy loss range acquired, defined by onset energy and
                  width in eV. The procedure documents the target range for the registered
                  analyte edges; analysts record the actual range acquired. Record
                  'N/A' where EELS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsEnergyLossRange
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/eelsEnergyLossRange
                  schema:name:
                    const: EELS Energy Loss Range
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - title: Specimen Thickness Determination Method
                description: Method used to estimate TEM foil thickness. Required
                  for EELS quantification (log-ratio) and for assessing multiple-scattering
                  severity.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/specimenThicknessDeterminationMethod
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/specimenThicknessDeterminationMethod
                  schema:name:
                    const: Specimen Thickness Determination Method
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - title: EDS Calibration Standard(s)
                description: Reference material(s) used to validate EDS quantification
                  or determine experimental k-factors or zeta-factors. TEM-EDS is
                  less standardized than EPMA; many procedures rely on manufacturer
                  k-factors without external calibration. Record 'N/A' where EDS is
                  not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/edsCalibrationStandard
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/edsCalibrationStandard
                  schema:name:
                    const: EDS Calibration Standard(s)
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - title: EELS Energy Calibration
                description: Method and reference used to calibrate the EELS energy
                  axis. Accurate calibration is required for ELNES edge identification,
                  chemical-state analysis, and inter-lab comparability. Record 'N/A'
                  where EELS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsEnergyCalibration
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/eelsEnergyCalibration
                  schema:name:
                    const: EELS Energy Calibration
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - title: Diffraction Calibration Reference
                description: "Reference material or internal standard used to calibrate
                  the electron diffraction camera constant (camera length \xD7 electron
                  wavelength), enabling conversion of pixel distances to d-spacings."
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/diffractionCalibrationReference
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/diffractionCalibrationReference
                  schema:name:
                    const: Diffraction Calibration Reference
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - title: EDS Detection Limit
                description: Estimated detection limits by EDS under this procedure's
                  conditions, one per reported concentration variable (one per analyte,
                  these being the same set). Record 'N/A' where EDS is not listed
                  in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/edsDetectionLimit
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/edsDetectionLimit
                  schema:name:
                    const: EDS Detection Limit
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - title: EDS Counting Statistics / Accumulation Criterion
                description: Quality criterion used to determine when sufficient EDS
                  signal has been accumulated for a given pixel or point, in lieu
                  of or in addition to a fixed live time. Expressed as a target relative
                  uncertainty on major-element peak counts achieved by accumulating
                  successive scan frames (e.g., "1% counting statistics on major elements";
                  ">10% counting statistics"). Distinct from EDS Live Time per Point
                  or Pixel, which records a fixed-duration setting. Record 'N/A' where
                  EDS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/edsCountingStatisticsAccumulationCriterion
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/edsCountingStatisticsAccumulationCriterion
                  schema:name:
                    const: EDS Counting Statistics / Accumulation Criterion
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
            allOf:
            - contains:
                $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/targetSelection/schema.yaml#/$defs/Param_Analysis_targetSelectionCriteria
              minContains: 0
              maxContains: 1
            - contains:
                title: Sample Holder
                description: Type of specimen holder used. Cryo holders (liquid N2
                  to ~110 K) are critical for minimizing beam-induced damage to organic
                  matter and beam-sensitive phases. Heating holders enable in-situ
                  experiments.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/sampleHolder
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/sampleHolder
                  schema:name:
                    const: Sample Holder
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              minContains: 0
              maxContains: 1
            - contains:
                title: Spectroscopic Detector(s)
                description: Spectroscopic detectors present and used under this procedure.
                  EDS and EELS parameter fields in Group 4 apply only when the corresponding
                  detector is listed here.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/spectroscopicDetector
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/spectroscopicDetector
                  schema:name:
                    const: Spectroscopic Detector(s)
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              minContains: 0
              maxContains: 1
            - contains:
                title: Analytical Sub-mode
                description: 'Sub-mode(s) of imaging or diffraction performed under
                  this procedure. TEM Imaging options: BF-TEM, DF-TEM, HRTEM, EFTEM.
                  STEM Imaging options: HAADF, ABF, BF-STEM, ADF, MAADF. Electron
                  Diffraction options: SAED, CBED, Nanobeam diffraction, Precession
                  ED, 4D-STEM. Multiple values apply when the procedure covers more
                  than one sub-mode within a given analytical mode.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/analyticalSubMode
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/analyticalSubMode
                  schema:name:
                    const: Analytical Sub-mode
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              minContains: 0
              maxContains: 1
            - contains:
                title: EFTEM Energy Window
                description: 'Energy window(s) used for EFTEM elemental mapping: center
                  energy, width, and acquisition method (three-window or jump-ratio).
                  Record ''N/A'' where EFTEM is not listed in Analytical Sub-mode.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eftemEnergyWindow
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/eftemEnergyWindow
                  schema:name:
                    const: EFTEM Energy Window
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              minContains: 0
              maxContains: 1
            - contains:
                title: HAADF Collection Angles
                description: Inner and outer collection angles of the HAADF detector
                  in milliradians (mrad). The inner angle determines the boundary
                  between diffracted and thermally diffuse scattered electrons; larger
                  inner angles yield stronger Z-contrast and reduced Bragg contrast.
                  Inner angle is most critical and can be derived from camera length
                  and detector geometry. In HAADF-STEM a shorter camera length increases
                  the inner angle, yielding more thermally diffuse (Z-contrast) and
                  less Bragg-diffraction signal.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/haadfCollectionAngles
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/haadfCollectionAngles
                  schema:name:
                    const: HAADF Collection Angles
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              minContains: 0
              maxContains: 1
            - contains:
                title: STEM Probe Diameter
                description: 'Nominal or measured diameter of the focused electron
                  probe at the sample, reported in nm. Serves as a direct spatial
                  resolution proxy for STEM imaging and STEM-EDS/EELS analysis. Related
                  to, but distinct from, Convergence Semi-Angle: the two quantities
                  are connected via aberration coefficients, defocus, and probe current,
                  which are not always published. Report whichever is known; if both
                  are known, report both fields. Also governs STEM-EDS and STEM-EELS
                  acquisition where those detectors are used.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemProbeDiameter
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/stemProbeDiameter
                  schema:name:
                    const: STEM Probe Diameter
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              minContains: 0
              maxContains: 1
            - contains:
                title: STEM Probe Current
                description: Probe current in picoamperes (pA) or nanoamperes (nA).
                  Higher current improves EDS/EELS signal but increases beam damage
                  risk, especially for organic matter and hydrous minerals. Also governs
                  STEM-EDS and STEM-EELS acquisition where those detectors are used.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemProbeCurrent
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/stemProbeCurrent
                  schema:name:
                    const: STEM Probe Current
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              minContains: 0
              maxContains: 1
            - contains:
                title: STEM Dwell Time per Pixel
                description: Time spent acquiring signal at each pixel during STEM
                  scanning in milliseconds. Longer dwell improves signal-to-noise
                  but increases total specimen dose; for dose-sensitive materials,
                  minimize dwell and compensate with frame averaging. Also governs
                  STEM-EDS and STEM-EELS acquisition where those detectors are used.
                  For 4D-STEM dwell time see '4D-STEM Dwell Time per Probe Position'.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemDwellTimePerPixel
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/stemDwellTimePerPixel
                  schema:name:
                    const: STEM Dwell Time per Pixel
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              minContains: 0
              maxContains: 1
            - contains:
                title: STEM Scan Dimensions
                description: "Number of pixels in the STEM scan frame (X \xD7 Y pixels).
                  Combined with calibrated pixel size, defines the field of view.
                  Also governs STEM-EDS and STEM-EELS acquisition where those detectors
                  are used."
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemScanDimensions
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/stemScanDimensions
                  schema:name:
                    const: STEM Scan Dimensions
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              minContains: 0
              maxContains: 1
            - contains:
                title: STEM Frame Averaging
                description: Number of frames averaged (with drift correction if applicable)
                  to produce the final STEM image. Averaging reduces noise while limiting
                  per-frame dose. Also governs STEM-EDS and STEM-EELS acquisition
                  where those detectors are used.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemFrameAveraging
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/stemFrameAveraging
                  schema:name:
                    const: STEM Frame Averaging
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              minContains: 0
              maxContains: 1
            - contains:
                title: Camera Length
                description: "Nominal camera length in millimeters used for diffraction
                  pattern acquisition. Controls the mapping between reciprocal-space
                  scattering angle and detector position; must be calibrated to convert
                  pixel distances to d-spacings. In STEM mode, also sets HAADF/ABF
                  detector collection angles. Calibration to absolute d-spacings is
                  required \u2014 see 'Diffraction Calibration Reference'. Camera
                  length choice affects HAADF Z-contrast purity: a shorter camera
                  length (e.g. 30 mm) shifts the inner angle toward thermal diffuse
                  scatter; a longer one (e.g. 150 mm) admits more Bragg scatter."
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/cameraLength
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/cameraLength
                  schema:name:
                    const: Camera Length
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              minContains: 0
              maxContains: 1
            - contains:
                title: Selected-Area Aperture Size
                description: Diameter of the selected-area aperture used in SAED mode,
                  defining the specimen region that contributes to the diffraction
                  pattern.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/selectedAreaApertureSize
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/selectedAreaApertureSize
                  schema:name:
                    const: Selected-Area Aperture Size
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              minContains: 0
              maxContains: 1
            - contains:
                title: Precession Angle
                description: Precession semi-angle in degrees for precession electron
                  diffraction (PED). Hollow-cone illumination reduces dynamical diffraction
                  effects and produces more kinematical-like intensities. Not applicable
                  to SAED, CBED, or standard 4D-STEM. Record 'N/A' where Precession
                  ED is not listed in Analytical Sub-mode.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/precessionAngle
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/precessionAngle
                  schema:name:
                    const: Precession Angle
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              minContains: 0
              maxContains: 1
            - contains:
                title: 4D-STEM Scan Grid and Area
                description: "Number of probe positions in the 4D-STEM dataset (scan
                  pixels \xD7 scan pixels) and the physical area covered. Probe step
                  size is the physical area divided by scan pixel count. Record 'N/A'
                  where 4D-STEM is not listed in Analytical Sub-mode."
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemScanGridAndArea4D
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/stemScanGridAndArea4D
                  schema:name:
                    const: 4D-STEM Scan Grid and Area
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              minContains: 0
              maxContains: 1
            - contains:
                title: 4D-STEM Dwell Time per Probe Position
                description: Time spent acquiring each diffraction pattern in the
                  4D-STEM dataset in milliseconds. Longer dwell improves signal-to-noise
                  for weakly diffracting phases (e.g., smectite 001 reflection at
                  ~1.24 nm) but increases total specimen dose; risk of beam damage
                  to phyllosilicates and organic matter must be balanced against data
                  quality. Record 'N/A' where 4D-STEM is not listed in Analytical
                  Sub-mode.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemDwellTimePerProbePosition4D
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/stemDwellTimePerProbePosition4D
                  schema:name:
                    const: 4D-STEM Dwell Time per Probe Position
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              minContains: 0
              maxContains: 1
            - contains:
                title: Diffraction Camera Length Calibration Method
                description: Method used to calibrate the camera length constant and
                  convert pixel distances in diffraction patterns to d-spacings or
                  reciprocal lattice vectors.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/diffractionCameraLengthCalibrationMethod
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/diffractionCameraLengthCalibrationMethod
                  schema:name:
                    const: Diffraction Camera Length Calibration Method
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              minContains: 0
              maxContains: 1
            - contains:
                title: EDS Acquisition Mode
                description: Mode of EDS data acquisition. Record 'N/A' where EDS
                  is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/edsAcquisitionMode
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/edsAcquisitionMode
                  schema:name:
                    const: EDS Acquisition Mode
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              minContains: 0
              maxContains: 1
            - contains:
                title: EDS Live Time per Point or Pixel
                description: EDS spectral acquisition live time per analysis point
                  (point/line mode) or per pixel (spectrum image) in seconds. Also
                  referred to as "EDS Acquisition Time" in EPMA and some SEM-EDS contexts,
                  where the per-pixel distinction is less relevant. Record 'N/A' where
                  EDS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/edsLiveTimePerPointOrPixel
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/edsLiveTimePerPointOrPixel
                  schema:name:
                    const: EDS Live Time per Point or Pixel
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              minContains: 0
              maxContains: 1
            - contains:
                title: EDS Energy Range
                description: Energy range of EDS spectrum acquisition in keV. Record
                  'N/A' where EDS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/edsEnergyRange
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/edsEnergyRange
                  schema:name:
                    const: EDS Energy Range
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              minContains: 0
              maxContains: 1
            - contains:
                title: EELS Acquisition Mode
                description: Mode of EELS data acquisition. Record 'N/A' where EELS
                  is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsAcquisitionMode
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/eelsAcquisitionMode
                  schema:name:
                    const: EELS Acquisition Mode
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              minContains: 0
              maxContains: 1
            - contains:
                title: EELS Edges
                description: 'Ionization edge(s) acquired by EELS, specified by element
                  symbol and edge label (e.g., Fe L2,3; O K). Provides the EELS-specific
                  counterpart to the Analyte field: while Analyte lists elements,
                  EELS Edges documents which ionization edges were used and their
                  approximate energy loss positions. The procedure registers the full
                  intended edge suite; analysts confirm or narrow this list at analysis
                  time. Record ''N/A'' where EELS is not listed in Spectroscopic Detector(s).'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsEdges
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/eelsEdges
                  schema:name:
                    const: EELS Edges
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              minContains: 0
              maxContains: 1
            - contains:
                title: EELS Acquisition Time per Spectrum
                description: Exposure time per individual EELS spectrum (or per pixel
                  for spectrum images) in seconds. Record 'N/A' where EELS is not
                  listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsAcquisitionTimePerSpectrum
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/eelsAcquisitionTimePerSpectrum
                  schema:name:
                    const: EELS Acquisition Time per Spectrum
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              minContains: 0
              maxContains: 1
            - contains:
                title: EELS Energy Loss Range
                description: Energy loss range acquired, defined by onset energy and
                  width in eV. The procedure documents the target range for the registered
                  analyte edges; analysts record the actual range acquired. Record
                  'N/A' where EELS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsEnergyLossRange
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/eelsEnergyLossRange
                  schema:name:
                    const: EELS Energy Loss Range
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              minContains: 0
              maxContains: 1
            - contains:
                title: Specimen Thickness Determination Method
                description: Method used to estimate TEM foil thickness. Required
                  for EELS quantification (log-ratio) and for assessing multiple-scattering
                  severity.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/specimenThicknessDeterminationMethod
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/specimenThicknessDeterminationMethod
                  schema:name:
                    const: Specimen Thickness Determination Method
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              minContains: 0
              maxContains: 1
            - contains:
                title: EDS Calibration Standard(s)
                description: Reference material(s) used to validate EDS quantification
                  or determine experimental k-factors or zeta-factors. TEM-EDS is
                  less standardized than EPMA; many procedures rely on manufacturer
                  k-factors without external calibration. Record 'N/A' where EDS is
                  not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/edsCalibrationStandard
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/edsCalibrationStandard
                  schema:name:
                    const: EDS Calibration Standard(s)
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              minContains: 0
              maxContains: 1
            - contains:
                title: EELS Energy Calibration
                description: Method and reference used to calibrate the EELS energy
                  axis. Accurate calibration is required for ELNES edge identification,
                  chemical-state analysis, and inter-lab comparability. Record 'N/A'
                  where EELS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsEnergyCalibration
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/eelsEnergyCalibration
                  schema:name:
                    const: EELS Energy Calibration
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              minContains: 0
              maxContains: 1
            - contains:
                title: Diffraction Calibration Reference
                description: "Reference material or internal standard used to calibrate
                  the electron diffraction camera constant (camera length \xD7 electron
                  wavelength), enabling conversion of pixel distances to d-spacings."
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/diffractionCalibrationReference
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/diffractionCalibrationReference
                  schema:name:
                    const: Diffraction Calibration Reference
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              minContains: 0
              maxContains: 1
            - contains:
                title: EDS Detection Limit
                description: Estimated detection limits by EDS under this procedure's
                  conditions, one per reported concentration variable (one per analyte,
                  these being the same set). Record 'N/A' where EDS is not listed
                  in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/edsDetectionLimit
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/edsDetectionLimit
                  schema:name:
                    const: EDS Detection Limit
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              minContains: 0
              maxContains: 1
            - contains:
                title: EDS Counting Statistics / Accumulation Criterion
                description: Quality criterion used to determine when sufficient EDS
                  signal has been accumulated for a given pixel or point, in lieu
                  of or in addition to a fixed live time. Expressed as a target relative
                  uncertainty on major-element peak counts achieved by accumulating
                  successive scan frames (e.g., "1% counting statistics on major elements";
                  ">10% counting statistics"). Distinct from EDS Live Time per Point
                  or Pixel, which records a fixed-duration setting. Record 'N/A' where
                  EDS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/edsCountingStatisticsAccumulationCriterion
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/edsCountingStatisticsAccumulationCriterion
                  schema:name:
                    const: EDS Counting Statistics / Accumulation Criterion
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              minContains: 0
              maxContains: 1
          schema:object:
            type: array
            items:
              type: object
              allOf:
              - if:
                  properties:
                    '@type':
                      contains:
                        const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                  required:
                  - '@type'
                then:
                  properties:
                    schema:additionalProperty:
                      type: array
                      items:
                        $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/targetSelection/schema.yaml#/$defs/Param_Analysis_preAnalysisImagingAndScreening
                      allOf:
                      - contains:
                          $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/targetSelection/schema.yaml#/$defs/Param_Analysis_preAnalysisImagingAndScreening
                        minContains: 0
                        maxContains: 1
          prov:used:
            type: array
            items:
              type: object
              allOf:
              - if:
                  required:
                  - bios:computationalTool
                then:
                  properties:
                    bios:computationalTool:
                      type: array
                      items:
                        allOf:
                        - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/geochemProduct/schema.yaml#/$defs/UsedComputationalTool
                        - type: object
                          allOf:
                          - if:
                              properties:
                                ada:toolRole:
                                  const: dataReduction
                              required:
                              - ada:toolRole
                            then:
                              properties:
                                schema:name:
                                  description: Software used to simulate electron
                                    diffraction patterns for comparison with experimental
                                    SAED patterns during phase identification (e.g.,
                                    SingleCrystal, CrystalMaker, JEMS, DIFPACK). Complements
                                    the Acquisition Software field, which covers data
                                    collection; simulation software is used at the
                                    interpretation and data processing step.
                                  anyOf:
                                  - type: string
                                  - type: array
                                    items:
                                      type: string
                          required:
                          - ada:toolRole
              - if:
                  required:
                  - schema:instrument
                then:
                  properties:
                    schema:instrument:
                      type: array
                      items:
                        allOf:
                        - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/instrument/schema.yaml
                        - type: object
                          allOf:
                          - if:
                              properties:
                                schema:additionalType:
                                  contains:
                                    const: TEM
                                  schema:inDefinedTermSet: ada:vocab/instrumentType
                              required:
                              - schema:additionalType
                            then:
                              properties:
                                schema:additionalProperty:
                                  type: array
                                  items:
                                    title: Accelerating Voltage
                                    description: "Electron beam accelerating voltage
                                      in kilovolts (kV). For beam-sensitive materials
                                      (organic matter, phyllosilicates), 60\u201380
                                      kV may be used to stay below the displacement
                                      threshold for C, N, O, and S. The procedure
                                      specifies the standard operating voltage; analysts
                                      record and justify deviations. Key parameter
                                      for the beam damage regime."
                                    type: object
                                    properties:
                                      '@id':
                                        const: ada:parameter/temTAPP/acceleratingVoltage
                                      '@type':
                                        const:
                                        - schema:PropertyValue
                                      schema:propertyID:
                                        const:
                                        - '@id': ada:parameter/temTAPP/acceleratingVoltage
                                      schema:name:
                                        const: Accelerating Voltage
                                      schema:value:
                                        anyOf:
                                        - type: number
                                        - type: string
                                      schema:unitText:
                                        type: string
                                    required:
                                    - '@id'
                                    - '@type'
                                    - schema:propertyID
                                    - schema:name
                                    - schema:value
                                    - schema:unitText
                                  allOf:
                                  - contains:
                                      title: Accelerating Voltage
                                      description: "Electron beam accelerating voltage
                                        in kilovolts (kV). For beam-sensitive materials
                                        (organic matter, phyllosilicates), 60\u201380
                                        kV may be used to stay below the displacement
                                        threshold for C, N, O, and S. The procedure
                                        specifies the standard operating voltage;
                                        analysts record and justify deviations. Key
                                        parameter for the beam damage regime."
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/temTAPP/acceleratingVoltage
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/temTAPP/acceleratingVoltage
                                        schema:name:
                                          const: Accelerating Voltage
                                        schema:value:
                                          anyOf:
                                          - type: number
                                          - type: string
                                        schema:unitText:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                      - schema:unitText
                                    minContains: 0
                                    maxContains: 1
                      allOf:
                      - contains:
                          properties:
                            schema:additionalType:
                              contains:
                                const: TEM
                              schema:inDefinedTermSet: ada:vocab/instrumentType
                          required:
                          - schema:additionalType
          schema:used:
            type: object
            properties:
              schema:instrument:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: TEM
                          schema:inDefinedTermSet: ada:vocab/instrumentType
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items:
                            title: TEM Objective Aperture
                            description: Objective aperture diameter used to select
                              the imaging beam condition in TEM mode. In BF-TEM, a
                              small aperture blocks diffracted beams to enhance mass-thickness
                              contrast; in DF-TEM, the aperture is displaced to select
                              a specific diffracted beam; in HRTEM, no aperture is
                              typically used.
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/temTAPP/temObjectiveAperture
                              '@type':
                                const:
                                - schema:PropertyValue
                              schema:propertyID:
                                const:
                                - '@id': ada:parameter/temTAPP/temObjectiveAperture
                              schema:name:
                                const: TEM Objective Aperture
                              schema:value:
                                type: string
                            required:
                            - '@id'
                            - '@type'
                            - schema:propertyID
                            - schema:name
                            - schema:value
                          allOf:
                          - contains:
                              title: TEM Objective Aperture
                              description: Objective aperture diameter used to select
                                the imaging beam condition in TEM mode. In BF-TEM,
                                a small aperture blocks diffracted beams to enhance
                                mass-thickness contrast; in DF-TEM, the aperture is
                                displaced to select a specific diffracted beam; in
                                HRTEM, no aperture is typically used.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/temTAPP/temObjectiveAperture
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/temTAPP/temObjectiveAperture
                                schema:name:
                                  const: TEM Objective Aperture
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            minContains: 0
                            maxContains: 1
          ada:deadTime:
            description: "Percent dead time reported by the EDS detector during the
              session \u2014 the fraction of total acquisition time the detector spent
              processing rather than counting. EDS dead time correction is managed
              automatically by the detector electronics; this field documents the
              resulting percentage as a session QC metric. Values above ~40% indicate
              excessive count rate and may degrade spectral quality and quantitative
              accuracy. Record 'N/A' where EDS is not listed in Spectroscopic Detector(s)."
            anyOf:
            - type: number
            - type: string
    schema:variableMeasured:
      type: array
      items:
        type: object
      allOf:
      - contains:
          title: Calibration Factor and Determination Method
          description: 'An externally-calibrated factor that converts the measured
            quantity into the reported quantity, how it was determined, and its uncertainty.
            Applies where the conversion depends on a factor calibrated against a
            reference of independently known value, rather than on the instrument
            response alone. Distinct from the fields that name the calibration material
            and that state which approach applies to which analyte, where the technique
            has them: this field records the resulting factor itself.'
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/calibrationFactorAndDeterminationMethod
            '@type':
              const:
              - schema:PropertyValue
              - cdi:InstanceVariable
            schema:propertyID:
              const:
              - '@id': ada:parameter/temTAPP/calibrationFactorAndDeterminationMethod
            schema:name:
              const: Calibration Factor and Determination Method
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
        minContains: 0
        maxContains: 1
      - contains:
          title: EDS Detection Limit
          description: Estimated detection limits by EDS under this procedure's conditions,
            one per reported concentration variable (one per analyte, these being
            the same set). Record 'N/A' where EDS is not listed in Spectroscopic Detector(s).
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/edsDetectionLimit
            '@type':
              const:
              - schema:PropertyValue
              - cdi:InstanceVariable
            schema:propertyID:
              const:
              - '@id': ada:parameter/temTAPP/edsDetectionLimit
            schema:name:
              const: EDS Detection Limit
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
        minContains: 0
        maxContains: 1
      - contains:
          properties:
            schema:name:
              const: sensitivityDetectionLimit
          required:
          - schema:name
