                  const: eelsBackgroundSubtractionMethod
                schema:name:
                  const: EELS Background Subtraction Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  anyOf:
                  - type: string
                  - type: array
                    items:
                      type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - title: EELS Detection Limit
              description: Estimated detection limit or minimum detectable concentration
                for target edges under this procedure. Record 'N/A' where EELS is
                not listed in Spectroscopic Detector(s).
              type: object
              properties:
                '@id':
                  const: ada:channelColumn/temTAPP/eelsDetectionLimit
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: eelsDetectionLimit
                schema:name:
                  const: EELS Detection Limit
                ada:dataType:
                  const: number
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  anyOf:
                  - anyOf:
                    - type: number
                    - type: string
                  - type: array
                    items:
                      anyOf:
                      - type: number
                      - type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
          allOf:
          - contains:
              title: EELS Background Subtraction Method
              description: Method used to subtract the background beneath the ionization
                edge of interest to extract the net edge signal. Record 'N/A' where
                EELS is not listed in Spectroscopic Detector(s).
              type: object
              properties:
                '@id':
                  const: ada:channelColumn/temTAPP/eelsBackgroundSubtractionMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: eelsBackgroundSubtractionMethod
                schema:name:
                  const: EELS Background Subtraction Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  anyOf:
                  - type: string
                  - type: array
                    items:
                      type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            minContains: 0
            maxContains: 1
          - contains:
              title: EELS Detection Limit
              description: Estimated detection limit or minimum detectable concentration
                for target edges under this procedure. Record 'N/A' where EELS is
                not listed in Spectroscopic Detector(s).
              type: object
              properties:
                '@id':
                  const: ada:channelColumn/temTAPP/eelsDetectionLimit
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: eelsDetectionLimit
                schema:name:
                  const: EELS Detection Limit
                ada:dataType:
                  const: number
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  anyOf:
                  - anyOf:
                    - type: number
                    - type: string
                  - type: array
                    items:
                      anyOf:
                      - type: number
                      - type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            minContains: 0
            maxContains: 1
