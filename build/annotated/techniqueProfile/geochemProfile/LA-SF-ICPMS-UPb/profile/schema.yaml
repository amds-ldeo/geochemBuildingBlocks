$schema: https://json-schema.org/draft/2020-12/schema
title: ADA LA-SF-ICP-MS U-Pb Geochronology Product Profile
description: Path-driven technique-specific profile for ADA LA-SF-ICP-MS U-Pb Geochronology
  Product Profile. Extends the base ADA product profile with the LASFICPMSUPB analysis-instance
  detail on the schema:Dataset root, and pins the product type and the profile it
  declares conformance to.
allOf:
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/geochemProduct/schema.yaml
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/LA-SF-ICPMS-UPb/detail/schema.yaml
- type: object
  properties:
    schema:additionalType:
      description: Must include a LASFICPMSUPB product type identifier.
      contains:
        enum:
        - Laser Ablation Inductively coupled plasma mass spectrometry
        - Laser Ablation Sector-Field Inductively Coupled Plasma Mass Spectrometry
          (LASFICPMS) Processed
        - Laser Ablation Sector-Field Inductively Coupled Plasma Mass Spectrometry
      title: Product Type
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaLASFICPMSUPb
      title: About This Record
