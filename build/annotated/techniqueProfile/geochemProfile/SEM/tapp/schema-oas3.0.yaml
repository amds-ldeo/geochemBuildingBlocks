      prov:wasDerivedFrom:
        description: Brief information about sources of data used in aggregate datasets
        type: array
        items:
          $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.profiles.cdifProfile.cdifCore/$defs/DerivedFrom
      schema:subjectOf:
        x-jsonld-id: http://schema.org/subjectOf
        allOf:
        - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.profiles.cdifProfile.cdifCore/$defs/CdifCatalogRecord
    allOf:
    - properties:
        schema:subjectOf:
          properties:
            dcterms:conformsTo:
              contains:
                type: object
                required:
                - '@id'
                additionalProperties: false
                properties:
                  '@id':
                    enum:
                    - https://w3id.org/cdif/core/1.1
          x-jsonld-id: http://schema.org/subjectOf
    - required:
      - '@id'
      - '@type'
      - '@context'
      - schema:name
      - schema:identifier
      - schema:dateModified
      - schema:subjectOf
    - anyOf:
