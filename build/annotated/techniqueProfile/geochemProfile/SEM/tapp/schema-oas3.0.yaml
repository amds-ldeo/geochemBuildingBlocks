      DerivedFrom:
        $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.provProperties.derivedFrom
      CdifCatalogRecord:
