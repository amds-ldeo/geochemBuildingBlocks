  cdif.bbr.metadata.schemaorgProperties.identifier:
    description: 'Properties for a schema.org identifier (schema:PropertyValue pattern).

      **Union-type policy:** In CDIF profile UML models an attribute typed as

      schema:Identifier / schema:PropertyValue is represented by a single attribute

      of that class type. The JSON Schema implementation permits the property value

      to be EITHER a plain string (interpreted as the bare identifier value) OR a

      full schema:PropertyValue object (with explicit @type, propertyID, value).

      Consumers should accept either form.

      '
    type: object
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          enum:
          - schema:PropertyValue
        minItems: 1
      schema:propertyID:
        anyOf:
        - type: string
        - type: object
          additionalProperties: false
          required:
          - '@id'
          properties:
            '@id':
              type: string
        description: In this context for the schema:PropertyValue, this field is an
          identifier for the identifier schema, e.g. DOI, ARK.  Get values from https://registry.identifiers.org/registry/
          for interoperability. URI-shape values MUST be serialized as JSON-LD IRI
          references ({"@id":"..."}) so they participate in RDF entailment; free-label
          strings remain valid as strings.
        x-jsonld-id: http://schema.org/propertyID
      schema:value:
        type: string
        description: the identifier string. E.g. 10.5066/F7VX0DMQ
        x-jsonld-id: http://schema.org/value
      schema:url:
        type: string
        format: uri
        description: 'web-resolveable string for the identifier; host name part is
          location of a resolver that will return some representation for the given
          identifier value. E.g. https://doi.org/10.5066/F7VX0DMQ '
        x-jsonld-id: http://schema.org/url
    allOf:
    - required:
      - '@type'
    - anyOf:
      - required:
        - schema:value
      - required:
        - schema:url
    x-jsonld-prefixes:
      schema: http://schema.org/
    x-schema-source: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/schemaorgProperties/identifier/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
  cdif.bbr.metadata.schemaorgProperties.definedTerm:
    description: "schema.org Defined Term schema.\n\n**Union-type policy:** In CDIF
      profile UML models an attribute typed as\nschema:DefinedTerm is represented
      by a single attribute of that class type.\nThe JSON Schema implementation permits
      the property value to be EITHER a\nplain string (interpreted as schema:name
      or schema:termCode in the default\nvocabulary) OR a full schema:DefinedTerm
      object (with explicit @type, name,\nidentifier, termCode, inDefinedTermSet).
      Consumers should accept either form.\n\nNote that this differs from the cdif
      Concept policy: a Concept (skos:Concept)\nin CDIF profiles MUST be a controlled-vocabulary
      entry (object form or\n@id-reference) \u2014 plain strings are not permitted
      for Concept-typed values\nbecause vocabulary identity cannot be recovered from
      an unscoped label.\n"
    type: object
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          enum:
          - schema:DefinedTerm
        minItems: 1
      schema:name:
        type: string
        description: text label for the term that is useful to human user
        x-jsonld-id: http://schema.org/name
      schema:identifier:
        anyOf:
        - type: string
        - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.identifier
        x-jsonld-id: http://schema.org/identifier
      schema:inDefinedTermSet:
        description: 'The controlled vocabulary responsible for this keyword, as EITHER
          a plain URI string identifying the vocabulary, OR an object reference ({"@id":
          "<uri>"}) to a vocabulary defined elsewhere in the document. Both forms
          are already in use across CDIF profiles and downstream ADA building blocks;
          permitting only the string form made the object form - the natural JSON-LD
          spelling of a reference - invalid, while this class''s own union-type policy
          above explicitly anticipates both.'
        anyOf:
        - type: string
        - type: object
          required:
          - '@id'
          additionalProperties: false
          properties:
            '@id':
              type: string
        x-jsonld-id: http://schema.org/inDefinedTermSet
      schema:termCode:
        type: string
        description: A representative code for this keyword in the controlled vocabulary.
          Analogous to skos:Notation
        x-jsonld-id: http://schema.org/termCode
    allOf:
    - required:
      - '@type'
    - anyOf:
      - required:
        - schema:name
      - required:
        - schema:identifier
      - required:
        - schema:termCode
    x-jsonld-prefixes:
      schema: http://schema.org/
    x-schema-source: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/schemaorgProperties/definedTerm/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
  ogch.BaseSchema.instrument:
    title: ADA Analysis Instrument
    description: ADA analytical instrument building block. Extends the core CDIF instrument
      building block with NeXus NXinstrument classification via additionalType. Instruments
      are typed as schema:Thing + schema:Product (from core) with domain-specific
      types (e.g. nxs:base_classes/NXinstrument.html, ada:AMSInstrument) in additionalType.
    allOf:
    - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument
    - type: object
      properties:
        '@id':
          description: 'Identifier for this instrument within the record. REQUIRED:
            an instrument has to be referenceable. A monitored species names the instrument
            (or the instrument part) that reports it, and a dataset variable points
            back at the device that produced it; neither is expressible while the
            instrument is an anonymous object. A document-scoped identifier suffices,
            but a resolvable one is better wherever the lab has a persistent identifier
            for the device.'
          type: string
          minLength: 1
        schema:additionalType:
          description: 'Domain-specific instrument type classifications. Should include
            a NeXus base class (e.g. nxs:base_classes/NXinstrument.html) and/or technique-specific
            identifier (e.g. ada:AMSInstrument, GCMD instrument identifier). URI-shape
            values MUST be serialized as JSON-LD IRI references ({"@id":"..."}); free-label
            strings remain valid. Every instrument additionally carries the Wikidata
            "measuring instrument" type, which is invariant across techniques: the
            technique-specific entry says what KIND of instrument this is and varies
            by profile, while the Wikidata term says that it is an instrument at all,
            and gives a consumer one term to select on without knowing the ADA vocabulary.'
          type: array
          items:
            anyOf:
            - type: string
            - type: object
              additionalProperties: false
              required:
              - '@id'
              properties:
                '@id':
                  type: string
          minItems: 1
          contains:
            type: object
            properties:
              '@id':
                enum:
                - https://www.wikidata.org/wiki/Q3099911
            required:
            - '@id'
          x-jsonld-id: http://schema.org/additionalType
        schema:hasPart:
          description: 'Sub-components of this instrument system (a torch, an ICP
            source, a collision/reaction cell, a spectrometer). A component IS an
            instrument -- same @type (schema:Product + schema:Thing), same Wikidata
            term, and its own schema:additionalType token saying which kind of component
            it is. The shape is restated rather than written as `$ref: ''#''`, because
            resolve_schema replaces a circular ref with an empty stub -- it would
            read as "a part is an instrument" and enforce nothing. Upstream types
            a component more loosely (schema:Thing alone, no Wikidata); this narrows
            it, and the two compose because allOf intersects.'
          type: array
          items:
            anyOf:
            - type: object
              required:
              - '@id'
              - '@type'
              - schema:name
              - schema:additionalType
              properties:
                '@id':
                  description: 'Identifier for this component within the record. REQUIRED
                    on an INLINE component for the same reason it is required on the
                    instrument: a monitored species names the part that reports it
                    -- a Faraday cup, a spectrometer, a detector -- and an anonymous
                    object cannot be referenced. The sibling branch of this anyOf
                    is the by-reference form, a bare {"@id": ...} pointing at a component
                    described elsewhere.'
                  type: string
                  minLength: 1
                '@type':
                  type: array
                  items:
                    type: string
                  minItems: 2
                  allOf:
                  - contains:
                      enum:
                      - schema:Product
                  - contains:
                      enum:
                      - schema:Thing
                schema:name:
                  type: string
                  x-jsonld-id: http://schema.org/name
                schema:additionalType:
                  type: array
                  minItems: 1
                  contains:
                    type: object
                    required:
                    - '@id'
                    properties:
                      '@id':
                        enum:
                        - https://www.wikidata.org/wiki/Q3099911
                  x-jsonld-id: http://schema.org/additionalType
            - type: object
              additionalProperties: false
              description: Reference by node @id to a component described elsewhere.
              required:
              - '@id'
              properties:
                '@id':
                  type: string
          x-jsonld-id: http://schema.org/hasPart
      required:
      - '@id'
      - schema:additionalType
    x-jsonld-prefixes:
      schema: http://schema.org/
      nxs: https://manual.nexusformat.org/classes/
    x-schema-source: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/instrument/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
