                      '@type':
                        enum:
                        - - schema:PropertyValue
                      schema:propertyID:
                        enum:
                        - - '@id': ada:parameter/semTAPP/clDetectorConfiguration
                      schema:name:
                        enum:
                        - CL Detector Configuration
                      schema:value:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                    readOnly: true
                  - title: CL Grating
                    description: Diffraction grating specification for spectral or
                      hyperspectral CL acquisition, including groove density and blaze
                      wavelength. Not applicable to panchromatic-only acquisition.
                    type: object
                    properties:
                      '@id':
                        enum:
                        - ada:parameter/semTAPP/clGrating
                      '@type':
                        enum:
                        - - schema:PropertyValue
                      schema:propertyID:
                        enum:
                        - - '@id': ada:parameter/semTAPP/clGrating
                      schema:name:
                        enum:
                        - CL Grating
                      schema:value:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                    readOnly: true
                allOf:
                - contains:
                    title: CL Detector Configuration
