  ogch.BaseSchema.modules.core:
    title: 'TAPP Composition Module: Core'
    description: "The shared Core block of the 2026-08-11 TAPP library (Claude Skills
      for TAPP/Module_Core.csv), composed by 16 of the sixteen delivery tables. 30
      owned fields over 33 schema paths.\n\nGENERATED by tools/build_module_bb.py
      from the module's CSV and its schema-path sidecar \u2014 edit those, not this
      file. Requiredness follows the TAPP tier matrix: a field Basic on a side is
      required there, Advanced is permitted, N/A is absent from that side entirely.\n\nThis
      is a PROFILE, not a vocabulary: it asserts which properties a conforming procedure
      or analysis carries. Column F (Example / Allowed Content) is consumer-owned
      per the module manifest, so no enum is pinned here \u2014 a consuming TAPP may
      narrow a value space, never widen it."
    $defs:
      ProcedureIdentification:
        title: Core on the procedure
        description: 'Composed into a TAPP (prov:Plan) schema: what the procedure
          asserts once, for every analysis that follows it.'
        type: object
        properties:
          schema:name:
            description: "A short descriptive name for this analytical procedure,
              including a version number. Should identify the instrument, the technique,
              and the scope of what is measured \u2014 analyte, material, or feature."
            type: string
            x-jsonld-id: http://schema.org/name
          schema:measurementTechnique:
            type: array
            items:
              type: object
              properties:
                schema:termCode:
                  description: Top-level analytical technique identifier.
                  type: string
                  x-jsonld-id: http://schema.org/termCode
            x-jsonld-id: http://schema.org/measurementTechnique
          schema:creator:
            type: object
            properties:
              schema:name:
                description: Person(s) or laboratory responsible for developing and
                  registering this procedure. ORCID recommended for individuals.
                type: string
                x-jsonld-id: http://schema.org/name
            x-jsonld-id: http://schema.org/creator
          schema:location:
            type: object
            properties:
              schema:name:
                description: Name of the laboratory or institution hosting the instrument.
                type: string
                x-jsonld-id: http://schema.org/name
              schema:identifier:
                description: Persistent identifier for the laboratory (e.g., ROR ID).
                type: string
                x-jsonld-id: http://schema.org/identifier
            x-jsonld-id: http://schema.org/location
          schema:datePublished:
            description: First date this procedure configuration was used in production.
            type: string
            x-jsonld-id: http://schema.org/datePublished
          schema:funding:
            type: array
            items:
              type: object
              properties:
                schema:name:
                  description: Grants and other funding sources that supported instrument
                    acquisition, major upgrades, procedure development, and associated
                    personnel time. Include grant numbers and funding agencies where
                    applicable.
                  type: string
                  x-jsonld-id: http://schema.org/name
            x-jsonld-id: http://schema.org/funding
          schema:relatedLink:
            type: array
            items:
              type: object
              allOf:
              - if:
                  properties:
                    schema:linkRelationship:
                      enum:
                      - techniquePublication
                  required:
                  - schema:linkRelationship
                then:
                  properties:
                    schema:target:
                      type: object
                      properties:
                        schema:name:
                          description: DOI or URL for peer-reviewed publications or
                            technical reports describing, validating, or benchmarking
                            this procedure.
                          type: string
                          x-jsonld-id: http://schema.org/name
                      x-jsonld-id: http://schema.org/target
              - if:
                  properties:
                    schema:linkRelationship:
                      enum:
                      - coupledTechnique
                  required:
                  - schema:linkRelationship
                then:
                  properties:
                    schema:target:
                      type: object
                      properties:
                        schema:name:
                          description: "Other analytical techniques applied to the
                            same sample(s) whose results are intended to be interpreted
                            together with data from this procedure. Document coupling
                            with any technique whose results are functionally linked
                            to this dataset \u2014 providing calibration inputs, complementary
                            spatial context, or required companion measurements. Use
                            the same controlled vocabulary as the Technique field.
                            Enter \"None\" if no coupling is intended."
                          type: string
                          x-jsonld-id: http://schema.org/name
                        schema:description:
                          description: "Description of how this procedure is coupled
                            with the technique(s) listed above. Include: (1) the functional
                            relationship \u2014 what data or context flows between
                            techniques, or how results are combined (e.g. which output
                            from the coupled technique serves as input to data reduction
                            for this technique); and (2) the analytical sequence \u2014
                            which technique is performed first and why (e.g. non-destructive
                            before destructive). Required when Coupled Technique(s)
                            is not \"None\"."
                          type: string
                          x-jsonld-id: http://schema.org/description
                      x-jsonld-id: http://schema.org/target
            x-jsonld-id: http://schema.org/relatedLink
          ada:samplingUnit:
            description: "The physical subdivision of the sample to which one row
              of reported values corresponds \u2014 the unit that is analysed and
              reported, as distinct from the sample as a whole. State the unit type
              at procedure level and the units actually analysed at analysis level.
              Where units nest (e.g. confined tracks within grains), state both levels."
            type: string
            x-jsonld-id: https://ada.astromat.org/metadata/samplingUnit
          bios:computationalTool:
            type: array
            items:
              type: object
              allOf:
              - if:
                  properties:
                    ada:toolRole:
                      enum:
                      - acquisition
                  required:
                  - ada:toolRole
                then:
                  properties:
                    schema:name:
                      description: Instrument control, automation and data acquisition
                        software used to collect the raw data, including version number.
                        Distinct from Data Processing Software(s), which covers everything
                        applied to the data after acquisition.
                      anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                      x-jsonld-id: http://schema.org/name
              - if:
                  properties:
                    ada:toolRole:
                      enum:
                      - dataReduction
                  required:
                  - ada:toolRole
                then:
                  properties:
                    schema:name:
                      description: All software applied to the data after acquisition
                        in order to produce the reported quantities, including version
                        numbers. List every package used. Distinct from Acquisition
                        Software, which controls the instrument and collects the raw
                        data.
                      anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                      x-jsonld-id: http://schema.org/name
              required:
              - ada:toolRole
            x-jsonld-id: https://bioschemas.org/computationalTool
          ada:analyticalMode:
            type: array
            items:
              description: Primary analytical mode(s) executed under this procedure.
                Records one value for a single-mode procedure and all applicable modes
                for a multi-mode one. Serves as the procedure-level declaration of
                measurement type, distinct from the mode flag columns, which state
                per-field applicability. Required even where a procedure defines no
                mode flag columns, so that every procedure record is self-describing
                and comparable across the library.
              type: string
            x-jsonld-id: https://ada.astromat.org/metadata/analyticalMode
          ada:reportedProperties:
            type: array
            items:
              description: "The final variable(s) this procedure reports and their
                units \u2014 distinct from the fields recording what was *acquired*
                rather than what is reported. A procedure may acquire many channels
                and report a small number of derived quantities; without this field
                a data consumer cannot tell which. Record every reported variable,
                including intermediate quantities reported alongside final ones (e.g.
                both the 206Pb/238U ratio and the 206Pb/238U date). Where a reported
                variable is a nominal property with no magnitude (e.g. a mineral identification),
                record the variable and give the unit as 'N/A \u2014 nominal property'."
              type: string
            x-jsonld-id: https://ada.astromat.org/metadata/reportedProperties
          schema:description:
            description: "Any procedure- or analysis-specific information not captured
              by a structured field anywhere in this TAPP \u2014 including anomalies,
              deviations from the registered procedure, instrument modifications,
              and supplementary context. Scope is the whole document, not Group 6:
              this is the last field of the TAPP and covers all six groups. Use sparingly;
              a structured field is preferred for anything that can be formally categorised."
            type: string
            x-jsonld-id: http://schema.org/description
        required:
        - ada:samplingUnit
        - schema:datePublished
        - schema:name
      AnalysisIdentification:
        title: Core on the analysis
        description: 'Composed into a technique detail (schema:Dataset) schema: what
          each run supplies fresh, because it cannot be known until the analysis happens.'
        type: object
        properties:
          prov:wasGeneratedBy:
            type: array
            items:
              type: object
              properties:
                schema:location:
                  type: object
                  properties:
                    schema:name:
                      description: Name of the laboratory or institution hosting the
                        instrument.
                      type: string
                      x-jsonld-id: http://schema.org/name
                    schema:identifier:
                      description: Persistent identifier for the laboratory (e.g.,
                        ROR ID).
                      type: string
                      x-jsonld-id: http://schema.org/identifier
                  x-jsonld-id: http://schema.org/location
                schema:identifier:
                  description: "Identifier for the analytical session this record
                    describes \u2014 the laboratory's own run, sequence or batch identifier
                    as generated by the instrument or acquisition software. The analysis
                    record corresponds to one session, which may cover several samples,
                    and this is the link back to the raw instrument files. Distinct
                    from any persistent identifier a repository mints on submission."
                  type: string
                  x-jsonld-id: http://schema.org/identifier
                schema:startDate:
                  description: 'Date on which the analytical session began. For sessions
                    spanning multiple days, use the date of the first session. Format:
                    YYYY-MM-DD.'
                  type: string
                  x-jsonld-id: http://schema.org/startDate
                schema:endDate:
                  description: 'Date on which the analytical session ended. May equal
                    Analysis Start Date for single-day sessions. Format: YYYY-MM-DD.'
                  type: string
                  x-jsonld-id: http://schema.org/endDate
                schema:object:
                  type: array
                  items:
                    type: object
                    allOf:
                    - if:
                        properties:
                          '@type':
                            contains:
                              enum:
                              - https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                        required:
                        - '@type'
                      then:
                        properties:
                          schema:name:
                            description: "Name or identifier of each sample analysed
                              in this session, as used in the laboratory \u2014 a
                              sample mount, section or aliquot counts as one entry
                              where that is what the laboratory tracks. The analysis
                              record corresponds to one session and may cover several
                              samples; fields whose Keyed By column declares 'sample'
                              take one value per entry. Should match the identifier
                              used in associated publications or data tables."
                            anyOf:
                            - type: string
                            - type: array
                              items:
                                type: string
                            x-jsonld-id: http://schema.org/name
                          schema:identifier:
                            description: Globally unique, persistent identifier for
                              each sample listed in Sample Name. IGSN (International
                              Geo Sample Number) is the recommended standard for geological
                              and cosmochemical samples, as used by Astromat, EarthChem
                              and SESAR. Where a sample and its sub-samples are separately
                              registered, record the identifier at the level actually
                              analysed.
                            anyOf:
                            - type: string
                            - type: array
                              items:
                                type: string
                            x-jsonld-id: http://schema.org/identifier
                  allOf:
                  - contains:
                      properties:
                        '@type':
                          contains:
                            enum:
                            - https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                      required:
                      - '@type'
                  x-jsonld-id: http://schema.org/object
                prov:used:
                  type: array
                  items:
                    type: object
                    allOf:
                    - if:
                        required:
                        - bios:computationalTool
                      then:
                        properties:
                          bios:computationalTool:
                            type: array
                            items:
                              allOf:
                              - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.geochemProduct/$defs/UsedComputationalTool
                              - type: object
                                allOf:
                                - if:
                                    properties:
                                      ada:toolRole:
                                        enum:
                                        - acquisition
                                    required:
                                    - ada:toolRole
                                  then:
                                    properties:
                                      schema:name:
                                        description: Instrument control, automation
                                          and data acquisition software used to collect
                                          the raw data, including version number.
                                          Distinct from Data Processing Software(s),
                                          which covers everything applied to the data
                                          after acquisition.
                                        anyOf:
                                        - type: string
                                        - type: array
                                          items:
                                            type: string
                                        x-jsonld-id: http://schema.org/name
                                - if:
                                    properties:
                                      ada:toolRole:
                                        enum:
                                        - dataReduction
                                    required:
                                    - ada:toolRole
                                  then:
                                    properties:
                                      schema:name:
                                        description: All software applied to the data
                                          after acquisition in order to produce the
                                          reported quantities, including version numbers.
                                          List every package used. Distinct from Acquisition
                                          Software, which controls the instrument
                                          and collects the raw data.
                                        anyOf:
                                        - type: string
                                        - type: array
                                          items:
                                            type: string
                                        x-jsonld-id: http://schema.org/name
                                required:
                                - ada:toolRole
                            x-jsonld-id: https://bioschemas.org/computationalTool
                  x-jsonld-id: http://www.w3.org/ns/prov#used
                schema:description:
                  description: "Any procedure- or analysis-specific information not
                    captured by a structured field anywhere in this TAPP \u2014 including
                    anomalies, deviations from the registered procedure, instrument
                    modifications, and supplementary context. Scope is the whole document,
                    not Group 6: this is the last field of the TAPP and covers all
                    six groups. Use sparingly; a structured field is preferred for
                    anything that can be formally categorised."
                  type: string
                  x-jsonld-id: http://schema.org/description
            x-jsonld-id: http://www.w3.org/ns/prov#wasGeneratedBy
          schema:measurementTechnique:
            type: array
            items:
              type: object
              properties:
                schema:identifier:
                  description: DOI or unique persistent identifier for the registered
                    procedure used in this analysis, generated upon procedure submission
                    to a data repository. This field is mandatory when submitting
                    analytical data, to encourage formal procedure registration and
                    ensure traceability. If a DOI has been applied for but not yet
                    minted, enter "pending".
                  type: string
                  x-jsonld-id: http://schema.org/identifier
            x-jsonld-id: http://schema.org/measurementTechnique
          schema:contributor:
            type: array
            items:
              type: object
              allOf:
              - if:
                  properties:
                    schema:roleName:
                      enum:
                      - analyst
                  required:
                  - schema:roleName
                then:
                  properties:
                    schema:name:
                      description: Name(s) of the analyst(s) who performed the analysis
                        session. ORCID is recommended for persistent identification.
                      anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                      x-jsonld-id: http://schema.org/name
            allOf:
            - contains:
                properties:
                  schema:roleName:
                    enum:
                    - analyst
                required:
                - schema:roleName
            x-jsonld-id: http://schema.org/contributor
          schema:funding:
            type: array
            items:
              type: object
              properties:
                schema:name:
                  description: Grants and other funding sources that supported the
                    specific sample analyses and data collection reported here. Include
                    grant numbers and funding agencies. Distinct from procedure development
                    funding, which may have been awarded years earlier.
                  type: string
                  x-jsonld-id: http://schema.org/name
            x-jsonld-id: http://schema.org/funding
          schema:relatedLink:
            type: array
            items:
              type: object
              allOf:
              - if:
                  properties:
                    schema:linkRelationship:
                      enum:
                      - coupledTechnique
                  required:
                  - schema:linkRelationship
                then:
                  properties:
                    schema:target:
                      type: object
                      properties:
                        schema:name:
                          description: "Other analytical techniques applied to the
                            same sample(s) whose results are intended to be interpreted
                            together with data from this procedure. Document coupling
                            with any technique whose results are functionally linked
                            to this dataset \u2014 providing calibration inputs, complementary
                            spatial context, or required companion measurements. Use
                            the same controlled vocabulary as the Technique field.
                            Enter \"None\" if no coupling is intended."
                          type: string
                          x-jsonld-id: http://schema.org/name
                        schema:description:
                          description: "Description of how this procedure is coupled
                            with the technique(s) listed above. Include: (1) the functional
                            relationship \u2014 what data or context flows between
                            techniques, or how results are combined (e.g. which output
                            from the coupled technique serves as input to data reduction
                            for this technique); and (2) the analytical sequence \u2014
                            which technique is performed first and why (e.g. non-destructive
                            before destructive). Required when Coupled Technique(s)
                            is not \"None\"."
                          type: string
                          x-jsonld-id: http://schema.org/description
                      x-jsonld-id: http://schema.org/target
              - if:
                  properties:
                    schema:linkRelationship:
                      enum:
                      - coupledProcedure
                  required:
                  - schema:linkRelationship
                then:
                  properties:
                    schema:target:
                      type: object
                      properties:
                        schema:url:
                          description: Registered procedure DOI for the coupled technique
                            named above. Provides a stable, citable link to the companion
                            method independent of whether a dataset has been deposited.
                            If the coupled procedure has not yet been registered,
                            enter the DOI of a publication describing the coupled
                            method, or "pending". Enter "None" if no coupling is planned.
                          type: string
                          x-jsonld-id: http://schema.org/url
                      x-jsonld-id: http://schema.org/target
              - if:
                  properties:
                    schema:linkRelationship:
                      enum:
                      - coupledDataset
                  required:
                  - schema:linkRelationship
                then:
                  properties:
                    schema:target:
                      description: 'DOI or other persistent identifier for the co-registered
                        dataset or publication where both datasets are reported together.
                        Accepts: a dedicated dataset DOI (if separately deposited),
                        a shared dataset DOI (if co-submitted in the same package),
                        or a publication DOI. Use "same submission" if the coupled
                        dataset is included in this data package, or "pending" if
                        not yet assigned. If coupling is documented through a shared
                        sample identifier only, that information is already captured
                        in Sample Persistent Identifier (Group 2).'
                      anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                      x-jsonld-id: http://schema.org/target
            x-jsonld-id: http://schema.org/relatedLink
      Param_Procedure_targetMaterial:
        title: Target Material
        description: General description of the material type(s) this procedure is
          designed to analyse. Used for discoverability and procedure matching, and
          because the material type constrains sample preparation, calibration and
          matrix-matching requirements.
        type: object
        properties:
          '@id':
            enum:
            - ada:parameter/module/Core/targetMaterial
          '@type':
            enum:
            - - schema:PropertyValueSpecification
          schema:valueName:
            x-jsonld-id: http://schema.org/valueName
            enum:
            - targetMaterial
          schema:name:
            x-jsonld-id: http://schema.org/name
            enum:
            - Target Material
          ada:dataType:
            x-jsonld-id: https://ada.astromat.org/metadata/dataType
            enum:
            - string
          ada:fieldScope:
            x-jsonld-id: https://ada.astromat.org/metadata/fieldScope
            enum:
            - session
          schema:readonlyValue:
            x-jsonld-id: http://schema.org/readonlyValue
            enum:
            - true
          ada:tier:
            x-jsonld-id: https://ada.astromat.org/metadata/tier
            enum:
            - R
        required:
        - '@id'
        - '@type'
        - schema:valueName
        - schema:name
        - ada:dataType
        - ada:fieldScope
      Param_Analysis_constantsReferenceValues:
        title: Constants Reference Values
        description: Physical constants and reference values used in data reduction
          to calculate the final reported quantity (e.g., decay constants for age
          calculation, standard isotope ratios, or other citable reference values
          used in a correction or calculation), together with their source. Distinct
          from the Group 6 reference-material fields, which document accepted values
          for specific calibration/validation materials rather than universal physical
          constants. Record "None" if no citable, revisable physical constants feed
          into this procedure's data reduction.
        type: object
        properties:
          '@id':
            enum:
            - ada:parameter/module/Core/constantsReferenceValues
          '@type':
            enum:
            - - schema:PropertyValue
          schema:propertyID:
            x-jsonld-id: http://schema.org/propertyID
            enum:
            - - '@id': ada:parameter/module/Core/constantsReferenceValues
          schema:name:
            x-jsonld-id: http://schema.org/name
            enum:
            - Constants Reference Values
          schema:value:
            type: string
            x-jsonld-id: http://schema.org/value
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
      Param_Procedure_constantsReferenceValues:
        title: Constants Reference Values
        description: Physical constants and reference values used in data reduction
          to calculate the final reported quantity (e.g., decay constants for age
          calculation, standard isotope ratios, or other citable reference values
          used in a correction or calculation), together with their source. Distinct
