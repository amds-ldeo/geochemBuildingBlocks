  cdif.bbr.metadata.profiles.cdifProfile.cdifDataDescription:
    title: CDIF Data Description properties
    description: Additional constraints for CDIF data description level. Adds cdif:physicalDataType
      requirement on variableMeasured items and distribution-level cdi properties
      for file characterization (characterSet, fileSize, fileSizeUofM).
    type: object
    properties:
      '@context':
        type: object
        description: Additional JSON-LD namespace prefixes for discovery and data
          description.
        properties:
          geosparql:
            enum:
            - http://www.opengis.net/ont/geosparql#
          dqv:
            enum:
            - http://www.w3.org/ns/dqv#
          cdi:
            enum:
            - http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/
      cdif:hasPrimaryKey:
        anyOf:
        - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifKey
        - type: object
          additionalProperties: false
          description: object reference via URI or URI fragment to a cdif:Key defined
            elsewhere in the same document
          properties:
            '@id':
              type: string
          required:
          - '@id'
        description: 'Primary key of the dataset: a cdif:Key whose cdif:isComposedOf
          is an ordered list of cdi:InstanceVariables (from schema:variableMeasured)
          that uniquely identify each data instance.'
      cdif:statistics:
        type: array
        description: "**Dataset-scope** summary statistics \u2014 statistics that
          describe the dataset as a whole rather than any single variable (e.g. row
          count, dataset-wide totals, table-level checksums). Each entry is a cdi:Statistics
          bundle (one or more Statistic value objects) or a cdi:StatisticsCollection;
          inline or @id-reference to one declared elsewhere. cdif: namespaced \u2014
          DDI-CDI has no `statistics` association from a dataset; this is a CDIF attachment
          property reserved for genuinely dataset-scope aggregates.\nPer-variable
          statistics MUST NOT appear here \u2014 they belong under `schema:variableMeasured[i].cdif:isDescribedBy_StatisticsCollection`,
          which is the direct JSON mapping of the DDI-CDI `InstanceVariable \u2192
          isDescribedBy \u2192 StatisticsCollection` association. As a consequence,
          entries under `cdif:statistics` MUST NOT carry `cdif:appliesTo` (Statistics)
          or `cdif:indexedBy` (StatisticsCollection); those properties are the marker
          of a per-variable stat and require the variable-anchored path."
        items:
          anyOf:
          - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifStatistics
          - type: object
            additionalProperties: false
            properties:
              '@id':
                type: string
            required:
            - '@id'
      schema:subjectOf:
        properties:
          dcterms:conformsTo:
            type: array
            items:
              type: object
              required:
              - '@id'
              additionalProperties: false
              properties:
                '@id':
                  type: string
                  description: uri for specifications that this metadata record conforms
                    to
            minItems: 1
            contains:
              type: object
              required:
              - '@id'
              additionalProperties: false
              properties:
                '@id':
                  enum:
                  - https://w3id.org/cdif/data_description/1.1
      schema:variableMeasured:
        type: array
        items:
          allOf:
          - type: object
            description: All variableMeasured items at data description level must
              have an @id and cdif:physicalDataType so physical mappings can reference
              them.
            properties:
              '@id':
                type: string
                description: URI identifier for this variable, used as the target
                  of cdif:formats_InstanceVariable references in physical mappings.
            required:
            - '@id'
          - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.variableMeasured
          - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifInstanceVariable
          - type: object
            description: At the Data Description profile level, InstanceVariables
              may also carry substantive and sentinel value domains directly (in profiles
              that introduce a RepresentedVariable - e.g., CDIFDataStructureProfile
              - these properties live on the RepresentedVariable instead and are disallowed
              here).
            properties:
              cdi:takesSentinelValuesFrom:
                type: array
                items:
                  anyOf:
                  - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifValueDomain/$defs/SentinelValueDomain
                  - type: object
                    additionalProperties: false
                    properties:
                      '@id':
                        type: string
                    required:
                    - '@id'
                description: Sentinel (missing / not-applicable) value domain(s) for
                  this variable (RepresentedVariable.takesSentinelValuesFrom).
              cdi:takesSubstantiveValuesFrom:
                anyOf:
                - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifValueDomain/$defs/SubstantiveValueDomain
                - type: object
                  additionalProperties: false
                  properties:
                    '@id':
                      type: string
                  required:
                  - '@id'
                description: The substantive value domain for this variable - the
                  set of valid, meaningful values (RepresentedVariable.takesSubstantiveValuesFrom).
      schema:distribution:
        description: 'Each schema:DataDownload distribution item SHOULD additionally
          be typed as cdi:PhysicalDataSet or one of its subclasses (cdi:TabularTextDataSet,
          cdi:StructuredDataSet). schema:WebAPI distribution items do not require
          a cdi: dataset type. Not enforced at schema level (the merge with cdifCore
          and cdifManifest drops the @type constraint at profile resolution); consider
          a SHACL rule if runtime enforcement is needed.'
        type: array
        items:
          allOf:
          - if:
              properties:
                '@type':
                  contains:
                    enum:
                    - schema:DataDownload
            then:
              properties:
                cdif:hasPhysicalMapping:
                  type: array
                  description: Per-field physical mappings linking the variables measured
                    by this DataDownload distribution to their physical representation
                    in the file - column index, format, physical data type, null sequence,
                    etc. Each item is a cdifPhysicalMapping or one of its specializations
                    (cdifTextMapping for tabular text, cdifLocatorMapping for structured
                    data); the dataset-type branches below tighten the item type.
                  items:
                    anyOf:
                    - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifPhysicalMapping
                    - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifTextMapping
                    - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifLocatorMapping
                cdi:characterSet:
                  type: string
                  description: The character set used in the distribution (e.g., UTF-8,
                    ASCII).
                cdi:fingerprint:
                  description: Integrity fingerprint (checksum/hash) of this distribution's
                    bytes (DDI-CDI DataFingerprint).
                  allOf:
                  - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifDataFingerprint
          - if:
              properties:
                '@type':
                  contains:
                    enum:
                    - cdi:TabularTextDataSet
            then:
              $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifTabularTextDataSet
          - if:
              properties:
                '@type':
                  contains:
                    enum:
                    - cdi:StructuredDataSet
            then:
              $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifStructuredDataSet
          - if:
              properties:
                '@type':
                  contains:
                    enum:
                    - schema:WebAPI
            then:
              properties:
                schema:potentialAction:
                  items:
                    properties:
                      schema:result:
                        properties:
                          cdif:hasPhysicalMapping:
                            type: array
                            description: Per-field physical mappings for the API response
                              - the response is another physical realization of the
                              dataset's variables. Each item is a cdifPhysicalMapping
                              or one of its specializations (cdifTextMapping / cdifLocatorMapping).
                            items:
                              anyOf:
                              - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifPhysicalMapping
                              - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifTextMapping
                              - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifLocatorMapping
                          cdi:characterSet:
                            type: string
                            description: The character set used in the API response
                              (e.g., UTF-8).
    required:
    - schema:variableMeasured
    x-schema-source: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/profiles/cdifProfile/cdifDataDescription/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
  cdif.bbr.metadata.profiles.cdifProfile.cdifManifest:
    title: CDIF Manifest
    description: "Profile module for packages: the resources that make up a dataset
      and where to retrieve each of them. Marks the catalog record as conformant to
      the CDIF manifest spec (https://w3id.org/cdif/manifest/1.1) and declares schema:hasPart
      in the two places a package needs it \u2014 on the Dataset, for parts that are
      independently accessible at their own addresses, and on a schema:distribution
      item, for component files inside an archive (ZIP, etc.) that have no address
      of their own. Both part shapes carry schema:about, so a part that describes
      another \u2014 a codebook, a data dictionary, a metadata sidecar \u2014 can
      say which one. The base schema:distribution anyOf [DataDownload, WebAPI] contributed
      by cdifCore is preserved \u2014 this BB only adds property constraints, no new
      anyOf branch. (Merged from the previous cdifProfile/cdifArchive BB, which held
      only the $defs for ArchivePart; everything now lives here.)"
    type: object
    properties:
      schema:subjectOf:
        properties:
          dcterms:conformsTo:
            type: array
            items:
              type: object
              required:
              - '@id'
              additionalProperties: false
              properties:
                '@id':
                  type: string
                  description: uri for specifications that this metadata record conforms
                    to
            minItems: 1
            contains:
              type: object
              required:
              - '@id'
              additionalProperties: false
              properties:
                '@id':
                  enum:
                  - https://w3id.org/cdif/manifest/1.1
      schema:hasPart:
        description: Component resources of a package whose parts are independently
          accessible, each with its own distribution. Parts may differ in content
          type, format and data structure. For component files inside an archive,
          which have no address of their own, use schema:hasPart on the distribution
          instead.
        allOf:
        - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.profiles.cdifProfile.cdifManifest/$defs/resourcePartArray
      schema:distribution:
        type: array
        items:
          allOf:
          - properties:
              schema:hasPart:
                description: For bundle/archive distributions (positively typed with
                  schema:Collection in @type), describes the component files. Each
                  component is typed as schema:MediaObject and may include CDIF data
                  description extensions (cdifTabularData, cdifDataCube) to describe
                  its internal structure.
                allOf:
                - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.profiles.cdifProfile.cdifManifest/$defs/archivePartArray
          - if:
              properties:
                '@type':
                  type: array
                  contains:
                    enum:
                    - schema:Collection
              required:
              - '@type'
            then:
              required:
              - schema:hasPart
    $defs:
      resourcePartArray:
        type: array
        description: Array of the resources that make up a package. Each part is independently
          retrievable, so unlike an archive part it may carry its own schema:distribution
          and may be typed schema:DataDownload.
        items:
          $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.profiles.cdifProfile.cdifManifest/$defs/resourcePartItem
      resourcePartItem:
        type: object
        description: 'One independently accessible member of a package. Type it for
          what it is: schema:Dataset for data, schema:CreativeWork for a codebook,
          methods document or quality report, schema:MediaObject for a browse image.
          Parts under separate stewardship should carry their own schema:provider,
          schema:conditionsOfAccess and schema:dateModified, since those are what
          differ.'
        properties:
          '@id':
            type: string
            description: Identifier for this part.
          '@type':
            type: array
            description: What kind of resource this part is. Must include schema:CreativeWork
              or one of its subclasses -- everything a package can contain is a creative
              work of some kind, and saying which one is what lets a consumer tell
              the data from the codebook from the browse image. Additional types beyond
              that are free, so domain vocabularies (ada:otherFileType and the like)
              sit alongside. Not constrained to schema:MediaObject as an archive part
              is, because a part with its own address may well be a Dataset or a DataDownload.
            items:
              type: string
            minItems: 1
            contains:
              type: string
              pattern: ^(schema:|http://schema\.org/)(CreativeWork|Dataset|DataDownload|DataCatalog|MediaObject|ImageObject|VideoObject|AudioObject|3DModel|DigitalDocument|TextDigitalDocument|SpreadsheetDigitalDocument|PresentationDigitalDocument|NoteDigitalDocument|SoftwareApplication|WebApplication|SoftwareSourceCode|Article|ScholarlyArticle|TechArticle|Report|Book|Chapter|Thesis|Manuscript|Map|WebPage|WebSite|Collection|Course|HowTo|Guide|Legislation|Photograph|Painting|Drawing|Poster|Atlas|Periodical|PublicationIssue|PublicationVolume|CreativeWorkSeries|Review|Comment)$
          schema:name:
            type: string
          schema:description:
            type: string
          schema:encodingFormat:
            type: array
            items:
              type: string
          schema:url:
            type: string
          schema:about:
            type: array
            description: The part this one is about. Use it on a part that describes
              another -- a codebook, a data dictionary, a quality report, a metadata
              sidecar -- so that a consumer can tell WHICH part it documents rather
              than only that both are in the package. Equivalent in this use to cito:documents,
              which is how OAI-ORE packages express the same relationship; schema:subjectOf
              is the declared inverse.
            items:
              type: object
              required:
              - '@id'
              additionalProperties: false
              properties:
                '@id':
                  type: string
                  description: Reference to the @id of the part being described.
      archivePartArray:
        type: array
        description: Array describing the files contained in the archive. Each item
          represents a component file that is part of the archive and is not independently
          accessible.
        items:
          $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.profiles.cdifProfile.cdifManifest/$defs/archivePartItem
      archivePartItem:
        allOf:
        - type: object
          properties:
            '@id':
              type: string
              description: Identifier for this file, typically a hash-based anchor
                (e.g. '#abc123'). Used for cross-references from schema:about in metadata
                sidecar files.
            '@type':
              type: array
              description: Must include schema:MediaObject. Must NOT include schema:DataDownload
                since this file is not independently accessible. May include additional
                types for categorization.
              items:
                type: string
              contains:
                enum:
                - schema:MediaObject
              not:
                contains:
                  enum:
                  - schema:DataDownload
              minItems: 1
            schema:name:
              type: string
              description: Filename of the component file within the archive.
            schema:description:
              type: string
              description: Description of the file content. May include checksum information.
            schema:encodingFormat:
              type: array
              description: MIME type(s) for this file.
              items:
                type: string
            schema:size:
              type: object
              description: File size as a QuantitativeValue.
              properties:
                '@type':
                  type: array
                  items:
                    type: string
                  contains:
                    enum:
                    - schema:QuantitativeValue
                  minItems: 1
                schema:value:
                  type: number
                  description: Numeric size value.
                schema:unitText:
                  type: string
                  description: Unit of measure for size (e.g. 'byte').
            schema:about:
              type: array
              description: For metadata sidecar files, references the data file this
                metadata describes.
              items:
                type: object
                required:
                - '@id'
                additionalProperties: false
                properties:
                  '@id':
                    type: string
                    description: Reference to the @id of the data file described by
                      this sidecar.
            spdx:checksum:
              type: object
              description: Checksum for integrity verification of this component file.
              properties:
                '@type':
                  type: array
                  items:
                    type: string
                  contains:
                    enum:
                    - spdx:Checksum
                  minItems: 1
                spdx:algorithm:
                  type: string
                spdx:checksumValue:
                  type: string
              required:
              - '@type'
          required:
          - '@type'
          - schema:name
          - schema:encodingFormat
        - anyOf:
          - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifDataCube
