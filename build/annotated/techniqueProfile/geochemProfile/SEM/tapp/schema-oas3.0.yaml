        description: One column of the reported-property table. The reported properties
          are what the procedure REPORTS -- '206Pb/238U date (Ma)', 'd56Fe (permil
          vs IRMM-014)' -- as distinct from the analytes and channels it ACQUIRES.
          Structurally a KeyedTableColumn.
