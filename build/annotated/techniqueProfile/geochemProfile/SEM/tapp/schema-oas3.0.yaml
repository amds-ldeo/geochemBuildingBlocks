  ogch.BaseSchema.geochemProduct:
    title: Geochemistry Analytical Product Metadata
    description: 'Generic schema for JSON-LD metadata documenting an analytical product
      from a geochemistry (or related analytical) laboratory workflow. It describes
      the dataset and its distributions, the analysis events that produced it (instruments,
      computational tools, reagents, laboratory, samples analysed), the variables
      measured, and spatial / temporal / quality coverage. It composes the CDIF core,
      data-description, manifest (bundle), and provenance profiles.

      This is the domain-neutral base. Archive-specific submission/delivery layers
      (e.g. ADA/SAMIS via adaProduct) extend it with their product-type vocabulary,
      file-classification (componentType) scheme, and delivery-packaging rules.'
    type: object
    allOf:
    - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.profiles.cdifProfile.cdifCore
    - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.profiles.cdifProfile.cdifDataDescription
    - if:
        properties:
          schema:distribution:
            type: array
            contains:
              type: object
              properties:
                '@type':
                  type: array
                  contains:
                    enum:
                    - schema:Collection
              required:
              - '@type'
      then:
        $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.profiles.cdifProfile.cdifManifest
    - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.profiles.cdifProfile.cdifProvenance
    - type: object
      properties:
        '@type':
          type: array
          items:
            type: string
            enum:
            - schema:Dataset
            - schema:Product
        schema:license:
          description: Legal statement of conditions for use and access
          type: array
          minItems: 0
          items:
            anyOf:
            - type: string
            - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.creativeWork
          x-jsonld-id: http://schema.org/license
        schema:relatedLink:
          type: array
          description: Links to related resources at the product level
          items:
            type: object
            properties:
              '@type':
                type: array
                items:
                  type: string
                contains:
                  enum:
                  - schema:LinkRole
                minItems: 1
              schema:linkRelationship:
                type: string
                x-jsonld-id: http://schema.org/linkRelationship
              schema:target:
                type: object
                properties:
                  '@type':
                    type: array
                    items:
                      type: string
                    contains:
                      enum:
                      - schema:EntryPoint
                    minItems: 1
                  schema:encodingFormat:
                    type: array
                    items:
                      type: string
                    x-jsonld-id: http://schema.org/encodingFormat
                  schema:name:
                    type: string
                    x-jsonld-id: http://schema.org/name
                  schema:url:
                    type: string
                    x-jsonld-id: http://schema.org/url
                x-jsonld-id: http://schema.org/target
          x-jsonld-id: http://schema.org/relatedLink
        schema:creativeWorkStatus:
          type: string
          x-jsonld-id: http://schema.org/creativeWorkStatus
        schema:measurementTechnique:
          type: array
          items:
            type: object
            description: Text description of the measurement method
            properties:
              '@type':
                type: array
                items:
                  type: string
                contains:
                  enum:
                  - schema:DefinedTerm
                minItems: 1
              schema:name:
                type: string
                x-jsonld-id: http://schema.org/name
              schema:identifier:
                type: string
                x-jsonld-id: http://schema.org/identifier
          x-jsonld-id: http://schema.org/measurementTechnique
        prov:wasGeneratedBy:
          description: 'Analysis events. Extends cdifProvActivity (from cdifProvenance)
            with the generic geochem analysis-event surface: the instruments, computational
            tools and reagents actually used; the laboratory; the samples analysed;
            and the session identifier and timing.'
          type: array
          items:
            type: object
            properties:
              prov:used:
                type: array
                description: 'Resources used in the analysis. Each item is one of:
                  an instrument BB instance; a computational tool actually used (schema:SoftwareApplication);
                  a reagent / reference material actually used; a tappDefinition BB
                  instance (inlined); or an @id reference to a TAPP definition node
                  defined elsewhere. The TAPP plan (prov:Plan / bios:LabProtocol)
                  prescribes the generic instrument / computationalTool / reagent
                  list; these prov:used entries record the ACTUALS used in this specific
                  run.'
                items:
                  allOf:
                  - if:
                      type: object
                      required:
                      - schema:instrument
