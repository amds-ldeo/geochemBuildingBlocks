                      properties:
                        schema:instrument:
                          type: array
                          minItems: 1
                          items:
                            $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.instrument
                          x-jsonld-id: http://schema.org/instrument
                  - if:
                      type: object
                      required:
                      - bios:computationalTool
                    then:
                      properties:
                        bios:computationalTool:
                          type: array
                          minItems: 1
                          items:
                            $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.geochemProduct/$defs/UsedComputationalTool
                          x-jsonld-id: https://bioschemas.org/computationalTool
                  - if:
                      type: object
                      required:
                      - prov:reagent
                    then:
                      properties:
                        prov:reagent:
                          type: array
                          minItems: 1
                          items:
                            $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.geochemProduct/$defs/UsedReagent
                          x-jsonld-id: http://www.w3.org/ns/prov#reagent
                  - if:
                      type: object
                      properties:
                        '@type':
                          contains:
                            enum:
                            - ada:TAPPDefinition
                      required:
                      - '@type'
                    then:
                      $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.tappDefinition
                x-jsonld-id: http://www.w3.org/ns/prov#used
              schema:location:
                x-jsonld-id: http://schema.org/location
                allOf:
                - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.laboratory
              schema:object:
                type: array
                description: Samples analyzed
                items:
                  type: object
                  properties:
                    '@type':
                      type: array
                      items:
                        type: string
                      allOf:
                      - contains:
                          enum:
                          - schema:Thing
                      - contains:
                          enum:
                          - https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                      minItems: 2
                    schema:additionalType:
                      type: array
                      items:
                        type: string
                      x-jsonld-id: http://schema.org/additionalType
                    schema:identifier:
                      type: array
                      items:
                        type: string
                      x-jsonld-id: http://schema.org/identifier
                    schema:name:
                      description: Sample name/identifier as used in the lab.
                      type: string
                      x-jsonld-id: http://schema.org/name
                    schema:additionalProperty:
                      description: Per-sample PropertyValue entries (e.g. analysis
                        location); technique profiles constrain these.
                      type: array
                      items:
                        type: object
                      x-jsonld-id: http://schema.org/additionalProperty
                x-jsonld-id: http://schema.org/object
              schema:identifier:
                description: The analytical session's own identifier -- the laboratory's
                  run, sequence or batch identifier as generated by the instrument
                  or acquisition software. Sits on the activity rather than the dataset
                  because the session IS the activity.
                type: string
                x-jsonld-id: http://schema.org/identifier
              schema:startDate:
                type: string
                x-jsonld-id: http://schema.org/startDate
              schema:endDate:
                type: string
                x-jsonld-id: http://schema.org/endDate
              schema:additionalProperty:
                description: Per-analysis PropertyValue entries (replicates, transect
                  length, ...); technique profiles constrain these.
                type: array
                items:
                  type: object
                x-jsonld-id: http://schema.org/additionalProperty
            required:
