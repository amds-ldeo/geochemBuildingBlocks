            description: Publication reference for the standard's accepted values.
            anyOf:
            - type: string
            - type: object
              additionalProperties: false
              properties:
                '@type':
                  type: array
                  items:
                    type: string
                schema:name:
                  type: string
                  x-jsonld-id: http://schema.org/name
                schema:url:
                  type: string
                  format: uri
                  x-jsonld-id: http://schema.org/url
            x-jsonld-id: http://schema.org/citation
        required:
        - '@type'
        - schema:name
      PropertyIDValue:
        description: "One value of schema:propertyID: a vocabulary URI, a JSON-LD
          IRI reference, or a DefinedTerm.\nWhether the property holding these is
          an ARRAY depends on which job schema:PropertyValue is doing, because schema.org
          overloads that one class for several things that ought to be distinct (see
          the CDIF Core Implementation Guide, \"Polymorphism of PropertyValue\"):\n\n
          \ * schema:additionalProperty and schema:variableMeasured -- a measured
          or declared parameter.\n    propertyID is 0..* there, so it is ALWAYS an
          array and a consumer iterates without first\n    testing the value's type.\n
          \ * schema:identifier -- an identifier for the identifier scheme (DOI, ARK,
          IGSN). Upstream\n    types that one as a bare string or {\"@id\": ...},
          never an array, so do NOT wrap it."
        anyOf:
        - type: string
          format: uri
        - type: object
          additionalProperties: false
          required:
          - '@id'
          properties:
            '@id':
              type: string
        - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.tappDefinition/$defs/DefinedTerm
      QualityMeasure:
        $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.qualityProperties.qualityMeasure
      DefinedTerm:
        $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.definedTerm
    x-jsonld-prefixes:
      schema: http://schema.org/
