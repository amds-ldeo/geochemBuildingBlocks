  cdif.bbr.metadata.cdifDataType.cdifProvActivity:
    title: CDIF Provenance Activity
    description: Extended provenance activity building block for CDIF. Extends the
      minimal prov:Activity (generatedBy) with schema.org Action properties for comprehensive
      provenance documentation including agents, instruments, methodology, temporal
      bounds, action chaining, and more.
    type: object
    allOf:
    - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.provProperties.generatedBy
    - type: object
      properties:
        '@type':
          type: array
          items:
            type: string
          minItems: 2
          contains:
            enum:
            - schema:Action
          description: Must include both schema:Action and prov:Activity (prov:Activity
            required by base generatedBy schema)
        prov:used:
          type: array
          description: Base generatedBy defines the allowed item shapes (string |
            {@id} | inline prov:Entity | a role-keyed wrapper naming schema:instrument
            / bios:computationalTool / prov:reagent). This profile only PINS the schema:instrument
            wrapper's value to the Instrument description when that key is present;
            it adds no other restriction, so all base item shapes (including inline
            prov:Entity inputs such as samples) remain valid. The wrapped value is
            an ARRAY of Instrument. schema:instrument is 0..* -- one activity commonly
            uses several instruments in the same role (a laser ablation cell plus
            the ICP-MS it feeds) -- and this schema implements every 1..* / 0..* property
            as a JSON array, never as "object or array", so a consumer never has to
            test the value's type before iterating.
          items:
            if:
              type: object
              required:
              - schema:instrument
            then:
              properties:
                schema:instrument:
                  type: array
                  minItems: 1
                  items:
                    $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifProvActivity/$defs/Instrument
                  x-jsonld-id: http://schema.org/instrument
          x-jsonld-id: http://www.w3.org/ns/prov#used
        schema:name:
          type: string
          description: Human-readable name for the activity
          x-jsonld-id: http://schema.org/name
        schema:description:
          type: string
          description: Text description of what this activity did
          x-jsonld-id: http://schema.org/description
        schema:identifier:
          description: Formal identifier for this activity
          anyOf:
          - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifProvActivity/$defs/Identifier
          - type: string
          x-jsonld-id: http://schema.org/identifier
        schema:agent:
          description: Primary responsible agent for this activity (maps to PROV wasAssociatedWith)
          anyOf:
          - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifProvActivity/$defs/Person
          - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifProvActivity/$defs/Organization
          - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifProvActivity/$defs/AgentInRole
          - type: object
            additionalProperties: false
            properties:
              '@id':
                type: string
                description: reference to an agent defined elsewhere
            required:
            - '@id'
          x-jsonld-id: http://schema.org/agent
        schema:participant:
          description: Other participants in this activity
          type: array
          items:
            anyOf:
            - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifProvActivity/$defs/Person
            - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifProvActivity/$defs/Organization
            - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifProvActivity/$defs/AgentInRole
            - type: object
              additionalProperties: false
              properties:
                '@id':
                  type: string
                  description: reference to a participant defined elsewhere
              required:
              - '@id'
          x-jsonld-id: http://schema.org/participant
        schema:object:
          description: Input entity (or entities) for this activity. Per schema.org,
            the range of schema:object is schema:Thing. Accepts four shapes (1) a
            string URI, (2) an @id reference object, (3) an inline schema:Thing object,
            or (4) an array whose items take any of those shapes (used when an activity
            has multiple inputs, e.g. samples analyzed). Supports action chaining
            where the value references the result of a prior activity.
          anyOf:
          - type: string
          - type: object
            required:
            - '@id'
            additionalProperties: false
            properties:
              '@id':
                type: string
                description: reference to an input entity
          - type: object
            description: Inline schema:Thing object describing the input entity.
            properties:
              '@type':
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
            required:
            - '@type'
          - type: array
            description: Multiple input entities (e.g. samples analyzed). Each item
              may be a string URI, an @id reference, or an inline schema:Thing.
            items:
              anyOf:
              - type: string
              - type: object
          x-jsonld-id: http://schema.org/object
