            activity); (2) a single {"@id": "<uri>"} object reference; (3) an inline
            schema:Thing (object with @type); or (4) an array of any of these forms
            (e.g. multiple datasets produced by this activity). Profiles may restrict
            the array item shape further.'
          anyOf:
          - type: string
          - type: object
            required:
            - '@id'
            additionalProperties: false
            properties:
