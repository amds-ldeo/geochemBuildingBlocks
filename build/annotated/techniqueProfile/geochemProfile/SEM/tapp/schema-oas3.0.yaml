      ChannelColumn:
        description: 'One column of the channel table. A channel is an instrument
          SELECTION POSITION -- a mass, a Faraday cup, an energy-loss edge, an X-ray
          line. It is not a flavour of analyte: the analyte is what is measured, the
          channel is the position it is measured on, and the two are independent.
          One analyte may occupy several channels, and MC-ICP-MS cups routinely monitor
          interferences that are not analytes at all. Structurally a KeyedTableColumn.'
        allOf:
        - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/SEM/tapp/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.tappDefinition/$defs/KeyedTableColumn
