$schema: https://json-schema.org/draft/2020-12/schema
title: ADA Raman Product Profile
description: Path-driven technique-specific profile for ADA Raman Product Profile.
  Extends the base ADA product profile with the RAMAN analysis-instance detail on
  the schema:Dataset root, and pins the product type and the profile it declares conformance
  to.
allOf:
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/geochemProduct/schema.yaml
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/RAMAN/detail/schema.yaml
- type: object
  properties:
    schema:additionalType:
      description: Must include a RAMAN product type identifier.
      contains:
        enum:
        - Raman vibrational spectroscopy
      title: Product Type
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaRAMAN
      title: About This Record
x-bblocks-metadata:
  itemIdentifier: ogch.techniqueProfile.geochemProfile.RAMAN.profile
  register: https://amds-ldeo.github.io/geochemBuildingBlocks/build/register.json
  version: '0.1'
  dateOfLastChange: '2026-11-12'
