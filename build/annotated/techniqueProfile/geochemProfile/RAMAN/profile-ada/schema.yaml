$schema: https://json-schema.org/draft/2020-12/schema
title: ADA Raman Product Profile (TAPP-linked)
description: Profile for an ADA metadata document describing data generated under
  a registered ramanTAPP procedure. Extends the base ADA product profile with the
  RAMAN analysis-instance detail on the schema:Dataset root, pins prov:used to the
  ramanTAPP definition and the instrument building block, and constrains valid RAMAN
  component types on both the monolithic and bundle forms of schema:distribution.
  Distinct from adaProfile/RAMAN, which is the generic (adaProduct-only) RAMAN profile
  and carries no TAPP linkage - a record conforming here additionally asserts which
  registered procedure produced it. DRAFT - the ramanTAPP source table has not been
  through Phase 0 review.
allOf:
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/adaProduct/schema.yaml
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/RAMAN/detail/schema.yaml
- type: object
  properties:
    prov:wasGeneratedBy:
      description: 'Pin the ramanTAPP definition and the instrument where prov:used
        carries them. Constraint-only if/then, never a narrowed anyOf: prov:used items
        are role-keyed wrappers, and an anyOf here would allOf-merge with the base
        union and exclude item shapes the base allows.'
      type: array
      items:
        type: object
        properties:
          prov:used:
            type: array
            items:
              allOf:
              - if:
                  type: object
                  required:
                  - schema:instrument
                then:
                  properties:
                    schema:instrument:
                      type: array
                      minItems: 1
                      items:
                        $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/instrument/schema.yaml
              - if:
                  type: object
                  properties:
                    '@type':
                      contains:
                        const: ada:TAPPDefinition
                  required:
                  - '@type'
                then:
                  $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/RAMAN/tapp/schema.yaml
    schema:additionalType:
      description: Must include a RAMAN product type identifier.
      contains:
        enum:
        - Raman vibrational spectroscopy
    schema:distribution:
      description: Each distribution item is EITHER a monolithic single-file dataset
        whose ada:componentType is a RAMAN-specific or universal value (and may carry
        cdi:isStructuredBy), OR a bundle whose schema:hasPart members each carry such
        a componentType (the ADA/SAMIS archive form).
      type: array
      items:
        anyOf:
        - type: object
          required:
          - ada:componentType
          properties:
            ada:componentType:
              type: string
              anyOf:
              - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/adaProduct/schema.yaml#/$defs/universalComponentType
              - enum:
                - ada:RAMANRawTabular
        - type: object
          required:
          - schema:hasPart
          properties:
            schema:hasPart:
              items:
                type: object
                anyOf:
                - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/adaProduct/schema.yaml#/$defs/universalComponentTypeBranch
                - properties:
                    ada:componentType:
                      type: string
                      enum:
                      - ada:RAMANRawTabular
                  required:
                  - ada:componentType
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            required:
            - '@id'
            additionalProperties: false
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaRAMANFull
