$schema: https://json-schema.org/draft/2020-12/schema
title: ADA TDM Product Profile
description: Path-driven technique-specific profile for ADA TDM Product Profile. Extends
  the base ADA product profile with the TDM analysis-instance detail on the schema:Dataset
  root, and pins the product type and the profile it declares conformance to.
allOf:
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/geochemProduct/schema.yaml
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/techniqueProfile/geochemProfile/TDM/detail/schema.yaml
- type: object
  properties:
    schema:additionalType:
      description: Must include a TDM product type identifier.
      contains:
        enum:
        - Temperature-Dependent Magnetization
        - Temperature-Dependent Magnetization (TDM)
      title: Product Type
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaTDM
      title: About This Record
x-bblocks-metadata:
  itemIdentifier: ogch.techniqueProfile.geochemProfile.TDM.profile
  register: https://amds-ldeo.github.io/geochemBuildingBlocks/build/register.json
  version: '0.1'
  dateOfLastChange: '2026-11-11'
