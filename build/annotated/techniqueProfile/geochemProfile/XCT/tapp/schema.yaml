$schema: https://json-schema.org/draft/2020-12/schema
title: Lab-XCT Technique-Aligned Protocol Profile (labxctTAPP)
description: 'Laboratory X-ray computed tomography (polychromatic cone-beam) extension
  of the base TAPP definition. Basic protocol-tier fields are required top-level ada:
  properties; Advanced protocol-tier fields are schema:additionalProperty[] PropertyValueSpecification
  entries. XCT has no per-element analyte axis, so no ada:analyteTemplate is defined.
  Generated from tapp/Current TAPPs/Lab-XCT_TAPP_v21.csv by tools/build_tapp.py.'
allOf:
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/tappDefinition/schema.yaml
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/core/schema.yaml#/$defs/ProcedureIdentification
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/targetSelection/schema.yaml#/$defs/ProcedureIdentification
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/calibrationFactor/schema.yaml#/$defs/ProcedureIdentification
- type: object
  properties:
    schema:object:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              '@type':
                contains:
                  const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
            required:
            - '@type'
          then:
            properties:
              schema:additionalProperty:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:name:
                          const: Target Material
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:value:
                          type: array
                          items:
                            description: General description of the material type(s)
                              this procedure is designed to analyse. Used for discoverability
                              and procedure matching, and because the material type
                              constrains sample preparation, calibration and matrix-matching
                              requirements.
                            anyOf:
                            - type: string
                              enum:
                              - Chondrite meteorite
                              - Achondrite meteorite
                              - Lunar sample
                              - Mission-returned sample
                              - Drill core (rock)
                              - Sediment core
                              - Terrestrial rock
                              - Cosmic spherule
                              - N/A
                              - None
                              - missing
                            - type: string
                            readOnly: true
                allOf:
                - contains:
                    properties:
                      schema:name:
                        const: Target Material
                    required:
                    - schema:name
                - contains:
                    title: "Sample Dimensions (L \xD7 W \xD7 H)"
                    description: "Physical dimensions of the sample in mm, reported
                      as length \xD7 width \xD7 height (or equivalent three orthogonal
                      measurements). The maximum dimension constrains the minimum
                      achievable field of view and therefore the coarsest achievable
                      voxel size. The minimum dimension determines how many voxels
                      span the smallest feature of interest."
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/labxctTAPP/sampleDimensionsDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: sampleDimensionsDefault
                      schema:name:
                        const: "Sample Dimensions (L \xD7 W \xD7 H)"
                      ada:dataType:
                        const: string
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
                        const: R
                    required:
                    - '@id'
                    - '@type'
                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                  minContains: 0
                  maxContains: 1
                - contains:
                    $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/targetSelection/schema.yaml#/$defs/Param_Procedure_preAnalysisImagingAndScreening
                  minContains: 0
                  maxContains: 1
      allOf:
      - contains:
          properties:
            '@type':
              contains:
                const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
          required:
          - '@type'
    ada:targetFeature:
      description: 'The 3D internal features or properties the procedure is designed
        to characterize. Defines the scientific purpose of the scan and informs resolution
        and contrast requirements. Used for procedure discoverability: a researcher
        can identify whether this procedure is suitable for their scientific question.
        Note for Phase 3 literature assessment: evaluate whether procedures in the
        literature are feature-specific (acquisition parameters tuned to a specific
        feature type, e.g., opaque-phase contrast) or general-purpose (designed to
        capture all structural features in a given sample type). This will inform
        whether the field warrants a controlled list or remains free text.'
      type: string
      readOnly: true
    ada:applicableSampleDimensionRange:
      description: "The range of sample sizes compatible with this procedure at the
        target voxel size and geometric configuration. The upper bound is a hard constraint
        set by the instrument field of view (FOV) at the procedure's target magnification:
        FOV \u2248 detector array width \xD7 pixel size / geometric magnification
        (divide additionally by optical objective multiplier for Versa-class systems
        using optical magnification). For Mode A (single-volume): all three sample
        dimensions must fall within the FOV. For Mode B (multi-volume stitching):
        sample diameter must fall within the FOV; sample length along the rotation
        axis is effectively unlimited through stitching. The lower bound is a practical
        guideline: samples spanning fewer than ~10 voxels in their smallest dimension
        are difficult to characterize reliably."
      type: string
      readOnly: true
    schema:additionalProperty:
      type: array
      items:
        anyOf:
        - title: Sample Mounting Method
          description: Method used to mount or hold the sample on the instrument rotation
            stage. Mounting material should transmit X-rays at the selected voltage
            without dominating beam attenuation. Report the holder type, adhesive
            or support material, and any alignment aids used.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/sampleMountingMethodDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: sampleMountingMethodDefault
            schema:name:
              const: Sample Mounting Method
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: X-ray Tube Anode Material
          description: Material of the X-ray tube anode (target). Determines the characteristic
            line energies superimposed on the bremsstrahlung continuum, which can
            affect phase contrast at specific energies. Multi-metal anodes (e.g.,
            W/Mo/Cu) extend the usable energy range.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/xRayTubeAnodeMaterial
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/labxctTAPP/xRayTubeAnodeMaterial
            schema:name:
              const: X-ray Tube Anode Material
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: Detector Array Size
          description: "Number of pixels in the detector array (width \xD7 height).
            Combined with detector pixel size and geometric magnification, determines
            the field of view."
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/detectorArraySize
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/labxctTAPP/detectorArraySize
            schema:name:
              const: Detector Array Size
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: Detector Pixel Size
          description: Physical size of a single pixel on the detector in micrometres.
            This is a fixed hardware property of the detector array, distinct from
            the reconstructed voxel size (which depends on geometric magnification
            and binning).
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/detectorPixelSize
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/labxctTAPP/detectorPixelSize
            schema:name:
              const: Detector Pixel Size
            schema:value:
              anyOf:
              - type: number
              - type: string
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          - schema:unitText
          readOnly: true
        - title: Optical Objective
          description: Optical magnification objective installed between the scintillator
            and CCD/CMOS detector. Applies only to instruments using optical magnification
            (e.g., Zeiss Xradia Versa series). For systems using only geometric magnification,
            report "Not applicable".
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/opticalObjective
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/labxctTAPP/opticalObjective
            schema:name:
              const: Optical Objective
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: X-ray Power
          description: "X-ray tube power in watts (W) registered by the procedure.
            Derivable as voltage (kV) \xD7 current (mA) = kV \xD7 \xB5A / 1000. Power
            constrains the achievable focal spot size for microfocal tubes: higher
            power requires a larger focal spot, trading spatial resolution for SNR.
            Retained as a standalone field because it is routinely reported in the
            literature and directly constrains instrument operating limits. If power
            was varied across samples within the session, report the full range applied
            (e.g., 7\u201313 W)."
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/xRayPowerDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: xRayPowerDefault
            schema:name:
              const: X-ray Power
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: W
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Source-to-Object Distance (SOD)
          description: Distance from the X-ray source focal spot to the centre of
            the sample rotation axis, in mm, as registered by the procedure. Together
            with SDD, determines geometric magnification (M = SDD/SOD). Shorter SOD
            increases magnification and reduces voxel size.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/sourceToObjectDistanceDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: sourceToObjectDistanceDefault
            schema:name:
              const: Source-to-Object Distance (SOD)
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: mm
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Source-to-Detector Distance (SDD)
          description: "Distance from the X-ray source focal spot to the detector
            surface, in mm, as registered by the procedure. Together with SOD, determines
            geometric magnification M = SDD/SOD. Voxel size \u2248 detector pixel
            size / M (before binning; divide additionally by optical objective for
            Versa-class systems)."
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/sourceToDetectorDistanceDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: sourceToDetectorDistanceDefault
            schema:name:
              const: Source-to-Detector Distance (SDD)
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: mm
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Rotation Step Size
          description: Angular increment between successive projection images, in
            degrees. Equal to Rotation Range divided by Number of Projections when
            both are reported; however, some sources report step size as the primary
            rotation parameter without stating the total number of projections explicitly.
            Finer step sizes improve angular sampling and reduce streak artifacts
            at the cost of longer scan time.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/rotationStepSizeDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: rotationStepSizeDefault
            schema:name:
              const: Rotation Step Size
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: "\xB0"
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Frames Averaged per Projection
          description: "Number of individual detector frames acquired and averaged
            to produce each saved projection image, as registered by the procedure.
            Frame averaging reduces random electronic noise. The effective exposure
            per projection = exposure time per frame \xD7 frames averaged."
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/framesAveragedPerProjectionDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: framesAveragedPerProjectionDefault
            schema:name:
              const: Frames Averaged per Projection
            ada:dataType:
              const: integer
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Detector Binning
          description: "Detector pixel binning factor applied during acquisition.
            Binning combines adjacent pixels (e.g., 2\xD72 combines 4 pixels into
            one), reducing effective resolution while increasing per-pixel SNR and
            reducing file size. 1\xD71 indicates no binning."
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/detectorBinningDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: detectorBinningDefault
            schema:name:
              const: Detector Binning
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Reconstruction Convolution Filter
          description: Convolution (apodization) filter kernel applied during back-projection
            reconstruction. Sharper filters (Ram-Lak) enhance edge definition but
            amplify high-frequency noise; smoother filters (Hann, Hamming) reduce
            noise at the cost of edge sharpness. The choice represents a deliberate
            procedure-level tradeoff.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/reconstructionConvolutionFilterDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: reconstructionConvolutionFilterDefault
            schema:name:
              const: Reconstruction Convolution Filter
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Beam Hardening Correction Parameter
          description: Numerical value or setting applied in the software beam hardening
            correction algorithm for this specific analysis. May be tuned empirically
            per material type or per scan session. Analysis-level companion to Beam
            Hardening Correction Method.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/beamHardeningCorrectionParameterDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: beamHardeningCorrectionParameterDefault
            schema:name:
              const: Beam Hardening Correction Parameter
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Ring Artifact Correction Method
          description: Procedure specification for how ring artifacts are handled.
            Ring artifacts appear as concentric circular bands centred on the rotation
            axis and arise from defective or miscalibrated detector pixels. Method
            is the procedure-level specification; whether correction was applied and
            its outcome are recorded at analysis level in Group 6.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/ringArtifactCorrectionMethodDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: ringArtifactCorrectionMethodDefault
            schema:name:
              const: Ring Artifact Correction Method
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: CT Number Calibration
          description: Whether the raw CT grayscale values have been calibrated to
            physically meaningful units using reference materials. Calibrated CT numbers
            enable cross-instrument and cross-session comparison and support phase
            identification by comparison to calculated linear attenuation coefficient
            (LAC) values (e.g., using MuCalc; Hanna & Ketcham 2017). Uncalibrated
            grayscale values are instrument- and session-specific.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/ctNumberCalibrationDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: ctNumberCalibrationDefault
            schema:name:
              const: CT Number Calibration
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Segmentation Threshold Values or Criteria
          description: "Specific CT number range(s) or quantitative criteria used
            to define each segmented phase or feature. Documenting these values enables
            reproducibility assessment and cross-study comparison. For LAC-calibrated
            datasets, report values in cm\u207B\xB9."
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/segmentationThresholdValuesOrCriteriaDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: segmentationThresholdValuesOrCriteriaDefault
            schema:name:
              const: Segmentation Threshold Values or Criteria
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Phase Identification Method
          description: Method used to assign reconstructed CT number ranges to specific
            mineral phases or material types. Approaches include comparison to calculated
            linear attenuation coefficients (LAC), cross-validation with independent
            analytical techniques, or empirical calibration.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/phaseIdentificationMethodDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: phaseIdentificationMethodDefault
            schema:name:
              const: Phase Identification Method
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: VOI Selection Criteria
          description: Procedure-level rules specifying how the Volume of Interest
            (VOI) is to be defined for quantitative analysis. Common criteria exclude
            cone-beam artifact zones at sample edges, beam hardening halos near dense
            inclusions, and sample holder signal. The actual VOI applied in a specific
            analysis is recorded separately at analysis level.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/voiSelectionCriteriaDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: voiSelectionCriteriaDefault
            schema:name:
              const: VOI Selection Criteria
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Output Bit Depth
          description: Bit depth of the reconstructed 3D volume (number of bits used
            to encode each voxel's grayscale value). Common values are 8-bit (256
            gray levels), 16-bit (65,536 gray levels), or 32-bit floating point. Bit
            depth affects the dynamic range available for phase segmentation and quantitative
            attenuation analysis. The procedure may specify a required output bit
            depth if downstream analysis workflows depend on a consistent grayscale
            range; the analyst confirms or adjusts at analysis time.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/outputBitDepthDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: outputBitDepthDefault
            schema:name:
              const: Output Bit Depth
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Partial Volume Effect Criteria
          description: "Procedure-level specification of how partial volume effects
            (PVE) are managed in quantitative analysis. PVE produces intermediate
            CT numbers at phase boundaries and at the surfaces of small features,
            because each voxel integrates the attenuation of all material within its
            volume. PVE correction can be implemented via PSF-based deconvolution
            tools such as Blob3D. Record the minimum feature size criterion adopted
            for the procedure (in voxels or \xB5m), the basis for it, the treatment
            of boundary voxels in modal abundance or size distribution calculations,
            and whether PVE correction is required or optional. Per Withers et al.
            (2021) a feature must span at least 3 voxels to be positively identified
            and at least 10 for reliable shape and volume characterisation; state
            whether the criterion follows that convention or is SNR-limited, PVE-limited
            or analyst-defined. The criterion materially changes reported modal abundances
            and size distributions, so two datasets are not comparable without it."
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/partialVolumeEffectCriteriaDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: partialVolumeEffectCriteriaDefault
            schema:name:
              const: Partial Volume Effect Criteria
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Cross-Validation Procedure Requirement
          description: Procedure-level specification of what independent analytical
            validation is required to confirm CT segmentation results, phase identification,
            or quantitative measurements. Cross-validation is relevant where CT grey-values
            alone cannot uniquely distinguish phases with similar attenuation coefficients.
            Common approaches include BSE imaging, SEM-EDS or EPMA modal analysis,
            He pycnometry for bulk porosity, and Raman or SIMS phase mapping. Record
            the required validation method(s) and the sampling fraction (e.g., every
            sample, one per session, or a representative subset).
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/crossValidationProcedureRequirementDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: crossValidationProcedureRequirementDefault
            schema:name:
              const: Cross-Validation Procedure Requirement
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
      allOf:
      - contains:
          title: Sample Mounting Method
          description: Method used to mount or hold the sample on the instrument rotation
            stage. Mounting material should transmit X-rays at the selected voltage
            without dominating beam attenuation. Report the holder type, adhesive
            or support material, and any alignment aids used.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/sampleMountingMethodDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: sampleMountingMethodDefault
            schema:name:
              const: Sample Mounting Method
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: X-ray Tube Anode Material
          description: Material of the X-ray tube anode (target). Determines the characteristic
            line energies superimposed on the bremsstrahlung continuum, which can
            affect phase contrast at specific energies. Multi-metal anodes (e.g.,
            W/Mo/Cu) extend the usable energy range.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/xRayTubeAnodeMaterial
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/labxctTAPP/xRayTubeAnodeMaterial
            schema:name:
              const: X-ray Tube Anode Material
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: Detector Array Size
          description: "Number of pixels in the detector array (width \xD7 height).
            Combined with detector pixel size and geometric magnification, determines
            the field of view."
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/detectorArraySize
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/labxctTAPP/detectorArraySize
            schema:name:
              const: Detector Array Size
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: Detector Pixel Size
          description: Physical size of a single pixel on the detector in micrometres.
            This is a fixed hardware property of the detector array, distinct from
            the reconstructed voxel size (which depends on geometric magnification
            and binning).
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/detectorPixelSize
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/labxctTAPP/detectorPixelSize
            schema:name:
              const: Detector Pixel Size
            schema:value:
              anyOf:
              - type: number
              - type: string
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          - schema:unitText
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: Optical Objective
          description: Optical magnification objective installed between the scintillator
            and CCD/CMOS detector. Applies only to instruments using optical magnification
            (e.g., Zeiss Xradia Versa series). For systems using only geometric magnification,
            report "Not applicable".
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/opticalObjective
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/labxctTAPP/opticalObjective
            schema:name:
              const: Optical Objective
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: X-ray Power
          description: "X-ray tube power in watts (W) registered by the procedure.
            Derivable as voltage (kV) \xD7 current (mA) = kV \xD7 \xB5A / 1000. Power
            constrains the achievable focal spot size for microfocal tubes: higher
            power requires a larger focal spot, trading spatial resolution for SNR.
            Retained as a standalone field because it is routinely reported in the
            literature and directly constrains instrument operating limits. If power
            was varied across samples within the session, report the full range applied
            (e.g., 7\u201313 W)."
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/xRayPowerDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: xRayPowerDefault
            schema:name:
              const: X-ray Power
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: W
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: Source-to-Object Distance (SOD)
          description: Distance from the X-ray source focal spot to the centre of
            the sample rotation axis, in mm, as registered by the procedure. Together
            with SDD, determines geometric magnification (M = SDD/SOD). Shorter SOD
            increases magnification and reduces voxel size.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/sourceToObjectDistanceDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: sourceToObjectDistanceDefault
            schema:name:
              const: Source-to-Object Distance (SOD)
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: mm
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: Source-to-Detector Distance (SDD)
          description: "Distance from the X-ray source focal spot to the detector
            surface, in mm, as registered by the procedure. Together with SOD, determines
            geometric magnification M = SDD/SOD. Voxel size \u2248 detector pixel
            size / M (before binning; divide additionally by optical objective for
            Versa-class systems)."
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/sourceToDetectorDistanceDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: sourceToDetectorDistanceDefault
            schema:name:
              const: Source-to-Detector Distance (SDD)
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: mm
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: Rotation Step Size
          description: Angular increment between successive projection images, in
            degrees. Equal to Rotation Range divided by Number of Projections when
            both are reported; however, some sources report step size as the primary
            rotation parameter without stating the total number of projections explicitly.
            Finer step sizes improve angular sampling and reduce streak artifacts
            at the cost of longer scan time.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/rotationStepSizeDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: rotationStepSizeDefault
            schema:name:
              const: Rotation Step Size
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: "\xB0"
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: Frames Averaged per Projection
          description: "Number of individual detector frames acquired and averaged
            to produce each saved projection image, as registered by the procedure.
            Frame averaging reduces random electronic noise. The effective exposure
            per projection = exposure time per frame \xD7 frames averaged."
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/framesAveragedPerProjectionDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: framesAveragedPerProjectionDefault
            schema:name:
              const: Frames Averaged per Projection
            ada:dataType:
              const: integer
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: Detector Binning
          description: "Detector pixel binning factor applied during acquisition.
            Binning combines adjacent pixels (e.g., 2\xD72 combines 4 pixels into
            one), reducing effective resolution while increasing per-pixel SNR and
            reducing file size. 1\xD71 indicates no binning."
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/detectorBinningDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: detectorBinningDefault
            schema:name:
              const: Detector Binning
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: Reconstruction Convolution Filter
          description: Convolution (apodization) filter kernel applied during back-projection
            reconstruction. Sharper filters (Ram-Lak) enhance edge definition but
            amplify high-frequency noise; smoother filters (Hann, Hamming) reduce
            noise at the cost of edge sharpness. The choice represents a deliberate
            procedure-level tradeoff.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/reconstructionConvolutionFilterDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: reconstructionConvolutionFilterDefault
            schema:name:
              const: Reconstruction Convolution Filter
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: Beam Hardening Correction Parameter
          description: Numerical value or setting applied in the software beam hardening
            correction algorithm for this specific analysis. May be tuned empirically
            per material type or per scan session. Analysis-level companion to Beam
            Hardening Correction Method.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/beamHardeningCorrectionParameterDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: beamHardeningCorrectionParameterDefault
            schema:name:
              const: Beam Hardening Correction Parameter
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: Ring Artifact Correction Method
          description: Procedure specification for how ring artifacts are handled.
            Ring artifacts appear as concentric circular bands centred on the rotation
            axis and arise from defective or miscalibrated detector pixels. Method
            is the procedure-level specification; whether correction was applied and
            its outcome are recorded at analysis level in Group 6.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/ringArtifactCorrectionMethodDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: ringArtifactCorrectionMethodDefault
            schema:name:
              const: Ring Artifact Correction Method
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: CT Number Calibration
          description: Whether the raw CT grayscale values have been calibrated to
            physically meaningful units using reference materials. Calibrated CT numbers
            enable cross-instrument and cross-session comparison and support phase
            identification by comparison to calculated linear attenuation coefficient
            (LAC) values (e.g., using MuCalc; Hanna & Ketcham 2017). Uncalibrated
            grayscale values are instrument- and session-specific.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/ctNumberCalibrationDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: ctNumberCalibrationDefault
            schema:name:
              const: CT Number Calibration
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: Segmentation Threshold Values or Criteria
          description: "Specific CT number range(s) or quantitative criteria used
            to define each segmented phase or feature. Documenting these values enables
            reproducibility assessment and cross-study comparison. For LAC-calibrated
            datasets, report values in cm\u207B\xB9."
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/segmentationThresholdValuesOrCriteriaDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: segmentationThresholdValuesOrCriteriaDefault
            schema:name:
              const: Segmentation Threshold Values or Criteria
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: Phase Identification Method
          description: Method used to assign reconstructed CT number ranges to specific
            mineral phases or material types. Approaches include comparison to calculated
            linear attenuation coefficients (LAC), cross-validation with independent
            analytical techniques, or empirical calibration.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/phaseIdentificationMethodDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: phaseIdentificationMethodDefault
            schema:name:
              const: Phase Identification Method
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: VOI Selection Criteria
          description: Procedure-level rules specifying how the Volume of Interest
            (VOI) is to be defined for quantitative analysis. Common criteria exclude
            cone-beam artifact zones at sample edges, beam hardening halos near dense
            inclusions, and sample holder signal. The actual VOI applied in a specific
            analysis is recorded separately at analysis level.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/voiSelectionCriteriaDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: voiSelectionCriteriaDefault
            schema:name:
              const: VOI Selection Criteria
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: Output Bit Depth
          description: Bit depth of the reconstructed 3D volume (number of bits used
            to encode each voxel's grayscale value). Common values are 8-bit (256
            gray levels), 16-bit (65,536 gray levels), or 32-bit floating point. Bit
            depth affects the dynamic range available for phase segmentation and quantitative
            attenuation analysis. The procedure may specify a required output bit
            depth if downstream analysis workflows depend on a consistent grayscale
            range; the analyst confirms or adjusts at analysis time.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/outputBitDepthDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: outputBitDepthDefault
            schema:name:
              const: Output Bit Depth
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: Partial Volume Effect Criteria
          description: "Procedure-level specification of how partial volume effects
            (PVE) are managed in quantitative analysis. PVE produces intermediate
            CT numbers at phase boundaries and at the surfaces of small features,
            because each voxel integrates the attenuation of all material within its
            volume. PVE correction can be implemented via PSF-based deconvolution
            tools such as Blob3D. Record the minimum feature size criterion adopted
            for the procedure (in voxels or \xB5m), the basis for it, the treatment
            of boundary voxels in modal abundance or size distribution calculations,
            and whether PVE correction is required or optional. Per Withers et al.
            (2021) a feature must span at least 3 voxels to be positively identified
            and at least 10 for reliable shape and volume characterisation; state
            whether the criterion follows that convention or is SNR-limited, PVE-limited
            or analyst-defined. The criterion materially changes reported modal abundances
            and size distributions, so two datasets are not comparable without it."
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/partialVolumeEffectCriteriaDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: partialVolumeEffectCriteriaDefault
            schema:name:
              const: Partial Volume Effect Criteria
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
      - contains:
          title: Cross-Validation Procedure Requirement
          description: Procedure-level specification of what independent analytical
            validation is required to confirm CT segmentation results, phase identification,
            or quantitative measurements. Cross-validation is relevant where CT grey-values
            alone cannot uniquely distinguish phases with similar attenuation coefficients.
            Common approaches include BSE imaging, SEM-EDS or EPMA modal analysis,
            He pycnometry for bulk porosity, and Raman or SIMS phase mapping. Record
            the required validation method(s) and the sampling fraction (e.g., every
            sample, one per session, or a representative subset).
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/crossValidationProcedureRequirementDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: crossValidationProcedureRequirementDefault
            schema:name:
              const: Cross-Validation Procedure Requirement
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        minContains: 0
        maxContains: 1
    schema:actionProcess:
      type: object
      properties:
        schema:step:
          type: array
          items:
            type: object
            allOf:
            - if:
                properties:
                  schema:name:
                    const: Sample preparation
                required:
                - schema:name
              then:
                properties:
                  schema:description:
                    description: Any preparation steps applied to the sample before
                      scanning, including cleaning, trimming, consolidation, or drying.
                      XCT is typically non-destructive with no surface preparation
                      required; note any exceptions.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
            - if:
                properties:
                  schema:name:
                    const: Data reduction
                required:
                - schema:name
              then:
                properties:
                  schema:additionalProperty:
                    type: array
                    items:
                      anyOf:
                      - title: Flat Field Correction
                        description: Whether dark-field (detector read with X-ray
                          source off; electronic noise baseline) and bright-field
                          (source on, no sample; gain calibration) reference images
                          are acquired and applied to normalize detector response
                          before reconstruction. Standard practice in all quantitative
                          lab XCT;.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/labxctTAPP/flatFieldCorrectionDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: flatFieldCorrectionDefault
                          schema:name:
                            const: Flat Field Correction
                          ada:dataType:
                            const: boolean
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      - title: Sub-volume Stitching and Registration Method
                        description: "Method used to register adjacent sub-volume
                          datasets to each other and stitch them into a single continuous
                          3D volume. Report the alignment strategy (manual, automated,
                          fiducial-based), the software used, and any correction steps
                          applied. Note: rotational mismatch artifacts have been identified
                          in continuous-rotation acquisitions (~0.35\xB0 misalignment
                          in Eckley et al. 2025); their correction via raw projection
                          re-alignment should be documented here."
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/labxctTAPP/subVolumeStitchingAndRegistrationMethodDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: subVolumeStitchingAndRegistrationMethodDefault
                          schema:name:
                            const: Sub-volume Stitching and Registration Method
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/core/schema.yaml#/$defs/Param_Procedure_constantsReferenceValues
                    allOf:
                    - contains:
                        title: Flat Field Correction
                        description: Whether dark-field (detector read with X-ray
                          source off; electronic noise baseline) and bright-field
                          (source on, no sample; gain calibration) reference images
                          are acquired and applied to normalize detector response
                          before reconstruction. Standard practice in all quantitative
                          lab XCT;.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/labxctTAPP/flatFieldCorrectionDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: flatFieldCorrectionDefault
                          schema:name:
                            const: Flat Field Correction
                          ada:dataType:
                            const: boolean
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      minContains: 0
                      maxContains: 1
                    - contains:
                        title: Sub-volume Stitching and Registration Method
                        description: "Method used to register adjacent sub-volume
                          datasets to each other and stitch them into a single continuous
                          3D volume. Report the alignment strategy (manual, automated,
                          fiducial-based), the software used, and any correction steps
                          applied. Note: rotational mismatch artifacts have been identified
                          in continuous-rotation acquisitions (~0.35\xB0 misalignment
                          in Eckley et al. 2025); their correction via raw projection
                          re-alignment should be documented here."
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/labxctTAPP/subVolumeStitchingAndRegistrationMethodDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: subVolumeStitchingAndRegistrationMethodDefault
                          schema:name:
                            const: Sub-volume Stitching and Registration Method
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      minContains: 0
                      maxContains: 1
                    - contains:
                        $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/core/schema.yaml#/$defs/Param_Procedure_constantsReferenceValues
                      minContains: 0
                      maxContains: 1
          allOf:
          - contains:
              properties:
                schema:name:
                  const: Data reduction
              required:
              - schema:name
    ada:xRaySourceConfiguration:
      description: Focal spot geometry and scale of the X-ray tube. Reflection target
        configurations are most common in lab XCT (X-rays emitted from the face of
        the anode toward the sample); transmission target configurations allow smaller
        focal spots by thinning the anode into a membrane and collecting X-rays from
        the back, enabling higher spatial resolution at the cost of lower maximum
        power.
      anyOf:
      - type: string
        enum:
        - Reflection target, microfocal
        - Reflection target, rotating (high-power)
        - Transmission target, nanofocal
        - N/A
        - None
        - missing
      - type: string
      readOnly: true
    ada:detectorType:
      description: Type of X-ray detector used to record projection images. Flat-panel
        detectors (amorphous silicon) are standard in Nikon, NSI, and similar systems.
        CCD or CMOS detectors coupled to a scintillator via an optical objective are
        used in Zeiss Xradia Versa systems, enabling optical magnification for sub-micrometre
        voxel sizes.
      anyOf:
      - type: string
        enum:
        - Flat-panel (amorphous silicon, a-Si)
        - CCD + scintillator (with optical objective)
        - CMOS + scintillator
        - N/A
        - None
        - missing
      - type: string
      readOnly: true
    bios:computationalTool:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              ada:toolRole:
                const: dataReduction
            required:
            - ada:toolRole
          then:
            properties:
              schema:name:
                description: Software used to reconstruct 2D projection images into
                  a 3D CT volume, including version number. Often bundled with the
                  instrument and proprietary to the manufacturer.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
        required:
        - ada:toolRole
    schema:instrument:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              schema:additionalType:
                contains:
                  const: XCT
                schema:inDefinedTermSet: ada:vocab/instrumentType
            required:
            - schema:additionalType
          then:
            properties:
              ada:acceleratingVoltageDefault:
                description: "X-ray tube accelerating voltage in kilovolts (kV) registered
                  by the procedure. Determines the maximum X-ray photon energy and
                  controls penetration depth and phase contrast. Higher voltages provide
                  greater penetration for dense or large samples; lower voltages improve
                  contrast between low-density phases. If the voltage was varied across
                  samples within the same procedure or session, report the full range
                  applied (e.g., 90\u2013115 kV). Note: some sources report this parameter
                  as 'X keV' (maximum Bremsstrahlung photon energy) rather than 'X
                  kV' (tube voltage). For polychromatic lab XCT, these are numerically
                  equivalent: E_max [keV] = V [kV]. Record the value as originally
                  reported, and add a parenthetical note if the unit used is keV."
                anyOf:
                - type: number
                - type: string
              ada:tubeCurrentDefault:
                description: "X-ray tube current in microamperes (\xB5A) registered
                  by the procedure. Controls photon flux and therefore projection
                  image SNR. Higher current improves SNR but increases thermal loading
                  on the source and may increase focal spot size. If the current was
                  varied across samples within the same procedure or session, report
                  the full range applied (e.g., 65\u2013115 \xB5A)."
                anyOf:
                - type: number
                - type: string
              ada:xRayPreFilterDefault:
                description: Material and thickness of the beam-hardening filter placed
                  between the X-ray source and the sample. Hardens the beam by attenuating
                  low-energy photons, reducing beam hardening artifacts and improving
                  CT number stability across the sample. Both filter material and
                  thickness must be reported. Instrument-proprietary filter codes
                  should be decoded where possible.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
              ada:voxelSizeDefault:
                description: "Isotropic voxel edge length of the reconstructed 3D
                  volume in micrometres. The procedure registers the target voxel
                  size, set based on the smallest feature to be resolved (target voxel
                  size \u2264 ~1/3 of that feature size; see the criterion recorded
                  under Partial Volume Effect Criteria). At analysis level, record
                  the achieved voxel size as reported by the reconstruction software,
                  which may differ slightly from the target due to final geometric
                  calibration."
                anyOf:
                - type: number
                - type: string
              schema:manufacturer:
                type: object
                properties:
                  schema:name:
                    description: Manufacturer of the instrument that performs the
                      measurement, recorded as a controlled value so that procedures
                      can be found by vendor. Where a procedure couples a sample-introduction
                      system to an analysing instrument, this records the analysing
                      instrument. Instrument Model gives the specific designation.
                    type: string
                    enum:
                    - Nikon
                    - Zeiss
                    - Bruker
                    - GE / Waygate
                    - North Star Imaging
                    - RX Solutions
                    - Custom-built
                    - Unknown
                    - N/A
                    - None
                    - missing
                    readOnly: true
              schema:model:
                type: object
                properties:
                  schema:name:
                    description: Model designation of the instrument that performs
                      the measurement, including any generation or configuration suffix.
                      Conventionally written with the manufacturer name included;
                      Instrument Manufacturer records the vendor separately, as a
                      controlled value, so that procedures remain findable by vendor.
                    type: string
                    readOnly: true
      allOf:
      - contains:
          properties:
            schema:additionalType:
              contains:
                const: XCT
              schema:inDefinedTermSet: ada:vocab/instrumentType
          required:
          - schema:additionalType
    ada:rotationRangeDefault:
      description: "Total angular range over which projection images are acquired,
        in degrees. Full 360\xB0 rotation is standard for cone-beam lab XCT. 180\xB0
        rotation (half-scan) is sometimes used for faster acquisition but may introduce
        additional artifacts."
      anyOf:
      - type: number
      - type: string
    ada:numberOfProjectionsDefault:
      description: Total number of equally-spaced projection images acquired over
        the full rotation range. More projections improve reconstruction quality by
        reducing under-sampling streak artifacts but increase scan time. For Mode
        B (multi-volume stitching), this is the number per sub-volume.
      anyOf:
      - type: integer
      - type: string
    ada:exposureTimePerProjectionDefault:
      description: "Duration of X-ray exposure for each individual projection image
        frame, in seconds, as registered by the procedure. Set as a deliberate choice
        for the target sample type and voxel size: longer exposures increase SNR at
        the cost of total scan time. May be adjusted within procedure-allowed bounds
        for samples that are unusually dense or unusually transparent. If the exposure
        time was varied across samples within the same procedure or session, report
        the full range applied (e.g., 0.5\u20132 s)."
      anyOf:
      - type: number
      - type: string
    ada:rotationModeDefault:
      description: Whether projection images are acquired during continuous sample
        rotation (faster; may introduce slight motion blur at high rotation speeds)
        or at discrete step positions with the stage stationary during each exposure
        (stop-and-shoot; eliminates motion blur). Continuous rotation has been associated
        with sub-volume rotational mismatch artifacts in multi-volume stitching workflows
        (Eckley et al. 2025).
      type: string
      enum:
      - Step rotation (stop-and-shoot)
      - Continuous rotation
      - N/A
      - None
      - missing
    ada:minimumSubVolumeOverlap:
      description: Minimum number of reconstructed slices that must overlap between
        adjacent sub-volumes in a stitched dataset. This is a procedure-level quality
        specification. Eckley et al. (2025) report that 500 slices of overlap were
        used in the Apollo 73001 stitching workflow, while 180 slices proved insufficient
        for their cone-beam geometry.
      anyOf:
      - type: integer
      - type: string
      readOnly: true
    ada:reconstructionAlgorithm:
      description: Mathematical algorithm used to reconstruct the 3D CT volume from
        2D projection images. The Feldkamp-Davis-Kress (FDK) algorithm is standard
        for cone-beam lab XCT geometry; iterative methods offer better artifact suppression
        at the cost of computation time.
      anyOf:
      - type: string
        enum:
        - FDK (Feldkamp-Davis-Kress, cone-beam)
        - FBP (filtered back-projection, parallel-beam)
        - Iterative reconstruction
        - SART
        - N/A
        - None
        - missing
      - type: string
      readOnly: true
    ada:beamHardeningCorrectionMethod:
      description: 'Strategy used to reduce beam hardening artifacts caused by preferential
        attenuation of low-energy photons in polychromatic cone-beam XCT. Beam hardening
        causes cupping artifacts (CT numbers elevated at sample edges relative to
        the interior) and can bias segmentation thresholds. Hardware pre-filtering
        (Group 4: X-ray Pre-filter) and software correction are complementary approaches.
        The method is a procedure-level design choice; the specific correction parameter
        value is session-specific and recorded separately at analysis level.'
      anyOf:
      - type: string
        enum:
        - Software polynomial correction (instrument-specific algorithm)
        - Ketcham & Hanna (2014) iterative BH correction
        - None applied
        - N/A
        - missing
      - type: string
      readOnly: true
    ada:outputDataFormatDefault:
      description: File format of the reconstructed CT volume as output by the reconstruction
        software. Bit depth is recorded separately in Output Bit Depth.
      anyOf:
      - type: string
        enum:
        - TIFF image stack
        - VGI/VOL (VGStudio)
        - RAW volume
        - DICOM
        - N/A
        - None
        - missing
      - type: string
    ada:segmentationMethodDefault:
      description: General approach used to separate distinct phases or features in
        the reconstructed CT volume. The method must be reported for any quantitative
        result to be reproducible.
      anyOf:
      - type: string
        enum:
        - Global threshold (single CT number boundary)
        - Multi-threshold (separate CT number range per phase)
        - Manual threshold per phase
        - 'Semi-automated: threshold + morphological filtering'
        - N/A
        - None
        - missing
      - type: string
    ada:analyticalMode:
      type: array
      items:
        type: string
        enum:
        - Single-volume
        - Multi-volume stitching
  required:
  - ada:targetFeature
  - ada:applicableSampleDimensionRange
  - ada:xRaySourceConfiguration
  - ada:detectorType
  - ada:rotationRangeDefault
  - ada:numberOfProjectionsDefault
  - ada:exposureTimePerProjectionDefault
  - ada:rotationModeDefault
  - ada:minimumSubVolumeOverlap
  - ada:reconstructionAlgorithm
  - ada:beamHardeningCorrectionMethod
  - ada:outputDataFormatDefault
  - ada:segmentationMethodDefault
