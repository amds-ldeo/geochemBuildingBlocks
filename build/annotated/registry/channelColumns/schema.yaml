$schema: https://json-schema.org/draft/2020-12/schema
title: ADA Channel Column Specification Registry
description: Registry of reusable schema:PropertyValueSpecification channel column
  definitions derived from technique TAPP workbooks. Each $def constrains one column
  of the channel table, a channel being an instrument selection position -- a mass,
  a Faraday cup, an energy-loss edge, an X-ray line -- as distinct from the analyte
  measured on it. TAPP building blocks reference these definitions via fragment $refs
  so they resolve locally through the building-block register. The root only hosts
  $defs; it has no instantiable properties of its own.
type: object
$defs:
  empa_backgroundCountingTime:
    title: Background Counting Time
    description: Total time spent counting at off-peak background position(s) in seconds,
      summed across all background positions.
    type: object
    properties:
      '@id':
        const: ada:channelColumn/empaTAPP/backgroundCountingTime
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: backgroundCountingTime
      schema:name:
        const: Background Counting Time
      ada:dataType:
        const: number
      schema:readonlyValue:
        const: false
      ada:tier:
        const: M
      schema:defaultValue:
        anyOf:
        - anyOf:
          - type: number
          - type: string
        - type: array
          items:
            anyOf:
            - type: number
            - type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - schema:defaultValue
  empa_backgroundPosition:
    title: Background Position(s)
    description: Location(s) of off-peak background measurement(s) relative to the
      peak, in mm or sin-theta, and whether on the high- or low-energy side.
    type: object
    properties:
      '@id':
        const: ada:channelColumn/empaTAPP/backgroundPosition
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: backgroundPosition
      schema:name:
        const: Background Position(s)
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:defaultValue:
        anyOf:
        - type: string
        - type: array
          items:
            type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  empa_diffractingCrystal:
    title: Diffracting Crystal
    description: Analyzing crystal (monochromator) used on each spectrometer assignment.
      Crystal choice determines the detectable wavelength range and dispersion.
    type: object
    properties:
      '@id':
        const: ada:channelColumn/empaTAPP/diffractingCrystal
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: diffractingCrystal
      schema:name:
        const: Diffracting Crystal
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: true
      ada:tier:
        const: M
      schema:defaultValue:
        anyOf:
        - type: string
        - type: array
          items:
            type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - schema:defaultValue
  empa_dwellTimePerPixel:
    title: Dwell Time per Pixel
    description: 'Time spent acquiring X-ray signal at each pixel during X-ray mapping,
      in milliseconds. For WDS: one value per spectrometer assignment per pixel. For
      EDS: total live-time per spectrum per pixel, a single value.'
    type: object
    properties:
      '@id':
        const: ada:channelColumn/empaTAPP/dwellTimePerPixel
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: dwellTimePerPixel
      schema:name:
        const: Dwell Time per Pixel
      ada:dataType:
        const: number
      schema:readonlyValue:
        const: false
      ada:tier:
        const: M
      schema:defaultValue:
        anyOf:
        - anyOf:
          - type: number
          - type: string
        - type: array
          items:
            anyOf:
            - type: number
            - type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - schema:defaultValue
  empa_peakCountingTime:
    title: Peak Counting Time
    description: Time spent counting X-ray intensity at the peak position, in seconds,
      on each spectrometer assignment. Procedure specifies standard values; analysts
      may adjust within procedure-defined bounds.
    type: object
    properties:
      '@id':
        const: ada:channelColumn/empaTAPP/peakCountingTime
      '@type':
        const:
