      schema:readonlyValue:
        const: true
      ada:tier:
        const: M
      schema:defaultValue:
        anyOf:
        - type: string
        - type: array
          items:
            type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - schema:defaultValue
  laMcicpms_interferingSpecies:
