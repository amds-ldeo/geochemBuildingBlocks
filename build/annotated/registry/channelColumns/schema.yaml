    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  empa_sequence:
    title: Sequence
    description: Order in which spectrometer assignments are acquired during point
      analysis. Relevant for minimizing beam damage (volatile elements measured first)
      and for sequential multi-channel setups. Not applicable to X-ray mapping, where
      all assigned spectrometers collect simultaneously at each pixel.
    type: object
    properties:
      '@id':
        const: ada:channelColumn/empaTAPP/sequence
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: sequence
      schema:name:
        const: Sequence
      ada:dataType:
        const: integer
      schema:readonlyValue:
        const: true
      ada:tier:
        const: R
      schema:defaultValue:
        anyOf:
        - anyOf:
          - type: number
          - type: string
        - type: array
          items:
            anyOf:
            - type: number
            - type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  empa_wdsPhaSetting:
    title: WDS PHA Setting
    description: Pulse height analyzer (PHA) setting for the WDS detector. Integral
      mode accepts all pulses above a threshold; Differential mode selects a narrow
      energy window to reject higher-order reflections and escape peaks.
    type: object
    properties:
      '@id':
        const: ada:channelColumn/empaTAPP/wdsPhaSetting
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: wdsPhaSetting
      schema:name:
        const: WDS PHA Setting
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: true
      ada:tier:
        const: R
      schema:defaultValue:
        anyOf:
        - type: string
        - type: array
          items:
            type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  empa_xRayLine:
    title: X-ray Line
    description: X-ray emission line measured on each spectrometer assignment. Line
      choice affects sensitivity, matrix correction accuracy, and susceptibility to
      peak overlap and spectral interference.
    type: object
    properties:
      '@id':
        const: ada:channelColumn/empaTAPP/xRayLine
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: xRayLine
      schema:name:
        const: X-ray Line
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: true
      ada:tier:
        const: M
      schema:defaultValue:
        anyOf:
        - type: string
        - type: array
          items:
            type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - schema:defaultValue
  laMcicpms_faradayCupAmplifierResistorValues:
    title: Faraday Cup Amplifier Resistor Values
    description: "Resistance values (\u03A9) of the feedback resistors in the Faraday
      cup amplifiers. Standard amplifiers use 10\xB9\xB9 \u03A9 resistors, yielding
      1 V per ~6.24 \xD7 10\u2076 ion counts per second. High-gain amplifiers (10\xB9\xB2
      or 10\xB9\xB3 \u03A9) are fitted to selected cups to improve signal-to-noise
      for very low-intensity beams (e.g., 234U, low-abundance spike isotopes). Report
      the resistor value per cup position, or note 'all 10\xB9\xB9 \u03A9' if uniform."
    type: object
    properties:
      '@id':
        const: ada:channelColumn/laMcicpmsTAPP/faradayCupAmplifierResistorValues
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: faradayCupAmplifierResistorValues
      schema:name:
        const: Faraday Cup Amplifier Resistor Values
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: true
      ada:tier:
        const: M
      schema:defaultValue:
        anyOf:
        - type: string
        - type: array
          items:
            type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - schema:defaultValue
  laMcicpms_faradayCupGainCalibrationMethod:
    title: Faraday Cup Gain Calibration Method
    description: 'Method used to calibrate the relative gain (amplification factor)
      of each Faraday cup amplifier at the start of or during each analytical session.
      Relative gain differences between amplifiers cause systematic errors in isotope
      ratios if uncorrected. Common approaches: instrument internal gain calibration
      routine (measures signal in each cup sequentially using a common beam), amplifier
      rotation procedure, or measurement of a known isotope ratio solution in each
      cup. For instruments with SEM detectors, also describes the SEM-to-Faraday cross-calibration
      sequence. Specify frequency (per session, per block, weekly).'
    type: object
    properties:
      '@id':
        const: ada:channelColumn/laMcicpmsTAPP/faradayCupGainCalibrationMethod
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: faradayCupGainCalibrationMethod
      schema:name:
        const: Faraday Cup Gain Calibration Method
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: true
      ada:tier:
        const: M
      schema:defaultValue:
        anyOf:
        - type: string
        - type: array
          items:
            type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - schema:defaultValue
  laMcicpms_integrationTimePerCycle:
    title: Integration Time per Cycle
    description: "Duration of signal integration per measurement cycle (seconds).
      Determines counting statistics per cycle. Longer integration times improve shot-noise
      precision but increase the impact of signal drift within the integration window.
      For high-gain (10\xB9\xB2 or 10\xB9\xB3 \u03A9) amplifier channels, longer integration
      times are often required to accumulate sufficient charge. Procedure specifies
      the standard integration time; analyst may confirm or adjust within procedure
      bounds. Where different isotope channels use different integration schemes,
      record the time for each channel."
    type: object
    properties:
      '@id':
        const: ada:channelColumn/laMcicpmsTAPP/integrationTimePerCycle
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: integrationTimePerCycle
      schema:name:
        const: Integration Time per Cycle
      ada:dataType:
        const: number
      schema:readonlyValue:
        const: false
      ada:tier:
        const: M
      schema:defaultValue:
        anyOf:
        - anyOf:
          - type: number
          - type: string
        - type: array
          items:
            anyOf:
            - type: number
            - type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - schema:defaultValue
  laMcicpms_interferenceCorrectionMethod:
    title: Interference Correction Method
    description: Equation or procedure used to correct for isobaric interferences,
      including the production rate factor and the reference material used to measure
      it.
    type: object
    properties:
      '@id':
        const: ada:channelColumn/laMcicpmsTAPP/interferenceCorrectionMethod
      '@type':
