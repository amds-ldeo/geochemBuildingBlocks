$schema: https://json-schema.org/draft/2020-12/schema
title: ADA Analytical Parameter Value Registry
description: Registry of reusable schema:PropertyValue parameter-value definitions
  derived from technique TAPP spreadsheets. Each $def constrains one per-dataset schema:PropertyValue
  entry. Detail building blocks reference these definitions via fragment $refs (schema.yaml#/$defs/<name>)
  so they resolve locally through the building-block register. The root only hosts
  $defs; it has no instantiable properties of its own.
type: object
$defs:
  empa_coupledProcedureDoi:
    title: Coupled Procedure DOI
    description: Registered procedure DOI for the coupled technique named above. Provides
      a stable, citable link to the companion method independent of whether a dataset
      has been deposited. If the coupled procedure has not yet been registered, enter
      the DOI of a publication describing the coupled method, or "pending". Enter
      "None" if no coupling is planned.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/coupledProcedureDoi
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/coupledProcedureDoi
      schema:name:
        const: Coupled Procedure DOI
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_coupledDatasetOrPublicationReference:
    title: Coupled Dataset or Publication Reference
    description: 'DOI or other persistent identifier for the co-registered dataset
      or publication where both datasets are reported together. Accepts: a dedicated
      dataset DOI (if separately deposited), a shared dataset DOI (if co-submitted
      in the same package), or a publication DOI. Use "same submission" if the coupled
      dataset is included in this data package, or "pending" if not yet assigned.
      If coupling is documented through a shared sample identifier only, that information
      is already captured in Sample Persistent Identifier (Group 2).'
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/coupledDatasetOrPublicationReference
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/coupledDatasetOrPublicationReference
      schema:name:
        const: Coupled Dataset or Publication Reference
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_samplePreparationMethod:
    title: Sample Preparation Method
    description: Description of how samples were prepared for analysis under this
      procedure (mounting, polishing, coating). Analysts may document session-specific
      variations from the procedure standard.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/samplePreparationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/samplePreparationMethod
      schema:name:
        const: Sample Preparation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_samplePersistentIdentifier:
    title: Sample Persistent Identifier
    description: Globally unique, persistent identifier for each sample listed in
      Sample Name. IGSN (International Geo Sample Number) is the recommended standard
      for geological and cosmochemical samples, as used by Astromat, EarthChem and
      SESAR. Where a sample and its sub-samples are separately registered, record
      the identifier at the level actually analysed.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/samplePersistentIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/samplePersistentIdentifier
      schema:name:
        const: Sample Persistent Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_targetSelectionCriteria:
    title: Target Selection Criteria
    description: "The rules governing which part of the sample is analysed, and why.
      Covers the criteria applied when choosing grains, aliquots, spots, or a region
      of interest \u2014 size, morphology, clarity, freedom from inclusions or alteration,
      phase identity, or spatial position. Distinct from Target Material, which states
      the material type the procedure is designed for: this field states how, within
      such a sample, the analysed portion is picked out."
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/targetSelectionCriteria
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/targetSelectionCriteria
      schema:name:
        const: Target Selection Criteria
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_preAnalysisImagingAndScreening:
    title: Pre-Analysis Imaging and Screening
    description: Imaging or other characterisation performed before the measurement
      in order to select or locate the analysed target, including the technique, instrument
      and settings used, and how individual analyses are linked back to the images.
      Distinct from any imaging the procedure performs as its own measurement. Where
      the imaging is performed on a separate instrument, it should also be recorded
      in the Group 1 coupling fields.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/preAnalysisImagingAndScreening
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/preAnalysisImagingAndScreening
      schema:name:
        const: Pre-Analysis Imaging and Screening
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_dataProcessingSoftware:
    title: Data Processing Software(s)
    description: All software applied to the data after acquisition in order to produce
      the reported quantities, including version numbers. List every package used.
      Distinct from Acquisition Software, which controls the instrument and collects
      the raw data.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/dataProcessingSoftware
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/dataProcessingSoftware
      schema:name:
        const: Data Processing Software(s)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_acceleratingVoltage:
    title: Accelerating Voltage
    description: Electron beam accelerating voltage in kilovolts (kV). The procedure
      specifies the standard operating voltage; analysts record and justify any deviations.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/acceleratingVoltage
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/acceleratingVoltage
      schema:name:
        const: Accelerating Voltage
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  empa_beamCurrent:
    title: Beam Current
    description: Probe current in nanoamperes (nA). Often varies by phase type or
      analyte; record the procedure-standard value(s).
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/beamCurrent
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/beamCurrent
      schema:name:
        const: Beam Current
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  empa_beamDiameter:
    title: Beam Diameter
    description: Diameter of the electron beam in micrometers. 0 indicates a fully
      focused beam. Document defocused diameter when used to minimize beam damage
      or improve spatial averaging for beam-sensitive phases.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/beamDiameter
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/beamDiameter
      schema:name:
        const: Beam Diameter
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  empa_beamRasterDimensions:
    title: Beam Raster Dimensions
    description: X x Y dimensions of a small beam raster used at a single analysis
      point to average a coarse-grained or beam-sensitive phase. Different from X-ray
      mapping mode; not applicable when mapping.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/beamRasterDimensions
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/beamRasterDimensions
      schema:name:
        const: Beam Raster Dimensions
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  empa_beamDamageMinimization:
    title: Beam Damage Minimization
    description: Measures taken to minimize beam damage, particularly volatilization
      or migration of Na, K, F, and Cl in hydrous minerals, glasses, feldspars, phosphates,
      and carbonates. Document approach, beam conditions used, and phases for which
      it was applied.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/beamDamageMinimization
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/beamDamageMinimization
      schema:name:
        const: Beam Damage Minimization
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_driftCorrection:
    title: Drift Correction
    description: Method used to monitor and correct for instrument drift (beam current
      drift, spectrometer drift) during the analytical session.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/driftCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/driftCorrection
      schema:name:
        const: Drift Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_peakCountingTime:
    title: Peak Counting Time
    description: Time spent counting X-ray intensity at the peak position, in seconds,
      on each spectrometer assignment. Procedure specifies standard values; analysts
      may adjust within procedure-defined bounds.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/peakCountingTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/peakCountingTime
      schema:name:
        const: Peak Counting Time
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  empa_backgroundCountingTime:
    title: Background Counting Time
    description: Total time spent counting at off-peak background position(s) in seconds,
      summed across all background positions.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/backgroundCountingTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/backgroundCountingTime
      schema:name:
        const: Background Counting Time
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  empa_backgroundPosition:
    title: Background Position(s)
    description: Location(s) of off-peak background measurement(s) relative to the
      peak, in mm or sin-theta, and whether on the high- or low-energy side.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/backgroundPosition
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/backgroundPosition
      schema:name:
        const: Background Position(s)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_edsLiveTimePerPointOrPixel:
    title: EDS Live Time per Point or Pixel
    description: EDS spectral acquisition live time per analysis point in seconds.
      Previously referred to as "EDS Acquisition Time" in this TAPP and commonly used
      under that name in EPMA and SEM-EDS contexts. Renamed to align with TEM-EDS
      usage, where the per-point vs. per-pixel distinction (point/line mode vs. spectrum
      image) is explicit. In EPMA, acquisition is always per point.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/edsLiveTimePerPointOrPixel
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/edsLiveTimePerPointOrPixel
      schema:name:
        const: EDS Live Time per Point or Pixel
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  empa_dwellTimePerPixel:
    title: Dwell Time per Pixel
    description: 'Time spent acquiring X-ray signal at each pixel during X-ray mapping,
      in milliseconds. For WDS: one value per spectrometer assignment per pixel. For
      EDS: total live-time per spectrum per pixel, a single value.'
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/dwellTimePerPixel
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/dwellTimePerPixel
      schema:name:
        const: Dwell Time per Pixel
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  empa_stepSizePixelSize:
    title: Step Size / Pixel Size
    description: Distance between adjacent measurement points in the X-ray map in
      micrometers, defining the spatial resolution. Report both X and Y step if they
      differ.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/stepSizePixelSize
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/stepSizePixelSize
      schema:name:
        const: Step Size / Pixel Size
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  empa_backgroundCorrectionMethod:
    title: Background Correction Method
    description: 'Method used to estimate and subtract background X-ray intensity
      beneath the peak. For WDS: typically 2-point off-peak linear interpolation or
      Mean Atomic Number (MAN) background model. For EDS: spectral background fitting
      or top-hat filter applied during spectral processing.'
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/backgroundCorrectionMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/backgroundCorrectionMethod
      schema:name:
        const: Background Correction Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_timeDependentIntensityCorrection:
    title: Time-Dependent Intensity Correction
    description: Type of time-dependent intensity (TDI) correction applied to compensate
      for beam-induced volatilization or migration of sensitive elements (e.g., Na,
      K, F in glasses, feldspars, carbonates). Most commonly applied in point analysis;
      uncommon for X-ray mapping.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/timeDependentIntensityCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/timeDependentIntensityCorrection
      schema:name:
        const: Time-Dependent Intensity Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_halogenCorrectionOnOxygen:
    title: Halogen Correction on Oxygen
    description: Whether oxygen content was adjusted to account for halogen substitution
      (F and/or Cl replacing OH) in halogen-bearing phases such as apatite, amphibole,
      and mica, where oxygen is calculated by stoichiometry.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/halogenCorrectionOnOxygen
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/halogenCorrectionOnOxygen
      schema:name:
        const: Halogen Correction on Oxygen
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_blankCorrection:
    title: Blank Correction
    description: Method and reference material(s) used to determine and subtract blank
      signal contributions (e.g., carbon coat contribution to C signal, or background
      contamination for trace elements).
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/blankCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/blankCorrection
      schema:name:
        const: Blank Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_normalizationStandardsBasedCorrection:
    title: Normalization / Standards-Based Correction
    description: Post-acquisition normalization applied using secondary reference
      materials to correct for session-to-session calibration drift.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/normalizationStandardsBasedCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/normalizationStandardsBasedCorrection
      schema:name:
        const: Normalization / Standards-Based Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_calibrationFactorAndDeterminationMethod:
    title: Calibration Factor and Determination Method
    description: 'An externally-calibrated factor that converts the measured quantity
      into the reported quantity, how it was determined, and its uncertainty. Applies
      where the conversion depends on a factor calibrated against a reference of independently
      known value, rather than on the instrument response alone. Distinct from the
      fields that name the calibration material and that state which approach applies
      to which analyte, where the technique has them: this field records the resulting
      factor itself.'
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/calibrationFactorAndDeterminationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/calibrationFactorAndDeterminationMethod
      schema:name:
        const: Calibration Factor and Determination Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_constantsAndReferenceValuesUsed:
    title: Constants and Reference Values Used
    description: Physical constants and reference values used in data reduction to
      calculate the final reported quantity (e.g., decay constants for age calculation,
      standard isotope ratios, or other citable reference values used in a correction
      or calculation), together with their source. Distinct from the Group 6 reference-material
      fields, which document accepted values for specific calibration/validation materials
      rather than universal physical constants. Record "None" if no citable, revisable
      physical constants feed into this procedure's data reduction.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/constantsAndReferenceValuesUsed
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/constantsAndReferenceValuesUsed
      schema:name:
        const: Constants and Reference Values Used
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_primaryCalibrationStandardName:
    title: Primary Calibration Standard Name
    description: Name(s) of the primary reference material(s) used for element standardization
      (intensity calibration). Include the material name, its source or supplier,
      and a citation for the accepted values used, since results calibrated against
      different published values for the same material are not directly comparable.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/primaryCalibrationStandardName
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/primaryCalibrationStandardName
      schema:name:
        const: Primary Calibration Standard Name
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_secondaryReferenceMaterials:
    title: Secondary Reference Materials
    description: Quality-control reference material(s) analyzed alongside unknowns
      to verify calibration accuracy. Include material name, assessed elements, number
      of analyses (n), and measured vs. accepted values.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/secondaryReferenceMaterials
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/secondaryReferenceMaterials
      schema:name:
        const: Secondary Reference Materials
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_wdsSpectrometerConfiguration:
    title: WDS Spectrometer Configuration
    description: Number, type, and crystal range of WDS spectrometers on the instrument.
      Include manufacturer, model, and crystal range. For SEM-WDS configurations (third-party
      WDS on a non-EPMA platform), include WDS manufacturer and model.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/wdsSpectrometerConfiguration
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/wdsSpectrometerConfiguration
      schema:name:
        const: WDS Spectrometer Configuration
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_edsDetectorConfiguration:
    title: EDS Detector Configuration
    description: EDS detector type, manufacturer, window type, active area, and detector
      geometry (take-off angle, position).
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/edsDetectorConfiguration
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/edsDetectorConfiguration
      schema:name:
        const: EDS Detector Configuration
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_wdsSpectrometerChannel:
    title: WDS Spectrometer Channel
    description: "WDS spectrometer position(s) assigned to each analyte, one entry
      per assignment. An analyte may be assigned to more than one spectrometer with
      intensities aggregated (aggregate intensity counting), and one spectrometer
      serves several analytes across a run, so the assignment \u2014 not the analyte
      \u2014 is the unit carrying the spectrometer setup. Different spectrometers
      may have different crystal configurations."
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/wdsSpectrometerChannel
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/wdsSpectrometerChannel
      schema:name:
        const: WDS Spectrometer Channel
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_sequence:
    title: Sequence
    description: Order in which spectrometer assignments are acquired during point
      analysis. Relevant for minimizing beam damage (volatile elements measured first)
      and for sequential multi-channel setups. Not applicable to X-ray mapping, where
      all assigned spectrometers collect simultaneously at each pixel.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/sequence
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/sequence
      schema:name:
        const: Sequence
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_proportionalCounterDetector:
    title: Proportional Counter / Detector
    description: Type of detector used on each spectrometer assignment. Affects sensitivity
      and count rate linearity.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/proportionalCounterDetector
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/proportionalCounterDetector
      schema:name:
        const: Proportional Counter / Detector
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_wdsPhaSetting:
    title: WDS PHA Setting
    description: Pulse height analyzer (PHA) setting for the WDS detector. Integral
      mode accepts all pulses above a threshold; Differential mode selects a narrow
      energy window to reject higher-order reflections and escape peaks.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/wdsPhaSetting
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/wdsPhaSetting
      schema:name:
        const: WDS PHA Setting
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_stageScanVsBeamScan:
    title: Stage Scan vs. Beam Scan
    description: Whether the X-ray map was acquired by moving the sample stage (stage
      scan) or by deflecting the electron beam (beam scan). Stage scan preserves beam
      geometry and spot size across the full map but is slower; beam scan is faster
      but may introduce geometric distortion at large deflections.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/stageScanVsBeamScan
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/stageScanVsBeamScan
      schema:name:
        const: Stage Scan vs. Beam Scan
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_analyteEstimationMethod:
    title: Analyte Estimation Method
    description: Whether elemental concentrations were calculated directly from measured
      X-ray intensities, or estimated by cation stoichiometry (e.g., oxygen calculated
      from cation proportions in silicates; carbon from stoichiometry in carbonates).
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/analyteEstimationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/analyteEstimationMethod
      schema:name:
        const: Analyte Estimation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_edsSpectralProcessingType:
    title: EDS Spectral Processing Type
    description: Method used to process EDS spectra and extract net peak intensities
      from raw spectral data. Applied before quantification (see Matrix Correction
      Method). Common approaches include background fitting and subtraction followed
      by peak integration, and filter fit or Gaussian deconvolution for overlapping
      peaks.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/edsSpectralProcessingType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/edsSpectralProcessingType
      schema:name:
        const: EDS Spectral Processing Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_interferingElements:
    title: Interfering Elements
    description: Element(s) whose X-ray lines overlap with the measured peak for this
      analyte, requiring a correction.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/interferingElements
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/interferingElements
      schema:name:
        const: Interfering Elements
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_interferenceCorrectionStandard:
    title: Interference Correction Standard
    description: Reference material used to quantify and calibrate the interference
      correction for this analyte.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/interferenceCorrectionStandard
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/interferenceCorrectionStandard
      schema:name:
        const: Interference Correction Standard
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_coupledProcedureDoi:
    title: Coupled Procedure DOI
    description: Registered procedure DOI for the coupled technique named above. Provides
      a stable, citable link to the companion method independent of whether a dataset
      has been deposited. If the coupled procedure has not yet been registered, enter
      the DOI of a publication describing the coupled method, or "pending". Enter
      "None" if no coupling is planned.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/coupledProcedureDoi
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/coupledProcedureDoi
      schema:name:
        const: Coupled Procedure DOI
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_coupledDatasetOrPublicationReference:
    title: Coupled Dataset or Publication Reference
    description: 'DOI or other persistent identifier for the co-registered dataset
      or publication where both datasets are reported together. Accepts: a dedicated
      dataset DOI (if separately deposited), a shared dataset DOI (if co-submitted
      in the same package), or a publication DOI. Use "same submission" if the coupled
      dataset is included in this data package, or "pending" if not yet assigned.
      If coupling is documented through a shared sample identifier only, that information
      is already captured in Sample Persistent Identifier (Group 2).'
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/coupledDatasetOrPublicationReference
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/coupledDatasetOrPublicationReference
      schema:name:
        const: Coupled Dataset or Publication Reference
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_sampleFormAnalyticalSubstrate:
    title: Sample Form / Analytical Substrate
    description: Physical form of the material as it enters the ablation cell. Editable
      to accommodate legitimate variations (e.g., thin section vs. mount) that do
      not alter the analytical procedure.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/sampleFormAnalyticalSubstrate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/sampleFormAnalyticalSubstrate
      schema:name:
        const: Sample Form / Analytical Substrate
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_samplePersistentIdentifier:
    title: Sample Persistent Identifier
    description: Globally unique, persistent identifier for each sample listed in
      Sample Name. IGSN (International Geo Sample Number) is the recommended standard
      for geological and cosmochemical samples, as used by Astromat, EarthChem and
      SESAR. Where a sample and its sub-samples are separately registered, record
      the identifier at the level actually analysed.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/samplePersistentIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/samplePersistentIdentifier
      schema:name:
        const: Sample Persistent Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_fusionFluxAndDilutionRatio:
    title: Fusion Flux and Dilution Ratio
    description: For procedures using fused glass, the flux type and sample:flux dilution
      ratio used to prepare the analytical glass.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/fusionFluxAndDilutionRatio
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/fusionFluxAndDilutionRatio
      schema:name:
        const: Fusion Flux and Dilution Ratio
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_samplePreparationMethod:
    title: Sample Preparation Method
    description: Description of how samples were prepared for analysis (mounting,
      polishing, coating, fusion procedure, etc.).
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/samplePreparationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/samplePreparationMethod
      schema:name:
        const: Sample Preparation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_preAblationSurfaceTreatment:
    title: Pre-Ablation Surface Treatment
    description: Procedure applied immediately before each analysis to remove surface
      contamination or condition the sample surface. Distinct from general sample
      preparation. For spot analysis, pre-ablation pulses are discarded before signal
      acquisition begins. For mapping, this step is typically omitted as the large
      area ablated averages out surface effects.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/preAblationSurfaceTreatment
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/preAblationSurfaceTreatment
      schema:name:
        const: Pre-Ablation Surface Treatment
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_targetSelectionCriteria:
    title: Target Selection Criteria
    description: "The rules governing which part of the sample is analysed, and why.
      Covers the criteria applied when choosing grains, aliquots, spots, or a region
      of interest \u2014 size, morphology, clarity, freedom from inclusions or alteration,
      phase identity, or spatial position. Distinct from Target Material, which states
      the material type the procedure is designed for: this field states how, within
      such a sample, the analysed portion is picked out."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/targetSelectionCriteria
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/targetSelectionCriteria
      schema:name:
        const: Target Selection Criteria
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_preAnalysisImagingAndScreening:
    title: Pre-Analysis Imaging and Screening
    description: Imaging or other characterisation performed before the measurement
      in order to select or locate the analysed target, including the technique, instrument
      and settings used, and how individual analyses are linked back to the images.
      Distinct from any imaging the procedure performs as its own measurement. Where
      the imaging is performed on a separate instrument, it should also be recorded
      in the Group 1 coupling fields.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/preAnalysisImagingAndScreening
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/preAnalysisImagingAndScreening
      schema:name:
        const: Pre-Analysis Imaging and Screening
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_instrumentSerialNumberOrLabIdentifier:
    title: Instrument Serial Number or Lab Identifier
    description: Serial number or laboratory-internal identifier for the specific
      instrument unit. Supports traceability to instrument service records.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/instrumentSerialNumberOrLabIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/instrumentSerialNumberOrLabIdentifier
      schema:name:
        const: Instrument Serial Number or Lab Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_torchDepth:
    title: Torch Depth
    description: Distance between the load coil and the sampling cone tip (mm), also
      called injector depth or torch position depending on the instrument manufacturer.
      Affects ion transmission efficiency, oxide formation, and doubly-charged species
      production. The procedure specifies a target value optimised during initial
      setup; the analyst confirms or fine-adjusts during session tuning.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/torchDepth
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/torchDepth
      schema:name:
        const: Torch Depth
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_massResolutionSetting:
    title: Mass Resolution Setting
    description: Operating mass resolution of the mass analyser. For quadrupole instruments
      this is fixed at unit resolution by instrument design. For sector-field instruments
      the analyst selects low, medium, or high resolution to balance sensitivity against
      spectral interference suppression.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/massResolutionSetting
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/massResolutionSetting
      schema:name:
        const: Mass Resolution Setting
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_dataProcessingSoftware:
    title: Data Processing Software(s)
    description: All software applied to the data after acquisition in order to produce
      the reported quantities, including version numbers. List every package used.
      Distinct from Acquisition Software, which controls the instrument and collects
      the raw data.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/dataProcessingSoftware
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/dataProcessingSoftware
      schema:name:
        const: Data Processing Software(s)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_laserSpotGeometry:
    title: Laser Spot Geometry
    description: "Shape and dimensions of the laser ablation spot in micrometres registered
      by the procedure. For circular spots, report diameter; for square or rectangular
      spots, report width \xD7 length. The procedure registers the typical geometry;
      analysts may adjust within procedure-allowed range."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/laserSpotGeometry
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/laserSpotGeometry
      schema:name:
        const: Laser Spot Geometry
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_laserEnergy:
    title: Laser Energy
    description: "Laser pulse energy in millijoules as set at the laser output or
      measured at the sample surface. Less commonly reported than fluence because
      it does not account for spot area. Report only when the system displays energy
      directly. Laser fluence (J cm\u207B\xB2) is the preferred quantity and is captured
      in Default Laser Fluence."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/laserEnergy
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/laserEnergy
      schema:name:
        const: Laser Energy
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpms_laserFluence:
    title: Laser Fluence (Energy Density)
    description: "Laser pulse energy per unit area at the sample surface in J cm\u207B\xB2,
      as registered by the procedure. Fluence is the physically meaningful quantity
      controlling ablation rate, crater morphology, elemental fractionation, and particle
      size distribution. If the system reports only as % of maximum output, include
      that value and note the system maximum where known."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/laserFluence
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/laserFluence
      schema:name:
        const: Laser Fluence (Energy Density)
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpms_laserRepetitionRate:
    title: Laser Repetition Rate
    description: Laser pulse repetition rate in hertz registered by the procedure.
      For mapping methods, repetition rate together with scan speed and spot size
      determines pixel size and spatial resolution. Analysts may adjust within procedure-allowed
      bounds.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/laserRepetitionRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/laserRepetitionRate
      schema:name:
        const: Laser Repetition Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpms_ablationDurationPerSpot:
    title: Ablation Duration per Spot
    description: 'Total on-sample ablation (signal acquisition) time per individual
      spot in seconds, as set in the acquisition method. This is a procedure-level
      parameter for spot analysis: it reflects the deliberate trade-off between signal
      accumulation (longer = lower LOD), sample consumption, and session throughput.
      For transect analysis, the equivalent procedure-level parameter is scan speed
      (captured in Transect Rate, Mapping Rate or Step Size). For mapping analysis,
      total acquisition time is sample-area-dependent and therefore analysis-level,
      not captured here.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/ablationDurationPerSpot
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/ablationDurationPerSpot
      schema:name:
        const: Ablation Duration per Spot
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpms_ablationPitDepthAndAblationRate:
    title: Ablation Pit Depth and Ablation Rate
    description: Depth of the ablation pit produced under the registered laser conditions,
      the method used to measure it, and the resulting per-pulse ablation rate. Sets
      the achievable depth resolution and governs downhole elemental fractionation.
      For transect and mapping the equivalent quantity is trench depth under the same
      conditions.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/ablationPitDepthAndAblationRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/ablationPitDepthAndAblationRate
      schema:name:
        const: Ablation Pit Depth and Ablation Rate
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_transectRateMappingRateOrStepSize:
    title: Transect Rate, Mapping Rate or Step Size
    description: "For continuous line scan (transect) and raster mapping: the stage
      translation speed in \xB5m s\u207B\xB9. This is the procedure-level parameter
      that, together with spot size and repetition rate, determines spatial resolution
      along the scan direction. For mapping, the mapping rate (mm\xB2 h\u207B\xB9)
      may be reported as an alternative when scan speed is session-variable. For stepped
      line profiles: the distance between successive spot positions in \xB5m."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/transectRateMappingRateOrStepSize
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/transectRateMappingRateOrStepSize
      schema:name:
        const: Transect Rate, Mapping Rate or Step Size
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_rasterLineSpacing:
    title: Raster Line Spacing (Mapping Only)
    description: Distance between adjacent raster lines in a 2D elemental map, measured
      perpendicular to the scan direction, in micrometres. Together with spot size,
      this determines whether adjacent lines are contiguous (line spacing = spot size),
      overlapping (line spacing < spot size), or have gaps (line spacing > spot size).
      Applies to raster mapping only.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/rasterLineSpacing
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/rasterLineSpacing
      schema:name:
        const: Raster Line Spacing (Mapping Only)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_carrierGasAndFlowRate:
    title: Carrier Gas and Flow Rate
    description: "Gas used to transport ablated aerosol from the ablation cell to
      the ICP-MS torch, with the procedure-registered target flow rate(s). Helium
      is standard for most UV laser systems due to superior aerosol transport. Flow
      rates are procedure targets; actual session values may be adjusted within \xB110%
      during tuning."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/carrierGasAndFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/carrierGasAndFlowRate
      schema:name:
        const: Carrier Gas and Flow Rate
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_makeUpGasAndFlowRate:
    title: Make-up Gas and Flow Rate
    description: "Supplementary gas added to the sample-carrying stream between the
      sample introduction system and the plasma, with its identity and the procedure-registered
      target flow rate. Argon make-up is standard and maintains total gas delivery
      where the carrier flow alone is insufficient \u2014 downstream of an ablation
      cell, or of a desolvation system that has removed solvent load. Small nitrogen
      or hydrogen additions are also made here to enhance sensitivity for some elements;
      record them with their own flow, whose unit commonly differs from the make-up
      flow. Record 'None' explicitly where no supplementary gas is added, to distinguish
      it from not reported."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/makeUpGasAndFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/makeUpGasAndFlowRate
      schema:name:
        const: Make-up Gas and Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpms_coolantGasFlowRate:
    title: Coolant (Plasma) Gas Flow Rate
    description: Flow rate of the outer (coolant/plasma) argon gas stream that sustains
      the ICP plasma, in L/min. Determines plasma volume and stability. Set during
      initial plasma optimisation and confirmed at each session start.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/coolantGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/coolantGasFlowRate
      schema:name:
        const: Coolant (Plasma) Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpms_auxiliaryGasFlowRate:
    title: Auxiliary Gas Flow Rate
    description: Flow rate of the intermediate (auxiliary) argon gas stream that positions
      the plasma relative to the load coil, in L/min. Affects ion extraction efficiency
      and oxide production rates. Distinct from the carrier gas (which transports
      ablation aerosol) and the coolant (plasma) gas.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/auxiliaryGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/auxiliaryGasFlowRate
      schema:name:
        const: Auxiliary Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpms_rfPower:
    title: RF Power
    description: ICP radiofrequency forward power in watts. Affects plasma temperature,
      ionisation efficiency, oxide formation, and whether cool or normal plasma conditions
      are in effect. The procedure registers a target value optimised during initial
      setup; the analyst confirms or fine-adjusts during session tuning.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/rfPower
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/rfPower
      schema:name:
        const: RF Power
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpms_signalSmoothing:
    title: Signal Smoothing
    description: 'Description of any signal smoothing device or approach installed
      between the ablation cell and the ICP-MS to reduce pulse-to-pulse signal variability.
      Note: active signal smoothing devices (e.g., squid, SCFAST) are generally incompatible
      with high-resolution raster mapping because they degrade spatial resolution
      by mixing aerosol from successive laser shots. For mapping analyses, report
      "None" explicitly.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/signalSmoothing
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/signalSmoothing
      schema:name:
        const: Signal Smoothing
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_icpTuning:
    title: ICP Tuning
    description: Description of the approach used to optimise ICP plasma conditions
      prior to analysis, including the reference material used for tuning and the
      acceptance criteria (e.g., oxide production threshold, sensitivity targets,
      mass calibration).
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/icpTuning
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/icpTuning
      schema:name:
        const: ICP Tuning
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_instrumentSensitivity:
    title: Instrument Sensitivity
    description: "Instrument sensitivity achieved in the session, with the isotope
      or channel it was measured on and the conditions it applies to. May be expressed
      either as detected signal per unit concentration or per unit mass of analyte
      delivered \u2014 counts per second per ppb, volts per ppm, counts per picogram
      \u2014 or as useful yield, the percentage of sampled atoms ultimately detected
      as ions, with the method used to derive it cited. Useful yield is the more comparable
      of the two wherever the amount of material consumed varies between procedures,
      as it does with spot size, fluence and repetition rate. Records what the instrument
      actually delivered; a sensitivity the procedure requires before analyses may
      begin belongs with the tuning acceptance criteria."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/instrumentSensitivity
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/instrumentSensitivity
      schema:name:
        const: Instrument Sensitivity
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpms_doublyChargedSpeciesMonitor:
    title: Doubly-Charged Species Monitor
    description: "The mass ratio monitored to estimate doubly-charged ion (M\xB2\u207A)
      formation during instrument tuning. Doubly-charged ions appear at half the mass
      of the parent ion and can cause isobaric interferences on analytes in that mass
      region. The monitor species and the mass positions monitored should be stated
      explicitly. Analogous to Oxide Production Method and Threshold for oxide monitoring."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/doublyChargedSpeciesMonitor
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/doublyChargedSpeciesMonitor
      schema:name:
        const: Doubly-Charged Species Monitor
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_doublyChargedSpeciesProduction:
    title: Doubly-Charged Species Production
    description: Measured percentage of doubly-charged ion production for the monitored
      species at the time of instrument tuning. The procedure should specify the acceptable
      threshold (e.g., <1%, <3%); the measured value for each session is recorded
      here. Report both the threshold and the measured value where possible.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/doublyChargedSpeciesProduction
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/doublyChargedSpeciesProduction
      schema:name:
        const: Doubly-Charged Species Production
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_analysisSequence:
    title: Analysis Sequence
    description: Repeating order of primary calibration standard(s), quality control
      standard(s), and unknown analyses within a measurement session. Editable to
      allow minor adjustments while maintaining the bracketing strategy defined in
      the procedure.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/analysisSequence
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/analysisSequence
      schema:name:
        const: Analysis Sequence
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_ionCounterDeadTime:
    title: Ion Counter Dead Time
    description: Dead time of each ion-counting detector channel, used in the dead-time
      correction applied to high count rates. Distinct from pulse/analog cross-calibration,
      which relates the two detector modes rather than correcting counting losses
      within the pulse-counting mode.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/ionCounterDeadTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/ionCounterDeadTime
      schema:name:
        const: Ion Counter Dead Time
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpms_collisionGasFlowRate:
    title: Collision Gas Flow Rate
    description: Flow rate of the collision gas (typically He) introduced into the
      collision/reaction cell, in mL/min. Controls the degree of ion thermalization
      and KED efficiency. Record 'None' if the CRC is in STD mode. Record 'N/A' where
      Collision/Reaction Cell (CRC) Configuration does not include KED.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/collisionGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/collisionGasFlowRate
      schema:name:
        const: Collision Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpms_cellExitDiscriminationVoltage:
    title: Cell Exit Discrimination Voltage
    description: Bias voltage applied at the collision/reaction cell exit to discriminate
      between analyte ions and low-energy polyatomic interferences in KED mode, in
      volts (V). A negative bias preferentially retards slow polyatomic ions while
      transmitting faster analyte ions. Record 'None' if the CRC is in STD mode. Record
      'N/A' where Collision/Reaction Cell (CRC) Configuration does not include KED.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/cellExitDiscriminationVoltage
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/cellExitDiscriminationVoltage
      schema:name:
        const: Cell Exit Discrimination Voltage
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpms_reactionGasFlowRate:
    title: Reaction Gas Flow Rate
    description: Flow rate of the reactive gas introduced into the dynamic reaction
      cell (DRC), in mL/min. Record 'N/A' where Collision/Reaction Cell (CRC) Configuration
      does not include DRC.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/reactionGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/reactionGasFlowRate
      schema:name:
        const: Reaction Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpms_backgroundCountTime:
    title: Background Count Time
    description: Total time spent measuring gas blank (background signal with laser
      off or shutter closed) before each ablation event, in seconds. For spot and
      transect analysis, a discrete background interval is measured before each ablation.
      For mapping, background is typically measured once per raster line or at the
      start of a map session rather than before each individual pixel. Editable to
      allow session-specific adjustment.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/backgroundCountTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/backgroundCountTime
      schema:name:
        const: Background Count Time
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpms_numberOfBlocksPerMeasurement:
    title: Number of Blocks per Measurement
    description: Number of measurement blocks acquired per sample or standard solution
      introduction. In MC-ICP-MS, data are structured as blocks of cycles; each block
      typically begins with a baseline (on-peak zero) measurement before the analytical
      cycles. Multiple blocks per sample allow inspection of signal stability and
      within-measurement drift. Procedure specifies the standard number; analyst may
      adjust for samples with low signal or for high-precision requirements.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/numberOfBlocksPerMeasurement
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/numberOfBlocksPerMeasurement
      schema:name:
        const: Number of Blocks per Measurement
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_numberOfCyclesPerBlock:
    title: Number of Cycles per Block
    description: "Number of measurement cycles acquired per block. One cycle corresponds
      to a single set of simultaneous Faraday cup readings integrated for the duration
      specified in Integration Time per Cycle. Total integration time per sample =
      (Number of Cycles per Block) \xD7 (Integration Time per Cycle) \xD7 (Number
      of Blocks per Measurement). Procedure specifies the standard value; analyst
      may adjust within procedure bounds."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/numberOfCyclesPerBlock
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/numberOfCyclesPerBlock
      schema:name:
        const: Number of Cycles per Block
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_integrationTimePerCycle:
    title: Integration Time per Cycle
    description: "Duration of signal integration per measurement cycle (seconds).
      Determines counting statistics per cycle. Longer integration times improve shot-noise
      precision but increase the impact of signal drift within the integration window.
      For high-gain (10\xB9\xB2 or 10\xB9\xB3 \u03A9) amplifier channels, longer integration
      times are often required to accumulate sufficient charge. Procedure specifies
      the standard integration time; analyst may confirm or adjust within procedure
      bounds. Where different isotope channels use different integration schemes,
      record the time for each channel."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/integrationTimePerCycle
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/integrationTimePerCycle
      schema:name:
        const: Integration Time per Cycle
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpms_uncertaintyPropagationMethod:
    title: Uncertainty Propagation Method
    description: 'The approach used to propagate analytical uncertainty through the
      data reduction chain to the final reported value. State which sources are included
      in the propagation: counting statistics, calibration standard uncertainty, internal
      standard uncertainty, drift correction, and any systematic contributions. Distinct
      from Uncertainty Level, which states the convention at which the resulting uncertainty
      is quoted.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/uncertaintyPropagationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/uncertaintyPropagationMethod
      schema:name:
        const: Uncertainty Propagation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_spikeOutlierFilteringApproach:
    title: Spike / Outlier Filtering Approach
    description: Method used to identify and remove anomalous signal spikes arising
      from micronuggets, inclusions, cracks, or instrument artifacts during time-resolved
      signal processing. Editable because the specific implementation may vary between
      sessions while remaining within the procedure framework.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/spikeOutlierFilteringApproach
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/spikeOutlierFilteringApproach
      schema:name:
        const: Spike / Outlier Filtering Approach
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_memoryEffectMitigation:
    title: Memory Effect Mitigation
    description: Procedure applied to identify and minimise memory effects from high-concentration
      elements in the previous sample or standard that may contaminate subsequent
      analyses, or from incomplete aerosol washout between adjacent pixels in raster
      mapping mode. For mapping, the mitigation strategy involves controlling scan
      speed relative to washout time to ensure each pixel signal is sufficiently free
      of the preceding pixel's contribution.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/memoryEffectMitigation
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/memoryEffectMitigation
      schema:name:
        const: Memory Effect Mitigation
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_normalizationStandardsBasedCorrection:
    title: Normalization / Standards-Based Correction
    description: Any post-acquisition normalization applied to correct for systematic
      biases identified from secondary reference materials, or stoichiometric normalization
      applied per pixel in mapping. Distinct from the primary internal standard approach
      captured in Internal Standard Approach.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/normalizationStandardsBasedCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/normalizationStandardsBasedCorrection
      schema:name:
        const: Normalization / Standards-Based Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_calibrationFactorAndDeterminationMethod:
    title: Calibration Factor and Determination Method
    description: 'An externally-calibrated factor that converts the measured quantity
      into the reported quantity, how it was determined, and its uncertainty. Applies
      where the conversion depends on a factor calibrated against a reference of independently
      known value, rather than on the instrument response alone. Distinct from the
      fields that name the calibration material and that state which approach applies
      to which analyte, where the technique has them: this field records the resulting
      factor itself.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/calibrationFactorAndDeterminationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/calibrationFactorAndDeterminationMethod
      schema:name:
        const: Calibration Factor and Determination Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_doubleSpikeMixingRatio:
    title: Double-Spike Mixing Ratio
    description: "Target proportion of double-spike signal relative to total analyte
      signal in the spiked mixture, expressed as spike fraction (0\u20131) or spike:sample
      ratio. An optimal mixing ratio minimizes error propagation through the double-spike
      inversion; the optimum is analyte-system specific and is typically determined
      using the Double Spike Toolbox or equivalent. The achieved mixing ratio may
      deviate from the target within acceptable bounds (typically \xB120% of optimal);
      the double-spike inversion corrects for actual mixing ratios. Record 'N/A' if
      double-spike method is not used. Record 'N/A' where the procedure does not use
      a double spike."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/doubleSpikeMixingRatio
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/doubleSpikeMixingRatio
      schema:name:
        const: Double-Spike Mixing Ratio
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_constantsAndReferenceValuesUsed:
    title: Constants and Reference Values Used
    description: Physical constants and reference values used in data reduction to
      calculate the final reported quantity (e.g., decay constants for age calculation,
      standard isotope ratios, or other citable reference values used in a correction
      or calculation), together with their source. Distinct from the Group 6 reference-material
      fields, which document accepted values for specific calibration/validation materials
      rather than universal physical constants. Record "None" if no citable, revisable
      physical constants feed into this procedure's data reduction.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/constantsAndReferenceValuesUsed
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/constantsAndReferenceValuesUsed
      schema:name:
        const: Constants and Reference Values Used
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_primaryCalibrationStandardName:
    title: Primary Calibration Standard Name
    description: Primary reference material(s) used to calibrate the instrument and
      convert raw signal intensities to concentrations or isotope ratios. Include
      material name, source institution, and citation for the accepted values used.
      Editable because the specific lot or certification vintage may differ between
      sessions while the material type remains the same.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/primaryCalibrationStandardName
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/primaryCalibrationStandardName
      schema:name:
        const: Primary Calibration Standard Name
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_secondaryReferenceMaterials:
    title: Secondary Reference Materials
    description: Quality-control reference materials analysed as unknowns alongside
      samples in the same session to assess accuracy and monitor drift. Include material
      name, source, and citation for accepted values used for comparison. Editable
      because selection of secondary RMs may vary across sessions.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/secondaryReferenceMaterials
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/secondaryReferenceMaterials
      schema:name:
        const: Secondary Reference Materials
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_samplerAndSkimmerConeMaterial:
    title: Sampler and Skimmer Cone Material
    description: Material composition of the sampler and skimmer cones. Common materials
      are nickel (standard), platinum (for high-TDS or organic-matrix samples), and
      aluminium (for high-purity work). Cone material affects sensitivity, matrix
      tolerance, and long-term stability. State both sampler and skimmer materials;
      if identical, a single statement is acceptable.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/samplerAndSkimmerConeMaterial
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/samplerAndSkimmerConeMaterial
      schema:name:
        const: Sampler and Skimmer Cone Material
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_torchType:
    title: Torch Type
    description: "Type of plasma torch installed. Injector inner diameter (typically
      1.5\u20132.5 mm) affects aerosol transport efficiency and plasma conditions
      in LA-ICP-MS."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/torchType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/torchType
      schema:name:
        const: Torch Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_laserBeamEnergyProfile:
    title: Laser Beam Energy Profile
    description: Spatial energy distribution of the laser beam at the sample surface,
      and whether a beam homogenizer is installed. A flat-top (top-hat) profile produces
      more uniform ablation craters and more reproducible crater morphology than a
      Gaussian beam. This is a fixed hardware property of the laser system.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/laserBeamEnergyProfile
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/laserBeamEnergyProfile
      schema:name:
        const: Laser Beam Energy Profile
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_instrumentWarmUpSessionDurationLimit:
    title: Instrument Warm-up / Session Duration Limit
    description: Minimum warm-up time required after plasma ignition before analyses
      begin, and any maximum session duration enforced to maintain stable operating
      conditions. These constraints are part of the procedure and cannot be varied
      by the analyst.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/instrumentWarmUpSessionDurationLimit
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/instrumentWarmUpSessionDurationLimit
      schema:name:
        const: Instrument Warm-up / Session Duration Limit
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_reactionGasType:
    title: Reaction Gas Type
    description: "Type of reactive gas introduced into the dynamic reaction cell (DRC)
      for interference removal through ion-molecule reactions. Common reaction gases
      include NH\u2083 (e.g., for Fe, Ca, K isotopes) and O\u2082 (e.g., for As, Ge).
      Record 'None' if DRC mode is not used. Record 'N/A' where Collision/Reaction
      Cell (CRC) Configuration does not include DRC."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/reactionGasType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/reactionGasType
      schema:name:
        const: Reaction Gas Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_multiRunSequentialAnalysisDesign:
    title: Multi-Run Sequential Analysis Design
    description: Whether the procedure uses a single acquisition pass or multiple
      sequential runs on the same sample location, each optimized for different analytical
      objectives. For multi-run designs, describe the number of runs, their purpose,
      key laser and instrument settings per run, and how outputs of one run feed into
      data reduction of another. Not applicable to raster mapping, where each spatial
      location is visited exactly once.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/multiRunSequentialAnalysisDesign
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/multiRunSequentialAnalysisDesign
      schema:name:
        const: Multi-Run Sequential Analysis Design
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpms_matrixOffsetCorrection:
    title: Matrix Offset Correction (LIEF)
    description: Whether an empirical correction was applied to account for systematic
      differences in laser-induced elemental fractionation (LIEF) patterns between
      the external calibration standard and the sample matrix.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsTAPP/matrixOffsetCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsTAPP/matrixOffsetCorrection
      schema:name:
        const: Matrix Offset Correction (LIEF)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_coupledProcedureDoi:
    title: Coupled Procedure DOI
    description: Registered procedure DOI for the coupled technique named above. Provides
      a stable, citable link to the companion method independent of whether a dataset
      has been deposited. If the coupled procedure has not yet been registered, enter
      the DOI of a publication describing the coupled method, or "pending". Enter
      "None" if no coupling is planned.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/coupledProcedureDoi
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/coupledProcedureDoi
      schema:name:
        const: Coupled Procedure DOI
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_coupledDatasetOrPublicationReference:
    title: Coupled Dataset or Publication Reference
    description: 'DOI or other persistent identifier for the co-registered dataset
      or publication where both datasets are reported together. Accepts: a dedicated
      dataset DOI (if separately deposited), a shared dataset DOI (if co-submitted
      in the same package), or a publication DOI. Use "same submission" if the coupled
      dataset is included in this data package, or "pending" if not yet assigned.
      If coupling is documented through a shared sample identifier only, that information
      is already captured in Sample Persistent Identifier (Group 2).'
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/coupledDatasetOrPublicationReference
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/coupledDatasetOrPublicationReference
      schema:name:
        const: Coupled Dataset or Publication Reference
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_sampleFormAnalyticalSubstrate:
    title: Sample Form / Analytical Substrate
    description: Physical form of the material as it enters the ablation cell. Editable
      to accommodate legitimate variations (e.g., thin section vs. mount) that do
      not alter the analytical procedure.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/sampleFormAnalyticalSubstrate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/sampleFormAnalyticalSubstrate
      schema:name:
        const: Sample Form / Analytical Substrate
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_samplePersistentIdentifier:
    title: Sample Persistent Identifier
    description: Globally unique, persistent identifier for each sample listed in
      Sample Name. IGSN (International Geo Sample Number) is the recommended standard
      for geological and cosmochemical samples, as used by Astromat, EarthChem and
      SESAR. Where a sample and its sub-samples are separately registered, record
      the identifier at the level actually analysed.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/samplePersistentIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/samplePersistentIdentifier
      schema:name:
        const: Sample Persistent Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_fusionFluxAndDilutionRatio:
    title: Fusion Flux and Dilution Ratio
    description: For procedures using fused glass, the flux type and sample:flux dilution
      ratio used to prepare the analytical glass.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/fusionFluxAndDilutionRatio
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/fusionFluxAndDilutionRatio
      schema:name:
        const: Fusion Flux and Dilution Ratio
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_samplePreparationMethod:
    title: Sample Preparation Method
    description: Description of how samples were prepared for analysis (mounting,
      polishing, coating, fusion procedure, etc.).
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/samplePreparationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/samplePreparationMethod
      schema:name:
        const: Sample Preparation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_preAblationSurfaceTreatment:
    title: Pre-Ablation Surface Treatment
    description: Procedure applied immediately before each analysis to remove surface
      contamination or condition the sample surface. Distinct from general sample
      preparation. For spot analysis, pre-ablation pulses are discarded before signal
      acquisition begins. For mapping, this step is typically omitted as the large
      area ablated averages out surface effects.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/preAblationSurfaceTreatment
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/preAblationSurfaceTreatment
      schema:name:
        const: Pre-Ablation Surface Treatment
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_targetSelectionCriteria:
    title: Target Selection Criteria
    description: "The rules governing which part of the sample is analysed, and why.
      Covers the criteria applied when choosing grains, aliquots, spots, or a region
      of interest \u2014 size, morphology, clarity, freedom from inclusions or alteration,
      phase identity, or spatial position. Distinct from Target Material, which states
      the material type the procedure is designed for: this field states how, within
      such a sample, the analysed portion is picked out."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/targetSelectionCriteria
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/targetSelectionCriteria
      schema:name:
        const: Target Selection Criteria
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_preAnalysisImagingAndScreening:
    title: Pre-Analysis Imaging and Screening
    description: Imaging or other characterisation performed before the measurement
      in order to select or locate the analysed target, including the technique, instrument
      and settings used, and how individual analyses are linked back to the images.
      Distinct from any imaging the procedure performs as its own measurement. Where
      the imaging is performed on a separate instrument, it should also be recorded
      in the Group 1 coupling fields.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/preAnalysisImagingAndScreening
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/preAnalysisImagingAndScreening
      schema:name:
        const: Pre-Analysis Imaging and Screening
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_instrumentSerialNumberOrLabIdentifier:
    title: Instrument Serial Number or Lab Identifier
    description: Serial number or laboratory-internal identifier for the specific
      instrument unit. Supports traceability to instrument service records.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/instrumentSerialNumberOrLabIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/instrumentSerialNumberOrLabIdentifier
      schema:name:
        const: Instrument Serial Number or Lab Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_torchDepth:
    title: Torch Depth
    description: Distance between the load coil and the sampling cone tip (mm), also
      called injector depth or torch position depending on the instrument manufacturer.
      Affects ion transmission efficiency, oxide formation, and doubly-charged species
      production. The procedure specifies a target value optimised during initial
      setup; the analyst confirms or fine-adjusts during session tuning.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/torchDepth
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/torchDepth
      schema:name:
        const: Torch Depth
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_massResolutionSetting:
    title: Mass Resolution Setting
    description: Operating mass resolution of the mass analyser. For quadrupole instruments
      this is fixed at unit resolution by instrument design. For sector-field instruments
      the analyst selects low, medium, or high resolution to balance sensitivity against
      spectral interference suppression.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/massResolutionSetting
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/massResolutionSetting
      schema:name:
        const: Mass Resolution Setting
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_dataProcessingSoftware:
    title: Data Processing Software(s)
    description: All software applied to the data after acquisition in order to produce
      the reported quantities, including version numbers. List every package used.
      Distinct from Acquisition Software, which controls the instrument and collects
      the raw data.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/dataProcessingSoftware
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/dataProcessingSoftware
      schema:name:
        const: Data Processing Software(s)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_laserSpotGeometry:
    title: Laser Spot Geometry
    description: "Shape and dimensions of the laser ablation spot in micrometres registered
      by the procedure. For circular spots, report diameter; for square or rectangular
      spots, report width \xD7 length. The procedure registers the typical geometry;
      analysts may adjust within procedure-allowed range."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/laserSpotGeometry
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/laserSpotGeometry
      schema:name:
        const: Laser Spot Geometry
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_laserEnergy:
    title: Laser Energy
    description: "Laser pulse energy in millijoules as set at the laser output or
      measured at the sample surface. Less commonly reported than fluence because
      it does not account for spot area. Report only when the system displays energy
      directly. Laser fluence (J cm\u207B\xB2) is the preferred quantity and is captured
      in Default Laser Fluence."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/laserEnergy
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/laserEnergy
      schema:name:
        const: Laser Energy
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpmsUPb_laserFluence:
    title: Laser Fluence (Energy Density)
    description: "Laser pulse energy per unit area at the sample surface in J cm\u207B\xB2,
      as registered by the procedure. Fluence is the physically meaningful quantity
      controlling ablation rate, crater morphology, elemental fractionation, and particle
      size distribution. If the system reports only as % of maximum output, include
      that value and note the system maximum where known."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/laserFluence
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/laserFluence
      schema:name:
        const: Laser Fluence (Energy Density)
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpmsUPb_laserRepetitionRate:
    title: Laser Repetition Rate
    description: Laser pulse repetition rate in hertz registered by the procedure.
      For mapping methods, repetition rate together with scan speed and spot size
      determines pixel size and spatial resolution. Analysts may adjust within procedure-allowed
      bounds.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/laserRepetitionRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/laserRepetitionRate
      schema:name:
        const: Laser Repetition Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpmsUPb_ablationDurationPerSpot:
    title: Ablation Duration per Spot
    description: 'Total on-sample ablation (signal acquisition) time per individual
      spot in seconds, as set in the acquisition method. This is a procedure-level
      parameter for spot analysis: it reflects the deliberate trade-off between signal
      accumulation (longer = lower LOD), sample consumption, and session throughput.
      For transect analysis, the equivalent procedure-level parameter is scan speed
      (captured in Transect Rate, Mapping Rate or Step Size). For mapping analysis,
      total acquisition time is sample-area-dependent and therefore analysis-level,
      not captured here.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/ablationDurationPerSpot
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/ablationDurationPerSpot
      schema:name:
        const: Ablation Duration per Spot
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpmsUPb_ablationPitDepthAndAblationRate:
    title: Ablation Pit Depth and Ablation Rate
    description: Depth of the ablation pit produced under the registered laser conditions,
      the method used to measure it, and the resulting per-pulse ablation rate. Sets
      the achievable depth resolution and governs downhole elemental fractionation.
      For transect and mapping the equivalent quantity is trench depth under the same
      conditions.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/ablationPitDepthAndAblationRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/ablationPitDepthAndAblationRate
      schema:name:
        const: Ablation Pit Depth and Ablation Rate
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_transectRateMappingRateOrStepSize:
    title: Transect Rate, Mapping Rate or Step Size
    description: "For continuous line scan (transect) and raster mapping: the stage
      translation speed in \xB5m s\u207B\xB9. This is the procedure-level parameter
      that, together with spot size and repetition rate, determines spatial resolution
      along the scan direction. For mapping, the mapping rate (mm\xB2 h\u207B\xB9)
      may be reported as an alternative when scan speed is session-variable. For stepped
      line profiles: the distance between successive spot positions in \xB5m."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/transectRateMappingRateOrStepSize
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/transectRateMappingRateOrStepSize
      schema:name:
        const: Transect Rate, Mapping Rate or Step Size
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_rasterLineSpacing:
    title: Raster Line Spacing (Mapping Only)
    description: Distance between adjacent raster lines in a 2D elemental map, measured
      perpendicular to the scan direction, in micrometres. Together with spot size,
      this determines whether adjacent lines are contiguous (line spacing = spot size),
      overlapping (line spacing < spot size), or have gaps (line spacing > spot size).
      Applies to raster mapping only.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/rasterLineSpacing
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/rasterLineSpacing
      schema:name:
        const: Raster Line Spacing (Mapping Only)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_carrierGasAndFlowRate:
    title: Carrier Gas and Flow Rate
    description: "Gas used to transport ablated aerosol from the ablation cell to
      the ICP-MS torch, with the procedure-registered target flow rate(s). Helium
      is standard for most UV laser systems due to superior aerosol transport. Flow
      rates are procedure targets; actual session values may be adjusted within \xB110%
      during tuning."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/carrierGasAndFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/carrierGasAndFlowRate
      schema:name:
        const: Carrier Gas and Flow Rate
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_makeUpGasAndFlowRate:
    title: Make-up Gas and Flow Rate
    description: "Supplementary gas added to the sample-carrying stream between the
      sample introduction system and the plasma, with its identity and the procedure-registered
      target flow rate. Argon make-up is standard and maintains total gas delivery
      where the carrier flow alone is insufficient \u2014 downstream of an ablation
      cell, or of a desolvation system that has removed solvent load. Small nitrogen
      or hydrogen additions are also made here to enhance sensitivity for some elements;
      record them with their own flow, whose unit commonly differs from the make-up
      flow. Record 'None' explicitly where no supplementary gas is added, to distinguish
      it from not reported."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/makeUpGasAndFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/makeUpGasAndFlowRate
      schema:name:
        const: Make-up Gas and Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpmsUPb_coolantGasFlowRate:
    title: Coolant (Plasma) Gas Flow Rate
    description: Flow rate of the outer (coolant/plasma) argon gas stream that sustains
      the ICP plasma, in L/min. Determines plasma volume and stability. Set during
      initial plasma optimisation and confirmed at each session start.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/coolantGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/coolantGasFlowRate
      schema:name:
        const: Coolant (Plasma) Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpmsUPb_auxiliaryGasFlowRate:
    title: Auxiliary Gas Flow Rate
    description: Flow rate of the intermediate (auxiliary) argon gas stream that positions
      the plasma relative to the load coil, in L/min. Affects ion extraction efficiency
      and oxide production rates. Distinct from the carrier gas (which transports
      ablation aerosol) and the coolant (plasma) gas.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/auxiliaryGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/auxiliaryGasFlowRate
      schema:name:
        const: Auxiliary Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpmsUPb_rfPower:
    title: RF Power
    description: ICP radiofrequency forward power in watts. Affects plasma temperature,
      ionisation efficiency, oxide formation, and whether cool or normal plasma conditions
      are in effect. The procedure registers a target value optimised during initial
      setup; the analyst confirms or fine-adjusts during session tuning.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/rfPower
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/rfPower
      schema:name:
        const: RF Power
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpmsUPb_signalSmoothing:
    title: Signal Smoothing
    description: 'Description of any signal smoothing device or approach installed
      between the ablation cell and the ICP-MS to reduce pulse-to-pulse signal variability.
      Note: active signal smoothing devices (e.g., squid, SCFAST) are generally incompatible
      with high-resolution raster mapping because they degrade spatial resolution
      by mixing aerosol from successive laser shots. For mapping analyses, report
      "None" explicitly.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/signalSmoothing
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/signalSmoothing
      schema:name:
        const: Signal Smoothing
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_icpTuning:
    title: ICP Tuning
    description: Description of the approach used to optimise ICP plasma conditions
      prior to analysis, including the reference material used for tuning and the
      acceptance criteria (e.g., oxide production threshold, sensitivity targets,
      mass calibration).
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/icpTuning
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/icpTuning
      schema:name:
        const: ICP Tuning
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_instrumentSensitivity:
    title: Instrument Sensitivity
    description: "Instrument sensitivity achieved in the session, with the isotope
      or channel it was measured on and the conditions it applies to. May be expressed
      either as detected signal per unit concentration or per unit mass of analyte
      delivered \u2014 counts per second per ppb, volts per ppm, counts per picogram
      \u2014 or as useful yield, the percentage of sampled atoms ultimately detected
      as ions, with the method used to derive it cited. Useful yield is the more comparable
      of the two wherever the amount of material consumed varies between procedures,
      as it does with spot size, fluence and repetition rate. Records what the instrument
      actually delivered; a sensitivity the procedure requires before analyses may
      begin belongs with the tuning acceptance criteria."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/instrumentSensitivity
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/instrumentSensitivity
      schema:name:
        const: Instrument Sensitivity
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpmsUPb_doublyChargedSpeciesMonitor:
    title: Doubly-Charged Species Monitor
    description: "The mass ratio monitored to estimate doubly-charged ion (M\xB2\u207A)
      formation during instrument tuning. Doubly-charged ions appear at half the mass
      of the parent ion and can cause isobaric interferences on analytes in that mass
      region. The monitor species and the mass positions monitored should be stated
      explicitly. Analogous to Oxide Production Method and Threshold for oxide monitoring."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/doublyChargedSpeciesMonitor
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/doublyChargedSpeciesMonitor
      schema:name:
        const: Doubly-Charged Species Monitor
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_doublyChargedSpeciesProduction:
    title: Doubly-Charged Species Production
    description: Measured percentage of doubly-charged ion production for the monitored
      species at the time of instrument tuning. The procedure should specify the acceptable
      threshold (e.g., <1%, <3%); the measured value for each session is recorded
      here. Report both the threshold and the measured value where possible.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/doublyChargedSpeciesProduction
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/doublyChargedSpeciesProduction
      schema:name:
        const: Doubly-Charged Species Production
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_analysisSequence:
    title: Analysis Sequence
    description: Repeating order of primary calibration standard(s), quality control
      standard(s), and unknown analyses within a measurement session. Editable to
      allow minor adjustments while maintaining the bracketing strategy defined in
      the procedure.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/analysisSequence
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/analysisSequence
      schema:name:
        const: Analysis Sequence
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_ionCounterDeadTime:
    title: Ion Counter Dead Time
    description: Dead time of each ion-counting detector channel, used in the dead-time
      correction applied to high count rates. Distinct from pulse/analog cross-calibration,
      which relates the two detector modes rather than correcting counting losses
      within the pulse-counting mode.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/ionCounterDeadTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/ionCounterDeadTime
      schema:name:
        const: Ion Counter Dead Time
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpmsUPb_collisionGasFlowRate:
    title: Collision Gas Flow Rate
    description: Flow rate of the collision gas (typically He) introduced into the
      collision/reaction cell, in mL/min. Controls the degree of ion thermalization
      and KED efficiency. Record 'None' if the CRC is in STD mode. Record 'N/A' where
      Collision/Reaction Cell (CRC) Configuration does not include KED.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/collisionGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/collisionGasFlowRate
      schema:name:
        const: Collision Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpmsUPb_cellExitDiscriminationVoltage:
    title: Cell Exit Discrimination Voltage
    description: Bias voltage applied at the collision/reaction cell exit to discriminate
      between analyte ions and low-energy polyatomic interferences in KED mode, in
      volts (V). A negative bias preferentially retards slow polyatomic ions while
      transmitting faster analyte ions. Record 'None' if the CRC is in STD mode. Record
      'N/A' where Collision/Reaction Cell (CRC) Configuration does not include KED.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/cellExitDiscriminationVoltage
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/cellExitDiscriminationVoltage
      schema:name:
        const: Cell Exit Discrimination Voltage
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpmsUPb_reactionGasFlowRate:
    title: Reaction Gas Flow Rate
    description: Flow rate of the reactive gas introduced into the dynamic reaction
      cell (DRC), in mL/min. Record 'N/A' where Collision/Reaction Cell (CRC) Configuration
      does not include DRC.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/reactionGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/reactionGasFlowRate
      schema:name:
        const: Reaction Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpmsUPb_backgroundCountTime:
    title: Background Count Time
    description: Total time spent measuring gas blank (background signal with laser
      off or shutter closed) before each ablation event, in seconds. For spot and
      transect analysis, a discrete background interval is measured before each ablation.
      For mapping, background is typically measured once per raster line or at the
      start of a map session rather than before each individual pixel. Editable to
      allow session-specific adjustment.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/backgroundCountTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/backgroundCountTime
      schema:name:
        const: Background Count Time
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpmsUPb_numberOfBlocksPerMeasurement:
    title: Number of Blocks per Measurement
    description: Number of measurement blocks acquired per sample or standard solution
      introduction. In MC-ICP-MS, data are structured as blocks of cycles; each block
      typically begins with a baseline (on-peak zero) measurement before the analytical
      cycles. Multiple blocks per sample allow inspection of signal stability and
      within-measurement drift. Procedure specifies the standard number; analyst may
      adjust for samples with low signal or for high-precision requirements.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/numberOfBlocksPerMeasurement
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/numberOfBlocksPerMeasurement
      schema:name:
        const: Number of Blocks per Measurement
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_numberOfCyclesPerBlock:
    title: Number of Cycles per Block
    description: "Number of measurement cycles acquired per block. One cycle corresponds
      to a single set of simultaneous Faraday cup readings integrated for the duration
      specified in Integration Time per Cycle. Total integration time per sample =
      (Number of Cycles per Block) \xD7 (Integration Time per Cycle) \xD7 (Number
      of Blocks per Measurement). Procedure specifies the standard value; analyst
      may adjust within procedure bounds."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/numberOfCyclesPerBlock
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/numberOfCyclesPerBlock
      schema:name:
        const: Number of Cycles per Block
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_integrationTimePerCycle:
    title: Integration Time per Cycle
    description: "Duration of signal integration per measurement cycle (seconds).
      Determines counting statistics per cycle. Longer integration times improve shot-noise
      precision but increase the impact of signal drift within the integration window.
      For high-gain (10\xB9\xB2 or 10\xB9\xB3 \u03A9) amplifier channels, longer integration
      times are often required to accumulate sufficient charge. Procedure specifies
      the standard integration time; analyst may confirm or adjust within procedure
      bounds. Where different isotope channels use different integration schemes,
      record the time for each channel."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/integrationTimePerCycle
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/integrationTimePerCycle
      schema:name:
        const: Integration Time per Cycle
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laMcicpmsUPb_uncertaintyPropagationMethod:
    title: Uncertainty Propagation Method
    description: 'The approach used to propagate analytical uncertainty through the
      data reduction chain to the final reported value. State which sources are included
      in the propagation: counting statistics, calibration standard uncertainty, internal
      standard uncertainty, drift correction, and any systematic contributions. Distinct
      from Uncertainty Level, which states the convention at which the resulting uncertainty
      is quoted.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/uncertaintyPropagationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/uncertaintyPropagationMethod
      schema:name:
        const: Uncertainty Propagation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_spikeOutlierFilteringApproach:
    title: Spike / Outlier Filtering Approach
    description: Method used to identify and remove anomalous signal spikes arising
      from micronuggets, inclusions, cracks, or instrument artifacts during time-resolved
      signal processing. Editable because the specific implementation may vary between
      sessions while remaining within the procedure framework.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/spikeOutlierFilteringApproach
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/spikeOutlierFilteringApproach
      schema:name:
        const: Spike / Outlier Filtering Approach
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_memoryEffectMitigation:
    title: Memory Effect Mitigation
    description: Procedure applied to identify and minimise memory effects from high-concentration
      elements in the previous sample or standard that may contaminate subsequent
      analyses, or from incomplete aerosol washout between adjacent pixels in raster
      mapping mode. For mapping, the mitigation strategy involves controlling scan
      speed relative to washout time to ensure each pixel signal is sufficiently free
      of the preceding pixel's contribution.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/memoryEffectMitigation
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/memoryEffectMitigation
      schema:name:
        const: Memory Effect Mitigation
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_normalizationStandardsBasedCorrection:
    title: Normalization / Standards-Based Correction
    description: Any post-acquisition normalization applied to correct for systematic
      biases identified from secondary reference materials, or stoichiometric normalization
      applied per pixel in mapping. Distinct from the primary internal standard approach
      captured in Internal Standard Approach.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/normalizationStandardsBasedCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/normalizationStandardsBasedCorrection
      schema:name:
        const: Normalization / Standards-Based Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_calibrationFactorAndDeterminationMethod:
    title: Calibration Factor and Determination Method
    description: 'An externally-calibrated factor that converts the measured quantity
      into the reported quantity, how it was determined, and its uncertainty. Applies
      where the conversion depends on a factor calibrated against a reference of independently
      known value, rather than on the instrument response alone. Distinct from the
      fields that name the calibration material and that state which approach applies
      to which analyte, where the technique has them: this field records the resulting
      factor itself.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/calibrationFactorAndDeterminationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/calibrationFactorAndDeterminationMethod
      schema:name:
        const: Calibration Factor and Determination Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_doubleSpikeMixingRatio:
    title: Double-Spike Mixing Ratio
    description: "Target proportion of double-spike signal relative to total analyte
      signal in the spiked mixture, expressed as spike fraction (0\u20131) or spike:sample
      ratio. An optimal mixing ratio minimizes error propagation through the double-spike
      inversion; the optimum is analyte-system specific and is typically determined
      using the Double Spike Toolbox or equivalent. The achieved mixing ratio may
      deviate from the target within acceptable bounds (typically \xB120% of optimal);
      the double-spike inversion corrects for actual mixing ratios. Record 'N/A' if
      double-spike method is not used. Record 'N/A' where the procedure does not use
      a double spike."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/doubleSpikeMixingRatio
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/doubleSpikeMixingRatio
      schema:name:
        const: Double-Spike Mixing Ratio
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_reportedDateType:
    title: Reported Date Type
    description: The kind of date or age the procedure reports. Most dating systems
      derive several different date types from the same measurements, so a reported
      age is ambiguous without this. Where more than one type is reported, list all,
      separated by semicolons. Kohn et al. (2024) carry this as a named required item
      ("fission-track age type"); the equivalent distinction is required by all five
      other standards surveyed.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/reportedDateType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/reportedDateType
      schema:name:
        const: Reported Date Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_inheritedOrInitialSignalCorrection:
    title: Inherited or Initial Signal Correction
    description: 'How any non-radiogenic, inherited or pre-existing component of the
      measured signal was accounted for, including the composition assumed, its source,
      and its uncertainty. Record ''None'' where the measured quantity accumulates
      from zero and no such component exists. Applies to five of the six dating systems
      surveyed; fission track is the sole genuine exception, as tracks accumulate
      from zero. D=Editable rather than Read-Only: the procedure registers the correction
      method and any default composition, but the value actually applied is frequently
      sample-specific (a two-stage model composition is evaluated at the interpreted
      age) or session-derived (a trapped composition solved from an isochron intercept),
      and a revision to the assumed composition should not require registering a new
      procedure. Same reasoning as Rule 5''s Constants and Reference Values Used.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/inheritedOrInitialSignalCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/inheritedOrInitialSignalCorrection
      schema:name:
        const: Inherited or Initial Signal Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_ageModel:
    title: Age Model
    description: "The statistical model used to combine individual analyses into a
      single reported age, including any criteria governing which model is applied.
      This is a methodological choice that changes the result: a Model-1 and a Model-3
      regression of the same data yield different ages and different uncertainties.
      Record the model only \u2014 the software implementing it belongs in Data Reduction
      Software (Group 3), whose scope already extends to age calculation; where reduction
      and age regression use different packages, list both there. Required in some
      form by all six geochronology reporting standards surveyed."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/ageModel
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/ageModel
      schema:name:
        const: Age Model
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_constantsAndReferenceValuesUsed:
    title: Constants and Reference Values Used
    description: Physical constants and reference values used in data reduction to
      calculate the final reported quantity (e.g., decay constants for age calculation,
      standard isotope ratios, or other citable reference values used in a correction
      or calculation), together with their source. Distinct from the Group 6 reference-material
      fields, which document accepted values for specific calibration/validation materials
      rather than universal physical constants. Record "None" if no citable, revisable
      physical constants feed into this procedure's data reduction.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/constantsAndReferenceValuesUsed
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/constantsAndReferenceValuesUsed
      schema:name:
        const: Constants and Reference Values Used
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_primaryCalibrationStandardName:
    title: Primary Calibration Standard Name
    description: Primary reference material(s) used to calibrate the instrument and
      convert raw signal intensities to concentrations or isotope ratios. Include
      material name, source institution, and citation for the accepted values used.
      Editable because the specific lot or certification vintage may differ between
      sessions while the material type remains the same.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/primaryCalibrationStandardName
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/primaryCalibrationStandardName
      schema:name:
        const: Primary Calibration Standard Name
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_secondaryReferenceMaterials:
    title: Secondary Reference Materials
    description: Quality-control reference materials analysed as unknowns alongside
      samples in the same session to assess accuracy and monitor drift. Include material
      name, source, and citation for accepted values used for comparison. Editable
      because selection of secondary RMs may vary across sessions.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/secondaryReferenceMaterials
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/secondaryReferenceMaterials
      schema:name:
        const: Secondary Reference Materials
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_samplerAndSkimmerConeMaterial:
    title: Sampler and Skimmer Cone Material
    description: Material composition of the sampler and skimmer cones. Common materials
      are nickel (standard), platinum (for high-TDS or organic-matrix samples), and
      aluminium (for high-purity work). Cone material affects sensitivity, matrix
      tolerance, and long-term stability. State both sampler and skimmer materials;
      if identical, a single statement is acceptable.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/samplerAndSkimmerConeMaterial
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/samplerAndSkimmerConeMaterial
      schema:name:
        const: Sampler and Skimmer Cone Material
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_torchType:
    title: Torch Type
    description: "Type of plasma torch installed. Injector inner diameter (typically
      1.5\u20132.5 mm) affects aerosol transport efficiency and plasma conditions
      in LA-ICP-MS."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/torchType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/torchType
      schema:name:
        const: Torch Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_laserBeamEnergyProfile:
    title: Laser Beam Energy Profile
    description: Spatial energy distribution of the laser beam at the sample surface,
      and whether a beam homogenizer is installed. A flat-top (top-hat) profile produces
      more uniform ablation craters and more reproducible crater morphology than a
      Gaussian beam. This is a fixed hardware property of the laser system.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/laserBeamEnergyProfile
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/laserBeamEnergyProfile
      schema:name:
        const: Laser Beam Energy Profile
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_instrumentWarmUpSessionDurationLimit:
    title: Instrument Warm-up / Session Duration Limit
    description: Minimum warm-up time required after plasma ignition before analyses
      begin, and any maximum session duration enforced to maintain stable operating
      conditions. These constraints are part of the procedure and cannot be varied
      by the analyst.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/instrumentWarmUpSessionDurationLimit
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/instrumentWarmUpSessionDurationLimit
      schema:name:
        const: Instrument Warm-up / Session Duration Limit
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_reactionGasType:
    title: Reaction Gas Type
    description: "Type of reactive gas introduced into the dynamic reaction cell (DRC)
      for interference removal through ion-molecule reactions. Common reaction gases
      include NH\u2083 (e.g., for Fe, Ca, K isotopes) and O\u2082 (e.g., for As, Ge).
      Record 'None' if DRC mode is not used. Record 'N/A' where Collision/Reaction
      Cell (CRC) Configuration does not include DRC."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/reactionGasType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/reactionGasType
      schema:name:
        const: Reaction Gas Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_multiRunSequentialAnalysisDesign:
    title: Multi-Run Sequential Analysis Design
    description: Whether the procedure uses a single acquisition pass or multiple
      sequential runs on the same sample location, each optimized for different analytical
      objectives. For multi-run designs, describe the number of runs, their purpose,
      key laser and instrument settings per run, and how outputs of one run feed into
      data reduction of another. Not applicable to raster mapping, where each spatial
      location is visited exactly once.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/multiRunSequentialAnalysisDesign
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/multiRunSequentialAnalysisDesign
      schema:name:
        const: Multi-Run Sequential Analysis Design
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_matrixOffsetCorrection:
    title: Matrix Offset Correction (LIEF)
    description: Whether an empirical correction was applied to account for systematic
      differences in laser-induced elemental fractionation (LIEF) patterns between
      the external calibration standard and the sample matrix.
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/matrixOffsetCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/matrixOffsetCorrection
      schema:name:
        const: Matrix Offset Correction (LIEF)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_intermediateDaughterDisequilibriumCorrection:
    title: Intermediate Daughter Disequilibrium Correction
    description: "Correction for initial disequilibrium in intermediate daughter products
      of the U decay chains \u2014 principally 230Th, and where relevant 231Pa \u2014
      together with the Th/U or Pa/U partitioning value assumed and its source. Unique
      to U-Pb among dating systems, because the chains are long enough for intermediate-daughter
      disequilibrium at crystallisation to bias the 206Pb/238U date, most severely
      in young samples. Record 'None' with a justification where no correction was
      applied. Condon et al. (2024) write \"we recommend these dates be reported corrected
      for initial 230Th and 231Pa daughter isotope disequilibrium\" \u2014 recommended
      rather than required, hence Advanced."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/intermediateDaughterDisequilibriumCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/intermediateDaughterDisequilibriumCorrection
      schema:name:
        const: Intermediate Daughter Disequilibrium Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laMcicpmsUPb_discordanceDefinitionAndValues:
    title: Discordance Definition and Values
    description: "How discordance between the 206Pb/238U, 207Pb/235U and 207Pb/206Pb
      chronometers is defined for this procedure, and the discordance values obtained.
      Several definitions are in circulation and they are not interchangeable, so
      the formula must be stated. Genuinely specific to U-Pb: it is the only system
      in routine use with two independent decay schemes in the same mineral, so agreement
      between them is an internal consistency test no other system can run. The rule
      for excluding discordant analyses, and how many were excluded, belong in Analysis
      Inclusion and Rejection Criteria. Condon et al. (2024) write that for samples
      older than a few hundred million years \"it is also useful to provide a measure
      of discordance\" \u2014 useful and age-conditional rather than required, hence
      Advanced."
    type: object
    properties:
      '@id':
        const: ada:parameter/laMcicpmsUPbTAPP/discordanceDefinitionAndValues
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laMcicpmsUPbTAPP/discordanceDefinitionAndValues
      schema:name:
        const: Discordance Definition and Values
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_coupledProcedureDoi:
    title: Coupled Procedure DOI
    description: Registered procedure DOI for the coupled technique named above. Provides
      a stable, citable link to the companion method independent of whether a dataset
      has been deposited. If the coupled procedure has not yet been registered, enter
      the DOI of a publication describing the coupled method, or "pending". Enter
      "None" if no coupling is planned.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/coupledProcedureDoi
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/coupledProcedureDoi
      schema:name:
        const: Coupled Procedure DOI
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_coupledDatasetOrPublicationReference:
    title: Coupled Dataset or Publication Reference
    description: 'DOI or other persistent identifier for the co-registered dataset
      or publication where both datasets are reported together. Accepts: a dedicated
      dataset DOI (if separately deposited), a shared dataset DOI (if co-submitted
      in the same package), or a publication DOI. Use "same submission" if the coupled
      dataset is included in this data package, or "pending" if not yet assigned.
      If coupling is documented through a shared sample identifier only, that information
      is already captured in Sample Persistent Identifier (Group 2).'
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/coupledDatasetOrPublicationReference
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/coupledDatasetOrPublicationReference
      schema:name:
        const: Coupled Dataset or Publication Reference
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_sampleFormAnalyticalSubstrate:
    title: Sample Form / Analytical Substrate
    description: Physical form of the material as it enters the ablation cell. Editable
      to accommodate legitimate variations (e.g., thin section vs. mount) that do
      not alter the analytical procedure.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/sampleFormAnalyticalSubstrate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/sampleFormAnalyticalSubstrate
      schema:name:
        const: Sample Form / Analytical Substrate
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_samplePersistentIdentifier:
    title: Sample Persistent Identifier
    description: Globally unique, persistent identifier for each sample listed in
      Sample Name. IGSN (International Geo Sample Number) is the recommended standard
      for geological and cosmochemical samples, as used by Astromat, EarthChem and
      SESAR. Where a sample and its sub-samples are separately registered, record
      the identifier at the level actually analysed.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/samplePersistentIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/samplePersistentIdentifier
      schema:name:
        const: Sample Persistent Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_fusionFluxAndDilutionRatio:
    title: Fusion Flux and Dilution Ratio
    description: For procedures using fused glass, the flux type and sample:flux dilution
      ratio used to prepare the analytical glass.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/fusionFluxAndDilutionRatio
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/fusionFluxAndDilutionRatio
      schema:name:
        const: Fusion Flux and Dilution Ratio
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_samplePreparationMethod:
    title: Sample Preparation Method
    description: Description of how samples were prepared for analysis (mounting,
      polishing, coating, fusion procedure, etc.).
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/samplePreparationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/samplePreparationMethod
      schema:name:
        const: Sample Preparation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_preAblationSurfaceTreatment:
    title: Pre-Ablation Surface Treatment
    description: Procedure applied immediately before each analysis to remove surface
      contamination or condition the sample surface. Distinct from general sample
      preparation. For spot analysis, pre-ablation pulses are discarded before signal
      acquisition begins. For mapping, this step is typically omitted as the large
      area ablated averages out surface effects.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/preAblationSurfaceTreatment
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/preAblationSurfaceTreatment
      schema:name:
        const: Pre-Ablation Surface Treatment
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_targetSelectionCriteria:
    title: Target Selection Criteria
    description: "The rules governing which part of the sample is analysed, and why.
      Covers the criteria applied when choosing grains, aliquots, spots, or a region
      of interest \u2014 size, morphology, clarity, freedom from inclusions or alteration,
      phase identity, or spatial position. Distinct from Target Material, which states
      the material type the procedure is designed for: this field states how, within
      such a sample, the analysed portion is picked out."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/targetSelectionCriteria
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/targetSelectionCriteria
      schema:name:
        const: Target Selection Criteria
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_preAnalysisImagingAndScreening:
    title: Pre-Analysis Imaging and Screening
    description: Imaging or other characterisation performed before the measurement
      in order to select or locate the analysed target, including the technique, instrument
      and settings used, and how individual analyses are linked back to the images.
      Distinct from any imaging the procedure performs as its own measurement. Where
      the imaging is performed on a separate instrument, it should also be recorded
      in the Group 1 coupling fields.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/preAnalysisImagingAndScreening
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/preAnalysisImagingAndScreening
      schema:name:
        const: Pre-Analysis Imaging and Screening
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_instrumentSerialNumberOrLabIdentifier:
    title: Instrument Serial Number or Lab Identifier
    description: Serial number or laboratory-internal identifier for the specific
      instrument unit. Supports traceability to instrument service records.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/instrumentSerialNumberOrLabIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/instrumentSerialNumberOrLabIdentifier
      schema:name:
        const: Instrument Serial Number or Lab Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_torchDepth:
    title: Torch Depth
    description: Distance between the load coil and the sampling cone tip (mm), also
      called injector depth or torch position depending on the instrument manufacturer.
      Affects ion transmission efficiency, oxide formation, and doubly-charged species
      production. The procedure specifies a target value optimised during initial
      setup; the analyst confirms or fine-adjusts during session tuning.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/torchDepth
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/torchDepth
      schema:name:
        const: Torch Depth
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_dataProcessingSoftware:
    title: Data Processing Software(s)
    description: All software applied to the data after acquisition in order to produce
      the reported quantities, including version numbers. List every package used.
      Distinct from Acquisition Software, which controls the instrument and collects
      the raw data.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/dataProcessingSoftware
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/dataProcessingSoftware
      schema:name:
        const: Data Processing Software(s)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_laserSpotGeometry:
    title: Laser Spot Geometry
    description: "Shape and dimensions of the laser ablation spot in micrometres registered
      by the procedure. For circular spots, report diameter; for square or rectangular
      spots, report width \xD7 length. The procedure registers the typical geometry;
      analysts may adjust within procedure-allowed range."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/laserSpotGeometry
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/laserSpotGeometry
      schema:name:
        const: Laser Spot Geometry
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_laserEnergy:
    title: Laser Energy
    description: "Laser pulse energy in millijoules as set at the laser output or
      measured at the sample surface. Less commonly reported than fluence because
      it does not account for spot area. Report only when the system displays energy
      directly. Laser fluence (J cm\u207B\xB2) is the preferred quantity and is captured
      in Default Laser Fluence."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/laserEnergy
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/laserEnergy
      schema:name:
        const: Laser Energy
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpms_laserFluence:
    title: Laser Fluence (Energy Density)
    description: "Laser pulse energy per unit area at the sample surface in J cm\u207B\xB2,
      as registered by the procedure. Fluence is the physically meaningful quantity
      controlling ablation rate, crater morphology, elemental fractionation, and particle
      size distribution. If the system reports only as % of maximum output, include
      that value and note the system maximum where known."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/laserFluence
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/laserFluence
      schema:name:
        const: Laser Fluence (Energy Density)
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpms_laserRepetitionRate:
    title: Laser Repetition Rate
    description: Laser pulse repetition rate in hertz registered by the procedure.
      For mapping methods, repetition rate together with scan speed and spot size
      determines pixel size and spatial resolution. Analysts may adjust within procedure-allowed
      bounds.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/laserRepetitionRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/laserRepetitionRate
      schema:name:
        const: Laser Repetition Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpms_ablationDurationPerSpot:
    title: Ablation Duration per Spot
    description: 'Total on-sample ablation (signal acquisition) time per individual
      spot in seconds, as set in the acquisition method. This is a procedure-level
      parameter for spot analysis: it reflects the deliberate trade-off between signal
      accumulation (longer = lower LOD), sample consumption, and session throughput.
      For transect analysis, the equivalent procedure-level parameter is scan speed
      (captured in Transect Rate, Mapping Rate or Step Size). For mapping analysis,
      total acquisition time is sample-area-dependent and therefore analysis-level,
      not captured here.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/ablationDurationPerSpot
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/ablationDurationPerSpot
      schema:name:
        const: Ablation Duration per Spot
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpms_ablationPitDepthAndAblationRate:
    title: Ablation Pit Depth and Ablation Rate
    description: Depth of the ablation pit produced under the registered laser conditions,
      the method used to measure it, and the resulting per-pulse ablation rate. Sets
      the achievable depth resolution and governs downhole elemental fractionation.
      For transect and mapping the equivalent quantity is trench depth under the same
      conditions.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/ablationPitDepthAndAblationRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/ablationPitDepthAndAblationRate
      schema:name:
        const: Ablation Pit Depth and Ablation Rate
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_transectRateMappingRateOrStepSize:
    title: Transect Rate, Mapping Rate or Step Size
    description: "For continuous line scan (transect) and raster mapping: the stage
      translation speed in \xB5m s\u207B\xB9. This is the procedure-level parameter
      that, together with spot size and repetition rate, determines spatial resolution
      along the scan direction. For mapping, the mapping rate (mm\xB2 h\u207B\xB9)
      may be reported as an alternative when scan speed is session-variable. For stepped
      line profiles: the distance between successive spot positions in \xB5m."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/transectRateMappingRateOrStepSize
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/transectRateMappingRateOrStepSize
      schema:name:
        const: Transect Rate, Mapping Rate or Step Size
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_rasterLineSpacing:
    title: Raster Line Spacing (Mapping Only)
    description: Distance between adjacent raster lines in a 2D elemental map, measured
      perpendicular to the scan direction, in micrometres. Together with spot size,
      this determines whether adjacent lines are contiguous (line spacing = spot size),
      overlapping (line spacing < spot size), or have gaps (line spacing > spot size).
      Applies to raster mapping only.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/rasterLineSpacing
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/rasterLineSpacing
      schema:name:
        const: Raster Line Spacing (Mapping Only)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_carrierGasAndFlowRate:
    title: Carrier Gas and Flow Rate
    description: "Gas used to transport ablated aerosol from the ablation cell to
      the ICP-MS torch, with the procedure-registered target flow rate(s). Helium
      is standard for most UV laser systems due to superior aerosol transport. Flow
      rates are procedure targets; actual session values may be adjusted within \xB110%
      during tuning."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/carrierGasAndFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/carrierGasAndFlowRate
      schema:name:
        const: Carrier Gas and Flow Rate
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_makeUpGasAndFlowRate:
    title: Make-up Gas and Flow Rate
    description: "Supplementary gas added to the sample-carrying stream between the
      sample introduction system and the plasma, with its identity and the procedure-registered
      target flow rate. Argon make-up is standard and maintains total gas delivery
      where the carrier flow alone is insufficient \u2014 downstream of an ablation
      cell, or of a desolvation system that has removed solvent load. Small nitrogen
      or hydrogen additions are also made here to enhance sensitivity for some elements;
      record them with their own flow, whose unit commonly differs from the make-up
      flow. Record 'None' explicitly where no supplementary gas is added, to distinguish
      it from not reported."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/makeUpGasAndFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/makeUpGasAndFlowRate
      schema:name:
        const: Make-up Gas and Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpms_coolantGasFlowRate:
    title: Coolant (Plasma) Gas Flow Rate
    description: Flow rate of the outer (coolant/plasma) argon gas stream that sustains
      the ICP plasma, in L/min. Determines plasma volume and stability. Set during
      initial plasma optimisation and confirmed at each session start.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/coolantGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/coolantGasFlowRate
      schema:name:
        const: Coolant (Plasma) Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpms_auxiliaryGasFlowRate:
    title: Auxiliary Gas Flow Rate
    description: Flow rate of the intermediate (auxiliary) argon gas stream that positions
      the plasma relative to the load coil, in L/min. Affects ion extraction efficiency
      and oxide production rates. Distinct from the carrier gas (which transports
      ablation aerosol) and the coolant (plasma) gas.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/auxiliaryGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/auxiliaryGasFlowRate
      schema:name:
        const: Auxiliary Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpms_rfPower:
    title: RF Power
    description: ICP radiofrequency forward power in watts. Affects plasma temperature,
      ionisation efficiency, oxide formation, and whether cool or normal plasma conditions
      are in effect. The procedure registers a target value optimised during initial
      setup; the analyst confirms or fine-adjusts during session tuning.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/rfPower
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/rfPower
      schema:name:
        const: RF Power
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpms_signalSmoothing:
    title: Signal Smoothing
    description: 'Description of any signal smoothing device or approach installed
      between the ablation cell and the ICP-MS to reduce pulse-to-pulse signal variability.
      Note: active signal smoothing devices (e.g., squid, SCFAST) are generally incompatible
      with high-resolution raster mapping because they degrade spatial resolution
      by mixing aerosol from successive laser shots. For mapping analyses, report
      "None" explicitly.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/signalSmoothing
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/signalSmoothing
      schema:name:
        const: Signal Smoothing
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_icpTuning:
    title: ICP Tuning
    description: Description of the approach used to optimise ICP plasma conditions
      prior to analysis, including the reference material used for tuning and the
      acceptance criteria (e.g., oxide production threshold, sensitivity targets,
      mass calibration).
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/icpTuning
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/icpTuning
      schema:name:
        const: ICP Tuning
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_instrumentSensitivity:
    title: Instrument Sensitivity
    description: "Instrument sensitivity achieved in the session, with the isotope
      or channel it was measured on and the conditions it applies to. May be expressed
      either as detected signal per unit concentration or per unit mass of analyte
      delivered \u2014 counts per second per ppb, volts per ppm, counts per picogram
      \u2014 or as useful yield, the percentage of sampled atoms ultimately detected
      as ions, with the method used to derive it cited. Useful yield is the more comparable
      of the two wherever the amount of material consumed varies between procedures,
      as it does with spot size, fluence and repetition rate. Records what the instrument
      actually delivered; a sensitivity the procedure requires before analyses may
      begin belongs with the tuning acceptance criteria."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/instrumentSensitivity
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/instrumentSensitivity
      schema:name:
        const: Instrument Sensitivity
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpms_doublyChargedSpeciesMonitor:
    title: Doubly-Charged Species Monitor
    description: "The mass ratio monitored to estimate doubly-charged ion (M\xB2\u207A)
      formation during instrument tuning. Doubly-charged ions appear at half the mass
      of the parent ion and can cause isobaric interferences on analytes in that mass
      region. The monitor species and the mass positions monitored should be stated
      explicitly. Analogous to Oxide Production Method and Threshold for oxide monitoring."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/doublyChargedSpeciesMonitor
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/doublyChargedSpeciesMonitor
      schema:name:
        const: Doubly-Charged Species Monitor
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_doublyChargedSpeciesProduction:
    title: Doubly-Charged Species Production
    description: Measured percentage of doubly-charged ion production for the monitored
      species at the time of instrument tuning. The procedure should specify the acceptable
      threshold (e.g., <1%, <3%); the measured value for each session is recorded
      here. Report both the threshold and the measured value where possible.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/doublyChargedSpeciesProduction
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/doublyChargedSpeciesProduction
      schema:name:
        const: Doubly-Charged Species Production
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_analysisSequence:
    title: Analysis Sequence
    description: Repeating order of primary calibration standard(s), quality control
      standard(s), and unknown analyses within a measurement session. Editable to
      allow minor adjustments while maintaining the bracketing strategy defined in
      the procedure.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/analysisSequence
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/analysisSequence
      schema:name:
        const: Analysis Sequence
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_ionCounterDeadTime:
    title: Ion Counter Dead Time
    description: Dead time of each ion-counting detector channel, used in the dead-time
      correction applied to high count rates. Distinct from pulse/analog cross-calibration,
      which relates the two detector modes rather than correcting counting losses
      within the pulse-counting mode.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/ionCounterDeadTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/ionCounterDeadTime
      schema:name:
        const: Ion Counter Dead Time
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpms_collisionGasFlowRate:
    title: Collision Gas Flow Rate
    description: Flow rate of the collision gas (typically He) introduced into the
      collision/reaction cell, in mL/min. Controls the degree of ion thermalization
      and KED efficiency. Record 'None' if the CRC is in STD mode.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/collisionGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/collisionGasFlowRate
      schema:name:
        const: Collision Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpms_cellExitDiscriminationVoltage:
    title: Cell Exit Discrimination Voltage
    description: Bias voltage applied at the collision/reaction cell exit to discriminate
      between analyte ions and low-energy polyatomic interferences in KED mode, in
      volts (V). A negative bias preferentially retards slow polyatomic ions while
      transmitting faster analyte ions. Record 'None' if the CRC is in STD mode.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/cellExitDiscriminationVoltage
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/cellExitDiscriminationVoltage
      schema:name:
        const: Cell Exit Discrimination Voltage
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpms_reactionGasFlowRate:
    title: Reaction Gas Flow Rate
    description: Flow rate of the reactive gas introduced into the dynamic reaction
      cell (DRC), in mL/min.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/reactionGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/reactionGasFlowRate
      schema:name:
        const: Reaction Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpms_collisionReactionGasMixtureRatio:
    title: Collision/Reaction Gas Mixture Ratio
    description: Where the collision or reaction cell is supplied with a mixture of
      gases rather than a single gas, the identities and proportions of that mixture.
      Recorded separately from the gas identity because the proportions change reaction
      efficiency and interference suppression independently of which gases are used.
      Record 'N/A' where a single gas is used.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/collisionReactionGasMixtureRatio
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/collisionReactionGasMixtureRatio
      schema:name:
        const: Collision/Reaction Gas Mixture Ratio
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_dwellTimePerMass:
    title: Dwell Time per Mass
    description: 'Count time (dwell time) per mass position for each measured isotope
      in milliseconds. Longer dwell times improve counting statistics and lower detection
      limits but reduce the number of isotopes measurable within a given scan cycle
      time. For mapping, scan cycle time directly determines spatial resolution at
      a given scan speed: shorter cycle time = finer spatial resolution.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/dwellTimePerMass
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/dwellTimePerMass
      schema:name:
        const: Dwell Time per Mass
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpms_totalIntegrationTimePerOutputDataPoint:
    title: Total Integration Time per Output Data Point
    description: "Total duty-cycle time for one complete mass-scan sweep \u2014 the
      sum of all per-isotope dwell times plus inter-mass settling times. Sets the
      time resolution of the downhole signal, and is not recoverable from Dwell Time
      per Mass alone because settling time is not captured there. Applies to sequential
      (quadrupole and single-collector sector-field) acquisition."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/totalIntegrationTimePerOutputDataPoint
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/totalIntegrationTimePerOutputDataPoint
      schema:name:
        const: Total Integration Time per Output Data Point
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpms_backgroundCountTime:
    title: Background Count Time
    description: Total time spent measuring gas blank (background signal with laser
      off or shutter closed) before each ablation event, in seconds. For spot and
      transect analysis, a discrete background interval is measured before each ablation.
      For mapping, background is typically measured once per raster line or at the
      start of a map session rather than before each individual pixel. Editable to
      allow session-specific adjustment.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/backgroundCountTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/backgroundCountTime
      schema:name:
        const: Background Count Time
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpms_uncertaintyPropagationMethod:
    title: Uncertainty Propagation Method
    description: 'The approach used to propagate analytical uncertainty through the
      data reduction chain to the final reported value. State which sources are included
      in the propagation: counting statistics, calibration standard uncertainty, internal
      standard uncertainty, drift correction, and any systematic contributions. Distinct
      from Uncertainty Level, which states the convention at which the resulting uncertainty
      is quoted.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/uncertaintyPropagationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/uncertaintyPropagationMethod
      schema:name:
        const: Uncertainty Propagation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_spikeOutlierFilteringApproach:
    title: Spike / Outlier Filtering Approach
    description: Method used to identify and remove anomalous signal spikes arising
      from micronuggets, inclusions, cracks, or instrument artifacts during time-resolved
      signal processing. Editable because the specific implementation may vary between
      sessions while remaining within the procedure framework.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/spikeOutlierFilteringApproach
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/spikeOutlierFilteringApproach
      schema:name:
        const: Spike / Outlier Filtering Approach
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_pulseAnalogDetectorNonlinearityCorrection:
    title: Pulse/Analog Detector Nonlinearity Correction
    description: Whether a correction was applied for nonlinear response at the transition
      between pulse-counting and analog detector modes.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/pulseAnalogDetectorNonlinearityCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/pulseAnalogDetectorNonlinearityCorrection
      schema:name:
        const: Pulse/Analog Detector Nonlinearity Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_memoryEffectMitigation:
    title: Memory Effect Mitigation
    description: Procedure applied to identify and minimise memory effects from high-concentration
      elements in the previous sample or standard that may contaminate subsequent
      analyses, or from incomplete aerosol washout between adjacent pixels in raster
      mapping mode. For mapping, the mitigation strategy involves controlling scan
      speed relative to washout time to ensure each pixel signal is sufficiently free
      of the preceding pixel's contribution.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/memoryEffectMitigation
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/memoryEffectMitigation
      schema:name:
        const: Memory Effect Mitigation
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_normalizationStandardsBasedCorrection:
    title: Normalization / Standards-Based Correction
    description: Any post-acquisition normalization applied to correct for systematic
      biases identified from secondary reference materials, or stoichiometric normalization
      applied per pixel in mapping. Distinct from the primary internal standard approach
      captured in Internal Standard Approach.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/normalizationStandardsBasedCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/normalizationStandardsBasedCorrection
      schema:name:
        const: Normalization / Standards-Based Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_calibrationFactorAndDeterminationMethod:
    title: Calibration Factor and Determination Method
    description: 'An externally-calibrated factor that converts the measured quantity
      into the reported quantity, how it was determined, and its uncertainty. Applies
      where the conversion depends on a factor calibrated against a reference of independently
      known value, rather than on the instrument response alone. Distinct from the
      fields that name the calibration material and that state which approach applies
      to which analyte, where the technique has them: this field records the resulting
      factor itself.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/calibrationFactorAndDeterminationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/calibrationFactorAndDeterminationMethod
      schema:name:
        const: Calibration Factor and Determination Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_constantsAndReferenceValuesUsed:
    title: Constants and Reference Values Used
    description: Physical constants and reference values used in data reduction to
      calculate the final reported quantity (e.g., decay constants for age calculation,
      standard isotope ratios, or other citable reference values used in a correction
      or calculation), together with their source. Distinct from the Group 6 reference-material
      fields, which document accepted values for specific calibration/validation materials
      rather than universal physical constants. Record "None" if no citable, revisable
      physical constants feed into this procedure's data reduction.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/constantsAndReferenceValuesUsed
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/constantsAndReferenceValuesUsed
      schema:name:
        const: Constants and Reference Values Used
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_primaryCalibrationStandardName:
    title: Primary Calibration Standard Name
    description: Primary reference material(s) used to calibrate the instrument and
      convert raw signal intensities to concentrations or isotope ratios. Include
      material name, source institution, and citation for the accepted values used.
      Editable because the specific lot or certification vintage may differ between
      sessions while the material type remains the same.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/primaryCalibrationStandardName
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/primaryCalibrationStandardName
      schema:name:
        const: Primary Calibration Standard Name
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_secondaryReferenceMaterials:
    title: Secondary Reference Materials
    description: Quality-control reference materials analysed as unknowns alongside
      samples in the same session to assess accuracy and monitor drift. Include material
      name, source, and citation for accepted values used for comparison. Editable
      because selection of secondary RMs may vary across sessions.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/secondaryReferenceMaterials
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/secondaryReferenceMaterials
      schema:name:
        const: Secondary Reference Materials
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_samplerAndSkimmerConeMaterial:
    title: Sampler and Skimmer Cone Material
    description: Material composition of the sampler and skimmer cones. Common materials
      are nickel (standard), platinum (for high-TDS or organic-matrix samples), and
      aluminium (for high-purity work). Cone material affects sensitivity, matrix
      tolerance, and long-term stability. State both sampler and skimmer materials;
      if identical, a single statement is acceptable.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/samplerAndSkimmerConeMaterial
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/samplerAndSkimmerConeMaterial
      schema:name:
        const: Sampler and Skimmer Cone Material
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_torchType:
    title: Torch Type
    description: "Type of plasma torch installed. Injector inner diameter (typically
      1.5\u20132.5 mm) affects aerosol transport efficiency and plasma conditions
      in LA-ICP-MS."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/torchType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/torchType
      schema:name:
        const: Torch Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_laserBeamEnergyProfile:
    title: Laser Beam Energy Profile
    description: Spatial energy distribution of the laser beam at the sample surface,
      and whether a beam homogenizer is installed. A flat-top (top-hat) profile produces
      more uniform ablation craters and more reproducible crater morphology than a
      Gaussian beam. This is a fixed hardware property of the laser system.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/laserBeamEnergyProfile
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/laserBeamEnergyProfile
      schema:name:
        const: Laser Beam Energy Profile
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_instrumentWarmUpSessionDurationLimit:
    title: Instrument Warm-up / Session Duration Limit
    description: Minimum warm-up time required after plasma ignition before analyses
      begin, and any maximum session duration enforced to maintain stable operating
      conditions. These constraints are part of the procedure and cannot be varied
      by the analyst.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/instrumentWarmUpSessionDurationLimit
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/instrumentWarmUpSessionDurationLimit
      schema:name:
        const: Instrument Warm-up / Session Duration Limit
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_reactionGasType:
    title: Reaction Gas Type
    description: "Type of reactive gas introduced into the dynamic reaction cell (DRC)
      for interference removal through ion-molecule reactions. Common reaction gases
      include NH\u2083 (e.g., for Fe, Ca, K isotopes) and O\u2082 (e.g., for As, Ge).
      Record 'None' if DRC mode is not used."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/reactionGasType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/reactionGasType
      schema:name:
        const: Reaction Gas Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_reactionProductIonMassShiftTransition:
    title: Reaction Product Ion / Mass-Shift Transition
    description: For each monitored mass produced by a reaction in the collision/reaction
      cell, the precursor ion, the reagent gas and the product ion measured. Records
      the mass-shift chemistry relating the mass measured to the analyte it reports,
      which the monitored mass alone does not state. Record 'N/A' where the analyte
      is measured on its own mass.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/reactionProductIonMassShiftTransition
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/reactionProductIonMassShiftTransition
      schema:name:
        const: Reaction Product Ion / Mass-Shift Transition
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_multiRunSequentialAnalysisDesign:
    title: Multi-Run Sequential Analysis Design
    description: Whether the procedure uses a single acquisition pass or multiple
      sequential runs on the same sample location, each optimized for different analytical
      objectives. For multi-run designs, describe the number of runs, their purpose,
      key laser and instrument settings per run, and how outputs of one run feed into
      data reduction of another. Not applicable to raster mapping, where each spatial
      location is visited exactly once.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/multiRunSequentialAnalysisDesign
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/multiRunSequentialAnalysisDesign
      schema:name:
        const: Multi-Run Sequential Analysis Design
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpms_matrixOffsetCorrection:
    title: Matrix Offset Correction (LIEF)
    description: Whether an empirical correction was applied to account for systematic
      differences in laser-induced elemental fractionation (LIEF) patterns between
      the external calibration standard and the sample matrix.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsTAPP/matrixOffsetCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsTAPP/matrixOffsetCorrection
      schema:name:
        const: Matrix Offset Correction (LIEF)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_coupledProcedureDoi:
    title: Coupled Procedure DOI
    description: Registered procedure DOI for the coupled technique named above. Provides
      a stable, citable link to the companion method independent of whether a dataset
      has been deposited. If the coupled procedure has not yet been registered, enter
      the DOI of a publication describing the coupled method, or "pending". Enter
      "None" if no coupling is planned.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/coupledProcedureDoi
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/coupledProcedureDoi
      schema:name:
        const: Coupled Procedure DOI
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_coupledDatasetOrPublicationReference:
    title: Coupled Dataset or Publication Reference
    description: 'DOI or other persistent identifier for the co-registered dataset
      or publication where both datasets are reported together. Accepts: a dedicated
      dataset DOI (if separately deposited), a shared dataset DOI (if co-submitted
      in the same package), or a publication DOI. Use "same submission" if the coupled
      dataset is included in this data package, or "pending" if not yet assigned.
      If coupling is documented through a shared sample identifier only, that information
      is already captured in Sample Persistent Identifier (Group 2).'
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/coupledDatasetOrPublicationReference
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/coupledDatasetOrPublicationReference
      schema:name:
        const: Coupled Dataset or Publication Reference
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_sampleFormAnalyticalSubstrate:
    title: Sample Form / Analytical Substrate
    description: Physical form of the material as it enters the ablation cell. Editable
      to accommodate legitimate variations (e.g., thin section vs. mount) that do
      not alter the analytical procedure.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/sampleFormAnalyticalSubstrate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/sampleFormAnalyticalSubstrate
      schema:name:
        const: Sample Form / Analytical Substrate
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_samplePersistentIdentifier:
    title: Sample Persistent Identifier
    description: Globally unique, persistent identifier for each sample listed in
      Sample Name. IGSN (International Geo Sample Number) is the recommended standard
      for geological and cosmochemical samples, as used by Astromat, EarthChem and
      SESAR. Where a sample and its sub-samples are separately registered, record
      the identifier at the level actually analysed.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/samplePersistentIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/samplePersistentIdentifier
      schema:name:
        const: Sample Persistent Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_fusionFluxAndDilutionRatio:
    title: Fusion Flux and Dilution Ratio
    description: For procedures using fused glass, the flux type and sample:flux dilution
      ratio used to prepare the analytical glass.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/fusionFluxAndDilutionRatio
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/fusionFluxAndDilutionRatio
      schema:name:
        const: Fusion Flux and Dilution Ratio
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_samplePreparationMethod:
    title: Sample Preparation Method
    description: Description of how samples were prepared for analysis (mounting,
      polishing, coating, fusion procedure, etc.).
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/samplePreparationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/samplePreparationMethod
      schema:name:
        const: Sample Preparation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_preAblationSurfaceTreatment:
    title: Pre-Ablation Surface Treatment
    description: Procedure applied immediately before each analysis to remove surface
      contamination or condition the sample surface. Distinct from general sample
      preparation. For spot analysis, pre-ablation pulses are discarded before signal
      acquisition begins. For mapping, this step is typically omitted as the large
      area ablated averages out surface effects.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/preAblationSurfaceTreatment
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/preAblationSurfaceTreatment
      schema:name:
        const: Pre-Ablation Surface Treatment
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_targetSelectionCriteria:
    title: Target Selection Criteria
    description: "The rules governing which part of the sample is analysed, and why.
      Covers the criteria applied when choosing grains, aliquots, spots, or a region
      of interest \u2014 size, morphology, clarity, freedom from inclusions or alteration,
      phase identity, or spatial position. Distinct from Target Material, which states
      the material type the procedure is designed for: this field states how, within
      such a sample, the analysed portion is picked out."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/targetSelectionCriteria
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/targetSelectionCriteria
      schema:name:
        const: Target Selection Criteria
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_preAnalysisImagingAndScreening:
    title: Pre-Analysis Imaging and Screening
    description: Imaging or other characterisation performed before the measurement
      in order to select or locate the analysed target, including the technique, instrument
      and settings used, and how individual analyses are linked back to the images.
      Distinct from any imaging the procedure performs as its own measurement. Where
      the imaging is performed on a separate instrument, it should also be recorded
      in the Group 1 coupling fields.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/preAnalysisImagingAndScreening
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/preAnalysisImagingAndScreening
      schema:name:
        const: Pre-Analysis Imaging and Screening
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_instrumentSerialNumberOrLabIdentifier:
    title: Instrument Serial Number or Lab Identifier
    description: Serial number or laboratory-internal identifier for the specific
      instrument unit. Supports traceability to instrument service records.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/instrumentSerialNumberOrLabIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/instrumentSerialNumberOrLabIdentifier
      schema:name:
        const: Instrument Serial Number or Lab Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_torchDepth:
    title: Torch Depth
    description: Distance between the load coil and the sampling cone tip (mm), also
      called injector depth or torch position depending on the instrument manufacturer.
      Affects ion transmission efficiency, oxide formation, and doubly-charged species
      production. The procedure specifies a target value optimised during initial
      setup; the analyst confirms or fine-adjusts during session tuning.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/torchDepth
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/torchDepth
      schema:name:
        const: Torch Depth
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_dataProcessingSoftware:
    title: Data Processing Software(s)
    description: All software applied to the data after acquisition in order to produce
      the reported quantities, including version numbers. List every package used.
      Distinct from Acquisition Software, which controls the instrument and collects
      the raw data.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/dataProcessingSoftware
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/dataProcessingSoftware
      schema:name:
        const: Data Processing Software(s)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_laserSpotGeometry:
    title: Laser Spot Geometry
    description: "Shape and dimensions of the laser ablation spot in micrometres registered
      by the procedure. For circular spots, report diameter; for square or rectangular
      spots, report width \xD7 length. The procedure registers the typical geometry;
      analysts may adjust within procedure-allowed range."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/laserSpotGeometry
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/laserSpotGeometry
      schema:name:
        const: Laser Spot Geometry
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_laserEnergy:
    title: Laser Energy
    description: "Laser pulse energy in millijoules as set at the laser output or
      measured at the sample surface. Less commonly reported than fluence because
      it does not account for spot area. Report only when the system displays energy
      directly. Laser fluence (J cm\u207B\xB2) is the preferred quantity and is captured
      in Default Laser Fluence."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/laserEnergy
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/laserEnergy
      schema:name:
        const: Laser Energy
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpmsUPb_laserFluence:
    title: Laser Fluence (Energy Density)
    description: "Laser pulse energy per unit area at the sample surface in J cm\u207B\xB2,
      as registered by the procedure. Fluence is the physically meaningful quantity
      controlling ablation rate, crater morphology, elemental fractionation, and particle
      size distribution. If the system reports only as % of maximum output, include
      that value and note the system maximum where known."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/laserFluence
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/laserFluence
      schema:name:
        const: Laser Fluence (Energy Density)
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpmsUPb_laserRepetitionRate:
    title: Laser Repetition Rate
    description: Laser pulse repetition rate in hertz registered by the procedure.
      For mapping methods, repetition rate together with scan speed and spot size
      determines pixel size and spatial resolution. Analysts may adjust within procedure-allowed
      bounds.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/laserRepetitionRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/laserRepetitionRate
      schema:name:
        const: Laser Repetition Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpmsUPb_ablationDurationPerSpot:
    title: Ablation Duration per Spot
    description: 'Total on-sample ablation (signal acquisition) time per individual
      spot in seconds, as set in the acquisition method. This is a procedure-level
      parameter for spot analysis: it reflects the deliberate trade-off between signal
      accumulation (longer = lower LOD), sample consumption, and session throughput.
      For transect analysis, the equivalent procedure-level parameter is scan speed
      (captured in Transect Rate, Mapping Rate or Step Size). For mapping analysis,
      total acquisition time is sample-area-dependent and therefore analysis-level,
      not captured here.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/ablationDurationPerSpot
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/ablationDurationPerSpot
      schema:name:
        const: Ablation Duration per Spot
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpmsUPb_ablationPitDepthAndAblationRate:
    title: Ablation Pit Depth and Ablation Rate
    description: Depth of the ablation pit produced under the registered laser conditions,
      the method used to measure it, and the resulting per-pulse ablation rate. Sets
      the achievable depth resolution and governs downhole elemental fractionation.
      For transect and mapping the equivalent quantity is trench depth under the same
      conditions.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/ablationPitDepthAndAblationRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/ablationPitDepthAndAblationRate
      schema:name:
        const: Ablation Pit Depth and Ablation Rate
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_transectRateMappingRateOrStepSize:
    title: Transect Rate, Mapping Rate or Step Size
    description: "For continuous line scan (transect) and raster mapping: the stage
      translation speed in \xB5m s\u207B\xB9. This is the procedure-level parameter
      that, together with spot size and repetition rate, determines spatial resolution
      along the scan direction. For mapping, the mapping rate (mm\xB2 h\u207B\xB9)
      may be reported as an alternative when scan speed is session-variable. For stepped
      line profiles: the distance between successive spot positions in \xB5m."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/transectRateMappingRateOrStepSize
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/transectRateMappingRateOrStepSize
      schema:name:
        const: Transect Rate, Mapping Rate or Step Size
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_rasterLineSpacing:
    title: Raster Line Spacing (Mapping Only)
    description: Distance between adjacent raster lines in a 2D elemental map, measured
      perpendicular to the scan direction, in micrometres. Together with spot size,
      this determines whether adjacent lines are contiguous (line spacing = spot size),
      overlapping (line spacing < spot size), or have gaps (line spacing > spot size).
      Applies to raster mapping only.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/rasterLineSpacing
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/rasterLineSpacing
      schema:name:
        const: Raster Line Spacing (Mapping Only)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_carrierGasAndFlowRate:
    title: Carrier Gas and Flow Rate
    description: "Gas used to transport ablated aerosol from the ablation cell to
      the ICP-MS torch, with the procedure-registered target flow rate(s). Helium
      is standard for most UV laser systems due to superior aerosol transport. Flow
      rates are procedure targets; actual session values may be adjusted within \xB110%
      during tuning."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/carrierGasAndFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/carrierGasAndFlowRate
      schema:name:
        const: Carrier Gas and Flow Rate
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_makeUpGasAndFlowRate:
    title: Make-up Gas and Flow Rate
    description: "Supplementary gas added to the sample-carrying stream between the
      sample introduction system and the plasma, with its identity and the procedure-registered
      target flow rate. Argon make-up is standard and maintains total gas delivery
      where the carrier flow alone is insufficient \u2014 downstream of an ablation
      cell, or of a desolvation system that has removed solvent load. Small nitrogen
      or hydrogen additions are also made here to enhance sensitivity for some elements;
      record them with their own flow, whose unit commonly differs from the make-up
      flow. Record 'None' explicitly where no supplementary gas is added, to distinguish
      it from not reported."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/makeUpGasAndFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/makeUpGasAndFlowRate
      schema:name:
        const: Make-up Gas and Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpmsUPb_coolantGasFlowRate:
    title: Coolant (Plasma) Gas Flow Rate
    description: Flow rate of the outer (coolant/plasma) argon gas stream that sustains
      the ICP plasma, in L/min. Determines plasma volume and stability. Set during
      initial plasma optimisation and confirmed at each session start.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/coolantGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/coolantGasFlowRate
      schema:name:
        const: Coolant (Plasma) Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpmsUPb_auxiliaryGasFlowRate:
    title: Auxiliary Gas Flow Rate
    description: Flow rate of the intermediate (auxiliary) argon gas stream that positions
      the plasma relative to the load coil, in L/min. Affects ion extraction efficiency
      and oxide production rates. Distinct from the carrier gas (which transports
      ablation aerosol) and the coolant (plasma) gas.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/auxiliaryGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/auxiliaryGasFlowRate
      schema:name:
        const: Auxiliary Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpmsUPb_rfPower:
    title: RF Power
    description: ICP radiofrequency forward power in watts. Affects plasma temperature,
      ionisation efficiency, oxide formation, and whether cool or normal plasma conditions
      are in effect. The procedure registers a target value optimised during initial
      setup; the analyst confirms or fine-adjusts during session tuning.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/rfPower
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/rfPower
      schema:name:
        const: RF Power
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpmsUPb_signalSmoothing:
    title: Signal Smoothing
    description: 'Description of any signal smoothing device or approach installed
      between the ablation cell and the ICP-MS to reduce pulse-to-pulse signal variability.
      Note: active signal smoothing devices (e.g., squid, SCFAST) are generally incompatible
      with high-resolution raster mapping because they degrade spatial resolution
      by mixing aerosol from successive laser shots. For mapping analyses, report
      "None" explicitly.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/signalSmoothing
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/signalSmoothing
      schema:name:
        const: Signal Smoothing
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_icpTuning:
    title: ICP Tuning
    description: Description of the approach used to optimise ICP plasma conditions
      prior to analysis, including the reference material used for tuning and the
      acceptance criteria (e.g., oxide production threshold, sensitivity targets,
      mass calibration).
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/icpTuning
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/icpTuning
      schema:name:
        const: ICP Tuning
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_instrumentSensitivity:
    title: Instrument Sensitivity
    description: "Instrument sensitivity achieved in the session, with the isotope
      or channel it was measured on and the conditions it applies to. May be expressed
      either as detected signal per unit concentration or per unit mass of analyte
      delivered \u2014 counts per second per ppb, volts per ppm, counts per picogram
      \u2014 or as useful yield, the percentage of sampled atoms ultimately detected
      as ions, with the method used to derive it cited. Useful yield is the more comparable
      of the two wherever the amount of material consumed varies between procedures,
      as it does with spot size, fluence and repetition rate. Records what the instrument
      actually delivered; a sensitivity the procedure requires before analyses may
      begin belongs with the tuning acceptance criteria."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/instrumentSensitivity
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/instrumentSensitivity
      schema:name:
        const: Instrument Sensitivity
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpmsUPb_doublyChargedSpeciesMonitor:
    title: Doubly-Charged Species Monitor
    description: "The mass ratio monitored to estimate doubly-charged ion (M\xB2\u207A)
      formation during instrument tuning. Doubly-charged ions appear at half the mass
      of the parent ion and can cause isobaric interferences on analytes in that mass
      region. The monitor species and the mass positions monitored should be stated
      explicitly. Analogous to Oxide Production Method and Threshold for oxide monitoring."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/doublyChargedSpeciesMonitor
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/doublyChargedSpeciesMonitor
      schema:name:
        const: Doubly-Charged Species Monitor
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_doublyChargedSpeciesProduction:
    title: Doubly-Charged Species Production
    description: Measured percentage of doubly-charged ion production for the monitored
      species at the time of instrument tuning. The procedure should specify the acceptable
      threshold (e.g., <1%, <3%); the measured value for each session is recorded
      here. Report both the threshold and the measured value where possible.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/doublyChargedSpeciesProduction
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/doublyChargedSpeciesProduction
      schema:name:
        const: Doubly-Charged Species Production
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_analysisSequence:
    title: Analysis Sequence
    description: Repeating order of primary calibration standard(s), quality control
      standard(s), and unknown analyses within a measurement session. Editable to
      allow minor adjustments while maintaining the bracketing strategy defined in
      the procedure.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/analysisSequence
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/analysisSequence
      schema:name:
        const: Analysis Sequence
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_ionCounterDeadTime:
    title: Ion Counter Dead Time
    description: Dead time of each ion-counting detector channel, used in the dead-time
      correction applied to high count rates. Distinct from pulse/analog cross-calibration,
      which relates the two detector modes rather than correcting counting losses
      within the pulse-counting mode.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/ionCounterDeadTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/ionCounterDeadTime
      schema:name:
        const: Ion Counter Dead Time
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpmsUPb_collisionGasFlowRate:
    title: Collision Gas Flow Rate
    description: Flow rate of the collision gas (typically He) introduced into the
      collision/reaction cell, in mL/min. Controls the degree of ion thermalization
      and KED efficiency. Record 'None' if the CRC is in STD mode.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/collisionGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/collisionGasFlowRate
      schema:name:
        const: Collision Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpmsUPb_cellExitDiscriminationVoltage:
    title: Cell Exit Discrimination Voltage
    description: Bias voltage applied at the collision/reaction cell exit to discriminate
      between analyte ions and low-energy polyatomic interferences in KED mode, in
      volts (V). A negative bias preferentially retards slow polyatomic ions while
      transmitting faster analyte ions. Record 'None' if the CRC is in STD mode.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/cellExitDiscriminationVoltage
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/cellExitDiscriminationVoltage
      schema:name:
        const: Cell Exit Discrimination Voltage
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpmsUPb_reactionGasFlowRate:
    title: Reaction Gas Flow Rate
    description: Flow rate of the reactive gas introduced into the dynamic reaction
      cell (DRC), in mL/min.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/reactionGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/reactionGasFlowRate
      schema:name:
        const: Reaction Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpmsUPb_collisionReactionGasMixtureRatio:
    title: Collision/Reaction Gas Mixture Ratio
    description: Where the collision or reaction cell is supplied with a mixture of
      gases rather than a single gas, the identities and proportions of that mixture.
      Recorded separately from the gas identity because the proportions change reaction
      efficiency and interference suppression independently of which gases are used.
      Record 'N/A' where a single gas is used.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/collisionReactionGasMixtureRatio
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/collisionReactionGasMixtureRatio
      schema:name:
        const: Collision/Reaction Gas Mixture Ratio
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_dwellTimePerMass:
    title: Dwell Time per Mass
    description: 'Count time (dwell time) per mass position for each measured isotope
      in milliseconds. Longer dwell times improve counting statistics and lower detection
      limits but reduce the number of isotopes measurable within a given scan cycle
      time. For mapping, scan cycle time directly determines spatial resolution at
      a given scan speed: shorter cycle time = finer spatial resolution.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/dwellTimePerMass
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/dwellTimePerMass
      schema:name:
        const: Dwell Time per Mass
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpmsUPb_totalIntegrationTimePerOutputDataPoint:
    title: Total Integration Time per Output Data Point
    description: "Total duty-cycle time for one complete mass-scan sweep \u2014 the
      sum of all per-isotope dwell times plus inter-mass settling times. Sets the
      time resolution of the downhole signal, and is not recoverable from Dwell Time
      per Mass alone because settling time is not captured there. Applies to sequential
      (quadrupole and single-collector sector-field) acquisition."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/totalIntegrationTimePerOutputDataPoint
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/totalIntegrationTimePerOutputDataPoint
      schema:name:
        const: Total Integration Time per Output Data Point
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpmsUPb_backgroundCountTime:
    title: Background Count Time
    description: Total time spent measuring gas blank (background signal with laser
      off or shutter closed) before each ablation event, in seconds. For spot and
      transect analysis, a discrete background interval is measured before each ablation.
      For mapping, background is typically measured once per raster line or at the
      start of a map session rather than before each individual pixel. Editable to
      allow session-specific adjustment.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/backgroundCountTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/backgroundCountTime
      schema:name:
        const: Background Count Time
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laQicpmsUPb_uncertaintyPropagationMethod:
    title: Uncertainty Propagation Method
    description: 'The approach used to propagate analytical uncertainty through the
      data reduction chain to the final reported value. State which sources are included
      in the propagation: counting statistics, calibration standard uncertainty, internal
      standard uncertainty, drift correction, and any systematic contributions. Distinct
      from Uncertainty Level, which states the convention at which the resulting uncertainty
      is quoted.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/uncertaintyPropagationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/uncertaintyPropagationMethod
      schema:name:
        const: Uncertainty Propagation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_spikeOutlierFilteringApproach:
    title: Spike / Outlier Filtering Approach
    description: Method used to identify and remove anomalous signal spikes arising
      from micronuggets, inclusions, cracks, or instrument artifacts during time-resolved
      signal processing. Editable because the specific implementation may vary between
      sessions while remaining within the procedure framework.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/spikeOutlierFilteringApproach
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/spikeOutlierFilteringApproach
      schema:name:
        const: Spike / Outlier Filtering Approach
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_pulseAnalogDetectorNonlinearityCorrection:
    title: Pulse/Analog Detector Nonlinearity Correction
    description: Whether a correction was applied for nonlinear response at the transition
      between pulse-counting and analog detector modes.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/pulseAnalogDetectorNonlinearityCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/pulseAnalogDetectorNonlinearityCorrection
      schema:name:
        const: Pulse/Analog Detector Nonlinearity Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_memoryEffectMitigation:
    title: Memory Effect Mitigation
    description: Procedure applied to identify and minimise memory effects from high-concentration
      elements in the previous sample or standard that may contaminate subsequent
      analyses, or from incomplete aerosol washout between adjacent pixels in raster
      mapping mode. For mapping, the mitigation strategy involves controlling scan
      speed relative to washout time to ensure each pixel signal is sufficiently free
      of the preceding pixel's contribution.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/memoryEffectMitigation
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/memoryEffectMitigation
      schema:name:
        const: Memory Effect Mitigation
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_normalizationStandardsBasedCorrection:
    title: Normalization / Standards-Based Correction
    description: Any post-acquisition normalization applied to correct for systematic
      biases identified from secondary reference materials, or stoichiometric normalization
      applied per pixel in mapping. Distinct from the primary internal standard approach
      captured in Internal Standard Approach.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/normalizationStandardsBasedCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/normalizationStandardsBasedCorrection
      schema:name:
        const: Normalization / Standards-Based Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_calibrationFactorAndDeterminationMethod:
    title: Calibration Factor and Determination Method
    description: 'An externally-calibrated factor that converts the measured quantity
      into the reported quantity, how it was determined, and its uncertainty. Applies
      where the conversion depends on a factor calibrated against a reference of independently
      known value, rather than on the instrument response alone. Distinct from the
      fields that name the calibration material and that state which approach applies
      to which analyte, where the technique has them: this field records the resulting
      factor itself.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/calibrationFactorAndDeterminationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/calibrationFactorAndDeterminationMethod
      schema:name:
        const: Calibration Factor and Determination Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_reportedDateType:
    title: Reported Date Type
    description: The kind of date or age the procedure reports. Most dating systems
      derive several different date types from the same measurements, so a reported
      age is ambiguous without this. Where more than one type is reported, list all,
      separated by semicolons. Kohn et al. (2024) carry this as a named required item
      ("fission-track age type"); the equivalent distinction is required by all five
      other standards surveyed.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/reportedDateType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/reportedDateType
      schema:name:
        const: Reported Date Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_inheritedOrInitialSignalCorrection:
    title: Inherited or Initial Signal Correction
    description: 'How any non-radiogenic, inherited or pre-existing component of the
      measured signal was accounted for, including the composition assumed, its source,
      and its uncertainty. Record ''None'' where the measured quantity accumulates
      from zero and no such component exists. Applies to five of the six dating systems
      surveyed; fission track is the sole genuine exception, as tracks accumulate
      from zero. D=Editable rather than Read-Only: the procedure registers the correction
      method and any default composition, but the value actually applied is frequently
      sample-specific (a two-stage model composition is evaluated at the interpreted
      age) or session-derived (a trapped composition solved from an isochron intercept),
      and a revision to the assumed composition should not require registering a new
      procedure. Same reasoning as Rule 5''s Constants and Reference Values Used.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/inheritedOrInitialSignalCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/inheritedOrInitialSignalCorrection
      schema:name:
        const: Inherited or Initial Signal Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_ageModel:
    title: Age Model
    description: "The statistical model used to combine individual analyses into a
      single reported age, including any criteria governing which model is applied.
      This is a methodological choice that changes the result: a Model-1 and a Model-3
      regression of the same data yield different ages and different uncertainties.
      Record the model only \u2014 the software implementing it belongs in Data Reduction
      Software (Group 3), whose scope already extends to age calculation; where reduction
      and age regression use different packages, list both there. Required in some
      form by all six geochronology reporting standards surveyed."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/ageModel
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/ageModel
      schema:name:
        const: Age Model
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_constantsAndReferenceValuesUsed:
    title: Constants and Reference Values Used
    description: Physical constants and reference values used in data reduction to
      calculate the final reported quantity (e.g., decay constants for age calculation,
      standard isotope ratios, or other citable reference values used in a correction
      or calculation), together with their source. Distinct from the Group 6 reference-material
      fields, which document accepted values for specific calibration/validation materials
      rather than universal physical constants. Record "None" if no citable, revisable
      physical constants feed into this procedure's data reduction.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/constantsAndReferenceValuesUsed
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/constantsAndReferenceValuesUsed
      schema:name:
        const: Constants and Reference Values Used
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_primaryCalibrationStandardName:
    title: Primary Calibration Standard Name
    description: Primary reference material(s) used to calibrate the instrument and
      convert raw signal intensities to concentrations or isotope ratios. Include
      material name, source institution, and citation for the accepted values used.
      Editable because the specific lot or certification vintage may differ between
      sessions while the material type remains the same.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/primaryCalibrationStandardName
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/primaryCalibrationStandardName
      schema:name:
        const: Primary Calibration Standard Name
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_secondaryReferenceMaterials:
    title: Secondary Reference Materials
    description: Quality-control reference materials analysed as unknowns alongside
      samples in the same session to assess accuracy and monitor drift. Include material
      name, source, and citation for accepted values used for comparison. Editable
      because selection of secondary RMs may vary across sessions.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/secondaryReferenceMaterials
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/secondaryReferenceMaterials
      schema:name:
        const: Secondary Reference Materials
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_samplerAndSkimmerConeMaterial:
    title: Sampler and Skimmer Cone Material
    description: Material composition of the sampler and skimmer cones. Common materials
      are nickel (standard), platinum (for high-TDS or organic-matrix samples), and
      aluminium (for high-purity work). Cone material affects sensitivity, matrix
      tolerance, and long-term stability. State both sampler and skimmer materials;
      if identical, a single statement is acceptable.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/samplerAndSkimmerConeMaterial
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/samplerAndSkimmerConeMaterial
      schema:name:
        const: Sampler and Skimmer Cone Material
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_torchType:
    title: Torch Type
    description: "Type of plasma torch installed. Injector inner diameter (typically
      1.5\u20132.5 mm) affects aerosol transport efficiency and plasma conditions
      in LA-ICP-MS."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/torchType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/torchType
      schema:name:
        const: Torch Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_laserBeamEnergyProfile:
    title: Laser Beam Energy Profile
    description: Spatial energy distribution of the laser beam at the sample surface,
      and whether a beam homogenizer is installed. A flat-top (top-hat) profile produces
      more uniform ablation craters and more reproducible crater morphology than a
      Gaussian beam. This is a fixed hardware property of the laser system.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/laserBeamEnergyProfile
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/laserBeamEnergyProfile
      schema:name:
        const: Laser Beam Energy Profile
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_instrumentWarmUpSessionDurationLimit:
    title: Instrument Warm-up / Session Duration Limit
    description: Minimum warm-up time required after plasma ignition before analyses
      begin, and any maximum session duration enforced to maintain stable operating
      conditions. These constraints are part of the procedure and cannot be varied
      by the analyst.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/instrumentWarmUpSessionDurationLimit
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/instrumentWarmUpSessionDurationLimit
      schema:name:
        const: Instrument Warm-up / Session Duration Limit
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_reactionGasType:
    title: Reaction Gas Type
    description: "Type of reactive gas introduced into the dynamic reaction cell (DRC)
      for interference removal through ion-molecule reactions. Common reaction gases
      include NH\u2083 (e.g., for Fe, Ca, K isotopes) and O\u2082 (e.g., for As, Ge).
      Record 'None' if DRC mode is not used."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/reactionGasType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/reactionGasType
      schema:name:
        const: Reaction Gas Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_reactionProductIonMassShiftTransition:
    title: Reaction Product Ion / Mass-Shift Transition
    description: For each monitored mass produced by a reaction in the collision/reaction
      cell, the precursor ion, the reagent gas and the product ion measured. Records
      the mass-shift chemistry relating the mass measured to the analyte it reports,
      which the monitored mass alone does not state. Record 'N/A' where the analyte
      is measured on its own mass.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/reactionProductIonMassShiftTransition
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/reactionProductIonMassShiftTransition
      schema:name:
        const: Reaction Product Ion / Mass-Shift Transition
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_multiRunSequentialAnalysisDesign:
    title: Multi-Run Sequential Analysis Design
    description: Whether the procedure uses a single acquisition pass or multiple
      sequential runs on the same sample location, each optimized for different analytical
      objectives. For multi-run designs, describe the number of runs, their purpose,
      key laser and instrument settings per run, and how outputs of one run feed into
      data reduction of another. Not applicable to raster mapping, where each spatial
      location is visited exactly once.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/multiRunSequentialAnalysisDesign
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/multiRunSequentialAnalysisDesign
      schema:name:
        const: Multi-Run Sequential Analysis Design
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_matrixOffsetCorrection:
    title: Matrix Offset Correction (LIEF)
    description: Whether an empirical correction was applied to account for systematic
      differences in laser-induced elemental fractionation (LIEF) patterns between
      the external calibration standard and the sample matrix.
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/matrixOffsetCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/matrixOffsetCorrection
      schema:name:
        const: Matrix Offset Correction (LIEF)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_intermediateDaughterDisequilibriumCorrection:
    title: Intermediate Daughter Disequilibrium Correction
    description: "Correction for initial disequilibrium in intermediate daughter products
      of the U decay chains \u2014 principally 230Th, and where relevant 231Pa \u2014
      together with the Th/U or Pa/U partitioning value assumed and its source. Unique
      to U-Pb among dating systems, because the chains are long enough for intermediate-daughter
      disequilibrium at crystallisation to bias the 206Pb/238U date, most severely
      in young samples. Record 'None' with a justification where no correction was
      applied. Condon et al. (2024) write \"we recommend these dates be reported corrected
      for initial 230Th and 231Pa daughter isotope disequilibrium\" \u2014 recommended
      rather than required, hence Advanced."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/intermediateDaughterDisequilibriumCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/intermediateDaughterDisequilibriumCorrection
      schema:name:
        const: Intermediate Daughter Disequilibrium Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laQicpmsUPb_discordanceDefinitionAndValues:
    title: Discordance Definition and Values
    description: "How discordance between the 206Pb/238U, 207Pb/235U and 207Pb/206Pb
      chronometers is defined for this procedure, and the discordance values obtained.
      Several definitions are in circulation and they are not interchangeable, so
      the formula must be stated. Genuinely specific to U-Pb: it is the only system
      in routine use with two independent decay schemes in the same mineral, so agreement
      between them is an internal consistency test no other system can run. The rule
      for excluding discordant analyses, and how many were excluded, belong in Analysis
      Inclusion and Rejection Criteria. Condon et al. (2024) write that for samples
      older than a few hundred million years \"it is also useful to provide a measure
      of discordance\" \u2014 useful and age-conditional rather than required, hence
      Advanced."
    type: object
    properties:
      '@id':
        const: ada:parameter/laQicpmsUPbTAPP/discordanceDefinitionAndValues
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laQicpmsUPbTAPP/discordanceDefinitionAndValues
      schema:name:
        const: Discordance Definition and Values
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_coupledProcedureDoi:
    title: Coupled Procedure DOI
    description: Registered procedure DOI for the coupled technique named above. Provides
      a stable, citable link to the companion method independent of whether a dataset
      has been deposited. If the coupled procedure has not yet been registered, enter
      the DOI of a publication describing the coupled method, or "pending". Enter
      "None" if no coupling is planned.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/coupledProcedureDoi
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/coupledProcedureDoi
      schema:name:
        const: Coupled Procedure DOI
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_coupledDatasetOrPublicationReference:
    title: Coupled Dataset or Publication Reference
    description: 'DOI or other persistent identifier for the co-registered dataset
      or publication where both datasets are reported together. Accepts: a dedicated
      dataset DOI (if separately deposited), a shared dataset DOI (if co-submitted
      in the same package), or a publication DOI. Use "same submission" if the coupled
      dataset is included in this data package, or "pending" if not yet assigned.
      If coupling is documented through a shared sample identifier only, that information
      is already captured in Sample Persistent Identifier (Group 2).'
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/coupledDatasetOrPublicationReference
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/coupledDatasetOrPublicationReference
      schema:name:
        const: Coupled Dataset or Publication Reference
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_sampleFormAnalyticalSubstrate:
    title: Sample Form / Analytical Substrate
    description: Physical form of the material as it enters the ablation cell. Editable
      to accommodate legitimate variations (e.g., thin section vs. mount) that do
      not alter the analytical procedure.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/sampleFormAnalyticalSubstrate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/sampleFormAnalyticalSubstrate
      schema:name:
        const: Sample Form / Analytical Substrate
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_samplePersistentIdentifier:
    title: Sample Persistent Identifier
    description: Globally unique, persistent identifier for each sample listed in
      Sample Name. IGSN (International Geo Sample Number) is the recommended standard
      for geological and cosmochemical samples, as used by Astromat, EarthChem and
      SESAR. Where a sample and its sub-samples are separately registered, record
      the identifier at the level actually analysed.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/samplePersistentIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/samplePersistentIdentifier
      schema:name:
        const: Sample Persistent Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_fusionFluxAndDilutionRatio:
    title: Fusion Flux and Dilution Ratio
    description: For procedures using fused glass, the flux type and sample:flux dilution
      ratio used to prepare the analytical glass.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/fusionFluxAndDilutionRatio
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/fusionFluxAndDilutionRatio
      schema:name:
        const: Fusion Flux and Dilution Ratio
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_samplePreparationMethod:
    title: Sample Preparation Method
    description: Description of how samples were prepared for analysis (mounting,
      polishing, coating, fusion procedure, etc.).
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/samplePreparationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/samplePreparationMethod
      schema:name:
        const: Sample Preparation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_preAblationSurfaceTreatment:
    title: Pre-Ablation Surface Treatment
    description: Procedure applied immediately before each analysis to remove surface
      contamination or condition the sample surface. Distinct from general sample
      preparation. For spot analysis, pre-ablation pulses are discarded before signal
      acquisition begins. For mapping, this step is typically omitted as the large
      area ablated averages out surface effects.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/preAblationSurfaceTreatment
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/preAblationSurfaceTreatment
      schema:name:
        const: Pre-Ablation Surface Treatment
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_targetSelectionCriteria:
    title: Target Selection Criteria
    description: "The rules governing which part of the sample is analysed, and why.
      Covers the criteria applied when choosing grains, aliquots, spots, or a region
      of interest \u2014 size, morphology, clarity, freedom from inclusions or alteration,
      phase identity, or spatial position. Distinct from Target Material, which states
      the material type the procedure is designed for: this field states how, within
      such a sample, the analysed portion is picked out."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/targetSelectionCriteria
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/targetSelectionCriteria
      schema:name:
        const: Target Selection Criteria
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_preAnalysisImagingAndScreening:
    title: Pre-Analysis Imaging and Screening
    description: Imaging or other characterisation performed before the measurement
      in order to select or locate the analysed target, including the technique, instrument
      and settings used, and how individual analyses are linked back to the images.
      Distinct from any imaging the procedure performs as its own measurement. Where
      the imaging is performed on a separate instrument, it should also be recorded
      in the Group 1 coupling fields.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/preAnalysisImagingAndScreening
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/preAnalysisImagingAndScreening
      schema:name:
        const: Pre-Analysis Imaging and Screening
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_instrumentSerialNumberOrLabIdentifier:
    title: Instrument Serial Number or Lab Identifier
    description: Serial number or laboratory-internal identifier for the specific
      instrument unit. Supports traceability to instrument service records.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/instrumentSerialNumberOrLabIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/instrumentSerialNumberOrLabIdentifier
      schema:name:
        const: Instrument Serial Number or Lab Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_torchDepth:
    title: Torch Depth
    description: Distance between the load coil and the sampling cone tip (mm), also
      called injector depth or torch position depending on the instrument manufacturer.
      Affects ion transmission efficiency, oxide formation, and doubly-charged species
      production. The procedure specifies a target value optimised during initial
      setup; the analyst confirms or fine-adjusts during session tuning.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/torchDepth
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/torchDepth
      schema:name:
        const: Torch Depth
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_massResolutionSetting:
    title: Mass Resolution Setting
    description: Operating mass resolution of the mass analyser. The analyst selects
      low, medium, or high resolution to balance sensitivity against spectral interference
      suppression.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/massResolutionSetting
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/massResolutionSetting
      schema:name:
        const: Mass Resolution Setting
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_dataProcessingSoftware:
    title: Data Processing Software(s)
    description: All software applied to the data after acquisition in order to produce
      the reported quantities, including version numbers. List every package used.
      Distinct from Acquisition Software, which controls the instrument and collects
      the raw data.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/dataProcessingSoftware
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/dataProcessingSoftware
      schema:name:
        const: Data Processing Software(s)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_laserSpotGeometry:
    title: Laser Spot Geometry
    description: "Shape and dimensions of the laser ablation spot in micrometres registered
      by the procedure. For circular spots, report diameter; for square or rectangular
      spots, report width \xD7 length. The procedure registers the typical geometry;
      analysts may adjust within procedure-allowed range."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/laserSpotGeometry
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/laserSpotGeometry
      schema:name:
        const: Laser Spot Geometry
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_laserEnergy:
    title: Laser Energy
    description: "Laser pulse energy in millijoules as set at the laser output or
      measured at the sample surface. Less commonly reported than fluence because
      it does not account for spot area. Report only when the system displays energy
      directly. Laser fluence (J cm\u207B\xB2) is the preferred quantity and is captured
      in Default Laser Fluence."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/laserEnergy
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/laserEnergy
      schema:name:
        const: Laser Energy
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpms_laserFluence:
    title: Laser Fluence (Energy Density)
    description: "Laser pulse energy per unit area at the sample surface in J cm\u207B\xB2,
      as registered by the procedure. Fluence is the physically meaningful quantity
      controlling ablation rate, crater morphology, elemental fractionation, and particle
      size distribution. If the system reports only as % of maximum output, include
      that value and note the system maximum where known."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/laserFluence
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/laserFluence
      schema:name:
        const: Laser Fluence (Energy Density)
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpms_laserRepetitionRate:
    title: Laser Repetition Rate
    description: Laser pulse repetition rate in hertz registered by the procedure.
      For mapping methods, repetition rate together with scan speed and spot size
      determines pixel size and spatial resolution. Analysts may adjust within procedure-allowed
      bounds.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/laserRepetitionRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/laserRepetitionRate
      schema:name:
        const: Laser Repetition Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpms_ablationDurationPerSpot:
    title: Ablation Duration per Spot
    description: 'Total on-sample ablation (signal acquisition) time per individual
      spot in seconds, as set in the acquisition method. This is a procedure-level
      parameter for spot analysis: it reflects the deliberate trade-off between signal
      accumulation (longer = lower LOD), sample consumption, and session throughput.
      For transect analysis, the equivalent procedure-level parameter is scan speed
      (captured in Transect Rate, Mapping Rate or Step Size). For mapping analysis,
      total acquisition time is sample-area-dependent and therefore analysis-level,
      not captured here.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/ablationDurationPerSpot
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/ablationDurationPerSpot
      schema:name:
        const: Ablation Duration per Spot
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpms_ablationPitDepthAndAblationRate:
    title: Ablation Pit Depth and Ablation Rate
    description: Depth of the ablation pit produced under the registered laser conditions,
      the method used to measure it, and the resulting per-pulse ablation rate. Sets
      the achievable depth resolution and governs downhole elemental fractionation.
      For transect and mapping the equivalent quantity is trench depth under the same
      conditions.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/ablationPitDepthAndAblationRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/ablationPitDepthAndAblationRate
      schema:name:
        const: Ablation Pit Depth and Ablation Rate
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_transectRateMappingRateOrStepSize:
    title: Transect Rate, Mapping Rate or Step Size
    description: "For continuous line scan (transect) and raster mapping: the stage
      translation speed in \xB5m s\u207B\xB9. This is the procedure-level parameter
      that, together with spot size and repetition rate, determines spatial resolution
      along the scan direction. For mapping, the mapping rate (mm\xB2 h\u207B\xB9)
      may be reported as an alternative when scan speed is session-variable. For stepped
      line profiles: the distance between successive spot positions in \xB5m."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/transectRateMappingRateOrStepSize
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/transectRateMappingRateOrStepSize
      schema:name:
        const: Transect Rate, Mapping Rate or Step Size
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_rasterLineSpacing:
    title: Raster Line Spacing (Mapping Only)
    description: Distance between adjacent raster lines in a 2D elemental map, measured
      perpendicular to the scan direction, in micrometres. Together with spot size,
      this determines whether adjacent lines are contiguous (line spacing = spot size),
      overlapping (line spacing < spot size), or have gaps (line spacing > spot size).
      Applies to raster mapping only.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/rasterLineSpacing
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/rasterLineSpacing
      schema:name:
        const: Raster Line Spacing (Mapping Only)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_carrierGasAndFlowRate:
    title: Carrier Gas and Flow Rate
    description: "Gas used to transport ablated aerosol from the ablation cell to
      the ICP-MS torch, with the procedure-registered target flow rate(s). Helium
      is standard for most UV laser systems due to superior aerosol transport. Flow
      rates are procedure targets; actual session values may be adjusted within \xB110%
      during tuning."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/carrierGasAndFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/carrierGasAndFlowRate
      schema:name:
        const: Carrier Gas and Flow Rate
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_makeUpGasAndFlowRate:
    title: Make-up Gas and Flow Rate
    description: "Supplementary gas added to the sample-carrying stream between the
      sample introduction system and the plasma, with its identity and the procedure-registered
      target flow rate. Argon make-up is standard and maintains total gas delivery
      where the carrier flow alone is insufficient \u2014 downstream of an ablation
      cell, or of a desolvation system that has removed solvent load. Small nitrogen
      or hydrogen additions are also made here to enhance sensitivity for some elements;
      record them with their own flow, whose unit commonly differs from the make-up
      flow. Record 'None' explicitly where no supplementary gas is added, to distinguish
      it from not reported."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/makeUpGasAndFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/makeUpGasAndFlowRate
      schema:name:
        const: Make-up Gas and Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpms_coolantGasFlowRate:
    title: Coolant (Plasma) Gas Flow Rate
    description: Flow rate of the outer (coolant/plasma) argon gas stream that sustains
      the ICP plasma, in L/min. Determines plasma volume and stability. Set during
      initial plasma optimisation and confirmed at each session start.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/coolantGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/coolantGasFlowRate
      schema:name:
        const: Coolant (Plasma) Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpms_auxiliaryGasFlowRate:
    title: Auxiliary Gas Flow Rate
    description: Flow rate of the intermediate (auxiliary) argon gas stream that positions
      the plasma relative to the load coil, in L/min. Affects ion extraction efficiency
      and oxide production rates. Distinct from the carrier gas (which transports
      ablation aerosol) and the coolant (plasma) gas.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/auxiliaryGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/auxiliaryGasFlowRate
      schema:name:
        const: Auxiliary Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpms_rfPower:
    title: RF Power
    description: ICP radiofrequency forward power in watts. Affects plasma temperature,
      ionisation efficiency, oxide formation, and whether cool or normal plasma conditions
      are in effect. The procedure registers a target value optimised during initial
      setup; the analyst confirms or fine-adjusts during session tuning.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/rfPower
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/rfPower
      schema:name:
        const: RF Power
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpms_signalSmoothing:
    title: Signal Smoothing
    description: 'Description of any signal smoothing device or approach installed
      between the ablation cell and the ICP-MS to reduce pulse-to-pulse signal variability.
      Note: active signal smoothing devices (e.g., squid, SCFAST) are generally incompatible
      with high-resolution raster mapping because they degrade spatial resolution
      by mixing aerosol from successive laser shots. For mapping analyses, report
      "None" explicitly.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/signalSmoothing
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/signalSmoothing
      schema:name:
        const: Signal Smoothing
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_icpTuning:
    title: ICP Tuning
    description: Description of the approach used to optimise ICP plasma conditions
      prior to analysis, including the reference material used for tuning and the
      acceptance criteria (e.g., oxide production threshold, sensitivity targets,
      mass calibration).
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/icpTuning
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/icpTuning
      schema:name:
        const: ICP Tuning
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_instrumentSensitivity:
    title: Instrument Sensitivity
    description: "Instrument sensitivity achieved in the session, with the isotope
      or channel it was measured on and the conditions it applies to. May be expressed
      either as detected signal per unit concentration or per unit mass of analyte
      delivered \u2014 counts per second per ppb, volts per ppm, counts per picogram
      \u2014 or as useful yield, the percentage of sampled atoms ultimately detected
      as ions, with the method used to derive it cited. Useful yield is the more comparable
      of the two wherever the amount of material consumed varies between procedures,
      as it does with spot size, fluence and repetition rate. Records what the instrument
      actually delivered; a sensitivity the procedure requires before analyses may
      begin belongs with the tuning acceptance criteria."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/instrumentSensitivity
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/instrumentSensitivity
      schema:name:
        const: Instrument Sensitivity
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpms_doublyChargedSpeciesMonitor:
    title: Doubly-Charged Species Monitor
    description: "The mass ratio monitored to estimate doubly-charged ion (M\xB2\u207A)
      formation during instrument tuning. Doubly-charged ions appear at half the mass
      of the parent ion and can cause isobaric interferences on analytes in that mass
      region. The monitor species and the mass positions monitored should be stated
      explicitly. Analogous to Oxide Production Method and Threshold for oxide monitoring."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/doublyChargedSpeciesMonitor
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/doublyChargedSpeciesMonitor
      schema:name:
        const: Doubly-Charged Species Monitor
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_doublyChargedSpeciesProduction:
    title: Doubly-Charged Species Production
    description: Measured percentage of doubly-charged ion production for the monitored
      species at the time of instrument tuning. The procedure should specify the acceptable
      threshold (e.g., <1%, <3%); the measured value for each session is recorded
      here. Report both the threshold and the measured value where possible.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/doublyChargedSpeciesProduction
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/doublyChargedSpeciesProduction
      schema:name:
        const: Doubly-Charged Species Production
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_analysisSequence:
    title: Analysis Sequence
    description: Repeating order of primary calibration standard(s), quality control
      standard(s), and unknown analyses within a measurement session. Editable to
      allow minor adjustments while maintaining the bracketing strategy defined in
      the procedure.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/analysisSequence
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/analysisSequence
      schema:name:
        const: Analysis Sequence
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_ionCounterDeadTime:
    title: Ion Counter Dead Time
    description: Dead time of each ion-counting detector channel, used in the dead-time
      correction applied to high count rates. Distinct from pulse/analog cross-calibration,
      which relates the two detector modes rather than correcting counting losses
      within the pulse-counting mode.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/ionCounterDeadTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/ionCounterDeadTime
      schema:name:
        const: Ion Counter Dead Time
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpms_dwellTimePerMass:
    title: Dwell Time per Mass
    description: 'Count time (dwell time) per mass position for each measured isotope
      in milliseconds. Longer dwell times improve counting statistics and lower detection
      limits but reduce the number of isotopes measurable within a given scan cycle
      time. For mapping, scan cycle time directly determines spatial resolution at
      a given scan speed: shorter cycle time = finer spatial resolution.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/dwellTimePerMass
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/dwellTimePerMass
      schema:name:
        const: Dwell Time per Mass
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpms_totalIntegrationTimePerOutputDataPoint:
    title: Total Integration Time per Output Data Point
    description: "Total duty-cycle time for one complete mass-scan sweep \u2014 the
      sum of all per-isotope dwell times plus inter-mass settling times. Sets the
      time resolution of the downhole signal, and is not recoverable from Dwell Time
      per Mass alone because settling time is not captured there. Applies to sequential
      (quadrupole and single-collector sector-field) acquisition."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/totalIntegrationTimePerOutputDataPoint
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/totalIntegrationTimePerOutputDataPoint
      schema:name:
        const: Total Integration Time per Output Data Point
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpms_backgroundCountTime:
    title: Background Count Time
    description: Total time spent measuring gas blank (background signal with laser
      off or shutter closed) before each ablation event, in seconds. For spot and
      transect analysis, a discrete background interval is measured before each ablation.
      For mapping, background is typically measured once per raster line or at the
      start of a map session rather than before each individual pixel. Editable to
      allow session-specific adjustment.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/backgroundCountTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/backgroundCountTime
      schema:name:
        const: Background Count Time
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpms_uncertaintyPropagationMethod:
    title: Uncertainty Propagation Method
    description: 'The approach used to propagate analytical uncertainty through the
      data reduction chain to the final reported value. State which sources are included
      in the propagation: counting statistics, calibration standard uncertainty, internal
      standard uncertainty, drift correction, and any systematic contributions. Distinct
      from Uncertainty Level, which states the convention at which the resulting uncertainty
      is quoted.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/uncertaintyPropagationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/uncertaintyPropagationMethod
      schema:name:
        const: Uncertainty Propagation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_spikeOutlierFilteringApproach:
    title: Spike / Outlier Filtering Approach
    description: Method used to identify and remove anomalous signal spikes arising
      from micronuggets, inclusions, cracks, or instrument artifacts during time-resolved
      signal processing. Editable because the specific implementation may vary between
      sessions while remaining within the procedure framework.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/spikeOutlierFilteringApproach
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/spikeOutlierFilteringApproach
      schema:name:
        const: Spike / Outlier Filtering Approach
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_pulseAnalogDetectorNonlinearityCorrection:
    title: Pulse/Analog Detector Nonlinearity Correction
    description: Whether a correction was applied for nonlinear response at the transition
      between pulse-counting and analog detector modes.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/pulseAnalogDetectorNonlinearityCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/pulseAnalogDetectorNonlinearityCorrection
      schema:name:
        const: Pulse/Analog Detector Nonlinearity Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_memoryEffectMitigation:
    title: Memory Effect Mitigation
    description: Procedure applied to identify and minimise memory effects from high-concentration
      elements in the previous sample or standard that may contaminate subsequent
      analyses, or from incomplete aerosol washout between adjacent pixels in raster
      mapping mode. For mapping, the mitigation strategy involves controlling scan
      speed relative to washout time to ensure each pixel signal is sufficiently free
      of the preceding pixel's contribution.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/memoryEffectMitigation
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/memoryEffectMitigation
      schema:name:
        const: Memory Effect Mitigation
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_normalizationStandardsBasedCorrection:
    title: Normalization / Standards-Based Correction
    description: Any post-acquisition normalization applied to correct for systematic
      biases identified from secondary reference materials, or stoichiometric normalization
      applied per pixel in mapping. Distinct from the primary internal standard approach
      captured in Internal Standard Approach.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/normalizationStandardsBasedCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/normalizationStandardsBasedCorrection
      schema:name:
        const: Normalization / Standards-Based Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_calibrationFactorAndDeterminationMethod:
    title: Calibration Factor and Determination Method
    description: 'An externally-calibrated factor that converts the measured quantity
      into the reported quantity, how it was determined, and its uncertainty. Applies
      where the conversion depends on a factor calibrated against a reference of independently
      known value, rather than on the instrument response alone. Distinct from the
      fields that name the calibration material and that state which approach applies
      to which analyte, where the technique has them: this field records the resulting
      factor itself.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/calibrationFactorAndDeterminationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/calibrationFactorAndDeterminationMethod
      schema:name:
        const: Calibration Factor and Determination Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_constantsAndReferenceValuesUsed:
    title: Constants and Reference Values Used
    description: Physical constants and reference values used in data reduction to
      calculate the final reported quantity (e.g., decay constants for age calculation,
      standard isotope ratios, or other citable reference values used in a correction
      or calculation), together with their source. Distinct from the Group 6 reference-material
      fields, which document accepted values for specific calibration/validation materials
      rather than universal physical constants. Record "None" if no citable, revisable
      physical constants feed into this procedure's data reduction.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/constantsAndReferenceValuesUsed
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/constantsAndReferenceValuesUsed
      schema:name:
        const: Constants and Reference Values Used
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_primaryCalibrationStandardName:
    title: Primary Calibration Standard Name
    description: Primary reference material(s) used to calibrate the instrument and
      convert raw signal intensities to concentrations or isotope ratios. Include
      material name, source institution, and citation for the accepted values used.
      Editable because the specific lot or certification vintage may differ between
      sessions while the material type remains the same.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/primaryCalibrationStandardName
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/primaryCalibrationStandardName
      schema:name:
        const: Primary Calibration Standard Name
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_secondaryReferenceMaterials:
    title: Secondary Reference Materials
    description: Quality-control reference materials analysed as unknowns alongside
      samples in the same session to assess accuracy and monitor drift. Include material
      name, source, and citation for accepted values used for comparison. Editable
      because selection of secondary RMs may vary across sessions.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/secondaryReferenceMaterials
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/secondaryReferenceMaterials
      schema:name:
        const: Secondary Reference Materials
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_samplerAndSkimmerConeMaterial:
    title: Sampler and Skimmer Cone Material
    description: Material composition of the sampler and skimmer cones. Common materials
      are nickel (standard), platinum (for high-TDS or organic-matrix samples), and
      aluminium (for high-purity work). Cone material affects sensitivity, matrix
      tolerance, and long-term stability. State both sampler and skimmer materials;
      if identical, a single statement is acceptable.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/samplerAndSkimmerConeMaterial
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/samplerAndSkimmerConeMaterial
      schema:name:
        const: Sampler and Skimmer Cone Material
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_torchType:
    title: Torch Type
    description: "Type of plasma torch installed. Injector inner diameter (typically
      1.5\u20132.5 mm) affects aerosol transport efficiency and plasma conditions
      in LA-ICP-MS."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/torchType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/torchType
      schema:name:
        const: Torch Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_laserBeamEnergyProfile:
    title: Laser Beam Energy Profile
    description: Spatial energy distribution of the laser beam at the sample surface,
      and whether a beam homogenizer is installed. A flat-top (top-hat) profile produces
      more uniform ablation craters and more reproducible crater morphology than a
      Gaussian beam. This is a fixed hardware property of the laser system.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/laserBeamEnergyProfile
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/laserBeamEnergyProfile
      schema:name:
        const: Laser Beam Energy Profile
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_instrumentWarmUpSessionDurationLimit:
    title: Instrument Warm-up / Session Duration Limit
    description: Minimum warm-up time required after plasma ignition before analyses
      begin, and any maximum session duration enforced to maintain stable operating
      conditions. These constraints are part of the procedure and cannot be varied
      by the analyst.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/instrumentWarmUpSessionDurationLimit
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/instrumentWarmUpSessionDurationLimit
      schema:name:
        const: Instrument Warm-up / Session Duration Limit
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_eScanRange:
    title: E-scan Range
    description: Electric scan range used for peak acquisition, expressed as percentage
      of the centre mass (%). Varies the accelerating voltage to cover masses in the
      vicinity of the set magnetic mass without re-scanning the magnet. Record 'N/A'
      if E-scan acquisition mode is not used.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/eScanRange
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/eScanRange
      schema:name:
        const: E-scan Range
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpms_tripleScanningMode:
    title: Triple Scanning Mode
    description: Whether each mass peak is scanned three times per cycle and the results
      averaged (Y/N). Used to reduce noise from short-term magnetic field instabilities
      on sector-field instruments. Triple scanning affects the effective integration
      time per cycle and should be reported. Record 'N/A' if not applicable to the
      instrument.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/tripleScanningMode
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/tripleScanningMode
      schema:name:
        const: Triple Scanning Mode
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_multiRunSequentialAnalysisDesign:
    title: Multi-Run Sequential Analysis Design
    description: Whether the procedure uses a single acquisition pass or multiple
      sequential runs on the same sample location, each optimized for different analytical
      objectives. For multi-run designs, describe the number of runs, their purpose,
      key laser and instrument settings per run, and how outputs of one run feed into
      data reduction of another. Not applicable to raster mapping, where each spatial
      location is visited exactly once.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/multiRunSequentialAnalysisDesign
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/multiRunSequentialAnalysisDesign
      schema:name:
        const: Multi-Run Sequential Analysis Design
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpms_matrixOffsetCorrection:
    title: Matrix Offset Correction (LIEF)
    description: Whether an empirical correction was applied to account for systematic
      differences in laser-induced elemental fractionation (LIEF) patterns between
      the external calibration standard and the sample matrix.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsTAPP/matrixOffsetCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsTAPP/matrixOffsetCorrection
      schema:name:
        const: Matrix Offset Correction (LIEF)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_coupledProcedureDoi:
    title: Coupled Procedure DOI
    description: Registered procedure DOI for the coupled technique named above. Provides
      a stable, citable link to the companion method independent of whether a dataset
      has been deposited. If the coupled procedure has not yet been registered, enter
      the DOI of a publication describing the coupled method, or "pending". Enter
      "None" if no coupling is planned.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/coupledProcedureDoi
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/coupledProcedureDoi
      schema:name:
        const: Coupled Procedure DOI
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_coupledDatasetOrPublicationReference:
    title: Coupled Dataset or Publication Reference
    description: 'DOI or other persistent identifier for the co-registered dataset
      or publication where both datasets are reported together. Accepts: a dedicated
      dataset DOI (if separately deposited), a shared dataset DOI (if co-submitted
      in the same package), or a publication DOI. Use "same submission" if the coupled
      dataset is included in this data package, or "pending" if not yet assigned.
      If coupling is documented through a shared sample identifier only, that information
      is already captured in Sample Persistent Identifier (Group 2).'
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/coupledDatasetOrPublicationReference
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/coupledDatasetOrPublicationReference
      schema:name:
        const: Coupled Dataset or Publication Reference
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_sampleFormAnalyticalSubstrate:
    title: Sample Form / Analytical Substrate
    description: Physical form of the material as it enters the ablation cell. Editable
      to accommodate legitimate variations (e.g., thin section vs. mount) that do
      not alter the analytical procedure.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/sampleFormAnalyticalSubstrate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/sampleFormAnalyticalSubstrate
      schema:name:
        const: Sample Form / Analytical Substrate
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_samplePersistentIdentifier:
    title: Sample Persistent Identifier
    description: Globally unique, persistent identifier for each sample listed in
      Sample Name. IGSN (International Geo Sample Number) is the recommended standard
      for geological and cosmochemical samples, as used by Astromat, EarthChem and
      SESAR. Where a sample and its sub-samples are separately registered, record
      the identifier at the level actually analysed.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/samplePersistentIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/samplePersistentIdentifier
      schema:name:
        const: Sample Persistent Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_fusionFluxAndDilutionRatio:
    title: Fusion Flux and Dilution Ratio
    description: For procedures using fused glass, the flux type and sample:flux dilution
      ratio used to prepare the analytical glass.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/fusionFluxAndDilutionRatio
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/fusionFluxAndDilutionRatio
      schema:name:
        const: Fusion Flux and Dilution Ratio
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_samplePreparationMethod:
    title: Sample Preparation Method
    description: Description of how samples were prepared for analysis (mounting,
      polishing, coating, fusion procedure, etc.).
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/samplePreparationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/samplePreparationMethod
      schema:name:
        const: Sample Preparation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_preAblationSurfaceTreatment:
    title: Pre-Ablation Surface Treatment
    description: Procedure applied immediately before each analysis to remove surface
      contamination or condition the sample surface. Distinct from general sample
      preparation. For spot analysis, pre-ablation pulses are discarded before signal
      acquisition begins. For mapping, this step is typically omitted as the large
      area ablated averages out surface effects.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/preAblationSurfaceTreatment
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/preAblationSurfaceTreatment
      schema:name:
        const: Pre-Ablation Surface Treatment
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_targetSelectionCriteria:
    title: Target Selection Criteria
    description: "The rules governing which part of the sample is analysed, and why.
      Covers the criteria applied when choosing grains, aliquots, spots, or a region
      of interest \u2014 size, morphology, clarity, freedom from inclusions or alteration,
      phase identity, or spatial position. Distinct from Target Material, which states
      the material type the procedure is designed for: this field states how, within
      such a sample, the analysed portion is picked out."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/targetSelectionCriteria
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/targetSelectionCriteria
      schema:name:
        const: Target Selection Criteria
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_preAnalysisImagingAndScreening:
    title: Pre-Analysis Imaging and Screening
    description: Imaging or other characterisation performed before the measurement
      in order to select or locate the analysed target, including the technique, instrument
      and settings used, and how individual analyses are linked back to the images.
      Distinct from any imaging the procedure performs as its own measurement. Where
      the imaging is performed on a separate instrument, it should also be recorded
      in the Group 1 coupling fields.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/preAnalysisImagingAndScreening
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/preAnalysisImagingAndScreening
      schema:name:
        const: Pre-Analysis Imaging and Screening
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_instrumentSerialNumberOrLabIdentifier:
    title: Instrument Serial Number or Lab Identifier
    description: Serial number or laboratory-internal identifier for the specific
      instrument unit. Supports traceability to instrument service records.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/instrumentSerialNumberOrLabIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/instrumentSerialNumberOrLabIdentifier
      schema:name:
        const: Instrument Serial Number or Lab Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_torchDepth:
    title: Torch Depth
    description: Distance between the load coil and the sampling cone tip (mm), also
      called injector depth or torch position depending on the instrument manufacturer.
      Affects ion transmission efficiency, oxide formation, and doubly-charged species
      production. The procedure specifies a target value optimised during initial
      setup; the analyst confirms or fine-adjusts during session tuning.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/torchDepth
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/torchDepth
      schema:name:
        const: Torch Depth
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_massResolutionSetting:
    title: Mass Resolution Setting
    description: Operating mass resolution of the mass analyser. The analyst selects
      low, medium, or high resolution to balance sensitivity against spectral interference
      suppression.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/massResolutionSetting
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/massResolutionSetting
      schema:name:
        const: Mass Resolution Setting
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_dataProcessingSoftware:
    title: Data Processing Software(s)
    description: All software applied to the data after acquisition in order to produce
      the reported quantities, including version numbers. List every package used.
      Distinct from Acquisition Software, which controls the instrument and collects
      the raw data.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/dataProcessingSoftware
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/dataProcessingSoftware
      schema:name:
        const: Data Processing Software(s)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_laserSpotGeometry:
    title: Laser Spot Geometry
    description: "Shape and dimensions of the laser ablation spot in micrometres registered
      by the procedure. For circular spots, report diameter; for square or rectangular
      spots, report width \xD7 length. The procedure registers the typical geometry;
      analysts may adjust within procedure-allowed range."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/laserSpotGeometry
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/laserSpotGeometry
      schema:name:
        const: Laser Spot Geometry
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_laserEnergy:
    title: Laser Energy
    description: "Laser pulse energy in millijoules as set at the laser output or
      measured at the sample surface. Less commonly reported than fluence because
      it does not account for spot area. Report only when the system displays energy
      directly. Laser fluence (J cm\u207B\xB2) is the preferred quantity and is captured
      in Default Laser Fluence."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/laserEnergy
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/laserEnergy
      schema:name:
        const: Laser Energy
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpmsUPb_laserFluence:
    title: Laser Fluence (Energy Density)
    description: "Laser pulse energy per unit area at the sample surface in J cm\u207B\xB2,
      as registered by the procedure. Fluence is the physically meaningful quantity
      controlling ablation rate, crater morphology, elemental fractionation, and particle
      size distribution. If the system reports only as % of maximum output, include
      that value and note the system maximum where known."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/laserFluence
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/laserFluence
      schema:name:
        const: Laser Fluence (Energy Density)
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpmsUPb_laserRepetitionRate:
    title: Laser Repetition Rate
    description: Laser pulse repetition rate in hertz registered by the procedure.
      For mapping methods, repetition rate together with scan speed and spot size
      determines pixel size and spatial resolution. Analysts may adjust within procedure-allowed
      bounds.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/laserRepetitionRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/laserRepetitionRate
      schema:name:
        const: Laser Repetition Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpmsUPb_ablationDurationPerSpot:
    title: Ablation Duration per Spot
    description: 'Total on-sample ablation (signal acquisition) time per individual
      spot in seconds, as set in the acquisition method. This is a procedure-level
      parameter for spot analysis: it reflects the deliberate trade-off between signal
      accumulation (longer = lower LOD), sample consumption, and session throughput.
      For transect analysis, the equivalent procedure-level parameter is scan speed
      (captured in Transect Rate, Mapping Rate or Step Size). For mapping analysis,
      total acquisition time is sample-area-dependent and therefore analysis-level,
      not captured here.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/ablationDurationPerSpot
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/ablationDurationPerSpot
      schema:name:
        const: Ablation Duration per Spot
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpmsUPb_ablationPitDepthAndAblationRate:
    title: Ablation Pit Depth and Ablation Rate
    description: Depth of the ablation pit produced under the registered laser conditions,
      the method used to measure it, and the resulting per-pulse ablation rate. Sets
      the achievable depth resolution and governs downhole elemental fractionation.
      For transect and mapping the equivalent quantity is trench depth under the same
      conditions.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/ablationPitDepthAndAblationRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/ablationPitDepthAndAblationRate
      schema:name:
        const: Ablation Pit Depth and Ablation Rate
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_transectRateMappingRateOrStepSize:
    title: Transect Rate, Mapping Rate or Step Size
    description: "For continuous line scan (transect) and raster mapping: the stage
      translation speed in \xB5m s\u207B\xB9. This is the procedure-level parameter
      that, together with spot size and repetition rate, determines spatial resolution
      along the scan direction. For mapping, the mapping rate (mm\xB2 h\u207B\xB9)
      may be reported as an alternative when scan speed is session-variable. For stepped
      line profiles: the distance between successive spot positions in \xB5m."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/transectRateMappingRateOrStepSize
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/transectRateMappingRateOrStepSize
      schema:name:
        const: Transect Rate, Mapping Rate or Step Size
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_rasterLineSpacing:
    title: Raster Line Spacing (Mapping Only)
    description: Distance between adjacent raster lines in a 2D elemental map, measured
      perpendicular to the scan direction, in micrometres. Together with spot size,
      this determines whether adjacent lines are contiguous (line spacing = spot size),
      overlapping (line spacing < spot size), or have gaps (line spacing > spot size).
      Applies to raster mapping only.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/rasterLineSpacing
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/rasterLineSpacing
      schema:name:
        const: Raster Line Spacing (Mapping Only)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_carrierGasAndFlowRate:
    title: Carrier Gas and Flow Rate
    description: "Gas used to transport ablated aerosol from the ablation cell to
      the ICP-MS torch, with the procedure-registered target flow rate(s). Helium
      is standard for most UV laser systems due to superior aerosol transport. Flow
      rates are procedure targets; actual session values may be adjusted within \xB110%
      during tuning."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/carrierGasAndFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/carrierGasAndFlowRate
      schema:name:
        const: Carrier Gas and Flow Rate
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_makeUpGasAndFlowRate:
    title: Make-up Gas and Flow Rate
    description: "Supplementary gas added to the sample-carrying stream between the
      sample introduction system and the plasma, with its identity and the procedure-registered
      target flow rate. Argon make-up is standard and maintains total gas delivery
      where the carrier flow alone is insufficient \u2014 downstream of an ablation
      cell, or of a desolvation system that has removed solvent load. Small nitrogen
      or hydrogen additions are also made here to enhance sensitivity for some elements;
      record them with their own flow, whose unit commonly differs from the make-up
      flow. Record 'None' explicitly where no supplementary gas is added, to distinguish
      it from not reported."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/makeUpGasAndFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/makeUpGasAndFlowRate
      schema:name:
        const: Make-up Gas and Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpmsUPb_coolantGasFlowRate:
    title: Coolant (Plasma) Gas Flow Rate
    description: Flow rate of the outer (coolant/plasma) argon gas stream that sustains
      the ICP plasma, in L/min. Determines plasma volume and stability. Set during
      initial plasma optimisation and confirmed at each session start.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/coolantGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/coolantGasFlowRate
      schema:name:
        const: Coolant (Plasma) Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpmsUPb_auxiliaryGasFlowRate:
    title: Auxiliary Gas Flow Rate
    description: Flow rate of the intermediate (auxiliary) argon gas stream that positions
      the plasma relative to the load coil, in L/min. Affects ion extraction efficiency
      and oxide production rates. Distinct from the carrier gas (which transports
      ablation aerosol) and the coolant (plasma) gas.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/auxiliaryGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/auxiliaryGasFlowRate
      schema:name:
        const: Auxiliary Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpmsUPb_rfPower:
    title: RF Power
    description: ICP radiofrequency forward power in watts. Affects plasma temperature,
      ionisation efficiency, oxide formation, and whether cool or normal plasma conditions
      are in effect. The procedure registers a target value optimised during initial
      setup; the analyst confirms or fine-adjusts during session tuning.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/rfPower
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/rfPower
      schema:name:
        const: RF Power
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpmsUPb_signalSmoothing:
    title: Signal Smoothing
    description: 'Description of any signal smoothing device or approach installed
      between the ablation cell and the ICP-MS to reduce pulse-to-pulse signal variability.
      Note: active signal smoothing devices (e.g., squid, SCFAST) are generally incompatible
      with high-resolution raster mapping because they degrade spatial resolution
      by mixing aerosol from successive laser shots. For mapping analyses, report
      "None" explicitly.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/signalSmoothing
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/signalSmoothing
      schema:name:
        const: Signal Smoothing
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_icpTuning:
    title: ICP Tuning
    description: Description of the approach used to optimise ICP plasma conditions
      prior to analysis, including the reference material used for tuning and the
      acceptance criteria (e.g., oxide production threshold, sensitivity targets,
      mass calibration).
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/icpTuning
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/icpTuning
      schema:name:
        const: ICP Tuning
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_instrumentSensitivity:
    title: Instrument Sensitivity
    description: "Instrument sensitivity achieved in the session, with the isotope
      or channel it was measured on and the conditions it applies to. May be expressed
      either as detected signal per unit concentration or per unit mass of analyte
      delivered \u2014 counts per second per ppb, volts per ppm, counts per picogram
      \u2014 or as useful yield, the percentage of sampled atoms ultimately detected
      as ions, with the method used to derive it cited. Useful yield is the more comparable
      of the two wherever the amount of material consumed varies between procedures,
      as it does with spot size, fluence and repetition rate. Records what the instrument
      actually delivered; a sensitivity the procedure requires before analyses may
      begin belongs with the tuning acceptance criteria."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/instrumentSensitivity
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/instrumentSensitivity
      schema:name:
        const: Instrument Sensitivity
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpmsUPb_doublyChargedSpeciesMonitor:
    title: Doubly-Charged Species Monitor
    description: "The mass ratio monitored to estimate doubly-charged ion (M\xB2\u207A)
      formation during instrument tuning. Doubly-charged ions appear at half the mass
      of the parent ion and can cause isobaric interferences on analytes in that mass
      region. The monitor species and the mass positions monitored should be stated
      explicitly. Analogous to Oxide Production Method and Threshold for oxide monitoring."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/doublyChargedSpeciesMonitor
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/doublyChargedSpeciesMonitor
      schema:name:
        const: Doubly-Charged Species Monitor
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_doublyChargedSpeciesProduction:
    title: Doubly-Charged Species Production
    description: Measured percentage of doubly-charged ion production for the monitored
      species at the time of instrument tuning. The procedure should specify the acceptable
      threshold (e.g., <1%, <3%); the measured value for each session is recorded
      here. Report both the threshold and the measured value where possible.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/doublyChargedSpeciesProduction
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/doublyChargedSpeciesProduction
      schema:name:
        const: Doubly-Charged Species Production
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_analysisSequence:
    title: Analysis Sequence
    description: Repeating order of primary calibration standard(s), quality control
      standard(s), and unknown analyses within a measurement session. Editable to
      allow minor adjustments while maintaining the bracketing strategy defined in
      the procedure.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/analysisSequence
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/analysisSequence
      schema:name:
        const: Analysis Sequence
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_ionCounterDeadTime:
    title: Ion Counter Dead Time
    description: Dead time of each ion-counting detector channel, used in the dead-time
      correction applied to high count rates. Distinct from pulse/analog cross-calibration,
      which relates the two detector modes rather than correcting counting losses
      within the pulse-counting mode.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/ionCounterDeadTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/ionCounterDeadTime
      schema:name:
        const: Ion Counter Dead Time
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpmsUPb_dwellTimePerMass:
    title: Dwell Time per Mass
    description: 'Count time (dwell time) per mass position for each measured isotope
      in milliseconds. Longer dwell times improve counting statistics and lower detection
      limits but reduce the number of isotopes measurable within a given scan cycle
      time. For mapping, scan cycle time directly determines spatial resolution at
      a given scan speed: shorter cycle time = finer spatial resolution.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/dwellTimePerMass
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/dwellTimePerMass
      schema:name:
        const: Dwell Time per Mass
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpmsUPb_totalIntegrationTimePerOutputDataPoint:
    title: Total Integration Time per Output Data Point
    description: "Total duty-cycle time for one complete mass-scan sweep \u2014 the
      sum of all per-isotope dwell times plus inter-mass settling times. Sets the
      time resolution of the downhole signal, and is not recoverable from Dwell Time
      per Mass alone because settling time is not captured there. Applies to sequential
      (quadrupole and single-collector sector-field) acquisition."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/totalIntegrationTimePerOutputDataPoint
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/totalIntegrationTimePerOutputDataPoint
      schema:name:
        const: Total Integration Time per Output Data Point
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpmsUPb_backgroundCountTime:
    title: Background Count Time
    description: Total time spent measuring gas blank (background signal with laser
      off or shutter closed) before each ablation event, in seconds. For spot and
      transect analysis, a discrete background interval is measured before each ablation.
      For mapping, background is typically measured once per raster line or at the
      start of a map session rather than before each individual pixel. Editable to
      allow session-specific adjustment.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/backgroundCountTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/backgroundCountTime
      schema:name:
        const: Background Count Time
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpmsUPb_uncertaintyPropagationMethod:
    title: Uncertainty Propagation Method
    description: 'The approach used to propagate analytical uncertainty through the
      data reduction chain to the final reported value. State which sources are included
      in the propagation: counting statistics, calibration standard uncertainty, internal
      standard uncertainty, drift correction, and any systematic contributions. Distinct
      from Uncertainty Level, which states the convention at which the resulting uncertainty
      is quoted.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/uncertaintyPropagationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/uncertaintyPropagationMethod
      schema:name:
        const: Uncertainty Propagation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_spikeOutlierFilteringApproach:
    title: Spike / Outlier Filtering Approach
    description: Method used to identify and remove anomalous signal spikes arising
      from micronuggets, inclusions, cracks, or instrument artifacts during time-resolved
      signal processing. Editable because the specific implementation may vary between
      sessions while remaining within the procedure framework.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/spikeOutlierFilteringApproach
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/spikeOutlierFilteringApproach
      schema:name:
        const: Spike / Outlier Filtering Approach
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_pulseAnalogDetectorNonlinearityCorrection:
    title: Pulse/Analog Detector Nonlinearity Correction
    description: Whether a correction was applied for nonlinear response at the transition
      between pulse-counting and analog detector modes.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/pulseAnalogDetectorNonlinearityCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/pulseAnalogDetectorNonlinearityCorrection
      schema:name:
        const: Pulse/Analog Detector Nonlinearity Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_memoryEffectMitigation:
    title: Memory Effect Mitigation
    description: Procedure applied to identify and minimise memory effects from high-concentration
      elements in the previous sample or standard that may contaminate subsequent
      analyses, or from incomplete aerosol washout between adjacent pixels in raster
      mapping mode. For mapping, the mitigation strategy involves controlling scan
      speed relative to washout time to ensure each pixel signal is sufficiently free
      of the preceding pixel's contribution.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/memoryEffectMitigation
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/memoryEffectMitigation
      schema:name:
        const: Memory Effect Mitigation
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_normalizationStandardsBasedCorrection:
    title: Normalization / Standards-Based Correction
    description: Any post-acquisition normalization applied to correct for systematic
      biases identified from secondary reference materials, or stoichiometric normalization
      applied per pixel in mapping. Distinct from the primary internal standard approach
      captured in Internal Standard Approach.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/normalizationStandardsBasedCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/normalizationStandardsBasedCorrection
      schema:name:
        const: Normalization / Standards-Based Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_calibrationFactorAndDeterminationMethod:
    title: Calibration Factor and Determination Method
    description: 'An externally-calibrated factor that converts the measured quantity
      into the reported quantity, how it was determined, and its uncertainty. Applies
      where the conversion depends on a factor calibrated against a reference of independently
      known value, rather than on the instrument response alone. Distinct from the
      fields that name the calibration material and that state which approach applies
      to which analyte, where the technique has them: this field records the resulting
      factor itself.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/calibrationFactorAndDeterminationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/calibrationFactorAndDeterminationMethod
      schema:name:
        const: Calibration Factor and Determination Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_reportedDateType:
    title: Reported Date Type
    description: The kind of date or age the procedure reports. Most dating systems
      derive several different date types from the same measurements, so a reported
      age is ambiguous without this. Where more than one type is reported, list all,
      separated by semicolons. Kohn et al. (2024) carry this as a named required item
      ("fission-track age type"); the equivalent distinction is required by all five
      other standards surveyed.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/reportedDateType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/reportedDateType
      schema:name:
        const: Reported Date Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_inheritedOrInitialSignalCorrection:
    title: Inherited or Initial Signal Correction
    description: 'How any non-radiogenic, inherited or pre-existing component of the
      measured signal was accounted for, including the composition assumed, its source,
      and its uncertainty. Record ''None'' where the measured quantity accumulates
      from zero and no such component exists. Applies to five of the six dating systems
      surveyed; fission track is the sole genuine exception, as tracks accumulate
      from zero. D=Editable rather than Read-Only: the procedure registers the correction
      method and any default composition, but the value actually applied is frequently
      sample-specific (a two-stage model composition is evaluated at the interpreted
      age) or session-derived (a trapped composition solved from an isochron intercept),
      and a revision to the assumed composition should not require registering a new
      procedure. Same reasoning as Rule 5''s Constants and Reference Values Used.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/inheritedOrInitialSignalCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/inheritedOrInitialSignalCorrection
      schema:name:
        const: Inherited or Initial Signal Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_ageModel:
    title: Age Model
    description: "The statistical model used to combine individual analyses into a
      single reported age, including any criteria governing which model is applied.
      This is a methodological choice that changes the result: a Model-1 and a Model-3
      regression of the same data yield different ages and different uncertainties.
      Record the model only \u2014 the software implementing it belongs in Data Reduction
      Software (Group 3), whose scope already extends to age calculation; where reduction
      and age regression use different packages, list both there. Required in some
      form by all six geochronology reporting standards surveyed."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/ageModel
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/ageModel
      schema:name:
        const: Age Model
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_constantsAndReferenceValuesUsed:
    title: Constants and Reference Values Used
    description: Physical constants and reference values used in data reduction to
      calculate the final reported quantity (e.g., decay constants for age calculation,
      standard isotope ratios, or other citable reference values used in a correction
      or calculation), together with their source. Distinct from the Group 6 reference-material
      fields, which document accepted values for specific calibration/validation materials
      rather than universal physical constants. Record "None" if no citable, revisable
      physical constants feed into this procedure's data reduction.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/constantsAndReferenceValuesUsed
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/constantsAndReferenceValuesUsed
      schema:name:
        const: Constants and Reference Values Used
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_primaryCalibrationStandardName:
    title: Primary Calibration Standard Name
    description: Primary reference material(s) used to calibrate the instrument and
      convert raw signal intensities to concentrations or isotope ratios. Include
      material name, source institution, and citation for the accepted values used.
      Editable because the specific lot or certification vintage may differ between
      sessions while the material type remains the same.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/primaryCalibrationStandardName
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/primaryCalibrationStandardName
      schema:name:
        const: Primary Calibration Standard Name
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_secondaryReferenceMaterials:
    title: Secondary Reference Materials
    description: Quality-control reference materials analysed as unknowns alongside
      samples in the same session to assess accuracy and monitor drift. Include material
      name, source, and citation for accepted values used for comparison. Editable
      because selection of secondary RMs may vary across sessions.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/secondaryReferenceMaterials
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/secondaryReferenceMaterials
      schema:name:
        const: Secondary Reference Materials
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_samplerAndSkimmerConeMaterial:
    title: Sampler and Skimmer Cone Material
    description: Material composition of the sampler and skimmer cones. Common materials
      are nickel (standard), platinum (for high-TDS or organic-matrix samples), and
      aluminium (for high-purity work). Cone material affects sensitivity, matrix
      tolerance, and long-term stability. State both sampler and skimmer materials;
      if identical, a single statement is acceptable.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/samplerAndSkimmerConeMaterial
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/samplerAndSkimmerConeMaterial
      schema:name:
        const: Sampler and Skimmer Cone Material
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_torchType:
    title: Torch Type
    description: "Type of plasma torch installed. Injector inner diameter (typically
      1.5\u20132.5 mm) affects aerosol transport efficiency and plasma conditions
      in LA-ICP-MS."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/torchType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/torchType
      schema:name:
        const: Torch Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_laserBeamEnergyProfile:
    title: Laser Beam Energy Profile
    description: Spatial energy distribution of the laser beam at the sample surface,
      and whether a beam homogenizer is installed. A flat-top (top-hat) profile produces
      more uniform ablation craters and more reproducible crater morphology than a
      Gaussian beam. This is a fixed hardware property of the laser system.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/laserBeamEnergyProfile
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/laserBeamEnergyProfile
      schema:name:
        const: Laser Beam Energy Profile
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_instrumentWarmUpSessionDurationLimit:
    title: Instrument Warm-up / Session Duration Limit
    description: Minimum warm-up time required after plasma ignition before analyses
      begin, and any maximum session duration enforced to maintain stable operating
      conditions. These constraints are part of the procedure and cannot be varied
      by the analyst.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/instrumentWarmUpSessionDurationLimit
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/instrumentWarmUpSessionDurationLimit
      schema:name:
        const: Instrument Warm-up / Session Duration Limit
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_eScanRange:
    title: E-scan Range
    description: Electric scan range used for peak acquisition, expressed as percentage
      of the centre mass (%). Varies the accelerating voltage to cover masses in the
      vicinity of the set magnetic mass without re-scanning the magnet. Record 'N/A'
      if E-scan acquisition mode is not used.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/eScanRange
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/eScanRange
      schema:name:
        const: E-scan Range
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laSficpmsUPb_tripleScanningMode:
    title: Triple Scanning Mode
    description: Whether each mass peak is scanned three times per cycle and the results
      averaged (Y/N). Used to reduce noise from short-term magnetic field instabilities
      on sector-field instruments. Triple scanning affects the effective integration
      time per cycle and should be reported. Record 'N/A' if not applicable to the
      instrument.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/tripleScanningMode
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/tripleScanningMode
      schema:name:
        const: Triple Scanning Mode
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_multiRunSequentialAnalysisDesign:
    title: Multi-Run Sequential Analysis Design
    description: Whether the procedure uses a single acquisition pass or multiple
      sequential runs on the same sample location, each optimized for different analytical
      objectives. For multi-run designs, describe the number of runs, their purpose,
      key laser and instrument settings per run, and how outputs of one run feed into
      data reduction of another. Not applicable to raster mapping, where each spatial
      location is visited exactly once.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/multiRunSequentialAnalysisDesign
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/multiRunSequentialAnalysisDesign
      schema:name:
        const: Multi-Run Sequential Analysis Design
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_matrixOffsetCorrection:
    title: Matrix Offset Correction (LIEF)
    description: Whether an empirical correction was applied to account for systematic
      differences in laser-induced elemental fractionation (LIEF) patterns between
      the external calibration standard and the sample matrix.
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/matrixOffsetCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/matrixOffsetCorrection
      schema:name:
        const: Matrix Offset Correction (LIEF)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_intermediateDaughterDisequilibriumCorrection:
    title: Intermediate Daughter Disequilibrium Correction
    description: "Correction for initial disequilibrium in intermediate daughter products
      of the U decay chains \u2014 principally 230Th, and where relevant 231Pa \u2014
      together with the Th/U or Pa/U partitioning value assumed and its source. Unique
      to U-Pb among dating systems, because the chains are long enough for intermediate-daughter
      disequilibrium at crystallisation to bias the 206Pb/238U date, most severely
      in young samples. Record 'None' with a justification where no correction was
      applied. Condon et al. (2024) write \"we recommend these dates be reported corrected
      for initial 230Th and 231Pa daughter isotope disequilibrium\" \u2014 recommended
      rather than required, hence Advanced."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/intermediateDaughterDisequilibriumCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/intermediateDaughterDisequilibriumCorrection
      schema:name:
        const: Intermediate Daughter Disequilibrium Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laSficpmsUPb_discordanceDefinitionAndValues:
    title: Discordance Definition and Values
    description: "How discordance between the 206Pb/238U, 207Pb/235U and 207Pb/206Pb
      chronometers is defined for this procedure, and the discordance values obtained.
      Several definitions are in circulation and they are not interchangeable, so
      the formula must be stated. Genuinely specific to U-Pb: it is the only system
      in routine use with two independent decay schemes in the same mineral, so agreement
      between them is an internal consistency test no other system can run. The rule
      for excluding discordant analyses, and how many were excluded, belong in Analysis
      Inclusion and Rejection Criteria. Condon et al. (2024) write that for samples
      older than a few hundred million years \"it is also useful to provide a measure
      of discordance\" \u2014 useful and age-conditional rather than required, hence
      Advanced."
    type: object
    properties:
      '@id':
        const: ada:parameter/laSficpmsUPbTAPP/discordanceDefinitionAndValues
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laSficpmsUPbTAPP/discordanceDefinitionAndValues
      schema:name:
        const: Discordance Definition and Values
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_coupledProcedureDoi:
    title: Coupled Procedure DOI
    description: Registered procedure DOI for the coupled technique named above. Provides
      a stable, citable link to the companion method independent of whether a dataset
      has been deposited. If the coupled procedure has not yet been registered, enter
      the DOI of a publication describing the coupled method, or "pending". Enter
      "None" if no coupling is planned.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/coupledProcedureDoi
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/coupledProcedureDoi
      schema:name:
        const: Coupled Procedure DOI
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_coupledDatasetOrPublicationReference:
    title: Coupled Dataset or Publication Reference
    description: 'DOI or other persistent identifier for the co-registered dataset
      or publication where both datasets are reported together. Accepts: a dedicated
      dataset DOI (if separately deposited), a shared dataset DOI (if co-submitted
      in the same package), or a publication DOI. Use "same submission" if the coupled
      dataset is included in this data package, or "pending" if not yet assigned.
      If coupling is documented through a shared sample identifier only, that information
      is already captured in Sample Persistent Identifier (Group 2).'
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/coupledDatasetOrPublicationReference
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/coupledDatasetOrPublicationReference
      schema:name:
        const: Coupled Dataset or Publication Reference
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_sampleMass:
    title: Sample Mass
    description: 'Mass of the sample in grams, recorded for curatorial tracking of
      precious or limited materials. Particularly important for meteorite, mission-returned,
      and other restricted samples. This is an analysis-level field: the actual sample
      mass depends on the specific sample being scanned, not on the procedure design.'
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/sampleMass
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/sampleMass
      schema:name:
        const: Sample Mass
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  labxct_sampleMountingMethod:
    title: Sample Mounting Method
    description: Method used to mount or hold the sample on the instrument rotation
      stage. Mounting material should transmit X-rays at the selected voltage without
      dominating beam attenuation. Report the holder type, adhesive or support material,
      and any alignment aids used.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/sampleMountingMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/sampleMountingMethod
      schema:name:
        const: Sample Mounting Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_samplePersistentIdentifier:
    title: Sample Persistent Identifier
    description: Globally unique, persistent identifier for each sample listed in
      Sample Name. IGSN (International Geo Sample Number) is the recommended standard
      for geological and cosmochemical samples, as used by Astromat, EarthChem and
      SESAR. Where a sample and its sub-samples are separately registered, record
      the identifier at the level actually analysed.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/samplePersistentIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/samplePersistentIdentifier
      schema:name:
        const: Sample Persistent Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_samplePreparationNotes:
    title: Sample Preparation Notes
    description: Any preparation steps applied to the sample before scanning, including
      cleaning, trimming, consolidation, or drying. XCT is typically non-destructive
      with no surface preparation required; note any exceptions.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/samplePreparationNotes
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/samplePreparationNotes
      schema:name:
        const: Sample Preparation Notes
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_targetSelectionCriteria:
    title: Target Selection Criteria
    description: "The rules governing which part of the sample is analysed, and why.
      Covers the criteria applied when choosing grains, aliquots, spots, or a region
      of interest \u2014 size, morphology, clarity, freedom from inclusions or alteration,
      phase identity, or spatial position. Distinct from Target Material, which states
      the material type the procedure is designed for: this field states how, within
      such a sample, the analysed portion is picked out."
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/targetSelectionCriteria
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/targetSelectionCriteria
      schema:name:
        const: Target Selection Criteria
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_preAnalysisImagingAndScreening:
    title: Pre-Analysis Imaging and Screening
    description: Imaging or other characterisation performed before the measurement
      in order to select or locate the analysed target, including the technique, instrument
      and settings used, and how individual analyses are linked back to the images.
      Distinct from any imaging the procedure performs as its own measurement. Where
      the imaging is performed on a separate instrument, it should also be recorded
      in the Group 1 coupling fields.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/preAnalysisImagingAndScreening
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/preAnalysisImagingAndScreening
      schema:name:
        const: Pre-Analysis Imaging and Screening
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_reconstructionSoftware:
    title: Reconstruction Software
    description: Software used to reconstruct 2D projection images into a 3D CT volume,
      including version number. Often bundled with the instrument and proprietary
      to the manufacturer.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/reconstructionSoftware
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/reconstructionSoftware
      schema:name:
        const: Reconstruction Software
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_dataProcessingSoftware:
    title: Data Processing Software(s)
    description: All software applied to the data after acquisition in order to produce
      the reported quantities, including version numbers. List every package used.
      Distinct from Acquisition Software, which controls the instrument and collects
      the raw data.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/dataProcessingSoftware
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/dataProcessingSoftware
      schema:name:
        const: Data Processing Software(s)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_acceleratingVoltage:
    title: Accelerating Voltage
    description: "X-ray tube accelerating voltage in kilovolts (kV) registered by
      the procedure. Determines the maximum X-ray photon energy and controls penetration
      depth and phase contrast. Higher voltages provide greater penetration for dense
      or large samples; lower voltages improve contrast between low-density phases.
      If the voltage was varied across samples within the same procedure or session,
      report the full range applied (e.g., 90\u2013115 kV). Note: some sources report
      this parameter as 'X keV' (maximum Bremsstrahlung photon energy) rather than
      'X kV' (tube voltage). For polychromatic lab XCT, these are numerically equivalent:
      E_max [keV] = V [kV]. Record the value as originally reported, and add a parenthetical
      note if the unit used is keV."
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/acceleratingVoltage
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/acceleratingVoltage
      schema:name:
        const: Accelerating Voltage
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  labxct_tubeCurrent:
    title: Tube Current
    description: "X-ray tube current in microamperes (\xB5A) registered by the procedure.
      Controls photon flux and therefore projection image SNR. Higher current improves
      SNR but increases thermal loading on the source and may increase focal spot
      size. If the current was varied across samples within the same procedure or
      session, report the full range applied (e.g., 65\u2013115 \xB5A)."
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/tubeCurrent
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/tubeCurrent
      schema:name:
        const: Tube Current
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  labxct_xRayPower:
    title: X-ray Power
    description: "X-ray tube power in watts (W) registered by the procedure. Derivable
      as voltage (kV) \xD7 current (mA) = kV \xD7 \xB5A / 1000. Power constrains the
      achievable focal spot size for microfocal tubes: higher power requires a larger
      focal spot, trading spatial resolution for SNR. Retained as a standalone field
      because it is routinely reported in the literature and directly constrains instrument
      operating limits. If power was varied across samples within the session, report
      the full range applied (e.g., 7\u201313 W)."
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/xRayPower
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/xRayPower
      schema:name:
        const: X-ray Power
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  labxct_xRayPreFilter:
    title: X-ray Pre-filter
    description: Material and thickness of the beam-hardening filter placed between
      the X-ray source and the sample. Hardens the beam by attenuating low-energy
      photons, reducing beam hardening artifacts and improving CT number stability
      across the sample. Both filter material and thickness must be reported. Instrument-proprietary
      filter codes should be decoded where possible.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/xRayPreFilter
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/xRayPreFilter
      schema:name:
        const: X-ray Pre-filter
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_sourceToObjectDistance:
    title: Source-to-Object Distance (SOD)
    description: Distance from the X-ray source focal spot to the centre of the sample
      rotation axis, in mm, as registered by the procedure. Together with SDD, determines
      geometric magnification (M = SDD/SOD). Shorter SOD increases magnification and
      reduces voxel size.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/sourceToObjectDistance
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/sourceToObjectDistance
      schema:name:
        const: Source-to-Object Distance (SOD)
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  labxct_sourceToDetectorDistance:
    title: Source-to-Detector Distance (SDD)
    description: "Distance from the X-ray source focal spot to the detector surface,
      in mm, as registered by the procedure. Together with SOD, determines geometric
      magnification M = SDD/SOD. Voxel size \u2248 detector pixel size / M (before
      binning; divide additionally by optical objective for Versa-class systems)."
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/sourceToDetectorDistance
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/sourceToDetectorDistance
      schema:name:
        const: Source-to-Detector Distance (SDD)
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  labxct_voxelSize:
    title: Voxel Size
    description: "Isotropic voxel edge length of the reconstructed 3D volume in micrometres.
      The procedure registers the target voxel size, set based on the smallest feature
      to be resolved (target voxel size \u2264 ~1/3 of that feature size; see the
      criterion recorded under Partial Volume Effect Criteria). At analysis level,
      record the achieved voxel size as reported by the reconstruction software, which
      may differ slightly from the target due to final geometric calibration."
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/voxelSize
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/voxelSize
      schema:name:
        const: Voxel Size
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  labxct_rotationRange:
    title: Rotation Range
    description: "Total angular range over which projection images are acquired, in
      degrees. Full 360\xB0 rotation is standard for cone-beam lab XCT. 180\xB0 rotation
      (half-scan) is sometimes used for faster acquisition but may introduce additional
      artifacts."
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/rotationRange
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/rotationRange
      schema:name:
        const: Rotation Range
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  labxct_numberOfProjections:
    title: Number of Projections
    description: Total number of equally-spaced projection images acquired over the
      full rotation range. More projections improve reconstruction quality by reducing
      under-sampling streak artifacts but increase scan time. For Mode B (multi-volume
      stitching), this is the number per sub-volume.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/numberOfProjections
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/numberOfProjections
      schema:name:
        const: Number of Projections
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_rotationStepSize:
    title: Rotation Step Size
    description: Angular increment between successive projection images, in degrees.
      Equal to Rotation Range divided by Number of Projections when both are reported;
      however, some sources report step size as the primary rotation parameter without
      stating the total number of projections explicitly. Finer step sizes improve
      angular sampling and reduce streak artifacts at the cost of longer scan time.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/rotationStepSize
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/rotationStepSize
      schema:name:
        const: Rotation Step Size
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  labxct_exposureTimePerProjection:
    title: Exposure Time per Projection
    description: "Duration of X-ray exposure for each individual projection image
      frame, in seconds, as registered by the procedure. Set as a deliberate choice
      for the target sample type and voxel size: longer exposures increase SNR at
      the cost of total scan time. May be adjusted within procedure-allowed bounds
      for samples that are unusually dense or unusually transparent. If the exposure
      time was varied across samples within the same procedure or session, report
      the full range applied (e.g., 0.5\u20132 s)."
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/exposureTimePerProjection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/exposureTimePerProjection
      schema:name:
        const: Exposure Time per Projection
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  labxct_framesAveragedPerProjection:
    title: Frames Averaged per Projection
    description: "Number of individual detector frames acquired and averaged to produce
      each saved projection image, as registered by the procedure. Frame averaging
      reduces random electronic noise. The effective exposure per projection = exposure
      time per frame \xD7 frames averaged."
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/framesAveragedPerProjection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/framesAveragedPerProjection
      schema:name:
        const: Frames Averaged per Projection
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_detectorBinning:
    title: Detector Binning
    description: "Detector pixel binning factor applied during acquisition. Binning
      combines adjacent pixels (e.g., 2\xD72 combines 4 pixels into one), reducing
      effective resolution while increasing per-pixel SNR and reducing file size.
      1\xD71 indicates no binning."
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/detectorBinning
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/detectorBinning
      schema:name:
        const: Detector Binning
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_flatFieldCorrection:
    title: Flat Field Correction
    description: Whether dark-field (detector read with X-ray source off; electronic
      noise baseline) and bright-field (source on, no sample; gain calibration) reference
      images are acquired and applied to normalize detector response before reconstruction.
      Standard practice in all quantitative lab XCT;.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/flatFieldCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/flatFieldCorrection
      schema:name:
        const: Flat Field Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_rotationMode:
    title: Rotation Mode
    description: Whether projection images are acquired during continuous sample rotation
      (faster; may introduce slight motion blur at high rotation speeds) or at discrete
      step positions with the stage stationary during each exposure (stop-and-shoot;
      eliminates motion blur). Continuous rotation has been associated with sub-volume
      rotational mismatch artifacts in multi-volume stitching workflows (Eckley et
      al. 2025).
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/rotationMode
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/rotationMode
      schema:name:
        const: Rotation Mode
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_totalScanDuration:
    title: Total Scan Duration
    description: Total elapsed time for the complete XCT acquisition, from the start
      of the first projection to the end of the last. For multi-volume acquisitions,
      this is the combined scan time across all sub-volumes (not including setup or
      reconstruction time). Useful for assessing beam stability and sample integrity
      concerns over long scans.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/totalScanDuration
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/totalScanDuration
      schema:name:
        const: Total Scan Duration
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_reconstructionConvolutionFilter:
    title: Reconstruction Convolution Filter
    description: Convolution (apodization) filter kernel applied during back-projection
      reconstruction. Sharper filters (Ram-Lak) enhance edge definition but amplify
      high-frequency noise; smoother filters (Hann, Hamming) reduce noise at the cost
      of edge sharpness. The choice represents a deliberate procedure-level tradeoff.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/reconstructionConvolutionFilter
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/reconstructionConvolutionFilter
      schema:name:
        const: Reconstruction Convolution Filter
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_beamHardeningCorrectionParameter:
    title: Beam Hardening Correction Parameter
    description: Numerical value or setting applied in the software beam hardening
      correction algorithm for this specific analysis. May be tuned empirically per
      material type or per scan session. Analysis-level companion to Beam Hardening
      Correction Method.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/beamHardeningCorrectionParameter
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/beamHardeningCorrectionParameter
      schema:name:
        const: Beam Hardening Correction Parameter
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_ringArtifactCorrectionMethod:
    title: Ring Artifact Correction Method
    description: Procedure specification for how ring artifacts are handled. Ring
      artifacts appear as concentric circular bands centred on the rotation axis and
      arise from defective or miscalibrated detector pixels. Method is the procedure-level
      specification; whether correction was applied and its outcome are recorded at
      analysis level in Group 6.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/ringArtifactCorrectionMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/ringArtifactCorrectionMethod
      schema:name:
        const: Ring Artifact Correction Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_outputDataFormat:
    title: Output Data Format
    description: File format of the reconstructed CT volume as output by the reconstruction
      software. Bit depth is recorded separately in Output Bit Depth.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/outputDataFormat
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/outputDataFormat
      schema:name:
        const: Output Data Format
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_ctNumberCalibration:
    title: CT Number Calibration
    description: Whether the raw CT grayscale values have been calibrated to physically
      meaningful units using reference materials. Calibrated CT numbers enable cross-instrument
      and cross-session comparison and support phase identification by comparison
      to calculated linear attenuation coefficient (LAC) values (e.g., using MuCalc;
      Hanna & Ketcham 2017). Uncalibrated grayscale values are instrument- and session-specific.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/ctNumberCalibration
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/ctNumberCalibration
      schema:name:
        const: CT Number Calibration
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_segmentationMethod:
    title: Segmentation Method
    description: General approach used to separate distinct phases or features in
      the reconstructed CT volume. The method must be reported for any quantitative
      result to be reproducible.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/segmentationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/segmentationMethod
      schema:name:
        const: Segmentation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_segmentationThresholdValuesOrCriteria:
    title: Segmentation Threshold Values or Criteria
    description: "Specific CT number range(s) or quantitative criteria used to define
      each segmented phase or feature. Documenting these values enables reproducibility
      assessment and cross-study comparison. For LAC-calibrated datasets, report values
      in cm\u207B\xB9."
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/segmentationThresholdValuesOrCriteria
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/segmentationThresholdValuesOrCriteria
      schema:name:
        const: Segmentation Threshold Values or Criteria
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_phaseIdentificationMethod:
    title: Phase Identification Method
    description: Method used to assign reconstructed CT number ranges to specific
      mineral phases or material types. Approaches include comparison to calculated
      linear attenuation coefficients (LAC), cross-validation with independent analytical
      techniques, or empirical calibration.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/phaseIdentificationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/phaseIdentificationMethod
      schema:name:
        const: Phase Identification Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_voiSelectionCriteria:
    title: VOI Selection Criteria
    description: Procedure-level rules specifying how the Volume of Interest (VOI)
      is to be defined for quantitative analysis. Common criteria exclude cone-beam
      artifact zones at sample edges, beam hardening halos near dense inclusions,
      and sample holder signal. The actual VOI applied in a specific analysis is recorded
      separately at analysis level.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/voiSelectionCriteria
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/voiSelectionCriteria
      schema:name:
        const: VOI Selection Criteria
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_subVolumeStitchingAndRegistrationMethod:
    title: Sub-volume Stitching and Registration Method
    description: "Method used to register adjacent sub-volume datasets to each other
      and stitch them into a single continuous 3D volume. Report the alignment strategy
      (manual, automated, fiducial-based), the software used, and any correction steps
      applied. Note: rotational mismatch artifacts have been identified in continuous-rotation
      acquisitions (~0.35\xB0 misalignment in Eckley et al. 2025); their correction
      via raw projection re-alignment should be documented here."
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/subVolumeStitchingAndRegistrationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/subVolumeStitchingAndRegistrationMethod
      schema:name:
        const: Sub-volume Stitching and Registration Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_outputBitDepth:
    title: Output Bit Depth
    description: Bit depth of the reconstructed 3D volume (number of bits used to
      encode each voxel's grayscale value). Common values are 8-bit (256 gray levels),
      16-bit (65,536 gray levels), or 32-bit floating point. Bit depth affects the
      dynamic range available for phase segmentation and quantitative attenuation
      analysis. The procedure may specify a required output bit depth if downstream
      analysis workflows depend on a consistent grayscale range; the analyst confirms
      or adjusts at analysis time.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/outputBitDepth
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/outputBitDepth
      schema:name:
        const: Output Bit Depth
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_calibrationFactorAndDeterminationMethod:
    title: Calibration Factor and Determination Method
    description: 'An externally-calibrated factor that converts the measured quantity
      into the reported quantity, how it was determined, and its uncertainty. Applies
      where the conversion depends on a factor calibrated against a reference of independently
      known value, rather than on the instrument response alone. Distinct from the
      fields that name the calibration material and that state which approach applies
      to which analyte, where the technique has them: this field records the resulting
      factor itself.'
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/calibrationFactorAndDeterminationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/calibrationFactorAndDeterminationMethod
      schema:name:
        const: Calibration Factor and Determination Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_constantsAndReferenceValuesUsed:
    title: Constants and Reference Values Used
    description: Physical constants and reference values used in data reduction to
      calculate the final reported quantity (e.g., decay constants for age calculation,
      standard isotope ratios, or other citable reference values used in a correction
      or calculation), together with their source. Distinct from the Group 6 reference-material
      fields, which document accepted values for specific calibration/validation materials
      rather than universal physical constants. Record "None" if no citable, revisable
      physical constants feed into this procedure's data reduction.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/constantsAndReferenceValuesUsed
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/constantsAndReferenceValuesUsed
      schema:name:
        const: Constants and Reference Values Used
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_effectiveSpatialResolution:
    title: Effective Spatial Resolution (PSF/MTF)
    description: "Effective spatial resolution of the reconstructed CT volume, which
      typically differs from (and is coarser than) the voxel size due to the detector
      point spread function (PSF), geometric unsharpness, and the reconstruction filter.
      The Nyquist limit sets a theoretical floor at 2\xD7 the voxel size. Formal measurement
      uses the PSF method described in Ketcham & Hildebrandt (2014) or the modulation
      transfer function (MTF); resolution can also be reported per ASTM E1441-11.
      When formal measurement is unavailable, an estimate based on acquisition geometry
      (e.g., the Brenner-Weiss formula) or a stated multiple of the voxel size may
      be recorded. Report the value in \xB5m along with the method used to determine
      or estimate it. Note that most XCT papers use the bare phrase \"spatial resolution\"
      for the voxel size; record that under Voxel Size, and leave this field as not
      reported unless an effective resolution was actually determined."
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/effectiveSpatialResolution
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/effectiveSpatialResolution
      schema:name:
        const: Effective Spatial Resolution (PSF/MTF)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_beamHardeningArtifactAssessment:
    title: Beam Hardening Artifact Assessment
    description: Assessment of whether residual beam hardening (cupping artifact)
      is present in the reconstructed volume after any corrections applied during
      reconstruction. Beam hardening in polychromatic lab XCT produces a characteristic
      darker interior and brighter edges in the reconstructed CT number profile, even
      in compositionally uniform material. Record whether this artifact is detectable
      in the final dataset, what correction or mitigation was applied (e.g., linearisation,
      pre-filtering, iterative correction), and whether any residual effect influences
      the analysis region.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/beamHardeningArtifactAssessment
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/beamHardeningArtifactAssessment
      schema:name:
        const: Beam Hardening Artifact Assessment
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_ringArtifactSeverityAndCorrectionOutcome:
    title: Ring Artifact Severity and Correction Outcome
    description: "Assessment of whether ring artifacts \u2014 concentric rings centred
      on the rotation axis arising from differential sensitivity or gain drift among
      detector elements \u2014 were present and whether correction was effective.
      Note that ring correction algorithms modify image intensity in narrow annular
      bands; in samples containing linear geological features oriented tangentially
      to the rotation axis, ring correction can alter or introduce spurious linear
      features in those orientations. Record whether rings were present, whether correction
      was applied, and whether any residual rings or correction artifacts fall within
      the analysis volume of interest."
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/ringArtifactSeverityAndCorrectionOutcome
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/ringArtifactSeverityAndCorrectionOutcome
      schema:name:
        const: Ring Artifact Severity and Correction Outcome
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_metalStreakArtifactAssessment:
    title: Metal Streak Artifact Assessment
    description: Assessment of whether high-density inclusions (FeNi metal, platinum-group
      minerals, dense oxides, or other high-Z phases) produce streak or starburst
      artifacts in the reconstructed volume. Common forms include radial starburst
      streaks from high-Z inclusions and shadowing (anomalously low CT number) in
      beam-shadow regions behind dense phases. Record which artifact type(s) are present,
      their spatial extent, and any exclusion zones or correction steps applied.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/metalStreakArtifactAssessment
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/metalStreakArtifactAssessment
      schema:name:
        const: Metal Streak Artifact Assessment
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_partialVolumeEffectCriteria:
    title: Partial Volume Effect Criteria
    description: "Procedure-level specification of how partial volume effects (PVE)
      are managed in quantitative analysis. PVE produces intermediate CT numbers at
      phase boundaries and at the surfaces of small features, because each voxel integrates
      the attenuation of all material within its volume. PVE correction can be implemented
      via PSF-based deconvolution tools such as Blob3D. Record the minimum feature
      size criterion adopted for the procedure (in voxels or \xB5m), the basis for
      it, the treatment of boundary voxels in modal abundance or size distribution
      calculations, and whether PVE correction is required or optional. Per Withers
      et al. (2021) a feature must span at least 3 voxels to be positively identified
      and at least 10 for reliable shape and volume characterisation; state whether
      the criterion follows that convention or is SNR-limited, PVE-limited or analyst-defined.
      The criterion materially changes reported modal abundances and size distributions,
      so two datasets are not comparable without it."
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/partialVolumeEffectCriteria
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/partialVolumeEffectCriteria
      schema:name:
        const: Partial Volume Effect Criteria
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_partialVolumeEffectAssessment:
    title: Partial Volume Effect Assessment
    description: Analysis-level record of PVE severity and how it was handled in this
      specific analysis. Documents the minimum feature size relative to the voxel
      size, the fraction of the feature population affected, and any PVE correction
      method applied (e.g., PSF-based deconvolution via Blob3D).
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/partialVolumeEffectAssessment
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/partialVolumeEffectAssessment
      schema:name:
        const: Partial Volume Effect Assessment
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_signalToNoiseRatio:
    title: Signal-to-Noise Ratio
    description: Quantitative measure of image quality in the reconstructed CT volume.
      Typically calculated as the mean CT number divided by the standard deviation
      of CT number in a homogeneous reference region (e.g., an inclusion-free zone
      of the matrix). SNR is controlled by photon flux (source power, exposure time,
      number of projections) and sample attenuation. Record the measured value and
      the region used for measurement, or note if SNR was not formally measured.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/signalToNoiseRatio
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/signalToNoiseRatio
      schema:name:
        const: Signal-to-Noise Ratio
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_crossValidationProcedureRequirement:
    title: Cross-Validation Procedure Requirement
    description: Procedure-level specification of what independent analytical validation
      is required to confirm CT segmentation results, phase identification, or quantitative
      measurements. Cross-validation is relevant where CT grey-values alone cannot
      uniquely distinguish phases with similar attenuation coefficients. Common approaches
      include BSE imaging, SEM-EDS or EPMA modal analysis, He pycnometry for bulk
      porosity, and Raman or SIMS phase mapping. Record the required validation method(s)
      and the sampling fraction (e.g., every sample, one per session, or a representative
      subset).
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/crossValidationProcedureRequirement
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/crossValidationProcedureRequirement
      schema:name:
        const: Cross-Validation Procedure Requirement
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_crossValidationOutcome:
    title: Cross-Validation Outcome
    description: Analysis-level record of what independent validation was performed
      and its result. Report the validation method(s) used, the quantitative agreement
      achieved (e.g., relative difference in modal abundance, porosity), and any discrepancies
      and their likely causes. Where BSE imaging is the validation method, note that
      BSE provides a 2D section while CT provides a 3D volume.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/crossValidationOutcome
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/crossValidationOutcome
      schema:name:
        const: Cross-Validation Outcome
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_xRayTubeAnodeMaterial:
    title: X-ray Tube Anode Material
    description: Material of the X-ray tube anode (target). Determines the characteristic
      line energies superimposed on the bremsstrahlung continuum, which can affect
      phase contrast at specific energies. Multi-metal anodes (e.g., W/Mo/Cu) extend
      the usable energy range.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/xRayTubeAnodeMaterial
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/xRayTubeAnodeMaterial
      schema:name:
        const: X-ray Tube Anode Material
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_detectorArraySize:
    title: Detector Array Size
    description: "Number of pixels in the detector array (width \xD7 height). Combined
      with detector pixel size and geometric magnification, determines the field of
      view."
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/detectorArraySize
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/detectorArraySize
      schema:name:
        const: Detector Array Size
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_detectorPixelSize:
    title: Detector Pixel Size
    description: Physical size of a single pixel on the detector in micrometres. This
      is a fixed hardware property of the detector array, distinct from the reconstructed
      voxel size (which depends on geometric magnification and binning).
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/detectorPixelSize
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/detectorPixelSize
      schema:name:
        const: Detector Pixel Size
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  labxct_opticalObjective:
    title: Optical Objective
    description: Optical magnification objective installed between the scintillator
      and CCD/CMOS detector. Applies only to instruments using optical magnification
      (e.g., Zeiss Xradia Versa series). For systems using only geometric magnification,
      report "Not applicable".
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/opticalObjective
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/opticalObjective
      schema:name:
        const: Optical Objective
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_coupledProcedureDoi:
    title: Coupled Procedure DOI
    description: Registered procedure DOI for the coupled technique named above. Provides
      a stable, citable link to the companion method independent of whether a dataset
      has been deposited. If the coupled procedure has not yet been registered, enter
      the DOI of a publication describing the coupled method, or "pending". Enter
      "None" if no coupling is planned.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/coupledProcedureDoi
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/coupledProcedureDoi
      schema:name:
        const: Coupled Procedure DOI
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_coupledDatasetOrPublicationReference:
    title: Coupled Dataset or Publication Reference
    description: 'DOI or other persistent identifier for the co-registered dataset
      or publication where both datasets are reported together. Accepts: a dedicated
      dataset DOI (if separately deposited), a shared dataset DOI (if co-submitted
      in the same package), or a publication DOI. Use "same submission" if the coupled
      dataset is included in this data package, or "pending" if not yet assigned.
      If coupling is documented through a shared sample identifier only, that information
      is already captured in Sample Persistent Identifier (Group 2).'
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/coupledDatasetOrPublicationReference
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/coupledDatasetOrPublicationReference
      schema:name:
        const: Coupled Dataset or Publication Reference
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_samplePreparationMethod:
    title: Sample Preparation Method
    description: Method by which samples were prepared for SEM analysis prior to loading
      in the instrument. Includes mounting medium (epoxy, carbon tape, stub), polishing
      steps (alumina, colloidal silica, argon ion mill), and conductive coating type
      and thickness. For VP-SEM/ESEM analyses, note whether an uncoated sample was
      used and the gas type used. FIB-specific in-session operations (protective coating
      deposition, milling conditions, lamella preparation) are documented separately
      in Group 4.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/samplePreparationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/samplePreparationMethod
      schema:name:
        const: Sample Preparation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_samplePersistentIdentifier:
    title: Sample Persistent Identifier
    description: Globally unique, persistent identifier for each sample listed in
      Sample Name. IGSN (International Geo Sample Number) is the recommended standard
      for geological and cosmochemical samples, as used by Astromat, EarthChem and
      SESAR. Where a sample and its sub-samples are separately registered, record
      the identifier at the level actually analysed.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/samplePersistentIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/samplePersistentIdentifier
      schema:name:
        const: Sample Persistent Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_targetSelectionCriteria:
    title: Target Selection Criteria
    description: "The rules governing which part of the sample is analysed, and why.
      Covers the criteria applied when choosing grains, aliquots, spots, or a region
      of interest \u2014 size, morphology, clarity, freedom from inclusions or alteration,
      phase identity, or spatial position. Distinct from Target Material, which states
      the material type the procedure is designed for: this field states how, within
      such a sample, the analysed portion is picked out."
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/targetSelectionCriteria
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/targetSelectionCriteria
      schema:name:
        const: Target Selection Criteria
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_preAnalysisImagingAndScreening:
    title: Pre-Analysis Imaging and Screening
    description: Imaging or other characterisation performed before the measurement
      in order to select or locate the analysed target, including the technique, instrument
      and settings used, and how individual analyses are linked back to the images.
      Distinct from any imaging the procedure performs as its own measurement. Where
      the imaging is performed on a separate instrument, it should also be recorded
      in the Group 1 coupling fields.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/preAnalysisImagingAndScreening
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/preAnalysisImagingAndScreening
      schema:name:
        const: Pre-Analysis Imaging and Screening
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_dataProcessingSoftware:
    title: Data Processing Software(s)
    description: All software applied to the data after acquisition in order to produce
      the reported quantities, including version numbers. List every package used.
      Distinct from Acquisition Software, which controls the instrument and collects
      the raw data.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/dataProcessingSoftware
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/dataProcessingSoftware
      schema:name:
        const: Data Processing Software(s)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_acceleratingVoltage:
    title: Accelerating Voltage
    description: Electron beam accelerating voltage in kilovolts. Affects X-ray generation
      depth (EDS/WDS), EBSD pattern quality, imaging resolution, and beam penetration.
      Low voltages (1-5 kV) improve surface sensitivity and reduce beam damage; high
      voltages (15-20 kV) improve X-ray generation for quantitative analysis.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/acceleratingVoltage
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/acceleratingVoltage
      schema:name:
        const: Accelerating Voltage
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  semComposition_beamCurrent:
    title: Beam Current
    description: Electron beam probe current. Higher current improves signal-to-noise
      for X-ray analysis (EDS/WDS, EBSD) and CL but may increase beam damage and reduce
      spatial resolution. Express in nA; for sub-nA values use decimal notation (e.g.,
      0.4 nA).
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/beamCurrent
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/beamCurrent
      schema:name:
        const: Beam Current
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  semComposition_beamDiameter:
    title: Beam Diameter
    description: Nominal electron beam diameter (spot size) at the sample surface,
      in nanometres or micrometres, as set by the condenser aperture and working distance.
      Controls the spatial resolution and X-ray excitation volume. For mapping modes,
      the effective spatial sampling interval is further defined by Step Size / Pixel
      Size.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/beamDiameter
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/beamDiameter
      schema:name:
        const: Beam Diameter
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  semComposition_beamRasterDimensions:
    title: Beam Raster Dimensions
    description: "Dimensions of the small area over which the beam is rastered during
      a single analysis point, reported as width \xD7 height in \xB5m. Applicable
      when Beam Mode = Rastered; defines the effective spatial footprint of the measurement
      and distributes dose over a larger area to reduce beam damage on sensitive phases."
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/beamRasterDimensions
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/beamRasterDimensions
      schema:name:
        const: Beam Raster Dimensions
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  semComposition_beamDamageMinimization:
    title: Beam Damage Minimization
    description: 'Describes any measures taken to reduce electron beam damage to the
      sample during analysis. Examples: reduced accelerating voltage, lowered beam
      current, defocused or rastered beam, cooled stage, short acquisition sequences,
      or rotating between multiple points. Particularly important for volatile-bearing
      phases, hydrous minerals, glasses, organic materials, and biological samples.'
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/beamDamageMinimization
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/beamDamageMinimization
      schema:name:
        const: Beam Damage Minimization
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_driftCorrection:
    title: Drift Correction
    description: 'Describes whether and how stage or beam drift was monitored and
      corrected during the measurement session. Examples: periodic stage realignment
      to a fiducial marker, automated beam drift correction in acquisition software,
      or reanalysis of a reference point at regular intervals. Particularly relevant
      for long mapping runs and high-magnification sessions where positional accuracy
      affects data quality.'
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/driftCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/driftCorrection
      schema:name:
        const: Drift Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_workingDistance:
    title: Working Distance
    description: Distance between the objective lens pole piece and the specimen surface
      in millimetres. Affects spatial resolution, depth of focus, EDS X-ray take-off
      angle, and EBSD geometry.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/workingDistance
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/workingDistance
      schema:name:
        const: Working Distance
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  semComposition_chamberPressure:
    title: Chamber Pressure
    description: Chamber pressure and gas type during analysis. Required for variable
      pressure (VP-SEM) and environmental SEM (ESEM) modes. Report value and unit
      (Pa or Torr) and gas composition. Use 'None' for standard high-vacuum operation.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/chamberPressure
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/chamberPressure
      schema:name:
        const: Chamber Pressure
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  semComposition_dwellTimePerPixel:
    title: Dwell Time per Pixel
    description: Time the electron beam dwells on each pixel during raster scanning
      (imaging modes) or on each step position during compositional mapping (EDS and
      WDS mapping modes), in microseconds or milliseconds. Longer dwell time improves
      signal-to-noise and counting statistics but increases total dose and can cause
      beam damage or contamination on sensitive materials. For WDS mapping, the dwell
      time is per spectrometer per pixel.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/dwellTimePerPixel
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/dwellTimePerPixel
      schema:name:
        const: Dwell Time per Pixel
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  semComposition_edsLiveTimePerPointOrPixel:
    title: EDS Live Time per Point or Pixel
    description: EDS spectral acquisition live time per analysis point or per pixel
      in seconds. Longer live time improves counting statistics but increases beam
      damage risk and total acquisition time.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/edsLiveTimePerPointOrPixel
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/edsLiveTimePerPointOrPixel
      schema:name:
        const: EDS Live Time per Point or Pixel
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  semComposition_stepSizePixelSize:
    title: Step Size / Pixel Size
    description: "Centre-to-centre distance between adjacent measurement points (WDS
      mapping) or pixels (EDS mapping) in \xB5m. Defines the spatial sampling interval
      of the map and, together with the pixel-grid dimensions, determines the total
      mapped area. Smaller step sizes increase spatial resolution but extend acquisition
      time."
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/stepSizePixelSize
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/stepSizePixelSize
      schema:name:
        const: Step Size / Pixel Size
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  semComposition_peakCountingTime:
    title: Peak Counting Time
    description: Time spent counting X-ray intensity at the peak position, in seconds,
      on each spectrometer assignment. Procedure specifies standard values; analysts
      may adjust within procedure-defined bounds.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/peakCountingTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/peakCountingTime
      schema:name:
        const: Peak Counting Time
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  semComposition_backgroundCountingTime:
    title: Background Counting Time
    description: Total time spent counting at off-peak background position(s) in seconds,
      summed across all background positions.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/backgroundCountingTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/backgroundCountingTime
      schema:name:
        const: Background Counting Time
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  semComposition_backgroundPosition:
    title: Background Position(s)
    description: Location(s) of off-peak background measurement(s) relative to the
      peak, in mm or sin-theta, and whether on the high- or low-energy side.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/backgroundPosition
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/backgroundPosition
      schema:name:
        const: Background Position(s)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_backgroundCorrectionMethod:
    title: Background Correction Method
    description: 'Method used to estimate and subtract background X-ray intensity
      beneath the peak. For WDS: typically 2-point off-peak linear interpolation or
      Mean Atomic Number (MAN) background model. For EDS: spectral background fitting
      or top-hat filter applied during spectral processing.'
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/backgroundCorrectionMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/backgroundCorrectionMethod
      schema:name:
        const: Background Correction Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_timeDependentIntensityCorrection:
    title: Time-Dependent Intensity Correction
    description: Type of time-dependent intensity (TDI) correction applied to compensate
      for beam-induced volatilisation or migration of sensitive elements (e.g., Na,
      K, F in glasses, feldspars, carbonates). Most commonly applied in WDS point
      analysis; uncommon for EDS or X-ray mapping.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/timeDependentIntensityCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/timeDependentIntensityCorrection
      schema:name:
        const: Time-Dependent Intensity Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_halogenCorrectionOnOxygen:
    title: Halogen Correction on Oxygen
    description: Whether oxygen content was adjusted to account for halogen substitution
      (F and/or Cl replacing OH) in halogen-bearing phases such as apatite, amphibole,
      and mica, where oxygen is calculated by stoichiometry.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/halogenCorrectionOnOxygen
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/halogenCorrectionOnOxygen
      schema:name:
        const: Halogen Correction on Oxygen
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_blankCorrection:
    title: Blank Correction
    description: Method and reference material(s) used to determine and subtract blank
      signal contributions (e.g., carbon coat contribution to C signal, or background
      contamination for trace elements).
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/blankCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/blankCorrection
      schema:name:
        const: Blank Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_normalizationStandardsBasedCorrection:
    title: Normalization / Standards-Based Correction
    description: Post-acquisition normalization applied using secondary reference
      materials to correct for session-to-session calibration drift.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/normalizationStandardsBasedCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/normalizationStandardsBasedCorrection
      schema:name:
        const: Normalization / Standards-Based Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_calibrationFactorAndDeterminationMethod:
    title: Calibration Factor and Determination Method
    description: 'An externally-calibrated factor that converts the measured quantity
      into the reported quantity, how it was determined, and its uncertainty. Applies
      where the conversion depends on a factor calibrated against a reference of independently
      known value, rather than on the instrument response alone. Distinct from the
      fields that name the calibration material and that state which approach applies
      to which analyte, where the technique has them: this field records the resulting
      factor itself.'
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/calibrationFactorAndDeterminationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/calibrationFactorAndDeterminationMethod
      schema:name:
        const: Calibration Factor and Determination Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_constantsAndReferenceValuesUsed:
    title: Constants and Reference Values Used
    description: Physical constants and reference values used in data reduction to
      calculate the final reported quantity (e.g., decay constants for age calculation,
      standard isotope ratios, or other citable reference values used in a correction
      or calculation), together with their source. Distinct from the Group 6 reference-material
      fields, which document accepted values for specific calibration/validation materials
      rather than universal physical constants. Record "None" if no citable, revisable
      physical constants feed into this procedure's data reduction.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/constantsAndReferenceValuesUsed
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/constantsAndReferenceValuesUsed
      schema:name:
        const: Constants and Reference Values Used
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_primaryCalibrationStandardName:
    title: Primary Calibration Standard Name
    description: Name(s) of the primary reference material(s) used for intensity calibration
      in EDS or WDS quantification. Include the material name, its source or supplier,
      and a citation for the accepted values used, since results calibrated against
      different published values for the same material are not directly comparable.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/primaryCalibrationStandardName
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/primaryCalibrationStandardName
      schema:name:
        const: Primary Calibration Standard Name
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_secondaryReferenceMaterials:
    title: Secondary Reference Materials
    description: Quality-control reference material(s) analyzed alongside unknowns
      to verify calibration accuracy. Include material name, assessed elements, number
      of analyses (n), and measured vs. accepted values where available.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/secondaryReferenceMaterials
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/secondaryReferenceMaterials
      schema:name:
        const: Secondary Reference Materials
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_edsDetectorConfiguration:
    title: EDS Detector Configuration
    description: EDS detector type, manufacturer, active area, solid angle, window
      type, and geometry (take-off angle, position). Multiple detectors should be
      listed separately.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/edsDetectorConfiguration
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/edsDetectorConfiguration
      schema:name:
        const: EDS Detector Configuration
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_wdsSpectrometerConfiguration:
    title: WDS Spectrometer Configuration
    description: Number, type, and crystal range of WDS spectrometers on the instrument.
      Include manufacturer, model, and crystal range. For SEM-WDS configurations (third-party
      WDS on a non-EPMA platform), include WDS manufacturer and model.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/wdsSpectrometerConfiguration
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/wdsSpectrometerConfiguration
      schema:name:
        const: WDS Spectrometer Configuration
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_stageScanVsBeamScan:
    title: Stage Scan vs. Beam Scan
    description: For mapping modes, records whether the map was acquired by moving
      the stage while the beam is held fixed (stage scan) or by deflecting the beam
      across the field while the stage is stationary (beam scan). Stage scan is preferred
      for large areas or high-accuracy geometric fidelity; beam scan is faster for
      smaller fields but may introduce geometric distortion at the map edges.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/stageScanVsBeamScan
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/stageScanVsBeamScan
      schema:name:
        const: Stage Scan vs. Beam Scan
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_wdsSpectrometerChannel:
    title: WDS Spectrometer Channel
    description: "WDS spectrometer position(s) assigned to each analyte, one entry
      per assignment. An analyte may be assigned to more than one spectrometer with
      intensities aggregated (aggregate intensity counting), and one spectrometer
      serves several analytes across a run, so the assignment \u2014 not the analyte
      \u2014 is the unit carrying the spectrometer setup. Different spectrometers
      may have different crystal configurations."
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/wdsSpectrometerChannel
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/wdsSpectrometerChannel
      schema:name:
        const: WDS Spectrometer Channel
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_sequence:
    title: Sequence
    description: Order in which spectrometer assignments are acquired during point
      analysis. Relevant for minimizing beam damage (volatile elements measured first)
      and for sequential multi-channel setups. Not applicable to X-ray mapping, where
      all assigned spectrometers collect simultaneously at each pixel.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/sequence
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/sequence
      schema:name:
        const: Sequence
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_proportionalCounterDetector:
    title: Proportional Counter / Detector
    description: Type of detector used on each spectrometer assignment. Affects sensitivity
      and count rate linearity.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/proportionalCounterDetector
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/proportionalCounterDetector
      schema:name:
        const: Proportional Counter / Detector
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_wdsPhaSetting:
    title: WDS PHA Setting
    description: Pulse height analyzer (PHA) setting for the WDS detector. Integral
      mode accepts all pulses above a threshold; Differential mode selects a narrow
      energy window to reject higher-order reflections and escape peaks.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/wdsPhaSetting
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/wdsPhaSetting
      schema:name:
        const: WDS PHA Setting
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_analyteEstimationMethod:
    title: Analyte Estimation Method
    description: Whether elemental concentrations were calculated directly from measured
      X-ray intensities, or estimated by cation stoichiometry (e.g., oxygen calculated
      from cation proportions in silicates; carbon from stoichiometry in carbonates).
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/analyteEstimationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/analyteEstimationMethod
      schema:name:
        const: Analyte Estimation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_edsSpectralProcessingType:
    title: EDS Spectral Processing Type
    description: Method used to process EDS spectra and extract net peak intensities
      from raw spectral data. Applied before quantification (see Matrix Correction
      Method). Common approaches include background fitting and subtraction followed
      by peak integration, and filter fit or Gaussian deconvolution for overlapping
      peaks.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/edsSpectralProcessingType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/edsSpectralProcessingType
      schema:name:
        const: EDS Spectral Processing Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_interferingElements:
    title: Interfering Elements
    description: Element(s) whose X-ray lines overlap with the measured peak for one
      or more analytes, requiring a correction.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/interferingElements
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/interferingElements
      schema:name:
        const: Interfering Elements
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_interferenceCorrectionStandard:
    title: Interference Correction Standard
    description: Reference material used to quantify and calibrate the interference
      correction for each affected analyte.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/interferenceCorrectionStandard
