  cdif.bbr.metadata.schemaorgProperties.labeledLink:
    description: 'Schema for a labeled link, a profile of schema.org/CreativeWork:
      a resolvable URL with an optional name and description. Optionally carries the
      DCAT relation surface (dcat:hadRole, dcterms:relation) for a link that expresses
      a typed relationship rather than a plain reference.

      Those two properties were a separate block, cdifDataType/cdifReference, which
      was an allOf of this schema plus exactly those two optional properties and nothing
      else -- its dcat:Relationship co-type mandate had already been removed because
      it made every labeled link unsatisfiable and broke every schema:license example
      that followed schema.org''s own advice. Since both are optional, folding them
      in here changes no document''s validity while removing a block and five levels
      of $defs/Reference indirection. cdifReference was retired 2026-09-23.'
    type: object
    properties:
      '@type':
        description: 'Either construct, or both. A labeled link is a schema:CreativeWork
          at a URL; a dcat:Relationship is DCAT''s association class for a typed relation
          to another resource. A node may declare both -- CDIF''s own relation examples
          do -- but NEITHER IS REQUIRED TO ACCOMPANY THE OTHER.

          That is the whole point of the anyOf. Until 2026-09-08 this block''s Relation
          half required contains: dcat:Relationship while the labeled-link half required
          contains: schema:CreativeWork, and under allOf both applied to every instance,
          so an ordinary labeled link was unsatisfiable. Of profile-core''s licenses
          the 29 plain strings and 1 @id-reference passed while the 10 that followed
          schema.org''s own recommendation -- "use schema:CreativeWork to provide
          a label (name) for the license" -- failed. 412782113 fixed that by deleting
          the dcat:Relationship mandate outright, which left the JSON Schema with
          no notion of dcat:Relationship at all while rules.shacl went on targeting
          it as a class. A pure DCAT relation then met a SHACL requirement with no
          schema counterpart. This anyOf restores the type to the schema WITHOUT restoring
          the conjunction.'
        default:
        - schema:CreativeWork
        type: array
        items:
          type: string
        minItems: 1
        anyOf:
        - contains:
            enum:
            - schema:CreativeWork
        - contains:
            enum:
            - dcat:Relationship
      schema:name:
        type: string
        x-jsonld-id: http://schema.org/name
      schema:description:
        type: string
        x-jsonld-id: http://schema.org/description
      schema:url:
        type: string
        format: uri
        x-jsonld-id: http://schema.org/url
      dcat:hadRole:
        description: 'Role of the related resource. Present only on a link that expresses
          a relationship; a plain labeled link such as a license omits it.

          DCAT''s declared range is dcat:Role (dcat.ttl: rdfs:range dcat:Role, and
          dcat:Role rdfs:subClassOf skos:Concept), so the DCAT-native form is a node
          typed dcat:Role. That form was NOT accepted here before 2026-10-01: this
          property was cdifConceptOrTermOrString alone, which matches a bare string,
          a sealed @id reference, a schema:DefinedTerm or a skos:Concept -- none of
          which a dcat:Role-typed node satisfies, because JSON Schema does no subclass
          reasoning.

          dcat:Role is added as a branch rather than replacing the others, so the
          DCAT-native form becomes valid without invalidating anything already written.
          Note this leaves CDIF LOOSER than DCAT, deliberately: DCAT''s range is dcat:Role
          alone, and CDIF also accepts a plain skos:Concept, a DefinedTerm, an @id
          reference and a string. That is the same both-forms stance taken on dcterms:relation,
          and it is a choice rather than an oversight -- do not read the extra branches
          as something not yet tightened.'
        anyOf:
        - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.labeledLink/$defs/DcatRole
        - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.labeledLink/$defs/cdifConceptOrTermOrString
        x-jsonld-id: http://www.w3.org/ns/dcat#hadRole
      dcterms:relation:
        description: 'The related resource -- the DCAT canonical pointer to what is
          being related to, which is distinct from schema:url, the presentation URL
          of the link itself.

          An @id reference is the RECOMMENDED form and a string is permitted, which
          is DCMI''s own position: "Recommended practice is to identify the related
          resource by means of a URI. If this is not possible or feasible, a string
          conforming to a formal identification system may be provided." DCMI declares
          no rdfs:range for this property, and of the 13 DCMI properties carrying
          an "intended to be used with non-literal values" restriction, this is deliberately
          not one. dcat.ttl does not re-declare or constrain it at all -- the only
          triple mentioning it in the whole DCAT vocabulary is `dcat:distribution
          rdfs:subPropertyOf dcterms:relation`.

          So objectReference-only would be stricter than both DCAT and DCMI and would
          reject a form the specification sanctions. The anyOf matches how schema:additionalType
          is handled here: both forms valid, the object form used in examples and
          required only where a `contains` pins a specific value.

          It was string-only until 2026-10-01, which rejected the @id form outright.
          Reported from outside by a PSDI validator taking a things-not-strings approach
          (profile-core#16): their DCAT catalogue mirrors the DCAT-3 spec examples
          and wrote {"@id": ...}, which failed both layers -- while CDIF''s own documented
          URI serialization policy (agents.md) says URI values SHOULD be {"@id": ...}.
          The register required the one form its own policy argues against.'
        anyOf:
        - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.objectReference
        - type: string
          format: uri
        x-jsonld-id: http://purl.org/dc/terms/relation
    required:
    - '@type'
    allOf:
    - if:
        required:
        - '@type'
        properties:
          '@type':
            contains:
              enum:
              - schema:CreativeWork
      then:
        required:
        - schema:url
    $defs:
      cdifConceptOrTermOrString:
        $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifConceptOrTermOrString
      DcatRole:
        description: 'A dcat:Role -- DCAT''s declared range for dcat:hadRole. Defined
          inline rather than as its own building block because nothing else in the
          register needs it yet; dcat:hadRole''s domain is owl:unionOf [prov:Attribution,
          dcat:Relationship], so promote it to a block if a qualified attribution
          ever needs the same shape.

          dcat:Role rdfs:subClassOf skos:Concept, so the skos:prefLabel / skos:inScheme
          furniture of a concept is permitted alongside; it is not required here because
          DCAT states no cardinality constraints on the class -- dcat.ttl declares
          no rdfs:subClassOf and no owl:Restriction on dcat:Relationship, and the
          "mandatory" wording in the DCAT-3 document is prose in the spec tables rather
          than an axiom in the vocabulary.'
        type: object
        properties:
          '@id':
            type: string
            description: IRI of the role concept, ideally from a controlled vocabulary.
          '@type':
            type: array
            items:
              type: string
            contains:
              enum:
              - dcat:Role
            minItems: 1
        required:
        - '@type'
    x-jsonld-prefixes:
      schema: http://schema.org/
      skos: http://www.w3.org/2004/02/skos/core#
      dcterms: http://purl.org/dc/terms/
      dcat: http://www.w3.org/ns/dcat#
    x-schema-source: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/schemaorgProperties/labeledLink/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
  cdif.bbr.metadata.schemaorgProperties.linkRole:
    description: 'A typed link, implemented as a schema.org LinkRole: schema:linkRelationship
      names how the target relates to the subject, and schema:target carries the EntryPoint
      actually being linked to.

      This is the right shape when the relationship itself is the point -- "this is
      the canonical version of", "this is the download endpoint for". Where the value
      is simply a work at a URL, such as a license or a terms-of-service document,
      use schemaorgProperties/labeledLink instead: a licence is a work, not a role,
      and wrapping it in a Role forces every consumer through an indirection to reach
      the thing itself.

      Defined here as a block rather than inline in a profile (where it lived until
