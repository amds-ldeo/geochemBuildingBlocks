x-defs:
  ogch.BaseSchema.instrument:
    title: ADA Analysis Instrument
    description: ADA analytical instrument building block. Extends the core CDIF instrument
      building block with NeXus NXinstrument classification via additionalType. Instruments
      are typed as schema:Thing + schema:Product (from core) with domain-specific
      types (e.g. nxs:base_classes/NXinstrument.html, ada:AMSInstrument) in additionalType.
    allOf:
    - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument
    - type: object
      properties:
        '@id':
          description: 'Identifier for this instrument within the record. REQUIRED:
            an instrument has to be referenceable. A monitored species names the instrument
            (or the instrument part) that reports it, and a dataset variable points
            back at the device that produced it; neither is expressible while the
            instrument is an anonymous object. A document-scoped identifier suffices,
            but a resolvable one is better wherever the lab has a persistent identifier
            for the device.'
          type: string
          minLength: 1
        schema:additionalType:
          description: 'Domain-specific instrument type classifications. Should include
            a NeXus base class (e.g. nxs:base_classes/NXinstrument.html) and/or technique-specific
            identifier (e.g. ada:AMSInstrument, GCMD instrument identifier). URI-shape
            values MUST be serialized as JSON-LD IRI references ({"@id":"..."}); free-label
            strings remain valid. Every instrument additionally carries the Wikidata
            "measuring instrument" type, which is invariant across techniques: the
            technique-specific entry says what KIND of instrument this is and varies
            by profile, while the Wikidata term says that it is an instrument at all,
            and gives a consumer one term to select on without knowing the ADA vocabulary.'
          type: array
          items:
            anyOf:
            - type: string
            - type: object
              additionalProperties: false
              required:
              - '@id'
              properties:
                '@id':
                  type: string
          minItems: 1
          contains:
            type: object
            properties:
              '@id':
                enum:
                - https://www.wikidata.org/wiki/Q3099911
            required:
            - '@id'
          x-jsonld-id: http://schema.org/additionalType
        schema:hasPart:
          description: 'Sub-components of this instrument system (a torch, an ICP
            source, a collision/reaction cell, a spectrometer). A component IS an
            instrument -- same @type (schema:Product + schema:Thing), same Wikidata
            term, and its own schema:additionalType token saying which kind of component
            it is. The shape is restated rather than written as `$ref: ''#''`, because
            resolve_schema replaces a circular ref with an empty stub -- it would
            read as "a part is an instrument" and enforce nothing. Upstream types
            a component more loosely (schema:Thing alone, no Wikidata); this narrows
            it, and the two compose because allOf intersects.'
          type: array
          items:
            anyOf:
            - type: object
              required:
              - '@id'
              - '@type'
              - schema:name
              - schema:additionalType
              properties:
                '@id':
                  description: 'Identifier for this component within the record. REQUIRED
                    on an INLINE component for the same reason it is required on the
                    instrument: a monitored species names the part that reports it
                    -- a Faraday cup, a spectrometer, a detector -- and an anonymous
                    object cannot be referenced. The sibling branch of this anyOf
                    is the by-reference form, a bare {"@id": ...} pointing at a component
                    described elsewhere.'
                  type: string
                  minLength: 1
                '@type':
                  type: array
                  items:
                    type: string
                  minItems: 2
                  allOf:
                  - contains:
                      enum:
                      - schema:Product
                  - contains:
                      enum:
                      - schema:Thing
                schema:name:
                  type: string
                  x-jsonld-id: http://schema.org/name
                schema:additionalType:
                  type: array
                  minItems: 1
                  contains:
                    type: object
                    required:
                    - '@id'
                    properties:
                      '@id':
                        enum:
                        - https://www.wikidata.org/wiki/Q3099911
                  x-jsonld-id: http://schema.org/additionalType
                ada:collectorConfiguration:
                  description: 'How masses are assigned to collector positions for
                    this procedure, AS THE SOURCE STATES IT. Free text on purpose:
                    submitters write this as prose or as a semicolon-separated list
                    in no agreed syntax ("L3=116Sn (Sn); L2=117Sn (Sn); Ax=120Sn ..."),
                    and in many cases it cannot be parsed at all. Recording the statement
                    verbatim is what can always be done; ada:collectors below is what
                    can sometimes be done as well. Meaningful on a component whose
                    schema:additionalType includes ''Collector''.'
                  type: string
                ada:collectors:
                  description: "The collector table. One member per position when
                    ada:collectorConfiguration parses into positions, and ONE member
                    carrying the text as written when it does not -- the N=1 form
                    of the flattening fallback that TAPP-keyed-values-design.md Decision
                    6 settles for every keyed axis: \"rather than admit two shapes,
                    always emit the table: a declaration that does not parse into
                    members yields a one-row table whose row key is the text as written.
                    The fallback is then not a separate branch but N=1.\"\nSo a consumer
                    reads one shape either way. In the N=1 form schema:name is a fixed
                    label rather than a cup ('Collector configuration description'),
                    schema:description carries the unparsed string, and the per-item
                    values ride in schema:additionalProperty as name/value pairs.
                    Parsing these strings to individual collectors is not tractable
                    in general -- they are written for a person to read -- so N=1
                    is expected to be the common case, not the exception.\nThis exists
                    because a cup label has to be referenceable WHEN there is one.
                    A per-cup quantity (a baseline, a gain factor) and a monitored
                    property that names the position reporting it both need something
                    to point AT, and a label buried in a sentence is not something
                    a consumer can join to. schema:name is that anchor.\nWhat a collector
                    does NOT carry is which monitored property it measures. That assignment
                    is procedure configuration, not hardware -- the same physical
                    array is wired differently by another procedure, and an analysis
                    may override it -- so it lives as the 'collector' column of ada:monitoredPropertyColumns
                    on the method definition, whose values are these schema:names.
                    Putting it here would invert the dependency and make the instrument
                    description procedure-specific.\nNote what an N=1 member does
                    NOT assert: it names no cup, so it makes no per-cup claim. That
                    matters because the resistor values are attested per MASS, not
                    per cup (Proposal_Monitored_Property_2026-09-10 \xA710), and the
                    fallback must not quietly move them onto the collector axis."
                  type: array
                  items:
                    type: object
                    required:
                    - '@type'
                    - schema:name
                    properties:
                      '@type':
                        type: array
                        minItems: 1
                        items:
                          type: string
                        contains:
                          enum:
                          - ada:Collector
                      schema:name:
                        description: The collector position label as the instrument
                          names it -- L5..L1, C or Ax, H1..H5, IC1..IC8 on a Neptune-class
                          multicollector. This is the identifier other properties
                          reference. In the N=1 fallback there is no position to name,
                          so it is the fixed label 'Collector configuration description'
                          and nothing should join to it.
                        type: string
                        minLength: 1
                        x-jsonld-id: http://schema.org/name
                      schema:description:
                        type: string
                        x-jsonld-id: http://schema.org/description
                      schema:additionalProperty:
                        description: Quantities carried on this member as name/value
                          pairs. In the parsed form these are per-position quantities
                          that cannot be restated per mass -- a baseline, a gain factor.
                          In the N=1 form they are the source fields themselves, each
                          as its item name and the text as written, which is how an
                          unparseable per-collector statement is preserved without
                          inventing an assignment it does not make.
                        type: array
                        items:
                          type: object
                          required:
                          - schema:name
                          properties:
                            schema:name:
                              description: The item name, e.g. 'Faraday Cup Amplifier
                                Resistor Values'.
                              type: string
                              x-jsonld-id: http://schema.org/name
                            schema:value:
                              description: The value, as written when it did not parse.
                              x-jsonld-id: http://schema.org/value
                        x-jsonld-id: http://schema.org/additionalProperty
            - type: object
              additionalProperties: false
              description: Reference by node @id to a component described elsewhere.
              required:
              - '@id'
              properties:
                '@id':
                  type: string
          x-jsonld-id: http://schema.org/hasPart
      required:
      - '@id'
      - schema:additionalType
    x-jsonld-prefixes:
      schema: http://schema.org/
      nxs: https://manual.nexusformat.org/classes/
    x-schema-source: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/instrument/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
  cdif.bbr.metadata.schemaorgProperties.instrument:
    title: Instrument Description
    description: Schema for describing laboratory instruments and instrument systems.
      Supports ownership, manufacturer, model, commissioning dates, hierarchical sub-components
      via schema:hasPart, and domain-specific typing. Instruments may be standalone
      devices or complex systems with sub-components.
    type: object
    properties:
      '@context':
        type: object
        description: JSON-LD context declaring namespace prefixes.
        properties:
          schema:
            enum:
            - http://schema.org/
          dcterms:
            enum:
            - http://purl.org/dc/terms/
        required:
        - schema
      '@id':
        type: string
        description: Persistent identifier URI for this instrument metadata record.
      '@type':
        type: array
        items:
          type: string
        minItems: 2
        description: Must include schema:Product and schema:Thing. May include additional
          types.
        allOf:
        - contains:
            enum:
            - schema:Product
        - contains:
            enum:
            - schema:Thing
      schema:additionalType:
        description: Domain-specific type classifications. Should include a scientific
          instrument type URI (e.g. wd:Q3099911 for Wikidata scientific instrument).
        type: array
        items:
          $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/cdifConceptOrTermOrString
        minItems: 1
        x-jsonld-id: http://schema.org/additionalType
      schema:name:
        type: string
        minLength: 3
        description: Human-readable name for this instrument.
        x-jsonld-id: http://schema.org/name
      schema:description:
        type: string
        description: Text description of this instrument, its purpose, and capabilities.
        x-jsonld-id: http://schema.org/description
      schema:alternateName:
        description: Alternate name(s), e.g. specific make/model designation, common
          abbreviation.
        type: array
        items:
          anyOf:
          - type: string
          - type: object
            additionalProperties: false
            required:
            - '@id'
            properties:
              '@id':
                type: string
        x-jsonld-id: http://schema.org/alternateName
      schema:identifier:
        description: Formal identifier(s) for this instrument. Use PropertyValue for
          structured identifiers (e.g. PIDINST, serial number, inventory number).
        type: array
        items:
          anyOf:
          - type: string
          - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/Identifier
        x-jsonld-id: http://schema.org/identifier
      schema:url:
        type: string
        format: uri
        description: Landing page URL for this instrument.
        x-jsonld-id: http://schema.org/url
      schema:manufacturer:
        description: Organization that manufactured this instrument.
        x-jsonld-id: http://schema.org/manufacturer
        allOf:
        - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/Organization
      schema:model:
        type: object
        description: Product model information for this instrument.
        properties:
          '@type':
            type: array
            items:
              type: string
            contains:
              enum:
              - schema:ProductModel
            minItems: 1
          schema:name:
            type: string
            description: Model name or number.
            x-jsonld-id: http://schema.org/name
          schema:identifier:
            description: Model identifier.
            anyOf:
            - type: string
            - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/Identifier
            x-jsonld-id: http://schema.org/identifier
        required:
        - '@type'
        - schema:name
        x-jsonld-id: http://schema.org/model
      schema:category:
        description: Instrument type classification(s) from a controlled vocabulary.
        type: array
        items:
          $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/DefinedTerm
        x-jsonld-id: http://schema.org/category
      schema:owner:
        description: Organization that owns this instrument.
        x-jsonld-id: http://schema.org/owner
        allOf:
        - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/Organization
      schema:contributor:
        description: Agents associated with this instrument in specific roles (e.g.
          operator, custodian, principal investigator). Use schema:owner for the owning
          organization.
        type: array
        items:
          $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/AgentInRole
        x-jsonld-id: http://schema.org/contributor
      schema:additionalProperty:
        type: array
        description: Instrument-specific properties (measured variables, detection
          limits, calibration information, operating parameters, etc.). On a procedure
          / plan instrument (e.g. an instrument named directly on an ada:TAPPDefinition)
          these are schema:PropertyValueSpecification parameter templates (an overridable
          default); on a prov:used analysis-event instrument they are schema:PropertyValue
          concrete values. The JSON Schema accepts both; a profile SHACL rule pins
          which form applies in which context.
        items:
          anyOf:
          - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/AdditionalProperty
          - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/AdditionalPropertySpecification
        x-jsonld-id: http://schema.org/additionalProperty
      schema:validFrom:
        type: string
        description: Date the instrument was commissioned (ISO 8601).
        x-jsonld-id: http://schema.org/validFrom
      schema:validThrough:
        type: string
        description: Date the instrument was decommissioned (ISO 8601). Absent if
          still operational.
        x-jsonld-id: http://schema.org/validThrough
      schema:hasPart:
        type: array
        description: Sub-components of this instrument system. Each item is either
          an inline instrument description or an @id reference.
        items:
          anyOf:
          - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/InstrumentComponent
          - type: object
            additionalProperties: false
            properties:
              '@id':
                type: string
                description: Reference to a sub-component defined elsewhere.
            required:
            - '@id'
        x-jsonld-id: http://schema.org/hasPart
      schema:relatedLink:
        type: array
        description: Links to related resources (manuals, datasheets, calibration
          records, related instruments), each naming how the target relates to the
          instrument. Uses the same linkRole block as cdifCore; before 2026-09-23
          this property was a labeled link here and a LinkRole there.
        items:
          $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/LinkRole
        x-jsonld-id: http://schema.org/relatedLink
      schema:subjectOf:
        description: Catalog record metadata-about-metadata for this instrument description.
        type: object
        properties:
          '@id':
            type: string
          '@type':
            type: array
            items:
              type: string
          schema:dateModified:
            type: string
            description: Date this metadata record was last modified (ISO 8601).
            x-jsonld-id: http://schema.org/dateModified
          schema:about:
            type: object
            required:
            - '@id'
            additionalProperties: false
            properties:
              '@id':
                type: string
                description: Reference back to the instrument @id.
            x-jsonld-id: http://schema.org/about
          dcterms:conformsTo:
            description: Schema or profile this metadata record conforms to.
            type: array
            items:
              anyOf:
              - type: string
              - type: object
                required:
                - '@id'
                additionalProperties: false
                properties:
                  '@id':
                    type: string
        required:
        - '@type'
        x-jsonld-id: http://schema.org/subjectOf
    required:
    - '@type'
    - schema:name
    $defs:
      cdifConceptOrTermOrString:
        $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifConceptOrTermOrString
      Identifier:
        $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.identifier
      Organization:
        $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.organization
      Person:
        $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.person
      DefinedTerm:
        $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.definedTerm
      AgentInRole:
        $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.agentInRole
      AdditionalProperty:
        $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.additionalProperty
      AdditionalPropertySpecification:
        type: object
        title: additionalProperty PropertyValueSpecification
        description: 'A parameter specification (an overridable default) declared
          on a procedure / plan instrument, typed schema:PropertyValueSpecification;
          the default sits in schema:defaultValue. Contrast with AdditionalProperty
          (schema:PropertyValue), the concrete-value form carried by a prov:used analysis-event
          instrument.

          Until 2026-10-09 this declared only ''@type'' and schema:name, so the description
          named schema:defaultValue as the point of the shape while the schema did
          not declare it. The object is open, so nothing failed -- 203 entries in
          geochemBuildingBlocks carried a default that no schema described, and a
          placement path ending in schema:defaultValue could not be told from a misspelling.

          A domain profile adds its own keys here (geochemBuildingBlocks carries ada:dataType
          and ada:fieldScope on every one of these entries). Those stay out of this
          block: it is a generic schema.org shape with several consumers, and only
          the schema.org properties are its to declare.'
        properties:
          '@type':
            type: array
            items:
              type: string
            contains:
              enum:
              - schema:PropertyValueSpecification
            minItems: 1
          schema:name:
            description: Human-readable label for the parameter.
            type: string
            x-jsonld-id: http://schema.org/name
          schema:valueName:
            description: Machine-readable name for the parameter, for serialization
              and for binding a form control to it.
            type: string
            x-jsonld-id: http://schema.org/valueName
          schema:defaultValue:
            description: 'The overridable default this specification carries -- the
              value that applies unless the analysis overrides it. Left untyped: a
              default may be a string, a number or a boolean, and which one is a property
              of the parameter rather than of this shape.'
            x-jsonld-id: http://schema.org/defaultValue
          schema:value:
            description: 'A value fixed by the procedure, where the parameter is NOT
              overridable. Both keys are declared because both occur: measured across
              the geochemBuildingBlocks corpus on 2026-10-09, of 369 PropertyValueSpecification
              entries under schema:instrument, 203 carry schema:defaultValue and 166
              carry schema:value. A specification that pins a value rather than defaulting
              one is still a specification.'
            x-jsonld-id: http://schema.org/value
          schema:description:
            description: Guidance text for the parameter, e.g. shown beside a form
              control.
            type: string
            x-jsonld-id: http://schema.org/description
          '@id':
            description: Identifier for this specification, so a recorded value elsewhere
              can reference the parameter it instantiates.
            type: string
        required:
        - '@type'
        - schema:name
      Reference:
        $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.labeledLink
      LinkRole:
        $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.linkRole
      InstrumentComponent:
        type: object
        description: A sub-component of an instrument system. Uses the same structure
          as the parent instrument but without nesting (single level of hasPart).
        properties:
          '@type':
            type: array
            items:
              type: string
            minItems: 1
            contains:
              enum:
              - schema:Thing
          '@id':
            type: string
          schema:name:
            type: string
            minLength: 3
            x-jsonld-id: http://schema.org/name
          schema:description:
            type: string
            x-jsonld-id: http://schema.org/description
          schema:alternateName:
            type: array
            items:
              type: string
            x-jsonld-id: http://schema.org/alternateName
          schema:identifier:
            anyOf:
            - type: string
            - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/Identifier
            x-jsonld-id: http://schema.org/identifier
          schema:additionalType:
            description: Component type classification.
            type: array
            items:
              $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/cdifConceptOrTermOrString
            x-jsonld-id: http://schema.org/additionalType
          schema:additionalProperty:
            type: array
            items:
              anyOf:
              - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/AdditionalProperty
              - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/AdditionalPropertySpecification
            x-jsonld-id: http://schema.org/additionalProperty
          schema:manufacturer:
            x-jsonld-id: http://schema.org/manufacturer
            allOf:
            - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/Organization
          schema:model:
            type: object
            properties:
              '@type':
                type: array
                items:
                  anyOf:
                  - type: string
                  - type: object
                    additionalProperties: false
                    required:
                    - '@id'
                    properties:
                      '@id':
                        type: string
                contains:
                  enum:
                  - schema:ProductModel
                minItems: 1
              schema:name:
                type: string
                x-jsonld-id: http://schema.org/name
              schema:identifier:
                anyOf:
                - type: string
                - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/Identifier
                x-jsonld-id: http://schema.org/identifier
            required:
            - '@type'
            x-jsonld-id: http://schema.org/model
        required:
        - '@type'
        - schema:name
    x-jsonld-prefixes:
      schema: http://schema.org/
      wd: https://www.wikidata.org/entity/
