title: 'TAPP Composition Module: ICPMS'
description: "The shared ICPMS block of the 2026-08-11 TAPP library (Claude Skills
  for TAPP/Module_ICPMS.csv), composed by 9 of the sixteen delivery tables. 42 owned
  fields over 16 schema paths.\n\nGENERATED by tools/build_module_bb.py from the module's
  CSV and its schema-path sidecar \u2014 edit those, not this file. Requiredness follows
  the TAPP tier matrix: a field Basic on a side is required there, Advanced is permitted,
  N/A is absent from that side entirely.\n\nThis is a PROFILE, not a vocabulary: it
  asserts which properties a conforming procedure or analysis carries. Column F (Example
  / Allowed Content) is consumer-owned per the module manifest, so no enum is pinned
  here \u2014 a consuming TAPP may narrow a value space, never widen it."
$defs:
  ProcedureIdentification:
    title: ICPMS on the procedure
    description: 'Composed into a TAPP (prov:Plan) schema: what the procedure asserts
      once, for every analysis that follows it.'
    type: object
    properties:
      ada:uncertaintyLevel:
        description: "The convention at which reported uncertainties are quoted \u2014
          1-sigma, 2-sigma, or a 95% confidence interval \u2014 and whether a measured
          spread is reported as a standard error or a standard deviation. State the
          convention applying to all values reported under this procedure, and state
          each separately where different reported quantities use different conventions.
          Distinct from Uncertainty Propagation Method, which addresses how component
          uncertainties are combined rather than how the result is quoted."
        type: string
        x-jsonld-id: https://ada.astromat.org/metadata/uncertaintyLevel
      schema:variableMeasured:
        type: array
        items:
          type: object
          allOf:
          - if:
              properties:
                schema:name:
                  enum:
                  - Uncertainty Propagation Method
              required:
              - schema:name
            then:
              properties:
                schema:defaultValue:
                  description: 'The approach used to propagate analytical uncertainty
                    through the data reduction chain to the final reported value.
                    State which sources are included in the propagation: counting
                    statistics, calibration standard uncertainty, internal standard
                    uncertainty, drift correction, and any systematic contributions.
                    Distinct from Uncertainty Level, which states the convention at
                    which the resulting uncertainty is quoted.'
                  anyOf:
                  - type: string
                  - type: array
                    items:
                      type: string
                  x-jsonld-id: http://schema.org/defaultValue
          - if:
              properties:
                schema:name:
                  enum:
                  - Limit of Quantification (LOQ) Method
              required:
              - schema:name
            then:
              properties:
                schema:defaultValue:
                  description: 'Reference or description of the method used to calculate
                    the limit of quantification (LOQ): the lowest concentration reliably
                    measurable with acceptable precision and accuracy. Required when
                    concentrations near the LOD are reported.'
                  anyOf:
                  - type: string
                  - type: array
                    items:
                      type: string
                  x-jsonld-id: http://schema.org/defaultValue
        x-jsonld-id: http://schema.org/variableMeasured
      schema:instrument:
        type: array
        items:
          type: object
          allOf:
          - if:
              properties:
                schema:additionalType:
                  contains:
                    enum:
                    - ICPMS
                  schema:inDefinedTermSet: ada:vocab/instrumentType
              required:
              - schema:additionalType
            then:
              properties:
                schema:hasPart:
                  type: array
                  items:
                    type: object
                    allOf:
                    - if:
                        properties:
                          schema:additionalType:
                            contains:
                              enum:
                              - Torch
                            schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                        required:
                        - schema:additionalType
                      then:
                        properties:
                          schema:name:
                            description: Type of plasma torch installed (e.g. standard
                              quartz, high-matrix, low-flow).
                            anyOf:
                            - type: string
                            - type: array
                              items:
                                type: string
                            x-jsonld-id: http://schema.org/name
                  x-jsonld-id: http://schema.org/hasPart
        allOf:
        - contains:
            properties:
              schema:additionalType:
                contains:
                  enum:
                  - ICPMS
                schema:inDefinedTermSet: ada:vocab/instrumentType
            required:
            - schema:additionalType
        x-jsonld-id: http://schema.org/instrument
      ada:calibrationMeasurementFrequency:
        description: How often the primary calibration or bracketing standard is measured
          relative to unknown samples within a session. Specify the bracketing scheme
          where a fixed one is used, such as one standard measurement before and after
          each sample.
        type: string
        x-jsonld-id: https://ada.astromat.org/metadata/calibrationMeasurementFrequency
      ada:oxideProductionMethodAndThreshold:
        description: 'Method used to quantify plasma oxide production and the acceptance
          threshold applied before commencing analysis. Record both the monitored
          mass ratio(s) and the maximum allowed threshold(s). Measured values are
          recorded in Oxide Production. The monitored ratio is procedure-dependent:
          ThO+/Th+ (m/z 248/232), UO+/U+ (254/238), CeO+/Ce+ (156/140) and BaO+/Ba+
          are all in use.'
        type: string
        x-jsonld-id: https://ada.astromat.org/metadata/oxideProductionMethodAndThreshold
      ada:blankBackgroundCorrectionMethod:
        description: Method used to subtract background and, where relevant, procedural
          blank from the measured signal. State what is subtracted - instrument background
          acquired with no sample reaching the plasma, an on-peak zero acquired on
          the same matrix, or a separately measured procedural blank - over what interval
          it is measured, and at what granularity it is applied.
        type: string
        x-jsonld-id: https://ada.astromat.org/metadata/blankBackgroundCorrectionMethod
      ada:internalStandardElement:
        description: Element(s) used as the internal standard, the monitored isotope,
          and how the internal-standard concentration was established for unknowns.
          Where the element serves isotope-ratio work it must have a known isotopic
          composition and a mass close to the target species's. Record 'None' together
          with the alternative used where no internal standard is applied.
        type: string
        x-jsonld-id: https://ada.astromat.org/metadata/internalStandardElement
      ada:signalIntegrationIntervalMethod:
        description: Method used to define which portion of the acquired signal is
          integrated for each reported measurement, and the rule for excluding unstable
          or anomalous portions. State whether the interval is the full acquisition,
          a stable sub-interval selected by inspection, or selected by an automated
          criterion, and name the criterion.
        type: string
        x-jsonld-id: https://ada.astromat.org/metadata/signalIntegrationIntervalMethod
      ada:analysisSequenceDefault:
        description: The repeating order in which calibration or bracketing standards,
          quality-control and secondary reference materials, blanks and unknowns are
          interleaved within a measurement session. Adjustments must maintain the
          bracketing strategy defined in the procedure.
        type: string
        x-jsonld-id: https://ada.astromat.org/metadata/analysisSequenceDefault
    required:
    - ada:analysisSequenceDefault
    - ada:blankBackgroundCorrectionMethod
    - ada:calibrationMeasurementFrequency
    - ada:internalStandardElement
    - ada:oxideProductionMethodAndThreshold
    - ada:signalIntegrationIntervalMethod
    - ada:uncertaintyLevel
  AnalysisIdentification:
    title: ICPMS on the analysis
    description: 'Composed into a technique detail (schema:Dataset) schema: what each
      run supplies fresh, because it cannot be known until the analysis happens.'
    type: object
    properties:
      prov:wasGeneratedBy:
        type: array
        items:
          type: object
          properties:
            prov:used:
              type: array
              items:
                type: object
                allOf:
                - if:
                    required:
                    - schema:instrument
                  then:
                    properties:
                      schema:instrument:
                        type: array
                        items:
                          allOf:
                          - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/modules/icpms/schema-oas3.0.yaml#/x-defs/ogch.BaseSchema.instrument
                          - type: object
                            allOf:
                            - if:
                                properties:
                                  schema:additionalType:
                                    contains:
                                      enum:
                                      - ICPMS
                                    schema:inDefinedTermSet: ada:vocab/instrumentType
                                required:
                                - schema:additionalType
                              then:
                                properties:
                                  schema:identifier:
                                    description: Serial number or laboratory-internal
                                      identifier for the specific instrument unit.
                                    anyOf:
                                    - type: string
                                    - type: array
                                      items:
                                        type: string
                                    x-jsonld-id: http://schema.org/identifier
                        x-jsonld-id: http://schema.org/instrument
              x-jsonld-id: http://www.w3.org/ns/prov#used
        x-jsonld-id: http://www.w3.org/ns/prov#wasGeneratedBy
      ada:sensitivityYield:
        description: "Instrument sensitivity achieved in the session, with the isotope
          or monitored property it was measured on and the conditions it applies to.
          May be expressed either as detected signal per unit concentration or per
          unit mass of target species delivered \u2014 counts per second per ppb,
          volts per ppm, counts per picogram \u2014 or as useful yield, the percentage
          of sampled atoms ultimately detected as ions, with the method used to derive
          it cited. A sensitivity the procedure requires before analyses may begin
          belongs with the tuning acceptance criteria."
        anyOf:
        - type: number
        - type: string
        x-jsonld-id: https://ada.astromat.org/metadata/sensitivityYield
      dqv:hasQualityMeasurement:
        type: array
        items:
          type: object
          allOf:
          - if:
              properties:
                dqv:isMeasurementOf:
                  enum:
                  - Oxide production ratio
              required:
              - dqv:isMeasurementOf
            then:
              properties:
                dqv:value:
                  description: Measured oxide production ratio obtained during session-start
                    tuning, for the proxy specified in Oxide Production Method and
                    Threshold. Record the measured value and confirm whether the procedure
                    threshold was met.
                  anyOf:
                  - type: string
                  - type: array
                    items:
                      type: string
                  x-jsonld-id: http://www.w3.org/ns/dqv#value
              required:
              - dqv:value
        allOf:
        - contains:
            properties:
              dqv:isMeasurementOf:
                enum:
                - Oxide production ratio
            required:
            - dqv:isMeasurementOf
        x-jsonld-id: http://www.w3.org/ns/dqv#hasQualityMeasurement
      schema:variableMeasured:
        type: array
        items:
          type: object
          allOf:
          - if:
              properties:
                schema:name:
                  enum:
                  - Uncertainty Propagation Method
              required:
              - schema:name
            then:
              properties:
                schema:value:
                  description: 'The approach used to propagate analytical uncertainty
                    through the data reduction chain to the final reported value.
                    State which sources are included in the propagation: counting
