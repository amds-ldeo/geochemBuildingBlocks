$schema: https://json-schema.org/draft/2020-12/schema
title: 'TAPP Composition Module: SolutionIntroduction'
description: "The shared SolutionIntroduction block of the 2026-08-11 TAPP library
  (Claude Skills for TAPP/Module_SolutionIntroduction.csv), composed by 3 of the sixteen
  delivery tables. 16 owned fields over 21 schema paths.\n\nGENERATED by tools/build_module_bb.py
  from the module's CSV and its schema-path sidecar \u2014 edit those, not this file.
  Requiredness follows the TAPP tier matrix: a field Basic on a side is required there,
  Advanced is permitted, N/A is absent from that side entirely.\n\nThis is a PROFILE,
  not a vocabulary: it asserts which properties a conforming procedure or analysis
  carries. Column F (Example / Allowed Content) is consumer-owned per the module manifest,
  so no enum is pinned here \u2014 a consuming TAPP may narrow a value space, never
  widen it."
$defs:
  ProcedureIdentification:
    title: SolutionIntroduction fields on the procedure
    description: 'Composed into a TAPP (prov:Plan) schema: what the procedure asserts
      once, for every analysis that follows it.'
    type: object
    properties:
      schema:object:
        type: array
        items:
          type: object
          allOf:
          - if:
              properties:
                '@type':
                  contains:
                    const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
              required:
              - '@type'
            then:
              properties:
                schema:additionalProperty:
                  type: array
                  items:
                    type: object
                    allOf:
                    - if:
                        properties:
                          schema:name:
                            const: Sample Aliquot Mass or Volume
                        required:
                        - schema:name
                      then:
                        properties:
                          schema:defaultValue:
                            description: Mass (mg) of solid material digested or volume
                              (mL) of liquid taken for dissolution. Used for yield
                              calculations and concentration back-calculation.
                            anyOf:
                            - type: number
                            - type: string
                            x-jsonld-id: http://schema.org/defaultValue
                  x-jsonld-id: http://schema.org/additionalProperty
        x-jsonld-id: http://schema.org/object
      schema:actionProcess:
        type: object
        properties:
          schema:step:
            type: array
            items:
              type: object
              allOf:
              - if:
                  properties:
                    schema:name:
                      const: sampleDigestion
                  required:
                  - schema:name
                then:
                  properties:
                    schema:additionalProperty:
                      type: array
                      items:
                        type: object
                        allOf:
                        - if:
                            properties:
                              schema:name:
                                const: Number of Digestion Steps
                            required:
                            - schema:name
                          then:
                            properties:
                              schema:value:
                                description: "Total number of distinct acid digestion
                                  steps required to dissolve the sample. Some procedures
                                  require multiple sequential steps \u2014 for example,
                                  an initial open-beaker HF\u2013HNO3 dissolution
                                  followed by a second closed-vessel step for residues
                                  retaining refractory minerals, or by an aqua regia
                                  reflux to destroy fluoride complexes."
                                anyOf:
                                - type: integer
                                - type: string
                                x-jsonld-id: http://schema.org/value
                        - if:
                            properties:
                              schema:name:
                                const: Digestion Vessel Type
                            required:
                            - schema:name
                          then:
                            properties:
                              schema:value:
                                description: Type of vessel used for acid digestion.
                                  Vessel type constrains maximum temperature and pressure
                                  and determines suitability for refractory mineral
                                  dissolution (e.g., Parr bombs required for complete
                                  silicate digestion at high temperatures).
                                anyOf:
                                - type: string
                                - type: array
                                  items:
                                    type: string
                                x-jsonld-id: http://schema.org/value
                        - if:
                            properties:
                              schema:name:
                                const: Digestion Temperature
                            required:
                            - schema:name
                          then:
                            properties:
                              schema:defaultValue:
                                description: "Temperature at which acid digestion
                                  was carried out (\xB0C). Procedure specifies the
                                  target temperature."
                                anyOf:
                                - type: number
                                - type: string
                                x-jsonld-id: http://schema.org/defaultValue
                        - if:
                            properties:
                              schema:name:
                                const: Digestion Duration
                            required:
                            - schema:name
                          then:
                            properties:
                              schema:defaultValue:
                                description: Duration of the primary acid digestion
                                  step (hours or days).
                                anyOf:
                                - type: string
                                - type: array
                                  items:
                                    type: string
                                x-jsonld-id: http://schema.org/defaultValue
                      allOf:
                      - contains:
                          properties:
                            schema:name:
                              const: Number of Digestion Steps
                          required:
                          - schema:name
                      - contains:
                          properties:
                            schema:name:
                              const: Digestion Vessel Type
                          required:
                          - schema:name
                      - contains:
                          properties:
                            schema:name:
                              const: Digestion Temperature
                          required:
                          - schema:name
                      - contains:
                          properties:
                            schema:name:
                              const: Digestion Duration
                          required:
                          - schema:name
                      x-jsonld-id: http://schema.org/additionalProperty
                    bios:reagent:
                      type: array
                      items:
                        type: object
                        properties:
                          schema:name:
                            description: "Acid mixture used for sample dissolution.
                              Record acid type(s) and concentration(s) where known
                              (e.g., concentrated HF\u2013HNO3 in Parr bombs is standard
                              for silicate dissolution). For isotope-ratio work, complete
                              matrix dissolution is required to avoid isotopic fractionation
                              during partial dissolution."
                            type: string
                            x-jsonld-id: http://schema.org/name
                      x-jsonld-id: https://bioschemas.org/reagent
            allOf:
            - contains:
                properties:
                  schema:name:
                    const: sampleDigestion
                required:
                - schema:name
            x-jsonld-id: http://schema.org/step
        x-jsonld-id: http://schema.org/actionProcess
      ada:chromatographicSeparationApplied:
        description: "Whether chromatographic separation of element groups (e.g.,
          using ion exchange resin) was performed prior to analysis. Separation may
          be required to remove matrix elements that cause variable mass bias, to
          eliminate isobaric interferences, or to isolate an element group before
          measurement (e.g., Fe and Cu\u2013Zn for isotope dilution, Hf separation
          from REE, removal of Cr and Ni from Fe fractions). It is usually mandatory
          for isotope-ratio procedures and optional for concentration measurement.
          Record resin type and elution matrix conditions if applied. Record 'None'
          if the direct digestion solution is analyzed."
        type: string
        x-jsonld-id: https://ada.astromat.org/metadata/chromatographicSeparationApplied
      ada:isotopeDilutionSpike:
        description: Isotopic spike material added to the sample before or during
          digestion for isotope dilution (ID) analysis or double-spike mass bias correction.
          For double-spike procedures, the spike must be added and equilibrated before
          digestion to correct for any isotopic fractionation during dissolution and
          column chemistry. For concentration ID, the spike must be added before digestion
          for complete equilibration. Record spike name or certificate reference,
          spike isotopes, and whether added pre- or post-digestion. Record 'None'
          if ID or double-spike technique is not used.
        type: string
        x-jsonld-id: https://ada.astromat.org/metadata/isotopeDilutionSpike
      ada:finalSolutionMatrix:
        description: Acid type and concentration of the final dissolved sample solution
          introduced to the instrument. Directly affects instrument response and ion
          transmission. For isotope-ratio procedures, acid molarity must be precisely
          matched between samples and bracketing standards to avoid matrix-induced
          mass bias offsets. Procedures targeting HFSE may add trace HF to the final
          solution to keep those elements in solution.
        type: string
        x-jsonld-id: https://ada.astromat.org/metadata/finalSolutionMatrix
      schema:instrument:
        type: array
        items:
          type: object
          allOf:
          - if:
              properties:
                schema:additionalType:
                  contains:
                    const: ICPMS
              required:
              - schema:additionalType
            then:
              properties:
                schema:hasPart:
                  type: array
                  items:
                    type: object
                    allOf:
                    - if:
                        properties:
                          schema:additionalType:
                            contains:
                              const: Sample Introduction System
                        required:
                        - schema:additionalType
                      then:
                        properties:
                          schema:additionalProperty:
                            type: array
                            items:
                              type: object
                              allOf:
                              - if:
                                  properties:
                                    schema:name:
                                      const: Nebulizer Type
                                  required:
                                  - schema:name
                                then:
                                  properties:
                                    schema:value:
                                      description: Type and material of the pneumatic
                                        nebulizer used for sample introduction. Affects
                                        droplet size distribution and sample introduction
                                        efficiency.
                                      anyOf:
                                      - type: string
                                      - type: array
                                        items:
                                          type: string
                                      x-jsonld-id: http://schema.org/value
                              - if:
                                  properties:
                                    schema:name:
                                      const: Spray Chamber Type and Cooling Temperature
                                  required:
                                  - schema:name
                                then:
                                  properties:
                                    schema:value:
                                      description: "Type of spray chamber and cooling
                                        temperature if thermostatted (\xB0C). Chamber
                                        type and temperature control aerosol droplet
                                        size and the solvent vapor load reaching the
                                        plasma. In some procedures a spray chamber
                                        is placed downstream of a desolvating nebulizer
                                        to improve signal stability."
                                      anyOf:
                                      - type: string
                                      - type: array
                                        items:
                                          type: string
                                      x-jsonld-id: http://schema.org/value
                              - if:
                                  properties:
                                    schema:name:
                                      const: Sample Uptake Rate
                                  required:
                                  - schema:name
                                then:
                                  properties:
                                    schema:defaultValue:
                                      description: "Peristaltic pump speed or self-aspiration
                                        flow rate for sample introduction (\xB5L/min
                                        or mL/min)."
                                      anyOf:
                                      - type: number
                                      - type: string
                                      x-jsonld-id: http://schema.org/defaultValue
                              - if:
                                  properties:
                                    schema:name:
                                      const: Nebulizer Gas Flow Rate
                                  required:
                                  - schema:name
                                then:
                                  properties:
                                    schema:defaultValue:
                                      description: Flow rate of the carrier argon
                                        gas delivered through the nebulizer (L/min).
                                        Controls aerosol transport and strongly influences
                                        signal sensitivity and stability. Adjusted
                                        daily to optimize signal.
                                      anyOf:
                                      - type: number
                                      - type: string
                                      x-jsonld-id: http://schema.org/defaultValue
                            allOf:
                            - contains:
                                properties:
                                  schema:name:
                                    const: Nebulizer Type
                                required:
                                - schema:name
                            - contains:
                                properties:
                                  schema:name:
                                    const: Spray Chamber Type and Cooling Temperature
                                required:
                                - schema:name
                            - contains:
                                properties:
                                  schema:name:
                                    const: Sample Uptake Rate
                                required:
                                - schema:name
                            - contains:
                                properties:
                                  schema:name:
                                    const: Nebulizer Gas Flow Rate
                                required:
                                - schema:name
                            x-jsonld-id: http://schema.org/additionalProperty
                  allOf:
                  - contains:
                      properties:
                        schema:additionalType:
                          contains:
                            const: Sample Introduction System
                      required:
                      - schema:additionalType
                  x-jsonld-id: http://schema.org/hasPart
        allOf:
        - contains:
            properties:
              schema:additionalType:
                contains:
                  const: ICPMS
            required:
            - schema:additionalType
        x-jsonld-id: http://schema.org/instrument
      schema:additionalProperty:
        type: array
        items:
          type: object
          allOf:
          - if:
              properties:
                schema:name:
                  const: Desolvation System
              required:
              - schema:name
            then:
              properties:
                schema:value:
                  description: 'Desolvating nebulizer or membrane desolvator used
                    upstream of the plasma to reduce solvent load. Lowers oxide production
                    rates and increases sensitivity, and is commonly used for low-abundance
                    analytes or small sample sizes. Note the trade-off: desolvation
                    can introduce additional instrumental mass bias instability relative
                    to wet plasma introduction. Record ''None'' if not used.'
                  anyOf:
                  - type: string
                  - type: array
                    items:
                      type: string
                  x-jsonld-id: http://schema.org/value
          - if:
              properties:
                schema:name:
                  const: Internal Standard Concentration
              required:
              - schema:name
            then:
              properties:
                schema:value:
                  description: "Target concentration of internal standard element(s)
                    in all measured solutions (\xB5g/L or ppb). Record 'N/A' where
                    Internal Standard Element is 'None'."
                  anyOf:
                  - type: number
                  - type: string
                  x-jsonld-id: http://schema.org/value
        x-jsonld-id: http://schema.org/additionalProperty
      ada:washTimeBetweenSamples:
        description: Duration of instrument rinse between successive sample solutions
          (seconds). Controls carryover and memory effects. For isotope-ratio work,
          complete washout is critical to prevent cross-contamination between samples
          with differing isotopic compositions.
        anyOf:
        - type: number
        - type: string
        x-jsonld-id: https://ada.astromat.org/metadata/washTimeBetweenSamples
    required:
    - ada:chromatographicSeparationApplied
    - ada:finalSolutionMatrix
    - ada:isotopeDilutionSpike
    - ada:washTimeBetweenSamples
  AnalysisIdentification:
    title: SolutionIntroduction fields on the analysis
    description: 'Composed into a technique detail (schema:Dataset) schema: what each
      run supplies fresh, because it cannot be known until the analysis happens.'
    type: object
    properties:
      prov:wasGeneratedBy:
        type: array
        items:
          type: object
          properties:
            schema:object:
              type: array
              items:
                type: object
                allOf:
                - if:
                    properties:
                      '@type':
                        contains:
                          const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                    required:
                    - '@type'
                  then:
                    properties:
                      schema:additionalProperty:
                        type: array
                        items:
                          type: object
                          allOf:
                          - if:
                              properties:
                                schema:name:
                                  const: Sample Aliquot Mass or Volume
                              required:
                              - schema:name
                            then:
                              properties:
                                schema:value:
                                  description: Mass (mg) of solid material digested
                                    or volume (mL) of liquid taken for dissolution.
                                    Used for yield calculations and concentration
                                    back-calculation.
                                  anyOf:
                                  - type: number
                                  - type: string
                                  x-jsonld-id: http://schema.org/value
                        x-jsonld-id: http://schema.org/additionalProperty
              x-jsonld-id: http://schema.org/object
            schema:actionProcess:
              type: object
              properties:
                schema:step:
                  type: array
                  items:
                    type: object
                    allOf:
                    - if:
                        properties:
                          schema:name:
                            const: sampleDigestion
                        required:
                        - schema:name
                      then:
                        properties:
                          schema:additionalProperty:
                            type: array
                            items:
                              type: object
                              allOf:
                              - if:
                                  properties:
                                    schema:name:
                                      const: Digestion Temperature
                                  required:
                                  - schema:name
                                then:
                                  properties:
                                    schema:value:
                                      description: "Temperature at which acid digestion
                                        was carried out (\xB0C). Procedure specifies
                                        the target temperature."
                                      anyOf:
                                      - type: number
                                      - type: string
                                      x-jsonld-id: http://schema.org/value
                              - if:
                                  properties:
                                    schema:name:
                                      const: Digestion Duration
                                  required:
                                  - schema:name
                                then:
                                  properties:
                                    schema:value:
                                      description: Duration of the primary acid digestion
                                        step (hours or days).
                                      anyOf:
                                      - type: string
                                      - type: array
                                        items:
                                          type: string
                                      x-jsonld-id: http://schema.org/value
                            x-jsonld-id: http://schema.org/additionalProperty
                  x-jsonld-id: http://schema.org/step
              x-jsonld-id: http://schema.org/actionProcess
            prov:used:
              type: array
              items:
                type: object
                allOf:
                - if:
                    properties:
                      schema:additionalType:
                        contains:
                          const: ICPMS
                    required:
                    - schema:additionalType
                  then:
                    properties:
                      schema:hasPart:
                        type: array
                        items:
                          type: object
                          allOf:
                          - if:
                              properties:
                                schema:additionalType:
                                  contains:
                                    const: Sample Introduction System
                              required:
                              - schema:additionalType
                            then:
                              properties:
                                schema:additionalProperty:
                                  type: array
                                  items:
                                    type: object
                                    allOf:
                                    - if:
                                        properties:
                                          schema:name:
                                            const: Sample Uptake Rate
                                        required:
                                        - schema:name
                                      then:
                                        properties:
                                          schema:value:
                                            description: "Peristaltic pump speed or
                                              self-aspiration flow rate for sample
                                              introduction (\xB5L/min or mL/min)."
                                            anyOf:
                                            - type: number
                                            - type: string
                                            x-jsonld-id: http://schema.org/value
                                    - if:
                                        properties:
                                          schema:name:
                                            const: Nebulizer Gas Flow Rate
                                        required:
                                        - schema:name
                                      then:
                                        properties:
                                          schema:value:
                                            description: Flow rate of the carrier
                                              argon gas delivered through the nebulizer
                                              (L/min). Controls aerosol transport
                                              and strongly influences signal sensitivity
                                              and stability. Adjusted daily to optimize
                                              signal.
                                            anyOf:
                                            - type: number
                                            - type: string
                                            x-jsonld-id: http://schema.org/value
                                  x-jsonld-id: http://schema.org/additionalProperty
                        x-jsonld-id: http://schema.org/hasPart
              x-jsonld-id: http://www.w3.org/ns/prov#used
        x-jsonld-id: http://www.w3.org/ns/prov#wasGeneratedBy
x-jsonld-prefixes:
  ada: https://ada.astromat.org/metadata/
  bios: https://bioschemas.org/
  prov: http://www.w3.org/ns/prov#
  schema: http://schema.org/
