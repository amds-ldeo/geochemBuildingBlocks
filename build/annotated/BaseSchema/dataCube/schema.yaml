$schema: https://json-schema.org/draft/2020-12/schema
title: Data Cube Type
description: Multi-dimensional data cube structure using DDI-CDI. Typed as ada:dataCube
  and cdi:StructuredDataSet per CDIF 2026 alignment.
allOf:
- type: object
  properties:
    '@type':
      type: array
      items:
        type: string
      minItems: 2
      allOf:
      - contains:
          const: ada:dataCube
      - contains:
          const: cdi:StructuredDataSet
    ada:componentType:
      type: string
      enum:
      - ada:FTICRMSCube
      - ada:GCMSCube
      - ada:L2MSCube
      - ada:LCMSRawData
      - ada:STEMEDSCube
      - ada:STEMEDSTomo
      - ada:STEMEELSCube
      - ada:analysisLocation
      - ada:annotatedImage
      - ada:areaOfInterest
      - ada:basemap
      - ada:calibrationFile
      - ada:code
      - ada:contextPhotography
      - ada:contextVideo
      - ada:inputFile
      - ada:instrumentMetadata
      - ada:logFile
      - ada:methodDescription
      - ada:other
      - ada:plot
      - ada:processingMethod
      - ada:quickLook
      - ada:report
      - ada:samplePreparation
      - ada:shapefile
      - ada:supplementalBasemap
      - ada:supplementaryImage
      - ada:worldFile
      - nil:missing
      description: ADA componentType for a data cube, as a single string. Allowed
        values are constrained at the technique-profile level.
      x-jsonld-id: https://ada.astromat.org/metadata/componentType
    ada:dataComponentResource:
      type: string
      x-jsonld-id: https://ada.astromat.org/metadata/dataComponentResource
- $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/cdifDataType/cdifDataCube/schema.yaml
x-jsonld-prefixes:
  schema: http://schema.org/
  ada: https://ada.astromat.org/metadata/
  cdi: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/
