$schema: https://json-schema.org/draft/2020-12/schema
title: Image Map Type
description: Spatially registered image maps with pixel coordinates, component type
  classification, and spatial registration metadata.
type: object
properties:
  '@type':
    type: array
    items:
      type: string
    minItems: 2
    allOf:
    - contains:
        const: ada:imageMap
    - contains:
        const: schema:ImageObject
  ada:acquisitionTime:
    type: string
    x-jsonld-id: https://ada.astromat.org/metadata/acquisitionTime
  ada:componentType:
    type: string
    enum:
    - ada:EMPAImageMap
    - ada:NanoIRMap
    - ada:SEMEBSDGrainImageMap
    - ada:SEMEDSElementalMap
    - ada:SEMHRCLMap
    - ada:SEMImageMap
    - ada:SLSTextureMap
    - ada:basemap
    - ada:supplementalBasemap
    - ada:analysisLocation
    - ada:annotatedImage
    - ada:areaOfInterest
    - ada:calibrationFile
    - ada:code
    - ada:contextPhotography
    - ada:contextVideo
    - ada:inputFile
    - ada:instrumentMetadata
    - ada:logFile
    - ada:methodDescription
    - ada:other
    - ada:plot
    - ada:processingMethod
    - ada:quickLook
    - ada:report
    - ada:samplePreparation
    - ada:shapefile
    - ada:supplementaryImage
    - ada:worldFile
    - nil:missing
    description: ADA componentType for an imageMap, as a single string. Allowed values
      are constrained at the technique-profile level.
    x-jsonld-id: https://ada.astromat.org/metadata/componentType
  ada:channel1:
    type: string
    x-jsonld-id: https://ada.astromat.org/metadata/channel1
  ada:channel2:
    type: string
    x-jsonld-id: https://ada.astromat.org/metadata/channel2
  ada:channel3:
    type: string
    x-jsonld-id: https://ada.astromat.org/metadata/channel3
  ada:illuminationType:
    type: string
    description: Type of illumination used to create the image.
    x-jsonld-id: https://ada.astromat.org/metadata/illuminationType
  ada:imageType:
    type: string
    description: Specifies the nature of the sample's response to the illumination.
    x-jsonld-id: https://ada.astromat.org/metadata/imageType
  ada:numPixelsX:
    type: integer
    x-jsonld-id: https://ada.astromat.org/metadata/numPixelsX
  ada:numPixelsY:
    type: integer
    x-jsonld-id: https://ada.astromat.org/metadata/numPixelsY
  ada:spatialRegistration:
    $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/BaseSchema/spatialRegistration/schema.yaml
    x-jsonld-id: https://ada.astromat.org/metadata/spatialRegistration
required:
- '@type'
- ada:componentType
x-jsonld-prefixes:
  schema: http://schema.org/
  ada: https://ada.astromat.org/metadata/
