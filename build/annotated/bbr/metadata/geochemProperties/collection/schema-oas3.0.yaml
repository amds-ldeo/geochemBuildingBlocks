x-defs:
  ada.bbr.metadata.geochemProperties.stringArray:
    title: String Array Type
    description: Simple reusable array of strings
    type: array
    minItems: 0
    items:
      type: string
    x-schema-source: https://usgin.github.io/geochemBuildingBlocks/build/annotated/bbr/metadata/geochemProperties/stringArray/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
title: Collection Type
description: A collection can be a set of files with identical information model and
  serialization/formatting, or a heterogeneous set of files that together constitute
  a dataset (a composite dataset).
type: object
properties:
  '@type':
    type: array
    items:
      type: string
    minItems: 2
    allOf:
    - contains:
        enum:
        - ada:collection
    - contains:
        enum:
        - https://schema.org/Collection
    description: GeneralType for collections
  ada:componentType:
    type: string
    enum:
    - ada:EAIRMSCollection
    - ada:EMPAImageCollection
    - ada:GCMSCollection
    - ada:LCMSCollection
    - ada:NanoSIMSCollection
    - ada:PSFDShapeFile
    - ada:QRISCalibratedCollection
    - ada:SEMImageCollection
    - ada:TOFSIMSCollection
    - ada:XCTImageCollection
    - ada:shapefile
    description: ADA componentType for a collection, as a single string. Allowed values
      are constrained by the technique profile (via its hasPart anyOf), which either
      lists universal componentTypes inline or $refs a detail schema enumerating technique-specific
      collection componentTypes.
  ada:memberTypes:
    description: List of the component types in the collection
    allOf:
    - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/bbr/metadata/geochemProperties/collection/schema-oas3.0.yaml#/x-defs/ada.bbr.metadata.geochemProperties.stringArray
  ada:nFiles:
    type: integer
    description: Number of files in the collection, including metadata files
  ada:filelist:
    type: array
    items:
      type: object
      properties:
        ada:fileName:
          type: string
          description: Full path to file in container object
        ada:fileNamePattern:
          type: string
          description: Pattern for collection members with differentiating suffix
            at '*'
        ada:componentType:
          type: string
          description: componentType of an individual file within the collection.
            Not constrained to the collection-level enum, since a collection holds
            heterogeneous files (each carrying its own file-type componentType).
        schema:encodingFormat:
          type: string
          description: MIME type with extension
      oneOf:
      - required:
        - ada:fileName
      - required:
        - ada:fileNamePattern
x-jsonld-prefixes:
  schema: http://schema.org/
  ada: https://ada.astromat.org/metadata/
x-schema-version: https://json-schema.org/draft/2020-12/schema
