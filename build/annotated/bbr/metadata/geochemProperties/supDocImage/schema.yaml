$schema: https://json-schema.org/draft/2020-12/schema
title: Supplemental Document Image Type
description: Supplemental document images including analysis location images, annotated
  products, context photography, and other supplemental visual materials.
type: object
properties:
  '@type':
    type: array
    items:
      type: string
    minItems: 2
    allOf:
    - contains:
        const: ada:image
    - contains:
        const: schema:DigitalDocument
    description: GeneralType for supplemental document images
  ada:componentType:
    type: string
    enum:
    - ada:analysisLocation
    - ada:annotatedImage
    - ada:areaOfInterest
    - ada:contextPhotography
    - ada:quickLook
    - ada:supplementaryImage
    description: ADA componentType for this file type, as a single string. Allowed
      values are derived from the ADA Components mapping.
  ada:numPixelsX:
    type: integer
  ada:numPixelsY:
    type: integer
  schema:isBasedOn:
    type: string
    description: Original file name before PDS4-compliant renaming
required:
- '@type'
- ada:componentType
x-jsonld-prefixes:
  schema: http://schema.org/
  ada: https://ada.astromat.org/metadata/
