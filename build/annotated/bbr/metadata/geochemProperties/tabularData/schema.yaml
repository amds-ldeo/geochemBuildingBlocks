$schema: https://json-schema.org/draft/2020-12/schema
title: Tabular Data Type
description: Tabular data type aligned with CDIF 2026 schema using DDI-CDI and CSVW
  properties. Typed as cdi:TabularTextDataSet and ada:tabularData.
allOf:
- type: object
  properties:
    '@type':
      type: array
      items:
        type: string
      minItems: 2
      allOf:
      - contains:
          const: cdi:TabularTextDataSet
      - contains:
          const: ada:tabularData
    ada:componentType:
      type: string
      enum:
      - ada:AMSProcessedData
      - ada:AMSRawData
      - ada:ARGTCaptionData
      - ada:ARGTRawData
      - ada:ARGTSummaryData
      - ada:DSCHeatFlow
      - ada:DSCIndividualMeasurements
      - ada:DSCProcessedHeatFlux
      - ada:DSCRawHeatFlux
      - ada:DSCResultsTabular
      - ada:EAIRMSProcessedData
      - ada:EAIRMSRawData
      - ada:EMPAESPCTabular
      - ada:EMPAQEATabular
      - ada:FTICRMSTabular
      - ada:GPYCProcessedTabular
      - ada:GPYCRawTabular
      - ada:HRICPMSProcessed
      - ada:HRICPMSRaw
      - ada:ICPOESIntermediateTabular
      - ada:ICPOESProcessedTabular
      - ada:ICPOESRawTabular
      - ada:ICTabular
      - ada:LAFProcessed
      - ada:LAFRaw
      - ada:LITPolarPlotData
      - ada:LITTabularData
      - ada:MCICPMSTabular
      - ada:NGNSMSProcessed
      - ada:NGNSMSRaw
      - ada:NanoIRPointData
      - ada:NanoSIMSRaw
      - ada:NanoSIMSTabular
      - ada:PSFDTabular
      - ada:QICPMSProcessedTabular
      - ada:QICPMSRawTabular
      - ada:RAMANRawTabular
      - ada:RITOFNGMSSpectra
      - ada:RITOFNGMSTabular
      - ada:SEMEDSPointData
      - ada:SEMEDSPointSpectraData
      - ada:SIMSTabular
      - ada:STEMEDSTabular
      - ada:STEMEELSTabular
      - ada:SVRUECTabular
      - ada:SVRUECWaveformData
      - ada:TOFSIMSMassSpectrumData
      - ada:VNMIRSpectralPoint
      - ada:XRDTabular
      description: ADA componentType for a tabular data file, as a single string.
        Allowed values are constrained by the technique profile (via its hasPart anyOf),
        which either lists universal componentTypes inline or $refs a detail schema
        enumerating technique-specific tabular componentTypes.
    ada:xCoordCol:
      description: The column names are redundant, they are lists in the hasPhysicalMapping
        array. Include here for convenience.
      type: string
    ada:yCoordCol:
      type: string
    ada:zCoordCol:
      type: string
    ada:coordUnits:
      type: string
    ada:spatialRegistration:
      $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/bbr/metadata/geochemProperties/spatialRegistration/schema.yaml
  required:
  - '@type'
  - ada:componentType
- $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/cdifProperties/cdifTabularData/schema.yaml
x-jsonld-prefixes:
  schema: http://schema.org/
  ada: https://ada.astromat.org/metadata/
  cdi: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/
