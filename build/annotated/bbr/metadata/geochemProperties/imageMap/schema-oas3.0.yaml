x-defs:
  ada.bbr.metadata.geochemProperties.spatialRegistration:
    title: Spatial Registration Type
    description: Defines pixel coordinate system registration including origin coordinates,
      pixel scales, and coordinate definition type for spatially registered images
      and maps.
    type: object
    properties:
      ada:basemap:
        type: string
        description: link to appropriate basemap image map
      ada:originX:
        type: number
      ada:originY:
        type: number
      ada:originZ:
        type: number
      ada:coordDef:
        type: string
        description: Whether coordinates are stage-defined or pixel-defined. If pixel-defined,
          are coordinates from stage, upperleftPixel, or centerPixel.
      ada:coordUnits:
        type: string
      ada:pixelUnits:
        type: string
      ada:pixelScaleX:
        type: number
      ada:pixelScaleY:
        type: number
      ada:originLocation:
        type: string
        description: 'The location of the origin pixel of an image. Range: upperLeft,
          upperRight, lowerLeft, lowerRight, center'
    required:
    - ada:originX
    - ada:originY
    - ada:pixelScaleX
    - ada:pixelScaleY
    - ada:pixelUnits
    - ada:originLocation
    - ada:coordDef
    x-jsonld-prefixes:
      ada: https://ada.astromat.org/metadata/
    x-schema-source: https://usgin.github.io/geochemBuildingBlocks/build/annotated/bbr/metadata/geochemProperties/spatialRegistration/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
title: Image Map Type
description: Spatially registered image maps with pixel coordinates, component type
  classification, and spatial registration metadata.
type: object
properties:
  '@type':
    type: array
    items:
      type: string
    minItems: 2
    allOf:
    - contains:
        enum:
        - ada:imageMap
    - contains:
        enum:
        - schema:ImageObject
  ada:acquisitionTime:
    type: string
  ada:componentType:
    type: string
    enum:
    - ada:EMPAImageMap
    - ada:NanoIRMap
    - ada:SEMEBSDGrainImageMap
    - ada:SEMEDSElementalMap
    - ada:SEMHRCLMap
    - ada:SEMImageMap
    - ada:SLSTextureMap
    - ada:basemap
    - ada:supplementalBasemap
    description: ADA componentType for an imageMap, as a single string. Allowed values
      are constrained by the technique profile (via its hasPart anyOf), which either
      lists universal componentTypes inline or $refs a detail schema enumerating technique-specific
      imageMap componentTypes.
  ada:channel1:
    type: string
  ada:channel2:
    type: string
  ada:channel3:
    type: string
  ada:illuminationType:
    type: string
    description: Type of illumination used to create the image.
  ada:imageType:
    type: string
    description: Specifies the nature of the sample's response to the illumination.
  ada:numPixelsX:
    type: integer
  ada:numPixelsY:
    type: integer
  ada:spatialRegistration:
    $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/bbr/metadata/geochemProperties/imageMap/schema-oas3.0.yaml#/x-defs/ada.bbr.metadata.geochemProperties.spatialRegistration
required:
- '@type'
- ada:componentType
x-jsonld-prefixes:
  schema: http://schema.org/
  ada: https://ada.astromat.org/metadata/
x-schema-version: https://json-schema.org/draft/2020-12/schema
