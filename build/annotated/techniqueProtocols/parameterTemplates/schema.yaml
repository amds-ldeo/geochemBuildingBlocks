$schema: https://json-schema.org/draft/2020-12/schema
title: ADA Method-Parameter Template Registry
description: Registry of reusable schema:PropertyValueSpecification method-parameter
  templates derived from technique TAPP spreadsheets. Each $def constrains one method-level
  (readOnly:true) parameter template (e.g. DriftCorrection, massAbsorptionCoefficients).
  TAPP building blocks reference these definitions via fragment $refs (schema.yaml#/$defs/<name>)
  so they resolve locally through the building-block register. The root only hosts
  $defs; it has no instantiable properties of its own.
type: object
$defs:
  BeamDamageMinimization:
    title: Beam Damage Minimization
    description: Description of the approach used to minimize beam damage, especially
      Na- and K-loss in glasses, micas, and hydrous minerals.
    type: object
    properties:
      '@context':
        const:
          schema: http://schema.org/
          ada: https://ada.astromat.org/metadata/
      '@id':
        const: ada:parameter/empaTAPP/BeamDamageMinimization
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: BeamDamageMinimization
      schema:name:
        const: Beam Damage Minimization
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: true
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  DriftCorrection:
    title: Drift Correction
    description: Describe method used to monitor and correct for instrument drift
    type: object
    properties:
      '@context':
        const:
          schema: http://schema.org/
          ada: https://ada.astromat.org/metadata/
      '@id':
        const: ada:parameter/empaTAPP/DriftCorrection
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: DriftCorrection
      schema:name:
        const: Drift Correction
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: true
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  massAbsorptionCoefficients:
    title: Mass Absorption Coefficients (MACs)
    description: Database of mass absorption coefficients used in the matrix correction.
    type: object
    properties:
      '@context':
        const:
          schema: http://schema.org/
          ada: https://ada.astromat.org/metadata/
      '@id':
        const: ada:parameter/empaTAPP/massAbsorptionCoefficients
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: massAbsorptionCoefficients
      schema:name:
        const: Mass Absorption Coefficients (MACs)
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: true
      ada:tier:
        const: R
      schema:inDefinedTermSet:
        const:
          '@id': ada:vocab/empaTAPP/massAbsorptionCoefficients
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  halogenOxygenCorrection:
    title: Halogen Correction on Oxygen
    description: Whether a halogen correction was applied to calculate oxygen content
      by stoichiometry in halogen-bearing phases.
    type: object
    properties:
      '@context':
        const:
          schema: http://schema.org/
          ada: https://ada.astromat.org/metadata/
      '@id':
        const: ada:parameter/empaTAPP/halogenOxygenCorrection
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: halogenOxygenCorrection
      schema:name:
        const: Halogen Correction on Oxygen
      ada:dataType:
        const: boolean
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: true
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  wdsDeadTimeCorrection:
    title: WDS Dead Time Correction
    description: Method used to correct WDS proportional counter dead time at high
      count rates.
    type: object
    properties:
      '@context':
        const:
          schema: http://schema.org/
          ada: https://ada.astromat.org/metadata/
      '@id':
        const: ada:parameter/empaTAPP/wdsDeadTimeCorrection
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: wdsDeadTimeCorrection
      schema:name:
        const: WDS Dead Time Correction
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: true
      ada:tier:
        const: R
      schema:inDefinedTermSet:
        const:
          '@id': ada:vocab/empaTAPP/wdsDeadTimeCorrection
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  edsSpectralProcessingType:
    title: EDS Spectral Processing Type
    description: Method used to process EDS spectra and extract net peak intensities.
    type: object
    properties:
      '@context':
        const:
          schema: http://schema.org/
          ada: https://ada.astromat.org/metadata/
      '@id':
        const: ada:parameter/empaTAPP/edsSpectralProcessingType
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: edsSpectralProcessingType
      schema:name:
        const: EDS Spectral Processing Type
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: true
      ada:tier:
        const: R
      schema:inDefinedTermSet:
        const:
          '@id': ada:vocab/empaTAPP/edsSpectralProcessingType
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  LaserPulseDuration:
    title: Laser Pulse Duration
    description: 'Duration of each individual laser pulse, including units. Pulse
      duration determines the ablation regime: nanosecond (ns) pulses involve significant
      thermal effects and elemental fractionation; femtosecond (fs) pulses are non-thermal
      and substantially reduce elemental fractionation and matrix effects. This is
      a fixed hardware property of the laser system.'
    type: object
    properties:
      '@context':
        const:
          schema: http://schema.org/
          ada: https://ada.astromat.org/metadata/
      '@id':
        const: ada:parameter/laicpmsTAPP/LaserPulseDuration
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: LaserPulseDuration
      schema:name:
        const: Laser Pulse Duration
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: true
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  WarmUpTime:
    title: Instrument Warm-up / Session Duration Limit
    description: Minimum warm-up time required after plasma ignition before analyses
      begin, and any maximum session duration enforced to maintain stable operating
      conditions. These constraints are part of the protocol and cannot be varied
      by the analyst.
    type: object
    properties:
      '@context':
        const:
          schema: http://schema.org/
          ada: https://ada.astromat.org/metadata/
      '@id':
        const: ada:parameter/laicpmsTAPP/WarmUpTime
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: WarmUpTime
      schema:name:
        const: Instrument Warm-up / Session Duration Limit
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: true
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  SessionDurationLimit:
    title: Instrument Warm-up / Session Duration Limit
    description: Minimum warm-up time required after plasma ignition before analyses
      begin, and any maximum session duration enforced to maintain stable operating
      conditions. These constraints are part of the protocol and cannot be varied
      by the analyst.
    type: object
    properties:
      '@context':
        const:
          schema: http://schema.org/
          ada: https://ada.astromat.org/metadata/
      '@id':
        const: ada:parameter/laicpmsTAPP/SessionDurationLimit
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: SessionDurationLimit
      schema:name:
        const: Instrument Warm-up / Session Duration Limit
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: true
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  DriftMonitorFrequency:
    title: Multi-Run Sequential Analysis Design
    description: Whether the protocol uses a single acquisition pass or multiple sequential
      runs on the same sample location, each optimized for different analytical objectives.
      For multi-run designs, describe the number of runs, their purpose, key laser
      and instrument settings per run, and how outputs of one run feed into data reduction
      of another. Not applicable to raster mapping, where each spatial location is
      visited exactly once.
    type: object
    properties:
      '@context':
        const:
          schema: http://schema.org/
          ada: https://ada.astromat.org/metadata/
      '@id':
        const: ada:parameter/laicpmsTAPP/DriftMonitorFrequency
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: DriftMonitorFrequency
      schema:name:
        const: Multi-Run Sequential Analysis Design
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: true
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  MatrixOffseCorrection:
    title: Matrix Offset Correction (LIEF)
    description: Whether an empirical correction was applied to account for systematic
      differences in laser-induced elemental fractionation (LIEF) patterns between
      the external calibration standard and the sample matrix.
    type: object
    properties:
      '@context':
        const:
          schema: http://schema.org/
          ada: https://ada.astromat.org/metadata/
      '@id':
        const: ada:parameter/laicpmsTAPP/MatrixOffseCorrection
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: MatrixOffseCorrection
      schema:name:
        const: Matrix Offset Correction (LIEF)
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: true
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
