x-defs:
  cdif.bbr.metadata.schemaorgProperties.identifier:
    description: 'Properties for a schema.org identifier (schema:PropertyValue pattern).


      **Union-type policy:** In CDIF profile UML models an attribute typed as

      schema:Identifier / schema:PropertyValue is represented by a single attribute

      of that class type. The JSON Schema implementation permits the property value

      to be EITHER a plain string (interpreted as the bare identifier value) OR a

      full schema:PropertyValue object (with explicit @type, propertyID, value).

      Consumers should accept either form.

      '
    type: object
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          enum:
          - schema:PropertyValue
        minItems: 1
      schema:propertyID:
        type: string
        description: In this context for the schema:PropertyValue, this field is an
          identifier for the identifier schema, e.g. DOI, ARK.  Get values from https://registry.identifiers.org/registry/
          for interoperability
        x-jsonld-id: http://schema.org/propertyID
      schema:value:
        type: string
        description: the identifier string. E.g. 10.5066/F7VX0DMQ
        x-jsonld-id: http://schema.org/value
      schema:url:
        type: string
        format: uri
        description: 'web-resolveable string for the identifier; host name part is
          location of a resolver that will return some representation for the given
          identifier value. E.g. https://doi.org/10.5066/F7VX0DMQ '
        x-jsonld-id: http://schema.org/url
    allOf:
    - required:
      - '@type'
    - anyOf:
      - required:
        - schema:value
      - required:
        - schema:url
    x-jsonld-prefixes:
      schema: http://schema.org/
    x-schema-source: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/schemaorgProperties/identifier/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
  cdif.bbr.metadata.schemaorgProperties.definedTerm:
    description: "schema.org Defined Term schema.\n\n**Union-type policy:** In CDIF
      profile UML models an attribute typed as\nschema:DefinedTerm is represented
      by a single attribute of that class type.\nThe JSON Schema implementation permits
      the property value to be EITHER a\nplain string (interpreted as schema:name
      or schema:termCode in the default\nvocabulary) OR a full schema:DefinedTerm
      object (with explicit @type, name,\nidentifier, termCode, inDefinedTermSet).
      Consumers should accept either form.\n\nNote that this differs from the cdif
      Concept policy: a Concept (skos:Concept)\nin CDIF profiles MUST be a controlled-vocabulary
      entry (object form or\n@id-reference) \u2014 plain strings are not permitted
      for Concept-typed values\nbecause vocabulary identity cannot be recovered from
      an unscoped label.\n"
    type: object
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          enum:
          - schema:DefinedTerm
        minItems: 1
      schema:name:
        type: string
        description: text label for the term that is useful to human user
        x-jsonld-id: http://schema.org/name
      schema:identifier:
        anyOf:
        - type: string
        - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.identifier
        x-jsonld-id: http://schema.org/identifier
      schema:inDefinedTermSet:
        type: string
        description: Name for the controlled vocabulary responsible for this keyword.
        x-jsonld-id: http://schema.org/inDefinedTermSet
      schema:termCode:
        type: string
        description: A representative code for this keyword in the controlled vocabulary.
          Analogous to skos:Notation
        x-jsonld-id: http://schema.org/termCode
    allOf:
    - required:
      - '@type'
    - anyOf:
      - required:
        - schema:name
      - required:
        - schema:identifier
      - required:
        - schema:termCode
    x-jsonld-prefixes:
      schema: http://schema.org/
    x-schema-source: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/schemaorgProperties/definedTerm/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
  ogch.geochemProperties.instrument:
    title: ADA Analysis Instrument
    description: ADA analytical instrument building block. Extends the core CDIF instrument
      building block with NeXus NXinstrument classification via additionalType. Instruments
      are typed as schema:Thing + schema:Product (from core) with domain-specific
      types (e.g. nxs:BaseClass/NXinstrument, ada:AMSInstrument) in additionalType.
    allOf:
    - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument
    - type: object
      properties:
        schema:additionalType:
          description: Domain-specific instrument type classifications. Should include
            a NeXus base class (e.g. nxs:BaseClass/NXinstrument) and/or technique-specific
            identifier (e.g. ada:AMSInstrument, GCMD instrument identifier).
          type: array
          items:
            type: string
          minItems: 1
          x-jsonld-id: http://schema.org/additionalType
      required:
      - schema:additionalType
    x-jsonld-prefixes:
      schema: http://schema.org/
      nxs: http://purl.org/nexusformat/definitions/
    x-schema-source: https://usgin.github.io/geochemBuildingBlocks/build/annotated/geochemProperties/instrument/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
  ogch.geochemProperties.laboratory:
    title: ADA Analysis Laboratory
    description: ADA laboratory or facility building block. Extends the core CDIF
      spatialExtent (schema:Place) with NeXus NXsource classification via additionalType.
      Inherits place name, identifier, alternateName, geo coordinates, and geosparql
      geometry from spatialExtent.
    allOf:
    - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.spatialExtent
    - type: object
      properties:
        schema:additionalType:
          type: array
          items:
            type: string
          contains:
            enum:
            - nxs:BaseClass/NXsource
          description: Must include nxs:BaseClass/NXsource for NeXus facility classification.
          x-jsonld-id: http://schema.org/additionalType
    x-jsonld-prefixes:
      schema: http://schema.org/
      nxs: http://purl.org/nexusformat/definitions/
    x-schema-source: https://usgin.github.io/geochemBuildingBlocks/build/annotated/geochemProperties/laboratory/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
  cdif.bbr.metadata.schemaorgProperties.person:
    description: schema for cdif profile of schema.org/Person
    type: object
    properties:
      '@id':
        type: string
      '@type':
        type: array
        items:
          type: string
        contains:
          enum:
          - schema:Person
        minItems: 1
      schema:name:
        type: string
        description: string label for person that is meaningful for human users, should
          format consistently. Recommend 'Family Name, Given name' format.
        x-jsonld-id: http://schema.org/name
      schema:description:
        type: string
        x-jsonld-id: http://schema.org/description
      schema:identifier:
        description: identifier for person, recommend ORCID
        anyOf:
        - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.identifier
        - type: string
        x-jsonld-id: http://schema.org/identifier
      schema:alternateName:
        type: string
        description: other labels by which the person might be known
        x-jsonld-id: http://schema.org/alternateName
      schema:affiliation:
        description: if affiliation is present, value must be a schema:Organization.
        x-jsonld-id: http://schema.org/affiliation
        allOf:
        - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.organization
      schema:contactPoint:
        type: object
        description: restrict to email only. Schema.org allows telephone and postal
          contacts as well
        properties:
          '@type':
            default: schema:ContactPoint
            type: array
            items:
              type: string
            contains:
              enum:
              - schema:ContactPoint
            minItems: 1
          schema:email:
            type: string
            x-jsonld-id: http://schema.org/email
        required:
        - schema:email
        x-jsonld-id: http://schema.org/contactPoint
      schema:sameAs:
        type: array
        description: other identifiers for the person
        items:
          anyOf:
          - type: string
          - type: object
            properties:
              '@id':
                type: string
        x-jsonld-id: http://schema.org/sameAs
    allOf:
    - required:
      - '@type'
    - anyOf:
      - required:
        - schema:name
      - required:
        - schema:identifier
    x-jsonld-prefixes:
      schema: http://schema.org/
    x-schema-source: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/schemaorgProperties/person/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
  cdif.bbr.metadata.schemaorgProperties.organization:
    type: object
    properties:
      '@id':
        type: string
      '@type':
        default: schema:Organization
        type: array
        items:
          anyOf:
          - type: string
            enum:
            - schema:Organization
            - schema:FundingAgency
            - schema:Consortium
            - schema:Corporation
            - schema:EducationalOrganization
            - schema:FundingScheme
            - schema:GovernmentOrganization
            - schema:NGO
            - schema:Project
            - schema:ResearchOrganization
        contains:
          enum:
          - schema:Organization
        minItems: 1
      schema:additionalType:
        type: array
        items:
          anyOf:
          - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.definedTerm
          - type: string
        x-jsonld-id: http://schema.org/additionalType
      schema:name:
        type: string
        description: string label for organization that is meaningful for human users
        x-jsonld-id: http://schema.org/name
      schema:alternateName:
        type: string
        description: other labels by which the organization might be known
        x-jsonld-id: http://schema.org/alternateName
      schema:description:
        type: string
        x-jsonld-id: http://schema.org/description
      schema:identifier:
        description: identifier for organization
        anyOf:
        - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.identifier
        - type: string
        x-jsonld-id: http://schema.org/identifier
      schema:sameAs:
        type: array
        description: other identifiers for the organization
        items:
          anyOf:
          - type: string
          - type: object
            properties:
              '@id':
                type: string
        x-jsonld-id: http://schema.org/sameAs
    allOf:
    - required:
      - '@type'
    - anyOf:
      - required:
        - schema:name
      - required:
        - schema:identifier
    x-jsonld-prefixes:
      schema: http://schema.org/
    x-schema-source: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/schemaorgProperties/organization/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
  cdif.bbr.metadata.schemaorgProperties.labeledLink:
    description: schema for a labeled link, a profile of schema.org/CreativeWork
    type: object
    properties:
      '@type':
        default: schema:CreativeWork
        type: array
        items:
          type: string
        contains:
          enum:
          - schema:CreativeWork
        minItems: 1
      schema:name:
        type: string
        x-jsonld-id: http://schema.org/name
      schema:description:
        type: string
        x-jsonld-id: http://schema.org/description
      schema:url:
        type: string
        format: uri
        x-jsonld-id: http://schema.org/url
    required:
    - '@type'
    - schema:url
    x-jsonld-prefixes:
      schema: http://schema.org/
    x-schema-source: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/schemaorgProperties/labeledLink/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
  cdif.bbr.metadata.schemaorgProperties.monetaryGrant:
    description: Funding acknowledgement properties, profile of schema.org/MonetaryGrant
    type: object
    properties:
      '@id':
        type: string
        description: URI identifier for this funding record
      '@type':
        default: schema:MonetaryGrant
        type: array
        items:
          type: string
        contains:
          enum:
          - schema:MonetaryGrant
        minItems: 1
      schema:identifier:
        description: identifier for a particular grant
        x-jsonld-id: http://schema.org/identifier
        allOf:
        - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.monetaryGrant/$defs/Identifier
      schema:description:
        type: string
        description: description of the funding or grant
        x-jsonld-id: http://schema.org/description
      schema:name:
        type: string
        description: title of the grant
        x-jsonld-id: http://schema.org/name
      schema:funder:
        anyOf:
        - type: object
          properties:
            '@id':
              type: string
              description: a identifier for an agent defined in this metadata, or
                externally; must be dereferenceable
          required:
          - '@id'
        - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.monetaryGrant/$defs/Person
        - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.monetaryGrant/$defs/Organization
        x-jsonld-id: http://schema.org/funder
    anyOf:
    - required:
      - schema:funder
    - required:
      - schema:identifier
    - required:
      - schema:name
    $defs:
      Person:
        $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.person
      Organization:
        $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.organization
      Identifier:
        $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.identifier
    x-jsonld-prefixes:
      schema: http://schema.org/
    x-schema-source: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/schemaorgProperties/monetaryGrant/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
  cdif.bbr.metadata.qualityProperties.qualityMeasure:
    title: definitions for simple quality measure property
    type: object
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          enum:
          - dqv:QualityMeasurement
        minItems: 1
      dqv:isMeasurementOf:
        description: specify the quality measure that is reported, by name, with an
          ID ref, or as a Defined Term
        anyOf:
        - type: string
        - type: object
          properties:
            '@id':
              type: string
              description: a resolvable reference to a representation of a quality
                measure
        - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.qualityProperties.qualityMeasure/$defs/DefinedTerm
      dqv:value:
        description: the reported result of the quality measure, either as a string
          or a defined term from a vocabulary
        anyOf:
        - type: string
        - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.qualityProperties.qualityMeasure/$defs/DefinedTerm
    required:
    - dqv:isMeasurementOf
    - dqv:value
    $defs:
      DefinedTerm:
        $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.definedTerm
    x-jsonld-prefixes:
      schema: http://schema.org/
    x-schema-source: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/qualityProperties/qualityMeasure/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
  cdif.bbr.metadata.schemaorgProperties.instrument:
    title: Instrument Description
    description: Schema for describing laboratory instruments and instrument systems.
      Supports ownership, manufacturer, model, commissioning dates, hierarchical sub-components
      via schema:hasPart, and domain-specific typing. Instruments may be standalone
      devices or complex systems with sub-components.
    type: object
    properties:
      '@context':
        type: object
        description: JSON-LD context declaring namespace prefixes.
        properties:
          schema:
            enum:
            - http://schema.org/
          dcterms:
            enum:
            - http://purl.org/dc/terms/
        required:
        - schema
      '@id':
        type: string
        description: Persistent identifier URI for this instrument metadata record.
      '@type':
        type: array
        items:
          type: string
        minItems: 2
        description: Must include schema:Product and schema:Thing. May include additional
          types.
        allOf:
        - contains:
            enum:
            - schema:Product
        - contains:
            enum:
            - schema:Thing
      schema:additionalType:
        description: Domain-specific type classifications. Should include a scientific
          instrument type URI (e.g. wd:Q3099911 for Wikidata scientific instrument).
        type: array
        items:
          type: string
        minItems: 1
        x-jsonld-id: http://schema.org/additionalType
      schema:name:
        type: string
        minLength: 3
        description: Human-readable name for this instrument.
        x-jsonld-id: http://schema.org/name
      schema:description:
        type: string
        description: Text description of this instrument, its purpose, and capabilities.
        x-jsonld-id: http://schema.org/description
      schema:alternateName:
        description: Alternate name(s), e.g. specific make/model designation, common
          abbreviation.
        type: array
        items:
          type: string
        x-jsonld-id: http://schema.org/alternateName
      schema:identifier:
        description: Formal identifier(s) for this instrument. Use PropertyValue for
          structured identifiers (e.g. PIDINST, serial number, inventory number).
        type: array
        items:
          anyOf:
          - type: string
          - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/Identifier
        x-jsonld-id: http://schema.org/identifier
      schema:url:
        type: string
        format: uri
        description: Landing page URL for this instrument.
        x-jsonld-id: http://schema.org/url
      schema:manufacturer:
        description: Organization that manufactured this instrument.
        x-jsonld-id: http://schema.org/manufacturer
        allOf:
        - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/Organization
      schema:model:
        type: object
        description: Product model information for this instrument.
        properties:
          '@type':
            type: array
            items:
              type: string
            contains:
              enum:
              - schema:ProductModel
            minItems: 1
          schema:name:
            type: string
            description: Model name or number.
            x-jsonld-id: http://schema.org/name
          schema:identifier:
            description: Model identifier.
            anyOf:
            - type: string
            - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/Identifier
            x-jsonld-id: http://schema.org/identifier
        required:
        - schema:name
        x-jsonld-id: http://schema.org/model
      schema:category:
        description: Instrument type classification(s) from a controlled vocabulary.
        type: array
        items:
          $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/DefinedTerm
        x-jsonld-id: http://schema.org/category
      schema:owner:
        description: Organization that owns this instrument.
        x-jsonld-id: http://schema.org/owner
        allOf:
        - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/Organization
      schema:contributor:
        description: Agents associated with this instrument in specific roles (e.g.
          operator, custodian, principal investigator). Use schema:owner for the owning
          organization.
        type: array
        items:
          $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/AgentInRole
        x-jsonld-id: http://schema.org/contributor
      schema:additionalProperty:
        type: array
        description: Instrument-specific properties (measured variables, detection
          limits, calibration information, operating parameters, etc.).
        items:
          $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/AdditionalProperty
        x-jsonld-id: http://schema.org/additionalProperty
      schema:validFrom:
        type: string
        description: Date the instrument was commissioned (ISO 8601).
        x-jsonld-id: http://schema.org/validFrom
      schema:validThrough:
        type: string
        description: Date the instrument was decommissioned (ISO 8601). Absent if
          still operational.
        x-jsonld-id: http://schema.org/validThrough
      schema:hasPart:
        type: array
        description: Sub-components of this instrument system. Each item is either
          an inline instrument description or an @id reference.
        items:
          anyOf:
          - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/InstrumentComponent
          - type: object
            properties:
              '@id':
                type: string
                description: Reference to a sub-component defined elsewhere.
            required:
            - '@id'
        x-jsonld-id: http://schema.org/hasPart
      schema:relatedLink:
        type: array
        description: Links to related resources (manuals, datasheets, calibration
          records, related instruments).
        items:
          $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.instrument/$defs/Reference
        x-jsonld-id: http://schema.org/relatedLink
      schema:subjectOf:
        description: Catalog record metadata-about-metadata for this instrument description.
        type: object
        properties:
          '@id':
            type: string
          '@type':
            type: array
            items:
              type: string
          schema:dateModified:
            type: string
            description: Date this metadata record was last modified (ISO 8601).
            x-jsonld-id: http://schema.org/dateModified
          schema:about:
            type: object
            properties:
              '@id':
                type: string
                description: Reference back to the instrument @id.
            x-jsonld-id: http://schema.org/about
          dcterms:conformsTo:
            description: Schema or profile this metadata record conforms to.
            type: array
            items:
              anyOf:
              - type: string
              - type: object
                properties:
                  '@id':
                    type: string
        x-jsonld-id: http://schema.org/subjectOf
    required:
    - '@type'
    - schema:name
    $defs:
      Identifier:
        $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.identifier
      Organization:
        $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.organization
      Person:
