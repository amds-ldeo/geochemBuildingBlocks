      $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/$defs/ComputationalTool
    x-jsonld-id: https://bioschemas.org/computationalTool
  bios:reagent:
