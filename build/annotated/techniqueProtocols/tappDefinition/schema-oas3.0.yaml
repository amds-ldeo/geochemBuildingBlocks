title: Technique-Aligned Protocol Profile (TAPP) Definition v3
description: A registered Technique-Aligned Protocol Profile (TAPP) definition modeled
  as a cdi:Activity and schema:Action. The TAPP identity (name, technique, instrument,
  location) lives at the top level. The standard workflow is encoded in schema:actionProcess
  as a schema:HowTo containing an ordered sequence of cdi:Activity + schema:Action
  steps (sample preparation, calibration, acquisition, data processing, quality control).
  Each workflow step carries its own parameters, reagents, and instruments. TAPP-level
  parameters that apply across all steps remain at the top level in ada:methodParameters.
  Integrates Bioschemas vocabulary for computational tools and reagents, DDI-CDI for
  activity sequence, and dqv:hasQualityMeasurement for quality metrics.
type: object
properties:
  '@context':
    type: object
    description: JSON-LD context declaring the namespace prefixes used in a method
      definition. Required for the document to be a valid JSON-LD instance. Bound
      prefixes must include schema (always), cdi (DDI-CDI), and ada (ADA vocabulary).
      Additional prefixes (bios, dqv, prov, skos) are recommended when those vocabularies
      are used in the body of the definition.
    properties:
      schema:
        enum:
        - http://schema.org/
      ada:
        enum:
        - https://ada.astromat.org/metadata/
      cdi:
        enum:
        - http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/
      bios:
        enum:
        - https://bioschemas.org/
      dqv:
        enum:
        - http://www.w3.org/ns/dqv#
      prov:
        enum:
        - http://www.w3.org/ns/prov#
      skos:
        enum:
        - http://www.w3.org/2004/02/skos/core#
    required:
    - schema
    - ada
    - cdi
  '@id':
    type: string
    description: Persistent URI for this TAPP definition in the registry.
  '@type':
    type: array
    items:
      type: string
    minItems: 4
    allOf:
    - contains:
        enum:
        - cdi:Activity
    - contains:
        enum:
        - schema:Action
    - contains:
        enum:
        - ada:TAPPDefinition
    - contains:
        enum:
        - bios:LabProtocol
    description: Must include cdi:Activity, schema:Action, ada:TAPPDefinition, and
      bios:LabProtocol.
  schema:name:
    type: string
    title: Method Name
    description: Short descriptive name with version (e.g. "JEOL-8530F WDS Major Element
      Glass v2.1").
    x-jsonld-id: http://schema.org/name
  schema:identifier:
    description: DOI or other persistent ID for this method definition.
    anyOf:
    - type: string
    - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.identifier
    x-jsonld-id: http://schema.org/identifier
  schema:description:
    type: string
    description: Human-readable summary of the method, may be auto-generated from
      constant parameters at registration time.
    x-jsonld-id: http://schema.org/description
  schema:version:
    type: string
    description: Semantic version string (e.g. "2.1.0").
    x-jsonld-id: http://schema.org/version
  schema:datePublished:
    title: Method Start Date
    type: string
    description: ISO 8601 date when this method configuration was first used.
    x-jsonld-id: http://schema.org/datePublished
  schema:dateModified:
    type: string
    description: ISO 8601 date of last update to this definition.
    x-jsonld-id: http://schema.org/dateModified
  schema:additionalType:
    description: Further classification of the activity type (e.g. schema:CreateAction
      for a production method).
    type: array
    items:
      type: string
    x-jsonld-id: http://schema.org/additionalType
  schema:measurementTechnique:
    title: Technique
    description: The analytical technique this method implements. Must be a DefinedTerm
      from a controlled vocabulary of techniques.
    x-jsonld-id: http://schema.org/measurementTechnique
    allOf:
    - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.definedTerm
  schema:object:
    description: Target material(s) this method is designed to analyse (e.g. silicate
      glass, olivine, spinel). Modeled as DefinedTerm(s) or free text.
    type: array
    items:
      anyOf:
      - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/$defs/DefinedTerm
      - type: string
    x-jsonld-id: http://schema.org/object
  schema:instrument:
    description: Primary instrument specification for this method. Use schema:hasPart
