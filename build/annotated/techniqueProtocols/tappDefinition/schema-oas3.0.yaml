    x-jsonld-id: http://schema.org/location
    allOf:
    - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/ogch.geochemProperties.laboratory
  schema:creator:
    title: Method Author
    description: Person or organisation who defined or is responsible for this method.
    anyOf:
    - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.person
    - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.organization
    - type: object
      properties:
        '@id':
          type: string
    x-jsonld-id: http://schema.org/creator
  schema:actionProcess:
    description: The standard workflow for this method, expressed as a schema:HowTo
      containing an ordered sequence of workflow steps. Each step is a cdi:Activity
      + schema:Action describing a distinct phase (sample preparation, calibration,
      acquisition, data processing, quality control). Steps carry their own parameters,
      reagents, instruments, and sub-steps.
    x-jsonld-id: http://schema.org/actionProcess
    allOf:
    - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/$defs/WorkflowHowTo
  ada:methodParameters:
    type: array
    description: Method-level parameters that apply across all workflow steps (e.g.
      method-scoped constants like matrix correction model). Step-specific parameters
      should be placed on the appropriate workflow step instead.
    items:
      $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/$defs/MethodParameter
    x-jsonld-id: https://ada.astromat.org/metadata/methodParameters
  ada:analyteTemplate:
    description: Template for per-analyte (element-specific) parameters. Defines the
      columns that appear in the element table, each with scope, datatype, and constraints.
      Analyte rows become schema:variableMeasured entries in metadata records. Typically
      associated with the acquisition workflow step.
    type: object
    properties:
      ada:analyteColumns:
        type: array
        description: Columns of the per-analyte parameter table. Must include exactly
          one column with schema:valueName "analyte" that identifies the analyzed
          constituent named in each row.
        minItems: 1
        items:
          $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/$defs/AnalyteColumn
        contains:
          $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/$defs/AnalyteIdentifierColumn
        maxContains: 1
        x-jsonld-id: https://ada.astromat.org/metadata/analyteColumns
      ada:defaultAnalytes:
        type: array
        description: Pre-populated analyte rows for this method. Each entry is an
          object keyed by analyteColumn names.
        items:
          type: object
          additionalProperties: true
        x-jsonld-id: https://ada.astromat.org/metadata/defaultAnalytes
    required:
    - ada:analyteColumns
    x-jsonld-id: https://ada.astromat.org/metadata/analyteTemplate
  dqv:hasQualityMeasurement:
    description: Quality measurements that characterize the method's expected performance
      (e.g. analytical precision, accuracy, counting statistics error). Uses the CDIF
      qualityMeasure building block.
    type: array
    items:
      $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/$defs/QualityMeasure
    x-jsonld-id: http://www.w3.org/ns/dqv#hasQualityMeasurement
  schema:relatedLink:
    title: Method References
    type: array
    description: Publications, Zenodo records, or other references reports describing
      or evaluating this method.
    items:
      $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.labeledLink
    x-jsonld-id: http://schema.org/relatedLink
  schema:funding:
    title: Funding Source
    type: array
    items:
      $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.monetaryGrant
    x-jsonld-id: http://schema.org/funding
required:
- '@context'
- '@type'
- schema:name
- schema:measurementTechnique
$defs:
  WorkflowHowTo:
    type: object
    description: The method's standard workflow expressed as a schema:HowTo. Contains
      an ordered array of workflow steps in schema:step, where each step is a cdi:Activity
      + schema:Action.
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          enum:
          - schema:HowTo
        minItems: 1
      '@id':
        type: string
      schema:name:
        type: string
        description: Name of the workflow (e.g. "EPMA WDS analytical workflow").
        x-jsonld-id: http://schema.org/name
      schema:description:
        type: string
        description: Overview of the workflow.
        x-jsonld-id: http://schema.org/description
      schema:url:
        type: string
        format: uri
        description: URL to a published protocol document.
        x-jsonld-id: http://schema.org/url
      schema:step:
        type: array
        description: Ordered sequence of workflow steps. Each step is a cdi:Activity
          + schema:Action describing a distinct phase of the analytical procedure.
          Must include exactly one sample-preparation step (schema:name "Sample preparation"
          with schema:additionalType containing "bios:LabProcess"); its schema:position
          is left to the protocol author.
        items:
          $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/$defs/WorkflowStep
        contains:
          type: object
          description: a sample preparation step is required.
          properties:
            schema:name:
              x-jsonld-id: http://schema.org/name
              enum:
              - Sample preparation
            schema:additionalType:
              type: array
              contains:
                enum:
                - bios:LabProcess
              x-jsonld-id: http://schema.org/additionalType
          required:
          - schema:name
          - schema:additionalType
        maxContains: 1
        x-jsonld-id: http://schema.org/step
    required:
    - '@type'
    - schema:step
  WorkflowStep:
    type: object
    description: A single step in the analytical workflow, modeled as a cdi:Activity
      + schema:Action. Each step describes a distinct phase such as sample preparation,
      instrument calibration, data acquisition, data processing, or quality control.
      Steps carry their own parameters, instruments, reagents, and may contain sub-steps
      via schema:actionProcess.
    properties:
      '@type':
        type: array
        items:
          type: string
        minItems: 2
        allOf:
        - contains:
            enum:
            - cdi:Activity
        - contains:
            enum:
            - schema:Action
      '@id':
        type: string
      schema:name:
        type: string
        description: Name of this workflow step (e.g. "Sample preparation").
        x-jsonld-id: http://schema.org/name
      schema:description:
        type: string
        description: Detailed description of what this step involves.
        x-jsonld-id: http://schema.org/description
      schema:position:
        type: integer
        description: Ordinal position in the workflow sequence (1-based).
        x-jsonld-id: http://schema.org/position
      schema:additionalType:
        description: Further classification of this step (e.g. bios:LabProcess for
          wet-lab steps, schema:CreateAction for production steps).
        type: array
        items:
          type: string
        x-jsonld-id: http://schema.org/additionalType
      schema:instrument:
        description: Instrument or equipment used in this step.
        anyOf:
        - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/ogch.geochemProperties.instrument
        - type: object
          properties:
            '@id':
              type: string
          required:
          - '@id'
        x-jsonld-id: http://schema.org/instrument
      bios:computationalTool:
        description: Software tools used in this step.
        type: array
        items:
          $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/$defs/ComputationalTool
        x-jsonld-id: https://bioschemas.org/computationalTool
      bios:reagent:
        description: Reference materials, standards, or reagents used in this step.
        type: array
        items:
          $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/$defs/Reagent
        x-jsonld-id: https://bioschemas.org/reagent
      prov:used:
        description: Input entities consumed or referenced by this step (e.g. prepared
          sample from a prior step).
        type: array
        items:
          anyOf:
          - type: string
          - type: object
            properties:
              '@id':
                type: string
        x-jsonld-id: http://www.w3.org/ns/prov#used
      schema:result:
        description: Output entity produced by this step (can be referenced as input
