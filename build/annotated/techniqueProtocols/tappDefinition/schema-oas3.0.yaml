    x-jsonld-id: http://schema.org/instrument
    allOf:
    - $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/techniqueProtocols/tappDefinition/schema-oas3.0.yaml#/x-defs/ogch.geochemProperties.instrument
  bios:computationalTool:
    description: Software tools used for data acquisition, reduction, and processing.
