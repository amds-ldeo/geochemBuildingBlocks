$schema: https://json-schema.org/draft/2020-12/schema
title: ADA SLS Product Profile
description: Technique-specific profile for Structured Light Scanning (SLS) products.
  Extends the base ADA product profile with constraints on valid SLS component types
  and detailSLS requirements.
allOf:
- $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/profiles/adaProfiles/adaProduct/schema.yaml
- type: object
  properties:
    schema:additionalType:
      description: Must include a SLS product type identifier.
      contains:
        enum:
        - Structured Light Scanning (SLS) Individual Scan Collection
        - Structured Light Scanning (SLS) Shape Model
        - Structured Light Scanning
      x-jsonld-id: http://schema.org/additionalType
    schema:distribution:
      description: Distribution items for adaSLS. Archive hasPart items must have
        ada:componentType from technique-specific or universal values.
      type: array
      items:
        type: object
        properties:
          schema:hasPart:
            items:
              type: object
              anyOf:
              - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/profiles/adaProfiles/adaProduct/schema.yaml#/$defs/universalComponentTypeBranch
              - properties:
                  ada:componentType:
                    type: string
                    enum:
                    - ada:ShapeModelImage
                required:
                - ada:componentType
              - $ref: https://amds-ldeo.github.io/geochemBuildingBlocks/build/annotated/analysisSpecificDetails/detailSLS/schema.yaml
            x-jsonld-id: http://schema.org/hasPart
      x-jsonld-id: http://schema.org/distribution
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaSLS
          x-jsonld-id: http://purl.org/dc/terms/conformsTo
      x-jsonld-id: http://schema.org/subjectOf
x-jsonld-prefixes:
  schema: http://schema.org/
  ada: https://ada.astromat.org/metadata/
  cdi: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/
  csvw: http://www.w3.org/ns/csvw#
  prov: http://www.w3.org/ns/prov#
  spdx: http://spdx.org/rdf/terms#
  nxs: http://purl.org/nexusformat/definitions/
  dcterms: http://purl.org/dc/terms/
  geosparql: http://www.opengis.net/ont/geosparql#
