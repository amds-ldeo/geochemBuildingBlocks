$schema: https://json-schema.org/draft/2020-12/schema
title: Tabular Data Type
description: Tabular data type aligned with CDIF 2026 schema using DDI-CDI and CSVW
  properties. Typed as cdi:TabularTextDataSet and ada:tabularData.
allOf:
- type: object
  properties:
    '@type':
      type: array
      items:
        type: string
      minItems: 2
      allOf:
      - contains:
          const: cdi:TabularTextDataSet
      - contains:
          const: ada:tabularData
    ada:componentType:
      type: string
      description: ADA componentType for a tabular data file, as a single string.
        Allowed values are constrained at the technique-profile level.
      x-jsonld-id: https://ada.astromat.org/metadata/componentType
    ada:xCoordCol:
      description: The column names are redundant, they are lists in the hasPhysicalMapping
        array. Include here for convenience.
      type: string
      x-jsonld-id: https://ada.astromat.org/metadata/xCoordCol
    ada:yCoordCol:
      type: string
      x-jsonld-id: https://ada.astromat.org/metadata/yCoordCol
    ada:zCoordCol:
      type: string
      x-jsonld-id: https://ada.astromat.org/metadata/zCoordCol
    ada:coordUnits:
      type: string
      x-jsonld-id: https://ada.astromat.org/metadata/coordUnits
    ada:spatialRegistration:
      $ref: https://usgin.github.io/geochemBuildingBlocks/build/annotated/geochemProperties/spatialRegistration/schema.yaml
      x-jsonld-id: https://ada.astromat.org/metadata/spatialRegistration
  required:
  - '@type'
  - ada:componentType
- $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/cdifProperties/cdifTabularData/schema.yaml
x-jsonld-prefixes:
  schema: http://schema.org/
  ada: https://ada.astromat.org/metadata/
  cdi: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/
