$schema: https://json-schema.org/draft/2020-12/schema
$id: https://w3id.org/geochem/schema/geochemBaseProfile/1.0
title: Geochem Base Profile
description: >-
  The geochemistry overlay on its own: the analytical surface this repository
  contributes on top of the CDIF profiles. The analysis events that produced a
  product (instruments, computational tools, reagents, laboratory, samples
  analysed), the product-type and licence declarations, the distributions and
  their parts, and the geochem-specific variable, parameter and coverage shapes.

  It imports no CDIF schema and composes nothing. geochemProduct is the
  composition -- the CDIF core, data-description, manifest and provenance
  profiles together with this overlay -- and this file is the half of that which
  gBB authors. Factored out 2026-11-04, following the cdifProfile /
  cdifCompositeProfile split upstream, so that what gBB contributes can be read,
  diffed and reviewed without the imported profiles around it.

  "Overlay" rather than "additions", deliberately: most of these keys exist
  upstream and this block narrows them and carries their gBB labels. A pure
  refinement of a CDIF property is the normal case here, not the exception.

  Not a standalone record schema: on its own it constrains an object that
  carries the geochem surface and says nothing about the CDIF properties a
  record also needs. Compose it, or reference geochemProduct.
type: object

properties:
  "@type":
    title: Record Type
    type: array
    items:
      type: string
      enum:
        - "schema:Dataset"
        - "schema:Product"
  "schema:license":
    title: License
    description: Legal statement of conditions for use and access
    type: array
    minItems: 0
    items:
      anyOf:
        - type: string
        - $ref: ../creativeWork/schema.yaml
  "schema:relatedLink":
    title: Related Links
    type: array
    description: Links to related resources at the product level
    items:
      type: object
      properties:
        "@type":
          type: array
          items:
            type: string
          contains:
            const: "schema:LinkRole"
          minItems: 1
        "schema:linkRelationship":
          type: string
        "schema:target":
          type: object
          properties:
            "@type":
              type: array
              items:
                type: string
              contains:
                const: "schema:EntryPoint"
              minItems: 1
            "schema:encodingFormat":
              type: array
              items:
                type: string
            "schema:name":
              type: string
            "schema:url":
              type: string
  "schema:creativeWorkStatus":
    title: Status
    type: string
  "schema:measurementTechnique":
    title: Measurement Technique
    type: array
    items:
      type: object
      description: Text description of the measurement method
      properties:
        "@type":
          type: array
          items:
            type: string
          contains:
            const: "schema:DefinedTerm"
          minItems: 1
        "schema:name":
          type: string
        "schema:identifier":
          title: Technique Identifier
          type: string
  "prov:wasGeneratedBy":
    title: Analysis Events
    description: >-
      Analysis events. Extends cdifProvActivity (from cdifProvenance) with the
      generic geochem analysis-event surface: the instruments, computational
      tools and reagents actually used (schema:instrument); the laboratory; the
      samples analysed (schema:object); the TAPP the analysis followed
      (schema:actionProcess); and the session identifier and timing.
    type: array
    items:
      type: object
      properties:
        "schema:actionProcess":
          description: >-
            The TAPP this analysis event followed, or the workflow as it was performed.

            Two forms, after the CDIF plan link (cdifProvActivity; option A of the
            2026-11-11 activity-used-resources proposal). A bare {"@id": ...} is the link
            to the TAPP definition, which is typed schema:HowTo for exactly this reason.
            An inline schema:HowTo is the workflow as performed; when the event also
            followed a TAPP, that HowTo names it with schema:isBasedOn. One path finds the
            TAPP either way: prov:wasGeneratedBy/schema:actionProcess/schema:isBasedOn?.
            The TAPP link used to be the role-keyed prov:used wrapper
            {"ada:tappDefinition": {...}}, which is closed off below. Inline TAPPs are not
            accepted here: none existed in ada2 or ada_subjects when the link moved
            (measured 2026-11-11), so the reference is the only form.

            The reference is SEALED, as the ada:tappDefinition reference was, and so is
            schema:isBasedOn: a TAPP link names the plan and says nothing else about it.

            The base cdifProvActivity already supplies a schema:HowTo here, but its step shape
            carries only @type / name / description / position / url. A geochem analysis event
            needs the same step surface the TAPP plan uses -- per-step instruments, computational
            tools and reagents (schema:instrument), inputs (schema:object), result, parameters
            and sub-workflow -- so the step items are pinned to tappDefinition's WorkflowStep.
            Both apply: the base and this intersect under allOf, and neither the base HowTo nor
            its step is a closed object, so the richer shape adds to it rather than conflicting.

            WorkflowStep, NOT WorkflowHowTo, is deliberate. The requirement for exactly one
            "Sample preparation" step carrying bios:LabProcess lives on WorkflowHowTo, and it
            belongs to the TAPP plan -- a protocol must say how the sample was prepared. An
            analysis EVENT records what was done and may legitimately describe only part of a
            workflow, so referencing the step shape alone brings the structure without that
            requirement.
          anyOf:
            - type: string
            - description: The link to the TAPP definition this analysis followed.
              type: object
              additionalProperties: false
              required: ['@id']
              properties:
                '@id':
                  type: string
            - description: The workflow as performed, as a schema:HowTo.
              type: object
              required: ['@type']
              properties:
                '@type':
                  type: array
                  contains:
                    const: schema:HowTo
          properties:
            "schema:isBasedOn":
              description: >-
                The TAPP definition this workflow was based on, by reference.
              type: object
              additionalProperties: false
              required: ['@id']
              properties:
                '@id':
                  type: string
            "schema:step":
              type: array
              items:
                $ref: ../tappDefinition/schema.yaml#/$defs/WorkflowStep
        "schema:instrument":
          title: Resources Used
          type: array
          description: >-
            What the analysis used, other than its samples: the instruments, the
            computational tools actually used (acquisition, reduction, processing) and the
            reagents and reference materials actually used. One array, the kinds told apart
            by the Wikidata term each item carries in schema:additionalType -- Q3099911
            (measuring instrument), Q7397 (software), Q2356542 (chemical reagent) -- which is
            the CDIF cdifProvActivity rule. Each item is one of those, or a sealed {@id}
            reference (the CDIF base admits both, and requires exactly one kind term on an
            item described in place). The TAPP plan prescribes the generic instruments, tools
            and reagents; these record the ACTUALS used in this specific run.
          items:
            # Constraint-only kind pins, like the role pins they replace: each fires ONLY on
            # its kind, so the base's {@id} reference branch stays reachable. A narrowed anyOf
            # here would intersect with the base union and quietly exclude shapes it allows.
            # The kind tests accept the entity IRI and the wd: CURIE, as CDIF's do, so an item
            # written with the CURIE is still held to the geochem shape -- which then requires
            # the entity IRI on an instrument.
            allOf:
              - if:
                  $ref: ../tappDefinition/schema.yaml#/$defs/KindInstrument
                then:
                  $ref: ../instrument/schema.yaml
              - if:
                  $ref: ../tappDefinition/schema.yaml#/$defs/KindSoftware
                then:
                  $ref: '#/$defs/UsedComputationalTool'
              - if:
                  $ref: ../tappDefinition/schema.yaml#/$defs/KindReagent
                then:
                  $ref: '#/$defs/UsedReagent'
        "prov:used":
          description: >-
            Not where this profile records what an analysis used: instruments, tools and
            reagents are schema:instrument, samples are schema:object, and the TAPP link is
            schema:actionProcess. A prov:used that passes the CDIF core shape (strings and
            @id references) is accepted and checked by nothing more.

            The superseded spellings are CLOSED OFF, so a writer that regressed to one fails,
            naming the key, instead of passing silently. The role-keyed wrappers carry no @id
            and the CDIF core rejects them already; these close them off by name, and close
            off the one old form that does carry an @id -- an item typed ada:TAPPDefinition.
            Same sequence as the earlier close-offs: the records move first (the ADA stores
            are migrated before this is published), then the schema.
          type: array
          items:
            properties:
              'schema:instrument':
                description: >-
                  Superseded wrapper: an instrument is an item of the activity's own
                  schema:instrument.
                not: {}
              'bios:computationalTool':
                description: >-
                  Superseded wrapper: a computational tool is a schema:instrument item of
                  the software kind (Wikidata Q7397).
                not: {}
              'bios:reagent':
                description: >-
                  Superseded wrapper: a reagent is a schema:instrument item of the reagent
                  kind (Wikidata Q2356542).
                not: {}
              'prov:reagent':
                description: >-
                  Superseded twice over (prov:reagent, then bios:reagent): a reagent is a
                  schema:instrument item of the reagent kind.
                not: {}
              'ada:tappDefinition':
                description: >-
                  Superseded wrapper: the TAPP link is schema:actionProcess {"@id": ...}, or
                  schema:isBasedOn on the event's inline workflow.
                not: {}
            allOf:
              - if:
                  type: object
                  required: ['@type']
                  properties:
                    '@type':
                      contains:
                        const: ada:TAPPDefinition
                then:
                  description: >-
                    A TAPP is not a prov:used entity: link it with schema:actionProcess
                    {"@id": ...}, or with schema:isBasedOn on the event's inline workflow.
                  properties:
                    '@type':
                      not:
                        contains:
                          const: ada:TAPPDefinition
        "schema:location":
          title: Laboratory
          $ref: ../laboratory/schema.yaml
        "schema:object":
          title: Samples Analyzed
          type: array
          description: Samples analyzed
          items:
            type: object
            properties:
              "@type":
                type: array
                items:
                  type: string
                allOf:
                - contains:
                    const: "schema:Thing"
                - contains:
                    const: "https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample"
                minItems: 2
              "schema:additionalType":
                type: array
                items:
                  $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/cdifDataType/cdifConceptOrTermOrString/schema.yaml
              "schema:identifier":
                title: Sample Identifier
                type: array
                items:
                  type: string
              "schema:name":
                description: Sample name/identifier as used in the lab.
                type: string
              "schema:additionalProperty":
                description: Per-sample PropertyValue entries (e.g. analysis location); technique profiles constrain these.
                type: array
                items:
                  $ref: '#/$defs/PropertyValueEntry'
              'ada:spatialRegistration':
                title: Spatial Registration
                description: >-
                  The coordinate system defined ON the sample -- typically a planar
                  thin section -- that image pixel coordinates are registered to.
                  Distinct from the ada:spatialRegistration on an image or imageMap
                  part, which maps pixel coordinates WITHIN one file: this one is the
                  frame those are registered to, and is what lets two images of the
                  same section be compared. Optional, and no record carries it yet.
                $ref: ../spatialRegistration/schema.yaml
        "schema:identifier":
          title: Session Identifier
          description: >-
            The analytical session's own identifier -- the laboratory's run,
            sequence or batch identifier as generated by the instrument or
            acquisition software. Sits on the activity rather than the dataset
            because the session IS the activity.
          type: string
        "schema:startTime":
          title: Start Time
          type: string
        "schema:endTime":
          title: End Time
          type: string
        # The superseded spelling of the activity's timing, CLOSED OFF. schema.org gives
        # schema:startTime/endTime to an Action and schema:startDate/endDate to an Event
        # or CreativeWork; an analysis event is a prov:Activity aligned with schema:Action,
        # so the Time pair is the one that applies, and it is the pair CDIF's
        # cdifProvActivity uses.
        #
        # Safe to reject outright: measured 2026-10-26 after the ADA writers dropped the
        # old pair, schema:startDate and schema:endDate occur 0 times in the 7,447
        # activities of both ada_subjects and production ada2, which carry
        # schema:startTime/endTime 7,447 times each and validate with 0 errors against
        # this repository at 60e3f13c1a. Same sequence as the TAPP and reagent close-offs:
        # the corpus moved first, then the schema.
        #
        # Without this the old keys would still validate, because the activity object is
        # open, so a writer that regressed to them would pass silently.
        "schema:startDate":
          description: >-
            Superseded: the analysis start is schema:startTime. Rename the key.
          not: {}
        "schema:endDate":
          description: >-
            Superseded: the analysis end is schema:endTime. Rename the key.
          not: {}
        "schema:additionalProperty":
          description: Per-analysis PropertyValue entries (replicates, transect length, ...); technique profiles constrain these.
          type: array
          items:
            $ref: '#/$defs/PropertyValueEntry'
        "ada:combinedResults":
          description: >-
            The reported values this session obtained by averaging or otherwise combining
            several individual results -- the ROWS of the combined-result table, and the
            domain that `defines: combined result` enumerates (Rule 7; see the Legends sheet
            of any delivered TAPP). One entry per combined value, each naming what it
            combines: "Olivine, sample A, 8 points", "Zircon weighted-mean date, sample B,
            236 of 246 spots", "Isochron, sample C, 36 runs".

            On the ACTIVITY rather than on a sample, because a combined result names its own
            sample and need not belong to exactly one -- an isochron over 36 runs is the case
            in hand.

            It is METADATA, unlike a sampling unit, and the difference is worth being clear
            about because an earlier design got it wrong. A combined result is a statement the
            record makes about its own contents, so it belongs here. An individual sampling
            unit is not: the procedure and the analysis can state only the KIND of unit
            (ada:samplingUnitType), while a particular unit's identifier is a
            schema:variableMeasured naming a COLUMN in one of the distributions, and the
            binding from that unit to its target material exists only in the instance data
            table beside the results. There is therefore no array of sampling-unit objects
            here; one was added on 2026-09-25 and removed on 2026-10-01 once that was settled.

            Analysis-side only: the procedure can say HOW results will be combined
            (Combination Method, keyed by reported property) but not WHICH were, so there is
            no ada:combinedResults counterpart in tappDefinition.

            Fields keyed `combined result x reported property` -- Goodness-of-Fit or
            Dispersion Statistic, and Other Statistics -- ride on these rows as per-reported-
            property values, keyed by the valueName of the column that declared them.
          type: array
          items:
            type: object
            required: ["schema:name"]
            properties:
              "@id":
                description: Optional identifier for this combined result.
                type: string
              "schema:name":
                description: >-
                  What this combined value is and what it combines. Required, because a
                  combined result nothing can name gives a field keyed by combined result no
                  row to attach its value to.
                type: string
      # An analysis always happened somewhere, so the activity must name a laboratory
      # node. What that node must CARRY is deliberately left to cdifLaboratory, which
      # requires one of schema:name / schema:identifier / schema:geo /
      # geosparql:hasGeometry rather than a name specifically: a laboratory may honestly
      # never have been assigned a name, and a ROR or a coordinate identifies it just as
      # well. Do not add "schema:name" here, and do not pin the
      # [schema:additionalType='Laboratory'] selector the sidecar paths use -- the node is
      # the laboratory by virtue of its position and its $ref, and no record in the corpus
      # carries that additionalType (281 carry none, 110 carry an unrelated NXsource).
      # prov:used is no longer required: CDIF's cdifProvActivity requires at least one of
      # schema:instrument, schema:object or schema:actionProcess, which is the rule here too.
      required:
        - "schema:location"
  "schema:variableMeasured":
    title: Measured Variables
    description: >-
      Variable definitions. Extends cdifInstanceVariable (from
      cdifDataDescription) with additional generic properties. Requires a
      description with minLength 3.
    type: array
    items:
      type: object
      properties:
        "@type":
          description: >-
            A variable is either a measured VALUE (schema:PropertyValue) or a SPECIFICATION of
            one (schema:PropertyValueSpecification); exactly which it is decides how a consumer
            reads schema:value. One of the two must appear. Further type URIs are welcome
            alongside - cdi:InstanceVariable is the usual companion - so the array is open.
          type: array
          items:
            type: string
          contains:
            anyOf:
              - const: "schema:PropertyValue"
              - const: "schema:PropertyValueSpecification"
        "schema:description":
          type: string
          minLength: 3
        "schema:alternateName":
          title: Alternate Name
          type: array
          items:
            type: string
            description: Human intelligible name for variable that conveys semantics
        "schema:measurementTechnique":
          type: array
          items:
            anyOf:
              - type: string
              - type: object
                required: ['@id']
                additionalProperties: false
                properties:
                  "@id":
                    type: string
              - type: object
                additionalProperties: false
                properties:
                  "@type":
                    type: array
                    items:
                      type: string
                    contains:
                      const: "schema:DefinedTerm"
                    minItems: 1
                  "schema:name":
                    type: string
                required:
                  - "@type"
                  - "schema:name"
        "schema:unitText":
          type: string
        "schema:unitCode":
          anyOf:
            - type: string
            - type: object
              required: ['@id']
              additionalProperties: false
              properties:
                "@id":
                  type: string
            - type: object
              additionalProperties: false
              properties:
                "@type":
                  type: array
                  items:
                    type: string
                  contains:
                    const: "schema:DefinedTerm"
                  minItems: 1
                "schema:name":
                  type: string
              required:
                - "@type"
                - "schema:name"
        "schema:minValue":
          type: number
        "schema:maxValue":
          type: number
        "schema:url":
          type: string
          format: uri
      required:
        - "schema:description"
        - "@type"
  "schema:spatialCoverage":
    title: Spatial Coverage
    description: Geographic extent of resource content.
    type: array
    items:
      $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/schemaorgProperties/spatialExtent/schema.yaml
  "schema:temporalCoverage":
    title: Temporal Coverage
    description: Temporal extent of resource content.
    type: array
    items:
      $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/schemaorgProperties/temporalExtent/schema.yaml
  "dqv:hasQualityMeasurement":
    title: Quality Measurements
    description: Quality measurements reported to assess the resource.
    type: array
    items:
      $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/qualityProperties/qualityMeasure/schema.yaml
  "schema:additionalProperty":
    title: Additional Properties
    description: >-
      PropertyValue entries describing the DELIVERED DATA rather than the
      analysis that produced it (extent, dimensions, ...). Distinct from the
      per-analysis prov:wasGeneratedBy.schema:additionalProperty. Technique
      profiles constrain these.
    type: array
    items:
      $ref: '#/$defs/PropertyValueEntry'
  "schema:distribution":
    title: Distributions
    description: >-
      Generic distribution structure. A distribution is a schema:DataDownload
      (or schema:WebAPI, inherited from cdifCore) that MAY carry a
      cdi:isStructuredBy data-structure description (for a monolithic single
      file that IS the dataset, or a structure shared across bundle parts), and
      MAY be a bundle whose schema:hasPart lists member files (typed via
      cdifManifest). The domain file-classification of a distribution / member
      (e.g. ADA ada:componentType) is added by the extending profile.
    type: array
    items:
      type: object
      properties:
        "cdi:isStructuredBy":
          description: >-
            Data-structure description of a monolithic single-file distribution
            (the file is the dataset), or a structure shared across bundle parts
            and referenced from them by @id. One of the four CDIF DataStructure
            variants inline, or an @id reference. Optional.
          anyOf:
            - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifDataStructure/schema.yaml#/$defs/DataStructure
            - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifDataStructure/schema.yaml#/$defs/DimensionalDataStructure
            - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifDataStructure/schema.yaml#/$defs/LongDataStructure
            - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifDataStructure/schema.yaml#/$defs/WideDataStructure
            - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/cdifDataType/objectReference/schema.yaml
        "schema:additionalType":
          description: >-
            Optional file-classification of this distribution (or, on a bundle,
            of the whole archive) drawn from the componentType vocabulary
            (ada:vocab/componentType) -- e.g. "ada:report", "ada:calibrationFile".
            Generic and OPTIONAL here; the ADA product layer (adaProduct) instead
            carries the required ada:componentType. Advisory (annotated via
            schema:inDefinedTermSet), not hard-enumerated in JSON Schema.
          type: array
          items:
            $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/cdifDataType/cdifConceptOrTermOrString/schema.yaml
          schema:inDefinedTermSet: "ada:vocab/componentType"
      allOf:
        # A monolithic single-file distribution that is a tabular text file
        # validates its CSVW/DDI-CDI layout + per-column cdif:hasPhysicalMapping
        # via cdifTabularData. A bundle DataDownload is an archive, not itself
        # tabular, so this never fires there.
        - if:
            properties:
              "@type":
                type: array
                contains:
                  const: "cdi:TabularTextDataSet"
          then:
            $ref: ../tabularData/schema.yaml
  "schema:subjectOf":
    title: About This Record
    properties:
      "dcterms:conformsTo":
        contains:
          type: object
          required: ['@id']
          additionalProperties: false
          properties:
            "@id":
              const: "https://w3id.org/geochem/metadata/profiles/geochemProduct"

  # ---------------------------------------------------------------------
  # Labels only. Each entry below carries a `title` and NOTHING else, so
  # deep_merge treats it as a partial patch: the CDIF base definition is
  # preserved underneath and only the label is contributed. Adding one of
  # these changes no constraint -- `properties` here has no
  # additionalProperties and names nothing as required.
  #
  # A label must NOT equal any block's own top-level title: the metadata
  # viewer treats such a title as a type name and drops it. Checked for
  # all of these against the 283 block titles in _sources + vendor/remote.
  # ---------------------------------------------------------------------
  'schema:name':
    title: Dataset Name
  'schema:description':
    title: Description
  'schema:identifier':
    title: Primary Identifier
  'schema:sameAs':
    title: Other Identifiers
  'schema:url':
    title: Landing Page
  'schema:version':
    title: Version
  'schema:creator':
    title: Authors
  'schema:contributor':
    title: Contributors
  'schema:publisher':
    title: Publisher
  'schema:provider':
    title: Provider
  'schema:funding':
    title: Funding Source
  'schema:conditionsOfAccess':
    title: Access Conditions
  'schema:publishingPrinciples':
    title: Publishing Principles
  'schema:dateModified':
    title: Date Modified
  'schema:datePublished':
    title: Date Published
  'schema:inLanguage':
    title: Language
  'schema:keywords':
    title: Keywords
  'schema:additionalType':
    title: Product Type
  'prov:wasDerivedFrom':
    title: Derived From
  "@id":
    title: Record IRI
$defs:
  # REMOVED 2026-11-04: universalComponentType. It was declared here (as geochemProduct's
  # $defs, before the split) and referenced by nothing -- every live $ref goes to adaProduct's
  # own copy, via ../adaProduct/schema.yaml#/$defs/universalComponentTypeBranch, in all 41
  # profile-ada blocks and in _tapp_lib's emitter. The two copies were deliberately not aliased
  # (a cross-file $ref-of-a-$ref mis-resolves), and this half of the pair simply never acquired
  # a consumer.
  #
  # Why it looked alive: README.md described the profile-level branch as $ref'ing
  # geochemProduct/schema.yaml#/$defs/universalComponentTypeBranch -- a def this file never had
  # under that name, at a block that is not where the refs point. That sentence is corrected in
  # the same commit, because leaving it would invite the next reader to put this back.
  UsedComputationalTool:
      type: object
      additionalProperties: false
      description: >-
        Computational tool actually used (acquisition, data reduction, or processing): a
        schema:instrument item of the software kind.
      properties:
        'schema:additionalType':
          description: >-
            Carries the Wikidata kind term, https://www.wikidata.org/entity/Q7397 (software), as {"@id": ...}: what makes
            this a software item of the activity's schema:instrument.
          type: array
          items:
            $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/cdifDataType/cdifConceptOrTermOrString/schema.yaml
        '@type':
          type: array
          items:
            type: string
          contains:
            const: schema:SoftwareApplication
        '@id':
          type: string
        'schema:name':
          type: string
        'schema:version':
          type: string
        'schema:url':
          type: string
          format: uri
        'schema:description':
          type: string
        'ada:toolRole':
          type: string
          enum:
            - acquisition
            - dataReduction
            - processing
            - visualization
      required:
        - '@type'
        - schema:name
  UsedReagent:
      type: object
      additionalProperties: false
      description: >-
        Reference material, calibration standard, or chemical reagent actually used: a
        schema:instrument item of the reagent kind.
      properties:
        'schema:additionalType':
          description: >-
            Carries the Wikidata kind term, https://www.wikidata.org/entity/Q2356542 (chemical reagent), as {"@id": ...}: what makes
            this a reagent item of the activity's schema:instrument.
          type: array
          items:
            $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/cdifDataType/cdifConceptOrTermOrString/schema.yaml
        '@type':
          type: array
          items:
            type: string
          minItems: 1
          description: >-
            What the material IS, independent of the role it plays in this run (that
            is ada:reagentRole). schema:DefinedTerm for a material identified by a
            registry entry (GeoReM, NIST SRM, USGS); schema:Product for a specific
            catalogued specimen or purchased lot; schema:ChemicalSubstance for a
            bulk chemical or coating stock.
          contains:
            enum:
              - schema:DefinedTerm
              - schema:Product
              - schema:ChemicalSubstance
        '@id':
          type: string
        'schema:name':
          type: string
        'schema:description':
          type: string
        'schema:identifier':
          description: Formal identifier (IGSN, catalog number, GeoReM ID).
          anyOf:
            - type: string
            - type: object
              additionalProperties: false
              properties:
                '@type':
                  type: array
                  items:
                    type: string
                  minItems: 1
                'schema:propertyID':
                  $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/cdifDataType/cdifConceptOrTermOrString/schema.yaml
                'schema:value':
                  type: string
        'schema:termCode':
          type: string
          description: Registry code for the material on the schema:DefinedTerm path.
        'schema:inDefinedTermSet':
          description: The registry the schema:termCode belongs to.
          anyOf:
            - type: string
              format: uri
            - type: object
              additionalProperties: false
              properties:
                '@id':
                  type: string
                  format: uri
                'schema:name':
                  type: string
        'ada:reagentRole':
          type: string
          enum:
            - primaryStandard
            - secondaryStandard
            - interferenceStandard
            - blankMaterial
            - coatingMaterial
            - referenceMaterial
            - reagent
      required:
        - '@type'
        - schema:name
  PropertyValueEntry:
    description: >-
      One entry of a schema:additionalProperty array: a named value carried on the dataset, on an
      analysis, or on a sample. The three sites above delegate their per-technique CONTENT to the
      technique profiles -- which property names are allowed, and with what values -- and this
      def supplies only the ENTRY SHAPE those names are carried in, so that a placement path such
      as `schema:additionalProperty[schema:name='Map Area'].schema:value` names something the
      schema has heard of.

      Measured across all 2047 additionalProperty entries in this repository's examples
      (2026-10-08): every one carries both '@type' and 'schema:name', and none carries a property
      outside the set below, so the two required keys are measured rather than assumed. '@type' is
      always a one-element array.

      DELIBERATELY NOT SEALED. additionalProperties is left open so a technique profile can add a
      property without every consumer of this block having to learn about it first -- the same
      reason the sites delegate in the first place. The consequence is that a MISSPELLED property
      here still validates; what this def buys is that the register's path checker
      (amds-ldeo/metadata, loaders/map_subject_keys.py) can now tell a real typo from a node that
      simply declares nothing. Before it existed, those two were the same report, and 18 correct
      paths were indistinguishable from a wrong one.
    type: object
    properties:
      '@id':
        description: >-
          Identifier for this entry, so it can be referenced -- typically the CURIE of the
          parameter it instantiates, e.g. ada:parameter/labxctTAPP/xrayEnergy. Not a resolvable
          URL, so no format assertion.
        type: string
      '@type':
        type: array
        minItems: 1
        items:
          type: string
        contains:
          enum:
          - schema:PropertyValue
          - schema:PropertyValueSpecification
      'schema:name':
        description: Human-readable label, matching the TAPP Metadata Item where one exists.
        type: string
        minLength: 1
      'schema:value':
        description: >-
          The value. Left untyped on purpose: measured as string, integer and number across the
          examples, and a technique profile is the right place to pin one.
      'schema:propertyID':
        description: >-
          URI(s) identifying this property in a vocabulary. Always an array of IRI-reference
          objects where present; left unconstrained here because the profiles that care already
          constrain it.
      'schema:unitText':
        description: Unit the value is expressed in, as written.
        type: string
      'schema:description':
        type: string
      'schema:valueName':
        description: Machine-readable name, for serialization and form binding.
        type: string
      'schema:defaultValue':
        description: Value carried into an analysis from the procedure, where the entry is a spec.
      'ada:dataType':
        type: string
      'ada:fieldScope':
        type: string
    required:
    - '@type'
    - schema:name

