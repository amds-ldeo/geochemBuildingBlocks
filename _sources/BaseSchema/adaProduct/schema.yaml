$schema: https://json-schema.org/draft/2020-12/schema
$id: https://w3id.org/adaJSONLD/schema/3.0
title: Astromat Archive Product Metadata
description: >-
  Schema for JSON metadata documenting products in Astromat Data Archive (ADA).
  Extends the domain-neutral geochemProduct base with the ADA/SAMIS submission and
  delivery layer: the ADA product-type vocabulary, the SAMIS submissionType, the
  ada:componentType file-classification scheme (on monolithic distributions and on
  each bundle member), and the adaProduct profile conformance. All of the generic
  analytical surface -- analysis events (prov:wasGeneratedBy), variables measured,
  distributions, spatial / temporal / quality coverage -- is inherited unchanged
  from geochemProduct. Version 3.0 aligned with CDIF 2026.
type: object
allOf:
  # Inherit the entire generic geochem analytical product (which itself composes
  # cdifCore + cdifDataDescription + cdifManifest + cdifProvenance).
  - $ref: ../geochemProduct/schema.yaml
  # ADA / SAMIS submission + delivery layer.
  - type: object
    properties:
      "schema:additionalType":
        type: array
        description: >-
          Should have the ada product type and 'ada:DataDeliveryPackage'. The
          product type is a free label and stays a string -- `contains` below
          keys on it. 'ada:DataDeliveryPackage' is a CURIE, so it may also be
          written as a JSON-LD IRI reference, which is what CDIF's
          schemaorgProperties/additionalProperty SHACL asks for.
        items:
          $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/cdifDataType/cdifConceptOrTermOrString/schema.yaml
        schema:inDefinedTermSet: ada:vocab/productType
        contains:
          enum:
            # ada:productType/40ar39arGeochronologyAndThermochronology
            - "40Ar/39Ar geochronology and thermochronology"
            - "40Ar/39Ar Geochronology and Thermochronology (ARGT)"
