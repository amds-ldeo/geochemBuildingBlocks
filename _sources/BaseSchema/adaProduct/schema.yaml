$schema: https://json-schema.org/draft/2020-12/schema
$id: https://w3id.org/adaJSONLD/schema/3.0
title: Astromat Archive Product Metadata
description: >-
  Schema for JSON metadata documenting products in Astromat Data Archive (ADA).
  Each project consists of one or more data files and 0 to many supplemental files.
  Each file MUST have an associated YAML metadata file, with the same name,
  but '.yaml' as the file extension. Version 3.0 aligned with CDIF 2026 schema
  for DDI-CDI variable types and CSVW tabular data properties.
type: object
allOf:
  - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifCore/schema.yaml
  - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifDataDescription/schema.yaml
  # cdifManifest is the BUNDLE/archive profile: it applies (and its manifest/1.1
  # conformance is required) ONLY when a distribution is positively typed as a
  # bundle/archive — schema:Collection in @type (alongside schema:DataDownload),
  # symmetric with the monolithic cdi:PhysicalDataSet marker. A monolithic
  # single-file distribution is not an archive, so it is not held to the manifest
  # profile. (The bundle case declares manifest/1.1 in conformsTo and enumerates its
  # members in schema:hasPart, per the upstream cdifManifest schema:Collection trigger.)
  - if:
      properties:
        "schema:distribution":
          type: array
          contains:
            type: object
            properties:
              "@type":
                type: array
                contains:
                  const: "schema:Collection"
            required:
              - "@type"
    then:
      $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifManifest/schema.yaml
  - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifProvenance/schema.yaml
  - type: object
    properties:
      "@type":
        type: array
        items:
          type: string
          enum:
            - "schema:Dataset"
            - "schema:Product"
      "schema:additionalType":
        type: array
        description: >-
          Should have the ada product type and 'ada:DataDeliveryPackage'
        items:
          type: string
        contains:
          enum:
            # ARGT
            - "40Ar/39Ar Geochronology and Thermochronology (ARGT)"
            - "40Ar/39Ar geochronology and thermochronology"
            # AMS
            - "Accelerator Mass Spectrometry (AMS)"
            - "Accelerator Mass Spectrometry"
            # AIVA
            - "Advanced Imaging and Visualization of Astromaterials (AIVA)"
            - "Analysis Advanced Imaging and Visualization of Astromaterials (AIVA)"
            - "Advanced Imaging & Visualization of Astromaterials"
            # VLM Basemap
            - "Basemap"
            # DSC
            - "Differential Scanning Calorimetry (DSC)"
            - "Differential Scanning Calorimetry"
            # EMPA
            - "Electron Microprobe Analysis (EMPA) Collection"
            - "Electron Microprobe Analysis Image (EMPA)"
            - "Electron Microprobe Analysis Quantitative Elemental Abundances (EMPAQEA)"
            - "Electron Microprobe Analysis (EMPA)"
            - "Electron microprobe analysis"
            # EA-IRMS
            - "Elemental Analysis-Isotope Ratio Mass Spectrometry (EA-IRMS)"
            - "Elemental analysis - isotope ratio mass spectrometry"
            # UVFM
            - "Fluorescence Microscopy (UVFM) Image"
            - "UV Fluorescence Microscopy"
            # FTICRMS
            - "Fourier Transform Ion Cyclotron Resonance Mass Spectrometry (FTICRMS) Cube"
            - "Fourier Transform Ion Cyclotron Resonance Mass Spectrometry (FTICRMS) Tabular"
            - "Fourier Transform Ion Cyclotron Resonance Mass Spectrometry"
            # GCMS
            - "Gas Chromatography-Mass Spectrometry (GCMS)"
            - "Gas Chromatography-Mass Spectrometry"
            # GPYC
            - "Gas Pycnometry (GPYC) Processed"
            - "Gas Pycnometry (GPYC) Raw"
            - "Gas pycnometry"
            # ICPMS (HR)
            - "High-resolution Inductively Coupled Plasma Mass Spectroscopy (HRICPMS) Processed"
            - "High-resolution Inductively Coupled Plasma Mass Spectroscopy (HRICPMS) Raw"
            - "High-resolution inductively coupled plasma mass spectrometry"
            # LA-ICPMS
            - "Laser Ablation Quadrupole Inductively Coupled Plasma Mass Spectrometry (LAQICPMS) Processed"
            - "Laser Ablation Quadrupole Inductively Coupled Plasma Mass Spectrometry (LAQICPMS) Raw"
            - "Laser Ablation Sector-Field Inductively Coupled Plasma Mass Spectrometry (LASFICPMS) Processed"
            - "Laser Ablation Sector-Field Inductively Coupled Plasma Mass Spectrometry (LASFICPMS) Raw"
            - "Laser Ablation Quadrupole Inductively Coupled Plasma Mass Spectrometry"
            - "Laser Ablation Sector-Field Inductively Coupled Plasma Mass Spectrometry"
            # ICPOES
            - "Inductively Coupled Plasma - Optical Emission Spectroscopy (ICPOES) Intermediate"
            - "Inductively Coupled Plasma - Optical Emission Spectroscopy (ICPOES) Processed"
            - "Inductively Coupled Plasma - Optical Emission Spectroscopy (ICPOES) Raw"
            - "Inductively coupled plasma - optical emission spectrometry"
            # IC
            - "Ion Chromatography (IC)"
            - "Ion Chromatography"
            # LAF
            - "Laser Assisted Fluorination (LAF) Processed"
            - "Laser Assisted Fluorination (LAF) Raw"
            - "Laser Assisted Fluorination for Bulk Oxygen Isotope Ratio Measurements"
            # LCMS
            - "Liquid Chromatography - Mass Spectrometry (LCMS) Collection"
            - "Liquid Chromatography-Mass Spectrometry"
            # LIT
            - "Lock-In Thermography (LIT) Collection"
            - "Lock-In Thermography (LIT) image"
            - "Lock-In Thermography"
            # L2MS
            - "Microprobe Two-Step Laser Mass Spectrometry (L2MS)"
            - "Microprobe Two-Step Laser Mass Spectrometry"
            # ICPMS (MC)
            - "Multi-Collector Inductively Coupled Plasma Mass Spectrometry (MCICPMS) processed"
            - "Multi-Collector Inductively Coupled Plasma Mass Spectrometry (MCICPMS) Raw"
            - "Multi-Collector Inductively Coupled Plasma Mass Spectrometry"
            # NanoIR
            - "Nanoscale Infrared Mapping (NanoIR) Background"
            - "Nanoscale Infrared Mapping (NanoIR) MapCollection"
            - "Nanoscale Infrared Mapping (NanoIR) Point Data"
            - "Nanoscale Infrared Mapping"
            # NanoSIMS
            - "Nanoscale Secondary Ion Mass Spectrometry (NanoSIMS) Image"
            - "Nanoscale Secondary Ion Mass Spectrometry (NanoSIMS) Raw"
            - "Nanoscale Secondary Ion Mass Spectrometry (NanoSIMS) Tabular"
            - "Nanoscale secondary ion mass spectrometry"
            # NGNSMS
            - "Noble Gas and Nitrogen Static Mass Spectrometry (NGNSMS) Raw"
            - "Noble Gas and Nitrogen Static Mass Spectrometry (NGNSMS) Processed"
            - "Noble gas and Nitrogen Static Mass Spectrometry"
            # PSFD
            - "Particle Size Frequency Distribution (PSFD)"
            - "Particle Size Frequency Distribution"
            # ICPMS (Q)
            - "Quadrupole Inductively Coupled Plasma Mass Spectrometry (QICPMS) Processed"
            - "Quadrupole Inductively Coupled Plasma Mass Spectrometry (QICPMS) Raw"
            - "Quadrupole Inductively Coupled Plasma Mass Spectrometry"
            # QRIS
            - "Quantitative Reflective Imaging System (QRIS)"
            - "Quantitative Reflective Imaging System (QRIS) Calibrated"
            - "Quantitative Reflectance Imaging System"
            # RAMAN
            - "Raman vibrational spectroscopy"
            # RITOFNGMS
            - "Resonance ionization time of flight noble gas mass spectrometry (RITOFNGMS) Processed"
            - "Resonance ionization time of flight noble gas mass spectrometry (RITOFNGMS) Spectra"
            - "Resonance ionization time of flight noble gas mass spectrometry"
            # SEM
            - "Scanning Electron Microscopy (SEM) Image"
            - "Scanning Electron Microscopy Electron Backscatter Diffraction (SEMEBSD) Grain Image"
            - "Scanning Electron Microscopy Energy Dispersive X-ray Spectroscopy (SEMEDS) Point Data"
            - "Scanning Electron Microscopy Energy Dispersive X-ray Spectroscopy (SEMEDS) image"
            - "Scanning Electron Microscopy High Resolution Cathodoluminescence (SEMHRCL) image"
            - "Scanning electron microscopy"
            - "Focused ion beam-scanning electron microscopy"
            # STEM (TEM)
            - "Scanning Transmission Electron Microscopy (STEM) Image"
            - "Scanning Transmission Electron Microscopy Electron Energy-loss Spectra (STEMEELS) Cube"
            - "Scanning Transmission Electron Microscopy Electron Energy-loss Spectra (STEMEELS) Tabular"
            - "Scanning Transmission Electron Microscopy Energy Dispersive X-ray Spectroscopy (STEMEDS) Cube"
            - "Scanning Transmission Electron Microscopy Energy Dispersive X-ray Spectroscopy (STEMEDS) Tabular"
            - "Scanning Transmission Electron Microscopy Energy Dispersive X-ray Spectroscopy (STEMEDS) Tomography"
            # SIMS
            - "Secondary Ion Mass Spectrometry (SIMS) Tabular"
            - "Secondary ion mass spectrometry"
            # SVRUEC
            - "Seismic Velocities and Rock Ultrasonic Elastic Constants (SVRUEC)"
            - "Seismic Velocities and Rock Ultrasonic Elastic Constants"
            # SLS
            - "Structured Light Scanning (SLS) Individual Scan Collection"
            - "Structured Light Scanning (SLS) Shape Model"
            - "Structured Light Scanning"
            # ToFSIMS
            - "Time-of-flight secondary ion mass spectrometry (TOFSIMS)"
            - "Time-of-Flight Secondary Ion Mass Spectrometer"
            # TEM
            - "Transmission Electron Microscopy (TEM) Image"
            - "Transmission Electron Microscopy (TEM) Patterns Image"
            - "Transmission Electron Microscopy"
            # VLM
            - "Visible Light Microscopy (VLM) Image"
            - "Visible Light Microscopy"
            - "Visible Light Microscopy Basemap"
            # VNMIR
            - "Visible, near-infrared, and mid-infrared Spectroscopy (VNMIR) Point"
            - "Visible, near-, and mid-infrared spectroscopy"
            # XANES
            - "X-ray Absorption Near Edge Structure Hyperspectral Image Stack (XANES)"
            - "X-ray absorption near edge structure (XANES) spectroscopy"
            # XCT
            - "X-ray Computed Tomography (XCT) Image Collection"
            - "X-ray computed tomography"
            # XRD
            - "X-ray Diffraction (XRD) Tabular"
            - "X-ray diffraction"
        minItems: 2
      submissionType:
        type: string
      "schema:license":
        description: Legal statement of conditions for use and access
        type: array
        minItems: 0
        items:
          anyOf:
            - type: string
            - $ref: ../creativeWork/schema.yaml
      "schema:relatedLink":
        type: array
        description: Links to related resources at the product level
        items:
          type: object
          properties:
            "@type":
              type: array
              items:
                type: string
              contains:
                const: "schema:LinkRole"
              minItems: 1
            "schema:linkRelationship":
              type: string
            "schema:target":
              type: object
              properties:
                "@type":
                  type: array
                  items:
                    type: string
                  contains:
                    const: "schema:EntryPoint"
                  minItems: 1
                "schema:encodingFormat":
                  type: string
                "schema:name":
                  type: string
                "schema:url":
                  type: string
      "schema:creativeWorkStatus":
        type: string
      "schema:measurementTechnique":
        type: array
        items:
          type: object
          description: Text description of the measurement method
          properties:
            "@type":
              type: array
              items:
                type: string
              contains:
                const: "schema:DefinedTerm"
              minItems: 1
            "schema:name":
              type: string
            "schema:identifier":
              type: string
      "prov:wasGeneratedBy":
        description: >-
          ADA analysis events. Extends cdifProvActivity (from cdifProvenance) with
          ADA-specific instrument, laboratory, and sample properties.
        type: array
        items:
          type: object
          properties:
            "prov:used":
              type: array
              description: >-
                Resources used in the analysis. Each item is one of: an instrument
                BB instance; a computational tool actually used (schema:SoftwareApplication);
                a reagent / reference material actually used; a tappDefinition BB
                instance (inlined); or an @id reference to a TAPP definition node
                defined elsewhere. The TAPP plan (prov:Plan / bios:LabProtocol)
                prescribes the generic instrument / computationalTool / reagent
                list; these prov:used entries record the ACTUALS used in this
                specific run (tool versions, reagent lots, and their run roles),
                mirroring how the instrument is already recorded here. Technique
                profiles narrow the tappDefinition branch to their specific TAPP.
              items:
                anyOf:
                  - $ref: ../instrument/schema.yaml
                  # ComputationalTool actually used — mirrors tappDefinition
                  # $defs/ComputationalTool (kept inline; no cross-file $def refs
                  # in this repo). The plan prescribes tools; this records the
                  # actual tool + version + run role used.
                  - type: object
                    description: Computational tool actually used (acquisition, data reduction, or processing).
                    properties:
                      '@type':
                        type: array
                        items:
                          type: string
                        contains:
                          const: schema:SoftwareApplication
                      '@id':
                        type: string
                      'schema:name':
                        type: string
                      'schema:version':
                        type: string
                      'schema:url':
                        type: string
                        format: uri
                      'schema:description':
                        type: string
                      'ada:toolRole':
                        type: string
                        enum:
                          - acquisition
                          - dataReduction
                          - processing
                          - visualization
                    required:
                      - schema:name
                  # Reagent / reference material actually used — mirrors
                  # tappDefinition $defs/Reagent.
                  - type: object
                    description: Reference material, calibration standard, or chemical reagent actually used.
                    properties:
                      '@type':
                        type: array
                        items:
                          type: string
                        minItems: 1
                      '@id':
                        type: string
                      'schema:name':
                        type: string
                      'schema:description':
                        type: string
                      'schema:identifier':
                        anyOf:
                          - type: string
                          - type: object
                      'ada:reagentRole':
                        type: string
                        enum:
                          - primaryStandard
                          - secondaryStandard
                          - interferenceStandard
                          - blankMaterial
                          - coatingMaterial
                          - reagent
                    required:
                      - schema:name
                  - type: object
                    additionalProperties: false
                    description: Reference by node @id to a TAPP definition object defined elsewhere.
                    properties:
                      '@id':
                        type: string
                        format: uri
                    required:
                      - '@id'
                  - $ref: ../tappDefinition/schema.yaml
            "schema:location":
              $ref: ../laboratory/schema.yaml
            "schema:object":
              type: array
              description: Samples analyzed
              items:
                type: object
                properties:
                  "@type":
                    type: array
                    items:
                      type: string
                    allOf:
                    - contains:
                        const: "schema:Thing"
                    - contains:
                        const: "https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample"
                    minItems: 2
                  "schema:additionalType":
                    type: array
                    items:
                      type: string
                  "schema:identifier":
                    type: array
                    items:
                      type: string
                  "schema:name":
                    description: Sample name/identifier as used in the lab.
                    type: string
                  "schema:additionalProperty":
                    description: Per-sample PropertyValue entries (e.g. analysis location); technique profiles constrain these.
                    type: array
                    items:
                      type: object
            "schema:identifier":
              description: >-
                The analytical session's own identifier — the laboratory's run, sequence or batch
                identifier as generated by the instrument or acquisition software. Sits on the
                activity rather than the dataset because the session IS the activity: it is what
                schema:startDate and schema:endDate already bound, and one session can produce
                several datasets that all cite the same run.
              type: string
            "schema:startDate":
              type: string
            "schema:endDate":
              type: string
            "schema:additionalProperty":
              description: Per-analysis PropertyValue entries (replicates, transect length, …); technique profiles constrain these.
              type: array
              items:
                type: object
          required:
            - "prov:used"
      "schema:variableMeasured":
        description: >-
          ADA variable definitions. Extends cdifInstanceVariable (from cdifDataDescription)
          with additional ADA properties. Requires description with minLength 10.
        type: array
        items:
          type: object
          properties:
            "schema:description":
              type: string
              minLength: 3
            "schema:alternateName":
              type: array
              items:
                type: string
                description: Human intelligible name for variable that conveys semantics
            "schema:measurementTechnique":
              type: array
              items:
                anyOf:
                  - type: string
                  - type: object
                    required: ['@id']
                    additionalProperties: false
                    properties:
                      "@id":
                        type: string
                  - type: object
                    properties:
                      "@type":
                        type: array
                        items:
                          type: string
                        contains:
                          const: "schema:DefinedTerm"
                        minItems: 1
                      "schema:name":
                        type: string
                    required:
                      - "@type"
                      - "schema:name"
            "schema:unitText":
              type: string
            "schema:unitCode":
              anyOf:
                - type: string
                - type: object
                  required: ['@id']
                  additionalProperties: false
                  properties:
                    "@id":
                      type: string
                - type: object
                  properties:
                    "@type":
                      type: array
                      items:
                        type: string
                      contains:
                        const: "schema:DefinedTerm"
                      minItems: 1
                    "schema:name":
                      type: string
                  required:
                    - "@type"
                    - "schema:name"
            "schema:minValue":
              type: number
            "schema:maxValue":
              type: number
            "schema:url":
              type: string
              format: uri
          required:
            - "schema:description"
      "schema:spatialCoverage":
        description: Geographic extent of resource content.
        type: array
        items:
          $ref: '#/$defs/SpatialExtent'
      "schema:temporalCoverage":
        description: Temporal extent of resource content.
        type: array
        items:
          $ref: '#/$defs/TemporalExtent'
      "dqv:hasQualityMeasurement":
        description: Quality measurements reported to assess the resource.
        type: array
        items:
          $ref: '#/$defs/QualityMeasure'
      "schema:additionalProperty":
        description: >-
          PropertyValue entries describing the DELIVERED DATA rather than the analysis that
          produced it — the area a map covers, the pixel dimensions of a reconstructed volume, how
          many sub-volumes it was written as. Distinct from the per-analysis
          prov:wasGeneratedBy.schema:additionalProperty, which records how the instrument was
          configured for the session: one session can yield products of differing extent, and a
          product carries these properties whether or not its provenance is described at all.
          Technique profiles constrain these.
        type: array
        items:
          type: object
      "schema:distribution":
        description: >-
          A distribution is EITHER a MONOLITHIC single-file dataset — a
          schema:DataDownload that carries its own ada:componentType and, when its
          structure is described, cdi:isStructuredBy, with NO schema:hasPart — OR a
          BUNDLE/archive — a schema:DataDownload whose schema:hasPart lists the
          member files, each a schema:MediaObject carrying its own ada:componentType
          (the ADA SAMIS delivery pattern). DataDownload/WebAPI are inherited from
          cdifCore and the archive hasPart from cdifManifest; the monolithic form is
          the XAS/NeXus single-file pattern (structure sits on the distribution
          because the file IS the dataset, so a part would only repeat it).
        type: array
        items:
          type: object
          properties:
            "ada:componentType":
              type: string
              description: >-
                ADA file-type classification for a MONOLITHIC single-file
                distribution — it classifies the file that IS the dataset. On a
                bundle this sits on each schema:hasPart member instead, not here.
                Technique profiles narrow it (universal enum, or a technique detail
                schema) in both positions.
            "cdi:isStructuredBy":
              description: >-
                Data-structure description of a MONOLITHIC single-file distribution
                (the file is the dataset), or a structure shared across bundle parts
                and referenced from them by @id. One of the four CDIF DataStructure
                variants inline, or an @id reference. Optional: absent when the
                structure is not described (detect, don't assert).
              anyOf:
                - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifDataStructure/schema.yaml#/$defs/DataStructure
                - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifDataStructure/schema.yaml#/$defs/DimensionalDataStructure
                - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifDataStructure/schema.yaml#/$defs/LongDataStructure
                - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifDataStructure/schema.yaml#/$defs/WideDataStructure
                - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifDataStructure/schema.yaml#/$defs/id-reference
            "schema:hasPart":
              items:
                allOf:
                  - $ref: ../files/schema.yaml
                  - type: object
                    properties:
                      "ada:componentType":
                        type: string
                        description: >-
                          ADA file-type classification, expressed as a single
                          string drawn from a universal set or a technique-specific
                          set. Technique profiles add an anyOf at the hasPart
                          level: one branch declares the universal componentType
                          enum; other branches $ref technique-specific detail
                          schemas (e.g. detailEMPA) that enumerate technique
                          componentType values and contribute detail-specific
                          sibling properties (e.g. ada:spectrometersUsed).
          allOf:
            # pattern-per-datatype: a MONOLITHIC single-file distribution that is a
            # tabular text file validates its CSVW/DDI-CDI layout + per-column
            # cdif:hasPhysicalMapping via cdifTabularData. (cdi:isStructuredBy above
            # covers container/array single files.) A bundle DataDownload is an
            # archive, not itself tabular, so this never fires there.
            - if:
                properties:
                  "@type":
                    type: array
                    contains:
                      const: "cdi:TabularTextDataSet"
              then:
                $ref: ../tabularData/schema.yaml
      "schema:subjectOf":
        properties:
          "dcterms:conformsTo":
            contains:
              type: object
              required: ['@id']
              additionalProperties: false
              properties:
                "@id":
                  const: "https://w3id.org/geochem/metadata/profiles/adaProduct"
$defs:
  SpatialExtent:
    $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/schemaorgProperties/spatialExtent/schema.yaml
  TemporalExtent:
    $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/schemaorgProperties/temporalExtent/schema.yaml
  QualityMeasure:
    $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/qualityProperties/qualityMeasure/schema.yaml
  universalComponentTypeBranch:
    description: >-
      Wrapper for use as one branch of a profile's schema:hasPart.items.anyOf.
      Constrains ada:componentType to the universal enum and marks it required.
      Factored out of every profile to eliminate the inline boilerplate.
    properties:
      'ada:componentType':
        $ref: '#/$defs/universalComponentType'
    required:
      - 'ada:componentType'
  universalComponentType:
    description: >-
      ada:componentType values valid across all ADA techniques. As a string,
      directly assignable to the part's ada:componentType property. Profiles
      use this $def (typically via the universalComponentTypeBranch wrapper)
      in their hasPart anyOf branches.
    type: string
    enum:
      - "ada:analysisLocation"
      - "ada:annotatedImage"
      - "ada:areaOfInterest"
      - "ada:basemap"
      - "ada:calibrationFile"
      - "ada:code"
      - "ada:contextPhotography"
      - "ada:contextVideo"
      - "ada:inputFile"
      - "ada:instrumentMetadata"
      - "ada:logFile"
      - "ada:methodDescription"
      - "ada:other"
      - "ada:plot"
      - "ada:processingMethod"
      - "ada:quickLook"
      - "ada:report"
      - "ada:samplePreparation"
      - "ada:shapefile"
      - "ada:supplementalBasemap"
      - "ada:supplementaryImage"
      - "ada:worldFile"
