        minItems: 2
      submissionType:
        type: string
      "schema:distribution":
        description: >-
          ADA delivery view: adds the ada:componentType file-classification to the
          generic distribution structure inherited from geochemProduct. A
          distribution is EITHER a MONOLITHIC single-file dataset -- a
          schema:DataDownload that carries its own ada:componentType (and, when its
          structure is described, cdi:isStructuredBy from the base), with NO
          schema:hasPart -- OR a BUNDLE/archive -- a schema:DataDownload whose
          schema:hasPart lists member files, each a schema:MediaObject carrying its
          own ada:componentType (the ADA SAMIS delivery pattern).
        type: array
        items:
          type: object
          properties:
            "ada:componentType":
              type: string
              schema:inDefinedTermSet: "ada:vocab/componentType"
              description: >-
                ADA file-type classification for a MONOLITHIC single-file
                distribution -- it classifies the file that IS the dataset. On a
                bundle this sits on each schema:hasPart member instead, not here.
                Values are drawn from the componentType vocabulary
                (ada:vocab/componentType); conformance is advisory (annotated via
                schema:inDefinedTermSet), not hard-enumerated in JSON Schema.
            "schema:hasPart":
              items:
                allOf:
                  - $ref: ../files/schema.yaml
                  - type: object
                    properties:
                      # The CDIF-native slot for the same classification. Annotated with the
                      # vocabulary, NOT enumerated: conformance here is advisory, exactly as
                      # ada:componentType below has always been. Narrowing is available -- the
                      # base admits a bare string, so a pattern or enum would compose -- and is
                      # deliberately not used, because 122 component types across 59 techniques
                      # change faster than this schema should.
                      "schema:additionalType":
                        schema:inDefinedTermSet: "ada:vocab/componentType"
                        description: >-
                          ADA file-type classification for this bundle member, as a
                          schema:DefinedTerm drawn from ada:vocab/componentType or in the bare
                          string form. The SHAPE comes from cdifManifest's archivePartItem,
                          which geochemProduct composes for any distribution typed
                          schema:Collection; this only names the vocabulary. Supersedes
                          ada:componentType below, which stays for compatibility.
                      "ada:componentType":
                        type: string
                        description: >-
                          ADA file-type classification, expressed as a single
                          string drawn from a universal set or a technique-specific
                          set. Technique profiles add an anyOf at the hasPart level:
                          one branch declares the universal componentType enum;
                          other branches $ref technique-specific detail schemas
                          (e.g. detailEPMA) that enumerate technique componentType
                          values and contribute detail-specific sibling properties
                          (e.g. ada:spectrometersUsed).
      "schema:subjectOf":
        properties:
          "dcterms:conformsTo":
            contains:
              type: object
              required: ['@id']
              additionalProperties: false
              properties:
                "@id":
                  const: "https://w3id.org/geochem/metadata/profiles/adaProduct"
$defs:
  # --- ADA-specific: the ada:componentType file-classification scheme ---------
  universalComponentTypeBranch:
    description: >-
      Wrapper for use as one branch of a profile's schema:hasPart.items.anyOf.
      Constrains ada:componentType to the universal enum and marks it required.
      Factored out of every profile to eliminate the inline boilerplate.
    properties:
      'ada:componentType':
        $ref: '#/$defs/universalComponentType'
    required:
      - 'ada:componentType'
  universalComponentType:
    description: >-
      A componentType value drawn from the shared componentType vocabulary
      (ada:vocab/componentType). Not hard-enumerated here: conformance to the
      vocabulary is advisory (annotated via schema:inDefinedTermSet, SHACL-checkable)
      rather than enforced by JSON Schema, so techniques may extend the term set.
    type: string
    schema:inDefinedTermSet: "ada:vocab/componentType"
