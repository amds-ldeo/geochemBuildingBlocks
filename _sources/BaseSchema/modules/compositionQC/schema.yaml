    type: object
    properties:
      '@id':
        const: ada:parameter/module/CompositionQC/detectionLimitDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: detectionLimitDefault
      schema:name:
        const: Detection Limit
      ada:dataType:
        const: number
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  Param_Analysis_normalizationStandardsBasedCorrection:
    title: Normalization / Standards-Based Correction
    description: Post-acquisition normalization applied to the reported data beyond the primary calibration
      — for example correction to a reference value derived from secondary reference materials, or correction
      for a systematic bias those materials reveal. Record 'None' if no additional normalization is applied.
    type: object
    properties:
      '@id':
        const: ada:parameter/module/CompositionQC/normalizationStandardsBasedCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/module/CompositionQC/normalizationStandardsBasedCorrection
      schema:name:
        const: Normalization / Standards-Based Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  Param_Procedure_normalizationStandardsBasedCorrection:
    title: Normalization / Standards-Based Correction
    description: Post-acquisition normalization applied to the reported data beyond the primary calibration
      — for example correction to a reference value derived from secondary reference materials, or correction
      for a systematic bias those materials reveal. Record 'None' if no additional normalization is applied.
    type: object
    properties:
      '@id':
        const: ada:parameter/module/CompositionQC/normalizationStandardsBasedCorrectionDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: normalizationStandardsBasedCorrectionDefault
      schema:name:
