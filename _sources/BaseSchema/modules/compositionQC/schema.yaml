$schema: https://json-schema.org/draft/2020-12/schema
title: 'TAPP Composition Module: CompositionQC'
description: 'The shared CompositionQC block of the 2026-08-11 TAPP library (Claude Skills for TAPP/Module_CompositionQC.csv),
  composed by 12 of the sixteen delivery tables. 6 owned fields over 10 schema paths.


  GENERATED by tools/build_module_bb.py from the module''s CSV and its schema-path sidecar — edit those,
  not this file. Requiredness follows the TAPP tier matrix: a field Basic on a side is required there,
  Advanced is permitted, N/A is absent from that side entirely.


  This is a PROFILE, not a vocabulary: it asserts which properties a conforming procedure or analysis
  carries. Column F (Example / Allowed Content) is consumer-owned per the module manifest, so no enum
  is pinned here — a consuming TAPP may narrow a value space, never widen it.'
$defs:
  ProcedureIdentification:
    title: CompositionQC on the procedure
    description: 'Composed into a TAPP (prov:Plan) schema: what the procedure asserts once, for every
      analysis that follows it.'
    type: object
    properties:
      schema:variableMeasured:
        type: array
        items:
          type: object
          allOf:
          - if:
              properties:
                schema:name:
                  const: Detection Limit
              required:
              - schema:name
            then:
              properties:
                schema:defaultValue:
                  description: Detection limit, one per reported concentration variable (one per analyte,
                    these being the same set). State the units and whether the values are procedure-typical
                    estimates or session-specific measured values. The calculation method is recorded
                    separately in Detection Limit Method. Record 'N/A' where the procedure reports no
                    concentrations.
                  anyOf:
                  - type: number
                  - type: string
          - if:
              properties:
                schema:name:
                  const: Normalization / Standards-Based Correction
              required:
              - schema:name
            then:
              properties:
                schema:defaultValue:
                  description: Post-acquisition normalization applied to the reported data beyond the
                    primary calibration — for example correction to a reference value derived from secondary
                    reference materials, or correction for a systematic bias those materials reveal. Record
                    'None' if no additional normalization is applied.
                  anyOf:
                  - &id001
                    type: string
                  - type: array
                    items: *id001
      schema:actionProcess:
        type: object
        properties:
          schema:step:
            type: array
            items:
              type: object
              allOf:
              - if:
                  properties:
                    schema:name:
                      const: Data reduction
                  required:
                  - schema:name
                then:
                  properties:
                    ada:detectionLimitMethod:
                      description: Formula or approach used to calculate the detection limits, with a
                        citation for the method where one exists. Must be consistent with the values reported
                        in Detection Limit.
                      anyOf:
                      - &id002
                        type: string
                      - type: array
                        items: *id002
            allOf:
            - contains:
                properties:
                  schema:name:
                    const: Data reduction
                required:
                - schema:name
      ada:secondaryReferenceMaterialDefault:
        type: array
        items:
          description: Quality-control reference material(s) measured as unknowns alongside samples to
            assess accuracy independently and to monitor drift. Give the material name, its source, and
            a citation for the accepted or reference values used for comparison.
          type: string
      ada:primaryStandardNameDefault:
        description: Name and reference material identifier of the primary reference material(s) against
          which the instrument is calibrated — converting raw signal intensities to concentrations, or
          anchoring an isotope ratio as the bracketing standard or zero-delta reference. Give the material
          name, its source or supplier, and a citation for the accepted values used. Where calibration
          instead uses the vendor's stored library or theoretical response factors rather than measured
          reference materials — 'standardless' or 'semi-quantitative' quantification — record that here,
          naming the library or model used. 'None' means no calibration was performed at all, which is
          a different answer.
        type: string
    required:
    - ada:primaryStandardNameDefault
  AnalysisIdentification:
    title: CompositionQC on the analysis
    description: 'Composed into a technique detail (schema:Dataset) schema: what each run supplies fresh,
      because it cannot be known until the analysis happens.'
    type: object
    properties:
      schema:variableMeasured:
        type: array
        items:
          type: object
          allOf:
          - if:
              properties:
                schema:name:
                  const: Detection Limit
              required:
              - schema:name
            then:
              properties:
                schema:value:
                  description: Detection limit, one per reported concentration variable (one per analyte,
                    these being the same set). State the units and whether the values are procedure-typical
                    estimates or session-specific measured values. The calculation method is recorded
                    separately in Detection Limit Method. Record 'N/A' where the procedure reports no
                    concentrations.
                  anyOf:
                  - type: number
                  - type: string
          - if:
              properties:
                schema:name:
                  const: Detection Limit Method
              required:
              - schema:name
            then:
              properties:
                schema:value:
                  description: Formula or approach used to calculate the detection limits, with a citation
                    for the method where one exists. Must be consistent with the values reported in Detection
                    Limit.
                  anyOf:
                  - &id003
                    type: string
                  - type: array
                    items: *id003
          - if:
              properties:
                schema:name:
                  const: Normalization / Standards-Based Correction
              required:
              - schema:name
            then:
              properties:
                schema:value:
                  description: Post-acquisition normalization applied to the reported data beyond the
                    primary calibration — for example correction to a reference value derived from secondary
                    reference materials, or correction for a systematic bias those materials reveal. Record
                    'None' if no additional normalization is applied.
                  anyOf:
                  - &id004
                    type: string
                  - type: array
                    items: *id004
        allOf:
        - contains:
            properties:
              schema:name:
                const: Detection Limit
            required:
            - schema:name
      prov:wasGeneratedBy:
        type: array
        items:
          type: object
          properties:
            prov:used:
              type: array
              items:
                type: object
                allOf:
                - if:
                    required:
                    - prov:reagent
                  then:
                    properties:
                      prov:reagent:
                        type: array
                        items:
                          allOf:
                          - $ref: ../../geochemProduct/schema.yaml#/$defs/UsedReagent
                          - type: object
                            allOf:
                            - if:
                                properties:
                                  ada:reagentRole:
                                    const: referenceMaterial
                                required:
                                - ada:reagentRole
                              then:
                                properties:
                                  schema:name:
                                    description: Quality-control reference material(s) measured as unknowns
                                      alongside samples to assess accuracy independently and to monitor
                                      drift. Give the material name, its source, and a citation for the
                                      accepted or reference values used for comparison.
                                    anyOf:
                                    - &id005
                                      type: string
                                    - type: array
                                      items: *id005
                            - if:
                                properties:
                                  ada:reagentRole:
                                    const: primaryStandard
                                required:
                                - ada:reagentRole
                              then:
                                properties:
                                  schema:name:
                                    description: Name and reference material identifier of the primary
                                      reference material(s) against which the instrument is calibrated
                                      — converting raw signal intensities to concentrations, or anchoring
                                      an isotope ratio as the bracketing standard or zero-delta reference.
                                      Give the material name, its source or supplier, and a citation for
                                      the accepted values used. Where calibration instead uses the vendor's
                                      stored library or theoretical response factors rather than measured
                                      reference materials — 'standardless' or 'semi-quantitative' quantification
                                      — record that here, naming the library or model used. 'None' means
                                      no calibration was performed at all, which is a different answer.
                                    anyOf:
                                    - &id006
                                      type: string
                                    - type: array
                                      items: *id006
                            required:
                            - ada:reagentRole
  Param_Analysis_detectionLimit:
    title: Detection Limit
    description: Detection limit, one per reported concentration variable (one per analyte, these being
      the same set). State the units and whether the values are procedure-typical estimates or session-specific
      measured values. The calculation method is recorded separately in Detection Limit Method. Record
      'N/A' where the procedure reports no concentrations.
    type: object
    properties:
      '@id':
        const: ada:parameter/module/CompositionQC/detectionLimit
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/module/CompositionQC/detectionLimit
      schema:name:
        const: Detection Limit
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  Param_Procedure_detectionLimit:
    title: Detection Limit
    description: Detection limit, one per reported concentration variable (one per analyte, these being
      the same set). State the units and whether the values are procedure-typical estimates or session-specific
      measured values. The calculation method is recorded separately in Detection Limit Method. Record
