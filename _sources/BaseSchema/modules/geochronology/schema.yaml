$schema: https://json-schema.org/draft/2020-12/schema
title: 'TAPP Composition Module: Geochronology'
description: 'The shared Geochronology block of the 2026-08-11 TAPP library (Claude Skills for TAPP/Module_Geochronology.csv),
  composed by 3 of the sixteen delivery tables. 6 owned fields over 3 schema paths.


  GENERATED by tools/build_module_bb.py from the module''s CSV and its schema-path sidecar — edit those,
  not this file. Requiredness follows the TAPP tier matrix: a field Basic on a side is required there,
  Advanced is permitted, N/A is absent from that side entirely.


  This is a PROFILE, not a vocabulary: it asserts which properties a conforming procedure or analysis
  carries. Column F (Example / Allowed Content) is consumer-owned per the module manifest, so no enum
  is pinned here — a consuming TAPP may narrow a value space, never widen it.'
$defs:
  ProcedureIdentification:
    title: Geochronology on the procedure
    description: 'Composed into a TAPP (prov:Plan) schema: what the procedure asserts once, for every
      analysis that follows it.'
    type: object
    properties:
      ada:ageCalculationMethod:
        type: array
        items:
          description: The equation used to convert the measured quantities into an age or date, together
            with a citation for that equation. Name the equation unambiguously; where a procedure supports
            more than one, state which is used and under what conditions. Required by every geochronology
            reporting standard surveyed (Condon et al. 2024; Schaen et al. 2021; Rooney et al. 2024; Flowers
            et al. 2024; Kohn et al. 2024; Mahan et al. 2023). Distinct from Age Model and Software, which
            records how multiple analyses are combined into a single reported result.
          type: string
      ada:reportedDateType:
        type: array
        items:
          description: The kind of date or age the procedure reports. Most dating systems derive several
            different date types from the same measurements, so a reported age is ambiguous without this.
            Where more than one type is reported, list all, separated by semicolons. Kohn et al. (2024)
            carry this as a named required item ("fission-track age type"); the equivalent distinction
            is required by all five other standards surveyed.
          type: string
  AnalysisIdentification:
    title: Geochronology on the analysis
    description: 'Composed into a technique detail (schema:Dataset) schema: what each run supplies fresh,
      because it cannot be known until the analysis happens.'
    type: object
    properties:
      ada:reportedDateType:
        type: array
        items:
          description: The kind of date or age the procedure reports. Most dating systems derive several
            different date types from the same measurements, so a reported age is ambiguous without this.
            Where more than one type is reported, list all, separated by semicolons. Kohn et al. (2024)
            carry this as a named required item ("fission-track age type"); the equivalent distinction
            is required by all five other standards surveyed.
          type: string
