$schema: https://json-schema.org/draft/2020-12/schema
title: 'TAPP Composition Module: MCICPMS'
description: 'The shared MCICPMS block of the 2026-08-11 TAPP library (Claude Skills for TAPP/Module_MCICPMS.csv),
  composed by 3 of the sixteen delivery tables. 15 owned fields over 17 schema paths.


  GENERATED by tools/build_module_bb.py from the module''s CSV and its schema-path sidecar — edit those,
  not this file. Requiredness follows the TAPP tier matrix: a field Basic on a side is required there,
  Advanced is permitted, N/A is absent from that side entirely.


  This is a PROFILE, not a vocabulary: it asserts which properties a conforming procedure or analysis
  carries. Column F (Example / Allowed Content) is consumer-owned per the module manifest, so no enum
  is pinned here — a consuming TAPP may narrow a value space, never widen it.'
$defs:
  ProcedureIdentification:
    title: MCICPMS fields on the procedure
    description: 'Composed into a TAPP (prov:Plan) schema: what the procedure asserts once, for every
      analysis that follows it.'
    type: object
    properties:
      schema:additionalProperty:
        type: array
        items:
          type: object
          allOf:
          - if:
              properties:
                schema:name:
                  const: Faraday Cup Array Configuration
              required:
              - schema:name
            then:
              properties:
                schema:value:
                  description: Description of the multi-collector Faraday cup array. Specify the total
                    number of Faraday cup detectors (fixed and moveable), their labeled positions (e.g.,
                    L4, L3, L2, L1, Ax, H1, H2, H3, H4 for a 9-cup Neptune), and the presence and position
                    of any ion counter (SEM) or Daly detector in the collector block. The number and span
                    of cups constrains which isotope combinations can be simultaneously collected.
                  anyOf:
                  - &id001
                    type: string
                  - type: array
                    items: *id001
          - if:
              properties:
                schema:name:
                  const: Faraday Cup Amplifier Resistor Values
              required:
              - schema:name
            then:
              properties:
                schema:value:
                  description: Resistance values (Ω) of the feedback resistors in the Faraday cup amplifiers.
                    Standard amplifiers use 10¹¹ Ω resistors, yielding 1 V per ~6.24 × 10⁶ ion counts
                    per second. High-gain amplifiers (10¹² or 10¹³ Ω) are fitted to selected cups to improve
                    signal-to-noise for very low-intensity beams (e.g., 234U, low-abundance spike isotopes).
                    Report the resistor value per cup position, or note 'all 10¹¹ Ω' if uniform.
                  anyOf:
                  - &id002
                    type: string
                  - type: array
                    items: *id002
          - if:
              properties:
                schema:name:
                  const: Faraday Cup Gain Calibration Method
              required:
              - schema:name
            then:
              properties:
                schema:value:
                  description: 'Method used to calibrate the relative gain (amplification factor) of each
                    Faraday cup amplifier at the start of or during each analytical session. Relative
                    gain differences between amplifiers cause systematic errors in isotope ratios if uncorrected.
                    Common approaches: instrument internal gain calibration routine (measures signal in
                    each cup sequentially using a common beam), amplifier rotation procedure, or measurement
                    of a known isotope ratio solution in each cup. For instruments with SEM detectors,
                    also describes the SEM-to-Faraday cross-calibration sequence. Specify frequency (per
                    session, per block, weekly).'
                  anyOf:
                  - &id003
                    type: string
                  - type: array
                    items: *id003
          - if:
              properties:
                schema:name:
                  const: Collector Configuration
              required:
              - schema:name
            then:
              properties:
                schema:value:
                  description: 'Assignment of isotope masses to Faraday cup or ion counter detector positions
                    for this procedure. Lists the mass number monitored in each collector position (e.g.,
                    L4=116Sn, L3=117Sn, L2=118Sn, L1=119Sn, Ax=120Sn, H1=121Sb, H2=122Sn, H3=123Sb, H4=124Sn).
                    For static multi-collection procedures, one configuration applies throughout the measurement.
                    For multi-dynamic procedures, list all configurations and the cycling sequence. Includes
                    all interference-monitor masses collected in addition to analyte isotopes. Analyte-specific:
                    different element systems require different mass assignments within the collector
                    array span.'
                  anyOf:
                  - &id004
                    type: string
                  - type: array
                    items: *id004
          - if:
              properties:
                schema:name:
                  const: Number of Blocks per Measurement
              required:
              - schema:name
            then:
              properties:
                schema:defaultValue:
                  description: Number of measurement blocks acquired per sample or standard solution introduction.
                    In MC-ICP-MS, data are structured as blocks of cycles; each block typically begins
                    with a baseline (on-peak zero) measurement before the analytical cycles. Multiple
                    blocks per sample allow inspection of signal stability and within-measurement drift.
                    Procedure specifies the standard number; analyst may adjust for samples with low signal
                    or for high-precision requirements.
                  anyOf:
                  - type: integer
                  - type: string
          - if:
              properties:
                schema:name:
                  const: Number of Cycles per Block
              required:
              - schema:name
            then:
              properties:
                schema:defaultValue:
                  description: Number of measurement cycles acquired per block. One cycle corresponds
                    to a single set of simultaneous Faraday cup readings integrated for the duration specified
                    in Integration Time per Cycle. Total integration time per sample = (Number of Cycles
                    per Block) × (Integration Time per Cycle) × (Number of Blocks per Measurement). Procedure
                    specifies the standard value; analyst may adjust within procedure bounds.
                  anyOf:
                  - type: integer
                  - type: string
          - if:
              properties:
                schema:name:
                  const: Integration Time per Cycle
              required:
              - schema:name
            then:
              properties:
                schema:defaultValue:
                  description: Duration of signal integration per measurement cycle (seconds). Determines
                    counting statistics per cycle. Longer integration times improve shot-noise precision
                    but increase the impact of signal drift within the integration window. For high-gain
                    (10¹² or 10¹³ Ω) amplifier channels, longer integration times are often required to
                    accumulate sufficient charge. Procedure specifies the standard integration time; analyst
                    may confirm or adjust within procedure bounds. Analyte-specific when different isotope
                    channels use different integration schemes.
                  anyOf:
                  - type: number
                  - type: string
          - if:
              properties:
                schema:name:
                  const: Baseline Measurement Approach
              required:
              - schema:name
            then:
              properties:
                schema:value:
                  description: 'Method and timing for measuring the ion beam baseline (on-peak zero) during
                    acquisition, and the portion of the acquisition it is taken from. Three approaches
                    are in use and the choice depends on how sample reaches the plasma: deflecting the
                    ion beam (beam-off or electrostatic deflector); aspirating an acid blank, which applies
                    only to solution introduction; or, for laser ablation, collecting a defined number
                    of laser-off cycles at the start of the same block, since no blank can be aspirated
                    mid-ablation. State which, and how many cycles or how long.'
                  anyOf:
                  - &id005
                    type: string
                  - type: array
                    items: *id005
          - if:
              properties:
                schema:name:
                  const: Mass Fractionation Law
              required:
              - schema:name
            then:
              properties:
                schema:value:
                  description: Mathematical law used to parameterize instrumental isotope mass fractionation
                    as a function of mass difference. The exponential law (Maréchal et al. 1999) is most
                    widely used and theoretically best justified for MC-ICP-MS. The linear law assumes
                    fractionation proportional to mass difference. The power law is an alternative formulation.
                    For double-spike procedures, the law is embedded in the inversion algorithm and must
                    be consistent between spike calibration and sample data reduction.
                  anyOf:
                  - &id006
                    type: string
                  - type: array
                    items: *id006
          - if:
              properties:
                schema:name:
                  const: Double Spike Isotope Pair
              required:
              - schema:name
            then:
              properties:
                schema:value:
                  description: The pair of enriched isotopes used to construct the double spike. Both
                    isotopes must be naturally rare, free from isobaric interferences, and chosen to minimize
                    error magnification in the inversion. The double spike composition must be accurately
                    calibrated before use. Specify both isotope masses and the spike certificate or calibration
                    reference. Record 'N/A' if double-spike method is not used. Record 'N/A' where the
                    procedure does not use a double spike.
                  anyOf:
                  - &id007
                    type: string
                  - type: array
                    items: *id007
          - if:
              properties:
                schema:name:
                  const: Double Spike Mixing Ratio
              required:
              - schema:name
            then:
              properties:
                schema:defaultValue:
                  description: Target proportion of double-spike signal relative to total analyte signal
                    in the spiked mixture, expressed as spike fraction (0–1) or spike:sample ratio. An
                    optimal mixing ratio minimizes error propagation through the double-spike inversion;
                    the optimum is analyte-system specific and is typically determined using the Double
                    Spike Toolbox or equivalent. The achieved mixing ratio may deviate from the target
                    within acceptable bounds (typically ±20% of optimal); the double-spike inversion corrects
                    for actual mixing ratios. Record 'N/A' if double-spike method is not used. Record
                    'N/A' where the procedure does not use a double spike.
                  anyOf:
                  - &id008
                    type: string
                  - type: array
                    items: *id008
          - if:
              properties:
                schema:name:
                  const: Double Spike Inversion Algorithm
              required:
              - schema:name
            then:
              properties:
                schema:value:
                  description: 'Mathematical algorithm used to simultaneously solve for the true sample
                    isotope ratio and the mass fractionation factor from the measured spike-sample mixture.
                    Common implementations: iterative Newton-Raphson solution, matrix algebraic approach,
                    or published software (e.g., Rudge et al. 2009 Double Spike Toolbox). Specify the
                    algorithm or software reference and version. Record ''N/A'' if double-spike method
                    is not used. Record ''N/A'' where the procedure does not use a double spike.'
                  anyOf:
                  - &id009
                    type: string
                  - type: array
                    items: *id009
        allOf:
        - contains:
            properties:
              schema:name:
                const: Faraday Cup Array Configuration
            required:
            - schema:name
        - contains:
            properties:
              schema:name:
                const: Faraday Cup Amplifier Resistor Values
            required:
            - schema:name
        - contains:
            properties:
              schema:name:
                const: Faraday Cup Gain Calibration Method
            required:
            - schema:name
        - contains:
            properties:
              schema:name:
                const: Collector Configuration
            required:
            - schema:name
        - contains:
            properties:
              schema:name:
                const: Number of Blocks per Measurement
            required:
            - schema:name
        - contains:
            properties:
              schema:name:
                const: Number of Cycles per Block
            required:
            - schema:name
        - contains:
            properties:
              schema:name:
                const: Integration Time per Cycle
            required:
            - schema:name
        - contains:
            properties:
              schema:name:
                const: Baseline Measurement Approach
            required:
            - schema:name
        - contains:
            properties:
              schema:name:
                const: Mass Fractionation Law
            required:
            - schema:name
        - contains:
            properties:
              schema:name:
                const: Double Spike Isotope Pair
            required:
            - schema:name
        - contains:
            properties:
              schema:name:
                const: Double Spike Inversion Algorithm
            required:
            - schema:name
      ada:internalNormalizationElementAndIsotopeRatio:
        description: Element and isotope ratio used as the internal normalization standard for mass bias
          correction. The measured ratio of the normalizing element is used to calculate the mass bias
          factor β using the chosen mass fractionation law, which is then applied to correct the analyte
          isotope ratios assuming β_norm ≈ β_analyte. Specify the element, the monitored isotope ratio
          (e.g., 113Cd/111Cd for Sb measurements), and the certified or consensus value used for correction.
          Record 'N/A' if internal normalization is not used. Record 'N/A' where the procedure does not
          use internal normalization.
        type: string
    required:
    - ada:internalNormalizationElementAndIsotopeRatio
  AnalysisIdentification:
    title: MCICPMS fields on the analysis
    description: 'Composed into a technique detail (schema:Dataset) schema: what each run supplies fresh,
      because it cannot be known until the analysis happens.'
    type: object
    properties:
      prov:wasGeneratedBy:
        type: array
        items:
          type: object
          properties:
            schema:additionalProperty:
              type: array
              items:
                type: object
                allOf:
                - if:
                    properties:
                      schema:name:
                        const: Number of Blocks per Measurement
                    required:
                    - schema:name
                  then:
                    properties:
                      schema:value:
                        description: Number of measurement blocks acquired per sample or standard solution
                          introduction. In MC-ICP-MS, data are structured as blocks of cycles; each block
                          typically begins with a baseline (on-peak zero) measurement before the analytical
                          cycles. Multiple blocks per sample allow inspection of signal stability and
                          within-measurement drift. Procedure specifies the standard number; analyst may
                          adjust for samples with low signal or for high-precision requirements.
                        anyOf:
                        - type: integer
                        - type: string
                - if:
                    properties:
                      schema:name:
                        const: Number of Cycles per Block
                    required:
                    - schema:name
                  then:
                    properties:
                      schema:value:
                        description: Number of measurement cycles acquired per block. One cycle corresponds
                          to a single set of simultaneous Faraday cup readings integrated for the duration
                          specified in Integration Time per Cycle. Total integration time per sample =
                          (Number of Cycles per Block) × (Integration Time per Cycle) × (Number of Blocks
                          per Measurement). Procedure specifies the standard value; analyst may adjust
                          within procedure bounds.
                        anyOf:
                        - type: integer
                        - type: string
                - if:
                    properties:
                      schema:name:
                        const: Integration Time per Cycle
                    required:
                    - schema:name
                  then:
                    properties:
                      schema:value:
                        description: Duration of signal integration per measurement cycle (seconds). Determines
                          counting statistics per cycle. Longer integration times improve shot-noise precision
                          but increase the impact of signal drift within the integration window. For high-gain
                          (10¹² or 10¹³ Ω) amplifier channels, longer integration times are often required
                          to accumulate sufficient charge. Procedure specifies the standard integration
                          time; analyst may confirm or adjust within procedure bounds. Analyte-specific
                          when different isotope channels use different integration schemes.
                        anyOf:
                        - type: number
                        - type: string
                - if:
                    properties:
                      schema:name:
                        const: Double Spike Mixing Ratio
                    required:
                    - schema:name
                  then:
                    properties:
                      schema:value:
                        description: Target proportion of double-spike signal relative to total analyte
                          signal in the spiked mixture, expressed as spike fraction (0–1) or spike:sample
                          ratio. An optimal mixing ratio minimizes error propagation through the double-spike
                          inversion; the optimum is analyte-system specific and is typically determined
                          using the Double Spike Toolbox or equivalent. The achieved mixing ratio may
                          deviate from the target within acceptable bounds (typically ±20% of optimal);
                          the double-spike inversion corrects for actual mixing ratios. Record 'N/A' if
                          double-spike method is not used. Record 'N/A' where the procedure does not use
                          a double spike.
                        anyOf:
                        - &id010
                          type: string
                        - type: array
                          items: *id010
