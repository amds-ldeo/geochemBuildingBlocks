$schema: https://json-schema.org/draft/2020-12/schema
title: 'TAPP Composition Module: Core'
description: 'The shared Core block of the 2026-08-11 TAPP library (Claude Skills for TAPP/Module_Core.csv),
  composed by 16 of the sixteen delivery tables. 30 owned fields over 35 schema paths.


  GENERATED by tools/build_module_bb.py from the module''s CSV and its schema-path sidecar — edit those,
  not this file. Requiredness follows the TAPP tier matrix: a field Basic on a side is required there,
  Advanced is permitted, N/A is absent from that side entirely.


  This is a PROFILE, not a vocabulary: it asserts which properties a conforming procedure or analysis
  carries. Column F (Example / Allowed Content) is consumer-owned per the module manifest, so no enum
  is pinned here — a consuming TAPP may narrow a value space, never widen it.'
$defs:
  ProcedureIdentification:
    title: Core on the procedure
    description: 'Composed into a TAPP (prov:Plan) schema: what the procedure asserts once, for every
      analysis that follows it.'
    type: object
    properties:
      schema:name:
        description: A short descriptive name for this analytical procedure, including a version number.
          Should identify the instrument, the technique, and the scope of what is measured — analyte,
          material, or feature.
        type: string
      schema:measurementTechnique:
        type: array
        items:
          type: object
          properties:
            schema:termCode:
              description: Top-level analytical technique identifier.
              type: string
      schema:creator:
        type: object
        properties:
          schema:name:
            description: Person(s) or laboratory responsible for developing and registering this procedure.
              ORCID recommended for individuals.
            type: string
      schema:location:
        type: object
        properties:
          schema:name:
            description: Name of the laboratory or institution hosting the instrument.
            type: string
          schema:identifier:
            description: Persistent identifier for the laboratory (e.g., ROR ID).
            type: string
      schema:datePublished:
        description: First date this procedure configuration was used in production.
        type: string
      schema:funding:
        type: array
        items:
          type: object
          properties:
            schema:name:
              description: Grants and other funding sources that supported instrument acquisition, major
                upgrades, procedure development, and associated personnel time. Include grant numbers
                and funding agencies where applicable.
              type: string
      schema:relatedLink:
        type: array
        items:
          type: object
          allOf:
          - if:
              properties:
                schema:linkRelationship:
                  const: techniquePublication
              required:
              - schema:linkRelationship
            then:
              properties:
                schema:target:
                  type: object
                  properties:
                    schema:name:
                      description: DOI or URL for peer-reviewed publications or technical reports describing,
                        validating, or benchmarking this procedure.
                      type: string
          - if:
              properties:
                schema:linkRelationship:
                  const: coupledTechnique
              required:
              - schema:linkRelationship
            then:
              properties:
                schema:target:
                  type: object
                  properties:
                    schema:name:
                      description: Other analytical techniques applied to the same sample(s) whose results
                        are intended to be interpreted together with data from this procedure. Document
                        coupling with any technique whose results are functionally linked to this dataset
                        — providing calibration inputs, complementary spatial context, or required companion
                        measurements. Use the same controlled vocabulary as the Technique field. Enter
                        "None" if no coupling is intended.
                      type: string
                    schema:description:
                      description: 'Description of how this procedure is coupled with the technique(s)
                        listed above. Include: (1) the functional relationship — what data or context
                        flows between techniques, or how results are combined (e.g. which output from
                        the coupled technique serves as input to data reduction for this technique); and
                        (2) the analytical sequence — which technique is performed first and why (e.g.
                        non-destructive before destructive). Required when Coupled Technique(s) is not
                        "None".'
                      type: string
      ada:samplingUnit:
        description: The physical subdivision of the sample to which one row of reported values corresponds
          — the unit that is analysed and reported, as distinct from the sample as a whole. State the
          unit type at procedure level and the units actually analysed at analysis level. Where units
          nest (e.g. confined tracks within grains), state both levels.
        type: string
      schema:instrument:
        type: array
        items:
          type: object
          allOf:
          - if:
              properties:
                schema:additionalType:
                  contains:
                    const: SEM
              required:
              - schema:additionalType
            then:
              properties:
                schema:manufacturer:
                  type: object
                  properties:
                    schema:name:
                      description: Manufacturer of the instrument that performs the measurement, recorded
                        as a controlled value so that procedures can be found by vendor. Where a procedure
                        couples a sample-introduction system to an analysing instrument, this records
                        the analysing instrument. Instrument Model gives the specific designation.
                      type: string
                schema:model:
                  type: object
                  properties:
                    schema:name:
                      description: Model designation of the instrument that performs the measurement,
                        including any generation or configuration suffix. Conventionally written with
                        the manufacturer name included; Instrument Manufacturer records the vendor separately,
                        as a controlled value, so that procedures remain findable by vendor.
                      type: string
        allOf:
        - contains:
            properties:
              schema:additionalType:
                contains:
                  const: SEM
            required:
            - schema:additionalType
      bios:computationalTool:
        type: array
        items:
          type: object
          allOf:
          - if:
              properties:
                ada:toolRole:
                  const: acquisition
              required:
              - ada:toolRole
            then:
              properties:
                schema:name:
                  description: Instrument control, automation and data acquisition software used to collect
                    the raw data, including version number. Distinct from Data Processing Software(s),
                    which covers everything applied to the data after acquisition.
                  anyOf:
                  - &id001
                    type: string
                  - type: array
                    items: *id001
          - if:
              properties:
                ada:toolRole:
                  const: dataReduction
              required:
              - ada:toolRole
            then:
              properties:
                schema:name:
                  description: All software applied to the data after acquisition in order to produce
                    the reported quantities, including version numbers. List every package used. Distinct
                    from Acquisition Software, which controls the instrument and collects the raw data.
                  anyOf:
                  - &id002
                    type: string
                  - type: array
                    items: *id002
          required:
          - ada:toolRole
      ada:analyticalMode:
        type: array
        items:
          description: Primary analytical mode(s) executed under this procedure. Records one value for
            a single-mode procedure and all applicable modes for a multi-mode one. Serves as the procedure-level
            declaration of measurement type, distinct from the mode flag columns, which state per-field
            applicability. Required even where a procedure defines no mode flag columns, so that every
            procedure record is self-describing and comparable across the library.
          type: string
      ada:reportedProperties:
        type: array
        items:
          description: The final variable(s) this procedure reports and their units — distinct from the
            fields recording what was *acquired* rather than what is reported. A procedure may acquire
            many channels and report a small number of derived quantities; without this field a data consumer
            cannot tell which. Record every reported variable, including intermediate quantities reported
            alongside final ones (e.g. both the 206Pb/238U ratio and the 206Pb/238U date). Where a reported
            variable is a nominal property with no magnitude (e.g. a mineral identification), record the
            variable and give the unit as 'N/A — nominal property'.
          type: string
      schema:description:
        description: 'Any procedure- or analysis-specific information not captured by a structured field
          anywhere in this TAPP — including anomalies, deviations from the registered procedure, instrument
          modifications, and supplementary context. Scope is the whole document, not Group 6: this is
          the last field of the TAPP and covers all six groups. Use sparingly; a structured field is preferred
          for anything that can be formally categorised.'
        type: string
    required:
    - ada:samplingUnit
    - schema:datePublished
    - schema:name
  AnalysisIdentification:
    title: Core on the analysis
    description: 'Composed into a technique detail (schema:Dataset) schema: what each run supplies fresh,
      because it cannot be known until the analysis happens.'
    type: object
    properties:
      prov:wasGeneratedBy:
        type: array
        items:
          type: object
          properties:
            schema:location:
              type: object
              properties:
                schema:name:
                  description: Name of the laboratory or institution hosting the instrument.
                  type: string
                schema:identifier:
                  description: Persistent identifier for the laboratory (e.g., ROR ID).
                  type: string
            schema:identifier:
              description: Identifier for the analytical session this record describes — the laboratory's
                own run, sequence or batch identifier as generated by the instrument or acquisition software.
                The analysis record corresponds to one session, which may cover several samples, and this
                is the link back to the raw instrument files. Distinct from any persistent identifier
                a repository mints on submission.
              type: string
            schema:startDate:
              description: 'Date on which the analytical session began. For sessions spanning multiple
                days, use the date of the first session. Format: YYYY-MM-DD.'
              type: string
            schema:endDate:
              description: 'Date on which the analytical session ended. May equal Analysis Start Date
                for single-day sessions. Format: YYYY-MM-DD.'
              type: string
            schema:object:
              type: array
              items:
                type: object
                allOf:
                - if:
                    properties:
                      '@type':
                        contains:
                          const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                    required:
                    - '@type'
                  then:
                    properties:
                      schema:name:
                        description: Name or identifier of each sample analysed in this session, as used
                          in the laboratory — a sample mount, section or aliquot counts as one entry where
                          that is what the laboratory tracks. The analysis record corresponds to one session
                          and may cover several samples; fields whose Keyed By column declares 'sample'
                          take one value per entry. Should match the identifier used in associated publications
                          or data tables.
                        anyOf:
                        - &id003
                          type: string
                        - type: array
                          items: *id003
                      schema:identifier:
                        description: Globally unique, persistent identifier for each sample listed in
                          Sample Name. IGSN (International Geo Sample Number) is the recommended standard
                          for geological and cosmochemical samples, as used by Astromat, EarthChem and
                          SESAR. Where a sample and its sub-samples are separately registered, record
                          the identifier at the level actually analysed.
                        anyOf:
                        - &id004
                          type: string
                        - type: array
                          items: *id004
              allOf:
              - contains:
                  properties:
                    '@type':
                      contains:
                        const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                  required:
                  - '@type'
            prov:used:
              type: array
              items:
                type: object
                allOf:
                - if:
                    required:
                    - bios:computationalTool
                  then:
                    properties:
                      bios:computationalTool:
                        type: array
                        items:
                          allOf:
                          - $ref: ../../geochemProduct/schema.yaml#/$defs/UsedComputationalTool
                          - type: object
                            allOf:
                            - if:
                                properties:
                                  ada:toolRole:
                                    const: acquisition
                                required:
                                - ada:toolRole
                              then:
                                properties:
                                  schema:name:
                                    description: Instrument control, automation and data acquisition software
                                      used to collect the raw data, including version number. Distinct
                                      from Data Processing Software(s), which covers everything applied
                                      to the data after acquisition.
                                    anyOf:
                                    - &id005
                                      type: string
                                    - type: array
                                      items: *id005
                            - if:
                                properties:
                                  ada:toolRole:
                                    const: dataReduction
                                required:
                                - ada:toolRole
                              then:
                                properties:
                                  schema:name:
                                    description: All software applied to the data after acquisition in
                                      order to produce the reported quantities, including version numbers.
                                      List every package used. Distinct from Acquisition Software, which
                                      controls the instrument and collects the raw data.
                                    anyOf:
                                    - &id006
                                      type: string
                                    - type: array
                                      items: *id006
                            required:
                            - ada:toolRole
            schema:description:
              description: 'Any procedure- or analysis-specific information not captured by a structured
                field anywhere in this TAPP — including anomalies, deviations from the registered procedure,
                instrument modifications, and supplementary context. Scope is the whole document, not
                Group 6: this is the last field of the TAPP and covers all six groups. Use sparingly;
                a structured field is preferred for anything that can be formally categorised.'
              type: string
      schema:measurementTechnique:
        type: array
        items:
          type: object
          properties:
            schema:identifier:
              description: DOI or unique persistent identifier for the registered procedure used in this
                analysis, generated upon procedure submission to a data repository. This field is mandatory
                when submitting analytical data, to encourage formal procedure registration and ensure
                traceability. If a DOI has been applied for but not yet minted, enter "pending".
              type: string
      schema:contributor:
        type: array
        items:
          type: object
          allOf:
          - if:
              properties:
                schema:roleName:
                  const: analyst
              required:
              - schema:roleName
            then:
              properties:
                schema:name:
                  description: Name(s) of the analyst(s) who performed the analysis session. ORCID is
                    recommended for persistent identification.
                  anyOf:
                  - &id007
                    type: string
                  - type: array
                    items: *id007
        allOf:
        - contains:
            properties:
              schema:roleName:
                const: analyst
            required:
            - schema:roleName
      schema:funding:
        type: array
      schema:relatedLink:
        type: array
        items:
          type: object
          allOf:
          - if:
              properties:
                schema:linkRelationship:
                  const: coupledTechnique
              required:
              - schema:linkRelationship
            then:
              properties:
                schema:target:
                  type: object
                  properties:
                    schema:name:
                      description: Other analytical techniques applied to the same sample(s) whose results
                        are intended to be interpreted together with data from this procedure. Document
                        coupling with any technique whose results are functionally linked to this dataset
                        — providing calibration inputs, complementary spatial context, or required companion
                        measurements. Use the same controlled vocabulary as the Technique field. Enter
                        "None" if no coupling is intended.
                      type: string
                    schema:description:
                      description: 'Description of how this procedure is coupled with the technique(s)
                        listed above. Include: (1) the functional relationship — what data or context
                        flows between techniques, or how results are combined (e.g. which output from
                        the coupled technique serves as input to data reduction for this technique); and
                        (2) the analytical sequence — which technique is performed first and why (e.g.
                        non-destructive before destructive). Required when Coupled Technique(s) is not
                        "None".'
                      type: string
          - if:
              properties:
                schema:linkRelationship:
                  const: coupledProcedure
              required:
              - schema:linkRelationship
            then:
              properties:
                schema:target:
                  type: object
                  properties:
                    schema:url:
                      description: Registered procedure DOI for the coupled technique named above. Provides
                        a stable, citable link to the companion method independent of whether a dataset
                        has been deposited. If the coupled procedure has not yet been registered, enter
                        the DOI of a publication describing the coupled method, or "pending". Enter "None"
                        if no coupling is planned.
                      type: string
          - if:
              properties:
                schema:linkRelationship:
                  const: coupledDataset
              required:
              - schema:linkRelationship
            then:
              properties:
                schema:target:
                  description: 'DOI or other persistent identifier for the co-registered dataset or publication
                    where both datasets are reported together. Accepts: a dedicated dataset DOI (if separately
                    deposited), a shared dataset DOI (if co-submitted in the same package), or a publication
                    DOI. Use "same submission" if the coupled dataset is included in this data package,
                    or "pending" if not yet assigned. If coupling is documented through a shared sample
                    identifier only, that information is already captured in Sample Persistent Identifier
                    (Group 2).'
                  anyOf:
                  - &id008
                    type: string
                  - type: array
                    items: *id008
    required:
    - schema:funding
  Param_Procedure_targetMaterial:
    title: Target Material
    description: General description of the material type(s) this procedure is designed to analyse. Used
      for discoverability and procedure matching, and because the material type constrains sample preparation,
      calibration and matrix-matching requirements.
    type: object
    properties:
      '@id':
        const: ada:parameter/module/Core/targetMaterial
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: targetMaterial
      schema:name:
        const: Target Material
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: true
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  Param_Analysis_constantsReferenceValues:
    title: Constants Reference Values
    description: Physical constants and reference values used in data reduction to calculate the final
      reported quantity (e.g., decay constants for age calculation, standard isotope ratios, or other
      citable reference values used in a correction or calculation), together with their source. Distinct
      from the Group 6 reference-material fields, which document accepted values for specific calibration/validation
      materials rather than universal physical constants. Record "None" if no citable, revisable physical
      constants feed into this procedure's data reduction.
    type: object
    properties:
      '@id':
        const: ada:parameter/module/Core/constantsReferenceValues
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/module/Core/constantsReferenceValues
      schema:name:
        const: Constants Reference Values
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  Param_Procedure_constantsReferenceValues:
    title: Constants Reference Values
    description: Physical constants and reference values used in data reduction to calculate the final
      reported quantity (e.g., decay constants for age calculation, standard isotope ratios, or other
      citable reference values used in a correction or calculation), together with their source. Distinct
      from the Group 6 reference-material fields, which document accepted values for specific calibration/validation
      materials rather than universal physical constants. Record "None" if no citable, revisable physical
      constants feed into this procedure's data reduction.
    type: object
    properties:
      '@id':
        const: ada:parameter/module/Core/constantsReferenceValuesDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: constantsReferenceValuesDefault
      schema:name:
        const: Constants Reference Values
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
