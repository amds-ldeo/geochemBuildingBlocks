  is pinned here — a consuming TAPP may narrow a value space, never widen it.'
$defs:
  ProcedureIdentification:
    title: SamplingUnitSelection on the procedure
    description: 'Composed into a TAPP (prov:Plan) schema: what the procedure asserts once, for every
      analysis that follows it.'
    type: object
    properties:
      ada:samplingUnitSelectionCriteriaDefault:
        description: 'The rules governing which sampling unit(s) within a sample are selected for analysis,
          and why. Covers the criteria applied when choosing grains, aliquots, spots, or a region of interest
          — size, morphology, clarity, freedom from inclusions or alteration, phase identity, or spatial
          position. Distinct from Target Material, which states the material type the procedure is designed
          for, and from Sampling Unit, which names the kind of subdivision one row of reported values
          corresponds to: this field states how, within such a sample, the unit actually analysed is picked
          out.'
        type: string
    required:
    - ada:samplingUnitSelectionCriteriaDefault
