$schema: https://json-schema.org/draft/2020-12/schema
title: 'TAPP Composition Module: ICPMS'
description: 'The shared ICPMS block of the 2026-08-11 TAPP library (Claude Skills for TAPP/Module_ICPMS.csv),
  composed by 9 of the sixteen delivery tables. 39 owned fields over 14 schema paths.


  GENERATED by tools/build_module_bb.py from the module''s CSV and its schema-path sidecar — edit those,
  not this file. Requiredness follows the TAPP tier matrix: a field Basic on a side is required there,
  Advanced is permitted, N/A is absent from that side entirely.


  This is a PROFILE, not a vocabulary: it asserts which properties a conforming procedure or analysis
  carries. Column F (Example / Allowed Content) is consumer-owned per the module manifest, so no enum
  is pinned here — a consuming TAPP may narrow a value space, never widen it.'
$defs:
  ProcedureIdentification:
    title: ICPMS on the procedure
    description: 'Composed into a TAPP (prov:Plan) schema: what the procedure asserts once, for every
      analysis that follows it.'
    type: object
    properties:
      ada:ionCounterDeadTimeDefault:
        description: Dead time of each ion-counting detector channel, used in the dead-time correction
          applied to high count rates. Distinct from pulse/analog cross-calibration, which relates the
          two detector modes rather than correcting counting losses within the pulse-counting mode.
        anyOf:
        - type: number
        - type: string
      ada:uncertaintyLevel:
        description: The convention at which reported uncertainties are quoted — 1-sigma, 2-sigma, or
          a 95% confidence interval — and whether a measured spread is reported as a standard error or
          a standard deviation. State the convention applying to all values reported under this procedure,
          and state each separately where different reported quantities use different conventions. Distinct
          from Uncertainty Propagation Method, which addresses how component uncertainties are combined
          rather than how the result is quoted.
        type: string
      schema:instrument:
        type: array
        items:
          type: object
          allOf:
          - if:
              properties:
                schema:additionalType:
                  contains:
                    const: ICPMS
                  schema:inDefinedTermSet: ada:vocab/instrumentType
              required:
              - schema:additionalType
            then:
              properties:
                schema:hasPart:
                  type: array
                  items:
                    type: object
                    allOf:
                    - if:
                        properties:
                          schema:additionalType:
                            contains:
                              const: Torch
                            schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                        required:
                        - schema:additionalType
                      then:
                        properties:
                          schema:name:
                            description: Type of plasma torch installed (e.g. standard quartz, high-matrix,
                              low-flow).
                            anyOf:
                            - &id001
                              type: string
                            - type: array
                              items: *id001
        allOf:
        - contains:
            properties:
              schema:additionalType:
                contains:
                  const: ICPMS
                schema:inDefinedTermSet: ada:vocab/instrumentType
            required:
            - schema:additionalType
      ada:calibrationMeasurementFrequency:
        description: How often the primary calibration or bracketing standard is measured relative to
          unknown samples within a session. Specify the bracketing scheme where a fixed one is used, such
          as one standard measurement before and after each sample.
        type: string
      ada:oxideProductionMethodAndThreshold:
        description: 'Method used to quantify plasma oxide production and the acceptance threshold applied
          before commencing analysis. Record both the monitored mass ratio(s) and the maximum allowed
          threshold(s). Measured values are recorded in Oxide Production. The monitored ratio is procedure-dependent:
          ThO+/Th+ (m/z 248/232), UO+/U+ (254/238), CeO+/Ce+ (156/140) and BaO+/Ba+ are all in use.'
        type: string
      ada:blankBackgroundCorrectionMethod:
        description: Method used to subtract background and, where relevant, procedural blank from the
          measured signal. State what is subtracted - instrument background acquired with no sample reaching
          the plasma, an on-peak zero acquired on the same matrix, or a separately measured procedural
          blank - over what interval it is measured, and at what granularity it is applied.
        type: string
      ada:internalStandardElement:
        description: Element(s) used as the internal standard, the monitored isotope, and how the internal-standard
          concentration was established for unknowns. Where the element serves isotope-ratio work it must
          have a known isotopic composition and a mass close to the analyte's. Record 'None' together
          with the alternative used where no internal standard is applied.
        type: string
      ada:perAnalyteCalibrationStrategy:
        type: array
        items:
          description: Approach used to convert measured ion signals to reported concentrations, and specifically
            any case where different analytes or analyte groups within one procedure are calibrated differently
            - different primary standards for different mass ranges or phases, or one element serving
            as internal standard while others are externally calibrated. Where a single strategy applies
            to all analytes, record that strategy. Where the procedure reports isotope ratios only and
            no concentrations, record 'Not applicable (isotope ratios only)'.
          type: string
      ada:signalIntegrationIntervalMethod:
        description: Method used to define which portion of the acquired signal is integrated for each
          reported measurement, and the rule for excluding unstable or anomalous portions. State whether
          the interval is the full acquisition, a stable sub-interval selected by inspection, or selected
          by an automated criterion, and name the criterion.
        type: string
      ada:analysisSequenceDefault:
        description: The repeating order in which calibration or bracketing standards, quality-control
          and secondary reference materials, blanks and unknowns are interleaved within a measurement
          session. Adjustments must maintain the bracketing strategy defined in the procedure.
        type: string
    required:
    - ada:analysisSequenceDefault
    - ada:blankBackgroundCorrectionMethod
    - ada:calibrationMeasurementFrequency
    - ada:internalStandardElement
    - ada:ionCounterDeadTimeDefault
    - ada:oxideProductionMethodAndThreshold
    - ada:signalIntegrationIntervalMethod
    - ada:uncertaintyLevel
  AnalysisIdentification:
    title: ICPMS on the analysis
    description: 'Composed into a technique detail (schema:Dataset) schema: what each run supplies fresh,
      because it cannot be known until the analysis happens.'
    type: object
    properties:
      prov:wasGeneratedBy:
        type: array
        items:
          type: object
          properties:
            prov:used:
              type: array
              items:
                type: object
                allOf:
                - if:
                    required:
                    - schema:instrument
                  then:
                    properties:
                      schema:instrument:
                        type: array
                        items:
                          allOf:
                          - $ref: ../../instrument/schema.yaml
                          - type: object
                            allOf:
                            - if:
                                properties:
                                  schema:additionalType:
                                    contains:
                                      const: ICPMS
                                    schema:inDefinedTermSet: ada:vocab/instrumentType
                                required:
                                - schema:additionalType
                              then:
                                properties:
                                  schema:identifier:
                                    description: Serial number or laboratory-internal identifier for the
                                      specific instrument unit.
                                    anyOf:
                                    - &id002
                                      type: string
                                    - type: array
                                      items: *id002
      ada:sensitivityYield:
        description: Instrument sensitivity achieved in the session, with the isotope or channel it was
          measured on and the conditions it applies to. May be expressed either as detected signal per
          unit concentration or per unit mass of analyte delivered — counts per second per ppb, volts
          per ppm, counts per picogram — or as useful yield, the percentage of sampled atoms ultimately
          detected as ions, with the method used to derive it cited. A sensitivity the procedure requires
          before analyses may begin belongs with the tuning acceptance criteria.
        anyOf:
        - type: number
        - type: string
      dqv:hasQualityMeasurement:
        type: array
        items:
          type: object
          allOf:
          - if:
              properties:
                dqv:isMeasurementOf:
                  const: Oxide production ratio
              required:
              - dqv:isMeasurementOf
            then:
              properties:
                dqv:value:
                  description: Measured oxide production ratio obtained during session-start tuning, for
                    the proxy specified in Oxide Production Method and Threshold. Record the measured
                    value and confirm whether the procedure threshold was met.
                  anyOf:
                  - &id003
                    type: string
                  - type: array
                    items: *id003
        allOf:
        - contains:
            properties:
              dqv:isMeasurementOf:
                const: Oxide production ratio
            required:
            - dqv:isMeasurementOf
