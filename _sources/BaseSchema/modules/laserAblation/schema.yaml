$schema: https://json-schema.org/draft/2020-12/schema
title: 'TAPP Composition Module: LaserAblation'
description: 'The shared LaserAblation block of the 2026-08-11 TAPP library (Claude Skills for TAPP/Module_LaserAblation.csv),
  composed by 6 of the sixteen delivery tables. 18 owned fields over 25 schema paths.


  GENERATED by tools/build_module_bb.py from the module''s CSV and its schema-path sidecar — edit those,
  not this file. Requiredness follows the TAPP tier matrix: a field Basic on a side is required there,
  Advanced is permitted, N/A is absent from that side entirely.


  This is a PROFILE, not a vocabulary: it asserts which properties a conforming procedure or analysis
  carries. Column F (Example / Allowed Content) is consumer-owned per the module manifest, so no enum
  is pinned here — a consuming TAPP may narrow a value space, never widen it.'
$defs:
  ProcedureIdentification:
    title: LaserAblation fields on the procedure
    description: 'Composed into a TAPP (prov:Plan) schema: what the procedure asserts once, for every
      analysis that follows it.'
    type: object
    properties:
      schema:actionProcess:
        type: object
        properties:
          schema:step:
            type: array
            items:
              type: object
              allOf:
              - if:
                  properties:
                    schema:name:
                      const: samplePreparation
                  required:
                  - schema:name
                then:
                  properties:
                    schema:additionalProperty:
                      type: array
                      items:
                        type: object
                        allOf:
                        - if:
                            properties:
                              schema:name:
                                const: Pre Ablation Surface Treatment
                            required:
                            - schema:name
                          then:
                            properties:
                              schema:defaultValue:
                                description: Procedure applied immediately before each analysis to remove
                                  surface contamination or condition the sample surface. Distinct from
                                  general sample preparation. For spot analysis, pre-ablation pulses are
                                  discarded before signal acquisition begins. For mapping, this step is
                                  typically omitted as the large area ablated averages out surface effects.
                                anyOf:
                                - &id001
                                  type: string
                                - type: array
                                  items: *id001
      schema:instrument:
        type: array
        items:
          type: object
          allOf:
          - if:
              properties:
                schema:additionalType:
                  contains:
                    const: Laser Ablation System
              required:
              - schema:additionalType
            then:
              properties:
                schema:model:
                  type: object
                  properties:
                    schema:name:
                      description: Manufacturer and model of the laser ablation system.
                      type: string
                ada:laserType:
                  description: Wavelength and type of the laser used for ablation in nanometres.
                  anyOf:
                  - &id002
                    type: string
                  - type: array
                    items: *id002
                schema:name:
                  description: Type, design origin, and internal volume of the ablation cell. Cell volume
                    is a primary determinant of aerosol washout time and therefore the achievable time
                    resolution of the data.
                  anyOf:
                  - &id003
                    type: string
                  - type: array
                    items: *id003
                ada:laserSpotGeometryDefault:
                  description: Shape and dimensions of the laser ablation spot in micrometres registered
                    by the procedure. For circular spots, report diameter; for square or rectangular spots,
                    report width × length. The procedure registers the typical geometry; analysts may
                    adjust within procedure-allowed range.
                  anyOf:
                  - &id004
                    type: string
                  - type: array
                    items: *id004
                schema:additionalProperty:
                  type: array
                  items:
                    type: object
                    allOf:
                    - if:
                        properties:
                          schema:name:
                            const: Laser Energy
                        required:
                        - schema:name
                      then:
                        properties:
                          schema:defaultValue:
                            description: Laser pulse energy in millijoules as set at the laser output
                              or measured at the sample surface. Less commonly reported than fluence because
                              it does not account for spot area. Report only when the system displays
                              energy directly. Laser fluence (J cm⁻²) is the preferred quantity and is
                              captured in Default Laser Fluence.
                            anyOf:
                            - type: number
                            - type: string
                    - if:
                        properties:
                          schema:name:
                            const: Laser Beam Energy Profile
                        required:
                        - schema:name
                      then:
                        properties:
                          schema:value:
                            description: Spatial energy distribution of the laser beam at the sample surface,
                              and whether a beam homogenizer is installed. A flat-top (top-hat) profile
                              produces more uniform ablation craters and more reproducible crater morphology
                              than a Gaussian beam. This is a fixed hardware property of the laser system.
                            anyOf:
                            - &id005
                              type: string
                            - type: array
                              items: *id005
                    - if:
                        properties:
                          schema:name:
                            const: Laser Pulse Duration
                        required:
                        - schema:name
                      then:
                        properties:
                          schema:value:
                            description: 'Duration of each individual laser pulse, including units. Pulse
                              duration determines the ablation regime: nanosecond (ns) pulses involve
                              significant thermal effects and elemental fractionation; femtosecond (fs)
                              pulses are non-thermal and substantially reduce elemental fractionation
                              and matrix effects. This is a fixed hardware property of the laser system.'
                            anyOf:
                            - &id006
                              type: string
                            - type: array
                              items: *id006
                  allOf:
                  - contains:
                      properties:
                        schema:name:
                          const: Laser Pulse Duration
                      required:
                      - schema:name
                ada:laserFluenceDefault:
                  description: Laser pulse energy per unit area at the sample surface in J cm⁻², as registered
                    by the procedure. Fluence is the physically meaningful quantity controlling ablation
                    rate, crater morphology, elemental fractionation, and particle size distribution.
                    If the system reports only as % of maximum output, include that value and note the
                    system maximum where known.
                  anyOf:
                  - type: number
                  - type: string
                ada:laserRepetitionRateDefault:
                  description: Laser pulse repetition rate in hertz registered by the procedure. For mapping
                    methods, repetition rate together with scan speed and spot size determines pixel size
                    and spatial resolution. Analysts may adjust within procedure-allowed bounds.
                  anyOf:
                  - type: number
                  - type: string
        allOf:
        - contains:
            properties:
              schema:additionalType:
                contains:
                  const: Laser Ablation System
            required:
            - schema:additionalType
      ada:ablationSamplingMode:
        description: Sampling mode or ablation pattern used during analysis.
        type: string
      ada:ablationSpotDurationDefault:
        description: 'Total on-sample ablation (signal acquisition) time per individual spot in seconds,
          as set in the acquisition method. This is a procedure-level parameter for spot analysis: it
          reflects the deliberate trade-off between signal accumulation (longer = lower LOD), sample consumption,
          and session throughput. For transect analysis, the equivalent procedure-level parameter is scan
          speed (captured in Transect Rate, Mapping Rate or Step Size). For mapping analysis, total acquisition
          time is sample-area-dependent and therefore analysis-level, not captured here.'
        anyOf:
        - type: number
        - type: string
      schema:additionalProperty:
        type: array
        items:
          type: object
          allOf:
          - if:
              properties:
                schema:name:
                  const: Transect Rate Mapping Rate or Step Size
              required:
              - schema:name
            then:
              properties:
                schema:defaultValue:
                  description: 'For continuous line scan (transect) and raster mapping: the stage translation
                    speed in µm s⁻¹. This is the procedure-level parameter that, together with spot size
                    and repetition rate, determines spatial resolution along the scan direction. For mapping,
                    the mapping rate (mm² h⁻¹) may be reported as an alternative when scan speed is session-variable.
                    For stepped line profiles: the distance between successive spot positions in µm.'
                  anyOf:
                  - &id007
                    type: string
                  - type: array
                    items: *id007
      ada:rasterLineSpacingDefault:
        description: Distance between adjacent raster lines in a 2D elemental map, measured perpendicular
          to the scan direction, in micrometres. Together with spot size, this determines whether adjacent
          lines are contiguous (line spacing = spot size), overlapping (line spacing < spot size), or
          have gaps (line spacing > spot size). Applies to raster mapping only.
        type: string
    required:
    - ada:ablationSamplingMode
    - ada:ablationSpotDurationDefault
    - ada:rasterLineSpacingDefault
  AnalysisIdentification:
    title: LaserAblation fields on the analysis
    description: 'Composed into a technique detail (schema:Dataset) schema: what each run supplies fresh,
      because it cannot be known until the analysis happens.'
    type: object
    properties:
      prov:wasGeneratedBy:
        type: array
        items:
          type: object
          properties:
            schema:actionProcess:
              type: object
              properties:
                schema:step:
                  type: array
                  items:
                    type: object
                    allOf:
                    - if:
                        properties:
                          schema:name:
                            const: samplePreparation
                        required:
                        - schema:name
                      then:
                        properties:
                          schema:additionalProperty:
                            type: array
                            items:
                              type: object
                              allOf:
                              - if:
                                  properties:
                                    schema:name:
                                      const: Pre Ablation Surface Treatment
                                  required:
                                  - schema:name
                                then:
                                  properties:
                                    schema:value:
                                      description: Procedure applied immediately before each analysis
                                        to remove surface contamination or condition the sample surface.
                                        Distinct from general sample preparation. For spot analysis, pre-ablation
                                        pulses are discarded before signal acquisition begins. For mapping,
                                        this step is typically omitted as the large area ablated averages
                                        out surface effects.
                                      anyOf:
                                      - &id008
                                        type: string
                                      - type: array
                                        items: *id008
            prov:used:
              type: array
              items:
                type: object
                allOf:
                - if:
                    properties:
                      schema:additionalType:
                        contains:
                          const: Laser Ablation System
                    required:
                    - schema:additionalType
                  then:
                    properties:
                      ada:laserSpotGeometry:
                        description: Shape and dimensions of the laser ablation spot in micrometres registered
                          by the procedure. For circular spots, report diameter; for square or rectangular
                          spots, report width × length. The procedure registers the typical geometry;
                          analysts may adjust within procedure-allowed range.
                        anyOf:
                        - &id009
                          type: string
                        - type: array
                          items: *id009
                      schema:additionalProperty:
                        type: array
                        items:
                          type: object
                          allOf:
                          - if:
                              properties:
                                schema:name:
                                  const: Laser Energy
                              required:
                              - schema:name
                            then:
                              properties:
                                schema:value:
                                  description: Laser pulse energy in millijoules as set at the laser output
                                    or measured at the sample surface. Less commonly reported than fluence
                                    because it does not account for spot area. Report only when the system
                                    displays energy directly. Laser fluence (J cm⁻²) is the preferred
                                    quantity and is captured in Default Laser Fluence.
                                  anyOf:
                                  - type: number
                                  - type: string
                      ada:laserFluence:
                        description: Laser pulse energy per unit area at the sample surface in J cm⁻²,
                          as registered by the procedure. Fluence is the physically meaningful quantity
                          controlling ablation rate, crater morphology, elemental fractionation, and particle
                          size distribution. If the system reports only as % of maximum output, include
                          that value and note the system maximum where known.
                        anyOf:
                        - type: number
                        - type: string
                      ada:laserRepetitionRate:
                        description: Laser pulse repetition rate in hertz registered by the procedure.
                          For mapping methods, repetition rate together with scan speed and spot size
                          determines pixel size and spatial resolution. Analysts may adjust within procedure-allowed
                          bounds.
                        anyOf:
                        - type: number
                        - type: string
            ada:ablationSpotDuration:
              description: 'Total on-sample ablation (signal acquisition) time per individual spot in
                seconds, as set in the acquisition method. This is a procedure-level parameter for spot
                analysis: it reflects the deliberate trade-off between signal accumulation (longer = lower
                LOD), sample consumption, and session throughput. For transect analysis, the equivalent
                procedure-level parameter is scan speed (captured in Transect Rate, Mapping Rate or Step
                Size). For mapping analysis, total acquisition time is sample-area-dependent and therefore
                analysis-level, not captured here.'
              anyOf:
              - type: number
              - type: string
            schema:additionalProperty:
              type: array
              items:
                type: object
                allOf:
                - if:
                    properties:
                      schema:name:
                        const: Transect Rate Mapping Rate or Step Size
                    required:
                    - schema:name
                  then:
                    properties:
                      schema:value:
                        description: 'For continuous line scan (transect) and raster mapping: the stage
                          translation speed in µm s⁻¹. This is the procedure-level parameter that, together
                          with spot size and repetition rate, determines spatial resolution along the
                          scan direction. For mapping, the mapping rate (mm² h⁻¹) may be reported as an
                          alternative when scan speed is session-variable. For stepped line profiles:
                          the distance between successive spot positions in µm.'
                        anyOf:
                        - &id010
                          type: string
                        - type: array
                          items: *id010
                - if:
                    properties:
                      schema:name:
                        const: Transect Length
                    required:
                    - schema:name
                  then:
                    properties:
                      schema:value:
                        description: Total length of the transect line analysed in micrometres. This is
                          an analysis-level parameter because it depends on the size of the feature of
                          interest rather than being fixed in the procedure. The procedure fixes scan
                          speed (captured in Transect Rate, Mapping Rate or Step Size); transect length
                          is determined at analysis time based on grain or feature size.
                        anyOf:
                        - type: number
                        - type: string
              allOf:
              - contains:
                  properties:
                    schema:name:
                      const: Transect Length
                  required:
                  - schema:name
            ada:rasterLineSpacing:
              description: Distance between adjacent raster lines in a 2D elemental map, measured perpendicular
                to the scan direction, in micrometres. Together with spot size, this determines whether
                adjacent lines are contiguous (line spacing = spot size), overlapping (line spacing <
                spot size), or have gaps (line spacing > spot size). Applies to raster mapping only.
              type: string
            schema:object:
              type: array
              items:
                type: object
                allOf:
                - if:
                    properties:
                      '@type':
                        contains:
                          const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                    required:
                    - '@type'
                  then:
                    properties:
                      schema:additionalProperty:
                        type: array
                        items:
                          type: object
                          allOf:
                          - if:
                              properties:
                                schema:name:
                                  const: Mapped area description
                              required:
                              - schema:name
                            then:
                              properties:
                                schema:value:
                                  description: 'Location of the analysis on the sample surface. For spot
                                    and transect analysis: stage coordinates (X, Y in µm) or a description
                                    relative to a named reference feature (e.g., mineral rim, inclusion
                                    boundary). For mapping: coordinates of the map corner(s) or centre,
                                    plus map dimensions. Enables spatial reconstruction and co-registration
                                    with other analytical images.'
                                  anyOf:
                                  - &id011
                                    type: string
                                  - type: array
                                    items: *id011
                        allOf:
                        - contains:
                            properties:
                              schema:name:
                                const: Mapped area description
                            required:
                            - schema:name
              allOf:
              - contains:
                  properties:
                    '@type':
                      contains:
                        const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                  required:
                  - '@type'
      ada:spotDiameterMeasured:
        description: 'Diameter of the laser spot as independently measured on the sample or on a test
          material, distinct from the nominal value the procedure registers. Measured companion to Laser
          Spot Geometry: nominal and delivered spot size can differ appreciably with optics condition
          and focus.'
        anyOf:
        - type: number
        - type: string
    required:
    - ada:spotDiameterMeasured
