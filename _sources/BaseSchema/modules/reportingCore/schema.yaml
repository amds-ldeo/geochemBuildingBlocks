$schema: https://json-schema.org/draft/2020-12/schema
title: 'TAPP Composition Module: ReportingCore'
description: 'The shared ReportingCore block of the 2026-08-11 TAPP library (Claude Skills for TAPP/Module_ReportingCore.csv),
  composed by 16 of the sixteen delivery tables. 6 owned fields over 3 schema paths.


  GENERATED by tools/build_module_bb.py from the module''s CSV and its schema-path sidecar — edit those,
  not this file. Requiredness follows the TAPP tier matrix: a field Basic on a side is required there,
  Advanced is permitted, N/A is absent from that side entirely.


  This is a PROFILE, not a vocabulary: it asserts which properties a conforming procedure or analysis
  carries. Column F (Example / Allowed Content) is consumer-owned per the module manifest, so no enum
  is pinned here — a consuming TAPP may narrow a value space, never widen it.'
$defs:
  TargetSelection_Procedure:
    title: ReportingCore · target_selection on the procedure
    description: 'Composed into a TAPP (prov:Plan) schema: what the procedure asserts once, for every
      analysis that follows it.'
    type: object
    properties:
      ada:targetSelectionCriteriaDefault:
        description: 'The rules governing which part of the sample is analysed, and why. Covers the criteria
          applied when choosing grains, aliquots, spots, or a region of interest — size, morphology, clarity,
          freedom from inclusions or alteration, phase identity, or spatial position. Distinct from Target
          Material, which states the material type the procedure is designed for: this field states how,
          within such a sample, the analysed portion is picked out.'
        type: string
    required:
    - ada:targetSelectionCriteriaDefault
  AggregationQc_Analysis:
    title: ReportingCore · aggregation_qc on the analysis
    description: 'Composed into a technique detail (schema:Dataset) schema: what each run supplies fresh,
      because it cannot be known until the analysis happens.'
    type: object
    properties:
      dqv:hasQualityMeasurement:
        type: array
        items:
          type: object
          allOf:
          - if:
              properties:
                dqv:isMeasurementOf:
                  const: Dispersion Statistic
              required:
              - dqv:isMeasurementOf
            then:
              properties:
                dqv:value:
                  description: The statistic reported to show whether scatter among the contributing analyses
                    exceeds what analytical uncertainty alone predicts, together with its value. Answers
                    whether a reported aggregate is defensible as a single population. Procedure-level
                    tier is N/A because the value cannot be known before the analysis; the procedure may
                    still state an acceptance threshold, which belongs with the inclusion criteria.
                  anyOf:
                  - &id001
                    type: string
                  - type: array
                    items: *id001
          - if:
              properties:
                dqv:isMeasurementOf:
                  const: Goodness-of-Fit
              required:
              - dqv:isMeasurementOf
            then:
              properties:
                dqv:value:
                  description: The statistic reported to show whether scatter among the contributing analyses
                    exceeds what analytical uncertainty alone predicts, together with its value. Answers
                    whether a reported aggregate is defensible as a single population. Procedure-level
                    tier is N/A because the value cannot be known before the analysis; the procedure may
                    still state an acceptance threshold, which belongs with the inclusion criteria.
                  anyOf:
                  - &id002
                    type: string
                  - type: array
                    items: *id002
        allOf:
        - contains:
            properties:
              dqv:isMeasurementOf:
                const: Dispersion Statistic
            required:
            - dqv:isMeasurementOf
        - contains:
            properties:
              dqv:isMeasurementOf:
                const: Goodness-of-Fit
            required:
            - dqv:isMeasurementOf
