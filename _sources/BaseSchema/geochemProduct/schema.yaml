$defs:
  # --- Component-type classification shared by geochem technique profiles ------
  # A generic file-classification scheme available to every geochemProfile profile
  # (via geochemProduct, their base). adaProduct declares its own equivalent copy
  # for the adaProfile collection; the two are kept self-contained rather than aliased,
  # because a cross-file $ref-of-a-$ref alias mis-resolves.
  universalComponentType:
    description: >-
      A componentType value drawn from the shared componentType vocabulary
      (ada:vocab/componentType). Not hard-enumerated here: conformance to the
      vocabulary is advisory (annotated via schema:inDefinedTermSet, SHACL-checkable)
      rather than enforced by JSON Schema, so techniques may extend the term set.
    type: string
    schema:inDefinedTermSet: "ada:vocab/componentType"
  UsedComputationalTool:
      type: object
      additionalProperties: false
      description: Computational tool actually used (acquisition, data reduction, or processing).
      properties:
        '@type':
          type: array
          items:
            type: string
          contains:
            const: schema:SoftwareApplication
        '@id':
          type: string
        'schema:name':
          type: string
        'schema:version':
          type: string
        'schema:url':
          type: string
          format: uri
        'schema:description':
          type: string
        'ada:toolRole':
          type: string
          enum:
            - acquisition
            - dataReduction
            - processing
            - visualization
      required:
        - '@type'
        - schema:name
  UsedReagent:
      type: object
      additionalProperties: false
      description: Reference material, calibration standard, or chemical reagent actually used.
      properties:
        '@type':
          type: array
          items:
            type: string
          minItems: 1
          description: >-
            What the material IS, independent of the role it plays in this run (that
            is ada:reagentRole). schema:DefinedTerm for a material identified by a
            registry entry (GeoReM, NIST SRM, USGS); schema:Product for a specific
            catalogued specimen or purchased lot; schema:ChemicalSubstance for a
            bulk chemical or coating stock.
          contains:
            enum:
              - schema:DefinedTerm
              - schema:Product
              - schema:ChemicalSubstance
        '@id':
          type: string
        'schema:name':
          type: string
        'schema:description':
          type: string
        'schema:identifier':
          description: Formal identifier (IGSN, catalog number, GeoReM ID).
          anyOf:
            - type: string
            - type: object
              additionalProperties: false
              properties:
                '@type':
                  type: array
                  items:
                    type: string
                  minItems: 1
                'schema:propertyID':
                  $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/cdifDataType/cdifConceptOrTermOrString/schema.yaml
                'schema:value':
                  type: string
        'schema:termCode':
          type: string
          description: Registry code for the material on the schema:DefinedTerm path.
        'schema:inDefinedTermSet':
          description: The registry the schema:termCode belongs to.
          anyOf:
            - type: string
              format: uri
            - type: object
              additionalProperties: false
              properties:
                '@id':
                  type: string
                  format: uri
                'schema:name':
                  type: string
        'ada:reagentRole':
          type: string
          enum:
            - primaryStandard
            - secondaryStandard
            - interferenceStandard
            - blankMaterial
            - coatingMaterial
            - referenceMaterial
            - reagent
      required:
        - '@type'
        - schema:name
  PropertyValueEntry:
    description: >-
      One entry of a schema:additionalProperty array: a named value carried on the dataset, on an
      analysis, or on a sample. The three sites above delegate their per-technique CONTENT to the
      technique profiles -- which property names are allowed, and with what values -- and this
      def supplies only the ENTRY SHAPE those names are carried in, so that a placement path such
      as `schema:additionalProperty[schema:name='Map Area'].schema:value` names something the
      schema has heard of.

      Measured across all 2047 additionalProperty entries in this repository's examples
      (2026-10-08): every one carries both '@type' and 'schema:name', and none carries a property
      outside the set below, so the two required keys are measured rather than assumed. '@type' is
      always a one-element array.

      DELIBERATELY NOT SEALED. additionalProperties is left open so a technique profile can add a
      property without every consumer of this block having to learn about it first -- the same
      reason the sites delegate in the first place. The consequence is that a MISSPELLED property
      here still validates; what this def buys is that the register's path checker
      (amds-ldeo/metadata, loaders/map_subject_keys.py) can now tell a real typo from a node that
      simply declares nothing. Before it existed, those two were the same report, and 18 correct
      paths were indistinguishable from a wrong one.
    type: object
    properties:
      '@id':
        description: >-
          Identifier for this entry, so it can be referenced -- typically the CURIE of the
          parameter it instantiates, e.g. ada:parameter/labxctTAPP/xrayEnergy. Not a resolvable
          URL, so no format assertion.
        type: string
      '@type':
        type: array
        minItems: 1
        items:
          type: string
        contains:
          enum:
          - schema:PropertyValue
          - schema:PropertyValueSpecification
      'schema:name':
        description: Human-readable label, matching the TAPP Metadata Item where one exists.
        type: string
        minLength: 1
      'schema:value':
        description: >-
          The value. Left untyped on purpose: measured as string, integer and number across the
          examples, and a technique profile is the right place to pin one.
      'schema:propertyID':
        description: >-
          URI(s) identifying this property in a vocabulary. Always an array of IRI-reference
          objects where present; left unconstrained here because the profiles that care already
          constrain it.
      'schema:unitText':
        description: Unit the value is expressed in, as written.
        type: string
      'schema:description':
        type: string
      'schema:valueName':
        description: Machine-readable name, for serialization and form binding.
        type: string
      'schema:defaultValue':
        description: Value carried into an analysis from the procedure, where the entry is a spec.
      'ada:dataType':
        type: string
      'ada:fieldScope':
        type: string
    required:
    - '@type'
    - schema:name

