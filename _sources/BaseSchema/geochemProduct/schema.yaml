$schema: https://json-schema.org/draft/2020-12/schema
$id: https://w3id.org/geochem/schema/geochemProduct/1.0
title: Geochemistry Analytical Product Metadata
description: >-
  Generic schema for JSON-LD metadata documenting an analytical product from a
  geochemistry (or related analytical) laboratory workflow. It describes the
  dataset and its distributions, the analysis events that produced it
  (instruments, computational tools, reagents, laboratory, samples analysed),
  the variables measured, and spatial / temporal / quality coverage. It composes
  the CDIF core, data-description, manifest (bundle), and provenance profiles.

  This is the domain-neutral base. Archive-specific submission/delivery layers
  (e.g. ADA/SAMIS via adaProduct) extend it with their product-type vocabulary,
  file-classification (componentType) scheme, and delivery-packaging rules.
type: object
allOf:
  - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifCore/schema.yaml
  # cdifDataDescription is the VARIABLE-DESCRIPTION profile, and it applies only when there is
  # something to describe. Made conditional 2026-10-16, mirroring cdifManifest below.
  #
  # Measured over all 7,447 ADA records: CDIF stage 1 withholds data_description from 7,439 of
  # them, every one because schema:variableMeasured is empty, and none for a SHACL failure. Only
  # 8 records carry cdi:InstanceVariable variables. About 6,565 are image, document or collection
  # products with no variables to describe -- for those the requirement is not unmet, it is
  # inapplicable. Composed unconditionally it made almost no ADA record declarable as
  # geochemProduct, and therefore none as adaProduct either.
  #
  # The condition deliberately still BITES on tabular data. 880 records carry a tabular part and
  # only 9 carry cdi:isStructuredBy, so those records fail this branch by design: the variables
  # are missing, not inapplicable. That is a live defect with a specific signature -- of 1,754
  # cdif:PhysicalMapping entries, 912 point at the literal {"@id": "#None"} instead of an
  # InstanceVariable, across 877 records -- so the columns WERE described and their variable
  # references were written as a placeholder. A condition of "has variableMeasured" alone would
  # have excused all 877 permanently and stopped the schema asking for something that should be
  # there.
  #
  # The tabular test keys on `cdi:TabularTextDataSet`, NOT on `ada:tabularData`, although the two
  # select the same 880 records: this file is the domain-NEUTRAL base, and its own description
  # says archive-specific vocabulary belongs in the extending profile (adaProduct). Parts carry
  # both types -- ["cdi:TabularTextDataSet", "ada:tabularData", "schema:MediaObject"] -- so the
  # neutral one is available at no cost in selectivity.
  #
  # Consequence for conformance detection: under the stage-2 derivation rule an if/then
  # composition is not a flat `requires`, so geochemProduct.requires becomes core/1.1 +
  # discovery/1.1 + provenance/1.1. A record that DOES carry variables still gets
  # data_description/1.1 from stage 1 on its own.
  - if:
      anyOf:
        - properties:
            "schema:variableMeasured":
              type: array
              minItems: 1
          required:
            - "schema:variableMeasured"
        # EITHER shape counts as tabular, and the second limb is not optional tidiness: a
        # MONOLITHIC tabular product carries cdi:TabularTextDataSet on the distribution ITSELF
        # and has no schema:hasPart at all. A hasPart-only test silently misses it -- the
        # collection-only trap CLAUDE.md's three-levels rule names, which the counterexample
        # adaproduct-tabular-still-needs-variables caught here after the first draft shipped it.
        - properties:
            "schema:distribution":
              type: array
              contains:
                type: object
                anyOf:
                  - properties:
                      "@type":
                        type: array
                        contains:
                          const: "cdi:TabularTextDataSet"
                    required:
                      - "@type"
                  - properties:
                      "schema:hasPart":
                        type: array
                        contains:
                          type: object
                          properties:
                            "@type":
                              type: array
                              contains:
                                const: "cdi:TabularTextDataSet"
                          required:
                            - "@type"
                    required:
                      - "schema:hasPart"
          required:
            - "schema:distribution"
    then:
      $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifDataDescription/schema.yaml
  # cdifManifest is the BUNDLE/archive profile: it applies (and its manifest/1.1
  # conformance is required) ONLY when a distribution is positively typed as a
  # bundle/archive -- schema:Collection in @type (alongside schema:DataDownload).
  # A monolithic single-file distribution is not an archive, so it is not held to
  # the manifest profile. Multi-file bundles are a generic delivery shape, so this
  # lives in the generic base; the archive members' domain file-classification is
  # added by the extending profile.
  - if:
      properties:
        "schema:distribution":
          type: array
          contains:
            type: object
            properties:
              "@type":
                type: array
                contains:
                  const: "schema:Collection"
            required:
              - "@type"
    then:
      $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifManifest/schema.yaml
  - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifProvenance/schema.yaml
  - type: object
    properties:
      "@type":
        title: Record Type
        type: array
        items:
          type: string
          enum:
            - "schema:Dataset"
            - "schema:Product"
      "schema:license":
        title: License
        description: Legal statement of conditions for use and access
        type: array
        minItems: 0
        items:
          anyOf:
            - type: string
            - $ref: ../creativeWork/schema.yaml
      "schema:relatedLink":
        title: Related Links
        type: array
        description: Links to related resources at the product level
        items:
          type: object
          properties:
            "@type":
              type: array
              items:
                type: string
              contains:
                const: "schema:LinkRole"
              minItems: 1
            "schema:linkRelationship":
              type: string
            "schema:target":
              type: object
              properties:
                "@type":
                  type: array
                  items:
                    type: string
                  contains:
                    const: "schema:EntryPoint"
                  minItems: 1
                "schema:encodingFormat":
                  type: array
                  items:
                    type: string
                "schema:name":
                  type: string
                "schema:url":
                  type: string
      "schema:creativeWorkStatus":
        title: Status
        type: string
      "schema:measurementTechnique":
        title: Measurement Technique
        type: array
        items:
          type: object
          description: Text description of the measurement method
          properties:
            "@type":
              type: array
              items:
                type: string
              contains:
                const: "schema:DefinedTerm"
              minItems: 1
            "schema:name":
              type: string
            "schema:identifier":
              type: string
      "prov:wasGeneratedBy":
        title: Analysis Events
        description: >-
          Analysis events. Extends cdifProvActivity (from cdifProvenance) with the
          generic geochem analysis-event surface: the instruments, computational
          tools and reagents actually used; the laboratory; the samples analysed;
          and the session identifier and timing.
        type: array
        items:
          type: object
          properties:
            "schema:actionProcess":
              description: >-
                The workflow actually followed by this analysis event, as a schema:HowTo whose
                schema:step entries are full workflow steps.

                The base cdifProvActivity already supplies a schema:HowTo here, but its step shape
                carries only @type / name / description / position / url. A geochem analysis event
                needs the same step surface the TAPP plan uses -- per-step instrument,
                computational tool, reagent, inputs, result, parameters and sub-workflow -- so the
                step items are pinned to tappDefinition's WorkflowStep. Both apply: the base and
                this intersect under allOf, and neither the base HowTo nor its step is a closed
                object, so the richer shape adds to it rather than conflicting.

                WorkflowStep, NOT WorkflowHowTo, is deliberate. The requirement for exactly one
                "Sample preparation" step carrying bios:LabProcess lives on WorkflowHowTo, and it
                belongs to the TAPP plan -- a protocol must say how the sample was prepared. An
                analysis EVENT records what was done and may legitimately describe only part of a
                workflow, so referencing the step shape alone brings the structure without that
                requirement.

                Only the object form is constrained. schema:actionProcess may also be a string or
                an @id reference in the base, and `properties` does not apply to a non-object, so
                those branches stay reachable.
              properties:
                "schema:step":
                  type: array
                  items:
                    $ref: ../tappDefinition/schema.yaml#/$defs/WorkflowStep
            "prov:used":
              title: Resources Used
              type: array
              description: >-
                Resources used in the analysis. Each item is one of: an instrument
                BB instance; a computational tool actually used
                (schema:SoftwareApplication); a reagent / reference material
                actually used; a tappDefinition BB instance (inlined); or an @id
                reference to a TAPP definition node defined elsewhere. The TAPP plan
                (prov:Plan / bios:LabProtocol) prescribes the generic instrument /
                computationalTool / reagent list; these prov:used entries record the
                ACTUALS used in this specific run.
              items:
                # Constraint-only pins, per the CDIF wrapper model: each fires ONLY
                # when its role key is present, so the base's own item shapes
                # (string, {@id}, inline prov:Entity) stay reachable. A narrowed
                # anyOf here would intersect with the base union and quietly exclude
                # shapes the base allows.
                allOf:
                  - if:
                      type: object
                      required: ['schema:instrument']
                    then:
                      properties:
                        'schema:instrument':
                          type: array
                          minItems: 1
                          items:
                            $ref: ../instrument/schema.yaml
                  - if:
                      type: object
                      required: ['bios:computationalTool']
                    then:
                      properties:
                        'bios:computationalTool':
                          type: array
                          minItems: 1
                          items:
                            $ref: '#/$defs/UsedComputationalTool'
                  - if:
                      type: object
                      required: ['bios:reagent']
                    then:
                      properties:
                        'bios:reagent':
                          type: array
                          minItems: 1
                          items:
                            $ref: '#/$defs/UsedReagent'
                  # The TAPP link is ROLE-KEYED, like the three above it: the property
                  # NAME says what the used entity is, so a reader tells a TAPP link from
                  # an instrument or software link without dereferencing any of them and
                  # without inspecting @type.
                  #
                  # This REPLACES an earlier branch that keyed on @type containing
                  # ada:TAPPDefinition, guarded by schema:name to tell an inline plan from
                  # a reference (a reference, being {@id, @type} and nothing else, never
                  # carries a name). That guard worked, but it made the role an artefact of
                  # @type -- which an inline prov:Entity also carries -- so the role could
                  # only be read by a consumer that already knew to look there. The key
                  # states it outright. CDIF admits the SHAPE of a role-keyed wrapper
                  # generically (metadataBuildingBlocks#52, `prov:used` items anyOf branch
                  # [6], propertyNames + patternProperties); this closes that set to the one
                  # role this profile defines.
                  #
                  # Both spellings of the value are accepted because both are legitimate and
                  # the distinction is NOT ours to force: a reference when the TAPP is a
                  # separate document, which is the normal case and the reason a record does
                  # not duplicate a plan hundreds of times; an inline plan when the record
                  # carries its own. The reference form is first so an {@id}-only value is
                  # matched by the cheaper branch.
                  - if:
                      type: object
                      required: ['ada:tappDefinition']
                    then:
                      properties:
                        'ada:tappDefinition':
                          title: TAPP Definition
                          description: >-
                            The TAPP definition this analysis followed: either a reference to
                            a TAPP definition node defined elsewhere, or the plan inline.
                          anyOf:
                            - type: object
                              additionalProperties: false
                              required: ['@id']
                              properties:
                                '@id':
                                  type: string
                            - $ref: ../tappDefinition/schema.yaml
                  # And the superseded spelling is CLOSED OFF ENTIRELY, so "replaces" is
                  # enforced by the schema rather than only observed in what the generator
                  # emits.
                  #
                  # BOTH old forms are now rejected, inline and reference alike. #192 closed
                  # only the INLINE one, guarding the `if` with `schema:name` -- an inline
                  # plan carries a name, a plain {@id, @type} reference does not -- because
                  # rejecting the reference form would have invalidated the 7,263 of 7,447
                  # ADA records that used it. That was the whole reason for the narrowness,
                  # and it has expired: measured 2026-10-24, the old form is at ZERO in BOTH
                  # stores, ada_subjects and production ada2, with every reference migrated
                  # to the role key. So the `schema:name` guard is gone and the `if` fires on
                  # any prov:used item typed ada:TAPPDefinition.
                  #
                  # SEQUENCE MATTERS HERE AND WAS FOLLOWED: the corpus moved first, then the
                  # schema. Closing this before the migration would have invalidated every
                  # production record at once -- a schema that rejects the corpus it
                  # describes is one nobody can deploy. If a store is ever restored from a
                  # pre-migration backup, this branch is what will tell you, loudly.
                  #
                  # Stated as "then it must carry the role key" rather than as `false`, for
                  # two reasons. It reads as the migration instruction it is, and the
                  # rejection NAMES ada:tappDefinition instead of saying only that some
                  # false schema matched nothing -- which is what makes it testable:
                  # docs/counterexamples.json requires the rejection to mention the thing
                  # the case was written for, and a bare `false` mentions nothing.
                  - if:
                      type: object
                      required: ['@type']
                      properties:
                        '@type':
                          contains:
                            const: ada:TAPPDefinition
                    then:
                      description: >-
                        A TAPP link belongs under the ada:tappDefinition role key, whether it
                        is a reference or an inline plan. The bare @type form is superseded;
                        see the branch above.
                      required: ['ada:tappDefinition']
                  # The reagent role key is bios:reagent; prov:reagent is superseded and
                  # CLOSED OFF here, in the same way and for the same reason as the TAPP
                  # spelling above. PROV-O defines no `reagent` term, Bioschemas does, and
                  # the TAPP plan (tappDefinition) already spelled the relation
                  # bios:reagent -- so the analysis event now matches the plan. Upstream
                  # CDIF made the same rename in the base generatedBy wrapper branch
                  # (metadataBuildingBlocks#53, a7d4c97).
                  #
                  # Safe to reject outright: measured before the change, prov:reagent
                  # occurs 0 times in every JSON column of ada2, ada_subjects and
                  # method_registry, while bios:reagent already appears in 72 of 500 TAPP
                  # plans. As above, stated as "then it must carry the new key" rather
                  # than `false`, so the rejection NAMES bios:reagent and the case in
                  # docs/counterexamples.json can require it.
                  - if:
                      type: object
                      required: ['prov:reagent']
                    then:
                      description: >-
                        The reagent role is bios:reagent; prov:reagent is superseded
                        (PROV-O defines no reagent term). Rename the key.
                      required: ['bios:reagent']
            "schema:location":
              title: Laboratory
              $ref: ../laboratory/schema.yaml
            "schema:object":
              title: Samples Analyzed
              type: array
              description: Samples analyzed
              items:
                type: object
                properties:
                  "@type":
                    type: array
                    items:
                      type: string
                    allOf:
                    - contains:
                        const: "schema:Thing"
                    - contains:
                        const: "https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample"
                    minItems: 2
                  "schema:additionalType":
                    type: array
                    items:
                      $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/cdifDataType/cdifConceptOrTermOrString/schema.yaml
                  "schema:identifier":
                    type: array
                    items:
                      type: string
                  "schema:name":
                    description: Sample name/identifier as used in the lab.
                    type: string
                  "schema:additionalProperty":
                    description: Per-sample PropertyValue entries (e.g. analysis location); technique profiles constrain these.
                    type: array
                    items:
                      $ref: '#/$defs/PropertyValueEntry'
                  'ada:spatialRegistration':
                    title: Spatial Registration
                    description: >-
                      The coordinate system defined ON the sample -- typically a planar
                      thin section -- that image pixel coordinates are registered to.
                      Distinct from the ada:spatialRegistration on an image or imageMap
                      part, which maps pixel coordinates WITHIN one file: this one is the
                      frame those are registered to, and is what lets two images of the
                      same section be compared. Optional, and no record carries it yet.
                    $ref: ../spatialRegistration/schema.yaml
            "schema:identifier":
              title: Session Identifier
              description: >-
                The analytical session's own identifier -- the laboratory's run,
                sequence or batch identifier as generated by the instrument or
                acquisition software. Sits on the activity rather than the dataset
                because the session IS the activity.
              type: string
            "schema:startTime":
              title: Start Time
              type: string
            "schema:endTime":
              title: End Time
              type: string
            "schema:additionalProperty":
              description: Per-analysis PropertyValue entries (replicates, transect length, ...); technique profiles constrain these.
              type: array
              items:
                $ref: '#/$defs/PropertyValueEntry'
            "ada:combinedResults":
              description: >-
                The reported values this session obtained by averaging or otherwise combining
                several individual results -- the ROWS of the combined-result table, and the
                domain that `defines: combined result` enumerates (Rule 7; see the Legends sheet
                of any delivered TAPP). One entry per combined value, each naming what it
                combines: "Olivine, sample A, 8 points", "Zircon weighted-mean date, sample B,
                236 of 246 spots", "Isochron, sample C, 36 runs".

                On the ACTIVITY rather than on a sample, because a combined result names its own
                sample and need not belong to exactly one -- an isochron over 36 runs is the case
                in hand.

                It is METADATA, unlike a sampling unit, and the difference is worth being clear
                about because an earlier design got it wrong. A combined result is a statement the
                record makes about its own contents, so it belongs here. An individual sampling
                unit is not: the procedure and the analysis can state only the KIND of unit
                (ada:samplingUnitType), while a particular unit's identifier is a
                schema:variableMeasured naming a COLUMN in one of the distributions, and the
                binding from that unit to its target material exists only in the instance data
                table beside the results. There is therefore no array of sampling-unit objects
                here; one was added on 2026-09-25 and removed on 2026-10-01 once that was settled.

                Analysis-side only: the procedure can say HOW results will be combined
                (Combination Method, keyed by reported property) but not WHICH were, so there is
                no ada:combinedResults counterpart in tappDefinition.

                Fields keyed `combined result x reported property` -- Goodness-of-Fit or
                Dispersion Statistic, and Other Statistics -- ride on these rows as per-reported-
                property values, keyed by the valueName of the column that declared them.
              type: array
              items:
                type: object
                required: ["schema:name"]
                properties:
                  "@id":
                    description: Optional identifier for this combined result.
                    type: string
                  "schema:name":
                    description: >-
                      What this combined value is and what it combines. Required, because a
                      combined result nothing can name gives a field keyed by combined result no
                      row to attach its value to.
                    type: string
          required:
            - "prov:used"
      "schema:variableMeasured":
        title: Measured Variables
        description: >-
          Variable definitions. Extends cdifInstanceVariable (from
          cdifDataDescription) with additional generic properties. Requires a
          description with minLength 3.
        type: array
        items:
          type: object
          required: ['@type']
          properties:
            "@type":
              description: >-
                A variable is either a measured VALUE (schema:PropertyValue) or a SPECIFICATION of
                one (schema:PropertyValueSpecification); exactly which it is decides how a consumer
                reads schema:value. One of the two must appear. Further type URIs are welcome
                alongside - cdi:InstanceVariable is the usual companion - so the array is open.
              type: array
              items:
                type: string
              contains:
                anyOf:
                  - const: "schema:PropertyValue"
                  - const: "schema:PropertyValueSpecification"
            "schema:description":
              type: string
              minLength: 3
            "schema:alternateName":
              title: Alternate Name
              type: array
              items:
                type: string
                description: Human intelligible name for variable that conveys semantics
            "schema:measurementTechnique":
              type: array
              items:
                anyOf:
                  - type: string
                  - type: object
                    required: ['@id']
                    additionalProperties: false
                    properties:
                      "@id":
                        type: string
                  - type: object
                    additionalProperties: false
                    properties:
                      "@type":
                        type: array
                        items:
                          type: string
                        contains:
                          const: "schema:DefinedTerm"
                        minItems: 1
                      "schema:name":
                        type: string
                    required:
                      - "@type"
                      - "schema:name"
            "schema:unitText":
              type: string
            "schema:unitCode":
              anyOf:
                - type: string
                - type: object
                  required: ['@id']
                  additionalProperties: false
                  properties:
                    "@id":
                      type: string
                - type: object
                  additionalProperties: false
                  properties:
                    "@type":
                      type: array
                      items:
                        type: string
                      contains:
                        const: "schema:DefinedTerm"
                      minItems: 1
                    "schema:name":
                      type: string
                  required:
                    - "@type"
                    - "schema:name"
            "schema:minValue":
              type: number
            "schema:maxValue":
              type: number
            "schema:url":
              type: string
              format: uri
          required:
            - "schema:description"
      "schema:spatialCoverage":
        title: Spatial Coverage
        description: Geographic extent of resource content.
        type: array
        items:
          $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/schemaorgProperties/spatialExtent/schema.yaml
      "schema:temporalCoverage":
        title: Temporal Coverage
        description: Temporal extent of resource content.
        type: array
        items:
          $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/schemaorgProperties/temporalExtent/schema.yaml
      "dqv:hasQualityMeasurement":
        title: Quality Measurements
        description: Quality measurements reported to assess the resource.
        type: array
        items:
          $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/qualityProperties/qualityMeasure/schema.yaml
      "schema:additionalProperty":
        title: Additional Properties
        description: >-
          PropertyValue entries describing the DELIVERED DATA rather than the
          analysis that produced it (extent, dimensions, ...). Distinct from the
          per-analysis prov:wasGeneratedBy.schema:additionalProperty. Technique
          profiles constrain these.
        type: array
        items:
          $ref: '#/$defs/PropertyValueEntry'
      "schema:distribution":
        title: Distributions
        description: >-
          Generic distribution structure. A distribution is a schema:DataDownload
          (or schema:WebAPI, inherited from cdifCore) that MAY carry a
          cdi:isStructuredBy data-structure description (for a monolithic single
          file that IS the dataset, or a structure shared across bundle parts), and
          MAY be a bundle whose schema:hasPart lists member files (typed via
          cdifManifest). The domain file-classification of a distribution / member
          (e.g. ADA ada:componentType) is added by the extending profile.
        type: array
        items:
          type: object
          properties:
            "cdi:isStructuredBy":
              description: >-
                Data-structure description of a monolithic single-file distribution
                (the file is the dataset), or a structure shared across bundle parts
                and referenced from them by @id. One of the four CDIF DataStructure
                variants inline, or an @id reference. Optional.
              anyOf:
                - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifDataStructure/schema.yaml#/$defs/DataStructure
                - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifDataStructure/schema.yaml#/$defs/DimensionalDataStructure
                - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifDataStructure/schema.yaml#/$defs/LongDataStructure
                - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifDataStructure/schema.yaml#/$defs/WideDataStructure
                - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/cdifDataType/objectReference/schema.yaml
            "schema:additionalType":
              description: >-
                Optional file-classification of this distribution (or, on a bundle,
                of the whole archive) drawn from the componentType vocabulary
                (ada:vocab/componentType) -- e.g. "ada:report", "ada:calibrationFile".
                Generic and OPTIONAL here; the ADA product layer (adaProduct) instead
                carries the required ada:componentType. Advisory (annotated via
                schema:inDefinedTermSet), not hard-enumerated in JSON Schema.
              type: array
              items:
                $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/cdifDataType/cdifConceptOrTermOrString/schema.yaml
              schema:inDefinedTermSet: "ada:vocab/componentType"
          allOf:
            # A monolithic single-file distribution that is a tabular text file
            # validates its CSVW/DDI-CDI layout + per-column cdif:hasPhysicalMapping
            # via cdifTabularData. A bundle DataDownload is an archive, not itself
            # tabular, so this never fires there.
            - if:
                properties:
                  "@type":
                    type: array
                    contains:
                      const: "cdi:TabularTextDataSet"
              then:
                $ref: ../tabularData/schema.yaml
      "schema:subjectOf":
        title: About This Record
        properties:
          "dcterms:conformsTo":
            contains:
              type: object
              required: ['@id']
              additionalProperties: false
              properties:
                "@id":
                  const: "https://w3id.org/geochem/metadata/profiles/geochemProduct"

      # ---------------------------------------------------------------------
      # Labels only. Each entry below carries a `title` and NOTHING else, so
      # deep_merge treats it as a partial patch: the CDIF base definition is
      # preserved underneath and only the label is contributed. Adding one of
      # these changes no constraint -- `properties` here has no
      # additionalProperties and names nothing as required.
      #
      # A label must NOT equal any block's own top-level title: the metadata
      # viewer treats such a title as a type name and drops it. Checked for
      # all of these against the 283 block titles in _sources + vendor/remote.
      # ---------------------------------------------------------------------
      'schema:name':
        title: Dataset Name
      'schema:description':
