$schema: https://json-schema.org/draft/2020-12/schema
title: Structured Data File Type
description: >-
  A container/array data file (e.g. HDF5, NeXus) within an ADA bundle whose layout
  is described by a CDIF DataStructure via cdi:isStructuredBy, rather than the flat
  CSVW layout + per-column cdif:hasPhysicalMapping of a tabular text file
  (tabularData) or the locator mappings of a dataCube. This is the bundle-part
  analog of the monolithic single-file cdi:isStructuredBy pattern: the pattern is
  chosen by the file's encoding, not its position. Typed as ada:structuredData and
  cdi:PhysicalDataSet.
type: object
properties:
  '@type':
    type: array
    items:
      type: string
    minItems: 2
    allOf:
      - contains:
          const: ada:structuredData
      - contains:
          const: cdi:PhysicalDataSet
  'ada:componentType':
    type: string
    description: >-
      ADA componentType for a structured container file, as a single string.
      Allowed values are constrained at the technique-profile level.
  'cdi:isStructuredBy':
    description: >-
      The data structure of this container file — one of the four CDIF DataStructure
      variants (DataStructure, Dimensional, Long, Wide) inline, or an @id reference to
      a structure declared elsewhere in the document (e.g. shared across parts).
    anyOf:
      - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifDataStructure/schema.yaml#/$defs/DataStructure
      - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifDataStructure/schema.yaml#/$defs/DimensionalDataStructure
      - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifDataStructure/schema.yaml#/$defs/LongDataStructure
      - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifDataStructure/schema.yaml#/$defs/WideDataStructure
      - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifDataStructure/schema.yaml#/$defs/id-reference
required:
  - '@type'
  - 'ada:componentType'
  - 'cdi:isStructuredBy'
