- title: Supplemental Document Image Example
  content: |-
    A context photography image used as supplemental documentation.
  prefixes:
    schema: http://schema.org/
    ada: https://ada.astromat.org/metadata/
  snippets:
    - language: json
      code: |
        {
          "@type": ["ada:image", "schema:DigitalDocument"],
          "ada:componentType": "ada:contextPhotography",
          "schema:width": {
            "@type": ["schema:QuantitativeValue"],
            "schema:value": 2048,
            "schema:unitText": "pixel"
          },
          "schema:height": {
            "@type": ["schema:QuantitativeValue"],
            "schema:value": 1536,
            "schema:unitText": "pixel"
          },
          "schema:isBasedOn": "sample_context_photo_001.jpg"
        }
