$schema: https://json-schema.org/draft/2020-12/schema
title: Document Type
description: >-
  Text or PDF/A documents providing supplemental information, typically related
  to calibration, instrument metadata details, analysis methods, or data
  representation. Typed as ada:document and schema:DigitalDocument.
type: object
properties:
  "@type":
    type: array
    items:
      type: string
    minItems: 2
    allOf:
      - contains:
          const: "ada:document"
      - contains:
          const: "schema:DigitalDocument"
  'ada:componentType':
    type: string
    enum:
      - ada:analysisLocation
      - ada:annotatedImage
      - ada:areaOfInterest
      - ada:ARGTDocument
      - ada:basemap
      - ada:calibrationFile
      - ada:code
      - ada:contextPhotography
      - ada:contextVideo
      - ada:FTICRMSDataPlot
      - ada:GCMSChromatogram
      - ada:GCMSPeaks
      - ada:GCMSSpectraPlot
      - ada:inputFile
      - ada:instrumentMetadata
      - ada:L2MSSpectraPlot
      - ada:LCMSChromatogram
      - ada:LCMSPeaks
      - ada:LCMSVisualization
      - ada:logFile
      - ada:MCICPMSRaw
      - ada:methodDescription
      - ada:NanoIRBackground
      - ada:NanoSIMSRawText
      - ada:NGNSMSRunLog
      - ada:other
      - ada:peaks
      - ada:plot
      - ada:processingMethod
      - ada:QRISCalibrationFile
      - ada:quickLook
      - ada:report
      - ada:samplePreparation
      - ada:SEMEDSPointSpectraPlot
      - ada:shapefile
      - ada:SLSMaterialTemplate
      - ada:SLSPartialScan
      - ada:SLSShapeModel
      - ada:SLSTransformation
      - ada:STEMEDSSpectraPlot
      - ada:STEMEELSSpectraPlot
      - ada:supplementalBasemap
      - ada:supplementaryImage
      - ada:SVRUECWaveformPlot
      - ada:TOFSIMS
      - ada:TOFSIMSIonImages
      - ada:TOFSIMSMassSpectrumPlot
      - ada:VNMIRSpectraPlot
      - ada:worldFile
      - nil:missing
    description: >-
      ADA componentType for a document, as a single string. Allowed values
      are constrained at the technique-profile level.
  "schema:version":
    type: string
  "schema:isBasedOn":
    description: same as ada/samis '_originalName'
    type: string
required:
  - "@type"
  - 'ada:componentType'
