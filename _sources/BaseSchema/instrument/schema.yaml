$schema: https://json-schema.org/draft/2020-12/schema
title: ADA Analysis Instrument
description: >-
  ADA analytical instrument building block. Extends the core CDIF instrument
  building block with NeXus NXinstrument classification via additionalType.
  Instruments are typed as schema:Thing + schema:Product (from core) with
  domain-specific types (e.g. nxs:BaseClass/NXinstrument, ada:AMSInstrument)
  in additionalType.
allOf:
- $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/schemaorgProperties/instrument/schema.yaml
- type: object
  properties:
    'schema:additionalType':
      description: >-
        Domain-specific instrument type classifications. Should include
        a NeXus base class (e.g. nxs:BaseClass/NXinstrument) and/or
        technique-specific identifier (e.g. ada:AMSInstrument, GCMD
        instrument identifier). URI-shape values MUST be serialized as
        JSON-LD IRI references ({"@id":"..."}); free-label strings remain valid.
        Every instrument additionally carries the Wikidata "measuring instrument"
        type, which is invariant across techniques: the technique-specific entry
        says what KIND of instrument this is and varies by profile, while the
        Wikidata term says that it is an instrument at all, and gives a consumer
        one term to select on without knowing the ADA vocabulary.
      type: array
      items:
        anyOf:
        - type: string
        - type: object
          additionalProperties: false
          required:
          - '@id'
          properties:
            '@id':
              type: string
      minItems: 1
      contains:
        type: object
        properties:
          '@id':
            const: https://www.wikidata.org/wiki/Q3099911
        required:
        - '@id'
  required:
  - schema:additionalType
