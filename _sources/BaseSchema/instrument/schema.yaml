$schema: https://json-schema.org/draft/2020-12/schema
title: ADA Analysis Instrument
description: >-
  ADA analytical instrument building block. Extends the core CDIF instrument
  building block with NeXus NXinstrument classification via additionalType.
  Instruments are typed as schema:Thing + schema:Product (from core) with
  domain-specific types (e.g. nxs:base_classes/NXinstrument.html, ada:AMSInstrument)
  in additionalType.
allOf:
- $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/schemaorgProperties/instrument/schema.yaml
- type: object
  properties:
    '@id':
      description: >-
        Identifier for this instrument within the record. REQUIRED: an instrument has to be
        referenceable. A monitored species names the instrument (or the instrument part)
        that reports it, and a dataset variable points back at the device that produced it;
        neither is expressible while the instrument is an anonymous object. A
        document-scoped identifier suffices, but a resolvable one is better wherever the lab
        has a persistent identifier for the device.
      type: string
      minLength: 1
    'schema:additionalType':
      description: >-
        Domain-specific instrument type classifications. Should include
        a NeXus base class (e.g. nxs:base_classes/NXinstrument.html) and/or
        technique-specific identifier (e.g. ada:AMSInstrument, GCMD
        instrument identifier). URI-shape values MUST be serialized as
        JSON-LD IRI references ({"@id":"..."}); free-label strings remain valid.
        Every instrument additionally carries the Wikidata "measuring instrument"
        type, which is invariant across techniques: the technique-specific entry
        says what KIND of instrument this is and varies by profile, while the
        Wikidata term says that it is an instrument at all, and gives a consumer
        one term to select on without knowing the ADA vocabulary.
      type: array
      items:
        anyOf:
        - type: string
        - type: object
          additionalProperties: false
          required:
          - '@id'
          properties:
            '@id':
              type: string
      minItems: 1
      contains:
        type: object
        properties:
          '@id':
            const: https://www.wikidata.org/wiki/Q3099911
        required:
        - '@id'
    'schema:hasPart':
      description: >-
        Sub-components of this instrument system (a torch, an ICP source, a collision/reaction
        cell, a spectrometer). A component IS an instrument -- same @type (schema:Product +
        schema:Thing), same Wikidata term, and its own schema:additionalType token saying which
        kind of component it is. The shape is restated rather than written as `$ref: '#'`, because
        resolve_schema replaces a circular ref with an empty stub -- it would read as "a part is an
        instrument" and enforce nothing. Upstream
        types a component more loosely (schema:Thing alone, no Wikidata); this narrows it, and the
        two compose because allOf intersects.
      type: array
      items:
        anyOf:
        - type: object
          required:
          - '@id'
          - '@type'
          - 'schema:name'
          - 'schema:additionalType'
          properties:
            '@id':
              description: >-
                Identifier for this component within the record. REQUIRED on an INLINE component
                for the same reason it is required on the instrument: a monitored species names the
                part that reports it -- a Faraday cup, a spectrometer, a detector -- and an
                anonymous object cannot be referenced. The sibling branch of this anyOf is the
                by-reference form, a bare {"@id": ...} pointing at a component described elsewhere.
              type: string
              minLength: 1
            '@type':
              type: array
              items:
                type: string
              minItems: 2
              allOf:
              - contains:
                  const: schema:Product
              - contains:
                  const: schema:Thing
            'schema:name':
              type: string
            'schema:additionalType':
              type: array
              minItems: 1
              contains:
                type: object
                required:
                - '@id'
                properties:
                  '@id':
                    const: https://www.wikidata.org/wiki/Q3099911
            'ada:collectorConfiguration':
              description: >-
                How masses are assigned to collector positions for this procedure, AS THE SOURCE
                STATES IT. Free text on purpose: submitters write this as prose or as a
                semicolon-separated list in no agreed syntax ("L3=116Sn (Sn); L2=117Sn (Sn);
                Ax=120Sn ..."), and in many cases it cannot be parsed at all. Recording the
                statement verbatim is what can always be done; ada:collectors below is what can
                sometimes be done as well. Meaningful on a component whose
                schema:additionalType includes 'Collector'.
              type: string
            'ada:collectors':
              description: >-
                The collector table. One member per position when
                ada:collectorConfiguration parses into positions, and ONE member carrying the text
                as written when it does not -- the N=1 form of the flattening fallback that
                TAPP-keyed-values-design.md Decision 6 settles for every keyed axis: "rather than
                admit two shapes, always emit the table: a declaration that does not parse into
                members yields a one-row table whose row key is the text as written. The fallback
                is then not a separate branch but N=1."

                So a consumer reads one shape either way. In the N=1 form schema:name is a fixed
                label rather than a cup ('Collector configuration description'),
                schema:description carries the unparsed string, and the per-item values ride in
                schema:additionalProperty as name/value pairs. Parsing these strings to individual
                collectors is not tractable in general -- they are written for a person to read --
                so N=1 is expected to be the common case, not the exception.

                This exists because a cup label has to be referenceable WHEN there is one. A
                per-cup quantity (a baseline, a gain factor) and a monitored property that names
                the position reporting it both need something to point AT, and a label buried in a
                sentence is not something a consumer can join to. schema:name is that anchor.

                What a collector does NOT carry is which monitored property it measures. That
                assignment is procedure configuration, not hardware -- the same physical array is
                wired differently by another procedure, and an analysis may override it -- so it
                lives as the 'collector' column of ada:monitoredPropertyColumns on the method
                definition, whose values are these schema:names. Putting it here would invert the
                dependency and make the instrument description procedure-specific.

                Note what an N=1 member does NOT assert: it names no cup, so it makes no per-cup
                claim. That matters because the resistor values are attested per MASS, not per cup
                (Proposal_Monitored_Property_2026-09-10 §10), and the fallback must not quietly
                move them onto the collector axis.
              type: array
              items:
                type: object
                required:
                - '@type'
                - 'schema:name'
                properties:
                  '@type':
                    type: array
                    minItems: 1
                    items:
                      type: string
                    contains:
                      const: ada:Collector
                  'schema:name':
                    description: >-
                      The collector position label as the instrument names it -- L5..L1, C or Ax,
                      H1..H5, IC1..IC8 on a Neptune-class multicollector. This is the identifier
                      other properties reference. In the N=1 fallback there is no position to
                      name, so it is the fixed label 'Collector configuration description' and
                      nothing should join to it.
                    type: string
                    minLength: 1
                  'schema:description':
                    type: string
                  'schema:additionalProperty':
                    description: >-
                      Quantities carried on this member as name/value pairs. In the parsed form
                      these are per-position quantities that cannot be restated per mass -- a
                      baseline, a gain factor. In the N=1 form they are the source fields
                      themselves, each as its item name and the text as written, which is how an
                      unparseable per-collector statement is preserved without inventing an
                      assignment it does not make.
                    type: array
                    items:
                      type: object
                      required:
                      - 'schema:name'
                      properties:
                        'schema:name':
                          description: The item name, e.g. 'Faraday Cup Amplifier Resistor Values'.
                          type: string
                        'schema:value':
                          description: The value, as written when it did not parse.
        - type: object
          additionalProperties: false
          description: Reference by node @id to a component described elsewhere.
          required:
          - '@id'
          properties:
            '@id':
              type: string
  required:
  - '@id'
  - schema:additionalType
