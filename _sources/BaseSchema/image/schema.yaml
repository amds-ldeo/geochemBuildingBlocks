$schema: https://json-schema.org/draft/2020-12/schema
title: Image Type
description: >-
  Image objects with acquisition details and component type classification.
  Typed as ada:image and schema:ImageObject.
type: object
properties:
  "@type":
    type: array
    items:
      type: string
    minItems: 2
    allOf:
      - contains:
          const: "ada:image"
      - contains:
          const: "schema:ImageObject"
    description: GeneralType for images
  'ada:acquisitionTime':
    type: string
  'ada:componentType':
    type: string
    enum:
      - ada:AIVAImage
      - ada:BSEImage
      - ada:CLImage
      - ada:CPDImage
      - ada:EPMAESPCPlot
      - ada:EPMAImage
      - ada:FIBSEMImage
      - ada:GCMSChromatogram
      - ada:GCMSSpectraPlot
      - ada:L2MSOverviewImage
      - ada:L2MSSpectraPlot
      - ada:LAICPMSImage
      - ada:LCMSChromatogram
      - ada:LCMSVisualization
      - ada:LITImage
      - ada:NanoIRBackground
      - ada:NanoSIMSImage
      - ada:PSFDContextImage
      - ada:QRISCalibrated
      - ada:QRISCalibratedImage
      - ada:QRISFlatFieldImage
      - ada:QRISRaw
      - ada:QRISRawImage
      - ada:SEMEDSPointSpectraPlot
      - ada:SEMFIBIonImage
      - ada:SEMHRCLimage
      - ada:SEMImage
      - ada:SIMSProcessedImage
      - ada:SLSShapeModelImage
      - ada:STEMEDSSpectraPlot
      - ada:STEMEELSSpectraPlot
      - ada:STEMImage
      - ada:SVRUECWaveformPlot
      - ada:SXRF2DImage
      - ada:TEMDiffractionPattern
      - ada:TEMImage
      - ada:TEMPatternsImage
      - ada:TOFSIMSIonImages
      - ada:TOFSIMSMassSpectrumPlot
      - ada:UVFMImage
      - ada:VLMImage
      - ada:VNMIROverviewImage
      - ada:VNMIRSpectraPlot
      - ada:XANESImageStack
      - ada:XANESStackOverviewImage
      - ada:XRDDiffractionPattern
      - ada:XRDIndexedImage
      - ada:plot
      - ada:analysisLocation
      - ada:annotatedImage
      - ada:areaOfInterest
      - ada:basemap
      - ada:calibrationFile
      - ada:code
      - ada:contextPhotography
      - ada:contextVideo
      - ada:inputFile
      - ada:instrumentMetadata
      - ada:logFile
      - ada:methodDescription
      - ada:other
      - ada:processingMethod
      - ada:quickLook
      - ada:report
      - ada:samplePreparation
      - ada:shapefile
      - ada:supplementalBasemap
      - ada:supplementaryImage
      - ada:worldFile
      - nil:missing
    description: >-
      ADA componentType for an image, as a single string. Allowed values
      are constrained at the technique-profile level.
  'ada:channel1':
    type: string
  'ada:channel2':
    type: string
  'ada:channel3':
    type: string
  'ada:pixelSize':
    type: string
  'ada:illuminationType':
    type: string
    description: >-
      Type of illumination used to create the image. Examples include
      Visible light, Cross-polarized visible light, ultraviolet light, Electron beam, X-ray.
  'ada:imageType':
    type: string
    description: >-
      Specifies the nature of the sample's response to the illumination that was
      detected and measured.
  'ada:spatialRegistration':
    description: >-
      Pixel size and its units. SCALING ONLY -- the half of a spatial registration an
      unregistered image can state. A plain image has a pixel size, and ada:pixelScaleX on an
      ada:EPMAImage is a well-formed statement, but an image does not say where it sits on the
      sample or how its axes relate to the sample axes. The imageMap block references the full
      shape, which adds the origin, the origin corner, the coordinate definition and the two
      rotation terms, and whose required list demands them.

      Same property NAME on both branches on purpose: a placement path such as
      schema:hasPart[@type=ada:image|ada:imageMap].ada:spatialRegistration.ada:pixelScaleX then
      resolves through either, which is what the subject-key register and the TAPP sidecars both
      target. Before this, the image branch declared no spatialRegistration at all -- not because
      a pixel scale is meaningless on an image, but because the only available shape required an
      origin and a corner, so an image could not use it without asserting a registration it does
      not have.
    $ref: ../spatialRegistration/schema.yaml#/$defs/Scaling
required:
  - "@type"
  - 'ada:componentType'
