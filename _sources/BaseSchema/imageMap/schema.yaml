$schema: https://json-schema.org/draft/2020-12/schema
title: Image Map Type
description: >-
  Spatially registered image maps with pixel coordinates, component type
  classification, and spatial registration metadata.
type: object
properties:
  "@type":
    type: array
    items:
      type: string
    minItems: 2
    allOf:
      - contains:
          const: "ada:imageMap"
      - contains:
          const: "schema:ImageObject"
  'ada:acquisitionTime':
    type: string
  'ada:componentType':
    type: string
    description: >-
      ADA componentType for an imageMap, as a single string. Allowed values
      are constrained at the technique-profile level.
  'ada:channel1':
    type: string
  'ada:channel2':
    type: string
  'ada:channel3':
    type: string
  'ada:illuminationType':
    type: string
    description: >-
      Type of illumination used to create the image.
  'ada:imageType':
    type: string
    description: >-
      Specifies the nature of the sample's response to the illumination.
  'ada:numPixelsX':
    type: integer
  'ada:numPixelsY':
    type: integer
  'ada:spatialRegistration':
    $ref: ../spatialRegistration/schema.yaml
required:
  - "@type"
  - 'ada:componentType'
