$schema: https://json-schema.org/draft/2020-12/schema
title: EMPA Instrument Detail
description: >-
  Detail block for Electron Microprobe Analysis hasPart items. Discriminates
  on ada:componentType (string) and contributes ada:spectrometersUsed and
  ada:signalUsed as sibling properties on the hasPart item. Per-dataset
  schema:additionalProperty entries are constrained by the generated
  parametersConstraint.yaml (one schema:PropertyValue branch per readOnly:false
  empaTAPP parameter, plus a catch-all). schema:measurementTechnique is an
  @id reference to a registered empaTAPP TAPP definition.
allOf:
  - type: object
    properties:
      'ada:componentType':
        anyOf:
          - const: "ada:EMPAImage"
          - const: "ada:EMPAImageMap"
          - const: "ada:EMPAQEATabular"
          - const: "ada:EMPAImageCollection"
          - const: "ada:EMPAESPCTabular"
          - const: "ada:EMPAESPCPlot"
      'ada:spectrometersUsed':
        type: string
        description: Spectrometers used in analysis
      'ada:signalUsed':
        type: string
      'schema:measurementTechnique':
        type: object
        description: >-
          @id reference to a registered empaTAPP TAPP definition.
        properties:
          '@id':
            type: string
            format: uri
        required:
          - '@id'
    required:
      - 'ada:componentType'
  - $ref: parametersConstraint.yaml
