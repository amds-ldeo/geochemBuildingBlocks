$schema: https://json-schema.org/draft/2020-12/schema
title: EMPA Instrument Detail
description: >-
  Detail block for Electron Microprobe Analysis hasPart items. Discriminates
  on ada:componentType (string) and contributes ada:spectrometersUsed and
  ada:signalUsed as sibling properties on the hasPart item. Per-dataset
  schema:additionalProperty entries are constrained by the generated
  parametersConstraint.yaml (one schema:PropertyValue branch per readOnly:false
  empaTAPP parameter, plus a catch-all). schema:measurementTechnique points
  at an empaTAPP TAPP definition either by @id reference (preferred) or
  inline (used when the resolved structured schema must be self-contained).
allOf:
  - type: object
    properties:
      'ada:componentType':
        anyOf:
          - const: "ada:EMPAImage"
          - const: "ada:EMPAImageMap"
          - const: "ada:EMPAQEATabular"
          - const: "ada:EMPAImageCollection"
          - const: "ada:EMPAESPCTabular"
          - const: "ada:EMPAESPCPlot"
      'ada:spectrometersUsed':
        type: string
        description: Spectrometers used in analysis
      'ada:signalUsed':
        type: string
      'schema:measurementTechnique':
        description: >-
          The TAPP definition this EMPA detail conforms to. Either an @id
          reference to a registered TAPP or an inline empaTAPP definition
          (used when the resolved structured schema must be self-contained,
          e.g. when no live registry is available).
        anyOf:
          - type: object
            description: URI reference to a registered TAPP definition.
            properties:
              '@id':
                type: string
                format: uri
            required:
              - '@id'
          - $ref: ../../techniqueProtocols/empaTAPP/schema.yaml
    required:
      - 'ada:componentType'
  - $ref: parametersConstraint.yaml
