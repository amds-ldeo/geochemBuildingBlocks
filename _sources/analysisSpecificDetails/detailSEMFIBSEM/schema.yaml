$schema: https://json-schema.org/draft/2020-12/schema
title: FIB-SEM Analysis Detail
description: Detail block for FIB-SEM hasPart items. Discriminates on ada:componentType, carries analysis-level
  required properties and an @id reference to a registered semFibsemTAPP definition, and per-dataset schema:additionalProperty
  entries constrained via $refs to the parameterValues registry plus a catch-all. Generated by tools/build_tapp.py.
allOf:
- type: object
  properties:
    ada:componentType:
      anyOf:
      - const: ada:FIBSEMVolume
      - const: ada:FIBSEMImage
      - const: ada:FIBSEMSegmentation
      - const: ada:FIBSEMTabular
    schema:measurementTechnique:
      type: object
      description: '@id reference to a registered semFibsemTAPP TAPP definition.'
      properties:
        '@id':
          type: string
          format: uri
      required:
      - '@id'
    ada:analyst:
      description: Name of the analyst who conducted the analysis session.
      type: string
    ada:analysisStartDate:
      description: Date on which the analysis session began.
      type: string
    ada:analysisEndDate:
      description: Date on which the analysis session ended (if spanning multiple days).
      type: string
    ada:fundingSourceForAnalysis:
      description: Grants and funding that supported this analytical campaign. Include grant IDs.
      type: string
    ada:sampleName:
      description: Name or identifier of the sample or sample mount analyzed in this session.
      type: string
    ada:voxelSize:
      description: X, Y, Z dimensions of the reconstructed 3D voxel in nanometres (X-Y pixel size from
        SEM image calibration; Z from slice thickness), and the total number of slices in the stack. Determined
        at analysis time.
      type: string
  required:
  - ada:componentType
  - ada:analyst
  - ada:analysisStartDate
  - ada:analysisEndDate
  - ada:fundingSourceForAnalysis
  - ada:sampleName
  - ada:voxelSize
- type: object
  properties:
    schema:additionalProperty:
      type: array
      description: Per-dataset schema:PropertyValue entries. All optional.
      items:
        anyOf:
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/semFibsem_coupledProtocolDoi
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/semFibsem_coupledDatasetOrPublicationReference
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/semFibsem_samplePersistentIdentifier
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/semFibsem_acceleratingVoltage
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/semFibsem_beamCurrent
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/semFibsem_workingDistance
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/semFibsem_dwellTimePerPixel
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/protectiveCoatingDeposition
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/coarseMillingConditions
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/finePolishingConditions
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/targetFoilThickness
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/ionMillingConditions
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/sliceThickness
        - type: object
          description: Catch-all for additional schema:PropertyValue entries beyond the semFibsemTAPP-derived
            catalog.
          properties:
            '@type':
              type: array
              items:
                type: string
              contains:
                const: schema:PropertyValue
            schema:propertyID:
              type: string
              not:
                enum:
                - ada:parameter/semFibsemTAPP/coupledProtocolDoi
                - ada:parameter/semFibsemTAPP/coupledDatasetOrPublicationReference
                - ada:parameter/semFibsemTAPP/samplePersistentIdentifier
                - ada:parameter/semFibsemTAPP/acceleratingVoltage
                - ada:parameter/semFibsemTAPP/beamCurrent
                - ada:parameter/semFibsemTAPP/workingDistance
                - ada:parameter/semFibsemTAPP/dwellTimePerPixel
                - ada:parameter/semFibsemTAPP/protectiveCoatingDeposition
                - ada:parameter/semFibsemTAPP/coarseMillingConditions
                - ada:parameter/semFibsemTAPP/finePolishingConditions
                - ada:parameter/semFibsemTAPP/targetFoilThickness
                - ada:parameter/semFibsemTAPP/ionMillingConditions
                - ada:parameter/semFibsemTAPP/sliceThickness
          required:
          - '@type'
          - schema:propertyID
