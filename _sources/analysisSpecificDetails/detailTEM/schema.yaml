$schema: https://json-schema.org/draft/2020-12/schema
title: TEM Analysis Detail
description: Detail block for TEM hasPart items. Discriminates on ada:componentType, carries analysis-level
  required properties and an @id reference to a registered temTAPP definition, and per-dataset schema:additionalProperty
  entries constrained via $refs to the parameterValues registry plus a catch-all. Generated by tools/build_tapp.py.
allOf:
- type: object
  properties:
    ada:componentType:
      anyOf:
      - const: ada:TEMImage
      - const: ada:STEMImage
      - const: ada:TEMDiffractionPattern
      - const: ada:EELSSpectrum
      - const: ada:TEMTabular
    schema:measurementTechnique:
      type: object
      description: '@id reference to a registered temTAPP TAPP definition.'
      properties:
        '@id':
          type: string
          format: uri
      required:
      - '@id'
    ada:analyst:
      description: Name of the analyst who conducted the analysis session.
      type: string
    ada:analysisStartDate:
      description: Date on which the analysis session began.
      type: string
    ada:analysisEndDate:
      description: Date on which the analysis session ended (if spanning multiple days).
      type: string
    ada:fundingSourceForAnalysis:
      description: Grants and funding that supported this analytical campaign (distinct from protocol
        development funding). Include grant IDs.
      type: string
    ada:sampleName:
      description: Name or identifier of the sample or TEM section analyzed in this session.
      type: string
    ada:edsDetectionLimit:
      description: Estimated detection limits for key target analytes by EDS under this protocol conditions.
      type: string
    ada:edsDeadTime:
      description: Percent dead time reported by the EDS detector during the session — the fraction of
        total acquisition time the detector spent processing rather than counting. EDS dead time correction
        is managed automatically by the SDD detector electronics; this field documents the resulting percentage
        as a session QC metric. Values above ~40% indicate excessive count rate and may degrade spectral
        quality and quantitative accuracy.
      type: number
    ada:eelsSensitivityAndDetectionLimit:
      description: Practical energy resolution (ZLP FWHM measured at operating conditions) and estimated
        detection limit or minimum detectable concentration for target edges under this protocol.
      type: string
  required:
  - ada:componentType
  - ada:analyst
  - ada:analysisStartDate
  - ada:analysisEndDate
  - ada:fundingSourceForAnalysis
  - ada:sampleName
  - ada:edsDetectionLimit
  - ada:edsDeadTime
  - ada:eelsSensitivityAndDetectionLimit
- type: object
  properties:
    schema:additionalProperty:
      type: array
      description: Per-dataset schema:PropertyValue entries. All optional.
      items:
        anyOf:
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/tem_coupledProtocolDoi
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/tem_coupledDatasetOrPublicationReference
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/tem_samplePersistentIdentifier
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/tem_acceleratingVoltage
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/analyticalMode
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/temObjectiveAperture
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/eftemEnergyWindow
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/haadfCollectionAngles
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/stemProbeDiameter
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/stemProbeCurrent
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/stemDwellTimePerPixel
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/stemScanDimensions
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/stemFrameAveraging
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/cameraLength
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/selectedAreaApertureSize
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/precessionAngle
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/4dStemScanGridAndArea
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/4dStemDwellTimePerProbePosition
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/diffractionCameraLengthCalibrationMethod
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/edsAcquisitionMode
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/edsLiveTimePerPointOrPixel
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/edsEnergyRange
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/eelsAcquisitionMode
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/eelsEdges
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/eelsAcquisitionTimePerSpectrum
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/eelsEnergyLossRange
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/eelsBackgroundSubtractionMethod
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/eelsPluralScatteringCorrection
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/imageProcessingMethodsApplied
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/specimenThicknessDeterminationMethod
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/edsCalibrationStandard
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/eelsEnergyCalibration
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/diffractionCalibrationReference
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/edsCountingStatisticsAccumulationCriterion
        - type: object
          description: Catch-all for additional schema:PropertyValue entries beyond the temTAPP-derived
            catalog.
          properties:
            '@type':
              type: array
              items:
                type: string
              contains:
                const: schema:PropertyValue
            schema:propertyID:
              type: string
              not:
                enum:
                - ada:parameter/temTAPP/coupledProtocolDoi
                - ada:parameter/temTAPP/coupledDatasetOrPublicationReference
                - ada:parameter/temTAPP/samplePersistentIdentifier
                - ada:parameter/temTAPP/acceleratingVoltage
                - ada:parameter/temTAPP/analyticalMode
                - ada:parameter/temTAPP/temObjectiveAperture
                - ada:parameter/temTAPP/eftemEnergyWindow
                - ada:parameter/temTAPP/haadfCollectionAngles
                - ada:parameter/temTAPP/stemProbeDiameter
                - ada:parameter/temTAPP/stemProbeCurrent
                - ada:parameter/temTAPP/stemDwellTimePerPixel
                - ada:parameter/temTAPP/stemScanDimensions
                - ada:parameter/temTAPP/stemFrameAveraging
                - ada:parameter/temTAPP/cameraLength
                - ada:parameter/temTAPP/selectedAreaApertureSize
                - ada:parameter/temTAPP/precessionAngle
                - ada:parameter/temTAPP/4dStemScanGridAndArea
                - ada:parameter/temTAPP/4dStemDwellTimePerProbePosition
                - ada:parameter/temTAPP/diffractionCameraLengthCalibrationMethod
                - ada:parameter/temTAPP/edsAcquisitionMode
                - ada:parameter/temTAPP/edsLiveTimePerPointOrPixel
                - ada:parameter/temTAPP/edsEnergyRange
                - ada:parameter/temTAPP/eelsAcquisitionMode
                - ada:parameter/temTAPP/eelsEdges
                - ada:parameter/temTAPP/eelsAcquisitionTimePerSpectrum
                - ada:parameter/temTAPP/eelsEnergyLossRange
                - ada:parameter/temTAPP/eelsBackgroundSubtractionMethod
                - ada:parameter/temTAPP/eelsPluralScatteringCorrection
                - ada:parameter/temTAPP/imageProcessingMethodsApplied
                - ada:parameter/temTAPP/specimenThicknessDeterminationMethod
                - ada:parameter/temTAPP/edsCalibrationStandard
                - ada:parameter/temTAPP/eelsEnergyCalibration
                - ada:parameter/temTAPP/diffractionCalibrationReference
                - ada:parameter/temTAPP/edsCountingStatisticsAccumulationCriterion
          required:
          - '@type'
          - schema:propertyID
