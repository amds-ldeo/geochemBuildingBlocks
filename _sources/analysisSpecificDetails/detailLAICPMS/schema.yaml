$schema: https://json-schema.org/draft/2020-12/schema
title: LA-ICPMS Analysis Detail
description: Detail block for LA-ICP-MS hasPart items. Discriminates on ada:componentType, carries analysis-level
  required properties and an @id reference to a registered laicpmsTAPP definition, and per-dataset schema:additionalProperty
  entries constrained via $refs to the parameterValues registry plus a catch-all. Generated by tools/build_tapp.py.
allOf:
- type: object
  properties:
    ada:componentType:
      anyOf:
      - const: ada:LAICPMSTabular
      - const: ada:LAICPMSMap
      - const: ada:LAICPMSImage
      - const: ada:LAICPMSTransect
    schema:measurementTechnique:
      type: object
      description: '@id reference to a registered laicpmsTAPP TAPP definition.'
      properties:
        '@id':
          type: string
          format: uri
      required:
      - '@id'
    ada:analyst:
      description: Name(s) of the analyst(s) who performed the actual analysis. ORCID is recommended for
        persistent identification.
      type: string
    ada:analysisStartDate:
      description: 'Date on which the analytical session began. For analyses spanning multiple days, use
        the date of the first session. Format: YYYY-MM-DD.'
      type: string
    ada:analysisEndDate:
      description: 'Date on which the analytical session ended. May equal Analysis Start Date for single-day
        sessions. Format: YYYY-MM-DD.'
      type: string
    ada:fundingSourceForAnalysis:
      description: Grants and other funding sources that supported the specific sample analyses and data
        collection reported here. Include grant numbers and funding agencies. Distinct from protocol development
        funding, which may have been awarded years earlier.
      type: string
    ada:sampleName:
      description: Name or identifier of the sample analysed, as used in the laboratory. Should match
        the identifier used in associated publications or data tables.
      type: string
    ada:oxideProduction:
      description: Actual oxide production ratio measured during this analytical session, using the method
        specified in the protocol-level field "Oxide Production Method and Threshold". Report the measured
        value and confirm it met the protocol threshold.
      type: string
    ada:analysisLocationSpotCoordinates:
      description: 'Location of the analysis on the sample surface. For spot and transect analysis: stage
        coordinates (X, Y in µm) or a description relative to a named reference feature (e.g., mineral
        rim, inclusion boundary). For mapping: coordinates of the map corner(s) or centre, plus map dimensions.
        Enables spatial reconstruction and co-registration with other analytical images.'
      type: string
    ada:numberOfReplicates:
      description: 'Number of replicate analyses performed on the same sample (or same nominal location
        for spot analysis) in this session. For spot analysis: number of individual spot analyses per
        grain or location. For transect: number of replicate transect lines. For mapping: number of map
        acquisitions of the same area (usually 1).'
      type: integer
    ada:transectLength:
      description: Total length of the transect line analysed in micrometres. This is an analysis-level
        parameter because it depends on the size of the feature of interest rather than being fixed in
        the protocol. The protocol fixes scan speed (captured in Transect Rate, Mapping Rate or Step Size);
        transect length is determined at analysis time based on grain or feature size.
      type: number
    ada:mappingArea:
      description: Total area covered by the 2D raster map, expressed as width × height in µm or as total
        area in µm² or mm². This is an analysis-level parameter because it depends on the size of the
        grain or phase to be mapped. The protocol fixes scan speed, line spacing, and spot size; the map
        area is chosen at analysis time to cover the target feature.
      type: string
    ada:signalIntegrationTime:
      description: 'Actual integration time used for the ablation signal in this analysis, in seconds.
        This is an analysis-level outcome determined during data reduction by applying the Signal Integration
        Interval Method to the time-resolved signal. It is equal to or shorter than the Ablation Duration
        per Spot because the signal start and end transients are typically discarded. Not applicable to
        mapping analysis: for mapping, the equivalent concept is the per-pixel cycle time, which is determined
        by the spectrometer dwell time settings (a protocol-level field) rather than being an analysis-level
        outcome.'
      type: number
  required:
  - ada:componentType
  - ada:analyst
  - ada:analysisStartDate
  - ada:analysisEndDate
  - ada:fundingSourceForAnalysis
  - ada:sampleName
  - ada:oxideProduction
  - ada:analysisLocationSpotCoordinates
  - ada:numberOfReplicates
  - ada:transectLength
  - ada:signalIntegrationTime
- type: object
  properties:
    schema:additionalProperty:
      type: array
      description: Per-dataset schema:PropertyValue entries. All optional.
      items:
        anyOf:
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/laicpms_coupledTechnique
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/laicpms_couplingDescription
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/laicpms_coupledProtocolDoi
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/laicpms_coupledDatasetOrPublicationReference
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/sampleFormAnalyticalSubstrate
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/laicpms_samplePersistentIdentifier
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/fusionFluxAndDilutionRatio
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/samplePreparationMethod
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/preAblationSurfaceTreatment
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/torchDepth
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/massResolutionSetting
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/laicpms_acquisitionSoftware
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/dataReductionSoftware
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/laserSpotGeometry
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/laserEnergy
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/laserFluence
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/laserRepetitionRate
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/ablationDurationPerSpot
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/transectRateMappingRateOrStepSize
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/rasterLineSpacing
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/carrierGasAndFlowRate
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/plasmaMakeUpGasAddition
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/auxiliaryAndCoolGasFlowRates
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/signalSmoothing
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/icpTuning
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/doublyChargedSpeciesMonitor
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/doublyChargedSpeciesProduction
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/driftMonitorFrequency
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/analysisSequence
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/spectrometerDwellTime
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/backgroundCountTime
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/uncertaintyPropagationMethod
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/spikeOutlierFilteringApproach
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/pulseAnalogDetectorNonlinearityCorrection
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/memoryEffectMitigation
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/normalizationStandardsBasedCorrection
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/primaryCalibrationStandardName
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/secondaryReferenceMaterials
        - $ref: ../../techniqueProtocols/parameterValues/schema.yaml#/$defs/additionalNotes
        - type: object
          description: Catch-all for additional schema:PropertyValue entries beyond the laicpmsTAPP-derived
            catalog.
          properties:
            '@type':
              type: array
              items:
                type: string
              contains:
                const: schema:PropertyValue
            schema:propertyID:
              type: string
              not:
                enum:
                - ada:parameter/laicpmsTAPP/coupledTechnique
                - ada:parameter/laicpmsTAPP/couplingDescription
                - ada:parameter/laicpmsTAPP/coupledProtocolDoi
                - ada:parameter/laicpmsTAPP/coupledDatasetOrPublicationReference
                - ada:parameter/laicpmsTAPP/sampleFormAnalyticalSubstrate
                - ada:parameter/laicpmsTAPP/samplePersistentIdentifier
                - ada:parameter/laicpmsTAPP/fusionFluxAndDilutionRatio
                - ada:parameter/laicpmsTAPP/samplePreparationMethod
                - ada:parameter/laicpmsTAPP/preAblationSurfaceTreatment
                - ada:parameter/laicpmsTAPP/torchDepth
                - ada:parameter/laicpmsTAPP/massResolutionSetting
                - ada:parameter/laicpmsTAPP/acquisitionSoftware
                - ada:parameter/laicpmsTAPP/dataReductionSoftware
                - ada:parameter/laicpmsTAPP/laserSpotGeometry
                - ada:parameter/laicpmsTAPP/laserEnergy
                - ada:parameter/laicpmsTAPP/laserFluence
                - ada:parameter/laicpmsTAPP/laserRepetitionRate
                - ada:parameter/laicpmsTAPP/ablationDurationPerSpot
                - ada:parameter/laicpmsTAPP/transectRateMappingRateOrStepSize
                - ada:parameter/laicpmsTAPP/rasterLineSpacing
                - ada:parameter/laicpmsTAPP/carrierGasAndFlowRate
                - ada:parameter/laicpmsTAPP/plasmaMakeUpGasAddition
                - ada:parameter/laicpmsTAPP/auxiliaryAndCoolGasFlowRates
                - ada:parameter/laicpmsTAPP/signalSmoothing
                - ada:parameter/laicpmsTAPP/icpTuning
                - ada:parameter/laicpmsTAPP/doublyChargedSpeciesMonitor
                - ada:parameter/laicpmsTAPP/doublyChargedSpeciesProduction
                - ada:parameter/laicpmsTAPP/driftMonitorFrequency
                - ada:parameter/laicpmsTAPP/analysisSequence
                - ada:parameter/laicpmsTAPP/spectrometerDwellTime
                - ada:parameter/laicpmsTAPP/backgroundCountTime
                - ada:parameter/laicpmsTAPP/uncertaintyPropagationMethod
                - ada:parameter/laicpmsTAPP/spikeOutlierFilteringApproach
                - ada:parameter/laicpmsTAPP/pulseAnalogDetectorNonlinearityCorrection
                - ada:parameter/laicpmsTAPP/memoryEffectMitigation
                - ada:parameter/laicpmsTAPP/normalizationStandardsBasedCorrection
                - ada:parameter/laicpmsTAPP/primaryCalibrationStandardName
                - ada:parameter/laicpmsTAPP/secondaryReferenceMaterials
                - ada:parameter/laicpmsTAPP/additionalNotes
          required:
          - '@type'
          - schema:propertyID
