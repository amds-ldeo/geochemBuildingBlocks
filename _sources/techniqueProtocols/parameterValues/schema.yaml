$schema: https://json-schema.org/draft/2020-12/schema
title: ADA Analytical Parameter Value Registry
description: Registry of reusable schema:PropertyValue parameter-value definitions derived from technique TAPP spreadsheets. Each $def constrains one per-dataset schema:PropertyValue entry. Detail building blocks reference these definitions via fragment $refs (schema.yaml#/$defs/<name>) so they resolve locally through the building-block register. The root only hosts $defs; it has no instantiable properties of its own.
type: object
$defs:
  laicpms_coupledTechnique:
    title: Coupled Technique(s)
    description: Analytical technique(s) applied to the same sample or aliquot in conjunction with this protocol, where the two analyses are designed to be interpreted together or where one provides input to the other. Use the same controlled vocabulary as the Technique field. Enter "None" if no coupling is intended.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/coupledTechnique
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/coupledTechnique
      schema:name:
        const: Coupled Technique(s)
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  laicpms_couplingDescription:
    title: Coupling Description
    description: 'Description of how this protocol is coupled with the technique(s) listed above. Include: (1) the functional relationship — what data or context flows between techniques or how results are combined (e.g., which output from the coupled technique serves as input to data reduction for this technique); and (2) the analytical sequence — which technique is performed first and why (e.g., non-destructive before destructive).'
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/couplingDescription
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/couplingDescription
      schema:name:
        const: Coupling Description
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  laicpms_coupledProtocolDoi:
    title: Coupled Protocol DOI
    description: Registered protocol DOI for the coupled technique named above. Provides a stable, citable link to the companion method independent of whether a dataset has been deposited. If the coupled protocol has not yet been registered, enter the DOI of a publication describing the coupled method, or "pending". Enter "None" if no coupling is planned.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/coupledProtocolDoi
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/coupledProtocolDoi
      schema:name:
        const: Coupled Protocol DOI
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  laicpms_coupledDatasetOrPublicationReference:
    title: Coupled Dataset or Publication Reference
    description: 'DOI or other persistent identifier for the co-registered dataset or publication where both datasets are reported together. Accepts: a dedicated dataset DOI (if separately deposited), a shared dataset DOI (if co-submitted in the same package), or a publication DOI. Use "same submission" if the coupled dataset is included in this data package, or "pending" if not yet assigned. If coupling is documented through a shared sample identifier only, that information is already captured in Sample Persistent Identifier (Group 2).'
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/coupledDatasetOrPublicationReference
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/coupledDatasetOrPublicationReference
      schema:name:
        const: Coupled Dataset or Publication Reference
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  sampleFormAnalyticalSubstrate:
    title: Sample Form / Analytical Substrate
    description: Physical form of the material as it enters the ablation cell. Editable to accommodate legitimate variations (e.g., thin section vs. mount) that do not alter the analytical protocol.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/sampleFormAnalyticalSubstrate
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/sampleFormAnalyticalSubstrate
      schema:name:
        const: Sample Form / Analytical Substrate
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  laicpms_samplePersistentIdentifier:
    title: Sample Persistent Identifier
    description: Globally unique, persistent identifier for the analysed sample. IGSN (International Geo Sample Number) is the recommended standard for geological and cosmochemical samples, as used by Astromat, EarthChem, and SESAR.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/samplePersistentIdentifier
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/samplePersistentIdentifier
      schema:name:
        const: Sample Persistent Identifier
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  fusionFluxAndDilutionRatio:
    title: Fusion Flux and Dilution Ratio
    description: For protocols using fused glass, the flux type and sample:flux dilution ratio used to prepare the analytical glass.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/fusionFluxAndDilutionRatio
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/fusionFluxAndDilutionRatio
      schema:name:
        const: Fusion Flux and Dilution Ratio
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  samplePreparationMethod:
    title: Sample Preparation Method
    description: Description of how samples were prepared for analysis (mounting, polishing, coating, fusion procedure, etc.).
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/samplePreparationMethod
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/samplePreparationMethod
      schema:name:
        const: Sample Preparation Method
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  preAblationSurfaceTreatment:
    title: Pre-Ablation Surface Treatment
    description: Protocol applied immediately before each analysis to remove surface contamination or condition the sample surface. Distinct from general sample preparation. For spot analysis, pre-ablation pulses are discarded before signal acquisition begins. For mapping, this step is typically omitted as the large area ablated averages out surface effects.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/preAblationSurfaceTreatment
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/preAblationSurfaceTreatment
      schema:name:
        const: Pre-Ablation Surface Treatment
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  torchDepth:
    title: Torch Depth
    description: Distance between the load coil and the sampling cone tip (mm), also called injector depth or torch position depending on the instrument manufacturer. Affects ion transmission efficiency, oxide formation, and doubly-charged species production. The protocol specifies a target value optimised during initial setup; the analyst confirms or fine-adjusts during session tuning.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/torchDepth
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/torchDepth
      schema:name:
        const: Torch Depth
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  massResolutionSetting:
    title: Mass Resolution Setting
    description: Operating mass resolution of the mass analyser. For quadrupole instruments this is fixed at unit resolution by instrument design. For sector-field instruments the analyst selects low, medium, or high resolution to balance sensitivity against spectral interference suppression.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/massResolutionSetting
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/massResolutionSetting
      schema:name:
        const: Mass Resolution Setting
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  laicpms_acquisitionSoftware:
    title: Acquisition Software
    description: Instrument control and data acquisition software used to collect raw signal data, including version number. Separate from data reduction software.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/acquisitionSoftware
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/acquisitionSoftware
      schema:name:
        const: Acquisition Software
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  dataReductionSoftware:
    title: Data Reduction Software
    description: Software used for signal processing, background subtraction, and concentration calculation, including version number.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/dataReductionSoftware
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/dataReductionSoftware
      schema:name:
        const: Data Reduction Software
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  laserSpotGeometry:
    title: Laser Spot Geometry
    description: Shape and dimensions of the laser ablation spot in micrometres registered by the protocol. For circular spots, report diameter; for square or rectangular spots, report width × length. The protocol registers the typical geometry; analysts may adjust within protocol-allowed range.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/laserSpotGeometry
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/laserSpotGeometry
      schema:name:
        const: Laser Spot Geometry
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  laserEnergy:
    title: Laser Energy
    description: Laser pulse energy in millijoules as set at the laser output or measured at the sample surface. Less commonly reported than fluence because it does not account for spot area. Report only when the system displays energy directly. Laser fluence (J cm⁻²) is the preferred quantity and is captured in Default Laser Fluence.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/laserEnergy
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/laserEnergy
      schema:name:
        const: Laser Energy
      schema:value:
        anyOf:
          - type: number
          - type: string
      schema:unitText:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
      - schema:unitText
  laserFluence:
    title: Laser Fluence (Energy Density)
    description: Laser pulse energy per unit area at the sample surface in J cm⁻², as registered by the protocol. Fluence is the physically meaningful quantity controlling ablation rate, crater morphology, elemental fractionation, and particle size distribution. If the system reports only as % of maximum output, include that value and note the system maximum where known.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/laserFluence
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/laserFluence
      schema:name:
        const: Laser Fluence (Energy Density)
      schema:value:
        anyOf:
          - type: number
          - type: string
      schema:unitText:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
      - schema:unitText
  laserRepetitionRate:
    title: Laser Repetition Rate
    description: Laser pulse repetition rate in hertz registered by the protocol. For mapping methods, repetition rate together with scan speed and spot size determines pixel size and spatial resolution. Analysts may adjust within protocol-allowed bounds.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/laserRepetitionRate
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/laserRepetitionRate
      schema:name:
        const: Laser Repetition Rate
      schema:value:
        anyOf:
          - type: number
          - type: string
      schema:unitText:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
      - schema:unitText
  ablationDurationPerSpot:
    title: Ablation Duration per Spot
    description: 'Total on-sample ablation (signal acquisition) time per individual spot in seconds, as set in the acquisition method. This is a protocol-level parameter for spot analysis: it reflects the deliberate trade-off between signal accumulation (longer = lower LOD), sample consumption, and session throughput. For transect analysis, the equivalent protocol-level parameter is scan speed (captured in Transect Rate, Mapping Rate or Step Size). For mapping analysis, total acquisition time is sample-area-dependent and therefore analysis-level, not captured here.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/ablationDurationPerSpot
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/ablationDurationPerSpot
      schema:name:
        const: Ablation Duration per Spot
      schema:value:
        anyOf:
          - type: number
          - type: string
      schema:unitText:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
      - schema:unitText
  transectRateMappingRateOrStepSize:
    title: Transect Rate, Mapping Rate or Step Size
    description: 'For continuous line scan (transect) and raster mapping: the stage translation speed in µm s⁻¹. This is the protocol-level parameter that, together with spot size and repetition rate, determines spatial resolution along the scan direction. For mapping, the mapping rate (mm² h⁻¹) may be reported as an alternative when scan speed is session-variable. For stepped line profiles: the distance between successive spot positions in µm.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/transectRateMappingRateOrStepSize
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/transectRateMappingRateOrStepSize
      schema:name:
        const: Transect Rate, Mapping Rate or Step Size
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  rasterLineSpacing:
    title: Raster Line Spacing (Mapping Only)
    description: Distance between adjacent raster lines in a 2D elemental map, measured perpendicular to the scan direction, in micrometres. Together with spot size, this determines whether adjacent lines are contiguous (line spacing = spot size), overlapping (line spacing < spot size), or have gaps (line spacing > spot size). Applies to raster mapping only.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/rasterLineSpacing
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/rasterLineSpacing
      schema:name:
        const: Raster Line Spacing (Mapping Only)
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  carrierGasAndFlowRate:
    title: Carrier Gas and Flow Rate
    description: Gas used to transport ablated aerosol from the ablation cell to the ICP-MS torch, with the protocol-registered target flow rate(s). Helium is standard for most UV laser systems due to superior aerosol transport. Flow rates are protocol targets; actual session values may be adjusted within ±10% during tuning.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/carrierGasAndFlowRate
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/carrierGasAndFlowRate
      schema:name:
        const: Carrier Gas and Flow Rate
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  plasmaMakeUpGasAddition:
    title: Plasma / Make-up Gas Addition
    description: Additional gas(es) mixed into the carrier stream downstream of the ablation cell, with the protocol-registered target flow rate. Ar make-up gas is standard. Small N₂ additions can enhance sensitivity for some elements. If N₂ is not added, state "None" explicitly to distinguish from not reported.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/plasmaMakeUpGasAddition
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/plasmaMakeUpGasAddition
      schema:name:
        const: Plasma / Make-up Gas Addition
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  auxiliaryAndCoolGasFlowRates:
    title: Auxiliary and Cool Gas Flow Rates
    description: ICP auxiliary (intermediate) and cool (outer/plasma) Ar gas flow rates in l min⁻¹. The protocol registers target values; actual session values may be adjusted slightly during tuning.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/auxiliaryAndCoolGasFlowRates
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/auxiliaryAndCoolGasFlowRates
      schema:name:
        const: Auxiliary and Cool Gas Flow Rates
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  signalSmoothing:
    title: Signal Smoothing
    description: 'Description of any signal smoothing device or approach installed between the ablation cell and the ICP-MS to reduce pulse-to-pulse signal variability. Note: active signal smoothing devices (e.g., squid, SCFAST) are generally incompatible with high-resolution raster mapping because they degrade spatial resolution by mixing aerosol from successive laser shots. For mapping analyses, report "None" explicitly.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/signalSmoothing
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/signalSmoothing
      schema:name:
        const: Signal Smoothing
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  icpTuning:
    title: ICP Tuning
    description: Description of the approach used to optimise ICP plasma conditions prior to analysis, including the reference material used for tuning and the acceptance criteria (e.g., oxide production threshold, sensitivity targets, mass calibration).
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/icpTuning
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/icpTuning
      schema:name:
        const: ICP Tuning
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  doublyChargedSpeciesMonitor:
    title: Doubly-Charged Species Monitor
    description: The mass ratio monitored to estimate doubly-charged ion (M²⁺) formation during instrument tuning. Doubly-charged ions appear at half the mass of the parent ion and can cause isobaric interferences on analytes in that mass region. The monitor species and the mass positions monitored should be stated explicitly. Analogous to Oxide Production Method and Threshold for oxide monitoring.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/doublyChargedSpeciesMonitor
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/doublyChargedSpeciesMonitor
      schema:name:
        const: Doubly-Charged Species Monitor
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  doublyChargedSpeciesProduction:
    title: Doubly-Charged Species Production
    description: Measured percentage of doubly-charged ion production for the monitored species at the time of instrument tuning. The protocol should specify the acceptable threshold (e.g., <1%, <3%); the measured value for each session is recorded here. Report both the threshold and the measured value where possible.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/doublyChargedSpeciesProduction
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/doublyChargedSpeciesProduction
      schema:name:
        const: Doubly-Charged Species Production
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  driftMonitorFrequency:
    title: Drift Monitor Frequency
    description: Frequency at which primary reference materials are analysed to monitor instrument drift and apply drift corrections across the session. Editable to allow analysts to increase monitoring frequency if drift is observed.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/driftMonitorFrequency
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/driftMonitorFrequency
      schema:name:
        const: Drift Monitor Frequency
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  analysisSequence:
    title: Analysis Sequence
    description: Repeating order of primary calibration standard(s), quality control standard(s), and unknown analyses within a measurement session. Editable to allow minor adjustments while maintaining the bracketing strategy defined in the protocol.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/analysisSequence
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/analysisSequence
      schema:name:
        const: Analysis Sequence
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  backgroundCountTime:
    title: Background Count Time
    description: Total time spent measuring gas blank (background signal with laser off or shutter closed) before each ablation event, in seconds. For spot and transect analysis, a discrete background interval is measured before each ablation. For mapping, background is typically measured once per raster line or at the start of a map session rather than before each individual pixel. Editable to allow session-specific adjustment.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/backgroundCountTime
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/backgroundCountTime
      schema:name:
        const: Background Count Time
      schema:value:
        anyOf:
          - type: number
          - type: string
      schema:unitText:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
      - schema:unitText
  uncertaintyPropagationMethod:
    title: Uncertainty Propagation Method
    description: 'Approach used to propagate analytical uncertainty from raw count rates through the data reduction chain to final reported concentrations or isotope ratios. Specifies which uncertainty sources are included: counting statistics, calibration standard uncertainty, internal standard concentration uncertainty, drift correction uncertainty. Editable because this field may be unspecified at protocol registration (Advanced tier) and can be completed by the analyst when documenting the analysis.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/uncertaintyPropagationMethod
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/uncertaintyPropagationMethod
      schema:name:
        const: Uncertainty Propagation Method
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  spikeOutlierFilteringApproach:
    title: Spike / Outlier Filtering Approach
    description: Method used to identify and remove anomalous signal spikes arising from micronuggets, inclusions, cracks, or instrument artifacts during time-resolved signal processing. Editable because the specific implementation may vary between sessions while remaining within the protocol framework.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/spikeOutlierFilteringApproach
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/spikeOutlierFilteringApproach
      schema:name:
        const: Spike / Outlier Filtering Approach
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  pulseAnalogDetectorNonlinearityCorrection:
    title: Pulse/Analog Detector Nonlinearity Correction
    description: Whether a correction was applied for nonlinear response at the transition between pulse-counting and analog detector modes.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/pulseAnalogDetectorNonlinearityCorrection
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/pulseAnalogDetectorNonlinearityCorrection
      schema:name:
        const: Pulse/Analog Detector Nonlinearity Correction
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  memoryEffectMitigation:
    title: Memory Effect Mitigation
    description: Protocol applied to identify and minimise memory effects from high-concentration elements in the previous sample or standard that may contaminate subsequent analyses, or from incomplete aerosol washout between adjacent pixels in raster mapping mode. For mapping, the mitigation strategy involves controlling scan speed relative to washout time to ensure each pixel signal is sufficiently free of the preceding pixel's contribution.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/memoryEffectMitigation
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/memoryEffectMitigation
      schema:name:
        const: Memory Effect Mitigation
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  normalizationStandardsBasedCorrection:
    title: Normalization / Standards-Based Correction
    description: Any post-acquisition normalization applied to correct for systematic biases identified from secondary reference materials, or stoichiometric normalization applied per pixel in mapping. Distinct from the primary internal standard approach captured in Internal Standard Approach.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/normalizationStandardsBasedCorrection
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/normalizationStandardsBasedCorrection
      schema:name:
        const: Normalization / Standards-Based Correction
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  primaryCalibrationStandardName:
    title: Primary Calibration Standard Name
    description: Primary reference material(s) used to calibrate the instrument and convert raw signal intensities to concentrations or isotope ratios. Include material name, source institution, and citation for the accepted values used. Editable because the specific lot or certification vintage may differ between sessions while the material type remains the same.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/primaryCalibrationStandardName
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/primaryCalibrationStandardName
      schema:name:
        const: Primary Calibration Standard Name
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  secondaryReferenceMaterials:
    title: Secondary Reference Materials
    description: Quality-control reference materials analysed as unknowns alongside samples in the same session to assess accuracy and monitor drift. Include material name, source, and citation for accepted values used for comparison. Editable because selection of secondary RMs may vary across sessions.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/secondaryReferenceMaterials
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/secondaryReferenceMaterials
      schema:name:
        const: Secondary Reference Materials
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  additionalNotes:
    title: Additional Notes
    description: Any additional context about this protocol or analysis session not captured by the structured fields above. Use sparingly; structured fields are preferred for all information that can be formally categorised.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/additionalNotes
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/laicpmsTAPP/additionalNotes
      schema:name:
        const: Additional Notes
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  coupledTechnique:
    title: Coupled Technique(s)
    description: Analytical technique(s) applied to the same sample or aliquot in conjunction with this protocol, where the two analyses are designed to be interpreted together or where one provides input to the other. Use the same controlled vocabulary as the Technique field. Enter "None" if no coupling is intended.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/coupledTechnique
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/coupledTechnique
      schema:name:
        const: Coupled Technique(s)
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  couplingDescription:
    title: Coupling Description
    description: 'Description of how this protocol is coupled with the technique(s) listed above. Include: (1) the functional relationship — what data or context flows between techniques or how results are combined; and (2) the analytical sequence — which technique is performed first and why (e.g., non-destructive XCT before destructive sectioning or polishing).'
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/couplingDescription
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/couplingDescription
      schema:name:
        const: Coupling Description
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  coupledProtocolDoi:
    title: Coupled Protocol DOI
    description: Registered protocol DOI for the coupled technique named above. Provides a stable, citable link to the companion method independent of whether a dataset has been deposited. If the coupled protocol has not yet been registered, enter the DOI of a publication describing the coupled method, or "pending". Enter "None" if no coupling is planned.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/coupledProtocolDoi
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/coupledProtocolDoi
      schema:name:
        const: Coupled Protocol DOI
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  coupledDatasetOrPublicationReference:
    title: Coupled Dataset or Publication Reference
    description: 'DOI or other persistent identifier for the co-registered dataset or publication where both datasets are reported together. Accepts: a dedicated dataset DOI (if separately deposited), a shared dataset DOI (if co-submitted in the same package), or a publication DOI. Use "same submission" if the coupled dataset is included in this data package, or "pending" if not yet assigned. If coupling is documented through a shared sample identifier only, that information is already captured in Sample Persistent Identifier (Group 2).'
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/coupledDatasetOrPublicationReference
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/coupledDatasetOrPublicationReference
      schema:name:
        const: Coupled Dataset or Publication Reference
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  sampleMass:
    title: Sample Mass
    description: 'Mass of the sample in grams, recorded for curatorial tracking of precious or limited materials. Particularly important for meteorite, mission-returned, and other restricted samples. This is an analysis-level field: the actual sample mass depends on the specific sample being scanned, not on the protocol design.'
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/sampleMass
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/sampleMass
      schema:name:
        const: Sample Mass
      schema:value:
        anyOf:
          - type: number
          - type: string
      schema:unitText:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
      - schema:unitText
  sampleMountingMethod:
    title: Sample Mounting Method
    description: Method used to mount or hold the sample on the instrument rotation stage. Mounting material should transmit X-rays at the selected voltage without dominating beam attenuation. Report the holder type, adhesive or support material, and any alignment aids used.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/sampleMountingMethod
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/sampleMountingMethod
      schema:name:
        const: Sample Mounting Method
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  samplePersistentIdentifier:
    title: Sample Persistent Identifier
    description: Globally unique, persistent identifier for the analysed sample. IGSN (International Geo Sample Number) is the recommended standard for geological and cosmochemical samples.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/samplePersistentIdentifier
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/samplePersistentIdentifier
      schema:name:
        const: Sample Persistent Identifier
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  samplePreparationNotes:
    title: Sample Preparation Notes
    description: Any preparation steps applied to the sample before scanning, including cleaning, trimming, consolidation, or drying. XCT is typically non-destructive with no surface preparation required; note any exceptions.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/samplePreparationNotes
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/samplePreparationNotes
      schema:name:
        const: Sample Preparation Notes
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  acquisitionSoftware:
    title: Acquisition Software
    description: Instrument control and data acquisition software used to collect raw projection images, including version number. Separate from reconstruction and segmentation software.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/acquisitionSoftware
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/acquisitionSoftware
      schema:name:
        const: Acquisition Software
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  reconstructionSoftware:
    title: Reconstruction Software
    description: Software used to reconstruct 2D projection images into a 3D CT volume, including version number. Often bundled with the instrument and proprietary to the manufacturer.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/reconstructionSoftware
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/reconstructionSoftware
      schema:name:
        const: Reconstruction Software
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  segmentationAndAnalysisSoftware:
    title: Segmentation and Analysis Software
    description: Software used for image segmentation, phase identification, and quantitative 3D analysis after reconstruction. Report all packages used, with version numbers.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/segmentationAndAnalysisSoftware
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/segmentationAndAnalysisSoftware
      schema:name:
        const: Segmentation and Analysis Software
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  labxct_acceleratingVoltage:
    title: Accelerating Voltage
    description: "X-ray tube accelerating voltage in kilovolts (kV) registered by the protocol. Determines the maximum X-ray photon energy and controls penetration depth and phase contrast. Higher voltages provide greater penetration for dense or large samples; lower voltages improve contrast between low-density phases. If the voltage was varied across samples within the same protocol or session, report the full range applied (e.g., 90–115 kV). Note: some sources report this parameter as 'X keV' (maximum Bremsstrahlung photon energy) rather than 'X kV' (tube voltage). For polychromatic lab XCT, these are numerically equivalent: E_max [keV] = V [kV]. Record the value as stated in the source and add a parenthetical note if the unit used is keV."
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/acceleratingVoltage
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/acceleratingVoltage
      schema:name:
        const: Accelerating Voltage
      schema:value:
        anyOf:
          - type: number
          - type: string
      schema:unitText:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
      - schema:unitText
  tubeCurrent:
    title: Tube Current
    description: X-ray tube current in microamperes (µA) registered by the protocol. Controls photon flux and therefore projection image SNR. Higher current improves SNR but increases thermal loading on the source and may increase focal spot size. If the current was varied across samples within the same protocol or session, report the full range applied (e.g., 65–115 µA).
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/tubeCurrent
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/tubeCurrent
      schema:name:
        const: Tube Current
      schema:value:
        anyOf:
          - type: number
          - type: string
      schema:unitText:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
      - schema:unitText
  xRayPower:
    title: X-ray Power
    description: 'X-ray tube power in watts (W) registered by the protocol. Derivable as voltage (kV) × current (mA) = kV × µA / 1000. Power constrains the achievable focal spot size for microfocal tubes: higher power requires a larger focal spot, trading spatial resolution for SNR. Retained as a standalone field because it is routinely reported in the literature and directly constrains instrument operating limits. If power was varied across samples within the session, report the full range applied (e.g., 7–13 W).'
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/xRayPower
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/xRayPower
      schema:name:
        const: X-ray Power
      schema:value:
        anyOf:
          - type: number
          - type: string
      schema:unitText:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
      - schema:unitText
  xRayPreFilter:
    title: X-ray Pre-filter
    description: Material and thickness of the beam-hardening filter placed between the X-ray source and the sample. Hardens the beam by attenuating low-energy photons, reducing beam hardening artifacts and improving CT number stability across the sample. Both filter material and thickness must be reported. Instrument-proprietary filter codes should be decoded where possible.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/xRayPreFilter
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/xRayPreFilter
      schema:name:
        const: X-ray Pre-filter
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  sourceToObjectDistance:
    title: Source-to-Object Distance (SOD)
    description: Distance from the X-ray source focal spot to the centre of the sample rotation axis, in mm, as registered by the protocol. Together with SDD, determines geometric magnification (M = SDD/SOD). Shorter SOD increases magnification and reduces voxel size.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/sourceToObjectDistance
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/sourceToObjectDistance
      schema:name:
        const: Source-to-Object Distance (SOD)
      schema:value:
        anyOf:
          - type: number
          - type: string
      schema:unitText:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
      - schema:unitText
  sourceToDetectorDistance:
    title: Source-to-Detector Distance (SDD)
    description: Distance from the X-ray source focal spot to the detector surface, in mm, as registered by the protocol. Together with SOD, determines geometric magnification M = SDD/SOD. Voxel size ≈ detector pixel size / M (before binning; divide additionally by optical objective for Versa-class systems).
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/sourceToDetectorDistance
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/sourceToDetectorDistance
      schema:name:
        const: Source-to-Detector Distance (SDD)
      schema:value:
        anyOf:
          - type: number
          - type: string
      schema:unitText:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
      - schema:unitText
  voxelSize:
    title: Voxel Size
    description: Isotropic voxel edge length of the reconstructed 3D volume in micrometres. The protocol registers the target voxel size, set based on the minimum feature size to be resolved (target voxel size ≤ ~1/3 of the minimum resolvable feature size). At analysis level, record the achieved voxel size as reported by the reconstruction software, which may differ slightly from the target due to final geometric calibration.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/voxelSize
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/voxelSize
      schema:name:
        const: Voxel Size
      schema:value:
        anyOf:
          - type: number
          - type: string
      schema:unitText:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
      - schema:unitText
  rotationRange:
    title: Rotation Range
    description: Total angular range over which projection images are acquired, in degrees. Full 360° rotation is standard for cone-beam lab XCT. 180° rotation (half-scan) is sometimes used for faster acquisition but may introduce additional artifacts.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/rotationRange
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/rotationRange
      schema:name:
        const: Rotation Range
      schema:value:
        anyOf:
          - type: number
          - type: string
      schema:unitText:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
      - schema:unitText
  numberOfProjections:
    title: Number of Projections
    description: Total number of equally-spaced projection images acquired over the full rotation range. More projections improve reconstruction quality by reducing under-sampling streak artifacts but increase scan time. For Mode B (multi-volume stitching), this is the number per sub-volume.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/numberOfProjections
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/numberOfProjections
      schema:name:
        const: Number of Projections
      schema:value:
        anyOf:
          - type: number
          - type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  rotationStepSize:
    title: Rotation Step Size
    description: Angular increment between successive projection images, in degrees. Equal to Rotation Range divided by Number of Projections when both are reported; however, some sources report step size as the primary rotation parameter without stating the total number of projections explicitly. Finer step sizes improve angular sampling and reduce streak artifacts at the cost of longer scan time.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/rotationStepSize
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/rotationStepSize
      schema:name:
        const: Rotation Step Size
      schema:value:
        anyOf:
          - type: number
          - type: string
      schema:unitText:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
      - schema:unitText
  exposureTimePerProjection:
    title: Exposure Time per Projection
    description: 'Duration of X-ray exposure for each individual projection image frame, in seconds, as registered by the protocol. Set as a deliberate choice for the target sample type and voxel size: longer exposures increase SNR at the cost of total scan time. May be adjusted within protocol-allowed bounds for samples that are unusually dense or unusually transparent. If the exposure time was varied across samples within the same protocol or session, report the full range applied (e.g., 0.5–2 s).'
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/exposureTimePerProjection
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/exposureTimePerProjection
      schema:name:
        const: Exposure Time per Projection
      schema:value:
        anyOf:
          - type: number
          - type: string
      schema:unitText:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
      - schema:unitText
  framesAveragedPerProjection:
    title: Frames Averaged per Projection
    description: Number of individual detector frames acquired and averaged to produce each saved projection image, as registered by the protocol. Frame averaging reduces random electronic noise. The effective exposure per projection = exposure time per frame × frames averaged.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/framesAveragedPerProjection
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/framesAveragedPerProjection
      schema:name:
        const: Frames Averaged per Projection
      schema:value:
        anyOf:
          - type: number
          - type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  detectorBinning:
    title: Detector Binning
    description: Detector pixel binning factor applied during acquisition. Binning combines adjacent pixels (e.g., 2×2 combines 4 pixels into one), reducing effective resolution while increasing per-pixel SNR and reducing file size. 1×1 indicates no binning.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/detectorBinning
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/detectorBinning
      schema:name:
        const: Detector Binning
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  flatFieldCorrection:
    title: Flat Field Correction
    description: Whether dark-field (detector read with X-ray source off; electronic noise baseline) and bright-field (source on, no sample; gain calibration) reference images are acquired and applied to normalize detector response before reconstruction. Standard practice in all quantitative lab XCT;.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/flatFieldCorrection
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/flatFieldCorrection
      schema:name:
        const: Flat Field Correction
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  rotationMode:
    title: Rotation Mode
    description: Whether projection images are acquired during continuous sample rotation (faster; may introduce slight motion blur at high rotation speeds) or at discrete step positions with the stage stationary during each exposure (stop-and-shoot; eliminates motion blur). Continuous rotation has been associated with sub-volume rotational mismatch artifacts in multi-volume stitching workflows (Eckley et al. 2025).
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/rotationMode
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/rotationMode
      schema:name:
        const: Rotation Mode
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  totalScanDuration:
    title: Total Scan Duration
    description: Total elapsed time for the complete XCT acquisition, from the start of the first projection to the end of the last. For multi-volume acquisitions, this is the combined scan time across all sub-volumes (not including setup or reconstruction time). Useful for assessing beam stability and sample integrity concerns over long scans.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/totalScanDuration
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/totalScanDuration
      schema:name:
        const: Total Scan Duration
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  reconstructionConvolutionFilter:
    title: Reconstruction Convolution Filter
    description: Convolution (apodization) filter kernel applied during back-projection reconstruction. Sharper filters (Ram-Lak) enhance edge definition but amplify high-frequency noise; smoother filters (Hann, Hamming) reduce noise at the cost of edge sharpness. The choice represents a deliberate protocol-level tradeoff.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/reconstructionConvolutionFilter
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/reconstructionConvolutionFilter
      schema:name:
        const: Reconstruction Convolution Filter
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  beamHardeningCorrectionParameter:
    title: Beam Hardening Correction Parameter
    description: Numerical value or setting applied in the software beam hardening correction algorithm for this specific analysis. May be tuned empirically per material type or per scan session. Analysis-level companion to Beam Hardening Correction Method.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/beamHardeningCorrectionParameter
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/beamHardeningCorrectionParameter
      schema:name:
        const: Beam Hardening Correction Parameter
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  ringArtifactCorrectionMethod:
    title: Ring Artifact Correction Method
    description: Protocol specification for how ring artifacts are handled. Ring artifacts appear as concentric circular bands centred on the rotation axis and arise from defective or miscalibrated detector pixels. Method is the protocol-level specification; whether correction was applied and its outcome are recorded at analysis level in Group 6.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/ringArtifactCorrectionMethod
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/ringArtifactCorrectionMethod
      schema:name:
        const: Ring Artifact Correction Method
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  outputDataFormat:
    title: Output Data Format
    description: File format of the reconstructed CT volume as output by the reconstruction software. Bit depth is recorded separately in Output Bit Depth.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/outputDataFormat
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/outputDataFormat
      schema:name:
        const: Output Data Format
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  ctNumberCalibration:
    title: CT Number Calibration
    description: Whether the raw CT grayscale values have been calibrated to physically meaningful units using reference materials. Calibrated CT numbers enable cross-instrument and cross-session comparison and support phase identification by comparison to calculated linear attenuation coefficient (LAC) values (e.g., using MuCalc; Hanna & Ketcham 2017). Uncalibrated grayscale values are instrument- and session-specific.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/ctNumberCalibration
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/ctNumberCalibration
      schema:name:
        const: CT Number Calibration
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  segmentationMethod:
    title: Segmentation Method
    description: General approach used to separate distinct phases or features in the reconstructed CT volume. The method must be reported for any quantitative result to be reproducible.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/segmentationMethod
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/segmentationMethod
      schema:name:
        const: Segmentation Method
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  segmentationThresholdValuesOrCriteria:
    title: Segmentation Threshold Values or Criteria
    description: Specific CT number range(s) or quantitative criteria used to define each segmented phase or feature. Documenting these values enables reproducibility assessment and cross-study comparison. For LAC-calibrated datasets, report values in cm⁻¹.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/segmentationThresholdValuesOrCriteria
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/segmentationThresholdValuesOrCriteria
      schema:name:
        const: Segmentation Threshold Values or Criteria
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  phaseIdentificationMethod:
    title: Phase Identification Method
    description: Method used to assign reconstructed CT number ranges to specific mineral phases or material types. Approaches include comparison to calculated linear attenuation coefficients (LAC), cross-validation with independent analytical techniques, or empirical calibration.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/phaseIdentificationMethod
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/phaseIdentificationMethod
      schema:name:
        const: Phase Identification Method
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  voiSelectionCriteria:
    title: VOI Selection Criteria
    description: Protocol-level rules specifying how the Volume of Interest (VOI) is to be defined for quantitative analysis. Common criteria exclude cone-beam artifact zones at sample edges, beam hardening halos near dense inclusions, and sample holder signal. The actual VOI applied in a specific analysis is recorded separately at analysis level.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/voiSelectionCriteria
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/voiSelectionCriteria
      schema:name:
        const: VOI Selection Criteria
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  subVolumeStitchingAndRegistrationMethod:
    title: Sub-volume Stitching and Registration Method
    description: 'Method used to register adjacent sub-volume datasets to each other and stitch them into a single continuous 3D volume. Report the alignment strategy (manual, automated, fiducial-based), the software used, and any correction steps applied. Note: rotational mismatch artifacts have been identified in continuous-rotation acquisitions (~0.35° misalignment in Eckley et al. 2025); their correction via raw projection re-alignment should be documented here.'
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/subVolumeStitchingAndRegistrationMethod
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/subVolumeStitchingAndRegistrationMethod
      schema:name:
        const: Sub-volume Stitching and Registration Method
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  outputBitDepth:
    title: Output Bit Depth
    description: Bit depth of the reconstructed 3D volume (number of bits used to encode each voxel's grayscale value). Common values are 8-bit (256 gray levels), 16-bit (65,536 gray levels), or 32-bit floating point. Bit depth affects the dynamic range available for phase segmentation and quantitative attenuation analysis. The protocol may specify a required output bit depth if downstream analysis workflows depend on a consistent grayscale range; the analyst confirms or adjusts at analysis time.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/outputBitDepth
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/outputBitDepth
      schema:name:
        const: Output Bit Depth
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  spatialResolution:
    title: Spatial Resolution
    description: Effective spatial resolution of the reconstructed CT volume, which typically differs from (and is coarser than) the voxel size due to the detector point spread function (PSF), geometric unsharpness, and the reconstruction filter. The Nyquist limit sets a theoretical floor at 2× the voxel size. Formal measurement uses the PSF method described in Ketcham & Hildebrandt (2014) or the modulation transfer function (MTF); resolution can also be reported per ASTM E1441-11. When formal measurement is unavailable, an estimate based on acquisition geometry (e.g., the Brenner-Weiss formula) or a stated multiple of the voxel size may be recorded. Report the value in µm along with the method used to determine or estimate it.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/spatialResolution
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/spatialResolution
      schema:name:
        const: Spatial Resolution
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  beamHardeningArtifactAssessment:
    title: Beam Hardening Artifact Assessment
    description: Assessment of whether residual beam hardening (cupping artifact) is present in the reconstructed volume after any corrections applied during reconstruction. Beam hardening in polychromatic lab XCT produces a characteristic darker interior and brighter edges in the reconstructed CT number profile, even in compositionally uniform material. Record whether this artifact is detectable in the final dataset, what correction or mitigation was applied (e.g., linearisation, pre-filtering, iterative correction), and whether any residual effect influences the analysis region.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/beamHardeningArtifactAssessment
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/beamHardeningArtifactAssessment
      schema:name:
        const: Beam Hardening Artifact Assessment
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  ringArtifactSeverityAndCorrectionOutcome:
    title: Ring Artifact Severity and Correction Outcome
    description: Assessment of whether ring artifacts — concentric rings centred on the rotation axis arising from differential sensitivity or gain drift among detector elements — were present and whether correction was effective. Note that ring correction algorithms modify image intensity in narrow annular bands; in samples containing linear geological features oriented tangentially to the rotation axis, ring correction can alter or introduce spurious linear features in those orientations. Record whether rings were present, whether correction was applied, and whether any residual rings or correction artifacts fall within the analysis volume of interest.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/ringArtifactSeverityAndCorrectionOutcome
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/ringArtifactSeverityAndCorrectionOutcome
      schema:name:
        const: Ring Artifact Severity and Correction Outcome
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  metalStreakArtifactAssessment:
    title: Metal Streak Artifact Assessment
    description: Assessment of whether high-density inclusions (FeNi metal, platinum-group minerals, dense oxides, or other high-Z phases) produce streak or starburst artifacts in the reconstructed volume. Common forms include radial starburst streaks from high-Z inclusions and shadowing (anomalously low CT number) in beam-shadow regions behind dense phases. Record which artifact type(s) are present, their spatial extent, and any exclusion zones or correction steps applied.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/metalStreakArtifactAssessment
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/metalStreakArtifactAssessment
      schema:name:
        const: Metal Streak Artifact Assessment
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  partialVolumeEffectCriteria:
    title: Partial Volume Effect Criteria
    description: Protocol-level specification of how partial volume effects (PVE) are managed in quantitative analysis. PVE produces intermediate CT numbers at phase boundaries and at the surfaces of small features, because each voxel integrates the attenuation of all material within its volume. PVE correction can be implemented via PSF-based deconvolution tools such as Blob3D. Record the minimum feature size criterion adopted for the protocol (in voxels or µm), the treatment of boundary voxels in modal abundance or size distribution calculations, and whether PVE correction is required or optional.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/partialVolumeEffectCriteria
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/partialVolumeEffectCriteria
      schema:name:
        const: Partial Volume Effect Criteria
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  partialVolumeEffectAssessment:
    title: Partial Volume Effect Assessment
    description: Analysis-level record of PVE severity and how it was handled in this specific analysis. Documents the minimum feature size relative to the voxel size, the fraction of the feature population affected, and any PVE correction method applied (e.g., PSF-based deconvolution via Blob3D).
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/partialVolumeEffectAssessment
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/partialVolumeEffectAssessment
      schema:name:
        const: Partial Volume Effect Assessment
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  minimumResolvableFeatureSize:
    title: Minimum Resolvable Feature Size
    description: Smallest feature reliably detected and quantified in this analysis at the achieved voxel size and SNR. The practical detection limit is determined jointly by voxel size, effective spatial resolution (PSF), and image contrast. Per Withers et al. (2021), a feature must span at least 3 voxels to be positively identified, and at least 10 voxels for reliable shape and volume characterisation. Report the minimum feature size threshold applied in quantitative analysis and the basis for that value (e.g., SNR-limited, PVE-limited, or analyst-defined).
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/minimumResolvableFeatureSize
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/minimumResolvableFeatureSize
      schema:name:
        const: Minimum Resolvable Feature Size
      schema:value:
        anyOf:
          - type: number
          - type: string
      schema:unitText:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
      - schema:unitText
  signalToNoiseRatio:
    title: Signal-to-Noise Ratio
    description: Quantitative measure of image quality in the reconstructed CT volume. Typically calculated as the mean CT number divided by the standard deviation of CT number in a homogeneous reference region (e.g., an inclusion-free zone of the matrix). SNR is controlled by photon flux (source power, exposure time, number of projections) and sample attenuation. Record the measured value and the region used for measurement, or note if SNR was not formally measured.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/signalToNoiseRatio
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/signalToNoiseRatio
      schema:name:
        const: Signal-to-Noise Ratio
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  crossValidationProtocolRequirement:
    title: Cross-Validation Protocol Requirement
    description: Protocol-level specification of what independent analytical validation is required to confirm CT segmentation results, phase identification, or quantitative measurements. Cross-validation is relevant where CT grey-values alone cannot uniquely distinguish phases with similar attenuation coefficients. Common approaches include BSE imaging, SEM-EDS or EPMA modal analysis, He pycnometry for bulk porosity, and Raman or SIMS phase mapping. Record the required validation method(s) and the sampling fraction (e.g., every sample, one per session, or a representative subset).
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/crossValidationProtocolRequirement
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/crossValidationProtocolRequirement
      schema:name:
        const: Cross-Validation Protocol Requirement
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  crossValidationOutcome:
    title: Cross-Validation Outcome
    description: Analysis-level record of what independent validation was performed and its result. Report the validation method(s) used, the quantitative agreement achieved (e.g., relative difference in modal abundance, porosity), and any discrepancies and their likely causes. Where BSE imaging is the validation method, note that BSE provides a 2D section while CT provides a 3D volume.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/crossValidationOutcome
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/labxctTAPP/crossValidationOutcome
      schema:name:
        const: Cross-Validation Outcome
      schema:value:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  beamMode:
    title: Beam Mode
    description: Whether the beam was focused, defocused, or rastered over an area.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/beamMode
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/empaTAPP/beamMode
      schema:name:
        const: Beam Mode
      schema:value:
        type: string
      schema:inDefinedTermSet:
        const:
          '@id': ada:vocab/empaTAPP/beamMode
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
  acceleratingVoltage:
    title: Accelerating Voltage
    description: Electron beam accelerating voltage in kilovolts (kV).
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/acceleratingVoltage
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/empaTAPP/acceleratingVoltage
      schema:name:
        const: Accelerating Voltage
      schema:value:
        anyOf:
          - type: number
          - type: string
      schema:unitText:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
      - schema:unitText
  beamDiameter:
    title: Beam Diameter
    description: Diameter of the focused or defocused electron beam in micrometers.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/beamDiameter
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/empaTAPP/beamDiameter
      schema:name:
        const: Beam Diameter
      schema:value:
        anyOf:
          - type: number
          - type: string
      schema:unitText:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
      - schema:unitText
  beamRasterDimensions:
    title: Beam Raster Dimensions
    description: X × Y dimensions of beam raster area in micrometers, if beam raster mode was used.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/beamRasterDimensions
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/empaTAPP/beamRasterDimensions
      schema:name:
        const: Beam Raster Dimensions
      schema:value:
        anyOf:
          - type: number
          - type: string
      schema:unitText:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
      - schema:unitText
  driftCorrection:
    title: Drift Correction
    description: Describe method used to monitor and correct for instrument drift
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/driftCorrection
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/empaTAPP/driftCorrection
      schema:name:
        const: Drift Correction
      schema:value:
        type: string
      schema:unitText:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
      - schema:unitText
  beamCurrent:
    title: Default Beam Current
    description: Probe current in nanoamperes (nA).
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/beamCurrent
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/empaTAPP/beamCurrent
      schema:name:
        const: Default Beam Current
      schema:value:
        anyOf:
          - type: number
          - type: string
      schema:unitText:
        type: string
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
      - schema:unitText
  wdsDeadTimeCorrection:
    title: WDS Dead Time Correction
    description: Method used to correct WDS proportional counter dead time at high count rates.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/wdsDeadTimeCorrection
      '@type':
        const:
          - schema:PropertyValue
      schema:propertyID:
        const: ada:parameter/empaTAPP/wdsDeadTimeCorrection
      schema:name:
        const: WDS Dead Time Correction
      schema:value:
        type: string
      schema:inDefinedTermSet:
        const:
          '@id': ada:vocab/empaTAPP/wdsDeadTimeCorrection
    required:
      - '@id'
      - '@type'
      - schema:propertyID
      - schema:name
      - schema:value
