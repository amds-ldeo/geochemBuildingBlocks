$schema: https://json-schema.org/draft/2020-12/schema
title: EMPA Technique-Aligned Protocol Profile (empaTAPP)
description: EMPA-specific extension of the base TAPP definition. Adds top-level EPMA properties (beam mode, accelerating voltage default, matrix correction method, etc.), a parameter vocabulary in ada:methodParameters, and an analyte-column template covering EPMA per-element acquisition and reporting fields. Each ada:analyteColumns[] entry must match one of the catalog files in analyteColumns/ (or the inherited identifier column from tappDefinition); each catalog file is itself a JSON Schema whose examples[0] carries the canonical instance. Generated from docs/TAPP_EPMA_filled.xlsx by tools/build_empaTAPP_from_spreadsheet.py.
allOf:
  - $ref: ../tappDefinition/schema.yaml
  - type: object
    properties:
      ada:beamMode:
        description: Whether the beam was focused, defocused, or rastered over an area.
        type: string
        enum:
          - Focused
          - Defocused
          - Raster
      ada:acceleratingVoltageDefault:
        description: Electron beam accelerating voltage in kilovolts (kV).
        type: string
      ada:beamDiameterDefault:
        description: Diameter of the focused or defocused electron beam in micrometers.
        type: string
      ada:beamCurrentDefault:
        description: Probe current in nanoamperes (nA).
        type: string
      ada:matrixCorrectionMethod:
        description: X-ray matrix correction algorithm applied during data reduction.
        type: string
        enum:
          - PAP (Pouchou & Pichoir Full)
          - XPP (Simplified PAP)
          - PhiRhoZ Bastin (EPQ-91)
          - Love-Scott I
          - Love-Scott II
          - Armstrong/Love-Scott
          - Heinrich/Duncumb-Reed
          - Conventional Philibert/Duncumb-Reed
          - Other
          - Unknown
      ada:analyteTemplate:
        type: object
        properties:
          ada:analyteColumns:
            type: array
            items:
              anyOf:
                - $ref: ../tappDefinition/schema.yaml#/$defs/AnalyteIdentifierColumn
                - $ref: ../analyteColumns/analysisOrder.json
                - $ref: ../analyteColumns/backgroundCorrectionMethod.json
                - $ref: ../analyteColumns/backgroundCountingPosition.json
                - $ref: ../analyteColumns/backgroundCountingTime.json
                - $ref: ../analyteColumns/blankCorrection.json
                - $ref: ../analyteColumns/detectionLimitMethod.json
                - $ref: ../analyteColumns/edsDeadTime.json
                - $ref: ../analyteColumns/elementEstimationMethod.json
                - $ref: ../analyteColumns/epmaTechnique.json
                - $ref: ../analyteColumns/interferenceCorrection.json
                - $ref: ../analyteColumns/interferenceCorrectionStandard.json
                - $ref: ../analyteColumns/interferingElements.json
                - $ref: ../analyteColumns/monochromatorCrystal.json
                - $ref: ../analyteColumns/normalization-standardsCorrection.json
                - $ref: ../analyteColumns/peakCountingTime.json
                - $ref: ../analyteColumns/primaryCalibrationStandard.json
                - $ref: ../analyteColumns/pulseHeightAnalyzeSetting.json
                - $ref: ../analyteColumns/secondaryReferenceMaterial.json
                - $ref: ../analyteColumns/spectrometerNumber.json
                - $ref: ../analyteColumns/timeDependentIntensityCorrection.json
                - $ref: ../analyteColumns/typicalAnalyticalAccuracy.json
                - $ref: ../analyteColumns/typicalAnalyticalPrecision.json
                - $ref: ../analyteColumns/typicalCountingStatisticsError.json
                - $ref: ../analyteColumns/typicalDetectionLimit.json
                - $ref: ../analyteColumns/wdsDetectorType.json
                - $ref: ../analyteColumns/xrayEmissionLine.json
            allOf:
              - contains:
                  $ref: ../analyteColumns/analysisOrder.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/backgroundCorrectionMethod.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/backgroundCountingPosition.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/backgroundCountingTime.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/blankCorrection.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/detectionLimitMethod.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/edsDeadTime.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/elementEstimationMethod.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/epmaTechnique.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/interferenceCorrection.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/interferenceCorrectionStandard.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/interferingElements.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/monochromatorCrystal.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/normalization-standardsCorrection.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/peakCountingTime.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/primaryCalibrationStandard.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/pulseHeightAnalyzeSetting.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/secondaryReferenceMaterial.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/spectrometerNumber.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/timeDependentIntensityCorrection.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/typicalAnalyticalAccuracy.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/typicalAnalyticalPrecision.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/typicalCountingStatisticsError.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/typicalDetectionLimit.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/wdsDetectorType.json
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/xrayEmissionLine.json
                minContains: 0
                maxContains: 1
      ada:methodParameters:
        type: array
        items:
          anyOf:
            - $ref: ../parameterTemplates/BeamDamageMinimization.json
            - $ref: ../parameterTemplates/DriftCorrection.json
            - $ref: ../parameterTemplates/edsSpectralProcessingType.json
            - $ref: ../parameterTemplates/halogenOxygenCorrection.json
            - $ref: ../parameterTemplates/massAbsorptionCoefficients.json
            - $ref: ../parameterTemplates/wdsDeadTimeCorrection.json
        allOf:
          - contains:
              $ref: ../parameterTemplates/BeamDamageMinimization.json
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../parameterTemplates/DriftCorrection.json
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../parameterTemplates/edsSpectralProcessingType.json
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../parameterTemplates/halogenOxygenCorrection.json
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../parameterTemplates/massAbsorptionCoefficients.json
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../parameterTemplates/wdsDeadTimeCorrection.json
            minContains: 0
            maxContains: 1
      schema:instrument:
        type: object
        properties:
          schema:hasPart:
            type: array
            description: 'Instrument sub-components. Each item is a schema:Thing with at least one schema:additionalType. Spreadsheet-known types: ElectronSource, edsDetector, wdsSpectrometer. Other additionalType values are accepted via the catch-all branch.'
            items:
              oneOf:
                - type: object
                  properties:
                    '@type':
                      type: array
                      items:
                        type: string
                      contains:
                        const: schema:Thing
                    schema:additionalType:
                      type: array
                      items:
                        type: string
                      contains:
                        const: ElectronSource
                    schema:name:
                      type: string
                      enum:
                        - Field Emission (FEG)
                        - LaB6/CeB6
                        - Tungsten (W)
                        - Other
                        - Unknown
                  required:
                    - '@type'
                    - schema:additionalType
                    - schema:name
                - type: object
                  properties:
                    '@type':
                      type: array
                      items:
                        type: string
                      contains:
                        const: schema:Thing
                    schema:additionalType:
                      type: array
                      items:
                        type: string
                      contains:
                        const: wdsSpectrometer
                  required:
                    - '@type'
                    - schema:additionalType
                - type: object
                  properties:
                    '@type':
                      type: array
                      items:
                        type: string
                      contains:
                        const: schema:Thing
                    schema:additionalType:
                      type: array
                      items:
                        type: string
                      contains:
                        const: edsDetector
                  required:
                    - '@type'
                    - schema:additionalType
                - type: object
                  description: Catch-all for instrument sub-component types not enumerated above. Authors may use any schema:additionalType outside the known set; schema:name is unconstrained on this branch.
                  properties:
                    '@type':
                      type: array
                      items:
                        type: string
                      contains:
                        const: schema:Thing
                    schema:additionalType:
                      type: array
                      items:
                        type: string
                      minItems: 1
                      not:
                        anyOf:
                          - contains:
                              const: ElectronSource
                          - contains:
                              const: wdsSpectrometer
                          - contains:
                              const: edsDetector
                  required:
                    - '@type'
                    - schema:additionalType
