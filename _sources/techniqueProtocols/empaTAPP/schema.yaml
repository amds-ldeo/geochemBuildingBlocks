$schema: https://json-schema.org/draft/2020-12/schema
title: EMPA Technique-Aligned Protocol Profile (empaTAPP)
description: EMPA-specific extension of the base TAPP definition. Adds top-level EPMA properties (beam mode, accelerating voltage default, matrix correction method, etc.), Advanced-protocol parameter specifications in schema:additionalProperty, and an analyte-column template covering EPMA per-element acquisition and reporting fields. Each ada:analyteColumns[] entry must match one of the catalog files in analyteColumns/ (or the inherited identifier column from tappDefinition); each catalog file is itself a JSON Schema whose examples[0] carries the canonical instance. Generated from docs/TAPP_EPMA_filled.xlsx by tools/build_empaTAPP_from_spreadsheet.py.
allOf:
  - $ref: ../tappDefinition/schema.yaml
  - type: object
    properties:
      ada:beamModeDefault:
        description: Whether the beam was focused, defocused, or rastered over an area.
        type: string
        enum:
          - Focused
          - Defocused
          - Raster
          - missing
      ada:acceleratingVoltageDefault:
        description: Electron beam accelerating voltage in kilovolts (kV).
        type: string
      ada:beamDiameterDefault:
        description: Diameter of the focused or defocused electron beam in micrometers.
        type: string
      ada:beamCurrentDefault:
        description: Probe current in nanoamperes (nA).
        anyOf:
          - type: number
          - type: string
      ada:matrixCorrectionMethod:
        description: X-ray matrix correction algorithm applied during data reduction.
        type: string
        enum:
          - PAP (Pouchou & Pichoir Full)
          - XPP (Simplified PAP)
          - PhiRhoZ Bastin (EPQ-91)
          - Love-Scott I
          - Love-Scott II
          - Armstrong/Love-Scott
          - Heinrich/Duncumb-Reed
          - Conventional Philibert/Duncumb-Reed
          - Other
          - Unknown
          - missing
      ada:massAbsorptionCoefficients:
        description: Database of mass absorption coefficients used in the matrix correction.
        type: string
        enum:
          - LINEMU
          - CITZMU
          - MCMASTER
          - MAC30
          - MACJTA
          - FFAST
          - Other
          - Unknown
          - missing
      ada:wdsDeadTimeCorrectionDefault:
        description: Method used to correct WDS proportional counter dead time at high count rates.
        type: string
        enum:
          - Default constant 3µs (Cameca)
          - Adjusted constant (Cameca)
          - Default constant (JEOL)
          - Adjusted constant (JEOL)
          - High-precision (Probe for EPMA)
          - Logarithmic
          - Super-precision
          - Simple
          - Other
          - Unknown
          - missing
      ada:analyteTemplate:
        type: object
        properties:
          ada:analyteColumns:
            type: array
            items:
              anyOf:
                - $ref: ../tappDefinition/schema.yaml#/$defs/AnalyteIdentifierColumn
                - $ref: ../analyteColumns/schema.yaml#/$defs/analysisOrder
                - $ref: ../analyteColumns/schema.yaml#/$defs/backgroundCorrectionMethod
                - $ref: ../analyteColumns/schema.yaml#/$defs/backgroundCountingPosition
                - $ref: ../analyteColumns/schema.yaml#/$defs/backgroundCountingTime
                - $ref: ../analyteColumns/schema.yaml#/$defs/blankCorrection
                - $ref: ../analyteColumns/schema.yaml#/$defs/detectionLimitMethod
                - $ref: ../analyteColumns/schema.yaml#/$defs/edsDeadTime
                - $ref: ../analyteColumns/schema.yaml#/$defs/elementEstimationMethod
                - $ref: ../analyteColumns/schema.yaml#/$defs/epmaTechnique
                - $ref: ../analyteColumns/schema.yaml#/$defs/interferenceCorrection
                - $ref: ../analyteColumns/schema.yaml#/$defs/interferenceCorrectionStandard
                - $ref: ../analyteColumns/schema.yaml#/$defs/interferingElements
                - $ref: ../analyteColumns/schema.yaml#/$defs/monochromatorCrystal
                - $ref: ../analyteColumns/schema.yaml#/$defs/normalization-standardsCorrection
                - $ref: ../analyteColumns/schema.yaml#/$defs/peakCountingTime
                - $ref: ../analyteColumns/schema.yaml#/$defs/primaryCalibrationStandard
                - $ref: ../analyteColumns/schema.yaml#/$defs/pulseHeightAnalyzeSetting
                - $ref: ../analyteColumns/schema.yaml#/$defs/secondaryReferenceMaterial
                - $ref: ../analyteColumns/schema.yaml#/$defs/spectrometerNumber
                - $ref: ../analyteColumns/schema.yaml#/$defs/timeDependentIntensityCorrection
                - $ref: ../analyteColumns/schema.yaml#/$defs/typicalAnalyticalAccuracy
                - $ref: ../analyteColumns/schema.yaml#/$defs/typicalAnalyticalPrecision
                - $ref: ../analyteColumns/schema.yaml#/$defs/typicalCountingStatisticsError
                - $ref: ../analyteColumns/schema.yaml#/$defs/typicalDetectionLimit
                - $ref: ../analyteColumns/schema.yaml#/$defs/wdsDetectorType
                - $ref: ../analyteColumns/schema.yaml#/$defs/xrayEmissionLine
            allOf:
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/analysisOrder
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/backgroundCorrectionMethod
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/backgroundCountingPosition
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/backgroundCountingTime
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/blankCorrection
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/detectionLimitMethod
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/edsDeadTime
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/elementEstimationMethod
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/epmaTechnique
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/interferenceCorrection
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/interferenceCorrectionStandard
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/interferingElements
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/monochromatorCrystal
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/normalization-standardsCorrection
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/peakCountingTime
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/primaryCalibrationStandard
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/pulseHeightAnalyzeSetting
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/secondaryReferenceMaterial
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/spectrometerNumber
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/timeDependentIntensityCorrection
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/typicalAnalyticalAccuracy
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/typicalAnalyticalPrecision
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/typicalCountingStatisticsError
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/typicalDetectionLimit
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/wdsDetectorType
                minContains: 0
                maxContains: 1
              - contains:
                  $ref: ../analyteColumns/schema.yaml#/$defs/xrayEmissionLine
                minContains: 0
                maxContains: 1
      schema:additionalProperty:
        type: array
        items:
          anyOf:
            - $ref: ../parameterTemplates/schema.yaml#/$defs/beamRasterDimensionsDefault
            - $ref: ../parameterTemplates/schema.yaml#/$defs/driftCorrectionDefault
            - $ref: ../parameterValues/schema.yaml#/$defs/beamDamageMinimization
            - $ref: ../parameterValues/schema.yaml#/$defs/edsSpectralProcessingType
            - $ref: ../parameterValues/schema.yaml#/$defs/halogenCorrectionOnOxygen
        allOf:
          - contains:
              $ref: ../parameterTemplates/schema.yaml#/$defs/beamRasterDimensionsDefault
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../parameterTemplates/schema.yaml#/$defs/driftCorrectionDefault
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../parameterValues/schema.yaml#/$defs/beamDamageMinimization
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../parameterValues/schema.yaml#/$defs/edsSpectralProcessingType
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../parameterValues/schema.yaml#/$defs/halogenCorrectionOnOxygen
            minContains: 0
            maxContains: 1
      schema:instrument:
        type: object
        properties:
          schema:hasPart:
            type: array
            description: 'Instrument sub-components. Each item is a schema:Thing with at least one schema:additionalType. Spreadsheet-known types: ElectronSource, edsDetector, wdsSpectrometer. Other additionalType values are accepted via the catch-all branch.'
            items:
              oneOf:
                - type: object
                  properties:
                    '@type':
                      type: array
                      items:
                        type: string
                      contains:
                        const: schema:Thing
                    schema:additionalType:
                      type: array
                      items:
                        type: string
                      contains:
                        const: ElectronSource
                    schema:name:
                      type: string
                      enum:
                        - Field Emission (FEG)
                        - LaB6/CeB6
                        - Tungsten (W)
                        - Other
                        - Unknown
                  required:
                    - '@type'
                    - schema:additionalType
                    - schema:name
                - type: object
                  properties:
                    '@type':
                      type: array
                      items:
                        type: string
                      contains:
                        const: schema:Thing
                    schema:additionalType:
                      type: array
                      items:
                        type: string
                      contains:
                        const: wdsSpectrometer
                  required:
                    - '@type'
                    - schema:additionalType
                - type: object
                  properties:
                    '@type':
                      type: array
                      items:
                        type: string
                      contains:
                        const: schema:Thing
                    schema:additionalType:
                      type: array
                      items:
                        type: string
                      contains:
                        const: edsDetector
                  required:
                    - '@type'
                    - schema:additionalType
                - type: object
                  description: Catch-all for instrument sub-component types not enumerated above. Authors may use any schema:additionalType outside the known set; schema:name is unconstrained on this branch.
                  properties:
                    '@type':
                      type: array
                      items:
                        type: string
                      contains:
                        const: schema:Thing
                    schema:additionalType:
                      type: array
                      items:
                        type: string
                      minItems: 1
                      not:
                        anyOf:
                          - contains:
                              const: ElectronSource
                          - contains:
                              const: wdsSpectrometer
                          - contains:
                              const: edsDetector
                  required:
                    - '@type'
                    - schema:additionalType
    required:
      - ada:acceleratingVoltageDefault
      - ada:beamCurrentDefault
      - ada:beamDiameterDefault
      - ada:beamModeDefault
      - ada:massAbsorptionCoefficients
      - ada:matrixCorrectionMethod
      - ada:wdsDeadTimeCorrectionDefault
