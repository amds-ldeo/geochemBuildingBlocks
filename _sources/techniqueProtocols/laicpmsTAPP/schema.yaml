        - $ref: ../parameterTemplates/schema.yaml#/$defs/matrixOffsetCorrection
        - $ref: ../parameterTemplates/schema.yaml#/$defs/spikeOutlierFilteringApproach
        - $ref: ../parameterTemplates/schema.yaml#/$defs/pulseAnalogDetectorNonlinearityCorrection
        - $ref: ../parameterTemplates/schema.yaml#/$defs/memoryEffectMitigation
        - $ref: ../parameterTemplates/schema.yaml#/$defs/normalizationStandardsBasedCorrection
        - $ref: ../parameterTemplates/schema.yaml#/$defs/additionalNotes
      allOf:
      - contains:
