$schema: https://json-schema.org/draft/2020-12/schema
title: Lab-XCT Technique-Aligned Protocol Profile (labxctTAPP)
description: 'Laboratory X-ray computed tomography (polychromatic cone-beam) extension of the base TAPP
  definition. Basic protocol-tier fields are required top-level ada: properties; Advanced protocol-tier
  fields are schema:additionalProperty[] PropertyValueSpecification entries. XCT has no per-element analyte
  axis, so no ada:analyteTemplate is defined. Generated from docs/Lab-XCT_TAPP_v8.xlsx by tools/build_tapp.py.'
allOf:
- $ref: ../tappDefinition/schema.yaml
- type: object
  properties:
    ada:targetFeature:
      description: 'The 3D internal features or properties the protocol is designed to characterize. Defines
        the scientific purpose of the scan and informs resolution and contrast requirements. Used for
        protocol discoverability: a researcher can identify whether this protocol is suitable for their
        scientific question. Note for Phase 3 literature assessment: evaluate whether protocols in the
        literature are feature-specific (acquisition parameters tuned to a specific feature type, e.g.,
        opaque-phase contrast) or general-purpose (designed to capture all structural features in a given
        sample type). This will inform whether the field warrants a controlled list or remains free text.'
      type: string
    ada:applicableSampleDimensionRange:
      description: 'The range of sample sizes compatible with this protocol at the target voxel size and
        geometric configuration. The upper bound is a hard constraint set by the instrument field of view
        (FOV) at the protocol''s target magnification: FOV ≈ detector array width × pixel size / geometric
        magnification (divide additionally by optical objective multiplier for Versa-class systems using
        optical magnification). For Mode A (single-volume): all three sample dimensions must fall within
        the FOV. For Mode B (multi-volume stitching): sample diameter must fall within the FOV; sample
        length along the rotation axis is effectively unlimited through stitching. The lower bound is
        a practical guideline: samples spanning fewer than ~10 voxels in their smallest dimension are
        difficult to characterize reliably.'
      type: string
    ada:xRaySourceConfiguration:
      description: Focal spot geometry and scale of the X-ray tube. Reflection target configurations are
        most common in lab XCT (X-rays emitted from the face of the anode toward the sample); transmission
        target configurations allow smaller focal spots by thinning the anode into a membrane and collecting
        X-rays from the back, enabling higher spatial resolution at the cost of lower maximum power.
      type: string
    ada:detectorType:
      description: Type of X-ray detector used to record projection images. Flat-panel detectors (amorphous
        silicon) are standard in Nikon, NSI, and similar systems. CCD or CMOS detectors coupled to a scintillator
        via an optical objective are used in Zeiss Xradia Versa systems, enabling optical magnification
        for sub-micrometre voxel sizes.
      type: string
    ada:acquisitionSoftwareDefault:
      description: Instrument control and data acquisition software used to collect raw projection images,
        including version number. Separate from reconstruction and segmentation software.
      type: string
    ada:reconstructionSoftwareDefault:
      description: Software used to reconstruct 2D projection images into a 3D CT volume, including version
        number. Often bundled with the instrument and proprietary to the manufacturer.
      type: string
    ada:segmentationAndAnalysisSoftwareDefault:
      description: Software used for image segmentation, phase identification, and quantitative 3D analysis
        after reconstruction. Report all packages used, with version numbers.
      type: string
    ada:analyticalMode:
      description: Primary analytical mode(s) executed under this protocol. For single-mode protocols,
        records one value (e.g., Single-volume). For protocols covering both single-volume and multi-volume
        stitched acquisitions, list all applicable modes. Serves as the protocol-level declaration of
        measurement type, distinct from the mode flag columns which indicate per-field applicability.
      type: array
      items:
        type: string
        enum:
        - Single-volume
        - Multi-volume stitching
    ada:acceleratingVoltageDefault:
      description: 'X-ray tube accelerating voltage in kilovolts (kV) registered by the protocol. Determines
        the maximum X-ray photon energy and controls penetration depth and phase contrast. Higher voltages
        provide greater penetration for dense or large samples; lower voltages improve contrast between
        low-density phases. If the voltage was varied across samples within the same protocol or session,
        report the full range applied (e.g., 90–115 kV). Note: some sources report this parameter as ''X
        keV'' (maximum Bremsstrahlung photon energy) rather than ''X kV'' (tube voltage). For polychromatic
        lab XCT, these are numerically equivalent: E_max [keV] = V [kV]. Record the value as stated in
        the source and add a parenthetical note if the unit used is keV.'
      anyOf:
      - type: number
      - type: string
    ada:tubeCurrentDefault:
      description: X-ray tube current in microamperes (µA) registered by the protocol. Controls photon
        flux and therefore projection image SNR. Higher current improves SNR but increases thermal loading
        on the source and may increase focal spot size. If the current was varied across samples within
        the same protocol or session, report the full range applied (e.g., 65–115 µA).
      anyOf:
      - type: number
      - type: string
    ada:xRayPreFilterDefault:
      description: Material and thickness of the beam-hardening filter placed between the X-ray source
        and the sample. Hardens the beam by attenuating low-energy photons, reducing beam hardening artifacts
        and improving CT number stability across the sample. Both filter material and thickness must be
        reported. Instrument-proprietary filter codes should be decoded where possible.
      type: string
    ada:voxelSizeDefault:
      description: Isotropic voxel edge length of the reconstructed 3D volume in micrometres. The protocol
        registers the target voxel size, set based on the minimum feature size to be resolved (target
        voxel size ≤ ~1/3 of the minimum resolvable feature size). At analysis level, record the achieved
        voxel size as reported by the reconstruction software, which may differ slightly from the target
        due to final geometric calibration.
      anyOf:
      - type: number
      - type: string
    ada:rotationRangeDefault:
      description: Total angular range over which projection images are acquired, in degrees. Full 360°
        rotation is standard for cone-beam lab XCT. 180° rotation (half-scan) is sometimes used for faster
        acquisition but may introduce additional artifacts.
      anyOf:
      - type: number
      - type: string
    ada:numberOfProjectionsDefault:
      description: Total number of equally-spaced projection images acquired over the full rotation range.
        More projections improve reconstruction quality by reducing under-sampling streak artifacts but
        increase scan time. For Mode B (multi-volume stitching), this is the number per sub-volume.
      anyOf:
      - type: number
      - type: string
    ada:exposureTimePerProjectionDefault:
      description: 'Duration of X-ray exposure for each individual projection image frame, in seconds,
        as registered by the protocol. Set as a deliberate choice for the target sample type and voxel
        size: longer exposures increase SNR at the cost of total scan time. May be adjusted within protocol-allowed
        bounds for samples that are unusually dense or unusually transparent. If the exposure time was
        varied across samples within the same protocol or session, report the full range applied (e.g.,
        0.5–2 s).'
      anyOf:
      - type: number
      - type: string
    ada:flatFieldCorrectionDefault:
      description: Whether dark-field (detector read with X-ray source off; electronic noise baseline)
        and bright-field (source on, no sample; gain calibration) reference images are acquired and applied
        to normalize detector response before reconstruction. Standard practice in all quantitative lab
        XCT;.
      type: string
    ada:rotationModeDefault:
      description: Whether projection images are acquired during continuous sample rotation (faster; may
        introduce slight motion blur at high rotation speeds) or at discrete step positions with the stage
        stationary during each exposure (stop-and-shoot; eliminates motion blur). Continuous rotation
        has been associated with sub-volume rotational mismatch artifacts in multi-volume stitching workflows
        (Eckley et al. 2025).
      type: string
    ada:minimumSubVolumeOverlap:
      description: Minimum number of reconstructed slices that must overlap between adjacent sub-volumes
        in a stitched dataset. This is a protocol-level quality specification. Eckley et al. (2025) report
        that 500 slices of overlap were used in the Apollo 73001 stitching workflow, while 180 slices
        proved insufficient for their cone-beam geometry.
      anyOf:
      - type: number
      - type: string
    ada:reconstructionAlgorithm:
      description: Mathematical algorithm used to reconstruct the 3D CT volume from 2D projection images.
        The Feldkamp-Davis-Kress (FDK) algorithm is standard for cone-beam lab XCT geometry; iterative
        methods offer better artifact suppression at the cost of computation time.
      type: string
    ada:beamHardeningCorrectionMethod:
      description: 'Strategy used to reduce beam hardening artifacts caused by preferential attenuation
        of low-energy photons in polychromatic cone-beam XCT. Beam hardening causes cupping artifacts
        (CT numbers elevated at sample edges relative to the interior) and can bias segmentation thresholds.
        Hardware pre-filtering (Group 4: X-ray Pre-filter) and software correction are complementary approaches.
        The method is a protocol-level design choice; the specific correction parameter value is session-specific
        and recorded separately at analysis level.'
      type: string
    ada:outputDataFormatDefault:
      description: File format of the reconstructed CT volume as output by the reconstruction software.
        Bit depth is recorded separately in Output Bit Depth.
      type: string
    ada:segmentationMethodDefault:
      description: General approach used to separate distinct phases or features in the reconstructed
        CT volume. The method must be reported for any quantitative result to be reproducible.
      type: string
    ada:subVolumeStitchingAndRegistrationMethodDefault:
      description: 'Method used to register adjacent sub-volume datasets to each other and stitch them
        into a single continuous 3D volume. Report the alignment strategy (manual, automated, fiducial-based),
        the software used, and any correction steps applied. Note: rotational mismatch artifacts have
        been identified in continuous-rotation acquisitions (~0.35° misalignment in Eckley et al. 2025);
        their correction via raw projection re-alignment should be documented here.'
      type: string
    schema:additionalProperty:
      type: array
      description: Method-level Advanced-protocol parameters. Editable parameters are schema:PropertyValueSpecification
        entries (…Default name; the per-dataset value lives in the detail block); read-only parameters
        are schema:PropertyValue entries carrying the fixed protocol value in schema:value.
      items:
        anyOf:
        - $ref: ../parameterTemplates/schema.yaml#/$defs/labxct_coupledTechniqueDefault
        - $ref: ../parameterTemplates/schema.yaml#/$defs/labxct_couplingDescriptionDefault
        - $ref: ../parameterTemplates/schema.yaml#/$defs/sampleDimensionsDefault
        - $ref: ../parameterTemplates/schema.yaml#/$defs/sampleMountingMethodDefault
        - $ref: ../parameterTemplates/schema.yaml#/$defs/samplePreparationNotesDefault
        - $ref: ../parameterTemplates/schema.yaml#/$defs/xRayPowerDefault
        - $ref: ../parameterTemplates/schema.yaml#/$defs/sourceToObjectDistanceDefault
        - $ref: ../parameterTemplates/schema.yaml#/$defs/sourceToDetectorDistanceDefault
        - $ref: ../parameterTemplates/schema.yaml#/$defs/rotationStepSizeDefault
        - $ref: ../parameterTemplates/schema.yaml#/$defs/framesAveragedPerProjectionDefault
        - $ref: ../parameterTemplates/schema.yaml#/$defs/detectorBinningDefault
        - $ref: ../parameterTemplates/schema.yaml#/$defs/reconstructionConvolutionFilterDefault
        - $ref: ../parameterTemplates/schema.yaml#/$defs/beamHardeningCorrectionParameterDefault
        - $ref: ../parameterTemplates/schema.yaml#/$defs/ringArtifactCorrectionMethodDefault
        - $ref: ../parameterTemplates/schema.yaml#/$defs/ctNumberCalibrationDefault
        - $ref: ../parameterTemplates/schema.yaml#/$defs/segmentationThresholdValuesOrCriteriaDefault
        - $ref: ../parameterTemplates/schema.yaml#/$defs/phaseIdentificationMethodDefault
        - $ref: ../parameterTemplates/schema.yaml#/$defs/voiSelectionCriteriaDefault
        - $ref: ../parameterTemplates/schema.yaml#/$defs/outputBitDepthDefault
        - $ref: ../parameterTemplates/schema.yaml#/$defs/partialVolumeEffectCriteriaDefault
        - $ref: ../parameterTemplates/schema.yaml#/$defs/crossValidationProtocolRequirementDefault
        - $ref: ../parameterValues/schema.yaml#/$defs/xRayTubeAnodeMaterial
        - $ref: ../parameterValues/schema.yaml#/$defs/detectorArraySize
        - $ref: ../parameterValues/schema.yaml#/$defs/detectorPixelSize
        - $ref: ../parameterValues/schema.yaml#/$defs/opticalObjective
      allOf:
      - contains:
          $ref: ../parameterTemplates/schema.yaml#/$defs/labxct_coupledTechniqueDefault
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterTemplates/schema.yaml#/$defs/labxct_couplingDescriptionDefault
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterTemplates/schema.yaml#/$defs/sampleDimensionsDefault
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterTemplates/schema.yaml#/$defs/sampleMountingMethodDefault
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterTemplates/schema.yaml#/$defs/samplePreparationNotesDefault
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterTemplates/schema.yaml#/$defs/xRayPowerDefault
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterTemplates/schema.yaml#/$defs/sourceToObjectDistanceDefault
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterTemplates/schema.yaml#/$defs/sourceToDetectorDistanceDefault
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterTemplates/schema.yaml#/$defs/rotationStepSizeDefault
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterTemplates/schema.yaml#/$defs/framesAveragedPerProjectionDefault
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterTemplates/schema.yaml#/$defs/detectorBinningDefault
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterTemplates/schema.yaml#/$defs/reconstructionConvolutionFilterDefault
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterTemplates/schema.yaml#/$defs/beamHardeningCorrectionParameterDefault
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterTemplates/schema.yaml#/$defs/ringArtifactCorrectionMethodDefault
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterTemplates/schema.yaml#/$defs/ctNumberCalibrationDefault
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterTemplates/schema.yaml#/$defs/segmentationThresholdValuesOrCriteriaDefault
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterTemplates/schema.yaml#/$defs/phaseIdentificationMethodDefault
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterTemplates/schema.yaml#/$defs/voiSelectionCriteriaDefault
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterTemplates/schema.yaml#/$defs/outputBitDepthDefault
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterTemplates/schema.yaml#/$defs/partialVolumeEffectCriteriaDefault
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterTemplates/schema.yaml#/$defs/crossValidationProtocolRequirementDefault
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterValues/schema.yaml#/$defs/xRayTubeAnodeMaterial
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterValues/schema.yaml#/$defs/detectorArraySize
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterValues/schema.yaml#/$defs/detectorPixelSize
        minContains: 0
        maxContains: 1
      - contains:
          $ref: ../parameterValues/schema.yaml#/$defs/opticalObjective
        minContains: 0
        maxContains: 1
  required:
  - ada:targetFeature
  - ada:xRaySourceConfiguration
  - ada:detectorType
  - ada:reconstructionSoftwareDefault
  - ada:segmentationAndAnalysisSoftwareDefault
  - ada:acceleratingVoltageDefault
  - ada:tubeCurrentDefault
  - ada:xRayPreFilterDefault
  - ada:voxelSizeDefault
  - ada:rotationRangeDefault
  - ada:numberOfProjectionsDefault
  - ada:exposureTimePerProjectionDefault
  - ada:flatFieldCorrectionDefault
  - ada:rotationModeDefault
  - ada:minimumSubVolumeOverlap
  - ada:reconstructionAlgorithm
  - ada:beamHardeningCorrectionMethod
  - ada:outputDataFormatDefault
  - ada:segmentationMethodDefault
  - ada:subVolumeStitchingAndRegistrationMethodDefault
