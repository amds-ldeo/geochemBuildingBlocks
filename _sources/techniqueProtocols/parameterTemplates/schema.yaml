  sampleDimensionsDefault:
    title: Sample Dimensions (L × W × H)
    description: Physical dimensions of the sample in mm, reported as length × width × height (or equivalent
      three orthogonal measurements). The maximum dimension constrains the minimum achievable field of view
      and therefore the coarsest achievable voxel size. The minimum dimension determines how many voxels
      span the smallest feature of interest.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/sampleDimensionsDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: sampleDimensionsDefault
      schema:name:
        const: Sample Dimensions (L × W × H)
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  sampleMountingMethodDefault:
    title: Sample Mounting Method
    description: Method used to mount or hold the sample on the instrument rotation stage. Mounting material
      should transmit X-rays at the selected voltage without dominating beam attenuation. Report the holder
      type, adhesive or support material, and any alignment aids used.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/sampleMountingMethodDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: sampleMountingMethodDefault
      schema:name:
        const: Sample Mounting Method
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  samplePreparationNotesDefault:
    title: Sample Preparation Notes
    description: Any preparation steps applied to the sample before scanning, including cleaning, trimming,
      consolidation, or drying. XCT is typically non-destructive with no surface preparation required; note
      any exceptions.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/samplePreparationNotesDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: samplePreparationNotesDefault
      schema:name:
        const: Sample Preparation Notes
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  xRayPowerDefault:
    title: X-ray Power
    description: 'X-ray tube power in watts (W) registered by the protocol. Derivable as voltage (kV) ×
      current (mA) = kV × µA / 1000. Power constrains the achievable focal spot size for microfocal tubes:
      higher power requires a larger focal spot, trading spatial resolution for SNR. Retained as a standalone
      field because it is routinely reported in the literature and directly constrains instrument operating
      limits. If power was varied across samples within the session, report the full range applied (e.g.,
      7–13 W).'
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/xRayPowerDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: xRayPowerDefault
      schema:name:
        const: X-ray Power
      ada:dataType:
        const: number
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:unitText:
        const: W
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  sourceToObjectDistanceDefault:
    title: Source-to-Object Distance (SOD)
    description: Distance from the X-ray source focal spot to the centre of the sample rotation axis, in
      mm, as registered by the protocol. Together with SDD, determines geometric magnification (M = SDD/SOD).
      Shorter SOD increases magnification and reduces voxel size.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/sourceToObjectDistanceDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: sourceToObjectDistanceDefault
      schema:name:
        const: Source-to-Object Distance (SOD)
      ada:dataType:
        const: number
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:unitText:
        const: mm
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  sourceToDetectorDistanceDefault:
    title: Source-to-Detector Distance (SDD)
    description: Distance from the X-ray source focal spot to the detector surface, in mm, as registered
      by the protocol. Together with SOD, determines geometric magnification M = SDD/SOD. Voxel size ≈ detector
      pixel size / M (before binning; divide additionally by optical objective for Versa-class systems).
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/sourceToDetectorDistanceDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: sourceToDetectorDistanceDefault
      schema:name:
        const: Source-to-Detector Distance (SDD)
      ada:dataType:
        const: number
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:unitText:
        const: mm
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  rotationStepSizeDefault:
    title: Rotation Step Size
    description: Angular increment between successive projection images, in degrees. Equal to Rotation Range
      divided by Number of Projections when both are reported; however, some sources report step size as
      the primary rotation parameter without stating the total number of projections explicitly. Finer step
      sizes improve angular sampling and reduce streak artifacts at the cost of longer scan time.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/rotationStepSizeDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: rotationStepSizeDefault
      schema:name:
        const: Rotation Step Size
      ada:dataType:
        const: number
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:unitText:
        const: °
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  framesAveragedPerProjectionDefault:
    title: Frames Averaged per Projection
    description: Number of individual detector frames acquired and averaged to produce each saved projection
      image, as registered by the protocol. Frame averaging reduces random electronic noise. The effective
      exposure per projection = exposure time per frame × frames averaged.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/framesAveragedPerProjectionDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: framesAveragedPerProjectionDefault
      schema:name:
        const: Frames Averaged per Projection
      ada:dataType:
        const: integer
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  detectorBinningDefault:
    title: Detector Binning
    description: Detector pixel binning factor applied during acquisition. Binning combines adjacent pixels
      (e.g., 2×2 combines 4 pixels into one), reducing effective resolution while increasing per-pixel SNR
      and reducing file size. 1×1 indicates no binning.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/detectorBinningDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: detectorBinningDefault
      schema:name:
        const: Detector Binning
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  reconstructionConvolutionFilterDefault:
    title: Reconstruction Convolution Filter
    description: Convolution (apodization) filter kernel applied during back-projection reconstruction.
      Sharper filters (Ram-Lak) enhance edge definition but amplify high-frequency noise; smoother filters
      (Hann, Hamming) reduce noise at the cost of edge sharpness. The choice represents a deliberate protocol-level
      tradeoff.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/reconstructionConvolutionFilterDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: reconstructionConvolutionFilterDefault
      schema:name:
        const: Reconstruction Convolution Filter
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  beamHardeningCorrectionParameterDefault:
    title: Beam Hardening Correction Parameter
    description: Numerical value or setting applied in the software beam hardening correction algorithm
      for this specific analysis. May be tuned empirically per material type or per scan session. Analysis-level
      companion to Beam Hardening Correction Method.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/beamHardeningCorrectionParameterDefault
      '@type':
