$schema: https://json-schema.org/draft/2020-12/schema
title: ADA Method-Parameter Template Registry
description: Registry of reusable schema:PropertyValueSpecification method-parameter templates derived from technique TAPP spreadsheets. Each $def constrains one method-level (readOnly:true) parameter template (e.g. DriftCorrection, massAbsorptionCoefficients). TAPP building blocks reference these definitions via fragment $refs (schema.yaml#/$defs/<name>) so they resolve locally through the building-block register. The root only hosts $defs; it has no instantiable properties of its own.
type: object
$defs:
  fusionFluxAndDilutionRatioDefault:
    title: Fusion Flux and Dilution Ratio
    description: For protocols using fused glass, the flux type and sample:flux dilution ratio used to prepare the analytical glass.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/fusionFluxAndDilutionRatioDefault
      '@type':
        const:
          - schema:PropertyValueSpecification
      schema:valueName:
        const: fusionFluxAndDilutionRatioDefault
      schema:name:
        const: Fusion Flux and Dilution Ratio
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
      - '@id'
      - '@type'
      - schema:valueName
      - schema:name
      - ada:dataType
      - ada:fieldScope
  preAblationSurfaceTreatmentDefault:
    title: Pre-Ablation Surface Treatment
    description: Protocol applied immediately before each analysis to remove surface contamination or condition the sample surface. Distinct from general sample preparation. For spot analysis, pre-ablation pulses are discarded before signal acquisition begins. For mapping, this step is typically omitted as the large area ablated averages out surface effects.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/preAblationSurfaceTreatmentDefault
      '@type':
        const:
          - schema:PropertyValueSpecification
      schema:valueName:
        const: preAblationSurfaceTreatmentDefault
      schema:name:
        const: Pre-Ablation Surface Treatment
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
      - '@id'
      - '@type'
      - schema:valueName
      - schema:name
      - ada:dataType
      - ada:fieldScope
  torchDepthDefault:
    title: Torch Depth
    description: Distance between the load coil and the sampling cone tip (mm), also called injector depth or torch position depending on the instrument manufacturer. Affects ion transmission efficiency, oxide formation, and doubly-charged species production. The protocol specifies a target value optimised during initial setup; the analyst confirms or fine-adjusts during session tuning.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/torchDepthDefault
      '@type':
        const:
          - schema:PropertyValueSpecification
      schema:valueName:
        const: torchDepthDefault
      schema:name:
        const: Torch Depth
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
      - '@id'
      - '@type'
      - schema:valueName
      - schema:name
      - ada:dataType
      - ada:fieldScope
  laserEnergyDefault:
    title: Laser Energy
    description: Laser pulse energy in millijoules as set at the laser output or measured at the sample surface. Less commonly reported than fluence because it does not account for spot area. Report only when the system displays energy directly. Laser fluence (J cm⁻²) is the preferred quantity and is captured in Default Laser Fluence.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/laserEnergyDefault
      '@type':
        const:
          - schema:PropertyValueSpecification
      schema:valueName:
        const: laserEnergyDefault
      schema:name:
        const: Laser Energy
      ada:dataType:
        const: number
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:unitText:
        const: mJ
    required:
      - '@id'
      - '@type'
      - schema:valueName
      - schema:name
      - ada:dataType
      - ada:fieldScope
  transectOrMappingRateOrStepSizeDefault:
    title: Transect Rate, Mapping Rate or Step Size
    description: 'For continuous line scan (transect) and raster mapping: the stage translation speed in µm s⁻¹. This is the protocol-level parameter that, together with spot size and repetition rate, determines spatial resolution along the scan direction. For mapping, the mapping rate (mm² h⁻¹) may be reported as an alternative when scan speed is session-variable. For stepped line profiles: the distance between successive spot positions in µm.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/transectOrMappingRateOrStepSizeDefault
      '@type':
        const:
          - schema:PropertyValueSpecification
      schema:valueName:
        const: transectOrMappingRateOrStepSizeDefault
      schema:name:
        const: Transect Rate, Mapping Rate or Step Size
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
      - '@id'
      - '@type'
      - schema:valueName
      - schema:name
      - ada:dataType
      - ada:fieldScope
  plasmaMakeUpGasAdditionDefault:
    title: Plasma / Make-up Gas Addition
    description: Additional gas(es) mixed into the carrier stream downstream of the ablation cell, with the protocol-registered target flow rate. Ar make-up gas is standard. Small N₂ additions can enhance sensitivity for some elements. If N₂ is not added, state "None" explicitly to distinguish from not reported.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/plasmaMakeUpGasAdditionDefault
      '@type':
        const:
          - schema:PropertyValueSpecification
      schema:valueName:
        const: plasmaMakeUpGasAdditionDefault
      schema:name:
        const: Plasma / Make-up Gas Addition
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
      - '@id'
      - '@type'
      - schema:valueName
      - schema:name
      - ada:dataType
      - ada:fieldScope
  gasFlowRateDefault:
    title: Auxiliary and Cool Gas Flow Rates
    description: ICP auxiliary (intermediate) and cool (outer/plasma) Ar gas flow rates in l min⁻¹. The protocol registers target values; actual session values may be adjusted slightly during tuning.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/gasFlowRateDefault
      '@type':
        const:
          - schema:PropertyValueSpecification
      schema:valueName:
        const: gasFlowRateDefault
      schema:name:
        const: Auxiliary and Cool Gas Flow Rates
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
      - '@id'
      - '@type'
      - schema:valueName
      - schema:name
      - ada:dataType
      - ada:fieldScope
  signalSmoothingDefault:
    title: Signal Smoothing
    description: 'Description of any signal smoothing device or approach installed between the ablation cell and the ICP-MS to reduce pulse-to-pulse signal variability. Note: active signal smoothing devices (e.g., squid, SCFAST) are generally incompatible with high-resolution raster mapping because they degrade spatial resolution by mixing aerosol from successive laser shots. For mapping analyses, report "None" explicitly.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/signalSmoothingDefault
      '@type':
        const:
          - schema:PropertyValueSpecification
      schema:valueName:
        const: signalSmoothingDefault
      schema:name:
        const: Signal Smoothing
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
      - '@id'
      - '@type'
      - schema:valueName
      - schema:name
      - ada:dataType
      - ada:fieldScope
  icPlasmaTuningDefault:
    title: ICP Tuning
    description: Description of the approach used to optimise ICP plasma conditions prior to analysis, including the reference material used for tuning and the acceptance criteria (e.g., oxide production threshold, sensitivity targets, mass calibration).
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/icPlasmaTuningDefault
      '@type':
        const:
          - schema:PropertyValueSpecification
      schema:valueName:
        const: icPlasmaTuningDefault
      schema:name:
        const: ICP Tuning
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
      - '@id'
      - '@type'
      - schema:valueName
      - schema:name
      - ada:dataType
      - ada:fieldScope
  doublyChargedSpeciesMonitorDefault:
    title: Doubly-Charged Species Monitor
    description: The mass ratio monitored to estimate doubly-charged ion (M²⁺) formation during instrument tuning. Doubly-charged ions appear at half the mass of the parent ion and can cause isobaric interferences on analytes in that mass region. The monitor species and the mass positions monitored should be stated explicitly. Analogous to Oxide Production Method and Threshold for oxide monitoring.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/doublyChargedSpeciesMonitorDefault
      '@type':
        const:
          - schema:PropertyValueSpecification
      schema:valueName:
        const: doublyChargedSpeciesMonitorDefault
      schema:name:
        const: Doubly-Charged Species Monitor
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
      - '@id'
      - '@type'
      - schema:valueName
      - schema:name
      - ada:dataType
      - ada:fieldScope
  doublyChargedSpeciesProductionDefault:
    title: Doubly-Charged Species Production
    description: Measured percentage of doubly-charged ion production for the monitored species at the time of instrument tuning. The protocol should specify the acceptable threshold (e.g., <1%, <3%); the measured value for each session is recorded here. Report both the threshold and the measured value where possible.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/doublyChargedSpeciesProductionDefault
      '@type':
        const:
          - schema:PropertyValueSpecification
      schema:valueName:
        const: doublyChargedSpeciesProductionDefault
      schema:name:
        const: Doubly-Charged Species Production
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
      - '@id'
      - '@type'
      - schema:valueName
      - schema:name
      - ada:dataType
      - ada:fieldScope
  driftMonitorFrequencyDefault:
    title: Drift Monitor Frequency
    description: Frequency at which primary reference materials are analysed to monitor instrument drift and apply drift corrections across the session. Editable to allow analysts to increase monitoring frequency if drift is observed.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/driftMonitorFrequencyDefault
      '@type':
        const:
          - schema:PropertyValueSpecification
      schema:valueName:
        const: driftMonitorFrequencyDefault
      schema:name:
        const: Drift Monitor Frequency
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
      - '@id'
      - '@type'
      - schema:valueName
      - schema:name
      - ada:dataType
      - ada:fieldScope
  outlierFilteringDefault:
    title: Spike / Outlier Filtering Approach
    description: Method used to identify and remove anomalous signal spikes arising from micronuggets, inclusions, cracks, or instrument artifacts during time-resolved signal processing. Editable because the specific implementation may vary between sessions while remaining within the protocol framework.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/outlierFilteringDefault
      '@type':
        const:
          - schema:PropertyValueSpecification
      schema:valueName:
        const: outlierFilteringDefault
      schema:name:
        const: Spike / Outlier Filtering Approach
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
      - '@id'
      - '@type'
      - schema:valueName
      - schema:name
      - ada:dataType
      - ada:fieldScope
  nonlinearResponseCorrectionDefault:
    title: Pulse/Analog Detector Nonlinearity Correction
    description: Whether a correction was applied for nonlinear response at the transition between pulse-counting and analog detector modes.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/nonlinearResponseCorrectionDefault
      '@type':
        const:
          - schema:PropertyValueSpecification
      schema:valueName:
        const: nonlinearResponseCorrectionDefault
      schema:name:
        const: Pulse/Analog Detector Nonlinearity Correction
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
      - '@id'
      - '@type'
      - schema:valueName
      - schema:name
      - ada:dataType
      - ada:fieldScope
  memoryEffectMitigationDefault:
    title: Memory Effect Mitigation
    description: Protocol applied to identify and minimise memory effects from high-concentration elements in the previous sample or standard that may contaminate subsequent analyses, or from incomplete aerosol washout between adjacent pixels in raster mapping mode. For mapping, the mitigation strategy involves controlling scan speed relative to washout time to ensure each pixel signal is sufficiently free of the preceding pixel's contribution.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/memoryEffectMitigationDefault
      '@type':
        const:
          - schema:PropertyValueSpecification
      schema:valueName:
        const: memoryEffectMitigationDefault
      schema:name:
        const: Memory Effect Mitigation
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
      - '@id'
      - '@type'
      - schema:valueName
      - schema:name
      - ada:dataType
      - ada:fieldScope
  postAcquisitionNormalizationDefault:
    title: Normalization / Standards-Based Correction
    description: Any post-acquisition normalization applied to correct for systematic biases identified from secondary reference materials, or stoichiometric normalization applied per pixel in mapping. Distinct from the primary internal standard approach captured in Internal Standard Approach.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/postAcquisitionNormalizationDefault
      '@type':
        const:
          - schema:PropertyValueSpecification
      schema:valueName:
        const: postAcquisitionNormalizationDefault
      schema:name:
        const: Normalization / Standards-Based Correction
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
      - '@id'
      - '@type'
      - schema:valueName
      - schema:name
      - ada:dataType
      - ada:fieldScope
  beamRasterDimensionsDefault:
    title: Beam Raster Dimensions
    description: X × Y dimensions of beam raster area in micrometers, if beam raster mode was used.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/beamRasterDimensionsDefault
      '@type':
        const:
          - schema:PropertyValueSpecification
      schema:valueName:
        const: beamRasterDimensionsDefault
      schema:name:
        const: Beam Raster Dimensions
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
      - '@id'
      - '@type'
      - schema:valueName
      - schema:name
      - ada:dataType
      - ada:fieldScope
  driftCorrectionDefault:
    title: Drift Correction
    description: Describe method used to monitor and correct for instrument drift
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/driftCorrectionDefault
      '@type':
        const:
          - schema:PropertyValueSpecification
      schema:valueName:
        const: driftCorrectionDefault
      schema:name:
        const: Drift Correction
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
      - '@id'
      - '@type'
      - schema:valueName
      - schema:name
      - ada:dataType
      - ada:fieldScope

  temObjectiveApertureDefault:
    title: TEM Objective Aperture
    description: Objective aperture diameter used to select the imaging beam condition in TEM mode. In BF-TEM,
      a small aperture blocks diffracted beams to enhance mass-thickness contrast; in DF-TEM, the aperture
      is displaced to select a specific diffracted beam; in HRTEM, no aperture is typically used.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/temObjectiveApertureDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: temObjectiveApertureDefault
      schema:name:
        const: TEM Objective Aperture
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  eftemEnergyWindowDefault:
    title: EFTEM Energy Window
    description: 'Energy window(s) used for EFTEM elemental mapping: center energy, width, and acquisition
      method (three-window or jump-ratio).'
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/eftemEnergyWindowDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: eftemEnergyWindowDefault
      schema:name:
        const: EFTEM Energy Window
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  haadfCollectionAnglesDefault:
    title: HAADF Collection Angles
    description: Inner and outer collection angles of the HAADF detector in milliradians (mrad). The inner
      angle determines the boundary between diffracted and thermally diffuse scattered electrons; larger
      inner angles yield stronger Z-contrast and reduced Bragg contrast.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/haadfCollectionAnglesDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: haadfCollectionAnglesDefault
      schema:name:
        const: HAADF Collection Angles
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  stemProbeDiameterDefault:
    title: STEM Probe Diameter
    description: 'Nominal or measured diameter of the focused electron probe at the sample, reported in
      nm. Serves as a direct spatial resolution proxy for STEM imaging and STEM-EDS/EELS analysis. Related
      to, but distinct from, Convergence Semi-Angle: the two quantities are connected via aberration coefficients,
      defocus, and probe current, which are not always published. Report whichever is known; if both are
      known, report both fields.'
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/stemProbeDiameterDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: stemProbeDiameterDefault
      schema:name:
        const: STEM Probe Diameter
      ada:dataType:
        const: number
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:unitText:
        const: nm
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  stemProbeCurrentDefault:
    title: STEM Probe Current
    description: Probe current in picoamperes (pA) or nanoamperes (nA). Higher current improves EDS/EELS
      signal but increases beam damage risk, especially for organic matter and hydrous minerals.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/stemProbeCurrentDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: stemProbeCurrentDefault
      schema:name:
        const: STEM Probe Current
      ada:dataType:
        const: number
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:unitText:
        const: pA or nA
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  stemScanDimensionsDefault:
    title: STEM Scan Dimensions
    description: Number of pixels in the STEM scan frame (X × Y pixels). Combined with calibrated pixel
      size, defines the field of view.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/stemScanDimensionsDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: stemScanDimensionsDefault
      schema:name:
        const: STEM Scan Dimensions
      ada:dataType:
        const: number
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:unitText:
        const: pixels x pixels
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  stemFrameAveragingDefault:
    title: STEM Frame Averaging
    description: Number of frames averaged (with drift correction if applicable) to produce the final STEM
      image. Averaging reduces noise while limiting per-frame dose.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/stemFrameAveragingDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: stemFrameAveragingDefault
      schema:name:
        const: STEM Frame Averaging
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  selectedAreaApertureSizeDefault:
    title: Selected-Area Aperture Size
    description: Diameter of the selected-area aperture used in SAED mode, defining the specimen region
      that contributes to the diffraction pattern.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/selectedAreaApertureSizeDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: selectedAreaApertureSizeDefault
      schema:name:
        const: Selected-Area Aperture Size
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  precessionAngleDefault:
    title: Precession Angle
    description: Precession semi-angle in degrees for precession electron diffraction (PED). Hollow-cone
      illumination reduces dynamical diffraction effects and produces more kinematical-like intensities.
      Not applicable to SAED, CBED, or standard 4D-STEM.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/precessionAngleDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: precessionAngleDefault
      schema:name:
        const: Precession Angle
      ada:dataType:
        const: number
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:unitText:
        const: degrees
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  4dStemScanGridAndAreaDefault:
    title: 4D-STEM Scan Grid and Area
    description: Number of probe positions in the 4D-STEM dataset (scan pixels × scan pixels) and the physical
      area covered. Probe step size is the physical area divided by scan pixel count.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/4dStemScanGridAndAreaDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: 4dStemScanGridAndAreaDefault
      schema:name:
        const: 4D-STEM Scan Grid and Area
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  4dStemDwellTimePerProbePositionDefault:
    title: 4D-STEM Dwell Time per Probe Position
