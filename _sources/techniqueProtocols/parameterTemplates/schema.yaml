  ringArtifactCorrectionMethodDefault:
    title: Ring Artifact Correction Method
    description: Protocol specification for how ring artifacts are handled. Ring artifacts appear as concentric
      circular bands centred on the rotation axis and arise from defective or miscalibrated detector pixels.
      Method is the protocol-level specification; whether correction was applied and its outcome are recorded
      at analysis level in Group 6.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/ringArtifactCorrectionMethodDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: ringArtifactCorrectionMethodDefault
      schema:name:
        const: Ring Artifact Correction Method
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  ctNumberCalibrationDefault:
    title: CT Number Calibration
    description: Whether the raw CT grayscale values have been calibrated to physically meaningful units
      using reference materials. Calibrated CT numbers enable cross-instrument and cross-session comparison
      and support phase identification by comparison to calculated linear attenuation coefficient (LAC)
      values (e.g., using MuCalc; Hanna & Ketcham 2017). Uncalibrated grayscale values are instrument- and
      session-specific.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/ctNumberCalibrationDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: ctNumberCalibrationDefault
      schema:name:
        const: CT Number Calibration
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  segmentationThresholdValuesOrCriteriaDefault:
    title: Segmentation Threshold Values or Criteria
    description: Specific CT number range(s) or quantitative criteria used to define each segmented phase
      or feature. Documenting these values enables reproducibility assessment and cross-study comparison.
      For LAC-calibrated datasets, report values in cm⁻¹.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/segmentationThresholdValuesOrCriteriaDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: segmentationThresholdValuesOrCriteriaDefault
      schema:name:
        const: Segmentation Threshold Values or Criteria
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  phaseIdentificationMethodDefault:
    title: Phase Identification Method
    description: Method used to assign reconstructed CT number ranges to specific mineral phases or material
      types. Approaches include comparison to calculated linear attenuation coefficients (LAC), cross-validation
      with independent analytical techniques, or empirical calibration.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/phaseIdentificationMethodDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: phaseIdentificationMethodDefault
      schema:name:
        const: Phase Identification Method
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  voiSelectionCriteriaDefault:
    title: VOI Selection Criteria
    description: Protocol-level rules specifying how the Volume of Interest (VOI) is to be defined for quantitative
      analysis. Common criteria exclude cone-beam artifact zones at sample edges, beam hardening halos near
      dense inclusions, and sample holder signal. The actual VOI applied in a specific analysis is recorded
      separately at analysis level.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/voiSelectionCriteriaDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: voiSelectionCriteriaDefault
      schema:name:
        const: VOI Selection Criteria
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  outputBitDepthDefault:
    title: Output Bit Depth
    description: Bit depth of the reconstructed 3D volume (number of bits used to encode each voxel's grayscale
      value). Common values are 8-bit (256 gray levels), 16-bit (65,536 gray levels), or 32-bit floating
      point. Bit depth affects the dynamic range available for phase segmentation and quantitative attenuation
      analysis. The protocol may specify a required output bit depth if downstream analysis workflows depend
      on a consistent grayscale range; the analyst confirms or adjusts at analysis time.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/outputBitDepthDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: outputBitDepthDefault
      schema:name:
        const: Output Bit Depth
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  partialVolumeEffectCriteriaDefault:
    title: Partial Volume Effect Criteria
    description: Protocol-level specification of how partial volume effects (PVE) are managed in quantitative
      analysis. PVE produces intermediate CT numbers at phase boundaries and at the surfaces of small features,
      because each voxel integrates the attenuation of all material within its volume. PVE correction can
      be implemented via PSF-based deconvolution tools such as Blob3D. Record the minimum feature size criterion
      adopted for the protocol (in voxels or µm), the treatment of boundary voxels in modal abundance or
      size distribution calculations, and whether PVE correction is required or optional.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/partialVolumeEffectCriteriaDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: partialVolumeEffectCriteriaDefault
      schema:name:
        const: Partial Volume Effect Criteria
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  crossValidationProtocolRequirementDefault:
    title: Cross-Validation Protocol Requirement
    description: Protocol-level specification of what independent analytical validation is required to confirm
      CT segmentation results, phase identification, or quantitative measurements. Cross-validation is relevant
      where CT grey-values alone cannot uniquely distinguish phases with similar attenuation coefficients.
      Common approaches include BSE imaging, SEM-EDS or EPMA modal analysis, He pycnometry for bulk porosity,
      and Raman or SIMS phase mapping. Record the required validation method(s) and the sampling fraction
      (e.g., every sample, one per session, or a representative subset).
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/crossValidationProtocolRequirementDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: crossValidationProtocolRequirementDefault
      schema:name:
        const: Cross-Validation Protocol Requirement
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
