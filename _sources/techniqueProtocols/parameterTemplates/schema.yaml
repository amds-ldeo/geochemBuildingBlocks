  edsCountingStatisticsAccumulationCriterionDefault:
    title: EDS Counting Statistics / Accumulation Criterion
    description: Quality criterion used to determine when sufficient EDS signal has been accumulated for
      a given pixel or point, in lieu of or in addition to a fixed live time. Expressed as a target relative
      uncertainty on major-element peak counts achieved by accumulating successive scan frames (e.g., "1%
      counting statistics on major elements"; ">10% counting statistics"). Distinct from EDS Live Time per
      Point or Pixel, which records a fixed-duration setting.
