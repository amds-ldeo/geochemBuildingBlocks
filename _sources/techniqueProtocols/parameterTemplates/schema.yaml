    - ada:fieldScope

  sampleDimensionsDefault:
    title: Sample Dimensions (L × W × H)
    description: Physical dimensions of the sample in mm, reported as length × width × height (or equivalent
      three orthogonal measurements). The maximum dimension constrains the minimum achievable field of view
      and therefore the coarsest achievable voxel size. The minimum dimension determines how many voxels
      span the smallest feature of interest.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/sampleDimensionsDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: sampleDimensionsDefault
      schema:name:
        const: Sample Dimensions (L × W × H)
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  sampleMountingMethodDefault:
    title: Sample Mounting Method
    description: Method used to mount or hold the sample on the instrument rotation stage. Mounting material
      should transmit X-rays at the selected voltage without dominating beam attenuation. Report the holder
      type, adhesive or support material, and any alignment aids used.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/sampleMountingMethodDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: sampleMountingMethodDefault
      schema:name:
        const: Sample Mounting Method
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  samplePreparationNotesDefault:
    title: Sample Preparation Notes
    description: Any preparation steps applied to the sample before scanning, including cleaning, trimming,
      consolidation, or drying. XCT is typically non-destructive with no surface preparation required; note
      any exceptions.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/samplePreparationNotesDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: samplePreparationNotesDefault
      schema:name:
        const: Sample Preparation Notes
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  xRayPowerDefault:
    title: X-ray Power
    description: 'X-ray tube power in watts (W) registered by the protocol. Derivable as voltage (kV) ×
      current (mA) = kV × µA / 1000. Power constrains the achievable focal spot size for microfocal tubes:
      higher power requires a larger focal spot, trading spatial resolution for SNR. Retained as a standalone
      field because it is routinely reported in the literature and directly constrains instrument operating
      limits. If power was varied across samples within the session, report the full range applied (e.g.,
      7–13 W).'
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/xRayPowerDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: xRayPowerDefault
      schema:name:
        const: X-ray Power
      ada:dataType:
        const: number
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:unitText:
        const: W
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  sourceToObjectDistanceDefault:
    title: Source-to-Object Distance (SOD)
    description: Distance from the X-ray source focal spot to the centre of the sample rotation axis, in
      mm, as registered by the protocol. Together with SDD, determines geometric magnification (M = SDD/SOD).
      Shorter SOD increases magnification and reduces voxel size.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/sourceToObjectDistanceDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: sourceToObjectDistanceDefault
      schema:name:
        const: Source-to-Object Distance (SOD)
      ada:dataType:
        const: number
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:unitText:
        const: mm
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  sourceToDetectorDistanceDefault:
    title: Source-to-Detector Distance (SDD)
    description: Distance from the X-ray source focal spot to the detector surface, in mm, as registered
      by the protocol. Together with SOD, determines geometric magnification M = SDD/SOD. Voxel size ≈ detector
      pixel size / M (before binning; divide additionally by optical objective for Versa-class systems).
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/sourceToDetectorDistanceDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: sourceToDetectorDistanceDefault
      schema:name:
        const: Source-to-Detector Distance (SDD)
      ada:dataType:
        const: number
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:unitText:
        const: mm
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  rotationStepSizeDefault:
    title: Rotation Step Size
    description: Angular increment between successive projection images, in degrees. Equal to Rotation Range
      divided by Number of Projections when both are reported; however, some sources report step size as
      the primary rotation parameter without stating the total number of projections explicitly. Finer step
      sizes improve angular sampling and reduce streak artifacts at the cost of longer scan time.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/rotationStepSizeDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: rotationStepSizeDefault
      schema:name:
        const: Rotation Step Size
      ada:dataType:
        const: number
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:unitText:
        const: °
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  framesAveragedPerProjectionDefault:
    title: Frames Averaged per Projection
    description: Number of individual detector frames acquired and averaged to produce each saved projection
      image, as registered by the protocol. Frame averaging reduces random electronic noise. The effective
      exposure per projection = exposure time per frame × frames averaged.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/framesAveragedPerProjectionDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: framesAveragedPerProjectionDefault
      schema:name:
        const: Frames Averaged per Projection
      ada:dataType:
        const: integer
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  detectorBinningDefault:
    title: Detector Binning
    description: Detector pixel binning factor applied during acquisition. Binning combines adjacent pixels
      (e.g., 2×2 combines 4 pixels into one), reducing effective resolution while increasing per-pixel SNR
      and reducing file size. 1×1 indicates no binning.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/detectorBinningDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: detectorBinningDefault
      schema:name:
        const: Detector Binning
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  reconstructionConvolutionFilterDefault:
    title: Reconstruction Convolution Filter
    description: Convolution (apodization) filter kernel applied during back-projection reconstruction.
      Sharper filters (Ram-Lak) enhance edge definition but amplify high-frequency noise; smoother filters
      (Hann, Hamming) reduce noise at the cost of edge sharpness. The choice represents a deliberate protocol-level
      tradeoff.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/reconstructionConvolutionFilterDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: reconstructionConvolutionFilterDefault
      schema:name:
        const: Reconstruction Convolution Filter
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  beamHardeningCorrectionParameterDefault:
    title: Beam Hardening Correction Parameter
    description: Numerical value or setting applied in the software beam hardening correction algorithm
      for this specific analysis. May be tuned empirically per material type or per scan session. Analysis-level
      companion to Beam Hardening Correction Method.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/beamHardeningCorrectionParameterDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: beamHardeningCorrectionParameterDefault
      schema:name:
        const: Beam Hardening Correction Parameter
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  ringArtifactCorrectionMethodDefault:
    title: Ring Artifact Correction Method
    description: Protocol specification for how ring artifacts are handled. Ring artifacts appear as concentric
      circular bands centred on the rotation axis and arise from defective or miscalibrated detector pixels.
      Method is the protocol-level specification; whether correction was applied and its outcome are recorded
      at analysis level in Group 6.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/ringArtifactCorrectionMethodDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: ringArtifactCorrectionMethodDefault
      schema:name:
        const: Ring Artifact Correction Method
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  ctNumberCalibrationDefault:
    title: CT Number Calibration
    description: Whether the raw CT grayscale values have been calibrated to physically meaningful units
      using reference materials. Calibrated CT numbers enable cross-instrument and cross-session comparison
      and support phase identification by comparison to calculated linear attenuation coefficient (LAC)
      values (e.g., using MuCalc; Hanna & Ketcham 2017). Uncalibrated grayscale values are instrument- and
      session-specific.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/ctNumberCalibrationDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: ctNumberCalibrationDefault
      schema:name:
        const: CT Number Calibration
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  segmentationThresholdValuesOrCriteriaDefault:
    title: Segmentation Threshold Values or Criteria
    description: Specific CT number range(s) or quantitative criteria used to define each segmented phase
      or feature. Documenting these values enables reproducibility assessment and cross-study comparison.
      For LAC-calibrated datasets, report values in cm⁻¹.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/segmentationThresholdValuesOrCriteriaDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: segmentationThresholdValuesOrCriteriaDefault
      schema:name:
        const: Segmentation Threshold Values or Criteria
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  phaseIdentificationMethodDefault:
    title: Phase Identification Method
    description: Method used to assign reconstructed CT number ranges to specific mineral phases or material
      types. Approaches include comparison to calculated linear attenuation coefficients (LAC), cross-validation
      with independent analytical techniques, or empirical calibration.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/phaseIdentificationMethodDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: phaseIdentificationMethodDefault
      schema:name:
        const: Phase Identification Method
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  voiSelectionCriteriaDefault:
    title: VOI Selection Criteria
    description: Protocol-level rules specifying how the Volume of Interest (VOI) is to be defined for quantitative
      analysis. Common criteria exclude cone-beam artifact zones at sample edges, beam hardening halos near
      dense inclusions, and sample holder signal. The actual VOI applied in a specific analysis is recorded
      separately at analysis level.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/voiSelectionCriteriaDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: voiSelectionCriteriaDefault
      schema:name:
        const: VOI Selection Criteria
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  outputBitDepthDefault:
    title: Output Bit Depth
    description: Bit depth of the reconstructed 3D volume (number of bits used to encode each voxel's grayscale
      value). Common values are 8-bit (256 gray levels), 16-bit (65,536 gray levels), or 32-bit floating
      point. Bit depth affects the dynamic range available for phase segmentation and quantitative attenuation
      analysis. The protocol may specify a required output bit depth if downstream analysis workflows depend
      on a consistent grayscale range; the analyst confirms or adjusts at analysis time.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/outputBitDepthDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: outputBitDepthDefault
      schema:name:
        const: Output Bit Depth
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  partialVolumeEffectCriteriaDefault:
    title: Partial Volume Effect Criteria
    description: Protocol-level specification of how partial volume effects (PVE) are managed in quantitative
      analysis. PVE produces intermediate CT numbers at phase boundaries and at the surfaces of small features,
      because each voxel integrates the attenuation of all material within its volume. PVE correction can
      be implemented via PSF-based deconvolution tools such as Blob3D. Record the minimum feature size criterion
      adopted for the protocol (in voxels or µm), the treatment of boundary voxels in modal abundance or
      size distribution calculations, and whether PVE correction is required or optional.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/partialVolumeEffectCriteriaDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: partialVolumeEffectCriteriaDefault
      schema:name:
        const: Partial Volume Effect Criteria
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  crossValidationProtocolRequirementDefault:
    title: Cross-Validation Protocol Requirement
    description: Protocol-level specification of what independent analytical validation is required to confirm
      CT segmentation results, phase identification, or quantitative measurements. Cross-validation is relevant
      where CT grey-values alone cannot uniquely distinguish phases with similar attenuation coefficients.
      Common approaches include BSE imaging, SEM-EDS or EPMA modal analysis, He pycnometry for bulk porosity,
      and Raman or SIMS phase mapping. Record the required validation method(s) and the sampling fraction
      (e.g., every sample, one per session, or a representative subset).
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/crossValidationProtocolRequirementDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: crossValidationProtocolRequirementDefault
      schema:name:
        const: Cross-Validation Protocol Requirement
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope

  chamberPressureDefault:
    title: Chamber Pressure
    description: Chamber pressure and gas type during analysis. Required for variable pressure (VP-SEM)
      and environmental SEM (ESEM) modes. Report value and unit (Pa or Torr) and gas composition. Use 'None'
      for standard high-vacuum operation.
    type: object
    properties:
      '@id':
        const: ada:parameter/semImagingTAPP/chamberPressureDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: chamberPressureDefault
      schema:name:
        const: Chamber Pressure
      ada:dataType:
        const: number
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  imagePixelSizeDefault:
    title: Image Pixel Size
    description: Physical size of each image pixel at the sample surface, in nm or µm. Defines spatial sampling
      of SE or BSE images. For large-area mosaic imaging, report the pixel size of individual tiles and
      the number and arrangement of tiles.
    type: object
    properties:
      '@id':
        const: ada:parameter/semImagingTAPP/imagePixelSizeDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: imagePixelSizeDefault
      schema:name:
        const: Image Pixel Size
      ada:dataType:
        const: number
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  frameTimeDefault:
    title: EBSD Frame Time
    description: Acquisition time per EBSD diffraction pattern frame in milliseconds. Longer frame time
      improves pattern quality and indexing rate but increases total acquisition time.
    type: object
    properties:
      '@id':
        const: ada:parameter/semImagingTAPP/frameTimeDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: frameTimeDefault
      schema:name:
        const: EBSD Frame Time
      ada:dataType:
        const: number
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:unitText:
        const: ms
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - ada:fieldScope
  patternQualityThresholdDefault:
    title: EBSD Pattern Quality Threshold
    description: Minimum pattern quality or confidence index threshold applied during EBSD data processing
      to exclude unreliably indexed points from orientation maps. Include metric name and threshold value.
    type: object
    properties:
      '@id':
        const: ada:parameter/semImagingTAPP/patternQualityThresholdDefault
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: patternQualityThresholdDefault
      schema:name:
        const: EBSD Pattern Quality Threshold
      ada:dataType:
        const: string
      ada:fieldScope:
        const: session
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
