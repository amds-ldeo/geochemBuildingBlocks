$schema: https://json-schema.org/draft/2020-12/schema
title: Solution Q-ICP-MS Analysis Detail
description: Dataset-level analysis-instance detail for solution Q-ICP-MS, reusing CDIF/schema.org slots
  on the schema:Dataset root.
allOf:
- $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/AnalysisIdentification
- $ref: ../../../../BaseSchema/modules/aggregation/schema.yaml#/$defs/AnalysisIdentification
- type: object
  properties:
    prov:wasGeneratedBy:
      type: array
      items:
        type: object
        properties:
          schema:object:
            type: array
            items:
              type: object
              allOf:
              - if:
                  properties:
                    '@type':
                      contains:
                        const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                  required:
                  - '@type'
                then:
                  properties:
                    schema:description:
                      description: Brief description of sample provenance, form, or preparation state
                        relevant to this analysis.
                      anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    schema:additionalProperty:
                      type: array
                      items: &id001
                        title: Sample Aliquot Mass or Volume
                        description: Mass (mg) of solid material digested or volume (mL) of liquid taken
                          for dissolution. Used for yield calculations and concentration back-calculation.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/solutionQicpmsTAPP/sampleAliquotMassOrVolume
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                            - '@id': ada:parameter/solutionQicpmsTAPP/sampleAliquotMassOrVolume
                          schema:name:
                            const: Sample Aliquot Mass or Volume
                          schema:value:
                            anyOf:
                            - type: number
                            - type: string
                          schema:unitText:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        - schema:unitText
                      allOf:
                      - contains: *id001
                        minContains: 0
                        maxContains: 1
            allOf:
            - contains:
                properties:
                  '@type':
                    contains:
                      const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                required:
                - '@type'
          schema:actionProcess:
            type: object
            properties:
              schema:step:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:name:
                          const: Sample digestion
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items:
                            anyOf:
                            - &id002
                              title: Digestion Temperature
                              description: Temperature at which acid digestion was carried out (°C). Procedure
                                specifies the target temperature.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/solutionQicpmsTAPP/digestionTemperature
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/solutionQicpmsTAPP/digestionTemperature
                                schema:name:
                                  const: Digestion Temperature
                                schema:value:
                                  anyOf:
                                  - type: number
                                  - type: string
                                schema:unitText:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                              - schema:unitText
                            - &id003
                              title: Digestion Duration
                              description: Duration of the primary acid digestion step (hours or days).
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/solutionQicpmsTAPP/digestionDuration
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/solutionQicpmsTAPP/digestionDuration
                                schema:name:
                                  const: Digestion Duration
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                          allOf:
                          - contains: *id002
                            minContains: 0
                            maxContains: 1
                          - contains: *id003
                            minContains: 0
                            maxContains: 1
                  - if:
                      properties:
                        schema:name:
                          const: Data reduction
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items:
                            anyOf:
                            - &id004
                              title: Spike / Outlier Filtering Approach
                              description: Criteria used to identify and exclude anomalous replicate measurements
                                or data points from the calculated mean.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/solutionQicpmsTAPP/spikeOutlierFilteringApproach
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/solutionQicpmsTAPP/spikeOutlierFilteringApproach
                                schema:name:
                                  const: Spike / Outlier Filtering Approach
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            - &id005
                              title: Pulse/Analog Detector Nonlinearity Correction
                              description: Whether a correction was applied for nonlinear detector response
                                at the transition between pulse-counting and analog detection modes. For
                                Q-ICP-MS instruments with dual-mode SEM detectors, a cross-calibration
                                factor is measured and applied at the pulse-to-analog crossover threshold.
                                Accurate cross-calibration is critical for analytes spanning a wide concentration
                                range in the same session.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/solutionQicpmsTAPP/pulseAnalogDetectorNonlinearityCorrection
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/solutionQicpmsTAPP/pulseAnalogDetectorNonlinearityCorrection
                                schema:name:
                                  const: Pulse/Analog Detector Nonlinearity Correction
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            - &id006
                              title: Uncertainty Propagation Method
                              description: 'The approach used to propagate analytical uncertainty through
                                the data reduction chain to the final reported value. State which sources
                                are included in the propagation: counting statistics, calibration standard
                                uncertainty, internal standard uncertainty, drift correction, and any
                                systematic contributions. Distinct from Uncertainty Level, which states
                                the convention at which the resulting uncertainty is quoted.'
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/solutionQicpmsTAPP/uncertaintyPropagationMethod
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/solutionQicpmsTAPP/uncertaintyPropagationMethod
                                schema:name:
                                  const: Uncertainty Propagation Method
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            - &id007
                              title: Normalization / Standards-Based Correction
                              description: Post-acquisition normalization applied to output concentrations
                                relative to a reference value (e.g., correction to a monitor element's
                                certified value in the calibration standard).
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/solutionQicpmsTAPP/normalizationStandardsBasedCorrection
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/solutionQicpmsTAPP/normalizationStandardsBasedCorrection
                                schema:name:
                                  const: Normalization / Standards-Based Correction
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            - &id008
                              title: Constants and Reference Values Used
                              description: Physical constants and reference values used in data reduction
                                to calculate the final reported quantity (e.g., decay constants for age
                                calculation, standard isotope ratios, or other citable reference values
                                used in a correction or calculation), together with their source. Distinct
                                from the Group 6 reference-material fields, which document accepted values
                                for specific calibration/validation materials rather than universal physical
                                constants. Record "None" if no citable, revisable physical constants feed
                                into this procedure's data reduction.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/solutionQicpmsTAPP/constantsAndReferenceValuesUsed
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/solutionQicpmsTAPP/constantsAndReferenceValuesUsed
                                schema:name:
                                  const: Constants and Reference Values Used
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                          allOf:
                          - contains: *id004
                            minContains: 0
                            maxContains: 1
                          - contains: *id005
                            minContains: 0
                            maxContains: 1
                          - contains: *id006
                            minContains: 0
                            maxContains: 1
                          - contains: *id007
                            minContains: 0
                            maxContains: 1
                          - contains: *id008
                            minContains: 0
                            maxContains: 1
                allOf:
                - contains:
                    properties:
                      schema:name:
                        const: Sample digestion
                    required:
                    - schema:name
                - contains:
                    properties:
                      schema:name:
                        const: Data reduction
                    required:
                    - schema:name
          prov:used:
            type: array
            items:
              type: object
              allOf:
              - if:
                  required:
                  - schema:instrument
                then:
                  properties:
                    schema:instrument:
                      type: array
                      items:
                        allOf:
                        - $ref: ../../../../BaseSchema/instrument/schema.yaml
                        - type: object
                          allOf:
                          - if:
                              properties:
                                schema:additionalType:
                                  contains:
                                    const: ICPMS
                              required:
                              - schema:additionalType
                            then:
                              properties:
                                schema:identifier:
                                  description: Serial number or laboratory-internal identifier for the
                                    specific instrument unit. Supports traceability to instrument service
                                    records.
                                  anyOf:
                                  - type: string
                                  - type: array
                                    items:
                                      type: string
                                schema:hasPart:
                                  type: array
                                  items:
                                    type: object
                                    allOf:
                                    - if:
                                        properties:
                                          schema:additionalType:
                                            contains:
                                              const: Torch
                                        required:
                                        - schema:additionalType
                                      then:
                                        properties:
                                          schema:additionalProperty:
                                            type: array
                                            items: &id009
                                              title: Torch Depth
                                              description: Distance between the load coil and the sampling
                                                cone tip (mm), also called injector depth or torch position
                                                depending on the instrument manufacturer. Affects ion
                                                transmission efficiency, oxide formation, and doubly-charged
                                                species production. The procedure specifies a target value
                                                optimised during initial setup; the analyst confirms or
                                                fine-adjusts during session tuning.
                                              type: object
                                              properties:
                                                '@id':
                                                  const: ada:parameter/solutionQicpmsTAPP/torchDepth
                                                '@type':
                                                  const:
                                                  - schema:PropertyValue
                                                schema:propertyID:
                                                  const:
                                                  - '@id': ada:parameter/solutionQicpmsTAPP/torchDepth
                                                schema:name:
                                                  const: Torch Depth
                                                schema:value:
                                                  type: string
                                              required:
                                              - '@id'
                                              - '@type'
                                              - schema:propertyID
                                              - schema:name
                                              - schema:value
                                            allOf:
                                            - contains: *id009
                                              minContains: 0
                                              maxContains: 1
                                    - if:
                                        properties:
                                          schema:additionalType:
                                            contains:
                                              const: Sample Introduction System
                                        required:
                                        - schema:additionalType
                                      then:
                                        properties:
                                          schema:additionalProperty:
                                            type: array
                                            items:
                                              anyOf:
                                              - &id010
                                                title: Sample Uptake Rate
                                                description: Peristaltic pump speed or self-aspiration
                                                  flow rate for sample introduction (µL/min or mL/min).
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/solutionQicpmsTAPP/sampleUptakeRate
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/solutionQicpmsTAPP/sampleUptakeRate
                                                  schema:name:
                                                    const: Sample Uptake Rate
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                              - &id011
                                                title: Nebulizer Gas Flow Rate
                                                description: Flow rate of the carrier argon gas delivered
                                                  through the nebulizer (L/min). Controls aerosol transport
                                                  and strongly influences signal sensitivity and stability.
                                                  Adjusted daily to optimize signal.
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/solutionQicpmsTAPP/nebulizerGasFlowRate
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/solutionQicpmsTAPP/nebulizerGasFlowRate
                                                  schema:name:
                                                    const: Nebulizer Gas Flow Rate
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                              - &id012
                                                title: Make-up Gas and Flow Rate
                                                description: Supplementary gas added to the sample-carrying
                                                  stream between the sample introduction system and the
                                                  plasma, with its identity and the procedure-registered
                                                  target flow rate. Argon make-up is standard and maintains
                                                  total gas delivery where the carrier flow alone is insufficient
                                                  — downstream of an ablation cell, or of a desolvation
                                                  system that has removed solvent load. Small nitrogen
                                                  or hydrogen additions are also made here to enhance
                                                  sensitivity for some elements; record them with their
                                                  own flow, whose unit commonly differs from the make-up
                                                  flow. Record 'None' explicitly where no supplementary
                                                  gas is added, to distinguish it from not reported.
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/solutionQicpmsTAPP/makeUpGasAndFlowRate
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/solutionQicpmsTAPP/makeUpGasAndFlowRate
                                                  schema:name:
                                                    const: Make-up Gas and Flow Rate
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                            allOf:
                                            - contains: *id010
                                              minContains: 0
                                              maxContains: 1
                                            - contains: *id011
                                              minContains: 0
                                              maxContains: 1
                                            - contains: *id012
                                              minContains: 0
                                              maxContains: 1
                                    - if:
                                        properties:
                                          schema:additionalType:
                                            contains:
                                              const: ICP Source
                                        required:
                                        - schema:additionalType
                                      then:
                                        properties:
                                          schema:additionalProperty:
                                            type: array
                                            items:
                                              anyOf:
                                              - &id013
                                                title: RF Power
                                                description: Radiofrequency forward power applied to the
                                                  plasma (W). Controls ionization efficiency and oxide
                                                  production rates.
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/solutionQicpmsTAPP/rfPower
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/solutionQicpmsTAPP/rfPower
                                                  schema:name:
                                                    const: RF Power
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                              - &id014
                                                title: Coolant (Plasma) Gas Flow Rate
                                                description: Flow rate of the outer (coolant) argon gas
                                                  stream (L/min). Influences plasma temperature and oxide
                                                  ion formation.
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/solutionQicpmsTAPP/coolantGasFlowRate
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/solutionQicpmsTAPP/coolantGasFlowRate
                                                  schema:name:
                                                    const: Coolant (Plasma) Gas Flow Rate
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                              - &id015
                                                title: Auxiliary Gas Flow Rate
                                                description: Flow rate of the intermediate (auxiliary)
                                                  argon gas stream between torch body and injector tube
                                                  (L/min).
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/solutionQicpmsTAPP/auxiliaryGasFlowRate
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/solutionQicpmsTAPP/auxiliaryGasFlowRate
                                                  schema:name:
                                                    const: Auxiliary Gas Flow Rate
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                            allOf:
                                            - contains: *id013
                                              minContains: 0
                                              maxContains: 1
                                            - contains: *id014
                                              minContains: 0
                                              maxContains: 1
                                            - contains: *id015
                                              minContains: 0
                                              maxContains: 1
                                    - if:
                                        properties:
                                          schema:additionalType:
                                            contains:
                                              const: Collision Reaction Cell
                                        required:
                                        - schema:additionalType
                                      then:
                                        properties:
                                          schema:additionalProperty:
                                            type: array
                                            items:
                                              anyOf:
                                              - &id016
                                                title: Collision Gas Flow Rate
                                                description: Flow rate of the collision gas in KED mode
                                                  (mL/min). Higher flow rates provide greater interference
                                                  suppression at the cost of analyte sensitivity. Record
                                                  'N/A' if KED mode is not used. Record 'N/A' where Collision/Reaction
                                                  Cell (CRC) Configuration does not include KED.
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/solutionQicpmsTAPP/collisionGasFlowRate
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/solutionQicpmsTAPP/collisionGasFlowRate
                                                  schema:name:
                                                    const: Collision Gas Flow Rate
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                              - &id017
                                                title: Cell Exit Discrimination Voltage
                                                description: Kinetic energy discrimination offset voltage
                                                  applied at the exit of the collision cell (V). Controls
                                                  the degree of polyatomic ion suppression. Record 'N/A'
                                                  if KED mode is not used. Record 'N/A' where Collision/Reaction
                                                  Cell (CRC) Configuration does not include KED.
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/solutionQicpmsTAPP/cellExitDiscriminationVoltage
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/solutionQicpmsTAPP/cellExitDiscriminationVoltage
                                                  schema:name:
                                                    const: Cell Exit Discrimination Voltage
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                              - &id018
                                                title: Reaction Gas Flow Rate
                                                description: Flow rate of the reaction gas in DRC mode
                                                  (mL/min). Record 'N/A' if DRC mode is not used. Record
                                                  'N/A' where Collision/Reaction Cell (CRC) Configuration
                                                  does not include DRC.
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/solutionQicpmsTAPP/reactionGasFlowRate
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/solutionQicpmsTAPP/reactionGasFlowRate
                                                  schema:name:
                                                    const: Reaction Gas Flow Rate
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                            allOf:
                                            - contains: *id016
                                              minContains: 0
                                              maxContains: 1
                                            - contains: *id017
                                              minContains: 0
                                              maxContains: 1
                                            - contains: *id018
                                              minContains: 0
                                              maxContains: 1
                                  allOf:
                                  - contains:
                                      properties:
                                        schema:additionalType:
                                          contains:
                                            const: Sample Introduction System
                                      required:
                                      - schema:additionalType
                                  - contains:
                                      properties:
                                        schema:additionalType:
                                          contains:
                                            const: ICP Source
                                      required:
                                      - schema:additionalType
                                  - contains:
                                      properties:
                                        schema:additionalType:
                                          contains:
                                            const: Collision Reaction Cell
                                      required:
                                      - schema:additionalType
                                schema:additionalProperty:
                                  type: array
                                  items:
                                    anyOf:
                                    - &id019
                                      title: Doubly-Charged Species Monitor
                                      description: Mass ratio monitored to estimate doubly-charged ion
                                        (M2+) formation during instrument tuning. Doubly-charged ions
                                        appear at half the nominal mass of the parent ion and can interfere
                                        with lighter analyte masses. Ba2+/Ba+ (m/z 69/138) and Ce2+/Ce+
                                        (m/z 70/140) are the most common proxies for solution ICP-MS.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/solutionQicpmsTAPP/doublyChargedSpeciesMonitor
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/solutionQicpmsTAPP/doublyChargedSpeciesMonitor
                                        schema:name:
                                          const: Doubly-Charged Species Monitor
                                        schema:value:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                    - &id020
                                      title: Doubly-Charged Species Production
                                      description: Measured percentage of doubly-charged ion production
                                        for the monitored species at the time of instrument tuning. Record
                                        both the acceptance threshold and the measured value. Elevated
                                        doubly-charged production indicates incomplete ionization and
                                        potential interference on elements at approximately half the mass
                                        of abundant matrix components.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/solutionQicpmsTAPP/doublyChargedSpeciesProduction
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/solutionQicpmsTAPP/doublyChargedSpeciesProduction
                                        schema:name:
                                          const: Doubly-Charged Species Production
                                        schema:value:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                    - &id021
                                      title: Memory Effect Mitigation
                                      description: Procedure applied to identify and minimize carry-over
                                        of high-concentration elements between successive sample introductions.
                                        For solution ICP-MS, mitigation is implemented primarily at measurement
                                        time through extended rinse periods (see Wash Time Between Samples,
                                        Group 4). At data processing level, documents any flagging or
                                        exclusion of measurements preceded by high-concentration samples
                                        or standards where the required washout time may not have been
                                        achieved.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/solutionQicpmsTAPP/memoryEffectMitigation
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/solutionQicpmsTAPP/memoryEffectMitigation
                                        schema:name:
                                          const: Memory Effect Mitigation
                                        schema:value:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                  allOf:
                                  - contains: *id019
                                    minContains: 0
                                    maxContains: 1
                                  - contains: *id020
                                    minContains: 0
                                    maxContains: 1
                                  - contains: *id021
                                    minContains: 0
                                    maxContains: 1
                      allOf:
                      - contains:
                          properties:
                            schema:additionalType:
                              contains:
                                const: ICPMS
                          required:
                          - schema:additionalType
              - if:
                  required:
                  - prov:reagent
                then:
                  properties:
                    prov:reagent:
                      type: array
                      items:
                        allOf:
                        - $ref: ../../../../BaseSchema/geochemProduct/schema.yaml#/$defs/UsedReagent
                        - type: object
                          allOf:
                          - if:
                              properties:
                                ada:reagentRole:
                                  const: primaryStandard
                              required:
                              - ada:reagentRole
                            then:
                              properties:
                                schema:name:
                                  description: Name and reference material identifier of the external
                                    calibration standard used to convert signal intensities to elemental
                                    concentrations. Include the material name, its source or supplier,
                                    and a citation for the accepted values used, since results calibrated
                                    against different published values for the same material are not directly
                                    comparable.
                                  anyOf:
                                  - type: string
                                  - type: array
                                    items:
                                      type: string
                          - if:
                              properties:
                                ada:reagentRole:
                                  const: referenceMaterial
                              required:
                              - ada:reagentRole
                            then:
                              properties:
                                schema:name:
                                  description: Reference material(s) measured as unknowns to independently
                                    assess analytical accuracy. Specify material name and expected-value
                                    source.
                                  anyOf:
                                  - type: string
                                  - type: array
                                    items:
                                      type: string
                          required:
                          - ada:reagentRole
          schema:additionalProperty:
            type: array
            items:
              anyOf:
              - &id022
                title: Signal Integration Time
                description: Total integration time per analyte per replicate (s). Determined at analysis
                  time from the actual acquisition.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/solutionQicpmsTAPP/signalIntegrationTime
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/solutionQicpmsTAPP/signalIntegrationTime
                  schema:name:
                    const: Signal Integration Time
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id023
                title: Procedural Blank Level
                description: 'The measured level of the analytical blank in the session, and — where the
                  reported quantity is a ratio — its composition, since a blank subtracted from a ratio
                  biases the result unless its own composition is known. Companion to the blank correction
                  method, which is procedure-level: this field records what was actually measured. Follows
                  the criterion-versus-measurement split the library applies wherever a procedure sets
                  a threshold and an analysis reports a value against it.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/solutionQicpmsTAPP/proceduralBlankLevel
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/solutionQicpmsTAPP/proceduralBlankLevel
                  schema:name:
                    const: Procedural Blank Level
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
            allOf:
            - contains: *id022
              minContains: 0
              maxContains: 1
            - contains: *id023
              minContains: 0
              maxContains: 1
    dqv:hasQualityMeasurement:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              dqv:isMeasurementOf:
                const: Oxide production ratio
            required:
            - dqv:isMeasurementOf
          then:
            properties:
              dqv:value:
                description: Measured oxide production ratio obtained during session-start tuning, for
                  the proxy specified in Oxide Production Method and Threshold. Record the measured value
                  and confirm whether the procedure threshold was met.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
      allOf:
      - contains:
          properties:
            dqv:isMeasurementOf:
              const: Oxide production ratio
          required:
          - dqv:isMeasurementOf
