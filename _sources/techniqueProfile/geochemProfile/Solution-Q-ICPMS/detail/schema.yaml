          ada:proceduralBlankLevel:
            description: 'The measured level of the analytical blank in the session, and — where the reported
              quantity is a ratio — its composition, since a blank subtracted from a ratio biases the
              result unless its own composition is known. Companion to the blank correction method, which
              is procedure-level: this field records what was actually measured. Follows the criterion-versus-measurement
              split the library applies wherever a procedure sets a threshold and an analysis reports
              a value against it.'
            type: string
