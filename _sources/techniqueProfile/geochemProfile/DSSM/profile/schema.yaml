$schema: https://json-schema.org/draft/2020-12/schema
title: ADA Direct Shear Strength Product Profile
description: Path-driven technique-specific profile for ADA Direct Shear Strength Product Profile. Extends the base ADA product profile with the DSSM analysis-instance detail on the schema:Dataset root, and pins the product type and the profile it declares conformance to.
allOf:
- $ref: ../../../../BaseSchema/geochemProduct/schema.yaml
- $ref: ../detail/schema.yaml
- type: object
  properties:
    schema:additionalType:
      description: Must include a DSSM product type identifier.
      contains:
        enum:
        - Direct Shear Strength Measurement
        - Direct Shear Strength Measurement (DSSM)
      title: Product Type
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaDSSM
      title: About This Record
