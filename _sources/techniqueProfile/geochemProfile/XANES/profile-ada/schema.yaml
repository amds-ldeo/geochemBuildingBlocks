$schema: https://json-schema.org/draft/2020-12/schema
title: ADA XANES Product Profile (TAPP-linked)
description: >-
  Profile for an ADA metadata document describing data generated under a registered xanesTAPP
  procedure. Extends the base ADA product profile with the XANES analysis-instance detail on the
  schema:Dataset root, pins prov:used to the xanesTAPP definition and the instrument building block,
  and constrains valid XANES component types on both the monolithic and bundle forms of
  schema:distribution. Distinct from adaProfile/XANES, which is the generic (adaProduct-only) XANES
  profile and carries no TAPP linkage - a record conforming here additionally asserts which
  registered procedure produced it. DRAFT - the xanesTAPP source table has not been through
  Phase 0 review.
allOf:
  - $ref: ../../../../BaseSchema/adaProduct/schema.yaml
  # The XANES detail is a schema:Dataset overlay (it carries prov:wasGeneratedBy and
  # schema:additionalProperty, and no ada:componentType), so it composes here at the top level,
  # beside the product base - not as a hasPart anyOf branch.
  - $ref: ../detail/schema.yaml
  - type: object
    properties:
      prov:wasGeneratedBy:
        description: >-
          Pin the xanesTAPP definition and the instrument where prov:used carries them.
          Constraint-only if/then, never a narrowed anyOf: prov:used items are role-keyed
          wrappers, and an anyOf here would allOf-merge with the base union and exclude item
          shapes the base allows.
        type: array
        items:
          type: object
          properties:
            prov:used:
              type: array
              items:
                allOf:
                  - if:
                      type: object
                      required:
                        - schema:instrument
                    then:
                      properties:
                        schema:instrument:
                          type: array
                          minItems: 1
                          items:
                            $ref: ../../../../BaseSchema/instrument/schema.yaml
                  - if:
                      type: object
                      properties:
                        '@type':
                          contains:
                            const: ada:TAPPDefinition
                      required:
                        - '@type'
                    then:
                      $ref: ../tapp/schema.yaml
      schema:additionalType:
        description: Must include a XANES product type identifier.
        contains:
          enum:
            - X-ray Absorption Near Edge Structure Hyperspectral Image Stack (XANES)
            - X-ray absorption near edge structure (XANES) spectroscopy
      schema:distribution:
        description: >-
          Each distribution item is EITHER a monolithic single-file dataset whose
          ada:componentType is a XANES-specific or universal value (and may carry
          cdi:isStructuredBy), OR a bundle whose schema:hasPart members each carry such a
          componentType (the ADA/SAMIS archive form).
        type: array
        items:
          anyOf:
            - type: object
              required:
                - ada:componentType
              properties:
                ada:componentType:
                  type: string
                  anyOf:
                    - $ref: ../../../../BaseSchema/adaProduct/schema.yaml#/$defs/universalComponentType
                    - enum: &xanesComponentTypes
                        - ada:XANESCollection
                        - ada:XANESImageStack
                        - ada:XANESProcessedTabular
                        - ada:XANESRawTabular
                        - ada:XANESStackOverviewImage
                        - ada:XANESimage
            - type: object
              required:
                - schema:hasPart
              properties:
                schema:hasPart:
                  items:
                    type: object
                    anyOf:
                      - $ref: ../../../../BaseSchema/adaProduct/schema.yaml#/$defs/universalComponentTypeBranch
                      - properties:
                          ada:componentType:
                            type: string
                            enum: *xanesComponentTypes
                        required:
                          - ada:componentType
      schema:subjectOf:
        properties:
          dcterms:conformsTo:
            contains:
              type: object
              required: ['@id']
              additionalProperties: false
              properties:
                '@id':
                  const: 'https://w3id.org/geochem/metadata/profiles/adaXANESFull'
