$schema: https://json-schema.org/draft/2020-12/schema
title: EPMA/EPMA Analysis Detail
description: Dataset-level analysis-instance detail for EPMA/EPMA, reusing CDIF/schema.org slots on the
  schema:Dataset root.
allOf:
- $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/AnalysisIdentification
- $ref: ../../../../BaseSchema/modules/calibrationFactor/schema.yaml#/$defs/AnalysisIdentification
- $ref: ../../../../BaseSchema/modules/aggregation/schema.yaml#/$defs/AnalysisIdentification
- $ref: ../../../../BaseSchema/modules/compositionQC/schema.yaml#/$defs/AnalysisIdentification
- type: object
  properties:
    prov:wasGeneratedBy:
      type: array
      items:
        type: object
        properties:
          prov:used:
            type: array
            items:
              type: object
              allOf:
              - if:
                  required:
                  - schema:instrument
                then:
                  properties:
                    schema:instrument:
                      type: array
                      items:
                        allOf:
                        - $ref: ../../../../BaseSchema/instrument/schema.yaml
                        - type: object
                          allOf:
                          - if:
                              properties:
                                schema:additionalType:
                                  contains:
                                    const: EPMA
                                  schema:inDefinedTermSet: ada:vocab/instrumentType
                              required:
                              - schema:additionalType
                            then:
                              properties:
                                schema:additionalProperty:
                                  type: array
                                  items:
                                    anyOf:
                                    - &id001
                                      title: Accelerating Voltage
                                      description: Electron beam accelerating voltage in kilovolts (kV).
                                        Justify any deviation from the standard operating voltage.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/epmaTAPP/acceleratingVoltage
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/epmaTAPP/acceleratingVoltage
                                        schema:name:
                                          const: Accelerating Voltage
                                        schema:value:
                                          anyOf:
                                          - type: number
                                          - type: string
                                        schema:unitText:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                      - schema:unitText
                                    - &id002
                                      title: Beam Diameter
                                      description: Diameter of the electron beam in micrometers. 0 indicates
                                        a fully focused beam. Document defocused diameter when used to
                                        minimize beam damage or improve spatial averaging for beam-sensitive
                                        phases.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/epmaTAPP/beamDiameter
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/epmaTAPP/beamDiameter
                                        schema:name:
                                          const: Beam Diameter
                                        schema:value:
                                          anyOf:
                                          - type: number
                                          - type: string
                                        schema:unitText:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                      - schema:unitText
                                    - &id003
                                      title: Mapping Beam Current
                                      description: Probe current in nanoamperes (nA) used during X-ray
                                        mapping.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/epmaTAPP/mappingBeamCurrent
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/epmaTAPP/mappingBeamCurrent
                                        schema:name:
                                          const: Mapping Beam Current
                                        schema:value:
                                          anyOf:
                                          - type: number
                                          - type: string
                                        schema:unitText:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                      - schema:unitText
                                    - &id004
                                      title: Mapping Beam Diameter
                                      description: Diameter of the electron beam in micrometres during
                                        X-ray mapping. 0 indicates a fully focused beam.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/epmaTAPP/mappingBeamDiameter
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/epmaTAPP/mappingBeamDiameter
                                        schema:name:
                                          const: Mapping Beam Diameter
                                        schema:value:
                                          anyOf:
                                          - type: number
                                          - type: string
                                        schema:unitText:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                      - schema:unitText
                                  allOf:
                                  - contains: *id001
                                    minContains: 0
                                    maxContains: 1
                                  - contains: *id002
                                    minContains: 0
                                    maxContains: 1
                                  - contains: *id003
                                    minContains: 0
                                    maxContains: 1
                                  - contains: *id004
                                    minContains: 0
                                    maxContains: 1
                      allOf:
                      - contains:
                          properties:
                            schema:additionalType:
                              contains:
                                const: EPMA
                              schema:inDefinedTermSet: ada:vocab/instrumentType
                          required:
                          - schema:additionalType
          schema:additionalProperty:
            type: array
            items:
              anyOf:
              - &id005
                title: Beam Damage Minimization
                description: Measures taken to minimize beam damage, particularly volatilization or migration
                  of Na, K, F, and Cl in hydrous minerals, glasses, feldspars, phosphates, and carbonates.
                  Document approach, beam conditions used, and phases for which it was applied.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/epmaTAPP/beamDamageMinimization
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/epmaTAPP/beamDamageMinimization
                  schema:name:
                    const: Beam Damage Minimization
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id006
                title: Beam Raster Dimensions
                description: Dimensions of the small area over which the beam is rastered at a single
                  analysis point, reported as width × height in µm. Applicable when Beam Mode = Rastered;
                  defines the effective spatial footprint of the measurement. Not applicable when mapping.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/epmaTAPP/beamRasterDimensions
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/epmaTAPP/beamRasterDimensions
                  schema:name:
                    const: Beam Raster Dimensions
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id007
                title: Drift Correction
                description: Method used to monitor and correct for instrument drift (beam current drift,
                  spectrometer drift) during the analytical session.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/epmaTAPP/driftCorrection
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/epmaTAPP/driftCorrection
                  schema:name:
                    const: Drift Correction
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id008
                title: EDS Live Time per Point or Pixel
                description: EDS spectral acquisition live time per analysis point in seconds. Previously
                  referred to as "EDS Acquisition Time" in this TAPP and commonly used under that name
                  in EPMA and SEM-EDS contexts. Renamed to align with TEM-EDS usage, where the per-point
                  vs. per-pixel distinction (point/line mode vs. spectrum image) is explicit. In EPMA,
                  acquisition is always per point.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/epmaTAPP/edsLiveTimePerPointOrPixel
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/epmaTAPP/edsLiveTimePerPointOrPixel
                  schema:name:
                    const: EDS Live Time per Point or Pixel
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id009
                title: Halogen Correction on Oxygen
                description: Whether oxygen content was adjusted to account for halogen substitution (F
                  and/or Cl replacing OH) in halogen-bearing phases such as apatite, amphibole, and mica,
                  where oxygen is calculated by stoichiometry.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/epmaTAPP/halogenCorrectionOnOxygen
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/epmaTAPP/halogenCorrectionOnOxygen
                  schema:name:
                    const: Halogen Correction on Oxygen
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id010
                title: Step Size / Pixel Size
                description: Distance between adjacent measurement points in the X-ray map in micrometers,
                  defining the spatial resolution. Report both X and Y step if they differ.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/epmaTAPP/stepSizePixelSize
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/epmaTAPP/stepSizePixelSize
                  schema:name:
                    const: Step Size / Pixel Size
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Analysis_samplingUnitSelectionCriteria
            allOf:
            - contains: *id005
              minContains: 0
              maxContains: 1
            - contains: *id006
              minContains: 0
              maxContains: 1
            - contains: *id007
              minContains: 0
              maxContains: 1
            - contains: *id008
              minContains: 0
              maxContains: 1
            - contains: *id009
              minContains: 0
              maxContains: 1
            - contains: *id010
              minContains: 0
              maxContains: 1
            - contains:
                $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Analysis_samplingUnitSelectionCriteria
              minContains: 0
              maxContains: 1
          schema:object:
            type: array
            items:
              type: object
              allOf:
              - if:
                  properties:
                    '@type':
                      contains:
                        const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                  required:
                  - '@type'
                then:
                  properties:
                    schema:additionalProperty:
                      type: array
                      items:
                        $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Analysis_preAnalysisImagingAndScreening
                      allOf:
                      - contains:
                          $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Analysis_preAnalysisImagingAndScreening
                        minContains: 0
                        maxContains: 1
          ada:deadTime:
            description: Percent dead time reported by the EDS detector during the session — the fraction
              of total acquisition time the detector spent processing rather than counting. This field
              documents the resulting percentage as a session QC metric. Unlike WDS dead time (see WDS
              Dead Time Correction), no user-selectable correction algorithm is required.
            anyOf:
            - type: number
            - type: string
          ada:proceduralBlankLevel:
            description: The measured level of the analytical blank in the session, and — where the reported
              quantity is a ratio — its composition, since a blank subtracted from a ratio biases the
              result unless its own composition is known. Companion to the blank correction method.
            type: string
          schema:actionProcess:
            type: object
            properties:
              schema:step:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:name:
                          const: Data reduction
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items:
                            $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/Param_Analysis_constantsReferenceValues
                          allOf:
                          - contains:
                              $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/Param_Analysis_constantsReferenceValues
                            minContains: 0
                            maxContains: 1
                allOf:
                - contains:
                    properties:
                      schema:name:
                        const: Data reduction
                    required:
                    - schema:name
        required:
        - ada:deadTime
        - ada:proceduralBlankLevel
        - schema:actionProcess
    schema:additionalProperty:
      type: array
      items:
        anyOf:
        - &id011
          title: Map Area
          description: Physical extent of the mapped region, given either as width × height in µm or as
            a total area in µm² or mm², and equal to (map width in pixels × step size) × (map height in
            pixels × step size). Complements the map's pixel-grid dimensions by recording the physical
            scale of the mapped region.
          type: object
          properties:
            '@id':
              const: ada:parameter/epmaTAPP/mapArea
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/epmaTAPP/mapArea
            schema:name:
              const: Map Area
            schema:value:
              anyOf:
              - type: number
              - type: string
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          - schema:unitText
        - &id012
          title: Map Dimensions
          description: Number of pixels in the X-ray map in the X and Y directions. Based on the area
            of interest and selected step size.
          type: object
          properties:
            '@id':
              const: ada:parameter/epmaTAPP/mapDimensions
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/epmaTAPP/mapDimensions
            schema:name:
              const: Map Dimensions
            schema:value:
              anyOf:
              - type: number
              - type: string
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          - schema:unitText
      allOf:
      - contains: *id011
        minContains: 0
        maxContains: 1
      - contains: *id012
        minContains: 0
        maxContains: 1
    schema:variableMeasured:
      type: array
      items:
        anyOf:
        - title: Dataset variable
          description: A measured variable of this dataset that is not one of the procedure's declared
            reported properties. schema:variableMeasured carries the dataset's actual variables; the reported-property
            branches above are permitted members of it, not the whole of it.
          type: object
          required:
          - '@type'
          properties:
            '@type':
              type: array
              contains:
                enum:
                - cdi:InstanceVariable
                - schema:PropertyValue
        - &id013
          title: Target Material of Sampling Unit
          description: The entry in Target Material that the sampling unit belongs to, which links the
            unit to the point-analysis conditions registered for that material.
          type: object
          properties:
            '@id':
              const: ada:parameter/epmaTAPP/targetMaterialOfSamplingUnit
            '@type':
              const:
              - schema:PropertyValue
              - cdi:InstanceVariable
            schema:propertyID:
              const:
              - '@id': ada:parameter/epmaTAPP/targetMaterialOfSamplingUnit
            schema:name:
              const: Target Material of Sampling Unit
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
      allOf:
      - contains: *id013
        minContains: 0
        maxContains: 1
