$schema: https://json-schema.org/draft/2020-12/schema
title: ADA EPMA Product Profile
description: Technique-specific profile for Electron Microprobe Analysis (EPMA/EPMA) products. Extends the base ADA product profile with constraints on valid EPMA component types. Generic (adaProduct-only) profile; the analysis-instance detail (detailEPMA) and epmaTAPP linkage live on the path-driven geochem empaProfile.
allOf:
  - $ref: ../../../../BaseSchema/adaProduct/schema.yaml
  - type: object
    properties:
      schema:additionalType:
        description: Must include an EPMA product type identifier.
        contains:
          enum:
            - Electron Microprobe Analysis (EPMA) Collection
            - Electron Microprobe Analysis Image (EPMA)
            - Electron Microprobe Analysis Quantitative Elemental Abundances (EPMAQEA)
            - Electron Microprobe Analysis (EPMA)
            - Electron microprobe analysis
      schema:distribution:
        description: Distribution items for adaEPMA. Archive hasPart items must have ada:componentType from technique-specific or universal values.
        type: array
        items:
          type: object
          properties:
            schema:hasPart:
              items:
                type: object
                anyOf:
                  - $ref: ../../../../BaseSchema/adaProduct/schema.yaml#/$defs/universalComponentTypeBranch
                  - properties:
                      ada:componentType:
                        type: string
                        enum:
                          - ada:EPMAImage
                          - ada:EPMAImageMap
                          - ada:EPMAQEATabular
                          - ada:EPMAImageCollection
                          - ada:EPMAESPCTabular
                          - ada:EPMAESPCPlot
                    required:
                      - ada:componentType
      schema:subjectOf:
        properties:
          dcterms:conformsTo:
            contains:
              type: object
              required: ['@id']
              additionalProperties: false
              properties:
                '@id':
                  const: 'https://w3id.org/geochem/metadata/profiles/adaEPMA'
