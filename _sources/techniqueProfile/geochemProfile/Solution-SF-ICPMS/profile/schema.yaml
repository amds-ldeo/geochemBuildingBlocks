$schema: https://json-schema.org/draft/2020-12/schema
title: ADA Solution SF-ICP-MS Product Profile
description: Path-driven technique-specific profile for ADA Solution SF-ICP-MS Product Profile. Extends the base ADA product profile with the SOLUTIONSFICPMS analysis-instance detail on the schema:Dataset root, and pins the product type and the profile it declares conformance to.
allOf:
- $ref: ../../../../BaseSchema/geochemProduct/schema.yaml
- $ref: ../detail/schema.yaml
- type: object
  properties:
    schema:additionalType:
      description: Must include a SOLUTIONSFICPMS product type identifier.
      contains:
        enum:
        - High-resolution Inductively Coupled Plasma Mass Spectroscopy (HRICPMS) Processed
        - High-resolution inductively coupled plasma mass spectrometry
      title: Product Type
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaSolutionSFICPMS
      title: About This Record
