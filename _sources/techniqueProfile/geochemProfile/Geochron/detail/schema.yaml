$schema: https://json-schema.org/draft/2020-12/schema
title: LA-ICP-MS Geochronology Analysis Detail
description: Dataset-level analysis-instance detail for LA-ICP-MS geochronology, reusing CDIF/schema.org
  slots on the schema:Dataset root.
type: object
properties:
  prov:wasGeneratedBy:
    type: array
    items:
      type: object
      properties:
        schema:location:
          type: object
          properties:
            schema:name:
              description: Name of the laboratory or institution hosting the instrument. Standard cross-TAPP
                identity field, distinct from the paper-sourced 'Laboratory name' field above.
              type: string
            schema:identifier:
              description: Persistent identifier for the laboratory, e.g., ROR ID.
              type: string
        schema:startDate:
          description: Date on which the analytical session began. For sessions spanning multiple days,
            use the date of the first session.
          type: string
        schema:endDate:
          description: Date on which the analytical session ended. May equal Analysis Start Date for single-day
            sessions.
          type: string
        schema:additionalProperty:
          type: array
          items:
            anyOf:
            - &id001
              title: Imaging
              description: Pre-ablation characterisation imaging (typically cathodoluminescence [CL] or
                backscattered electron [BSE]) used to reveal internal zoning, inherited cores, and metamict
                domains for selecting valid spot locations, including the imaging instrument and settings
                used.
              type: object
              properties:
                '@id':
                  const: ada:parameter/geochronTAPP/imaging
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                  - '@id': ada:parameter/geochronTAPP/imaging
                schema:name:
                  const: Imaging
                schema:value:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id002
              title: Ablation Pit Depth/Ablation Rate
              description: Depth of the ablation pit produced under the registered laser conditions, the
                method used to measure it, and the resulting per-pulse ablation rate. Characterises the
                achievable depth/time resolution of the procedure.
              type: object
              properties:
                '@id':
                  const: ada:parameter/geochronTAPP/ablationPitDepthAblationRate
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                  - '@id': ada:parameter/geochronTAPP/ablationPitDepthAblationRate
                schema:name:
                  const: Ablation Pit Depth/Ablation Rate
                schema:value:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id003
              title: Make-up Gas Flow (L min⁻¹)
              description: Source and estimated flow rate of any make-up gas added downstream of the ablation
                cell, including any desolvating nebuliser used for tracer co-aspiration.
              type: object
              properties:
                '@id':
                  const: ada:parameter/geochronTAPP/makeUpGasFlow
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                  - '@id': ada:parameter/geochronTAPP/makeUpGasFlow
                schema:name:
                  const: Make-up Gas Flow (L min⁻¹)
                schema:value:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id004
              title: Number of Blocks per Measurement
              description: Number of measurement blocks acquired per spot. Each block typically begins
                with a baseline (on-peak zero) measurement before the analytical cycles. Multiple blocks
                allow inspection of signal stability and within-measurement drift.
              type: object
              properties:
                '@id':
                  const: ada:parameter/geochronTAPP/numberOfBlocksPerMeasurement
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                  - '@id': ada:parameter/geochronTAPP/numberOfBlocksPerMeasurement
                schema:name:
                  const: Number of Blocks per Measurement
                schema:value:
                  anyOf:
                  - type: number
                  - type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id005
              title: Number of Cycles per Block
              description: Number of measurement cycles acquired per block. One cycle corresponds to a
                single set of simultaneous Faraday cup readings integrated for the duration in Integration
                Time per Cycle.
              type: object
              properties:
                '@id':
                  const: ada:parameter/geochronTAPP/numberOfCyclesPerBlock
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                  - '@id': ada:parameter/geochronTAPP/numberOfCyclesPerBlock
                schema:name:
                  const: Number of Cycles per Block
                schema:value:
                  anyOf:
                  - type: number
                  - type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id006
              title: Integration Time per Cycle
              description: Duration of signal integration per measurement cycle. Total integration time
                per spot = (Number of Cycles per Block) × (Integration Time per Cycle) × (Number of Blocks
                per Measurement).
              type: object
              properties:
                '@id':
                  const: ada:parameter/geochronTAPP/integrationTimePerCycle
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                  - '@id': ada:parameter/geochronTAPP/integrationTimePerCycle
                schema:name:
                  const: Integration Time per Cycle
                schema:value:
                  anyOf:
                  - type: number
                  - type: string
                schema:unitText:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
              - schema:unitText
            - &id007
              title: IC Dead Time (ns)
              description: Dead time of each ion-counting detector channel, used in dead-time correction
                of high count rates.
              type: object
              properties:
                '@id':
                  const: ada:parameter/geochronTAPP/icDeadTime
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                  - '@id': ada:parameter/geochronTAPP/icDeadTime
                schema:name:
                  const: IC Dead Time (ns)
                schema:value:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id008
              title: Analysis Sequence
              description: Repeating order of primary calibration standard(s), quality control standard(s),
                and unknown analyses within a measurement session.
              type: object
              properties:
                '@id':
                  const: ada:parameter/geochronTAPP/analysisSequence
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                  - '@id': ada:parameter/geochronTAPP/analysisSequence
                schema:name:
                  const: Analysis Sequence
                schema:value:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id009
              title: Number of Replicates
              description: Number of replicate spot analyses performed on the same grain or nominal location
                in this session.
              type: object
              properties:
                '@id':
                  const: ada:parameter/geochronTAPP/numberOfReplicates
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                  - '@id': ada:parameter/geochronTAPP/numberOfReplicates
                schema:name:
                  const: Number of Replicates
                schema:value:
                  anyOf:
                  - type: number
                  - type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id010
              title: Other Information
              description: Supplementary methodological context not captured by the structured fields
                above, as reported in Table 3 of Horstwood et al. (2016) — in the source paper's own example,
                notes on ablation-cell and sample-line configuration for depth-profiling/single-pulse
                ablation studies, a variant not otherwise in scope for this single-mode (Spot Analysis)
                TAPP.
              type: object
              properties:
                '@id':
                  const: ada:parameter/geochronTAPP/otherInformation
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                  - '@id': ada:parameter/geochronTAPP/otherInformation
                schema:name:
                  const: Other Information
                schema:value:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id011
              title: Uncertainty Level and Propagation
              description: Uncertainty level at which ages/ratios are quoted (e.g., 1σ, 2σ) and the method
                used to propagate component uncertainties (e.g., quadratic addition) into the final reported
                value.
              type: object
              properties:
                '@id':
                  const: ada:parameter/geochronTAPP/uncertaintyLevelAndPropagation
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                  - '@id': ada:parameter/geochronTAPP/uncertaintyLevelAndPropagation
                schema:name:
                  const: Uncertainty Level and Propagation
                schema:value:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id012
              title: Signal Integration Time
              description: Actual integration time used for the ablation signal in this analysis. Determined
                at analysis time by applying the Signal Integration Interval Method to the time-resolved
                signal.
              type: object
              properties:
                '@id':
                  const: ada:parameter/geochronTAPP/signalIntegrationTime
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                  - '@id': ada:parameter/geochronTAPP/signalIntegrationTime
                schema:name:
                  const: Signal Integration Time
                schema:value:
                  anyOf:
                  - type: number
                  - type: string
                schema:unitText:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
              - schema:unitText
            - &id013
              title: Double-Spike Mixing Ratio
              description: Target proportion of double-spike signal relative to total analyte signal in
                the spiked mixture. An optimal mixing ratio minimises error propagation through the double-spike
                inversion. Record 'N/A' if double-spike method is not used.
              type: object
              properties:
                '@id':
                  const: ada:parameter/geochronTAPP/doubleSpikeMixingRatio
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                  - '@id': ada:parameter/geochronTAPP/doubleSpikeMixingRatio
                schema:name:
                  const: Double-Spike Mixing Ratio
                schema:value:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
          allOf:
          - contains: *id001
            minContains: 0
            maxContains: 1
          - contains: *id002
            minContains: 0
            maxContains: 1
          - contains: *id003
            minContains: 0
            maxContains: 1
          - contains: *id004
            minContains: 0
            maxContains: 1
          - contains: *id005
            minContains: 0
            maxContains: 1
          - contains: *id006
            minContains: 0
            maxContains: 1
          - contains: *id007
            minContains: 0
            maxContains: 1
          - contains: *id008
            minContains: 0
            maxContains: 1
          - contains: *id009
            minContains: 0
            maxContains: 1
          - contains: *id010
            minContains: 0
            maxContains: 1
          - contains: *id011
            minContains: 0
            maxContains: 1
          - contains: *id012
            minContains: 0
            maxContains: 1
          - contains: *id013
            minContains: 0
            maxContains: 1
        schema:actionProcess:
          type: object
          properties:
            schema:step:
              type: array
              items:
                type: object
                allOf:
                - if:
                    properties:
                      schema:name:
                        const: samplePreparation
                    required:
                    - schema:name
                  then:
                    properties:
                      schema:description:
                        description: Standard cross-TAPP description of how samples were prepared for
                          analysis (mounting, polishing, coating, etc.).
                        anyOf:
                        - type: string
                        - type: array
                          items:
                            type: string
                      schema:additionalProperty:
                        type: array
                        items: &id014
                          title: Pre-Ablation Surface Treatment
                          description: Procedure applied immediately before each analysis to remove surface
                            contamination or condition the sample surface, distinct from general sample
                            preparation. Pre-ablation pulses are typically discarded before signal acquisition
                            begins.
                          type: object
                          properties:
                            '@id':
                              const: ada:parameter/geochronTAPP/preAblationSurfaceTreatment
                            '@type':
                              const:
                              - schema:PropertyValue
                            schema:propertyID:
                              const:
                              - '@id': ada:parameter/geochronTAPP/preAblationSurfaceTreatment
                            schema:name:
                              const: Pre-Ablation Surface Treatment
                            schema:value:
                              type: string
                          required:
                          - '@id'
                          - '@type'
                          - schema:propertyID
                          - schema:name
                          - schema:value
                        allOf:
                        - contains: *id014
                          minContains: 0
                          maxContains: 1
                - if:
                    properties:
                      schema:name:
                        const: dataReduction
                    required:
                    - schema:name
                  then:
                    properties:
                      schema:additionalProperty:
                        type: array
                        items:
                          anyOf:
                          - &id015
                            title: Signal Smoothing
                            description: Description of any signal smoothing device or approach installed
                              between the ablation cell and the ICP-MS to reduce pulse-to-pulse signal
                              variability.
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/geochronTAPP/signalSmoothing
                              '@type':
                                const:
                                - schema:PropertyValue
                              schema:propertyID:
                                const:
                                - '@id': ada:parameter/geochronTAPP/signalSmoothing
                              schema:name:
                                const: Signal Smoothing
                              schema:value:
                                type: string
                            required:
                            - '@id'
                            - '@type'
                            - schema:propertyID
                            - schema:name
                            - schema:value
                          - &id016
                            title: Constants and Reference Values Used
                            description: 'Physical constants and reference values used in data reduction
                              to calculate the final reported quantity (e.g., decay constants for age
                              calculation, the 238U/235U ratio used to convert measured 235U-based data
                              to 207Pb/235U, or other citable reference values), together with their source.
                              Distinct from Reference Material Information (Group 6), which documents
                              accepted values for specific calibration/validation materials rather than
                              universal physical constants. Critical for traceability: community-recommended
                              values for decay constants and isotope ratios are periodically revised (e.g.,
                              the 238U/235U ratio revision by Hiess et al. 2012), and a reported age or
                              ratio can only be correctly reinterpreted against a future revision if the
                              constants originally used are known.'
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/geochronTAPP/constantsAndReferenceValuesUsed
                              '@type':
                                const:
                                - schema:PropertyValue
                              schema:propertyID:
                                const:
                                - '@id': ada:parameter/geochronTAPP/constantsAndReferenceValuesUsed
                              schema:name:
                                const: Constants and Reference Values Used
                              schema:value:
                                type: string
                            required:
                            - '@id'
                            - '@type'
                            - schema:propertyID
                            - schema:name
                            - schema:value
                          - &id017
                            title: Spike / Outlier Filtering Approach
                            description: Method used to identify and remove anomalous signal spikes arising
                              from micronuggets, inclusions, cracks, or instrument artifacts during time-resolved
                              signal processing.
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/geochronTAPP/spikeOutlierFilteringApproach
                              '@type':
                                const:
                                - schema:PropertyValue
                              schema:propertyID:
                                const:
                                - '@id': ada:parameter/geochronTAPP/spikeOutlierFilteringApproach
                              schema:name:
                                const: Spike / Outlier Filtering Approach
                              schema:value:
                                type: string
                            required:
                            - '@id'
                            - '@type'
                            - schema:propertyID
                            - schema:name
                            - schema:value
                          - &id018
                            title: Normalization/Standards-Based Correction
                            description: Any post-acquisition normalization applied to correct for systematic
                              biases identified from secondary reference materials.
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/geochronTAPP/normalizationStandardsBasedCorrection
                              '@type':
                                const:
                                - schema:PropertyValue
                              schema:propertyID:
                                const:
                                - '@id': ada:parameter/geochronTAPP/normalizationStandardsBasedCorrection
                              schema:name:
                                const: Normalization/Standards-Based Correction
                              schema:value:
                                type: string
                            required:
                            - '@id'
                            - '@type'
                            - schema:propertyID
                            - schema:name
                            - schema:value
                        allOf:
                        - contains: *id015
                          minContains: 0
                          maxContains: 1
                        - contains: *id016
                          minContains: 0
                          maxContains: 1
                        - contains: *id017
                          minContains: 0
                          maxContains: 1
                        - contains: *id018
                          minContains: 0
                          maxContains: 1
              allOf:
              - contains:
                  properties:
                    schema:name:
                      const: samplePreparation
                  required:
                  - schema:name
              - contains:
                  properties:
                    schema:name:
                      const: dataReduction
                  required:
                  - schema:name
        schema:object:
          type: array
          items:
            type: object
            allOf:
            - if:
                properties:
                  '@type':
                    contains:
                      const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                required:
                - '@type'
              then:
                properties:
                  schema:name:
                    description: Name or identifier of the sample analysed, as used in the laboratory.
                      Should match the identifier used in associated publications or data tables.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  schema:identifier:
                    description: Globally unique, persistent identifier for the analysed sample. IGSN
                      is the recommended standard for geological and cosmochemical samples.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  schema:additionalProperty:
                    type: array
                    items: &id019
                      title: Analysis Location/Spot Coordinates
                      description: 'Location of the analysis on the sample surface: stage coordinates
                        (X, Y) or a description relative to a named reference feature (e.g., mineral rim,
                        growth zone identified by imaging).'
                      type: object
                      properties:
                        '@id':
                          const: ada:parameter/geochronTAPP/analysisLocationSpotCoordinates
                        '@type':
                          const:
                          - schema:PropertyValue
                        schema:propertyID:
                          const:
                          - '@id': ada:parameter/geochronTAPP/analysisLocationSpotCoordinates
                        schema:name:
                          const: Analysis Location/Spot Coordinates
                        schema:value:
                          type: string
                      required:
                      - '@id'
                      - '@type'
                      - schema:propertyID
                      - schema:name
                      - schema:value
                    allOf:
                    - contains: *id019
                      minContains: 0
                      maxContains: 1
          allOf:
          - contains:
              properties:
                '@type':
                  contains:
                    const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
              required:
              - '@type'
        prov:used:
          type: array
          items:
            type: object
            allOf:
            - if:
                required:
                - schema:instrument
              then:
                properties:
                  schema:instrument:
                    type: array
                    items:
                      allOf:
                      - $ref: ../../../../BaseSchema/instrument/schema.yaml
                      - type: object
                        allOf:
                        - if:
                            properties:
                              schema:additionalType:
                                contains:
                                  const: ICPMS
                            required:
                            - schema:additionalType
                          then:
                            properties:
                              schema:identifier:
                                description: Serial number or laboratory-internal identifier for the specific
                                  instrument unit. Supports traceability to instrument service records.
                                anyOf:
                                - type: string
                                - type: array
                                  items:
                                    type: string
                              schema:hasPart:
                                type: array
                                items:
                                  type: object
                                  allOf:
                                  - if:
                                      properties:
                                        schema:additionalType:
                                          contains:
                                            const: Torch
                                      required:
                                      - schema:additionalType
                                    then:
                                      properties:
                                        schema:additionalProperty:
                                          type: array
                                          items: &id020
                                            title: Torch Depth
                                            description: Distance between the load coil and the sampling
                                              cone tip (mm), also called injector depth or torch position.
                                              Affects ion transmission efficiency, oxide formation, and
                                              doubly-charged species production.
                                            type: object
                                            properties:
                                              '@id':
                                                const: ada:parameter/geochronTAPP/torchDepth
                                              '@type':
                                                const:
                                                - schema:PropertyValue
                                              schema:propertyID:
                                                const:
                                                - '@id': ada:parameter/geochronTAPP/torchDepth
                                              schema:name:
                                                const: Torch Depth
                                              schema:value:
                                                type: string
                                            required:
                                            - '@id'
                                            - '@type'
                                            - schema:propertyID
                                            - schema:name
                                            - schema:value
                                          allOf:
                                          - contains: *id020
                                            minContains: 0
                                            maxContains: 1
                                  - if:
                                      properties:
                                        schema:additionalType:
                                          contains:
                                            const: ICP Source
                                      required:
                                      - schema:additionalType
                                    then:
                                      properties:
                                        schema:additionalProperty:
                                          type: array
                                          items:
                                            anyOf:
                                            - &id021
                                              title: RF Power (W)
                                              description: ICP radiofrequency forward power. Session-tunable
                                                within procedure-defined bounds during plasma optimisation;
                                                consistent with the analogous, tunable treatment of RF
                                                Power across LA-Q/SF-ICP-MS and all three solution ICP-MS
                                                TAPPs.
                                              type: object
                                              properties:
                                                '@id':
                                                  const: ada:parameter/geochronTAPP/rfPower
                                                '@type':
                                                  const:
                                                  - schema:PropertyValue
                                                schema:propertyID:
                                                  const:
                                                  - '@id': ada:parameter/geochronTAPP/rfPower
                                                schema:name:
                                                  const: RF Power (W)
                                                schema:value:
                                                  anyOf:
                                                  - type: number
                                                  - type: string
                                                schema:unitText:
                                                  type: string
                                              required:
                                              - '@id'
                                              - '@type'
                                              - schema:propertyID
                                              - schema:name
                                              - schema:value
                                              - schema:unitText
                                            - &id022
                                              title: Coolant (Plasma) Gas Flow Rate
                                              description: Flow rate of the outer (coolant/plasma) argon
                                                gas stream that sustains the ICP plasma. Determines plasma
                                                volume and stability.
                                              type: object
                                              properties:
                                                '@id':
                                                  const: ada:parameter/geochronTAPP/coolantGasFlowRate
                                                '@type':
                                                  const:
                                                  - schema:PropertyValue
                                                schema:propertyID:
                                                  const:
                                                  - '@id': ada:parameter/geochronTAPP/coolantGasFlowRate
                                                schema:name:
                                                  const: Coolant (Plasma) Gas Flow Rate
                                                schema:value:
                                                  anyOf:
                                                  - type: number
                                                  - type: string
                                                schema:unitText:
                                                  type: string
                                              required:
                                              - '@id'
                                              - '@type'
                                              - schema:propertyID
                                              - schema:name
                                              - schema:value
                                              - schema:unitText
                                            - &id023
                                              title: Auxiliary Gas Flow Rate
                                              description: Flow rate of the intermediate (auxiliary) argon
                                                gas stream that positions the plasma relative to the load
                                                coil. Affects ion extraction efficiency and oxide production
                                                rates.
                                              type: object
                                              properties:
                                                '@id':
                                                  const: ada:parameter/geochronTAPP/auxiliaryGasFlowRate
                                                '@type':
                                                  const:
                                                  - schema:PropertyValue
                                                schema:propertyID:
                                                  const:
                                                  - '@id': ada:parameter/geochronTAPP/auxiliaryGasFlowRate
                                                schema:name:
                                                  const: Auxiliary Gas Flow Rate
                                                schema:value:
                                                  anyOf:
                                                  - type: number
                                                  - type: string
                                                schema:unitText:
                                                  type: string
                                              required:
                                              - '@id'
                                              - '@type'
                                              - schema:propertyID
                                              - schema:name
                                              - schema:value
                                              - schema:unitText
                                          allOf:
                                          - contains: *id021
                                            minContains: 0
                                            maxContains: 1
                                          - contains: *id022
                                            minContains: 0
                                            maxContains: 1
                                          - contains: *id023
                                            minContains: 0
                                            maxContains: 1
                                  - if:
                                      properties:
                                        schema:additionalType:
                                          contains:
                                            const: Collision Reaction Cell
                                      required:
                                      - schema:additionalType
                                    then:
                                      properties:
                                        schema:additionalProperty:
                                          type: array
                                          items:
                                            anyOf:
                                            - &id024
                                              title: Collision Gas Flow Rate
                                              description: Flow rate of the collision gas in KED mode.
                                                Higher flow rates provide greater interference suppression
                                                at the cost of analyte sensitivity. Applies to quadrupole-based
                                                instruments and to collision-cell-equipped multi-collector
                                                instruments (e.g., Nu Sapphire, Thermo Neoma MS/MS) operating
                                                in KED mode.
                                              type: object
                                              properties:
                                                '@id':
                                                  const: ada:parameter/geochronTAPP/collisionGasFlowRate
                                                '@type':
                                                  const:
                                                  - schema:PropertyValue
                                                schema:propertyID:
                                                  const:
                                                  - '@id': ada:parameter/geochronTAPP/collisionGasFlowRate
                                                schema:name:
                                                  const: Collision Gas Flow Rate
                                                schema:value:
                                                  anyOf:
                                                  - type: number
                                                  - type: string
                                                schema:unitText:
                                                  type: string
                                              required:
                                              - '@id'
                                              - '@type'
                                              - schema:propertyID
                                              - schema:name
                                              - schema:value
                                              - schema:unitText
                                            - &id025
                                              title: Cell Exit Discrimination Voltage
                                              description: Kinetic energy discrimination offset voltage
                                                applied at the exit of the collision cell in KED mode.
                                                Applies to quadrupole-based instruments and to collision-cell-equipped
                                                multi-collector instruments (e.g., Nu Sapphire, Thermo
                                                Neoma MS/MS) operating in KED mode.
                                              type: object
                                              properties:
                                                '@id':
                                                  const: ada:parameter/geochronTAPP/cellExitDiscriminationVoltage
                                                '@type':
                                                  const:
                                                  - schema:PropertyValue
                                                schema:propertyID:
                                                  const:
                                                  - '@id': ada:parameter/geochronTAPP/cellExitDiscriminationVoltage
                                                schema:name:
                                                  const: Cell Exit Discrimination Voltage
                                                schema:value:
                                                  anyOf:
                                                  - type: number
                                                  - type: string
                                                schema:unitText:
                                                  type: string
                                              required:
                                              - '@id'
                                              - '@type'
                                              - schema:propertyID
                                              - schema:name
                                              - schema:value
                                              - schema:unitText
                                            - &id026
                                              title: Reaction Gas Flow Rate
                                              description: Flow rate of the reactive gas introduced into
                                                the dynamic reaction cell (DRC). Applies to quadrupole-based
                                                instruments and to collision-cell-equipped multi-collector
                                                instruments (e.g., Nu Sapphire, Thermo Neoma MS/MS) operating
                                                in DRC mode.
                                              type: object
                                              properties:
                                                '@id':
                                                  const: ada:parameter/geochronTAPP/reactionGasFlowRate
                                                '@type':
                                                  const:
                                                  - schema:PropertyValue
                                                schema:propertyID:
                                                  const:
                                                  - '@id': ada:parameter/geochronTAPP/reactionGasFlowRate
                                                schema:name:
                                                  const: Reaction Gas Flow Rate
                                                schema:value:
                                                  anyOf:
                                                  - type: number
                                                  - type: string
                                                schema:unitText:
                                                  type: string
                                              required:
                                              - '@id'
                                              - '@type'
                                              - schema:propertyID
                                              - schema:name
                                              - schema:value
                                              - schema:unitText
                                          allOf:
                                          - contains: *id024
                                            minContains: 0
                                            maxContains: 1
                                          - contains: *id025
                                            minContains: 0
                                            maxContains: 1
                                          - contains: *id026
                                            minContains: 0
                                            maxContains: 1
                                allOf:
                                - contains:
                                    properties:
                                      schema:additionalType:
                                        contains:
                                          const: ICP Source
                                    required:
                                    - schema:additionalType
                              schema:additionalProperty:
                                type: array
                                items:
                                  anyOf:
                                  - &id027
                                    title: Mass Resolution Setting
                                    description: Operating mass resolution of the mass analyser. Fixed
                                      at unit resolution for quadrupole instruments; selectable (low/medium/high)
                                      for sector-field instruments to balance sensitivity against interference
                                      suppression; not applicable in the same sense for multi-collector
                                      instruments running static low-resolution collection (see Faraday
                                      Cup Array Configuration and Collector Configuration for MC-specific
                                      detail).
                                    type: object
                                    properties:
                                      '@id':
                                        const: ada:parameter/geochronTAPP/massResolutionSetting
                                      '@type':
                                        const:
                                        - schema:PropertyValue
                                      schema:propertyID:
                                        const:
                                        - '@id': ada:parameter/geochronTAPP/massResolutionSetting
                                      schema:name:
                                        const: Mass Resolution Setting
                                      schema:value:
                                        type: string
                                    required:
                                    - '@id'
                                    - '@type'
                                    - schema:propertyID
                                    - schema:name
                                    - schema:value
                                  - &id028
                                    title: ICP Tuning
                                    description: Description of the approach used to optimise ICP plasma
                                      conditions prior to analysis, including the reference material used
                                      for tuning and the acceptance criteria.
                                    type: object
                                    properties:
                                      '@id':
                                        const: ada:parameter/geochronTAPP/icpTuning
                                      '@type':
                                        const:
                                        - schema:PropertyValue
                                      schema:propertyID:
                                        const:
                                        - '@id': ada:parameter/geochronTAPP/icpTuning
                                      schema:name:
                                        const: ICP Tuning
                                      schema:value:
                                        type: string
                                    required:
                                    - '@id'
                                    - '@type'
                                    - schema:propertyID
                                    - schema:name
                                    - schema:value
                                  - &id029
                                    title: Doubly-Charged Species Monitor
                                    description: The mass ratio monitored to estimate doubly-charged ion
                                      (M²⁺) formation during instrument tuning.
                                    type: object
                                    properties:
                                      '@id':
                                        const: ada:parameter/geochronTAPP/doublyChargedSpeciesMonitor
                                      '@type':
                                        const:
                                        - schema:PropertyValue
                                      schema:propertyID:
                                        const:
                                        - '@id': ada:parameter/geochronTAPP/doublyChargedSpeciesMonitor
                                      schema:name:
                                        const: Doubly-Charged Species Monitor
                                      schema:value:
                                        type: string
                                    required:
                                    - '@id'
                                    - '@type'
                                    - schema:propertyID
                                    - schema:name
                                    - schema:value
                                  - &id030
                                    title: Doubly-Charged Species Production
                                    description: Measured percentage of doubly-charged ion production
                                      for the monitored species at the time of instrument tuning.
                                    type: object
                                    properties:
                                      '@id':
                                        const: ada:parameter/geochronTAPP/doublyChargedSpeciesProduction
                                      '@type':
                                        const:
                                        - schema:PropertyValue
                                      schema:propertyID:
                                        const:
                                        - '@id': ada:parameter/geochronTAPP/doublyChargedSpeciesProduction
                                      schema:name:
                                        const: Doubly-Charged Species Production
                                      schema:value:
                                        type: string
                                    required:
                                    - '@id'
                                    - '@type'
                                    - schema:propertyID
                                    - schema:name
                                    - schema:value
                                  - &id031
                                    title: Memory Effect Mitigation
                                    description: Procedure applied to identify and minimise memory effects
                                      from high-concentration elements in the previous sample or standard
                                      that may contaminate subsequent analyses.
                                    type: object
                                    properties:
                                      '@id':
                                        const: ada:parameter/geochronTAPP/memoryEffectMitigation
                                      '@type':
                                        const:
                                        - schema:PropertyValue
                                      schema:propertyID:
                                        const:
                                        - '@id': ada:parameter/geochronTAPP/memoryEffectMitigation
                                      schema:name:
                                        const: Memory Effect Mitigation
                                      schema:value:
                                        type: string
                                    required:
                                    - '@id'
                                    - '@type'
                                    - schema:propertyID
                                    - schema:name
                                    - schema:value
                                allOf:
                                - contains: *id027
                                  minContains: 0
                                  maxContains: 1
                                - contains: *id028
                                  minContains: 0
                                  maxContains: 1
                                - contains: *id029
                                  minContains: 0
                                  maxContains: 1
                                - contains: *id030
                                  minContains: 0
                                  maxContains: 1
                                - contains: *id031
                                  minContains: 0
                                  maxContains: 1
                        - if:
                            properties:
                              schema:additionalType:
                                contains:
                                  const: Laser Ablation System
                            required:
                            - schema:additionalType
                          then:
                            properties:
                              ada:laserFluence:
                                description: Laser pulse energy per unit area at the sample surface, the
                                  primary control on ablation rate and crater morphology.
                                anyOf:
                                - type: number
                                - type: string
                              ada:laserRepetitionRate:
                                description: Laser pulse repetition rate.
                                anyOf:
                                - type: number
                                - type: string
                    allOf:
                    - contains:
                        properties:
                          schema:additionalType:
                            contains:
                              const: ICPMS
                        required:
                        - schema:additionalType
                    - contains:
                        properties:
                          schema:additionalType:
                            contains:
                              const: Laser Ablation System
                        required:
                        - schema:additionalType
            - if:
                required:
                - bios:computationalTool
              then:
                properties:
                  bios:computationalTool:
                    type: array
                    items:
                      allOf:
                      - $ref: ../../../../BaseSchema/adaProduct/schema.yaml#/$defs/UsedComputationalTool
                      - type: object
                        allOf:
                        - if:
                            properties:
                              ada:toolRole:
                                const: acquisition
                            required:
                            - ada:toolRole
                          then:
                            properties:
                              schema:name:
                                description: Instrument control and data acquisition software used to
                                  collect raw signal data, including version number.
                                anyOf:
                                - type: string
                                - type: array
                                  items:
                                    type: string
                        - if:
                            properties:
                              ada:toolRole:
                                const: dataReduction
                            required:
                            - ada:toolRole
                          then:
                            properties:
                              schema:name:
                                description: Software used for signal processing, background subtraction,
                                  downhole fractionation correction, and age calculation, including version
                                  number.
                                anyOf:
                                - type: string
                                - type: array
                                  items:
                                    type: string
                        required:
                        - ada:toolRole
            - if:
                required:
                - prov:reagent
              then:
                properties:
                  prov:reagent:
                    type: array
                    items:
                      allOf:
                      - $ref: ../../../../BaseSchema/adaProduct/schema.yaml#/$defs/UsedReagent
                      - type: object
                        allOf:
                        - if:
                            properties:
                              ada:reagentRole:
                                const: primaryStandard
                            required:
                            - ada:reagentRole
                          then:
                            properties:
                              schema:name:
                                description: Primary reference material used to calibrate the instrument
                                  and convert raw signal intensities to ages/isotope ratios. Include citation
                                  for the accepted values used.
                                anyOf:
                                - type: string
                                - type: array
                                  items:
                                    type: string
                        - if:
                            properties:
                              ada:reagentRole:
                                const: referenceMaterial
                            required:
                            - ada:reagentRole
                          then:
                            properties:
                              schema:name:
                                description: Quality-control reference material(s) analysed as unknowns
                                  alongside samples in the same session to assess accuracy and monitor
                                  drift. Include citation/accepted values for each.
                                anyOf:
                                - type: string
                                - type: array
                                  items:
                                    type: string
                        required:
                        - ada:reagentRole
        ada:spotDiameter:
          description: Diameter of the laser spot as set in the acquisition method (nominal/target value).
          type: string
        ada:ablationSpotDuration:
          description: Total on-sample ablation time per spot, as set in the acquisition method.
          anyOf:
          - type: number
          - type: string
        ada:carrierGasFlowRate:
          description: Identity and plumbing configuration of the gas used to transport the ablated aerosol
            from the cell to the torch, including the procedure-registered flow rate(s).
          type: string
        ada:massesMeasured:
          description: Mass-to-charge positions (isotope masses) this procedure is designed to measure.
            Defines the scope of the procedure; the analyst may record the specific subset actually measured
            in a given session.
          type: string
        ada:dwellTimes:
          description: Count time (dwell time) per mass position for each measured isotope, and the settling
            time allowed between mass jumps, as reported in Table 3 of Horstwood et al. (2016). Applies
            to sequential (Q/SF) mass-hopping acquisition; for simultaneous multi-collector acquisition
            see Number of Blocks per Measurement, Number of Cycles per Block, and Integration Time per
            Cycle.
          type: string
        ada:totalIntegrationTimePerOutputDataPoint:
          description: Total duty-cycle time for one complete mass-scan sweep (sum of all per-isotope
            dwell times and settling times), which sets the time resolution of the down-hole signal. Applies
            to sequential (Q/SF) acquisition.
          anyOf:
          - type: number
          - type: string
  schema:contributor:
    type: array
    items:
      type: object
      allOf:
      - if:
          properties:
            schema:roleName:
              const: analyst
          required:
          - schema:roleName
        then:
          properties:
            schema:name:
              description: Name(s) of the analyst(s) who performed the analysis session. ORCID recommended
                for persistent identification.
              anyOf:
              - type: string
              - type: array
                items:
                  type: string
    allOf:
    - contains:
        properties:
          schema:roleName:
            const: analyst
        required:
        - schema:roleName
  schema:measurementTechnique:
    type: array
    items:
      type: object
      properties:
        schema:identifier:
          description: DOI or unique persistent identifier for the registered procedure used in this analysis.
            Mandatory when submitting analytical data, to encourage formal procedure registration. Enter
            'pending' if applied for but not yet minted.
          type: string
  schema:funding:
    type: array
  schema:relatedLink:
    type: array
    items:
      type: object
      allOf:
      - if:
          properties:
            schema:linkRelationship:
              const: coupledTechnique
          required:
          - schema:linkRelationship
        then:
          properties:
            schema:target:
              type: object
              properties:
                schema:name:
                  description: Other analytical techniques applied to the same sample(s) whose results
                    are intended to be interpreted together with, or used to independently validate, this
                    dataset. Enter 'None' if no coupling is intended.
                  type: string
                  enum:
                  - CA-ID-TIMS
                  - SIMS
                  - EPMA
                  - CL/BSE Imaging
                  - None
                  - missing
                schema:description:
                  description: Describes (1) the functional relationship between this dataset and the
                    coupled technique, and (2) the analytical sequence — which technique was performed
                    first and why. Required when Coupled Technique(s) is not 'None'.
                  type: string
      - if:
          properties:
            schema:linkRelationship:
              const: coupledProcedure
          required:
          - schema:linkRelationship
        then:
          properties:
            schema:target:
              type: object
              properties:
                schema:url:
                  description: Registered procedure DOI for the coupled technique named above.
                  type: string
      - if:
          properties:
            schema:linkRelationship:
              const: coupledDataset
          required:
          - schema:linkRelationship
        then:
          properties:
            schema:target:
              description: DOI or persistent identifier for the co-registered dataset or publication reporting
                both datasets together.
              anyOf:
              - type: string
              - type: array
                items:
                  type: string
  ada:spotDiameterMeasured:
    description: Diameter of the laser spot as independently measured on the sample or a test material,
      distinct from the nominal/target value registered by the procedure.
    type: string
  ada:sensitivityYield:
    description: Instrument sensitivity expressed as useful yield — the percentage of sampled atoms of
      a given element that are ultimately detected as ions — for the analytical session, following the
      method cited.
    type: string
  dqv:hasQualityMeasurement:
    type: array
    items:
      type: object
      allOf:
      - if:
          properties:
            dqv:isMeasurementOf:
              const: Oxide production ratio
          required:
          - dqv:isMeasurementOf
        then:
          properties:
            dqv:value:
              description: Actual oxide production ratio measured during this analytical session, using
                the method specified in Oxide Production Method and Threshold.
              anyOf:
              - type: string
              - type: array
                items:
                  type: string
    allOf:
    - contains:
        properties:
          dqv:isMeasurementOf:
            const: Oxide production ratio
        required:
        - dqv:isMeasurementOf
required:
- schema:funding
- ada:spotDiameterMeasured
