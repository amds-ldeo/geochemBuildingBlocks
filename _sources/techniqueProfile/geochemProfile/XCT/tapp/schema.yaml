$schema: https://json-schema.org/draft/2020-12/schema
title: Lab-XCT Technique-Aligned Protocol Profile (labxctTAPP)
description: 'Laboratory X-ray computed tomography (polychromatic cone-beam) extension of the base TAPP
  definition. Basic protocol-tier fields are required top-level ada: properties; Advanced protocol-tier
  fields are schema:additionalProperty[] PropertyValueSpecification entries. XCT has no per-element analyte
  axis, so no ada:analyteTemplate is defined. Generated from tapp/Current TAPPs/Lab-XCT_TAPP_v21.csv by
  tools/build_tapp.py.'
allOf:
- $ref: ../../../../BaseSchema/tappDefinition/schema.yaml
- type: object
  properties:
    schema:name:
      description: A short descriptive name for this analytical procedure, including a version number.
        Should identify the instrument, the technique, and the scope of what is measured — analyte, material,
        or feature.
      type: string
      readOnly: true
    schema:measurementTechnique:
      type: array
      items:
        type: object
        properties:
          schema:termCode:
            description: Top-level analytical technique identifier.
            type: string
            enum:
            - XCT (laboratory, polychromatic cone-beam)
            - missing
            readOnly: true
    schema:creator:
      type: object
      properties:
        schema:name:
          description: Person(s) or laboratory responsible for developing and registering this procedure.
            ORCID recommended for individuals.
          type: string
          readOnly: true
    schema:location:
      type: object
      properties:
        schema:name:
          description: Name of the laboratory or institution hosting the instrument.
          type: string
        schema:identifier:
          description: Persistent identifier for the laboratory (e.g., ROR ID).
          type: string
    schema:datePublished:
      description: First date this procedure configuration was used in production.
      type: string
      readOnly: true
    schema:funding:
      type: array
      items:
        type: object
        properties:
          schema:name:
            description: Grants and other funding sources that supported instrument acquisition, major
              upgrades, procedure development, and associated personnel time. Include grant numbers and
              funding agencies where applicable.
            type: string
            readOnly: true
    schema:relatedLink:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              schema:linkRelationship:
                const: techniquePublication
            required:
            - schema:linkRelationship
          then:
            properties:
              schema:target:
                type: object
                properties:
                  schema:name:
                    description: DOI or URL for peer-reviewed publications or technical reports describing,
                      validating, or benchmarking this procedure.
                    type: string
                    readOnly: true
        - if:
            properties:
              schema:linkRelationship:
                const: coupledTechnique
            required:
            - schema:linkRelationship
          then:
            properties:
              schema:target:
                type: object
                properties:
                  schema:name:
                    description: Other analytical techniques applied to the same sample(s) whose results
                      are intended to be interpreted together with data from this procedure. Document
                      coupling with any technique whose results are functionally linked to this dataset
                      — providing calibration inputs, complementary spatial context, or required companion
                      measurements. Use the same controlled vocabulary as the Technique field. Enter "None"
                      if no coupling is intended.
                    anyOf:
                    - type: string
                      enum:
                      - NCT
                      - EPMA
                      - LA-ICP-MS
                      - SIMS
                      - None
                      - N/A
                      - missing
                    - type: string
                  schema:description:
                    description: 'Description of how this procedure is coupled with the technique(s) listed
                      above. Include: (1) the functional relationship — what data or context flows between
                      techniques, or how results are combined (e.g. which output from the coupled technique
                      serves as input to data reduction for this technique); and (2) the analytical sequence
                      — which technique is performed first and why (e.g. non-destructive before destructive).
                      Required when Coupled Technique(s) is not "None".'
                    type: string
    schema:object:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              '@type':
                contains:
                  const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
            required:
            - '@type'
          then:
            properties:
              schema:additionalProperty:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:name:
                          const: Target Material
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:value:
                          type: array
                          items:
                            description: General description of the material type(s) this procedure is
                              designed to analyse. Used for discoverability and procedure matching, and
                              because the material type constrains sample preparation, calibration and
                              matrix-matching requirements.
                            anyOf:
                            - type: string
                              enum:
                              - Chondrite meteorite
                              - Achondrite meteorite
                              - Lunar sample
                              - Mission-returned sample
                              - Drill core (rock)
                              - Sediment core
                              - Terrestrial rock
                              - Cosmic spherule
                              - N/A
                              - None
                              - missing
                            - type: string
                            readOnly: true
                allOf:
                - contains:
                    properties:
                      schema:name:
                        const: Target Material
                    required:
                    - schema:name
                - contains:
                    title: Sample Dimensions (L × W × H)
                    description: Physical dimensions of the sample in mm, reported as length × width ×
                      height (or equivalent three orthogonal measurements). The maximum dimension constrains
                      the minimum achievable field of view and therefore the coarsest achievable voxel
                      size. The minimum dimension determines how many voxels span the smallest feature
                      of interest.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/labxctTAPP/sampleDimensionsDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: sampleDimensionsDefault
                      schema:name:
                        const: Sample Dimensions (L × W × H)
                      ada:dataType:
                        const: string
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
                        const: R
                    required:
                    - '@id'
                    - '@type'
                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                  minContains: 0
                  maxContains: 1
                - contains:
                    title: Pre-Analysis Imaging and Screening
                    description: Imaging or other characterisation performed before the measurement in
                      order to select or locate the analysed target, including the technique, instrument
                      and settings used, and how individual analyses are linked back to the images. Distinct
                      from any imaging the procedure performs as its own measurement. Where the imaging
                      is performed on a separate instrument, it should also be recorded in the Group 1
                      coupling fields.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/labxctTAPP/preAnalysisImagingAndScreeningDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: preAnalysisImagingAndScreeningDefault
                      schema:name:
                        const: Pre-Analysis Imaging and Screening
                      ada:dataType:
                        const: string
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
                        const: R
                    required:
                    - '@id'
                    - '@type'
                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                  minContains: 0
                  maxContains: 1
      allOf:
      - contains:
          properties:
            '@type':
              contains:
                const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
          required:
          - '@type'
    ada:targetFeature:
      description: 'The 3D internal features or properties the procedure is designed to characterize.
        Defines the scientific purpose of the scan and informs resolution and contrast requirements. Used
        for procedure discoverability: a researcher can identify whether this procedure is suitable for
        their scientific question. Note for Phase 3 literature assessment: evaluate whether procedures
        in the literature are feature-specific (acquisition parameters tuned to a specific feature type,
        e.g., opaque-phase contrast) or general-purpose (designed to capture all structural features in
        a given sample type). This will inform whether the field warrants a controlled list or remains
        free text.'
      type: string
      readOnly: true
    ada:applicableSampleDimensionRange:
      description: 'The range of sample sizes compatible with this procedure at the target voxel size
        and geometric configuration. The upper bound is a hard constraint set by the instrument field
        of view (FOV) at the procedure''s target magnification: FOV ≈ detector array width × pixel size
        / geometric magnification (divide additionally by optical objective multiplier for Versa-class
        systems using optical magnification). For Mode A (single-volume): all three sample dimensions
        must fall within the FOV. For Mode B (multi-volume stitching): sample diameter must fall within
        the FOV; sample length along the rotation axis is effectively unlimited through stitching. The
        lower bound is a practical guideline: samples spanning fewer than ~10 voxels in their smallest
        dimension are difficult to characterize reliably.'
      type: string
      readOnly: true
    schema:additionalProperty:
      type: array
      items:
        anyOf:
        - &id001
          title: Sample Mounting Method
          description: Method used to mount or hold the sample on the instrument rotation stage. Mounting
            material should transmit X-rays at the selected voltage without dominating beam attenuation.
            Report the holder type, adhesive or support material, and any alignment aids used.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/sampleMountingMethodDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: sampleMountingMethodDefault
            schema:name:
              const: Sample Mounting Method
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: X-ray Tube Anode Material
          description: Material of the X-ray tube anode (target). Determines the characteristic line energies
            superimposed on the bremsstrahlung continuum, which can affect phase contrast at specific
            energies. Multi-metal anodes (e.g., W/Mo/Cu) extend the usable energy range.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/xRayTubeAnodeMaterial
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/labxctTAPP/xRayTubeAnodeMaterial
            schema:name:
              const: X-ray Tube Anode Material
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: Detector Array Size
          description: Number of pixels in the detector array (width × height). Combined with detector
            pixel size and geometric magnification, determines the field of view.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/detectorArraySize
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/labxctTAPP/detectorArraySize
            schema:name:
              const: Detector Array Size
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: Detector Pixel Size
          description: Physical size of a single pixel on the detector in micrometres. This is a fixed
            hardware property of the detector array, distinct from the reconstructed voxel size (which
            depends on geometric magnification and binning).
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/detectorPixelSize
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/labxctTAPP/detectorPixelSize
            schema:name:
              const: Detector Pixel Size
            schema:value:
              anyOf:
              - type: number
              - type: string
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          - schema:unitText
          readOnly: true
        - title: Optical Objective
          description: Optical magnification objective installed between the scintillator and CCD/CMOS
            detector. Applies only to instruments using optical magnification (e.g., Zeiss Xradia Versa
            series). For systems using only geometric magnification, report "Not applicable".
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/opticalObjective
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/labxctTAPP/opticalObjective
            schema:name:
              const: Optical Objective
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - &id002
          title: X-ray Power
          description: 'X-ray tube power in watts (W) registered by the procedure. Derivable as voltage
            (kV) × current (mA) = kV × µA / 1000. Power constrains the achievable focal spot size for
            microfocal tubes: higher power requires a larger focal spot, trading spatial resolution for
            SNR. Retained as a standalone field because it is routinely reported in the literature and
            directly constrains instrument operating limits. If power was varied across samples within
            the session, report the full range applied (e.g., 7–13 W).'
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/xRayPowerDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: xRayPowerDefault
            schema:name:
              const: X-ray Power
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: W
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id003
          title: Source-to-Object Distance (SOD)
          description: Distance from the X-ray source focal spot to the centre of the sample rotation
            axis, in mm, as registered by the procedure. Together with SDD, determines geometric magnification
            (M = SDD/SOD). Shorter SOD increases magnification and reduces voxel size.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/sourceToObjectDistanceDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: sourceToObjectDistanceDefault
            schema:name:
              const: Source-to-Object Distance (SOD)
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: mm
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id004
          title: Source-to-Detector Distance (SDD)
          description: Distance from the X-ray source focal spot to the detector surface, in mm, as registered
            by the procedure. Together with SOD, determines geometric magnification M = SDD/SOD. Voxel
            size ≈ detector pixel size / M (before binning; divide additionally by optical objective for
            Versa-class systems).
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/sourceToDetectorDistanceDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: sourceToDetectorDistanceDefault
            schema:name:
              const: Source-to-Detector Distance (SDD)
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: mm
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id005
          title: Rotation Step Size
          description: Angular increment between successive projection images, in degrees. Equal to Rotation
            Range divided by Number of Projections when both are reported; however, some sources report
            step size as the primary rotation parameter without stating the total number of projections
            explicitly. Finer step sizes improve angular sampling and reduce streak artifacts at the cost
            of longer scan time.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/rotationStepSizeDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: rotationStepSizeDefault
            schema:name:
              const: Rotation Step Size
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: °
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id006
          title: Frames Averaged per Projection
          description: Number of individual detector frames acquired and averaged to produce each saved
            projection image, as registered by the procedure. Frame averaging reduces random electronic
            noise. The effective exposure per projection = exposure time per frame × frames averaged.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/framesAveragedPerProjectionDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: framesAveragedPerProjectionDefault
            schema:name:
              const: Frames Averaged per Projection
            ada:dataType:
              const: integer
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id007
          title: Detector Binning
          description: Detector pixel binning factor applied during acquisition. Binning combines adjacent
            pixels (e.g., 2×2 combines 4 pixels into one), reducing effective resolution while increasing
            per-pixel SNR and reducing file size. 1×1 indicates no binning.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/detectorBinningDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: detectorBinningDefault
            schema:name:
              const: Detector Binning
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id008
          title: Reconstruction Convolution Filter
          description: Convolution (apodization) filter kernel applied during back-projection reconstruction.
            Sharper filters (Ram-Lak) enhance edge definition but amplify high-frequency noise; smoother
            filters (Hann, Hamming) reduce noise at the cost of edge sharpness. The choice represents
            a deliberate procedure-level tradeoff.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/reconstructionConvolutionFilterDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: reconstructionConvolutionFilterDefault
            schema:name:
              const: Reconstruction Convolution Filter
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id009
          title: Beam Hardening Correction Parameter
          description: Numerical value or setting applied in the software beam hardening correction algorithm
            for this specific analysis. May be tuned empirically per material type or per scan session.
            Analysis-level companion to Beam Hardening Correction Method.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/beamHardeningCorrectionParameterDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: beamHardeningCorrectionParameterDefault
            schema:name:
              const: Beam Hardening Correction Parameter
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id010
          title: Ring Artifact Correction Method
          description: Procedure specification for how ring artifacts are handled. Ring artifacts appear
            as concentric circular bands centred on the rotation axis and arise from defective or miscalibrated
            detector pixels. Method is the procedure-level specification; whether correction was applied
            and its outcome are recorded at analysis level in Group 6.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/ringArtifactCorrectionMethodDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: ringArtifactCorrectionMethodDefault
            schema:name:
              const: Ring Artifact Correction Method
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id011
          title: CT Number Calibration
          description: Whether the raw CT grayscale values have been calibrated to physically meaningful
            units using reference materials. Calibrated CT numbers enable cross-instrument and cross-session
            comparison and support phase identification by comparison to calculated linear attenuation
            coefficient (LAC) values (e.g., using MuCalc; Hanna & Ketcham 2017). Uncalibrated grayscale
            values are instrument- and session-specific.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/ctNumberCalibrationDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: ctNumberCalibrationDefault
            schema:name:
              const: CT Number Calibration
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id012
          title: Segmentation Threshold Values or Criteria
          description: Specific CT number range(s) or quantitative criteria used to define each segmented
            phase or feature. Documenting these values enables reproducibility assessment and cross-study
            comparison. For LAC-calibrated datasets, report values in cm⁻¹.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/segmentationThresholdValuesOrCriteriaDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: segmentationThresholdValuesOrCriteriaDefault
            schema:name:
              const: Segmentation Threshold Values or Criteria
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id013
          title: Phase Identification Method
          description: Method used to assign reconstructed CT number ranges to specific mineral phases
            or material types. Approaches include comparison to calculated linear attenuation coefficients
            (LAC), cross-validation with independent analytical techniques, or empirical calibration.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/phaseIdentificationMethodDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: phaseIdentificationMethodDefault
            schema:name:
              const: Phase Identification Method
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id014
          title: VOI Selection Criteria
          description: Procedure-level rules specifying how the Volume of Interest (VOI) is to be defined
            for quantitative analysis. Common criteria exclude cone-beam artifact zones at sample edges,
            beam hardening halos near dense inclusions, and sample holder signal. The actual VOI applied
            in a specific analysis is recorded separately at analysis level.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/voiSelectionCriteriaDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: voiSelectionCriteriaDefault
            schema:name:
              const: VOI Selection Criteria
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id015
          title: Output Bit Depth
          description: Bit depth of the reconstructed 3D volume (number of bits used to encode each voxel's
            grayscale value). Common values are 8-bit (256 gray levels), 16-bit (65,536 gray levels),
            or 32-bit floating point. Bit depth affects the dynamic range available for phase segmentation
            and quantitative attenuation analysis. The procedure may specify a required output bit depth
            if downstream analysis workflows depend on a consistent grayscale range; the analyst confirms
            or adjusts at analysis time.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/outputBitDepthDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: outputBitDepthDefault
            schema:name:
              const: Output Bit Depth
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id016
          title: Partial Volume Effect Criteria
          description: Procedure-level specification of how partial volume effects (PVE) are managed in
            quantitative analysis. PVE produces intermediate CT numbers at phase boundaries and at the
            surfaces of small features, because each voxel integrates the attenuation of all material
            within its volume. PVE correction can be implemented via PSF-based deconvolution tools such
            as Blob3D. Record the minimum feature size criterion adopted for the procedure (in voxels
            or µm), the basis for it, the treatment of boundary voxels in modal abundance or size distribution
            calculations, and whether PVE correction is required or optional. Per Withers et al. (2021)
            a feature must span at least 3 voxels to be positively identified and at least 10 for reliable
            shape and volume characterisation; state whether the criterion follows that convention or
            is SNR-limited, PVE-limited or analyst-defined. The criterion materially changes reported
            modal abundances and size distributions, so two datasets are not comparable without it.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/partialVolumeEffectCriteriaDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: partialVolumeEffectCriteriaDefault
            schema:name:
              const: Partial Volume Effect Criteria
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id017
          title: Cross-Validation Procedure Requirement
          description: Procedure-level specification of what independent analytical validation is required
            to confirm CT segmentation results, phase identification, or quantitative measurements. Cross-validation
            is relevant where CT grey-values alone cannot uniquely distinguish phases with similar attenuation
            coefficients. Common approaches include BSE imaging, SEM-EDS or EPMA modal analysis, He pycnometry
            for bulk porosity, and Raman or SIMS phase mapping. Record the required validation method(s)
            and the sampling fraction (e.g., every sample, one per session, or a representative subset).
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/crossValidationProcedureRequirementDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: crossValidationProcedureRequirementDefault
            schema:name:
              const: Cross-Validation Procedure Requirement
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
      allOf:
      - contains: *id001
        minContains: 0
        maxContains: 1
      - contains:
          title: X-ray Tube Anode Material
          description: Material of the X-ray tube anode (target). Determines the characteristic line energies
            superimposed on the bremsstrahlung continuum, which can affect phase contrast at specific
            energies. Multi-metal anodes (e.g., W/Mo/Cu) extend the usable energy range.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/xRayTubeAnodeMaterial
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/labxctTAPP/xRayTubeAnodeMaterial
            schema:name:
              const: X-ray Tube Anode Material
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: Detector Array Size
          description: Number of pixels in the detector array (width × height). Combined with detector
            pixel size and geometric magnification, determines the field of view.
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/detectorArraySize
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/labxctTAPP/detectorArraySize
            schema:name:
              const: Detector Array Size
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: Detector Pixel Size
          description: Physical size of a single pixel on the detector in micrometres. This is a fixed
            hardware property of the detector array, distinct from the reconstructed voxel size (which
            depends on geometric magnification and binning).
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/detectorPixelSize
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/labxctTAPP/detectorPixelSize
            schema:name:
              const: Detector Pixel Size
            schema:value:
              anyOf:
              - type: number
              - type: string
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          - schema:unitText
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: Optical Objective
          description: Optical magnification objective installed between the scintillator and CCD/CMOS
            detector. Applies only to instruments using optical magnification (e.g., Zeiss Xradia Versa
            series). For systems using only geometric magnification, report "Not applicable".
          type: object
          properties:
            '@id':
              const: ada:parameter/labxctTAPP/opticalObjective
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/labxctTAPP/opticalObjective
            schema:name:
              const: Optical Objective
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains: *id002
        minContains: 0
        maxContains: 1
      - contains: *id003
        minContains: 0
        maxContains: 1
      - contains: *id004
        minContains: 0
        maxContains: 1
      - contains: *id005
        minContains: 0
        maxContains: 1
      - contains: *id006
        minContains: 0
        maxContains: 1
      - contains: *id007
        minContains: 0
        maxContains: 1
      - contains: *id008
        minContains: 0
        maxContains: 1
      - contains: *id009
        minContains: 0
        maxContains: 1
      - contains: *id010
        minContains: 0
        maxContains: 1
      - contains: *id011
        minContains: 0
        maxContains: 1
      - contains: *id012
        minContains: 0
        maxContains: 1
      - contains: *id013
        minContains: 0
        maxContains: 1
      - contains: *id014
        minContains: 0
