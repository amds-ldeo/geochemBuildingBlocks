    schema:actionProcess:
      type: object
      properties:
        schema:step:
          type: array
          items:
            type: object
            allOf:
            - if:
                properties:
                  schema:name:
                    const: Sample preparation
                required:
                - schema:name
              then:
                properties:
                  schema:description:
                    description: Any preparation steps applied to the sample before scanning, including
                      cleaning, trimming, consolidation, or drying. XCT is typically non-destructive with
                      no surface preparation required; note any exceptions.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
            - if:
                properties:
                  schema:name:
                    const: Data reduction
                required:
                - schema:name
              then:
                properties:
                  schema:additionalProperty:
                    type: array
                    items:
                      anyOf:
                      - &id018
                        title: Flat Field Correction
                        description: Whether dark-field (detector read with X-ray source off; electronic
                          noise baseline) and bright-field (source on, no sample; gain calibration) reference
                          images are acquired and applied to normalize detector response before reconstruction.
                          Standard practice in all quantitative lab XCT;.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/labxctTAPP/flatFieldCorrectionDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: flatFieldCorrectionDefault
                          schema:name:
                            const: Flat Field Correction
                          ada:dataType:
                            const: boolean
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      - &id019
                        title: Calibration Factor and Determination Method
                        description: 'An externally-calibrated factor that converts the measured quantity
                          into the reported quantity, how it was determined, and its uncertainty. Applies
                          where the conversion depends on a factor calibrated against a reference of independently
                          known value, rather than on the instrument response alone. Distinct from the
                          fields that name the calibration material and that state which approach applies
                          to which analyte, where the technique has them: this field records the resulting
                          factor itself.'
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/labxctTAPP/calibrationFactorAndDeterminationMethodDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: calibrationFactorAndDeterminationMethodDefault
                          schema:name:
                            const: Calibration Factor and Determination Method
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      - &id020
                        title: Sub-volume Stitching and Registration Method
                        description: 'Method used to register adjacent sub-volume datasets to each other
                          and stitch them into a single continuous 3D volume. Report the alignment strategy
                          (manual, automated, fiducial-based), the software used, and any correction steps
                          applied. Note: rotational mismatch artifacts have been identified in continuous-rotation
                          acquisitions (~0.35° misalignment in Eckley et al. 2025); their correction via
                          raw projection re-alignment should be documented here.'
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/labxctTAPP/subVolumeStitchingAndRegistrationMethodDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: subVolumeStitchingAndRegistrationMethodDefault
                          schema:name:
                            const: Sub-volume Stitching and Registration Method
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      - &id021
                        title: Constants and Reference Values Used
                        description: Physical constants and reference values used in data reduction to
                          calculate the final reported quantity (e.g., decay constants for age calculation,
                          standard isotope ratios, or other citable reference values used in a correction
                          or calculation), together with their source. Distinct from the Group 6 reference-material
                          fields, which document accepted values for specific calibration/validation materials
                          rather than universal physical constants. Record "None" if no citable, revisable
                          physical constants feed into this procedure's data reduction.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/labxctTAPP/constantsAndReferenceValuesUsedDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: constantsAndReferenceValuesUsedDefault
                          schema:name:
                            const: Constants and Reference Values Used
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                    allOf:
                    - contains: *id018
                      minContains: 0
                      maxContains: 1
                    - contains: *id019
                      minContains: 0
                      maxContains: 1
                    - contains: *id020
                      minContains: 0
                      maxContains: 1
                    - contains: *id021
                      minContains: 0
                      maxContains: 1
          allOf:
          - contains:
              properties:
                schema:name:
                  const: Data reduction
              required:
              - schema:name
    ada:xRaySourceConfiguration:
      description: Focal spot geometry and scale of the X-ray tube. Reflection target configurations are
        most common in lab XCT (X-rays emitted from the face of the anode toward the sample); transmission
        target configurations allow smaller focal spots by thinning the anode into a membrane and collecting
        X-rays from the back, enabling higher spatial resolution at the cost of lower maximum power.
      anyOf:
      - type: string
        enum:
        - Reflection target, microfocal
        - Reflection target, rotating (high-power)
        - Transmission target, nanofocal
        - N/A
        - None
        - missing
      - type: string
      readOnly: true
    ada:detectorType:
      description: Type of X-ray detector used to record projection images. Flat-panel detectors (amorphous
        silicon) are standard in Nikon, NSI, and similar systems. CCD or CMOS detectors coupled to a scintillator
        via an optical objective are used in Zeiss Xradia Versa systems, enabling optical magnification
        for sub-micrometre voxel sizes.
      anyOf:
      - type: string
        enum:
        - Flat-panel (amorphous silicon, a-Si)
        - CCD + scintillator (with optical objective)
        - CMOS + scintillator
        - N/A
        - None
        - missing
      - type: string
      readOnly: true
    bios:computationalTool:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              ada:toolRole:
                const: acquisition
            required:
            - ada:toolRole
          then:
            properties:
              schema:name:
                description: Instrument control, automation and data acquisition software used to collect
                  the raw data, including version number. Distinct from Data Processing Software(s), which
                  covers everything applied to the data after acquisition.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
        - if:
            properties:
              ada:toolRole:
                const: dataReduction
            required:
            - ada:toolRole
          then:
            properties:
              schema:name:
                description: All software applied to the data after acquisition in order to produce the
                  reported quantities, including version numbers. List every package used. Distinct from
                  Acquisition Software, which controls the instrument and collects the raw data.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
        required:
        - ada:toolRole
    ada:analyticalMode:
      type: array
      items:
        description: Primary analytical mode(s) executed under this procedure. Records one value for a
          single-mode procedure and all applicable modes for a multi-mode one. Serves as the procedure-level
          declaration of measurement type, distinct from the mode flag columns, which state per-field
          applicability. Required even where a procedure defines no mode flag columns, so that every procedure
          record is self-describing and comparable across the library.
        type: string
        enum:
        - Single-volume
        - Multi-volume stitching
        - Single-volume; Multi-volume stitching
        - missing
        readOnly: true
    schema:instrument:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              schema:additionalType:
                contains:
                  const: XCT
            required:
            - schema:additionalType
          then:
            properties:
              ada:acceleratingVoltageDefault:
                description: 'X-ray tube accelerating voltage in kilovolts (kV) registered by the procedure.
                  Determines the maximum X-ray photon energy and controls penetration depth and phase
                  contrast. Higher voltages provide greater penetration for dense or large samples; lower
                  voltages improve contrast between low-density phases. If the voltage was varied across
                  samples within the same procedure or session, report the full range applied (e.g., 90–115
                  kV). Note: some sources report this parameter as ''X keV'' (maximum Bremsstrahlung photon
                  energy) rather than ''X kV'' (tube voltage). For polychromatic lab XCT, these are numerically
                  equivalent: E_max [keV] = V [kV]. Record the value as originally reported, and add a
                  parenthetical note if the unit used is keV.'
                anyOf:
                - type: number
                - type: string
              ada:tubeCurrentDefault:
                description: X-ray tube current in microamperes (µA) registered by the procedure. Controls
                  photon flux and therefore projection image SNR. Higher current improves SNR but increases
                  thermal loading on the source and may increase focal spot size. If the current was varied
                  across samples within the same procedure or session, report the full range applied (e.g.,
                  65–115 µA).
                anyOf:
                - type: number
                - type: string
              ada:xRayPreFilterDefault:
                description: Material and thickness of the beam-hardening filter placed between the X-ray
                  source and the sample. Hardens the beam by attenuating low-energy photons, reducing
                  beam hardening artifacts and improving CT number stability across the sample. Both filter
                  material and thickness must be reported. Instrument-proprietary filter codes should
                  be decoded where possible.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
              ada:voxelSizeDefault:
                description: Isotropic voxel edge length of the reconstructed 3D volume in micrometres.
                  The procedure registers the target voxel size, set based on the smallest feature to
                  be resolved (target voxel size ≤ ~1/3 of that feature size; see the criterion recorded
                  under Partial Volume Effect Criteria). At analysis level, record the achieved voxel
                  size as reported by the reconstruction software, which may differ slightly from the
                  target due to final geometric calibration.
                anyOf:
                - type: number
                - type: string
              schema:manufacturer:
                type: object
                properties:
                  schema:name:
                    description: Manufacturer of the instrument that performs the measurement, recorded
                      as a controlled value so that procedures can be found by vendor. Where a procedure
                      couples a sample-introduction system to an analysing instrument, this records the
                      analysing instrument. Instrument Model gives the specific designation.
                    type: string
                    enum:
                    - Nikon
                    - Zeiss
                    - Bruker
                    - GE / Waygate
                    - North Star Imaging
                    - RX Solutions
                    - Custom-built
                    - Unknown
                    - N/A
                    - None
                    - missing
                    readOnly: true
              schema:model:
                type: object
                properties:
                  schema:name:
                    description: Model designation of the instrument that performs the measurement, including
                      any generation or configuration suffix. Conventionally written with the manufacturer
                      name included; Instrument Manufacturer records the vendor separately, as a controlled
                      value, so that procedures remain findable by vendor.
                    type: string
                    readOnly: true
      allOf:
      - contains:
          properties:
            schema:additionalType:
              contains:
                const: XCT
          required:
          - schema:additionalType
    ada:rotationRangeDefault:
      description: Total angular range over which projection images are acquired, in degrees. Full 360°
        rotation is standard for cone-beam lab XCT. 180° rotation (half-scan) is sometimes used for faster
        acquisition but may introduce additional artifacts.
      anyOf:
      - type: number
      - type: string
    ada:numberOfProjectionsDefault:
      description: Total number of equally-spaced projection images acquired over the full rotation range.
        More projections improve reconstruction quality by reducing under-sampling streak artifacts but
        increase scan time. For Mode B (multi-volume stitching), this is the number per sub-volume.
      anyOf:
      - type: integer
      - type: string
    ada:exposureTimePerProjectionDefault:
      description: 'Duration of X-ray exposure for each individual projection image frame, in seconds,
        as registered by the procedure. Set as a deliberate choice for the target sample type and voxel
        size: longer exposures increase SNR at the cost of total scan time. May be adjusted within procedure-allowed
        bounds for samples that are unusually dense or unusually transparent. If the exposure time was
        varied across samples within the same procedure or session, report the full range applied (e.g.,
        0.5–2 s).'
      anyOf:
      - type: number
      - type: string
    ada:rotationModeDefault:
      description: Whether projection images are acquired during continuous sample rotation (faster; may
        introduce slight motion blur at high rotation speeds) or at discrete step positions with the stage
        stationary during each exposure (stop-and-shoot; eliminates motion blur). Continuous rotation
        has been associated with sub-volume rotational mismatch artifacts in multi-volume stitching workflows
        (Eckley et al. 2025).
      type: string
      enum:
      - Step rotation (stop-and-shoot)
      - Continuous rotation
      - N/A
      - None
      - missing
    ada:samplingUnit:
      description: The physical subdivision of the sample to which one row of reported values corresponds
        — the unit that is analysed and reported, as distinct from the sample as a whole. State the unit
        type at procedure level and the units actually analysed at analysis level. Where units nest (e.g.
        confined tracks within grains), state both levels.
      anyOf:
      - type: string
        enum:
        - Whole sample
        - Aliquot
        - Grain
        - Spot
        - Analysis point
        - Phase
        - Sub-volume
        - Region of interest
        - N/A
        - None
        - missing
      - type: string
    ada:minimumSubVolumeOverlap:
      description: Minimum number of reconstructed slices that must overlap between adjacent sub-volumes
        in a stitched dataset. This is a procedure-level quality specification. Eckley et al. (2025) report
        that 500 slices of overlap were used in the Apollo 73001 stitching workflow, while 180 slices
        proved insufficient for their cone-beam geometry.
      anyOf:
      - type: integer
      - type: string
      readOnly: true
    ada:targetSelectionCriteriaDefault:
      description: 'The rules governing which part of the sample is analysed, and why. Covers the criteria
        applied when choosing grains, aliquots, spots, or a region of interest — size, morphology, clarity,
        freedom from inclusions or alteration, phase identity, or spatial position. Distinct from Target
        Material, which states the material type the procedure is designed for: this field states how,
        within such a sample, the analysed portion is picked out.'
      type: string
    ada:reconstructionAlgorithm:
      description: Mathematical algorithm used to reconstruct the 3D CT volume from 2D projection images.
        The Feldkamp-Davis-Kress (FDK) algorithm is standard for cone-beam lab XCT geometry; iterative
        methods offer better artifact suppression at the cost of computation time.
      anyOf:
      - type: string
        enum:
        - FDK (Feldkamp-Davis-Kress, cone-beam)
        - FBP (filtered back-projection, parallel-beam)
        - Iterative reconstruction
        - SART
        - N/A
        - None
        - missing
      - type: string
      readOnly: true
    ada:beamHardeningCorrectionMethod:
      description: 'Strategy used to reduce beam hardening artifacts caused by preferential attenuation
        of low-energy photons in polychromatic cone-beam XCT. Beam hardening causes cupping artifacts
        (CT numbers elevated at sample edges relative to the interior) and can bias segmentation thresholds.
        Hardware pre-filtering (Group 4: X-ray Pre-filter) and software correction are complementary approaches.
        The method is a procedure-level design choice; the specific correction parameter value is session-specific
        and recorded separately at analysis level.'
      anyOf:
      - type: string
        enum:
        - Software polynomial correction (instrument-specific algorithm)
        - Ketcham & Hanna (2014) iterative BH correction
        - None applied
        - N/A
        - missing
      - type: string
      readOnly: true
    ada:outputDataFormatDefault:
      description: File format of the reconstructed CT volume as output by the reconstruction software.
        Bit depth is recorded separately in Output Bit Depth.
      anyOf:
      - type: string
        enum:
        - TIFF image stack
        - VGI/VOL (VGStudio)
        - RAW volume
        - DICOM
        - N/A
        - None
        - missing
      - type: string
    ada:segmentationMethodDefault:
      description: General approach used to separate distinct phases or features in the reconstructed
        CT volume. The method must be reported for any quantitative result to be reproducible.
      anyOf:
      - type: string
        enum:
        - Global threshold (single CT number boundary)
        - Multi-threshold (separate CT number range per phase)
        - Manual threshold per phase
        - 'Semi-automated: threshold + morphological filtering'
        - N/A
        - None
        - missing
      - type: string
    ada:reportedProperties:
      type: array
      items:
        description: The final variable(s) this procedure reports and their units — distinct from the
          fields recording what was *acquired* rather than what is reported. A procedure may acquire many
          channels and report a small number of derived quantities; without this field a data consumer
          cannot tell which. Record every reported variable, including intermediate quantities reported
          alongside final ones (e.g. both the 206Pb/238U ratio and the 206Pb/238U date). Where a reported
          variable is a nominal property with no magnitude (e.g. a mineral identification), record the
          variable and give the unit as 'N/A — nominal property'.
        type: string
        readOnly: true
    schema:description:
      description: 'Any procedure- or analysis-specific information not captured by a structured field
        anywhere in this TAPP — including anomalies, deviations from the registered procedure, instrument
        modifications, and supplementary context. Scope is the whole document, not Group 6: this is the
        last field of the TAPP and covers all six groups. Use sparingly; a structured field is preferred
        for anything that can be formally categorised.'
      type: string
  required:
  - schema:name
  - schema:datePublished
  - ada:targetFeature
  - ada:applicableSampleDimensionRange
  - ada:xRaySourceConfiguration
  - ada:detectorType
  - ada:rotationRangeDefault
  - ada:numberOfProjectionsDefault
  - ada:exposureTimePerProjectionDefault
  - ada:rotationModeDefault
  - ada:samplingUnit
  - ada:minimumSubVolumeOverlap
  - ada:targetSelectionCriteriaDefault
  - ada:reconstructionAlgorithm
  - ada:beamHardeningCorrectionMethod
  - ada:outputDataFormatDefault
  - ada:segmentationMethodDefault
