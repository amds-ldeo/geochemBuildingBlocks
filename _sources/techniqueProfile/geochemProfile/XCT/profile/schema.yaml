$schema: https://json-schema.org/draft/2020-12/schema
title: ADA Lab-XCT Product Profile
description: Path-driven technique-specific profile for ADA Lab-XCT Product Profile. Extends the base ADA product profile with the LABXCT analysis-instance detail on the schema:Dataset root, and pins the product type and the profile it declares conformance to.
allOf:
- $ref: ../../../../BaseSchema/geochemProduct/schema.yaml
- $ref: ../detail/schema.yaml
- type: object
  properties:
    schema:additionalType:
      description: Must include a LABXCT product type identifier.
      contains:
        enum:
        - X-ray Computed Tomography (XCT) Image Collection
        - X-ray computed tomography
      title: Product Type
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaLabXCT
      title: About This Record
