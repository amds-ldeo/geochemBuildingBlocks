$schema: https://json-schema.org/draft/2020-12/schema
title: ADA PCD-AFM Product Profile
description: Path-driven technique-specific profile for ADA PCD-AFM Product Profile. Extends the base ADA product profile with the PCDAFM analysis-instance detail on the schema:Dataset root, and pins the product type and the profile it declares conformance to.
allOf:
- $ref: ../../../../BaseSchema/geochemProduct/schema.yaml
- $ref: ../detail/schema.yaml
- type: object
  properties:
    schema:additionalType:
      description: Must include a PCDAFM product type identifier.
      contains:
        enum:
        - Particle cohesion determination with AFM
        - Particle cohesion determination with AFM (PCDAFM)
      title: Product Type
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaPCDAFM
      title: About This Record
