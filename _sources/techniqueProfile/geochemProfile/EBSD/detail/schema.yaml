$schema: https://json-schema.org/draft/2020-12/schema
title: Electron Backscatter Diffraction Analysis Detail
description: Detail block for EBSD hasPart items. The per-analysis properties are working distance, camera exposure time, map step size and indexing rate; the map step size is usually given in the source's per-sample tables rather than its prose.
allOf:
- $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/AnalysisIdentification
- $ref: ../../../../BaseSchema/modules/calibrationFactor/schema.yaml#/$defs/AnalysisIdentification
- type: object
  properties:
    prov:wasGeneratedBy:
      type: array
      items:
        type: object
        properties:
          schema:additionalProperty:
            type: array
            items:
              anyOf:
              - $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Analysis_samplingUnitSelectionCriteria
              - $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/Param_Analysis_constantsReferenceValues
              - &id001
                title: EBSD Camera Exposure Time
                description: Exposure time per EBSD pattern.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/ebsdTAPP/ebsdCameraExposureTime
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/ebsdTAPP/ebsdCameraExposureTime
                  schema:name:
                    const: EBSD Camera Exposure Time
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id002
                title: Hough Resolution
                description: Hough transform resolution used for band detection.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/ebsdTAPP/houghResolution
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/ebsdTAPP/houghResolution
                  schema:name:
                    const: Hough Resolution
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id003
                title: Map Step Size
                description: Step size of the EBSD map.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/ebsdTAPP/mapStepSize
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/ebsdTAPP/mapStepSize
                  schema:name:
                    const: Map Step Size
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id004
                title: EBSD Indexing Rate
                description: Pattern collection and indexing rate.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/ebsdTAPP/ebsdIndexingRate
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/ebsdTAPP/ebsdIndexingRate
                  schema:name:
                    const: EBSD Indexing Rate
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id005
                title: EDS Channels
                description: Number of channels EDS spectra are collected on.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/ebsdTAPP/edsChannels
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/ebsdTAPP/edsChannels
                  schema:name:
                    const: EDS Channels
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id006
                title: EDS Process Time
                description: AZtec process time setting for EDS.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/ebsdTAPP/edsProcessTime
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/ebsdTAPP/edsProcessTime
                  schema:name:
                    const: EDS Process Time
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id007
                title: Crystal Structure File Sources
                description: Databases the match units / crystal structure files were drawn from.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/ebsdTAPP/crystalStructureFileSources
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/ebsdTAPP/crystalStructureFileSources
                  schema:name:
                    const: Crystal Structure File Sources
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
            allOf:
            - contains:
                $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Analysis_samplingUnitSelectionCriteria
              minContains: 0
              maxContains: 1
            - contains:
                $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/Param_Analysis_constantsReferenceValues
              minContains: 0
              maxContains: 1
            - contains: *id001
              minContains: 0
              maxContains: 1
            - contains: *id002
              minContains: 0
              maxContains: 1
            - contains: *id003
              minContains: 0
              maxContains: 1
            - contains: *id004
              minContains: 0
              maxContains: 1
            - contains: *id005
              minContains: 0
              maxContains: 1
            - contains: *id006
              minContains: 0
              maxContains: 1
            - contains: *id007
              minContains: 0
              maxContains: 1
          schema:object:
            type: array
            items:
              type: object
              allOf:
              - if:
                  properties:
                    '@type':
                      contains:
                        const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                  required:
                  - '@type'
                then:
                  properties:
                    schema:additionalProperty:
                      type: array
                      items:
                        $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Analysis_preAnalysisImagingAndScreening
                      allOf:
                      - contains:
                          $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Analysis_preAnalysisImagingAndScreening
                        minContains: 0
                        maxContains: 1
          prov:used:
            type: array
            items:
              type: object
              allOf:
              - if:
                  required:
                  - schema:instrument
                then:
                  properties:
                    schema:instrument:
                      type: array
                      items:
                        allOf:
                        - $ref: ../../../../BaseSchema/instrument/schema.yaml
                        - type: object
                          allOf:
                          - if:
                              properties:
                                schema:additionalType:
                                  contains:
                                    const: SEM
                                  schema:inDefinedTermSet: ada:vocab/instrumentType
                              required:
                              - schema:additionalType
                            then:
                              properties:
                                schema:additionalProperty:
                                  type: array
                                  items:
                                    anyOf:
                                    - &id008
                                      title: Accelerating Voltage
                                      description: Electron beam accelerating voltage.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/ebsdTAPP/acceleratingVoltage
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/ebsdTAPP/acceleratingVoltage
                                        schema:name:
                                          const: Accelerating Voltage
                                        schema:value:
                                          anyOf:
                                          - type: number
                                          - type: string
                                        schema:unitText:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                      - schema:unitText
                                    - &id009
                                      title: Beam Current
                                      description: Beam current at the sample.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/ebsdTAPP/beamCurrent
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/ebsdTAPP/beamCurrent
                                        schema:name:
                                          const: Beam Current
                                        schema:value:
                                          anyOf:
                                          - type: number
                                          - type: string
                                        schema:unitText:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                      - schema:unitText
                                    - &id010
                                      title: Working Distance
                                      description: Working distance during mapping.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/ebsdTAPP/workingDistance
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/ebsdTAPP/workingDistance
                                        schema:name:
                                          const: Working Distance
                                        schema:value:
                                          anyOf:
                                          - type: number
                                          - type: string
                                        schema:unitText:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                      - schema:unitText
                                  allOf:
                                  - contains: *id008
                                    minContains: 0
                                    maxContains: 1
                                  - contains: *id009
                                    minContains: 0
                                    maxContains: 1
                                  - contains: *id010
                                    minContains: 0
                                    maxContains: 1
                      allOf:
                      - contains:
                          properties:
                            schema:additionalType:
                              contains:
                                const: SEM
                              schema:inDefinedTermSet: ada:vocab/instrumentType
                          required:
                          - schema:additionalType
