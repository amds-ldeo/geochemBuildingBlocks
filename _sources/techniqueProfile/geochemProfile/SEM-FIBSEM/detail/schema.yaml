$schema: https://json-schema.org/draft/2020-12/schema
title: FIB-SEM Analysis Detail
description: Detail block for FIB-SEM hasPart items. Discriminates on ada:componentType, carries analysis-level
  required properties and an @id reference to a registered semFibsemTAPP definition, and per-dataset schema:additionalProperty
  entries constrained via $refs to the parameterValues registry plus a catch-all. Generated by tools/build_tapp.py.
allOf:
- $ref: ../../../../BaseSchema/modules/group1/schema.yaml#/$defs/AnalysisIdentification
- type: object
  properties:
    prov:wasGeneratedBy:
      type: array
      items:
        type: object
        properties:
          schema:actionProcess:
            type: object
            properties:
              schema:step:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:name:
                          const: Sample preparation
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:description:
                          description: Method by which samples were prepared for SEM analysis prior to
                            loading in the instrument. Includes mounting medium (epoxy, carbon tape, stub),
                            polishing steps (alumina, colloidal silica, argon ion mill), and conductive
                            coating type and thickness. For VP-SEM/ESEM analyses, note whether an uncoated
                            sample was used and the gas type used. FIB-specific in-session operations
                            (protective coating deposition, milling conditions, lamella preparation) are
                            documented separately in Group 4.
                          anyOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                        schema:additionalProperty:
                          type: array
                          items: &id001
                            title: Protective Coating Deposition
                            description: 'Type and deposition conditions of the protective coating applied
                              to the sample surface before FIB milling. E-beam deposition causes less
                              surface damage than ion-beam deposition and should be applied as the initial
                              layer. Typical coatings: platinum (Pt) or carbon (C). State material, deposition
                              method, beam conditions, and approximate thickness.'
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/semFibsemTAPP/protectiveCoatingDeposition
                              '@type':
                                const:
                                - schema:PropertyValue
                              schema:propertyID:
                                const:
                                - '@id': ada:parameter/semFibsemTAPP/protectiveCoatingDeposition
                              schema:name:
                                const: Protective Coating Deposition
                              schema:value:
                                type: string
                            required:
                            - '@id'
                            - '@type'
                            - schema:propertyID
                            - schema:name
                            - schema:value
                          allOf:
                          - contains: *id001
                            minContains: 0
                            maxContains: 1
                  - if:
                      properties:
                        schema:name:
                          const: Ion milling
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items:
                            anyOf:
                            - &id002
                              title: Coarse Milling Conditions
                              description: 'Ion beam voltage and current used for bulk material removal
                                during FIB milling. For TEM specimen preparation: bulk trenching to isolate
                                the lamella and intermediate thinning. For 3D tomography: face preparation
                                and initial slice removal.'
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/semFibsemTAPP/coarseMillingConditions
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/semFibsemTAPP/coarseMillingConditions
                                schema:name:
                                  const: Coarse Milling Conditions
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            - &id003
                              title: Fine Polishing Conditions
                              description: Ion beam voltage and current for final thinning and surface
                                polishing of the TEM lamella. Low-voltage polishing (2 kV or below) minimises
                                Ga implantation depth, surface amorphisation, and curtaining artifacts.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/semFibsemTAPP/finePolishingConditions
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/semFibsemTAPP/finePolishingConditions
                                schema:name:
                                  const: Fine Polishing Conditions
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            - &id004
                              title: Foil Thickness
                              description: 'Target thickness of the electron-transparent TEM lamella after
                                final FIB polishing, in nanometres. Actual thickness may differ from target.
                                Typical range: 50-150 nm for standard TEM/STEM; 200-600 nm for XANES or
                                tomography sections.'
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/semFibsemTAPP/foilThickness
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/semFibsemTAPP/foilThickness
                                schema:name:
                                  const: Foil Thickness
                                schema:value:
                                  anyOf:
                                  - type: number
                                  - type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            - &id005
                              title: Slice Thickness
                              description: Thickness of each FIB-milled slice during serial sectioning
                                in nanometres. Controls the Z-axis resolution of the 3D reconstruction.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/semFibsemTAPP/sliceThickness
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/semFibsemTAPP/sliceThickness
                                schema:name:
                                  const: Slice Thickness
                                schema:value:
                                  anyOf:
                                  - type: number
                                  - type: string
                                schema:unitText:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                              - schema:unitText
                          allOf:
                          - contains: *id002
                            minContains: 0
                            maxContains: 1
                          - contains: *id003
                            minContains: 0
                            maxContains: 1
                          - contains: *id004
                            minContains: 0
                            maxContains: 1
                          - contains: *id005
                            minContains: 0
                            maxContains: 1
                        schema:description:
                          description: Ion beam voltage and current used to mill each slice during FIB-SEM
                            serial sectioning. These parameters determine material removal rate per slice
                            and exposed surface quality.
                          anyOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                  - if:
                      properties:
                        schema:name:
                          const: Data reduction
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items: &id006
                            title: Constants and Reference Values Used
                            description: Physical constants and reference values used in data reduction
                              to calculate the final reported quantity (e.g., decay constants for age
                              calculation, standard isotope ratios, or other citable reference values
                              used in a correction or calculation), together with their source. Distinct
                              from the Group 6 reference-material fields, which document accepted values
                              for specific calibration/validation materials rather than universal physical
                              constants. Record "None" if no citable, revisable physical constants feed
                              into this procedure's data reduction.
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/semFibsemTAPP/constantsAndReferenceValuesUsed
                              '@type':
                                const:
                                - schema:PropertyValue
                              schema:propertyID:
                                const:
                                - '@id': ada:parameter/semFibsemTAPP/constantsAndReferenceValuesUsed
                              schema:name:
                                const: Constants and Reference Values Used
                              schema:value:
                                type: string
                            required:
                            - '@id'
                            - '@type'
                            - schema:propertyID
                            - schema:name
                            - schema:value
                          allOf:
                          - contains: *id006
                            minContains: 0
                            maxContains: 1
                allOf:
                - contains:
                    properties:
                      schema:name:
                        const: Sample preparation
                    required:
                    - schema:name
                - contains:
                    properties:
                      schema:name:
                        const: Ion milling
                    required:
                    - schema:name
                - contains:
                    properties:
                      schema:name:
                        const: Data reduction
                    required:
                    - schema:name
          schema:object:
            type: array
            items:
              type: object
              allOf:
              - if:
                  properties:
                    '@type':
                      contains:
                        const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                  required:
                  - '@type'
                then:
                  properties:
                    schema:name:
                      description: Name or identifier of each sample analysed in this session, as used
                        in the laboratory — a sample mount, section or aliquot counts as one entry where
                        that is what the laboratory tracks. The analysis record corresponds to one session
                        and may cover several samples; fields whose Keyed By column declares 'sample'
                        take one value per entry. Should match the identifier used in associated publications
                        or data tables.
                      anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    schema:identifier:
                      description: Globally unique, persistent identifier for each sample listed in Sample
                        Name. IGSN (International Geo Sample Number) is the recommended standard for geological
                        and cosmochemical samples, as used by Astromat, EarthChem and SESAR. Where a sample
                        and its sub-samples are separately registered, record the identifier at the level
                        actually analysed.
                      anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
            allOf:
            - contains:
                properties:
                  '@type':
                    contains:
                      const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                required:
                - '@type'
          prov:used:
            type: array
            items:
              type: object
              allOf:
              - if:
                  required:
                  - bios:computationalTool
                then:
                  properties:
                    bios:computationalTool:
                      type: array
                      items:
                        allOf:
                        - $ref: ../../../../BaseSchema/geochemProduct/schema.yaml#/$defs/UsedComputationalTool
                        - type: object
                          allOf:
                          - if:
                              properties:
                                ada:toolRole:
                                  const: acquisition
                              required:
                              - ada:toolRole
                            then:
                              properties:
                                schema:name:
                                  description: Software used to control the SEM and acquire data, including
                                    version number. For FIB-SEM 3D tomography, include the automated slice-and-view
                                    module name and version.
                                  anyOf:
                                  - type: string
                                  - type: array
                                    items:
                                      type: string
                          - if:
                              properties:
                                ada:toolRole:
                                  const: dataReduction
                              required:
                              - ada:toolRole
                            then:
                              properties:
                                schema:name:
                                  description: Software used for post-acquisition data reduction and analysis.
                                    List all packages with version numbers.
                                  anyOf:
                                  - type: string
                                  - type: array
                                    items:
                                      type: string
                          required:
                          - ada:toolRole
              - if:
                  required:
                  - schema:instrument
                then:
                  properties:
                    schema:instrument:
                      type: array
                      items:
                        allOf:
                        - $ref: ../../../../BaseSchema/instrument/schema.yaml
                        - type: object
                          allOf:
                          - if:
                              properties:
                                schema:additionalType:
                                  contains:
                                    const: SEM
                              required:
                              - schema:additionalType
                            then:
                              properties:
                                ada:acceleratingVoltage:
                                  description: Electron beam accelerating voltage in kilovolts. Affects
                                    X-ray generation depth (EDS/WDS), EBSD pattern quality, imaging resolution,
                                    and beam penetration. Low voltages (1-5 kV) improve surface sensitivity
                                    and reduce beam damage; high voltages (15-20 kV) improve X-ray generation
                                    for quantitative analysis.
                                  anyOf:
                                  - type: number
                                  - type: string
                                ada:workingDistance:
                                  description: Distance between the objective lens pole piece and the
                                    specimen surface in millimetres. Affects spatial resolution, depth
                                    of focus, EDS X-ray take-off angle, and EBSD geometry.
                                  anyOf:
                                  - type: number
                                  - type: string
                      allOf:
                      - contains:
                          properties:
                            schema:additionalType:
                              contains:
                                const: SEM
                          required:
                          - schema:additionalType
          schema:additionalProperty:
            type: array
            items: &id007
              title: Dwell Time per Pixel
              description: Time the electron beam dwells on each pixel during raster scanning (imaging
                modes) or on each step position during compositional mapping (EDS and WDS mapping modes),
                in microseconds or milliseconds. Longer dwell time improves signal-to-noise and counting
                statistics but increases total dose and can cause beam damage or contamination on sensitive
                materials. For WDS mapping, the dwell time is per spectrometer per pixel.
              type: object
              properties:
                '@id':
                  const: ada:parameter/semFibsemTAPP/dwellTimePerPixel
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                  - '@id': ada:parameter/semFibsemTAPP/dwellTimePerPixel
                schema:name:
                  const: Dwell Time per Pixel
                schema:value:
                  anyOf:
                  - type: number
                  - type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            allOf:
            - contains: *id007
              minContains: 0
              maxContains: 1
          ada:imageRegistration3D:
            description: Method used to align consecutive SEM image slices in the 3D stack to correct
              for drift, vibration, and curtaining artifacts. Include software used.
            type: string
          ada:segmentationMethod3D:
            description: Method and software used to segment phases and features in the aligned 3D image
              stack, transforming the grayscale stack into labelled 3D regions (pores, mineral phases,
              grain boundaries, organic matter).
            type: string
          schema:description:
            description: 'Any procedure- or analysis-specific information not captured by a structured
              field anywhere in this TAPP — including anomalies, deviations from the registered procedure,
              instrument modifications, and supplementary context. Scope is the whole document, not Group
              6: this is the last field of the TAPP and covers all six groups. Use sparingly; a structured
              field is preferred for anything that can be formally categorised.'
            type: string
    ada:voxelSize:
      description: X, Y, Z dimensions of the reconstructed 3D voxel in nanometres (X-Y pixel size from
        SEM image calibration; Z from slice thickness), and the total number of slices in the stack. Determined
        at analysis time.
      type: string
  required:
  - ada:voxelSize
