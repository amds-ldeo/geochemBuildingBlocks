$schema: https://json-schema.org/draft/2020-12/schema
title: FIB-SEM Analysis Detail
description: Detail block for FIB-SEM hasPart items. Discriminates on ada:componentType, carries analysis-level
  required properties and an @id reference to a registered semFibsemTAPP definition, and per-dataset schema:additionalProperty
  entries constrained via $refs to the parameterValues registry plus a catch-all. Generated by tools/build_tapp.py.
allOf:
- $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/AnalysisIdentification
- type: object
  properties:
    prov:wasGeneratedBy:
      type: array
      items:
        type: object
        properties:
          schema:additionalProperty:
            type: array
            items:
              anyOf:
              - $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Analysis_samplingUnitSelectionCriteria
              - &id001
                title: Dwell Time per Pixel
                description: Time the electron beam dwells on each pixel during raster scanning, or on
                  each step position during mapping, in microseconds or milliseconds.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semFibsemTAPP/dwellTimePerPixel
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semFibsemTAPP/dwellTimePerPixel
                  schema:name:
                    const: Dwell Time per Pixel
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id002
                title: 3D Image Registration
                description: Method used to align consecutive SEM image slices in the 3D stack to correct
                  for drift, vibration, and curtaining artifacts. Include software used.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semFibsemTAPP/imageRegistration3D
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semFibsemTAPP/imageRegistration3D
                  schema:name:
                    const: 3D Image Registration
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id003
                title: Segmentation Method
                description: Method and software used to separate distinct phases or features in the reconstructed
                  3D volume, turning the grayscale volume into labelled regions.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semFibsemTAPP/segmentationMethod
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semFibsemTAPP/segmentationMethod
                  schema:name:
                    const: Segmentation Method
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
            allOf:
            - contains:
                $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Analysis_samplingUnitSelectionCriteria
              minContains: 0
              maxContains: 1
            - contains: *id001
              minContains: 0
              maxContains: 1
            - contains: *id002
              minContains: 0
              maxContains: 1
            - contains: *id003
              minContains: 0
              maxContains: 1
          schema:object:
            type: array
            items:
              type: object
              allOf:
              - if:
                  properties:
                    '@type':
                      contains:
                        const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                  required:
                  - '@type'
                then:
                  properties:
                    schema:additionalProperty:
                      type: array
                      items:
                        $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Analysis_preAnalysisImagingAndScreening
                      allOf:
                      - contains:
                          $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Analysis_preAnalysisImagingAndScreening
                        minContains: 0
                        maxContains: 1
          prov:used:
            type: array
            items:
              type: object
              allOf:
              - if:
                  required:
                  - schema:instrument
                then:
                  properties:
                    schema:instrument:
                      type: array
                      items:
                        allOf:
                        - $ref: ../../../../BaseSchema/instrument/schema.yaml
                        - type: object
                          allOf:
                          - if:
                              properties:
                                schema:additionalType:
                                  contains:
                                    const: SEM
                                  schema:inDefinedTermSet: ada:vocab/instrumentType
                              required:
                              - schema:additionalType
                            then:
                              properties:
                                schema:additionalProperty:
                                  type: array
                                  items:
                                    anyOf:
                                    - &id004
                                      title: Accelerating Voltage
                                      description: Electron beam accelerating voltage in kilovolts.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/semFibsemTAPP/acceleratingVoltage
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/semFibsemTAPP/acceleratingVoltage
                                        schema:name:
                                          const: Accelerating Voltage
                                        schema:value:
                                          anyOf:
                                          - type: number
                                          - type: string
                                        schema:unitText:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                      - schema:unitText
                                    - &id005
                                      title: Working Distance
                                      description: Distance between the objective lens pole piece and
                                        the specimen surface in millimetres.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/semFibsemTAPP/workingDistance
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/semFibsemTAPP/workingDistance
                                        schema:name:
                                          const: Working Distance
                                        schema:value:
                                          anyOf:
                                          - type: number
                                          - type: string
                                        schema:unitText:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                      - schema:unitText
                                  allOf:
                                  - contains: *id004
                                    minContains: 0
                                    maxContains: 1
                                  - contains: *id005
                                    minContains: 0
                                    maxContains: 1
                      allOf:
                      - contains:
                          properties:
                            schema:additionalType:
                              contains:
                                const: SEM
                              schema:inDefinedTermSet: ada:vocab/instrumentType
                          required:
                          - schema:additionalType
          schema:actionProcess:
            type: object
            properties:
              schema:step:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:name:
                          const: Sample preparation
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items:
                            anyOf:
                            - &id006
                              title: Protective Coating Deposition
                              description: 'Type and deposition conditions of the protective coating applied
                                to the sample surface before FIB milling. E-beam deposition should be
                                applied as the initial layer. Typical coatings: platinum (Pt) or carbon
                                (C). State material, deposition method, beam conditions, and approximate
                                thickness.'
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/semFibsemTAPP/protectiveCoatingDeposition
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/semFibsemTAPP/protectiveCoatingDeposition
                                schema:name:
                                  const: Protective Coating Deposition
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            - &id007
                              title: Coarse Milling Conditions
                              description: 'Ion beam voltage and current used for bulk material removal
                                during FIB milling. For TEM specimen preparation: bulk trenching to isolate
                                the lamella and intermediate thinning. For 3D tomography: face preparation
                                and initial slice removal.'
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/semFibsemTAPP/coarseMillingConditions
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/semFibsemTAPP/coarseMillingConditions
                                schema:name:
                                  const: Coarse Milling Conditions
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                          allOf:
                          - contains: *id006
                            minContains: 0
                            maxContains: 1
                          - contains: *id007
                            minContains: 0
                            maxContains: 1
                  - if:
                      properties:
                        schema:name:
                          const: Ion milling
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items:
                            anyOf:
                            - &id008
                              title: Fine Polishing Conditions
                              description: Ion beam voltage and current for final thinning and surface
                                polishing of the TEM lamella.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/semFibsemTAPP/finePolishingConditions
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/semFibsemTAPP/finePolishingConditions
                                schema:name:
                                  const: Fine Polishing Conditions
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            - &id009
                              title: Foil Thickness
                              description: Target thickness of the electron-transparent TEM lamella after
                                final FIB polishing, in nanometres. Actual thickness may differ from target.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/semFibsemTAPP/foilThickness
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/semFibsemTAPP/foilThickness
                                schema:name:
                                  const: Foil Thickness
                                schema:value:
                                  anyOf:
                                  - type: number
                                  - type: string
                                schema:unitText:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                              - schema:unitText
                            - &id010
                              title: Slice Thickness
                              description: Thickness of each FIB-milled slice during serial sectioning
                                in nanometres.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/semFibsemTAPP/sliceThickness
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/semFibsemTAPP/sliceThickness
                                schema:name:
                                  const: Slice Thickness
                                schema:value:
                                  anyOf:
                                  - type: number
                                  - type: string
                                schema:unitText:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                              - schema:unitText
                          allOf:
                          - contains: *id008
                            minContains: 0
                            maxContains: 1
                          - contains: *id009
                            minContains: 0
                            maxContains: 1
                          - contains: *id010
                            minContains: 0
                            maxContains: 1
                        schema:description:
                          description: Ion beam voltage and current used to mill each slice during FIB-SEM
                            serial sectioning.
                          anyOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                  - if:
                      properties:
                        schema:name:
                          const: Data reduction
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items:
                            $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/Param_Analysis_constantsReferenceValues
                          allOf:
                          - contains:
                              $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/Param_Analysis_constantsReferenceValues
                            minContains: 0
                            maxContains: 1
                allOf:
                - contains:
                    properties:
                      schema:name:
                        const: Sample preparation
                    required:
                    - schema:name
                - contains:
                    properties:
                      schema:name:
                        const: Ion milling
                    required:
                    - schema:name
                - contains:
                    properties:
                      schema:name:
                        const: Data reduction
                    required:
                    - schema:name
    ada:voxelSize:
      description: X, Y, Z dimensions of the reconstructed 3D voxel in nanometres (X-Y pixel size from
        SEM image calibration; Z from slice thickness), and the total number of slices in the stack.
      type: string
  required:
  - ada:voxelSize
