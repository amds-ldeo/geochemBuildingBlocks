$schema: https://json-schema.org/draft/2020-12/schema
title: Scanning Transmission Electron Microscopy Analysis Detail
description: Detail block for STEM hasPart items. Image pixel size and image dimensions are the only properties both laboratories record, and the pixel size appears in m, nm and um, so it needs normalising before values are compared.
allOf:
- $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/AnalysisIdentification
- $ref: ../../../../BaseSchema/modules/calibrationFactor/schema.yaml#/$defs/AnalysisIdentification
- type: object
  properties:
    prov:wasGeneratedBy:
      type: array
      items:
        type: object
        properties:
          schema:additionalProperty:
            type: array
            items:
              anyOf:
              - $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Analysis_samplingUnitSelectionCriteria
              - $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/Param_Analysis_constantsReferenceValues
              - &id001
                title: Dwell Time per Probe Position
                description: Dwell time per scanned probe position.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/stemTAPP/dwellTimePerProbePosition
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/stemTAPP/dwellTimePerProbePosition
                  schema:name:
                    const: Dwell Time per Probe Position
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id002
                title: Stage X Position
                description: Stage X position.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/stemTAPP/stageXPosition
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/stemTAPP/stageXPosition
                  schema:name:
                    const: Stage X Position
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id003
                title: Stage Y Position
                description: Stage Y position.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/stemTAPP/stageYPosition
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/stemTAPP/stageYPosition
                  schema:name:
                    const: Stage Y Position
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id004
                title: Stage Tilt Alpha
                description: Primary stage tilt.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/stemTAPP/stageTiltAlpha
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/stemTAPP/stageTiltAlpha
                  schema:name:
                    const: Stage Tilt Alpha
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id005
                title: Stage Tilt Beta
                description: Secondary stage tilt.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/stemTAPP/stageTiltBeta
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/stemTAPP/stageTiltBeta
                  schema:name:
                    const: Stage Tilt Beta
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
            allOf:
            - contains:
                $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Analysis_samplingUnitSelectionCriteria
              minContains: 0
              maxContains: 1
            - contains:
                $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/Param_Analysis_constantsReferenceValues
              minContains: 0
              maxContains: 1
            - contains: *id001
              minContains: 0
              maxContains: 1
            - contains: *id002
              minContains: 0
              maxContains: 1
            - contains: *id003
              minContains: 0
              maxContains: 1
            - contains: *id004
              minContains: 0
              maxContains: 1
            - contains: *id005
              minContains: 0
              maxContains: 1
          schema:object:
            type: array
            items:
              type: object
              allOf:
              - if:
                  properties:
                    '@type':
                      contains:
                        const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                  required:
                  - '@type'
                then:
                  properties:
                    schema:additionalProperty:
                      type: array
                      items:
                        $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Analysis_preAnalysisImagingAndScreening
                      allOf:
                      - contains:
                          $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Analysis_preAnalysisImagingAndScreening
                        minContains: 0
                        maxContains: 1
          prov:used:
            type: array
            items:
              type: object
              allOf:
              - if:
                  required:
                  - schema:instrument
                then:
                  properties:
                    schema:instrument:
                      type: array
                      items:
                        allOf:
                        - $ref: ../../../../BaseSchema/instrument/schema.yaml
                        - type: object
                          allOf:
                          - if:
                              properties:
                                schema:additionalType:
                                  contains:
                                    const: STEM
                              required:
                              - schema:additionalType
                            then:
                              properties:
                                schema:additionalProperty:
                                  type: array
                                  items:
                                    anyOf:
                                    - &id006
                                      title: Magnification
                                      description: Nominal magnification.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/stemTAPP/magnification
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/stemTAPP/magnification
                                        schema:name:
                                          const: Magnification
                                        schema:value:
                                          anyOf:
                                          - type: number
                                          - type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                    - &id007
                                      title: Camera Length
                                      description: Camera length.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/stemTAPP/cameraLength
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/stemTAPP/cameraLength
                                        schema:name:
                                          const: Camera Length
                                        schema:value:
                                          anyOf:
                                          - type: number
                                          - type: string
                                        schema:unitText:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                      - schema:unitText
                                  allOf:
                                  - contains: *id006
                                    minContains: 0
                                    maxContains: 1
                                  - contains: *id007
                                    minContains: 0
                                    maxContains: 1
                      allOf:
                      - contains:
                          properties:
                            schema:additionalType:
                              contains:
                                const: STEM
                          required:
                          - schema:additionalType
    schema:distribution:
      type: object
      properties:
        schema:hasPart:
          type: object
          properties:
            schema:width:
              description: Image width in pixels.
              anyOf:
              - type: integer
              - type: string
            schema:height:
              description: Image height in pixels.
              anyOf:
              - type: integer
              - type: string
          required:
          - schema:height
          - schema:width
      required:
      - schema:hasPart
  required:
  - schema:distribution
