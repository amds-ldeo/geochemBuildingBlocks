$schema: https://json-schema.org/draft/2020-12/schema
title: SEM Imaging Analysis Detail
description: Detail block for SEM imaging hasPart items. Discriminates on ada:componentType, carries analysis-level
  required properties and an @id reference to a registered semImagingTAPP definition, and per-dataset
  schema:additionalProperty entries constrained via $refs to the parameterValues registry plus a catch-all.
  Generated by tools/build_tapp.py.
type: object
properties:
  prov:wasGeneratedBy:
    type: array
    items:
      type: object
      properties:
        schema:location:
          type: object
          properties:
            schema:name:
              description: Name of the laboratory or institution hosting the instrument.
              type: string
            schema:identifier:
              description: Persistent identifier for the laboratory (e.g., ROR ID).
              type: string
        schema:identifier:
          description: Identifier for the analytical session this record describes — the laboratory's
            own run, sequence or batch identifier as generated by the instrument or acquisition software.
            The analysis record corresponds to one session, which may cover several samples, and this
            is the link back to the raw instrument files. Distinct from any persistent identifier a repository
            mints on submission.
          type: string
        schema:startDate:
          description: 'Date on which the analytical session began. For sessions spanning multiple days,
            use the date of the first session. Format: YYYY-MM-DD.'
          type: string
        schema:endDate:
          description: 'Date on which the analytical session ended. May equal Analysis Start Date for
            single-day sessions. Format: YYYY-MM-DD.'
          type: string
        schema:actionProcess:
          type: object
          properties:
            schema:step:
              type: array
              items:
                type: object
                allOf:
                - if:
                    properties:
                      schema:name:
                        const: Sample preparation
                    required:
                    - schema:name
                  then:
                    properties:
                      schema:description:
                        description: Method by which samples were prepared for SEM analysis prior to loading
                          in the instrument. Includes mounting medium (epoxy, carbon tape, stub), polishing
                          steps (alumina, colloidal silica, argon ion mill), and conductive coating type
                          and thickness. For VP-SEM/ESEM analyses, note whether an uncoated sample was
                          used and the gas type used. FIB-specific in-session operations (protective coating
                          deposition, milling conditions, lamella preparation) are documented separately
                          in Group 4.
                        anyOf:
                        - type: string
                        - type: array
                          items:
                            type: string
                - if:
                    properties:
                      schema:name:
                        const: Data reduction
                    required:
                    - schema:name
                  then:
                    properties:
                      schema:additionalProperty:
                        type: array
                        items:
                          anyOf:
                          - &id001
                            title: Crystal Structure Database
                            description: Crystal structure database used for EBSD phase identification
                              and Kikuchi pattern simulation.
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/semImagingTAPP/crystalStructureDatabase
                              '@type':
                                const:
                                - schema:PropertyValue
                              schema:propertyID:
                                const:
                                - '@id': ada:parameter/semImagingTAPP/crystalStructureDatabase
                              schema:name:
                                const: Crystal Structure Database
                              schema:value:
                                type: string
                            required:
                            - '@id'
                            - '@type'
                            - schema:propertyID
                            - schema:name
                            - schema:value
                          - &id002
                            title: Constants and Reference Values Used
                            description: Physical constants and reference values used in data reduction
                              to calculate the final reported quantity (e.g., decay constants for age
                              calculation, standard isotope ratios, or other citable reference values
                              used in a correction or calculation), together with their source. Distinct
                              from the Group 6 reference-material fields, which document accepted values
                              for specific calibration/validation materials rather than universal physical
                              constants. Record "None" if no citable, revisable physical constants feed
                              into this procedure's data reduction.
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/semImagingTAPP/constantsAndReferenceValuesUsed
                              '@type':
                                const:
                                - schema:PropertyValue
                              schema:propertyID:
                                const:
                                - '@id': ada:parameter/semImagingTAPP/constantsAndReferenceValuesUsed
                              schema:name:
                                const: Constants and Reference Values Used
                              schema:value:
                                type: string
                            required:
                            - '@id'
                            - '@type'
                            - schema:propertyID
                            - schema:name
                            - schema:value
                        allOf:
                        - contains: *id001
                          minContains: 0
                          maxContains: 1
                        - contains: *id002
                          minContains: 0
                          maxContains: 1
              allOf:
              - contains:
                  properties:
                    schema:name:
                      const: Sample preparation
                  required:
                  - schema:name
              - contains:
                  properties:
                    schema:name:
                      const: Data reduction
                  required:
                  - schema:name
        schema:object:
          type: array
          items:
            type: object
            allOf:
            - if:
                properties:
                  '@type':
                    contains:
                      const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                required:
                - '@type'
              then:
                properties:
                  schema:name:
                    description: Name or identifier of each sample analysed in this session, as used in
                      the laboratory — a sample mount, section or aliquot counts as one entry where that
                      is what the laboratory tracks. The analysis record corresponds to one session and
                      may cover several samples; fields whose Keyed By column declares 'sample' take one
                      value per entry. Should match the identifier used in associated publications or
                      data tables.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  schema:identifier:
                    description: Globally unique, persistent identifier for each sample listed in Sample
                      Name. IGSN (International Geo Sample Number) is the recommended standard for geological
                      and cosmochemical samples, as used by Astromat, EarthChem and SESAR. Where a sample
                      and its sub-samples are separately registered, record the identifier at the level
                      actually analysed.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  schema:additionalProperty:
                    type: array
                    items: &id003
                      title: Pre-Analysis Imaging and Screening
                      description: Imaging or other characterisation performed before the measurement
                        in order to select or locate the analysed target, including the technique, instrument
                        and settings used, and how individual analyses are linked back to the images.
                        Distinct from any imaging the procedure performs as its own measurement. Where
                        the imaging is performed on a separate instrument, it should also be recorded
                        in the Group 1 coupling fields.
                      type: object
                      properties:
                        '@id':
                          const: ada:parameter/semImagingTAPP/preAnalysisImagingAndScreening
                        '@type':
                          const:
                          - schema:PropertyValue
                        schema:propertyID:
                          const:
                          - '@id': ada:parameter/semImagingTAPP/preAnalysisImagingAndScreening
                        schema:name:
                          const: Pre-Analysis Imaging and Screening
                        schema:value:
                          type: string
                      required:
                      - '@id'
                      - '@type'
                      - schema:propertyID
                      - schema:name
                      - schema:value
                    allOf:
                    - contains: *id003
                      minContains: 0
                      maxContains: 1
          allOf:
          - contains:
              properties:
                '@type':
                  contains:
                    const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
              required:
              - '@type'
        schema:additionalProperty:
          type: array
          items:
            anyOf:
            - &id004
              title: Target Selection Criteria
              description: 'The rules governing which part of the sample is analysed, and why. Covers
                the criteria applied when choosing grains, aliquots, spots, or a region of interest —
                size, morphology, clarity, freedom from inclusions or alteration, phase identity, or spatial
                position. Distinct from Target Material, which states the material type the procedure
                is designed for: this field states how, within such a sample, the analysed portion is
                picked out.'
              type: object
              properties:
                '@id':
                  const: ada:parameter/semImagingTAPP/targetSelectionCriteria
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                  - '@id': ada:parameter/semImagingTAPP/targetSelectionCriteria
                schema:name:
                  const: Target Selection Criteria
                schema:value:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id005
              title: Chamber Pressure
              description: Chamber pressure and gas type during analysis. Required for variable pressure
                (VP-SEM) and environmental SEM (ESEM) modes. Report value and unit (Pa or Torr) and gas
                composition. Use 'None' for standard high-vacuum operation.
              type: object
              properties:
                '@id':
                  const: ada:parameter/semImagingTAPP/chamberPressure
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                  - '@id': ada:parameter/semImagingTAPP/chamberPressure
                schema:name:
                  const: Chamber Pressure
                schema:value:
                  anyOf:
                  - type: number
                  - type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id006
              title: Image Pixel Size
              description: Physical size of each image pixel at the sample surface, in nm or µm. Defines
                spatial sampling of SE or BSE images. For large-area mosaic imaging, report the pixel
                size of individual tiles and the number and arrangement of tiles.
              type: object
              properties:
                '@id':
                  const: ada:parameter/semImagingTAPP/imagePixelSize
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                  - '@id': ada:parameter/semImagingTAPP/imagePixelSize
                schema:name:
                  const: Image Pixel Size
                schema:value:
                  anyOf:
                  - type: number
                  - type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id007
              title: Dwell Time per Pixel
              description: Time the electron beam dwells on each pixel during raster scanning (imaging
                modes) or on each step position during compositional mapping (EDS and WDS mapping modes),
                in microseconds or milliseconds. Longer dwell time improves signal-to-noise and counting
                statistics but increases total dose and can cause beam damage or contamination on sensitive
                materials. For WDS mapping, the dwell time is per spectrometer per pixel.
              type: object
              properties:
                '@id':
                  const: ada:parameter/semImagingTAPP/dwellTimePerPixel
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                  - '@id': ada:parameter/semImagingTAPP/dwellTimePerPixel
                schema:name:
                  const: Dwell Time per Pixel
                schema:value:
                  anyOf:
                  - type: number
                  - type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id008
              title: CL Integration Time
              description: Acquisition time per pixel (hyperspectral map mode) or per spectrum (spectral
                point mode), in ms or s. Longer integration improves signal-to-noise but increases beam
                dose and acquisition time.
              type: object
              properties:
                '@id':
                  const: ada:parameter/semImagingTAPP/clIntegrationTime
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                  - '@id': ada:parameter/semImagingTAPP/clIntegrationTime
                schema:name:
                  const: CL Integration Time
                schema:value:
                  anyOf:
                  - type: number
                  - type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id009
              title: EBSD Step Size
              description: Distance between adjacent EBSD measurement points in the map in nm or µm. Must
                be smaller than the smallest grain of interest to resolve grain boundary positions and
                intragrain orientation gradients.
              type: object
              properties:
                '@id':
                  const: ada:parameter/semImagingTAPP/ebsdStepSize
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                  - '@id': ada:parameter/semImagingTAPP/ebsdStepSize
                schema:name:
                  const: EBSD Step Size
                schema:value:
                  anyOf:
                  - type: number
                  - type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id010
              title: EBSD Phase List
              description: Mineral phases included in the EBSD reference pattern library for this procedure.
                The procedure specifies the expected phase suite for the target material; analysts may
                add phases for specific sample compositions.
              type: object
              properties:
                '@id':
                  const: ada:parameter/semImagingTAPP/ebsdPhaseList
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                  - '@id': ada:parameter/semImagingTAPP/ebsdPhaseList
                schema:name:
                  const: EBSD Phase List
                schema:value:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id011
              title: CL Wavelength Calibration Reference
              description: Reference light source or standard material used to calibrate the wavelength
                axis of the CL spectrometer. Required for quantitative spectral CL and hyperspectral mapping.
              type: object
              properties:
                '@id':
                  const: ada:parameter/semImagingTAPP/clWavelengthCalibrationReference
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                  - '@id': ada:parameter/semImagingTAPP/clWavelengthCalibrationReference
                schema:name:
                  const: CL Wavelength Calibration Reference
                schema:value:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
          allOf:
          - contains: *id004
            minContains: 0
            maxContains: 1
          - contains: *id005
            minContains: 0
            maxContains: 1
          - contains: *id006
            minContains: 0
            maxContains: 1
          - contains: *id007
            minContains: 0
            maxContains: 1
          - contains: *id008
            minContains: 0
            maxContains: 1
          - contains: *id009
            minContains: 0
            maxContains: 1
          - contains: *id010
            minContains: 0
            maxContains: 1
          - contains: *id011
            minContains: 0
            maxContains: 1
        prov:used:
          type: array
          items:
            type: object
            allOf:
            - if:
                required:
                - bios:computationalTool
              then:
                properties:
                  bios:computationalTool:
                    type: array
                    items:
                      allOf:
                      - $ref: ../../../../BaseSchema/geochemProduct/schema.yaml#/$defs/UsedComputationalTool
                      - type: object
                        allOf:
                        - if:
                            properties:
                              ada:toolRole:
                                const: acquisition
                            required:
                            - ada:toolRole
                          then:
                            properties:
                              schema:name:
                                description: Instrument control, automation and data acquisition software
                                  used to collect the raw data, including version number. Distinct from
                                  Data Processing Software(s), which covers everything applied to the
                                  data after acquisition.
                                anyOf:
                                - type: string
                                - type: array
                                  items:
                                    type: string
                        - if:
                            properties:
                              ada:toolRole:
                                const: dataReduction
                            required:
                            - ada:toolRole
                          then:
                            properties:
                              schema:name:
                                description: All software applied to the data after acquisition in order
                                  to produce the reported quantities, including version numbers. List
                                  every package used. Distinct from Acquisition Software, which controls
                                  the instrument and collects the raw data.
                                anyOf:
                                - type: string
                                - type: array
                                  items:
                                    type: string
                        required:
                        - ada:toolRole
            - if:
                required:
                - schema:instrument
              then:
                properties:
                  schema:instrument:
                    type: array
                    items:
                      allOf:
                      - $ref: ../../../../BaseSchema/instrument/schema.yaml
                      - type: object
                        allOf:
                        - if:
                            properties:
                              schema:additionalType:
                                contains:
                                  const: SEM
                            required:
                            - schema:additionalType
                          then:
                            properties:
                              schema:additionalProperty:
                                type: array
                                items:
                                  anyOf:
                                  - &id012
                                    title: Accelerating Voltage
                                    description: Electron beam accelerating voltage in kilovolts. Affects
                                      X-ray generation depth (EDS/WDS), EBSD pattern quality, imaging
                                      resolution, and beam penetration. Low voltages (1-5 kV) improve
                                      surface sensitivity and reduce beam damage; high voltages (15-20
                                      kV) improve X-ray generation for quantitative analysis.
                                    type: object
                                    properties:
                                      '@id':
                                        const: ada:parameter/semImagingTAPP/acceleratingVoltage
                                      '@type':
                                        const:
                                        - schema:PropertyValue
                                      schema:propertyID:
                                        const:
                                        - '@id': ada:parameter/semImagingTAPP/acceleratingVoltage
                                      schema:name:
                                        const: Accelerating Voltage
                                      schema:value:
                                        anyOf:
                                        - type: number
                                        - type: string
                                      schema:unitText:
                                        type: string
                                    required:
                                    - '@id'
                                    - '@type'
                                    - schema:propertyID
                                    - schema:name
                                    - schema:value
                                    - schema:unitText
                                  - &id013
                                    title: Working Distance
                                    description: Distance between the objective lens pole piece and the
                                      specimen surface in millimetres. Affects spatial resolution, depth
                                      of focus, EDS X-ray take-off angle, and EBSD geometry.
                                    type: object
                                    properties:
                                      '@id':
                                        const: ada:parameter/semImagingTAPP/workingDistance
                                      '@type':
                                        const:
                                        - schema:PropertyValue
                                      schema:propertyID:
                                        const:
                                        - '@id': ada:parameter/semImagingTAPP/workingDistance
                                      schema:name:
                                        const: Working Distance
                                      schema:value:
                                        anyOf:
                                        - type: number
                                        - type: string
                                      schema:unitText:
                                        type: string
                                    required:
                                    - '@id'
                                    - '@type'
                                    - schema:propertyID
                                    - schema:name
                                    - schema:value
                                    - schema:unitText
                                allOf:
                                - contains: *id012
                                  minContains: 0
                                  maxContains: 1
                                - contains: *id013
                                  minContains: 0
                                  maxContains: 1
                    allOf:
                    - contains:
                        properties:
                          schema:additionalType:
                            contains:
                              const: SEM
                        required:
                        - schema:additionalType
        schema:description:
          description: 'Any procedure- or analysis-specific information not captured by a structured field
            anywhere in this TAPP — including anomalies, deviations from the registered procedure, instrument
            modifications, and supplementary context. Scope is the whole document, not Group 6: this is
            the last field of the TAPP and covers all six groups. Use sparingly; a structured field is
            preferred for anything that can be formally categorised.'
          type: string
  schema:measurementTechnique:
    type: array
    items:
      type: object
      properties:
        schema:identifier:
          description: DOI or unique persistent identifier for the registered procedure used in this analysis,
            generated upon procedure submission to a data repository. This field is mandatory when submitting
            analytical data, to encourage formal procedure registration and ensure traceability. If a
            DOI has been applied for but not yet minted, enter "pending".
          type: string
  schema:contributor:
    type: array
    items:
      type: object
      allOf:
      - if:
          properties:
            schema:roleName:
              const: analyst
          required:
          - schema:roleName
        then:
          properties:
            schema:name:
              description: Name(s) of the analyst(s) who performed the analysis session. ORCID is recommended
                for persistent identification.
              anyOf:
              - type: string
              - type: array
                items:
                  type: string
    allOf:
    - contains:
        properties:
          schema:roleName:
            const: analyst
        required:
        - schema:roleName
  schema:funding:
    type: array
  schema:relatedLink:
    type: array
    items:
      type: object
      allOf:
      - if:
          properties:
            schema:linkRelationship:
              const: coupledTechnique
          required:
          - schema:linkRelationship
        then:
          properties:
            schema:target:
              type: object
              properties:
                schema:name:
                  description: Other analytical techniques applied to the same sample(s) whose results
                    are intended to be interpreted together with data from this procedure. Document coupling
                    with any technique whose results are functionally linked to this dataset — providing
                    calibration inputs, complementary spatial context, or required companion measurements.
                    Use the same controlled vocabulary as the Technique field. Enter "None" if no coupling
                    is intended.
                  anyOf:
                  - type: string
                    enum:
                    - EPMA; NanoSIMS
                    - XCT (pre-SEM overview)
                    - None
                    - N/A
                    - missing
                  - type: string
                schema:description:
                  description: 'Description of how this procedure is coupled with the technique(s) listed
                    above. Include: (1) the functional relationship — what data or context flows between
                    techniques, or how results are combined (e.g. which output from the coupled technique
                    serves as input to data reduction for this technique); and (2) the analytical sequence
                    — which technique is performed first and why (e.g. non-destructive before destructive).
                    Required when Coupled Technique(s) is not "None".'
                  type: string
      - if:
          properties:
            schema:linkRelationship:
              const: coupledProcedure
          required:
          - schema:linkRelationship
        then:
          properties:
            schema:target:
              type: object
              properties:
                schema:url:
                  description: Registered procedure DOI for the coupled technique named above. Provides
                    a stable, citable link to the companion method independent of whether a dataset has
                    been deposited. If the coupled procedure has not yet been registered, enter the DOI
                    of a publication describing the coupled method, or "pending". Enter "None" if no coupling
                    is planned.
                  type: string
      - if:
          properties:
            schema:linkRelationship:
              const: coupledDataset
          required:
          - schema:linkRelationship
        then:
          properties:
            schema:target:
              description: 'DOI or other persistent identifier for the co-registered dataset or publication
                where both datasets are reported together. Accepts: a dedicated dataset DOI (if separately
                deposited), a shared dataset DOI (if co-submitted in the same package), or a publication
                DOI. Use "same submission" if the coupled dataset is included in this data package, or
                "pending" if not yet assigned. If coupling is documented through a shared sample identifier
                only, that information is already captured in Sample Persistent Identifier (Group 2).'
              anyOf:
              - type: string
              - type: array
                items:
                  type: string
  ada:frameTime:
    description: Acquisition time per EBSD diffraction pattern frame in milliseconds. Longer frame time
      improves pattern quality and indexing rate but increases total acquisition time.
    anyOf:
    - type: number
    - type: string
  ada:indexingMethod:
    description: Algorithm used to index EBSD diffraction patterns and assign crystal orientations. Hough-transform
      methods fit Kikuchi band positions analytically; dictionary indexing (DI) matches experimental patterns
      to a pre-computed library of simulated patterns.
    type: string
    enum:
    - Hough transform
    - Dictionary indexing (DI)
    - Neural network
    - Unknown
    - N/A
    - None
    - missing
  ada:patternQualityThreshold:
    description: Minimum pattern quality or confidence index threshold applied during EBSD data processing
      to exclude unreliably indexed points from orientation maps. Include metric name and threshold value.
    type: string
  ada:meanAngularDeviation:
    description: Mean angular deviation (MAD) of the EBSD pattern indexing solution in degrees. MAD quantifies
      the misfit between experimental Kikuchi band positions and the best-fit crystal orientation. Values
      above ~1.5 degrees typically indicate unreliable indexing.
    anyOf:
    - type: number
    - type: string
  ada:indexingRate:
    description: Fraction of EBSD map points successfully indexed, expressed as a percentage of total
      map points. Low indexing rate may indicate surface damage, amorphisation, severe deformation, or
      phase misidentification.
    anyOf:
    - type: number
    - type: string
required:
- schema:funding
- ada:indexingMethod
- ada:meanAngularDeviation
- ada:indexingRate
