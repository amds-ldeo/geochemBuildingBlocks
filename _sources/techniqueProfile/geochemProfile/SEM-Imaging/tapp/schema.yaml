$schema: https://json-schema.org/draft/2020-12/schema
title: SEM Imaging Technique-Aligned Protocol Profile (semImagingTAPP)
description: 'Scanning electron microscopy imaging (SE/BSE/CL/EBSD) extension of the base TAPP definition.
  Basic protocol-tier fields are required top-level ada: properties; Advanced protocol-tier fields are
  schema:additionalProperty[] entries. No ada:analyteTemplate (imaging has no per-element analyte axis).
  Generated from TAPPS20260813/Current TAPPs/SEM_Imaging_TAPP_v11.csv by tools/build_tapp.py.'
allOf:
- $ref: ../../../../BaseSchema/tappDefinition/schema.yaml
- $ref: ../../../../BaseSchema/modules/group1/schema.yaml#/$defs/ProcedureIdentification
- $ref: ../../../../BaseSchema/modules/reportingCore/schema.yaml#/$defs/TargetSelection_Procedure
- type: object
  properties:
    schema:object:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              '@type':
                contains:
                  const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
            required:
            - '@type'
          then:
            properties:
              schema:additionalProperty:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:name:
                          const: Target Material
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:value:
                          type: array
                          items:
                            description: General description of the material type(s) this procedure is
                              designed to analyze.
                            type: string
                            enum:
                            - Silicate mineral
                            - Oxide
                            - Sulfide
                            - Carbonate
                            - Phosphate
                            - Metal alloy
                            - Organic matter
                            - Glass
                            - Regolith
                            - Whole rock / polished section
                            - Porous material
                            - N/A
                            - None
                            readOnly: true
                allOf:
                - contains:
                    properties:
                      schema:name:
                        const: Target Material
                    required:
                    - schema:name
      allOf:
      - contains:
          properties:
            '@type':
              contains:
                const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
          required:
          - '@type'
    schema:actionProcess:
      type: object
      properties:
        schema:step:
          type: array
          items:
            type: object
            allOf:
            - if:
                properties:
                  schema:name:
                    const: samplePreparation
                required:
                - schema:name
              then:
                properties:
                  schema:description:
                    description: Method by which samples were prepared for SEM analysis prior to loading
                      in the instrument. Includes mounting medium (epoxy, carbon tape, stub), polishing
                      steps (alumina, colloidal silica, argon ion mill), and conductive coating type and
                      thickness. For VP-SEM/ESEM analyses, note whether an uncoated sample was used and
                      the gas type used. FIB-specific in-session operations (protective coating deposition,
                      milling conditions, lamella preparation) are documented separately in Group 4.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
            - if:
                properties:
                  schema:name:
                    const: dataReduction
                required:
                - schema:name
              then:
                properties:
                  schema:additionalProperty:
                    type: array
                    items:
                      anyOf:
                      - &id001
                        title: Crystal Structure Database
                        description: Crystal structure database used for EBSD phase identification and
                          Kikuchi pattern simulation.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/semImagingTAPP/crystalStructureDatabaseDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: crystalStructureDatabaseDefault
                          schema:name:
                            const: Crystal Structure Database
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      - &id002
                        title: Constants and Reference Values Used
                        description: Physical constants and reference values used in data reduction to
                          calculate the final reported quantity (e.g., decay constants for age calculation,
                          standard isotope ratios, or other citable reference values used in a correction
                          or calculation), together with their source. Distinct from the Group 6 reference-material
                          fields, which document accepted values for specific calibration/validation materials
                          rather than universal physical constants. Record "None" if no citable, revisable
                          physical constants feed into this procedure's data reduction.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/semImagingTAPP/constantsAndReferenceValuesUsedDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: constantsAndReferenceValuesUsedDefault
                          schema:name:
                            const: Constants and Reference Values Used
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                    allOf:
                    - contains: *id001
                      minContains: 0
                      maxContains: 1
                    - contains: *id002
                      minContains: 0
                      maxContains: 1
          allOf:
          - contains:
              properties:
                schema:name:
                  const: samplePreparation
              required:
              - schema:name
          - contains:
              properties:
                schema:name:
                  const: dataReduction
              required:
              - schema:name
    schema:instrument:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              schema:additionalType:
                contains:
                  const: SEM
            required:
            - schema:additionalType
          then:
            properties:
              schema:manufacturer:
                type: object
                properties:
                  schema:name:
                    description: Make of the instrument used for this procedure.
                    type: string
                    enum:
                    - JEOL
                    - Zeiss
                    - FEI / Thermo Fisher Scientific
                    - Hitachi
                    - Tescan
                    - Phenom
                    - Unknown
                    - N/A
                    - None
                    readOnly: true
              schema:model:
                type: object
                properties:
                  schema:name:
                    description: Model designation of the SEM or FIB-SEM instrument, including generation
                      suffix if applicable.
                    type: string
                    readOnly: true
              schema:hasPart:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: Electron source
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:description:
                          description: Type of electron gun used in the instrument.
                          anyOf:
                          - type: string
                            enum:
                            - Cold-FEG
                            - Schottky FEG
                            - LaB6 / CeB6
                            - Tungsten (W)
                            - Unknown
                            - N/A
                            - None
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              enum:
                              - Cold-FEG
                              - Schottky FEG
                              - LaB6 / CeB6
                              - Tungsten (W)
                              - Unknown
                              - N/A
                              - None
                              readOnly: true
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: SEDetector
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:name:
                          description: Type of secondary electron detector used. Everhart-Thornley (ET)
                            detector is the standard off-axis collector sensitive to SE2 and some BSE;
                            in-lens (TLD) detectors collect high-resolution SE1 signal at short working
                            distances; GSED/ESED detectors operate in VP/ESEM mode by using the chamber
                            gas as the signal amplification medium.
                          anyOf:
                          - type: string
                            enum:
                            - Everhart-Thornley (ET)
                            - In-lens / TLD (through-the-lens)
                            - GSED (VP/ESEM)
                            - ESED (VP/ESEM)
                            - N/A
                            - None
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              enum:
                              - Everhart-Thornley (ET)
                              - In-lens / TLD (through-the-lens)
                              - GSED (VP/ESEM)
                              - ESED (VP/ESEM)
                              - N/A
                              - None
                              readOnly: true
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: BSEDetector
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:name:
                          description: Type of backscattered electron detector. Solid-state diode detectors
                            (single or segmented) are standard; YAG scintillator detectors offer high
                            sensitivity at low voltage. Segmented detectors can operate in composition
                            mode (segments summed) or topography mode (differential signal between segments).
                            In-lens BSE detectors provide improved BSE collection at short working distances.
                          anyOf:
                          - type: string
                            enum:
                            - Solid-state diode (single)
                            - Solid-state diode (segmented, composition mode)
                            - Solid-state diode (segmented, topography mode)
                            - In-lens BSE
                            - YAG scintillator
                            - N/A
                            - None
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              enum:
                              - Solid-state diode (single)
                              - Solid-state diode (segmented, composition mode)
                              - Solid-state diode (segmented, topography mode)
                              - In-lens BSE
                              - YAG scintillator
                              - N/A
                              - None
                              readOnly: true
                allOf:
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          const: Electron source
                    required:
                    - schema:additionalType
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          const: SEDetector
                    required:
                    - schema:additionalType
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          const: BSEDetector
                    required:
                    - schema:additionalType
              schema:description:
                description: 'Broad platform type of the instrument. ''Standard SEM'': dedicated electron-only
                  SEM column. ''FIB-SEM dual-beam'': combined focused ion beam and SEM columns (enables
                  TEM specimen preparation, 3D serial sectioning, ion-beam milling). ''VP-SEM / ESEM'':
                  variable-pressure or environmental SEM for imaging uncoated, hydrated, or charging specimens.
                  An instrument may combine categories (e.g., FIB-SEM with VP capability).'
                anyOf:
                - type: string
                  enum:
                  - Standard SEM
                  - FIB-SEM dual-beam
                  - VP-SEM / ESEM
                  - FIB-SEM dual-beam + VP
                  - N/A
                  - None
                  readOnly: true
                - type: array
                  items:
                    type: string
                    enum:
                    - Standard SEM
                    - FIB-SEM dual-beam
                    - VP-SEM / ESEM
                    - FIB-SEM dual-beam + VP
                    - N/A
                    - None
                    readOnly: true
              ada:acceleratingVoltageDefault:
                description: Electron beam accelerating voltage in kilovolts. Affects X-ray generation
                  depth (EDS/WDS), EBSD pattern quality, imaging resolution, and beam penetration. Low
                  voltages (1-5 kV) improve surface sensitivity and reduce beam damage; high voltages
                  (15-20 kV) improve X-ray generation for quantitative analysis.
                anyOf:
                - type: number
                - type: string
              ada:workingDistanceDefault:
                description: Distance between the objective lens pole piece and the specimen surface in
                  millimetres. Affects spatial resolution, depth of focus, EDS X-ray take-off angle, and
                  EBSD geometry.
                anyOf:
                - type: number
                - type: string
      allOf:
      - contains:
          properties:
            schema:additionalType:
              contains:
                const: SEM
          required:
          - schema:additionalType
    schema:additionalProperty:
      type: array
      items:
        anyOf:
        - title: CL Detector Configuration
          description: CL detector type, manufacturer, model, collection optics (e.g., parabolic mirror,
            elliptical mirror, light guide), and spectral detection configuration (PMT for panchromatic,
            CCD/EMCCD for spectral, multi-channel for pseudo-color CL).
          type: object
          properties:
            '@id':
              const: ada:parameter/semImagingTAPP/clDetectorConfiguration
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/semImagingTAPP/clDetectorConfiguration
            schema:name:
              const: CL Detector Configuration
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - &id003
          title: Chamber Pressure
          description: Chamber pressure and gas type during analysis. Required for variable pressure (VP-SEM)
            and environmental SEM (ESEM) modes. Report value and unit (Pa or Torr) and gas composition.
            Use 'None' for standard high-vacuum operation.
          type: object
          properties:
            '@id':
              const: ada:parameter/semImagingTAPP/chamberPressureDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: chamberPressureDefault
            schema:name:
              const: Chamber Pressure
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id004
          title: Image Pixel Size
          description: Physical size of each image pixel at the sample surface, in nm or µm. Defines spatial
            sampling of SE or BSE images. For large-area mosaic imaging, report the pixel size of individual
            tiles and the number and arrangement of tiles.
          type: object
          properties:
            '@id':
              const: ada:parameter/semImagingTAPP/imagePixelSizeDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: imagePixelSizeDefault
            schema:name:
              const: Image Pixel Size
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id005
          title: CL Wavelength Calibration Reference
          description: Reference light source or standard material used to calibrate the wavelength axis
            of the CL spectrometer. Required for quantitative spectral CL and hyperspectral mapping.
          type: object
          properties:
            '@id':
              const: ada:parameter/semImagingTAPP/clWavelengthCalibrationReferenceDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: clWavelengthCalibrationReferenceDefault
            schema:name:
              const: CL Wavelength Calibration Reference
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
      allOf:
      - contains:
          title: CL Detector Configuration
          description: CL detector type, manufacturer, model, collection optics (e.g., parabolic mirror,
            elliptical mirror, light guide), and spectral detection configuration (PMT for panchromatic,
            CCD/EMCCD for spectral, multi-channel for pseudo-color CL).
          type: object
          properties:
            '@id':
              const: ada:parameter/semImagingTAPP/clDetectorConfiguration
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/semImagingTAPP/clDetectorConfiguration
            schema:name:
              const: CL Detector Configuration
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains: *id003
        minContains: 0
        maxContains: 1
      - contains: *id004
        minContains: 0
        maxContains: 1
      - contains: *id005
        minContains: 0
        maxContains: 1
    ada:ebsdDetectorConfiguration:
      description: EBSD detector manufacturer, model, and camera resolution. Include whether EBSD and
        EDS are acquired simultaneously (common on modern combined EBSD-EDS systems).
      type: string
      readOnly: true
    bios:computationalTool:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              ada:toolRole:
                const: acquisition
            required:
            - ada:toolRole
          then:
            properties:
              schema:name:
                description: Software used to control the SEM and acquire data, including version number.
                  For FIB-SEM 3D tomography, include the automated slice-and-view module name and version.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
        - if:
            properties:
              ada:toolRole:
                const: dataReduction
            required:
            - ada:toolRole
          then:
            properties:
              schema:name:
                description: Software used for post-acquisition data reduction and analysis. List all
                  packages with version numbers.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
      allOf:
      - contains:
          properties:
            ada:toolRole:
              const: acquisition
          required:
          - ada:toolRole
      - contains:
          properties:
            ada:toolRole:
              const: dataReduction
          required:
          - ada:toolRole
    ada:analyticalMode:
      type: array
      items:
        description: Primary analytical mode(s) executed under this procedure. For multi-mode procedures
          (e.g., simultaneous BSE + EDS mapping), list all active modes.
        type: string
        enum:
        - SE Imaging
        - BSE Imaging
        - EDS
        - SEM-WDS
        - CL
        - EBSD
        - TEM Sample Preparation
        - 3D Tomography
        - N/A
        - None
        readOnly: true
    ada:analyteTemplate:
      type: object
      properties:
        ada:analyteColumns:
          type: array
          items:
            anyOf:
            - $ref: ../../../../BaseSchema/tappDefinition/schema.yaml#/$defs/AnalyteIdentifierColumn
            - &id006
              title: Beam Current
              description: Electron beam probe current. Higher current improves signal-to-noise for X-ray
                analysis (EDS/WDS, EBSD) and CL but may increase beam damage and reduce spatial resolution.
                Express in nA; for sub-nA values use decimal notation (e.g., 0.4 nA).
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/semImagingTAPP/beamCurrent
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: beamCurrent
                schema:name:
                  const: Beam Current
                ada:dataType:
                  const: number
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: M
                schema:defaultValue:
                  anyOf:
                  - type: number
                  - type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
          allOf:
          - contains: *id006
            minContains: 0
            maxContains: 1
    ada:dwellTimePerPixelDefault:
      description: Time the electron beam dwells on each pixel during raster scanning (imaging modes)
        or on each step position during compositional mapping (EDS and WDS mapping modes), in microseconds
        or milliseconds. Longer dwell time improves signal-to-noise and counting statistics but increases
        total dose and can cause beam damage or contamination on sensitive materials. For WDS mapping,
        the dwell time is per spectrometer per pixel.
      anyOf:
      - type: number
      - type: string
    ada:clAcquisitionMode:
      description: 'CL data collection strategy. Panchromatic: total light intensity collected by PMT
        across the full detector wavelength range. Spectral point: full CL spectrum at discrete point
        locations. Hyperspectral map: full CL spectrum acquired at each pixel of a raster scan.'
      type: string
      enum:
      - Panchromatic
      - Spectral point
      - Hyperspectral map
      - Multi-channel pseudo-color
      - N/A
      - None
      readOnly: true
    ada:clWavelengthRange:
      description: Detection wavelength range of the CL system in nm. The range is set by the detector
        sensitivity and any optical filters installed.
      anyOf:
      - type: number
      - type: string
      readOnly: true
    ada:clIntegrationTimeDefault:
      description: Acquisition time per pixel (hyperspectral map mode) or per spectrum (spectral point
        mode), in ms or s. Longer integration improves signal-to-noise but increases beam dose and acquisition
        time.
      anyOf:
      - type: number
      - type: string
    ada:sampleTiltAngle:
      description: Sample tilt angle for EBSD acquisition in degrees, measured from horizontal. Standard
        EBSD geometry uses 70 degrees tilt toward the EBSD camera to maximise diffracted electron signal.
      anyOf:
      - type: number
      - type: string
      readOnly: true
    schema:description:
      description: 'Any procedure- or analysis-specific information not captured by a structured field
        anywhere in this TAPP — including anomalies, deviations from the registered procedure, instrument
        modifications, and supplementary context. Scope is the whole document, not Group 6: this is the
        last field of the TAPP and covers all six groups. Use sparingly; a structured field is preferred
        for anything that can be formally categorised.'
      type: string
    ada:reportedPropertyTemplate:
      type: object
      properties:
        ada:defaultReportedProperties:
          type: array
          items:
            description: The final variable(s) this procedure reports and their units — distinct from
              the fields recording what was *acquired* rather than what is reported. A procedure may acquire
              many channels and report a small number of derived quantities; without this field a data
              consumer cannot tell which. Record every reported variable, including intermediate quantities
              reported alongside final ones (e.g. both the 206Pb/238U ratio and the 206Pb/238U date).
              Where a reported variable is a nominal property with no magnitude (e.g. a mineral identification),
              record the variable and give the unit as 'N/A — nominal property'.
            type: string
            readOnly: true
  required:
  - ada:ebsdDetectorConfiguration
  - ada:dwellTimePerPixelDefault
  - ada:clAcquisitionMode
  - ada:clWavelengthRange
  - ada:clIntegrationTimeDefault
  - ada:sampleTiltAngle
