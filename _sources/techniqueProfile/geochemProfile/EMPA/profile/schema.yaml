$schema: https://json-schema.org/draft/2020-12/schema
title: ADA EMPA Product Profile (path-driven)
description: Technique-specific profile for Electron Microprobe Analysis (EMPA/EPMA) products. Extends the base ADA product profile with the EMPA analysis-instance detail (detailEMPA) on the schema:Dataset root, narrows prov:used to the empaTAPP protocol, and constrains valid EMPA component types on schema:distribution.hasPart.
allOf:
  - $ref: ../../../../BaseSchema/geochemProduct/schema.yaml
  # analysis-instance detail on the schema:Dataset root (analyst, session dates, sample,
  # per-analysis parameters, funding, measurementTechnique, quality measurements). componentType
  # is NOT here — it lives on schema:distribution.hasPart below.
  - $ref: ../detail/schema.yaml
  - type: object
    properties:
      prov:wasGeneratedBy:
        description: >-
          Narrow the base prov:used to the empaTAPP definition — inline, or by
          node @id — alongside the instrument. (Base adaProduct accepts the generic
          tappDefinition; this profile requires the technique-specific one.)
        type: array
        items:
          type: object
          properties:
            prov:used:
              # Constraint-only pins, not a narrowed anyOf: prov:used items are role-keyed
              # wrappers, and an anyOf here allOf-merges with the base union and excludes item
              # shapes the base allows. A bare {"@id"} reference to an empaTAPP needs no pin --
              # the base accepts it already.
              type: array
              items:
                allOf:
                  - if:
                      type: object
                      required: ['schema:instrument']
                    then:
                      properties:
                        'schema:instrument':
                          type: array
                          minItems: 1
                          items:
                            $ref: ../../../../BaseSchema/instrument/schema.yaml
                  - if:
                      type: object
                      properties:
                        '@type':
                          contains:
                            const: ada:TAPPDefinition
                      required: ['@type']
                    then:
                      $ref: ../tapp/schema.yaml
      schema:additionalType:
        description: Must include an EMPA product type identifier.
        contains:
          enum:
            - Electron Microprobe Analysis (EMPA) Collection
            - Electron Microprobe Analysis Image (EMPA)
            - Electron Microprobe Analysis Quantitative Elemental Abundances (EMPAQEA)
            - Electron Microprobe Analysis (EMPA)
            - Electron microprobe analysis
      schema:distribution:
        description: Distribution items for empaProfile. Archive hasPart items must have ada:componentType from technique-specific or universal values.
        type: array
        items:
          type: object
          properties:
            schema:hasPart:
              items:
                type: object
                anyOf:
                  - $ref: ../../../../BaseSchema/geochemProduct/schema.yaml#/$defs/universalComponentTypeBranch
                  - properties:
                      ada:componentType:
                        type: string
                        enum:
                          - ada:EMPAImage
                          - ada:EMPAImageMap
                          - ada:EMPAQEATabular
                          - ada:EMPAImageCollection
                          - ada:EMPAESPCTabular
                          - ada:EMPAESPCPlot
                    required:
                      - ada:componentType
      schema:subjectOf:
        properties:
          dcterms:conformsTo:
            contains:
              type: object
              required: ['@id']
              additionalProperties: false
              properties:
                '@id':
                  const: 'https://w3id.org/geochem/metadata/profiles/adaEMPA'
