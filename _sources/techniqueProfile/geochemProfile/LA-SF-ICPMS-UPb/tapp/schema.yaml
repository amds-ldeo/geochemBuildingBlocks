    schema:instrument:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              schema:additionalType:
                contains:
                  const: Laser Ablation System
            required:
            - schema:additionalType
          then:
            properties:
              schema:model:
                type: object
                properties:
                  schema:name:
                    description: Manufacturer and model of the laser ablation system.
                    type: string
                    readOnly: true
              ada:laserType:
                description: Wavelength and type of the laser used for ablation in nanometres.
                anyOf:
                - type: string
                  readOnly: true
                - type: array
                  items:
                    type: string
                    readOnly: true
              schema:name:
                description: Type, design origin, and internal volume of the ablation cell. Cell volume
                  is a primary determinant of aerosol washout time and therefore the achievable time resolution
                  of the data.
                anyOf:
                - type: string
                  readOnly: true
                - type: array
                  items:
                    type: string
                    readOnly: true
              ada:laserSpotGeometryDefault:
                description: Shape and dimensions of the laser ablation spot in micrometres registered
                  by the procedure. For circular spots, report diameter; for square or rectangular spots,
                  report width × length. The procedure registers the typical geometry; analysts may adjust
                  within procedure-allowed range.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
              schema:additionalProperty:
                type: array
                items:
                  anyOf:
                  - &id015
                    title: Laser Energy
                    description: Laser pulse energy in millijoules as set at the laser output or measured
                      at the sample surface. Less commonly reported than fluence because it does not account
                      for spot area. Report only when the system displays energy directly. Laser fluence
                      (J cm⁻²) is the preferred quantity and is captured in Default Laser Fluence.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laSficpmsUPbTAPP/laserEnergyDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: laserEnergyDefault
                      schema:name:
                        const: Laser Energy
                      ada:dataType:
                        const: number
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
                        const: R
                      schema:unitText:
                        const: mJ
                    required:
                    - '@id'
                    - '@type'
                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                  - title: Laser Beam Energy Profile
                    description: Spatial energy distribution of the laser beam at the sample surface,
                      and whether a beam homogenizer is installed. A flat-top (top-hat) profile produces
                      more uniform ablation craters and more reproducible crater morphology than a Gaussian
                      beam. This is a fixed hardware property of the laser system.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laSficpmsUPbTAPP/laserBeamEnergyProfile
                      '@type':
                        const:
                        - schema:PropertyValue
                      schema:propertyID:
                        const:
                        - '@id': ada:parameter/laSficpmsUPbTAPP/laserBeamEnergyProfile
                      schema:name:
                        const: Laser Beam Energy Profile
                      schema:value:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                    readOnly: true
                  - title: Laser Pulse Duration
                    description: 'Duration of each individual laser pulse, including units. Pulse duration
                      determines the ablation regime: nanosecond (ns) pulses involve significant thermal
                      effects and elemental fractionation; femtosecond (fs) pulses are non-thermal and
                      substantially reduce elemental fractionation and matrix effects. This is a fixed
                      hardware property of the laser system.'
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laSficpmsUPbTAPP/laserPulseDuration
                      '@type':
                        const:
                        - schema:PropertyValue
                      schema:propertyID:
                        const:
                        - '@id': ada:parameter/laSficpmsUPbTAPP/laserPulseDuration
                      schema:name:
                        const: Laser Pulse Duration
                      schema:value:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                    readOnly: true
                allOf:
                - contains: *id015
                  minContains: 0
                  maxContains: 1
                - contains:
                    title: Laser Beam Energy Profile
                    description: Spatial energy distribution of the laser beam at the sample surface,
                      and whether a beam homogenizer is installed. A flat-top (top-hat) profile produces
                      more uniform ablation craters and more reproducible crater morphology than a Gaussian
                      beam. This is a fixed hardware property of the laser system.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laSficpmsUPbTAPP/laserBeamEnergyProfile
                      '@type':
                        const:
                        - schema:PropertyValue
                      schema:propertyID:
                        const:
                        - '@id': ada:parameter/laSficpmsUPbTAPP/laserBeamEnergyProfile
                      schema:name:
                        const: Laser Beam Energy Profile
                      schema:value:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                    readOnly: true
                  minContains: 0
                  maxContains: 1
                - contains:
                    title: Laser Pulse Duration
                    description: 'Duration of each individual laser pulse, including units. Pulse duration
                      determines the ablation regime: nanosecond (ns) pulses involve significant thermal
                      effects and elemental fractionation; femtosecond (fs) pulses are non-thermal and
                      substantially reduce elemental fractionation and matrix effects. This is a fixed
                      hardware property of the laser system.'
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laSficpmsUPbTAPP/laserPulseDuration
                      '@type':
                        const:
                        - schema:PropertyValue
                      schema:propertyID:
                        const:
                        - '@id': ada:parameter/laSficpmsUPbTAPP/laserPulseDuration
                      schema:name:
                        const: Laser Pulse Duration
                      schema:value:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                    readOnly: true
                  minContains: 0
                  maxContains: 1
              ada:laserFluenceDefault:
                description: Laser pulse energy per unit area at the sample surface in J cm⁻², as registered
                  by the procedure. Fluence is the physically meaningful quantity controlling ablation
                  rate, crater morphology, elemental fractionation, and particle size distribution. If
                  the system reports only as % of maximum output, include that value and note the system
                  maximum where known.
                anyOf:
                - type: number
                - type: string
              ada:laserRepetitionRateDefault:
                description: Laser pulse repetition rate in hertz registered by the procedure. For mapping
                  methods, repetition rate together with scan speed and spot size determines pixel size
                  and spatial resolution. Analysts may adjust within procedure-allowed bounds.
                anyOf:
                - type: number
                - type: string
        - if:
            properties:
              schema:additionalType:
                contains:
                  const: ICPMS
            required:
            - schema:additionalType
          then:
            properties:
              schema:model:
                type: object
                properties:
                  schema:name:
                    description: Manufacturer and model of the ICP-MS instrument.
                    type: string
                    readOnly: true
              schema:additionalProperty:
                type: array
                items:
                  anyOf:
                  - &id016
                    title: Instrument Serial Number or Lab Identifier
                    description: Serial number or laboratory-internal identifier for the specific instrument
                      unit. Supports traceability to instrument service records.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laSficpmsUPbTAPP/instrumentSerialNumberOrLabIdentifierDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: instrumentSerialNumberOrLabIdentifierDefault
                      schema:name:
                        const: Instrument Serial Number or Lab Identifier
                      ada:dataType:
                        const: string
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
                        const: R
                    required:
                    - '@id'
                    - '@type'
                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                  - &id017
                    title: Mass Resolution Setting
                    description: Operating mass resolution of the mass analyser. The analyst selects low,
                      medium, or high resolution to balance sensitivity against spectral interference
                      suppression.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laSficpmsUPbTAPP/massResolutionSettingDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: massResolutionSettingDefault
                      schema:name:
                        const: Mass Resolution Setting
                      ada:dataType:
                        const: string
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
                        const: R
                    required:
                    - '@id'
                    - '@type'
                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                  - title: Detector Configuration
                    description: Type(s) of detector(s) installed in the mass spectrometer. For single-collector
                      instruments, note whether dual pulse-counting/analog mode is used. For multi-collector
                      instruments, describe the Faraday/multiplier cup layout.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laSficpmsUPbTAPP/detectorConfiguration
                      '@type':
                        const:
                        - schema:PropertyValue
                      schema:propertyID:
                        const:
                        - '@id': ada:parameter/laSficpmsUPbTAPP/detectorConfiguration
                      schema:name:
                        const: Detector Configuration
                      schema:value:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                    readOnly: true
                  - &id018
                    title: ICP Tuning
                    description: Description of the approach used to optimise ICP plasma conditions prior
                      to analysis, including the reference material used for tuning and the acceptance
                      criteria (e.g., oxide production threshold, sensitivity targets, mass calibration).
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laSficpmsUPbTAPP/icpTuningDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: icpTuningDefault
                      schema:name:
                        const: ICP Tuning
                      ada:dataType:
                        const: string
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
                        const: R
                    required:
                    - '@id'
                    - '@type'
                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                  - &id019
                    title: Doubly-Charged Species Monitor
                    description: The mass ratio monitored to estimate doubly-charged ion (M²⁺) formation
                      during instrument tuning. Doubly-charged ions appear at half the mass of the parent
                      ion and can cause isobaric interferences on analytes in that mass region. The monitor
                      species and the mass positions monitored should be stated explicitly. Analogous
                      to Oxide Production Method and Threshold for oxide monitoring.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laSficpmsUPbTAPP/doublyChargedSpeciesMonitorDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: doublyChargedSpeciesMonitorDefault
                      schema:name:
                        const: Doubly-Charged Species Monitor
                      ada:dataType:
                        const: string
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
                        const: R
                    required:
                    - '@id'
                    - '@type'
                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                  - &id020
                    title: Doubly-Charged Species Production
                    description: Measured percentage of doubly-charged ion production for the monitored
                      species at the time of instrument tuning. The procedure should specify the acceptable
                      threshold (e.g., <1%, <3%); the measured value for each session is recorded here.
                      Report both the threshold and the measured value where possible.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laSficpmsUPbTAPP/doublyChargedSpeciesProductionDefault
                      '@type':
