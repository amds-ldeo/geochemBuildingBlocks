                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/laSficpmsUPbTAPP/faradayCupArrayConfiguration
                                schema:name:
                                  const: Faraday Cup Array Configuration
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                              readOnly: true
                            minContains: 0
                            maxContains: 1
                          - contains:
                              title: Faraday Cup Amplifier Resistor Values
                              description: ''
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/laSficpmsUPbTAPP/faradayCupAmplifierResistorValues
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/laSficpmsUPbTAPP/faradayCupAmplifierResistorValues
                                schema:name:
                                  const: Faraday Cup Amplifier Resistor Values
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                              readOnly: true
                            minContains: 0
                            maxContains: 1
                        schema:description:
                          anyOf:
                          - type: string
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              readOnly: true
                allOf:
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          const: Interface Cone
                    required:
                    - schema:additionalType
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          const: ICP Source
                    required:
                    - schema:additionalType
      allOf:
      - contains:
          properties:
            schema:additionalType:
              contains:
                const: Laser Ablation System
          required:
          - schema:additionalType
      - contains:
          properties:
            schema:additionalType:
              contains:
                const: ICPMS
          required:
          - schema:additionalType
    bios:computationalTool:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              ada:toolRole:
                const: acquisition
            required:
            - ada:toolRole
          then:
            properties:
              schema:name:
                description: Instrument control and data acquisition software used to collect raw signal
                  data, including version number. Separate from data reduction software.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
        - if:
            properties:
              ada:toolRole:
                const: dataReduction
            required:
            - ada:toolRole
          then:
            properties:
              schema:name:
                description: Software used for signal processing, background subtraction, and concentration
                  calculation, including version number.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
        required:
        - ada:toolRole
    ada:sampleIntroduction:
      description: Configuration by which the ablated aerosol is delivered to the plasma, including tubing,
        any signal-homogenising device, and any co-aspirated solution introduced alongside the aerosol
        — for example a Tl solution used for instrumental mass bias correction, or an isotopic spike used
        for isotope dilution. Distinct from the carrier and make-up gas fields, which record gas identity
        and flow rather than what else enters the plasma.
      type: string
      readOnly: true
    ada:analyticalMode:
      type: array
      items:
        description: Primary analytical mode(s) executed under this procedure. For single-mode procedures,
          records one value (e.g., Spot). For multi-mode procedures (e.g., spot analysis combined with
          transect scanning), list all applicable modes. Serves as the procedure-level declaration of
          measurement type, distinct from the mode flag columns which indicate per-field applicability.
        type: string
        enum:
        - Spot
        - Transect
        - Mapping
        - Spot; Transect
        - missing
        readOnly: true
    ada:ablationSamplingMode:
      type: array
      items:
        description: Sampling mode or ablation pattern used during analysis.
        type: string
        enum:
        - Spot (stationary)
        - Transect (continuous line scan)
        - Raster area (2D elemental mapping)
        - Stepped line profile
        - N/A
        - None
        - missing
        readOnly: true
    ada:ablationSpotDurationDefault:
      description: 'Total on-sample ablation (signal acquisition) time per individual spot in seconds,
        as set in the acquisition method. This is a procedure-level parameter for spot analysis: it reflects
        the deliberate trade-off between signal accumulation (longer = lower LOD), sample consumption,
        and session throughput. For transect analysis, the equivalent procedure-level parameter is scan
        speed (captured in Transect Rate, Mapping Rate or Step Size). For mapping analysis, total acquisition
        time is sample-area-dependent and therefore analysis-level, not captured here.'
      anyOf:
      - type: number
      - type: string
    ada:ablationPitDepthRateDefault:
      description: Depth of the ablation pit produced under the registered laser conditions, the method
        used to measure it, and the resulting per-pulse ablation rate. Sets the achievable depth resolution
        and governs downhole elemental fractionation. For transect and mapping the equivalent quantity
        is trench depth under the same conditions.
      type: string
    ada:rasterLineSpacingDefault:
      description: Distance between adjacent raster lines in a 2D elemental map, measured perpendicular
        to the scan direction, in micrometres. Together with spot size, this determines whether adjacent
        lines are contiguous (line spacing = spot size), overlapping (line spacing < spot size), or have
        gaps (line spacing > spot size). Applies to raster mapping only.
      type: string
    ada:carrierGasFlowRateDefault:
      description: Gas used to transport ablated aerosol from the ablation cell to the ICP-MS torch, with
        the procedure-registered target flow rate(s). Helium is standard for most UV laser systems due
        to superior aerosol transport. Flow rates are procedure targets; actual session values may be
        adjusted within ±10% during tuning.
      type: string
    ada:oxideProductionMethodAndThreshold:
      description: Method used to quantify plasma oxide production and the acceptance threshold applied
        before commencing analysis. Record both the monitored mass ratio(s) and the maximum allowed threshold(s).
        Measured values are recorded in Oxide Production. The ThO⁺/Th⁺ ratio (mass 248/232) is most widely
        used, but UO⁺/U⁺ (mass 254/238) or CeO⁺/Ce⁺ (mass 156/140) may also be used.
      type: string
      readOnly: true
    ada:analysisSequenceDefault:
      description: Repeating order of primary calibration standard(s), quality control standard(s), and
        unknown analyses within a measurement session. Editable to allow minor adjustments while maintaining
        the bracketing strategy defined in the procedure.
      type: string
    ada:analyteTemplate:
      type: object
      properties:
        ada:defaultAnalytes:
          type: array
          items:
            type: object
            properties: {}
        ada:analyteColumns:
          type: array
          items:
            anyOf:
            - $ref: ../../../../BaseSchema/tappDefinition/schema.yaml#/$defs/AnalyteIdentifierColumn
            - &id025
              title: Monitored Isotopes
              description: Specific isotope(s) monitored in this procedure, grouped by the analyte element
                they serve where they serve one. Includes interference-monitor and internal-standard masses,
                which serve no analyte and so have no parent element. The analyte list is given by the
                Analyte field and is never inferred from the element symbols appearing here.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/monitoredIsotopes
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: monitoredIsotopes
                schema:name:
                  const: Monitored Isotopes
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id026
              title: Dwell Time per Mass
              description: 'Count time (dwell time) per mass position for each measured isotope in milliseconds.
                Longer dwell times improve counting statistics and lower detection limits but reduce the
                number of isotopes measurable within a given scan cycle time. For mapping, scan cycle
                time directly determines spatial resolution at a given scan speed: shorter cycle time
                = finer spatial resolution.'
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/dwellTimePerMass
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: dwellTimePerMass
                schema:name:
                  const: Dwell Time per Mass
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id027
              title: Isobaric Interference Corrections Applied
              description: 'Whether isobaric interference corrections were applied for any measured isotope
                in this procedure. A procedure-level Boolean: if the procedure includes interference corrections,
                this is always Yes. Detail for each affected mass is captured in Interfering Species and
                Interference Correction Method.'
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/isobaricInterferenceCorrectionsApplied
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: isobaricInterferenceCorrectionsApplied
                schema:name:
                  const: Isobaric Interference Corrections Applied
                ada:dataType:
                  const: boolean
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id028
              title: Interfering Species
              description: Elemental or molecular species (oxides, argides, doubly charged ions) overlapping
                with the measured isotope.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/interferingSpecies
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: interferingSpecies
                schema:name:
                  const: Interfering Species
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id029
              title: Interference Correction Method
              description: Equation or procedure used to correct for isobaric interferences, including
                the production rate factor and the reference material used to measure it.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/interferenceCorrectionMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: interferenceCorrectionMethod
                schema:name:
                  const: Interference Correction Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id030
              title: Normalization / Standards-Based Correction
              description: Any post-acquisition normalization applied to correct for systematic biases
                identified from secondary reference materials, or stoichiometric normalization applied
                per pixel in mapping. Distinct from the primary internal standard approach captured in
                Internal Standard Approach.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/normalizationStandardsBasedCorrection
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: normalizationStandardsBasedCorrection
                schema:name:
                  const: Normalization / Standards-Based Correction
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id031
              title: Detection Limit
              description: Session detection limit, one per reported concentration variable (one per analyte,
                these being the same set), expressed in µg g⁻¹, ng g⁻¹, or wt% as appropriate. Mandatory
                at analysis level to demonstrate the reliability of reported near-detection-limit concentrations.
                The calculation method is captured separately in Detection Limit Method.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/detectionLimit
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: detectionLimit
                schema:name:
                  const: Detection Limit
                ada:dataType:
                  const: number
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  anyOf:
                  - type: number
                  - type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id032
              title: Detection Limit Method
              description: Reference or description of the method used to calculate session detection
                limits. Mandatory at analysis level. Must be consistent with the method applied to generate
                the Detection Limit values reported above.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/detectionLimitMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: detectionLimitMethod
                schema:name:
                  const: Detection Limit Method
                ada:dataType:
                  const: uri
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id033
              title: Limit of Quantification (LOQ) Method
              description: 'Reference or description of the method used to calculate the limit of quantification
                (LOQ): the lowest concentration reliably measurable with acceptable precision and accuracy.
                Mandatory at analysis level when concentrations near the LOD are reported. Concentrations
                between LOD and LOQ are detectable but not reliably quantifiable.'
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/limitOfQuantificationMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: limitOfQuantificationMethod
                schema:name:
                  const: Limit of Quantification (LOQ) Method
                ada:dataType:
                  const: uri
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id034
              title: Within-Session Analytical Precision and Assessment Method
              description: 'Reproducibility of repeated measurements within a single analytical session.
                Report both the assessment method and the precision values. Assessment method must specify:
                (1) the reference material used, (2) number of replicates n, and (3) the statistic reported
                (1σ RSD, 2σ RSD, etc.). For mapping: assess from repeated analyses of a reference material
                area at session start and end, or from replicate analyses of a homogeneous reference phase
                within the map.'
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/withinSessionAnalyticalPrecisionAndAssessmentMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: withinSessionAnalyticalPrecisionAndAssessmentMethod
                schema:name:
                  const: Within-Session Analytical Precision and Assessment Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id035
              title: Between-Session (Long-Term) Analytical Precision and Assessment Method
              description: 'Reproducibility of measurements across multiple analytical sessions over weeks
                to months (long-term or intermediate precision). Report both the assessment method and
                the precision values. Specify: reference material used, number of sessions n, time span
                covered, and statistic reported. Long-term precision is typically assessed from a compiled
                record of secondary reference material values across all sessions.'
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/betweenSessionAnalyticalPrecisionAndAssessmentMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: betweenSessionAnalyticalPrecisionAndAssessmentMethod
                schema:name:
                  const: Between-Session (Long-Term) Analytical Precision and Assessment Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id036
              title: Analytical Accuracy and Assessment Method
              description: 'Offset between measured and accepted reference values for secondary reference
                materials, expressed as % relative bias. Report both the assessment method and the accuracy
                values. Specify: (1) secondary RM used and source of reference values, (2) number of analyses,
                and (3) elements or element groups assessed. Report any systematic biases and likely causes.'
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/analyticalAccuracyAndAssessmentMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: analyticalAccuracyAndAssessmentMethod
                schema:name:
                  const: Analytical Accuracy and Assessment Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id037
              title: Mass Resolution per Analyte
              description: ''
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/massResolutionPerAnalyte
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: massResolutionPerAnalyte
                schema:name:
                  const: Mass Resolution per Analyte
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: O
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
          allOf:
          - contains: *id025
            minContains: 0
            maxContains: 1
          - contains: *id026
            minContains: 0
            maxContains: 1
          - contains: *id027
            minContains: 0
            maxContains: 1
          - contains: *id028
            minContains: 0
            maxContains: 1
          - contains: *id029
            minContains: 0
            maxContains: 1
          - contains: *id030
            minContains: 0
            maxContains: 1
          - contains: *id031
            minContains: 0
            maxContains: 1
          - contains: *id032
            minContains: 0
            maxContains: 1
          - contains: *id033
            minContains: 0
            maxContains: 1
          - contains: *id034
            minContains: 0
            maxContains: 1
          - contains: *id035
            minContains: 0
            maxContains: 1
          - contains: *id036
            minContains: 0
            maxContains: 1
          - contains: *id037
            minContains: 0
            maxContains: 1
    ada:reportedPropertyTemplate:
      type: object
      properties:
        ada:defaultReportedProperties:
          type: array
          items:
            description: The final variable(s) this procedure reports and their units — distinct from
              the fields recording what was *acquired* rather than what is reported. A procedure may acquire
              many channels and report a small number of derived quantities; without this field a data
              consumer cannot tell which. Record every reported variable, including intermediate quantities
              reported alongside final ones (e.g. both the 206Pb/238U ratio and the 206Pb/238U date).
              Where a reported variable is a nominal property with no magnitude (e.g. a mineral identification),
              record the variable and give the unit as 'N/A — nominal property'.
            type: string
            readOnly: true
    ada:massResolutionAssignment:
      description: Mass resolution mode assigned to each acquired mass. The selected resolution determines
        which polyatomic interferences are physically resolved by the magnetic sector. One analyte may
        be acquired at more than one resolution, so the assignment is per acquired mass rather than per
        element. The overall mode(s) used in the procedure are recorded in Mass Resolution Setting (Group
        3).
      type: string
      readOnly: true
    ada:ionCounterDeadTimeDefault:
      description: Dead time of each ion-counting detector channel, used in the dead-time correction applied
        to high count rates. Distinct from pulse/analog cross-calibration, which relates the two detector
        modes rather than correcting counting losses within the pulse-counting mode.
      anyOf:
      - type: number
      - type: string
    ada:totalIntegrationTimePerOutputDataPointDefault:
      type: string
      readOnly: true
    ada:backgroundCountTimeDefault:
      description: Total time spent measuring gas blank (background signal with laser off or shutter closed)
        before each ablation event, in seconds. For spot and transect analysis, a discrete background
        interval is measured before each ablation. For mapping, background is typically measured once
        per raster line or at the start of a map session rather than before each individual pixel. Editable
        to allow session-specific adjustment.
      anyOf:
      - type: number
      - type: string
    ada:internalStandardApproach:
      description: Method used to determine the internal standard (IS) concentration for each unknown
        sample, used to correct for variable ablation yield between analyses. The approach is a fundamental
        procedure design choice that cannot be changed by analysts.
      type: string
      readOnly: true
    ada:internalStandardElement:
      description: Element(s) used as the internal standard, and how the IS concentration value was determined
        for unknown samples. For mapping procedures using oxide-sum normalization, report "None (oxide-sum
        normalization)" and cite the method reference.
      type: string
      readOnly: true
    ada:perAnalyteCalibrationStrategy:
      type: array
      items:
        description: Documents cases where different analytes or analyte groups within the same session
          are calibrated using different strategies — for example, one element used as the internal standard
          while trace elements are calibrated by an external reference material, or different primary
          standards applied to different mass ranges or mineral phases. If a single calibration strategy
          applies uniformly to all analytes, state that here and refer to Internal Standard Approach and
          Normalization / Standards-Based Correction for details. Free text; list the strategy for each
          analyte or analyte group as needed.
        type: string
        readOnly: true
    ada:elementalFractionationCorrection:
      type: array
      items:
        description: Method used to correct for laser-induced elemental fractionation (LIEF), including
          downhole fractionation during prolonged ablation, matrix-dependent fractionation between sample
          and calibration standard, and any specific correction algorithm applied. Reference the software
          function or publication.
        type: string
        readOnly: true
    ada:massBiasCorrectionStrategy:
      description: 'Strategy used to correct instrumental isotopic mass fractionation, also called mass
        bias or mass discrimination. Distinct from Elemental Fractionation Correction, which addresses
        inter-element fractionation during ablation and transport: this field addresses discrimination
        between isotopes of the same element, and applies wherever the procedure reports isotope ratios.'
      type: string
      readOnly: true
    ada:uncertaintyLevel:
      description: 'The convention at which reported uncertainties are quoted — 1-sigma, 2-sigma, or a
        95% confidence interval — and whether a measured spread is reported as a standard error or a standard
        deviation. A reported uncertainty is not interpretable without it: the same numeric value means
        different things at 1-sigma and at 95% confidence. State the convention applying to all values
        reported under this procedure, and state each separately where different reported quantities use
        different conventions. Distinct from Uncertainty Propagation Method, which addresses how component
        uncertainties are combined rather than how the result is quoted.'
      type: string
      enum:
      - 2σ (95% confidence)
      - 1σ (68% confidence)
      - 95% confidence interval
      - 2 standard errors (2SE)
      - 1 standard deviation (1SD)
      - N/A
      - None
      - missing
      readOnly: true
    ada:signalIntegrationIntervalMethod:
      description: 'Approach used to select the stable signal interval for integration during data reduction,
        and to exclude anomalous signals from inclusions or cracks. For spot/transect analysis: involves
        identifying and excluding transient start/end instabilities within the time-resolved signal. For
        mapping analysis: corresponds to defining Volumes of Interest (VOIs) or applying phase masks across
        the 2D map (e.g., manual selection, automated clustering, threshold-based masking).'
      type: string
      readOnly: true
    ada:blankBackgroundCorrectionMethod:
      description: 'Method used to subtract the gas blank (background signal with laser off) from the
        ablation signal. For spot and transect analysis: typically the mean of a pre-ablation gas blank
        interval is subtracted per isotope per analysis. For mapping: background may be subtracted per
        raster line, per map session, or using a separate gas blank map acquired under identical conditions.'
      type: string
      readOnly: true
    ada:ageCalculationMethod:
      type: array
      items:
        description: The equation used to convert the measured quantities into an age or date, together
          with a citation for that equation. Name the equation unambiguously; where a procedure supports
          more than one, state which is used and under what conditions. Required by every geochronology
          reporting standard surveyed (Condon et al. 2024; Schaen et al. 2021; Rooney et al. 2024; Flowers
          et al. 2024; Kohn et al. 2024; Mahan et al. 2023). Distinct from Age Model and Software, which
          records how multiple analyses are combined into a single reported result.
        type: string
        readOnly: true
    ada:reportedDateType:
      type: array
      items:
        description: The kind of date or age the procedure reports. Most dating systems derive several
          different date types from the same measurements, so a reported age is ambiguous without this.
          Where more than one type is reported, list all, separated by semicolons. Kohn et al. (2024)
          carry this as a named required item ("fission-track age type"); the equivalent distinction is
          required by all five other standards surveyed.
        type: string
        enum:
        - Weighted mean 206Pb/238U
        - Weighted mean 207Pb/235U
        - Weighted mean 207Pb/206Pb
        - Concordia upper intercept
        - Concordia lower intercept
        - Tera-Wasserburg intercept
        - Single-grain date
        - Isochron date
        - N/A
        - None
        - missing
    ada:inheritedOrInitialSignalCorrectionDefault:
      description: 'How any non-radiogenic, inherited or pre-existing component of the measured signal
        was accounted for, including the composition assumed, its source, and its uncertainty. Record
        ''None'' where the measured quantity accumulates from zero and no such component exists. Applies
        to five of the six dating systems surveyed; fission track is the sole genuine exception, as tracks
        accumulate from zero. D=Editable rather than Read-Only: the procedure registers the correction
        method and any default composition, but the value actually applied is frequently sample-specific
        (a two-stage model composition is evaluated at the interpreted age) or session-derived (a trapped
        composition solved from an isochron intercept), and a revision to the assumed composition should
        not require registering a new procedure. Same reasoning as Rule 5''s Constants and Reference Values
        Used.'
      type: string
    ada:ageModelDefault:
      description: 'The statistical model used to combine individual analyses into a single reported age,
        including any criteria governing which model is applied. This is a methodological choice that
        changes the result: a Model-1 and a Model-3 regression of the same data yield different ages and
        different uncertainties. Record the model only — the software implementing it belongs in Data
        Reduction Software (Group 3), whose scope already extends to age calculation; where reduction
        and age regression use different packages, list both there. Required in some form by all six geochronology
        reporting standards surveyed.'
      type: string
    ada:primaryStandardNameDefault:
      description: Primary reference material(s) used to calibrate the instrument and convert raw signal
        intensities to concentrations or isotope ratios. Include material name, source institution, and
        citation for the accepted values used. Editable because the specific lot or certification vintage
        may differ between sessions while the material type remains the same.
      type: string
    ada:calibrationMeasurementFrequency:
      description: How often the primary calibration standard is measured relative to unknown samples
        within a session. For LA-ICP-MS, this defines the bracketing interval between calibration standard
        ablations used to monitor and correct for instrumental drift.
      type: string
      readOnly: true
    ada:secondaryReferenceMaterialDefault:
      type: array
      items:
        description: Quality-control reference materials analysed as unknowns alongside samples in the
          same session to assess accuracy and monitor drift. Include material name, source, and citation
          for accepted values used for comparison. Editable because selection of secondary RMs may vary
          across sessions.
        type: string
    schema:description:
      description: 'Any procedure- or analysis-specific information not captured by a structured field
        anywhere in this TAPP — including anomalies, deviations from the registered procedure, instrument
        modifications, and supplementary context. Scope is the whole document, not Group 6: this is the
        last field of the TAPP and covers all six groups. Use sparingly; a structured field is preferred
        for anything that can be formally categorised.'
      type: string
    ada:signalCollectionMode:
      type: string
      readOnly: true
    ada:spotDiameterDefault:
      type: string
      readOnly: true
    ada:massesMeasuredDefault:
      type: string
      readOnly: true
    ada:dwellTimesDefault:
      type: string
      readOnly: true
    ada:gasBlank:
      type: string
      readOnly: true
    ada:internalNormalizationElementAndIsotopeRatio:
      type: string
      readOnly: true
    ada:commonPbCorrectionCompositionAndUncertainty:
      type: string
      readOnly: true
