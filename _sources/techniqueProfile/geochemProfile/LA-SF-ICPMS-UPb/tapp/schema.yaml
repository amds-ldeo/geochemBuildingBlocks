                  - $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Procedure_laserBeamEnergyProfile
                  - $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Procedure_laserPulseDuration
                allOf:
                - contains:
                    $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Procedure_laserEnergy
                  minContains: 0
                  maxContains: 1
                - contains:
                    $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Procedure_laserBeamEnergyProfile
                  minContains: 0
                  maxContains: 1
                - contains:
                    $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Procedure_laserPulseDuration
                  minContains: 0
                  maxContains: 1
      allOf:
      - contains:
          properties:
            schema:additionalType:
              contains:
                const: ICPMS
              schema:inDefinedTermSet: ada:vocab/instrumentType
          required:
          - schema:additionalType
      - contains:
          properties:
            schema:additionalType:
              contains:
                const: Laser Ablation System
              schema:inDefinedTermSet: ada:vocab/instrumentType
          required:
          - schema:additionalType
    ada:sampleIntroduction:
      description: Configuration by which the ablated aerosol is delivered to the plasma, including tubing,
        any signal-homogenising device, and any co-aspirated solution introduced alongside the aerosol
        — for example a Tl solution used for instrumental mass bias correction, or an isotopic spike used
        for isotope dilution. Distinct from the carrier and make-up gas fields, which record gas identity
        and flow rather than what else enters the plasma.
      type: string
      readOnly: true
    ada:carrierGasFlowRateDefault:
      description: Gas used to transport ablated aerosol from the ablation cell to the ICP-MS torch, with
        the procedure-registered target flow rate(s). Helium is standard for most UV laser systems due
        to superior aerosol transport. Flow rates are procedure targets; actual session values may be
        adjusted within ±10% during tuning.
      type: string
    ada:oxideProductionMethodAndThreshold:
      description: Method used to quantify plasma oxide production and the acceptance threshold applied
        before commencing analysis. Record both the monitored mass ratio(s) and the maximum allowed threshold(s).
        Measured values are recorded in Oxide Production. The ThO⁺/Th⁺ ratio (mass 248/232) is most widely
        used, but UO⁺/U⁺ (mass 254/238) or CeO⁺/Ce⁺ (mass 156/140) may also be used.
      type: string
      readOnly: true
    ada:analysisSequenceDefault:
      description: Repeating order of primary calibration standard(s), quality control standard(s), and
        unknown analyses within a measurement session. Editable to allow minor adjustments while maintaining
        the bracketing strategy defined in the procedure.
      type: string
    ada:analyteTemplate:
      type: object
      properties:
        ada:analyteColumns:
          type: array
          items:
            anyOf:
            - $ref: ../../../../BaseSchema/tappDefinition/schema.yaml#/$defs/AnalyteIdentifierColumn
            - &id020
              title: Monitored Masses
              description: Specific masses monitored in this procedure, grouped by the analyte element
                they serve where they serve one. Covers atomic isotopes and, where a reaction cell shifts
                an analyte onto a different mass, the product mass actually measured. Includes interference-monitor
                and internal-standard masses, which serve no analyte and so have no parent element. The
                analyte list is given by the Analyte field and is never inferred from the element symbols
                appearing here.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/monitoredMasses
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: monitoredMasses
                schema:name:
                  const: Monitored Masses
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id021
              title: Mass Resolution Assignment
              description: Mass resolution mode assigned to each acquired mass. The selected resolution
                determines which polyatomic interferences are physically resolved by the magnetic sector.
                One analyte may be acquired at more than one resolution, so the assignment is per acquired
                mass rather than per element. The overall mode(s) used in the procedure are recorded in
                Mass Resolution Setting (Group 3).
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/massResolutionAssignment
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: massResolutionAssignment
                schema:name:
                  const: Mass Resolution Assignment
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id022
              title: Dwell Time per Mass
              description: 'Count time (dwell time) per mass position for each measured isotope in milliseconds.
                Longer dwell times improve counting statistics and lower detection limits but reduce the
                number of isotopes measurable within a given scan cycle time. For mapping, scan cycle
                time directly determines spatial resolution at a given scan speed: shorter cycle time
                = finer spatial resolution.'
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/dwellTimePerMass
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: dwellTimePerMass
                schema:name:
                  const: Dwell Time per Mass
                ada:dataType:
                  const: number
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: M
                schema:defaultValue:
                  anyOf:
                  - type: number
                  - type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id023
              title: Isobaric Interference Corrections Applied
              description: 'Whether isobaric interference corrections were applied for any measured isotope
                in this procedure. A procedure-level Boolean: if the procedure includes interference corrections,
                this is always Yes. Detail for each affected mass is captured in Interfering Species and
                Interference Correction Method.'
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/isobaricInterferenceCorrectionsApplied
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: isobaricInterferenceCorrectionsApplied
                schema:name:
                  const: Isobaric Interference Corrections Applied
                ada:dataType:
                  const: boolean
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id024
              title: Interfering Species
              description: Elemental or molecular species (oxides, argides, doubly charged ions) overlapping
                with the measured isotope.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/interferingSpecies
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: interferingSpecies
                schema:name:
                  const: Interfering Species
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id025
              title: Interference Correction Method
              description: Equation or procedure used to correct for isobaric interferences, including
                the production rate factor and the reference material used to measure it.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/interferenceCorrectionMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: interferenceCorrectionMethod
                schema:name:
                  const: Interference Correction Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id026
              title: Normalization / Standards-Based Correction
              description: Any post-acquisition normalization applied to correct for systematic biases
                identified from secondary reference materials, or stoichiometric normalization applied
                per pixel in mapping. Distinct from the primary internal standard approach captured in
                Internal Standard Approach.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/normalizationStandardsBasedCorrection
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: normalizationStandardsBasedCorrection
                schema:name:
                  const: Normalization / Standards-Based Correction
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id027
              title: Detection Limit
              description: Session detection limit, one per reported concentration variable (one per analyte,
                these being the same set), expressed in µg g⁻¹, ng g⁻¹, or wt% as appropriate. Mandatory
                at analysis level to demonstrate the reliability of reported near-detection-limit concentrations.
                The calculation method is captured separately in Detection Limit Method.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/detectionLimit
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: detectionLimit
                schema:name:
                  const: Detection Limit
                ada:dataType:
                  const: number
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  anyOf:
                  - type: number
                  - type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id028
              title: Detection Limit Method
              description: Reference or description of the method used to calculate session detection
                limits. Mandatory at analysis level. Must be consistent with the method applied to generate
                the Detection Limit values reported above.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/detectionLimitMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: detectionLimitMethod
                schema:name:
                  const: Detection Limit Method
                ada:dataType:
                  const: uri
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id029
              title: Limit of Quantification (LOQ) Method
              description: 'Reference or description of the method used to calculate the limit of quantification
                (LOQ): the lowest concentration reliably measurable with acceptable precision and accuracy.
                Mandatory at analysis level when concentrations near the LOD are reported. Concentrations
                between LOD and LOQ are detectable but not reliably quantifiable.'
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/limitOfQuantificationMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: limitOfQuantificationMethod
                schema:name:
                  const: Limit of Quantification (LOQ) Method
                ada:dataType:
                  const: uri
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id030
              title: Within-Session Analytical Precision and Assessment Method
              description: Precision of repeated measurements within a single analytical session and the
                method used to assess it. Report both the assessment method and the precision values.
                The assessment method must specify the reference material or standard measured, the number
                of replicates n, and the statistic reported (1s RSD, 2s RSD, 2SD, 2SE, 95% CI). Distinct
                from the internal precision of a single measurement, which derives from counting statistics
                over the cycles of that measurement rather than from repeated analyses.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/withinSessionAnalyticalPrecisionAndAssessmentMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: withinSessionAnalyticalPrecisionAndAssessmentMethod
                schema:name:
                  const: Within-Session Analytical Precision and Assessment Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id031
              title: Between-Session (Long-Term) Analytical Precision and Assessment Method
              description: Precision of measurements across multiple analytical sessions over weeks to
                months — long-term or intermediate precision — and the method used to assess it. Report
                both the assessment method and the precision values, specifying the reference material,
                the number of measurements and sessions, the time span covered, and the statistic reported.
                Long-term precision is normally poorer than within-session precision and is the figure
                a data user should carry when comparing results from different sessions.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/betweenSessionAnalyticalPrecisionAndAssessmentMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: betweenSessionAnalyticalPrecisionAndAssessmentMethod
                schema:name:
                  const: Between-Session (Long-Term) Analytical Precision and Assessment Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id032
              title: Analytical Accuracy and Assessment Method
              description: 'Offset between measured and accepted reference values for secondary reference
                materials, expressed as % relative bias. Report both the assessment method and the accuracy
                values. Specify: (1) secondary RM used and source of reference values, (2) number of analyses,
                and (3) elements or element groups assessed. Report any systematic biases and likely causes.'
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laSficpmsUPbTAPP/analyticalAccuracyAndAssessmentMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: analyticalAccuracyAndAssessmentMethod
                schema:name:
                  const: Analytical Accuracy and Assessment Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
          allOf:
          - contains: *id020
            minContains: 0
            maxContains: 1
          - contains: *id021
            minContains: 0
            maxContains: 1
          - contains: *id022
            minContains: 0
            maxContains: 1
          - contains: *id023
            minContains: 0
            maxContains: 1
          - contains: *id024
            minContains: 0
            maxContains: 1
          - contains: *id025
            minContains: 0
            maxContains: 1
          - contains: *id026
            minContains: 0
            maxContains: 1
          - contains: *id027
            minContains: 0
            maxContains: 1
          - contains: *id028
            minContains: 0
            maxContains: 1
          - contains: *id029
            minContains: 0
            maxContains: 1
          - contains: *id030
            minContains: 0
            maxContains: 1
          - contains: *id031
            minContains: 0
            maxContains: 1
          - contains: *id032
            minContains: 0
            maxContains: 1
    ada:massesMeasuredDefault:
      description: Specific masses monitored in this procedure, grouped by the analyte element they serve
        where they serve one. Covers atomic isotopes and, where a reaction cell shifts an analyte onto
        a different mass, the product mass actually measured. Includes interference-monitor and internal-standard
        masses, which serve no analyte and so have no parent element. The analyte list is given by the
        Analyte field and is never inferred from the element symbols appearing here.
      type: string
      readOnly: true
    ada:massResolutionAssignment:
      description: Mass resolution mode assigned to each acquired mass. The selected resolution determines
        which polyatomic interferences are physically resolved by the magnetic sector. One analyte may
        be acquired at more than one resolution, so the assignment is per acquired mass rather than per
        element. The overall mode(s) used in the procedure are recorded in Mass Resolution Setting (Group
        3).
      type: string
      readOnly: true
    ada:ionCounterDeadTimeDefault:
      description: Dead time of each ion-counting detector channel, used in the dead-time correction applied
        to high count rates. Distinct from pulse/analog cross-calibration, which relates the two detector
        modes rather than correcting counting losses within the pulse-counting mode.
      anyOf:
      - type: number
      - type: string
    ada:backgroundCountTimeDefault:
      description: Total time spent measuring gas blank (background signal with laser off or shutter closed)
        before each ablation event, in seconds. For spot and transect analysis, a discrete background
        interval is measured before each ablation. For mapping, background is typically measured once
        per raster line or at the start of a map session rather than before each individual pixel. Editable
        to allow session-specific adjustment.
      anyOf:
      - type: number
      - type: string
    ada:internalStandardApproach:
      description: Method used to determine the internal standard (IS) concentration for each unknown
        sample, used to correct for variable ablation yield between analyses. The approach is a fundamental
        procedure design choice that cannot be changed by analysts.
      type: string
      readOnly: true
    ada:internalStandardElement:
      description: Element(s) used as the internal standard, and how the IS concentration value was determined
        for unknown samples. For mapping procedures using oxide-sum normalization, report "None (oxide-sum
        normalization)" and cite the method reference.
      type: string
      readOnly: true
    ada:perAnalyteCalibrationStrategy:
      type: array
      items:
        description: Documents cases where different analytes or analyte groups within the same session
          are calibrated using different strategies — for example, one element used as the internal standard
          while trace elements are calibrated by an external reference material, or different primary
          standards applied to different mass ranges or mineral phases. If a single calibration strategy
          applies uniformly to all analytes, state that here and refer to Internal Standard Approach and
          Normalization / Standards-Based Correction for details. Free text; list the strategy for each
          analyte or analyte group as needed.
        type: string
        readOnly: true
    ada:elementalFractionationCorrection:
      type: array
      items:
        description: Method used to correct for laser-induced elemental fractionation (LIEF), including
          downhole fractionation during prolonged ablation, matrix-dependent fractionation between sample
          and calibration standard, and any specific correction algorithm applied. Reference the software
          function or publication.
        type: string
        readOnly: true
    ada:massBiasCorrectionStrategy:
      description: 'Strategy used to correct instrumental isotopic mass fractionation, also called mass
        bias or mass discrimination. Distinct from Elemental Fractionation Correction, which addresses
        inter-element fractionation during ablation and transport: this field addresses discrimination
        between isotopes of the same element, and applies wherever the procedure reports isotope ratios.'
      type: string
      readOnly: true
    ada:uncertaintyLevel:
      description: 'The convention at which reported uncertainties are quoted — 1-sigma, 2-sigma, or a
        95% confidence interval — and whether a measured spread is reported as a standard error or a standard
        deviation. A reported uncertainty is not interpretable without it: the same numeric value means
        different things at 1-sigma and at 95% confidence. State the convention applying to all values
        reported under this procedure, and state each separately where different reported quantities use
        different conventions. Distinct from Uncertainty Propagation Method, which addresses how component
        uncertainties are combined rather than how the result is quoted.'
      anyOf:
      - type: string
        enum:
        - 2σ (95% confidence)
        - 1σ (68% confidence)
        - 95% confidence interval
        - 2 standard errors (2SE)
        - 1 standard deviation (1SD)
        - N/A
        - None
        - missing
      - type: string
      readOnly: true
    ada:signalIntegrationIntervalMethod:
      description: 'Approach used to select the stable signal interval for integration during data reduction,
        and to exclude anomalous signals from inclusions or cracks. For spot/transect analysis: involves
        identifying and excluding transient start/end instabilities within the time-resolved signal. For
        mapping analysis: corresponds to defining Volumes of Interest (VOIs) or applying phase masks across
        the 2D map (e.g., manual selection, automated clustering, threshold-based masking).'
      type: string
      readOnly: true
    ada:blankBackgroundCorrectionMethod:
      description: 'Method used to subtract the gas blank (background signal with laser off) from the
        ablation signal. For spot and transect analysis: typically the mean of a pre-ablation gas blank
        interval is subtracted per isotope per analysis. For mapping: background may be subtracted per
        raster line, per map session, or using a separate gas blank map acquired under identical conditions.'
      type: string
      readOnly: true
    ada:primaryStandardNameDefault:
      description: Primary reference material(s) used to calibrate the instrument and convert raw signal
        intensities to concentrations or isotope ratios. Include material name, source institution, and
        citation for the accepted values used. Editable because the specific lot or certification vintage
        may differ between sessions while the material type remains the same.
      type: string
    ada:calibrationMeasurementFrequency:
      description: How often the primary calibration standard is measured relative to unknown samples
        within a session. For LA-ICP-MS, this defines the bracketing interval between calibration standard
        ablations used to monitor and correct for instrumental drift.
      type: string
      readOnly: true
    ada:secondaryReferenceMaterialDefault:
      type: array
      items:
        description: Quality-control reference materials analysed as unknowns alongside samples in the
          same session to assess accuracy and monitor drift. Include material name, source, and citation
          for accepted values used for comparison. Editable because selection of secondary RMs may vary
          across sessions.
        type: string
    ada:totalIntegrationTimePerOutputDataPointDefault:
      description: Total duty-cycle time for one complete mass-scan sweep — the sum of all per-isotope
        dwell times plus inter-mass settling times. Sets the time resolution of the downhole signal, and
        is not recoverable from Dwell Time per Mass alone because settling time is not captured there.
        Applies to sequential (quadrupole and single-collector sector-field) acquisition.
      anyOf:
      - type: number
      - type: string
  required:
  - ada:sampleIntroduction
  - ada:carrierGasFlowRateDefault
  - ada:oxideProductionMethodAndThreshold
  - ada:analysisSequenceDefault
  - ada:massesMeasuredDefault
  - ada:massResolutionAssignment
  - ada:ionCounterDeadTimeDefault
  - ada:backgroundCountTimeDefault
  - ada:internalStandardApproach
  - ada:internalStandardElement
  - ada:massBiasCorrectionStrategy
  - ada:uncertaintyLevel
  - ada:signalIntegrationIntervalMethod
  - ada:blankBackgroundCorrectionMethod
  - ada:primaryStandardNameDefault
  - ada:calibrationMeasurementFrequency
  - ada:totalIntegrationTimePerOutputDataPointDefault
