          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Matrix Offset Correction (LIEF)
          description: Whether an empirical correction was applied to account for systematic differences
            in laser-induced elemental fractionation (LIEF) patterns between the external calibration
            standard and the sample matrix.
          type: object
          properties:
            '@id':
              const: ada:parameter/laSficpmsUPbTAPP/matrixOffsetCorrection
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
