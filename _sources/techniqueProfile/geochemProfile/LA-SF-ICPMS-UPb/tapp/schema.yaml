    ada:targetSelectionCriteriaDefault:
      description: 'The rules governing which part of the sample is analysed, and why. Covers the criteria
        applied when choosing grains, aliquots, spots, or a region of interest — size, morphology, clarity,
        freedom from inclusions or alteration, phase identity, or spatial position. Distinct from Target
        Material, which states the material type the procedure is designed for: this field states how,
        within such a sample, the analysed portion is picked out.'
      type: string
    schema:additionalProperty:
      type: array
      items:
        anyOf:
        - &id009
          title: Pre-Analysis Imaging and Screening
          description: Imaging or other characterisation performed before the measurement in order to
            select or locate the analysed target, including the technique, instrument and settings used,
            and how individual analyses are linked back to the images. Distinct from any imaging the procedure
            performs as its own measurement. Where the imaging is performed on a separate instrument,
            it should also be recorded in the Group 1 coupling fields.
          type: object
          properties:
            '@id':
              const: ada:parameter/laSficpmsUPbTAPP/preAnalysisImagingAndScreeningDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: preAnalysisImagingAndScreeningDefault
            schema:name:
              const: Pre-Analysis Imaging and Screening
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id010
          title: Transect Rate, Mapping Rate or Step Size
          description: 'For continuous line scan (transect) and raster mapping: the stage translation
            speed in µm s⁻¹. This is the procedure-level parameter that, together with spot size and repetition
            rate, determines spatial resolution along the scan direction. For mapping, the mapping rate
            (mm² h⁻¹) may be reported as an alternative when scan speed is session-variable. For stepped
            line profiles: the distance between successive spot positions in µm.'
          type: object
          properties:
            '@id':
              const: ada:parameter/laSficpmsUPbTAPP/transectRateMappingRateOrStepSizeDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: transectRateMappingRateOrStepSizeDefault
            schema:name:
              const: Transect Rate, Mapping Rate or Step Size
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id011
          title: Plasma / Make-up Gas Addition
          description: Additional gas(es) mixed into the carrier stream downstream of the ablation cell,
            with the procedure-registered target flow rate. Ar make-up gas is standard. Small N₂ additions
            can enhance sensitivity for some elements. If N₂ is not added, state "None" explicitly to
            distinguish from not reported.
          type: object
          properties:
            '@id':
              const: ada:parameter/laSficpmsUPbTAPP/plasmaMakeUpGasAdditionDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: plasmaMakeUpGasAdditionDefault
            schema:name:
              const: Plasma / Make-up Gas Addition
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Instrument Warm-up / Session Duration Limit
          description: Minimum warm-up time required after plasma ignition before analyses begin, and
            any maximum session duration enforced to maintain stable operating conditions. These constraints
            are part of the procedure and cannot be varied by the analyst.
          type: object
          properties:
            '@id':
              const: ada:parameter/laSficpmsUPbTAPP/instrumentWarmUpSessionDurationLimit
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/laSficpmsUPbTAPP/instrumentWarmUpSessionDurationLimit
            schema:name:
              const: Instrument Warm-up / Session Duration Limit
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: E-scan Range
          description: Electric scan range used for peak acquisition, expressed as percentage of the centre
            mass (%). Varies the accelerating voltage to cover masses in the vicinity of the set magnetic
            mass without re-scanning the magnet. Record 'N/A' if E-scan acquisition mode is not used.
          type: object
          properties:
            '@id':
              const: ada:parameter/laSficpmsUPbTAPP/eScanRange
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/laSficpmsUPbTAPP/eScanRange
            schema:name:
              const: E-scan Range
            schema:value:
              anyOf:
              - type: number
              - type: string
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          - schema:unitText
          readOnly: true
        - title: Triple Scanning Mode
          description: Whether each mass peak is scanned three times per cycle and the results averaged
            (Y/N). Used to reduce noise from short-term magnetic field instabilities on sector-field instruments.
            Triple scanning affects the effective integration time per cycle and should be reported. Record
            'N/A' if not applicable to the instrument.
          type: object
          properties:
            '@id':
              const: ada:parameter/laSficpmsUPbTAPP/tripleScanningMode
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/laSficpmsUPbTAPP/tripleScanningMode
            schema:name:
              const: Triple Scanning Mode
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: Multi-Run Sequential Analysis Design
          description: Whether the procedure uses a single acquisition pass or multiple sequential runs
            on the same sample location, each optimized for different analytical objectives. For multi-run
            designs, describe the number of runs, their purpose, key laser and instrument settings per
            run, and how outputs of one run feed into data reduction of another. Not applicable to raster
            mapping, where each spatial location is visited exactly once.
          type: object
          properties:
            '@id':
              const: ada:parameter/laSficpmsUPbTAPP/multiRunSequentialAnalysisDesign
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/laSficpmsUPbTAPP/multiRunSequentialAnalysisDesign
            schema:name:
              const: Multi-Run Sequential Analysis Design
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - &id012
          title: Uncertainty Propagation Method
          description: 'The approach used to propagate analytical uncertainty through the data reduction
            chain to the final reported value. State which sources are included in the propagation: counting
            statistics, calibration standard uncertainty, internal standard uncertainty, drift correction,
            and any systematic contributions. Distinct from Uncertainty Level, which states the convention
            at which the resulting uncertainty is quoted.'
          type: object
          properties:
            '@id':
              const: ada:parameter/laSficpmsUPbTAPP/uncertaintyPropagationMethodDefault
            '@type':
              const:
