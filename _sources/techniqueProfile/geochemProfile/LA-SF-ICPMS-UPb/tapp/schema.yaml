$schema: https://json-schema.org/draft/2020-12/schema
title: LA-SF-ICP-MS U-Pb Geochronology TAPP (laSficpmsUPbTAPP)
description: Laser-ablation sector-field ICP-MS U-Pb geochronology extension of the base TAPP definition,
  generated from TAPPS20260813/Current TAPPs/LA-SF-ICP-MS_UPb_TAPP_v17.csv via the path-driven pipeline.
allOf:
- $ref: ../../../../BaseSchema/tappDefinition/schema.yaml
- type: object
  properties:
    schema:name:
      type: string
      readOnly: true
    schema:measurementTechnique:
      type: array
      items:
        type: object
        properties:
          schema:termCode:
            description: Top-level analytical technique identifier.
            type: string
            enum:
            - LA-ICP-MS
            - LA-ICP-OES
            - LA-MC-ICP-MS
            - LA-ICP-ToF-MS
            - LA-ICP-MS/MS
            - missing
            readOnly: true
    schema:creator:
      type: object
      properties:
        schema:name:
          type: string
          readOnly: true
    schema:location:
      type: object
      properties:
        schema:name:
          description: Name of the laboratory or institution hosting the instrument.
          type: string
        schema:identifier:
          description: Persistent identifier for the laboratory (e.g., ROR ID).
          type: string
    schema:datePublished:
      type: string
      readOnly: true
    schema:funding:
      type: array
      items:
        type: object
        properties:
          schema:name:
            type: string
            readOnly: true
    schema:relatedLink:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              schema:linkRelationship:
                const: techniquePublication
            required:
            - schema:linkRelationship
          then:
            properties:
              schema:target:
                type: object
                properties:
                  schema:name:
                    type: string
                    readOnly: true
        - if:
            properties:
              schema:linkRelationship:
                const: coupledTechnique
            required:
            - schema:linkRelationship
          then:
            properties:
              schema:target:
                type: object
                properties:
                  schema:name:
                    description: Other analytical techniques applied to the same sample(s) whose results
                      are intended to be interpreted together with data from this procedure. Document
                      coupling with any technique whose results are functionally linked to this dataset
                      — providing calibration inputs, complementary spatial context, or required companion
                      measurements. Use the same controlled vocabulary as the Technique field. Enter "None"
                      if no coupling is intended.
                    type: string
                    enum:
                    - EPMA
                    - SIMS
                    - ICP-MS (solution)
                    - Noble Gas MS
                    - None
                    - N/A
                    - missing
                  schema:description:
                    description: 'Description of how this procedure is coupled with the technique(s) listed
                      above. Include: (1) the functional relationship — what data or context flows between
                      techniques, or how results are combined (e.g. which output from the coupled technique
                      serves as input to data reduction for this technique); and (2) the analytical sequence
                      — which technique is performed first and why (e.g. non-destructive before destructive).
                      Required when Coupled Technique(s) is not "None".'
                    type: string
    schema:object:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              '@type':
                contains:
                  const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
            required:
            - '@type'
          then:
            properties:
              schema:additionalProperty:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:name:
                          const: Target Material
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:value:
                          type: array
                          items:
                            description: General description of the material type(s) this procedure is
                              designed to analyse. Used for discoverability and procedure matching.
                            type: string
                            enum:
                            - Silicate glass
                            - Feldspar
                            - Pyroxene
                            - Olivine
                            - Oxide
                            - Sulfide
                            - Carbonate
                            - Phosphate
                            - Native metal
                            - Iron meteorite
                            - Fluid inclusion
                            - Melt inclusion
                            - Whole rock
                            - N/A
                            - None
                            - missing
                            readOnly: true
                allOf:
                - contains:
                    properties:
                      schema:name:
                        const: Target Material
                    required:
                    - schema:name
                - contains:
                    title: Sample Form / Analytical Substrate
                    description: Physical form of the material as it enters the ablation cell. Editable
                      to accommodate legitimate variations (e.g., thin section vs. mount) that do not
                      alter the analytical procedure.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laSficpmsUPbTAPP/sampleFormAnalyticalSubstrateDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: sampleFormAnalyticalSubstrateDefault
                      schema:name:
                        const: Sample Form / Analytical Substrate
                      ada:dataType:
                        const: string
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
                        const: R
                    required:
                    - '@id'
                    - '@type'
                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                  minContains: 0
                  maxContains: 1
      allOf:
      - contains:
          properties:
            '@type':
              contains:
                const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
          required:
          - '@type'
    ada:samplingUnit:
      description: The physical subdivision of the sample to which one row of reported values corresponds
        — the unit that is analysed and reported, as distinct from the sample as a whole. State the unit
        type at procedure level and the units actually analysed at analysis level. Where units nest (e.g.
        confined tracks within grains), state both levels.
      type: string
      enum:
      - Whole sample
      - Aliquot
      - Grain
      - Spot
      - Analysis point
      - Phase
      - Sub-volume
      - Region of interest
      - N/A
      - None
      - missing
    schema:actionProcess:
      type: object
      properties:
        schema:step:
          type: array
          items:
            type: object
            allOf:
            - if:
                properties:
                  schema:name:
                    const: Sample preparation
                required:
                - schema:name
              then:
                properties:
                  schema:additionalProperty:
                    type: array
                    items:
                      anyOf:
                      - &id001
                        title: Fusion Flux and Dilution Ratio
                        description: For procedures using fused glass, the flux type and sample:flux dilution
                          ratio used to prepare the analytical glass.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laSficpmsUPbTAPP/fusionFluxAndDilutionRatioDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: fusionFluxAndDilutionRatioDefault
                          schema:name:
                            const: Fusion Flux and Dilution Ratio
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      - &id002
                        title: Pre-Ablation Surface Treatment
                        description: Procedure applied immediately before each analysis to remove surface
                          contamination or condition the sample surface. Distinct from general sample
                          preparation. For spot analysis, pre-ablation pulses are discarded before signal
                          acquisition begins. For mapping, this step is typically omitted as the large
                          area ablated averages out surface effects.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laSficpmsUPbTAPP/preAblationSurfaceTreatmentDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: preAblationSurfaceTreatmentDefault
                          schema:name:
                            const: Pre-Ablation Surface Treatment
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                    allOf:
                    - contains: *id001
                      minContains: 0
                      maxContains: 1
                    - contains: *id002
                      minContains: 0
                      maxContains: 1
                  schema:description:
                    description: Description of how samples were prepared for analysis (mounting, polishing,
                      coating, fusion procedure, etc.).
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  ada:chemicalAbrasionConditions:
                    description: 'Annealing and partial-dissolution conditions applied to mitigate Pb
                      loss before analysis, following Mattinson (2005): annealing temperature and duration,
                      and the acid, temperature and duration of the partial-dissolution step. Condon et
                      al. (2024) require these where chemical abrasion was applied, and state that it
                      generally should be for zircon. Record ''None'' where grains were analysed untreated,
                      since the absence of treatment materially affects how discordance should be read.'
                    anyOf:
                    - type: string
                      readOnly: true
                    - type: array
                      items:
                        type: string
                        readOnly: true
            - if:
                properties:
                  schema:name:
                    const: Data acquisition
                required:
                - schema:name
              then:
                properties:
                  schema:additionalProperty:
                    type: array
                    items:
                      title: Guard Electrode
                      description: Whether the guard electrode (also called extraction lens or Fassel
                        torch shield) was active during analysis.
                      type: object
                      properties:
                        '@id':
                          const: ada:parameter/laSficpmsUPbTAPP/guardElectrode
                        '@type':
                          const:
                          - schema:PropertyValue
                        schema:propertyID:
                          const:
                          - '@id': ada:parameter/laSficpmsUPbTAPP/guardElectrode
                        schema:name:
                          const: Guard Electrode
                        schema:value:
                          type: string
                      required:
                      - '@id'
                      - '@type'
                      - schema:propertyID
                      - schema:name
                      - schema:value
                      readOnly: true
                    allOf:
                    - contains:
                        title: Guard Electrode
                        description: Whether the guard electrode (also called extraction lens or Fassel
                          torch shield) was active during analysis.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laSficpmsUPbTAPP/guardElectrode
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                            - '@id': ada:parameter/laSficpmsUPbTAPP/guardElectrode
                          schema:name:
                            const: Guard Electrode
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                      minContains: 0
                      maxContains: 1
            - if:
                properties:
                  schema:name:
                    const: Data reduction
                required:
                - schema:name
              then:
                properties:
                  schema:additionalProperty:
                    type: array
                    items:
                      anyOf:
                      - &id003
                        title: Signal Smoothing
                        description: 'Description of any signal smoothing device or approach installed
                          between the ablation cell and the ICP-MS to reduce pulse-to-pulse signal variability.
                          Note: active signal smoothing devices (e.g., squid, SCFAST) are generally incompatible
                          with high-resolution raster mapping because they degrade spatial resolution
                          by mixing aerosol from successive laser shots. For mapping analyses, report
                          "None" explicitly.'
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laSficpmsUPbTAPP/signalSmoothingDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: signalSmoothingDefault
                          schema:name:
                            const: Signal Smoothing
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      - &id004
                        title: Spike / Outlier Filtering Approach
                        description: Method used to identify and remove anomalous signal spikes arising
                          from micronuggets, inclusions, cracks, or instrument artifacts during time-resolved
                          signal processing. Editable because the specific implementation may vary between
                          sessions while remaining within the procedure framework.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laSficpmsUPbTAPP/spikeOutlierFilteringApproachDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: spikeOutlierFilteringApproachDefault
                          schema:name:
                            const: Spike / Outlier Filtering Approach
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      - &id005
                        title: Pulse/Analog Detector Nonlinearity Correction
                        description: Whether a correction was applied for nonlinear response at the transition
                          between pulse-counting and analog detector modes.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laSficpmsUPbTAPP/pulseAnalogDetectorNonlinearityCorrectionDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: pulseAnalogDetectorNonlinearityCorrectionDefault
                          schema:name:
                            const: Pulse/Analog Detector Nonlinearity Correction
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      - title: Isotope Dilution Data Reduction Method
                        description: Mass balance approach used to calculate sample mass fractions from
                          spike-sample isotope ratio measurements in isotope dilution (ID) analysis. Record
                          'None' if isotope dilution is not used.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laSficpmsUPbTAPP/isotopeDilutionDataReductionMethod
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                            - '@id': ada:parameter/laSficpmsUPbTAPP/isotopeDilutionDataReductionMethod
                          schema:name:
                            const: Isotope Dilution Data Reduction Method
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                      - &id006
                        title: Calibration Factor and Determination Method
                        description: 'An externally-calibrated factor that converts the measured quantity
                          into the reported quantity, how it was determined, and its uncertainty. Applies
                          where the conversion depends on a factor calibrated against a reference of independently
                          known value, rather than on the instrument response alone. Distinct from the
                          fields that name the calibration material and that state which approach applies
                          to which analyte, where the technique has them: this field records the resulting
                          factor itself.'
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laSficpmsUPbTAPP/calibrationFactorAndDeterminationMethodDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: calibrationFactorAndDeterminationMethodDefault
                          schema:name:
                            const: Calibration Factor and Determination Method
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      - &id007
                        title: Analysis Inclusion and Rejection Criteria
                        description: 'The rules determining which individual analyses contribute to a
                          reported aggregate result, together with the outcome of applying them: how many
                          analyses were acquired, how many were included, and on what grounds any were
                          excluded. Distinct from within-analysis outlier filtering, which removes anomalous
                          points inside a single analysis: this field decides which whole analyses enter
                          the reported value. Criteria and outcome are combined in one field because neither
                          is interpretable without the other, following the precision/accuracy precedent.'
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laSficpmsUPbTAPP/analysisInclusionAndRejectionCriteria
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                            - '@id': ada:parameter/laSficpmsUPbTAPP/analysisInclusionAndRejectionCriteria
                          schema:name:
                            const: Analysis Inclusion and Rejection Criteria
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                      - title: Intermediate Daughter Disequilibrium Correction
                        description: Correction for initial disequilibrium in intermediate daughter products
                          of the U decay chains — principally 230Th, and where relevant 231Pa — together
                          with the Th/U or Pa/U partitioning value assumed and its source. Unique to U-Pb
                          among dating systems, because the chains are long enough for intermediate-daughter
                          disequilibrium at crystallisation to bias the 206Pb/238U date, most severely
                          in young samples. Record 'None' with a justification where no correction was
                          applied. Condon et al. (2024) write "we recommend these dates be reported corrected
                          for initial 230Th and 231Pa daughter isotope disequilibrium" — recommended rather
                          than required, hence Advanced.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laSficpmsUPbTAPP/intermediateDaughterDisequilibriumCorrection
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                            - '@id': ada:parameter/laSficpmsUPbTAPP/intermediateDaughterDisequilibriumCorrection
                          schema:name:
                            const: Intermediate Daughter Disequilibrium Correction
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                      - &id008
                        title: Constants and Reference Values Used
                        description: Physical constants and reference values used in data reduction to
                          calculate the final reported quantity (e.g., decay constants for age calculation,
                          standard isotope ratios, or other citable reference values used in a correction
                          or calculation), together with their source. Distinct from the Group 6 reference-material
                          fields, which document accepted values for specific calibration/validation materials
                          rather than universal physical constants. Record "None" if no citable, revisable
                          physical constants feed into this procedure's data reduction.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laSficpmsUPbTAPP/constantsAndReferenceValuesUsedDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: constantsAndReferenceValuesUsedDefault
                          schema:name:
                            const: Constants and Reference Values Used
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      - title: Faraday Cup Gain Calibration Method
                        description: ''
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laSficpmsUPbTAPP/faradayCupGainCalibrationMethod
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                            - '@id': ada:parameter/laSficpmsUPbTAPP/faradayCupGainCalibrationMethod
                          schema:name:
                            const: Faraday Cup Gain Calibration Method
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                      - title: Double-Spike Inversion Algorithm
                        description: ''
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laSficpmsUPbTAPP/doubleSpikeInversionAlgorithm
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                            - '@id': ada:parameter/laSficpmsUPbTAPP/doubleSpikeInversionAlgorithm
                          schema:name:
                            const: Double-Spike Inversion Algorithm
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                      - title: Normalization/Standards-Based Correction
                        description: ''
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laSficpmsUPbTAPP/normalizationStandardsBasedCorrection
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: normalizationStandardsBasedCorrection
                          schema:name:
                            const: Normalization/Standards-Based Correction
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: true
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                        readOnly: true
                    allOf:
                    - contains: *id003
                      minContains: 0
                      maxContains: 1
                    - contains: *id004
                      minContains: 0
                      maxContains: 1
                    - contains: *id005
                      minContains: 0
                      maxContains: 1
                    - contains:
                        title: Isotope Dilution Data Reduction Method
                        description: Mass balance approach used to calculate sample mass fractions from
                          spike-sample isotope ratio measurements in isotope dilution (ID) analysis. Record
                          'None' if isotope dilution is not used.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laSficpmsUPbTAPP/isotopeDilutionDataReductionMethod
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                            - '@id': ada:parameter/laSficpmsUPbTAPP/isotopeDilutionDataReductionMethod
                          schema:name:
                            const: Isotope Dilution Data Reduction Method
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                      minContains: 0
                      maxContains: 1
                    - contains: *id006
                      minContains: 0
                      maxContains: 1
                    - contains: *id007
                      minContains: 0
                      maxContains: 1
                    - contains:
                        title: Intermediate Daughter Disequilibrium Correction
                        description: Correction for initial disequilibrium in intermediate daughter products
                          of the U decay chains — principally 230Th, and where relevant 231Pa — together
                          with the Th/U or Pa/U partitioning value assumed and its source. Unique to U-Pb
                          among dating systems, because the chains are long enough for intermediate-daughter
                          disequilibrium at crystallisation to bias the 206Pb/238U date, most severely
                          in young samples. Record 'None' with a justification where no correction was
                          applied. Condon et al. (2024) write "we recommend these dates be reported corrected
                          for initial 230Th and 231Pa daughter isotope disequilibrium" — recommended rather
                          than required, hence Advanced.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laSficpmsUPbTAPP/intermediateDaughterDisequilibriumCorrection
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                            - '@id': ada:parameter/laSficpmsUPbTAPP/intermediateDaughterDisequilibriumCorrection
                          schema:name:
                            const: Intermediate Daughter Disequilibrium Correction
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                      minContains: 0
                      maxContains: 1
                    - contains: *id008
                      minContains: 0
                      maxContains: 1
                    - contains:
                        title: Faraday Cup Gain Calibration Method
                        description: ''
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laSficpmsUPbTAPP/faradayCupGainCalibrationMethod
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                            - '@id': ada:parameter/laSficpmsUPbTAPP/faradayCupGainCalibrationMethod
                          schema:name:
                            const: Faraday Cup Gain Calibration Method
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                      minContains: 0
                      maxContains: 1
                    - contains:
                        title: Double-Spike Inversion Algorithm
                        description: ''
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laSficpmsUPbTAPP/doubleSpikeInversionAlgorithm
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
