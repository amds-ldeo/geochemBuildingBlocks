      - contains:
          title: Discordance Definition and Values
          description: 'How discordance between the 206Pb/238U, 207Pb/235U and 207Pb/206Pb chronometers
            is defined for this procedure, and the discordance values obtained. Several definitions are
            in circulation and they are not interchangeable, so the formula must be stated. Genuinely
            specific to U-Pb: it is the only system in routine use with two independent decay schemes
            in the same mineral, so agreement between them is an internal consistency test no other system
            can run. The rule for excluding discordant analyses, and how many were excluded, belong in
            Analysis Inclusion and Rejection Criteria. Condon et al. (2024) write that for samples older
            than a few hundred million years "it is also useful to provide a measure of discordance" —
            useful and age-conditional rather than required, hence Advanced.'
