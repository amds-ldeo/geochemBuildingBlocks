          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - &id013
          title: Age Datum / Reference Epoch
          description: 'The zero point from which the reported age is measured, where this is not the
            present day, and the date it corresponds to. Record ''Present day'' where the conventional
            datum applies. Explicitly required wherever the datum is not the present: year of sample collection
            for luminescence (Mahan et al. 2023), end of irradiation for 40Ar/39Ar decay corrections (Schaen
            et al. 2021).'
          type: object
          properties:
            '@id':
              const: ada:parameter/laSficpmsUPbTAPP/ageDatumReferenceEpochDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
