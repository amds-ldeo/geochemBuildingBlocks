            properties:
              ada:toolRole:
                const: acquisition
            required:
            - ada:toolRole
          then:
            properties:
              schema:name:
                description: Instrument control and data acquisition software used to collect raw signal
                  data, including version number. Separate from data reduction software.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
        - if:
            properties:
              ada:toolRole:
                const: dataReduction
            required:
            - ada:toolRole
          then:
            properties:
              schema:name:
                description: Software used for signal processing, background subtraction, and concentration
                  calculation, including version number.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
      allOf:
      - contains:
          properties:
            ada:toolRole:
              const: acquisition
          required:
          - ada:toolRole
      - contains:
          properties:
            ada:toolRole:
              const: dataReduction
          required:
          - ada:toolRole
    ada:analyticalMode:
      type: array
      items:
        description: Primary analytical mode(s) executed under this protocol. For single-mode protocols,
          records one value (e.g., Spot). For multi-mode protocols (e.g., spot analysis combined with
          transect scanning), list all applicable modes. Serves as the protocol-level declaration of measurement
          type, distinct from the mode flag columns which indicate per-field applicability.
        type: string
        enum:
        - Spot
        - Transect
        - Mapping
        - Spot; Transect
        readOnly: true
    ada:ablationSamplingMode:
      description: Sampling mode or ablation pattern used during analysis.
      type: string
      enum:
      - Spot (stationary)
      - Transect (continuous line scan)
      - Raster area (2D elemental mapping)
      - Stepped line profile
      readOnly: true
    ada:ablationSpotDurationDefault:
      description: 'Total on-sample ablation (signal acquisition) time per individual spot in seconds,
        as set in the acquisition method. This is a protocol-level parameter for spot analysis: it reflects
        the deliberate trade-off between signal accumulation (longer = lower LOD), sample consumption,
        and session throughput. For transect analysis, the equivalent protocol-level parameter is scan
        speed (captured in Transect Rate, Mapping Rate or Step Size). For mapping analysis, total acquisition
        time is sample-area-dependent and therefore analysis-level, not captured here.'
      anyOf:
      - type: number
      - type: string
    schema:additionalProperty:
      type: array
      items:
        anyOf:
        - &id020
          title: Transect Rate, Mapping Rate or Step Size
          description: 'For continuous line scan (transect) and raster mapping: the stage translation
            speed in µm s⁻¹. This is the protocol-level parameter that, together with spot size and repetition
            rate, determines spatial resolution along the scan direction. For mapping, the mapping rate
            (mm² h⁻¹) may be reported as an alternative when scan speed is session-variable. For stepped
            line profiles: the distance between successive spot positions in µm.'
          type: object
          properties:
            '@id':
              const: ada:parameter/laicpmsTAPP/transectOrMappingRateOrStepSizeDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: transectOrMappingRateOrStepSizeDefault
            schema:name:
              const: Transect Rate, Mapping Rate or Step Size
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id021
          title: Plasma / Make-up Gas Addition
          description: Additional gas(es) mixed into the carrier stream downstream of the ablation cell,
            with the protocol-registered target flow rate. Ar make-up gas is standard. Small N₂ additions
            can enhance sensitivity for some elements. If N₂ is not added, state "None" explicitly to
            distinguish from not reported.
          type: object
          properties:
            '@id':
              const: ada:parameter/laicpmsTAPP/plasmaMakeUpGasAdditionDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: plasmaMakeUpGasAdditionDefault
            schema:name:
              const: Plasma / Make-up Gas Addition
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Instrument Warm-up / Session Duration Limit
          description: Minimum warm-up time required after plasma ignition before analyses begin, and
            any maximum session duration enforced to maintain stable operating conditions. These constraints
            are part of the protocol and cannot be varied by the analyst.
          type: object
          properties:
            '@id':
              const: ada:parameter/laicpmsTAPP/instrumentWarmUpSessionDurationLimit
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/laicpmsTAPP/instrumentWarmUpSessionDurationLimit
            schema:name:
              const: Instrument Warm-up / Session Duration Limit
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: E-scan Range
          description: Electric scan range used for peak acquisition, expressed as percentage of the centre
            mass (%). Varies the accelerating voltage to cover masses in the vicinity of the set magnetic
            mass without re-scanning the magnet. Record 'N/A' if E-scan acquisition mode is not used.
          type: object
          properties:
            '@id':
              const: ada:parameter/laicpmsTAPP/eScanRange
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/laicpmsTAPP/eScanRange
            schema:name:
              const: E-scan Range
            schema:value:
              anyOf:
              - type: number
              - type: string
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          - schema:unitText
          readOnly: true
        - title: Triple Scanning Mode
          description: Whether each mass peak is scanned three times per cycle and the results averaged
            (Y/N). Used to reduce noise from short-term magnetic field instabilities on sector-field instruments.
            In LA-SF-ICP-MS, triple scanning affects the effective integration time per cycle and should
            be reported. Record 'N/A' if not applicable to the instrument.
          type: object
          properties:
            '@id':
              const: ada:parameter/laicpmsTAPP/tripleScanningMode
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/laicpmsTAPP/tripleScanningMode
            schema:name:
              const: Triple Scanning Mode
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: Multi-Run Sequential Analysis Design
          description: Whether the protocol uses a single acquisition pass or multiple sequential runs
            on the same sample location, each optimized for different analytical objectives. For multi-run
            designs, describe the number of runs, their purpose, key laser and instrument settings per
            run, and how outputs of one run feed into data reduction of another. Not applicable to raster
            mapping, where each spatial location is visited exactly once.
          type: object
          properties:
            '@id':
              const: ada:parameter/laicpmsTAPP/multiRunSequentialAnalysisDesign
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/laicpmsTAPP/multiRunSequentialAnalysisDesign
            schema:name:
              const: Multi-Run Sequential Analysis Design
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - &id022
          title: Uncertainty Propagation Method
          description: 'Approach used to propagate analytical uncertainty from raw count rates through
            the data reduction chain to final reported concentrations or isotope ratios. Specifies which
            uncertainty sources are included: counting statistics, calibration standard uncertainty, internal
            standard concentration uncertainty, drift correction uncertainty. Editable because this field
            may be unspecified at protocol registration (Advanced tier) and can be completed by the analyst
            when documenting the analysis.'
          type: object
          properties:
            '@id':
              const: ada:parameter/laicpmsTAPP/uncertaintyPropagationMethodDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: uncertaintyPropagationMethodDefault
            schema:name:
              const: Uncertainty Propagation Method
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Matrix Offset Correction (LIEF)
          description: Whether an empirical correction was applied to account for systematic differences
            in laser-induced elemental fractionation (LIEF) patterns between the external calibration
            standard and the sample matrix.
          type: object
          properties:
            '@id':
              const: ada:parameter/laicpmsTAPP/matrixOffsetCorrection
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/laicpmsTAPP/matrixOffsetCorrection
            schema:name:
              const: Matrix Offset Correction (LIEF)
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
      allOf:
      - contains: *id020
        minContains: 0
        maxContains: 1
      - contains: *id021
        minContains: 0
        maxContains: 1
      - contains:
          title: Instrument Warm-up / Session Duration Limit
          description: Minimum warm-up time required after plasma ignition before analyses begin, and
            any maximum session duration enforced to maintain stable operating conditions. These constraints
            are part of the protocol and cannot be varied by the analyst.
          type: object
          properties:
            '@id':
              const: ada:parameter/laicpmsTAPP/instrumentWarmUpSessionDurationLimit
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/laicpmsTAPP/instrumentWarmUpSessionDurationLimit
            schema:name:
              const: Instrument Warm-up / Session Duration Limit
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: E-scan Range
          description: Electric scan range used for peak acquisition, expressed as percentage of the centre
            mass (%). Varies the accelerating voltage to cover masses in the vicinity of the set magnetic
            mass without re-scanning the magnet. Record 'N/A' if E-scan acquisition mode is not used.
          type: object
          properties:
            '@id':
              const: ada:parameter/laicpmsTAPP/eScanRange
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/laicpmsTAPP/eScanRange
            schema:name:
              const: E-scan Range
            schema:value:
              anyOf:
              - type: number
              - type: string
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          - schema:unitText
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: Triple Scanning Mode
          description: Whether each mass peak is scanned three times per cycle and the results averaged
            (Y/N). Used to reduce noise from short-term magnetic field instabilities on sector-field instruments.
            In LA-SF-ICP-MS, triple scanning affects the effective integration time per cycle and should
            be reported. Record 'N/A' if not applicable to the instrument.
          type: object
          properties:
            '@id':
              const: ada:parameter/laicpmsTAPP/tripleScanningMode
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/laicpmsTAPP/tripleScanningMode
            schema:name:
              const: Triple Scanning Mode
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: Multi-Run Sequential Analysis Design
          description: Whether the protocol uses a single acquisition pass or multiple sequential runs
            on the same sample location, each optimized for different analytical objectives. For multi-run
            designs, describe the number of runs, their purpose, key laser and instrument settings per
            run, and how outputs of one run feed into data reduction of another. Not applicable to raster
            mapping, where each spatial location is visited exactly once.
          type: object
          properties:
            '@id':
              const: ada:parameter/laicpmsTAPP/multiRunSequentialAnalysisDesign
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/laicpmsTAPP/multiRunSequentialAnalysisDesign
            schema:name:
              const: Multi-Run Sequential Analysis Design
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains: *id022
        minContains: 0
        maxContains: 1
      - contains:
          title: Matrix Offset Correction (LIEF)
          description: Whether an empirical correction was applied to account for systematic differences
            in laser-induced elemental fractionation (LIEF) patterns between the external calibration
            standard and the sample matrix.
          type: object
          properties:
            '@id':
              const: ada:parameter/laicpmsTAPP/matrixOffsetCorrection
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/laicpmsTAPP/matrixOffsetCorrection
            schema:name:
              const: Matrix Offset Correction (LIEF)
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
    ada:rasterLineSpacingDefault:
      description: Distance between adjacent raster lines in a 2D elemental map, measured perpendicular
        to the scan direction, in micrometres. Together with spot size, this determines whether adjacent
        lines are contiguous (line spacing = spot size), overlapping (line spacing < spot size), or have
        gaps (line spacing > spot size). Applies to raster mapping only.
      type: string
    ada:carrierGasFlowRateDefault:
      description: Gas used to transport ablated aerosol from the ablation cell to the ICP-MS torch, with
        the protocol-registered target flow rate(s). Helium is standard for most UV laser systems due
        to superior aerosol transport. Flow rates are protocol targets; actual session values may be adjusted
        within ±10% during tuning.
      type: string
    ada:oxideProductionMethodAndThreshold:
      description: Method used to quantify plasma oxide production and the acceptance threshold applied
        before commencing analysis. The ThO⁺/Th⁺ ratio (mass 248/232) is most widely used, but UO⁺/U⁺
        (mass 254/238) or CeO⁺/Ce⁺ (mass 156/140) may also be used. Report both the measurement method
        (which oxide proxy) and the threshold value.
      type: string
      readOnly: true
    ada:analysisSequenceDefault:
      description: Repeating order of primary calibration standard(s), quality control standard(s), and
        unknown analyses within a measurement session. Editable to allow minor adjustments while maintaining
        the bracketing strategy defined in the protocol.
      type: string
    ada:analyteTemplate:
      type: object
      properties:
        ada:defaultAnalytes:
          type: array
          items:
            description: Isotopes (mass/charge) this protocol is designed to measure. Defines the scope
              of the protocol and enables matching of protocols to analytical needs. At analysis level,
              record the specific isotopes actually measured in the session — this may be a subset of
              the protocol scope if certain masses were excluded due to interference issues or detector
              limitations.
            type: string
        ada:analyteColumns:
          type: array
          items:
            anyOf:
            - $ref: ../../../../BaseSchema/tappDefinition/schema.yaml#/$defs/AnalyteIdentifierColumn
            - &id023
              title: Monitored Isotopes
              description: Specific isotope(s) monitored per analyte element in this protocol, including
                any interference-monitor masses. Analyte-specific field.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laicpmsTAPP/monitoredIsotopes
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: monitoredIsotopes
                schema:name:
                  const: Monitored Isotopes
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id024
              title: Mass Resolution per Analyte
              description: Mass resolution mode assigned to each analyte in this protocol. The selected
                resolution determines which polyatomic interferences are physically resolved by the magnetic
                sector. Per-analyte assignments are documented here; the overall mode(s) used in the protocol
                are recorded in Mass Resolution Setting (Group 3). Analyte-specific field. SF-ICP-MS only;
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laicpmsTAPP/massResolutionPerAnalyte
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: massResolutionPerAnalyte
                schema:name:
                  const: Mass Resolution per Analyte
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id025
              title: Dwell Time per Mass
              description: 'Count time (dwell time) per mass position for each measured isotope in milliseconds.
                Longer dwell times improve counting statistics and lower detection limits but reduce the
                number of isotopes measurable within a given scan cycle time. For mapping, scan cycle
                time directly determines spatial resolution at a given scan speed: shorter cycle time
                = finer spatial resolution.'
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laicpmsTAPP/dwellTime
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: dwellTime
                schema:name:
                  const: Dwell Time per Mass
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id026
              title: Isobaric Interference Corrections Applied
              description: 'Whether isobaric interference corrections were applied for any measured isotope
                in this protocol. A protocol-level Boolean: if the protocol includes interference corrections,
                this is always Yes. Element-specific detail is captured in Interfering Species and Interference
                Correction Method.'
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laicpmsTAPP/isobaricInterferenceCorrection
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: isobaricInterferenceCorrection
                schema:name:
                  const: Isobaric Interference Corrections Applied
                ada:dataType:
                  const: boolean
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id027
              title: Interfering Species
              description: Elemental or molecular species (oxides, argides, doubly charged ions) overlapping
                with the measured isotope.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laicpmsTAPP/interferingSpecies
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: interferingSpecies
                schema:name:
                  const: Interfering Species
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id028
              title: Interference Correction Method
              description: Equation or procedure used to correct for isobaric interferences, including
                the production rate factor and the reference material used to measure it.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laicpmsTAPP/isobaricInterferenceCorrectionMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: isobaricInterferenceCorrectionMethod
                schema:name:
                  const: Interference Correction Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id029
              title: Normalization / Standards-Based Correction
              description: Any post-acquisition normalization applied to correct for systematic biases
                identified from secondary reference materials, or stoichiometric normalization applied
                per pixel in mapping. Distinct from the primary internal standard approach captured in
                Internal Standard Approach.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laicpmsTAPP/postAcquisitionNormalization
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: postAcquisitionNormalization
                schema:name:
                  const: Normalization / Standards-Based Correction
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id030
              title: Detection Limit
              description: Session detection limit for each measured isotope, expressed in µg g⁻¹, ng
                g⁻¹, or wt% as appropriate. Report the value(s) and units per isotope or element group.
                Mandatory at analysis level to demonstrate the reliability of reported near-detection-limit
                concentrations. The calculation method is captured separately in Detection Limit Method.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laicpmsTAPP/detectionLimit
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: detectionLimit
                schema:name:
                  const: Detection Limit
                ada:dataType:
                  const: number
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  anyOf:
                  - type: number
                  - type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id031
              title: Detection Limit Method
              description: Reference or description of the method used to calculate session detection
                limits. Mandatory at analysis level. Must be consistent with the method applied to generate
                the Detection Limit values reported above.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laicpmsTAPP/detectionLimitMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: detectionLimitMethod
                schema:name:
                  const: Detection Limit Method
                ada:dataType:
                  const: uri
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id032
              title: Limit of Quantification (LOQ) Method
              description: 'Reference or description of the method used to calculate the limit of quantification
                (LOQ): the lowest concentration reliably measurable with acceptable precision and accuracy.
                Mandatory at analysis level when concentrations near the LOD are reported. Concentrations
                between LOD and LOQ are detectable but not reliably quantifiable.'
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laicpmsTAPP/limitOfQuantificationMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: limitOfQuantificationMethod
                schema:name:
                  const: Limit of Quantification (LOQ) Method
                ada:dataType:
                  const: uri
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id033
              title: Within-Session Analytical Precision and Assessment Method
              description: 'Reproducibility of repeated measurements within a single analytical session.
                Report both the assessment method and the precision values. Assessment method must specify:
                (1) the reference material used, (2) number of replicates n, and (3) the statistic reported
                (1σ RSD, 2σ RSD, etc.). For mapping: assess from repeated analyses of a reference material
                area at session start and end, or from replicate analyses of a homogeneous reference phase
                within the map.'
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laicpmsTAPP/withinSessionAnalyticalPrecisionAndAssessmentMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: withinSessionAnalyticalPrecisionAndAssessmentMethod
                schema:name:
                  const: Within-Session Analytical Precision and Assessment Method
