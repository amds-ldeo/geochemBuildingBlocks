                        schema:name:
                          description: Whether a collision or reaction cell is installed and its operating
                            mode. In standard mode (STD), no cell gas is introduced and the cell acts
                            only as an ion guide. In kinetic energy discrimination (KED) mode, helium
                            thermalizes ions so that polyatomic interferences (larger collision cross-section)
