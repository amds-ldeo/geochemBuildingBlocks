$schema: https://json-schema.org/draft/2020-12/schema
title: LA-ICPMS Technique-Aligned Protocol Profile (laicpmsTAPP)
description: 'LA-ICP-MS (incl. LA-Q-ICP-MS and LA-SF-ICP-MS) extension of the base TAPP definition. Basic
  protocol-tier fields are required top-level ada: properties; Advanced protocol-tier fields are schema:additionalProperty[]
  PropertyValueSpecification entries; an ada:analyteTemplate carries the per-element columns. Generated
  from docs/LA-Q_SF-ICPMS_TAPP_v3.xlsx by tools/build_tapp.py.'
allOf:
- $ref: ../../../../BaseSchema/tappDefinition/schema.yaml
- type: object
  properties:
    schema:name:
      description: A short descriptive name for this analytical protocol, with version number. Should
        include instrument, technique, target analyte group, and measured chemical variable.
      type: string
      readOnly: true
    schema:measurementTechnique:
      type: array
      items:
        type: object
        properties:
          schema:termCode:
            description: Top-level analytical technique identifier.
            type: string
            enum:
            - LA-ICP-MS
            - LA-ICP-OES
            - LA-MC-ICP-MS
            - LA-ICP-ToF-MS
            - LA-ICP-MS/MS
            readOnly: true
    schema:creator:
      type: object
      properties:
        schema:name:
          description: Author(s) of the protocol. Can be individual names or lab names. ORCID is recommended
            for individuals.
          type: string
          readOnly: true
    schema:location:
      type: object
      properties:
        schema:name:
          description: Name of the laboratory or institution hosting the instrument.
          type: string
        schema:identifier:
          description: Persistent identifier for the laboratory, e.g., ROR ID.
          type: string
    schema:datePublished:
      description: First date this protocol configuration was used in production.
      type: string
      readOnly: true
    schema:funding:
      type: array
      items:
        type: object
        properties:
          schema:name:
            description: Grants and other funding sources that supported instrument purchase, major upgrades,
              protocol development, and associated personnel time. Include grant numbers and funding agencies
              where applicable.
            type: string
            readOnly: true
    schema:relatedLink:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              schema:linkRelationship:
                const: techniquePublication
            required:
            - schema:linkRelationship
          then:
            properties:
              schema:target:
                type: object
                properties:
                  schema:name:
                    description: DOI or URL for peer-reviewed publications or technical reports describing,
                      validating, or benchmarking this protocol.
                    type: string
                    readOnly: true
        - if:
            properties:
              schema:linkRelationship:
                const: coupledTechnique
            required:
            - schema:linkRelationship
          then:
            properties:
              schema:target:
                type: object
                properties:
                  schema:name:
                    description: Analytical technique(s) applied to the same sample or aliquot in conjunction
                      with this protocol, where the two analyses are designed to be interpreted together
                      or where one provides input to the other. Use the same controlled vocabulary as
                      the Technique field. Enter "None" if no coupling is intended.
                    type: string
                    enum:
                    - EPMA
                    - SIMS
                    - ICP-MS (solution)
                    - Noble Gas MS
                    - None
                  schema:description:
                    description: 'Description of how this protocol is coupled with the technique(s) listed
                      above. Include: (1) the functional relationship — what data or context flows between
                      techniques or how results are combined (e.g., which output from the coupled technique
                      serves as input to data reduction for this technique); and (2) the analytical sequence
                      — which technique is performed first and why (e.g., non-destructive before destructive).'
                    type: string
    schema:object:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              '@type':
                contains:
                  const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
            required:
            - '@type'
          then:
            properties:
              schema:additionalProperty:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:name:
                          const: Target Material
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:value:
                          type: array
                          items:
                            description: General description of the material type(s) this protocol is
                              designed to analyse. Used for discoverability and protocol matching.
                            type: string
                            enum:
                            - Silicate glass
                            - Feldspar
                            - Pyroxene
                            - Olivine
                            - Oxide
                            - Sulfide
                            - Carbonate
                            - Phosphate
                            - Native metal
                            - Iron meteorite
                            - Fluid inclusion
                            - Melt inclusion
                            - Whole rock
                            readOnly: true
                allOf:
                - contains:
                    properties:
                      schema:name:
                        const: Target Material
                    required:
                    - schema:name
                - contains:
                    title: Sample Form / Analytical Substrate
                    description: Physical form of the material as it enters the ablation cell. Editable
                      to accommodate legitimate variations (e.g., thin section vs. mount) that do not
                      alter the analytical protocol.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laicpmsTAPP/sampleFormAnalyticalSubstrateDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: sampleFormAnalyticalSubstrateDefault
                      schema:name:
                        const: Sample Form / Analytical Substrate
                      ada:dataType:
                        const: string
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
                        const: R
                    required:
                    - '@id'
                    - '@type'
                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                  minContains: 0
                  maxContains: 1
      allOf:
      - contains:
          properties:
            '@type':
              contains:
                const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
          required:
          - '@type'
    schema:actionProcess:
      type: object
      properties:
        schema:step:
          type: array
          items:
            type: object
            allOf:
            - if:
                properties:
                  schema:name:
                    const: samplePreparation
                required:
                - schema:name
              then:
                properties:
                  schema:additionalProperty:
                    type: array
                    items:
                      anyOf:
                      - &id001
                        title: Fusion Flux and Dilution Ratio
                        description: For protocols using fused glass, the flux type and sample:flux dilution
                          ratio used to prepare the analytical glass.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laicpmsTAPP/fusionFluxAndDilutionRatioDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: fusionFluxAndDilutionRatioDefault
                          schema:name:
                            const: Fusion Flux and Dilution Ratio
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      - &id002
                        title: Pre-Ablation Surface Treatment
                        description: Protocol applied immediately before each analysis to remove surface
                          contamination or condition the sample surface. Distinct from general sample
                          preparation. For spot analysis, pre-ablation pulses are discarded before signal
                          acquisition begins. For mapping, this step is typically omitted as the large
                          area ablated averages out surface effects.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laicpmsTAPP/preAblationSurfaceTreatmentDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: preAblationSurfaceTreatmentDefault
                          schema:name:
                            const: Pre-Ablation Surface Treatment
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                    allOf:
                    - contains: *id001
                      minContains: 0
                      maxContains: 1
                    - contains: *id002
                      minContains: 0
                      maxContains: 1
                  schema:description:
                    description: Description of how samples were prepared for analysis (mounting, polishing,
                      coating, fusion procedure, etc.).
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
            - if:
                properties:
                  schema:name:
                    const: dataAcquisition
                required:
                - schema:name
              then:
                properties:
                  schema:additionalProperty:
                    type: array
                    items:
                      title: Guard Electrode
                      description: Whether the guard electrode (also called extraction lens or Fassel
                        torch shield) was active during analysis.
                      type: object
                      properties:
                        '@id':
                          const: ada:parameter/laicpmsTAPP/guardElectrode
                        '@type':
                          const:
                          - schema:PropertyValue
                        schema:propertyID:
                          const:
                          - '@id': ada:parameter/laicpmsTAPP/guardElectrode
                        schema:name:
                          const: Guard Electrode
                        schema:value:
                          type: string
                      required:
                      - '@id'
                      - '@type'
                      - schema:propertyID
                      - schema:name
                      - schema:value
                      readOnly: true
                    allOf:
                    - contains:
                        title: Guard Electrode
                        description: Whether the guard electrode (also called extraction lens or Fassel
                          torch shield) was active during analysis.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laicpmsTAPP/guardElectrode
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                            - '@id': ada:parameter/laicpmsTAPP/guardElectrode
                          schema:name:
                            const: Guard Electrode
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                      minContains: 0
                      maxContains: 1
            - if:
                properties:
                  schema:name:
                    const: dataReduction
                required:
                - schema:name
              then:
                properties:
                  schema:additionalProperty:
                    type: array
                    items:
                      anyOf:
                      - &id003
                        title: Signal Smoothing
                        description: 'Description of any signal smoothing device or approach installed
                          between the ablation cell and the ICP-MS to reduce pulse-to-pulse signal variability.
                          Note: active signal smoothing devices (e.g., squid, SCFAST) are generally incompatible
                          with high-resolution raster mapping because they degrade spatial resolution
                          by mixing aerosol from successive laser shots. For mapping analyses, report
                          "None" explicitly.'
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laicpmsTAPP/signalSmoothingDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: signalSmoothingDefault
                          schema:name:
                            const: Signal Smoothing
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      - &id004
                        title: Spike / Outlier Filtering Approach
                        description: Method used to identify and remove anomalous signal spikes arising
                          from micronuggets, inclusions, cracks, or instrument artifacts during time-resolved
                          signal processing. Editable because the specific implementation may vary between
                          sessions while remaining within the protocol framework.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laicpmsTAPP/outlierFilteringDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: outlierFilteringDefault
                          schema:name:
                            const: Spike / Outlier Filtering Approach
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      - &id005
                        title: Pulse/Analog Detector Nonlinearity Correction
                        description: Whether a correction was applied for nonlinear response at the transition
                          between pulse-counting and analog detector modes.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laicpmsTAPP/nonlinearResponseCorrectionDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: nonlinearResponseCorrectionDefault
                          schema:name:
                            const: Pulse/Analog Detector Nonlinearity Correction
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      - title: Isotope Dilution Data Reduction Method
                        description: Mass balance approach used to calculate sample mass fractions from
                          spike-sample isotope ratio measurements in isotope dilution (ID) analysis. Record
                          'None' if isotope dilution is not used.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laicpmsTAPP/isotopeDilutionDataReductionMethod
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                            - '@id': ada:parameter/laicpmsTAPP/isotopeDilutionDataReductionMethod
                          schema:name:
                            const: Isotope Dilution Data Reduction Method
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                    allOf:
                    - contains: *id003
                      minContains: 0
                      maxContains: 1
                    - contains: *id004
                      minContains: 0
                      maxContains: 1
                    - contains: *id005
                      minContains: 0
                      maxContains: 1
                    - contains:
                        title: Isotope Dilution Data Reduction Method
                        description: Mass balance approach used to calculate sample mass fractions from
                          spike-sample isotope ratio measurements in isotope dilution (ID) analysis. Record
                          'None' if isotope dilution is not used.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laicpmsTAPP/isotopeDilutionDataReductionMethod
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                            - '@id': ada:parameter/laicpmsTAPP/isotopeDilutionDataReductionMethod
                          schema:name:
                            const: Isotope Dilution Data Reduction Method
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                      minContains: 0
                      maxContains: 1
          allOf:
          - contains:
              properties:
                schema:name:
                  const: samplePreparation
              required:
              - schema:name
          - contains:
              properties:
                schema:name:
                  const: dataAcquisition
              required:
              - schema:name
          - contains:
              properties:
                schema:name:
                  const: dataReduction
              required:
              - schema:name
    schema:instrument:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              schema:additionalType:
                contains:
                  const: Laser Ablation System
            required:
            - schema:additionalType
          then:
            properties:
              schema:model:
                type: object
                properties:
                  schema:name:
                    description: Manufacturer and model of the laser ablation system.
                    type: string
                    readOnly: true
              ada:laserType:
                description: Wavelength and type of the laser used for ablation in nanometres.
                anyOf:
                - type: string
                  readOnly: true
                - type: array
                  items:
                    type: string
                    readOnly: true
              schema:name:
                description: Type and model of ablation cell used.
                anyOf:
                - type: string
                  readOnly: true
                - type: array
                  items:
                    type: string
                    readOnly: true
              ada:laserSpotGeometryDefault:
                description: Shape and dimensions of the laser ablation spot in micrometres registered
                  by the protocol. For circular spots, report diameter; for square or rectangular spots,
                  report width × length. The protocol registers the typical geometry; analysts may adjust
                  within protocol-allowed range.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
              schema:additionalProperty:
                type: array
                items:
                  anyOf:
                  - &id006
                    title: Laser Energy
                    description: Laser pulse energy in millijoules as set at the laser output or measured
                      at the sample surface. Less commonly reported than fluence because it does not account
                      for spot area. Report only when the system displays energy directly. Laser fluence
                      (J cm⁻²) is the preferred quantity and is captured in Default Laser Fluence.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laicpmsTAPP/laserEnergyDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: laserEnergyDefault
                      schema:name:
                        const: Laser Energy
                      ada:dataType:
                        const: number
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
                        const: R
                      schema:unitText:
                        const: mJ
                    required:
                    - '@id'
                    - '@type'
                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                  - title: Laser Beam Energy Profile
                    description: Spatial energy distribution of the laser beam at the sample surface,
                      and whether a beam homogenizer is installed. A flat-top (top-hat) profile produces
                      more uniform ablation craters and more reproducible crater morphology than a Gaussian
                      beam. This is a fixed hardware property of the laser system.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laicpmsTAPP/laserBeamEnergyProfile
                      '@type':
                        const:
                        - schema:PropertyValue
                      schema:propertyID:
                        const:
                        - '@id': ada:parameter/laicpmsTAPP/laserBeamEnergyProfile
                      schema:name:
                        const: Laser Beam Energy Profile
                      schema:value:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                    readOnly: true
                  - title: Laser Pulse Duration
                    description: 'Duration of each individual laser pulse, including units. Pulse duration
                      determines the ablation regime: nanosecond (ns) pulses involve significant thermal
                      effects and elemental fractionation; femtosecond (fs) pulses are non-thermal and
                      substantially reduce elemental fractionation and matrix effects. This is a fixed
                      hardware property of the laser system.'
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laicpmsTAPP/laserPulseDuration
                      '@type':
                        const:
                        - schema:PropertyValue
                      schema:propertyID:
                        const:
                        - '@id': ada:parameter/laicpmsTAPP/laserPulseDuration
                      schema:name:
                        const: Laser Pulse Duration
                      schema:value:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                    readOnly: true
                allOf:
                - contains: *id006
                  minContains: 0
                  maxContains: 1
                - contains:
                    title: Laser Beam Energy Profile
                    description: Spatial energy distribution of the laser beam at the sample surface,
                      and whether a beam homogenizer is installed. A flat-top (top-hat) profile produces
                      more uniform ablation craters and more reproducible crater morphology than a Gaussian
                      beam. This is a fixed hardware property of the laser system.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laicpmsTAPP/laserBeamEnergyProfile
                      '@type':
                        const:
                        - schema:PropertyValue
                      schema:propertyID:
                        const:
                        - '@id': ada:parameter/laicpmsTAPP/laserBeamEnergyProfile
                      schema:name:
                        const: Laser Beam Energy Profile
                      schema:value:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                    readOnly: true
                  minContains: 0
                  maxContains: 1
                - contains:
                    title: Laser Pulse Duration
                    description: 'Duration of each individual laser pulse, including units. Pulse duration
                      determines the ablation regime: nanosecond (ns) pulses involve significant thermal
                      effects and elemental fractionation; femtosecond (fs) pulses are non-thermal and
                      substantially reduce elemental fractionation and matrix effects. This is a fixed
                      hardware property of the laser system.'
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laicpmsTAPP/laserPulseDuration
                      '@type':
                        const:
                        - schema:PropertyValue
                      schema:propertyID:
                        const:
                        - '@id': ada:parameter/laicpmsTAPP/laserPulseDuration
                      schema:name:
                        const: Laser Pulse Duration
                      schema:value:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                    readOnly: true
                  minContains: 0
                  maxContains: 1
              ada:laserFluenceDefault:
                description: Laser pulse energy per unit area at the sample surface in J cm⁻², as registered
                  by the protocol. Fluence is the physically meaningful quantity controlling ablation
                  rate, crater morphology, elemental fractionation, and particle size distribution. If
                  the system reports only as % of maximum output, include that value and note the system
                  maximum where known.
                anyOf:
                - type: number
                - type: string
              ada:laserRepetitionRateDefault:
                description: Laser pulse repetition rate in hertz registered by the protocol. For mapping
                  methods, repetition rate together with scan speed and spot size determines pixel size
                  and spatial resolution. Analysts may adjust within protocol-allowed bounds.
                anyOf:
                - type: number
                - type: string
        - if:
            properties:
              schema:additionalType:
                contains:
                  const: ICPMS
            required:
            - schema:additionalType
          then:
            properties:
              schema:model:
                type: object
                properties:
                  schema:name:
                    description: Manufacturer and model of the ICP-MS instrument.
                    type: string
                    readOnly: true
              schema:additionalProperty:
                type: array
                items:
                  anyOf:
                  - &id007
                    title: Instrument Serial Number or Lab Identifier
                    description: Serial number or laboratory-internal identifier for the specific instrument
                      unit. Supports traceability to instrument service records.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laicpmsTAPP/instrumentIdentifierDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: instrumentIdentifierDefault
                      schema:name:
                        const: Instrument Serial Number or Lab Identifier
                      ada:dataType:
                        const: string
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
                        const: R
                    required:
                    - '@id'
                    - '@type'
                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                  - &id008
                    title: Mass Resolution Setting
                    description: Operating mass resolution of the mass analyser. For quadrupole instruments
                      this is fixed at unit resolution by instrument design. For sector-field instruments
                      the analyst selects low, medium, or high resolution to balance sensitivity against
                      spectral interference suppression.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laicpmsTAPP/massResolutionSettingDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: massResolutionSettingDefault
                      schema:name:
                        const: Mass Resolution Setting
                      ada:dataType:
                        const: string
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
                        const: R
                    required:
                    - '@id'
                    - '@type'
                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                  - title: Detector Configuration
                    description: Type(s) of detector(s) installed in the mass spectrometer. For single-collector
                      instruments, note whether dual pulse-counting/analog mode is used. For multi-collector
                      instruments, describe the Faraday/multiplier cup layout.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laicpmsTAPP/detectorConfiguration
                      '@type':
                        const:
                        - schema:PropertyValue
                      schema:propertyID:
                        const:
                        - '@id': ada:parameter/laicpmsTAPP/detectorConfiguration
                      schema:name:
                        const: Detector Configuration
                      schema:value:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                    readOnly: true
                  - &id009
                    title: ICP Tuning
                    description: Description of the approach used to optimise ICP plasma conditions prior
                      to analysis, including the reference material used for tuning and the acceptance
                      criteria (e.g., oxide production threshold, sensitivity targets, mass calibration).
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laicpmsTAPP/icPlasmaTuningDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: icPlasmaTuningDefault
                      schema:name:
                        const: ICP Tuning
                      ada:dataType:
                        const: string
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
