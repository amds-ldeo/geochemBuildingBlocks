$schema: https://json-schema.org/draft/2020-12/schema
title: LA-MC-ICP-MS Technique-Aligned Procedure Profile (laMcicpmsTAPP)
description: Laser-ablation multi-collector ICP-MS extension of the base TAPP definition, generated from
  tapp/Current TAPPs/LA-MC-ICPMS_TAPP_v68.csv via the path-driven pipeline.
allOf:
- $ref: ../../../../BaseSchema/tappDefinition/schema.yaml
- $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/ProcedureIdentification
- $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/ProcedureIdentification
- $ref: ../../../../BaseSchema/modules/mcIcpms/schema.yaml#/$defs/ProcedureIdentification
- $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/ProcedureIdentification
- $ref: ../../../../BaseSchema/modules/calibrationFactor/schema.yaml#/$defs/ProcedureIdentification
- $ref: ../../../../BaseSchema/modules/analyte/schema.yaml#/$defs/ProcedureIdentification
- $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/ProcedureIdentification
- $ref: ../../../../BaseSchema/modules/compositionQC/schema.yaml#/$defs/ProcedureIdentification
- $ref: ../../../../BaseSchema/modules/collisionCell/schema.yaml#/$defs/ProcedureIdentification
- type: object
  properties:
    schema:actionProcess:
      type: object
      properties:
        schema:step:
          type: array
          items:
            type: object
            allOf:
            - if:
                properties:
                  schema:name:
                    const: Data reduction
                required:
                - schema:name
              then:
                properties:
                  schema:additionalProperty:
                    type: array
                    items:
                      anyOf:
                      - $ref: ../../../../BaseSchema/modules/aggregation/schema.yaml#/$defs/Param_Procedure_analysisInclusionAndRejectionCriteria
                      - $ref: ../../../../BaseSchema/modules/mcIcpms/schema.yaml#/$defs/Param_Procedure_doubleSpikeInversionAlgorithm
                      - $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_isotopeDilutionDataReductionMethod
                      - $ref: ../../../../BaseSchema/modules/mcIcpms/schema.yaml#/$defs/Param_Procedure_peakFlatnessMethodAndThreshold
                      - $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Procedure_signalSmoothing
                      - $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_filteringApproach
                    allOf:
                    - contains:
                        $ref: ../../../../BaseSchema/modules/aggregation/schema.yaml#/$defs/Param_Procedure_analysisInclusionAndRejectionCriteria
                      minContains: 0
                      maxContains: 1
                    - contains:
                        $ref: ../../../../BaseSchema/modules/mcIcpms/schema.yaml#/$defs/Param_Procedure_doubleSpikeInversionAlgorithm
                      minContains: 0
                      maxContains: 1
                    - contains:
                        $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_isotopeDilutionDataReductionMethod
                      minContains: 0
                      maxContains: 1
                    - contains:
                        $ref: ../../../../BaseSchema/modules/mcIcpms/schema.yaml#/$defs/Param_Procedure_peakFlatnessMethodAndThreshold
                      minContains: 0
                      maxContains: 1
                    - contains:
                        $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Procedure_signalSmoothing
                      minContains: 0
                      maxContains: 1
                    - contains:
                        $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_filteringApproach
                      minContains: 0
                      maxContains: 1
            - if:
                properties:
                  schema:name:
                    const: Sample preparation
                required:
                - schema:name
              then:
                properties:
                  schema:additionalProperty:
                    type: array
                    items:
                      anyOf:
                      - $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Procedure_fusionFluxAndDilutionRatio
                      - $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Procedure_preAblationSurfaceTreatment
                    allOf:
                    - contains:
                        $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Procedure_fusionFluxAndDilutionRatio
                      minContains: 0
                      maxContains: 1
                    - contains:
                        $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Procedure_preAblationSurfaceTreatment
                      minContains: 0
                      maxContains: 1
            - if:
                properties:
                  schema:name:
                    const: Data acquisition
                required:
                - schema:name
              then:
                properties:
                  schema:additionalProperty:
                    type: array
                    items:
                      $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_guardElectrode
                    allOf:
                    - contains:
                        $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_guardElectrode
                      minContains: 0
                      maxContains: 1
          allOf:
          - contains:
              properties:
                schema:name:
                  const: Data reduction
              required:
              - schema:name
          - contains:
              properties:
                schema:name:
                  const: Data acquisition
              required:
              - schema:name
    ada:analyticalAccuracy:
      description: Offset between measured and accepted values for secondary reference materials, and
        the method used to assess it. Specify the reference material and the source of its accepted values,
        the number of analyses, and the quantities assessed. Report systematic biases and their likely
        causes. Express the offset in the form appropriate to what the procedure reports - percent relative
        bias for concentrations, or deviation in delta or ratio units for isotopic quantities.
      type: string
    schema:instrument:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              schema:additionalType:
                contains:
                  const: ICPMS
                schema:inDefinedTermSet: ada:vocab/instrumentType
            required:
            - schema:additionalType
          then:
            properties:
              schema:hasPart:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: ICP Source
                          schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items:
                            anyOf:
                            - $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_auxiliaryGasFlowRate
                            - $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_coolantPlasmaGasFlowRate
                            - $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_plasmaThermalMode
                            - $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_rfPower
                          allOf:
                          - contains:
                              $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_auxiliaryGasFlowRate
                            minContains: 0
                            maxContains: 1
                          - contains:
                              $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_coolantPlasmaGasFlowRate
                            minContains: 0
                            maxContains: 1
                          - contains:
                              $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_plasmaThermalMode
                            minContains: 0
                            maxContains: 1
                          - contains:
                              $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_rfPower
                            minContains: 0
                            maxContains: 1
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: Collision Reaction Cell
                          schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items:
                            anyOf:
                            - $ref: ../../../../BaseSchema/modules/collisionCell/schema.yaml#/$defs/Param_Procedure_cellExitDiscriminationVoltage
                            - $ref: ../../../../BaseSchema/modules/collisionCell/schema.yaml#/$defs/Param_Procedure_gasFlowRate
                            - $ref: ../../../../BaseSchema/modules/collisionCell/schema.yaml#/$defs/Param_Procedure_collisionGasType
                            - $ref: ../../../../BaseSchema/modules/collisionCell/schema.yaml#/$defs/Param_Procedure_reactionGasFlowRate
                            - $ref: ../../../../BaseSchema/modules/collisionCell/schema.yaml#/$defs/Param_Procedure_reactionGasType
                          allOf:
                          - contains:
                              $ref: ../../../../BaseSchema/modules/collisionCell/schema.yaml#/$defs/Param_Procedure_cellExitDiscriminationVoltage
                            minContains: 0
                            maxContains: 1
                          - contains:
                              $ref: ../../../../BaseSchema/modules/collisionCell/schema.yaml#/$defs/Param_Procedure_gasFlowRate
                            minContains: 0
                            maxContains: 1
                          - contains:
                              $ref: ../../../../BaseSchema/modules/collisionCell/schema.yaml#/$defs/Param_Procedure_collisionGasType
                            minContains: 0
                            maxContains: 1
                          - contains:
                              $ref: ../../../../BaseSchema/modules/collisionCell/schema.yaml#/$defs/Param_Procedure_reactionGasFlowRate
                            minContains: 0
                            maxContains: 1
                          - contains:
                              $ref: ../../../../BaseSchema/modules/collisionCell/schema.yaml#/$defs/Param_Procedure_reactionGasType
                            minContains: 0
                            maxContains: 1
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: Collector
                          schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        ada:collectorConfiguration:
                          type: array
                          items:
                            anyOf:
                            - &id007
                              title: Faraday Cup Amplifier Resistor Values
                              description: Resistance values (Ω) of the feedback resistors in the Faraday
                                cup amplifiers. Standard amplifiers use 10¹¹ Ω resistors, yielding 1 V
                                per ~6.24 × 10⁶ ion counts per second. Report the resistor value per cup
                                position, or note 'all 10¹¹ Ω' if uniform.
                              type: object
                              properties:
                                '@id':
                                  const: ada:channelColumn/laMcicpmsTAPP/faradayCupAmplifierResistorValues
                                '@type':
                                  const:
                                  - schema:PropertyValueSpecification
                                schema:valueName:
                                  const: faradayCupAmplifierResistorValues
                                schema:name:
                                  const: Faraday Cup Amplifier Resistor Values
                                ada:dataType:
                                  const: string
                                schema:readonlyValue:
                                  const: true
                                ada:tier:
                                  const: M
                                schema:defaultValue:
                                  anyOf:
                                  - &id001
                                    type: string
                                  - type: array
                                    items: *id001
                              required:
                              - '@id'
                              - '@type'
                              - schema:valueName
                              - schema:name
                              - ada:dataType
                              - schema:defaultValue
                            - &id008
                              title: Faraday Cup Gain Calibration Method
                              description: 'Method used to calibrate the relative gain (amplification
                                factor) of each Faraday cup amplifier at the start of or during each analytical
                                session. Common approaches: instrument internal gain calibration routine
                                (measures signal in each cup sequentially using a common beam), amplifier
                                rotation procedure, or measurement of a known isotope ratio solution in
                                each cup. For instruments with SEM detectors, also describes the SEM-to-Faraday
                                cross-calibration sequence. Specify frequency (per session, per block,
                                weekly).'
                              type: object
                              properties:
                                '@id':
                                  const: ada:channelColumn/laMcicpmsTAPP/faradayCupGainCalibrationMethod
                                '@type':
                                  const:
                                  - schema:PropertyValueSpecification
                                schema:valueName:
                                  const: faradayCupGainCalibrationMethod
                                schema:name:
                                  const: Faraday Cup Gain Calibration Method
                                ada:dataType:
                                  const: string
                                schema:readonlyValue:
                                  const: true
                                ada:tier:
                                  const: M
                                schema:defaultValue:
                                  anyOf:
                                  - &id002
                                    type: string
                                  - type: array
                                    items: *id002
                              required:
                              - '@id'
                              - '@type'
                              - schema:valueName
                              - schema:name
                              - ada:dataType
                              - schema:defaultValue
                            - &id009
                              title: Integration Time per Cycle
                              description: Duration of signal integration per measurement cycle (seconds).
                                Where different isotope channels use different integration schemes, record
                                the time for each channel.
                              type: object
                              properties:
                                '@id':
                                  const: ada:channelColumn/laMcicpmsTAPP/integrationTimePerCycle
                                '@type':
                                  const:
                                  - schema:PropertyValueSpecification
                                schema:valueName:
                                  const: integrationTimePerCycle
                                schema:name:
                                  const: Integration Time per Cycle
                                ada:dataType:
                                  const: number
                                schema:readonlyValue:
                                  const: false
                                ada:tier:
                                  const: M
                                schema:defaultValue:
                                  anyOf:
                                  - &id003
                                    anyOf:
                                    - type: number
                                    - type: string
                                  - type: array
                                    items: *id003
                              required:
                              - '@id'
                              - '@type'
                              - schema:valueName
                              - schema:name
                              - ada:dataType
                              - schema:defaultValue
                            - &id010
                              title: Interference Correction Method
                              description: Equation or procedure used to calculate and remove each interference
                                contribution, together with how its magnitude was established - a monitor
                                mass measured simultaneously and scaled by natural abundance ratios, a
                                production-rate factor measured on a reference material or interference
                                standard solution, or a tailing factor measured on a pure standard. Name
                                the reference material used.
                              type: object
                              properties:
                                '@id':
                                  const: ada:channelColumn/laMcicpmsTAPP/interferenceCorrectionMethod
                                '@type':
                                  const:
                                  - schema:PropertyValueSpecification
                                schema:valueName:
                                  const: interferenceCorrectionMethod
                                schema:name:
                                  const: Interference Correction Method
                                ada:dataType:
                                  const: string
                                schema:readonlyValue:
                                  const: true
                                ada:tier:
                                  const: M
                                schema:defaultValue:
                                  anyOf:
                                  - &id004
                                    type: string
                                  - type: array
                                    items: *id004
                              required:
                              - '@id'
                              - '@type'
                              - schema:valueName
                              - schema:name
                              - ada:dataType
                              - schema:defaultValue
                            - &id011
                              title: Interfering Species
                              description: The isobaric, polyatomic and doubly charged species that overlap
                                the measured masses and are corrected in data reduction - direct isobars,
                                oxides and argides, hydrides, and abundance-sensitivity tailing from an
                                adjacent large beam. Name each species and the mass it affects.
                              type: object
                              properties:
                                '@id':
                                  const: ada:channelColumn/laMcicpmsTAPP/interferingSpecies
                                '@type':
                                  const:
                                  - schema:PropertyValueSpecification
                                schema:valueName:
                                  const: interferingSpecies
                                schema:name:
                                  const: Interfering Species
                                ada:dataType:
                                  const: string
                                schema:readonlyValue:
                                  const: true
                                ada:tier:
                                  const: M
                                schema:defaultValue:
                                  anyOf:
                                  - &id005
                                    type: string
                                  - type: array
                                    items: *id005
                              required:
                              - '@id'
                              - '@type'
                              - schema:valueName
                              - schema:name
                              - ada:dataType
                              - schema:defaultValue
                            - &id012
                              title: Mass Resolution Assignment
                              description: Mass resolution mode used for acquisition. One analyte may
                                be acquired at more than one resolution, so the assignment is per acquired
                                mass rather than per element. The overall mode(s) used in the procedure
                                are recorded in Mass Resolution Setting (Group 3).
                              type: object
                              properties:
                                '@id':
                                  const: ada:channelColumn/laMcicpmsTAPP/massResolutionAssignment
                                '@type':
                                  const:
                                  - schema:PropertyValueSpecification
                                schema:valueName:
                                  const: massResolutionAssignment
                                schema:name:
                                  const: Mass Resolution Assignment
                                ada:dataType:
                                  const: string
                                schema:readonlyValue:
                                  const: true
                                ada:tier:
                                  const: M
                                schema:defaultValue:
                                  anyOf:
                                  - &id006
                                    type: string
                                  - type: array
                                    items: *id006
                              required:
                              - '@id'
                              - '@type'
                              - schema:valueName
                              - schema:name
                              - ada:dataType
                              - schema:defaultValue
                          allOf:
                          - contains: *id007
                            minContains: 0
                            maxContains: 1
                          - contains: *id008
                            minContains: 0
                            maxContains: 1
                          - contains: *id009
                            minContains: 0
                            maxContains: 1
                          - contains: *id010
                            minContains: 0
                            maxContains: 1
                          - contains: *id011
                            minContains: 0
                            maxContains: 1
                          - contains: *id012
                            minContains: 0
                            maxContains: 1
                        schema:additionalProperty:
                          type: array
                          items:
                            $ref: ../../../../BaseSchema/modules/mcIcpms/schema.yaml#/$defs/Param_Procedure_faradayCupArrayConfiguration
                          allOf:
                          - contains:
                              $ref: ../../../../BaseSchema/modules/mcIcpms/schema.yaml#/$defs/Param_Procedure_faradayCupArrayConfiguration
                            minContains: 0
                            maxContains: 1
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: Interface Cone
                          schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items:
                            anyOf:
                            - $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_configuration
                            - $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_samplerAndSkimmerConeMaterial
                          allOf:
                          - contains:
                              $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_configuration
                            minContains: 0
                            maxContains: 1
                          - contains:
                              $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_samplerAndSkimmerConeMaterial
                            minContains: 0
                            maxContains: 1
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: Torch
                          schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items:
                            $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_torchDepth
                          allOf:
                          - contains:
                              $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_torchDepth
                            minContains: 0
                            maxContains: 1
                allOf:
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          const: ICP Source
                        schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                    required:
                    - schema:additionalType
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          const: Collision Reaction Cell
                        schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                    required:
                    - schema:additionalType
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          const: Collector
                        schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                    required:
                    - schema:additionalType
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          const: Interface Cone
                        schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                    required:
                    - schema:additionalType
              schema:additionalProperty:
                type: array
                items:
                  anyOf:
                  - title: Detector Configuration
                    description: Type(s) of detector(s) installed in the mass spectrometer. For single-collector
                      instruments, note whether dual pulse-counting/analog mode is used. For multi-collector
                      instruments, describe the Faraday/multiplier cup layout.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laMcicpmsTAPP/detectorConfiguration
                      '@type':
                        const:
                        - schema:PropertyValue
                      schema:propertyID:
                        const:
                        - '@id': ada:parameter/laMcicpmsTAPP/detectorConfiguration
                      schema:name:
                        const: Detector Configuration
                      schema:value:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                    readOnly: true
                  - &id013
                    title: Doubly-Charged Species Monitor
                    description: The mass ratio monitored to estimate doubly-charged ion (M²⁺) formation
                      during instrument tuning. The monitor species and the mass positions monitored should
                      be stated explicitly. Analogous to Oxide Production Method and Threshold for oxide
                      monitoring.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laMcicpmsTAPP/doublyChargedSpeciesMonitorDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: doublyChargedSpeciesMonitorDefault
                      schema:name:
                        const: Doubly-Charged Species Monitor
                      ada:dataType:
                        const: string
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
                        const: R
                    required:
                    - '@id'
                    - '@type'
                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                  - &id014
                    title: Doubly-Charged Species Production
                    description: Measured percentage of doubly-charged ion production for the monitored
                      species at the time of instrument tuning. The acceptable threshold is typically
                      <1% or <3%. Record both the threshold and the measured value.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laMcicpmsTAPP/doublyChargedSpeciesProductionDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: doublyChargedSpeciesProductionDefault
                      schema:name:
                        const: Doubly-Charged Species Production
                      ada:dataType:
                        const: string
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
                        const: R
                    required:
                    - '@id'
                    - '@type'
                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                  - $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_icpTuning
                  - $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_instrumentSerialNumberOrLabIdentifier
                  - $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_massResolutionSetting
                  - $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_memoryEffectMitigation
                allOf:
                - contains:
                    title: Detector Configuration
                    description: Type(s) of detector(s) installed in the mass spectrometer. For single-collector
                      instruments, note whether dual pulse-counting/analog mode is used. For multi-collector
                      instruments, describe the Faraday/multiplier cup layout.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/laMcicpmsTAPP/detectorConfiguration
                      '@type':
                        const:
                        - schema:PropertyValue
                      schema:propertyID:
                        const:
                        - '@id': ada:parameter/laMcicpmsTAPP/detectorConfiguration
                      schema:name:
                        const: Detector Configuration
                      schema:value:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                    readOnly: true
                  minContains: 0
                  maxContains: 1
                - contains: *id013
                  minContains: 0
                  maxContains: 1
                - contains: *id014
                  minContains: 0
                  maxContains: 1
                - contains:
                    $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_icpTuning
                  minContains: 0
                  maxContains: 1
                - contains:
                    $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_instrumentSerialNumberOrLabIdentifier
                  minContains: 0
                  maxContains: 1
                - contains:
                    $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_massResolutionSetting
                  minContains: 0
                  maxContains: 1
                - contains:
                    $ref: ../../../../BaseSchema/modules/icpms/schema.yaml#/$defs/Param_Procedure_memoryEffectMitigation
                  minContains: 0
                  maxContains: 1
              schema:model:
                type: object
                properties:
                  schema:name:
                    description: Model designation of the instrument that performs the measurement, including
                      any generation or configuration suffix. Conventionally written with the manufacturer
                      name included; Instrument Manufacturer records the vendor separately, as a controlled
                      value, so that procedures remain findable by vendor.
                    type: string
                    readOnly: true
              schema:manufacturer:
                type: object
                properties:
                  schema:name:
                    description: Manufacturer of the instrument that performs the measurement, recorded
                      as a controlled value. Where a procedure couples a sample-introduction system to
                      an analysing instrument, this records the analysing instrument. Instrument Model
                      gives the specific designation.
                    type: string
                    enum:
                    - Thermo Fisher Scientific
                    - Agilent
                    - PerkinElmer
                    - Nu Instruments
                    - Analytik Jena
                    - Shimadzu
                    - Unknown
                    - N/A
                    - None
                    - missing
                    readOnly: true
        - if:
            properties:
              schema:additionalType:
                contains:
                  const: Laser Ablation System
                schema:inDefinedTermSet: ada:vocab/instrumentType
            required:
            - schema:additionalType
          then:
            properties:
              schema:additionalProperty:
                type: array
                items:
                  anyOf:
                  - $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Procedure_laserBeamEnergyProfile
                  - $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Procedure_laserEnergy
                allOf:
                - contains:
                    $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Procedure_laserBeamEnergyProfile
                  minContains: 0
                  maxContains: 1
                - contains:
                    $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Procedure_laserEnergy
                  minContains: 0
                  maxContains: 1
              ada:laserPulseDuration:
                description: Duration of each individual laser pulse, including units.
                anyOf:
                - type: string
                  readOnly: true
                - type: array
                  items:
                    type: string
                    readOnly: true
      allOf:
      - contains:
          properties:
            schema:additionalType:
              contains:
                const: ICPMS
              schema:inDefinedTermSet: ada:vocab/instrumentType
          required:
          - schema:additionalType
      - contains:
          properties:
            schema:additionalType:
              contains:
                const: Laser Ablation System
              schema:inDefinedTermSet: ada:vocab/instrumentType
          required:
          - schema:additionalType
    schema:additionalProperty:
