    ada:betweenSessionPrecision:
      description: Precision of measurements across multiple analytical sessions over weeks to months
        — long-term or intermediate precision — and the method used to assess it. Report both the assessment
        method and the precision values, specifying the reference material, the number of measurements
        and sessions, the time span covered, and the statistic reported.
      type: string
    ada:constantsAndReferenceValuesUsedDefault:
      description: Physical constants and reference values used in data reduction to calculate the final
        reported quantity (e.g., decay constants for age calculation, standard isotope ratios, or other
        citable reference values used in a correction or calculation), together with their source. Distinct
        from the Group 6 reference-material fields, which document accepted values for specific calibration/validation
        materials rather than universal physical constants. Record "None" if no citable, revisable physical
        constants feed into this procedure's data reduction.
      type: string
    ada:isobaricInterferenceCorrectionsApplied:
      description: Whether mathematical corrections for isobaric, polyatomic or residual interferences
        are applied in data reduction, supplementary to any suppression already achieved by chemical separation,
        mass resolution, or a collision/reaction cell. Detail for each affected mass is carried by Interfering
        Species and Interference Correction Method.
      anyOf:
      - type: string
        enum:
        - Yes — ⁸⁷Rb on ⁸⁷Sr, corrected from the ⁸⁵Rb monitor
        - Yes — doubly-charged Er and Yb on the Sr and Rb masses
        - No explicit corrections applied; medium resolution resolves the polyatomic interferences
        - N/A
        - None
        - missing
      - type: string
      readOnly: true
    ada:analyteTemplate:
      type: object
      properties:
        ada:analyteColumns:
          type: array
          items:
            anyOf:
            - $ref: ../../../../BaseSchema/tappDefinition/schema.yaml#/$defs/AnalyteIdentifierColumn
            - &id015
              title: Limit of Quantification (LOQ) Method
              description: 'Reference or description of the method used to calculate the limit of quantification
                (LOQ): the lowest concentration reliably measurable with acceptable precision and accuracy.
                Required when concentrations near the LOD are reported.'
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laMcicpmsTAPP/limitOfQuantificationMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: limitOfQuantificationMethod
                schema:name:
                  const: Limit of Quantification (LOQ) Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id016
              title: Mass Resolution Assignment
              description: Mass resolution mode used for acquisition. One analyte may be acquired at more
                than one resolution, so the assignment is per acquired mass rather than per element. The
                overall mode(s) used in the procedure are recorded in Mass Resolution Setting (Group 3).
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laMcicpmsTAPP/massResolutionAssignment
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: massResolutionAssignment
                schema:name:
                  const: Mass Resolution Assignment
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id017
              title: Monitored Masses
              description: Specific masses monitored in this procedure, grouped by the analyte element
                they serve where they serve one. Covers atomic isotopes and, where a reaction cell shifts
                an analyte onto a different mass, the product mass actually measured. Includes interference-monitor
                and internal-standard masses, which serve no analyte and so have no parent element. The
                analyte list is given by the Analyte field and is never inferred from the element symbols
                appearing here.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laMcicpmsTAPP/monitoredMasses
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: monitoredMasses
                schema:name:
                  const: Monitored Masses
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id018
              title: Per-Analyte Calibration Strategy
              description: Approach used to convert measured ion signals to reported concentrations, and
                specifically any case where different analytes or analyte groups within one procedure
                are calibrated differently - different primary standards for different mass ranges or
                phases, or one element serving as internal standard while others are externally calibrated.
                Where a single strategy applies to all analytes, record that strategy. Where the procedure
                reports isotope ratios only and no concentrations, record 'Not applicable (isotope ratios
                only)'.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/laMcicpmsTAPP/perAnalyteCalibrationStrategy
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: perAnalyteCalibrationStrategy
                schema:name:
                  const: Per-Analyte Calibration Strategy
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
          allOf:
          - contains: *id015
            minContains: 0
            maxContains: 1
          - contains: *id016
            minContains: 0
            maxContains: 1
          - contains: *id017
            minContains: 0
            maxContains: 1
          - contains: *id018
            minContains: 0
            maxContains: 1
    schema:variableMeasured:
      type: array
      items:
        anyOf:
        - title: Dataset variable
          description: A measured variable of this dataset that is not one of the procedure's declared
            reported properties. schema:variableMeasured carries the dataset's actual variables; the reported-property
            branches above are permitted members of it, not the whole of it.
          type: object
          required:
          - '@type'
          properties:
            '@type':
              type: array
              contains:
                enum:
                - cdi:InstanceVariable
                - schema:PropertyValue
        - &id019
          title: Limit of Quantification (LOQ) Method
          description: 'Reference or description of the method used to calculate the limit of quantification
            (LOQ): the lowest concentration reliably measurable with acceptable precision and accuracy.
            Required when concentrations near the LOD are reported.'
          type: object
          properties:
            '@id':
              const: ada:parameter/laMcicpmsTAPP/limitOfQuantificationMethodDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: limitOfQuantificationMethodDefault
            schema:name:
              const: Limit of Quantification (LOQ) Method
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id020
          title: Uncertainty Propagation Method
          description: 'The approach used to propagate analytical uncertainty through the data reduction
            chain to the final reported value. State which sources are included in the propagation: counting
            statistics, calibration standard uncertainty, internal standard uncertainty, drift correction,
            and any systematic contributions. Distinct from Uncertainty Level, which states the convention
            at which the resulting uncertainty is quoted.'
          type: object
          properties:
            '@id':
              const: ada:parameter/laMcicpmsTAPP/uncertaintyPropagationMethodDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: uncertaintyPropagationMethodDefault
            schema:name:
              const: Uncertainty Propagation Method
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
      allOf:
      - contains: *id019
        minContains: 0
        maxContains: 1
      - contains: *id020
        minContains: 0
        maxContains: 1
    ada:massBiasCorrectionStrategy:
      description: 'Strategy used to correct instrumental isotopic mass fractionation, also called mass
        bias or mass discrimination. Distinct from Elemental Fractionation Correction, which addresses
        inter-element fractionation during ablation and transport: this field addresses discrimination
        between isotopes of the same element, and applies wherever the procedure reports isotope ratios.'
      type: string
      readOnly: true
    schema:object:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              '@type':
                contains:
                  const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
            required:
            - '@type'
          then:
            properties:
              schema:additionalProperty:
                type: array
                items:
                  $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Procedure_sampleFormAnalyticalSubstrate
                allOf:
                - contains:
                    $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Procedure_sampleFormAnalyticalSubstrate
                  minContains: 0
                  maxContains: 1
      allOf:
      - contains:
          properties:
            '@type':
              contains:
                const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
          required:
          - '@type'
    ada:withinSessionPrecision:
      description: Precision of repeated measurements within a single analytical session and the method
        used to assess it. Report both the assessment method and the precision values. The assessment
        method must specify the reference material or standard measured, the number of replicates n, and
        the statistic reported (1s RSD, 2s RSD, 2SD, 2SE, 95% CI). Distinct from the internal precision
        of a single measurement, which derives from counting statistics over the cycles of that measurement
        rather than from repeated analyses.
      type: string
    ada:analyticalMode:
      type: array
      items:
        type: string
        enum:
        - Spot
        - Transect
        - Mapping
  required:
  - ada:analyticalAccuracy
  - ada:betweenSessionPrecision
  - ada:constantsAndReferenceValuesUsedDefault
  - ada:isobaricInterferenceCorrectionsApplied
  - ada:massBiasCorrectionStrategy
  - ada:withinSessionPrecision
