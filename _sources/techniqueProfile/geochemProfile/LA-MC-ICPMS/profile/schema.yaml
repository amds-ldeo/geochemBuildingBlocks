$schema: https://json-schema.org/draft/2020-12/schema
title: ADA LA-MC-ICP-MS Product Profile
description: Path-driven technique-specific profile for ADA LA-MC-ICP-MS Product Profile. Extends the
  base ADA product profile with the LAMCICPMS analysis-instance detail on the schema:Dataset root, narrows
  prov:used to the laMcicpmsTAPP protocol, and constrains valid component types on schema:distribution.hasPart.
allOf:
- $ref: ../../../../BaseSchema/geochemProduct/schema.yaml
- $ref: ../detail/schema.yaml
- type: object
  properties:
    prov:wasGeneratedBy:
      description: 'Pin the laMcicpmsTAPP definition and the instrument where prov:used carries them.
        Constraint-only if/then, never a narrowed anyOf: prov:used items are role-keyed wrappers, and
        an anyOf here would allOf-merge with the base union and exclude item shapes the base allows.'
      type: array
      items:
        type: object
        properties:
          prov:used:
            type: array
            items:
              allOf:
              - if:
                  type: object
                  required:
                  - schema:instrument
                then:
                  properties:
                    schema:instrument:
                      type: array
                      minItems: 1
                      items:
                        $ref: ../../../../BaseSchema/instrument/schema.yaml
              - if:
                  type: object
                  properties:
                    '@type':
                      contains:
                        const: ada:TAPPDefinition
                  required:
                  - '@type'
                then:
                  $ref: ../tapp/schema.yaml
    schema:additionalType:
      description: Must include a LAMCICPMS product type identifier.
      contains:
        enum:
        - Multi-Collector Inductively Coupled Plasma Mass Spectrometry (MCICPMS) processed
        - Multi-Collector Inductively Coupled Plasma Mass Spectrometry
        - Laser Ablation Inductively Coupled Plasma Mass Spectrometry
    schema:distribution:
      description: Each distribution item is EITHER a monolithic single-file dataset whose ada:componentType
        is a LAMCICPMS-specific or universal value (and may carry cdi:isStructuredBy), OR a bundle whose
        schema:hasPart members each carry such a componentType (the ADA/SAMIS archive form).
      type: array
      items:
        anyOf:
        - type: object
          required:
          - ada:componentType
          properties:
            ada:componentType:
              type: string
              anyOf:
              - $ref: ../../../../BaseSchema/geochemProduct/schema.yaml#/$defs/universalComponentType
              - enum: &id001
                - ada:LAICPMSTabular
                - ada:LAICPMSMap
                - ada:LAICPMSImage
                - ada:LAICPMSTransect
        - type: object
          required:
          - schema:hasPart
          properties:
            schema:hasPart:
              items:
                type: object
                anyOf:
                - $ref: ../../../../BaseSchema/geochemProduct/schema.yaml#/$defs/universalComponentTypeBranch
                - properties:
                    ada:componentType:
                      type: string
                      enum: *id001
                  required:
                  - ada:componentType
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaLAMCICPMS
