$schema: https://json-schema.org/draft/2020-12/schema
title: ADA GC-C-IRMS Product Profile
description: Path-driven technique-specific profile for ADA GC-C-IRMS Product Profile. Extends the base ADA product profile with the GCCIRMS analysis-instance detail on the schema:Dataset root, and pins the product type and the profile it declares conformance to.
allOf:
- $ref: ../../../../BaseSchema/geochemProduct/schema.yaml
- $ref: ../detail/schema.yaml
- type: object
  properties:
    schema:additionalType:
      description: Must include a GCCIRMS product type identifier.
      contains:
        enum:
        - Gas Chromatography-Combustion-Isotopic Ratio Mass Spectrometry
        - Combustion gas chromatography isotopic ratio mass spectrometry
        - C-GC-IR-MS
      title: Product Type
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaGCCIRMS
      title: About This Record
