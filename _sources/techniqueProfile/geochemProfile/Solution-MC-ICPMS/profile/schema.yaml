$schema: https://json-schema.org/draft/2020-12/schema
title: ADA Solution MC-ICP-MS Product Profile
description: Path-driven technique-specific profile for ADA Solution MC-ICP-MS Product Profile. Extends the base ADA product profile with the SOLUTIONMCICPMS analysis-instance detail on the schema:Dataset root, and pins the product type and the profile it declares conformance to.
allOf:
- $ref: ../../../../BaseSchema/geochemProduct/schema.yaml
- $ref: ../detail/schema.yaml
- type: object
  properties:
    schema:additionalType:
      description: Must include a SOLUTIONMCICPMS product type identifier.
      contains:
        enum:
        - Multi-Collector Inductively Coupled Plasma Mass Spectrometry (MCICPMS) processed
        - Multi-Collector Inductively Coupled Plasma Mass Spectrometry
      title: Product Type
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaSolutionMCICPMS
      title: About This Record
