$schema: https://json-schema.org/draft/2020-12/schema
title: Solution MC-ICP-MS Technique-Aligned Procedure Profile (solutionMcicpmsTAPP)
description: Solution multi-collector ICP-MS extension of the base TAPP definition, generated from TAPPS20260813/Current
  TAPPs/Solution_MC-ICP-MS_TAPP_v16.csv via the path-driven pipeline.
allOf:
- $ref: ../../../../BaseSchema/tappDefinition/schema.yaml
- $ref: ../../../../BaseSchema/modules/group1/schema.yaml#/$defs/ProcedureIdentification
- $ref: ../../../../BaseSchema/modules/mcIcpms/schema.yaml#/$defs/ProcedureIdentification
- $ref: ../../../../BaseSchema/modules/solutionIntroduction/schema.yaml#/$defs/ProcedureIdentification
- type: object
  properties:
    schema:object:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              '@type':
                contains:
                  const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
            required:
            - '@type'
          then:
            properties:
              schema:additionalProperty:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:name:
                          const: Target Material
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:value:
                          type: array
                          items:
                            description: Type of geological or experimental material being analyzed (e.g.,
                              basalt, chondrite, seawater, mineral separate). Constrains the dissolution
                              strategy, chromatographic separation, and matrix-matching requirements.
                            type: string
                            readOnly: true
                allOf:
                - contains:
                    properties:
                      schema:name:
                        const: Target Material
                    required:
                    - schema:name
                - contains:
                    title: Sample Aliquot Mass or Volume
                    description: Mass (mg) of solid material digested or volume (mL) of liquid taken for
                      dissolution. Used for yield calculations and concentration back-calculation.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/solutionMcicpmsTAPP/sampleAliquotMassOrVolumeDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: sampleAliquotMassOrVolumeDefault
                      schema:name:
                        const: Sample Aliquot Mass or Volume
                      ada:dataType:
                        const: number
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
                        const: R
                      schema:unitText:
                        const: mg or mL
                    required:
                    - '@id'
                    - '@type'
                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                  minContains: 0
                  maxContains: 1
      allOf:
      - contains:
          properties:
            '@type':
              contains:
                const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
          required:
          - '@type'
    schema:actionProcess:
      type: object
      properties:
        schema:step:
          type: array
          items:
            type: object
            allOf:
            - if:
                properties:
                  schema:name:
                    const: Sample preparation
                required:
                - schema:name
              then:
                properties:
                  schema:description:
                    description: General approach to mechanical sample preparation prior to dissolution
                      (e.g., whole-rock crushing and powdering, mineral separation). Documents how the
                      solid material was conditioned before acid digestion.
                    anyOf:
                    - type: string
                      readOnly: true
                    - type: array
                      items:
                        type: string
                        readOnly: true
            - if:
                properties:
                  schema:name:
                    const: Sample digestion
                required:
                - schema:name
              then:
                properties:
                  schema:additionalProperty:
                    type: array
                    items:
                      anyOf:
                      - title: Digestion Vessel Type
                        description: Type of vessel used for acid digestion. Vessel type constrains maximum
                          temperature and pressure and determines suitability for refractory mineral dissolution
                          (e.g., Parr bombs required for complete silicate digestion at high temperatures).
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/solutionMcicpmsTAPP/digestionVesselType
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                            - '@id': ada:parameter/solutionMcicpmsTAPP/digestionVesselType
                          schema:name:
                            const: Digestion Vessel Type
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                      - title: Number of Digestion Steps
                        description: Total number of distinct acid digestion steps required to dissolve
                          the sample. Some procedures require multiple sequential steps — for example,
                          an initial open-beaker HF–HNO3 dissolution followed by a second closed-vessel
                          step for residues retaining refractory minerals, or by an aqua regia reflux
                          to destroy fluoride complexes.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/solutionMcicpmsTAPP/numberOfDigestionSteps
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                            - '@id': ada:parameter/solutionMcicpmsTAPP/numberOfDigestionSteps
                          schema:name:
                            const: Number of Digestion Steps
                          schema:value:
                            anyOf:
                            - type: number
                            - type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                      - &id001
                        title: Digestion Temperature
                        description: Temperature at which acid digestion was carried out (°C). Procedure
                          specifies the target temperature.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/solutionMcicpmsTAPP/digestionTemperatureDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: digestionTemperatureDefault
                          schema:name:
                            const: Digestion Temperature
                          ada:dataType:
                            const: number
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                          schema:unitText:
                            const: °C
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      - &id002
                        title: Digestion Duration
                        description: Duration of the primary acid digestion step (hours or days).
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/solutionMcicpmsTAPP/digestionDurationDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: digestionDurationDefault
                          schema:name:
                            const: Digestion Duration
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                    allOf:
                    - contains:
                        title: Digestion Vessel Type
                        description: Type of vessel used for acid digestion. Vessel type constrains maximum
                          temperature and pressure and determines suitability for refractory mineral dissolution
                          (e.g., Parr bombs required for complete silicate digestion at high temperatures).
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/solutionMcicpmsTAPP/digestionVesselType
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                            - '@id': ada:parameter/solutionMcicpmsTAPP/digestionVesselType
                          schema:name:
                            const: Digestion Vessel Type
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                      minContains: 0
                      maxContains: 1
                    - contains:
                        title: Number of Digestion Steps
                        description: Total number of distinct acid digestion steps required to dissolve
                          the sample. Some procedures require multiple sequential steps — for example,
                          an initial open-beaker HF–HNO3 dissolution followed by a second closed-vessel
                          step for residues retaining refractory minerals, or by an aqua regia reflux
                          to destroy fluoride complexes.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/solutionMcicpmsTAPP/numberOfDigestionSteps
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                            - '@id': ada:parameter/solutionMcicpmsTAPP/numberOfDigestionSteps
                          schema:name:
                            const: Number of Digestion Steps
                          schema:value:
                            anyOf:
                            - type: number
                            - type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                      minContains: 0
                      maxContains: 1
                    - contains: *id001
                      minContains: 0
                      maxContains: 1
                    - contains: *id002
                      minContains: 0
                      maxContains: 1
            - if:
                properties:
                  schema:name:
                    const: Data acquisition
                required:
                - schema:name
              then:
                properties:
                  schema:additionalProperty:
                    type: array
                    items:
                      title: Guard Electrode
                      description: Whether a guard electrode (grounded shield electrode) is installed
                        and active on the torch assembly. Capacitively decouples the plasma from the load
                        coil, reducing secondary discharge and improving ion extraction efficiency.
                      type: object
                      properties:
                        '@id':
                          const: ada:parameter/solutionMcicpmsTAPP/guardElectrode
                        '@type':
                          const:
                          - schema:PropertyValue
                        schema:propertyID:
                          const:
                          - '@id': ada:parameter/solutionMcicpmsTAPP/guardElectrode
                        schema:name:
                          const: Guard Electrode
                        schema:value:
                          type: string
                      required:
                      - '@id'
                      - '@type'
                      - schema:propertyID
                      - schema:name
                      - schema:value
                      readOnly: true
                    allOf:
                    - contains:
                        title: Guard Electrode
                        description: Whether a guard electrode (grounded shield electrode) is installed
                          and active on the torch assembly. Capacitively decouples the plasma from the
                          load coil, reducing secondary discharge and improving ion extraction efficiency.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/solutionMcicpmsTAPP/guardElectrode
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                            - '@id': ada:parameter/solutionMcicpmsTAPP/guardElectrode
                          schema:name:
                            const: Guard Electrode
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                      minContains: 0
                      maxContains: 1
            - if:
                properties:
                  schema:name:
                    const: Data reduction
                required:
                - schema:name
              then:
                properties:
                  schema:additionalProperty:
                    type: array
                    items:
                      anyOf:
                      - title: Isotope Dilution Data Reduction Method
                        description: Mass balance approach used to calculate sample isotope ratios and/or
                          elemental concentrations from spike-sample mixture measurements. For double-spike
                          procedures, isotope ratios and concentrations are co-determined through the
                          spike inversion. For conventional ID concentration procedures (separate concentration
                          spike), IUPAC ID equations are used. Record 'None' if neither isotope dilution
                          nor double-spike methods are used.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/solutionMcicpmsTAPP/isotopeDilutionDataReductionMethod
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                            - '@id': ada:parameter/solutionMcicpmsTAPP/isotopeDilutionDataReductionMethod
                          schema:name:
                            const: Isotope Dilution Data Reduction Method
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                      - &id003
                        title: Normalization / Standards-Based Correction
                        description: 'Post-acquisition normalization applied to output isotope ratio data
                          beyond the primary mass bias correction. Examples: correction of δ values for
                          decay of enriched spike isotopes between calibration and use date (double-spike
                          procedures); age correction of δ238U for secular disequilibrium. Record ''None''
                          if no additional normalization is applied.'
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/solutionMcicpmsTAPP/normalizationStandardsBasedCorrectionDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: normalizationStandardsBasedCorrectionDefault
                          schema:name:
                            const: Normalization / Standards-Based Correction
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      - &id004
                        title: Constants and Reference Values Used
                        description: Physical constants and reference values used in data reduction to
                          calculate the final reported quantity (e.g., decay constants for age calculation,
                          standard isotope ratios, or other citable reference values used in a correction
                          or calculation), together with their source. Distinct from the Group 6 reference-material
                          fields, which document accepted values for specific calibration/validation materials
                          rather than universal physical constants. Record "None" if no citable, revisable
                          physical constants feed into this procedure's data reduction.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/solutionMcicpmsTAPP/constantsAndReferenceValuesUsedDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: constantsAndReferenceValuesUsedDefault
                          schema:name:
                            const: Constants and Reference Values Used
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                    allOf:
                    - contains:
                        title: Isotope Dilution Data Reduction Method
                        description: Mass balance approach used to calculate sample isotope ratios and/or
                          elemental concentrations from spike-sample mixture measurements. For double-spike
                          procedures, isotope ratios and concentrations are co-determined through the
                          spike inversion. For conventional ID concentration procedures (separate concentration
                          spike), IUPAC ID equations are used. Record 'None' if neither isotope dilution
                          nor double-spike methods are used.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/solutionMcicpmsTAPP/isotopeDilutionDataReductionMethod
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                            - '@id': ada:parameter/solutionMcicpmsTAPP/isotopeDilutionDataReductionMethod
                          schema:name:
                            const: Isotope Dilution Data Reduction Method
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                      minContains: 0
                      maxContains: 1
                    - contains: *id003
                      minContains: 0
                      maxContains: 1
                    - contains: *id004
                      minContains: 0
                      maxContains: 1
          allOf:
          - contains:
              properties:
                schema:name:
                  const: Sample preparation
              required:
              - schema:name
          - contains:
              properties:
                schema:name:
                  const: Sample digestion
              required:
              - schema:name
          - contains:
              properties:
                schema:name:
                  const: Data acquisition
              required:
              - schema:name
          - contains:
              properties:
                schema:name:
                  const: Data reduction
              required:
              - schema:name
    schema:instrument:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              schema:additionalType:
                contains:
                  const: ICPMS
            required:
            - schema:additionalType
          then:
            properties:
              schema:model:
                type: object
                properties:
                  schema:name:
                    description: Manufacturer and model name of the MC-ICP-MS instrument. Determines the
                      collector array geometry, available mass resolution modes, and detector complement.
                    type: string
                    readOnly: true
              schema:additionalProperty:
                type: array
                items:
                  anyOf:
                  - &id005
                    title: Instrument Serial Number or Lab Identifier
                    description: Serial number or laboratory-internal identifier for the specific instrument
                      unit. Supports traceability to instrument service records.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/solutionMcicpmsTAPP/instrumentSerialNumberOrLabIdentifierDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: instrumentSerialNumberOrLabIdentifierDefault
                      schema:name:
                        const: Instrument Serial Number or Lab Identifier
                      ada:dataType:
                        const: string
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
                        const: R
                    required:
                    - '@id'
                    - '@type'
                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                  - &id006
                    title: Mass Resolution Setting
                    description: Mass resolution mode used in this procedure. MC-ICP-MS instruments allow
                      selection of low resolution (LR; m/Δm ≈ 300–400), medium resolution (MR; m/Δm ≈
                      3000–8000), or high resolution (HR; m/Δm ≈ 10,000–12,000). Most isotope ratio measurements
                      use low resolution after chemical separation has removed interfering elements. Medium
                      or high resolution is used when polyatomic interferences (e.g., ArN+, ArO+, ArOH+
                      on Fe isotopes) cannot be fully resolved by chemistry alone. Procedure registers
                      the mode in use; analyst confirms at session start.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/solutionMcicpmsTAPP/massResolutionSetting
                      '@type':
                        const:
                        - schema:PropertyValue
                      schema:propertyID:
                        const:
                        - '@id': ada:parameter/solutionMcicpmsTAPP/massResolutionSetting
                      schema:name:
                        const: Mass Resolution Setting
                      schema:value:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                  - &id007
                    title: Make-up Gas Flow Rate
                    description: Supplementary argon flow added downstream of a desolvation system to
                      maintain total gas delivery to the plasma (L/min). Record 'N/A' if no desolvation
                      system is used. Record 'N/A' where Desolvation System is 'None'.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/solutionMcicpmsTAPP/makeUpGasFlowRateDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: makeUpGasFlowRateDefault
                      schema:name:
                        const: Make-up Gas Flow Rate
                      ada:dataType:
                        const: number
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
                        const: R
                      schema:unitText:
                        const: L/min
                    required:
                    - '@id'
                    - '@type'
                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                  - &id008
                    title: Memory Effect Mitigation
                    description: Procedure applied to minimize carryover of analyte isotopes between successive
                      sample introductions. In MC-ICP-MS, extended rinse periods with the same acid matrix
                      as samples (see Wash Time Between Samples) are the primary mitigation. At data processing
                      level, documents any flagging or exclusion of measurements preceded by samples with
                      significantly different isotopic compositions where carryover may be suspected.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/solutionMcicpmsTAPP/memoryEffectMitigationDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: memoryEffectMitigationDefault
                      schema:name:
                        const: Memory Effect Mitigation
                      ada:dataType:
                        const: string
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
                        const: R
                    required:
                    - '@id'
                    - '@type'
                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                allOf:
                - contains: *id005
                  minContains: 0
                  maxContains: 1
                - contains: *id006
                  minContains: 0
                  maxContains: 1
                - contains: *id007
                  minContains: 0
                  maxContains: 1
                - contains: *id008
                  minContains: 0
                  maxContains: 1
              schema:hasPart:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: Torch
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:name:
                          description: Type of plasma torch used (e.g., standard quartz, high-matrix,
                            low-flow).
                          anyOf:
                          - type: string
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              readOnly: true
                        schema:additionalProperty:
                          type: array
                          items: &id009
                            title: Torch Depth
                            description: Distance between the load coil and the sampling cone tip (mm),
                              also called injector depth or torch position depending on the instrument
                              manufacturer. Affects ion transmission efficiency, oxide formation, and
                              doubly-charged species production. The procedure specifies a target value
                              optimised during initial setup; the analyst confirms or fine-adjusts during
                              session tuning.
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/solutionMcicpmsTAPP/torchDepthDefault
                              '@type':
                                const:
                                - schema:PropertyValueSpecification
                              schema:valueName:
                                const: torchDepthDefault
                              schema:name:
                                const: Torch Depth
                              ada:dataType:
                                const: string
                              ada:fieldScope:
                                const: session
                              schema:readonlyValue:
                                const: false
                              ada:tier:
                                const: R
                            required:
                            - '@id'
                            - '@type'
                            - schema:valueName
                            - schema:name
                            - ada:dataType
                            - ada:fieldScope
                          allOf:
                          - contains: *id009
                            minContains: 0
                            maxContains: 1
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: Interface Cone
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items:
                            anyOf:
                            - title: Interface Cone Configuration
                              description: Geometry and designation of the sampler and skimmer cones installed
                                during analysis. For Neptune-type instruments, H-cones (standard) and
                                X-cones (high-sensitivity, ~3× higher transmission) are common options;
                                the choice affects ion beam intensity and is a procedure design decision.
                                Jet cones combined with an interface pump upgrade are used on some instruments
                                for enhanced sensitivity.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/solutionMcicpmsTAPP/interfaceConeConfiguration
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/solutionMcicpmsTAPP/interfaceConeConfiguration
                                schema:name:
                                  const: Interface Cone Configuration
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                              readOnly: true
                            - title: Sampler and Skimmer Cone Material
                              description: Material composition of the sampler and skimmer cones. Nickel
                                (Ni) is standard for HNO3 matrices. Platinum (Pt) cones are used for HCl-rich
                                matrices (e.g., 6 M HCl in Fe chemistry procedures) due to greater corrosion
                                resistance.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/solutionMcicpmsTAPP/samplerAndSkimmerConeMaterial
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/solutionMcicpmsTAPP/samplerAndSkimmerConeMaterial
                                schema:name:
                                  const: Sampler and Skimmer Cone Material
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                              readOnly: true
                          allOf:
                          - contains:
                              title: Interface Cone Configuration
                              description: Geometry and designation of the sampler and skimmer cones installed
                                during analysis. For Neptune-type instruments, H-cones (standard) and
                                X-cones (high-sensitivity, ~3× higher transmission) are common options;
                                the choice affects ion beam intensity and is a procedure design decision.
                                Jet cones combined with an interface pump upgrade are used on some instruments
                                for enhanced sensitivity.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/solutionMcicpmsTAPP/interfaceConeConfiguration
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/solutionMcicpmsTAPP/interfaceConeConfiguration
                                schema:name:
                                  const: Interface Cone Configuration
                                schema:value:
                                  type: string
                              required:
                              - '@id'
