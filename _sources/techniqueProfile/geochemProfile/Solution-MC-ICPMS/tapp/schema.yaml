                            separation and mass-bias correction (record 'Not installed'). A small number
                            of modern MC-ICP-MS instruments (e.g., Nu Instruments Sapphire, Thermo Scientific
                            Neoma MS/MS) add a hexapole collision/reaction cell upstream of the collector
                            array, operated in STD/KED/DRC modes analogous to quadrupole ICP-MS/MS instruments,
                            to suppress polyatomic and isobaric interferences before simultaneous multi-collection.
                            Specific gas types, flow rates, and voltages are documented in Group 4.
