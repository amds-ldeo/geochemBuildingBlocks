          properties:
            '@id':
              const: ada:parameter/solutionMcicpmsTAPP/uncertaintyPropagationMethodDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: uncertaintyPropagationMethodDefault
            schema:name:
              const: Uncertainty Propagation Method
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
      allOf:
      - contains:
          title: Desolvation System
          description: 'Desolvating nebulizer or membrane desolvator used upstream of the plasma to reduce
            solvent load. Lowers oxide production rates and increases sensitivity, and is commonly used
            for low-abundance analytes or small sample sizes. Note the trade-off: desolvation can introduce
            additional instrumental mass bias instability relative to wet plasma introduction. Record
            ''None'' if not used.'
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionMcicpmsTAPP/desolvationSystem
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/solutionMcicpmsTAPP/desolvationSystem
            schema:name:
              const: Desolvation System
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: Internal Standard Concentration
          description: Target concentration of internal standard element(s) in all measured solutions
            (µg/L or ppb). Record 'N/A' where Internal Standard Element is 'None'.
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionMcicpmsTAPP/internalStandardConcentration
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/solutionMcicpmsTAPP/internalStandardConcentration
            schema:name:
              const: Internal Standard Concentration
            schema:value:
              anyOf:
              - type: number
              - type: string
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          - schema:unitText
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains: *id018
        minContains: 0
        maxContains: 1
      - contains: *id019
        minContains: 0
        maxContains: 1
    bios:computationalTool:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              ada:toolRole:
                const: acquisition
            required:
            - ada:toolRole
          then:
            properties:
              schema:name:
                description: Name and version of the software used to control the instrument and acquire
                  raw multi-collector data.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
        - if:
            properties:
              ada:toolRole:
                const: dataReduction
            required:
            - ada:toolRole
          then:
            properties:
              schema:name:
                description: 'Name and version of the software used for data reduction: baseline subtraction,
                  gain correction, mass bias correction (SSB, double-spike inversion, or internal normalization),
                  interference corrections, and calculation of isotope ratios, δ-values, and concentrations.
                  Include version number.'
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
        required:
        - ada:toolRole
    ada:analyteTemplate:
      type: object
      properties:
        ada:defaultAnalytes:
          type: array
          items:
            description: 'The chemical species this procedure is designed to determine, recorded at whatever
              resolution the chemistry is resolved — element(s) for this technique; valence species where
              a procedure resolves oxidation state; compounds where it resolves molecules. Isotopes are
              not analytes: isotopes of an element are the same chemical species. In solution MC-ICP-MS
              the analyte is typically a single element isotope system (e.g., Fe, U, Sn, Pb, Zn) or multiple
              elements when the measurement simultaneously yields isotope ratios and isotope dilution
              concentrations. The procedure registers the primary analyte element(s); at analysis level
              the analyst records the actual suite measured. The complete mass list and cup assignments
              are documented in Collector Configuration.'
            type: string
        ada:analyteColumns:
          type: array
          items:
            anyOf:
            - $ref: ../../../../BaseSchema/tappDefinition/schema.yaml#/$defs/AnalyteIdentifierColumn
            - &id020
              title: Detection Limit
              description: Elemental detection limits, one per reported concentration variable (one per
                analyte, these being the same set), applicable when isotope dilution concentrations are
                also reported. For pure isotope ratio procedures (no concentration output), this field
                is N/A or reports the minimum sample mass required for a measurement at target precision.
                Specify units µg/g or µg/L and whether values are procedure-typical estimates or session-measured.
                Record 'N/A' where the procedure produces isotope ratios only and reports no concentrations.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/solutionMcicpmsTAPP/detectionLimit
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: detectionLimit
                schema:name:
                  const: Detection Limit
                ada:dataType:
                  const: number
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  anyOf:
                  - type: number
                  - type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id021
              title: Detection Limit Method
              description: Method used to calculate detection limits for each reported concentration variable,
                where concentration data are reported.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/solutionMcicpmsTAPP/detectionLimitMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: detectionLimitMethod
                schema:name:
                  const: Detection Limit Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id022
              title: Limit of Quantification (LOQ) Method
              description: Method used to determine the limit of quantification, where applicable.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/solutionMcicpmsTAPP/limitOfQuantificationMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: limitOfQuantificationMethod
                schema:name:
                  const: Limit of Quantification (LOQ) Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id023
              title: Analytical Accuracy and Assessment Method
              description: Accuracy of isotope ratio or δ-value measurements relative to certified or
                published consensus values and the method used to assess it. For isotope ratio procedures,
                accuracy is typically assessed by comparing measured δ values for secondary geological
                reference materials against published interlaboratory compilations or certified values.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/solutionMcicpmsTAPP/analyticalAccuracyAndAssessmentMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: analyticalAccuracyAndAssessmentMethod
                schema:name:
                  const: Analytical Accuracy and Assessment Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
          allOf:
          - contains: *id020
            minContains: 0
            maxContains: 1
          - contains: *id021
            minContains: 0
            maxContains: 1
          - contains: *id022
            minContains: 0
            maxContains: 1
          - contains: *id023
            minContains: 0
            maxContains: 1
    ada:sampleSequenceDesign:
      description: 'Description of the measurement order within a session: how sample solutions, bracketing
        standards, secondary reference materials, and blanks are interleaved. For SSB procedures, each
        sample is bracketed by two standards (standard–sample–standard); the bracketing standard is the
        same isotopic material as the zero-delta reference. For double-spike procedures, standards are
        spiked to the same level as samples before analysis.'
      type: string
      readOnly: true
    ada:internalStandardElement:
      description: 'Element added at a known concentration to all sample and standard solutions to serve
        as an internal normalization standard for mass bias correction (SSB + internal normalization procedures).
        The element must have a known isotopic composition and mass similar to the analyte. Examples:
        Ni or Cu doping for Fe isotopes (must verify complete matrix separation); Tl for Pb isotopes;
        Cd for Sb isotopes. Specify element and monitored isotope. Record ''None'' if SSB without internal
        standard or double-spike method is used.'
      type: string
      readOnly: true
    ada:oxideProductionMethodAndThreshold:
      description: Method used to quantify plasma oxide production and the acceptance threshold applied
        before commencing analysis. Record both the monitored mass ratio(s) and the maximum allowed threshold(s).
        Measured values are recorded in Oxide Production. CeO+/Ce+ (m/z 156/140) is the standard monitor
        proxy. Stricter oxide thresholds may be required for analytes sensitive to oxide interferences
        (e.g., BaO+ on REE isotopes).
      type: string
      readOnly: true
    ada:perAnalyteCalibrationStrategy:
      type: array
      items:
        description: Approach used to convert measured ion signals to elemental concentrations, where
          concentration data are also a product of the procedure (e.g., isotope dilution combined with
          isotope ratio measurement). For procedures producing isotope ratios only (no concentration output),
          record 'Not applicable (isotope ratios only)'. For double-spike procedures that simultaneously
          yield concentrations, record the ID calculation approach. Where different elements use different
          strategies, record each.
        type: string
        enum:
        - Not applicable (isotope ratios only)
        - Isotope dilution via double-spike inversion (concentrations co-determined with isotope ratios)
        - IUPAC isotope dilution equations (separate ID spike)
        - N/A
        - None
        - missing
        readOnly: true
    ada:signalIntegrationIntervalMethod:
      description: Method used to define which portion of the acquisition signal is integrated for each
        measurement. In MC-ICP-MS, all cycles within a block are typically used unless signal instability
        is detected. Specify the rule for including or excluding individual cycles.
      type: string
      enum:
      - All cycles included unless signal instability detected
      - Visual inspection of cycle-by-cycle data; outlier cycles excluded manually
      - Automated 2σ outlier rejection per block
      - N/A
      - None
      - missing
      readOnly: true
    ada:blankBackgroundCorrectionMethod:
      description: Method used to subtract instrument background from analytical signals. In MC-ICP-MS,
        on-peak zero subtraction (aspirating the same acid matrix as samples while measuring background
        at the analyte masses with beam deflector or from baseline cycles at the start of each block)
        is standard. For isotope ratio procedures where procedural blank is minor relative to the sample
        signal, on-peak zero is often sufficient. For low-level analyses, procedural blank must be measured
        and subtracted.
      type: string
      enum:
      - On-peak zero (acid blank)
      - Procedural blank
      - On-peak zero + procedural blank
      - N/A
      - None
      - missing
      readOnly: true
    ada:channelTemplate:
      type: object
      properties:
        ada:channelColumns:
          type: array
          items:
            anyOf:
            - $ref: ../../../../BaseSchema/tappDefinition/schema.yaml#/$defs/ChannelIdentifierColumn
            - &id024
              title: Isobaric Interference Corrections Applied
              description: 'Whether mathematical corrections for residual isobaric or polyatomic interferences
                are applied in data reduction, supplementary to any interference suppression achieved
                by chemical separation or mass resolution. In solution MC-ICP-MS, chemical separation
                is the primary interference mitigation; mathematical corrections address residual contributions.
                Common examples: 204Hg on 204Pb; abundance sensitivity tailing of 238U onto 236U and 235U.'
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/solutionMcicpmsTAPP/isobaricInterferenceCorrectionsApplied
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: isobaricInterferenceCorrectionsApplied
                schema:name:
                  const: Isobaric Interference Corrections Applied
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id025
              title: Interfering Species
              description: List of isobaric or polyatomic species mathematically corrected in data reduction.
                Includes direct isobars (e.g., 54Cr+ on 54Fe+, 58Ni+ on 58Fe+), abundance sensitivity
                tailing (e.g., 238U tail on 235U and 236U in U isotope measurements), and hydride interferences
                (e.g., 238UH+ at mass 239).
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/solutionMcicpmsTAPP/interferingSpecies
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: interferingSpecies
                schema:name:
                  const: Interfering Species
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id026
              title: Interference Correction Method
              description: Mathematical approach used to calculate and remove residual interference contributions.
                For direct isobars, interference monitor masses (e.g., 202Hg to correct 204Hg on 204Pb)
                are measured simultaneously and used with natural abundance ratios to calculate the interference
                contribution. For abundance sensitivity, the tailing factor is measured using a pure standard.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/solutionMcicpmsTAPP/interferenceCorrectionMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: interferenceCorrectionMethod
                schema:name:
                  const: Interference Correction Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
          allOf:
          - contains: *id024
            minContains: 0
            maxContains: 1
          - contains: *id025
            minContains: 0
            maxContains: 1
          - contains: *id026
            minContains: 0
            maxContains: 1
    ada:primaryStandardNameDefault:
      description: 'Name and reference material identifier of the isotopic reference standard used as
        the bracketing standard (SSB) or zero-delta anchor. This is an isotopic composition standard (not
        a concentration standard): it defines the isotopic composition against which all sample δ or ε
        values are normalized. Must be a pure, homogeneous, internationally distributed material with
        well-characterized isotopic composition. For double-spike procedures, also used for spike calibration.
        Include the material name, its source or supplier, and a citation for the accepted values used,
        since results calibrated against different published values for the same material are not directly
        comparable.'
      type: string
    ada:calibrationMeasurementFrequency:
      description: How often the primary isotopic standard is measured relative to unknown samples within
        a session. For SSB, typically one standard measurement before and one after each sample (standard–sample–standard
        triplet). Specify the bracketing scheme.
      type: string
      readOnly: true
    ada:secondaryReferenceMaterialDefault:
      type: array
      items:
        description: Reference material(s) measured as unknowns to independently assess analytical accuracy.
          Specify material name and the isotopic composition reference source (certified value, consensus
          value, or literature compilation). For isotope ratio procedures, secondary RMs are geological
          materials with published isotopic compositions (e.g., BHVO-2 for Fe isotopes) or pure isotopic
          standards of certified composition.
        type: string
    schema:description:
      description: 'Any procedure- or analysis-specific information not captured by a structured field
        anywhere in this TAPP — including anomalies, deviations from the registered procedure, instrument
        modifications, and supplementary context. Scope is the whole document, not Group 6: this is the
        last field of the TAPP and covers all six groups. Use sparingly; a structured field is preferred
        for anything that can be formally categorised.'
      type: string
    ada:analyticalMode:
      type: array
      items:
        description: Top-level declaration of the kind of measurement this procedure covers. Solution
          ICP-MS has a single routine mode — continuous nebulisation of a digested solution — so this
          TAPP defines no mode flag columns; the field is still required (Rule 3) so that a procedure
          record is self-describing and comparable with multi-mode TAPPs across the library.
        type: string
        enum:
        - Solution nebulisation (continuous)
        - Flow injection
        - missing
        readOnly: true
    ada:reportedPropertyTemplate:
      type: object
      properties:
        ada:defaultReportedProperties:
          type: array
          items:
            description: The final variable(s) this procedure reports and their units — distinct from
              the fields recording what was *acquired* rather than what is reported. A procedure may acquire
              many channels and report a small number of derived quantities; without this field a data
              consumer cannot tell which. Record every reported variable, including intermediate quantities
              reported alongside final ones (e.g. both the 206Pb/238U ratio and the 206Pb/238U date).
              Where a reported variable is a nominal property with no magnitude (e.g. a mineral identification),
              record the variable and give the unit as 'N/A — nominal property'.
            type: string
            readOnly: true
  required:
  - ada:sampleSequenceDesign
  - ada:internalStandardElement
  - ada:oxideProductionMethodAndThreshold
  - ada:signalIntegrationIntervalMethod
  - ada:blankBackgroundCorrectionMethod
  - ada:primaryStandardNameDefault
  - ada:calibrationMeasurementFrequency
