                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id032
                title: EDS Counting Statistics / Accumulation Criterion
                description: Quality criterion used to determine when sufficient EDS signal has been accumulated
                  for a given pixel or point, in lieu of or in addition to a fixed live time. Expressed
                  as a target relative uncertainty on major-element peak counts achieved by accumulating
                  successive scan frames (e.g., "1% counting statistics on major elements"; ">10% counting
                  statistics"). Distinct from EDS Live Time per Point or Pixel, which records a fixed-duration
                  setting. Record 'N/A' where EDS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/edsCountingStatisticsAccumulationCriterion
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/edsCountingStatisticsAccumulationCriterion
                  schema:name:
                    const: EDS Counting Statistics / Accumulation Criterion
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id033
                title: EELS Chemical State Determination Method
                description: Method used to determine the chemical or oxidation state of an element from
                  the fine structure of its ionization edge (ELNES), together with the reference data
                  or calibration the determination relies on. Name the method family and cite the calibration
                  curve or reference spectra used. Record 'N/A' where no chemical-state determination
                  is made.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsChemicalStateDeterminationMethod
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/eelsChemicalStateDeterminationMethod
                  schema:name:
                    const: EELS Chemical State Determination Method
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
