                - schema:name
                - schema:value
              - &id031
                title: EDS Detection Limit
                description: Estimated detection limits by EDS under this procedure's conditions, one
                  per reported concentration variable (one per analyte, these being the same set). Record
                  'N/A' where EDS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
