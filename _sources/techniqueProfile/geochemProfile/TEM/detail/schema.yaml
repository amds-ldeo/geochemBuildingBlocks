$schema: https://json-schema.org/draft/2020-12/schema
title: TEM Analysis Detail
description: Detail block for TEM hasPart items. Discriminates on ada:componentType, carries analysis-level
  required properties and an @id reference to a registered temTAPP definition, and per-dataset schema:additionalProperty
  entries constrained via $refs to the parameterValues registry plus a catch-all. Generated by tools/build_tapp.py.
allOf:
- $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/AnalysisIdentification
- $ref: ../../../../BaseSchema/modules/calibrationFactor/schema.yaml#/$defs/AnalysisIdentification
- $ref: ../../../../BaseSchema/modules/aggregation/schema.yaml#/$defs/AnalysisIdentification
- type: object
  properties:
    prov:wasGeneratedBy:
      type: array
      items:
        type: object
        properties:
          schema:actionProcess:
            type: object
            properties:
              schema:step:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:name:
                          const: Sample preparation
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items: &id001
                            title: Sample Preparation Details
                            description: 'Detailed description of section preparation conditions: FIB
                              milling voltages and currents; final thinning conditions and target foil
                              thickness; protective coating type and deposition method (e.g., e-beam vs.
                              ion-beam Pt or C strip — e-beam deposition causes less surface damage);
                              any post-FIB surface cleanup (e.g., low-energy Ar+ ion polishing in a Fischione
                              NanoMill, final 0.5–2 kV Ga+ thinning); sample transfer and storage environment
                              (ambient air, dry N₂ atmosphere, vacuum transfer holder, glovebox); plasma
                              cleaning before loading. Includes session-specific observations and deviations
                              from the procedure standard. Includes preparation artifacts noted (Ga implantation,
                              amorphization, curtaining).'
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/temTAPP/samplePreparationDetails
                              '@type':
                                const:
                                - schema:PropertyValue
                              schema:propertyID:
                                const:
                                - '@id': ada:parameter/temTAPP/samplePreparationDetails
                              schema:name:
                                const: Sample Preparation Details
                              schema:value:
                                type: string
                            required:
                            - '@id'
                            - '@type'
                            - schema:propertyID
                            - schema:name
                            - schema:value
                          allOf:
                          - contains: *id001
                            minContains: 0
                            maxContains: 1
                  - if:
                      properties:
                        schema:name:
                          const: Data reduction
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items:
                            anyOf:
                            - &id002
                              title: EELS Plural Scattering Correction
                              description: Method applied to correct for multiple inelastic scattering
                                events (plural scattering) that broaden edge fine structure. Record 'N/A'
                                where EELS is not listed in Spectroscopic Detector(s).
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/temTAPP/eelsPluralScatteringCorrection
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/temTAPP/eelsPluralScatteringCorrection
                                schema:name:
                                  const: EELS Plural Scattering Correction
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            - &id003
                              title: Image Processing Methods Applied
                              description: Image processing steps applied to TEM or STEM images during
                                or after acquisition. Non-linear processing steps that could affect quantitative
                                interpretation should be documented explicitly.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/temTAPP/imageProcessingMethodsApplied
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/temTAPP/imageProcessingMethodsApplied
                                schema:name:
                                  const: Image Processing Methods Applied
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            - $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/Param_Analysis_constantsReferenceValues
                          allOf:
                          - contains: *id002
                            minContains: 0
                            maxContains: 1
                          - contains: *id003
                            minContains: 0
                            maxContains: 1
                          - contains:
                              $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/Param_Analysis_constantsReferenceValues
                            minContains: 0
                            maxContains: 1
                allOf:
                - contains:
                    properties:
                      schema:name:
                        const: Data reduction
                    required:
                    - schema:name
          schema:additionalProperty:
            type: array
            items:
              anyOf:
              - $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Analysis_samplingUnitSelectionCriteria
              - &id004
                title: Sample Holder
                description: Type of specimen holder used.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/sampleHolder
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/sampleHolder
                  schema:name:
                    const: Sample Holder
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id005
                title: Spectroscopic Detector(s)
                description: Spectroscopic detectors present and used under this procedure. EDS and EELS
                  parameter fields in Group 4 apply only when the corresponding detector is listed here.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/spectroscopicDetector
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/spectroscopicDetector
                  schema:name:
                    const: Spectroscopic Detector(s)
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id006
                title: Analytical Sub-mode
                description: Sub-mode(s) of imaging or diffraction performed under this procedure. Multiple
                  values apply when the procedure covers more than one sub-mode within a given analytical
                  mode.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/analyticalSubMode
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/analyticalSubMode
                  schema:name:
                    const: Analytical Sub-mode
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id007
                title: EFTEM Energy Window
                description: 'Energy window(s) used for EFTEM elemental mapping: center energy, width,
                  and acquisition method (three-window or jump-ratio). Record ''N/A'' where EFTEM is not
                  listed in Analytical Sub-mode.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eftemEnergyWindow
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/eftemEnergyWindow
                  schema:name:
                    const: EFTEM Energy Window
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id008
                title: HAADF Collection Angles
                description: Inner and outer collection angles of the HAADF detector in milliradians (mrad).
                  Inner angle can be derived from camera length and detector geometry.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/haadfCollectionAngles
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/haadfCollectionAngles
                  schema:name:
                    const: HAADF Collection Angles
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id009
                title: STEM Probe Diameter
                description: 'Nominal or measured diameter of the focused electron probe at the sample,
                  reported in nm. Related to, but distinct from, Convergence Semi-Angle: the two quantities
                  are connected via aberration coefficients, defocus, and probe current, which are not
                  always published. Report whichever is known; if both are known, report both fields.
                  Also governs STEM-EDS and STEM-EELS acquisition where those detectors are used.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemProbeDiameter
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/stemProbeDiameter
                  schema:name:
                    const: STEM Probe Diameter
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id010
                title: STEM Probe Current
                description: Probe current in picoamperes (pA) or nanoamperes (nA). Also governs STEM-EDS
                  and STEM-EELS acquisition where those detectors are used.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemProbeCurrent
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/stemProbeCurrent
                  schema:name:
                    const: STEM Probe Current
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id011
                title: Dwell Time per Pixel
                description: Time spent acquiring signal at each pixel during STEM scanning in milliseconds.
                  For dose-sensitive materials, minimize dwell and compensate with frame averaging. Also
                  governs STEM-EDS and STEM-EELS acquisition where those detectors are used. For 4D-STEM
                  dwell time see '4D-STEM Dwell Time per Probe Position'.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/dwellTimePerPixel
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/dwellTimePerPixel
                  schema:name:
                    const: Dwell Time per Pixel
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id012
                title: STEM Scan Dimensions
                description: Number of pixels in the STEM scan frame (X × Y pixels). Also governs STEM-EDS
                  and STEM-EELS acquisition where those detectors are used.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemScanDimensions
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/stemScanDimensions
                  schema:name:
                    const: STEM Scan Dimensions
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id013
                title: STEM Frame Averaging
                description: Number of frames averaged (with drift correction if applicable) to produce
                  the final STEM image. Also governs STEM-EDS and STEM-EELS acquisition where those detectors
                  are used.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemFrameAveraging
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/stemFrameAveraging
                  schema:name:
                    const: STEM Frame Averaging
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id014
                title: Camera Length
                description: Nominal camera length in millimeters used for diffraction pattern acquisition.
                  Must be calibrated to convert pixel distances to d-spacings. Calibration to absolute
                  d-spacings is required — see 'Diffraction Calibration Reference'.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/cameraLength
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/cameraLength
                  schema:name:
                    const: Camera Length
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id015
                title: Selected-Area Aperture Size
                description: Diameter of the selected-area aperture used in SAED mode, defining the specimen
                  region that contributes to the diffraction pattern.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/selectedAreaApertureSize
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/selectedAreaApertureSize
                  schema:name:
                    const: Selected-Area Aperture Size
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id016
                title: Precession Angle
                description: Precession semi-angle in degrees for precession electron diffraction (PED).
                  Not applicable to SAED, CBED, or standard 4D-STEM. Record 'N/A' where Precession ED
                  is not listed in Analytical Sub-mode.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/precessionAngle
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/precessionAngle
                  schema:name:
                    const: Precession Angle
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id017
                title: 4D-STEM Scan Grid and Area
                description: Number of probe positions in the 4D-STEM dataset (scan pixels × scan pixels)
                  and the physical area covered. Probe step size is the physical area divided by scan
                  pixel count. Record 'N/A' where 4D-STEM is not listed in Analytical Sub-mode.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemScanGridAndArea4D
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/stemScanGridAndArea4D
                  schema:name:
                    const: 4D-STEM Scan Grid and Area
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id018
                title: 4D-STEM Dwell Time per Probe Position
                description: Time spent acquiring each diffraction pattern in the 4D-STEM dataset in milliseconds.
                  Record 'N/A' where 4D-STEM is not listed in Analytical Sub-mode.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemDwellTimePerProbePosition4D
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/stemDwellTimePerProbePosition4D
                  schema:name:
                    const: 4D-STEM Dwell Time per Probe Position
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id019
                title: Diffraction Camera Length Calibration Method
                description: Method used to calibrate the camera length constant and convert pixel distances
                  in diffraction patterns to d-spacings or reciprocal lattice vectors.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/diffractionCameraLengthCalibrationMethod
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/diffractionCameraLengthCalibrationMethod
                  schema:name:
                    const: Diffraction Camera Length Calibration Method
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id020
                title: EDS Acquisition Mode
                description: 'Spatial acquisition sub-strategy for EDS measurements: stationary-beam point
                  acquisition, line scan (beam stepped along a transect at defined intervals), or area
                  map / spectrum image (beam rastered over a pixel grid). Specifies how the beam is positioned
                  during data collection within the declared analytical mode. Record ''N/A'' where the
                  procedure has no EDS detector. ''Point'' covers what the literature also calls spot
                  or point-spectrum analysis. ''Map'' and ''Spectrum image'' are distinct acquisitions,
                  not synonyms: a map may retain element intensities alone, whereas a spectrum image retains
                  a full spectrum at every pixel and can be requantified afterwards — record which was
                  acquired. Where more than one mode was used, join them with ''; '' rather than looking
                  for a combined member.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/edsAcquisitionMode
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/edsAcquisitionMode
                  schema:name:
                    const: EDS Acquisition Mode
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id021
                title: EDS Live Time per Point or Pixel
                description: EDS spectral acquisition live time per analysis point (point/line mode) or
                  per pixel (spectrum image) in seconds. Also referred to as "EDS Acquisition Time" in
                  EPMA and some SEM-EDS contexts, where the per-pixel distinction is less relevant. Record
                  'N/A' where EDS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/edsLiveTimePerPointOrPixel
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/edsLiveTimePerPointOrPixel
                  schema:name:
                    const: EDS Live Time per Point or Pixel
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id022
                title: EDS Energy Range
                description: Energy range of EDS spectrum acquisition in keV. Record 'N/A' where EDS is
                  not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/edsEnergyRange
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/edsEnergyRange
                  schema:name:
                    const: EDS Energy Range
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id023
                title: EELS Acquisition Mode
                description: Mode of EELS data acquisition. Record 'N/A' where EELS is not listed in Spectroscopic
                  Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsAcquisitionMode
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/eelsAcquisitionMode
                  schema:name:
                    const: EELS Acquisition Mode
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id024
                title: EELS Edges
                description: 'Ionization edge(s) acquired by EELS, specified by element symbol and edge
                  label (e.g., Fe L2,3; O K). Provides the EELS-specific counterpart to the Analyte field:
                  while Analyte lists elements, EELS Edges documents which ionization edges were used
                  and their approximate energy loss positions. The edge list may be narrowed at analysis
                  time. Record ''N/A'' where EELS is not listed in Spectroscopic Detector(s).'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsEdges
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/eelsEdges
                  schema:name:
                    const: EELS Edges
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id025
                title: EELS Acquisition Time per Spectrum
                description: Exposure time per individual EELS spectrum (or per pixel for spectrum images)
                  in seconds. Record 'N/A' where EELS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsAcquisitionTimePerSpectrum
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/eelsAcquisitionTimePerSpectrum
                  schema:name:
                    const: EELS Acquisition Time per Spectrum
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id026
                title: EELS Energy Loss Range
                description: Energy loss range acquired, defined by onset energy and width in eV. The
                  target range covers the registered analyte edges; the actual range acquired may differ.
                  Record 'N/A' where EELS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsEnergyLossRange
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/eelsEnergyLossRange
                  schema:name:
                    const: EELS Energy Loss Range
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id027
                title: Specimen Thickness Determination Method
                description: Method used to estimate TEM foil thickness.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/specimenThicknessDeterminationMethod
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/specimenThicknessDeterminationMethod
                  schema:name:
                    const: Specimen Thickness Determination Method
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id028
                title: EDS Calibration Standard(s)
                description: Reference material(s) used to validate EDS quantification or determine experimental
                  k-factors or zeta-factors. Record 'N/A' where EDS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/edsCalibrationStandard
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/edsCalibrationStandard
                  schema:name:
                    const: EDS Calibration Standard(s)
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id029
                title: EELS Energy Calibration
                description: Method and reference used to calibrate the EELS energy axis. Record 'N/A'
                  where EELS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsEnergyCalibration
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/temTAPP/eelsEnergyCalibration
                  schema:name:
                    const: EELS Energy Calibration
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id030
                title: Diffraction Calibration Reference
