          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id022
          title: Specimen Thickness Determination Method
          description: Method used to estimate TEM foil thickness. Required for EELS quantification (log-ratio)
            and for assessing multiple-scattering severity.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/specimenThicknessDeterminationMethodDefault
