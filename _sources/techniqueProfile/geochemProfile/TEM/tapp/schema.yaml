$schema: https://json-schema.org/draft/2020-12/schema
title: TEM Technique-Aligned Protocol Profile (temTAPP)
description: 'Transmission electron microscopy (TEM/STEM, incl. EDS/EELS) extension of the base TAPP definition.
  Basic protocol-tier fields are required top-level ada: properties; Advanced protocol-tier fields are
  schema:additionalProperty[] entries; an ada:analyteTemplate carries per-element columns. Generated from
  tapp/Current TAPPs/TEM_TAPP_v48.csv by tools/build_tapp.py.'
allOf:
- $ref: ../../../../BaseSchema/tappDefinition/schema.yaml
- $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/ProcedureIdentification
- $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/ProcedureIdentification
- $ref: ../../../../BaseSchema/modules/calibrationFactor/schema.yaml#/$defs/ProcedureIdentification
- $ref: ../../../../BaseSchema/modules/analyte/schema.yaml#/$defs/ProcedureIdentification
- type: object
  properties:
    schema:object:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              '@type':
                contains:
                  const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
            required:
            - '@type'
          then:
            properties:
              schema:additionalProperty:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:name:
                          const: Target Material
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:value:
                          type: array
                          items:
                            description: General description of the material type(s) this procedure is
                              designed to analyse.
                            anyOf:
                            - type: string
                              enum:
                              - Silicate mineral
                              - Silicate glass
                              - Oxide
                              - Sulfide
                              - Carbonate
                              - Phosphate
                              - Metal or alloy
                              - Organic matter
                              - Amorphous phase
                              - Nanoparticle
                              - N/A
                              - None
                              - missing
                            - type: string
                            readOnly: true
                allOf:
                - contains:
                    properties:
                      schema:name:
                        const: Target Material
                    required:
                    - schema:name
                - contains:
                    $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Procedure_preAnalysisImagingAndScreening
                  minContains: 0
                  maxContains: 1
      allOf:
      - contains:
          properties:
            '@type':
              contains:
                const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
          required:
          - '@type'
    schema:actionProcess:
      type: object
      properties:
        schema:step:
          type: array
          items:
            type: object
            allOf:
            - if:
                properties:
                  schema:name:
                    const: Sample preparation
                required:
                - schema:name
              then:
                properties:
                  schema:additionalProperty:
                    type: array
                    items: &id001
                      title: Sample Preparation Details
                      description: 'Detailed description of section preparation conditions: FIB milling
                        voltages and currents; final thinning conditions and target foil thickness; protective
                        coating type and deposition method (e.g., e-beam vs. ion-beam Pt or C strip —
                        e-beam deposition causes less surface damage); any post-FIB surface cleanup (e.g.,
                        low-energy Ar+ ion polishing in a Fischione NanoMill, final 0.5–2 kV Ga+ thinning);
                        sample transfer and storage environment (ambient air, dry N₂ atmosphere, vacuum
                        transfer holder, glovebox); plasma cleaning before loading. Includes session-specific
                        observations and deviations from the procedure standard. Includes preparation
                        artifacts noted (Ga implantation, amorphization, curtaining).'
                      type: object
                      properties:
                        '@id':
                          const: ada:parameter/temTAPP/samplePreparationDetailsDefault
                        '@type':
                          const:
                          - schema:PropertyValueSpecification
                        schema:valueName:
                          const: samplePreparationDetailsDefault
                        schema:name:
                          const: Sample Preparation Details
                        ada:dataType:
                          const: string
                        ada:fieldScope:
                          const: session
                        schema:readonlyValue:
                          const: false
                        ada:tier:
                          const: R
                      required:
                      - '@id'
                      - '@type'
                      - schema:valueName
                      - schema:name
                      - ada:dataType
                      - ada:fieldScope
                    allOf:
                    - contains: *id001
                      minContains: 0
                      maxContains: 1
            - if:
                properties:
                  schema:name:
                    const: Data reduction
                required:
                - schema:name
              then:
                properties:
                  schema:additionalProperty:
                    type: array
                    items:
                      anyOf:
                      - &id002
                        title: EELS Plural Scattering Correction
                        description: Method applied to correct for multiple inelastic scattering events
                          (plural scattering) that broaden edge fine structure. Record 'N/A' where EELS
                          is not listed in Spectroscopic Detector(s).
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/temTAPP/eelsPluralScatteringCorrectionDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: eelsPluralScatteringCorrectionDefault
                          schema:name:
                            const: EELS Plural Scattering Correction
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      - &id003
                        title: Image Processing Methods Applied
                        description: Image processing steps applied to TEM or STEM images during or after
                          acquisition. Non-linear processing steps that could affect quantitative interpretation
                          should be documented explicitly.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/temTAPP/imageProcessingMethodsAppliedDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: imageProcessingMethodsAppliedDefault
                          schema:name:
                            const: Image Processing Methods Applied
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      - $ref: ../../../../BaseSchema/modules/aggregation/schema.yaml#/$defs/Param_Procedure_analysisInclusionAndRejectionCriteria
                      - $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/Param_Procedure_constantsReferenceValues
                    allOf:
                    - contains: *id002
                      minContains: 0
                      maxContains: 1
                    - contains: *id003
                      minContains: 0
                      maxContains: 1
                    - contains:
                        $ref: ../../../../BaseSchema/modules/aggregation/schema.yaml#/$defs/Param_Procedure_analysisInclusionAndRejectionCriteria
                      minContains: 0
                      maxContains: 1
                    - contains:
                        $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/Param_Procedure_constantsReferenceValues
                      minContains: 0
                      maxContains: 1
          allOf:
          - contains:
              properties:
                schema:name:
                  const: Data reduction
              required:
              - schema:name
    schema:instrument:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              schema:additionalType:
                contains:
                  const: TEM
                schema:inDefinedTermSet: ada:vocab/instrumentType
            required:
            - schema:additionalType
          then:
            properties:
              schema:manufacturer:
                type: object
                properties:
                  schema:name:
                    description: Manufacturer of the instrument that performs the measurement, recorded
                      as a controlled value. Where a procedure couples a sample-introduction system to
                      an analysing instrument, this records the analysing instrument. Instrument Model
                      gives the specific designation.
                    type: string
                    enum:
                    - JEOL
                    - ThermoFisher Scientific (FEI)
                    - Hitachi
                    - Nion
                    - Zeiss
                    - Unknown
                    - N/A
                    - None
                    - missing
                    readOnly: true
              schema:model:
                type: object
                properties:
                  schema:name:
                    description: Model designation of the instrument that performs the measurement, including
                      any generation or configuration suffix. Conventionally written with the manufacturer
                      name included; Instrument Manufacturer records the vendor separately, as a controlled
                      value, so that procedures remain findable by vendor.
                    type: string
                    readOnly: true
              schema:hasPart:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: Electron Source
                          schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:description:
                          description: Type of electron gun used in the instrument.
                          anyOf:
                          - type: string
                            enum:
                            - Cold-FEG
                            - Schottky FEG (X-FEG)
                            - Schottky FEG (standard)
                            - Field emission gun (FEG) — subtype not specified
                            - LaB6 / CeB6
                            - Tungsten (W)
                            - Unknown
                            - N/A
                            - None
                            - missing
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              enum:
                              - Cold-FEG
                              - Schottky FEG (X-FEG)
                              - Schottky FEG (standard)
                              - Field emission gun (FEG) — subtype not specified
                              - LaB6 / CeB6
                              - Tungsten (W)
                              - Unknown
                              - N/A
                              - None
                              - missing
                              readOnly: true
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: Aberration Corrector
                          schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:description:
                          description: Type of aberration corrector installed and active.
                          anyOf:
                          - type: string
                            enum:
                            - None
                            - Probe Cs-corrected (STEM)
                            - Image Cs-corrected (TEM)
                            - Both probe and image corrected
                            - Cs-corrected (type unknown)
                            - Unknown
                            - N/A
                            - None
                            - missing
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              enum:
                              - None
                              - Probe Cs-corrected (STEM)
                              - Image Cs-corrected (TEM)
                              - Both probe and image corrected
                              - Cs-corrected (type unknown)
                              - Unknown
                              - N/A
                              - None
                              - missing
                              readOnly: true
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: Monochromator
                          schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:description:
                          description: Whether a monochromator is installed and was active during this
                            procedure. Record 'N/A' where EELS is not listed in Spectroscopic Detector(s)
                            and EFTEM is not listed in Analytical Sub-mode.
                          anyOf:
                          - type: string
                            enum:
                            - Yes — active
                            - Yes — not used
                            - 'No'
                            - Unknown
                            - N/A
                            - None
                            - missing
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              enum:
                              - Yes — active
                              - Yes — not used
                              - 'No'
                              - Unknown
                              - N/A
                              - None
                              - missing
                              readOnly: true
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: EDS Detector
                          schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:description:
                          description: EDS detector type, manufacturer, number of detector elements, active
                            area and solid angle, window type, and geometry (take-off angle, position).
                            List multiple detectors separately. Record 'N/A' where the procedure has no
                            EDS detector.
                          anyOf:
                          - type: string
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              readOnly: true
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: EELS Spectrometer
                          schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:description:
                          description: EELS spectrometer manufacturer, model, and key capabilities including
                            post-column GIF model and energy resolution. Record 'N/A' where EELS is not
                            listed in Spectroscopic Detector(s).
                          anyOf:
                          - type: string
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              readOnly: true
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: Imaging Detector
                          schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:description:
                          description: List of detectors available and used under this procedure for STEM
                            imaging and TEM/SAED/CBED diffraction recording. Include HAADF/ABF/BF detector
                            geometries and TEM/diffraction camera model.
                          anyOf:
                          - type: string
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              readOnly: true
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: 4D-STEM Detector
                          schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:description:
                          description: Direct electron detector used for 4D-STEM data acquisition, recording
                            a full diffraction pattern at each probe position. If a GIF is used as the
                            mounting platform (enabling energy-filtered 4D-STEM), specify this. Record
                            'N/A' where 4D-STEM is not listed in Analytical Sub-mode.
                          anyOf:
                          - type: string
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              readOnly: true
                allOf:
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          const: Electron Source
                        schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                    required:
                    - schema:additionalType
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          const: Aberration Corrector
                        schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                    required:
                    - schema:additionalType
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          const: EDS Detector
                        schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                    required:
                    - schema:additionalType
              ada:acceleratingVoltageDefault:
                description: Electron beam accelerating voltage in kilovolts (kV). Justify any deviation
                  from the standard operating voltage.
                anyOf:
                - type: number
                - type: string
              schema:additionalProperty:
                type: array
                items: &id004
                  title: TEM Objective Aperture
                  description: Objective aperture diameter used to select the imaging beam condition in
                    TEM mode.
                  type: object
                  properties:
                    '@id':
                      const: ada:parameter/temTAPP/temObjectiveApertureDefault
                    '@type':
                      const:
                      - schema:PropertyValueSpecification
                    schema:valueName:
                      const: temObjectiveApertureDefault
                    schema:name:
                      const: TEM Objective Aperture
                    ada:dataType:
                      const: string
                    ada:fieldScope:
                      const: session
                    schema:readonlyValue:
                      const: false
                    ada:tier:
                      const: R
                  required:
                  - '@id'
                  - '@type'
                  - schema:valueName
                  - schema:name
                  - ada:dataType
                  - ada:fieldScope
                allOf:
                - contains: *id004
                  minContains: 0
                  maxContains: 1
      allOf:
      - contains:
          properties:
            schema:additionalType:
              contains:
                const: TEM
              schema:inDefinedTermSet: ada:vocab/instrumentType
          required:
          - schema:additionalType
    schema:additionalProperty:
      type: array
      items:
        anyOf:
        - &id005
          title: Sample Holder
          description: Type of specimen holder used.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/sampleHolderDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: sampleHolderDefault
            schema:name:
              const: Sample Holder
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id006
          title: EFTEM Energy Window
          description: 'Energy window(s) used for EFTEM elemental mapping: center energy, width, and acquisition
            method (three-window or jump-ratio). Record ''N/A'' where EFTEM is not listed in Analytical
            Sub-mode.'
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/eftemEnergyWindowDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: eftemEnergyWindowDefault
            schema:name:
              const: EFTEM Energy Window
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id007
          title: HAADF Collection Angles
          description: Inner and outer collection angles of the HAADF detector in milliradians (mrad).
            Inner angle can be derived from camera length and detector geometry.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/haadfCollectionAnglesDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: haadfCollectionAnglesDefault
            schema:name:
              const: HAADF Collection Angles
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id008
          title: STEM Probe Diameter
          description: 'Nominal or measured diameter of the focused electron probe at the sample, reported
            in nm. Related to, but distinct from, Convergence Semi-Angle: the two quantities are connected
            via aberration coefficients, defocus, and probe current, which are not always published. Report
            whichever is known; if both are known, report both fields. Also governs STEM-EDS and STEM-EELS
            acquisition where those detectors are used.'
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/stemProbeDiameterDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: stemProbeDiameterDefault
            schema:name:
              const: STEM Probe Diameter
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: nm
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id009
          title: STEM Probe Current
          description: Probe current in picoamperes (pA) or nanoamperes (nA). Also governs STEM-EDS and
            STEM-EELS acquisition where those detectors are used.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/stemProbeCurrentDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: stemProbeCurrentDefault
            schema:name:
              const: STEM Probe Current
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: pA or nA
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id010
          title: STEM Scan Dimensions
          description: Number of pixels in the STEM scan frame (X × Y pixels). Also governs STEM-EDS and
            STEM-EELS acquisition where those detectors are used.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/stemScanDimensionsDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: stemScanDimensionsDefault
            schema:name:
              const: STEM Scan Dimensions
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: pixels x pixels
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id011
          title: STEM Frame Averaging
          description: Number of frames averaged (with drift correction if applicable) to produce the
            final STEM image. Also governs STEM-EDS and STEM-EELS acquisition where those detectors are
            used.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/stemFrameAveragingDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: stemFrameAveragingDefault
            schema:name:
              const: STEM Frame Averaging
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id012
          title: Selected-Area Aperture Size
          description: Diameter of the selected-area aperture used in SAED mode, defining the specimen
            region that contributes to the diffraction pattern.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/selectedAreaApertureSizeDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: selectedAreaApertureSizeDefault
            schema:name:
              const: Selected-Area Aperture Size
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id013
          title: Precession Angle
          description: Precession semi-angle in degrees for precession electron diffraction (PED). Not
            applicable to SAED, CBED, or standard 4D-STEM. Record 'N/A' where Precession ED is not listed
            in Analytical Sub-mode.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/precessionAngleDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: precessionAngleDefault
            schema:name:
              const: Precession Angle
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: degrees
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id014
          title: 4D-STEM Scan Grid and Area
          description: Number of probe positions in the 4D-STEM dataset (scan pixels × scan pixels) and
            the physical area covered. Probe step size is the physical area divided by scan pixel count.
            Record 'N/A' where 4D-STEM is not listed in Analytical Sub-mode.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/stemScanGridAndArea4DDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: stemScanGridAndArea4DDefault
            schema:name:
              const: 4D-STEM Scan Grid and Area
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id015
          title: 4D-STEM Dwell Time per Probe Position
          description: Time spent acquiring each diffraction pattern in the 4D-STEM dataset in milliseconds.
            Record 'N/A' where 4D-STEM is not listed in Analytical Sub-mode.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/stemDwellTimePerProbePosition4DDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: stemDwellTimePerProbePosition4DDefault
            schema:name:
              const: 4D-STEM Dwell Time per Probe Position
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
