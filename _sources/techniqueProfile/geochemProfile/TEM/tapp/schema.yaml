    ada:spectroscopicDetectorDefault:
      description: Spectroscopic detectors present and used under this procedure. EDS and EELS parameter
        fields in Group 4 apply only when the corresponding detector is listed here.
      type: string
      enum:
      - EDS only
      - EELS only
      - EDS and EELS
      - EELS and EFTEM
      - EDS and EELS and EFTEM
      - None
      - N/A
      - missing
    bios:computationalTool:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              ada:toolRole:
                const: dataReduction
            required:
            - ada:toolRole
          then:
            properties:
              schema:name:
                description: Software used to simulate electron diffraction patterns for comparison with
                  experimental SAED patterns during phase identification (e.g., SingleCrystal, CrystalMaker,
                  JEMS, DIFPACK). Complements the Acquisition Software field, which covers data collection;
                  simulation software is used at the interpretation and data processing step.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
        required:
        - ada:toolRole
    ada:analyticalSubModeDefault:
      description: Sub-mode(s) of imaging or diffraction performed under this procedure. Multiple values
        apply when the procedure covers more than one sub-mode within a given analytical mode.
      anyOf:
      - type: string
        enum:
        - BF-TEM
        - DF-TEM
        - HRTEM
        - EFTEM (TEM Imaging); HAADF
        - ABF
        - BF-STEM
        - ADF
        - MAADF (STEM Imaging); SAED
        - CBED
        - Nanobeam diffraction
        - Precession ED
        - 4D-STEM (Electron Diffraction)
        - N/A
        - None
        - missing
      - type: string
    ada:convergenceSemiAngle:
      description: Semi-angle of the converged electron probe in milliradians.
      anyOf:
      - type: number
      - type: string
      readOnly: true
    ada:stemDwellTimePerPixelDefault:
      description: Time spent acquiring signal at each pixel during STEM scanning in milliseconds. For
        dose-sensitive materials, minimize dwell and compensate with frame averaging. Also governs STEM-EDS
        and STEM-EELS acquisition where those detectors are used. For 4D-STEM dwell time see '4D-STEM
        Dwell Time per Probe Position'.
      anyOf:
      - type: number
      - type: string
    ada:cameraLengthDefault:
      description: Nominal camera length in millimeters used for diffraction pattern acquisition. Must
        be calibrated to convert pixel distances to d-spacings. Calibration to absolute d-spacings is
        required — see 'Diffraction Calibration Reference'.
      anyOf:
      - type: number
      - type: string
    ada:edsAcquisitionModeDefault:
      description: 'Spatial acquisition sub-strategy for EDS measurements: stationary-beam point acquisition,
        line scan (beam stepped along a transect at defined intervals), or area map / spectrum image (beam
        rastered over a pixel grid). Specifies how the beam is positioned during data collection within
        the declared analytical mode. Record ''N/A'' where the procedure has no EDS detector. ''Point''
        covers what the literature also calls spot or point-spectrum analysis. ''Map'' and ''Spectrum
        image'' are distinct acquisitions, not synonyms: a map may retain element intensities alone, whereas
        a spectrum image retains a full spectrum at every pixel and can be requantified afterwards — record
        which was acquired. Where more than one mode was used, join them with ''; '' rather than looking
        for a combined member.'
      type: string
      enum:
      - Point
      - Line scan
      - Map
      - Spectrum image
      - Simultaneous EDS+EELS
      - N/A
      - None
      - missing
    ada:edsQuantificationMethod:
      description: X-ray matrix correction algorithm applied during quantitative EDS or WDS data reduction.
        For X-ray mapping, applies when raw count maps are converted to quantitative concentration maps.
        Where the k-factors or calibration constants themselves came from — measured standards, a vendor
        library, or theoretical cross-sections — is a separate question answered by this technique's calibration-standard
        field, not here; a procedure may be both absorption-corrected and standardless.
      anyOf:
      - type: string
        enum:
        - Cliff-Lorimer (k-factor)
        - ζ-factor (zeta-factor)
        - Absorption-corrected Cliff-Lorimer
        - N/A
        - None
        - missing
      - type: string
      readOnly: true
    ada:eelsAcquisitionModeDefault:
      description: Mode of EELS data acquisition. Record 'N/A' where EELS is not listed in Spectroscopic
        Detector(s).
      type: string
      enum:
      - Point spectrum
      - Line scan
      - Spectrum image (SI)
      - Dual-EELS (simultaneous low- and high-loss)
      - Simultaneous EDS+EELS
      - N/A
      - None
      - missing
    ada:eelsEdgesDefault:
      type: array
      items:
        description: 'Ionization edge(s) acquired by EELS, specified by element symbol and edge label
          (e.g., Fe L2,3; O K). Provides the EELS-specific counterpart to the Analyte field: while Analyte
          lists elements, EELS Edges documents which ionization edges were used and their approximate
          energy loss positions. The edge list may be narrowed at analysis time. Record ''N/A'' where
          EELS is not listed in Spectroscopic Detector(s).'
        type: string
    ada:eelsCollectionSemiAngle:
      description: Semi-angle of the EELS spectrometer entrance aperture in milliradians. Record 'N/A'
        where EELS is not listed in Spectroscopic Detector(s).
      anyOf:
      - type: number
      - type: string
      readOnly: true
    ada:eelsAcquisitionTimePerSpectrumDefault:
      description: Exposure time per individual EELS spectrum (or per pixel for spectrum images) in seconds.
        Record 'N/A' where EELS is not listed in Spectroscopic Detector(s).
      anyOf:
      - type: number
      - type: string
    ada:eelsEnergyLossRangeDefault:
      description: Energy loss range acquired, defined by onset energy and width in eV. The target range
        covers the registered analyte edges; the actual range acquired may differ. Record 'N/A' where
        EELS is not listed in Spectroscopic Detector(s).
      type: string
    ada:phaseIdentificationMethod:
      description: Method used to identify crystalline phases from electron diffraction patterns or d-spacings,
        whether from SAED patterns, spot diffraction, or diffraction data extracted from 4D-STEM datasets.
      type: string
      readOnly: true
