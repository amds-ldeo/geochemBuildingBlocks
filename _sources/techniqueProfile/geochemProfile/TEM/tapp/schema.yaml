          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id024
          title: Diffraction Calibration Reference
          description: Reference material or internal standard used to calibrate the electron diffraction
            camera constant (camera length × electron wavelength), enabling conversion of pixel distances
            to d-spacings.
