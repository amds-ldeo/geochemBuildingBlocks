$schema: https://json-schema.org/draft/2020-12/schema
title: TEM Technique-Aligned Protocol Profile (temTAPP)
description: 'Transmission electron microscopy (TEM/STEM, incl. EDS/EELS) extension of the base TAPP definition.
  Basic protocol-tier fields are required top-level ada: properties; Advanced protocol-tier fields are
  schema:additionalProperty[] entries; an ada:analyteTemplate carries per-element columns. Generated from
  TAPPS20260813/Current TAPPs/TEM_TAPP_v17.csv by tools/build_tapp.py.'
allOf:
- $ref: ../../../../BaseSchema/tappDefinition/schema.yaml
- $ref: ../../../../BaseSchema/modules/group1/schema.yaml#/$defs/ProcedureIdentification
- $ref: ../../../../BaseSchema/modules/reportingCore/schema.yaml#/$defs/TargetSelection_Procedure
- type: object
  properties:
    schema:object:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              '@type':
                contains:
                  const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
            required:
            - '@type'
          then:
            properties:
              schema:additionalProperty:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:name:
                          const: Target Material
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:value:
                          type: array
                          items:
                            description: General description of the material type(s) this procedure is
                              designed to analyze at the nanoscale.
                            type: string
                            enum:
                            - Silicate mineral
                            - Oxide
                            - Sulfide
                            - Carbonate
                            - Phosphate
                            - Metal alloy
                            - Organic matter / IOM
                            - Amorphous phase
                            - Nanoparticle
                            - N/A
                            - None
                            readOnly: true
                allOf:
                - contains:
                    properties:
                      schema:name:
                        const: Target Material
                    required:
                    - schema:name
      allOf:
      - contains:
          properties:
            '@type':
              contains:
                const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
          required:
          - '@type'
    schema:actionProcess:
      type: object
      properties:
        schema:step:
          type: array
          items:
            type: object
            allOf:
            - if:
                properties:
                  schema:name:
                    const: samplePreparation
                required:
                - schema:name
              then:
                properties:
                  schema:description:
                    description: Primary method by which electron-transparent sections are prepared from
                      the sample. The procedure documents the standard approach; analysts record session-specific
                      details and deviations in Sample Preparation Details.
                    anyOf:
                    - type: string
                      enum:
                      - FIB lift-out (Ga ion)
                      - FIB lift-out (Xe plasma)
                      - FIB lift-out (Ga) + ion mill
                      - Ultramicrotomy
                      - Crushing / dispersion on grid
                      - Ion milling (non-FIB)
                      - Electropolishing
                      - Unknown
                      - N/A
                      - None
                      readOnly: true
                    - type: array
                      items:
                        type: string
                        enum:
                        - FIB lift-out (Ga ion)
                        - FIB lift-out (Xe plasma)
                        - FIB lift-out (Ga) + ion mill
                        - Ultramicrotomy
                        - Crushing / dispersion on grid
                        - Ion milling (non-FIB)
                        - Electropolishing
                        - Unknown
                        - N/A
                        - None
                        readOnly: true
          allOf:
          - contains:
              properties:
                schema:name:
                  const: samplePreparation
              required:
              - schema:name
    schema:additionalProperty:
      type: array
      items:
        anyOf:
        - &id001
          title: Sample Preparation Details
          description: 'Detailed description of section preparation conditions: FIB milling voltages and
            currents; final thinning conditions and target foil thickness; protective coating type and
            deposition method (e.g., e-beam vs. ion-beam Pt or C strip — e-beam deposition causes less
            surface damage); any post-FIB surface cleanup (e.g., low-energy Ar+ ion polishing in a Fischione
            NanoMill, final 0.5–2 kV Ga+ thinning); sample transfer and storage environment (ambient air,
            dry N₂ atmosphere, vacuum transfer holder, glovebox); plasma cleaning before loading. Analysts
            record session-specific observations and deviations from the procedure standard. Includes
            preparation artifacts noted (Ga implantation, amorphization, curtaining).'
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/samplePreparationDetailsDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: samplePreparationDetailsDefault
            schema:name:
              const: Sample Preparation Details
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id002
          title: Pre-Analysis Imaging and Screening
          description: Imaging or other characterisation performed before the measurement in order to
            select or locate the analysed target, including the technique, instrument and settings used,
            and how individual analyses are linked back to the images. Distinct from any imaging the procedure
            performs as its own measurement. Where the imaging is performed on a separate instrument,
            it should also be recorded in the Group 1 coupling fields.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/preAnalysisImagingAndScreeningDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: preAnalysisImagingAndScreeningDefault
            schema:name:
              const: Pre-Analysis Imaging and Screening
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id003
          title: Sample Holder
          description: Type of specimen holder used. Cryo holders (liquid N2 to ~110 K) are critical for
            minimizing beam-induced damage to organic matter and beam-sensitive phases. Heating holders
            enable in-situ experiments.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/sampleHolderDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: sampleHolderDefault
            schema:name:
              const: Sample Holder
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id004
          title: SAED Pattern Simulation Software
          description: Software used to simulate electron diffraction patterns for comparison with experimental
            SAED patterns during phase identification (e.g., SingleCrystal, CrystalMaker, JEMS, DIFPACK).
            Complements the Acquisition Software field, which covers data collection; simulation software
            is used at the interpretation and data processing step.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/saedPatternSimulationSoftwareDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: saedPatternSimulationSoftwareDefault
            schema:name:
              const: SAED Pattern Simulation Software
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id005
          title: TEM Objective Aperture
          description: Objective aperture diameter used to select the imaging beam condition in TEM mode.
            In BF-TEM, a small aperture blocks diffracted beams to enhance mass-thickness contrast; in
            DF-TEM, the aperture is displaced to select a specific diffracted beam; in HRTEM, no aperture
            is typically used.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/temObjectiveApertureDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: temObjectiveApertureDefault
            schema:name:
              const: TEM Objective Aperture
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id006
          title: EFTEM Energy Window
          description: 'Energy window(s) used for EFTEM elemental mapping: center energy, width, and acquisition
            method (three-window or jump-ratio). Record ''N/A'' where EFTEM is not listed in Analytical
            Sub-mode.'
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/eftemEnergyWindowDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: eftemEnergyWindowDefault
            schema:name:
              const: EFTEM Energy Window
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id007
          title: HAADF Collection Angles
          description: Inner and outer collection angles of the HAADF detector in milliradians (mrad).
            The inner angle determines the boundary between diffracted and thermally diffuse scattered
            electrons; larger inner angles yield stronger Z-contrast and reduced Bragg contrast. Inner
            angle is most critical and can be derived from camera length and detector geometry. In HAADF-STEM
            a shorter camera length increases the inner angle, yielding more thermally diffuse (Z-contrast)
            and less Bragg-diffraction signal.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/haadfCollectionAnglesDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: haadfCollectionAnglesDefault
            schema:name:
              const: HAADF Collection Angles
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id008
          title: STEM Probe Diameter
          description: 'Nominal or measured diameter of the focused electron probe at the sample, reported
            in nm. Serves as a direct spatial resolution proxy for STEM imaging and STEM-EDS/EELS analysis.
            Related to, but distinct from, Convergence Semi-Angle: the two quantities are connected via
            aberration coefficients, defocus, and probe current, which are not always published. Report
            whichever is known; if both are known, report both fields. Also governs STEM-EDS and STEM-EELS
            acquisition where those detectors are used.'
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/stemProbeDiameterDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: stemProbeDiameterDefault
            schema:name:
              const: STEM Probe Diameter
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: nm
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id009
          title: STEM Probe Current
          description: Probe current in picoamperes (pA) or nanoamperes (nA). Higher current improves
            EDS/EELS signal but increases beam damage risk, especially for organic matter and hydrous
            minerals. Also governs STEM-EDS and STEM-EELS acquisition where those detectors are used.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/stemProbeCurrentDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: stemProbeCurrentDefault
            schema:name:
              const: STEM Probe Current
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: pA or nA
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id010
          title: STEM Scan Dimensions
          description: Number of pixels in the STEM scan frame (X × Y pixels). Combined with calibrated
            pixel size, defines the field of view. Also governs STEM-EDS and STEM-EELS acquisition where
            those detectors are used.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/stemScanDimensionsDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: stemScanDimensionsDefault
            schema:name:
              const: STEM Scan Dimensions
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: pixels x pixels
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id011
          title: STEM Frame Averaging
          description: Number of frames averaged (with drift correction if applicable) to produce the
            final STEM image. Averaging reduces noise while limiting per-frame dose. Also governs STEM-EDS
            and STEM-EELS acquisition where those detectors are used.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/stemFrameAveragingDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: stemFrameAveragingDefault
            schema:name:
              const: STEM Frame Averaging
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id012
          title: Selected-Area Aperture Size
          description: Diameter of the selected-area aperture used in SAED mode, defining the specimen
            region that contributes to the diffraction pattern.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/selectedAreaApertureSizeDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: selectedAreaApertureSizeDefault
            schema:name:
              const: Selected-Area Aperture Size
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id013
          title: Precession Angle
          description: Precession semi-angle in degrees for precession electron diffraction (PED). Hollow-cone
            illumination reduces dynamical diffraction effects and produces more kinematical-like intensities.
            Not applicable to SAED, CBED, or standard 4D-STEM. Record 'N/A' where Precession ED is not
            listed in Analytical Sub-mode.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/precessionAngleDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: precessionAngleDefault
            schema:name:
              const: Precession Angle
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: degrees
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id014
          title: 4D-STEM Scan Grid and Area
          description: Number of probe positions in the 4D-STEM dataset (scan pixels × scan pixels) and
            the physical area covered. Probe step size is the physical area divided by scan pixel count.
            Record 'N/A' where 4D-STEM is not listed in Analytical Sub-mode.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/stemScanGridAndArea4DDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: stemScanGridAndArea4DDefault
            schema:name:
              const: 4D-STEM Scan Grid and Area
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id015
          title: 4D-STEM Dwell Time per Probe Position
          description: Time spent acquiring each diffraction pattern in the 4D-STEM dataset in milliseconds.
            Longer dwell improves signal-to-noise for weakly diffracting phases (e.g., smectite 001 reflection
            at ~1.24 nm) but increases total specimen dose; risk of beam damage to phyllosilicates and
            organic matter must be balanced against data quality. Record 'N/A' where 4D-STEM is not listed
            in Analytical Sub-mode.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/stemDwellTimePerProbePosition4DDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: stemDwellTimePerProbePosition4DDefault
            schema:name:
              const: 4D-STEM Dwell Time per Probe Position
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: ms
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id016
          title: Diffraction Camera Length Calibration Method
          description: Method used to calibrate the camera length constant and convert pixel distances
            in diffraction patterns to d-spacings or reciprocal lattice vectors.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/diffractionCameraLengthCalibrationMethodDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: diffractionCameraLengthCalibrationMethodDefault
            schema:name:
              const: Diffraction Camera Length Calibration Method
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id017
          title: EDS Live Time per Point or Pixel
          description: EDS spectral acquisition live time per analysis point (point/line mode) or per
            pixel (spectrum image) in seconds. Also referred to as "EDS Acquisition Time" in EPMA and
            some SEM-EDS contexts, where the per-pixel distinction is less relevant. Record 'N/A' where
            EDS is not listed in Spectroscopic Detector(s).
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/edsLiveTimePerPointOrPixelDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: edsLiveTimePerPointOrPixelDefault
            schema:name:
              const: EDS Live Time per Point or Pixel
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: s
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id018
          title: EDS Energy Range
          description: Energy range of EDS spectrum acquisition in keV. Record 'N/A' where EDS is not
            listed in Spectroscopic Detector(s).
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/edsEnergyRangeDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: edsEnergyRangeDefault
            schema:name:
              const: EDS Energy Range
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: EELS Energy Dispersion
          description: Energy dispersion of the EELS spectrometer in eV per channel. Controls the energy
            range acquired per readout and the effective energy resolution trade-off. Record 'N/A' where
            EELS is not listed in Spectroscopic Detector(s).
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/eelsEnergyDispersion
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/temTAPP/eelsEnergyDispersion
            schema:name:
              const: EELS Energy Dispersion
            schema:value:
              anyOf:
              - type: number
              - type: string
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          - schema:unitText
          readOnly: true
        - title: EELS Energy Resolution
          description: Full-width at half-maximum (FWHM) of the zero-loss peak in eV, measured at operating
            conditions. Reflects combined electron source energy spread and monochromator effect (if active).
            Critical for ELNES fine-structure interpretation. Record 'N/A' where EELS is not listed in
            Spectroscopic Detector(s).
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/eelsEnergyResolution
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/temTAPP/eelsEnergyResolution
            schema:name:
              const: EELS Energy Resolution
            schema:value:
              anyOf:
              - type: number
              - type: string
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          - schema:unitText
          readOnly: true
        - title: 4D-STEM Orientation Mapping Method
          description: Algorithm, software module, and reference crystal structure database used for automated
            crystal orientation mapping (ACOM) from 4D-STEM datasets. Record 'N/A' where 4D-STEM is not
            listed in Analytical Sub-mode.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/stemOrientationMappingMethod4D
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/temTAPP/stemOrientationMappingMethod4D
            schema:name:
              const: 4D-STEM Orientation Mapping Method
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - &id019
          title: EELS Background Subtraction Method
          description: Method used to subtract the background beneath the ionization edge of interest
            to extract the net edge signal. Record 'N/A' where EELS is not listed in Spectroscopic Detector(s).
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/eelsBackgroundSubtractionMethodDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: eelsBackgroundSubtractionMethodDefault
            schema:name:
              const: EELS Background Subtraction Method
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id020
          title: EELS Plural Scattering Correction
          description: Method applied to correct for multiple inelastic scattering events (plural scattering)
            that broaden edge fine structure. Critical for specimens thicker than ~0.5 inelastic mean
            free paths. Record 'N/A' where EELS is not listed in Spectroscopic Detector(s).
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/eelsPluralScatteringCorrectionDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: eelsPluralScatteringCorrectionDefault
            schema:name:
              const: EELS Plural Scattering Correction
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: EDS Spectral Processing Type
          description: Method used to process EDS spectra and extract net peak intensities from raw spectral
            data. Applied before quantification (EDS Quantification Method). Common approaches include
            background fitting and subtraction followed by peak integration, and filter fit or Gaussian
            deconvolution for overlapping peaks. Record 'N/A' where EDS is not listed in Spectroscopic
            Detector(s).
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/edsSpectralProcessingType
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/temTAPP/edsSpectralProcessingType
            schema:name:
              const: EDS Spectral Processing Type
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - &id021
          title: Image Processing Methods Applied
          description: Image processing steps applied to TEM or STEM images during or after acquisition.
            Non-linear processing steps that could affect quantitative interpretation should be documented
            explicitly.
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/imageProcessingMethodsAppliedDefault
            '@type':
