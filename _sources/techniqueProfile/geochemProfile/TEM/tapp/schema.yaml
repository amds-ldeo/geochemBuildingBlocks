            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id025
          title: EDS Detection Limit
          description: Estimated detection limits by EDS under this procedure's conditions, one per reported
            concentration variable (one per analyte, these being the same set). Record 'N/A' where EDS
            is not listed in Spectroscopic Detector(s).
          type: object
          properties:
            '@id':
              const: ada:parameter/temTAPP/edsDetectionLimitDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
