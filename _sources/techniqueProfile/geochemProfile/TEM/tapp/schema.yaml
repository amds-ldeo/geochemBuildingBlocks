                  const: number
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  anyOf:
                  - &id026
                    anyOf:
                    - type: number
                    - type: string
                  - type: array
                    items: *id026
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
          allOf:
          - contains: *id027
            minContains: 0
            maxContains: 1
          - contains: *id028
            minContains: 0
            maxContains: 1
