            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id023
          title: EELS Energy Calibration
          description: Method and reference used to calibrate the EELS energy axis. Accurate calibration
            is required for ELNES edge identification, chemical-state analysis, and inter-lab comparability.
            Record 'N/A' where EELS is not listed in Spectroscopic Detector(s).
