    ada:samplingUnit:
      description: The physical subdivision of the sample to which one row of reported values corresponds
        — the unit that is analysed and reported, as distinct from the sample as a whole. State the unit
        type at procedure level and the units actually analysed at analysis level. Where units nest (e.g.
        confined tracks within grains), state both levels.
      type: string
      enum:
      - Whole sample
      - Aliquot
      - Grain
      - Spot
      - Analysis point
      - Phase
      - Sub-volume
      - Region of interest
      - N/A
      - None
    schema:instrument:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              schema:additionalType:
                contains:
                  const: TEM
            required:
            - schema:additionalType
          then:
            properties:
              schema:manufacturer:
                type: object
                properties:
                  schema:name:
                    description: Make of the instrument used for this procedure.
                    type: string
                    enum:
                    - JEOL
                    - ThermoFisher Scientific (FEI)
                    - Hitachi
                    - Nion
                    - Zeiss
                    - Unknown
                    - N/A
                    - None
                    readOnly: true
              schema:model:
                type: object
                properties:
                  schema:name:
                    description: Model designation of the TEM/STEM instrument, including generation suffix
                      if applicable.
                    type: string
                    readOnly: true
              schema:hasPart:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: Electron source
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:description:
                          description: Type of electron gun used in the instrument.
                          anyOf:
                          - type: string
                            enum:
                            - Cold-FEG
                            - Schottky FEG (X-FEG)
                            - Schottky FEG (standard)
                            - LaB6 / CeB6
                            - Tungsten (W)
                            - Unknown
                            - N/A
                            - None
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              enum:
                              - Cold-FEG
                              - Schottky FEG (X-FEG)
                              - Schottky FEG (standard)
                              - LaB6 / CeB6
                              - Tungsten (W)
                              - Unknown
                              - N/A
                              - None
                              readOnly: true
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: AberrationCorrector
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:description:
                          description: Type of aberration corrector installed and active. Probe Cs-correction
                            enables sub-Å STEM resolution and improved analytical signal; image Cs-correction
                            reduces delocalization artifacts in HRTEM.
                          anyOf:
                          - type: string
                            enum:
                            - None
                            - Probe Cs-corrected (STEM)
                            - Image Cs-corrected (TEM)
                            - Both probe and image corrected
                            - Cs-corrected (type unknown)
                            - Unknown
                            - N/A
                            - None
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              enum:
                              - None
                              - Probe Cs-corrected (STEM)
                              - Image Cs-corrected (TEM)
                              - Both probe and image corrected
                              - Cs-corrected (type unknown)
                              - Unknown
                              - N/A
                              - None
                              readOnly: true
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: Monochromator
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:description:
                          description: Whether a monochromator is installed and was active during this
                            procedure. Relevant for EELS energy resolution and EFTEM performance. Record
                            'N/A' where EELS is not listed in Spectroscopic Detector(s) and EFTEM is not
                            listed in Analytical Sub-mode.
                          anyOf:
                          - type: string
                            enum:
                            - Yes — active
                            - Yes — not used
                            - 'No'
                            - Unknown
                            - N/A
                            - None
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              enum:
                              - Yes — active
                              - Yes — not used
                              - 'No'
                              - Unknown
                              - N/A
                              - None
                              readOnly: true
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: EDSDetector
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:description:
                          description: EDS detector type, manufacturer, number of detector elements, active
                            solid angle, and window type. Record 'N/A' where EDS is not listed in Spectroscopic
                            Detector(s).
                          anyOf:
                          - type: string
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              readOnly: true
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: EELSSpectrometer
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:description:
                          description: EELS spectrometer manufacturer, model, and key capabilities including
                            post-column GIF model and energy resolution. Record 'N/A' where EELS is not
                            listed in Spectroscopic Detector(s).
                          anyOf:
                          - type: string
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              readOnly: true
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: ImagingDetector
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:description:
                          description: List of detectors available and used under this procedure for STEM
                            imaging and TEM/SAED/CBED diffraction recording. Include HAADF/ABF/BF detector
                            geometries and TEM/diffraction camera model.
                          anyOf:
                          - type: string
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              readOnly: true
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: 4DSTEMDetector
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:description:
                          description: Direct electron detector used for 4D-STEM data acquisition, recording
                            a full diffraction pattern at each probe position. If a GIF is used as the
                            mounting platform (enabling energy-filtered 4D-STEM), specify this. Record
                            'N/A' where 4D-STEM is not listed in Analytical Sub-mode.
                          anyOf:
                          - type: string
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              readOnly: true
                allOf:
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          const: Electron source
                    required:
                    - schema:additionalType
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          const: AberrationCorrector
                    required:
                    - schema:additionalType
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          const: EDSDetector
                    required:
                    - schema:additionalType
              ada:acceleratingVoltageDefault:
                description: Electron beam accelerating voltage in kilovolts (kV). For beam-sensitive
                  materials (organic matter, phyllosilicates), 60–80 kV may be used to stay below the
                  displacement threshold for C, N, O, and S. The procedure specifies the standard operating
                  voltage; analysts record and justify deviations. Key parameter for the beam damage regime.
                anyOf:
                - type: number
                - type: string
      allOf:
      - contains:
          properties:
            schema:additionalType:
              contains:
                const: TEM
          required:
          - schema:additionalType
    ada:spectroscopicDetectorDefault:
      description: Spectroscopic detectors present and used under this procedure. EDS and EELS parameter
        fields in Group 4 apply only when the corresponding detector is listed here.
      type: string
      enum:
      - EDS only
      - EELS only
      - EDS and EELS
      - EELS and EFTEM
      - EDS and EELS and EFTEM
      - None
      - N/A
    bios:computationalTool:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              ada:toolRole:
                const: acquisition
            required:
            - ada:toolRole
          then:
            properties:
              schema:name:
                description: Data acquisition and microscope control software, including version.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
        - if:
            properties:
              ada:toolRole:
                const: dataReduction
            required:
            - ada:toolRole
          then:
            properties:
              schema:name:
                description: All software used for post-acquisition data reduction, analysis, and image
                  processing, including diffraction analysis, EDS quantification, and EELS processing.
                  List all packages with version numbers.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
      allOf:
      - contains:
          properties:
            ada:toolRole:
              const: acquisition
          required:
          - ada:toolRole
      - contains:
          properties:
            ada:toolRole:
              const: dataReduction
          required:
          - ada:toolRole
    ada:analyticalMode:
      type: array
      items:
        description: 'Top-level analytical mode(s) executed under this procedure: TEM Imaging, STEM Imaging,
          or Electron Diffraction. For multi-mode procedures (e.g., STEM Imaging combined with Electron
          Diffraction), list all applicable modes. Serves as the procedure-level declaration of measurement
          type, distinct from "Analytical Sub-mode" (which records the specific technique within a mode,
          e.g., BF-TEM, HAADF-STEM, SAED, PED) and from the mode flag columns which indicate per-field
          applicability.'
        type: string
        enum:
        - TEM Imaging
        - STEM Imaging
        - Electron Diffraction
        - STEM Imaging; Electron Diffraction
        readOnly: true
    ada:analyticalSubModeDefault:
      description: 'Sub-mode(s) of imaging or diffraction performed under this procedure. TEM Imaging
        options: BF-TEM, DF-TEM, HRTEM, EFTEM. STEM Imaging options: HAADF, ABF, BF-STEM, ADF, MAADF.
        Electron Diffraction options: SAED, CBED, Nanobeam diffraction, Precession ED, 4D-STEM. Multiple
        values apply when the procedure covers more than one sub-mode within a given analytical mode.'
      type: string
      enum:
      - BF-TEM
      - DF-TEM
      - HRTEM
      - EFTEM (TEM Imaging); HAADF
      - ABF
      - BF-STEM
      - ADF
      - MAADF (STEM Imaging); SAED
      - CBED
      - Nanobeam diffraction
      - Precession ED
      - 4D-STEM (Electron Diffraction)
      - N/A
      - None
    ada:convergenceSemiAngle:
      description: Semi-angle of the converged electron probe in milliradians. Controls probe size (smaller
        angle = larger probe but less coherent), depth of field, and in 4D-STEM, the size of diffraction
        discs vs. spatial resolution. For near-parallel-beam 4D-STEM (e.g., phyllosilicate phase mapping),
        values as small as 0.1 mrad are used.
      anyOf:
      - type: number
      - type: string
      readOnly: true
    ada:stemDwellTimePerPixelDefault:
      description: Time spent acquiring signal at each pixel during STEM scanning in milliseconds. Longer
        dwell improves signal-to-noise but increases total specimen dose; for dose-sensitive materials,
        minimize dwell and compensate with frame averaging. Also governs STEM-EDS and STEM-EELS acquisition
        where those detectors are used. For 4D-STEM dwell time see '4D-STEM Dwell Time per Probe Position'.
      anyOf:
      - type: number
      - type: string
    ada:cameraLengthDefault:
      description: 'Nominal camera length in millimeters used for diffraction pattern acquisition. Controls
        the mapping between reciprocal-space scattering angle and detector position; must be calibrated
        to convert pixel distances to d-spacings. In STEM mode, also sets HAADF/ABF detector collection
        angles. Calibration to absolute d-spacings is required — see ''Diffraction Calibration Reference''.
        Camera length choice affects HAADF Z-contrast purity: a shorter camera length (e.g. 30 mm) shifts
        the inner angle toward thermal diffuse scatter; a longer one (e.g. 150 mm) admits more Bragg scatter.'
      anyOf:
      - type: number
      - type: string
    ada:edsAcquisitionModeDefault:
      description: Mode of EDS data acquisition. Record 'N/A' where EDS is not listed in Spectroscopic
        Detector(s).
      type: string
      enum:
      - Point analysis
      - Line scan
      - Spectrum image (map)
      - Simultaneous EDS+EELS
      - N/A
      - None
    ada:edsQuantificationMethod:
      description: Method used to convert EDS X-ray intensities to elemental concentrations. Record 'N/A'
        where EDS is not listed in Spectroscopic Detector(s).
      type: string
      enum:
      - Cliff-Lorimer (k-factor)
      - ζ-factor (zeta-factor)
      - Absorption-corrected Cliff-Lorimer
      - Standardless
      - Direct comparison to reference spectra
      - N/A
      - None
      readOnly: true
    ada:analyteTemplate:
      type: object
      properties:
        ada:defaultAnalytes:
          type: array
          items:
            description: The chemical species this procedure is designed to determine, recorded at whatever
              resolution the chemistry is resolved — element(s) for this technique; valence species where
              a procedure resolves oxidation state; compounds where it resolves molecules. The procedure
              registers the full intended analyte suite; analysts confirm or narrow this list at analysis
              time to reflect the elements actually measured in the session. For sessions using both EDS
              and EELS, list all elements targeted by either technique. For EDS and EELS the analyte list
              is determined by the detectors in use; see 'EELS Edges' for the corresponding ionization
              edges.
            type: string
    ada:reportedPropertyTemplate:
      type: object
      properties:
        ada:defaultReportedProperties:
          type: array
          items:
            description: The final variable(s) this procedure reports and their units — distinct from
              the fields recording what was *acquired* rather than what is reported. A procedure may acquire
              many channels and report a small number of derived quantities; without this field a data
              consumer cannot tell which. Record every reported variable, including intermediate quantities
              reported alongside final ones (e.g. both the 206Pb/238U ratio and the 206Pb/238U date).
              Where a reported variable is a nominal property with no magnitude (e.g. a mineral identification),
              record the variable and give the unit as 'N/A — nominal property'.
            type: string
            readOnly: true
    ada:eelsAcquisitionModeDefault:
      description: Mode of EELS data acquisition. Record 'N/A' where EELS is not listed in Spectroscopic
        Detector(s).
      type: string
      enum:
      - Point spectrum
      - Line scan
      - Spectrum image (SI)
      - Dual-EELS (simultaneous low- and high-loss)
      - Simultaneous EDS+EELS
      - N/A
      - None
    ada:eelsEdgesDefault:
      description: 'Ionization edge(s) acquired by EELS, specified by element symbol and edge label (e.g.,
        Fe L2,3; O K). Provides the EELS-specific counterpart to the Analyte field: while Analyte lists
        elements, EELS Edges documents which ionization edges were used and their approximate energy loss
        positions. The procedure registers the full intended edge suite; analysts confirm or narrow this
        list at analysis time. Record ''N/A'' where EELS is not listed in Spectroscopic Detector(s).'
      type: string
    ada:eelsCollectionSemiAngle:
      description: Semi-angle of the EELS spectrometer entrance aperture in milliradians. Controls the
        fraction of inelastically scattered electrons collected and the spectral background level. Record
        'N/A' where EELS is not listed in Spectroscopic Detector(s).
      anyOf:
      - type: number
      - type: string
      readOnly: true
    ada:eelsAcquisitionTimePerSpectrumDefault:
      description: Exposure time per individual EELS spectrum (or per pixel for spectrum images) in seconds.
        Record 'N/A' where EELS is not listed in Spectroscopic Detector(s).
      anyOf:
      - type: number
      - type: string
    ada:eelsEnergyLossRangeDefault:
      description: Energy loss range acquired, defined by onset energy and width in eV. The procedure
        documents the target range for the registered analyte edges; analysts record the actual range
        acquired. Record 'N/A' where EELS is not listed in Spectroscopic Detector(s).
      type: string
    ada:phaseIdentificationMethod:
      description: Method used to identify crystalline phases from electron diffraction patterns or d-spacings,
        whether from SAED patterns, spot diffraction, or diffraction data extracted from 4D-STEM datasets.
      type: string
      enum:
      - Manual d-spacing comparison to ICDD PDF database
      - JEMS simulation
      - CrystalMaker
      - WinHREM
      - py4DSTEM ACOM
      - ESPRIT CRYSTAL
      - ORIX
      - N/A
      - None
      readOnly: true
    ada:calibrationFactorAndDeterminationMethodDefault:
      description: 'An externally-calibrated factor that converts the measured quantity into the reported
        quantity, how it was determined, and its uncertainty. Applies where the conversion depends on
        a factor calibrated against a reference of independently known value, rather than on the instrument
        response alone. Distinct from the fields that name the calibration material and that state which
        approach applies to which analyte, where the technique has them: this field records the resulting
        factor itself.'
      type: string
    ada:analysisInclusionAndRejectionCriteria:
      description: 'The rules determining which individual analyses contribute to a reported aggregate
        result, together with the outcome of applying them: how many analyses were acquired, how many
        were included, and on what grounds any were excluded. Distinct from within-analysis outlier filtering,
        which removes anomalous points inside a single analysis: this field decides which whole analyses
        enter the reported value. Criteria and outcome are combined in one field because neither is interpretable
        without the other, following the precision/accuracy precedent.'
      type: string
    ada:constantsAndReferenceValuesUsedDefault:
      description: Physical constants and reference values used in data reduction to calculate the final
        reported quantity (e.g., decay constants for age calculation, standard isotope ratios, or other
        citable reference values used in a correction or calculation), together with their source. Distinct
        from the Group 6 reference-material fields, which document accepted values for specific calibration/validation
        materials rather than universal physical constants. Record "None" if no citable, revisable physical
        constants feed into this procedure's data reduction.
      type: string
    ada:edsCalibrationStandardDefault:
      description: Reference material(s) used to validate EDS quantification or determine experimental
        k-factors or zeta-factors. TEM-EDS is less standardized than EPMA; many procedures rely on manufacturer
        k-factors without external calibration. Record 'N/A' where EDS is not listed in Spectroscopic
        Detector(s).
      type: string
    schema:description:
      description: 'Any procedure- or analysis-specific information not captured by a structured field
        anywhere in this TAPP — including anomalies, deviations from the registered procedure, instrument
        modifications, and supplementary context. Scope is the whole document, not Group 6: this is the
        last field of the TAPP and covers all six groups. Use sparingly; a structured field is preferred
        for anything that can be formally categorised.'
      type: string
  required:
  - ada:samplingUnit
  - ada:spectroscopicDetectorDefault
  - ada:analyticalSubModeDefault
  - ada:convergenceSemiAngle
  - ada:stemDwellTimePerPixelDefault
  - ada:cameraLengthDefault
  - ada:edsAcquisitionModeDefault
  - ada:edsQuantificationMethod
  - ada:eelsAcquisitionModeDefault
  - ada:eelsEdgesDefault
  - ada:eelsCollectionSemiAngle
  - ada:eelsAcquisitionTimePerSpectrumDefault
  - ada:eelsEnergyLossRangeDefault
  - ada:phaseIdentificationMethod
  - ada:calibrationFactorAndDeterminationMethodDefault
  - ada:analysisInclusionAndRejectionCriteria
  - ada:constantsAndReferenceValuesUsedDefault
  - ada:edsCalibrationStandardDefault
