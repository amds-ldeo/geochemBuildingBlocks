$schema: https://json-schema.org/draft/2020-12/schema
title: ADA FINESSE Product Profile
description: Path-driven technique-specific profile for ADA FINESSE Product Profile. Extends the base ADA product profile with the FINESSE analysis-instance detail on the schema:Dataset root, and pins the product type and the profile it declares conformance to.
allOf:
- $ref: ../../../../BaseSchema/geochemProduct/schema.yaml
- $ref: ../detail/schema.yaml
- type: object
  properties:
    schema:additionalType:
      description: Must include a FINESSE product type identifier.
      contains:
        enum:
        - Stepped Heating Carbon and Nitrogen Isotopic Compositions
        - Elemental Analyzer Stepped Heating C N Isotope (FINESSE)
      title: Product Type
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaFINESSE
      title: About This Record
