$schema: https://json-schema.org/draft/2020-12/schema
title: ADA LA-SF-ICP-MS Product Profile
description: Path-driven technique-specific profile for ADA LA-SF-ICP-MS Product Profile. Extends the base ADA product profile with the LASFICPMS analysis-instance detail on the schema:Dataset root, and pins the product type and the profile it declares conformance to.
allOf:
- $ref: ../../../../BaseSchema/geochemProduct/schema.yaml
- $ref: ../detail/schema.yaml
- type: object
  properties:
    schema:additionalType:
      description: Must include a LASFICPMS product type identifier.
      contains:
        enum:
        - Laser Ablation Inductively coupled plasma mass spectrometry
        - Laser Ablation Sector-Field Inductively Coupled Plasma Mass Spectrometry (LASFICPMS) Processed
        - Laser Ablation Sector-Field Inductively Coupled Plasma Mass Spectrometry
      title: Product Type
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaLASFICPMS
      title: About This Record
