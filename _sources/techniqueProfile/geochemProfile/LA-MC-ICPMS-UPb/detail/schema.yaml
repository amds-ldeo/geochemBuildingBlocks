$schema: https://json-schema.org/draft/2020-12/schema
title: LA-MC-ICP-MS U-Pb Analysis Detail
description: Dataset-level analysis-instance detail for LA-MC-ICP-MS U-Pb geochronology, reusing CDIF/schema.org
  slots on the schema:Dataset root.
allOf:
- $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/AnalysisIdentification
- $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/AnalysisIdentification
- $ref: ../../../../BaseSchema/modules/mcIcpms/schema.yaml#/$defs/AnalysisIdentification
- $ref: ../../../../BaseSchema/modules/aggregation/schema.yaml#/$defs/AnalysisIdentification
- $ref: ../../../../BaseSchema/modules/geochronology/schema.yaml#/$defs/AnalysisIdentification
- type: object
  properties:
    prov:wasGeneratedBy:
      type: array
      items:
        type: object
        properties:
          schema:object:
            type: array
            items:
              type: object
              allOf:
              - if:
                  properties:
                    '@type':
                      contains:
                        const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                  required:
                  - '@type'
                then:
                  properties:
                    schema:additionalProperty:
                      type: array
                      items:
                        anyOf:
                        - &id001
                          title: Sample Form / Analytical Substrate
                          description: Physical form of the material as it enters the ablation cell. Editable
                            to accommodate legitimate variations (e.g., thin section vs. mount) that do
                            not alter the analytical procedure.
                          type: object
                          properties:
                            '@id':
                              const: ada:parameter/laMcicpmsUPbTAPP/sampleFormAnalyticalSubstrate
                            '@type':
                              const:
                              - schema:PropertyValue
                            schema:propertyID:
                              const:
                              - '@id': ada:parameter/laMcicpmsUPbTAPP/sampleFormAnalyticalSubstrate
                            schema:name:
                              const: Sample Form / Analytical Substrate
                            schema:value:
                              type: string
                          required:
                          - '@id'
                          - '@type'
                          - schema:propertyID
                          - schema:name
                          - schema:value
                        - $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Analysis_mappedAreaDescription
                      allOf:
                      - contains: *id001
                        minContains: 0
                        maxContains: 1
                      - contains:
                          $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Analysis_mappedAreaDescription
                        minContains: 0
                        maxContains: 1
            allOf:
            - contains:
                properties:
                  '@type':
                    contains:
                      const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                required:
                - '@type'
          schema:actionProcess:
            type: object
            properties:
              schema:step:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:name:
                          const: Sample preparation
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items:
                            anyOf:
                            - &id002
                              title: Fusion Flux and Dilution Ratio
                              description: For procedures using fused glass, the flux type and sample:flux
                                dilution ratio used to prepare the analytical glass.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/laMcicpmsUPbTAPP/fusionFluxAndDilutionRatio
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/laMcicpmsUPbTAPP/fusionFluxAndDilutionRatio
                                schema:name:
                                  const: Fusion Flux and Dilution Ratio
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            - $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Analysis_preAblationSurfaceTreatment
                          allOf:
                          - contains: *id002
                            minContains: 0
                            maxContains: 1
                          - contains:
                              $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Analysis_preAblationSurfaceTreatment
                            minContains: 0
                            maxContains: 1
                        schema:description:
                          description: Description of how samples were prepared for analysis (mounting,
                            polishing, coating, fusion procedure, etc.).
                          anyOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                  - if:
                      properties:
                        schema:name:
                          const: Data reduction
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items:
                            anyOf:
                            - &id003
                              title: Signal Smoothing
                              description: 'Description of any signal smoothing device or approach installed
                                between the ablation cell and the ICP-MS to reduce pulse-to-pulse signal
                                variability. Note: active signal smoothing devices (e.g., squid, SCFAST)
                                are generally incompatible with high-resolution raster mapping because
                                they degrade spatial resolution by mixing aerosol from successive laser
                                shots. For mapping analyses, report "None" explicitly.'
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/laMcicpmsUPbTAPP/signalSmoothing
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/laMcicpmsUPbTAPP/signalSmoothing
                                schema:name:
                                  const: Signal Smoothing
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            - &id004
                              title: Uncertainty Propagation Method
                              description: 'The approach used to propagate analytical uncertainty through
                                the data reduction chain to the final reported value. State which sources
                                are included in the propagation: counting statistics, calibration standard
                                uncertainty, internal standard uncertainty, drift correction, and any
                                systematic contributions. Distinct from Uncertainty Level, which states
                                the convention at which the resulting uncertainty is quoted.'
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/laMcicpmsUPbTAPP/uncertaintyPropagationMethod
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/laMcicpmsUPbTAPP/uncertaintyPropagationMethod
                                schema:name:
                                  const: Uncertainty Propagation Method
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            - &id005
                              title: Spike / Outlier Filtering Approach
                              description: Method used to identify and remove anomalous signal spikes
                                arising from micronuggets, inclusions, cracks, or instrument artifacts
                                during time-resolved signal processing. Editable because the specific
                                implementation may vary between sessions while remaining within the procedure
                                framework.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/laMcicpmsUPbTAPP/spikeOutlierFilteringApproach
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/laMcicpmsUPbTAPP/spikeOutlierFilteringApproach
                                schema:name:
                                  const: Spike / Outlier Filtering Approach
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            - &id006
                              title: Normalization / Standards-Based Correction
                              description: Any post-acquisition normalization applied to correct for systematic
                                biases identified from secondary reference materials, or stoichiometric
                                normalization applied per pixel in mapping. Distinct from the primary
                                internal standard approach captured in Internal Standard Approach.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/laMcicpmsUPbTAPP/normalizationStandardsBasedCorrection
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/laMcicpmsUPbTAPP/normalizationStandardsBasedCorrection
                                schema:name:
                                  const: Normalization / Standards-Based Correction
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            - $ref: ../../../../BaseSchema/modules/calibrationFactor/schema.yaml#/$defs/Param_Analysis_calibrationFactorAndDeterminationMethod
                            - $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/Param_Analysis_constantsReferenceValues
                          allOf:
                          - contains: *id003
                            minContains: 0
                            maxContains: 1
                          - contains: *id004
                            minContains: 0
                            maxContains: 1
                          - contains: *id005
                            minContains: 0
                            maxContains: 1
                          - contains: *id006
                            minContains: 0
                            maxContains: 1
                          - contains:
                              $ref: ../../../../BaseSchema/modules/calibrationFactor/schema.yaml#/$defs/Param_Analysis_calibrationFactorAndDeterminationMethod
                            minContains: 0
                            maxContains: 1
                          - contains:
                              $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/Param_Analysis_constantsReferenceValues
                            minContains: 0
                            maxContains: 1
                allOf:
                - contains:
                    properties:
                      schema:name:
                        const: Sample preparation
                    required:
                    - schema:name
                - contains:
                    properties:
                      schema:name:
                        const: Data reduction
                    required:
                    - schema:name
          schema:additionalProperty:
            type: array
            items:
              anyOf:
              - $ref: ../../../../BaseSchema/modules/targetSelection/schema.yaml#/$defs/Param_Analysis_targetSelectionCriteria
              - $ref: ../../../../BaseSchema/modules/targetSelection/schema.yaml#/$defs/Param_Analysis_preAnalysisImagingAndScreening
              - $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Analysis_transectRateMappingRateOrStepSize
              - &id007
                title: Carrier Gas and Flow Rate
                description: Gas used to transport ablated aerosol from the ablation cell to the ICP-MS
                  torch, with the procedure-registered target flow rate(s). Helium is standard for most
                  UV laser systems due to superior aerosol transport. Flow rates are procedure targets;
                  actual session values may be adjusted within ±10% during tuning.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/laMcicpmsUPbTAPP/carrierGasAndFlowRate
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/laMcicpmsUPbTAPP/carrierGasAndFlowRate
                  schema:name:
                    const: Carrier Gas and Flow Rate
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id008
                title: Make-up Gas and Flow Rate
                description: Supplementary gas added to the sample-carrying stream between the sample
                  introduction system and the plasma, with its identity and the procedure-registered target
                  flow rate. Argon make-up is standard and maintains total gas delivery where the carrier
                  flow alone is insufficient — downstream of an ablation cell, or of a desolvation system
                  that has removed solvent load. Small nitrogen or hydrogen additions are also made here
                  to enhance sensitivity for some elements; record them with their own flow, whose unit
                  commonly differs from the make-up flow. Record 'None' explicitly where no supplementary
                  gas is added, to distinguish it from not reported.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/laMcicpmsUPbTAPP/makeUpGasAndFlowRate
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/laMcicpmsUPbTAPP/makeUpGasAndFlowRate
                  schema:name:
                    const: Make-up Gas and Flow Rate
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id009
                title: Analysis Sequence
                description: Repeating order of primary calibration standard(s), quality control standard(s),
                  and unknown analyses within a measurement session. Editable to allow minor adjustments
                  while maintaining the bracketing strategy defined in the procedure.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/laMcicpmsUPbTAPP/analysisSequence
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/laMcicpmsUPbTAPP/analysisSequence
                  schema:name:
                    const: Analysis Sequence
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id010
                title: Monitored Masses
                description: Specific masses monitored in this procedure, grouped by the analyte element
                  they serve where they serve one. Covers atomic isotopes and, where a reaction cell shifts
                  an analyte onto a different mass, the product mass actually measured. Includes interference-monitor
                  and internal-standard masses, which serve no analyte and so have no parent element.
                  The analyte list is given by the Analyte field and is never inferred from the element
                  symbols appearing here.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/laMcicpmsUPbTAPP/monitoredMasses
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/laMcicpmsUPbTAPP/monitoredMasses
                  schema:name:
                    const: Monitored Masses
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id011
                title: Ion Counter Dead Time
                description: Dead time of each ion-counting detector channel, used in the dead-time correction
                  applied to high count rates. Distinct from pulse/analog cross-calibration, which relates
                  the two detector modes rather than correcting counting losses within the pulse-counting
                  mode.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/laMcicpmsUPbTAPP/ionCounterDeadTime
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/laMcicpmsUPbTAPP/ionCounterDeadTime
                  schema:name:
                    const: Ion Counter Dead Time
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id012
                title: Background Count Time
                description: Total time spent measuring gas blank (background signal with laser off or
                  shutter closed) before each ablation event, in seconds. For spot and transect analysis,
                  a discrete background interval is measured before each ablation. For mapping, background
                  is typically measured once per raster line or at the start of a map session rather than
                  before each individual pixel. Editable to allow session-specific adjustment.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/laMcicpmsUPbTAPP/backgroundCountTime
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/laMcicpmsUPbTAPP/backgroundCountTime
                  schema:name:
                    const: Background Count Time
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id013
                title: Number of Replicates
                description: Number of replicate measurements performed on the same sample, or on the
                  same nominal location where the technique is spatially resolved. For spot analysis this
                  is the number of individual spots per grain or location; for transects, the number of
                  replicate lines; for mapping, the number of map acquisitions of the same area; for solution
                  work, the number of discrete replicate measurements acquired per sample solution. The
                  procedure registers an intended count where it has one; the analysis records the count
                  actually acquired.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/laMcicpmsUPbTAPP/numberOfReplicates
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/laMcicpmsUPbTAPP/numberOfReplicates
                  schema:name:
                    const: Number of Replicates
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Analysis_transectLength
              - &id014
                title: Mapping Area
                description: Total area covered by the 2D raster map, expressed as width × height in µm
                  or as total area in µm² or mm². This is an analysis-level parameter because it depends
                  on the size of the grain or phase to be mapped. The procedure fixes scan speed, line
                  spacing, and spot size; the map area is chosen at analysis time to cover the target
                  feature.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/laMcicpmsUPbTAPP/mappingArea
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/laMcicpmsUPbTAPP/mappingArea
                  schema:name:
                    const: Mapping Area
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - $ref: ../../../../BaseSchema/modules/mcIcpms/schema.yaml#/$defs/Param_Analysis_numberOfBlocksPerMeasurement
              - $ref: ../../../../BaseSchema/modules/mcIcpms/schema.yaml#/$defs/Param_Analysis_numberOfCyclesPerBlock
              - $ref: ../../../../BaseSchema/modules/mcIcpms/schema.yaml#/$defs/Param_Analysis_integrationTimePerCycle
              - &id015
                title: Signal Integration Time
                description: 'Actual integration time used for the ablation signal in this analysis, in
                  seconds. This is an analysis-level outcome determined during data reduction by applying
                  the Signal Integration Interval Method to the time-resolved signal. It is equal to or
                  shorter than the Ablation Duration per Spot because the signal start and end transients
                  are typically discarded. Not applicable to mapping analysis: for mapping, the equivalent
                  concept is the per-pixel cycle time, which is determined by the spectrometer dwell time
                  settings (a procedure-level field) rather than being an analysis-level outcome.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/laMcicpmsUPbTAPP/signalIntegrationTime
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/laMcicpmsUPbTAPP/signalIntegrationTime
                  schema:name:
                    const: Signal Integration Time
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - $ref: ../../../../BaseSchema/modules/blank/schema.yaml#/$defs/Param_Analysis_proceduralBlankLevel
              - $ref: ../../../../BaseSchema/modules/mcIcpms/schema.yaml#/$defs/Param_Analysis_doubleSpikeMixingRatio
              - $ref: ../../../../BaseSchema/modules/geochronology/schema.yaml#/$defs/Param_Analysis_inheritedOrInitialSignalCorrection
              - $ref: ../../../../BaseSchema/modules/geochronology/schema.yaml#/$defs/Param_Analysis_ageModel
              - $ref: ../../../../BaseSchema/modules/geochronology/schema.yaml#/$defs/Param_Analysis_ageDatumReferenceEpoch
              - &id016
                title: Error Correlation Between Reported Quantities
                description: The correlation coefficient between pairs of reported quantities whose uncertainties
                  are not independent, together with the pair it applies to and how it was obtained. Concordia
                  and isochron regressions cannot be reconstructed without it.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/laMcicpmsUPbTAPP/errorCorrelationBetweenReportedQuantities
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/laMcicpmsUPbTAPP/errorCorrelationBetweenReportedQuantities
                  schema:name:
                    const: Error Correlation Between Reported Quantities
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
            allOf:
            - contains:
                $ref: ../../../../BaseSchema/modules/targetSelection/schema.yaml#/$defs/Param_Analysis_targetSelectionCriteria
              minContains: 0
              maxContains: 1
            - contains:
                $ref: ../../../../BaseSchema/modules/targetSelection/schema.yaml#/$defs/Param_Analysis_preAnalysisImagingAndScreening
              minContains: 0
              maxContains: 1
            - contains:
                $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Analysis_transectRateMappingRateOrStepSize
              minContains: 0
              maxContains: 1
            - contains: *id007
              minContains: 0
              maxContains: 1
            - contains: *id008
              minContains: 0
              maxContains: 1
            - contains: *id009
              minContains: 0
              maxContains: 1
            - contains: *id010
              minContains: 0
              maxContains: 1
            - contains: *id011
              minContains: 0
              maxContains: 1
            - contains: *id012
              minContains: 0
              maxContains: 1
            - contains: *id013
              minContains: 0
              maxContains: 1
            - contains:
                $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Analysis_transectLength
              minContains: 0
              maxContains: 1
            - contains: *id014
              minContains: 0
              maxContains: 1
            - contains:
                $ref: ../../../../BaseSchema/modules/mcIcpms/schema.yaml#/$defs/Param_Analysis_numberOfBlocksPerMeasurement
              minContains: 0
              maxContains: 1
            - contains:
                $ref: ../../../../BaseSchema/modules/mcIcpms/schema.yaml#/$defs/Param_Analysis_numberOfCyclesPerBlock
              minContains: 0
              maxContains: 1
            - contains:
                $ref: ../../../../BaseSchema/modules/mcIcpms/schema.yaml#/$defs/Param_Analysis_integrationTimePerCycle
              minContains: 0
              maxContains: 1
            - contains: *id015
              minContains: 0
              maxContains: 1
            - contains:
                $ref: ../../../../BaseSchema/modules/blank/schema.yaml#/$defs/Param_Analysis_proceduralBlankLevel
              minContains: 0
              maxContains: 1
            - contains:
                $ref: ../../../../BaseSchema/modules/mcIcpms/schema.yaml#/$defs/Param_Analysis_doubleSpikeMixingRatio
              minContains: 0
              maxContains: 1
            - contains:
                $ref: ../../../../BaseSchema/modules/geochronology/schema.yaml#/$defs/Param_Analysis_inheritedOrInitialSignalCorrection
              minContains: 0
              maxContains: 1
            - contains:
                $ref: ../../../../BaseSchema/modules/geochronology/schema.yaml#/$defs/Param_Analysis_ageModel
              minContains: 0
              maxContains: 1
            - contains:
                $ref: ../../../../BaseSchema/modules/geochronology/schema.yaml#/$defs/Param_Analysis_ageDatumReferenceEpoch
              minContains: 0
              maxContains: 1
            - contains: *id016
              minContains: 0
              maxContains: 1
          prov:used:
            type: array
            items:
              type: object
              allOf:
              - if:
                  required:
                  - schema:instrument
                then:
                  properties:
                    schema:instrument:
                      type: array
                      items:
                        allOf:
                        - $ref: ../../../../BaseSchema/instrument/schema.yaml
                        - type: object
                          allOf:
                          - if:
                              properties:
                                schema:additionalType:
                                  contains:
                                    const: ICPMS
                                  schema:inDefinedTermSet: ada:vocab/instrumentType
                              required:
                              - schema:additionalType
                            then:
                              properties:
                                schema:identifier:
                                  description: Serial number or laboratory-internal identifier for the
                                    specific instrument unit. Supports traceability to instrument service
                                    records.
                                  anyOf:
                                  - type: string
                                  - type: array
                                    items:
                                      type: string
                                schema:hasPart:
                                  type: array
                                  items:
                                    type: object
                                    allOf:
                                    - if:
                                        properties:
                                          schema:additionalType:
                                            contains:
                                              const: Torch
                                            schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                                        required:
                                        - schema:additionalType
                                      then:
                                        properties:
                                          schema:additionalProperty:
                                            type: array
                                            items: &id017
                                              title: Torch Depth
                                              description: Distance between the load coil and the sampling
                                                cone tip (mm), also called injector depth or torch position
                                                depending on the instrument manufacturer. Affects ion
                                                transmission efficiency, oxide formation, and doubly-charged
                                                species production. The procedure specifies a target value
                                                optimised during initial setup; the analyst confirms or
                                                fine-adjusts during session tuning.
                                              type: object
                                              properties:
                                                '@id':
                                                  const: ada:parameter/laMcicpmsUPbTAPP/torchDepth
                                                '@type':
                                                  const:
                                                  - schema:PropertyValue
                                                schema:propertyID:
                                                  const:
                                                  - '@id': ada:parameter/laMcicpmsUPbTAPP/torchDepth
                                                schema:name:
                                                  const: Torch Depth
                                                schema:value:
                                                  type: string
                                              required:
                                              - '@id'
                                              - '@type'
                                              - schema:propertyID
                                              - schema:name
                                              - schema:value
                                            allOf:
                                            - contains: *id017
                                              minContains: 0
                                              maxContains: 1
                                    - if:
                                        properties:
                                          schema:additionalType:
                                            contains:
                                              const: ICP Source
                                            schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                                        required:
                                        - schema:additionalType
                                      then:
                                        properties:
                                          schema:additionalProperty:
                                            type: array
                                            items:
                                              anyOf:
                                              - &id018
                                                title: Coolant (Plasma) Gas Flow Rate
                                                description: Flow rate of the outer (coolant/plasma) argon
                                                  gas stream that sustains the ICP plasma, in L/min. Determines
                                                  plasma volume and stability. Set during initial plasma
                                                  optimisation and confirmed at each session start.
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/laMcicpmsUPbTAPP/coolantGasFlowRate
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/laMcicpmsUPbTAPP/coolantGasFlowRate
                                                  schema:name:
                                                    const: Coolant (Plasma) Gas Flow Rate
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                              - &id019
                                                title: Auxiliary Gas Flow Rate
                                                description: Flow rate of the intermediate (auxiliary)
                                                  argon gas stream that positions the plasma relative
                                                  to the load coil, in L/min. Affects ion extraction efficiency
                                                  and oxide production rates. Distinct from the carrier
                                                  gas (which transports ablation aerosol) and the coolant
                                                  (plasma) gas.
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/laMcicpmsUPbTAPP/auxiliaryGasFlowRate
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/laMcicpmsUPbTAPP/auxiliaryGasFlowRate
                                                  schema:name:
                                                    const: Auxiliary Gas Flow Rate
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                              - &id020
                                                title: RF Power
                                                description: ICP radiofrequency forward power in watts.
                                                  Affects plasma temperature, ionisation efficiency, oxide
                                                  formation, and whether cool or normal plasma conditions
                                                  are in effect. The procedure registers a target value
                                                  optimised during initial setup; the analyst confirms
                                                  or fine-adjusts during session tuning.
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/laMcicpmsUPbTAPP/rfPower
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/laMcicpmsUPbTAPP/rfPower
                                                  schema:name:
                                                    const: RF Power
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                            allOf:
                                            - contains: *id018
                                              minContains: 0
                                              maxContains: 1
                                            - contains: *id019
                                              minContains: 0
                                              maxContains: 1
                                            - contains: *id020
                                              minContains: 0
                                              maxContains: 1
                                    - if:
                                        properties:
                                          schema:additionalType:
                                            contains:
                                              const: Collision Reaction Cell
                                            schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                                        required:
                                        - schema:additionalType
                                      then:
                                        properties:
                                          schema:additionalProperty:
                                            type: array
                                            items:
                                              anyOf:
                                              - &id021
                                                title: Collision Gas Flow Rate
                                                description: Flow rate of the collision gas (typically
                                                  He) introduced into the collision/reaction cell, in
                                                  mL/min. Controls the degree of ion thermalization and
                                                  KED efficiency. Record 'None' if the CRC is in STD mode.
                                                  Record 'N/A' where Collision/Reaction Cell (CRC) Configuration
                                                  does not include KED.
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/laMcicpmsUPbTAPP/collisionGasFlowRate
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/laMcicpmsUPbTAPP/collisionGasFlowRate
                                                  schema:name:
                                                    const: Collision Gas Flow Rate
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                              - &id022
                                                title: Cell Exit Discrimination Voltage
                                                description: Bias voltage applied at the collision/reaction
                                                  cell exit to discriminate between analyte ions and low-energy
                                                  polyatomic interferences in KED mode, in volts (V).
                                                  A negative bias preferentially retards slow polyatomic
                                                  ions while transmitting faster analyte ions. Record
                                                  'None' if the CRC is in STD mode. Record 'N/A' where
                                                  Collision/Reaction Cell (CRC) Configuration does not
                                                  include KED.
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/laMcicpmsUPbTAPP/cellExitDiscriminationVoltage
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/laMcicpmsUPbTAPP/cellExitDiscriminationVoltage
                                                  schema:name:
                                                    const: Cell Exit Discrimination Voltage
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                              - &id023
                                                title: Reaction Gas Flow Rate
                                                description: Flow rate of the reactive gas introduced
                                                  into the dynamic reaction cell (DRC), in mL/min. Record
                                                  'N/A' where Collision/Reaction Cell (CRC) Configuration
                                                  does not include DRC.
                                                type: object
                                                properties:
                                                  '@id':
                                                    const: ada:parameter/laMcicpmsUPbTAPP/reactionGasFlowRate
                                                  '@type':
                                                    const:
                                                    - schema:PropertyValue
                                                  schema:propertyID:
                                                    const:
                                                    - '@id': ada:parameter/laMcicpmsUPbTAPP/reactionGasFlowRate
                                                  schema:name:
                                                    const: Reaction Gas Flow Rate
                                                  schema:value:
                                                    anyOf:
                                                    - type: number
                                                    - type: string
                                                  schema:unitText:
                                                    type: string
                                                required:
                                                - '@id'
                                                - '@type'
                                                - schema:propertyID
                                                - schema:name
                                                - schema:value
                                                - schema:unitText
                                            allOf:
                                            - contains: *id021
                                              minContains: 0
                                              maxContains: 1
                                            - contains: *id022
                                              minContains: 0
                                              maxContains: 1
                                            - contains: *id023
                                              minContains: 0
                                              maxContains: 1
                                  allOf:
                                  - contains:
                                      properties:
                                        schema:additionalType:
                                          contains:
                                            const: ICP Source
                                          schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                                      required:
                                      - schema:additionalType
                                  - contains:
                                      properties:
                                        schema:additionalType:
                                          contains:
                                            const: Collision Reaction Cell
                                          schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                                      required:
                                      - schema:additionalType
                                schema:additionalProperty:
                                  type: array
                                  items:
                                    anyOf:
                                    - &id024
                                      title: Mass Resolution Setting
                                      description: Operating mass resolution of the mass analyser. For
                                        quadrupole instruments this is fixed at unit resolution by instrument
                                        design. For sector-field instruments the analyst selects low,
                                        medium, or high resolution to balance sensitivity against spectral
                                        interference suppression.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/laMcicpmsUPbTAPP/massResolutionSetting
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/laMcicpmsUPbTAPP/massResolutionSetting
                                        schema:name:
                                          const: Mass Resolution Setting
                                        schema:value:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                    - &id025
                                      title: ICP Tuning
                                      description: Description of the approach used to optimise ICP plasma
                                        conditions prior to analysis, including the reference material
                                        used for tuning and the acceptance criteria (e.g., oxide production
                                        threshold, sensitivity targets, mass calibration).
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/laMcicpmsUPbTAPP/icpTuning
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/laMcicpmsUPbTAPP/icpTuning
                                        schema:name:
                                          const: ICP Tuning
                                        schema:value:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                    - &id026
                                      title: Doubly-Charged Species Monitor
                                      description: The mass ratio monitored to estimate doubly-charged
                                        ion (M²⁺) formation during instrument tuning. Doubly-charged ions
                                        appear at half the mass of the parent ion and can cause isobaric
                                        interferences on analytes in that mass region. The monitor species
                                        and the mass positions monitored should be stated explicitly.
                                        Analogous to Oxide Production Method and Threshold for oxide monitoring.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/laMcicpmsUPbTAPP/doublyChargedSpeciesMonitor
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/laMcicpmsUPbTAPP/doublyChargedSpeciesMonitor
                                        schema:name:
                                          const: Doubly-Charged Species Monitor
                                        schema:value:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                    - &id027
                                      title: Doubly-Charged Species Production
                                      description: Measured percentage of doubly-charged ion production
                                        for the monitored species at the time of instrument tuning. The
                                        procedure should specify the acceptable threshold (e.g., <1%,
                                        <3%); the measured value for each session is recorded here. Report
                                        both the threshold and the measured value where possible.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/laMcicpmsUPbTAPP/doublyChargedSpeciesProduction
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/laMcicpmsUPbTAPP/doublyChargedSpeciesProduction
                                        schema:name:
                                          const: Doubly-Charged Species Production
                                        schema:value:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                    - &id028
                                      title: Memory Effect Mitigation
                                      description: Procedure applied to identify and minimise memory effects
                                        from high-concentration elements in the previous sample or standard
                                        that may contaminate subsequent analyses, or from incomplete aerosol
                                        washout between adjacent pixels in raster mapping mode. For mapping,
                                        the mitigation strategy involves controlling scan speed relative
                                        to washout time to ensure each pixel signal is sufficiently free
                                        of the preceding pixel's contribution.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/laMcicpmsUPbTAPP/memoryEffectMitigation
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/laMcicpmsUPbTAPP/memoryEffectMitigation
                                        schema:name:
                                          const: Memory Effect Mitigation
                                        schema:value:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                  allOf:
                                  - contains: *id024
                                    minContains: 0
                                    maxContains: 1
                                  - contains: *id025
                                    minContains: 0
                                    maxContains: 1
                                  - contains: *id026
                                    minContains: 0
                                    maxContains: 1
                                  - contains: *id027
                                    minContains: 0
                                    maxContains: 1
                                  - contains: *id028
                                    minContains: 0
                                    maxContains: 1
                          - if:
                              properties:
                                schema:additionalType:
                                  contains:
                                    const: Laser Ablation System
                                  schema:inDefinedTermSet: ada:vocab/instrumentType
                              required:
                              - schema:additionalType
                            then:
                              properties:
                                schema:additionalProperty:
                                  type: array
                                  items:
                                    $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Analysis_laserEnergy
                                  allOf:
                                  - contains:
                                      $ref: ../../../../BaseSchema/modules/laserAblation/schema.yaml#/$defs/Param_Analysis_laserEnergy
                                    minContains: 0
                                    maxContains: 1
                      allOf:
                      - contains:
                          properties:
                            schema:additionalType:
                              contains:
                                const: ICPMS
                              schema:inDefinedTermSet: ada:vocab/instrumentType
                          required:
                          - schema:additionalType
              - if:
                  required:
                  - prov:reagent
                then:
                  properties:
                    prov:reagent:
                      type: array
                      items:
                        allOf:
                        - $ref: ../../../../BaseSchema/geochemProduct/schema.yaml#/$defs/UsedReagent
                        - type: object
                          allOf:
                          - if:
                              properties:
                                ada:reagentRole:
                                  const: primaryStandard
                              required:
                              - ada:reagentRole
                            then:
                              properties:
                                schema:name:
                                  description: Primary reference material(s) used to calibrate the instrument
                                    and convert raw signal intensities to concentrations or isotope ratios.
                                    Include material name, source institution, and citation for the accepted
                                    values used. Editable because the specific lot or certification vintage
                                    may differ between sessions while the material type remains the same.
                                  anyOf:
                                  - type: string
                                  - type: array
                                    items:
                                      type: string
                          - if:
                              properties:
                                ada:reagentRole:
                                  const: referenceMaterial
                              required:
                              - ada:reagentRole
                            then:
                              properties:
                                schema:name:
                                  description: Quality-control reference materials analysed as unknowns
                                    alongside samples in the same session to assess accuracy and monitor
                                    drift. Include material name, source, and citation for accepted values
                                    used for comparison. Editable because selection of secondary RMs may
                                    vary across sessions.
                                  anyOf:
                                  - type: string
                                  - type: array
                                    items:
                                      type: string
                          required:
                          - ada:reagentRole
    dqv:hasQualityMeasurement:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              dqv:isMeasurementOf:
                const: Oxide production ratio
            required:
            - dqv:isMeasurementOf
          then:
            properties:
              dqv:value:
                description: Measured oxide production ratio obtained during session-start tuning, for
                  the proxy specified in Oxide Production Method and Threshold. Record the measured value
                  and confirm whether the procedure threshold was met.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
      allOf:
      - contains:
          properties:
            dqv:isMeasurementOf:
              const: Oxide production ratio
          required:
          - dqv:isMeasurementOf
    ada:sensitivityYield:
      description: Instrument sensitivity achieved in the session, with the isotope or channel it was
        measured on and the conditions it applies to. May be expressed either as detected signal per unit
        concentration or per unit mass of analyte delivered — counts per second per ppb, volts per ppm,
        counts per picogram — or as useful yield, the percentage of sampled atoms ultimately detected
        as ions, with the method used to derive it cited. Useful yield is the more comparable of the two
        wherever the amount of material consumed varies between procedures, as it does with spot size,
        fluence and repetition rate. Records what the instrument actually delivered; a sensitivity the
        procedure requires before analyses may begin belongs with the tuning acceptance criteria.
      anyOf:
      - type: number
      - type: string
