          - contains: *id017
            minContains: 0
            maxContains: 1
    ada:channelTemplate:
      type: object
      properties:
        ada:channelColumns:
          type: array
          items:
            anyOf:
            - $ref: ../../../../BaseSchema/tappDefinition/schema.yaml#/$defs/ChannelIdentifierColumn
            - &id027
              title: Background Counting Time
              description: Total time spent counting at off-peak background position(s) in seconds, summed
                across all background positions.
              type: object
              properties:
                '@id':
                  const: ada:channelColumn/semTAPP/backgroundCountingTime
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: backgroundCountingTime
                schema:name:
                  const: Background Counting Time
                ada:dataType:
                  const: number
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: M
                schema:defaultValue:
                  anyOf:
                  - &id018
                    anyOf:
                    - type: number
                    - type: string
                  - type: array
                    items: *id018
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id028
              title: Background Position(s)
              description: Location(s) of off-peak background measurement(s) relative to the peak, in
                mm or sin-theta, and whether on the high- or low-energy side.
              type: object
              properties:
                '@id':
                  const: ada:channelColumn/semTAPP/backgroundPosition
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: backgroundPosition
                schema:name:
                  const: Background Position(s)
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  anyOf:
                  - &id019
                    type: string
                  - type: array
                    items: *id019
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id029
              title: Diffracting Crystal
              description: Analyzing crystal (monochromator) used on each spectrometer assignment. Crystal
                choice determines the detectable wavelength range and dispersion.
              type: object
              properties:
                '@id':
                  const: ada:channelColumn/semTAPP/diffractingCrystal
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: diffractingCrystal
                schema:name:
                  const: Diffracting Crystal
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  anyOf:
                  - &id020
                    type: string
                  - type: array
                    items: *id020
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id030
              title: Dwell Time per Pixel
              description: Time the electron beam dwells on each pixel during raster scanning (imaging
                modes) or on each step position during compositional mapping (EDS and WDS mapping modes),
                in microseconds or milliseconds. Longer dwell time improves signal-to-noise and counting
                statistics but increases total dose and can cause beam damage or contamination on sensitive
                materials. For WDS mapping, the dwell time is per spectrometer per pixel.
              type: object
              properties:
                '@id':
                  const: ada:channelColumn/semTAPP/dwellTimePerPixel
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: dwellTimePerPixel
                schema:name:
                  const: Dwell Time per Pixel
                ada:dataType:
                  const: number
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: M
                schema:defaultValue:
                  anyOf:
                  - &id021
                    anyOf:
                    - type: number
                    - type: string
                  - type: array
                    items: *id021
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id031
              title: Peak Counting Time
              description: Time spent counting X-ray intensity at the peak position, in seconds, on each
                spectrometer assignment. Procedure specifies standard values; analysts may adjust within
                procedure-defined bounds.
              type: object
              properties:
                '@id':
                  const: ada:channelColumn/semTAPP/peakCountingTime
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: peakCountingTime
                schema:name:
                  const: Peak Counting Time
                ada:dataType:
                  const: number
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: M
                schema:defaultValue:
                  anyOf:
                  - &id022
                    anyOf:
                    - type: number
                    - type: string
                  - type: array
                    items: *id022
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id032
              title: Proportional Counter / Detector
              description: Type of detector used on each spectrometer assignment. Affects sensitivity
                and count rate linearity.
              type: object
              properties:
                '@id':
                  const: ada:channelColumn/semTAPP/proportionalCounterDetector
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: proportionalCounterDetector
                schema:name:
                  const: Proportional Counter / Detector
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: R
                schema:defaultValue:
                  anyOf:
                  - &id023
                    type: string
                  - type: array
                    items: *id023
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id033
              title: Sequence
              description: Order in which spectrometer assignments are acquired during point analysis.
                Relevant for minimizing beam damage (volatile elements measured first) and for sequential
                multi-channel setups. Not applicable to X-ray mapping, where all assigned spectrometers
                collect simultaneously at each pixel.
              type: object
              properties:
                '@id':
                  const: ada:channelColumn/semTAPP/sequence
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: sequence
                schema:name:
                  const: Sequence
                ada:dataType:
                  const: integer
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: R
                schema:defaultValue:
                  anyOf:
                  - &id024
                    anyOf:
                    - type: number
                    - type: string
                  - type: array
                    items: *id024
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id034
              title: WDS PHA Setting
              description: Pulse height analyzer (PHA) setting for the WDS detector. Integral mode accepts
                all pulses above a threshold; Differential mode selects a narrow energy window to reject
                higher-order reflections and escape peaks.
              type: object
              properties:
                '@id':
                  const: ada:channelColumn/semTAPP/wdsPhaSetting
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: wdsPhaSetting
                schema:name:
                  const: WDS PHA Setting
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: R
                schema:defaultValue:
                  anyOf:
                  - &id025
                    type: string
                  - type: array
                    items: *id025
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id035
              title: X-ray Line
              description: X-ray emission line measured on each spectrometer assignment. Line choice affects
                sensitivity, matrix correction accuracy, and susceptibility to peak overlap and spectral
                interference.
              type: object
              properties:
                '@id':
                  const: ada:channelColumn/semTAPP/xRayLine
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: xRayLine
                schema:name:
                  const: X-ray Line
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  anyOf:
                  - &id026
                    type: string
                  - type: array
                    items: *id026
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
          allOf:
          - contains: *id027
            minContains: 0
            maxContains: 1
          - contains: *id028
            minContains: 0
            maxContains: 1
          - contains: *id029
            minContains: 0
            maxContains: 1
          - contains: *id030
            minContains: 0
            maxContains: 1
          - contains: *id031
            minContains: 0
            maxContains: 1
          - contains: *id032
            minContains: 0
            maxContains: 1
          - contains: *id033
            minContains: 0
            maxContains: 1
          - contains: *id034
            minContains: 0
            maxContains: 1
          - contains: *id035
            minContains: 0
            maxContains: 1
    schema:additionalProperty:
      type: array
      items:
        anyOf:
        - &id036
          title: Beam Damage Minimization
          description: 'Describes any measures taken to reduce electron beam damage to the sample during
            analysis. Examples: reduced accelerating voltage, lowered beam current, defocused or rastered
            beam, cooled stage, short acquisition sequences, or rotating between multiple points. Particularly
            important for volatile-bearing phases, hydrous minerals, glasses, organic materials, and biological
            samples.'
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/beamDamageMinimizationDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: beamDamageMinimizationDefault
            schema:name:
              const: Beam Damage Minimization
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id037
          title: Beam Raster Dimensions
          description: Dimensions of the small area over which the beam is rastered during a single analysis
            point, reported as width × height in µm. Applicable when Beam Mode = Rastered; defines the
            effective spatial footprint of the measurement and distributes dose over a larger area to
            reduce beam damage on sensitive phases.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/beamRasterDimensionsDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: beamRasterDimensionsDefault
            schema:name:
              const: Beam Raster Dimensions
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id038
          title: Chamber Pressure
          description: Chamber pressure and gas type during analysis. Required for variable pressure (VP-SEM)
            and environmental SEM (ESEM) modes. Report value and unit (Pa or Torr) and gas composition.
            Use 'None' for standard high-vacuum operation.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/chamberPressureDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: chamberPressureDefault
            schema:name:
              const: Chamber Pressure
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id039
          title: CL Wavelength Calibration Reference
          description: Reference light source or standard material used to calibrate the wavelength axis
            of the CL spectrometer. Required for quantitative spectral CL and hyperspectral mapping.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/clWavelengthCalibrationReferenceDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: clWavelengthCalibrationReferenceDefault
            schema:name:
              const: CL Wavelength Calibration Reference
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id040
          title: Detection Limit
          description: Method detection limit at 99% confidence, one per reported concentration variable
            (one per analyte, these being the same set). Include the method used and the resulting value
            for each.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/detectionLimitDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: detectionLimitDefault
            schema:name:
              const: Detection Limit
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id041
          title: Drift Correction
          description: 'Describes whether and how stage or beam drift was monitored and corrected during
            the measurement session. Examples: periodic stage realignment to a fiducial marker, automated
            beam drift correction in acquisition software, or reanalysis of a reference point at regular
            intervals. Particularly relevant for long mapping runs and high-magnification sessions where
            positional accuracy affects data quality.'
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/driftCorrectionDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: driftCorrectionDefault
            schema:name:
              const: Drift Correction
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id042
          title: EBSD Frame Time
          description: Acquisition time per EBSD diffraction pattern frame in milliseconds. Longer frame
            time improves pattern quality and indexing rate but increases total acquisition time.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/ebsdFrameTimeDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: ebsdFrameTimeDefault
            schema:name:
              const: EBSD Frame Time
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: ms
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: EDS Spectral Processing Type
          description: Method used to process EDS spectra and extract net peak intensities from raw spectral
            data. Applied before quantification (see Matrix Correction Method). Common approaches include
            background fitting and subtraction followed by peak integration, and filter fit or Gaussian
            deconvolution for overlapping peaks.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/edsSpectralProcessingType
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/semTAPP/edsSpectralProcessingType
            schema:name:
              const: EDS Spectral Processing Type
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - &id043
          title: Halogen Correction on Oxygen
          description: Whether oxygen content was adjusted to account for halogen substitution (F and/or
            Cl replacing OH) in halogen-bearing phases such as apatite, amphibole, and mica, where oxygen
            is calculated by stoichiometry.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/halogenCorrectionOnOxygenDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: halogenCorrectionOnOxygenDefault
            schema:name:
              const: Halogen Correction on Oxygen
            ada:dataType:
              const: boolean
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id044
          title: Image Pixel Size
          description: Physical size of each image pixel at the sample surface, in nm or µm. Defines spatial
            sampling of SE or BSE images. For large-area mosaic imaging, report the pixel size of individual
            tiles and the number and arrangement of tiles.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/imagePixelSizeDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: imagePixelSizeDefault
            schema:name:
              const: Image Pixel Size
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Stage Scan vs. Beam Scan
          description: For mapping modes, records whether the map was acquired by moving the stage while
            the beam is held fixed (stage scan) or by deflecting the beam across the field while the stage
            is stationary (beam scan). Stage scan is preferred for large areas or high-accuracy geometric
            fidelity; beam scan is faster for smaller fields but may introduce geometric distortion at
            the map edges.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/stageScanVsBeamScan
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/semTAPP/stageScanVsBeamScan
            schema:name:
              const: Stage Scan vs. Beam Scan
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
      allOf:
      - contains: *id036
        minContains: 0
        maxContains: 1
      - contains: *id037
        minContains: 0
        maxContains: 1
      - contains: *id038
        minContains: 0
        maxContains: 1
      - contains: *id039
        minContains: 0
        maxContains: 1
      - contains: *id040
        minContains: 0
        maxContains: 1
      - contains: *id041
        minContains: 0
        maxContains: 1
      - contains: *id042
        minContains: 0
        maxContains: 1
      - contains:
          title: EDS Spectral Processing Type
          description: Method used to process EDS spectra and extract net peak intensities from raw spectral
            data. Applied before quantification (see Matrix Correction Method). Common approaches include
            background fitting and subtraction followed by peak integration, and filter fit or Gaussian
            deconvolution for overlapping peaks.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/edsSpectralProcessingType
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/semTAPP/edsSpectralProcessingType
            schema:name:
              const: EDS Spectral Processing Type
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains: *id043
        minContains: 0
        maxContains: 1
      - contains: *id044
        minContains: 0
        maxContains: 1
      - contains:
          title: Stage Scan vs. Beam Scan
          description: For mapping modes, records whether the map was acquired by moving the stage while
            the beam is held fixed (stage scan) or by deflecting the beam across the field while the stage
            is stationary (beam scan). Stage scan is preferred for large areas or high-accuracy geometric
            fidelity; beam scan is faster for smaller fields but may introduce geometric distortion at
            the map edges.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/stageScanVsBeamScan
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/semTAPP/stageScanVsBeamScan
            schema:name:
              const: Stage Scan vs. Beam Scan
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
    ada:clAcquisitionMode:
      description: 'CL data collection strategy. Panchromatic: total light intensity collected by PMT
        across the full detector wavelength range. Spectral point: full CL spectrum at discrete point
        locations. Hyperspectral map: full CL spectrum acquired at each pixel of a raster scan.'
      type: string
      enum:
      - Panchromatic
      - Spectral point
      - Hyperspectral map
      - Multi-channel pseudo-color
      - N/A
      - None
      - missing
      readOnly: true
    ada:clIntegrationTimeDefault:
      description: Acquisition time per pixel (hyperspectral map mode) or per spectrum (spectral point
        mode), in ms or s. Longer integration improves signal-to-noise but increases beam dose and acquisition
        time.
      anyOf:
      - type: number
      - type: string
    ada:clWavelengthRange:
      description: Detection wavelength range of the CL system in nm. The range is set by the detector
        sensitivity and any optical filters installed.
      anyOf:
      - type: number
      - type: string
      readOnly: true
    schema:variableMeasured:
      type: array
      items:
        anyOf:
        - title: Dataset variable
          description: A measured variable of this dataset that is not one of the procedure's declared
            reported properties. schema:variableMeasured carries the dataset's actual variables; the reported-property
            branches above are permitted members of it, not the whole of it.
          type: object
          required:
          - '@type'
          properties:
            '@type':
              type: array
              contains:
                enum:
                - cdi:InstanceVariable
                - schema:PropertyValue
        - *id040
        - *id002
      allOf:
      - contains: *id040
        minContains: 0
        maxContains: 1
      - contains: *id002
        minContains: 0
        maxContains: 1
    ada:ebsdDetectorConfiguration:
      description: EBSD detector manufacturer, model, and camera resolution. Include whether EBSD and
        EDS are acquired simultaneously (common on modern combined EBSD-EDS systems).
      type: string
      readOnly: true
    dqv:hasQualityMeasurement:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              dqv:isMeasurementOf:
                const: EBSD Pattern Quality Threshold
            required:
            - dqv:isMeasurementOf
          then:
            properties:
              dqv:value:
                description: Minimum pattern quality or confidence index threshold applied during EBSD
                  data processing to exclude unreliably indexed points from orientation maps. Include
                  metric name and threshold value.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
    ada:ebsdPhaseListDefault:
      description: Mineral phases included in the EBSD reference pattern library for this procedure. The
        procedure specifies the expected phase suite for the target material; analysts may add phases
        for specific sample compositions.
      type: string
    ada:ebsdStepSizeDefault:
      description: Distance between adjacent EBSD measurement points in the map in nm or µm. Must be smaller
        than the smallest grain of interest to resolve grain boundary positions and intragrain orientation
        gradients.
      anyOf:
      - type: number
      - type: string
    ada:edsAcquisitionMode:
      description: 'Spatial acquisition sub-strategy for EDS measurements: stationary-beam point acquisition,
        linescan (beam stepped along a transect at defined intervals), or area map (beam rastered over
        a pixel grid). Specifies how the beam is positioned during data collection within the declared
        Analytical Mode. Particularly important when a procedure includes linescans as a distinct acquisition
        approach not fully captured by the mode flag columns.'
      type: string
      enum:
      - Point / spot
      - Line scan
      - Map
      - Automated mineralogy
      - N/A
      - None
      - missing
      readOnly: true
    ada:edsLiveTimePerPointOrPixelDefault:
      description: EDS spectral acquisition live time per analysis point or per pixel in seconds. Longer
        live time improves counting statistics but increases beam damage risk and total acquisition time.
      anyOf:
      - type: number
      - type: string
    schema:object:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              '@type':
                contains:
                  const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
            required:
            - '@type'
          then:
            properties:
              ada:foilThicknessDefault:
                description: 'Target thickness of the electron-transparent TEM lamella after final FIB
                  polishing, in nanometres. Actual thickness may differ from target. Typical range: 50-150
                  nm for standard TEM/STEM; 200-600 nm for XANES or tomography sections.'
                anyOf:
                - type: number
                - type: string
              ada:sliceThicknessDefault:
                description: Thickness of each FIB-milled slice during serial sectioning in nanometres.
                  Controls the Z-axis resolution of the 3D reconstruction.
                anyOf:
                - type: number
                - type: string
              schema:additionalProperty:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:name:
                          const: Target Material
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:value:
                          type: array
                          items:
                            description: General description of the material type(s) this procedure is
                              designed to analyse. Used for discoverability and procedure matching, and
                              because the material type constrains sample preparation, calibration and
                              matrix-matching requirements.
                            anyOf:
                            - type: string
                              enum:
                              - Silicate mineral
                              - Oxide
                              - Sulfide
                              - Carbonate
                              - Phosphate
                              - Metal alloy
                              - Organic matter
                              - Glass
                              - Regolith
                              - Whole rock / polished section
                              - Porous material
                              - N/A
                              - None
                              - missing
                            - type: string
                            readOnly: true
                allOf:
                - contains:
                    properties:
                      schema:name:
                        const: Target Material
                    required:
                    - schema:name
      allOf:
      - contains:
          properties:
            '@type':
              contains:
                const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
          required:
          - '@type'
    ada:massAbsorptionCoefficients:
      description: Database of mass absorption coefficients used in the matrix correction. MAC database
        choice affects accuracy particularly for light elements (B, C, N, O, F, Na).
      type: string
      enum:
      - LINEMU
      - CITZMU
      - MCMASTER
      - MAC30
      - MACJTA
      - FFAST
      - Unknown
      - N/A
      - None
      - missing
      readOnly: true
    ada:matrixCorrectionMethod:
      description: X-ray matrix correction algorithm applied during quantitative EDS or WDS data reduction.
        For X-ray mapping, applies when raw count maps are converted to quantitative concentration maps.
      type: string
      enum:
      - XPP (Simplified PAP)
      - PAP (Pouchou & Pichoir Full)
      - ZAF
      - CITZAF (Armstrong 1995)
      - Phi-rho-z (EPQ-91)
      - Unknown
      - N/A
      - None
      - missing
      readOnly: true
    ada:sampleTiltAngle:
      description: Sample tilt angle for EBSD acquisition in degrees, measured from horizontal. Standard
        EBSD geometry uses 70 degrees tilt toward the EBSD camera to maximise diffracted electron signal.
      anyOf:
      - type: number
      - type: string
      readOnly: true
    ada:seDetectorType:
      description: Type of secondary electron detector used. Everhart-Thornley (ET) detector is the standard
        off-axis collector sensitive to SE2 and some BSE; in-lens (TLD) detectors collect high-resolution
        SE1 signal at short working distances; GSED/ESED detectors operate in VP/ESEM mode by using the
        chamber gas as the signal amplification medium.
      type: string
      enum:
      - Everhart-Thornley (ET)
      - In-lens / TLD (through-the-lens)
      - GSED (VP/ESEM)
      - ESED (VP/ESEM)
      - N/A
      - None
      - missing
      readOnly: true
    ada:stepSizePixelSizeDefault:
      description: Centre-to-centre distance between adjacent measurement points (WDS mapping) or pixels
        (EDS mapping) in µm. Defines the spatial sampling interval of the map and, together with the pixel-grid
        dimensions, determines the total mapped area. Smaller step sizes increase spatial resolution but
        extend acquisition time.
      anyOf:
      - type: number
      - type: string
    ada:wdsDeadTimeCorrection:
      description: Method used to correct for WDS proportional counter dead time at high count rates.
        Dead time errors are most significant for major elements with high count rates (e.g., Si, Fe,
        Ca). Unlike EDS dead time — which is hardware-managed and reported as a session QC percentage
        (see EDS Dead Time) — WDS dead time correction is a user-selectable algorithm in the data reduction
        software. No separate measured WDS dead time value is reported; the correction is applied transparently
        during intensity-to-concentration conversion.
      type: string
      enum:
      - Default constant (manufacturer)
      - Adjusted constant
      - High-precision (Probe for EPMA)
      - Logarithmic
      - Unknown
      - N/A
      - None
      - missing
      readOnly: true
    ada:workingDistanceDefault:
      description: Distance between the objective lens pole piece and the specimen surface in millimetres.
        Affects spatial resolution, depth of focus, EDS X-ray take-off angle, and EBSD geometry.
      anyOf:
      - type: number
      - type: string
    ada:analyticalMode:
      type: array
      items:
        type: string
        enum:
        - SE Imaging
        - BSE Imaging
        - EDS Point Analysis
        - EDS Mapping
        - WDS Point Analysis
        - WDS Mapping
        - CL Point Analysis
        - CL Mapping
        - EBSD
        - TEM Sample Preparation
        - 3D Tomography
  required:
  - ada:imageRegistration3DDefault
  - ada:segmentationMethod3DDefault
  - ada:clAcquisitionMode
  - ada:clIntegrationTimeDefault
  - ada:clWavelengthRange
  - ada:ebsdDetectorConfiguration
  - ada:ebsdPhaseListDefault
  - ada:ebsdStepSizeDefault
  - ada:edsAcquisitionMode
  - ada:edsLiveTimePerPointOrPixelDefault
  - ada:massAbsorptionCoefficients
  - ada:matrixCorrectionMethod
  - ada:sampleTiltAngle
  - ada:seDetectorType
  - ada:stepSizePixelSizeDefault
  - ada:wdsDeadTimeCorrection
  - ada:workingDistanceDefault
