                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id012
              title: Interfering Elements
              description: Element(s) whose X-ray lines overlap with the measured peak for one or more
                analytes, requiring a correction.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/semTAPP/interferingElements
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: interferingElements
                schema:name:
                  const: Interfering Elements
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id013
              title: Primary Calibration Standard Name
              description: Name(s) of the primary reference material(s) used for intensity calibration
                in EDS or WDS quantification. Include the material name, its source or supplier, and a
                citation for the accepted values used, since results calibrated against different published
                values for the same material are not directly comparable.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/semTAPP/primaryCalibrationStandardName
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: primaryCalibrationStandardName
                schema:name:
                  const: Primary Calibration Standard Name
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id014
              title: Secondary Reference Materials
              description: Quality-control reference material(s) analyzed alongside unknowns to verify
                calibration accuracy. Include material name, assessed elements, number of analyses (n),
                and measured vs. accepted values where available.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/semTAPP/secondaryReferenceMaterials
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: secondaryReferenceMaterials
                schema:name:
                  const: Secondary Reference Materials
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id015
              title: Technique per Analyte
              description: For each analyte, records which X-ray detection technique (EDS or WDS) was
                used to collect the measurement. Required when a procedure employs both EDS and WDS simultaneously,
                assigning each element to the detector appropriate to its concentration range, line overlap
                situation, or required precision. List in the same order as the Analyte field.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/semTAPP/techniquePerAnalyte
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: techniquePerAnalyte
                schema:name:
                  const: Technique per Analyte
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id016
              title: Time-Dependent Intensity Correction
              description: Type of time-dependent intensity (TDI) correction applied to compensate for
                beam-induced volatilisation or migration of sensitive elements (e.g., Na, K, F in glasses,
                feldspars, carbonates). Most commonly applied in WDS point analysis; uncommon for EDS
                or X-ray mapping.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/semTAPP/timeDependentIntensityCorrection
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: timeDependentIntensityCorrection
                schema:name:
                  const: Time-Dependent Intensity Correction
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id017
              title: WDS Spectrometer Channel
              description: WDS spectrometer position(s) assigned to each analyte, one entry per assignment.
                An analyte may be assigned to more than one spectrometer with intensities aggregated (aggregate
                intensity counting), and one spectrometer serves several analytes across a run, so the
                assignment — not the analyte — is the unit carrying the spectrometer setup. Different
                spectrometers may have different crystal configurations.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/semTAPP/wdsSpectrometerChannel
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: wdsSpectrometerChannel
                schema:name:
                  const: WDS Spectrometer Channel
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
          allOf:
          - contains: *id003
            minContains: 0
            maxContains: 1
          - contains: *id004
            minContains: 0
            maxContains: 1
          - contains: *id005
            minContains: 0
            maxContains: 1
          - contains: *id006
            minContains: 0
            maxContains: 1
          - contains: *id007
            minContains: 0
            maxContains: 1
          - contains: *id008
            minContains: 0
