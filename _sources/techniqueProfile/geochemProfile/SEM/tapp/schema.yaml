$schema: https://json-schema.org/draft/2020-12/schema
title: SEM Technique-Aligned Protocol Profile (semTAPP)
description: Scanning electron microscopy superset (imaging + EDS/WDS composition + EBSD + FIB-SEM) extension
  of the base TAPP definition, generated from tapp/Current TAPPs/SEM_TAPP_v22.csv via the path-driven
  pipeline.
allOf:
- $ref: ../../../../BaseSchema/tappDefinition/schema.yaml
- $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/ProcedureIdentification
- $ref: ../../../../BaseSchema/modules/targetSelection/schema.yaml#/$defs/ProcedureIdentification
- $ref: ../../../../BaseSchema/modules/calibrationFactor/schema.yaml#/$defs/ProcedureIdentification
- $ref: ../../../../BaseSchema/modules/analyte/schema.yaml#/$defs/ProcedureIdentification
- type: object
  properties:
    ada:imageRegistration3DDefault:
      description: Method used to align consecutive SEM image slices in the 3D stack to correct for drift,
        vibration, and curtaining artifacts. Include software used.
      type: string
    ada:segmentationMethod3DDefault:
      description: Method and software used to segment phases and features in the aligned 3D image stack,
        transforming the grayscale stack into labelled 3D regions (pores, mineral phases, grain boundaries,
        organic matter).
      type: string
    schema:instrument:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              schema:additionalType:
                contains:
                  const: SEM
                schema:inDefinedTermSet: ada:vocab/instrumentType
            required:
            - schema:additionalType
          then:
            properties:
              ada:acceleratingVoltageDefault:
                description: Electron beam accelerating voltage in kilovolts. Affects X-ray generation
                  depth (EDS/WDS), EBSD pattern quality, imaging resolution, and beam penetration. Low
                  voltages (1-5 kV) improve surface sensitivity and reduce beam damage; high voltages
                  (15-20 kV) improve X-ray generation for quantitative analysis.
                anyOf:
                - type: number
                - type: string
              ada:beamDiameterDefault:
                description: Nominal electron beam diameter (spot size) at the sample surface, in nanometres
                  or micrometres, as set by the condenser aperture and working distance. Controls the
                  spatial resolution and X-ray excitation volume. For mapping modes, the effective spatial
                  sampling interval is further defined by Step Size / Pixel Size.
                anyOf:
                - type: number
                - type: string
              ada:beamMode:
                description: Whether the electron beam was operated as a stationary focused spot, defocused
                  to a specified diameter, or rastered over a small area during analysis. Controls the
                  effective sampling volume and irradiation footprint; critical for beam-sensitive phases
                  such as hydrous minerals, glasses, and carbonates. Must be consistent with the Beam
                  Diameter and Beam Raster Dimensions fields.
                anyOf:
                - type: string
                  enum:
                  - Focused
                  - Defocused
                  - Rastered
                  - N/A
                  - None
                  - missing
                  readOnly: true
                - type: array
                  items:
                    type: string
                    enum:
                    - Focused
                    - Defocused
                    - Rastered
                    - N/A
                    - None
                    - missing
                    readOnly: true
              schema:hasPart:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: BSE Detector
                          schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:name:
                          description: Type of backscattered electron detector. Solid-state diode detectors
                            (single or segmented) are standard; YAG scintillator detectors offer high
                            sensitivity at low voltage. Segmented detectors can operate in composition
                            mode (segments summed) or topography mode (differential signal between segments).
                            In-lens BSE detectors provide improved BSE collection at short working distances.
                          anyOf:
                          - type: string
                            enum:
                            - Solid-state diode (single)
                            - Solid-state diode (segmented, composition mode)
                            - Solid-state diode (segmented, topography mode)
                            - In-lens BSE
                            - YAG scintillator
                            - N/A
                            - None
                            - missing
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              enum:
                              - Solid-state diode (single)
                              - Solid-state diode (segmented, composition mode)
                              - Solid-state diode (segmented, topography mode)
                              - In-lens BSE
                              - YAG scintillator
                              - N/A
                              - None
                              - missing
                              readOnly: true
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: EDS Detector
                          schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:description:
                          description: EDS detector type, manufacturer, active area, solid angle, window
                            type, and geometry (take-off angle, position). Multiple detectors should be
                            listed separately.
                          anyOf:
                          - type: string
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              readOnly: true
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: Electron Source
                          schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:description:
                          description: Type of electron gun used in the instrument.
                          anyOf:
                          - type: string
                            enum:
                            - Cold-FEG
                            - Schottky FEG
                            - LaB6 / CeB6
                            - Tungsten (W)
                            - Unknown
                            - N/A
                            - None
                            - missing
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              enum:
                              - Cold-FEG
                              - Schottky FEG
                              - LaB6 / CeB6
                              - Tungsten (W)
                              - Unknown
                              - N/A
                              - None
                              - missing
                              readOnly: true
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: WDS Spectrometer
                          schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:name:
                          description: Number, type, and crystal range of WDS spectrometers on the instrument.
                            Include manufacturer, model, and crystal range. For SEM-WDS configurations
                            (third-party WDS on a non-EPMA platform), include WDS manufacturer and model.
                          anyOf:
                          - type: string
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              readOnly: true
                allOf:
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          const: BSE Detector
                        schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                    required:
                    - schema:additionalType
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          const: Electron Source
                        schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                    required:
                    - schema:additionalType
              schema:additionalProperty:
                type: array
                items:
                  anyOf:
                  - title: CL Detector Configuration
                    description: CL detector type, manufacturer, model, collection optics (e.g., parabolic
                      mirror, elliptical mirror, light guide), and spectral detection configuration (PMT
                      for panchromatic, CCD/EMCCD for spectral, multi-channel for pseudo-color CL).
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/semTAPP/clDetectorConfiguration
                      '@type':
                        const:
                        - schema:PropertyValue
                      schema:propertyID:
                        const:
                        - '@id': ada:parameter/semTAPP/clDetectorConfiguration
                      schema:name:
                        const: CL Detector Configuration
                      schema:value:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                    readOnly: true
                  - title: CL Grating
                    description: Diffraction grating specification for spectral or hyperspectral CL acquisition,
                      including groove density and blaze wavelength. Not applicable to panchromatic-only
                      acquisition.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/semTAPP/clGrating
                      '@type':
                        const:
                        - schema:PropertyValue
                      schema:propertyID:
                        const:
                        - '@id': ada:parameter/semTAPP/clGrating
                      schema:name:
                        const: CL Grating
                      schema:value:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                    readOnly: true
                allOf:
                - contains:
                    title: CL Detector Configuration
                    description: CL detector type, manufacturer, model, collection optics (e.g., parabolic
                      mirror, elliptical mirror, light guide), and spectral detection configuration (PMT
                      for panchromatic, CCD/EMCCD for spectral, multi-channel for pseudo-color CL).
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/semTAPP/clDetectorConfiguration
                      '@type':
                        const:
                        - schema:PropertyValue
                      schema:propertyID:
                        const:
                        - '@id': ada:parameter/semTAPP/clDetectorConfiguration
                      schema:name:
                        const: CL Detector Configuration
                      schema:value:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                    readOnly: true
                  minContains: 0
                  maxContains: 1
                - contains:
                    title: CL Grating
                    description: Diffraction grating specification for spectral or hyperspectral CL acquisition,
                      including groove density and blaze wavelength. Not applicable to panchromatic-only
                      acquisition.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/semTAPP/clGrating
                      '@type':
                        const:
                        - schema:PropertyValue
                      schema:propertyID:
                        const:
                        - '@id': ada:parameter/semTAPP/clGrating
                      schema:name:
                        const: CL Grating
                      schema:value:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                    readOnly: true
                  minContains: 0
                  maxContains: 1
              schema:manufacturer:
                type: object
                properties:
                  schema:name:
                    description: Manufacturer of the instrument that performs the measurement, recorded
                      as a controlled value so that procedures can be found by vendor. Where a procedure
                      couples a sample-introduction system to an analysing instrument, this records the
                      analysing instrument. Instrument Model gives the specific designation.
                    type: string
                    enum:
                    - JEOL
                    - Zeiss
                    - FEI / Thermo Fisher Scientific
                    - Hitachi
                    - Tescan
                    - Phenom
                    - Unknown
                    - N/A
                    - None
                    - missing
                    readOnly: true
              schema:model:
                type: object
                properties:
                  schema:name:
                    description: Model designation of the instrument that performs the measurement, including
                      any generation or configuration suffix. Conventionally written with the manufacturer
                      name included; Instrument Manufacturer records the vendor separately, as a controlled
                      value, so that procedures remain findable by vendor.
                    type: string
                    readOnly: true
              schema:description:
                description: 'Broad platform type of the instrument. ''Standard SEM'': dedicated electron-only
                  SEM column. ''FIB-SEM dual-beam'': combined focused ion beam and SEM columns (enables
                  TEM specimen preparation, 3D serial sectioning, ion-beam milling). ''VP-SEM / ESEM'':
                  variable-pressure or environmental SEM for imaging uncoated, hydrated, or charging specimens.
                  An instrument may combine categories (e.g., FIB-SEM with VP capability).'
                anyOf:
                - type: string
                  enum:
                  - Standard SEM
                  - FIB-SEM dual-beam
                  - VP-SEM / ESEM
                  - FIB-SEM dual-beam + VP
                  - N/A
                  - None
                  - missing
                  readOnly: true
                - type: array
                  items:
                    type: string
                    enum:
                    - Standard SEM
                    - FIB-SEM dual-beam
                    - VP-SEM / ESEM
                    - FIB-SEM dual-beam + VP
                    - N/A
                    - None
                    - missing
                    readOnly: true
              ada:ionBeamSource:
                description: Ion beam source type in a FIB-SEM dual-beam system. Gallium LMIS (Ga+) is
                  the most common ion source; xenon plasma FIB (PFIB) provides higher material removal
                  rates for large-volume milling; helium and neon ion microscopes (GFIS) provide nanometre-resolution
                  imaging and low-damage milling.
                anyOf:
                - type: string
                  enum:
                  - Gallium LMIS (Ga+)
                  - Xenon plasma FIB (PFIB)
                  - Helium GFIS
                  - Neon GFIS
                  - N/A
                  - None
                  - missing
                  readOnly: true
                - type: array
                  items:
                    type: string
                    enum:
                    - Gallium LMIS (Ga+)
                    - Xenon plasma FIB (PFIB)
                    - Helium GFIS
                    - Neon GFIS
                    - N/A
                    - None
                    - missing
                    readOnly: true
      allOf:
      - contains:
          properties:
            schema:additionalType:
              contains:
                const: SEM
              schema:inDefinedTermSet: ada:vocab/instrumentType
          required:
          - schema:additionalType
    schema:actionProcess:
      type: object
      properties:
        schema:step:
          type: array
          items:
            type: object
            allOf:
            - if:
                properties:
                  schema:name:
                    const: Data reduction
                required:
                - schema:name
              then:
                properties:
                  schema:additionalProperty:
                    type: array
                    items:
                      anyOf:
                      - $ref: ../../../../BaseSchema/modules/aggregation/schema.yaml#/$defs/Param_Procedure_analysisInclusionAndRejectionCriteria
                      - $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/Param_Procedure_constantsReferenceValues
                      - &id001
                        title: Crystal Structure Database
                        description: Crystal structure database used for EBSD phase identification and
                          Kikuchi pattern simulation.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/semTAPP/crystalStructureDatabaseDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: crystalStructureDatabaseDefault
                          schema:name:
                            const: Crystal Structure Database
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                      - &id002
                        title: Normalization / Standards-Based Correction
                        description: Post-acquisition normalization applied using secondary reference
                          materials to correct for session-to-session calibration drift.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/semTAPP/normalizationStandardsBasedCorrectionDefault
                          '@type':
                            const:
                            - schema:PropertyValueSpecification
                          schema:valueName:
                            const: normalizationStandardsBasedCorrectionDefault
                          schema:name:
                            const: Normalization / Standards-Based Correction
                          ada:dataType:
                            const: string
                          ada:fieldScope:
                            const: session
                          schema:readonlyValue:
                            const: false
                          ada:tier:
                            const: R
                        required:
                        - '@id'
                        - '@type'
                        - schema:valueName
                        - schema:name
                        - ada:dataType
                        - ada:fieldScope
                    allOf:
                    - contains:
                        $ref: ../../../../BaseSchema/modules/aggregation/schema.yaml#/$defs/Param_Procedure_analysisInclusionAndRejectionCriteria
                      minContains: 0
                      maxContains: 1
                    - contains:
                        $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/Param_Procedure_constantsReferenceValues
                      minContains: 0
                      maxContains: 1
                    - contains: *id001
                      minContains: 0
                      maxContains: 1
                    - contains: *id002
                      minContains: 0
                      maxContains: 1
                  ada:detectionLimitMethod:
                    description: Formula or approach used to calculate detection limits.
                    anyOf:
                    - type: string
                      readOnly: true
                    - type: array
                      items:
                        type: string
                        readOnly: true
                  ada:ebsdIndexingMethod:
                    description: Algorithm used to index EBSD diffraction patterns and assign crystal
                      orientations. Hough-transform methods fit Kikuchi band positions analytically; dictionary
                      indexing (DI) matches experimental patterns to a pre-computed library of simulated
                      patterns.
                    anyOf:
                    - type: string
                      enum:
                      - Hough transform
                      - Dictionary indexing (DI)
                      - Neural network
                      - Unknown
                      - N/A
                      - None
                      - missing
                      readOnly: true
                    - type: array
                      items:
                        type: string
                        enum:
                        - Hough transform
                        - Dictionary indexing (DI)
                        - Neural network
                        - Unknown
                        - N/A
                        - None
                        - missing
                        readOnly: true
            - if:
                properties:
                  schema:name:
                    const: Sample preparation
                required:
                - schema:name
              then:
                properties:
                  ada:coarseMillingConditionsDefault:
                    description: 'Ion beam voltage and current used for bulk material removal during FIB
                      milling. For TEM specimen preparation: bulk trenching to isolate the lamella and
                      intermediate thinning. For 3D tomography: face preparation and initial slice removal.'
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  ada:finePolishingConditionsDefault:
                    description: Ion beam voltage and current for final thinning and surface polishing
                      of the TEM lamella. Low-voltage polishing (2 kV or below) minimises Ga implantation
                      depth, surface amorphisation, and curtaining artifacts.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  ada:liftOutMethod:
                    description: Method used to transfer the FIB-prepared lamella to the TEM support grid.
                      In-situ lift-out uses a micromanipulator inside the FIB-SEM chamber and is the standard
                      method for small or precious specimens.
                    anyOf:
                    - type: string
                      enum:
                      - In-situ (micromanipulator, Cu or Mo TEM half-grid)
                      - Ex-situ
                      - N/A
                      - None
                      - missing
                      readOnly: true
                    - type: array
                      items:
                        type: string
                        enum:
                        - In-situ (micromanipulator, Cu or Mo TEM half-grid)
                        - Ex-situ
                        - N/A
                        - None
                        - missing
                        readOnly: true
                  ada:protectiveCoatingDepositionDefault:
                    description: 'Type and deposition conditions of the protective coating applied to
                      the sample surface before FIB milling. E-beam deposition causes less surface damage
                      than ion-beam deposition and should be applied as the initial layer. Typical coatings:
                      platinum (Pt) or carbon (C). State material, deposition method, beam conditions,
                      and approximate thickness.'
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  schema:description:
                    description: Method by which samples were prepared for SEM analysis prior to loading
                      in the instrument. Includes mounting medium (epoxy, carbon tape, stub), polishing
                      steps (alumina, colloidal silica, argon ion mill), and conductive coating type and
                      thickness. For VP-SEM/ESEM analyses, note whether an uncoated sample was used and
                      the gas type used. FIB-specific in-session operations (protective coating deposition,
                      milling conditions, lamella preparation) are documented separately in Group 4.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
            - if:
                properties:
                  schema:name:
                    const: Ion Milling
                required:
                - schema:name
              then:
                properties:
                  schema:description:
                    description: Ion beam voltage and current used to mill each slice during FIB-SEM serial
                      sectioning. These parameters determine material removal rate per slice and exposed
                      surface quality.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
          allOf:
          - contains:
              properties:
                schema:name:
                  const: Data reduction
              required:
              - schema:name
          - contains:
              properties:
                schema:name:
                  const: Sample preparation
              required:
              - schema:name
          - contains:
              properties:
                schema:name:
                  const: Ion Milling
              required:
              - schema:name
    ada:analyteTemplate:
      type: object
      properties:
        ada:analyteColumns:
          type: array
          items:
            anyOf:
            - $ref: ../../../../BaseSchema/tappDefinition/schema.yaml#/$defs/AnalyteIdentifierColumn
            - &id003
              title: Analyte Estimation Method
              description: Whether elemental concentrations were calculated directly from measured X-ray
                intensities, or estimated by cation stoichiometry (e.g., oxygen calculated from cation
                proportions in silicates; carbon from stoichiometry in carbonates).
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/semTAPP/analyteEstimationMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: analyteEstimationMethod
                schema:name:
                  const: Analyte Estimation Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id004
              title: Analytical Accuracy
              description: Offset between measured and accepted reference values for secondary standards,
                expressed as percent relative bias. Include reference material, reference value source,
                and per-analyte value.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/semTAPP/analyticalAccuracy
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: analyticalAccuracy
                schema:name:
                  const: Analytical Accuracy
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id005
              title: Analytical Precision
              description: Reproducibility of repeated measurements on the same or equivalent reference
                material, expressed as 1-sigma relative standard deviation (%). Include reference material
                name, number of analyses (n), and value per analyte or element group.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/semTAPP/analyticalPrecision
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: analyticalPrecision
                schema:name:
                  const: Analytical Precision
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id006
              title: Background Correction Method
              description: 'Method used to estimate and subtract background X-ray intensity beneath the
                peak. For WDS: typically 2-point off-peak linear interpolation or Mean Atomic Number (MAN)
                background model. For EDS: spectral background fitting or top-hat filter applied during
                spectral processing.'
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/semTAPP/backgroundCorrectionMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: backgroundCorrectionMethod
                schema:name:
                  const: Background Correction Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id007
              title: Beam Current
              description: Electron beam probe current. Higher current improves signal-to-noise for X-ray
                analysis (EDS/WDS, EBSD) and CL but may increase beam damage and reduce spatial resolution.
                Express in nA; for sub-nA values use decimal notation (e.g., 0.4 nA).
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/semTAPP/beamCurrent
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: beamCurrent
                schema:name:
                  const: Beam Current
                ada:dataType:
                  const: number
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: M
                schema:defaultValue:
                  anyOf:
                  - type: number
                  - type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id008
              title: Blank Correction
              description: Method and reference material(s) used to determine and subtract blank signal
                contributions (e.g., carbon coat contribution to C signal, or background contamination
                for trace elements).
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/semTAPP/blankCorrection
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: blankCorrection
                schema:name:
                  const: Blank Correction
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id009
              title: Counting Statistics Error
              description: 'Uncertainty predicted from counting statistics — the theoretical limit set
                by the Poisson distribution of the counts accumulated — for each reported quantity per
                analysis, with the sigma level stated. Derived from the counts on the analyte together
                with those on any background or blank subtracted from it. Distinct from the scatter actually
                observed within a measurement or between repeated measurements, which is recorded separately:
                where a procedure reports both, agreement indicates the measurement is shot-noise limited,
                and a larger observed scatter indicates a further source of variance.'
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/semTAPP/countingStatisticsError
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: countingStatisticsError
                schema:name:
                  const: Counting Statistics Error
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id010
              title: Interference Correction Standard
              description: Reference material used to quantify and calibrate the interference correction
                for each affected analyte.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/semTAPP/interferenceCorrectionStandard
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: interferenceCorrectionStandard
                schema:name:
                  const: Interference Correction Standard
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id011
              title: Interference Corrections Applied
              description: Whether a spectral interference correction was applied for each analyte. Common
                interferences include Ti Kb on V Ka, Cr Kb on Mn Ka, and Ba La on Ti Ka.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/semTAPP/interferenceCorrectionsApplied
                '@type':
