$schema: https://json-schema.org/draft/2020-12/schema
title: SEM Analysis Detail
description: Dataset-level analysis-instance detail for SEM (superset), reusing CDIF/schema.org slots
  on the schema:Dataset root.
allOf:
- $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/AnalysisIdentification
- $ref: ../../../../BaseSchema/modules/calibrationFactor/schema.yaml#/$defs/AnalysisIdentification
- $ref: ../../../../BaseSchema/modules/aggregation/schema.yaml#/$defs/AnalysisIdentification
- $ref: ../../../../BaseSchema/modules/compositionQC/schema.yaml#/$defs/AnalysisIdentification
- type: object
  properties:
    prov:wasGeneratedBy:
      type: array
      items:
        type: object
        properties:
          schema:additionalProperty:
            type: array
            items:
              anyOf:
              - &id001
                title: 3D Image Registration
                description: Method used to align consecutive SEM image slices in the 3D stack to correct
                  for drift, vibration, and curtaining artifacts. Include software used.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/imageRegistration3D
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/imageRegistration3D
                  schema:name:
                    const: 3D Image Registration
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id002
                title: Segmentation Method
                description: Method and software used to separate distinct phases or features in the reconstructed
                  3D volume, turning the grayscale volume into labelled regions.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/segmentationMethod
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/segmentationMethod
                  schema:name:
                    const: Segmentation Method
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id003
                title: Beam Damage Minimization
                description: 'Describes any measures taken to reduce electron beam damage to the sample
                  during analysis. Examples: reduced accelerating voltage, lowered beam current, defocused
                  or rastered beam, cooled stage, short acquisition sequences, or rotating between multiple
                  points.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/beamDamageMinimization
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/beamDamageMinimization
                  schema:name:
                    const: Beam Damage Minimization
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id004
                title: Beam Raster Dimensions
                description: Dimensions of the small area over which the beam is rastered at a single
                  analysis point, reported as width × height in µm. Applicable when Beam Mode = Rastered;
                  defines the effective spatial footprint of the measurement. Not applicable when mapping.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/beamRasterDimensions
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/beamRasterDimensions
                  schema:name:
                    const: Beam Raster Dimensions
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id005
                title: Chamber Pressure
                description: Chamber pressure and gas type during analysis. Required for variable pressure
                  (VP-SEM) and environmental SEM (ESEM) modes. Report value and unit (Pa or Torr) and
                  gas composition. Use 'None' for standard high-vacuum operation.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/chamberPressure
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/chamberPressure
                  schema:name:
                    const: Chamber Pressure
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id006
                title: CL Integration Time
                description: Acquisition time per pixel (hyperspectral map mode) or per spectrum (spectral
                  point mode), in ms or s.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/clIntegrationTime
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/clIntegrationTime
                  schema:name:
                    const: CL Integration Time
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id007
                title: CL Wavelength Calibration Reference
                description: Reference light source or standard material used to calibrate the wavelength
                  axis of the CL spectrometer. Required for quantitative spectral CL and hyperspectral
                  mapping.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/clWavelengthCalibrationReference
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/clWavelengthCalibrationReference
                  schema:name:
                    const: CL Wavelength Calibration Reference
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id008
                title: Drift Correction
                description: 'Describes whether and how stage or beam drift was monitored and corrected
                  during the measurement session. Examples: periodic stage realignment to a fiducial marker,
                  automated beam drift correction in acquisition software, or reanalysis of a reference
                  point at regular intervals.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/driftCorrection
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/driftCorrection
                  schema:name:
                    const: Drift Correction
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id009
                title: EBSD Frame Time
                description: Acquisition time per EBSD diffraction pattern frame in milliseconds.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/ebsdFrameTime
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/ebsdFrameTime
                  schema:name:
                    const: EBSD Frame Time
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id010
                title: EBSD Phase List
                description: Mineral phases included in the EBSD reference pattern library for this procedure.
                  Phases may be added for specific sample compositions beyond the expected suite for the
                  target material.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/ebsdPhaseList
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/ebsdPhaseList
                  schema:name:
                    const: EBSD Phase List
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id011
                title: EBSD Step Size
                description: Distance between adjacent EBSD measurement points in the map in nm or µm.
                  Must be smaller than the smallest grain of interest.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/ebsdStepSize
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/ebsdStepSize
                  schema:name:
                    const: EBSD Step Size
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id012
                title: EDS Live Time per Point or Pixel
                description: EDS spectral acquisition live time per analysis point or per pixel in seconds.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/edsLiveTimePerPointOrPixel
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/edsLiveTimePerPointOrPixel
                  schema:name:
                    const: EDS Live Time per Point or Pixel
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id013
                title: Halogen Correction on Oxygen
                description: Whether oxygen content was adjusted to account for halogen substitution (F
                  and/or Cl replacing OH) in halogen-bearing phases such as apatite, amphibole, and mica,
                  where oxygen is calculated by stoichiometry.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/halogenCorrectionOnOxygen
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/halogenCorrectionOnOxygen
                  schema:name:
                    const: Halogen Correction on Oxygen
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id014
                title: Image Pixel Size
                description: Physical size of each image pixel at the sample surface, in nm or µm. For
                  large-area mosaic imaging, report the pixel size of individual tiles and the number
                  and arrangement of tiles.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/imagePixelSize
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/imagePixelSize
                  schema:name:
                    const: Image Pixel Size
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id015
                title: Step Size / Pixel Size
                description: Centre-to-centre distance between adjacent measurement points (WDS mapping)
                  or pixels (EDS mapping) in µm.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/stepSizePixelSize
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/stepSizePixelSize
                  schema:name:
                    const: Step Size / Pixel Size
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Analysis_samplingUnitSelectionCriteria
              - &id016
                title: Working Distance
                description: Distance between the objective lens pole piece and the specimen surface in
                  millimetres.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/workingDistance
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/workingDistance
                  schema:name:
                    const: Working Distance
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
            allOf:
            - contains: *id001
              minContains: 0
              maxContains: 1
            - contains: *id002
              minContains: 0
              maxContains: 1
            - contains: *id003
              minContains: 0
              maxContains: 1
            - contains: *id004
              minContains: 0
              maxContains: 1
            - contains: *id005
              minContains: 0
              maxContains: 1
            - contains: *id006
              minContains: 0
              maxContains: 1
            - contains: *id007
              minContains: 0
              maxContains: 1
            - contains: *id008
              minContains: 0
              maxContains: 1
            - contains: *id009
              minContains: 0
              maxContains: 1
            - contains: *id010
              minContains: 0
              maxContains: 1
            - contains: *id011
              minContains: 0
              maxContains: 1
            - contains: *id012
              minContains: 0
              maxContains: 1
            - contains: *id013
              minContains: 0
              maxContains: 1
            - contains: *id014
              minContains: 0
              maxContains: 1
            - contains: *id015
              minContains: 0
              maxContains: 1
            - contains:
                $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Analysis_samplingUnitSelectionCriteria
              minContains: 0
              maxContains: 1
            - contains: *id016
              minContains: 0
              maxContains: 1
          prov:used:
            type: array
            items:
              type: object
              allOf:
              - if:
                  required:
                  - schema:instrument
                then:
                  properties:
                    schema:instrument:
                      type: array
                      items:
                        allOf:
                        - $ref: ../../../../BaseSchema/instrument/schema.yaml
                        - type: object
                          allOf:
                          - if:
                              properties:
                                schema:additionalType:
                                  contains:
                                    const: SEM
                                  schema:inDefinedTermSet: ada:vocab/instrumentType
                              required:
                              - schema:additionalType
                            then:
                              properties:
                                schema:additionalProperty:
                                  type: array
                                  items:
                                    anyOf:
                                    - &id017
                                      title: Accelerating Voltage
                                      description: Electron beam accelerating voltage in kilovolts.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/semTAPP/acceleratingVoltage
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/semTAPP/acceleratingVoltage
                                        schema:name:
                                          const: Accelerating Voltage
                                        schema:value:
                                          anyOf:
                                          - type: number
                                          - type: string
                                        schema:unitText:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                      - schema:unitText
                                    - &id018
                                      title: Beam Diameter
                                      description: Nominal electron beam diameter (spot size) at the sample
                                        surface, in nanometres or micrometres, as set by the condenser
                                        aperture and working distance. For mapping modes, the effective
                                        spatial sampling interval is further defined by Step Size / Pixel
                                        Size.
                                      type: object
                                      properties:
                                        '@id':
                                          const: ada:parameter/semTAPP/beamDiameter
                                        '@type':
                                          const:
                                          - schema:PropertyValue
                                        schema:propertyID:
                                          const:
                                          - '@id': ada:parameter/semTAPP/beamDiameter
                                        schema:name:
                                          const: Beam Diameter
                                        schema:value:
                                          anyOf:
                                          - type: number
                                          - type: string
                                        schema:unitText:
                                          type: string
                                      required:
                                      - '@id'
                                      - '@type'
                                      - schema:propertyID
                                      - schema:name
                                      - schema:value
                                      - schema:unitText
                                  allOf:
                                  - contains: *id017
                                    minContains: 0
                                    maxContains: 1
                                  - contains: *id018
                                    minContains: 0
                                    maxContains: 1
                      allOf:
                      - contains:
                          properties:
                            schema:additionalType:
                              contains:
                                const: SEM
                              schema:inDefinedTermSet: ada:vocab/instrumentType
                          required:
                          - schema:additionalType
          schema:actionProcess:
            type: object
            properties:
              schema:step:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:name:
                          const: Sample preparation
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items:
                            anyOf:
                            - &id019
                              title: Coarse Milling Conditions
                              description: 'Ion beam voltage and current used for bulk material removal
                                during FIB milling. For TEM specimen preparation: bulk trenching to isolate
                                the lamella and intermediate thinning. For 3D tomography: face preparation
                                and initial slice removal.'
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/semTAPP/coarseMillingConditions
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/semTAPP/coarseMillingConditions
                                schema:name:
                                  const: Coarse Milling Conditions
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            - &id020
                              title: Fine Polishing Conditions
                              description: Ion beam voltage and current for final thinning and surface
                                polishing of the TEM lamella.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/semTAPP/finePolishingConditions
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/semTAPP/finePolishingConditions
                                schema:name:
                                  const: Fine Polishing Conditions
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                            - &id021
                              title: Protective Coating Deposition
                              description: 'Type and deposition conditions of the protective coating applied
                                to the sample surface before FIB milling. E-beam deposition should be
                                applied as the initial layer. Typical coatings: platinum (Pt) or carbon
                                (C). State material, deposition method, beam conditions, and approximate
                                thickness.'
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/semTAPP/protectiveCoatingDeposition
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/semTAPP/protectiveCoatingDeposition
                                schema:name:
                                  const: Protective Coating Deposition
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                          allOf:
                          - contains: *id019
                            minContains: 0
                            maxContains: 1
                          - contains: *id020
                            minContains: 0
                            maxContains: 1
                          - contains: *id021
                            minContains: 0
                            maxContains: 1
                  - if:
                      properties:
                        schema:name:
                          const: Data reduction
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items:
                            anyOf:
                            - $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/Param_Analysis_constantsReferenceValues
                            - &id022
                              title: Crystal Structure Database
                              description: Crystal structure database used for EBSD phase identification
                                and Kikuchi pattern simulation.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/semTAPP/crystalStructureDatabase
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                  - '@id': ada:parameter/semTAPP/crystalStructureDatabase
                                schema:name:
                                  const: Crystal Structure Database
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                          allOf:
                          - contains:
                              $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/Param_Analysis_constantsReferenceValues
                            minContains: 0
                            maxContains: 1
                          - contains: *id022
                            minContains: 0
                            maxContains: 1
                  - if:
                      properties:
                        schema:name:
                          const: Ion milling
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:description:
                          description: Ion beam voltage and current used to mill each slice during FIB-SEM
                            serial sectioning.
                          anyOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                allOf:
                - contains:
                    properties:
                      schema:name:
                        const: Sample preparation
                    required:
                    - schema:name
                - contains:
                    properties:
                      schema:name:
                        const: Data reduction
                    required:
                    - schema:name
                - contains:
                    properties:
                      schema:name:
                        const: Ion milling
                    required:
                    - schema:name
          ada:edsDeadTime:
            description: Percent dead time reported by the EDS detector during the session — the fraction
              of total acquisition time the detector spent processing rather than counting. This field
              documents the resulting percentage as a session QC metric. Unlike WDS dead time (see WDS
              Dead Time Correction), no user-selectable correction algorithm is required.
            anyOf:
            - type: number
            - type: string
          schema:object:
            type: array
            items:
              type: object
              allOf:
              - if:
                  properties:
                    '@type':
                      contains:
                        const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                  required:
                  - '@type'
                then:
                  properties:
                    schema:additionalProperty:
                      type: array
                      items:
                        anyOf:
                        - &id023
                          title: Foil Thickness
                          description: Target thickness of the electron-transparent TEM lamella after
                            final FIB polishing, in nanometres. Actual thickness may differ from target.
                          type: object
                          properties:
                            '@id':
                              const: ada:parameter/semTAPP/foilThickness
                            '@type':
                              const:
                              - schema:PropertyValue
                            schema:propertyID:
                              const:
                              - '@id': ada:parameter/semTAPP/foilThickness
                            schema:name:
                              const: Foil Thickness
                            schema:value:
                              anyOf:
                              - type: number
                              - type: string
                            schema:unitText:
                              type: string
                          required:
                          - '@id'
                          - '@type'
                          - schema:propertyID
                          - schema:name
                          - schema:value
                          - schema:unitText
                        - $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Analysis_preAnalysisImagingAndScreening
                        - &id024
                          title: Slice Thickness
                          description: Thickness of each FIB-milled slice during serial sectioning in
                            nanometres.
                          type: object
                          properties:
                            '@id':
                              const: ada:parameter/semTAPP/sliceThickness
                            '@type':
                              const:
                              - schema:PropertyValue
                            schema:propertyID:
                              const:
                              - '@id': ada:parameter/semTAPP/sliceThickness
                            schema:name:
                              const: Slice Thickness
                            schema:value:
                              anyOf:
                              - type: number
                              - type: string
                            schema:unitText:
                              type: string
                          required:
                          - '@id'
                          - '@type'
                          - schema:propertyID
                          - schema:name
                          - schema:value
                          - schema:unitText
                      allOf:
                      - contains: *id023
                        minContains: 0
                        maxContains: 1
                      - contains:
                          $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/Param_Analysis_preAnalysisImagingAndScreening
                        minContains: 0
                        maxContains: 1
                      - contains: *id024
                        minContains: 0
                        maxContains: 1
            allOf:
            - contains:
                properties:
                  '@type':
                    contains:
                      const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                required:
                - '@type'
          ada:proceduralBlankLevel:
            description: The measured level of the analytical blank in the session, and — where the reported
              quantity is a ratio — its composition, since a blank subtracted from a ratio biases the
              result unless its own composition is known. Companion to the blank correction method.
            type: string
    dqv:hasQualityMeasurement:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              dqv:isMeasurementOf:
                const: EBSD Indexing Rate
            required:
            - dqv:isMeasurementOf
          then:
            properties:
              dqv:value:
                description: Fraction of EBSD map points successfully indexed, expressed as a percentage
                  of total map points.
                anyOf:
                - type: number
                - type: string
        - if:
            properties:
              dqv:isMeasurementOf:
                const: EBSD Mean Angular Deviation
            required:
            - dqv:isMeasurementOf
          then:
            properties:
              dqv:value:
                description: Mean angular deviation (MAD) of the EBSD pattern indexing solution in degrees.
                  MAD quantifies the misfit between experimental Kikuchi band positions and the best-fit
                  crystal orientation.
                anyOf:
                - type: number
                - type: string
        - if:
            properties:
              dqv:isMeasurementOf:
                const: EBSD Pattern Quality Threshold
            required:
            - dqv:isMeasurementOf
          then:
            properties:
              dqv:value:
                description: Minimum pattern quality or confidence index threshold applied during EBSD
                  data processing to exclude unreliably indexed points from orientation maps. Include
                  metric name and threshold value.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
      allOf:
      - contains:
          properties:
            dqv:isMeasurementOf:
              const: EBSD Indexing Rate
          required:
          - dqv:isMeasurementOf
      - contains:
          properties:
            dqv:isMeasurementOf:
              const: EBSD Mean Angular Deviation
          required:
          - dqv:isMeasurementOf
    ada:mapDimensions:
      description: Number of pixels in the EDS map in the X and Y directions. Based on the area of interest
        and selected pixel size.
      anyOf:
      - type: number
      - type: string
    schema:additionalProperty:
      type: array
      items: &id025
        title: Map Area
        description: Physical extent of the mapped region, given either as width × height in µm or as
          a total area in µm² or mm², and equal to (map width in pixels × step size) × (map height in
          pixels × step size). Complements the map's pixel-grid dimensions by recording the physical scale
          of the mapped region.
        type: object
        properties:
          '@id':
            const: ada:parameter/semTAPP/mapArea
          '@type':
            const:
            - schema:PropertyValue
          schema:propertyID:
            const:
            - '@id': ada:parameter/semTAPP/mapArea
          schema:name:
            const: Map Area
          schema:value:
            anyOf:
            - type: number
            - type: string
          schema:unitText:
            type: string
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
        - schema:unitText
      allOf:
      - contains: *id025
        minContains: 0
        maxContains: 1
    ada:voxelSize:
      description: X, Y, Z dimensions of the reconstructed 3D voxel in nanometres (X-Y pixel size from
        SEM image calibration; Z from slice thickness), and the total number of slices in the stack.
      type: string
    ada:imageStackDimenstions:
      description: X, Y, Z dimensions of the reconstructed 3D voxel in nanometres (X-Y pixel size from
        SEM image calibration; Z from slice thickness), and the total number of slices in the stack.
      type: string
  required:
  - ada:mapDimensions
  - ada:voxelSize
  - ada:imageStackDimenstions
