$schema: https://json-schema.org/draft/2020-12/schema
title: SEM Analysis Detail
description: Dataset-level analysis-instance detail for SEM (superset), reusing CDIF/schema.org slots
  on the schema:Dataset root.
allOf:
- $ref: ../../../../BaseSchema/modules/group1/schema.yaml#/$defs/AnalysisIdentification
- $ref: ../../../../BaseSchema/modules/reportingCore/schema.yaml#/$defs/AllBlocks_Analysis
- type: object
  properties:
    prov:wasGeneratedBy:
      type: array
      items:
        type: object
        properties:
          prov:used:
            type: array
            items:
              type: object
              allOf:
              - if:
                  required:
                  - schema:instrument
                then:
                  properties:
                    schema:instrument:
                      type: array
                      items:
                        allOf:
                        - $ref: ../../../../BaseSchema/instrument/schema.yaml
                        - type: object
                          allOf:
                          - if:
                              properties:
                                schema:additionalType:
                                  contains:
                                    const: SEM
                              required:
                              - schema:additionalType
                            then:
                              properties:
                                ada:acceleratingVoltage:
                                  description: Electron beam accelerating voltage in kilovolts. Affects
                                    X-ray generation depth (EDS/WDS), EBSD pattern quality, imaging resolution,
                                    and beam penetration. Low voltages (1-5 kV) improve surface sensitivity
                                    and reduce beam damage; high voltages (15-20 kV) improve X-ray generation
                                    for quantitative analysis.
                                  anyOf:
                                  - type: number
                                  - type: string
                                ada:beamDiameter:
                                  description: Nominal electron beam diameter (spot size) at the sample
                                    surface, in nanometres or micrometres, as set by the condenser aperture
                                    and working distance. Controls the spatial resolution and X-ray excitation
                                    volume. For mapping modes, the effective spatial sampling interval
                                    is further defined by Step Size / Pixel Size.
                                  anyOf:
                                  - type: number
                                  - type: string
                      allOf:
                      - contains:
                          properties:
                            schema:additionalType:
                              contains:
                                const: SEM
                          required:
                          - schema:additionalType
              - if:
                  required:
                  - bios:computationalTool
                then:
                  properties:
                    bios:computationalTool:
                      type: array
                      items:
                        allOf:
                        - $ref: ../../../../BaseSchema/adaProduct/schema.yaml#/$defs/UsedComputationalTool
                        - type: object
                          allOf:
                          - if:
                              properties:
                                ada:toolRole:
                                  const: acquisition
                              required:
                              - ada:toolRole
                            then:
                              properties:
                                schema:name:
                                  description: Software used to control the SEM and acquire data, including
                                    version number. For FIB-SEM 3D tomography, include the automated slice-and-view
                                    module name and version.
                                  anyOf:
                                  - type: string
                                  - type: array
                                    items:
                                      type: string
                          - if:
                              properties:
                                ada:toolRole:
                                  const: dataReduction
                              required:
                              - ada:toolRole
                            then:
                              properties:
                                schema:name:
                                  description: Software used for post-acquisition data reduction and analysis.
                                    List all packages with version numbers.
                                  anyOf:
                                  - type: string
                                  - type: array
                                    items:
                                      type: string
                          required:
                          - ada:toolRole
          schema:description:
            description: 'Any procedure- or analysis-specific information not captured by a structured
              field anywhere in this TAPP — including anomalies, deviations from the registered procedure,
              instrument modifications, and supplementary context. Scope is the whole document, not Group
              6: this is the last field of the TAPP and covers all six groups. Use sparingly; a structured
              field is preferred for anything that can be formally categorised.'
            type: string
          schema:additionalProperty:
            type: array
            items:
              anyOf:
              - &id001
                title: Beam Damage Minimization
                description: 'Describes any measures taken to reduce electron beam damage to the sample
                  during analysis. Examples: reduced accelerating voltage, lowered beam current, defocused
                  or rastered beam, cooled stage, short acquisition sequences, or rotating between multiple
                  points. Particularly important for volatile-bearing phases, hydrous minerals, glasses,
                  organic materials, and biological samples.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/beamDamageMinimization
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/beamDamageMinimization
                  schema:name:
                    const: Beam Damage Minimization
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id002
                title: Beam Raster Dimensions
                description: Dimensions of the small area over which the beam is rastered during a single
                  analysis point, reported as width × height in µm. Applicable when Beam Mode = Rastered;
                  defines the effective spatial footprint of the measurement and distributes dose over
                  a larger area to reduce beam damage on sensitive phases.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/beamRasterDimensions
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/beamRasterDimensions
                  schema:name:
                    const: Beam Raster Dimensions
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id003
                title: Drift Correction
                description: 'Describes whether and how stage or beam drift was monitored and corrected
                  during the measurement session. Examples: periodic stage realignment to a fiducial marker,
                  automated beam drift correction in acquisition software, or reanalysis of a reference
                  point at regular intervals. Particularly relevant for long mapping runs and high-magnification
                  sessions where positional accuracy affects data quality.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/driftCorrection
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/driftCorrection
                  schema:name:
                    const: Drift Correction
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id004
                title: Dwell Time per Pixel
                description: Time the electron beam dwells on each pixel during raster scanning (imaging
                  modes) or on each step position during compositional mapping (EDS and WDS mapping modes),
                  in microseconds or milliseconds. Longer dwell time improves signal-to-noise and counting
                  statistics but increases total dose and can cause beam damage or contamination on sensitive
                  materials. For WDS mapping, the dwell time is per spectrometer per pixel.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/dwellTimePerPixel
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/dwellTimePerPixel
                  schema:name:
                    const: Dwell Time per Pixel
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id005
                title: Pre-Analysis Imaging and Screening
                description: Imaging or other characterisation performed before the measurement in order
                  to select or locate the analysed target, including the technique, instrument and settings
                  used, and how individual analyses are linked back to the images. Distinct from any imaging
                  the procedure performs as its own measurement. Where the imaging is performed on a separate
                  instrument, it should also be recorded in the Group 1 coupling fields.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/preAnalysisImagingAndScreening
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/preAnalysisImagingAndScreening
                  schema:name:
                    const: Pre-Analysis Imaging and Screening
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id006
                title: Halogen Correction on Oxygen
                description: Whether oxygen content was adjusted to account for halogen substitution (F
                  and/or Cl replacing OH) in halogen-bearing phases such as apatite, amphibole, and mica,
                  where oxygen is calculated by stoichiometry.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/halogenCorrectionOnOxygen
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/halogenCorrectionOnOxygen
                  schema:name:
                    const: Halogen Correction on Oxygen
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id007
                title: Step Size / Pixel Size
                description: Centre-to-centre distance between adjacent measurement points (WDS mapping)
                  or pixels (EDS mapping) in µm. Defines the spatial sampling interval of the map and,
                  together with the pixel-grid dimensions, determines the total mapped area. Smaller step
                  sizes increase spatial resolution but extend acquisition time.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/stepSizePixelSize
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/stepSizePixelSize
                  schema:name:
                    const: Step Size / Pixel Size
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id008
                title: EDS Dead Time
                description: Percent dead time reported by the EDS detector during the session — the fraction
                  of total acquisition time the detector spent processing rather than counting. EDS dead
                  time correction is managed automatically by the detector electronics; this field documents
                  the resulting percentage as a session QC metric. Values above ~40% indicate excessive
                  count rate and may degrade spectral quality and quantitative accuracy. Unlike WDS dead
                  time (see WDS Dead Time Correction), no user-selectable correction algorithm is required.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/edsDeadTime
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/edsDeadTime
                  schema:name:
                    const: EDS Dead Time
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id009
                title: Procedural Blank Level
                description: 'The measured level of the analytical blank in the session, and — where the
                  reported quantity is a ratio — its composition, since a blank subtracted from a ratio
                  biases the result unless its own composition is known. Companion to the blank correction
                  method, which is procedure-level: this field records what was actually measured. Follows
                  the criterion-versus-measurement split the library applies wherever a procedure sets
                  a threshold and an analysis reports a value against it.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/semTAPP/proceduralBlankLevel
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                    - '@id': ada:parameter/semTAPP/proceduralBlankLevel
                  schema:name:
                    const: Procedural Blank Level
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
            allOf:
            - contains: *id001
              minContains: 0
              maxContains: 1
            - contains: *id002
              minContains: 0
              maxContains: 1
            - contains: *id003
              minContains: 0
              maxContains: 1
            - contains: *id004
              minContains: 0
              maxContains: 1
            - contains: *id005
              minContains: 0
              maxContains: 1
            - contains: *id006
              minContains: 0
              maxContains: 1
            - contains: *id007
              minContains: 0
              maxContains: 1
            - contains: *id008
              minContains: 0
              maxContains: 1
            - contains: *id009
              minContains: 0
              maxContains: 1
          ada:edsLiveTimePerPointOrPixel:
            description: EDS spectral acquisition live time per analysis point or per pixel in seconds.
              Longer live time improves counting statistics but increases beam damage risk and total acquisition
              time.
            anyOf:
            - type: number
            - type: string
          schema:object:
            type: array
            items:
              type: object
              allOf:
              - if:
                  properties:
                    '@type':
                      contains:
                        const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                  required:
                  - '@type'
                then:
                  properties:
                    schema:name:
                      description: Name or identifier of each sample analysed in this session, as used
                        in the laboratory — a sample mount, section or aliquot counts as one entry where
                        that is what the laboratory tracks. The analysis record corresponds to one session
                        and may cover several samples; fields whose Keyed By column declares 'sample'
                        take one value per entry. Should match the identifier used in associated publications
                        or data tables.
                      anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    schema:identifier:
                      description: Globally unique, persistent identifier for each sample listed in Sample
                        Name. IGSN (International Geo Sample Number) is the recommended standard for geological
                        and cosmochemical samples, as used by Astromat, EarthChem and SESAR. Where a sample
                        and its sub-samples are separately registered, record the identifier at the level
                        actually analysed.
                      anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
            allOf:
            - contains:
                properties:
                  '@type':
                    contains:
                      const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                required:
                - '@type'
          schema:actionProcess:
            type: object
            properties:
              schema:step:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:name:
                          const: Sample preparation
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:description:
                          description: Method by which samples were prepared for SEM analysis prior to
                            loading in the instrument. Includes mounting medium (epoxy, carbon tape, stub),
                            polishing steps (alumina, colloidal silica, argon ion mill), and conductive
                            coating type and thickness. For VP-SEM/ESEM analyses, note whether an uncoated
                            sample was used and the gas type used. FIB-specific in-session operations
                            (protective coating deposition, milling conditions, lamella preparation) are
                            documented separately in Group 4.
                          anyOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                  - if:
                      properties:
                        schema:name:
                          const: Data reduction
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items: &id010
                            title: Constants and Reference Values Used
                            description: Physical constants and reference values used in data reduction
                              to calculate the final reported quantity (e.g., decay constants for age
                              calculation, standard isotope ratios, or other citable reference values
                              used in a correction or calculation), together with their source. Distinct
                              from the Group 6 reference-material fields, which document accepted values
                              for specific calibration/validation materials rather than universal physical
                              constants. Record "None" if no citable, revisable physical constants feed
                              into this procedure's data reduction.
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/semTAPP/constantsAndReferenceValuesUsed
                              '@type':
                                const:
                                - schema:PropertyValue
                              schema:propertyID:
                                const:
                                - '@id': ada:parameter/semTAPP/constantsAndReferenceValuesUsed
                              schema:name:
                                const: Constants and Reference Values Used
                              schema:value:
                                type: string
                            required:
                            - '@id'
                            - '@type'
                            - schema:propertyID
                            - schema:name
                            - schema:value
                          allOf:
                          - contains: *id010
                            minContains: 0
                            maxContains: 1
                allOf:
                - contains:
                    properties:
                      schema:name:
                        const: Sample preparation
                    required:
                    - schema:name
                - contains:
                    properties:
                      schema:name:
                        const: Data reduction
                    required:
                    - schema:name
    schema:additionalProperty:
      type: array
      items: &id011
        title: Map Area
        description: Physical area covered by the map in µm² or mm², calculated as (map width in pixels
          × step size) × (map height in pixels × step size). Complements the map's pixel-grid dimensions
          by recording the physical scale of the mapped region; useful for direct comparison across datasets
          acquired with different step sizes.
        type: object
        properties:
          '@id':
            const: ada:parameter/semTAPP/mapArea
          '@type':
            const:
            - schema:PropertyValue
          schema:propertyID:
            const:
            - '@id': ada:parameter/semTAPP/mapArea
          schema:name:
            const: Map Area
          schema:value:
            anyOf:
            - type: number
            - type: string
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
      allOf:
      - contains: *id011
        minContains: 0
        maxContains: 1
