$schema: https://json-schema.org/draft/2020-12/schema
title: ADA SEM (superset) Product Profile
description: Path-driven technique-specific profile for ADA SEM (superset) Product Profile. Extends the
  base ADA product profile with the SEM analysis-instance detail on the schema:Dataset root, narrows prov:used
  to the semTAPP protocol, and constrains valid component types on schema:distribution.hasPart.
allOf:
- $ref: ../../../../BaseSchema/adaProduct/schema.yaml
- $ref: ../detail/schema.yaml
- type: object
  properties:
    prov:wasGeneratedBy:
      description: Narrow the base prov:used to the semTAPP definition — inline, or by node @id — alongside
        the instrument.
      type: array
      items:
        type: object
        properties:
          prov:used:
            type: array
            items:
              anyOf:
              - $ref: ../../../../BaseSchema/instrument/schema.yaml
              - type: object
                additionalProperties: false
                description: Reference by node @id to a semTAPP definition object defined elsewhere.
                properties:
                  '@id':
                    type: string
                    format: uri
                required:
                - '@id'
              - $ref: ../tapp/schema.yaml
    schema:additionalType:
      description: Must include a SEM product type identifier.
      contains:
        enum:
        - Scanning Electron Microscopy (SEM) Image
        - Scanning electron microscopy
        - Focused ion beam-scanning electron microscopy
    schema:distribution:
      description: Each distribution item is EITHER a monolithic single-file dataset whose ada:componentType
        is a SEM-specific or universal value (and may carry cdi:isStructuredBy), OR a bundle whose schema:hasPart
        members each carry such a componentType (the ADA/SAMIS archive form).
      type: array
      items:
        anyOf:
        - type: object
          required:
          - ada:componentType
          properties:
            ada:componentType:
              type: string
              anyOf:
              - $ref: ../../../../BaseSchema/adaProduct/schema.yaml#/$defs/universalComponentType
              - enum: &id001
                - ada:SEMImage
                - ada:BSEImage
                - ada:SEMEDSSpectrum
                - ada:SEMEDSMap
                - ada:EBSDMap
                - ada:SEMTabular
        - type: object
          required:
          - schema:hasPart
          properties:
            schema:hasPart:
              items:
                type: object
                anyOf:
                - $ref: ../../../../BaseSchema/adaProduct/schema.yaml#/$defs/universalComponentTypeBranch
                - properties:
                    ada:componentType:
                      type: string
                      enum: *id001
                  required:
                  - ada:componentType
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            required: ['@id']
            additionalProperties: false
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaSEMFull
