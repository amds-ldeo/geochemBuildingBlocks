          - contains:
              $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/laQicpmsUPb_internalAnalyticalPrecisionAndAssessmentMethod
            minContains: 0
            maxContains: 1
    ada:massesMeasuredDefault:
      description: Specific masses monitored in this procedure, grouped by the target species element
        they serve where they serve one. Covers atomic isotopes and, where a reaction cell shifts an target
        species onto a different mass, the product mass actually measured. Includes interference-monitor
        and internal-standard masses, which serve no target species and so have no parent element. The
        target species list is given by the Target Species field and is never inferred from the element
        symbols appearing here.
      type: string
      readOnly: true
    ada:signalCollectionMode:
      description: Mode used to collect ion signal across the monitored masses. In peak hopping mode,
        the quadrupole jumps sequentially between pre-set mass positions and dwells at each peak; in scanning
        mode, the quadrupole sweeps continuously across a defined mass range.
      type: string
      enum:
      - Peak hopping
      - Scanning
      - N/A
      - None
      - missing
      readOnly: true
    ada:massBiasCorrectionStrategy:
      description: 'Strategy used to correct instrumental isotopic mass fractionation, also called mass
        bias or mass discrimination. Distinct from Elemental Fractionation Correction, which addresses
        inter-element fractionation during ablation and transport: this field addresses discrimination
        between isotopes of the same element, and applies wherever the procedure reports isotope ratios.'
      type: string
      readOnly: true
    ada:totalIntegrationTimePerOutputDataPointDefault:
      description: Total duty-cycle time for one complete mass-scan sweep — the sum of all per-isotope
        dwell times plus inter-mass settling times. Not recoverable from Dwell Time per Mass alone, because
        settling time is not captured there. Applies to sequential (quadrupole and single-collector sector-field)
        acquisition.
      anyOf:
      - type: number
      - type: string
    ada:numberOfAcquisitionPasses:
      description: Number of acquisition passes the procedure runs. A count of the passes enumerated in
        Acquisition Pass, recorded separately so multi-pass procedures are findable without parsing that
        field.
      anyOf:
      - type: integer
      - type: string
      readOnly: true
    ada:analyticalMode:
      type: array
      items:
        type: string
        enum:
        - Spot
        - Transect
        - Mapping
  required:
  - ada:massesMeasuredDefault
  - ada:signalCollectionMode
  - ada:massBiasCorrectionStrategy
  - ada:totalIntegrationTimePerOutputDataPointDefault
  - ada:numberOfAcquisitionPasses
