            - $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/laQicpmsUPb_calibrationStrategyPerTargetSpecies
            - $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/laQicpmsUPb_spectralInterferenceCorrectionsApplied
            - $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/laQicpmsUPb_interferingSpecies
            - $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/laQicpmsUPb_interferenceCorrectionMethod
            - $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/laQicpmsUPb_withinSessionAnalyticalPrecisionAndAssessmentMethod
            - $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/laQicpmsUPb_betweenSessionAnalyticalPrecisionAndAssessmentMethod
            - $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/laQicpmsUPb_analyticalAccuracyAndAssessmentMethod
