$schema: https://json-schema.org/draft/2020-12/schema
title: SEM Composition (EDS/WDS) Technique-Aligned Protocol Profile (semCompositionTAPP)
description: Scanning electron microscopy compositional microanalysis (EDS/WDS) extension of the base
  TAPP definition, generated from tapp/Current TAPPs/SEM_Composition_TAPP_v64.csv via the path-driven
  pipeline (bootstrap_schemapaths.py + build_pathdriven.py).
allOf:
- $ref: ../../../../BaseSchema/tappDefinition/schema.yaml
- $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/ProcedureIdentification
- $ref: ../../../../BaseSchema/modules/samplingUnitSelection/schema.yaml#/$defs/ProcedureIdentification
- $ref: ../../../../BaseSchema/modules/calibrationFactor/schema.yaml#/$defs/ProcedureIdentification
- $ref: ../../../../BaseSchema/modules/targetSpecies/schema.yaml#/$defs/ProcedureIdentification
- $ref: ../../../../BaseSchema/modules/compositionQC/schema.yaml#/$defs/ProcedureIdentification
- type: object
  properties:
    schema:object:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              '@type':
                contains:
                  const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
            required:
            - '@type'
          then:
            properties:
              schema:additionalProperty:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:name:
                          const: Target Material
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:value:
                          type: array
                          items:
                            description: General description of the material type(s) this procedure is
                              designed to analyse.
                            anyOf:
                            - type: string
                              enum:
                              - Silicate mineral
                              - Silicate glass
                              - Oxide
                              - Sulfide
                              - Carbonate
                              - Phosphate
                              - Metal or alloy
                              - Organic matter
                              - Regolith
                              - Porous material
                              - Whole rock
                              - N/A
                              - None
                              - missing
                            - type: string
                            readOnly: true
                allOf:
                - contains:
                    properties:
                      schema:name:
                        const: Target Material
                    required:
                    - schema:name
      allOf:
      - contains:
          properties:
            '@type':
              contains:
                const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
          required:
          - '@type'
    schema:instrument:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              schema:additionalType:
                contains:
                  const: SEM
                schema:inDefinedTermSet: ada:vocab/instrumentType
            required:
            - schema:additionalType
          then:
            properties:
              schema:manufacturer:
                type: object
                properties:
                  schema:name:
                    description: Manufacturer of the instrument that performs the measurement, recorded
                      as a controlled value. Where a procedure couples a sample-introduction system to
                      an analysing instrument, this records the analysing instrument. Instrument Model
                      gives the specific designation.
                    type: string
                    enum:
                    - JEOL
                    - Zeiss
                    - FEI / Thermo Fisher Scientific
                    - Hitachi
                    - Tescan
                    - Phenom
                    - Unknown
                    - N/A
                    - None
                    - missing
                    readOnly: true
                required:
                - schema:name
              schema:model:
                type: object
                properties:
                  schema:name:
                    description: Model designation of the instrument that performs the measurement, including
                      any generation or configuration suffix. Conventionally written with the manufacturer
                      name included; Instrument Manufacturer records the vendor separately, as a controlled
                      value, so that procedures remain findable by vendor.
                    type: string
                    readOnly: true
                required:
                - schema:name
              schema:hasPart:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: Electron Source
                          schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:description:
                          description: Type of electron gun used in the instrument.
                          anyOf:
                          - type: string
                            enum:
                            - Cold-FEG
                            - Schottky FEG (X-FEG)
                            - Schottky FEG (standard)
                            - Field emission gun (FEG) — subtype not specified
                            - LaB6 / CeB6
                            - Tungsten (W)
                            - Unknown
                            - N/A
                            - None
                            - missing
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              enum:
                              - Cold-FEG
                              - Schottky FEG (X-FEG)
                              - Schottky FEG (standard)
                              - Field emission gun (FEG) — subtype not specified
                              - LaB6 / CeB6
                              - Tungsten (W)
                              - Unknown
                              - N/A
                              - None
                              - missing
                              readOnly: true
                      required:
                      - schema:description
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: EDS Detector
                          schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:description:
                          description: EDS detector type, manufacturer, number of detector elements, active
                            area and solid angle, window type, and geometry (take-off angle, position).
                            List multiple detectors separately. Record 'N/A' where the procedure has no
                            EDS detector.
                          anyOf:
                          - type: string
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              readOnly: true
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: WDS Spectrometer
                          schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:name:
                          description: Number, type, and crystal range of WDS spectrometers on the instrument.
                            Include manufacturer, model, and crystal range. For SEM-WDS configurations
                            (third-party WDS on a non-EPMA platform), include WDS manufacturer and model.
                          anyOf:
                          - type: string
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              readOnly: true
                allOf:
                - contains:
                    properties:
                      schema:additionalType:
                        contains:
                          const: Electron Source
                        schema:inDefinedTermSet: ada:vocab/instrumentComponentType
                    required:
                    - schema:additionalType
              schema:description:
                description: 'Broad platform type of the instrument. ''Standard SEM'': dedicated electron-only
                  SEM column. ''FIB-SEM dual-beam'': combined focused ion beam and SEM columns (enables
                  TEM specimen preparation, 3D serial sectioning, ion-beam milling). ''VP-SEM'': variable-pressure
                  SEM, a dry gas at low chamber pressure for uncoated or charging specimens. ''ESEM'':
                  environmental SEM, water vapour at higher pressure for hydrated specimens, requiring
                  a gaseous secondary electron detector. Where an instrument combines categories, join
                  them with ''; '' — ''FIB-SEM dual-beam; VP-SEM'' — rather than looking for a combined
                  member. This field records the COLUMN AND CHAMBER configuration only: field emission
                  is a source type and belongs in Electron Source, not here.'
                anyOf:
                - type: string
                  enum:
                  - Standard SEM
                  - FIB-SEM dual-beam
                  - VP-SEM
                  - ESEM
                  - N/A
                  - None
                  - missing
                  readOnly: true
                - type: array
                  items:
                    type: string
                    enum:
                    - Standard SEM
                    - FIB-SEM dual-beam
                    - VP-SEM
                    - ESEM
                    - N/A
                    - None
                    - missing
                    readOnly: true
              ada:beamMode:
                description: Whether the electron beam was operated as a stationary focused spot, defocused
                  to a specified diameter, or rastered over a small area during a single-point analysis.
                  Must be consistent with the Beam Diameter and Beam Raster Dimensions fields. For mapping,
                  beam scanning is controlled by Step Size / Pixel Size and Stage Scan vs. Beam Scan instead.
                anyOf:
                - type: string
                  enum:
                  - Focused
                  - Defocused
                  - Rastered
                  - N/A
                  - None
                  - missing
                - type: string
                readOnly: true
              ada:acceleratingVoltageDefault:
                description: Electron beam accelerating voltage in kilovolts.
                anyOf:
                - type: number
                - type: string
              ada:beamDiameterDefault:
                description: Nominal electron beam diameter (spot size) at the sample surface, in nanometres
                  or micrometres, as set by the condenser aperture and working distance. For mapping modes,
                  the effective spatial sampling interval is further defined by Step Size / Pixel Size.
                anyOf:
                - type: number
                - type: string
              ada:workingDistanceDefault:
                description: Distance between the objective lens pole piece and the specimen surface in
                  millimetres.
                anyOf:
                - type: number
                - type: string
            required:
            - ada:acceleratingVoltageDefault
            - ada:beamDiameterDefault
            - ada:beamMode
            - ada:workingDistanceDefault
            - schema:description
            - schema:manufacturer
            - schema:model
      allOf:
      - contains:
          properties:
            schema:additionalType:
              contains:
                const: SEM
              schema:inDefinedTermSet: ada:vocab/instrumentType
          required:
          - schema:additionalType
    ada:targetSpeciesTemplate:
      type: object
      properties:
        ada:targetSpeciesColumns:
          type: array
          items:
            anyOf:
            - $ref: ../../../../BaseSchema/tappDefinition/schema.yaml#/$defs/TargetSpeciesIdentifierColumn
            - $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_beamCurrent
            - $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_techniquePerTargetSpecies
            - $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_wdsSpectrometerChannel
            - $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_xRayBackgroundCorrectionMethod
            - $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_timeDependentIntensityCorrection
            - $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_targetSpeciesEstimationMethod
            - $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_blankCorrection
            - $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_xRayLineOverlapCorrectionsApplied
            - $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_interferingElements
            - $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_interferenceCorrectionStandard
            - $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_analyticalPrecision
            - $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_analyticalAccuracy
            - $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_countingStatisticsError
          allOf:
          - contains:
              $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_beamCurrent
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_techniquePerTargetSpecies
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_wdsSpectrometerChannel
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_xRayBackgroundCorrectionMethod
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_timeDependentIntensityCorrection
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_targetSpeciesEstimationMethod
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_blankCorrection
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_xRayLineOverlapCorrectionsApplied
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_interferingElements
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_interferenceCorrectionStandard
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_analyticalPrecision
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_analyticalAccuracy
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../../../../registry/targetSpeciesColumns/schema.yaml#/$defs/semComposition_countingStatisticsError
            minContains: 0
            maxContains: 1
    schema:additionalProperty:
      type: array
      items:
        anyOf:
        - &id001
          title: Beam Raster Dimensions
          description: Dimensions of the small area over which the beam is rastered at a single analysis
            point, reported as width × height in µm. Applicable when Beam Mode = Rastered; defines the
            effective spatial footprint of the measurement. Not applicable when mapping.
          type: object
          properties:
            '@id':
              const: ada:parameter/semCompositionTAPP/beamRasterDimensionsDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: beamRasterDimensionsDefault
            schema:name:
              const: Beam Raster Dimensions
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: µm x µm
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id002
          title: Beam Damage Minimization
          description: 'Describes any measures taken to reduce electron beam damage to the sample during
            analysis. Examples: reduced accelerating voltage, lowered beam current, defocused or rastered
            beam, cooled stage, short acquisition sequences, or rotating between multiple points.'
          type: object
          properties:
            '@id':
              const: ada:parameter/semCompositionTAPP/beamDamageMinimizationDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: beamDamageMinimizationDefault
            schema:name:
              const: Beam Damage Minimization
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id003
          title: Drift Correction
          description: 'Describes whether and how stage or beam drift was monitored and corrected during
            the measurement session. Examples: periodic stage realignment to a fiducial marker, automated
            beam drift correction in acquisition software, or reanalysis of a reference point at regular
            intervals.'
          type: object
          properties:
            '@id':
              const: ada:parameter/semCompositionTAPP/driftCorrectionDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: driftCorrectionDefault
            schema:name:
              const: Drift Correction
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Stage Scan vs. Beam Scan
          description: For mapping modes, whether the map was acquired by moving the stage while the beam
            is held fixed (stage scan), or by deflecting the beam across the field while the stage is
            stationary (beam scan).
          type: object
          properties:
            '@id':
              const: ada:parameter/semCompositionTAPP/stageScanVsBeamScan
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/semCompositionTAPP/stageScanVsBeamScan
            schema:name:
              const: Stage Scan vs. Beam Scan
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - &id004
          title: Chamber Pressure
          description: Chamber pressure and gas type during analysis. Required for variable pressure (VP-SEM)
            and environmental SEM (ESEM) modes. Report value and unit (Pa or Torr) and gas composition.
            Use 'None' for standard high-vacuum operation.
          type: object
          properties:
            '@id':
              const: ada:parameter/semCompositionTAPP/chamberPressureDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: chamberPressureDefault
            schema:name:
              const: Chamber Pressure
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id005
          title: Halogen Correction on Oxygen
          description: Whether oxygen content was adjusted to account for halogen substitution (F and/or
            Cl replacing OH) in halogen-bearing phases such as apatite, amphibole, and mica, where oxygen
            is calculated by stoichiometry.
          type: object
          properties:
            '@id':
              const: ada:parameter/semCompositionTAPP/halogenCorrectionOnOxygenDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: halogenCorrectionOnOxygenDefault
            schema:name:
              const: Halogen Correction on Oxygen
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: EDS Spectral Processing Type
          description: Method used to process EDS spectra and extract net peak intensities from raw spectral
            data. Applied before quantification (see Matrix Correction Method). Common approaches include
            background fitting and subtraction followed by peak integration, and filter fit or Gaussian
            deconvolution for overlapping peaks.
          type: object
          properties:
            '@id':
              const: ada:parameter/semCompositionTAPP/edsSpectralProcessingType
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/semCompositionTAPP/edsSpectralProcessingType
            schema:name:
              const: EDS Spectral Processing Type
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
      allOf:
      - contains: *id001
        minContains: 0
        maxContains: 1
      - contains: *id002
        minContains: 0
        maxContains: 1
      - contains: *id003
        minContains: 0
        maxContains: 1
      - contains:
          title: Stage Scan vs. Beam Scan
          description: For mapping modes, whether the map was acquired by moving the stage while the beam
            is held fixed (stage scan), or by deflecting the beam across the field while the stage is
            stationary (beam scan).
          type: object
          properties:
            '@id':
              const: ada:parameter/semCompositionTAPP/stageScanVsBeamScan
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/semCompositionTAPP/stageScanVsBeamScan
            schema:name:
              const: Stage Scan vs. Beam Scan
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains: *id004
        minContains: 0
        maxContains: 1
      - contains: *id005
        minContains: 0
        maxContains: 1
      - contains:
          title: EDS Spectral Processing Type
          description: Method used to process EDS spectra and extract net peak intensities from raw spectral
            data. Applied before quantification (see Matrix Correction Method). Common approaches include
            background fitting and subtraction followed by peak integration, and filter fit or Gaussian
            deconvolution for overlapping peaks.
          type: object
          properties:
            '@id':
              const: ada:parameter/semCompositionTAPP/edsSpectralProcessingType
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
              - '@id': ada:parameter/semCompositionTAPP/edsSpectralProcessingType
            schema:name:
              const: EDS Spectral Processing Type
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
    ada:monitoredPropertyTemplate:
      type: object
      properties:
        ada:monitoredPropertyColumns:
          type: array
          items:
            anyOf:
            - $ref: ../../../../BaseSchema/tappDefinition/schema.yaml#/$defs/MonitoredPropertyIdentifierColumn
            - $ref: ../../../../registry/monitoredPropertyColumns/schema.yaml#/$defs/semComposition_dwellTimePerPixel
            - $ref: ../../../../registry/monitoredPropertyColumns/schema.yaml#/$defs/semComposition_xRayLine
            - $ref: ../../../../registry/monitoredPropertyColumns/schema.yaml#/$defs/semComposition_diffractingCrystal
            - $ref: ../../../../registry/monitoredPropertyColumns/schema.yaml#/$defs/semComposition_sequence
            - $ref: ../../../../registry/monitoredPropertyColumns/schema.yaml#/$defs/semComposition_proportionalCounterDetector
            - $ref: ../../../../registry/monitoredPropertyColumns/schema.yaml#/$defs/semComposition_wdsPhaSetting
            - $ref: ../../../../registry/monitoredPropertyColumns/schema.yaml#/$defs/semComposition_peakCountingTime
            - $ref: ../../../../registry/monitoredPropertyColumns/schema.yaml#/$defs/semComposition_backgroundCountingTime
            - $ref: ../../../../registry/monitoredPropertyColumns/schema.yaml#/$defs/semComposition_backgroundPosition
          allOf:
          - contains:
              $ref: ../../../../registry/monitoredPropertyColumns/schema.yaml#/$defs/semComposition_dwellTimePerPixel
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../../../../registry/monitoredPropertyColumns/schema.yaml#/$defs/semComposition_xRayLine
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../../../../registry/monitoredPropertyColumns/schema.yaml#/$defs/semComposition_diffractingCrystal
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../../../../registry/monitoredPropertyColumns/schema.yaml#/$defs/semComposition_sequence
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../../../../registry/monitoredPropertyColumns/schema.yaml#/$defs/semComposition_proportionalCounterDetector
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../../../../registry/monitoredPropertyColumns/schema.yaml#/$defs/semComposition_wdsPhaSetting
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../../../../registry/monitoredPropertyColumns/schema.yaml#/$defs/semComposition_peakCountingTime
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../../../../registry/monitoredPropertyColumns/schema.yaml#/$defs/semComposition_backgroundCountingTime
            minContains: 0
            maxContains: 1
          - contains:
              $ref: ../../../../registry/monitoredPropertyColumns/schema.yaml#/$defs/semComposition_backgroundPosition
            minContains: 0
            maxContains: 1
    ada:edsAcquisitionMode:
      description: 'Spatial acquisition sub-strategy for EDS measurements: stationary-beam point acquisition,
        line scan (beam stepped along a transect at defined intervals), or area map / spectrum image (beam
        rastered over a pixel grid). Specifies how the beam is positioned during data collection within
        the declared analytical mode. Record ''N/A'' where the procedure has no EDS detector. ''Point''
        covers what the literature also calls spot or point-spectrum analysis. ''Map'' and ''Spectrum
        image'' are distinct acquisitions, not synonyms: a map may retain element intensities alone, whereas
        a spectrum image retains a full spectrum at every pixel and can be requantified afterwards — record
        which was acquired. Where more than one mode was used, join them with ''; '' rather than looking
        for a combined member.'
      type: string
      enum:
      - Point
      - Line scan
      - Map
      - Spectrum image
      - Automated mineralogy
      - N/A
      - None
      - missing
      readOnly: true
    ada:edsLiveTimePerPointOrPixelDefault:
      description: EDS spectral acquisition live time per analysis point or per pixel in seconds.
      anyOf:
      - type: number
      - type: string
    ada:stepSizePixelSizeDefault:
      description: Centre-to-centre distance between adjacent measurement points (WDS mapping) or pixels
        (EDS mapping) in µm.
      anyOf:
      - type: number
      - type: string
    ada:matrixCorrectionMethod:
      description: X-ray matrix correction algorithm applied during quantitative EDS or WDS data reduction.
        For X-ray mapping, applies when raw count maps are converted to quantitative concentration maps.
        Where the k-factors or calibration constants themselves came from — measured standards, a vendor
        library, or theoretical cross-sections — is a separate question answered by this technique's calibration-standard
        field, not here; a procedure may be both absorption-corrected and standardless.
      anyOf:
      - type: string
        enum:
        - XPP (Simplified PAP)
        - PAP (Pouchou & Pichoir Full)
        - ZAF
        - CITZAF (Armstrong 1995)
        - Phi-rho-z (EPQ-91)
        - Unknown
        - N/A
        - None
        - missing
      - type: string
      readOnly: true
    ada:massAbsorptionCoefficients:
      description: Database of mass absorption coefficients used in the matrix correction.
      type: string
      enum:
      - LINEMU
      - CITZMU
      - MCMASTER
      - MAC30
      - MACJTA
      - FFAST
      - Unknown
      - N/A
      - None
      - missing
      readOnly: true
    ada:wdsDeadTimeCorrection:
      description: Method used to correct for WDS proportional counter dead time at high count rates.
        Unlike EDS dead time — which is hardware-managed and reported as a session QC percentage (see
        EDS Dead Time) — WDS dead time correction is a user-selectable algorithm in the data reduction
        software. No separate measured WDS dead time value is reported; the correction is applied transparently
        during intensity-to-concentration conversion. Record the algorithm here and any instrument-specific
        constant alongside it — 'Default constant (manufacturer) — 3 µs, Cameca'. The instrument vendor
        itself is recorded by Instrument Manufacturer, not by this field's allowed values.
      anyOf:
      - type: string
        enum:
        - Default constant (manufacturer)
        - Adjusted constant
        - Logarithmic
        - High-precision (Probe for EPMA)
        - Super-precision (Probe for EPMA)
        - Unknown
        - N/A
        - None
        - missing
      - type: string
      readOnly: true
    schema:actionProcess:
      type: object
      properties:
        schema:step:
          type: array
          items:
            type: object
            allOf:
            - if:
                properties:
                  schema:name:
                    const: Data reduction
                required:
                - schema:name
              then:
                properties:
                  schema:additionalProperty:
                    type: array
                    items:
                      anyOf:
                      - $ref: ../../../../BaseSchema/modules/aggregation/schema.yaml#/$defs/Param_Procedure_analysisInclusionAndRejectionCriteria
                      - $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/Param_Procedure_constantsReferenceValues
                    allOf:
                    - contains:
                        $ref: ../../../../BaseSchema/modules/aggregation/schema.yaml#/$defs/Param_Procedure_analysisInclusionAndRejectionCriteria
                      minContains: 0
                      maxContains: 1
                    - contains:
                        $ref: ../../../../BaseSchema/modules/core/schema.yaml#/$defs/Param_Procedure_constantsReferenceValues
                      minContains: 0
                      maxContains: 1
          allOf:
          - contains:
              properties:
                schema:name:
                  const: Data reduction
              required:
              - schema:name
    ada:monitoredElements:
      type: array
      items:
        description: Specific elements monitored in this procedure, grouped by the target species they
          serve where they serve one. Includes elements monitored only to correct an interference, which
          serve no target species and so have no parent. The target species list is given by the Target
          Species field and is never inferred from the elements appearing here. The X-ray line, diffracting
          crystal, spectrometer assignment and counting times used for each monitored element are recorded
          in their own fields, keyed to this one.
        type: string
        readOnly: true
    ada:analyticalMode:
      type: array
      items:
        type: string
        enum:
        - EDS Point Analysis
        - EDS Mapping
        - WDS Point Analysis
        - WDS Mapping
  required:
  - ada:edsAcquisitionMode
  - ada:edsLiveTimePerPointOrPixelDefault
  - ada:stepSizePixelSizeDefault
  - ada:matrixCorrectionMethod
  - ada:massAbsorptionCoefficients
  - ada:wdsDeadTimeCorrection
