$schema: https://json-schema.org/draft/2020-12/schema
title: ADA FIB-SEM Product Profile
description: Path-driven technique-specific profile for ADA FIB-SEM Product Profile. Extends the base
  ADA product profile with the SEMFIBSEM analysis-instance detail on the schema:Dataset root, narrows
  prov:used to the semFibsemTAPP protocol, and constrains valid component types on schema:distribution.hasPart.
allOf:
- $ref: ../../../BaseSchema/adaProduct/schema.yaml
- $ref: ../detail/schema.yaml
- type: object
  properties:
    prov:wasGeneratedBy:
      description: Narrow the base prov:used to the semFibsemTAPP definition — inline, or by node @id
        — alongside the instrument.
      type: array
      items:
        type: object
        properties:
          prov:used:
            type: array
            items:
              anyOf:
              - $ref: ../../../BaseSchema/instrument/schema.yaml
              - type: object
                description: Reference by node @id to a semFibsemTAPP definition object defined elsewhere.
                properties:
                  '@id':
                    type: string
                    format: uri
                required:
                - '@id'
              - $ref: ../tapp/schema.yaml
    schema:additionalType:
      description: Must include a SEMFIBSEM product type identifier.
      contains:
        enum:
        - Focused ion beam-scanning electron microscopy
        - Scanning electron microscopy
    schema:distribution:
      description: Distribution items for adaSEMFIBSEM. Archive hasPart items must have ada:componentType
        from technique-specific or universal values.
      type: array
      items:
        type: object
        properties:
          schema:hasPart:
            items:
              type: object
              anyOf:
              - $ref: ../../../BaseSchema/adaProduct/schema.yaml#/$defs/universalComponentTypeBranch
              - properties:
                  ada:componentType:
                    type: string
                    enum:
                    - ada:FIBSEMVolume
                    - ada:FIBSEMImage
                    - ada:FIBSEMSegmentation
                    - ada:FIBSEMTabular
                required:
                - ada:componentType
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaSEMFIBSEM
