$schema: https://json-schema.org/draft/2020-12/schema
title: FIB-SEM Analysis Detail
description: Detail block for FIB-SEM hasPart items. Discriminates on ada:componentType, carries analysis-level
  required properties and an @id reference to a registered semFibsemTAPP definition, and per-dataset schema:additionalProperty
  entries constrained via $refs to the parameterValues registry plus a catch-all. Generated by tools/build_tapp.py.
type: object
properties:
  schema:measurementTechnique:
    type: array
    items:
      type: object
      properties:
        schema:identifier:
          description: Persistent identifier (DOI) assigned to this registered protocol. Enter 'pending'
            if a DOI has been applied for but not yet minted.
          type: string
  schema:contributor:
    type: array
    items:
      type: object
    allOf:
    - contains:
        properties:
          schema:roleName:
            const: analyst
        required:
        - schema:roleName
  prov:wasGeneratedBy:
    type: array
    items:
      type: object
      properties:
        schema:startDate:
          description: Date on which the analysis session began.
          type: string
        schema:endDate:
          description: Date on which the analysis session ended (if spanning multiple days).
          type: string
        schema:object:
          type: array
          items:
            type: object
          allOf:
          - contains:
              properties:
                '@type':
                  contains:
                    const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
              required:
              - '@type'
  schema:funding:
    type: array
  schema:relatedLink:
    type: array
    items:
      type: object
  ada:voxelSize:
    description: X, Y, Z dimensions of the reconstructed 3D voxel in nanometres (X-Y pixel size from SEM
      image calibration; Z from slice thickness), and the total number of slices in the stack. Determined
      at analysis time.
    type: string
required:
- schema:funding
- ada:voxelSize
