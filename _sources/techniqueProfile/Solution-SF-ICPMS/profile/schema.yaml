$schema: https://json-schema.org/draft/2020-12/schema
title: ADA Solution SF-ICP-MS Product Profile
description: Path-driven technique-specific profile for ADA Solution SF-ICP-MS Product Profile. Extends
  the base ADA product profile with the SOLUTIONSFICPMS analysis-instance detail on the schema:Dataset
  root, narrows prov:used to the solutionSficpmsTAPP protocol, and constrains valid component types on
  schema:distribution.hasPart.
allOf:
- $ref: ../../../BaseSchema/adaProduct/schema.yaml
- $ref: ../detail/schema.yaml
- type: object
  properties:
    prov:wasGeneratedBy:
      description: Narrow the base prov:used to the solutionSficpmsTAPP definition — inline, or by node
        @id — alongside the instrument.
      type: array
      items:
        type: object
        properties:
          prov:used:
            type: array
            items:
              anyOf:
              - $ref: ../../../BaseSchema/instrument/schema.yaml
              - type: object
                description: Reference by node @id to a solutionSficpmsTAPP definition object defined
                  elsewhere.
                properties:
                  '@id':
                    type: string
                    format: uri
                required:
                - '@id'
              - $ref: ../tapp/schema.yaml
    schema:additionalType:
      description: Must include a SOLUTIONSFICPMS product type identifier.
      contains:
        enum:
        - High-resolution Inductively Coupled Plasma Mass Spectroscopy (HRICPMS) Processed
        - High-resolution inductively coupled plasma mass spectrometry
    schema:distribution:
      description: Each distribution item is EITHER a monolithic single-file dataset whose ada:componentType
        is a SOLUTIONSFICPMS-specific or universal value (and may carry cdi:isStructuredBy), OR a bundle
        whose schema:hasPart members each carry such a componentType (the ADA/SAMIS archive form).
      type: array
      items:
        anyOf:
        - type: object
          required:
          - ada:componentType
          properties:
            ada:componentType:
              type: string
              anyOf:
              - $ref: ../../../BaseSchema/adaProduct/schema.yaml#/$defs/universalComponentType
              - enum: &id001
                - ada:SolutionICPMSTabular
        - type: object
          required:
          - schema:hasPart
          properties:
            schema:hasPart:
              items:
                type: object
                anyOf:
                - $ref: ../../../BaseSchema/adaProduct/schema.yaml#/$defs/universalComponentTypeBranch
                - properties:
                    ada:componentType:
                      type: string
                      enum: *id001
                  required:
                  - ada:componentType
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaSolutionSFICPMS
