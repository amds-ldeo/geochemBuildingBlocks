$schema: https://json-schema.org/draft/2020-12/schema
title: Solution SF-ICP-MS Analysis Detail
description: Dataset-level analysis-instance detail for solution SF-ICP-MS, reusing CDIF/schema.org slots
  on the schema:Dataset root.
type: object
properties:
  prov:wasGeneratedBy:
    type: array
    items:
      type: object
      properties:
        prov:used:
          type: array
          items:
            type: object
            allOf:
            - if:
                properties:
                  ada:toolRole:
                    const: acquisition
                required:
                - ada:toolRole
              then:
                properties:
                  schema:name:
                    description: Name and version of the software used to control the instrument and acquire
                      raw mass spectrum data.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
            - if:
                properties:
                  schema:additionalType:
                    contains:
                      const: ICPMS
                required:
                - schema:additionalType
              then:
                properties:
                  schema:hasPart:
                    type: array
                    items:
                      type: object
                      allOf:
                      - if:
                          properties:
                            schema:additionalType:
                              contains:
                                const: ICP Source
                          required:
                          - schema:additionalType
                        then:
                          properties:
                            schema:additionalProperty:
                              type: array
                              items:
                                anyOf:
                                - &id001
                                  title: Auxiliary Gas Flow Rate
                                  description: Flow rate of the intermediate (auxiliary) argon gas stream
                                    between torch body and injector tube (L/min).
                                  type: object
                                  properties:
                                    '@id':
                                      const: ada:parameter/solutionSficpmsTAPP/auxiliaryGasFlowRate
                                    '@type':
                                      const:
                                      - schema:PropertyValue
                                    schema:propertyID:
                                      const:
                                        '@id': ada:parameter/solutionSficpmsTAPP/auxiliaryGasFlowRate
                                    schema:name:
                                      const: Auxiliary Gas Flow Rate
                                    schema:value:
                                      anyOf:
                                      - type: number
                                      - type: string
                                    schema:unitText:
                                      type: string
                                  required:
                                  - '@id'
                                  - '@type'
                                  - schema:propertyID
                                  - schema:name
                                  - schema:value
                                  - schema:unitText
                                - &id002
                                  title: Coolant (Plasma) Gas Flow Rate
                                  description: Flow rate of the outer (coolant) argon gas stream (L/min).
                                    Influences plasma temperature and oxide ion formation.
                                  type: object
                                  properties:
                                    '@id':
                                      const: ada:parameter/solutionSficpmsTAPP/coolantGasFlowRate
                                    '@type':
                                      const:
                                      - schema:PropertyValue
                                    schema:propertyID:
                                      const:
                                        '@id': ada:parameter/solutionSficpmsTAPP/coolantGasFlowRate
                                    schema:name:
                                      const: Coolant (Plasma) Gas Flow Rate
                                    schema:value:
                                      anyOf:
                                      - type: number
                                      - type: string
                                    schema:unitText:
                                      type: string
                                  required:
                                  - '@id'
                                  - '@type'
                                  - schema:propertyID
                                  - schema:name
                                  - schema:value
                                  - schema:unitText
                                - &id003
                                  title: RF Power
                                  description: Radiofrequency forward power applied to the plasma (W).
                                    Controls ionization efficiency and oxide production rates.
                                  type: object
                                  properties:
                                    '@id':
                                      const: ada:parameter/solutionSficpmsTAPP/rfPower
                                    '@type':
                                      const:
                                      - schema:PropertyValue
                                    schema:propertyID:
                                      const:
                                        '@id': ada:parameter/solutionSficpmsTAPP/rfPower
                                    schema:name:
                                      const: RF Power
                                    schema:value:
                                      anyOf:
                                      - type: number
                                      - type: string
                                    schema:unitText:
                                      type: string
                                  required:
                                  - '@id'
                                  - '@type'
                                  - schema:propertyID
                                  - schema:name
                                  - schema:value
                                  - schema:unitText
                              allOf:
                              - contains: *id001
                                minContains: 0
                                maxContains: 1
                              - contains: *id002
                                minContains: 0
                                maxContains: 1
                              - contains: *id003
                                minContains: 0
                                maxContains: 1
                      - if:
                          properties:
                            schema:additionalType:
                              contains:
                                const: Sample Introduction System
                          required:
                          - schema:additionalType
                        then:
                          properties:
                            schema:additionalProperty:
                              type: array
                              items:
                                anyOf:
                                - &id004
                                  title: Make-up Gas Flow Rate
                                  description: Supplementary argon flow added downstream of a desolvation
                                    system to maintain total gas delivery to the plasma (L/min). Record
                                    'N/A' if no desolvation system is used. Record 'N/A' where Desolvation
                                    System is 'None'.
                                  type: object
                                  properties:
                                    '@id':
                                      const: ada:parameter/solutionSficpmsTAPP/makeUpGasFlowRate
                                    '@type':
                                      const:
                                      - schema:PropertyValue
                                    schema:propertyID:
                                      const:
                                        '@id': ada:parameter/solutionSficpmsTAPP/makeUpGasFlowRate
                                    schema:name:
                                      const: Make-up Gas Flow Rate
                                    schema:value:
                                      anyOf:
                                      - type: number
                                      - type: string
                                    schema:unitText:
                                      type: string
                                  required:
                                  - '@id'
                                  - '@type'
                                  - schema:propertyID
                                  - schema:name
                                  - schema:value
                                  - schema:unitText
                                - &id005
                                  title: Nebulizer Gas Flow Rate
                                  description: Flow rate of the carrier argon gas delivered through the
                                    nebulizer (L/min). Controls aerosol transport and strongly influences
                                    signal sensitivity and stability. Adjusted daily to optimize signal.
                                  type: object
                                  properties:
                                    '@id':
                                      const: ada:parameter/solutionSficpmsTAPP/nebulizerGasFlowRate
                                    '@type':
                                      const:
                                      - schema:PropertyValue
                                    schema:propertyID:
                                      const:
                                        '@id': ada:parameter/solutionSficpmsTAPP/nebulizerGasFlowRate
                                    schema:name:
                                      const: Nebulizer Gas Flow Rate
                                    schema:value:
                                      anyOf:
                                      - type: number
                                      - type: string
                                    schema:unitText:
                                      type: string
                                  required:
                                  - '@id'
                                  - '@type'
                                  - schema:propertyID
                                  - schema:name
                                  - schema:value
                                  - schema:unitText
                                - &id006
                                  title: Sample Uptake Rate
                                  description: Peristaltic pump speed or self-aspiration flow rate for
                                    sample introduction (µL/min or mL/min).
                                  type: object
                                  properties:
                                    '@id':
                                      const: ada:parameter/solutionSficpmsTAPP/sampleUptakeRate
                                    '@type':
                                      const:
                                      - schema:PropertyValue
                                    schema:propertyID:
                                      const:
                                        '@id': ada:parameter/solutionSficpmsTAPP/sampleUptakeRate
                                    schema:name:
                                      const: Sample Uptake Rate
                                    schema:value:
                                      anyOf:
                                      - type: number
                                      - type: string
                                    schema:unitText:
                                      type: string
                                  required:
                                  - '@id'
                                  - '@type'
                                  - schema:propertyID
                                  - schema:name
                                  - schema:value
                                  - schema:unitText
                              allOf:
                              - contains: *id004
                                minContains: 0
                                maxContains: 1
                              - contains: *id005
                                minContains: 0
                                maxContains: 1
                              - contains: *id006
                                minContains: 0
                                maxContains: 1
                      - if:
                          properties:
                            schema:additionalType:
                              contains:
                                const: Torch
                          required:
                          - schema:additionalType
                        then:
                          properties:
                            schema:additionalProperty:
                              type: array
                              items: &id007
                                title: Torch Depth
                                description: Distance between the load coil and the sampling cone tip
                                  (mm), also called injector depth or torch position depending on the
                                  instrument manufacturer. Affects ion transmission efficiency, oxide
                                  formation, and doubly-charged species production. The procedure specifies
                                  a target value optimised during initial setup; the analyst confirms
                                  or fine-adjusts during session tuning.
                                type: object
                                properties:
                                  '@id':
                                    const: ada:parameter/solutionSficpmsTAPP/torchDepth
                                  '@type':
                                    const:
                                    - schema:PropertyValue
                                  schema:propertyID:
                                    const:
                                      '@id': ada:parameter/solutionSficpmsTAPP/torchDepth
                                  schema:name:
                                    const: Torch Depth
                                  schema:value:
                                    type: string
                                required:
                                - '@id'
                                - '@type'
                                - schema:propertyID
                                - schema:name
                                - schema:value
                              allOf:
                              - contains: *id007
                                minContains: 0
                                maxContains: 1
                    allOf:
                    - contains:
                        properties:
                          schema:additionalType:
                            contains:
                              const: ICP Source
                        required:
                        - schema:additionalType
                    - contains:
                        properties:
                          schema:additionalType:
                            contains:
                              const: Sample Introduction System
                        required:
                        - schema:additionalType
                  schema:additionalProperty:
                    type: array
                    items:
                      anyOf:
                      - &id008
                        title: Doubly-Charged Species Monitor
                        description: Mass ratio monitored to estimate doubly-charged ion (M2+) formation
                          during instrument tuning. Doubly-charged ions appear at half the nominal mass
                          of the parent ion and can interfere with lighter analyte masses. In SF-ICP-MS,
                          doubly-charged species are not suppressed by collision cells and require monitoring
                          through plasma tuning. Ba2+/Ba+ (m/z 69/138) is the most common proxy.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/solutionSficpmsTAPP/doublyChargedSpeciesMonitor
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                              '@id': ada:parameter/solutionSficpmsTAPP/doublyChargedSpeciesMonitor
                          schema:name:
                            const: Doubly-Charged Species Monitor
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                      - &id009
                        title: Doubly-Charged Species Production
                        description: Measured percentage of doubly-charged ion production for the monitored
                          species at the time of instrument tuning. Record both the acceptance threshold
                          and the measured value. Elevated doubly-charged production indicates incomplete
                          ionization and potential interference on elements at approximately half the
                          mass of abundant matrix components.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/solutionSficpmsTAPP/doublyChargedSpeciesProduction
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                              '@id': ada:parameter/solutionSficpmsTAPP/doublyChargedSpeciesProduction
                          schema:name:
                            const: Doubly-Charged Species Production
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                      - &id010
                        title: Mass Resolution Setting
                        description: Mass resolution mode(s) used in this procedure. Sector-field instruments
                          allow selection of low resolution (LR; m/Δm ≈ 300–400), medium resolution (MR;
                          m/Δm ≈ 2500–5000), or high resolution (HR; m/Δm ≈ 10,000). Multi-resolution
                          procedures assign individual analytes to specific modes (documented in Group
                          4 under Mass Resolution Assignment). Procedure registers the mode(s) in use;
                          analyst confirms at session start.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/solutionSficpmsTAPP/massResolutionSetting
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                              '@id': ada:parameter/solutionSficpmsTAPP/massResolutionSetting
                          schema:name:
                            const: Mass Resolution Setting
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                      - &id011
                        title: Memory Effect Mitigation
                        description: Procedure applied to identify and minimize carry-over of high-concentration
                          elements between successive sample introductions. For solution ICP-MS, mitigation
                          is implemented primarily at measurement time through extended rinse periods
                          (see Wash Time Between Samples, Group 4). At data processing level, documents
                          any flagging or exclusion of measurements preceded by high-concentration samples
                          or standards where the required washout time may not have been achieved.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/solutionSficpmsTAPP/memoryEffectMitigation
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                              '@id': ada:parameter/solutionSficpmsTAPP/memoryEffectMitigation
                          schema:name:
                            const: Memory Effect Mitigation
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                    allOf:
                    - contains: *id008
                      minContains: 0
                      maxContains: 1
                    - contains: *id009
                      minContains: 0
                      maxContains: 1
                    - contains: *id010
                      minContains: 0
                      maxContains: 1
                    - contains: *id011
                      minContains: 0
                      maxContains: 1
                  schema:identifier:
                    description: Serial number or laboratory-internal identifier for the specific instrument
                      unit. Supports traceability to instrument service records.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
            - if:
                properties:
                  ada:toolRole:
                    const: dataReduction
                required:
                - ada:toolRole
              then:
                properties:
                  schema:name:
                    description: 'Name and version of the software used for data reduction: blank correction,
                      internal standard normalization, calibration, and concentration calculation. Include
                      version number.'
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
            - if:
                properties:
                  ada:reagentRole:
                    const: primaryStandard
                required:
                - ada:reagentRole
              then:
                properties:
                  schema:name:
                    description: Name and reference material identifier of the external calibration standard
                      used to convert signal intensities to elemental concentrations. Include the material
                      name, its source or supplier, and a citation for the accepted values used, since
                      results calibrated against different published values for the same material are
                      not directly comparable.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
            - if:
                properties:
                  ada:reagentRole:
                    const: secondaryReferenceMaterial
                required:
                - ada:reagentRole
              then:
                properties:
                  schema:name:
                    description: Reference material(s) measured as unknowns to independently assess analytical
                      accuracy. Specify material name and expected-value source.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
          allOf:
          - contains:
              properties:
                ada:toolRole:
                  const: acquisition
              required:
              - ada:toolRole
          - contains:
              properties:
                schema:additionalType:
                  contains:
                    const: ICPMS
              required:
              - schema:additionalType
          - contains:
              properties:
                ada:toolRole:
                  const: dataReduction
              required:
              - ada:toolRole
          - contains:
              properties:
                ada:reagentRole:
                  const: primaryStandard
              required:
              - ada:reagentRole
          - contains:
              properties:
                ada:reagentRole:
                  const: secondaryReferenceMaterial
              required:
              - ada:reagentRole
        schema:startDate:
          description: 'Date on which the analytical session began. For sessions spanning multiple days,
            use the date of the first session. Format: YYYY-MM-DD.'
          type: string
        schema:endDate:
          description: 'Date on which the analytical session ended. May equal Analysis Start Date for
            single-day sessions. Format: YYYY-MM-DD.'
          type: string
        schema:object:
          type: array
          items:
            type: object
            allOf:
            - if:
                properties:
                  '@type':
                    contains:
                      const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                required:
                - '@type'
              then:
                properties:
                  schema:identifier:
                    description: Globally unique, persistent identifier for each sample listed in Sample
                      Name. IGSN (International Geo Sample Number) is the recommended standard for geological
                      and cosmochemical samples, as used by Astromat, EarthChem and SESAR. Where a sample
                      and its sub-samples are separately registered, record the identifier at the level
                      actually analysed.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  schema:description:
                    description: Brief description of sample provenance, form, or preparation state relevant
                      to this analysis.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  schema:additionalProperty:
                    type: array
                    items: &id012
                      title: Sample Aliquot Mass or Volume
                      description: Mass (mg) of solid material digested or volume (mL) of liquid taken
                        for dissolution. Used for yield calculations and concentration back-calculation.
                      type: object
                      properties:
                        '@id':
                          const: ada:parameter/solutionSficpmsTAPP/sampleAliquotMassOrVolume
                        '@type':
                          const:
                          - schema:PropertyValue
                        schema:propertyID:
                          const:
                            '@id': ada:parameter/solutionSficpmsTAPP/sampleAliquotMassOrVolume
                        schema:name:
                          const: Sample Aliquot Mass or Volume
                        schema:value:
                          anyOf:
                          - type: number
                          - type: string
                        schema:unitText:
                          type: string
                      required:
                      - '@id'
                      - '@type'
                      - schema:propertyID
                      - schema:name
                      - schema:value
                      - schema:unitText
                    allOf:
                    - contains: *id012
                      minContains: 0
                      maxContains: 1
                  schema:name:
                    description: Name or identifier of each sample analysed in this session, as used in
                      the laboratory — a sample mount, section or aliquot counts as one entry where that
                      is what the laboratory tracks. The analysis record corresponds to one session and
                      may cover several samples; fields whose Keyed By column declares 'sample' take one
                      value per entry. Should match the identifier used in associated publications or
                      data tables.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
          allOf:
          - contains:
              properties:
                '@type':
                  contains:
                    const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
              required:
              - '@type'
        schema:actionProcess:
          type: object
          properties:
            schema:step:
              type: array
              items:
                type: object
                allOf:
                - if:
                    properties:
                      schema:name:
                        const: sampleDigestion
                    required:
                    - schema:name
                  then:
                    properties:
                      schema:additionalProperty:
                        type: array
                        items:
                          anyOf:
                          - &id013
                            title: Digestion Duration
                            description: Duration of the primary acid digestion step (hours or days).
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/solutionSficpmsTAPP/digestionDuration
                              '@type':
                                const:
                                - schema:PropertyValue
                              schema:propertyID:
                                const:
                                  '@id': ada:parameter/solutionSficpmsTAPP/digestionDuration
                              schema:name:
                                const: Digestion Duration
                              schema:value:
                                type: string
                            required:
                            - '@id'
                            - '@type'
                            - schema:propertyID
                            - schema:name
                            - schema:value
                          - &id014
                            title: Digestion Temperature
                            description: Temperature at which acid digestion was carried out (°C). Procedure
                              specifies the target temperature.
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/solutionSficpmsTAPP/digestionTemperature
                              '@type':
                                const:
                                - schema:PropertyValue
                              schema:propertyID:
                                const:
                                  '@id': ada:parameter/solutionSficpmsTAPP/digestionTemperature
                              schema:name:
                                const: Digestion Temperature
                              schema:value:
                                anyOf:
                                - type: number
                                - type: string
                              schema:unitText:
                                type: string
                            required:
                            - '@id'
                            - '@type'
                            - schema:propertyID
                            - schema:name
                            - schema:value
                            - schema:unitText
                        allOf:
                        - contains: *id013
                          minContains: 0
                          maxContains: 1
                        - contains: *id014
                          minContains: 0
                          maxContains: 1
                - if:
                    properties:
                      schema:name:
                        const: dataReduction
                    required:
                    - schema:name
                  then:
                    properties:
                      schema:additionalProperty:
                        type: array
                        items:
                          anyOf:
                          - &id015
                            title: Normalization / Standards-Based Correction
                            description: Post-acquisition normalization applied to output concentrations
                              relative to a reference value (e.g., correction to a BHVO-2 working value).
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/solutionSficpmsTAPP/normalizationStandardsBasedCorrection
                              '@type':
                                const:
                                - schema:PropertyValue
                              schema:propertyID:
                                const:
                                  '@id': ada:parameter/solutionSficpmsTAPP/normalizationStandardsBasedCorrection
                              schema:name:
                                const: Normalization / Standards-Based Correction
                              schema:value:
                                type: string
                            required:
                            - '@id'
                            - '@type'
                            - schema:propertyID
                            - schema:name
                            - schema:value
                          - &id016
                            title: Pulse/Analog Detector Nonlinearity Correction
                            description: Whether a correction was applied for nonlinear detector response
                              at the transition between pulse-counting and analog (and Faraday, for triple-mode
                              instruments) detection modes. For SF-ICP-MS instruments, the signal transitions
                              between pulse counting (low concentrations) and analog detection (high concentrations).
                              For triple-mode instruments (e.g., Thermo Element XR), an additional transition
                              to Faraday cup detection occurs at the highest signal intensities. Cross-calibration
                              factors between detector modes must be confirmed, typically measured each
                              session.
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/solutionSficpmsTAPP/pulseAnalogDetectorNonlinearityCorrection
                              '@type':
                                const:
                                - schema:PropertyValue
                              schema:propertyID:
                                const:
                                  '@id': ada:parameter/solutionSficpmsTAPP/pulseAnalogDetectorNonlinearityCorrection
                              schema:name:
                                const: Pulse/Analog Detector Nonlinearity Correction
                              schema:value:
                                type: string
                            required:
                            - '@id'
                            - '@type'
                            - schema:propertyID
                            - schema:name
                            - schema:value
                          - &id017
                            title: Spike / Outlier Filtering Approach
                            description: Criteria used to identify and exclude anomalous replicate measurements
                              or data points from the calculated mean.
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/solutionSficpmsTAPP/spikeOutlierFilteringApproach
                              '@type':
                                const:
                                - schema:PropertyValue
                              schema:propertyID:
                                const:
                                  '@id': ada:parameter/solutionSficpmsTAPP/spikeOutlierFilteringApproach
                              schema:name:
                                const: Spike / Outlier Filtering Approach
                              schema:value:
                                type: string
                            required:
                            - '@id'
                            - '@type'
                            - schema:propertyID
                            - schema:name
                            - schema:value
                          - &id018
                            title: Uncertainty Propagation Method
                            description: 'The approach used to propagate analytical uncertainty through
                              the data reduction chain to the final reported value. State which sources
                              are included in the propagation: counting statistics, calibration standard
                              uncertainty, internal standard uncertainty, drift correction, and any systematic
                              contributions. Distinct from Uncertainty Level, which states the convention
                              at which the resulting uncertainty is quoted.'
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/solutionSficpmsTAPP/uncertaintyPropagationMethod
                              '@type':
                                const:
                                - schema:PropertyValue
                              schema:propertyID:
                                const:
                                  '@id': ada:parameter/solutionSficpmsTAPP/uncertaintyPropagationMethod
                              schema:name:
                                const: Uncertainty Propagation Method
                              schema:value:
                                type: string
                            required:
                            - '@id'
                            - '@type'
                            - schema:propertyID
                            - schema:name
                            - schema:value
                          - &id019
                            title: Constants and Reference Values Used
                            description: Physical constants and reference values used in data reduction
                              to calculate the final reported quantity (e.g., decay constants for age
                              calculation, standard isotope ratios, or other citable reference values
                              used in a correction or calculation), together with their source. Distinct
                              from the Group 6 reference-material fields, which document accepted values
                              for specific calibration/validation materials rather than universal physical
                              constants. Record "None" if no citable, revisable physical constants feed
                              into this procedure's data reduction.
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/solutionSficpmsTAPP/constantsAndReferenceValuesUsed
                              '@type':
                                const:
                                - schema:PropertyValue
                              schema:propertyID:
                                const:
                                  '@id': ada:parameter/solutionSficpmsTAPP/constantsAndReferenceValuesUsed
                              schema:name:
                                const: Constants and Reference Values Used
                              schema:value:
                                type: string
                            required:
                            - '@id'
                            - '@type'
                            - schema:propertyID
                            - schema:name
                            - schema:value
                        allOf:
                        - contains: *id015
                          minContains: 0
                          maxContains: 1
                        - contains: *id016
                          minContains: 0
                          maxContains: 1
                        - contains: *id017
                          minContains: 0
                          maxContains: 1
                        - contains: *id018
                          minContains: 0
                          maxContains: 1
                        - contains: *id019
                          minContains: 0
                          maxContains: 1
              allOf:
              - contains:
                  properties:
                    schema:name:
                      const: sampleDigestion
                  required:
                  - schema:name
              - contains:
                  properties:
                    schema:name:
                      const: dataReduction
                  required:
                  - schema:name
        schema:location:
          type: object
          properties:
            schema:name:
              description: Name of the laboratory or institution hosting the instrument.
              type: string
            schema:identifier:
              description: Persistent identifier for the laboratory (e.g., ROR ID).
              type: string
        schema:additionalProperty:
          type: array
          items: &id020
            title: Signal Integration Time
            description: Total integration time per analyte per replicate (s). Determined at analysis
              time from the actual acquisition.
            type: object
            properties:
              '@id':
                const: ada:parameter/solutionSficpmsTAPP/signalIntegrationTime
              '@type':
                const:
                - schema:PropertyValue
              schema:propertyID:
                const:
                  '@id': ada:parameter/solutionSficpmsTAPP/signalIntegrationTime
              schema:name:
                const: Signal Integration Time
              schema:value:
                anyOf:
                - type: number
                - type: string
              schema:unitText:
                type: string
            required:
            - '@id'
            - '@type'
            - schema:propertyID
            - schema:name
            - schema:value
            - schema:unitText
          allOf:
          - contains: *id020
            minContains: 0
            maxContains: 1
        schema:description:
          description: 'Any procedure- or analysis-specific information not captured by a structured field
            anywhere in this TAPP — including anomalies, deviations from the registered procedure, instrument
            modifications, and supplementary context. Scope is the whole document, not Group 6: this is
            the last field of the TAPP and covers all six groups. Use sparingly; a structured field is
            preferred for anything that can be formally categorised.'
          type: string
  schema:measurementTechnique:
    type: array
    items:
      type: object
      properties:
        schema:identifier:
          description: DOI or unique persistent identifier for the registered procedure used in this analysis,
            generated upon procedure submission to a data repository. This field is mandatory when submitting
            analytical data, to encourage formal procedure registration and ensure traceability. If a
            DOI has been applied for but not yet minted, enter "pending".
          type: string
  schema:contributor:
    type: array
    items:
      type: object
      allOf:
      - if:
          properties:
            schema:roleName:
              const: analyst
          required:
          - schema:roleName
        then:
          properties:
            schema:name:
              description: Name(s) of the analyst(s) who performed the analysis session. ORCID is recommended
                for persistent identification.
              anyOf:
              - type: string
              - type: array
                items:
                  type: string
    allOf:
    - contains:
        properties:
          schema:roleName:
            const: analyst
        required:
        - schema:roleName
  schema:funding:
    type: array
  schema:relatedLink:
    type: array
    items:
      type: object
      allOf:
      - if:
          properties:
            schema:linkRelationship:
              const: coupledProcedure
          required:
          - schema:linkRelationship
        then:
          properties:
            schema:target:
              type: object
              properties:
                schema:url:
                  description: Registered procedure DOI for the coupled technique named above. Provides
                    a stable, citable link to the companion method independent of whether a dataset has
                    been deposited. If the coupled procedure has not yet been registered, enter the DOI
                    of a publication describing the coupled method, or "pending". Enter "None" if no coupling
                    is planned.
                  type: string
      - if:
          properties:
            schema:linkRelationship:
              const: coupledDataset
          required:
          - schema:linkRelationship
        then:
          properties:
            schema:target:
              description: 'DOI or other persistent identifier for the co-registered dataset or publication
                where both datasets are reported together. Accepts: a dedicated dataset DOI (if separately
                deposited), a shared dataset DOI (if co-submitted in the same package), or a publication
                DOI. Use "same submission" if the coupled dataset is included in this data package, or
                "pending" if not yet assigned. If coupling is documented through a shared sample identifier
                only, that information is already captured in Sample Persistent Identifier (Group 2).'
              anyOf:
              - type: string
              - type: array
                items:
                  type: string
      - if:
          properties:
            schema:linkRelationship:
              const: coupledTechnique
          required:
          - schema:linkRelationship
        then:
          properties:
            schema:target:
              type: object
              properties:
                schema:name:
                  description: Other analytical techniques applied to the same sample(s) whose results
                    are intended to be interpreted together with data from this procedure. Document coupling
                    with any technique whose results are functionally linked to this dataset — providing
                    calibration inputs, complementary spatial context, or required companion measurements.
                    Use the same controlled vocabulary as the Technique field. Enter "None" if no coupling
                    is intended.
                  type: string
                  enum:
                  - Solution MC-ICP-MS
                  - TIMS
                  - LA-ICP-MS
                  - EPMA
                  - Noble Gas MS
                  - INAA
                  - None
                  - N/A
                schema:description:
                  description: 'Description of how this procedure is coupled with the technique(s) listed
                    above. Include: (1) the functional relationship — what data or context flows between
                    techniques, or how results are combined (e.g. which output from the coupled technique
                    serves as input to data reduction for this technique); and (2) the analytical sequence
                    — which technique is performed first and why (e.g. non-destructive before destructive).
                    Required when Coupled Technique(s) is not "None".'
                  type: string
  dqv:hasQualityMeasurement:
    type: array
    items:
      type: object
      allOf:
      - if:
          properties:
            dqv:isMeasurementOf:
              const: Oxide production ratio
          required:
          - dqv:isMeasurementOf
        then:
          properties:
            dqv:value:
              description: Measured oxide production ratio obtained during session-start tuning, for the
                proxy specified in Oxide Production Method and Threshold. Record the measured value and
                confirm whether the procedure threshold was met.
              anyOf:
              - type: string
              - type: array
                items:
                  type: string
    allOf:
    - contains:
        properties:
          dqv:isMeasurementOf:
            const: Oxide production ratio
        required:
        - dqv:isMeasurementOf
required:
- schema:funding
