$schema: https://json-schema.org/draft/2020-12/schema
title: Solution SF-ICP-MS Technique-Aligned Protocol Profile (solutionSficpmsTAPP)
description: Solution sector-field (high-resolution) ICP-MS extension of the base TAPP definition, generated
  from docs/Solution_SF-ICP-MS_TAPP_v5.xlsx via the path-driven pipeline.
allOf:
- $ref: ../../../BaseSchema/tappDefinition/schema.yaml
- type: object
  properties:
    schema:name:
      description: A short descriptive name for this analytical protocol. Should include instrument, technique,
        and analyte scope.
      type: string
      readOnly: true
    schema:measurementTechnique:
      type: array
      items:
        type: object
        properties:
          schema:termCode:
            description: Top-level analytical technique identifier.
            type: string
            enum:
            - Solution SF-ICP-MS
            readOnly: true
    schema:creator:
      type: object
      properties:
        schema:name:
          description: Person(s) or laboratory responsible for developing and registering this protocol.
          type: string
          readOnly: true
    bios:computationalTool:
      type: array
      items:
        type: object
      allOf:
      - contains:
          properties:
            ada:toolRole:
              const: acquisition
          required:
          - ada:toolRole
      - contains:
          properties:
            ada:toolRole:
              const: dataReduction
          required:
          - ada:toolRole
    ada:analyteTemplate:
      type: object
      properties:
        ada:defaultAnalytes:
          type: array
          items:
            description: Elements or isotopes this protocol is designed to measure. The protocol registers
              the full analyte suite; at analysis level, the analyst records the specific subset actually
              measured in the session, which may be narrower if certain masses were excluded due to interferences
              or scope reduction. Fields flagged as Analyte-Specific in the Comments column apply individually
              to each element or isotope in this list.
            type: string
        ada:analyteColumns:
          type: array
          items:
            type: object
            properties: {}
    schema:datePublished:
      description: First date this protocol configuration was used in production.
      type: string
      readOnly: true
    schema:funding:
      type: array
      items:
        type: object
        properties:
          schema:name:
            description: Grants and funding that supported development of this protocol. Include grant
              IDs.
            type: string
            readOnly: true
    schema:relatedLink:
      type: array
      items:
        type: object
    schema:instrument:
      type: array
      items:
        type: object
      allOf:
      - contains:
          properties:
            schema:additionalType:
              contains:
                const: ICPMS
          required:
          - schema:additionalType
    schema:object:
      type: array
      items:
        type: object
      allOf:
      - contains:
          properties:
            '@type':
              contains:
                const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
          required:
          - '@type'
    schema:actionProcess:
      type: object
      properties:
        schema:step:
          type: array
          items:
            type: object
          allOf:
          - contains:
              properties:
                schema:name:
                  const: samplePreparation
              required:
              - schema:name
          - contains:
              properties:
                schema:name:
                  const: sampleDigestion
              required:
              - schema:name
    ada:finalSolutionMatrix:
      description: 'Acid type and concentration of the final dissolved sample solution introduced to the
        instrument. Directly affects instrument response and ion transmission. Note: some SF-ICP-MS protocols
        add trace HF to final solution to stabilize HFSE.'
      type: string
      readOnly: true
    ada:chromatographicSeparationApplied:
      description: Whether chromatographic separation of element groups (e.g., using ion exchange resin)
        was performed prior to ICP-MS analysis. Common for protocols requiring matrix removal or interference
        elimination before measurement (e.g., Fe and Cu–Zn for isotope dilution, Hf separation from REE).
        Record resin type and matrix conditions if applied. Record 'None' if direct digestion solution
        is analyzed.
      type: string
      enum:
      - Anion exchange resin (HCl)
      - Cation exchange resin
      - AG1-X8 (HBr)
      - None
      - N/A
      readOnly: true
    ada:isotopeDilutionSpike:
      description: Isotopic spike material added to the sample before or during digestion for isotope
        dilution (ID) analysis. Spike must be added before digestion for complete equilibration. Record
        spike name or certificate reference and spike isotope(s). Record 'None' if ID technique is not
        used.
      type: string
      readOnly: true
    schema:additionalProperty:
      type: array
      items:
        anyOf:
        - title: Desolvation System
          description: Desolvating nebulizer or membrane desolvator used upstream of the plasma to reduce
            solvent load. Reduces oxide production rates and increases sensitivity for selected element
            groups. Specific systems (e.g., Aridus-I) are often assigned to particular element fractions
            in multi-fraction protocols. Record 'None' if not used.
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionSficpmsTAPP/desolvationSystem
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/solutionSficpmsTAPP/desolvationSystem
            schema:name:
              const: Desolvation System
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: E-scan Range
          description: Electric scan range used for peak acquisition, expressed as percentage of the center
            mass (%). Varies the accelerating voltage to cover masses in the vicinity of the set magnetic
            mass without re-scanning the magnet. Record 'N/A' if E-scan acquisition is not used.
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionSficpmsTAPP/eScanRange
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/solutionSficpmsTAPP/eScanRange
            schema:name:
              const: E-scan Range
            schema:value:
              anyOf:
              - type: number
              - type: string
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          - schema:unitText
          readOnly: true
        - title: Triple Scanning Mode
          description: Whether each mass peak is scanned three times per cycle and the results averaged
            (Y/N). Used to reduce noise from short-term magnetic field instabilities. Record 'N/A' if
            not applicable to the instrument.
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionSficpmsTAPP/tripleScanningMode
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/solutionSficpmsTAPP/tripleScanningMode
            schema:name:
              const: Triple Scanning Mode
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: Internal Standard Concentration
          description: Target concentration of internal standard element(s) in all measured solutions
            (µg/L or ppb).
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionSficpmsTAPP/internalStandardConcentration
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/solutionSficpmsTAPP/internalStandardConcentration
            schema:name:
              const: Internal Standard Concentration
            schema:value:
              anyOf:
              - type: number
              - type: string
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          - schema:unitText
          readOnly: true
        - &id001
          title: Spike/Outlier Filtering Approach
          description: Criteria used to identify and exclude anomalous replicate measurements or data
            points from the calculated mean.
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionSficpmsTAPP/spikeOutlierFilteringApproachDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: spikeOutlierFilteringApproachDefault
            schema:name:
              const: Spike/Outlier Filtering Approach
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id002
          title: Uncertainty Propagation Method
          description: Method used to propagate analytical uncertainties from raw signals through to final
            concentration values.
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionSficpmsTAPP/uncertaintyPropagationMethodDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: uncertaintyPropagationMethodDefault
            schema:name:
              const: Uncertainty Propagation Method
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
      allOf:
      - contains:
          title: Desolvation System
          description: Desolvating nebulizer or membrane desolvator used upstream of the plasma to reduce
            solvent load. Reduces oxide production rates and increases sensitivity for selected element
            groups. Specific systems (e.g., Aridus-I) are often assigned to particular element fractions
            in multi-fraction protocols. Record 'None' if not used.
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionSficpmsTAPP/desolvationSystem
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/solutionSficpmsTAPP/desolvationSystem
            schema:name:
              const: Desolvation System
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: E-scan Range
          description: Electric scan range used for peak acquisition, expressed as percentage of the center
            mass (%). Varies the accelerating voltage to cover masses in the vicinity of the set magnetic
            mass without re-scanning the magnet. Record 'N/A' if E-scan acquisition is not used.
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionSficpmsTAPP/eScanRange
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/solutionSficpmsTAPP/eScanRange
            schema:name:
              const: E-scan Range
            schema:value:
              anyOf:
              - type: number
              - type: string
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          - schema:unitText
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: Triple Scanning Mode
          description: Whether each mass peak is scanned three times per cycle and the results averaged
            (Y/N). Used to reduce noise from short-term magnetic field instabilities. Record 'N/A' if
            not applicable to the instrument.
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionSficpmsTAPP/tripleScanningMode
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/solutionSficpmsTAPP/tripleScanningMode
            schema:name:
              const: Triple Scanning Mode
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: Internal Standard Concentration
          description: Target concentration of internal standard element(s) in all measured solutions
            (µg/L or ppb).
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionSficpmsTAPP/internalStandardConcentration
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/solutionSficpmsTAPP/internalStandardConcentration
            schema:name:
              const: Internal Standard Concentration
            schema:value:
              anyOf:
              - type: number
              - type: string
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          - schema:unitText
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains: *id001
        minContains: 0
        maxContains: 1
      - contains: *id002
        minContains: 0
        maxContains: 1
    schema:location:
      type: object
      properties:
        schema:name:
          description: Name of the laboratory or institution hosting the instrument.
          type: string
        schema:identifier:
          description: Persistent identifier for the laboratory (e.g., ROR ID).
          type: string
    ada:numberOfScansPerReplicate:
      description: Number of complete mass scans accumulated per analytical replicate.
      anyOf:
      - type: integer
      - type: string
      readOnly: true
    ada:numberOfReplicatesPerSample:
      description: Number of discrete replicate measurements acquired per sample solution.
      anyOf:
      - type: integer
      - type: string
      readOnly: true
    ada:sampleSequenceDesign:
      description: 'Description of the measurement order within a session: how samples, blanks, calibration
        standards, and reference materials are interleaved.'
      type: string
      readOnly: true
    ada:washTimeBetweenSamples:
      description: Duration of instrument rinse between successive sample solutions (seconds). Controls
        carryover and memory effects.
      anyOf:
      - type: number
      - type: string
      readOnly: true
    ada:internalStandardElement:
      description: Element(s) added at a known concentration to all solutions (samples, blanks, calibration
        standards) and used as internal standards for drift correction and matrix normalization. Specify
        element and monitored isotope.
      type: string
      readOnly: true
    ada:oxideProductionMethodAndThreshold:
      description: Method used to quantify plasma oxide production and the acceptance threshold applied
        before commencing analysis. For solution SF-ICP-MS, CeO+/Ce+ (m/z 156/140) is the standard monitor
        proxy; stricter thresholds than Q-ICP-MS are commonly required. BaO+/Ba+ may also be monitored.
        Record both the monitored mass ratio(s) and the maximum allowed threshold(s). Measured values
        are recorded in Oxide Production.
      type: string
      readOnly: true
    ada:primaryStandardName:
      description: Name and reference material identifier of the external calibration standard used to
        convert signal intensities to elemental concentrations.
      type: string
    ada:internalStandardApproach:
      description: 'Role(s) assigned to the internal standard(s) in data reduction: drift correction only,
        matrix normalization, or a combination.'
      type: string
      enum:
      - Drift correction only
      - Matrix normalization
      - Drift + matrix normalization
      - N/A
      - None
      readOnly: true
    ada:driftCorrectionMethod:
      description: Method used to correct for instrumental signal drift across a session.
      type: string
      enum:
      - IS normalization
      - Standard bracketing
      - IS normalization + bracketing
      - None
      - N/A
      readOnly: true
    ada:perAnalyteCalibrationStrategy:
      type: array
      items:
        description: Approach used to convert measured ion signals to elemental concentrations. Documents
          cases where different analytes or analyte groups are calibrated using different strategies within
          the same protocol. If a single strategy is applied uniformly to all analytes, record that strategy.
        type: string
        enum:
        - External calibration (all analytes)
        - Isotope dilution (all analytes)
        - Matrix-matched bracketing with BHVO-2
        - ID for REE; external calibration for transition metals
        - N/A
        - None
        readOnly: true
    ada:signalIntegrationIntervalMethod:
      description: Method used to define the integration window for each replicate measurement (e.g.,
        full acquisition time, stable-interval selection, automated criteria).
      type: string
      enum:
      - Full replicate
      - Stable interval selection
      - Automated peak detection
      - N/A
      - None
      readOnly: true
    ada:blankBackgroundCorrectionMethod:
      description: Method used to subtract instrument background and/or procedural blank from sample signals.
      type: string
      enum:
      - On-peak zero
      - Solution blank
      - Procedural blank
      - N/A
      - None
      readOnly: true
    ada:isotopeDilutionDataReductionMethod:
      description: Mass balance approach used to calculate sample mass fractions from spike–sample isotope
        ratio measurements. Spike must have been added before digestion for accurate equilibration. Record
        'None' if isotope dilution is not used.
      type: string
      readOnly: true
    ada:secondaryReferenceMaterial:
      type: array
      items:
        description: Reference material(s) measured as unknowns to independently assess analytical accuracy.
          Specify material name and expected-value source.
        type: string
    ada:calibrationMeasurementFrequency:
      description: How often the primary calibration standard is measured relative to unknown samples
        within a session.
      type: string
      readOnly: true
    schema:description:
      description: Any protocol- or analysis-specific information not captured by other fields, including
        anomalies, deviations from protocol, or supplementary context.
      type: string
  required:
  - schema:name
  - schema:datePublished
  - ada:finalSolutionMatrix
  - ada:chromatographicSeparationApplied
  - ada:isotopeDilutionSpike
  - ada:numberOfScansPerReplicate
  - ada:numberOfReplicatesPerSample
  - ada:sampleSequenceDesign
  - ada:washTimeBetweenSamples
  - ada:internalStandardElement
  - ada:oxideProductionMethodAndThreshold
  - ada:primaryStandardName
  - ada:internalStandardApproach
  - ada:driftCorrectionMethod
  - ada:signalIntegrationIntervalMethod
  - ada:blankBackgroundCorrectionMethod
  - ada:isotopeDilutionDataReductionMethod
  - ada:calibrationMeasurementFrequency
