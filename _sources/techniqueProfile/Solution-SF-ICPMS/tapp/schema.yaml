                    description: Measured percentage of doubly-charged ion production for the monitored
                      species at the time of instrument tuning. Record both the acceptance threshold and
                      the measured value. Elevated doubly-charged production indicates incomplete ionization
                      and potential interference on elements at approximately half the mass of abundant
                      matrix components.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/solutionSficpmsTAPP/doublyChargedSpeciesProductionDefault
                      '@type':
