                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                  - &id023
                    title: Mass Resolution Setting
                    description: Mass resolution mode(s) used in this protocol. Sector-field instruments
                      allow selection of low resolution (LR; m/Δm ≈ 300–400), medium resolution (MR; m/Δm
                      ≈ 2500–5000), or high resolution (HR; m/Δm ≈ 10,000). Multi-resolution protocols
                      assign individual analytes to specific modes (documented in Group 4 under Mass Resolution
                      per Analyte). Protocol registers the mode(s) in use; analyst confirms at session
                      start.
                    type: object
                    properties:
