                    title: Doubly-Charged Species Monitor
                    description: Mass ratio monitored to estimate doubly-charged ion (M2+) formation during
                      instrument tuning. Doubly-charged ions appear at half the nominal mass of the parent
                      ion and can interfere with lighter analyte masses. In SF-ICP-MS, doubly-charged
                      species are not suppressed by collision cells and require monitoring through plasma
                      tuning. Ba2+/Ba+ (m/z 69/138) is the most common proxy.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/solutionSficpmsTAPP/doublyChargedSpeciesMonitorDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: doublyChargedSpeciesMonitorDefault
                      schema:name:
                        const: Doubly-Charged Species Monitor
                      ada:dataType:
                        const: string
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
                        const: R
                    required:
                    - '@id'
                    - '@type'
                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                  - title: Detector Configuration
                    description: 'Type(s) of detector(s) installed in the mass spectrometer and the detection
                      mode(s) used. SF-ICP-MS instruments typically use a single SEM. Some instruments
                      (e.g., Thermo Element XR) support triple mode: pulse counting for low signals, analog
                      for mid-range signals, and Faraday cup for high signals. The cross-calibration correction
                      between detector modes is documented in Group 5.'
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/solutionSficpmsTAPP/detectorConfiguration
                      '@type':
                        const:
                        - schema:PropertyValue
