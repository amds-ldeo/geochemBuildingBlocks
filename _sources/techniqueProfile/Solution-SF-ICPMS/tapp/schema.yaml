              schema:model:
                type: object
                properties:
                  schema:name:
                    description: Manufacturer and model name of the sector-field ICP-MS instrument (e.g.,
                      Thermo Element 2, Thermo Element XR, Nu Instruments Attom HR). Determines available
                      mass resolution modes and detector configuration.
                    type: string
