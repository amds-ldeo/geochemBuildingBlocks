                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                  - &id024
                    title: Memory Effect Mitigation
                    description: Protocol applied to identify and minimize carry-over of high-concentration
                      elements between successive sample introductions. For solution ICP-MS, mitigation
                      is implemented primarily at measurement time through extended rinse periods (see
                      Wash Time Between Samples, Group 4). At data processing level, documents any flagging
                      or exclusion of measurements preceded by high-concentration samples or standards
                      where the required washout time may not have been achieved.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/solutionSficpmsTAPP/memoryEffectMitigationDefault
