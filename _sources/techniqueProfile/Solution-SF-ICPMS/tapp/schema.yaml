$schema: https://json-schema.org/draft/2020-12/schema
title: Solution SF-ICP-MS Technique-Aligned Protocol Profile (solutionSficpmsTAPP)
description: Solution sector-field (high-resolution) ICP-MS extension of the base TAPP definition, generated
  from docs/Solution_SF-ICP-MS_TAPP_v5.xlsx via the path-driven pipeline.
allOf:
- $ref: ../../../BaseSchema/tappDefinition/schema.yaml
- type: object
  properties:
    schema:name:
      description: A short descriptive name for this analytical protocol. Should include instrument, technique,
        and analyte scope.
      type: string
      readOnly: true
    schema:measurementTechnique:
      type: array
      items:
        type: object
        properties:
          schema:termCode:
            description: Top-level analytical technique identifier.
            type: string
            enum:
            - Solution SF-ICP-MS
            readOnly: true
    schema:creator:
      type: object
      properties:
        schema:name:
          description: Person(s) or laboratory responsible for developing and registering this protocol.
          type: string
          readOnly: true
    bios:computationalTool:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              ada:toolRole:
                const: acquisition
            required:
            - ada:toolRole
          then:
            properties:
              schema:name:
                description: Name and version of the software used to control the instrument and acquire
                  raw mass spectrum data.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
        - if:
            properties:
              ada:toolRole:
                const: dataReduction
            required:
            - ada:toolRole
          then:
            properties:
              schema:name:
                description: 'Name and version of the software used for data reduction: blank correction,
                  internal standard normalization, calibration, and concentration calculation. Include
                  version number.'
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
      allOf:
      - contains:
          properties:
            ada:toolRole:
              const: acquisition
          required:
          - ada:toolRole
      - contains:
          properties:
            ada:toolRole:
              const: dataReduction
          required:
          - ada:toolRole
    ada:analyteTemplate:
      type: object
      properties:
        ada:defaultAnalytes:
          type: array
          items:
            description: Elements or isotopes this protocol is designed to measure. The protocol registers
              the full analyte suite; at analysis level, the analyst records the specific subset actually
              measured in the session, which may be narrower if certain masses were excluded due to interferences
              or scope reduction. Fields flagged as Analyte-Specific in the Comments column apply individually
              to each element or isotope in this list.
            type: string
        ada:analyteColumns:
          type: array
          items:
            anyOf:
            - $ref: ../../../BaseSchema/tappDefinition/schema.yaml#/$defs/AnalyteIdentifierColumn
            - &id001
              title: Monitored Isotopes
              description: Specific isotope(s) monitored per analyte element in this protocol, including
                any interference-monitor masses. Analyte-specific field.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/solutionSficpmsTAPP/monitoredIsotopes
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: monitoredIsotopes
                schema:name:
                  const: Monitored Isotopes
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id002
              title: Mass Resolution per Analyte
              description: Mass resolution mode assigned to each analyte in this protocol. The selected
                resolution determines which polyatomic interferences are physically resolved by the magnet
                sector. Per-analyte assignments are documented here; the overall mode(s) used in the protocol
                are recorded in Mass Resolution Setting (Group 3). Analyte-specific field.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/solutionSficpmsTAPP/massResolutionPerAnalyte
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: massResolutionPerAnalyte
                schema:name:
                  const: Mass Resolution per Analyte
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id003
              title: Dwell Time per Mass
              description: Integration time spent on each mass peak per sweep (ms). May differ per analyte
                if analyte-specific dwell times are programmed.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/solutionSficpmsTAPP/dwellTimePerMass
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: dwellTimePerMass
                schema:name:
                  const: Dwell Time per Mass
                ada:dataType:
                  const: number
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  anyOf:
                  - type: number
                  - type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id004
              title: Isobaric Interference Corrections Applied
              description: Whether mathematical corrections for residual isobaric or polyatomic interferences
                are applied in data reduction (supplementary to any interference suppression achieved
                through mass resolution selection).
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/solutionSficpmsTAPP/isobaricInterferenceCorrectionsApplied
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: isobaricInterferenceCorrectionsApplied
                schema:name:
                  const: Isobaric Interference Corrections Applied
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id005
              title: Interfering Species
              description: List of isobaric or polyatomic species mathematically corrected in data reduction.
                In SF-ICP-MS, mass resolution is the primary interference mitigation strategy; mathematical
                corrections address residual interferences not resolved at the operating resolution. Analyte-specific.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/solutionSficpmsTAPP/interferingSpecies
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: interferingSpecies
                schema:name:
                  const: Interfering Species
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id006
              title: Interference Correction Method
              description: Mathematical approach used to calculate and remove residual interference contributions
                from measured signals. In SF-ICP-MS, interference solutions isolating specific polyatomic
                species are measured alongside samples and used to calibrate correction factors.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/solutionSficpmsTAPP/interferenceCorrectionMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: interferenceCorrectionMethod
                schema:name:
                  const: Interference Correction Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
              - schema:defaultValue
            - &id007
              title: Detection Limit
              description: Elemental detection limits for each analyte. Specify units (µg/g or µg/L) and
                whether values are protocol-typical estimates or session-specific measured values.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/solutionSficpmsTAPP/detectionLimit
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: detectionLimit
                schema:name:
                  const: Detection Limit
                ada:dataType:
                  const: number
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  anyOf:
                  - type: number
                  - type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id008
              title: Detection Limit Method
              description: Method used to calculate detection limits for each analyte.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/solutionSficpmsTAPP/detectionLimitMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: detectionLimitMethod
                schema:name:
                  const: Detection Limit Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id009
              title: Limit of Quantification (LOQ) Method
              description: Method used to determine the limit of quantification.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/solutionSficpmsTAPP/limitOfQuantificationMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: limitOfQuantificationMethod
                schema:name:
                  const: Limit of Quantification (LOQ) Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id010
              title: Within-Session Analytical Precision and Assessment Method
              description: Precision of repeated measurements within a single analysis session and the
                method used to assess it (e.g., %RSD of replicate standard or reference material measurements).
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/solutionSficpmsTAPP/withinSessionAnalyticalPrecisionAndAssessmentMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: withinSessionAnalyticalPrecisionAndAssessmentMethod
                schema:name:
                  const: Within-Session Analytical Precision and Assessment Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id011
              title: Between-Session (Long-Term) Analytical Precision and Assessment Method
              description: Precision of measurements across multiple analysis sessions (long-term reproducibility)
                and the assessment method.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/solutionSficpmsTAPP/betweenSessionAnalyticalPrecisionAndAssessmentMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: betweenSessionAnalyticalPrecisionAndAssessmentMethod
                schema:name:
                  const: Between-Session (Long-Term) Analytical Precision and Assessment Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id012
              title: Analytical Accuracy and Assessment Method
              description: Accuracy of final concentration measurements relative to certified or consensus
                values and the method used to assess it.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/solutionSficpmsTAPP/analyticalAccuracyAndAssessmentMethod
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: analyticalAccuracyAndAssessmentMethod
                schema:name:
                  const: Analytical Accuracy and Assessment Method
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: false
                ada:tier:
                  const: R
                schema:defaultValue:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
          allOf:
          - contains: *id001
            minContains: 0
            maxContains: 1
          - contains: *id002
            minContains: 0
            maxContains: 1
          - contains: *id003
            minContains: 0
            maxContains: 1
          - contains: *id004
            minContains: 0
            maxContains: 1
          - contains: *id005
            minContains: 0
            maxContains: 1
          - contains: *id006
            minContains: 0
            maxContains: 1
          - contains: *id007
            minContains: 0
            maxContains: 1
          - contains: *id008
            minContains: 0
            maxContains: 1
          - contains: *id009
            minContains: 0
            maxContains: 1
          - contains: *id010
            minContains: 0
            maxContains: 1
          - contains: *id011
            minContains: 0
            maxContains: 1
          - contains: *id012
            minContains: 0
            maxContains: 1
    schema:datePublished:
      description: First date this protocol configuration was used in production.
      type: string
      readOnly: true
    schema:funding:
      type: array
      items:
        type: object
        properties:
          schema:name:
            description: Grants and funding that supported development of this protocol. Include grant
              IDs.
            type: string
            readOnly: true
    schema:relatedLink:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              schema:linkRelationship:
                const: techniquePublication
            required:
            - schema:linkRelationship
          then:
            properties:
              schema:target:
                type: object
                properties:
                  schema:name:
                    description: DOI or URL for publications or reports describing or evaluating this
                      protocol.
                    type: string
                    readOnly: true
        - if:
            properties:
              schema:linkRelationship:
                const: coupledTechnique
            required:
            - schema:linkRelationship
          then:
            properties:
              schema:target:
                type: object
                properties:
                  schema:name:
                    description: Other analytical techniques applied to the same sample(s) whose results
                      are intended to be interpreted together with data from this protocol. Document coupling
                      with any technique whose results are functionally linked to this dataset (e.g.,
                      providing calibration inputs, complementary spatial context, or required companion
                      measurements).
                    type: string
                  schema:description:
                    description: Describes (1) the functional relationship between this dataset and the
                      coupled technique — what data or context flows between them — and (2) the analytical
                      sequence — which technique was performed first and why. Required when Coupled Technique(s)
                      is not 'None'.
                    type: string
    schema:instrument:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              schema:additionalType:
                contains:
                  const: ICPMS
            required:
            - schema:additionalType
          then:
            properties:
              schema:hasPart:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: ICP Source
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items:
                            anyOf:
                            - &id013
                              title: Auxiliary Gas Flow Rate
                              description: Flow rate of the intermediate (auxiliary) argon gas stream
                                between torch body and injector tube (L/min).
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/solutionSficpmsTAPP/auxiliaryGasFlowRateDefault
                                '@type':
                                  const:
                                  - schema:PropertyValueSpecification
                                schema:valueName:
                                  const: auxiliaryGasFlowRateDefault
                                schema:name:
                                  const: Auxiliary Gas Flow Rate
                                ada:dataType:
                                  const: number
                                ada:fieldScope:
                                  const: session
                                schema:readonlyValue:
                                  const: false
                                ada:tier:
                                  const: R
                                schema:unitText:
                                  const: L/min
                              required:
                              - '@id'
                              - '@type'
                              - schema:valueName
                              - schema:name
                              - ada:dataType
                              - ada:fieldScope
                            - &id014
                              title: Coolant (Plasma) Gas Flow Rate
                              description: Flow rate of the outer (coolant) argon gas stream (L/min).
                                Influences plasma temperature and oxide ion formation.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/solutionSficpmsTAPP/coolantGasFlowRateDefault
                                '@type':
                                  const:
                                  - schema:PropertyValueSpecification
                                schema:valueName:
                                  const: coolantGasFlowRateDefault
                                schema:name:
                                  const: Coolant (Plasma) Gas Flow Rate
                                ada:dataType:
                                  const: number
                                ada:fieldScope:
                                  const: session
                                schema:readonlyValue:
                                  const: false
                                ada:tier:
                                  const: R
                                schema:unitText:
                                  const: L/min
                              required:
                              - '@id'
                              - '@type'
                              - schema:valueName
                              - schema:name
                              - ada:dataType
                              - ada:fieldScope
                            - title: Plasma Thermal Mode
                              description: Whether the ICP plasma is operated under cool plasma or normal
                                (hot) plasma conditions. Normal plasma (>1000 W RF) is standard for most
                                solution SF-ICP-MS analyses. Cool plasma (≤900 W RF) reduces argide-based
                                interferences (e.g., 40Ar12C+ on 52Cr) at the cost of reduced sensitivity
                                and ionization efficiency for most elements.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/solutionSficpmsTAPP/plasmaThermalMode
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                    '@id': ada:parameter/solutionSficpmsTAPP/plasmaThermalMode
                                schema:name:
                                  const: Plasma Thermal Mode
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                              readOnly: true
                            - &id015
                              title: RF Power
                              description: Radiofrequency forward power applied to the plasma (W). Controls
                                ionization efficiency and oxide production rates.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/solutionSficpmsTAPP/rfPowerDefault
                                '@type':
                                  const:
                                  - schema:PropertyValueSpecification
                                schema:valueName:
                                  const: rfPowerDefault
                                schema:name:
                                  const: RF Power
                                ada:dataType:
                                  const: number
                                ada:fieldScope:
                                  const: session
                                schema:readonlyValue:
                                  const: false
                                ada:tier:
                                  const: R
                                schema:unitText:
                                  const: W
                              required:
                              - '@id'
                              - '@type'
                              - schema:valueName
                              - schema:name
                              - ada:dataType
                              - ada:fieldScope
                          allOf:
                          - contains: *id013
                            minContains: 0
                            maxContains: 1
                          - contains: *id014
                            minContains: 0
                            maxContains: 1
                          - contains:
                              title: Plasma Thermal Mode
                              description: Whether the ICP plasma is operated under cool plasma or normal
                                (hot) plasma conditions. Normal plasma (>1000 W RF) is standard for most
                                solution SF-ICP-MS analyses. Cool plasma (≤900 W RF) reduces argide-based
                                interferences (e.g., 40Ar12C+ on 52Cr) at the cost of reduced sensitivity
                                and ionization efficiency for most elements.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/solutionSficpmsTAPP/plasmaThermalMode
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                    '@id': ada:parameter/solutionSficpmsTAPP/plasmaThermalMode
                                schema:name:
                                  const: Plasma Thermal Mode
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                              readOnly: true
                            minContains: 0
                            maxContains: 1
                          - contains: *id015
                            minContains: 0
                            maxContains: 1
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: Torch
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:name:
                          description: Type of plasma torch used (e.g., standard quartz, high-matrix,
                            low-flow).
                          anyOf:
                          - type: string
                            readOnly: true
                          - type: array
                            items:
                              type: string
                              readOnly: true
                        schema:additionalProperty:
                          type: array
                          items: &id016
                            title: Torch Depth
                            description: Distance between the load coil and the sampling cone tip (mm),
                              also called injector depth or torch position. Affects ion transmission efficiency
                              and oxide formation rates. Protocol registers the target torch position;
                              analyst confirms or adjusts during session tuning.
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/solutionSficpmsTAPP/torchDepthDefault
                              '@type':
                                const:
                                - schema:PropertyValueSpecification
                              schema:valueName:
                                const: torchDepthDefault
                              schema:name:
                                const: Torch Depth
                              ada:dataType:
                                const: string
                              ada:fieldScope:
                                const: session
                              schema:readonlyValue:
                                const: false
                              ada:tier:
                                const: R
                            required:
                            - '@id'
                            - '@type'
                            - schema:valueName
                            - schema:name
                            - ada:dataType
                            - ada:fieldScope
                          allOf:
                          - contains: *id016
                            minContains: 0
                            maxContains: 1
                  - if:
                      properties:
                        schema:additionalType:
                          contains:
                            const: Interface Cone
                      required:
                      - schema:additionalType
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items:
                            anyOf:
                            - title: Interface Cone Configuration
                              description: Geometry and designation of the sampler and skimmer cones installed
                                during analysis. Some SF-ICP-MS instruments offer multiple cone geometries
                                that differ in aperture size and affect ion transmission efficiency and
                                matrix tolerance.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/solutionSficpmsTAPP/interfaceConeConfiguration
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                    '@id': ada:parameter/solutionSficpmsTAPP/interfaceConeConfiguration
                                schema:name:
                                  const: Interface Cone Configuration
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                              readOnly: true
                            - title: Sampler and Skimmer Cone Material
                              description: Material composition of the sampler and skimmer cones. Nickel
                                (Ni) is standard for most aqueous matrices. Aluminium (Al) cones are used
                                in some SF-ICP-MS labs for enhanced sensitivity at high resolution. Platinum
                                (Pt) is used for HCl-rich matrices.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/solutionSficpmsTAPP/samplerAndSkimmerConeMaterial
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                    '@id': ada:parameter/solutionSficpmsTAPP/samplerAndSkimmerConeMaterial
                                schema:name:
                                  const: Sampler and Skimmer Cone Material
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                              readOnly: true
                          allOf:
                          - contains:
                              title: Interface Cone Configuration
                              description: Geometry and designation of the sampler and skimmer cones installed
                                during analysis. Some SF-ICP-MS instruments offer multiple cone geometries
                                that differ in aperture size and affect ion transmission efficiency and
                                matrix tolerance.
                              type: object
                              properties:
                                '@id':
                                  const: ada:parameter/solutionSficpmsTAPP/interfaceConeConfiguration
                                '@type':
                                  const:
                                  - schema:PropertyValue
                                schema:propertyID:
                                  const:
                                    '@id': ada:parameter/solutionSficpmsTAPP/interfaceConeConfiguration
                                schema:name:
                                  const: Interface Cone Configuration
                                schema:value:
                                  type: string
                              required:
                              - '@id'
                              - '@type'
                              - schema:propertyID
                              - schema:name
                              - schema:value
                              readOnly: true
                            minContains: 0
                            maxContains: 1
                          - contains:
                              title: Sampler and Skimmer Cone Material
                              description: Material composition of the sampler and skimmer cones. Nickel
