          schema:object:
            type: array
            items:
              type: object
              allOf:
              - if:
                  properties:
                    '@type':
                      contains:
                        const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                  required:
                  - '@type'
                then:
                  properties:
                    schema:name:
                      description: Name or identifier of each sample analysed in this session, as used
                        in the laboratory — a sample mount, section or aliquot counts as one entry where
                        that is what the laboratory tracks. The analysis record corresponds to one session
                        and may cover several samples; fields whose Keyed By column declares 'sample'
                        take one value per entry. Should match the identifier used in associated publications
                        or data tables.
                      anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    schema:identifier:
                      description: Globally unique, persistent identifier for each sample listed in Sample
                        Name. IGSN (International Geo Sample Number) is the recommended standard for geological
                        and cosmochemical samples, as used by Astromat, EarthChem and SESAR. Where a sample
                        and its sub-samples are separately registered, record the identifier at the level
                        actually analysed.
                      anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
            allOf:
            - contains:
                properties:
                  '@type':
                    contains:
                      const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                required:
                - '@type'
          prov:used:
            type: array
            items:
              type: object
              allOf:
              - if:
                  properties:
                    ada:toolRole:
                      const: acquisition
                  required:
                  - ada:toolRole
                then:
                  properties:
                    schema:name:
                      description: Data acquisition and microscope control software, including version.
                      anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
              - if:
                  properties:
                    ada:toolRole:
                      const: dataReduction
                  required:
                  - ada:toolRole
                then:
                  properties:
                    schema:name:
                      description: All software used for post-acquisition data reduction, analysis, and
                        image processing, including diffraction analysis, EDS quantification, and EELS
                        processing. List all packages with version numbers.
                      anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
              - if:
                  properties:
                    schema:additionalType:
                      contains:
                        const: TEM
                  required:
                  - schema:additionalType
                then:
                  properties:
                    ada:acceleratingVoltage:
                      description: Electron beam accelerating voltage in kilovolts (kV). For beam-sensitive
                        materials (organic matter, phyllosilicates), 60–80 kV may be used to stay below
                        the displacement threshold for C, N, O, and S. The procedure specifies the standard
                        operating voltage; analysts record and justify deviations. Key parameter for the
                        beam damage regime.
                      anyOf:
                      - type: number
                      - type: string
            allOf:
            - contains:
                properties:
                  ada:toolRole:
                    const: acquisition
                required:
                - ada:toolRole
            - contains:
                properties:
                  ada:toolRole:
                    const: dataReduction
                required:
                - ada:toolRole
            - contains:
                properties:
                  schema:additionalType:
                    contains:
                      const: TEM
                required:
                - schema:additionalType
          schema:description:
            description: 'Any procedure- or analysis-specific information not captured by a structured
              field anywhere in this TAPP — including anomalies, deviations from the registered procedure,
              instrument modifications, and supplementary context. Scope is the whole document, not Group
              6: this is the last field of the TAPP and covers all six groups. Use sparingly; a structured
              field is preferred for anything that can be formally categorised.'
            type: string
