$schema: https://json-schema.org/draft/2020-12/schema
title: TEM Analysis Detail
description: Detail block for TEM hasPart items. Discriminates on ada:componentType, carries analysis-level
  required properties and an @id reference to a registered temTAPP definition, and per-dataset schema:additionalProperty
  entries constrained via $refs to the parameterValues registry plus a catch-all. Generated by tools/build_tapp.py.
allOf:
- $ref: ../../../BaseSchema/modules/group1/schema.yaml#/$defs/AnalysisIdentification
- $ref: ../../../BaseSchema/modules/reportingCore/schema.yaml#/$defs/AggregationQc_Analysis
- type: object
  properties:
    prov:wasGeneratedBy:
      type: array
      items:
        type: object
        properties:
          schema:actionProcess:
            type: object
            properties:
              schema:step:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:name:
                          const: samplePreparation
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:description:
                          description: Primary method by which electron-transparent sections are prepared
                            from the sample. The procedure documents the standard approach; analysts record
                            session-specific details and deviations in Sample Preparation Details.
                          anyOf:
                          - type: string
                            enum:
                            - FIB lift-out (Ga ion)
                            - FIB lift-out (Xe plasma)
                            - FIB lift-out (Ga) + ion mill
                            - Ultramicrotomy
                            - Crushing / dispersion on grid
                            - Ion milling (non-FIB)
                            - Electropolishing
                            - Unknown
                            - N/A
                            - None
                          - type: array
                            items:
                              type: string
                              enum:
                              - FIB lift-out (Ga ion)
                              - FIB lift-out (Xe plasma)
                              - FIB lift-out (Ga) + ion mill
                              - Ultramicrotomy
                              - Crushing / dispersion on grid
                              - Ion milling (non-FIB)
                              - Electropolishing
                              - Unknown
                              - N/A
                              - None
                allOf:
                - contains:
                    properties:
                      schema:name:
                        const: samplePreparation
                    required:
                    - schema:name
          schema:additionalProperty:
            type: array
            items:
              anyOf:
              - &id001
                title: Sample Preparation Details
                description: 'Detailed description of section preparation conditions: FIB milling voltages
                  and currents; final thinning conditions and target foil thickness; protective coating
                  type and deposition method (e.g., e-beam vs. ion-beam Pt or C strip — e-beam deposition
                  causes less surface damage); any post-FIB surface cleanup (e.g., low-energy Ar+ ion
                  polishing in a Fischione NanoMill, final 0.5–2 kV Ga+ thinning); sample transfer and
                  storage environment (ambient air, dry N₂ atmosphere, vacuum transfer holder, glovebox);
                  plasma cleaning before loading. Analysts record session-specific observations and deviations
                  from the procedure standard. Includes preparation artifacts noted (Ga implantation,
                  amorphization, curtaining).'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/samplePreparationDetails
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/samplePreparationDetails
                  schema:name:
                    const: Sample Preparation Details
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id002
                title: Target Selection Criteria
                description: 'The rules governing which part of the sample is analysed, and why. Covers
                  the criteria applied when choosing grains, aliquots, spots, or a region of interest
                  — size, morphology, clarity, freedom from inclusions or alteration, phase identity,
                  or spatial position. Distinct from Target Material, which states the material type the
                  procedure is designed for: this field states how, within such a sample, the analysed
                  portion is picked out.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/targetSelectionCriteria
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/targetSelectionCriteria
                  schema:name:
                    const: Target Selection Criteria
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id003
                title: Pre-Analysis Imaging and Screening
                description: Imaging or other characterisation performed before the measurement in order
                  to select or locate the analysed target, including the technique, instrument and settings
                  used, and how individual analyses are linked back to the images. Distinct from any imaging
                  the procedure performs as its own measurement. Where the imaging is performed on a separate
                  instrument, it should also be recorded in the Group 1 coupling fields.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/preAnalysisImagingAndScreening
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/preAnalysisImagingAndScreening
                  schema:name:
                    const: Pre-Analysis Imaging and Screening
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id004
                title: Sample Holder
                description: Type of specimen holder used. Cryo holders (liquid N2 to ~110 K) are critical
                  for minimizing beam-induced damage to organic matter and beam-sensitive phases. Heating
                  holders enable in-situ experiments.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/sampleHolder
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/sampleHolder
                  schema:name:
                    const: Sample Holder
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id005
                title: Spectroscopic Detector(s)
                description: Spectroscopic detectors present and used under this procedure. EDS and EELS
                  parameter fields in Group 4 apply only when the corresponding detector is listed here.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/spectroscopicDetector
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/spectroscopicDetector
                  schema:name:
                    const: Spectroscopic Detector(s)
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id006
                title: SAED Pattern Simulation Software
                description: Software used to simulate electron diffraction patterns for comparison with
                  experimental SAED patterns during phase identification (e.g., SingleCrystal, CrystalMaker,
                  JEMS, DIFPACK). Complements the Acquisition Software field, which covers data collection;
                  simulation software is used at the interpretation and data processing step.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/saedPatternSimulationSoftware
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/saedPatternSimulationSoftware
                  schema:name:
                    const: SAED Pattern Simulation Software
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id007
                title: Analytical Sub-mode
                description: 'Sub-mode(s) of imaging or diffraction performed under this procedure. TEM
                  Imaging options: BF-TEM, DF-TEM, HRTEM, EFTEM. STEM Imaging options: HAADF, ABF, BF-STEM,
                  ADF, MAADF. Electron Diffraction options: SAED, CBED, Nanobeam diffraction, Precession
                  ED, 4D-STEM. Multiple values apply when the procedure covers more than one sub-mode
                  within a given analytical mode.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/analyticalMode
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/analyticalMode
                  schema:name:
                    const: Analytical Sub-mode
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id008
                title: TEM Objective Aperture
                description: Objective aperture diameter used to select the imaging beam condition in
                  TEM mode. In BF-TEM, a small aperture blocks diffracted beams to enhance mass-thickness
                  contrast; in DF-TEM, the aperture is displaced to select a specific diffracted beam;
                  in HRTEM, no aperture is typically used.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/temObjectiveAperture
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/temObjectiveAperture
                  schema:name:
                    const: TEM Objective Aperture
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id009
                title: EFTEM Energy Window
                description: 'Energy window(s) used for EFTEM elemental mapping: center energy, width,
                  and acquisition method (three-window or jump-ratio). Record ''N/A'' where EFTEM is not
                  listed in Analytical Sub-mode.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eftemEnergyWindow
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/eftemEnergyWindow
                  schema:name:
                    const: EFTEM Energy Window
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id010
                title: HAADF Collection Angles
                description: Inner and outer collection angles of the HAADF detector in milliradians (mrad).
                  The inner angle determines the boundary between diffracted and thermally diffuse scattered
                  electrons; larger inner angles yield stronger Z-contrast and reduced Bragg contrast.
                  Inner angle is most critical and can be derived from camera length and detector geometry.
                  In HAADF-STEM a shorter camera length increases the inner angle, yielding more thermally
                  diffuse (Z-contrast) and less Bragg-diffraction signal.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/haadfCollectionAngles
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/haadfCollectionAngles
                  schema:name:
                    const: HAADF Collection Angles
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id011
                title: STEM Probe Diameter
                description: 'Nominal or measured diameter of the focused electron probe at the sample,
                  reported in nm. Serves as a direct spatial resolution proxy for STEM imaging and STEM-EDS/EELS
                  analysis. Related to, but distinct from, Convergence Semi-Angle: the two quantities
                  are connected via aberration coefficients, defocus, and probe current, which are not
                  always published. Report whichever is known; if both are known, report both fields.
                  Also governs STEM-EDS and STEM-EELS acquisition where those detectors are used.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemProbeDiameter
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/stemProbeDiameter
                  schema:name:
                    const: STEM Probe Diameter
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id012
                title: STEM Probe Current
                description: Probe current in picoamperes (pA) or nanoamperes (nA). Higher current improves
                  EDS/EELS signal but increases beam damage risk, especially for organic matter and hydrous
                  minerals. Also governs STEM-EDS and STEM-EELS acquisition where those detectors are
                  used.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemProbeCurrent
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/stemProbeCurrent
                  schema:name:
                    const: STEM Probe Current
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id013
                title: STEM Dwell Time per Pixel
                description: Time spent acquiring signal at each pixel during STEM scanning in milliseconds.
                  Longer dwell improves signal-to-noise but increases total specimen dose; for dose-sensitive
                  materials, minimize dwell and compensate with frame averaging. Also governs STEM-EDS
                  and STEM-EELS acquisition where those detectors are used. For 4D-STEM dwell time see
                  '4D-STEM Dwell Time per Probe Position'.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemDwellTimePerPixel
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/stemDwellTimePerPixel
                  schema:name:
                    const: STEM Dwell Time per Pixel
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id014
                title: STEM Scan Dimensions
                description: Number of pixels in the STEM scan frame (X × Y pixels). Combined with calibrated
                  pixel size, defines the field of view. Also governs STEM-EDS and STEM-EELS acquisition
                  where those detectors are used.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemScanDimensions
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/stemScanDimensions
                  schema:name:
                    const: STEM Scan Dimensions
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id015
                title: STEM Frame Averaging
                description: Number of frames averaged (with drift correction if applicable) to produce
                  the final STEM image. Averaging reduces noise while limiting per-frame dose. Also governs
                  STEM-EDS and STEM-EELS acquisition where those detectors are used.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemFrameAveraging
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/stemFrameAveraging
                  schema:name:
                    const: STEM Frame Averaging
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id016
                title: Camera Length
                description: 'Nominal camera length in millimeters used for diffraction pattern acquisition.
                  Controls the mapping between reciprocal-space scattering angle and detector position;
                  must be calibrated to convert pixel distances to d-spacings. In STEM mode, also sets
                  HAADF/ABF detector collection angles. Calibration to absolute d-spacings is required
                  — see ''Diffraction Calibration Reference''. Camera length choice affects HAADF Z-contrast
                  purity: a shorter camera length (e.g. 30 mm) shifts the inner angle toward thermal diffuse
                  scatter; a longer one (e.g. 150 mm) admits more Bragg scatter.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/cameraLength
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/cameraLength
                  schema:name:
                    const: Camera Length
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id017
                title: Selected-Area Aperture Size
                description: Diameter of the selected-area aperture used in SAED mode, defining the specimen
                  region that contributes to the diffraction pattern.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/selectedAreaApertureSize
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/selectedAreaApertureSize
                  schema:name:
                    const: Selected-Area Aperture Size
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id018
                title: Precession Angle
                description: Precession semi-angle in degrees for precession electron diffraction (PED).
                  Hollow-cone illumination reduces dynamical diffraction effects and produces more kinematical-like
                  intensities. Not applicable to SAED, CBED, or standard 4D-STEM. Record 'N/A' where Precession
                  ED is not listed in Analytical Sub-mode.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/precessionAngle
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/precessionAngle
                  schema:name:
                    const: Precession Angle
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id019
                title: 4D-STEM Scan Grid and Area
                description: Number of probe positions in the 4D-STEM dataset (scan pixels × scan pixels)
                  and the physical area covered. Probe step size is the physical area divided by scan
                  pixel count. Record 'N/A' where 4D-STEM is not listed in Analytical Sub-mode.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemScanGridAndArea4D
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/stemScanGridAndArea4D
                  schema:name:
                    const: 4D-STEM Scan Grid and Area
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id020
                title: 4D-STEM Dwell Time per Probe Position
                description: Time spent acquiring each diffraction pattern in the 4D-STEM dataset in milliseconds.
                  Longer dwell improves signal-to-noise for weakly diffracting phases (e.g., smectite
                  001 reflection at ~1.24 nm) but increases total specimen dose; risk of beam damage to
                  phyllosilicates and organic matter must be balanced against data quality. Record 'N/A'
                  where 4D-STEM is not listed in Analytical Sub-mode.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/stemDwellTimePerProbePosition4D
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/stemDwellTimePerProbePosition4D
                  schema:name:
                    const: 4D-STEM Dwell Time per Probe Position
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id021
                title: Diffraction Camera Length Calibration Method
                description: Method used to calibrate the camera length constant and convert pixel distances
                  in diffraction patterns to d-spacings or reciprocal lattice vectors.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/diffractionCameraLengthCalibrationMethod
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/diffractionCameraLengthCalibrationMethod
                  schema:name:
                    const: Diffraction Camera Length Calibration Method
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id022
                title: EDS Acquisition Mode
                description: Mode of EDS data acquisition. Record 'N/A' where EDS is not listed in Spectroscopic
                  Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/edsAcquisitionMode
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/edsAcquisitionMode
                  schema:name:
                    const: EDS Acquisition Mode
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id023
                title: EDS Live Time per Point or Pixel
                description: EDS spectral acquisition live time per analysis point (point/line mode) or
                  per pixel (spectrum image) in seconds. Also referred to as "EDS Acquisition Time" in
                  EPMA and some SEM-EDS contexts, where the per-pixel distinction is less relevant. Record
                  'N/A' where EDS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/edsLiveTimePerPointOrPixel
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/edsLiveTimePerPointOrPixel
                  schema:name:
                    const: EDS Live Time per Point or Pixel
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id024
                title: EDS Energy Range
                description: Energy range of EDS spectrum acquisition in keV. Record 'N/A' where EDS is
                  not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/edsEnergyRange
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/edsEnergyRange
                  schema:name:
                    const: EDS Energy Range
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id025
                title: EELS Acquisition Mode
                description: Mode of EELS data acquisition. Record 'N/A' where EELS is not listed in Spectroscopic
                  Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsAcquisitionMode
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/eelsAcquisitionMode
                  schema:name:
                    const: EELS Acquisition Mode
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id026
                title: EELS Edges
                description: 'Ionization edge(s) acquired by EELS, specified by element symbol and edge
                  label (e.g., Fe L2,3; O K). Provides the EELS-specific counterpart to the Analyte field:
                  while Analyte lists elements, EELS Edges documents which ionization edges were used
                  and their approximate energy loss positions. The procedure registers the full intended
                  edge suite; analysts confirm or narrow this list at analysis time. Record ''N/A'' where
                  EELS is not listed in Spectroscopic Detector(s).'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsEdges
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/eelsEdges
                  schema:name:
                    const: EELS Edges
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id027
                title: EELS Acquisition Time per Spectrum
                description: Exposure time per individual EELS spectrum (or per pixel for spectrum images)
                  in seconds. Record 'N/A' where EELS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsAcquisitionTimePerSpectrum
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/eelsAcquisitionTimePerSpectrum
                  schema:name:
                    const: EELS Acquisition Time per Spectrum
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id028
                title: EELS Energy Loss Range
                description: Energy loss range acquired, defined by onset energy and width in eV. The
                  procedure documents the target range for the registered analyte edges; analysts record
                  the actual range acquired. Record 'N/A' where EELS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsEnergyLossRange
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/eelsEnergyLossRange
                  schema:name:
                    const: EELS Energy Loss Range
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id029
                title: EELS Background Subtraction Method
                description: Method used to subtract the background beneath the ionization edge of interest
                  to extract the net edge signal. Record 'N/A' where EELS is not listed in Spectroscopic
                  Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsBackgroundSubtractionMethod
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/eelsBackgroundSubtractionMethod
                  schema:name:
                    const: EELS Background Subtraction Method
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id030
                title: EELS Plural Scattering Correction
                description: Method applied to correct for multiple inelastic scattering events (plural
                  scattering) that broaden edge fine structure. Critical for specimens thicker than ~0.5
                  inelastic mean free paths. Record 'N/A' where EELS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsPluralScatteringCorrection
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/eelsPluralScatteringCorrection
                  schema:name:
                    const: EELS Plural Scattering Correction
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id031
                title: Image Processing Methods Applied
                description: Image processing steps applied to TEM or STEM images during or after acquisition.
                  Non-linear processing steps that could affect quantitative interpretation should be
                  documented explicitly.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/imageProcessingMethodsApplied
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/imageProcessingMethodsApplied
                  schema:name:
                    const: Image Processing Methods Applied
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id032
                title: Specimen Thickness Determination Method
                description: Method used to estimate TEM foil thickness. Required for EELS quantification
                  (log-ratio) and for assessing multiple-scattering severity.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/specimenThicknessDeterminationMethod
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/specimenThicknessDeterminationMethod
                  schema:name:
                    const: Specimen Thickness Determination Method
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id033
                title: Calibration Factor and Determination Method
                description: 'An externally-calibrated factor that converts the measured quantity into
                  the reported quantity, how it was determined, and its uncertainty. Applies where the
                  conversion depends on a factor calibrated against a reference of independently known
                  value, rather than on the instrument response alone. Distinct from the fields that name
                  the calibration material and that state which approach applies to which analyte, where
                  the technique has them: this field records the resulting factor itself.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/calibrationFactorAndDeterminationMethod
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/calibrationFactorAndDeterminationMethod
                  schema:name:
                    const: Calibration Factor and Determination Method
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id034
                title: Constants and Reference Values Used
                description: Physical constants and reference values used in data reduction to calculate
                  the final reported quantity (e.g., decay constants for age calculation, standard isotope
                  ratios, or other citable reference values used in a correction or calculation), together
                  with their source. Distinct from the Group 6 reference-material fields, which document
                  accepted values for specific calibration/validation materials rather than universal
                  physical constants. Record "None" if no citable, revisable physical constants feed into
                  this procedure's data reduction.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/constantsAndReferenceValuesUsed
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/constantsAndReferenceValuesUsed
                  schema:name:
                    const: Constants and Reference Values Used
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id035
                title: EDS Calibration Standard(s)
                description: Reference material(s) used to validate EDS quantification or determine experimental
                  k-factors or zeta-factors. TEM-EDS is less standardized than EPMA; many procedures rely
                  on manufacturer k-factors without external calibration. Record 'N/A' where EDS is not
                  listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/edsCalibrationStandard
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/edsCalibrationStandard
                  schema:name:
                    const: EDS Calibration Standard(s)
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id036
                title: EELS Energy Calibration
                description: Method and reference used to calibrate the EELS energy axis. Accurate calibration
                  is required for ELNES edge identification, chemical-state analysis, and inter-lab comparability.
                  Record 'N/A' where EELS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsEnergyCalibration
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/eelsEnergyCalibration
                  schema:name:
                    const: EELS Energy Calibration
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id037
                title: Diffraction Calibration Reference
                description: Reference material or internal standard used to calibrate the electron diffraction
                  camera constant (camera length × electron wavelength), enabling conversion of pixel
                  distances to d-spacings.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/diffractionCalibrationReference
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/diffractionCalibrationReference
                  schema:name:
                    const: Diffraction Calibration Reference
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id038
                title: EDS Detection Limit
                description: Estimated detection limits by EDS under this procedure's conditions, one
                  per reported concentration variable (one per analyte, these being the same set). Record
                  'N/A' where EDS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/edsDetectionLimit
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/edsDetectionLimit
                  schema:name:
                    const: EDS Detection Limit
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id039
                title: EDS Counting Statistics / Accumulation Criterion
                description: Quality criterion used to determine when sufficient EDS signal has been accumulated
                  for a given pixel or point, in lieu of or in addition to a fixed live time. Expressed
                  as a target relative uncertainty on major-element peak counts achieved by accumulating
                  successive scan frames (e.g., "1% counting statistics on major elements"; ">10% counting
                  statistics"). Distinct from EDS Live Time per Point or Pixel, which records a fixed-duration
                  setting. Record 'N/A' where EDS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/edsCountingStatisticsAccumulationCriterion
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/edsCountingStatisticsAccumulationCriterion
                  schema:name:
                    const: EDS Counting Statistics / Accumulation Criterion
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id040
                title: EELS Sensitivity and Detection Limit
                description: Practical energy resolution (ZLP FWHM measured at operating conditions) and
                  estimated detection limit or minimum detectable concentration for target edges under
                  this procedure. Record 'N/A' where EELS is not listed in Spectroscopic Detector(s).
                type: object
                properties:
                  '@id':
                    const: ada:parameter/temTAPP/eelsSensitivityAndDetectionLimit
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/temTAPP/eelsSensitivityAndDetectionLimit
                  schema:name:
                    const: EELS Sensitivity and Detection Limit
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
