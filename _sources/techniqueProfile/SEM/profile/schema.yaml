$schema: https://json-schema.org/draft/2020-12/schema
title: ADA SEM (superset) Product Profile
description: Path-driven technique-specific profile for ADA SEM (superset) Product Profile. Extends the
  base ADA product profile with the SEM analysis-instance detail on the schema:Dataset root, narrows prov:used
  to the semTAPP protocol, and constrains valid component types on schema:distribution.hasPart.
allOf:
- $ref: ../../../BaseSchema/adaProduct/schema.yaml
- $ref: ../detail/schema.yaml
- type: object
  properties:
    prov:wasGeneratedBy:
      description: Narrow the base prov:used to the semTAPP definition — inline, or by node @id — alongside
        the instrument.
      type: array
      items:
        type: object
        properties:
          prov:used:
            type: array
            items:
              anyOf:
              - $ref: ../../../BaseSchema/instrument/schema.yaml
              - type: object
                description: Reference by node @id to a semTAPP definition object defined elsewhere.
                properties:
                  '@id':
                    type: string
                    format: uri
                required:
                - '@id'
              - $ref: ../tapp/schema.yaml
    schema:additionalType:
      description: Must include a SEM product type identifier.
      contains:
        enum:
        - Scanning Electron Microscopy (SEM) Image
        - Scanning electron microscopy
        - Focused ion beam-scanning electron microscopy
    schema:distribution:
      description: Distribution items for adaSEMFull. Archive hasPart items must have ada:componentType
        from technique-specific or universal values.
      type: array
      items:
        type: object
        properties:
          schema:hasPart:
            items:
              type: object
              anyOf:
              - $ref: ../../../BaseSchema/adaProduct/schema.yaml#/$defs/universalComponentTypeBranch
              - properties:
                  ada:componentType:
                    type: string
                    enum:
                    - ada:SEMImage
                    - ada:BSEImage
                    - ada:SEMEDSSpectrum
                    - ada:SEMEDSMap
                    - ada:EBSDMap
                    - ada:SEMTabular
                required:
                - ada:componentType
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaSEMFull
