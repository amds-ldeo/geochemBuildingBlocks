$schema: https://json-schema.org/draft/2020-12/schema
title: SEM Analysis Detail
description: Dataset-level analysis-instance detail for SEM (superset), reusing CDIF/schema.org slots
  on the schema:Dataset root.
type: object
properties:
  schema:measurementTechnique:
    type: array
    items:
      type: object
      properties:
        schema:identifier:
          description: Persistent identifier (DOI) assigned to this registered protocol. Enter 'pending'
            if a DOI has been applied for but not yet minted.
          type: string
  schema:contributor:
    type: array
    items:
      type: object
    allOf:
    - contains:
        properties:
          schema:roleName:
            const: analyst
        required:
        - schema:roleName
  prov:wasGeneratedBy:
    type: array
    items:
      type: object
      properties:
        schema:startDate:
          description: Date on which the analysis session began.
          type: string
        schema:endDate:
          description: Date on which the analysis session ended (if spanning multiple days).
          type: string
        schema:object:
          type: array
          items:
            type: object
          allOf:
          - contains:
              properties:
                '@type':
                  contains:
                    const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
              required:
              - '@type'
  schema:funding:
    type: array
  schema:relatedLink:
    type: array
    items:
      type: object
  schema:additionalProperty:
    type: array
    items:
      anyOf:
      - &id001
        title: Beam Raster Dimensions
        description: Dimensions of the small area over which the beam is rastered during a single analysis
          point, reported as width × height in µm. Applicable when Beam Mode = Rastered; defines the effective
          spatial footprint of the measurement and distributes dose over a larger area to reduce beam
          damage on sensitive phases.
        type: object
        properties:
          '@id':
            const: ada:parameter/semTAPP/beamRasterDimensions
          '@type':
            const:
            - schema:PropertyValue
          schema:propertyID:
            const:
              '@id': ada:parameter/semTAPP/beamRasterDimensions
          schema:name:
            const: Beam Raster Dimensions
          schema:value:
            anyOf:
            - type: number
            - type: string
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
      - &id002
        title: Beam Damage Minimization
        description: 'Describes any measures taken to reduce electron beam damage to the sample during
          analysis. Examples: reduced accelerating voltage, lowered beam current, defocused or rastered
          beam, cooled stage, short acquisition sequences, or rotating between multiple points. Particularly
          important for volatile-bearing phases, hydrous minerals, glasses, organic materials, and biological
          samples.'
        type: object
        properties:
          '@id':
            const: ada:parameter/semTAPP/beamDamageMinimization
          '@type':
            const:
            - schema:PropertyValue
          schema:propertyID:
            const:
              '@id': ada:parameter/semTAPP/beamDamageMinimization
          schema:name:
            const: Beam Damage Minimization
          schema:value:
            type: string
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
      - &id003
        title: Drift Correction
        description: 'Describes whether and how stage or beam drift was monitored and corrected during
          the measurement session. Examples: periodic stage realignment to a fiducial marker, automated
          beam drift correction in acquisition software, or reanalysis of a reference point at regular
          intervals. Particularly relevant for long mapping runs and high-magnification sessions where
          positional accuracy affects data quality.'
        type: object
        properties:
          '@id':
            const: ada:parameter/semTAPP/driftCorrection
          '@type':
            const:
            - schema:PropertyValue
          schema:propertyID:
            const:
              '@id': ada:parameter/semTAPP/driftCorrection
          schema:name:
            const: Drift Correction
          schema:value:
            type: string
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
      - &id004
        title: Chamber Pressure
        description: Chamber pressure and gas type during analysis. Required for variable pressure (VP-SEM)
          and environmental SEM (ESEM) modes. Report value and unit (Pa or Torr) and gas composition.
          Use 'None' for standard high-vacuum operation.
        type: object
        properties:
          '@id':
            const: ada:parameter/semTAPP/chamberPressure
          '@type':
            const:
            - schema:PropertyValue
          schema:propertyID:
            const:
              '@id': ada:parameter/semTAPP/chamberPressure
          schema:name:
            const: Chamber Pressure
          schema:value:
            anyOf:
            - type: number
            - type: string
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
      - &id005
        title: Background Position(s)
        description: Location(s) of off-peak background measurement(s) relative to the peak, in mm or
          sin-theta, and whether on the high- or low-energy side.
        type: object
        properties:
          '@id':
            const: ada:parameter/semTAPP/backgroundPosition
          '@type':
            const:
            - schema:PropertyValue
          schema:propertyID:
            const:
              '@id': ada:parameter/semTAPP/backgroundPosition
          schema:name:
            const: Background Position(s)
          schema:value:
            anyOf:
            - type: number
            - type: string
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
      - &id006
        title: EBSD Frame Time
        description: Acquisition time per EBSD diffraction pattern frame in milliseconds. Longer frame
          time improves pattern quality and indexing rate but increases total acquisition time.
        type: object
        properties:
          '@id':
            const: ada:parameter/semTAPP/ebsdFrameTime
          '@type':
            const:
            - schema:PropertyValue
          schema:propertyID:
            const:
              '@id': ada:parameter/semTAPP/ebsdFrameTime
          schema:name:
            const: EBSD Frame Time
          schema:value:
            anyOf:
            - type: number
            - type: string
          schema:unitText:
            type: string
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
        - schema:unitText
      - &id007
        title: Time-Dependent Intensity Correction
        description: Type of time-dependent intensity (TDI) correction applied to compensate for beam-induced
          volatilisation or migration of sensitive elements (e.g., Na, K, F in glasses, feldspars, carbonates).
          Most commonly applied in WDS point analysis; uncommon for EDS or X-ray mapping.
        type: object
        properties:
          '@id':
            const: ada:parameter/semTAPP/timeDependentIntensityCorrection
          '@type':
            const:
            - schema:PropertyValue
          schema:propertyID:
            const:
              '@id': ada:parameter/semTAPP/timeDependentIntensityCorrection
          schema:name:
            const: Time-Dependent Intensity Correction
          schema:value:
            type: string
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
      - &id008
        title: Halogen Correction on Oxygen
        description: Whether oxygen content was adjusted to account for halogen substitution (F and/or
          Cl replacing OH) in halogen-bearing phases such as apatite, amphibole, and mica, where oxygen
          is calculated by stoichiometry.
        type: object
        properties:
          '@id':
            const: ada:parameter/semTAPP/halogenCorrectionOnOxygen
          '@type':
            const:
            - schema:PropertyValue
          schema:propertyID:
            const:
              '@id': ada:parameter/semTAPP/halogenCorrectionOnOxygen
          schema:name:
            const: Halogen Correction on Oxygen
          schema:value:
            type: string
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
      - &id009
        title: Blank Correction
        description: Method and reference material(s) used to determine and subtract blank signal contributions
          (e.g., carbon coat contribution to C signal, or background contamination for trace elements).
        type: object
        properties:
          '@id':
            const: ada:parameter/semTAPP/blankCorrection
          '@type':
            const:
            - schema:PropertyValue
          schema:propertyID:
            const:
              '@id': ada:parameter/semTAPP/blankCorrection
          schema:name:
            const: Blank Correction
          schema:value:
            type: string
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
      - &id010
        title: Normalization / Standards-Based Correction
        description: Post-acquisition normalization applied using secondary reference materials to correct
          for session-to-session calibration drift.
        type: object
        properties:
          '@id':
            const: ada:parameter/semTAPP/normalizationStandardsBasedCorrection
          '@type':
            const:
            - schema:PropertyValue
          schema:propertyID:
            const:
              '@id': ada:parameter/semTAPP/normalizationStandardsBasedCorrection
          schema:name:
            const: Normalization / Standards-Based Correction
          schema:value:
            type: string
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
      - &id011
        title: EBSD Pattern Quality Threshold
        description: Minimum pattern quality or confidence index threshold applied during EBSD data processing
          to exclude unreliably indexed points from orientation maps. Include metric name and threshold
          value.
        type: object
        properties:
          '@id':
            const: ada:parameter/semTAPP/ebsdPatternQualityThreshold
          '@type':
            const:
            - schema:PropertyValue
          schema:propertyID:
            const:
              '@id': ada:parameter/semTAPP/ebsdPatternQualityThreshold
          schema:name:
            const: EBSD Pattern Quality Threshold
          schema:value:
            type: string
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
      - &id012
        title: CL Wavelength Calibration Reference
        description: Reference light source or standard material used to calibrate the wavelength axis
          of the CL spectrometer. Required for quantitative spectral CL and hyperspectral mapping.
        type: object
        properties:
          '@id':
            const: ada:parameter/semTAPP/clWavelengthCalibrationReference
          '@type':
            const:
            - schema:PropertyValue
          schema:propertyID:
            const:
              '@id': ada:parameter/semTAPP/clWavelengthCalibrationReference
          schema:name:
            const: CL Wavelength Calibration Reference
          schema:value:
            type: string
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
    allOf:
    - contains: *id001
      minContains: 0
      maxContains: 1
    - contains: *id002
      minContains: 0
      maxContains: 1
    - contains: *id003
      minContains: 0
      maxContains: 1
    - contains: *id004
      minContains: 0
      maxContains: 1
    - contains: *id005
      minContains: 0
      maxContains: 1
    - contains: *id006
      minContains: 0
      maxContains: 1
    - contains: *id007
      minContains: 0
      maxContains: 1
    - contains: *id008
      minContains: 0
      maxContains: 1
    - contains: *id009
      minContains: 0
      maxContains: 1
    - contains: *id010
      minContains: 0
      maxContains: 1
    - contains: *id011
      minContains: 0
      maxContains: 1
    - contains: *id012
      minContains: 0
      maxContains: 1
required:
- schema:funding
