          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: CL Detector Configuration
          description: CL detector type, manufacturer, model, collection optics (e.g., parabolic mirror,
            elliptical mirror, light guide), and spectral detection configuration (PMT for panchromatic,
            CCD/EMCCD for spectral, multi-channel for pseudo-color CL).
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/clDetectorConfiguration
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/semTAPP/clDetectorConfiguration
            schema:name:
