      - contains:
          title: Interference Correction Standard
          description: Reference material used to quantify and calibrate the interference correction for
            each affected analyte.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/interferenceCorrectionStandard
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/semTAPP/interferenceCorrectionStandard
            schema:name:
