    ada:ebsdDetectorConfiguration:
      description: EBSD detector manufacturer, model, and camera resolution. Include whether EBSD and
        EDS are acquired simultaneously (common on modern combined EBSD-EDS systems).
      type: string
      readOnly: true
    bios:computationalTool:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              ada:toolRole:
                const: acquisition
            required:
            - ada:toolRole
          then:
            properties:
              schema:name:
                description: Software used to control the SEM and acquire data, including version number.
                  For FIB-SEM 3D tomography, include the automated slice-and-view module name and version.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
        - if:
            properties:
              ada:toolRole:
                const: dataReduction
            required:
            - ada:toolRole
          then:
            properties:
              schema:name:
                description: Software used for post-acquisition data reduction and analysis. List all
                  packages with version numbers.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
      allOf:
      - contains:
          properties:
            ada:toolRole:
              const: acquisition
          required:
          - ada:toolRole
      - contains:
          properties:
            ada:toolRole:
              const: dataReduction
          required:
          - ada:toolRole
    ada:analyticalMode:
      type: array
      items:
        description: Primary analytical mode(s) executed under this protocol. For multi-mode protocols
          (e.g., simultaneous BSE + EDS mapping), list all active modes.
        type: string
        enum:
        - SE Imaging
        - BSE Imaging
        - EDS
        - SEM-WDS
        - CL
        - EBSD
        - TEM Sample Preparation
        - 3D Tomography
        - N/A
        - None
        readOnly: true
    ada:beamMode:
      description: Whether the electron beam was operated as a stationary focused spot, defocused to a
        specified diameter, or rastered over a small area during analysis. Controls the effective sampling
        volume and irradiation footprint; critical for beam-sensitive phases such as hydrous minerals,
        glasses, and carbonates. Must be consistent with the Beam Diameter and Beam Raster Dimensions
        fields.
      type: string
      enum:
      - Focused
      - Defocused
      - Rastered
      readOnly: true
    ada:acceleratingVoltage:
      description: Electron beam accelerating voltage in kilovolts. Affects X-ray generation depth (EDS/WDS),
        EBSD pattern quality, imaging resolution, and beam penetration. Low voltages (1-5 kV) improve
        surface sensitivity and reduce beam damage; high voltages (15-20 kV) improve X-ray generation
        for quantitative analysis.
      anyOf:
      - type: number
      - type: string
    ada:beamCurrent:
      description: Electron beam probe current. Higher current improves signal-to-noise for X-ray analysis
        (EDS/WDS, EBSD) and CL but may increase beam damage and reduce spatial resolution. Express in
        nA; for sub-nA values use decimal notation (e.g., 0.4 nA).
      anyOf:
      - type: number
      - type: string
    ada:beamDiameter:
      description: Nominal electron beam diameter (spot size) at the sample surface, in nanometres or
        micrometres, as set by the condenser aperture and working distance. Controls the spatial resolution
        and X-ray excitation volume. For mapping modes, the effective spatial sampling interval is further
        defined by Step Size / Pixel Size.
      anyOf:
      - type: number
      - type: string
    ada:workingDistance:
      description: Distance between the objective lens pole piece and the specimen surface in millimetres.
        Affects spatial resolution, depth of focus, EDS X-ray take-off angle, and EBSD geometry.
      anyOf:
      - type: number
      - type: string
    ada:dwellTimePerPixel:
      description: Time the electron beam dwells on each pixel during raster scanning (imaging modes)
        or on each step position during compositional mapping (EDS and WDS mapping modes), in microseconds
        or milliseconds. Longer dwell time improves signal-to-noise and counting statistics but increases
        total dose and can cause beam damage or contamination on sensitive materials. For WDS mapping,
        the dwell time is per spectrometer per pixel.
      anyOf:
      - type: number
      - type: string
    ada:edsAcquisitionMode:
      description: 'Spatial acquisition sub-strategy for EDS measurements: stationary-beam point acquisition,
        linescan (beam stepped along a transect at defined intervals), or area map (beam rastered over
        a pixel grid). Specifies how the beam is positioned during data collection within the declared
        Analytical Mode. Particularly important when a protocol includes linescans as a distinct acquisition
        approach not fully captured by the mode flag columns.'
      type: string
      enum:
      - Point / spot
      - Line scan
      - Map
      - Automated mineralogy
      - N/A
      - None
      readOnly: true
    ada:analyteTemplate:
      type: object
      properties:
        ada:defaultAnalytes:
          type: array
          items:
            description: Element(s) measured by this protocol. The protocol registers the full intended
              analyte suite; analysts record the specific subset measured in a given session, which may
              be narrower. Fields below flagged as Analyte-Specific in the Comments column apply individually
              to each element in this list.
            type: string
        ada:analyteColumns:
          type: array
          items:
            type: object
            properties: {}
    ada:techniquePerAnalyte:
      description: For each analyte, records which X-ray detection technique (EDS or WDS) was used to
        collect the measurement. Required when a protocol employs both EDS and WDS simultaneously, assigning
        each element to the detector appropriate to its concentration range, line overlap situation, or
        required precision. List in the same order as the Analyte field.
      type: string
      enum:
      - 'Si: WDS; Al: WDS; Fe: WDS; Na: EDS; C: EDS'
      readOnly: true
    ada:xRayLine:
      description: X-ray emission line measured for each analyte. Line choice affects sensitivity, matrix
        correction accuracy, and peak overlap susceptibility.
      type: string
      enum:
      - Ka
      - Kb
      - La
      - Lb
      - Lg
      - Ma
      - Mb
      - N/A
      - None
      readOnly: true
    ada:edsLiveTimePerPointOrPixel:
      description: EDS spectral acquisition live time per analysis point or per pixel in seconds. Longer
        live time improves counting statistics but increases beam damage risk and total acquisition time.
      anyOf:
      - type: number
      - type: string
    ada:diffractingCrystal:
      description: Analyzing crystal (monochromator) used in the WDS spectrometer for each analyte. Crystal
        choice determines the detectable wavelength range and dispersion.
      type: string
      enum:
      - LIF
      - LLIF
      - LIFL
      - LIFH
      - PET
      - LPET
      - PETL
      - PETH
      - TAP
      - TAPL
      - TAPH
      - LDE1
      - LDE2
      - LDE3
      - RAP
      - KAP
      - Unknown
      - N/A
      - None
      readOnly: true
    ada:peakCountingTime:
      description: Time spent counting X-ray intensity at the peak position in seconds per analyte. Protocol
        specifies standard values; analysts may adjust within protocol-defined bounds.
      anyOf:
      - type: number
      - type: string
    ada:backgroundCountingTime:
      description: Total time spent counting at off-peak background position(s) in seconds, summed across
        all background positions.
      anyOf:
      - type: number
      - type: string
    ada:clAcquisitionMode:
      description: 'CL data collection strategy. Panchromatic: total light intensity collected by PMT
        across the full detector wavelength range. Spectral point: full CL spectrum at discrete point
        locations. Hyperspectral map: full CL spectrum acquired at each pixel of a raster scan.'
      type: string
      enum:
      - Panchromatic
      - Spectral point
      - Hyperspectral map
      - Multi-channel pseudo-color
      - N/A
      - None
      readOnly: true
    ada:clWavelengthRange:
      description: Detection wavelength range of the CL system in nm. The range is set by the detector
        sensitivity and any optical filters installed.
      anyOf:
      - type: number
      - type: string
      readOnly: true
    ada:clIntegrationTime:
      description: Acquisition time per pixel (hyperspectral map mode) or per spectrum (spectral point
        mode), in ms or s. Longer integration improves signal-to-noise but increases beam dose and acquisition
        time.
      anyOf:
      - type: number
      - type: string
    ada:sampleTiltAngle:
      description: Sample tilt angle for EBSD acquisition in degrees, measured from horizontal. Standard
        EBSD geometry uses 70 degrees tilt toward the EBSD camera to maximise diffracted electron signal.
      anyOf:
      - type: number
      - type: string
      readOnly: true
    ada:ebsdStepSize:
      description: Distance between adjacent EBSD measurement points in the map in nm or µm. Must be smaller
        than the smallest grain of interest to resolve grain boundary positions and intragrain orientation
        gradients.
      anyOf:
      - type: number
      - type: string
    ada:ebsdPhaseList:
      description: Mineral phases included in the EBSD reference pattern library for this protocol. The
        protocol specifies the expected phase suite for the target material; analysts may add phases for
        specific sample compositions.
      type: string
    ada:protectiveCoatingDeposition:
      description: 'Type and deposition conditions of the protective coating applied to the sample surface
        before FIB milling. E-beam deposition causes less surface damage than ion-beam deposition and
        should be applied as the initial layer. Typical coatings: platinum (Pt) or carbon (C). State material,
        deposition method, beam conditions, and approximate thickness.'
      type: string
    ada:coarseMillingConditions:
      description: 'Ion beam voltage and current used for bulk material removal during FIB milling. For
        TEM specimen preparation: bulk trenching to isolate the lamella and intermediate thinning. For
        3D tomography: face preparation and initial slice removal.'
      type: string
    ada:finePolishingConditions:
      description: Ion beam voltage and current for final thinning and surface polishing of the TEM lamella.
        Low-voltage polishing (2 kV or below) minimises Ga implantation depth, surface amorphisation,
        and curtaining artifacts.
      type: string
    ada:targetFoilThickness:
      description: 'Target thickness of the electron-transparent TEM lamella after final FIB polishing,
        in nanometres. Actual thickness may differ from target. Typical range: 50-150 nm for standard
        TEM/STEM; 200-600 nm for XANES or tomography sections.'
      anyOf:
      - type: number
      - type: string
    ada:liftOutMethod:
      description: Method used to transfer the FIB-prepared lamella to the TEM support grid. In-situ lift-out
        uses a micromanipulator inside the FIB-SEM chamber and is the standard method for small or precious
        specimens.
      type: string
      enum:
      - In-situ (micromanipulator, Cu or Mo TEM half-grid)
      - Ex-situ
      - N/A
      - None
      readOnly: true
    ada:ionMillingConditions:
      description: Ion beam voltage and current used to mill each slice during FIB-SEM serial sectioning.
        These parameters determine material removal rate per slice and exposed surface quality.
      type: string
    ada:sliceThickness:
      description: Thickness of each FIB-milled slice during serial sectioning in nanometres. Controls
        the Z-axis resolution of the 3D reconstruction.
      anyOf:
      - type: number
      - type: string
    ada:matrixCorrectionMethod:
      description: X-ray matrix correction algorithm applied during quantitative EDS or WDS data reduction.
      type: string
      enum:
      - XPP (Simplified PAP)
      - PAP (Pouchou & Pichoir Full)
      - ZAF
      - CITZAF (Armstrong 1995)
      - Phi-rho-z (EPQ-91)
      - Unknown
      - N/A
      - None
      readOnly: true
    ada:massAbsorptionCoefficients:
      description: Database of mass absorption coefficients used in the matrix correction. MAC database
        choice affects accuracy particularly for light elements (B, C, N, O, F, Na).
      type: string
      enum:
      - LINEMU
      - CITZMU
      - MCMASTER
      - MAC30
      - MACJTA
      - FFAST
      - Unknown
      - N/A
      - None
      readOnly: true
    ada:backgroundCorrectionMethod:
      description: 'Method used to estimate and subtract background X-ray intensity beneath the peak.
        For WDS: typically 2-point off-peak linear interpolation or Mean Atomic Number (MAN) model. For
        EDS: spectral background modelling within EDS software.'
      type: string
      enum:
      - 2-point off-peak linear
      - 2-point off-peak exponential
      - Mean Atomic Number (MAN)
      - EDS background fit
      - Top-hat filter
      - N/A
      - None
    ada:wdsDeadTimeCorrection:
      description: Method used to correct for WDS proportional counter dead time at high count rates.
        Dead time errors are most significant for major elements with high count rates. Unlike EDS dead
        time (hardware-managed, reported as QC percentage), WDS dead time correction is a user-selectable
        algorithm.
      type: string
      enum:
      - Default constant (manufacturer)
      - Adjusted constant
      - High-precision (Probe for EPMA)
      - Logarithmic
      - Unknown
      - N/A
      - None
      readOnly: true
    ada:ebsdIndexingMethod:
      description: Algorithm used to index EBSD diffraction patterns and assign crystal orientations.
        Hough-transform methods fit Kikuchi band positions analytically; dictionary indexing (DI) matches
        experimental patterns to a pre-computed library of simulated patterns.
      type: string
      enum:
      - Hough transform
      - Dictionary indexing (DI)
      - Neural network
      - Unknown
      - N/A
      - None
      readOnly: true
    ada:crystalStructureDatabase:
      description: Crystal structure database used for EBSD phase identification and Kikuchi pattern simulation.
      type: string
    ada:primaryStandardName:
      description: Name(s) of the primary reference material(s) used for intensity calibration in EDS
        or WDS quantification.
      type: string
    ada:secondaryReferenceMaterial:
      type: array
      items:
        description: Quality-control reference material(s) analyzed alongside unknowns to verify calibration
          accuracy. Include material name, assessed elements, number of analyses (n), and measured vs.
          accepted values where available.
        type: string
    ada:interferenceCorrectionsApplied:
      description: Whether a spectral interference correction was applied for each analyte.
      type: boolean
      readOnly: true
    schema:description:
      description: Any additional context about this protocol or analysis session not captured by structured
        fields above.
      type: string
