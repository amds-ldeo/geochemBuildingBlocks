$schema: https://json-schema.org/draft/2020-12/schema
title: SEM Technique-Aligned Protocol Profile (semTAPP)
description: Scanning electron microscopy superset (imaging + EDS/WDS composition + EBSD + FIB-SEM) extension
  of the base TAPP definition, generated from docs/SEM_TAPP_v4.xlsx via the path-driven pipeline.
allOf:
- $ref: ../../../BaseSchema/tappDefinition/schema.yaml
- type: object
  properties:
    schema:name:
      description: A short descriptive name for this analytical protocol. Should include instrument, technique,
        analytical mode(s), and target material scope.
      type: string
      readOnly: true
    schema:measurementTechnique:
      type: array
      items:
        type: object
        properties:
          schema:termCode:
            description: Top-level analytical technique identifier.
            type: string
            enum:
            - SEM
            - SEM/FIB-SEM
            - N/A
            - None
            readOnly: true
    schema:creator:
      type: object
      properties:
        schema:name:
          description: Person(s) or laboratory responsible for developing and registering this protocol.
          type: string
          readOnly: true
    schema:location:
      type: object
      properties:
        schema:name:
          description: Name of the laboratory or institution hosting the instrument.
          type: string
        schema:identifier:
          description: Persistent identifier for the laboratory (e.g., ROR ID).
          type: string
    schema:datePublished:
      description: First date this protocol configuration was used in production.
      type: string
      readOnly: true
    schema:funding:
      type: array
      items:
        type: object
        properties:
          schema:name:
            description: Grants and funding that supported development of this protocol. Include grant
              IDs.
            type: string
            readOnly: true
    schema:relatedLink:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              schema:linkRelationship:
                const: techniquePublication
            required:
            - schema:linkRelationship
          then:
            properties:
              schema:target:
                type: object
                properties:
                  schema:name:
                    description: DOI or URL for publications or reports describing or evaluating this
                      protocol.
                    type: string
                    readOnly: true
        - if:
            properties:
              schema:linkRelationship:
                const: coupledTechnique
            required:
            - schema:linkRelationship
          then:
            properties:
              schema:target:
                type: object
                properties:
                  schema:description:
                    description: Describes (1) the functional relationship between this SEM/FIB-SEM dataset
                      and the coupled technique — what data or context flows between them — and (2) the
                      analytical sequence — which technique was performed first and why. Required when
                      Coupled Technique(s) is not 'None'.
                    type: string
    schema:object:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              '@type':
                contains:
                  const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
            required:
            - '@type'
          then:
            properties:
              schema:additionalProperty:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:name:
                          const: Target Material
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:value:
                          type: array
                          items:
                            description: General description of the material type(s) this protocol is
                              designed to analyze.
                            type: string
                            enum:
                            - Silicate mineral
                            - Oxide
                            - Sulfide
                            - Carbonate
                            - Phosphate
                            - Metal alloy
                            - Organic matter
                            - Glass
                            - Regolith
                            - Whole rock / polished section
                            - Porous material
                            - N/A
                            - None
                            readOnly: true
                allOf:
                - contains:
                    properties:
                      schema:name:
                        const: Target Material
                    required:
                    - schema:name
      allOf:
      - contains:
          properties:
            '@type':
              contains:
                const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
          required:
          - '@type'
    schema:actionProcess:
      type: object
      properties:
        schema:step:
          type: array
          items:
            type: object
            allOf:
            - if:
                properties:
                  schema:name:
                    const: samplePreparation
                required:
                - schema:name
              then:
                properties:
                  schema:description:
                    description: Method by which samples were prepared for SEM analysis prior to loading
                      in the instrument. Includes mounting medium (epoxy, carbon tape, stub), polishing
                      steps (alumina, colloidal silica, argon ion mill), and conductive coating type and
                      thickness. For VP-SEM/ESEM analyses, note whether an uncoated sample was used and
                      the gas type used. FIB-specific in-session operations (protective coating deposition,
                      milling conditions, lamella preparation) are documented separately in Group 4.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
          allOf:
          - contains:
              properties:
                schema:name:
                  const: samplePreparation
              required:
              - schema:name
    ada:instrumentManufacturer:
      description: Make of the SEM or FIB-SEM instrument.
      type: string
      enum:
      - JEOL
      - Zeiss
      - FEI / Thermo Fisher Scientific
      - Hitachi
      - Tescan
      - Phenom
      - Unknown
      - N/A
      - None
      readOnly: true
    ada:instrumentModel:
      description: Model designation of the SEM or FIB-SEM instrument, including generation suffix if
        applicable.
      type: string
      readOnly: true
    ada:electronSource:
      description: Type of electron gun used in the SEM instrument.
      type: string
      enum:
      - Cold-FEG
      - Schottky FEG
      - LaB6 / CeB6
      - Tungsten (W)
      - Unknown
      - N/A
      - None
      readOnly: true
    ada:instrumentVariant:
      description: 'Broad platform type of the instrument. ''Standard SEM'': dedicated electron-only SEM
        column. ''FIB-SEM dual-beam'': combined focused ion beam and SEM columns (enables TEM specimen
        preparation, 3D serial sectioning, ion-beam milling). ''VP-SEM / ESEM'': variable-pressure or
        environmental SEM for imaging uncoated, hydrated, or charging specimens. An instrument may combine
        categories (e.g., FIB-SEM with VP capability).'
      type: string
      enum:
      - Standard SEM
      - FIB-SEM dual-beam
      - VP-SEM / ESEM
      - FIB-SEM dual-beam + VP
      - N/A
      - None
      readOnly: true
    ada:ionBeamSource:
      description: Ion beam source type in a FIB-SEM dual-beam system. Gallium LMIS (Ga+) is the most
        common ion source; xenon plasma FIB (PFIB) provides higher material removal rates for large-volume
        milling; helium and neon ion microscopes (GFIS) provide nanometre-resolution imaging and low-damage
        milling.
      type: string
      enum:
      - Gallium LMIS (Ga+)
      - Xenon plasma FIB (PFIB)
      - Helium GFIS
      - Neon GFIS
      - N/A
      - None
      readOnly: true
    ada:seDetectorType:
      description: Type of secondary electron detector used. Everhart-Thornley (ET) detector is the standard
        off-axis collector sensitive to SE2 and some BSE; in-lens (TLD) detectors collect high-resolution
        SE1 signal at short working distances; GSED/ESED detectors operate in VP/ESEM mode by using the
        chamber gas as the signal amplification medium.
      type: string
      enum:
      - Everhart-Thornley (ET)
      - In-lens / TLD (through-the-lens)
      - GSED (VP/ESEM)
      - ESED (VP/ESEM)
      - N/A
      - None
      readOnly: true
    ada:bseDetectorType:
      description: Type of backscattered electron detector. Solid-state diode detectors (single or segmented)
        are standard; YAG scintillator detectors offer high sensitivity at low voltage. Segmented detectors
        can operate in composition mode (segments summed) or topography mode (differential signal between
        segments). In-lens BSE detectors provide improved BSE collection at short working distances.
      type: string
      enum:
      - Solid-state diode (single)
      - Solid-state diode (segmented, composition mode)
      - Solid-state diode (segmented, topography mode)
      - In-lens BSE
      - YAG scintillator
      - N/A
      - None
      readOnly: true
    schema:additionalProperty:
      type: array
      items:
        anyOf:
        - title: EDS Detector Configuration
          description: EDS detector type, manufacturer, active area, solid angle, window type, and geometry
            (take-off angle, position). Multiple detectors should be listed separately.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/edsDetectorConfiguration
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/semTAPP/edsDetectorConfiguration
            schema:name:
              const: EDS Detector Configuration
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: WDS Spectrometer Configuration
          description: Number, type, and crystal range of WDS spectrometers attached to the SEM. Include
            manufacturer, model, and crystal range. For SEM-WDS configurations (third-party WDS on a non-EPMA
            platform), include WDS manufacturer and model.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/wdsSpectrometerConfiguration
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/semTAPP/wdsSpectrometerConfiguration
            schema:name:
              const: WDS Spectrometer Configuration
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: CL Detector Configuration
          description: CL detector type, manufacturer, model, collection optics (e.g., parabolic mirror,
            elliptical mirror, light guide), and spectral detection configuration (PMT for panchromatic,
            CCD/EMCCD for spectral, multi-channel for pseudo-color CL).
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/clDetectorConfiguration
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/semTAPP/clDetectorConfiguration
            schema:name:
              const: CL Detector Configuration
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - &id001
          title: Beam Raster Dimensions
          description: Dimensions of the small area over which the beam is rastered during a single analysis
            point, reported as width × height in µm. Applicable when Beam Mode = Rastered; defines the
            effective spatial footprint of the measurement and distributes dose over a larger area to
            reduce beam damage on sensitive phases.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/beamRasterDimensionsDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: beamRasterDimensionsDefault
            schema:name:
              const: Beam Raster Dimensions
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id002
          title: Beam Damage Minimization
          description: 'Describes any measures taken to reduce electron beam damage to the sample during
            analysis. Examples: reduced accelerating voltage, lowered beam current, defocused or rastered
            beam, cooled stage, short acquisition sequences, or rotating between multiple points. Particularly
            important for volatile-bearing phases, hydrous minerals, glasses, organic materials, and biological
            samples.'
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/beamDamageMinimizationDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: beamDamageMinimizationDefault
            schema:name:
              const: Beam Damage Minimization
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id003
          title: Drift Correction
          description: 'Describes whether and how stage or beam drift was monitored and corrected during
            the measurement session. Examples: periodic stage realignment to a fiducial marker, automated
            beam drift correction in acquisition software, or reanalysis of a reference point at regular
            intervals. Particularly relevant for long mapping runs and high-magnification sessions where
            positional accuracy affects data quality.'
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/driftCorrectionDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: driftCorrectionDefault
            schema:name:
              const: Drift Correction
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Stage Scan vs. Beam Scan
          description: For mapping modes, records whether the map was acquired by moving the stage while
            the beam is held fixed (stage scan) or by deflecting the beam across the field while the stage
            is stationary (beam scan). Stage scan is preferred for large areas or high-accuracy geometric
            fidelity; beam scan is faster for smaller fields but may introduce geometric distortion at
            the map edges.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/stageScanVsBeamScan
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/semTAPP/stageScanVsBeamScan
            schema:name:
              const: Stage Scan vs. Beam Scan
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - &id004
          title: Chamber Pressure
          description: Chamber pressure and gas type during analysis. Required for variable pressure (VP-SEM)
            and environmental SEM (ESEM) modes. Report value and unit (Pa or Torr) and gas composition.
            Use 'None' for standard high-vacuum operation.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/chamberPressureDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: chamberPressureDefault
            schema:name:
              const: Chamber Pressure
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id005
          title: Image Pixel Size
          description: Physical size of each image pixel at the sample surface, in nm or µm. Defines spatial
            sampling of SE or BSE images. For large-area mosaic imaging, report the pixel size of individual
            tiles and the number and arrangement of tiles.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/imagePixelSize
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/semTAPP/imagePixelSize
            schema:name:
              const: Image Pixel Size
            schema:value:
              anyOf:
              - type: number
              - type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
        - &id006
          title: Step Size / Pixel Size
          description: Centre-to-centre distance between adjacent measurement points (WDS mapping) or
            pixels (EDS mapping) in µm. Defines the spatial sampling interval of the map and, together
            with Map Dimensions, determines the total mapped area. Smaller step sizes increase spatial
            resolution but extend acquisition time.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/stepSizePixelSize
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/semTAPP/stepSizePixelSize
            schema:name:
              const: Step Size / Pixel Size
            schema:value:
              anyOf:
              - type: number
              - type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
        - title: WDS Spectrometer Channel
          description: WDS spectrometer number assigned to each analyte. Different spectrometers may have
            different crystal configurations.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/wdsSpectrometerChannel
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/semTAPP/wdsSpectrometerChannel
            schema:name:
              const: WDS Spectrometer Channel
            schema:value:
              anyOf:
              - type: number
              - type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: Sequence
          description: Order in which analytes are acquired in the spectrometer sequence during point
            analysis. Relevant for minimizing beam damage (volatile elements measured first).
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/sequence
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/semTAPP/sequence
            schema:name:
              const: Sequence
            schema:value:
              anyOf:
              - type: number
              - type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: Proportional Counter / Detector
          description: Type of detector used in the WDS spectrometer for each analyte. Affects sensitivity
            and count rate linearity.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/proportionalCounterDetector
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/semTAPP/proportionalCounterDetector
            schema:name:
              const: Proportional Counter / Detector
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: WDS PHA Setting
          description: Pulse height analyzer (PHA) setting for the WDS detector. Integral mode accepts
            all pulses above a threshold; Differential mode selects a narrow energy window to reject higher-order
            reflections and escape peaks.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/wdsPhaSetting
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/semTAPP/wdsPhaSetting
            schema:name:
              const: WDS PHA Setting
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - &id007
          title: Background Position(s)
          description: Location(s) of off-peak background measurement(s) relative to the peak, in mm or
            sin-theta, and whether on the high- or low-energy side.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/backgroundPositionDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: backgroundPositionDefault
            schema:name:
              const: Background Position(s)
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: CL Grating
          description: Diffraction grating specification for spectral or hyperspectral CL acquisition,
            including groove density and blaze wavelength. Not applicable to panchromatic-only acquisition.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/clGrating
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/semTAPP/clGrating
            schema:name:
              const: CL Grating
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - &id008
          title: EBSD Frame Time
          description: Acquisition time per EBSD diffraction pattern frame in milliseconds. Longer frame
            time improves pattern quality and indexing rate but increases total acquisition time.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/ebsdFrameTimeDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: ebsdFrameTimeDefault
            schema:name:
              const: EBSD Frame Time
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: ms
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id009
          title: Time-Dependent Intensity Correction
          description: Type of time-dependent intensity (TDI) correction applied to compensate for beam-induced
            volatilisation or migration of sensitive elements (e.g., Na, K, F in glasses, feldspars, carbonates).
            Most commonly applied in WDS point analysis; uncommon for EDS or X-ray mapping.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/timeDependentIntensityCorrectionDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: timeDependentIntensityCorrectionDefault
            schema:name:
              const: Time-Dependent Intensity Correction
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Analyte Estimation Method
          description: Whether elemental concentrations were calculated directly from measured X-ray intensities,
            or estimated by cation stoichiometry (e.g., oxygen calculated from cation proportions in silicates;
            carbon from stoichiometry in carbonates).
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/analyteEstimationMethod
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/semTAPP/analyteEstimationMethod
            schema:name:
              const: Analyte Estimation Method
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - &id010
          title: Halogen Correction on Oxygen
          description: Whether oxygen content was adjusted to account for halogen substitution (F and/or
            Cl replacing OH) in halogen-bearing phases such as apatite, amphibole, and mica, where oxygen
            is calculated by stoichiometry.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/halogenCorrectionOnOxygenDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: halogenCorrectionOnOxygenDefault
            schema:name:
              const: Halogen Correction on Oxygen
            ada:dataType:
              const: boolean
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: EDS Spectral Processing Type
          description: Method used to process raw EDS spectra and extract net peak intensities from raw
            spectral data.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/edsSpectralProcessingType
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/semTAPP/edsSpectralProcessingType
            schema:name:
              const: EDS Spectral Processing Type
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - &id011
          title: Blank Correction
          description: Method and reference material(s) used to determine and subtract blank signal contributions
            (e.g., carbon coat contribution to C signal, or background contamination for trace elements).
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/blankCorrectionDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: blankCorrectionDefault
            schema:name:
              const: Blank Correction
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id012
          title: Normalization / Standards-Based Correction
          description: Post-acquisition normalization applied using secondary reference materials to correct
            for session-to-session calibration drift.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/normalizationStandardsBasedCorrectionDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: normalizationStandardsBasedCorrectionDefault
            schema:name:
              const: Normalization / Standards-Based Correction
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id013
          title: EBSD Pattern Quality Threshold
          description: Minimum pattern quality or confidence index threshold applied during EBSD data
            processing to exclude unreliably indexed points from orientation maps. Include metric name
            and threshold value.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/ebsdPatternQualityThresholdDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: ebsdPatternQualityThresholdDefault
            schema:name:
              const: EBSD Pattern Quality Threshold
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Interfering Elements
          description: Element(s) whose X-ray lines overlap with the measured peak for one or more analytes,
            requiring a correction.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/interferingElements
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/semTAPP/interferingElements
            schema:name:
              const: Interfering Elements
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: Interference Correction Standard
          description: Reference material used to quantify and calibrate the interference correction for
            each affected analyte.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/interferenceCorrectionStandard
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/semTAPP/interferenceCorrectionStandard
            schema:name:
              const: Interference Correction Standard
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - &id014
          title: Analytical Precision
          description: Reproducibility of repeated measurements on the same or equivalent reference material,
            expressed as 1-sigma relative standard deviation (%). Include reference material name and
            number of analyses.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/analyticalPrecision
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/semTAPP/analyticalPrecision
            schema:name:
              const: Analytical Precision
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
        - &id015
          title: Analytical Accuracy
          description: Offset between measured and accepted reference values for secondary standards,
            expressed as percent relative bias.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/analyticalAccuracy
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/semTAPP/analyticalAccuracy
            schema:name:
              const: Analytical Accuracy
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
        - &id016
          title: Counting Statistics Error
          description: 1-sigma uncertainty propagated from counting statistics on peak and background
            intensities for each analyte per analysis.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/countingStatisticsError
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/semTAPP/countingStatisticsError
            schema:name:
              const: Counting Statistics Error
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
        - &id017
          title: CL Wavelength Calibration Reference
          description: Reference light source or standard material used to calibrate the wavelength axis
            of the CL spectrometer. Required for quantitative spectral CL and hyperspectral mapping.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/clWavelengthCalibrationReferenceDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: clWavelengthCalibrationReferenceDefault
            schema:name:
              const: CL Wavelength Calibration Reference
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
      allOf:
      - contains:
          title: EDS Detector Configuration
          description: EDS detector type, manufacturer, active area, solid angle, window type, and geometry
            (take-off angle, position). Multiple detectors should be listed separately.
          type: object
          properties:
            '@id':
              const: ada:parameter/semTAPP/edsDetectorConfiguration
            '@type':
