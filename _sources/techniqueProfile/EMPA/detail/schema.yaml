$schema: https://json-schema.org/draft/2020-12/schema
title: EPMA/EMPA Analysis Detail
description: Dataset-level analysis-instance detail for EPMA/EMPA, reusing CDIF/schema.org slots on the
  schema:Dataset root.
type: object
properties:
  prov:wasGeneratedBy:
    type: array
    items:
      type: object
      properties:
        prov:used:
          type: array
          items:
            type: object
            allOf:
            - if:
                properties:
                  schema:additionalType:
                    contains:
                      const: EPMA
                required:
                - schema:additionalType
              then:
                properties:
                  ada:acceleratingVoltage:
                    description: Electron beam accelerating voltage in kilovolts (kV). The protocol specifies
                      the standard operating voltage; analysts record and justify any deviations.
                    anyOf:
                    - type: number
                    - type: string
                  ada:beamDiameter:
                    description: Diameter of the electron beam in micrometers. 0 indicates a fully focused
                      beam. Document defocused diameter when used to minimize beam damage or improve spatial
                      averaging for beam-sensitive phases.
                    anyOf:
                    - type: number
                    - type: string
          allOf:
          - contains:
              properties:
                schema:additionalType:
                  contains:
                    const: EPMA
              required:
              - schema:additionalType
        schema:endDate:
          description: Date on which the analysis session ended (if spanning multiple days).
          type: string
        schema:startDate:
          description: Date on which the analysis session began.
          type: string
        schema:additionalProperty:
          type: array
          items:
            anyOf:
            - &id001
              title: Beam Damage Minimization
              description: Measures taken to minimize beam damage, particularly volatilization or migration
                of Na, K, F, and Cl in hydrous minerals, glasses, feldspars, phosphates, and carbonates.
                Document approach, beam conditions used, and phases for which it was applied.
              type: object
              properties:
                '@id':
                  const: ada:parameter/empaTAPP/beamDamageMinimization
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                    '@id': ada:parameter/empaTAPP/beamDamageMinimization
                schema:name:
                  const: Beam Damage Minimization
                schema:value:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id002
              title: Beam Raster Dimensions
              description: X x Y dimensions of a small beam raster used at a single analysis point to
                average a coarse-grained or beam-sensitive phase. Different from X-ray mapping mode; not
                applicable when mapping.
              type: object
              properties:
                '@id':
                  const: ada:parameter/empaTAPP/beamRasterDimensions
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                    '@id': ada:parameter/empaTAPP/beamRasterDimensions
                schema:name:
                  const: Beam Raster Dimensions
                schema:value:
                  anyOf:
                  - type: number
                  - type: string
                schema:unitText:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
              - schema:unitText
            - &id003
              title: Drift Correction
              description: Method used to monitor and correct for instrument drift (beam current drift,
                spectrometer drift) during the analytical session.
              type: object
              properties:
                '@id':
                  const: ada:parameter/empaTAPP/driftCorrection
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                    '@id': ada:parameter/empaTAPP/driftCorrection
                schema:name:
                  const: Drift Correction
                schema:value:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id004
              title: Dwell Time per Pixel
              description: 'Time spent acquiring X-ray signal at each pixel during X-ray mapping, in milliseconds.
                For WDS: per spectrometer per pixel; may differ by analyte if spectrometers are assigned
                differently. For EDS: total live-time per spectrum per pixel.'
              type: object
              properties:
                '@id':
                  const: ada:parameter/empaTAPP/dwellTimePerPixel
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                    '@id': ada:parameter/empaTAPP/dwellTimePerPixel
                schema:name:
                  const: Dwell Time per Pixel
                schema:value:
                  anyOf:
                  - type: number
                  - type: string
                schema:unitText:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
              - schema:unitText
            - &id005
              title: Halogen Correction on Oxygen
              description: Whether oxygen content was adjusted to account for halogen substitution (F
                and/or Cl replacing OH) in halogen-bearing phases such as apatite, amphibole, and mica,
                where oxygen is calculated by stoichiometry.
              type: object
              properties:
                '@id':
                  const: ada:parameter/empaTAPP/halogenCorrectionOnOxygen
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                    '@id': ada:parameter/empaTAPP/halogenCorrectionOnOxygen
                schema:name:
                  const: Halogen Correction on Oxygen
                schema:value:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id006
              title: Step Size / Pixel Size
              description: Distance between adjacent measurement points in the X-ray map in micrometers,
                defining the spatial resolution. Report both X and Y step if they differ.
              type: object
              properties:
                '@id':
                  const: ada:parameter/empaTAPP/stepSizePixelSize
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                    '@id': ada:parameter/empaTAPP/stepSizePixelSize
                schema:name:
                  const: Step Size / Pixel Size
                schema:value:
                  anyOf:
                  - type: number
                  - type: string
                schema:unitText:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
              - schema:unitText
          allOf:
          - contains: *id001
            minContains: 0
            maxContains: 1
          - contains: *id002
            minContains: 0
            maxContains: 1
          - contains: *id003
            minContains: 0
            maxContains: 1
          - contains: *id004
            minContains: 0
            maxContains: 1
          - contains: *id005
            minContains: 0
            maxContains: 1
          - contains: *id006
            minContains: 0
            maxContains: 1
        schema:object:
          type: array
          items:
            type: object
            allOf:
            - if:
                properties:
                  '@type':
                    contains:
                      const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                required:
                - '@type'
              then:
                properties:
                  schema:name:
                    description: Name or identifier of the sample or sample mount analyzed in this session.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  schema:identifier:
                    description: Persistent identifier (e.g., IGSN) for the sample analyzed.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
          allOf:
          - contains:
              properties:
                '@type':
                  contains:
                    const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
              required:
              - '@type'
  schema:contributor:
    type: array
    items:
      type: object
      allOf:
      - if:
          properties:
            schema:roleName:
              const: analyst
          required:
          - schema:roleName
        then:
          properties:
            schema:name:
              description: Name of the analyst who conducted the analysis session.
              anyOf:
              - type: string
              - type: array
                items:
                  type: string
    allOf:
    - contains:
        properties:
          schema:roleName:
            const: analyst
        required:
        - schema:roleName
  schema:relatedLink:
    type: array
    items:
      type: object
      allOf:
      - if:
          properties:
            schema:linkRelationship:
              const: coupledDataset
          required:
          - schema:linkRelationship
        then:
          properties:
            schema:target:
              description: DOI of the dataset or publication containing the coupled technique data. If
                coupling is documented only through a shared sample IGSN (Group 2), this field may be
                'None'.
              anyOf:
              - type: string
              - type: array
                items:
                  type: string
      - if:
          properties:
            schema:linkRelationship:
              const: coupledProtocol
          required:
          - schema:linkRelationship
        then:
          properties:
            schema:target:
              type: object
              properties:
                schema:url:
                  description: DOI of the registered protocol for the coupled technique.
                  type: string
  schema:funding:
    type: array
  schema:measurementTechnique:
    type: array
    items:
      type: object
      properties:
        schema:identifier:
          description: Persistent identifier (DOI) assigned to this registered protocol. Enter 'pending'
            if a DOI has been applied for but not yet minted.
          type: string
required:
- schema:funding
