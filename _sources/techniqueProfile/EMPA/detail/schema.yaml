$schema: https://json-schema.org/draft/2020-12/schema
title: EPMA/EMPA Analysis Detail
description: Dataset-level analysis-instance detail for EPMA/EMPA, reusing CDIF/schema.org slots on the
  schema:Dataset root.
allOf:
- $ref: ../../../BaseSchema/modules/group1/schema.yaml#/$defs/AnalysisIdentification
- $ref: ../../../BaseSchema/modules/reportingCore/schema.yaml#/$defs/AllBlocks_Analysis
- type: object
  properties:
    prov:wasGeneratedBy:
      type: array
      items:
        type: object
        properties:
          prov:used:
            type: array
            items:
              type: object
              allOf:
              - if:
                  properties:
                    schema:additionalType:
                      contains:
                        const: EPMA
                  required:
                  - schema:additionalType
                then:
                  properties:
                    ada:acceleratingVoltage:
                      description: Electron beam accelerating voltage in kilovolts (kV). The procedure
                        specifies the standard operating voltage; analysts record and justify any deviations.
                      anyOf:
                      - type: number
                      - type: string
                    ada:beamDiameter:
                      description: Diameter of the electron beam in micrometers. 0 indicates a fully focused
                        beam. Document defocused diameter when used to minimize beam damage or improve
                        spatial averaging for beam-sensitive phases.
                      anyOf:
                      - type: number
                      - type: string
              - if:
                  properties:
                    ada:toolRole:
                      const: acquisition
                  required:
                  - ada:toolRole
                then:
                  properties:
                    schema:name:
                      description: Data acquisition and automation software, including version number.
                      anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
              - if:
                  properties:
                    ada:toolRole:
                      const: dataReduction
                  required:
                  - ada:toolRole
                then:
                  properties:
                    schema:name:
                      description: Software used for matrix correction and quantitative data reduction,
                        if separate from the acquisition software. For mapping workflows, include software
                        used to process count maps into concentration maps.
                      anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
            allOf:
            - contains:
                properties:
                  schema:additionalType:
                    contains:
                      const: EPMA
                required:
                - schema:additionalType
            - contains:
                properties:
                  ada:toolRole:
                    const: acquisition
                required:
                - ada:toolRole
            - contains:
                properties:
                  ada:toolRole:
                    const: dataReduction
                required:
                - ada:toolRole
          schema:description:
            description: 'Any procedure- or analysis-specific information not captured by a structured
              field anywhere in this TAPP — including anomalies, deviations from the registered procedure,
              instrument modifications, and supplementary context. Scope is the whole document, not Group
              6: this is the last field of the TAPP and covers all six groups. Use sparingly; a structured
              field is preferred for anything that can be formally categorised.'
            type: string
          schema:additionalProperty:
            type: array
            items:
              anyOf:
              - &id001
                title: Beam Damage Minimization
                description: Measures taken to minimize beam damage, particularly volatilization or migration
                  of Na, K, F, and Cl in hydrous minerals, glasses, feldspars, phosphates, and carbonates.
                  Document approach, beam conditions used, and phases for which it was applied.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/empaTAPP/beamDamageMinimization
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/empaTAPP/beamDamageMinimization
                  schema:name:
                    const: Beam Damage Minimization
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id002
                title: Beam Raster Dimensions
                description: X x Y dimensions of a small beam raster used at a single analysis point to
                  average a coarse-grained or beam-sensitive phase. Different from X-ray mapping mode;
                  not applicable when mapping.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/empaTAPP/beamRasterDimensions
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/empaTAPP/beamRasterDimensions
                  schema:name:
                    const: Beam Raster Dimensions
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id003
                title: Drift Correction
                description: Method used to monitor and correct for instrument drift (beam current drift,
                  spectrometer drift) during the analytical session.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/empaTAPP/driftCorrection
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/empaTAPP/driftCorrection
                  schema:name:
                    const: Drift Correction
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id004
                title: Dwell Time per Pixel
                description: 'Time spent acquiring X-ray signal at each pixel during X-ray mapping, in
                  milliseconds. For WDS: one value per spectrometer assignment per pixel. For EDS: total
                  live-time per spectrum per pixel, a single value.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/empaTAPP/dwellTimePerPixel
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/empaTAPP/dwellTimePerPixel
                  schema:name:
                    const: Dwell Time per Pixel
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id005
                title: Pre-Analysis Imaging and Screening
                description: Imaging or other characterisation performed before the measurement in order
                  to select or locate the analysed target, including the technique, instrument and settings
                  used, and how individual analyses are linked back to the images. Distinct from any imaging
                  the procedure performs as its own measurement. Where the imaging is performed on a separate
                  instrument, it should also be recorded in the Group 1 coupling fields.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/empaTAPP/preAnalysisImagingAndScreening
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/empaTAPP/preAnalysisImagingAndScreening
                  schema:name:
                    const: Pre-Analysis Imaging and Screening
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id006
                title: Halogen Correction on Oxygen
                description: Whether oxygen content was adjusted to account for halogen substitution (F
                  and/or Cl replacing OH) in halogen-bearing phases such as apatite, amphibole, and mica,
                  where oxygen is calculated by stoichiometry.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/empaTAPP/halogenCorrectionOnOxygen
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/empaTAPP/halogenCorrectionOnOxygen
                  schema:name:
                    const: Halogen Correction on Oxygen
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
              - &id007
                title: Step Size / Pixel Size
                description: Distance between adjacent measurement points in the X-ray map in micrometers,
                  defining the spatial resolution. Report both X and Y step if they differ.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/empaTAPP/stepSizePixelSize
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/empaTAPP/stepSizePixelSize
                  schema:name:
                    const: Step Size / Pixel Size
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id008
                title: EDS Dead Time
                description: Percent dead time reported by the EDS detector during the session — the fraction
                  of total acquisition time the detector spent processing rather than counting. EDS dead
                  time correction is managed automatically by the detector electronics; this field documents
                  the resulting percentage as a session QC metric. Values above ~40% indicate excessive
                  count rate and may degrade spectral quality and quantitative accuracy. Unlike WDS dead
                  time (see WDS Dead Time Correction), no user-selectable correction algorithm is required.
                type: object
                properties:
                  '@id':
                    const: ada:parameter/empaTAPP/edsDeadTime
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/empaTAPP/edsDeadTime
                  schema:name:
                    const: EDS Dead Time
                  schema:value:
                    anyOf:
                    - type: number
                    - type: string
                  schema:unitText:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
                - schema:unitText
              - &id009
                title: Procedural Blank Level
                description: 'The measured level of the analytical blank in the session, and — where the
                  reported quantity is a ratio — its composition, since a blank subtracted from a ratio
                  biases the result unless its own composition is known. Companion to the blank correction
                  method, which is procedure-level: this field records what was actually measured. Follows
                  the criterion-versus-measurement split the library applies wherever a procedure sets
                  a threshold and an analysis reports a value against it.'
                type: object
                properties:
                  '@id':
                    const: ada:parameter/empaTAPP/proceduralBlankLevel
                  '@type':
                    const:
                    - schema:PropertyValue
                  schema:propertyID:
                    const:
                      '@id': ada:parameter/empaTAPP/proceduralBlankLevel
                  schema:name:
                    const: Procedural Blank Level
                  schema:value:
                    type: string
                required:
                - '@id'
                - '@type'
                - schema:propertyID
                - schema:name
                - schema:value
            allOf:
            - contains: *id001
              minContains: 0
              maxContains: 1
            - contains: *id002
              minContains: 0
              maxContains: 1
            - contains: *id003
              minContains: 0
              maxContains: 1
            - contains: *id004
              minContains: 0
              maxContains: 1
            - contains: *id005
              minContains: 0
              maxContains: 1
            - contains: *id006
              minContains: 0
              maxContains: 1
            - contains: *id007
              minContains: 0
              maxContains: 1
            - contains: *id008
              minContains: 0
              maxContains: 1
            - contains: *id009
              minContains: 0
              maxContains: 1
          ada:edsLiveTimePerPointOrPixel:
            description: EDS spectral acquisition live time per analysis point in seconds. Previously
              referred to as "EDS Acquisition Time" in this TAPP and commonly used under that name in
              EPMA and SEM-EDS contexts. Renamed to align with TEM-EDS usage, where the per-point vs.
              per-pixel distinction (point/line mode vs. spectrum image) is explicit. In EPMA, acquisition
              is always per point.
            anyOf:
            - type: number
            - type: string
          schema:object:
            type: array
            items:
              type: object
              allOf:
              - if:
                  properties:
                    '@type':
                      contains:
                        const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                  required:
                  - '@type'
                then:
                  properties:
                    schema:name:
                      description: Name or identifier of each sample analysed in this session, as used
                        in the laboratory — a sample mount, section or aliquot counts as one entry where
                        that is what the laboratory tracks. The analysis record corresponds to one session
                        and may cover several samples; fields whose Keyed By column declares 'sample'
                        take one value per entry. Should match the identifier used in associated publications
                        or data tables.
                      anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    schema:identifier:
                      description: Globally unique, persistent identifier for each sample listed in Sample
                        Name. IGSN (International Geo Sample Number) is the recommended standard for geological
                        and cosmochemical samples, as used by Astromat, EarthChem and SESAR. Where a sample
                        and its sub-samples are separately registered, record the identifier at the level
                        actually analysed.
                      anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
            allOf:
            - contains:
                properties:
                  '@type':
                    contains:
                      const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                required:
                - '@type'
          schema:actionProcess:
            type: object
            properties:
              schema:step:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:name:
                          const: samplePreparation
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:description:
                          description: Description of how samples were prepared for analysis under this
                            procedure (mounting, polishing, coating). Analysts may document session-specific
                            variations from the procedure standard.
                          anyOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                  - if:
                      properties:
                        schema:name:
                          const: dataReduction
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:additionalProperty:
                          type: array
                          items: &id010
                            title: Constants and Reference Values Used
                            description: Physical constants and reference values used in data reduction
                              to calculate the final reported quantity (e.g., decay constants for age
                              calculation, standard isotope ratios, or other citable reference values
                              used in a correction or calculation), together with their source. Distinct
                              from the Group 6 reference-material fields, which document accepted values
                              for specific calibration/validation materials rather than universal physical
                              constants. Record "None" if no citable, revisable physical constants feed
                              into this procedure's data reduction.
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/empaTAPP/constantsAndReferenceValuesUsed
                              '@type':
                                const:
                                - schema:PropertyValue
                              schema:propertyID:
                                const:
                                  '@id': ada:parameter/empaTAPP/constantsAndReferenceValuesUsed
                              schema:name:
                                const: Constants and Reference Values Used
                              schema:value:
                                type: string
                            required:
                            - '@id'
                            - '@type'
                            - schema:propertyID
                            - schema:name
                            - schema:value
                          allOf:
                          - contains: *id010
                            minContains: 0
                            maxContains: 1
                allOf:
                - contains:
                    properties:
                      schema:name:
                        const: samplePreparation
                    required:
                    - schema:name
                - contains:
                    properties:
                      schema:name:
                        const: dataReduction
                    required:
                    - schema:name
    schema:additionalProperty:
      type: array
      items:
        anyOf:
        - &id011
          title: Map Area
          description: Physical dimensions of the mapped region in micrometers (X x Y). Determined at
            analysis time based on the sample feature or region of interest.
          type: object
          properties:
            '@id':
              const: ada:parameter/empaTAPP/mapArea
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/empaTAPP/mapArea
            schema:name:
              const: Map Area
            schema:value:
              anyOf:
              - type: number
              - type: string
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          - schema:unitText
        - &id012
          title: Map Dimensions
          description: Number of pixels in the X-ray map in the X and Y directions. Determined at analysis
            time based on the area of interest and selected step size.
          type: object
          properties:
            '@id':
              const: ada:parameter/empaTAPP/mapDimensions
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/empaTAPP/mapDimensions
            schema:name:
              const: Map Dimensions
            schema:value:
              anyOf:
              - type: number
              - type: string
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          - schema:unitText
      allOf:
      - contains: *id011
        minContains: 0
        maxContains: 1
      - contains: *id012
        minContains: 0
        maxContains: 1
