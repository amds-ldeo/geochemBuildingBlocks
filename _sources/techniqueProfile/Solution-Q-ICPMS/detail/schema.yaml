$schema: https://json-schema.org/draft/2020-12/schema
title: Solution Q-ICP-MS Analysis Detail
description: Dataset-level analysis-instance detail for solution Q-ICP-MS, reusing CDIF/schema.org slots
  on the schema:Dataset root.
type: object
properties:
  schema:measurementTechnique:
    type: array
    items:
      type: object
      properties:
        schema:identifier:
          description: Persistent identifier (DOI) assigned to this registered protocol. Enter 'pending'
            if a DOI has been applied for but not yet minted.
          type: string
  schema:contributor:
    type: array
    items:
      type: object
    allOf:
    - contains:
        properties:
          schema:roleName:
            const: analyst
        required:
        - schema:roleName
  prov:wasGeneratedBy:
    type: array
    items:
      type: object
      properties:
        schema:startDate:
          description: Date on which the analysis session began.
          type: string
        schema:endDate:
          description: Date on which the analysis session ended (if spanning multiple days).
          type: string
        schema:additionalProperty:
          type: array
          items: &id001
            title: Signal Integration Time
            description: Total integration time per analyte per replicate (s). Determined at analysis
              time from the actual acquisition.
            type: object
            properties:
              '@id':
                const: ada:parameter/solutionQicpmsTAPP/signalIntegrationTime
              '@type':
                const:
                - schema:PropertyValue
              schema:propertyID:
                const:
                  '@id': ada:parameter/solutionQicpmsTAPP/signalIntegrationTime
              schema:name:
                const: Signal Integration Time
              schema:value:
                anyOf:
                - type: number
                - type: string
              schema:unitText:
                type: string
            required:
            - '@id'
            - '@type'
            - schema:propertyID
            - schema:name
            - schema:value
            - schema:unitText
          allOf:
          - contains: *id001
            minContains: 0
            maxContains: 1
  schema:funding:
    type: array
  schema:relatedLink:
    type: array
    items:
      type: object
  schema:additionalProperty:
    type: array
    items:
      anyOf:
      - &id002
        title: Sample Aliquot Mass or Volume
        description: Mass (mg) of solid material digested or volume (mL) of liquid taken for dissolution.
          Used for yield calculations and concentration back-calculation.
        type: object
        properties:
          '@id':
            const: ada:parameter/solutionQicpmsTAPP/sampleAliquotMassOrVolume
          '@type':
            const:
            - schema:PropertyValue
          schema:propertyID:
            const:
              '@id': ada:parameter/solutionQicpmsTAPP/sampleAliquotMassOrVolume
          schema:name:
            const: Sample Aliquot Mass or Volume
          schema:value:
            anyOf:
            - type: number
            - type: string
          schema:unitText:
            type: string
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
        - schema:unitText
      - &id003
        title: Make-up Gas Flow Rate
        description: Supplementary argon flow added downstream of a desolvation system to maintain total
          gas delivery to the plasma (L/min). Record 'N/A' if no desolvation system is used.
        type: object
        properties:
          '@id':
            const: ada:parameter/solutionQicpmsTAPP/makeUpGasFlowRate
          '@type':
            const:
            - schema:PropertyValue
          schema:propertyID:
            const:
              '@id': ada:parameter/solutionQicpmsTAPP/makeUpGasFlowRate
          schema:name:
            const: Make-up Gas Flow Rate
          schema:value:
            anyOf:
            - type: number
            - type: string
          schema:unitText:
            type: string
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
        - schema:unitText
      - &id004
        title: Doubly-Charged Species Monitor
        description: Mass ratio monitored to estimate doubly-charged ion (M2+) formation during instrument
          tuning. Doubly-charged ions appear at half the nominal mass of the parent ion and can interfere
          with lighter analyte masses. Ba2+/Ba+ (m/z 69/138) and Ce2+/Ce+ (m/z 70/140) are the most common
          proxies for solution ICP-MS.
        type: object
        properties:
          '@id':
            const: ada:parameter/solutionQicpmsTAPP/doublyChargedSpeciesMonitor
          '@type':
            const:
            - schema:PropertyValue
          schema:propertyID:
            const:
              '@id': ada:parameter/solutionQicpmsTAPP/doublyChargedSpeciesMonitor
          schema:name:
            const: Doubly-Charged Species Monitor
          schema:value:
            type: string
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
      - &id005
        title: Doubly-Charged Species Production
        description: Measured percentage of doubly-charged ion production for the monitored species at
          the time of instrument tuning. Record both the acceptance threshold and the measured value.
          Elevated doubly-charged production indicates incomplete ionization and potential interference
          on elements at approximately half the mass of abundant matrix components.
        type: object
        properties:
          '@id':
            const: ada:parameter/solutionQicpmsTAPP/doublyChargedSpeciesProduction
          '@type':
            const:
            - schema:PropertyValue
          schema:propertyID:
            const:
              '@id': ada:parameter/solutionQicpmsTAPP/doublyChargedSpeciesProduction
          schema:name:
            const: Doubly-Charged Species Production
          schema:value:
            type: string
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
      - &id006
        title: Spike/Outlier Filtering Approach
        description: Criteria used to identify and exclude anomalous replicate measurements or data points
          from the calculated mean.
        type: object
        properties:
          '@id':
            const: ada:parameter/solutionQicpmsTAPP/spikeOutlierFilteringApproach
          '@type':
            const:
            - schema:PropertyValue
          schema:propertyID:
            const:
              '@id': ada:parameter/solutionQicpmsTAPP/spikeOutlierFilteringApproach
          schema:name:
            const: Spike/Outlier Filtering Approach
          schema:value:
            type: string
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
      - &id007
        title: Pulse/Analog Detector Nonlinearity Correction
        description: Whether a correction was applied for nonlinear detector response at the transition
          between pulse-counting and analog detection modes. For Q-ICP-MS instruments with dual-mode SEM
          detectors, a cross-calibration factor is measured and applied at the pulse-to-analog crossover
          threshold. Accurate cross-calibration is critical for analytes spanning a wide concentration
          range in the same session.
        type: object
        properties:
          '@id':
            const: ada:parameter/solutionQicpmsTAPP/pulseAnalogDetectorNonlinearityCorrection
          '@type':
            const:
            - schema:PropertyValue
          schema:propertyID:
            const:
              '@id': ada:parameter/solutionQicpmsTAPP/pulseAnalogDetectorNonlinearityCorrection
          schema:name:
            const: Pulse/Analog Detector Nonlinearity Correction
          schema:value:
            type: string
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
      - &id008
        title: Memory Effect Mitigation
        description: Protocol applied to identify and minimize carry-over of high-concentration elements
          between successive sample introductions. For solution ICP-MS, mitigation is implemented primarily
          at measurement time through extended rinse periods (see Wash Time Between Samples, Group 4).
          At data processing level, documents any flagging or exclusion of measurements preceded by high-concentration
          samples or standards where the required washout time may not have been achieved.
        type: object
        properties:
          '@id':
            const: ada:parameter/solutionQicpmsTAPP/memoryEffectMitigation
          '@type':
            const:
            - schema:PropertyValue
          schema:propertyID:
            const:
              '@id': ada:parameter/solutionQicpmsTAPP/memoryEffectMitigation
          schema:name:
            const: Memory Effect Mitigation
          schema:value:
            type: string
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
      - &id009
        title: Uncertainty Propagation Method
        description: Method used to propagate analytical uncertainties from raw signals through to final
          concentration values.
        type: object
        properties:
          '@id':
            const: ada:parameter/solutionQicpmsTAPP/uncertaintyPropagationMethod
          '@type':
            const:
            - schema:PropertyValue
          schema:propertyID:
            const:
              '@id': ada:parameter/solutionQicpmsTAPP/uncertaintyPropagationMethod
          schema:name:
            const: Uncertainty Propagation Method
          schema:value:
            type: string
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
      - &id010
        title: Normalization/Standards-Based Correction
        description: Post-acquisition normalization applied to output concentrations relative to a reference
          value (e.g., correction to a monitor element's certified value in the calibration standard).
        type: object
        properties:
          '@id':
            const: ada:parameter/solutionQicpmsTAPP/normalizationStandardsBasedCorrection
          '@type':
            const:
            - schema:PropertyValue
          schema:propertyID:
            const:
              '@id': ada:parameter/solutionQicpmsTAPP/normalizationStandardsBasedCorrection
          schema:name:
            const: Normalization/Standards-Based Correction
          schema:value:
            type: string
        required:
        - '@id'
        - '@type'
        - schema:propertyID
        - schema:name
        - schema:value
    allOf:
    - contains: *id002
      minContains: 0
      maxContains: 1
    - contains: *id003
      minContains: 0
      maxContains: 1
    - contains: *id004
      minContains: 0
      maxContains: 1
    - contains: *id005
      minContains: 0
      maxContains: 1
    - contains: *id006
      minContains: 0
      maxContains: 1
    - contains: *id007
      minContains: 0
      maxContains: 1
    - contains: *id008
      minContains: 0
      maxContains: 1
    - contains: *id009
      minContains: 0
      maxContains: 1
    - contains: *id010
      minContains: 0
      maxContains: 1
  dqv:hasQualityMeasurement:
    type: array
    items:
      type: object
    allOf:
    - contains:
        properties:
          dqv:isMeasurementOf:
            const: Oxide production ratio
        required:
        - dqv:isMeasurementOf
required:
- schema:funding
