$schema: https://json-schema.org/draft/2020-12/schema
title: Solution Q-ICP-MS Technique-Aligned Protocol Profile (solutionQicpmsTAPP)
description: Solution quadrupole ICP-MS extension of the base TAPP definition, generated from docs/Solution_Q-ICP-MS_TAPP_v5.xlsx
  via the path-driven pipeline.
allOf:
- $ref: ../../../BaseSchema/tappDefinition/schema.yaml
- type: object
  properties:
    schema:name:
      description: A short descriptive name for this analytical protocol. Should include instrument, technique,
        and analyte scope.
      type: string
    schema:measurementTechnique:
      type: array
      items:
        type: object
        properties:
          schema:termCode:
            description: Top-level analytical technique identifier.
            type: string
            enum:
            - Solution Q-ICP-MS
    schema:creator:
      type: object
      properties:
        schema:name:
          description: Person(s) or laboratory responsible for developing and registering this protocol.
          type: string
    schema:location:
      type: object
      properties:
        schema:name:
          description: Name of the laboratory or institution hosting the instrument.
          type: string
        schema:identifier:
          description: Persistent identifier for the laboratory (e.g., ROR ID).
          type: string
    schema:datePublished:
      description: First date this protocol configuration was used in production.
      type: string
    schema:funding:
      type: array
      items:
        type: object
        properties:
          schema:name:
            description: Grants and funding that supported development of this protocol. Include grant
              IDs.
            type: string
    schema:relatedLink:
      type: array
      items:
        type: object
    schema:object:
      type: array
      items:
        type: object
      allOf:
      - contains:
          properties:
            '@type':
              contains:
                const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
          required:
          - '@type'
    schema:additionalProperty:
      type: array
      items:
        anyOf:
        - &id001
          title: Sample IGSN
          description: International Geo Sample Number (IGSN) or other persistent identifier for the sample.
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionQicpmsTAPP/sampleIgsn
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/solutionQicpmsTAPP/sampleIgsn
            schema:name:
              const: Sample IGSN
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
        - &id002
          title: Sample Aliquot Mass or Volume
          description: Mass (mg) of solid material digested or volume (mL) of liquid taken for dissolution.
            Used for yield calculations and concentration back-calculation.
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionQicpmsTAPP/sampleAliquotMassOrVolumeDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: sampleAliquotMassOrVolumeDefault
            schema:name:
              const: Sample Aliquot Mass or Volume
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: mg or mL
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id003
          title: Desolvation System
          description: Desolvating nebulizer or membrane desolvator used upstream of the plasma to reduce
            solvent load. Lowers oxide production rates and increases sensitivity for selected element
            groups (e.g., ApexQ for chalcophile elements). Record 'None' if not used.
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionQicpmsTAPP/desolvationSystem
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/solutionQicpmsTAPP/desolvationSystem
            schema:name:
              const: Desolvation System
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
        - &id004
          title: Make-up Gas Flow Rate
          description: Supplementary argon flow added downstream of a desolvation system to maintain total
            gas delivery to the plasma (L/min). Record 'N/A' if no desolvation system is used.
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionQicpmsTAPP/makeUpGasFlowRateDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: makeUpGasFlowRateDefault
            schema:name:
              const: Make-up Gas Flow Rate
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: L/min
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id005
          title: Internal Standard Concentration
          description: Target concentration of internal standard element(s) in all measured solutions
            (µg/L or ppb).
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionQicpmsTAPP/internalStandardConcentration
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/solutionQicpmsTAPP/internalStandardConcentration
            schema:name:
              const: Internal Standard Concentration
            schema:value:
              anyOf:
              - type: number
              - type: string
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          - schema:unitText
        - &id006
          title: Doubly-Charged Species Monitor
          description: Mass ratio monitored to estimate doubly-charged ion (M2+) formation during instrument
            tuning. Doubly-charged ions appear at half the nominal mass of the parent ion and can interfere
            with lighter analyte masses. Ba2+/Ba+ (m/z 69/138) and Ce2+/Ce+ (m/z 70/140) are the most
            common proxies for solution ICP-MS.
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionQicpmsTAPP/doublyChargedSpeciesMonitorDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: doublyChargedSpeciesMonitorDefault
            schema:name:
              const: Doubly-Charged Species Monitor
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id007
          title: Doubly-Charged Species Production
          description: Measured percentage of doubly-charged ion production for the monitored species
            at the time of instrument tuning. Record both the acceptance threshold and the measured value.
            Elevated doubly-charged production indicates incomplete ionization and potential interference
            on elements at approximately half the mass of abundant matrix components.
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionQicpmsTAPP/doublyChargedSpeciesProductionDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: doublyChargedSpeciesProductionDefault
            schema:name:
              const: Doubly-Charged Species Production
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id008
          title: Spike/Outlier Filtering Approach
          description: Criteria used to identify and exclude anomalous replicate measurements or data
            points from the calculated mean.
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionQicpmsTAPP/spikeOutlierFilteringApproachDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: spikeOutlierFilteringApproachDefault
            schema:name:
              const: Spike/Outlier Filtering Approach
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id009
          title: Pulse/Analog Detector Nonlinearity Correction
          description: Whether a correction was applied for nonlinear detector response at the transition
            between pulse-counting and analog detection modes. For Q-ICP-MS instruments with dual-mode
            SEM detectors, a cross-calibration factor is measured and applied at the pulse-to-analog crossover
            threshold. Accurate cross-calibration is critical for analytes spanning a wide concentration
            range in the same session.
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionQicpmsTAPP/pulseAnalogDetectorNonlinearityCorrectionDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: pulseAnalogDetectorNonlinearityCorrectionDefault
            schema:name:
              const: Pulse/Analog Detector Nonlinearity Correction
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id010
          title: Memory Effect Mitigation
          description: Protocol applied to identify and minimize carry-over of high-concentration elements
            between successive sample introductions. For solution ICP-MS, mitigation is implemented primarily
            at measurement time through extended rinse periods (see Wash Time Between Samples, Group 4).
            At data processing level, documents any flagging or exclusion of measurements preceded by
            high-concentration samples or standards where the required washout time may not have been
            achieved.
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionQicpmsTAPP/memoryEffectMitigationDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: memoryEffectMitigationDefault
            schema:name:
              const: Memory Effect Mitigation
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id011
          title: Uncertainty Propagation Method
          description: Method used to propagate analytical uncertainties from raw signals through to final
            concentration values.
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionQicpmsTAPP/uncertaintyPropagationMethodDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: uncertaintyPropagationMethodDefault
            schema:name:
              const: Uncertainty Propagation Method
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id012
          title: Normalization/Standards-Based Correction
          description: Post-acquisition normalization applied to output concentrations relative to a reference
            value (e.g., correction to a monitor element's certified value in the calibration standard).
          type: object
          properties:
            '@id':
              const: ada:parameter/solutionQicpmsTAPP/normalizationStandardsBasedCorrectionDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: normalizationStandardsBasedCorrectionDefault
            schema:name:
              const: Normalization/Standards-Based Correction
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
      allOf:
      - contains: *id001
        minContains: 0
        maxContains: 1
      - contains: *id002
        minContains: 0
        maxContains: 1
      - contains: *id003
        minContains: 0
        maxContains: 1
      - contains: *id004
        minContains: 0
        maxContains: 1
      - contains: *id005
        minContains: 0
        maxContains: 1
      - contains: *id006
        minContains: 0
        maxContains: 1
      - contains: *id007
        minContains: 0
        maxContains: 1
      - contains: *id008
        minContains: 0
        maxContains: 1
      - contains: *id009
        minContains: 0
        maxContains: 1
      - contains: *id010
        minContains: 0
        maxContains: 1
      - contains: *id011
        minContains: 0
        maxContains: 1
      - contains: *id012
        minContains: 0
        maxContains: 1
    schema:actionProcess:
      type: object
      properties:
        schema:step:
          type: array
          items:
            type: object
          allOf:
          - contains:
              properties:
                schema:name:
                  const: samplePreparation
              required:
              - schema:name
    ada:digestionAcid:
      description: Acid mixture used for sample dissolution. Record acid type(s) and concentration(s)
        where known (e.g., concentrated HF–HNO3, HNO3–HCl).
      type: string
    ada:digestionVesselType:
      description: Type of vessel used for acid digestion. Vessel type constrains maximum temperature
        and pressure and determines suitability for refractory mineral dissolution.
      type: string
      enum:
      - Savillex beaker
      - Parr bomb
      - Carius tube
      - HPA-S
      - Open beaker
      - N/A
      - None
    ada:numberOfDigestionSteps:
      description: Total number of distinct acid digestion steps required to dissolve the sample. Some
        protocols require multiple sequential steps (e.g., an initial open-beaker HF–HNO3 dissolution
        followed by a second closed-vessel step for residues retaining refractory minerals).
      anyOf:
      - type: integer
      - type: string
    ada:digestionTemperature:
      description: Temperature at which acid digestion was carried out (°C). Protocol specifies the target
        temperature.
      anyOf:
      - type: number
      - type: string
    ada:digestionDuration:
      description: Duration of the primary acid digestion step (hours or days).
      type: string
    ada:finalSolutionMatrix:
      description: Acid type and concentration of the final dissolved sample solution introduced to the
        instrument. Directly affects instrument response and ion transmission.
      type: string
    ada:chromatographicSeparationApplied:
      description: Whether chromatographic separation of element groups (e.g., using ion exchange resin)
        was performed prior to ICP-MS analysis. Common for protocols requiring matrix removal or interference
        elimination before measurement (e.g., Fe and Cu–Zn for isotope dilution). Record resin type and
        matrix conditions if applied. Record 'None' if direct digestion solution is analyzed.
      type: string
      enum:
      - Anion exchange resin (HCl)
      - Cation exchange resin
      - AG1-X8 (HBr)
      - None
      - N/A
    ada:isotopeDilutionSpike:
      description: Isotopic spike material added to the sample before or during digestion for isotope
        dilution (ID) analysis. Record spike name or certificate reference and spike isotope(s). Record
        'None' if ID technique is not used.
      type: string
    ada:instrumentMakeAndModel:
      description: Manufacturer and model name of the quadrupole ICP-MS instrument (e.g., Thermo iCAP
        RQ, Agilent 7900, PerkinElmer NexION 350D). Determines instrument-specific tuning parameters and
        available cell configurations.
      type: string
    schema:instrument:
      type: array
      items:
        type: object
      allOf:
      - contains:
          properties:
            schema:additionalType:
              contains:
                const: ICP-MS
          required:
          - schema:additionalType
    ada:nebulizerType:
      description: Type and material of the pneumatic nebulizer used for sample introduction. Affects
        droplet size distribution and sample introduction efficiency.
      type: string
    ada:sprayChamberTypeAndCoolingTemperature:
      description: Type of spray chamber and cooling temperature if thermostatted (°C). Chamber type and
        temperature control aerosol droplet size and the solvent vapor load reaching the plasma.
      type: string
    ada:sampleUptakeRate:
      description: Peristaltic pump speed or self-aspiration flow rate for sample introduction (µL/min
        or mL/min).
      anyOf:
      - type: number
      - type: string
    bios:computationalTool:
      type: array
      items:
        type: object
        properties: {}
    ada:rfPower:
      description: Radiofrequency forward power applied to the plasma (W). Controls ionization efficiency
        and oxide production rates.
      anyOf:
      - type: number
      - type: string
    ada:coolantGasFlowRate:
      description: Flow rate of the outer (coolant) argon gas stream (L/min). Influences plasma temperature
        and oxide ion formation.
      anyOf:
      - type: number
      - type: string
    ada:auxiliaryGasFlowRate:
      description: Flow rate of the intermediate (auxiliary) argon gas stream between torch body and injector
        tube (L/min).
      anyOf:
      - type: number
      - type: string
    ada:nebulizerGasFlowRate:
      description: Flow rate of the carrier argon gas delivered through the nebulizer (L/min). Controls
        aerosol transport and strongly influences signal sensitivity.
      anyOf:
      - type: number
      - type: string
    ada:plasmaThermalMode:
      description: Whether the ICP plasma is operated under cool plasma or normal (hot) plasma conditions.
        Normal plasma (>1000 W RF) is standard for most solution ICP-MS analyses. Cool plasma (≤900 W
        RF) reduces argide-based interferences (e.g., 40Ar12C+ on 52Cr) at the cost of reduced sensitivity
        and ionization efficiency for most elements.
      type: string
      enum:
      - Normal plasma
      - Cool plasma
      - N/A
      - None
    ada:analyteTemplate:
      type: object
      properties:
        ada:defaultAnalytes:
          type: array
          items:
            description: Elements or isotopes this protocol is designed to measure. The protocol registers
              the full analyte suite; at analysis level, the analyst records the specific subset actually
              measured in the session, which may be narrower if certain masses were excluded due to interferences
              or scope reduction. Fields flagged as Analyte-Specific in the Comments column apply individually
              to each element or isotope in this list.
            type: string
        ada:analyteColumns:
          type: array
          items:
            type: object
            properties: {}
    ada:monitoredIsotopes:
      type: array
      items:
        description: Specific isotope(s) monitored per analyte element in this protocol, including any
          interference-monitor masses. Analyte-specific field.
        type: string
    ada:dwellTime:
      description: Integration time spent on each mass peak per sweep (ms). May differ per analyte if
        analyte-specific dwell times are programmed.
      anyOf:
      - type: number
      - type: string
    ada:massCyclesPerReplicate:
      description: Number of complete mass scans (sweeps) accumulated per analytical replicate.
      anyOf:
      - type: integer
      - type: string
    ada:numberOfReplicatesPerSample:
      description: Number of discrete replicate measurements acquired per sample solution.
      anyOf:
      - type: integer
      - type: string
    ada:sampleSequenceDesign:
      description: 'Description of the measurement order within a session: how samples, blanks, calibration
        standards, and reference materials are interleaved.'
      type: string
    ada:washTimeBetweenSamples:
      description: Duration of instrument rinse between successive sample solutions (seconds). Controls
        carryover and memory effects.
      anyOf:
      - type: number
      - type: string
    ada:signalCollectionMode:
      description: Mode used to collect ion signal across the monitored masses. In peak hopping mode,
        the quadrupole jumps sequentially between pre-set mass positions and dwells at each peak; in scanning
        mode, the quadrupole sweeps continuously across a defined mass range. Peak hopping is standard
        for multi-element trace analysis as it maximises integration time at each mass.
      type: string
      enum:
      - Peak hopping
      - Scanning
      - N/A
      - None
    ada:internalStandardElement:
      description: Element(s) added at a known concentration to all solutions (samples, blanks, calibration
        standards) and used as internal standards for drift correction and matrix normalization. Specify
        element and monitored isotope.
      type: string
    ada:oxideProductionMethodAndThreshold:
      description: Method used to quantify plasma oxide production and the acceptance threshold applied
        before commencing analysis. For solution ICP-MS, CeO+/Ce+ (m/z 156/140) is the standard monitor
        proxy. Record both the monitored mass ratio and the maximum allowed oxide rate threshold. Measured
        values are recorded in Oxide Production.
      type: string
    ada:internalStandardApproach:
      description: 'Role(s) assigned to the internal standard(s) in data reduction: drift correction only,
        matrix normalization, or a combination.'
      type: string
      enum:
      - Drift correction only
      - Matrix normalization
      - Drift + matrix normalization
      - N/A
      - None
    ada:driftCorrectionMethod:
      description: Method used to correct for instrumental signal drift across a session.
      type: string
      enum:
      - IS normalization
      - Standard bracketing
      - IS normalization + bracketing
      - None
      - N/A
    ada:perAnalyteCalibrationStrategy:
      type: array
      items:
        description: Approach used to convert measured ion signals to elemental concentrations. Documents
          cases where different analytes or analyte groups are calibrated using different strategies within
          the same protocol. If a single strategy is applied uniformly to all analytes, record that strategy.
        type: string
        enum:
        - External calibration (all analytes)
        - Isotope dilution (all analytes)
        - ID for Zn (67Zn spike); external calibration for all other elements
        - External calibration + standard addition
        - N/A
        - None
    ada:signalIntegrationIntervalMethod:
      description: Method used to define the integration window for each replicate measurement (e.g.,
        full acquisition time, stable-interval selection, automated criteria).
      type: string
      enum:
      - Full replicate
      - Stable interval selection
      - Automated peak detection
      - N/A
      - None
    ada:blankBackgroundCorrectionMethod:
      description: Method used to subtract instrument background and/or procedural blank from sample signals.
      type: string
      enum:
      - On-peak zero
      - Solution blank
      - Procedural blank
      - N/A
      - None
    ada:isobaricInterferenceCorrection:
      type: array
      items:
        description: Whether mathematical corrections for isobaric or polyatomic interferences are applied
          during data reduction (in addition to any KED or DRC mitigation in the instrument).
        type: string
        enum:
        - Y
        - N
        - Analyte-specific
        - N/A
        - None
    ada:interferingSpecies:
      type: array
      items:
        description: List of isobaric or polyatomic species mathematically corrected in data reduction.
          Analyte-specific. For Q-ICP-MS, common interferences include ArCl+ on 75As, MoO+ species on
          Cd isotopes, and BaO+ on Eu. Additional interference mitigation via KED or DRC is documented
          in Group 3 and Group 4.
        type: string
    ada:isobaricInterferenceCorrectionMethod:
      type: array
      items:
        description: Mathematical approach used to calculate and remove interference contributions from
          measured signals (e.g., interference standard solutions isolating specific polyatomics, mass-balance
          equations using empirical correction factors).
        type: string
    ada:isotopeDilutionDataReductionMethod:
      description: Mass balance approach used to calculate sample mass fractions from spike–sample isotope
        ratio measurements. Record 'None' if isotope dilution is not used.
      type: string
    ada:primaryStandardName:
      description: Name and reference material identifier of the external calibration standard used to
        convert signal intensities to elemental concentrations.
      type: string
    ada:calibrationMeasurementFrequency:
      description: How often the primary calibration standard is measured relative to unknown samples
        within a session.
      type: string
    ada:secondaryReferenceMaterial:
      type: array
      items:
        description: Reference material(s) measured as unknowns to independently assess analytical accuracy.
          Specify material name and expected-value source.
        type: string
    schema:description:
      description: Any protocol- or analysis-specific information not captured by other fields, including
        anomalies, deviations from protocol, or supplementary context.
      type: string
  required:
  - schema:name
  - schema:datePublished
  - ada:digestionAcid
  - ada:digestionVesselType
  - ada:numberOfDigestionSteps
  - ada:digestionTemperature
  - ada:digestionDuration
  - ada:finalSolutionMatrix
  - ada:chromatographicSeparationApplied
  - ada:isotopeDilutionSpike
  - ada:instrumentMakeAndModel
  - ada:nebulizerType
  - ada:sprayChamberTypeAndCoolingTemperature
  - ada:sampleUptakeRate
  - ada:rfPower
  - ada:coolantGasFlowRate
  - ada:auxiliaryGasFlowRate
  - ada:nebulizerGasFlowRate
  - ada:plasmaThermalMode
  - ada:dwellTime
  - ada:massCyclesPerReplicate
  - ada:numberOfReplicatesPerSample
  - ada:sampleSequenceDesign
  - ada:washTimeBetweenSamples
  - ada:signalCollectionMode
  - ada:internalStandardElement
  - ada:oxideProductionMethodAndThreshold
  - ada:internalStandardApproach
  - ada:driftCorrectionMethod
  - ada:signalIntegrationIntervalMethod
  - ada:blankBackgroundCorrectionMethod
  - ada:isotopeDilutionDataReductionMethod
  - ada:primaryStandardName
  - ada:calibrationMeasurementFrequency
