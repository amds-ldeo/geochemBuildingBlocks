$schema: https://json-schema.org/draft/2020-12/schema
title: ADA UVFM Product Profile
description: Technique-specific profile for Ultraviolet Fluorescence Microscopy (UVFM) products. Extends the base ADA product profile with constraints on valid UVFM component types.
allOf:
  - $ref: ../../../BaseSchema/adaProduct/schema.yaml
  - type: object
    properties:
      schema:additionalType:
        description: Must include a UVFM product type identifier.
        contains:
          enum:
            - Fluorescence Microscopy (UVFM) Image
            - UV Fluorescence Microscopy
      schema:distribution:
        description: Distribution items for adaUVFM. Archive hasPart items must have ada:componentType from technique-specific or universal values.
        type: array
        items:
          type: object
          properties:
            schema:hasPart:
              items:
                type: object
                anyOf:
                  - $ref: ../../../BaseSchema/adaProduct/schema.yaml#/$defs/universalComponentTypeBranch
                  - properties:
                      ada:componentType:
                        type: string
                        enum:
                          - ada:UVFMImage
                          - ada:UVFMImageCollection
                          - ada:visImage
                    required:
                      - ada:componentType
      schema:subjectOf:
        properties:
          dcterms:conformsTo:
            contains:
              type: object
              properties:
                '@id':
                  const: 'https://w3id.org/geochem/metadata/profiles/adaUVFM'
