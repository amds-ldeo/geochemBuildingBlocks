$schema: https://json-schema.org/draft/2020-12/schema
title: SEM Imaging Technique-Aligned Protocol Profile (semImagingTAPP)
description: 'Scanning electron microscopy imaging (SE/BSE/CL/EBSD) extension of the base TAPP definition.
  Basic protocol-tier fields are required top-level ada: properties; Advanced protocol-tier fields are
  schema:additionalProperty[] entries. No ada:analyteTemplate (imaging has no per-element analyte axis).
  Generated from docs/SEM_Imaging_TAPP_v4.xlsx by tools/build_tapp.py.'
allOf:
- $ref: ../../../BaseSchema/tappDefinition/schema.yaml
- type: object
  properties:
    schema:name:
      description: A short descriptive name for this analytical protocol. Should include instrument, technique,
        analytical mode(s), and target material scope.
      type: string
    schema:measurementTechnique:
      type: array
      items:
        type: object
        properties:
          schema:termCode:
            description: Top-level analytical technique identifier.
            type: string
            enum:
            - SEM
            - SEM/FIB-SEM
            - N/A
            - None
    schema:creator:
      type: object
      properties:
        schema:name:
          description: Person(s) or laboratory responsible for developing and registering this protocol.
          type: string
    schema:location:
      type: object
      properties:
        schema:name:
          description: Name of the laboratory or institution hosting the instrument.
          type: string
        schema:identifier:
          description: Persistent identifier for the laboratory (e.g., ROR ID).
          type: string
    schema:datePublished:
      description: First date this protocol configuration was used in production.
      type: string
    schema:funding:
      type: array
      items:
        type: object
        properties:
          schema:name:
            description: Grants and funding that supported development of this protocol. Include grant
              IDs.
            type: string
    schema:relatedLink:
      type: array
      items:
        type: object
    schema:object:
      type: array
      items:
        type: object
      allOf:
      - contains:
          properties:
            '@type':
              contains:
                const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
          required:
          - '@type'
    schema:actionProcess:
      type: object
      properties:
        schema:step:
          type: array
          items:
            type: object
          allOf:
          - contains:
              properties:
                schema:name:
                  const: samplePreparation
              required:
              - schema:name
    ada:instrumentManufacturer:
      description: Make of the SEM or FIB-SEM instrument.
      type: string
      enum:
      - JEOL
      - Zeiss
      - FEI / Thermo Fisher Scientific
      - Hitachi
      - Tescan
      - Phenom
      - Unknown
      - N/A
      - None
    ada:instrumentModel:
      description: Model designation of the SEM or FIB-SEM instrument, including generation suffix if
        applicable.
      type: string
    ada:electronSource:
      description: Type of electron gun used in the SEM instrument.
      type: string
      enum:
      - Cold-FEG
      - Schottky FEG
      - LaB6 / CeB6
      - Tungsten (W)
      - Unknown
      - N/A
      - None
    ada:instrumentVariant:
      description: 'Broad platform type of the instrument. ''Standard SEM'': dedicated electron-only SEM
        column. ''FIB-SEM dual-beam'': combined focused ion beam and SEM columns (enables TEM specimen
        preparation, 3D serial sectioning, ion-beam milling). ''VP-SEM / ESEM'': variable-pressure or
        environmental SEM for imaging uncoated, hydrated, or charging specimens. An instrument may combine
        categories (e.g., FIB-SEM with VP capability).'
      type: string
      enum:
      - Standard SEM
      - FIB-SEM dual-beam
      - VP-SEM / ESEM
      - FIB-SEM dual-beam + VP
      - N/A
      - None
    ada:seDetectorType:
      description: Type of secondary electron detector used. Everhart-Thornley (ET) detector is the standard
        off-axis collector sensitive to SE2 and some BSE; in-lens (TLD) detectors collect high-resolution
        SE1 signal at short working distances; GSED/ESED detectors operate in VP/ESEM mode by using the
        chamber gas as the signal amplification medium.
      type: string
      enum:
      - Everhart-Thornley (ET)
      - In-lens / TLD (through-the-lens)
      - GSED (VP/ESEM)
      - ESED (VP/ESEM)
      - N/A
      - None
    ada:bseDetectorType:
      description: Type of backscattered electron detector. Solid-state diode detectors (single or segmented)
        are standard; YAG scintillator detectors offer high sensitivity at low voltage. Segmented detectors
        can operate in composition mode (segments summed) or topography mode (differential signal between
        segments). In-lens BSE detectors provide improved BSE collection at short working distances.
      type: string
      enum:
      - Solid-state diode (single)
      - Solid-state diode (segmented, composition mode)
      - Solid-state diode (segmented, topography mode)
      - In-lens BSE
      - YAG scintillator
      - N/A
      - None
    schema:additionalProperty:
      type: array
      items:
        anyOf:
        - &id001
          title: CL Detector Configuration
          description: CL detector type, manufacturer, model, collection optics (e.g., parabolic mirror,
            elliptical mirror, light guide), and spectral detection configuration (PMT for panchromatic,
            CCD/EMCCD for spectral, multi-channel for pseudo-color CL).
          type: object
          properties:
            '@id':
              const: ada:parameter/semImagingTAPP/clDetectorConfiguration
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/semImagingTAPP/clDetectorConfiguration
            schema:name:
              const: CL Detector Configuration
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
        - &id002
          title: Chamber Pressure
          description: Chamber pressure and gas type during analysis. Required for variable pressure (VP-SEM)
            and environmental SEM (ESEM) modes. Report value and unit (Pa or Torr) and gas composition.
            Use 'None' for standard high-vacuum operation.
          type: object
          properties:
            '@id':
              const: ada:parameter/semImagingTAPP/chamberPressureDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: chamberPressureDefault
            schema:name:
              const: Chamber Pressure
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id003
          title: Image Pixel Size
          description: Physical size of each image pixel at the sample surface, in nm or µm. Defines spatial
            sampling of SE or BSE images. For large-area mosaic imaging, report the pixel size of individual
            tiles and the number and arrangement of tiles.
          type: object
          properties:
            '@id':
              const: ada:parameter/semImagingTAPP/imagePixelSize
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/semImagingTAPP/imagePixelSize
            schema:name:
              const: Image Pixel Size
            schema:value:
              anyOf:
              - type: number
              - type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
        - &id004
          title: CL Wavelength Calibration Reference
          description: Reference light source or standard material used to calibrate the wavelength axis
            of the CL spectrometer. Required for quantitative spectral CL and hyperspectral mapping.
          type: object
          properties:
            '@id':
              const: ada:parameter/semImagingTAPP/clWavelengthCalibrationReferenceDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: clWavelengthCalibrationReferenceDefault
            schema:name:
              const: CL Wavelength Calibration Reference
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
      allOf:
      - contains: *id001
        minContains: 0
        maxContains: 1
      - contains: *id002
        minContains: 0
        maxContains: 1
      - contains: *id003
        minContains: 0
        maxContains: 1
      - contains: *id004
        minContains: 0
        maxContains: 1
    ada:ebsdDetectorConfiguration:
      description: EBSD detector manufacturer, model, and camera resolution. Include whether EBSD and
        EDS are acquired simultaneously (common on modern combined EBSD-EDS systems).
      type: string
    bios:computationalTool:
      type: array
      items:
        type: object
        properties: {}
    ada:analyticalMode:
      type: array
      items:
        description: Primary analytical mode(s) executed under this protocol. For multi-mode protocols
          (e.g., simultaneous BSE + EDS mapping), list all active modes.
        type: string
        enum:
        - SE Imaging
        - BSE Imaging
        - EDS
        - SEM-WDS
        - CL
        - EBSD
        - TEM Sample Preparation
        - 3D Tomography
        - N/A
        - None
    ada:acceleratingVoltage:
      description: Electron beam accelerating voltage in kilovolts. Affects X-ray generation depth (EDS/WDS),
        EBSD pattern quality, imaging resolution, and beam penetration. Low voltages (1-5 kV) improve
        surface sensitivity and reduce beam damage; high voltages (15-20 kV) improve X-ray generation
        for quantitative analysis.
      anyOf:
      - type: number
      - type: string
    ada:beamCurrent:
      description: Electron beam probe current. Higher current improves signal-to-noise for X-ray analysis
        (EDS/WDS, EBSD) and CL but may increase beam damage and reduce spatial resolution. Express in
        nA; for sub-nA values use decimal notation (e.g., 0.4 nA).
      anyOf:
      - type: number
      - type: string
    ada:workingDistance:
      description: Distance between the objective lens pole piece and the specimen surface in millimetres.
        Affects spatial resolution, depth of focus, EDS X-ray take-off angle, and EBSD geometry.
      anyOf:
      - type: number
      - type: string
    ada:dwellTimePerPixel:
      description: Time the electron beam dwells on each pixel during raster scanning (imaging modes)
        or on each step position during compositional mapping (EDS and WDS mapping modes), in microseconds
        or milliseconds. Longer dwell time improves signal-to-noise and counting statistics but increases
        total dose and can cause beam damage or contamination on sensitive materials. For WDS mapping,
        the dwell time is per spectrometer per pixel.
      anyOf:
      - type: number
      - type: string
    ada:clAcquisitionMode:
      description: 'CL data collection strategy. Panchromatic: total light intensity collected by PMT
        across the full detector wavelength range. Spectral point: full CL spectrum at discrete point
        locations. Hyperspectral map: full CL spectrum acquired at each pixel of a raster scan.'
      type: string
      enum:
      - Panchromatic
      - Spectral point
      - Hyperspectral map
      - Multi-channel pseudo-color
      - N/A
      - None
    ada:clWavelengthRange:
      description: Detection wavelength range of the CL system in nm. The range is set by the detector
        sensitivity and any optical filters installed.
      anyOf:
      - type: number
      - type: string
    ada:clIntegrationTime:
      description: Acquisition time per pixel (hyperspectral map mode) or per spectrum (spectral point
        mode), in ms or s. Longer integration improves signal-to-noise but increases beam dose and acquisition
        time.
      anyOf:
      - type: number
      - type: string
    ada:sampleTiltAngle:
      description: Sample tilt angle for EBSD acquisition in degrees, measured from horizontal. Standard
        EBSD geometry uses 70 degrees tilt toward the EBSD camera to maximise diffracted electron signal.
      anyOf:
      - type: number
      - type: string
    ada:crystalStructureDatabase:
      description: Crystal structure database used for EBSD phase identification and Kikuchi pattern simulation.
      type: string
    schema:description:
      description: Any additional context about this protocol or analysis session not captured by structured
        fields above.
      type: string
  required:
  - schema:name
  - schema:datePublished
  - ada:instrumentManufacturer
  - ada:instrumentModel
  - ada:electronSource
  - ada:instrumentVariant
  - ada:seDetectorType
  - ada:bseDetectorType
  - ada:ebsdDetectorConfiguration
  - ada:acceleratingVoltage
  - ada:beamCurrent
  - ada:workingDistance
  - ada:dwellTimePerPixel
  - ada:clAcquisitionMode
  - ada:clWavelengthRange
  - ada:clIntegrationTime
  - ada:sampleTiltAngle
  - ada:crystalStructureDatabase
