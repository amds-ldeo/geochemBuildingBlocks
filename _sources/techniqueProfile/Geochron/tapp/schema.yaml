    ada:gasBlank:
      description: Duration of the background (gas blank) measurement and how it is applied to correct
        the ablation signal.
      type: string
      readOnly: true
    ada:elementalFractionationCorrection:
      type: array
      items:
        description: Method used to correct for laser-induced elemental fractionation (LIEF), including
          any assumption about reference-material/sample behaviour equivalence, as reported in Table 3
          of Horstwood et al. (2016).
        type: string
        readOnly: true
    ada:massBiasCorrectionStrategy:
      description: Primary strategy used to correct for instrumental isotopic mass fractionation (mass
        bias/mass discrimination).
      type: string
      enum:
      - Internal normalization
      readOnly: true
    ada:internalNormalizationElementAndIsotopeRatio:
      description: Element and isotope ratio used as the internal normalization standard for mass bias
        correction, and how the resulting correction is applied to analyte ratios.
      type: string
      readOnly: true
    ada:commonPbCorrectionCompositionAndUncertainty:
      description: Whether a common-Pb correction was applied, and if so, the model composition (e.g.,
        Stacey and Kramers 1975) and its uncertainty used in the correction.
      type: string
      readOnly: true
    ada:constantsAndReferenceValuesUsed:
      description: 'Physical constants and reference values used in data reduction to calculate the final
        reported quantity (e.g., decay constants for age calculation, the 238U/235U ratio used to convert
        measured 235U-based data to 207Pb/235U, or other citable reference values), together with their
        source. Distinct from Reference Material Information (Group 6), which documents accepted values
        for specific calibration/validation materials rather than universal physical constants. Critical
        for traceability: community-recommended values for decay constants and isotope ratios are periodically
        revised (e.g., the 238U/235U ratio revision by Hiess et al. 2012), and a reported age or ratio
        can only be correctly reinterpreted against a future revision if the constants originally used
        are known.'
      type: string
    ada:perAnalyteCalibrationStrategy:
      type: array
      items:
        description: Documents cases where different analytes are calibrated using different strategies
          within the same session. If a single strategy applies uniformly, record that here.
        type: string
        enum:
        - 'Single strategy: matrix-matched primary reference material for all analytes'
        - N/A
        readOnly: true
    ada:signalIntegrationIntervalMethod:
      description: Approach used to select the stable signal interval for integration during data reduction,
        and to exclude anomalous signals from inclusions, cracks, or mixed domains. Central to interpreting
        excess scatter/MSWD in the resulting age population.
      type: string
      readOnly: true
    ada:isotopeDilutionDataReductionMethod:
      description: Mass balance approach used to calculate sample mass fractions from spike-sample isotope
        ratio measurements, relevant when a concentration spike (e.g., ²³⁵U, as in Table 3's own worked
        example) is co-aspirated. Record 'None' if isotope dilution is not used.
      type: string
      readOnly: true
    ada:primaryStandardName:
      description: Primary reference material used to calibrate the instrument and convert raw signal
        intensities to ages/isotope ratios. Include citation for the accepted values used.
      type: string
    ada:secondaryReferenceMaterial:
      type: array
      items:
        description: Quality-control reference material(s) analysed as unknowns alongside samples in the
          same session to assess accuracy and monitor drift. Include citation/accepted values for each.
        type: string
    ada:calibrationMeasurementFrequency:
      description: How often the primary calibration standard is measured relative to unknown samples
        within a session, i.e. the bracketing interval used to monitor and correct for instrumental drift.
        Implied but not stated explicitly in Table 3 (Horstwood et al. 2016) via the validation-material
        n counts.
      type: string
      readOnly: true
