    ada:sampleIntroduction:
      description: Configuration by which the ablated aerosol is delivered to the plasma, including any
        co-aspirated tracer or spike solution (e.g., a Tl solution used for instrumental mass bias correction,
        or a ²³⁵U spike used for isotope dilution).
      type: string
      readOnly: true
    bios:computationalTool:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              ada:toolRole:
                const: acquisition
            required:
            - ada:toolRole
          then:
            properties:
              schema:name:
                description: Instrument control and data acquisition software used to collect raw signal
                  data, including version number.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
        - if:
            properties:
              ada:toolRole:
                const: dataReduction
            required:
            - ada:toolRole
          then:
            properties:
              schema:name:
                description: Software used for signal processing, background subtraction, downhole fractionation
                  correction, and age calculation, including version number.
                anyOf:
                - type: string
                - type: array
                  items:
                    type: string
    ada:analyticalMode:
      type: array
      items:
        description: Procedure-level declaration of the analytical mode(s) this procedure covers. This
          TAPP is scoped to static spot ablation only, consistent with Table 3 (Horstwood et al. 2016).
          No mode-flag columns are used in this TAPP because only one mode is in scope.
        type: string
        enum:
        - Spot Analysis
        readOnly: true
    ada:ablationSamplingMode:
      description: Sampling mode or ablation pattern used during analysis, as described in Table 3 of
        Horstwood et al. (2016).
      type: string
      enum:
      - Spot (stationary)
      - Transect (continuous line scan)
      - Raster area (2D elemental mapping)
      - Stepped line profile
      readOnly: true
    ada:spotDiameter:
      description: Diameter of the laser spot as set in the acquisition method (nominal/target value).
      type: string
    ada:ablationSpotDuration:
      description: Total on-sample ablation time per spot, as set in the acquisition method.
      anyOf:
      - type: number
      - type: string
    ada:carrierGasFlowRate:
      description: Identity and plumbing configuration of the gas used to transport the ablated aerosol
        from the cell to the torch, including the procedure-registered flow rate(s).
      type: string
    ada:rfPower:
      description: ICP radiofrequency forward power. Session-tunable within procedure-defined bounds during
        plasma optimisation; consistent with the analogous, tunable treatment of RF Power across LA-Q/SF-ICP-MS
        and all three solution ICP-MS TAPPs.
      anyOf:
      - type: number
      - type: string
    ada:massesMeasured:
      description: Mass-to-charge positions (isotope masses) this procedure is designed to measure. Defines
        the scope of the procedure; the analyst may record the specific subset actually measured in a
        given session.
      type: string
    ada:reportedVariablesAndUnits:
      description: The final reported chemical/isotopic variable(s) and their units — distinct from Masses
        Measured, which records raw acquisition scope. Covers isotope ratios (both common-Pb corrected
        and uncorrected, where applicable), elemental/isotopic concentrations, and any derived quantities
        (age, δ or ε notation) with their reference standard where relevant. For non-mass-spectrometry
        techniques, this field is generalised to any reported physical or chemical property and its units.
      type: string
      readOnly: true
    ada:integrationTimePerPeakDwellTimesQuadrupoleSettlingTimeBetweenMassJumps:
      description: Count time (dwell time) per mass position for each measured isotope, and the settling
        time allowed between mass jumps, as reported in Table 3 of Horstwood et al. (2016). Applies to
        sequential (Q/SF) mass-hopping acquisition; for simultaneous multi-collector acquisition see Number
        of Blocks per Measurement, Number of Cycles per Block, and Integration Time per Cycle.
      type: string
    ada:totalIntegrationTimePerOutputDataPoint:
      description: Total duty-cycle time for one complete mass-scan sweep (sum of all per-isotope dwell
        times and settling times), which sets the time resolution of the down-hole signal. Applies to
        sequential (Q/SF) acquisition.
      anyOf:
      - type: number
      - type: string
    ada:oxideProductionMethodAndThreshold:
      description: Method used to quantify plasma oxide production and the acceptance threshold applied
        before commencing analysis. ThO⁺/Th⁺ (mass 248/232) is the standard proxy for U-Th-Pb geochronology,
        directly relevant to Th/U ratio accuracy.
      type: string
      readOnly: true
    ada:analysisSequence:
      description: Repeating order of primary calibration standard(s), quality control standard(s), and
        unknown analyses within a measurement session.
      type: string
    ada:signalCollectionMode:
      description: Mode used to collect ion signal across the monitored masses. In peak hopping mode,
        the quadrupole jumps sequentially between pre-set mass positions and dwells at each peak. Applicable
        only to quadrupole-based instruments; this concept does not extend to collision-cell-equipped
        multi-collector instruments (e.g., Nu Sapphire, Thermo Neoma MS/MS), whose collector array performs
        genuinely simultaneous multi-collection regardless of whether a collision/reaction cell is present
        upstream. Some such instruments (e.g., Neoma MS/MS) instead use a pre-cell mass filter of a fundamentally
        different, non-quadrupole design to pre-select a mass window before the cell — a distinct concept
        not currently captured by any field in this TAPP.
      type: string
      enum:
      - Peak hopping
      - Scanning
      - Not applicable (SF/MC-ICP-MS)
      readOnly: true
    ada:analyteTemplate:
      type: object
      properties:
        ada:analyteColumns:
          type: array
          items:
            anyOf:
            - $ref: ../../../BaseSchema/tappDefinition/schema.yaml#/$defs/AnalyteIdentifierColumn
            - &id026
              title: Mass Resolution per Analyte
              description: Mass resolution mode assigned to each analyte in this procedure. The selected
                resolution determines which polyatomic interferences (e.g., ¹⁸⁶W¹⁶O⁺ on ²⁰²Hg, relevant
                to common-Pb correction) are physically resolved by the magnetic sector. Applicable only
                to sector-field instruments.
              type: object
              properties:
                '@id':
                  const: ada:analyteColumn/geochronTAPP/massResolutionPerAnalyte
                '@type':
                  const:
                  - schema:PropertyValueSpecification
                schema:valueName:
                  const: massResolutionPerAnalyte
                schema:name:
                  const: Mass Resolution per Analyte
                ada:dataType:
                  const: string
                schema:readonlyValue:
                  const: true
                ada:tier:
                  const: M
              required:
              - '@id'
              - '@type'
              - schema:valueName
              - schema:name
              - ada:dataType
            - &id027
              title: Isobaric Interference Corrections Applied
              description: Whether isobaric interference corrections were applied for any measured isotope
                in this procedure. A procedure-level Boolean; element-specific detail is in Interfering
                Species and Interference Correction Method.
              type: object
              properties:
