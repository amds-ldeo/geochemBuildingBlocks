$schema: https://json-schema.org/draft/2020-12/schema
title: LA-ICP-MS Geochronology TAPP (geochronTAPP)
description: Laser-ablation ICP-MS geochronology (U-Pb / Pb-Pb and related) Technique-Aligned Protocol
  Profile. Covers LA-Q/SF/MC-ICP-MS variants. Generated from docs/LA-ICPMS_Geochron_Horstwood_TAPP_v6.xlsx
  via the path-driven pipeline.
allOf:
- $ref: ../../../BaseSchema/tappDefinition/schema.yaml
- type: object
  properties:
    schema:location:
      type: object
      properties:
        schema:name:
          description: Name of the laboratory or institution hosting the instrument. Standard cross-TAPP
            identity field, distinct from the paper-sourced 'Laboratory name' field above.
          type: string
        schema:identifier:
          description: Persistent identifier for the laboratory, e.g., ROR ID.
          type: string
    schema:name:
      description: A short descriptive name for this analytical procedure, with version number. Should
        include instrument/mass-analyzer configuration, technique, and target mineral or isotopic system.
      type: string
      readOnly: true
    schema:measurementTechnique:
      type: array
      items:
        type: object
        properties:
          schema:termCode:
            description: Top-level analytical technique identifier, including the ICP-MS mass-analyzer
              configuration used for in situ U-(Th-)Pb dating.
            type: string
            enum:
            - LA-ICP-MS U-(Th-)Pb Geochronology
            - LA-Q-ICP-MS U-(Th-)Pb Geochronology
            - LA-SF-ICP-MS U-(Th-)Pb Geochronology
            - LA-MC-ICP-MS U-(Th-)Pb Geochronology
            readOnly: true
    schema:creator:
      type: object
      properties:
        schema:name:
          description: Person(s) or laboratory responsible for developing and registering this procedure.
            ORCID recommended for individuals.
          type: string
          readOnly: true
    schema:datePublished:
      description: First date this procedure configuration was used in production.
      type: string
      readOnly: true
    schema:funding:
      type: array
      items:
        type: object
        properties:
          schema:name:
            description: Grants and other funding sources that supported instrument purchase, major upgrades,
              and procedure development. Include grant numbers and funding agencies.
            type: string
            readOnly: true
    schema:relatedLink:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              schema:linkRelationship:
                const: techniquePublication
            required:
            - schema:linkRelationship
          then:
            properties:
              schema:target:
                type: object
                properties:
                  schema:name:
                    description: DOI or URL for peer-reviewed publications or technical reports describing,
                      validating, or benchmarking this procedure.
                    type: string
                    readOnly: true
        - if:
            properties:
              schema:linkRelationship:
                const: coupledTechnique
            required:
            - schema:linkRelationship
          then:
            properties:
              schema:target:
                type: object
                properties:
                  schema:description:
                    description: Describes (1) the functional relationship between this dataset and the
                      coupled technique, and (2) the analytical sequence — which technique was performed
                      first and why. Required when Coupled Technique(s) is not 'None'.
                    type: string
    schema:additionalProperty:
      type: array
      items:
        anyOf:
        - &id001
          title: Imaging
          description: Pre-ablation characterisation imaging (typically cathodoluminescence [CL] or backscattered
            electron [BSE]) used to reveal internal zoning, inherited cores, and metamict domains for
            selecting valid spot locations, including the imaging instrument and settings used.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/imagingDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: imagingDefault
            schema:name:
              const: Imaging
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Faraday Cup Array Configuration
          description: 'Description of the multi-collector Faraday cup array: total number of Faraday
            cup detectors (fixed and moveable), their labelled positions, and the presence and position
            of any ion counter (SEM) or Daly detector. The number and span of cups constrains which isotope
            combinations can be simultaneously collected.'
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/faradayCupArrayConfiguration
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/faradayCupArrayConfiguration
            schema:name:
              const: Faraday Cup Array Configuration
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: Faraday Cup Amplifier Resistor Values
          description: Resistance values (Ω) of the feedback resistors in the Faraday cup amplifiers.
            Standard amplifiers use 10¹¹ Ω resistors; high-gain amplifiers (10¹² or 10¹³ Ω) are fitted
            to selected cups to improve signal-to-noise for very low-intensity beams (e.g., low-abundance
            Pb isotopes in young or low-U material).
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/faradayCupAmplifierResistorValues
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/faradayCupAmplifierResistorValues
            schema:name:
              const: Faraday Cup Amplifier Resistor Values
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: Faraday Cup Gain Calibration Method
          description: Method used to calibrate the relative gain (amplification factor) of each Faraday
            cup amplifier at the start of or during each analytical session. Relative gain differences
            between amplifiers cause systematic errors in isotope ratios if uncorrected. For instruments
            with ion-counting detectors, also describes the SEM-to-Faraday cross-calibration sequence.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/faradayCupGainCalibrationMethod
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/faradayCupGainCalibrationMethod
            schema:name:
              const: Faraday Cup Gain Calibration Method
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - &id002
          title: Ablation Pit Depth/Ablation Rate
          description: Depth of the ablation pit produced under the registered laser conditions, the method
            used to measure it, and the resulting per-pulse ablation rate. Characterises the achievable
            depth/time resolution of the procedure.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/ablationPitDepthAblationRateDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: ablationPitDepthAblationRateDefault
            schema:name:
              const: Ablation Pit Depth/Ablation Rate
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id003
          title: Make-up Gas Flow (L min⁻¹)
          description: Source and estimated flow rate of any make-up gas added downstream of the ablation
            cell, including any desolvating nebuliser used for tracer co-aspiration.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/makeUpGasFlowDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: makeUpGasFlowDefault
            schema:name:
              const: Make-up Gas Flow (L min⁻¹)
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Collector Configuration
          description: Assignment of isotope masses to Faraday cup or ion counter detector positions for
            this procedure. For static multi-collection, one configuration applies throughout the measurement;
            for multi-dynamic procedures, lists all configurations and the cycling sequence. Includes
            interference-monitor masses collected alongside analyte isotopes.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/collectorConfiguration
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/collectorConfiguration
            schema:name:
              const: Collector Configuration
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - &id004
          title: Number of Blocks per Measurement
          description: Number of measurement blocks acquired per spot. Each block typically begins with
            a baseline (on-peak zero) measurement before the analytical cycles. Multiple blocks allow
            inspection of signal stability and within-measurement drift.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/numberOfBlocksPerMeasurementDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: numberOfBlocksPerMeasurementDefault
            schema:name:
              const: Number of Blocks per Measurement
            ada:dataType:
              const: integer
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id005
          title: Number of Cycles per Block
          description: Number of measurement cycles acquired per block. One cycle corresponds to a single
            set of simultaneous Faraday cup readings integrated for the duration in Integration Time per
            Cycle.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/numberOfCyclesPerBlockDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: numberOfCyclesPerBlockDefault
            schema:name:
              const: Number of Cycles per Block
            ada:dataType:
              const: integer
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id006
          title: Integration Time per Cycle
          description: Duration of signal integration per measurement cycle. Total integration time per
            spot = (Number of Cycles per Block) × (Integration Time per Cycle) × (Number of Blocks per
            Measurement).
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/integrationTimePerCycleDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: integrationTimePerCycleDefault
            schema:name:
              const: Integration Time per Cycle
            ada:dataType:
              const: number
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
            schema:unitText:
              const: s
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id007
          title: IC Dead Time (ns)
          description: Dead time of each ion-counting detector channel, used in dead-time correction of
            high count rates.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/icDeadTimeDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: icDeadTimeDefault
            schema:name:
              const: IC Dead Time (ns)
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id008
          title: Signal Smoothing
          description: Description of any signal smoothing device or approach installed between the ablation
            cell and the ICP-MS to reduce pulse-to-pulse signal variability.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/signalSmoothingDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: signalSmoothingDefault
            schema:name:
              const: Signal Smoothing
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - &id009
          title: ICP Tuning
          description: Description of the approach used to optimise ICP plasma conditions prior to analysis,
            including the reference material used for tuning and the acceptance criteria.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/icpTuningDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: icpTuningDefault
            schema:name:
              const: ICP Tuning
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Instrument Warm-up / Session Duration Limit
          description: Minimum warm-up time required after plasma ignition before analyses begin, and
            any maximum session duration enforced to maintain stable operating conditions.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/instrumentWarmUpSessionDurationLimit
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/instrumentWarmUpSessionDurationLimit
            schema:name:
              const: Instrument Warm-up / Session Duration Limit
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: Baseline Measurement Approach
          description: Method and timing for measuring the ion beam baseline (background) during acquisition,
            distinct from the data-processing-level blank subtraction method (see Gas Blank, Group 5).
            For LA-ICP-MS, baseline is measured with the laser off (gas blank), typically before each
            ablation or block.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/baselineMeasurementApproach
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/baselineMeasurementApproach
            schema:name:
              const: Baseline Measurement Approach
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: Multi-Run Sequential Analysis Design
          description: Whether the procedure uses a single acquisition pass or multiple sequential runs
            on the same sample location, each optimised for different analytical objectives.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/multiRunSequentialAnalysisDesign
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/multiRunSequentialAnalysisDesign
            schema:name:
              const: Multi-Run Sequential Analysis Design
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - title: E-scan Range
          description: Electric scan range used for peak acquisition, expressed as percentage of the centre
            mass. Varies the accelerating voltage to cover nearby masses without re-scanning the magnet.
            Applicable only to sector-field instruments.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/eScanRange
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/eScanRange
            schema:name:
              const: E-scan Range
            schema:value:
              anyOf:
              - type: number
              - type: string
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          - schema:unitText
          readOnly: true
        - title: Triple Scanning Mode
          description: Whether each mass peak is scanned three times per cycle and the results averaged,
            to reduce noise from short-term magnetic field instabilities. Applicable only to sector-field
            instruments with this capability.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/tripleScanningMode
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/tripleScanningMode
            schema:name:
              const: Triple Scanning Mode
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - &id010
          title: Other Information
          description: Supplementary methodological context not captured by the structured fields above,
            as reported in Table 3 of Horstwood et al. (2016) — in the source paper's own example, notes
            on ablation-cell and sample-line configuration for depth-profiling/single-pulse ablation studies,
            a variant not otherwise in scope for this single-mode (Spot Analysis) TAPP.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/otherInformationDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: otherInformationDefault
            schema:name:
              const: Other Information
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Mass Fractionation Law
          description: Mathematical law used to parameterize instrumental isotope mass fractionation as
            a function of mass difference. Not stated in Table 3 (Horstwood et al. 2016) for the worked
            example; the exponential law is most widely used and theoretically best justified for MC-ICP-MS.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/massFractionationLaw
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/massFractionationLaw
            schema:name:
              const: Mass Fractionation Law
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - &id011
          title: Uncertainty Level and Propagation
          description: Uncertainty level at which ages/ratios are quoted (e.g., 1σ, 2σ) and the method
            used to propagate component uncertainties (e.g., quadratic addition) into the final reported
            value.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/uncertaintyLevelAndPropagationDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: uncertaintyLevelAndPropagationDefault
            schema:name:
              const: Uncertainty Level and Propagation
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Matrix Offset Correction (LIEF)
          description: Whether an empirical correction was applied to account for systematic differences
            in laser-induced elemental fractionation (LIEF) patterns between the external calibration
            standard and the sample matrix.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/matrixOffsetCorrection
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/matrixOffsetCorrection
            schema:name:
              const: Matrix Offset Correction (LIEF)
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - &id012
          title: Spike / Outlier Filtering Approach
          description: Method used to identify and remove anomalous signal spikes arising from micronuggets,
            inclusions, cracks, or instrument artifacts during time-resolved signal processing.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/spikeOutlierFilteringApproachDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: spikeOutlierFilteringApproachDefault
            schema:name:
              const: Spike / Outlier Filtering Approach
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Double-Spike Isotope Pair
          description: The pair of enriched isotopes used to construct a double spike for combined mass
            bias and/or common-Pb correction. Both isotopes must be naturally rare and free from isobaric
            interferences. Record 'N/A' if double-spike method is not used.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/doubleSpikeIsotopePair
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/doubleSpikeIsotopePair
            schema:name:
              const: Double-Spike Isotope Pair
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        - &id013
          title: Double-Spike Mixing Ratio
          description: Target proportion of double-spike signal relative to total analyte signal in the
            spiked mixture. An optimal mixing ratio minimises error propagation through the double-spike
            inversion. Record 'N/A' if double-spike method is not used.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/doubleSpikeMixingRatioDefault
            '@type':
              const:
              - schema:PropertyValueSpecification
            schema:valueName:
              const: doubleSpikeMixingRatioDefault
            schema:name:
              const: Double-Spike Mixing Ratio
            ada:dataType:
              const: string
            ada:fieldScope:
              const: session
            schema:readonlyValue:
              const: false
            ada:tier:
              const: R
          required:
          - '@id'
          - '@type'
          - schema:valueName
          - schema:name
          - ada:dataType
          - ada:fieldScope
        - title: Double-Spike Inversion Algorithm
          description: Mathematical algorithm used to simultaneously solve for the true sample isotope
            ratio and the mass fractionation factor from the measured spike-sample mixture. Record 'N/A'
            if double-spike method is not used.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/doubleSpikeInversionAlgorithm
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/doubleSpikeInversionAlgorithm
            schema:name:
              const: Double-Spike Inversion Algorithm
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
      allOf:
      - contains: *id001
        minContains: 0
        maxContains: 1
      - contains:
          title: Faraday Cup Array Configuration
          description: 'Description of the multi-collector Faraday cup array: total number of Faraday
            cup detectors (fixed and moveable), their labelled positions, and the presence and position
            of any ion counter (SEM) or Daly detector. The number and span of cups constrains which isotope
            combinations can be simultaneously collected.'
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/faradayCupArrayConfiguration
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/faradayCupArrayConfiguration
            schema:name:
              const: Faraday Cup Array Configuration
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: Faraday Cup Amplifier Resistor Values
          description: Resistance values (Ω) of the feedback resistors in the Faraday cup amplifiers.
            Standard amplifiers use 10¹¹ Ω resistors; high-gain amplifiers (10¹² or 10¹³ Ω) are fitted
            to selected cups to improve signal-to-noise for very low-intensity beams (e.g., low-abundance
            Pb isotopes in young or low-U material).
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/faradayCupAmplifierResistorValues
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/faradayCupAmplifierResistorValues
            schema:name:
              const: Faraday Cup Amplifier Resistor Values
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: Faraday Cup Gain Calibration Method
          description: Method used to calibrate the relative gain (amplification factor) of each Faraday
            cup amplifier at the start of or during each analytical session. Relative gain differences
            between amplifiers cause systematic errors in isotope ratios if uncorrected. For instruments
            with ion-counting detectors, also describes the SEM-to-Faraday cross-calibration sequence.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/faradayCupGainCalibrationMethod
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/faradayCupGainCalibrationMethod
            schema:name:
              const: Faraday Cup Gain Calibration Method
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains: *id002
        minContains: 0
        maxContains: 1
      - contains: *id003
        minContains: 0
        maxContains: 1
      - contains:
          title: Collector Configuration
          description: Assignment of isotope masses to Faraday cup or ion counter detector positions for
            this procedure. For static multi-collection, one configuration applies throughout the measurement;
            for multi-dynamic procedures, lists all configurations and the cycling sequence. Includes
            interference-monitor masses collected alongside analyte isotopes.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/collectorConfiguration
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/collectorConfiguration
            schema:name:
              const: Collector Configuration
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains: *id004
        minContains: 0
        maxContains: 1
      - contains: *id005
        minContains: 0
        maxContains: 1
      - contains: *id006
        minContains: 0
        maxContains: 1
      - contains: *id007
        minContains: 0
        maxContains: 1
      - contains: *id008
        minContains: 0
        maxContains: 1
      - contains: *id009
        minContains: 0
        maxContains: 1
      - contains:
          title: Instrument Warm-up / Session Duration Limit
          description: Minimum warm-up time required after plasma ignition before analyses begin, and
            any maximum session duration enforced to maintain stable operating conditions.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/instrumentWarmUpSessionDurationLimit
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/instrumentWarmUpSessionDurationLimit
            schema:name:
              const: Instrument Warm-up / Session Duration Limit
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: Baseline Measurement Approach
          description: Method and timing for measuring the ion beam baseline (background) during acquisition,
            distinct from the data-processing-level blank subtraction method (see Gas Blank, Group 5).
            For LA-ICP-MS, baseline is measured with the laser off (gas blank), typically before each
            ablation or block.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/baselineMeasurementApproach
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/baselineMeasurementApproach
            schema:name:
              const: Baseline Measurement Approach
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: Multi-Run Sequential Analysis Design
          description: Whether the procedure uses a single acquisition pass or multiple sequential runs
            on the same sample location, each optimised for different analytical objectives.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/multiRunSequentialAnalysisDesign
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/multiRunSequentialAnalysisDesign
            schema:name:
              const: Multi-Run Sequential Analysis Design
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: E-scan Range
          description: Electric scan range used for peak acquisition, expressed as percentage of the centre
            mass. Varies the accelerating voltage to cover nearby masses without re-scanning the magnet.
            Applicable only to sector-field instruments.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/eScanRange
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/eScanRange
            schema:name:
              const: E-scan Range
            schema:value:
              anyOf:
              - type: number
              - type: string
            schema:unitText:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          - schema:unitText
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains:
          title: Triple Scanning Mode
          description: Whether each mass peak is scanned three times per cycle and the results averaged,
            to reduce noise from short-term magnetic field instabilities. Applicable only to sector-field
            instruments with this capability.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/tripleScanningMode
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/tripleScanningMode
            schema:name:
              const: Triple Scanning Mode
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains: *id010
        minContains: 0
        maxContains: 1
      - contains:
          title: Mass Fractionation Law
          description: Mathematical law used to parameterize instrumental isotope mass fractionation as
            a function of mass difference. Not stated in Table 3 (Horstwood et al. 2016) for the worked
            example; the exponential law is most widely used and theoretically best justified for MC-ICP-MS.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/massFractionationLaw
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/massFractionationLaw
            schema:name:
              const: Mass Fractionation Law
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains: *id011
        minContains: 0
        maxContains: 1
      - contains:
          title: Matrix Offset Correction (LIEF)
          description: Whether an empirical correction was applied to account for systematic differences
            in laser-induced elemental fractionation (LIEF) patterns between the external calibration
            standard and the sample matrix.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/matrixOffsetCorrection
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/matrixOffsetCorrection
            schema:name:
              const: Matrix Offset Correction (LIEF)
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains: *id012
        minContains: 0
        maxContains: 1
      - contains:
          title: Double-Spike Isotope Pair
          description: The pair of enriched isotopes used to construct a double spike for combined mass
            bias and/or common-Pb correction. Both isotopes must be naturally rare and free from isobaric
            interferences. Record 'N/A' if double-spike method is not used.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/doubleSpikeIsotopePair
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/doubleSpikeIsotopePair
            schema:name:
              const: Double-Spike Isotope Pair
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
      - contains: *id013
        minContains: 0
        maxContains: 1
      - contains:
          title: Double-Spike Inversion Algorithm
          description: Mathematical algorithm used to simultaneously solve for the true sample isotope
            ratio and the mass fractionation factor from the measured spike-sample mixture. Record 'N/A'
            if double-spike method is not used.
          type: object
          properties:
            '@id':
              const: ada:parameter/geochronTAPP/doubleSpikeInversionAlgorithm
            '@type':
              const:
              - schema:PropertyValue
            schema:propertyID:
              const:
                '@id': ada:parameter/geochronTAPP/doubleSpikeInversionAlgorithm
            schema:name:
              const: Double-Spike Inversion Algorithm
            schema:value:
              type: string
          required:
          - '@id'
          - '@type'
          - schema:propertyID
          - schema:name
          - schema:value
          readOnly: true
        minContains: 0
        maxContains: 1
    schema:object:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              '@type':
                contains:
                  const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
            required:
            - '@type'
          then:
            properties:
              schema:additionalProperty:
                type: array
                items:
                  type: object
                  allOf:
                  - if:
                      properties:
                        schema:name:
                          const: Target Material
                      required:
                      - schema:name
                    then:
                      properties:
                        schema:value:
                          type: array
                          items:
                            description: General description of the U-(Th-)Pb-bearing mineral(s) this
                              procedure is designed to analyse. Used for discoverability and procedure
                              matching.
                            type: string
                            enum:
                            - Zircon
                            - Monazite
                            - Titanite
                            - Apatite
                            - Rutile
                            - Xenotime
                            - Baddeleyite
                            - Perovskite
                            - Allanite
                            readOnly: true
    schema:actionProcess:
      type: object
      properties:
        schema:step:
          type: array
          items:
            type: object
            allOf:
            - if:
                properties:
                  schema:name:
                    const: samplePreparation
                required:
                - schema:name
              then:
                properties:
                  schema:description:
                    description: Standard cross-TAPP description of how samples were prepared for analysis
                      (mounting, polishing, coating, etc.).
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  schema:additionalProperty:
                    type: array
                    items: &id014
                      title: Pre-Ablation Surface Treatment
                      description: Procedure applied immediately before each analysis to remove surface
                        contamination or condition the sample surface, distinct from general sample preparation.
                        Pre-ablation pulses are typically discarded before signal acquisition begins.
                      type: object
                      properties:
                        '@id':
                          const: ada:parameter/geochronTAPP/preAblationSurfaceTreatment
                        '@type':
                          const:
                          - schema:PropertyValue
                        schema:propertyID:
                          const:
                            '@id': ada:parameter/geochronTAPP/preAblationSurfaceTreatment
                        schema:name:
                          const: Pre-Ablation Surface Treatment
                        schema:value:
                          type: string
                      required:
                      - '@id'
                      - '@type'
                      - schema:propertyID
                      - schema:name
                      - schema:value
                    allOf:
                    - contains: *id014
                      minContains: 0
                      maxContains: 1
            - if:
                properties:
                  schema:name:
                    const: dataAcquisition
                required:
                - schema:name
              then:
                properties:
                  schema:additionalProperty:
                    type: array
                    items:
                      title: Guard Electrode
                      description: Whether the guard electrode (also called extraction lens or Fassel
                        torch shield) was active during analysis.
                      type: object
                      properties:
                        '@id':
                          const: ada:parameter/geochronTAPP/guardElectrode
                        '@type':
                          const:
                          - schema:PropertyValue
                        schema:propertyID:
                          const:
                            '@id': ada:parameter/geochronTAPP/guardElectrode
                        schema:name:
                          const: Guard Electrode
                        schema:value:
                          type: string
                      required:
                      - '@id'
                      - '@type'
                      - schema:propertyID
                      - schema:name
                      - schema:value
                      readOnly: true
                    allOf:
                    - contains:
                        title: Guard Electrode
                        description: Whether the guard electrode (also called extraction lens or Fassel
                          torch shield) was active during analysis.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/geochronTAPP/guardElectrode
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                              '@id': ada:parameter/geochronTAPP/guardElectrode
                          schema:name:
                            const: Guard Electrode
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                        readOnly: true
                      minContains: 0
                      maxContains: 1
            - if:
                properties:
                  schema:name:
                    const: dataReduction
                required:
                - schema:name
              then:
                properties:
                  schema:additionalProperty:
                    type: array
                    items: &id015
                      title: Normalization/Standards-Based Correction
                      description: Any post-acquisition normalization applied to correct for systematic
                        biases identified from secondary reference materials.
                      type: object
                      properties:
                        '@id':
                          const: ada:parameter/geochronTAPP/normalizationStandardsBasedCorrectionDefault
                        '@type':
                          const:
                          - schema:PropertyValueSpecification
                        schema:valueName:
                          const: normalizationStandardsBasedCorrectionDefault
                        schema:name:
                          const: Normalization/Standards-Based Correction
                        ada:dataType:
                          const: string
                        ada:fieldScope:
                          const: session
                        schema:readonlyValue:
                          const: false
                        ada:tier:
                          const: R
                      required:
                      - '@id'
                      - '@type'
                      - schema:valueName
                      - schema:name
                      - ada:dataType
                      - ada:fieldScope
                    allOf:
                    - contains: *id015
                      minContains: 0
                      maxContains: 1
    schema:instrument:
      type: array
      items:
        type: object
        allOf:
        - if:
            properties:
              schema:additionalType:
                contains:
                  const: Laser Ablation System
            required:
            - schema:additionalType
          then:
            properties:
              schema:model:
                type: object
                properties:
                  schema:name:
                    description: Manufacturer and model of the laser ablation system.
                    type: string
                    readOnly: true
              ada:laserType:
                description: Wavelength and type of the laser used for ablation, in nanometres. Table
                  3 (Horstwood et al. 2016) states wavelength only; laser type (e.g., ArF excimer) is
                  not explicitly stated for this instrument in the source example.
                anyOf:
                - type: string
                  readOnly: true
                - type: array
                  items:
                    type: string
                    readOnly: true
              schema:name:
                description: Type, design origin, and internal volume of the ablation cell. Cell volume
                  is a primary determinant of aerosol washout time and therefore the achievable time resolution
                  of the data.
                anyOf:
                - type: string
                  readOnly: true
                - type: array
                  items:
                    type: string
                    readOnly: true
              schema:additionalProperty:
                type: array
                items:
                  anyOf:
                  - title: Laser Pulse Duration
                    description: Duration of each individual laser pulse. A fixed hardware property of
                      the laser system that determines the thermal vs. non-thermal ablation regime.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/geochronTAPP/laserPulseDuration
                      '@type':
                        const:
                        - schema:PropertyValue
                      schema:propertyID:
                        const:
                          '@id': ada:parameter/geochronTAPP/laserPulseDuration
                      schema:name:
                        const: Laser Pulse Duration
                      schema:value:
                        anyOf:
                        - type: number
                        - type: string
                      schema:unitText:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                    - schema:unitText
                    readOnly: true
                  - title: Laser Beam Energy Profile
                    description: Spatial energy distribution of the laser beam at the sample surface,
                      and whether a beam homogenizer is installed. A flat-top (top-hat) profile produces
                      more uniform ablation craters than a Gaussian beam. Fixed hardware property.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/geochronTAPP/laserBeamEnergyProfile
                      '@type':
                        const:
                        - schema:PropertyValue
                      schema:propertyID:
                        const:
                          '@id': ada:parameter/geochronTAPP/laserBeamEnergyProfile
                      schema:name:
                        const: Laser Beam Energy Profile
                      schema:value:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                    readOnly: true
                allOf:
                - contains:
                    title: Laser Pulse Duration
                    description: Duration of each individual laser pulse. A fixed hardware property of
                      the laser system that determines the thermal vs. non-thermal ablation regime.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/geochronTAPP/laserPulseDuration
                      '@type':
                        const:
                        - schema:PropertyValue
                      schema:propertyID:
                        const:
                          '@id': ada:parameter/geochronTAPP/laserPulseDuration
                      schema:name:
                        const: Laser Pulse Duration
                      schema:value:
                        anyOf:
                        - type: number
                        - type: string
                      schema:unitText:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                    - schema:unitText
                    readOnly: true
                  minContains: 0
                  maxContains: 1
                - contains:
                    title: Laser Beam Energy Profile
                    description: Spatial energy distribution of the laser beam at the sample surface,
                      and whether a beam homogenizer is installed. A flat-top (top-hat) profile produces
                      more uniform ablation craters than a Gaussian beam. Fixed hardware property.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/geochronTAPP/laserBeamEnergyProfile
                      '@type':
                        const:
                        - schema:PropertyValue
                      schema:propertyID:
                        const:
                          '@id': ada:parameter/geochronTAPP/laserBeamEnergyProfile
                      schema:name:
                        const: Laser Beam Energy Profile
                      schema:value:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                    readOnly: true
                  minContains: 0
                  maxContains: 1
              ada:laserFluence:
                description: Laser pulse energy per unit area at the sample surface, the primary control
                  on ablation rate and crater morphology.
                anyOf:
                - type: number
                - type: string
              ada:laserRepetitionRate:
                description: Laser pulse repetition rate.
                anyOf:
                - type: number
                - type: string
        - if:
            properties:
              schema:additionalType:
                contains:
                  const: ICPMS
            required:
            - schema:additionalType
          then:
            properties:
              schema:model:
                type: object
                properties:
                  schema:name:
                    description: Manufacturer and model of the ICP-MS instrument.
                    type: string
                    readOnly: true
              schema:additionalProperty:
                type: array
                items:
                  anyOf:
                  - title: Detector Configuration
                    description: Type(s) of detector(s) installed in the mass spectrometer used to measure
                      the U-(Th-)Pb isotope beams.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/geochronTAPP/detectorConfiguration
                      '@type':
                        const:
                        - schema:PropertyValue
                      schema:propertyID:
                        const:
                          '@id': ada:parameter/geochronTAPP/detectorConfiguration
                      schema:name:
                        const: Detector Configuration
                      schema:value:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                    readOnly: true
                  - &id016
                    title: Mass Resolution Setting
                    description: Operating mass resolution of the mass analyser. Fixed at unit resolution
                      for quadrupole instruments; selectable (low/medium/high) for sector-field instruments
                      to balance sensitivity against interference suppression; not applicable in the same
                      sense for multi-collector instruments running static low-resolution collection (see
                      Faraday Cup Array Configuration and Collector Configuration for MC-specific detail).
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/geochronTAPP/massResolutionSetting
                      '@type':
                        const:
                        - schema:PropertyValue
                      schema:propertyID:
                        const:
                          '@id': ada:parameter/geochronTAPP/massResolutionSetting
                      schema:name:
                        const: Mass Resolution Setting
                      schema:value:
                        type: string
                    required:
                    - '@id'
                    - '@type'
                    - schema:propertyID
                    - schema:name
                    - schema:value
                  - &id017
                    title: Doubly-Charged Species Monitor
                    description: The mass ratio monitored to estimate doubly-charged ion (M²⁺) formation
                      during instrument tuning.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/geochronTAPP/doublyChargedSpeciesMonitorDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: doublyChargedSpeciesMonitorDefault
                      schema:name:
                        const: Doubly-Charged Species Monitor
                      ada:dataType:
                        const: string
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
                        const: R
                    required:
                    - '@id'
                    - '@type'
                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                  - &id018
                    title: Doubly-Charged Species Production
                    description: Measured percentage of doubly-charged ion production for the monitored
                      species at the time of instrument tuning.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/geochronTAPP/doublyChargedSpeciesProductionDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: doublyChargedSpeciesProductionDefault
                      schema:name:
                        const: Doubly-Charged Species Production
                      ada:dataType:
                        const: string
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
                        const: R
                    required:
                    - '@id'
                    - '@type'
                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                  - &id019
                    title: Memory Effect Mitigation
                    description: Procedure applied to identify and minimise memory effects from high-concentration
                      elements in the previous sample or standard that may contaminate subsequent analyses.
                    type: object
                    properties:
                      '@id':
                        const: ada:parameter/geochronTAPP/memoryEffectMitigationDefault
                      '@type':
                        const:
                        - schema:PropertyValueSpecification
                      schema:valueName:
                        const: memoryEffectMitigationDefault
                      schema:name:
                        const: Memory Effect Mitigation
                      ada:dataType:
                        const: string
                      ada:fieldScope:
                        const: session
                      schema:readonlyValue:
                        const: false
                      ada:tier:
                        const: R
                    required:
                    - '@id'
                    - '@type'
                    - schema:valueName
                    - schema:name
                    - ada:dataType
                    - ada:fieldScope
                allOf:
                - contains:
