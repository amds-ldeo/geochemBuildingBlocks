$schema: https://json-schema.org/draft/2020-12/schema
title: SEM Composition Analysis Detail
description: Dataset-level analysis-instance detail for SEM composition (EDS/WDS), reusing CDIF/schema.org
  slots on the schema:Dataset root.
type: object
properties:
  prov:wasGeneratedBy:
    type: array
    items:
      type: object
      properties:
        schema:location:
          type: object
          properties:
            schema:name:
              description: Name of the laboratory or institution hosting the instrument.
              type: string
            schema:identifier:
              description: Persistent identifier for the laboratory (e.g., ROR ID).
              type: string
        schema:startDate:
          description: Date on which the analysis session began.
          type: string
        schema:endDate:
          description: Date on which the analysis session ended (if spanning multiple days).
          type: string
        schema:actionProcess:
          type: object
          properties:
            schema:step:
              type: array
              items:
                type: object
                allOf:
                - if:
                    properties:
                      schema:name:
                        const: samplePreparation
                    required:
                    - schema:name
                  then:
                    properties:
                      schema:description:
                        description: Method by which samples were prepared for SEM analysis prior to loading
                          in the instrument. Includes mounting medium (epoxy, carbon tape, stub), polishing
                          steps (alumina, colloidal silica, argon ion mill), and conductive coating type
                          and thickness. For VP-SEM/ESEM analyses, note whether an uncoated sample was
                          used and the gas type used. FIB-specific in-session operations (protective coating
                          deposition, milling conditions, lamella preparation) are documented separately
                          in Group 4.
                        anyOf:
                        - type: string
                        - type: array
                          items:
                            type: string
              allOf:
              - contains:
                  properties:
                    schema:name:
                      const: samplePreparation
                  required:
                  - schema:name
        schema:object:
          type: array
          items:
            type: object
            allOf:
            - if:
                properties:
                  '@type':
                    contains:
                      const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                required:
                - '@type'
              then:
                properties:
                  schema:name:
                    description: Name or identifier of the sample or sample mount analyzed in this session.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  schema:identifier:
                    description: Persistent identifier (e.g., IGSN) for the sample analyzed.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
          allOf:
          - contains:
              properties:
                '@type':
                  contains:
                    const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
              required:
              - '@type'
        prov:used:
          type: array
          items:
            type: object
            allOf:
            - if:
                properties:
                  ada:toolRole:
                    const: acquisition
                required:
                - ada:toolRole
              then:
                properties:
                  schema:name:
                    description: Software used to control the SEM and acquire data, including version
                      number. For FIB-SEM 3D tomography, include the automated slice-and-view module name
                      and version.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
            - if:
                properties:
                  ada:toolRole:
                    const: dataReduction
                required:
                - ada:toolRole
              then:
                properties:
                  schema:name:
                    description: Software used for post-acquisition data reduction and analysis. List
                      all packages with version numbers.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
            - if:
                properties:
                  schema:additionalType:
                    contains:
                      const: SEM
                required:
                - schema:additionalType
              then:
                properties:
                  ada:acceleratingVoltage:
                    description: Electron beam accelerating voltage in kilovolts. Affects X-ray generation
                      depth (EDS/WDS), EBSD pattern quality, imaging resolution, and beam penetration.
                      Low voltages (1-5 kV) improve surface sensitivity and reduce beam damage; high voltages
                      (15-20 kV) improve X-ray generation for quantitative analysis.
                    anyOf:
                    - type: number
                    - type: string
                  ada:beamDiameter:
                    description: Nominal electron beam diameter (spot size) at the sample surface, in
                      nanometres or micrometres, as set by the condenser aperture and working distance.
                      Controls the spatial resolution and X-ray excitation volume. For mapping modes,
                      the effective spatial sampling interval is further defined by Step Size / Pixel
                      Size.
                    anyOf:
                    - type: number
                    - type: string
                  ada:workingDistance:
                    description: Distance between the objective lens pole piece and the specimen surface
                      in millimetres. Affects spatial resolution, depth of focus, EDS X-ray take-off angle,
                      and EBSD geometry.
                    anyOf:
                    - type: number
                    - type: string
          allOf:
          - contains:
              properties:
                ada:toolRole:
                  const: acquisition
              required:
              - ada:toolRole
          - contains:
              properties:
                ada:toolRole:
                  const: dataReduction
              required:
              - ada:toolRole
          - contains:
              properties:
                schema:additionalType:
                  contains:
                    const: SEM
              required:
              - schema:additionalType
        schema:additionalProperty:
          type: array
          items:
            anyOf:
            - &id001
              title: Beam Raster Dimensions
              description: Dimensions of the small area over which the beam is rastered during a single
                analysis point, reported as width × height in µm. Applicable when Beam Mode = Rastered;
                defines the effective spatial footprint of the measurement and distributes dose over a
                larger area to reduce beam damage on sensitive phases.
              type: object
              properties:
                '@id':
                  const: ada:parameter/semCompositionTAPP/beamRasterDimensions
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                    '@id': ada:parameter/semCompositionTAPP/beamRasterDimensions
                schema:name:
                  const: Beam Raster Dimensions
                schema:value:
                  anyOf:
                  - type: number
                  - type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id002
              title: Beam Damage Minimization
              description: 'Describes any measures taken to reduce electron beam damage to the sample
                during analysis. Examples: reduced accelerating voltage, lowered beam current, defocused
                or rastered beam, cooled stage, short acquisition sequences, or rotating between multiple
                points. Particularly important for volatile-bearing phases, hydrous minerals, glasses,
                organic materials, and biological samples.'
              type: object
              properties:
                '@id':
                  const: ada:parameter/semCompositionTAPP/beamDamageMinimization
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                    '@id': ada:parameter/semCompositionTAPP/beamDamageMinimization
                schema:name:
                  const: Beam Damage Minimization
                schema:value:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id003
              title: Drift Correction
              description: 'Describes whether and how stage or beam drift was monitored and corrected
                during the measurement session. Examples: periodic stage realignment to a fiducial marker,
                automated beam drift correction in acquisition software, or reanalysis of a reference
                point at regular intervals. Particularly relevant for long mapping runs and high-magnification
                sessions where positional accuracy affects data quality.'
              type: object
              properties:
                '@id':
                  const: ada:parameter/semCompositionTAPP/driftCorrection
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                    '@id': ada:parameter/semCompositionTAPP/driftCorrection
                schema:name:
                  const: Drift Correction
                schema:value:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id004
              title: Chamber Pressure
              description: Chamber pressure and gas type during analysis. Required for variable pressure
                (VP-SEM) and environmental SEM (ESEM) modes. Report value and unit (Pa or Torr) and gas
                composition. Use 'None' for standard high-vacuum operation.
              type: object
              properties:
                '@id':
                  const: ada:parameter/semCompositionTAPP/chamberPressure
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                    '@id': ada:parameter/semCompositionTAPP/chamberPressure
                schema:name:
                  const: Chamber Pressure
                schema:value:
                  anyOf:
                  - type: number
                  - type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id005
              title: Dwell Time per Pixel
              description: Time the electron beam dwells on each pixel during raster scanning (imaging
                modes) or on each step position during compositional mapping (EDS and WDS mapping modes),
                in microseconds or milliseconds. Longer dwell time improves signal-to-noise and counting
                statistics but increases total dose and can cause beam damage or contamination on sensitive
                materials. For WDS mapping, the dwell time is per spectrometer per pixel.
              type: object
              properties:
                '@id':
                  const: ada:parameter/semCompositionTAPP/dwellTimePerPixel
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                    '@id': ada:parameter/semCompositionTAPP/dwellTimePerPixel
                schema:name:
                  const: Dwell Time per Pixel
                schema:value:
                  anyOf:
                  - type: number
                  - type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id006
              title: Step Size / Pixel Size
              description: Centre-to-centre distance between adjacent measurement points (WDS mapping)
                or pixels (EDS mapping) in µm. Defines the spatial sampling interval of the map and, together
                with Map Dimensions, determines the total mapped area. Smaller step sizes increase spatial
                resolution but extend acquisition time.
              type: object
              properties:
                '@id':
                  const: ada:parameter/semCompositionTAPP/stepSizePixelSize
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                    '@id': ada:parameter/semCompositionTAPP/stepSizePixelSize
                schema:name:
                  const: Step Size / Pixel Size
                schema:value:
                  anyOf:
                  - type: number
                  - type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id007
              title: Halogen Correction on Oxygen
              description: Whether oxygen content was adjusted to account for halogen substitution (F
                and/or Cl replacing OH) in halogen-bearing phases such as apatite, amphibole, and mica,
                where oxygen is calculated by stoichiometry.
              type: object
              properties:
                '@id':
                  const: ada:parameter/semCompositionTAPP/halogenCorrectionOnOxygen
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                    '@id': ada:parameter/semCompositionTAPP/halogenCorrectionOnOxygen
                schema:name:
                  const: Halogen Correction on Oxygen
                schema:value:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
          allOf:
          - contains: *id001
            minContains: 0
            maxContains: 1
          - contains: *id002
            minContains: 0
            maxContains: 1
          - contains: *id003
            minContains: 0
            maxContains: 1
          - contains: *id004
            minContains: 0
            maxContains: 1
          - contains: *id005
            minContains: 0
            maxContains: 1
          - contains: *id006
            minContains: 0
            maxContains: 1
          - contains: *id007
            minContains: 0
            maxContains: 1
        ada:edsLiveTimePerPointOrPixel:
          description: EDS spectral acquisition live time per analysis point or per pixel in seconds.
            Longer live time improves counting statistics but increases beam damage risk and total acquisition
            time.
          anyOf:
          - type: number
          - type: string
        schema:description:
          description: Any additional context about this protocol or analysis session not captured by
            structured fields above.
          type: string
  schema:measurementTechnique:
    type: array
    items:
      type: object
      properties:
        schema:identifier:
          description: Persistent identifier (DOI) assigned to this registered protocol. Enter 'pending'
            if a DOI has been applied for but not yet minted.
          type: string
  schema:contributor:
    type: array
    items:
      type: object
      allOf:
      - if:
          properties:
            schema:roleName:
              const: analyst
          required:
          - schema:roleName
        then:
          properties:
            schema:name:
              description: Name of the analyst who conducted the analysis session.
              anyOf:
              - type: string
              - type: array
                items:
                  type: string
    allOf:
    - contains:
        properties:
          schema:roleName:
            const: analyst
        required:
        - schema:roleName
  schema:funding:
    type: array
  schema:relatedLink:
    type: array
    items:
      type: object
      allOf:
      - if:
          properties:
            schema:linkRelationship:
              const: coupledTechnique
          required:
          - schema:linkRelationship
        then:
          properties:
            schema:target:
              type: object
              properties:
                schema:name:
                  description: Other analytical techniques applied to the same sample(s) whose results
                    are intended to be interpreted together with this dataset. For SEM/FIB-SEM, common
                    couplings include TEM/STEM (FIB-prepared sections), EPMA (quantitative major-element
                    context), NanoSIMS, SIMS, Raman, and XCT.
                  type: string
                schema:description:
                  description: Describes (1) the functional relationship between this SEM/FIB-SEM dataset
                    and the coupled technique — what data or context flows between them — and (2) the
                    analytical sequence — which technique was performed first and why. Required when Coupled
                    Technique(s) is not 'None'.
                  type: string
      - if:
          properties:
            schema:linkRelationship:
              const: coupledProtocol
          required:
          - schema:linkRelationship
        then:
          properties:
            schema:target:
              type: object
              properties:
                schema:url:
                  description: DOI of the registered protocol for the coupled technique.
                  type: string
      - if:
          properties:
            schema:linkRelationship:
              const: coupledDataset
          required:
          - schema:linkRelationship
        then:
          properties:
            schema:target:
              description: DOI of the dataset or publication containing the coupled technique data. If
                coupling is documented only through a shared sample IGSN, this field may be 'None'.
              anyOf:
              - type: string
              - type: array
                items:
                  type: string
required:
- schema:funding
