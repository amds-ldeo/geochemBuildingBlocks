$schema: https://json-schema.org/draft/2020-12/schema
title: LA-ICPMS Analysis Detail
description: Detail block for LA-ICP-MS hasPart items. Discriminates on ada:componentType, carries analysis-level
  required properties and an @id reference to a registered laicpmsTAPP definition, and per-dataset schema:additionalProperty
  entries constrained via $refs to the parameterValues registry plus a catch-all. Generated by tools/build_tapp.py.
type: object
properties:
  schema:contributor:
    type: array
    items:
      type: object
      allOf:
      - if:
          properties:
            schema:roleName:
              const: analyst
          required:
          - schema:roleName
        then:
          properties:
            schema:name:
              description: Name(s) of the analyst(s) who performed the actual analysis. ORCID is recommended
                for persistent identification.
              anyOf:
              - type: string
              - type: array
                items:
                  type: string
    allOf:
    - contains:
        properties:
          schema:roleName:
            const: analyst
        required:
        - schema:roleName
  prov:wasGeneratedBy:
    type: array
    items:
      type: object
      properties:
        schema:startDate:
          description: 'Date on which the analytical session began. For analyses spanning multiple days,
            use the date of the first session. Format: YYYY-MM-DD.'
          type: string
        schema:endDate:
          description: 'Date on which the analytical session ended. May equal Analysis Start Date for
            single-day sessions. Format: YYYY-MM-DD.'
          type: string
        schema:object:
          type: array
          items:
            type: object
            allOf:
            - if:
                properties:
                  '@type':
                    contains:
                      const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
                required:
                - '@type'
              then:
                properties:
                  schema:name:
                    description: Name or identifier of the sample analysed, as used in the laboratory.
                      Should match the identifier used in associated publications or data tables.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  schema:identifier:
                    description: Globally unique, persistent identifier for the analysed sample. IGSN
                      (International Geo Sample Number) is the recommended standard for geological and
                      cosmochemical samples, as used by Astromat, EarthChem, and SESAR.
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  schema:additionalProperty:
                    type: array
                    items: &id001
                      title: Analysis Location/Spot Coordinates
                      description: 'Location of the analysis on the sample surface. For spot and transect
                        analysis: stage coordinates (X, Y in µm) or a description relative to a named
                        reference feature (e.g., mineral rim, inclusion boundary). For mapping: coordinates
                        of the map corner(s) or centre, plus map dimensions. Enables spatial reconstruction
                        and co-registration with other analytical images.'
                      type: object
                      properties:
                        '@id':
                          const: ada:parameter/laicpmsTAPP/analysisLocationSpotCoordinates
                        '@type':
                          const:
                          - schema:PropertyValue
                        schema:propertyID:
                          const:
                            '@id': ada:parameter/laicpmsTAPP/analysisLocationSpotCoordinates
                        schema:name:
                          const: Analysis Location/Spot Coordinates
                        schema:value:
                          type: string
                      required:
                      - '@id'
                      - '@type'
                      - schema:propertyID
                      - schema:name
                      - schema:value
                    allOf:
                    - contains: *id001
                      minContains: 0
                      maxContains: 1
          allOf:
          - contains:
              properties:
                '@type':
                  contains:
                    const: https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample
              required:
              - '@type'
        prov:used:
          type: array
          items:
            type: object
            allOf:
            - if:
                properties:
                  schema:additionalType:
                    contains:
                      const: ICPMS
                required:
                - schema:additionalType
              then:
                properties:
                  schema:additionalProperty:
                    type: array
                    items:
                      anyOf:
                      - &id002
                        title: Doubly-Charged Species Monitor
                        description: The mass ratio monitored to estimate doubly-charged ion (M²⁺) formation
                          during instrument tuning. Doubly-charged ions appear at half the mass of the
                          parent ion and can cause isobaric interferences on analytes in that mass region.
                          The monitor species and the mass positions monitored should be stated explicitly.
                          Analogous to Oxide Production Method and Threshold for oxide monitoring.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laicpmsTAPP/doublyChargedSpeciesMonitor
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                              '@id': ada:parameter/laicpmsTAPP/doublyChargedSpeciesMonitor
                          schema:name:
                            const: Doubly-Charged Species Monitor
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                      - &id003
                        title: Doubly-Charged Species Production
                        description: Measured percentage of doubly-charged ion production for the monitored
                          species at the time of instrument tuning. The protocol should specify the acceptable
                          threshold (e.g., <1%, <3%); the measured value for each session is recorded
                          here. Report both the threshold and the measured value where possible.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laicpmsTAPP/doublyChargedSpeciesProduction
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                              '@id': ada:parameter/laicpmsTAPP/doublyChargedSpeciesProduction
                          schema:name:
                            const: Doubly-Charged Species Production
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                      - &id004
                        title: Memory Effect Mitigation
                        description: Protocol applied to identify and minimise memory effects from high-concentration
                          elements in the previous sample or standard that may contaminate subsequent
                          analyses, or from incomplete aerosol washout between adjacent pixels in raster
                          mapping mode. For mapping, the mitigation strategy involves controlling scan
                          speed relative to washout time to ensure each pixel signal is sufficiently free
                          of the preceding pixel's contribution.
                        type: object
                        properties:
                          '@id':
                            const: ada:parameter/laicpmsTAPP/memoryEffectMitigation
                          '@type':
                            const:
                            - schema:PropertyValue
                          schema:propertyID:
                            const:
                              '@id': ada:parameter/laicpmsTAPP/memoryEffectMitigation
                          schema:name:
                            const: Memory Effect Mitigation
                          schema:value:
                            type: string
                        required:
                        - '@id'
                        - '@type'
                        - schema:propertyID
                        - schema:name
                        - schema:value
                    allOf:
                    - contains: *id002
                      minContains: 0
                      maxContains: 1
                    - contains: *id003
                      minContains: 0
                      maxContains: 1
                    - contains: *id004
                      minContains: 0
                      maxContains: 1
        schema:additionalProperty:
          type: array
          items:
            anyOf:
            - &id005
              title: Number of Replicates
              description: 'Number of replicate analyses performed on the same sample (or same nominal
                location for spot analysis) in this session. For spot analysis: number of individual spot
                analyses per grain or location. For transect: number of replicate transect lines. For
                mapping: number of map acquisitions of the same area (usually 1).'
              type: object
              properties:
                '@id':
                  const: ada:parameter/laicpmsTAPP/numberOfReplicates
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                    '@id': ada:parameter/laicpmsTAPP/numberOfReplicates
                schema:name:
                  const: Number of Replicates
                schema:value:
                  anyOf:
                  - type: number
                  - type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id006
              title: Transect Length
              description: Total length of the transect line analysed in micrometres. This is an analysis-level
                parameter because it depends on the size of the feature of interest rather than being
                fixed in the protocol. The protocol fixes scan speed (captured in Transect Rate, Mapping
                Rate or Step Size); transect length is determined at analysis time based on grain or feature
                size.
              type: object
              properties:
                '@id':
                  const: ada:parameter/laicpmsTAPP/transectLength
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                    '@id': ada:parameter/laicpmsTAPP/transectLength
                schema:name:
                  const: Transect Length
                schema:value:
                  anyOf:
                  - type: number
                  - type: string
                schema:unitText:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
              - schema:unitText
            - &id007
              title: Mapping Area
              description: Total area covered by the 2D raster map, expressed as width × height in µm
                or as total area in µm² or mm². This is an analysis-level parameter because it depends
                on the size of the grain or phase to be mapped. The protocol fixes scan speed, line spacing,
                and spot size; the map area is chosen at analysis time to cover the target feature.
              type: object
              properties:
                '@id':
                  const: ada:parameter/laicpmsTAPP/mappingArea
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                    '@id': ada:parameter/laicpmsTAPP/mappingArea
                schema:name:
                  const: Mapping Area
                schema:value:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
            - &id008
              title: Signal Integration Time
              description: 'Actual integration time used for the ablation signal in this analysis, in
                seconds. This is an analysis-level outcome determined during data reduction by applying
                the Signal Integration Interval Method to the time-resolved signal. It is equal to or
                shorter than the Ablation Duration per Spot because the signal start and end transients
                are typically discarded. Not applicable to mapping analysis: for mapping, the equivalent
                concept is the per-pixel cycle time, which is determined by the spectrometer dwell time
                settings (a protocol-level field) rather than being an analysis-level outcome.'
              type: object
              properties:
                '@id':
                  const: ada:parameter/laicpmsTAPP/signalIntegrationTime
                '@type':
                  const:
                  - schema:PropertyValue
                schema:propertyID:
                  const:
                    '@id': ada:parameter/laicpmsTAPP/signalIntegrationTime
                schema:name:
                  const: Signal Integration Time
                schema:value:
                  anyOf:
                  - type: number
                  - type: string
                schema:unitText:
                  type: string
              required:
              - '@id'
              - '@type'
              - schema:propertyID
              - schema:name
              - schema:value
              - schema:unitText
          allOf:
          - contains: *id005
            minContains: 0
            maxContains: 1
          - contains: *id006
            minContains: 0
            maxContains: 1
          - contains: *id007
            minContains: 0
            maxContains: 1
          - contains: *id008
            minContains: 0
            maxContains: 1
        schema:actionProcess:
          type: object
          properties:
            schema:step:
              type: array
              items:
                type: object
                allOf:
                - if:
                    properties:
                      schema:name:
                        const: dataReduction
                    required:
                    - schema:name
                  then:
                    properties:
                      schema:additionalProperty:
                        type: array
                        items:
                          anyOf:
                          - &id009
                            title: Uncertainty Propagation Method
                            description: 'Approach used to propagate analytical uncertainty from raw count
                              rates through the data reduction chain to final reported concentrations
                              or isotope ratios. Specifies which uncertainty sources are included: counting
                              statistics, calibration standard uncertainty, internal standard concentration
                              uncertainty, drift correction uncertainty. Editable because this field may
                              be unspecified at protocol registration (Advanced tier) and can be completed
                              by the analyst when documenting the analysis.'
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/laicpmsTAPP/uncertaintyPropagationMethod
                              '@type':
                                const:
                                - schema:PropertyValue
                              schema:propertyID:
                                const:
                                  '@id': ada:parameter/laicpmsTAPP/uncertaintyPropagationMethod
                              schema:name:
                                const: Uncertainty Propagation Method
                              schema:value:
                                type: string
                            required:
                            - '@id'
                            - '@type'
                            - schema:propertyID
                            - schema:name
                            - schema:value
                          - &id010
                            title: Pulse/Analog Detector Nonlinearity Correction
                            description: Whether a correction was applied for nonlinear response at the
                              transition between pulse-counting and analog detector modes.
                            type: object
                            properties:
                              '@id':
                                const: ada:parameter/laicpmsTAPP/nonlinearResponseCorrection
                              '@type':
                                const:
                                - schema:PropertyValue
                              schema:propertyID:
                                const:
                                  '@id': ada:parameter/laicpmsTAPP/nonlinearResponseCorrection
                              schema:name:
                                const: Pulse/Analog Detector Nonlinearity Correction
                              schema:value:
                                type: string
                            required:
                            - '@id'
                            - '@type'
                            - schema:propertyID
                            - schema:name
                            - schema:value
                        allOf:
                        - contains: *id009
                          minContains: 0
                          maxContains: 1
                        - contains: *id010
                          minContains: 0
                          maxContains: 1
  schema:measurementTechnique:
    type: array
    items:
      type: object
      properties:
        schema:identifier:
          description: DOI or unique persistent identifier for the registered protocol used in this analysis,
            generated upon protocol submission to a data repository. This field is mandatory when submitting
            analytical data to encourage formal protocol registration and ensure traceability. If a DOI
            has been applied for but not yet minted, enter "pending".
          type: string
  schema:funding:
    type: array
  schema:relatedLink:
    type: array
    items:
      type: object
      allOf:
      - if:
          properties:
            schema:linkRelationship:
              const: coupledTechnique
          required:
          - schema:linkRelationship
        then:
          properties:
            schema:target:
              type: object
              properties:
                schema:name:
                  description: Analytical technique(s) applied to the same sample or aliquot in conjunction
                    with this protocol, where the two analyses are designed to be interpreted together
                    or where one provides input to the other. Use the same controlled vocabulary as the
                    Technique field. Enter "None" if no coupling is intended.
                  type: string
                  enum:
                  - EPMA
                  - SIMS
                  - ICP-MS (solution)
                  - Noble Gas MS
                  - None
      - if:
          properties:
            schema:linkRelationship:
              const: coupledProtocol
          required:
          - schema:linkRelationship
        then:
          properties:
            schema:target:
              type: object
              properties:
                schema:url:
                  description: Registered protocol DOI for the coupled technique named above. Provides
                    a stable, citable link to the companion method independent of whether a dataset has
                    been deposited. If the coupled protocol has not yet been registered, enter the DOI
                    of a publication describing the coupled method, or "pending". Enter "None" if no coupling
                    is planned.
                  type: string
      - if:
          properties:
            schema:linkRelationship:
              const: coupledDataset
          required:
          - schema:linkRelationship
        then:
          properties:
            schema:target:
              description: 'DOI or other persistent identifier for the co-registered dataset or publication
                where both datasets are reported together. Accepts: a dedicated dataset DOI (if separately
                deposited), a shared dataset DOI (if co-submitted in the same package), or a publication
                DOI. Use "same submission" if the coupled dataset is included in this data package, or
                "pending" if not yet assigned. If coupling is documented through a shared sample identifier
                only, that information is already captured in Sample Persistent Identifier (Group 2).'
              anyOf:
              - type: string
              - type: array
                items:
                  type: string
  dqv:hasQualityMeasurement:
    type: array
    items:
      type: object
      allOf:
      - if:
          properties:
            dqv:isMeasurementOf:
              const: Oxide production ratio
          required:
          - dqv:isMeasurementOf
        then:
          properties:
            dqv:value:
              description: Actual oxide production ratio measured during this analytical session, using
                the method specified in the protocol-level field "Oxide Production Method and Threshold".
                Report the measured value and confirm it met the protocol threshold.
              anyOf:
              - type: string
              - type: array
                items:
                  type: string
    allOf:
    - contains:
        properties:
          dqv:isMeasurementOf:
            const: Oxide production ratio
        required:
        - dqv:isMeasurementOf
required:
- schema:funding
