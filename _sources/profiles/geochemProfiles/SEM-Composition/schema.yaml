$schema: https://json-schema.org/draft/2020-12/schema
title: ADA SEM Composition (EDS/WDS) Product Profile
description: Path-driven technique-specific profile for ADA SEM Composition (EDS/WDS) Product Profile.
  Extends the base ADA product profile with the SEMCOMPOSITION analysis-instance detail on the schema:Dataset
  root, narrows prov:used to the semCompositionTAPP protocol, and constrains valid component types on
  schema:distribution.hasPart.
allOf:
- $ref: ../../adaProfiles/adaProduct/schema.yaml
- $ref: ../../../analysisSpecificDetails/detailSEMCOMPOSITION/schema.yaml
- type: object
  properties:
    prov:wasGeneratedBy:
      description: Narrow the base prov:used to the semCompositionTAPP definition — inline, or by node
        @id — alongside the instrument.
      type: array
      items:
        type: object
        properties:
          prov:used:
            type: array
            items:
              anyOf:
              - $ref: ../../../geochemProperties/instrument/schema.yaml
              - type: object
                description: Reference by node @id to a semCompositionTAPP definition object defined elsewhere.
                properties:
                  '@id':
                    type: string
                    format: uri
                required:
                - '@id'
              - $ref: ../../../techniqueProtocols/semCompositionTAPP/schema.yaml
    schema:additionalType:
      description: Must include a SEMCOMPOSITION product type identifier.
      contains:
        enum:
        - Scanning Electron Microscopy Energy Dispersive X-ray Spectroscopy (SEMEDS) Point Data
        - Scanning electron microscopy
    schema:distribution:
      description: Distribution items for adaSEMComposition. Archive hasPart items must have ada:componentType
        from technique-specific or universal values.
      type: array
      items:
        type: object
        properties:
          schema:hasPart:
            items:
              type: object
              anyOf:
              - $ref: ../../adaProfiles/adaProduct/schema.yaml#/$defs/universalComponentTypeBranch
              - properties:
                  ada:componentType:
                    type: string
                    enum:
                    - ada:SEMEDSSpectrum
                    - ada:SEMEDSMap
                    - ada:SEMWDSSpectrum
                    - ada:SEMCompositionTabular
                required:
                - ada:componentType
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaSEMComposition
