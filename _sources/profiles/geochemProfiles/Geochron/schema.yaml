$schema: https://json-schema.org/draft/2020-12/schema
title: ADA LA-ICP-MS Geochronology Product Profile
description: Path-driven technique-specific profile for ADA LA-ICP-MS Geochronology Product Profile. Extends
  the base ADA product profile with the GEOCHRON analysis-instance detail on the schema:Dataset root,
  narrows prov:used to the geochronTAPP protocol, and constrains valid component types on schema:distribution.hasPart.
allOf:
- $ref: ../../adaProfiles/adaProduct/schema.yaml
- $ref: ../../../analysisSpecificDetails/detailGEOCHRON/schema.yaml
- type: object
  properties:
    prov:wasGeneratedBy:
      description: Narrow the base prov:used to the geochronTAPP definition — inline, or by node @id —
        alongside the instrument.
      type: array
      items:
        type: object
        properties:
          prov:used:
            type: array
            items:
              anyOf:
              - $ref: ../../../geochemProperties/instrument/schema.yaml
              - type: object
                description: Reference by node @id to a geochronTAPP definition object defined elsewhere.
                properties:
                  '@id':
                    type: string
                    format: uri
                required:
                - '@id'
              - $ref: ../../../techniqueProtocols/geochronTAPP/schema.yaml
    schema:additionalType:
      description: Must include a GEOCHRON product type identifier.
      contains:
        enum:
        - Laser Ablation Quadrupole Inductively Coupled Plasma Mass Spectrometry
        - Laser Ablation Sector-Field Inductively Coupled Plasma Mass Spectrometry
    schema:distribution:
      description: Distribution items for adaGeochron. Archive hasPart items must have ada:componentType
        from technique-specific or universal values.
      type: array
      items:
        type: object
        properties:
          schema:hasPart:
            items:
              type: object
              anyOf:
              - $ref: ../../adaProfiles/adaProduct/schema.yaml#/$defs/universalComponentTypeBranch
              - properties:
                  ada:componentType:
                    type: string
                    enum:
                    - ada:LAICPMSGeochronTabular
                required:
                - ada:componentType
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaGeochron
