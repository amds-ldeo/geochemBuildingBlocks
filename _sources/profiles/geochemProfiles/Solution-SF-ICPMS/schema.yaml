$schema: https://json-schema.org/draft/2020-12/schema
title: ADA Solution SF-ICP-MS Product Profile
description: Path-driven technique-specific profile for ADA Solution SF-ICP-MS Product Profile. Extends
  the base ADA product profile with the SOLUTIONSFICPMS analysis-instance detail on the schema:Dataset
  root, narrows prov:used to the solutionSficpmsTAPP protocol, and constrains valid component types on
  schema:distribution.hasPart.
allOf:
- $ref: ../../adaProfiles/adaProduct/schema.yaml
- $ref: ../../../analysisSpecificDetails/detailSOLUTIONSFICPMS/schema.yaml
- type: object
  properties:
    prov:wasGeneratedBy:
      description: Narrow the base prov:used to the solutionSficpmsTAPP definition — inline, or by node
        @id — alongside the instrument.
      type: array
      items:
        type: object
        properties:
          prov:used:
            type: array
            items:
              anyOf:
              - $ref: ../../../geochemProperties/instrument/schema.yaml
              - type: object
                description: Reference by node @id to a solutionSficpmsTAPP definition object defined
                  elsewhere.
                properties:
                  '@id':
                    type: string
                    format: uri
                required:
                - '@id'
              - $ref: ../../../techniqueProtocols/solutionSficpmsTAPP/schema.yaml
    schema:additionalType:
      description: Must include a SOLUTIONSFICPMS product type identifier.
      contains:
        enum:
        - High-resolution Inductively Coupled Plasma Mass Spectroscopy (HRICPMS) Processed
        - High-resolution inductively coupled plasma mass spectrometry
    schema:distribution:
      description: Distribution items for adaSolutionSFICPMS. Archive hasPart items must have ada:componentType
        from technique-specific or universal values.
      type: array
      items:
        type: object
        properties:
          schema:hasPart:
            items:
              type: object
              anyOf:
              - $ref: ../../adaProfiles/adaProduct/schema.yaml#/$defs/universalComponentTypeBranch
              - properties:
                  ada:componentType:
                    type: string
                    enum:
                    - ada:SolutionICPMSTabular
                required:
                - ada:componentType
    schema:subjectOf:
      properties:
        dcterms:conformsTo:
          contains:
            type: object
            properties:
              '@id':
                const: https://w3id.org/geochem/metadata/profiles/adaSolutionSFICPMS
