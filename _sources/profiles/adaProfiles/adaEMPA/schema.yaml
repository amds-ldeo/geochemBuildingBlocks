$schema: https://json-schema.org/draft/2020-12/schema
title: ADA EMPA Product Profile
description: Technique-specific profile for Electron Microprobe Analysis (EMPA) products. Extends the base ADA product profile with constraints on valid EMPA component types and empa_detail requirements.
allOf:
  - $ref: ../adaProduct/schema.yaml
  - type: object
    properties:
      schema:additionalType:
        description: Must include an EMPA product type identifier.
        contains:
          enum:
            - Electron Microprobe Analysis (EMPA) Collection
            - Electron Microprobe Analysis Image (EMPA)
            - Electron Microprobe Analysis Quantitative Elemental Abundances (EMPAQEA)
            - Electron Microprobe Analysis (EMPA)
            - Electron microprobe analysis
      schema:distribution:
        description: >-
          Distribution items for adaEMPA. Each archive hasPart item must declare
          ada:componentType as a single string, drawn either from the universal
          componentType enum or from the EMPA-specific set defined by detailEMPA.
          EMPA-specific parts may also carry ada:spectrometersUsed and
          ada:signalUsed as siblings (per detailEMPA).
        type: array
        items:
          type: object
          properties:
            schema:hasPart:
              items:
                type: object
                anyOf:
                  - $ref: ../adaProduct/schema.yaml#/$defs/universalComponentTypeBranch
                  - $ref: ../../../analysisSpecificDetails/detailEMPA/schema.yaml
      schema:subjectOf:
        properties:
          dcterms:conformsTo:
            contains:
              type: object
              properties:
                '@id':
                  const: 'https://w3id.org/geochem/metadata/profiles/adaEMPA'
