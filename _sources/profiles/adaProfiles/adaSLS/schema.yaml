$schema: https://json-schema.org/draft/2020-12/schema
title: ADA SLS Product Profile
description: Technique-specific profile for Structured Light Scanning (SLS) products. Extends the base ADA product profile with constraints on valid SLS component types and detailSLS requirements.
allOf:
  - $ref: ../adaProduct/schema.yaml
  - type: object
    properties:
      schema:additionalType:
        description: Must include a SLS product type identifier.
        contains:
          enum:
            - Structured Light Scanning (SLS) Individual Scan Collection
            - Structured Light Scanning (SLS) Shape Model
            - Structured Light Scanning
      schema:distribution:
        description: Distribution items for adaSLS. Archive hasPart items must have ada:componentType from technique-specific or universal values.
        type: array
        items:
          type: object
          properties:
            schema:hasPart:
              items:
                type: object
                anyOf:
                  - $ref: ../adaProduct/schema.yaml#/$defs/universalComponentTypeBranch
                  - properties:
                      ada:componentType:
                        type: string
                        enum:
                          - ada:ShapeModelImage
                    required:
                      - ada:componentType
                  - $ref: ../../../analysisSpecificDetails/detailSLS/schema.yaml
      schema:subjectOf:
        properties:
          dcterms:conformsTo:
            contains:
              type: object
              properties:
                '@id':
                  const: 'https://w3id.org/geochem/metadata/profiles/adaSLS'
