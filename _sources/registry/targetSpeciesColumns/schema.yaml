$schema: https://json-schema.org/draft/2020-12/schema
title: ADA Target-Species-Column Specification Registry
description: Registry of reusable schema:PropertyValueSpecification analyte-column definitions derived
  from technique TAPP spreadsheets. Each $def constrains one analyte-table reporting column (e.g. detectionLimit,
  xrayEmissionLine). TAPP building blocks reference these definitions via fragment $refs (schema.yaml#/$defs/<name>)
  so they resolve locally through the building-block register. The root only hosts $defs; it has no instantiable
  properties of its own.
type: object
$defs:
  analysisOrder:
    title: Sequence
    description: Order of analysis on spectormeter.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/analysisOrder
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: analysisOrder
      schema:name:
        const: Sequence
      ada:dataType:
        const: integer
      schema:readonlyValue:
        const: true
      ada:tier:
        const: M
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  backgroundCorrectionMethod:
    title: Background Correction Method
    description: 'Method used to estimate and subtract background X-ray intensity beneath the peak. For
      WDS: typically 2-point off-peak linear interpolation or Mean Atomic Number (MAN) background model.
      For EDS: spectral background fitting or top-hat filter applied during spectral processing.'
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/backgroundCorrectionMethod
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: backgroundCorrectionMethod
      schema:name:
        const: Background Correction Method
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: false
      ada:tier:
        const: M
      schema:defaultValue:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - schema:defaultValue
  backgroundCountingPosition:
    title: Typical Background Position(s)
    description: Positions of background measurements relative to the peak, in mm and/or sinθ, and whether
      on the high or low energy side.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/backgroundCountingPosition
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: backgroundCountingPosition
      schema:name:
        const: Typical Background Position(s)
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: true
      ada:tier:
        const: M
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  backgroundCountingTime:
    title: Background Counting Time
    description: Total time spent counting at off-peak background position(s) in seconds, summed across
      all background positions.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/backgroundCountingTime
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: backgroundCountingTime
      schema:name:
        const: Background Counting Time
      ada:dataType:
        const: number
      schema:readonlyValue:
        const: false
      ada:tier:
        const: M
      schema:defaultValue:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - schema:defaultValue
  blankCorrection:
    title: Blank Correction
    description: Method and reference material(s) used to determine and subtract blank signal contributions
      (e.g., carbon coat contribution to C signal, or background contamination for trace elements).
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/blankCorrection
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: blankCorrection
      schema:name:
        const: Blank Correction
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:defaultValue:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  detectionLimitMethod:
    title: Detection Limit Method
    description: Formula or approach used to calculate detection limits. Reference method publication
      if applicable. When the procedure does not specify a method, the analyst should complete this field.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/detectionLimitMethod
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: detectionLimitMethod
      schema:name:
        const: Detection Limit Method
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: true
      ada:tier:
        const: M
      schema:defaultValue:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - schema:defaultValue
  edsDeadTime:
    title: EDS Dead Time
    description: Percent dead time reported by the EDS spectrometer
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/edsDeadTime
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: edsDeadTime
      schema:name:
        const: EDS Dead Time
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: true
      ada:tier:
        const: M
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  elementEstimationMethod:
    title: Element Estimation Method
    description: How elemental concentrations were calculated — directly from measured X-ray intensities
      or via cation stoichiometry.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/elementEstimationMethod
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: elementEstimationMethod
      schema:name:
        const: Element Estimation Method
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: true
      ada:tier:
        const: M
      schema:inDefinedTermSet:
        const:
          '@id': ada:vocab/empaTAPP/elementEstimationMethod
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  empa_analyteEstimationMethod:
    title: Analyte Estimation Method
    description: Whether elemental concentrations were calculated directly from measured X-ray intensities,
      or estimated by cation stoichiometry (e.g., oxygen calculated from cation proportions in silicates;
      carbon from stoichiometry in carbonates).
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/analyteEstimationMethod
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: targetSpeciesEstimationMethod
      schema:name:
        const: Analyte Estimation Method
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: true
      ada:tier:
        const: R
      schema:defaultValue:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  empa_analyticalAccuracy:
    title: Analytical Accuracy
    description: Offset between measured and accepted reference values for secondary standards, expressed
      as percent relative bias. Include reference material, reference value source, and the measured value.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/analyticalAccuracy
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: analyticalAccuracy
      schema:name:
        const: Analytical Accuracy
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:defaultValue:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  empa_analyticalPrecision:
    title: Analytical Precision
    description: Reproducibility of repeated measurements on the same or equivalent reference material,
      expressed as 1-sigma relative standard deviation (%). Include reference material name, number of
      analyses (n), and the measured value.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/analyticalPrecision
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: analyticalPrecision
      schema:name:
        const: Analytical Precision
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:defaultValue:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  empa_backgroundPosition:
    title: Background Position(s)
    description: Location(s) of off-peak background measurement(s) relative to the peak, in mm or sin-theta,
      and whether on the high- or low-energy side.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/backgroundPosition
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: backgroundPosition
      schema:name:
        const: Background Position(s)
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:defaultValue:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  empa_beamCurrent:
    title: Beam Current
    description: Probe current in nanoamperes (nA). Often varies by phase type or target species; record
      the procedure-standard value(s).
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/beamCurrent
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: beamCurrent
      schema:name:
        const: Beam Current
      ada:dataType:
        const: number
      schema:readonlyValue:
        const: false
      ada:tier:
        const: M
      schema:defaultValue:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - schema:defaultValue
  empa_countingStatisticsError:
    title: Counting Statistics Error
    description: Uncertainty predicted from counting statistics — the theoretical limit set by the Poisson
      distribution of the counts accumulated — for each reported quantity per analysis, with the sigma
      level stated. Derived from the counts on the target species together with those on any background
      or blank subtracted from it. Distinct from the scatter actually observed within a measurement or
      between repeated measurements, which is recorded separately.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/countingStatisticsError
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: countingStatisticsError
      schema:name:
        const: Counting Statistics Error
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:defaultValue:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  empa_detectionLimit:
    title: Detection Limit
    description: Method detection limit at 99% confidence (3-sigma), one per reported concentration variable
      (one per analyte, these being the same set), derived from counting statistics on peak and background.
      Include the method and the resulting value for each.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/detectionLimit
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: detectionLimit
      schema:name:
        const: Detection Limit
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:defaultValue:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  empa_diffractingCrystal:
    title: Diffracting Crystal
    description: Analyzing crystal (monochromator) used on each spectrometer assignment. Crystal choice
      determines the detectable wavelength range and dispersion.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/diffractingCrystal
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: diffractingCrystal
      schema:name:
        const: Diffracting Crystal
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: true
      ada:tier:
        const: M
      schema:defaultValue:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - schema:defaultValue
  empa_epmaTechniquePerAnalyte:
    title: EPMA Technique per Analyte
    description: Whether the measurement was made by WDS or EDS. Applies where a procedure uses both WDS
      and EDS.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/epmaTechniquePerAnalyte
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: epmaTechniquePerAnalyte
      schema:name:
        const: EPMA Technique per Analyte
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: true
      ada:tier:
        const: M
      schema:defaultValue:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - schema:defaultValue
  empa_epmaTechniquePerTargetSpecies:
    title: EPMA Technique per Target Species
    description: Whether the measurement was made by WDS or EDS. Applies where a procedure uses both WDS
      and EDS.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/epmaTechniquePerTargetSpecies
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: epmaTechniquePerTargetSpecies
      schema:name:
        const: EPMA Technique per Target Species
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: true
      ada:tier:
        const: M
      schema:defaultValue:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - schema:defaultValue
  empa_interferenceCorrectionsApplied:
    title: Interference Corrections Applied
    description: Whether a spectral interference correction was applied for each analyte. Common interferences
      include Ti Kb on V Ka, Cr Kb on Mn Ka, and Ba La on Ti Ka.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/interferenceCorrectionsApplied
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: interferenceCorrectionsApplied
      schema:name:
        const: Interference Corrections Applied
      ada:dataType:
        const: boolean
      schema:readonlyValue:
        const: true
      ada:tier:
        const: M
      schema:defaultValue:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - schema:defaultValue
  empa_normalizationStandardsBasedCorrection:
    title: Normalization / Standards-Based Correction
    description: Post-acquisition normalization applied using secondary reference materials to correct
      for session-to-session calibration drift.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/normalizationStandardsBasedCorrection
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: normalizationStandardsBasedCorrection
      schema:name:
        const: Normalization / Standards-Based Correction
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:defaultValue:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  empa_primaryCalibrationStandardName:
    title: Primary Calibration Standard Name
    description: Name(s) of the primary reference material(s) used for element standardization (intensity
      calibration). Include the material name, its source or supplier, and a citation for the accepted
      values used, since results calibrated against different published values for the same material are
      not directly comparable.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/primaryCalibrationStandardName
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: primaryCalibrationStandardName
      schema:name:
        const: Primary Calibration Standard Name
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: false
      ada:tier:
        const: M
      schema:defaultValue:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - schema:defaultValue
  empa_proportionalCounterDetector:
    title: Proportional Counter / Detector
    description: Type of detector used on each spectrometer assignment. Affects sensitivity and count
      rate linearity.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/proportionalCounterDetector
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: proportionalCounterDetector
      schema:name:
        const: Proportional Counter / Detector
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: true
      ada:tier:
        const: R
      schema:defaultValue:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  empa_secondaryReferenceMaterials:
    title: Secondary Reference Materials
    description: Quality-control reference material(s) analyzed alongside unknowns to verify calibration
      accuracy. Include material name, assessed elements, number of analyses (n), and measured vs. accepted
      values.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/secondaryReferenceMaterials
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: secondaryReferenceMaterials
      schema:name:
        const: Secondary Reference Materials
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: false
      ada:tier:
        const: M
      schema:defaultValue:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - schema:defaultValue
  empa_targetSpeciesEstimationMethod:
    title: Target Species Estimation Method
    description: Whether elemental concentrations were calculated directly from measured X-ray intensities,
      or estimated by cation stoichiometry (e.g., oxygen calculated from cation proportions in silicates;
      carbon from stoichiometry in carbonates).
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/targetSpeciesEstimationMethod
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: targetSpeciesEstimationMethod
      schema:name:
        const: Target Species Estimation Method
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: true
      ada:tier:
        const: R
      schema:defaultValue:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  empa_wdsPhaSetting:
    title: WDS PHA Setting
    description: Pulse height analyzer (PHA) setting for the WDS detector. Integral mode accepts all pulses
      above a threshold; Differential mode selects a narrow energy window to reject higher-order reflections
      and escape peaks.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/wdsPhaSetting
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: wdsPhaSetting
      schema:name:
        const: WDS PHA Setting
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: true
      ada:tier:
        const: R
      schema:defaultValue:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  empa_wdsSpectrometerChannel:
    title: WDS Spectrometer Channel
    description: WDS spectrometer position(s) assigned to each analyte, one entry per assignment. An analyte
      may be assigned to more than one spectrometer with intensities aggregated (aggregate intensity counting),
      and one spectrometer serves several analytes across a run, so the assignment — not the analyte —
      is the unit carrying the spectrometer setup. Different spectrometers may have different crystal
      configurations.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/wdsSpectrometerChannel
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: wdsSpectrometerChannel
      schema:name:
        const: WDS Spectrometer Channel
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: true
      ada:tier:
        const: R
      schema:defaultValue:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  empa_xRayBackgroundCorrectionMethod:
    title: X-ray Background Correction Method
    description: 'Method used to estimate and subtract background X-ray intensity beneath the peak. For
      WDS: typically 2-point off-peak linear interpolation or Mean Atomic Number (MAN) background model.
      For EDS: spectral background fitting or top-hat filter applied during spectral processing.'
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/xRayBackgroundCorrectionMethod
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: xRayBackgroundCorrectionMethod
      schema:name:
        const: X-ray Background Correction Method
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: false
      ada:tier:
        const: M
      schema:defaultValue:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - schema:defaultValue
  empa_xRayLineOverlapCorrectionsApplied:
    title: X-ray Line Overlap Corrections Applied
    description: Whether a spectral interference correction was applied. Common interferences include
      Ti Kb on V Ka, Cr Kb on Mn Ka, and Ba La on Ti Ka.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/xRayLineOverlapCorrectionsApplied
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: xRayLineOverlapCorrectionsApplied
      schema:name:
        const: X-ray Line Overlap Corrections Applied
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: true
      ada:tier:
        const: M
      schema:defaultValue:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - schema:defaultValue
  epmaTechnique:
    title: EPMA Technique per Element
    description: Whether this element was measured by WDS or EDS.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/epmaTechnique
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: epmaTechnique
      schema:name:
        const: EPMA Technique per Element
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: true
      ada:tier:
        const: M
      schema:inDefinedTermSet:
        const:
          '@id': ada:vocab/empaTAPP/epmaTechnique
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  interferenceCorrection:
    title: Interference Corrections Applied
    description: Flag indicating whether a spectral interference correction was applied for this element.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/interferenceCorrection
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: interferenceCorrection
      schema:name:
        const: Interference Corrections Applied
      ada:dataType:
        const: boolean
      schema:readonlyValue:
        const: true
      ada:tier:
        const: M
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  interferenceCorrectionStandard:
    title: Interference Correction Standard
    description: Reference material used to quantify and calibrate the interference correction.
    type: object
    properties:
      '@id':
        const: ada:targetSpeciesColumn/empaTAPP/interferenceCorrectionStandard
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: interferenceCorrectionStandard
      schema:name:
        const: Interference Correction Standard
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: true
      ada:tier:
