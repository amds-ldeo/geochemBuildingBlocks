  betweenSessionReproducibility:
    title: Between-Session (Long-Term) Analytical Precision and Assessment Method
    description: 'Reproducibility of measurements across multiple analytical sessions over weeks to months (long-term or intermediate precision). Report both the assessment method and the precision values. Specify: reference material used, number of sessions n, time span covered, and statistic reported. Long-term precision is typically assessed from a compiled record of secondary reference material values across all sessions.'
