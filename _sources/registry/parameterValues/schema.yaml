    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semImaging_ebsdStepSize:
    title: EBSD Step Size
    description: Distance between adjacent EBSD measurement points in the map in nm or µm. Must be smaller
      than the smallest grain of interest to resolve grain boundary positions and intragrain orientation
      gradients.
    type: object
    properties:
      '@id':
        const: ada:parameter/semImagingTAPP/ebsdStepSize
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semImagingTAPP/ebsdStepSize
      schema:name:
        const: EBSD Step Size
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
