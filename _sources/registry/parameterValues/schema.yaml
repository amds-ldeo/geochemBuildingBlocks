    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_edsSpectralProcessingType:
    title: EDS Spectral Processing Type
    description: Method used to process EDS spectra and extract net peak intensities from raw spectral data.
      Applied before quantification (see Matrix Correction Method). Common approaches include background
      fitting and subtraction followed by peak integration, and filter fit or Gaussian deconvolution for
      overlapping peaks.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/edsSpectralProcessingType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/edsSpectralProcessingType
      schema:name:
        const: EDS Spectral Processing Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_interferingElements:
    title: Interfering Elements
    description: Element(s) whose X-ray lines overlap with the measured peak for this analyte, requiring
      a correction.
    type: object
