        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/sampleAliquotMassOrVolume
      schema:name:
        const: Sample Aliquot Mass or Volume
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionMcicpms_instrumentSerialNumberOrLabIdentifier:
    title: Instrument Serial Number or Lab Identifier
    description: Serial number or laboratory-internal identifier for the specific instrument unit. Supports
      traceability to instrument service records.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/instrumentSerialNumberOrLabIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/instrumentSerialNumberOrLabIdentifier
      schema:name:
        const: Instrument Serial Number or Lab Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionMcicpms_torchDepth:
    title: Torch Depth
    description: Distance between the load coil and the sampling cone tip (mm), also called injector depth
      or torch position depending on the instrument manufacturer. Affects ion transmission efficiency, oxide
      formation, and doubly-charged species production. The procedure specifies a target value optimised
      during initial setup; the analyst confirms or fine-adjusts during session tuning.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/torchDepth
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/torchDepth
      schema:name:
        const: Torch Depth
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionMcicpms_massResolutionSetting:
    title: Mass Resolution Setting
    description: Mass resolution mode used in this procedure. MC-ICP-MS instruments allow selection of low
      resolution (LR; m/Δm ≈ 300–400), medium resolution (MR; m/Δm ≈ 3000–8000), or high resolution (HR;
      m/Δm ≈ 10,000–12,000). Most isotope ratio measurements use low resolution after chemical separation
      has removed interfering elements. Medium or high resolution is used when polyatomic interferences
      (e.g., ArN+, ArO+, ArOH+ on Fe isotopes) cannot be fully resolved by chemistry alone. Procedure registers
      the mode in use; analyst confirms at session start.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/massResolutionSetting
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/massResolutionSetting
      schema:name:
        const: Mass Resolution Setting
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionMcicpms_sampleUptakeRate:
    title: Sample Uptake Rate
    description: Peristaltic pump speed or self-aspiration flow rate for sample introduction (µL/min or
      mL/min).
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/sampleUptakeRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/sampleUptakeRate
      schema:name:
        const: Sample Uptake Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionMcicpms_rfPower:
    title: RF Power
    description: Radiofrequency forward power applied to the plasma (W). Controls ionization efficiency
      and oxide production rates.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/rfPower
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/rfPower
      schema:name:
        const: RF Power
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionMcicpms_coolantGasFlowRate:
    title: Coolant (Plasma) Gas Flow Rate
    description: Flow rate of the outer (coolant) argon gas stream (L/min). Influences plasma temperature
      and oxide ion formation.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/coolantGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/coolantGasFlowRate
      schema:name:
        const: Coolant (Plasma) Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionMcicpms_auxiliaryGasFlowRate:
    title: Auxiliary Gas Flow Rate
    description: Flow rate of the intermediate (auxiliary) argon gas stream between torch body and injector
      tube (L/min).
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/auxiliaryGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/auxiliaryGasFlowRate
      schema:name:
        const: Auxiliary Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionMcicpms_nebulizerGasFlowRate:
    title: Nebulizer Gas Flow Rate
    description: Flow rate of the carrier argon gas delivered through the nebulizer (L/min). Controls aerosol
      transport and strongly influences signal sensitivity and stability. Adjusted daily to optimize signal.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/nebulizerGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/nebulizerGasFlowRate
      schema:name:
        const: Nebulizer Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionMcicpms_makeUpGasFlowRate:
    title: Make-up Gas Flow Rate
    description: Supplementary argon flow added downstream of a desolvation system to maintain total gas
      delivery to the plasma (L/min). Record 'N/A' if no desolvation system is used. Record 'N/A' where
      Desolvation System is 'None'.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/makeUpGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/makeUpGasFlowRate
      schema:name:
        const: Make-up Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionMcicpms_numberOfBlocksPerMeasurement:
    title: Number of Blocks per Measurement
    description: Number of measurement blocks acquired per sample or standard solution introduction. In
      MC-ICP-MS, data are structured as blocks of cycles; each block typically begins with a baseline (on-peak
      zero) measurement before the analytical cycles. Multiple blocks per sample allow inspection of signal
      stability and within-measurement drift. Procedure specifies the standard number; analyst may adjust
      for samples with low signal or for high-precision requirements.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/numberOfBlocksPerMeasurement
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/numberOfBlocksPerMeasurement
      schema:name:
        const: Number of Blocks per Measurement
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionMcicpms_numberOfCyclesPerBlock:
    title: Number of Cycles per Block
    description: Number of measurement cycles acquired per block. One cycle corresponds to a single set
      of simultaneous Faraday cup readings integrated for the duration specified in Integration Time per
      Cycle. Total integration time per sample = (Number of Cycles per Block) × (Integration Time per Cycle)
      × (Number of Blocks per Measurement). Procedure specifies the standard value; analyst may adjust within
      procedure bounds.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/numberOfCyclesPerBlock
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/numberOfCyclesPerBlock
      schema:name:
        const: Number of Cycles per Block
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionMcicpms_integrationTimePerCycle:
    title: Integration Time per Cycle
    description: Duration of signal integration per measurement cycle (seconds). Determines counting statistics
      per cycle. Longer integration times improve shot-noise precision but increase the impact of signal
      drift within the integration window. For high-gain (10¹² or 10¹³ Ω) amplifier channels, longer integration
      times are often required to accumulate sufficient charge. Procedure specifies the standard integration
      time; analyst may confirm or adjust within procedure bounds. Where different isotope channels use
      different integration schemes, record the time for each channel.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/integrationTimePerCycle
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/integrationTimePerCycle
      schema:name:
        const: Integration Time per Cycle
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionMcicpms_collisionGasFlowRate:
    title: Collision Gas Flow Rate
    description: Flow rate of the collision gas in KED mode (mL/min), on collision/reaction-cell-equipped
      MC-ICP-MS instruments. Higher flow rates provide greater interference suppression at the cost of analyte
      sensitivity. Record 'N/A' if the instrument has no cell or KED mode is not used. Record 'N/A' where
      Collision/Reaction Cell (CRC) Configuration does not include KED.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/collisionGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/collisionGasFlowRate
      schema:name:
        const: Collision Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionMcicpms_cellExitDiscriminationVoltage:
    title: Cell Exit Discrimination Voltage
    description: Kinetic energy discrimination offset voltage applied at the exit of the collision cell
      (V), on collision/reaction-cell-equipped MC-ICP-MS instruments. Controls the degree of polyatomic
      ion suppression. Record 'N/A' if the instrument has no cell or KED mode is not used. Record 'N/A'
      where Collision/Reaction Cell (CRC) Configuration does not include KED.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/cellExitDiscriminationVoltage
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/cellExitDiscriminationVoltage
      schema:name:
        const: Cell Exit Discrimination Voltage
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionMcicpms_reactionGasFlowRate:
    title: Reaction Gas Flow Rate
    description: Flow rate of the reaction gas in DRC mode (mL/min), on collision/reaction-cell-equipped
      MC-ICP-MS instruments. Record 'N/A' if the instrument has no cell or DRC mode is not used. Record
      'N/A' where Collision/Reaction Cell (CRC) Configuration does not include DRC.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/reactionGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/reactionGasFlowRate
      schema:name:
        const: Reaction Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionMcicpms_doubleSpikeMixingRatio:
    title: Double-Spike Mixing Ratio
    description: Target proportion of double-spike signal relative to total analyte signal in the spiked
      mixture, expressed as spike fraction (0–1) or spike:sample ratio. An optimal mixing ratio minimizes
      error propagation through the double-spike inversion; the optimum is analyte-system specific and is
      typically determined using the Double Spike Toolbox or equivalent. The achieved mixing ratio may deviate
      from the target within acceptable bounds (typically ±20% of optimal); the double-spike inversion corrects
      for actual mixing ratios. Record 'N/A' if double-spike method is not used. Record 'N/A' where the
      procedure does not use a double spike.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/doubleSpikeMixingRatio
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/doubleSpikeMixingRatio
      schema:name:
        const: Double-Spike Mixing Ratio
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionMcicpms_spikeOutlierFilteringApproach:
    title: Spike / Outlier Filtering Approach
    description: Criteria used to identify and exclude anomalous cycles or replicate measurements from the
      calculated isotope ratio mean. Filtering is applied after baseline subtraction and before mass bias
      correction.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/spikeOutlierFilteringApproach
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/spikeOutlierFilteringApproach
      schema:name:
        const: Spike / Outlier Filtering Approach
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionMcicpms_memoryEffectMitigation:
    title: Memory Effect Mitigation
    description: Procedure applied to minimize carryover of analyte isotopes between successive sample introductions.
      In MC-ICP-MS, extended rinse periods with the same acid matrix as samples (see Wash Time Between Samples)
      are the primary mitigation. At data processing level, documents any flagging or exclusion of measurements
      preceded by samples with significantly different isotopic compositions where carryover may be suspected.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/memoryEffectMitigation
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/memoryEffectMitigation
      schema:name:
        const: Memory Effect Mitigation
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionMcicpms_uncertaintyPropagationMethod:
    title: Uncertainty Propagation Method
    description: 'The approach used to propagate analytical uncertainty through the data reduction chain
      to the final reported value. State which sources are included in the propagation: counting statistics,
      calibration standard uncertainty, internal standard uncertainty, drift correction, and any systematic
      contributions. Distinct from Uncertainty Level, which states the convention at which the resulting
      uncertainty is quoted.'
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/uncertaintyPropagationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/uncertaintyPropagationMethod
      schema:name:
        const: Uncertainty Propagation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionMcicpms_normalizationStandardsBasedCorrection:
    title: Normalization / Standards-Based Correction
    description: 'Post-acquisition normalization applied to output isotope ratio data beyond the primary
      mass bias correction. Examples: correction of δ values for decay of enriched spike isotopes between
      calibration and use date (double-spike procedures); age correction of δ238U for secular disequilibrium.
      Record ''None'' if no additional normalization is applied.'
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/normalizationStandardsBasedCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/normalizationStandardsBasedCorrection
      schema:name:
        const: Normalization / Standards-Based Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionMcicpms_calibrationFactorAndDeterminationMethod:
    title: Calibration Factor and Determination Method
    description: 'An externally-calibrated factor that converts the measured quantity into the reported
      quantity, how it was determined, and its uncertainty. Applies where the conversion depends on a factor
      calibrated against a reference of independently known value, rather than on the instrument response
      alone. Distinct from the fields that name the calibration material and that state which approach applies
      to which analyte, where the technique has them: this field records the resulting factor itself.'
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/calibrationFactorAndDeterminationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/calibrationFactorAndDeterminationMethod
      schema:name:
        const: Calibration Factor and Determination Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionMcicpms_constantsAndReferenceValuesUsed:
    title: Constants and Reference Values Used
    description: Physical constants and reference values used in data reduction to calculate the final reported
      quantity (e.g., decay constants for age calculation, standard isotope ratios, or other citable reference
      values used in a correction or calculation), together with their source. Distinct from the Group 6
      reference-material fields, which document accepted values for specific calibration/validation materials
      rather than universal physical constants. Record "None" if no citable, revisable physical constants
      feed into this procedure's data reduction.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/constantsAndReferenceValuesUsed
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/constantsAndReferenceValuesUsed
      schema:name:
        const: Constants and Reference Values Used
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionMcicpms_primaryCalibrationStandardName:
    title: Primary Calibration Standard Name
    description: 'Name and reference material identifier of the isotopic reference standard used as the
      bracketing standard (SSB) or zero-delta anchor. This is an isotopic composition standard (not a concentration
      standard): it defines the isotopic composition against which all sample δ or ε values are normalized.
      Must be a pure, homogeneous, internationally distributed material with well-characterized isotopic
      composition. For double-spike procedures, also used for spike calibration. Include the material name,
      its source or supplier, and a citation for the accepted values used, since results calibrated against
      different published values for the same material are not directly comparable.'
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/primaryCalibrationStandardName
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/primaryCalibrationStandardName
      schema:name:
        const: Primary Calibration Standard Name
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionMcicpms_secondaryReferenceMaterials:
    title: Secondary Reference Materials
    description: Reference material(s) measured as unknowns to independently assess analytical accuracy.
      Specify material name and the isotopic composition reference source (certified value, consensus value,
      or literature compilation). For isotope ratio procedures, secondary RMs are geological materials with
      published isotopic compositions (e.g., BHVO-2 for Fe isotopes) or pure isotopic standards of certified
      composition.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/secondaryReferenceMaterials
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/secondaryReferenceMaterials
      schema:name:
        const: Secondary Reference Materials
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionMcicpms_fundingSourceForProcedureDevelopment:
    title: Funding Source for Procedure Development
    description: Grants and other funding sources that supported instrument acquisition, major upgrades,
      procedure development, and associated personnel time. Include grant numbers and funding agencies where
      applicable.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/fundingSourceForProcedureDevelopment
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/fundingSourceForProcedureDevelopment
      schema:name:
        const: Funding Source for Procedure Development
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionMcicpms_procedureReference:
    title: Procedure Reference(s)
    description: DOI or URL for peer-reviewed publications or technical reports describing, validating,
      or benchmarking this procedure.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/procedureReference
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/procedureReference
      schema:name:
        const: Procedure Reference(s)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionMcicpms_torchType:
    title: Torch Type
    description: Type of plasma torch used (e.g., standard quartz, high-matrix, low-flow).
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/torchType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/torchType
      schema:name:
        const: Torch Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionMcicpms_samplerAndSkimmerConeMaterial:
    title: Sampler and Skimmer Cone Material
    description: Material composition of the sampler and skimmer cones. Nickel (Ni) is standard for HNO3
      matrices. Platinum (Pt) cones are used for HCl-rich matrices (e.g., 6 M HCl in Fe chemistry procedures)
      due to greater corrosion resistance.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/samplerAndSkimmerConeMaterial
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/samplerAndSkimmerConeMaterial
      schema:name:
        const: Sampler and Skimmer Cone Material
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionMcicpms_desolvationSystem:
    title: Desolvation System
    description: 'Desolvating nebulizer or membrane desolvator used upstream of the plasma to reduce solvent
      load. Lowers oxide production rates and increases sensitivity, and is commonly used for low-abundance
      analytes or small sample sizes. Note the trade-off: desolvation can introduce additional instrumental
      mass bias instability relative to wet plasma introduction. Record ''None'' if not used.'
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/desolvationSystem
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/desolvationSystem
      schema:name:
        const: Desolvation System
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionMcicpms_reactionGasType:
    title: Reaction Gas Type
    description: Type of reactive gas introduced into the dynamic reaction cell (e.g., NH3, O2, CH4), on
      collision/reaction-cell-equipped MC-ICP-MS instruments. Record 'N/A' if the instrument has no cell
      or DRC mode is not used. Record 'N/A' where Collision/Reaction Cell (CRC) Configuration does not include
      DRC.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/reactionGasType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/reactionGasType
      schema:name:
        const: Reaction Gas Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionMcicpms_internalStandardConcentration:
    title: Internal Standard Concentration
    description: Target concentration of internal standard element(s) in all measured solutions (µg/L or
      ppb). Record 'N/A' where Internal Standard Element is 'None'.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/internalStandardConcentration
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/internalStandardConcentration
      schema:name:
        const: Internal Standard Concentration
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
