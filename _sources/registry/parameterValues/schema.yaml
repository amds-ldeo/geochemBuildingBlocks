  geochron_preAblationSurfaceTreatment:
    title: Pre-Ablation Surface Treatment
    description: Procedure applied immediately before each analysis to remove surface contamination or condition
      the sample surface, distinct from general sample preparation. Pre-ablation pulses are typically discarded
      before signal acquisition begins.
