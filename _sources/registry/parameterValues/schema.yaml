    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_stageScanVsBeamScan:
    title: Stage Scan vs. Beam Scan
    description: Whether the X-ray map was acquired by moving the sample stage (stage scan) or by deflecting
      the electron beam (beam scan). Stage scan preserves beam geometry and spot size across the full map
      but is slower; beam scan is faster but may introduce geometric distortion at large deflections.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/stageScanVsBeamScan
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/stageScanVsBeamScan
      schema:name:
        const: Stage Scan vs. Beam Scan
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_analyteEstimationMethod:
    title: Analyte Estimation Method
    description: Whether elemental concentrations were calculated directly from measured X-ray intensities,
      or estimated by cation stoichiometry (e.g., oxygen calculated from cation proportions in silicates;
      carbon from stoichiometry in carbonates).
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/analyteEstimationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/analyteEstimationMethod
      schema:name:
