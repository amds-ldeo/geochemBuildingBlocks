        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/rfPower
      schema:name:
        const: RF Power (W)
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
