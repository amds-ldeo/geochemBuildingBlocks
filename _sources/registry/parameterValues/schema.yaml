      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/laserBeamEnergyProfile
      schema:name:
        const: Laser Beam Energy Profile
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_plasmaThermalMode:
    title: Plasma Thermal Mode
    description: Whether the ICP plasma is operated under cool plasma or normal (hot) plasma conditions.
      Normal plasma is standard for U-(Th-)Pb geochronology; cool plasma would reduce sensitivity for these
      high-mass analytes and is not typically used.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/plasmaThermalMode
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/plasmaThermalMode
      schema:name:
        const: Plasma Thermal Mode
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_collectorConfiguration:
    title: Collector Configuration
    description: Assignment of isotope masses to Faraday cup or ion counter detector positions for this
      procedure. For static multi-collection, one configuration applies throughout the measurement; for
      multi-dynamic procedures, lists all configurations and the cycling sequence. Includes interference-monitor
      masses collected alongside analyte isotopes.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/collectorConfiguration
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/collectorConfiguration
      schema:name:
        const: Collector Configuration
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_oxideProductionMethodAndThreshold:
    title: Oxide Production Method and Threshold
    description: Method used to quantify plasma oxide production and the acceptance threshold applied before
      commencing analysis. ThO⁺/Th⁺ (mass 248/232) is the standard proxy for U-Th-Pb geochronology, directly
      relevant to Th/U ratio accuracy.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/oxideProductionMethodAndThreshold
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/oxideProductionMethodAndThreshold
      schema:name:
        const: Oxide Production Method and Threshold
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_instrumentWarmUpSessionDurationLimit:
    title: Instrument Warm-up / Session Duration Limit
    description: Minimum warm-up time required after plasma ignition before analyses begin, and any maximum
      session duration enforced to maintain stable operating conditions.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/instrumentWarmUpSessionDurationLimit
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/instrumentWarmUpSessionDurationLimit
      schema:name:
        const: Instrument Warm-up / Session Duration Limit
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_baselineMeasurementApproach:
    title: Baseline Measurement Approach
    description: Method and timing for measuring the ion beam baseline (background) during acquisition,
      distinct from the data-processing-level blank subtraction method (see Gas Blank, Group 5). For LA-ICP-MS,
      baseline is measured with the laser off (gas blank), typically before each ablation or block.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/baselineMeasurementApproach
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/baselineMeasurementApproach
      schema:name:
        const: Baseline Measurement Approach
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_multiRunSequentialAnalysisDesign:
    title: Multi-Run Sequential Analysis Design
    description: Whether the procedure uses a single acquisition pass or multiple sequential runs on the
      same sample location, each optimised for different analytical objectives.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/multiRunSequentialAnalysisDesign
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/multiRunSequentialAnalysisDesign
      schema:name:
        const: Multi-Run Sequential Analysis Design
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_signalCollectionMode:
    title: Signal Collection Mode
    description: Mode used to collect ion signal across the monitored masses. In peak hopping mode, the
      quadrupole jumps sequentially between pre-set mass positions and dwells at each peak. Applicable only
      to quadrupole-based instruments; this concept does not extend to collision-cell-equipped multi-collector
      instruments (e.g., Nu Sapphire, Thermo Neoma MS/MS), whose collector array performs genuinely simultaneous
      multi-collection regardless of whether a collision/reaction cell is present upstream. Some such instruments
      (e.g., Neoma MS/MS) instead use a pre-cell mass filter of a fundamentally different, non-quadrupole
      design to pre-select a mass window before the cell — a distinct concept not currently captured by
      any field in this TAPP.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/signalCollectionMode
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/signalCollectionMode
      schema:name:
        const: Signal Collection Mode
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_collisionGasType:
    title: Collision Gas Type
    description: Type of collision gas used in KED mode for polyatomic interference suppression. Applies
      to quadrupole-based instruments and to collision-cell-equipped multi-collector instruments (e.g.,
      Nu Sapphire, Thermo Neoma MS/MS) operating in KED mode.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/collisionGasType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/collisionGasType
      schema:name:
        const: Collision Gas Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_reactionGasType:
    title: Reaction Gas Type
    description: Type of reactive gas introduced into the dynamic reaction cell (DRC) for interference removal
      through ion-molecule reactions. Applies to quadrupole-based instruments and to collision-cell-equipped
      multi-collector instruments (e.g., Nu Sapphire, Thermo Neoma MS/MS) operating in DRC mode.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/reactionGasType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/reactionGasType
      schema:name:
        const: Reaction Gas Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_massResolutionPerAnalyte:
    title: Mass Resolution per Analyte
    description: Mass resolution mode assigned to each analyte in this procedure. The selected resolution
      determines which polyatomic interferences (e.g., ¹⁸⁶W¹⁶O⁺ on ²⁰²Hg, relevant to common-Pb correction)
      are physically resolved by the magnetic sector. Applicable only to sector-field instruments.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/massResolutionPerAnalyte
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/massResolutionPerAnalyte
      schema:name:
        const: Mass Resolution per Analyte
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_eScanRange:
    title: E-scan Range
    description: Electric scan range used for peak acquisition, expressed as percentage of the centre mass.
      Varies the accelerating voltage to cover nearby masses without re-scanning the magnet. Applicable
      only to sector-field instruments.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/eScanRange
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/eScanRange
      schema:name:
        const: E-scan Range
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  geochron_tripleScanningMode:
    title: Triple Scanning Mode
    description: Whether each mass peak is scanned three times per cycle and the results averaged, to reduce
      noise from short-term magnetic field instabilities. Applicable only to sector-field instruments with
      this capability.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/tripleScanningMode
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/tripleScanningMode
      schema:name:
        const: Triple Scanning Mode
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_massFractionationLaw:
    title: Mass Fractionation Law
    description: Mathematical law used to parameterize instrumental isotope mass fractionation as a function
      of mass difference. Not stated in Table 3 (Horstwood et al. 2016) for the worked example; the exponential
      law is most widely used and theoretically best justified for MC-ICP-MS.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/massFractionationLaw
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/massFractionationLaw
      schema:name:
        const: Mass Fractionation Law
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_perAnalyteCalibrationStrategy:
    title: Per-Analyte Calibration Strategy
    description: Documents cases where different analytes are calibrated using different strategies within
      the same session. If a single strategy applies uniformly, record that here.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/perAnalyteCalibrationStrategy
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/perAnalyteCalibrationStrategy
      schema:name:
        const: Per-Analyte Calibration Strategy
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_matrixOffsetCorrection:
    title: Matrix Offset Correction (LIEF)
    description: Whether an empirical correction was applied to account for systematic differences in laser-induced
      elemental fractionation (LIEF) patterns between the external calibration standard and the sample matrix.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/matrixOffsetCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/matrixOffsetCorrection
      schema:name:
        const: Matrix Offset Correction (LIEF)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_signalIntegrationIntervalMethod:
    title: Signal Integration Interval Method
    description: Approach used to select the stable signal interval for integration during data reduction,
      and to exclude anomalous signals from inclusions, cracks, or mixed domains. Central to interpreting
      excess scatter/MSWD in the resulting age population.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/signalIntegrationIntervalMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/signalIntegrationIntervalMethod
      schema:name:
        const: Signal Integration Interval Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_isobaricInterferenceCorrectionsApplied:
    title: Isobaric Interference Corrections Applied
    description: Whether isobaric interference corrections were applied for any measured isotope in this
      procedure. A procedure-level Boolean; element-specific detail is in Interfering Species and Interference
      Correction Method.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/isobaricInterferenceCorrectionsApplied
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/isobaricInterferenceCorrectionsApplied
      schema:name:
        const: Isobaric Interference Corrections Applied
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_interferingSpecies:
    title: Interfering Species
    description: Elemental or molecular species overlapping with the measured isotope, relevant to U-Th-Pb
      geochronology (e.g., ²⁰⁴Hg on ²⁰⁴Pb, relevant to the Common-Pb Correction field above).
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/interferingSpecies
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/interferingSpecies
      schema:name:
        const: Interfering Species
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_interferenceCorrectionMethod:
    title: Interference Correction Method
    description: Equation or procedure used to correct for isobaric interferences, including the reference
      material or monitor isotope used to characterise it.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/interferenceCorrectionMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/interferenceCorrectionMethod
      schema:name:
        const: Interference Correction Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_isotopeDilutionDataReductionMethod:
    title: Isotope Dilution Data Reduction Method
    description: Mass balance approach used to calculate sample mass fractions from spike-sample isotope
      ratio measurements, relevant when a concentration spike (e.g., ²³⁵U, as in Table 3's own worked example)
      is co-aspirated. Record 'None' if isotope dilution is not used.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/isotopeDilutionDataReductionMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/isotopeDilutionDataReductionMethod
      schema:name:
        const: Isotope Dilution Data Reduction Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_doubleSpikeIsotopePair:
    title: Double-Spike Isotope Pair
    description: The pair of enriched isotopes used to construct a double spike for combined mass bias and/or
      common-Pb correction. Both isotopes must be naturally rare and free from isobaric interferences. Record
      'N/A' if double-spike method is not used.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/doubleSpikeIsotopePair
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/doubleSpikeIsotopePair
      schema:name:
        const: Double-Spike Isotope Pair
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_doubleSpikeInversionAlgorithm:
    title: Double-Spike Inversion Algorithm
    description: Mathematical algorithm used to simultaneously solve for the true sample isotope ratio and
      the mass fractionation factor from the measured spike-sample mixture. Record 'N/A' if double-spike
      method is not used.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/doubleSpikeInversionAlgorithm
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/doubleSpikeInversionAlgorithm
      schema:name:
        const: Double-Spike Inversion Algorithm
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_calibrationStandardMeasurementFrequency:
    title: Calibration Standard Measurement Frequency
    description: How often the primary calibration standard is measured relative to unknown samples within
      a session, i.e. the bracketing interval used to monitor and correct for instrumental drift. Implied
      but not stated explicitly in Table 3 (Horstwood et al. 2016) via the validation-material n counts.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/calibrationStandardMeasurementFrequency
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/calibrationStandardMeasurementFrequency
      schema:name:
        const: Calibration Standard Measurement Frequency
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value

  labxct_coupledProcedureDoi:
    title: Coupled Procedure DOI
    description: Registered procedure DOI for the coupled technique named above. Provides a stable, citable
      link to the companion method independent of whether a dataset has been deposited. If the coupled procedure
      has not yet been registered, enter the DOI of a publication describing the coupled method, or "pending".
      Enter "None" if no coupling is planned.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/coupledProcedureDoi
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/coupledProcedureDoi
      schema:name:
        const: Coupled Procedure DOI
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_coupledDatasetOrPublicationReference:
    title: Coupled Dataset or Publication Reference
    description: 'DOI or other persistent identifier for the co-registered dataset or publication where
      both datasets are reported together. Accepts: a dedicated dataset DOI (if separately deposited), a
      shared dataset DOI (if co-submitted in the same package), or a publication DOI. Use "same submission"
      if the coupled dataset is included in this data package, or "pending" if not yet assigned. If coupling
      is documented through a shared sample identifier only, that information is already captured in Sample
      Persistent Identifier (Group 2).'
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/coupledDatasetOrPublicationReference
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/coupledDatasetOrPublicationReference
      schema:name:
        const: Coupled Dataset or Publication Reference
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_sampleMass:
    title: Sample Mass
    description: 'Mass of the sample in grams, recorded for curatorial tracking of precious or limited materials.
      Particularly important for meteorite, mission-returned, and other restricted samples. This is an analysis-level
      field: the actual sample mass depends on the specific sample being scanned, not on the procedure design.'
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/sampleMass
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/sampleMass
      schema:name:
        const: Sample Mass
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  labxct_sampleMountingMethod:
    title: Sample Mounting Method
    description: Method used to mount or hold the sample on the instrument rotation stage. Mounting material
      should transmit X-rays at the selected voltage without dominating beam attenuation. Report the holder
      type, adhesive or support material, and any alignment aids used.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/sampleMountingMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/sampleMountingMethod
      schema:name:
        const: Sample Mounting Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_samplePersistentIdentifier:
    title: Sample Persistent Identifier
    description: Globally unique, persistent identifier for each sample listed in Sample Name. IGSN (International
      Geo Sample Number) is the recommended standard for geological and cosmochemical samples, as used by
      Astromat, EarthChem and SESAR. Where a sample and its sub-samples are separately registered, record
      the identifier at the level actually analysed.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/samplePersistentIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/samplePersistentIdentifier
      schema:name:
        const: Sample Persistent Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_samplePreparationNotes:
    title: Sample Preparation Notes
    description: Any preparation steps applied to the sample before scanning, including cleaning, trimming,
      consolidation, or drying. XCT is typically non-destructive with no surface preparation required; note
      any exceptions.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/samplePreparationNotes
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/samplePreparationNotes
      schema:name:
        const: Sample Preparation Notes
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_targetSelectionCriteria:
    title: Target Selection Criteria
    description: 'The rules governing which part of the sample is analysed, and why. Covers the criteria
      applied when choosing grains, aliquots, spots, or a region of interest — size, morphology, clarity,
      freedom from inclusions or alteration, phase identity, or spatial position. Distinct from Target Material,
      which states the material type the procedure is designed for: this field states how, within such a
      sample, the analysed portion is picked out.'
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/targetSelectionCriteria
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/targetSelectionCriteria
      schema:name:
        const: Target Selection Criteria
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_preAnalysisImagingAndScreening:
    title: Pre-Analysis Imaging and Screening
    description: Imaging or other characterisation performed before the measurement in order to select or
      locate the analysed target, including the technique, instrument and settings used, and how individual
      analyses are linked back to the images. Distinct from any imaging the procedure performs as its own
      measurement. Where the imaging is performed on a separate instrument, it should also be recorded in
      the Group 1 coupling fields.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/preAnalysisImagingAndScreening
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/preAnalysisImagingAndScreening
      schema:name:
        const: Pre-Analysis Imaging and Screening
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_reconstructionSoftware:
    title: Reconstruction Software
    description: Software used to reconstruct 2D projection images into a 3D CT volume, including version
      number. Often bundled with the instrument and proprietary to the manufacturer.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/reconstructionSoftware
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/reconstructionSoftware
      schema:name:
        const: Reconstruction Software
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_segmentationAndAnalysisSoftware:
    title: Segmentation and Analysis Software
    description: Software used for image segmentation, phase identification, and quantitative 3D analysis
      after reconstruction. Report all packages used, with version numbers.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/segmentationAndAnalysisSoftware
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/segmentationAndAnalysisSoftware
      schema:name:
        const: Segmentation and Analysis Software
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_acceleratingVoltage:
    title: Accelerating Voltage
    description: 'X-ray tube accelerating voltage in kilovolts (kV) registered by the procedure. Determines
      the maximum X-ray photon energy and controls penetration depth and phase contrast. Higher voltages
      provide greater penetration for dense or large samples; lower voltages improve contrast between low-density
      phases. If the voltage was varied across samples within the same procedure or session, report the
      full range applied (e.g., 90–115 kV). Note: some sources report this parameter as ''X keV'' (maximum
      Bremsstrahlung photon energy) rather than ''X kV'' (tube voltage). For polychromatic lab XCT, these
      are numerically equivalent: E_max [keV] = V [kV]. Record the value as originally reported, and add
      a parenthetical note if the unit used is keV.'
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/acceleratingVoltage
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/acceleratingVoltage
      schema:name:
        const: Accelerating Voltage
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  labxct_tubeCurrent:
    title: Tube Current
    description: X-ray tube current in microamperes (µA) registered by the procedure. Controls photon flux
      and therefore projection image SNR. Higher current improves SNR but increases thermal loading on the
      source and may increase focal spot size. If the current was varied across samples within the same
      procedure or session, report the full range applied (e.g., 65–115 µA).
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/tubeCurrent
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/tubeCurrent
      schema:name:
        const: Tube Current
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  labxct_xRayPower:
    title: X-ray Power
    description: 'X-ray tube power in watts (W) registered by the procedure. Derivable as voltage (kV) ×
      current (mA) = kV × µA / 1000. Power constrains the achievable focal spot size for microfocal tubes:
      higher power requires a larger focal spot, trading spatial resolution for SNR. Retained as a standalone
      field because it is routinely reported in the literature and directly constrains instrument operating
      limits. If power was varied across samples within the session, report the full range applied (e.g.,
      7–13 W).'
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/xRayPower
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/xRayPower
      schema:name:
        const: X-ray Power
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  labxct_xRayPreFilter:
    title: X-ray Pre-filter
    description: Material and thickness of the beam-hardening filter placed between the X-ray source and
      the sample. Hardens the beam by attenuating low-energy photons, reducing beam hardening artifacts
      and improving CT number stability across the sample. Both filter material and thickness must be reported.
      Instrument-proprietary filter codes should be decoded where possible.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/xRayPreFilter
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/xRayPreFilter
      schema:name:
        const: X-ray Pre-filter
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_sourceToObjectDistance:
    title: Source-to-Object Distance (SOD)
    description: Distance from the X-ray source focal spot to the centre of the sample rotation axis, in
      mm, as registered by the procedure. Together with SDD, determines geometric magnification (M = SDD/SOD).
      Shorter SOD increases magnification and reduces voxel size.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/sourceToObjectDistance
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/sourceToObjectDistance
      schema:name:
        const: Source-to-Object Distance (SOD)
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  labxct_sourceToDetectorDistance:
    title: Source-to-Detector Distance (SDD)
    description: Distance from the X-ray source focal spot to the detector surface, in mm, as registered
      by the procedure. Together with SOD, determines geometric magnification M = SDD/SOD. Voxel size ≈
      detector pixel size / M (before binning; divide additionally by optical objective for Versa-class
      systems).
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/sourceToDetectorDistance
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/sourceToDetectorDistance
      schema:name:
        const: Source-to-Detector Distance (SDD)
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  labxct_voxelSize:
    title: Voxel Size
    description: Isotropic voxel edge length of the reconstructed 3D volume in micrometres. The procedure
      registers the target voxel size, set based on the smallest feature to be resolved (target voxel size
      ≤ ~1/3 of that feature size; see the criterion recorded under Partial Volume Effect Criteria). At
      analysis level, record the achieved voxel size as reported by the reconstruction software, which may
      differ slightly from the target due to final geometric calibration.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/voxelSize
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/voxelSize
      schema:name:
        const: Voxel Size
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  labxct_rotationRange:
    title: Rotation Range
    description: Total angular range over which projection images are acquired, in degrees. Full 360° rotation
      is standard for cone-beam lab XCT. 180° rotation (half-scan) is sometimes used for faster acquisition
      but may introduce additional artifacts.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/rotationRange
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/rotationRange
      schema:name:
        const: Rotation Range
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  labxct_numberOfProjections:
    title: Number of Projections
    description: Total number of equally-spaced projection images acquired over the full rotation range.
      More projections improve reconstruction quality by reducing under-sampling streak artifacts but increase
      scan time. For Mode B (multi-volume stitching), this is the number per sub-volume.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/numberOfProjections
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/numberOfProjections
      schema:name:
        const: Number of Projections
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_rotationStepSize:
    title: Rotation Step Size
    description: Angular increment between successive projection images, in degrees. Equal to Rotation Range
      divided by Number of Projections when both are reported; however, some sources report step size as
      the primary rotation parameter without stating the total number of projections explicitly. Finer step
      sizes improve angular sampling and reduce streak artifacts at the cost of longer scan time.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/rotationStepSize
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/rotationStepSize
      schema:name:
        const: Rotation Step Size
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  labxct_exposureTimePerProjection:
    title: Exposure Time per Projection
    description: 'Duration of X-ray exposure for each individual projection image frame, in seconds, as
      registered by the procedure. Set as a deliberate choice for the target sample type and voxel size:
      longer exposures increase SNR at the cost of total scan time. May be adjusted within procedure-allowed
      bounds for samples that are unusually dense or unusually transparent. If the exposure time was varied
      across samples within the same procedure or session, report the full range applied (e.g., 0.5–2 s).'
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/exposureTimePerProjection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/exposureTimePerProjection
      schema:name:
        const: Exposure Time per Projection
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  labxct_framesAveragedPerProjection:
    title: Frames Averaged per Projection
    description: Number of individual detector frames acquired and averaged to produce each saved projection
      image, as registered by the procedure. Frame averaging reduces random electronic noise. The effective
      exposure per projection = exposure time per frame × frames averaged.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/framesAveragedPerProjection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/framesAveragedPerProjection
      schema:name:
        const: Frames Averaged per Projection
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_detectorBinning:
    title: Detector Binning
    description: Detector pixel binning factor applied during acquisition. Binning combines adjacent pixels
      (e.g., 2×2 combines 4 pixels into one), reducing effective resolution while increasing per-pixel SNR
      and reducing file size. 1×1 indicates no binning.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/detectorBinning
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/detectorBinning
      schema:name:
        const: Detector Binning
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_flatFieldCorrection:
    title: Flat Field Correction
    description: Whether dark-field (detector read with X-ray source off; electronic noise baseline) and
      bright-field (source on, no sample; gain calibration) reference images are acquired and applied to
      normalize detector response before reconstruction. Standard practice in all quantitative lab XCT;.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/flatFieldCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/flatFieldCorrection
      schema:name:
        const: Flat Field Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_rotationMode:
    title: Rotation Mode
    description: Whether projection images are acquired during continuous sample rotation (faster; may introduce
      slight motion blur at high rotation speeds) or at discrete step positions with the stage stationary
      during each exposure (stop-and-shoot; eliminates motion blur). Continuous rotation has been associated
      with sub-volume rotational mismatch artifacts in multi-volume stitching workflows (Eckley et al. 2025).
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/rotationMode
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/rotationMode
      schema:name:
        const: Rotation Mode
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_totalScanDuration:
    title: Total Scan Duration
    description: Total elapsed time for the complete XCT acquisition, from the start of the first projection
      to the end of the last. For multi-volume acquisitions, this is the combined scan time across all sub-volumes
      (not including setup or reconstruction time). Useful for assessing beam stability and sample integrity
      concerns over long scans.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/totalScanDuration
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/totalScanDuration
      schema:name:
        const: Total Scan Duration
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_reconstructionConvolutionFilter:
    title: Reconstruction Convolution Filter
    description: Convolution (apodization) filter kernel applied during back-projection reconstruction.
      Sharper filters (Ram-Lak) enhance edge definition but amplify high-frequency noise; smoother filters
      (Hann, Hamming) reduce noise at the cost of edge sharpness. The choice represents a deliberate procedure-level
      tradeoff.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/reconstructionConvolutionFilter
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/reconstructionConvolutionFilter
      schema:name:
        const: Reconstruction Convolution Filter
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_beamHardeningCorrectionParameter:
    title: Beam Hardening Correction Parameter
    description: Numerical value or setting applied in the software beam hardening correction algorithm
      for this specific analysis. May be tuned empirically per material type or per scan session. Analysis-level
      companion to Beam Hardening Correction Method.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/beamHardeningCorrectionParameter
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/beamHardeningCorrectionParameter
      schema:name:
        const: Beam Hardening Correction Parameter
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_ringArtifactCorrectionMethod:
    title: Ring Artifact Correction Method
    description: Procedure specification for how ring artifacts are handled. Ring artifacts appear as concentric
      circular bands centred on the rotation axis and arise from defective or miscalibrated detector pixels.
      Method is the procedure-level specification; whether correction was applied and its outcome are recorded
      at analysis level in Group 6.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/ringArtifactCorrectionMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/ringArtifactCorrectionMethod
      schema:name:
        const: Ring Artifact Correction Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_outputDataFormat:
    title: Output Data Format
    description: File format of the reconstructed CT volume as output by the reconstruction software. Bit
      depth is recorded separately in Output Bit Depth.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/outputDataFormat
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/outputDataFormat
      schema:name:
        const: Output Data Format
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_ctNumberCalibration:
    title: CT Number Calibration
    description: Whether the raw CT grayscale values have been calibrated to physically meaningful units
      using reference materials. Calibrated CT numbers enable cross-instrument and cross-session comparison
      and support phase identification by comparison to calculated linear attenuation coefficient (LAC)
      values (e.g., using MuCalc; Hanna & Ketcham 2017). Uncalibrated grayscale values are instrument- and
      session-specific.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/ctNumberCalibration
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/ctNumberCalibration
      schema:name:
        const: CT Number Calibration
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_segmentationMethod:
    title: Segmentation Method
    description: General approach used to separate distinct phases or features in the reconstructed CT volume.
      The method must be reported for any quantitative result to be reproducible.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/segmentationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/segmentationMethod
      schema:name:
        const: Segmentation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_segmentationThresholdValuesOrCriteria:
    title: Segmentation Threshold Values or Criteria
    description: Specific CT number range(s) or quantitative criteria used to define each segmented phase
      or feature. Documenting these values enables reproducibility assessment and cross-study comparison.
      For LAC-calibrated datasets, report values in cm⁻¹.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/segmentationThresholdValuesOrCriteria
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/segmentationThresholdValuesOrCriteria
      schema:name:
        const: Segmentation Threshold Values or Criteria
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_phaseIdentificationMethod:
    title: Phase Identification Method
    description: Method used to assign reconstructed CT number ranges to specific mineral phases or material
      types. Approaches include comparison to calculated linear attenuation coefficients (LAC), cross-validation
      with independent analytical techniques, or empirical calibration.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/phaseIdentificationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/phaseIdentificationMethod
      schema:name:
        const: Phase Identification Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_voiSelectionCriteria:
    title: VOI Selection Criteria
    description: Procedure-level rules specifying how the Volume of Interest (VOI) is to be defined for
      quantitative analysis. Common criteria exclude cone-beam artifact zones at sample edges, beam hardening
      halos near dense inclusions, and sample holder signal. The actual VOI applied in a specific analysis
      is recorded separately at analysis level.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/voiSelectionCriteria
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/voiSelectionCriteria
      schema:name:
        const: VOI Selection Criteria
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_subVolumeStitchingAndRegistrationMethod:
    title: Sub-volume Stitching and Registration Method
    description: 'Method used to register adjacent sub-volume datasets to each other and stitch them into
      a single continuous 3D volume. Report the alignment strategy (manual, automated, fiducial-based),
      the software used, and any correction steps applied. Note: rotational mismatch artifacts have been
      identified in continuous-rotation acquisitions (~0.35° misalignment in Eckley et al. 2025); their
      correction via raw projection re-alignment should be documented here.'
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/subVolumeStitchingAndRegistrationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/subVolumeStitchingAndRegistrationMethod
      schema:name:
        const: Sub-volume Stitching and Registration Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_outputBitDepth:
    title: Output Bit Depth
    description: Bit depth of the reconstructed 3D volume (number of bits used to encode each voxel's grayscale
      value). Common values are 8-bit (256 gray levels), 16-bit (65,536 gray levels), or 32-bit floating
      point. Bit depth affects the dynamic range available for phase segmentation and quantitative attenuation
      analysis. The procedure may specify a required output bit depth if downstream analysis workflows depend
      on a consistent grayscale range; the analyst confirms or adjusts at analysis time.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/outputBitDepth
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/outputBitDepth
      schema:name:
        const: Output Bit Depth
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_calibrationFactorAndDeterminationMethod:
    title: Calibration Factor and Determination Method
    description: 'An externally-calibrated factor that converts the measured quantity into the reported
      quantity, how it was determined, and its uncertainty. Applies where the conversion depends on a factor
      calibrated against a reference of independently known value, rather than on the instrument response
      alone. Distinct from the fields that name the calibration material and that state which approach applies
      to which analyte, where the technique has them: this field records the resulting factor itself.'
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/calibrationFactorAndDeterminationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/calibrationFactorAndDeterminationMethod
      schema:name:
        const: Calibration Factor and Determination Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_constantsAndReferenceValuesUsed:
    title: Constants and Reference Values Used
    description: Physical constants and reference values used in data reduction to calculate the final reported
      quantity (e.g., decay constants for age calculation, standard isotope ratios, or other citable reference
      values used in a correction or calculation), together with their source. Distinct from the Group 6
      reference-material fields, which document accepted values for specific calibration/validation materials
      rather than universal physical constants. Record "None" if no citable, revisable physical constants
      feed into this procedure's data reduction.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/constantsAndReferenceValuesUsed
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/constantsAndReferenceValuesUsed
      schema:name:
        const: Constants and Reference Values Used
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_effectiveSpatialResolution:
    title: Effective Spatial Resolution (PSF/MTF)
    description: Effective spatial resolution of the reconstructed CT volume, which typically differs from
      (and is coarser than) the voxel size due to the detector point spread function (PSF), geometric unsharpness,
      and the reconstruction filter. The Nyquist limit sets a theoretical floor at 2× the voxel size. Formal
      measurement uses the PSF method described in Ketcham & Hildebrandt (2014) or the modulation transfer
      function (MTF); resolution can also be reported per ASTM E1441-11. When formal measurement is unavailable,
      an estimate based on acquisition geometry (e.g., the Brenner-Weiss formula) or a stated multiple of
      the voxel size may be recorded. Report the value in µm along with the method used to determine or
      estimate it. Note that most XCT papers use the bare phrase "spatial resolution" for the voxel size;
      record that under Voxel Size, and leave this field as not reported unless an effective resolution
      was actually determined.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/effectiveSpatialResolution
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/effectiveSpatialResolution
      schema:name:
        const: Effective Spatial Resolution (PSF/MTF)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_beamHardeningArtifactAssessment:
    title: Beam Hardening Artifact Assessment
    description: Assessment of whether residual beam hardening (cupping artifact) is present in the reconstructed
      volume after any corrections applied during reconstruction. Beam hardening in polychromatic lab XCT
      produces a characteristic darker interior and brighter edges in the reconstructed CT number profile,
      even in compositionally uniform material. Record whether this artifact is detectable in the final
      dataset, what correction or mitigation was applied (e.g., linearisation, pre-filtering, iterative
      correction), and whether any residual effect influences the analysis region.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/beamHardeningArtifactAssessment
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/beamHardeningArtifactAssessment
      schema:name:
        const: Beam Hardening Artifact Assessment
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_ringArtifactSeverityAndCorrectionOutcome:
    title: Ring Artifact Severity and Correction Outcome
    description: Assessment of whether ring artifacts — concentric rings centred on the rotation axis arising
      from differential sensitivity or gain drift among detector elements — were present and whether correction
      was effective. Note that ring correction algorithms modify image intensity in narrow annular bands;
      in samples containing linear geological features oriented tangentially to the rotation axis, ring
      correction can alter or introduce spurious linear features in those orientations. Record whether rings
      were present, whether correction was applied, and whether any residual rings or correction artifacts
      fall within the analysis volume of interest.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/ringArtifactSeverityAndCorrectionOutcome
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/ringArtifactSeverityAndCorrectionOutcome
      schema:name:
        const: Ring Artifact Severity and Correction Outcome
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_metalStreakArtifactAssessment:
    title: Metal Streak Artifact Assessment
    description: Assessment of whether high-density inclusions (FeNi metal, platinum-group minerals, dense
      oxides, or other high-Z phases) produce streak or starburst artifacts in the reconstructed volume.
      Common forms include radial starburst streaks from high-Z inclusions and shadowing (anomalously low
      CT number) in beam-shadow regions behind dense phases. Record which artifact type(s) are present,
      their spatial extent, and any exclusion zones or correction steps applied.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/metalStreakArtifactAssessment
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/metalStreakArtifactAssessment
      schema:name:
        const: Metal Streak Artifact Assessment
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_partialVolumeEffectCriteria:
    title: Partial Volume Effect Criteria
    description: Procedure-level specification of how partial volume effects (PVE) are managed in quantitative
      analysis. PVE produces intermediate CT numbers at phase boundaries and at the surfaces of small features,
      because each voxel integrates the attenuation of all material within its volume. PVE correction can
      be implemented via PSF-based deconvolution tools such as Blob3D. Record the minimum feature size criterion
      adopted for the procedure (in voxels or µm), the basis for it, the treatment of boundary voxels in
      modal abundance or size distribution calculations, and whether PVE correction is required or optional.
      Per Withers et al. (2021) a feature must span at least 3 voxels to be positively identified and at
      least 10 for reliable shape and volume characterisation; state whether the criterion follows that
      convention or is SNR-limited, PVE-limited or analyst-defined. The criterion materially changes reported
      modal abundances and size distributions, so two datasets are not comparable without it.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/partialVolumeEffectCriteria
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/partialVolumeEffectCriteria
      schema:name:
        const: Partial Volume Effect Criteria
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_partialVolumeEffectAssessment:
    title: Partial Volume Effect Assessment
    description: Analysis-level record of PVE severity and how it was handled in this specific analysis.
      Documents the minimum feature size relative to the voxel size, the fraction of the feature population
      affected, and any PVE correction method applied (e.g., PSF-based deconvolution via Blob3D).
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/partialVolumeEffectAssessment
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/partialVolumeEffectAssessment
      schema:name:
        const: Partial Volume Effect Assessment
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_signalToNoiseRatio:
    title: Signal-to-Noise Ratio
    description: Quantitative measure of image quality in the reconstructed CT volume. Typically calculated
      as the mean CT number divided by the standard deviation of CT number in a homogeneous reference region
      (e.g., an inclusion-free zone of the matrix). SNR is controlled by photon flux (source power, exposure
      time, number of projections) and sample attenuation. Record the measured value and the region used
      for measurement, or note if SNR was not formally measured.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/signalToNoiseRatio
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/signalToNoiseRatio
      schema:name:
        const: Signal-to-Noise Ratio
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_crossValidationProcedureRequirement:
    title: Cross-Validation Procedure Requirement
    description: Procedure-level specification of what independent analytical validation is required to
      confirm CT segmentation results, phase identification, or quantitative measurements. Cross-validation
      is relevant where CT grey-values alone cannot uniquely distinguish phases with similar attenuation
      coefficients. Common approaches include BSE imaging, SEM-EDS or EPMA modal analysis, He pycnometry
      for bulk porosity, and Raman or SIMS phase mapping. Record the required validation method(s) and the
      sampling fraction (e.g., every sample, one per session, or a representative subset).
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/crossValidationProcedureRequirement
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/crossValidationProcedureRequirement
      schema:name:
        const: Cross-Validation Procedure Requirement
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_crossValidationOutcome:
    title: Cross-Validation Outcome
    description: Analysis-level record of what independent validation was performed and its result. Report
      the validation method(s) used, the quantitative agreement achieved (e.g., relative difference in modal
      abundance, porosity), and any discrepancies and their likely causes. Where BSE imaging is the validation
      method, note that BSE provides a 2D section while CT provides a 3D volume.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/crossValidationOutcome
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/crossValidationOutcome
      schema:name:
        const: Cross-Validation Outcome
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_fundingSourceForProcedureDevelopment:
    title: Funding Source for Procedure Development
    description: Grants and other funding sources that supported instrument acquisition, major upgrades,
      procedure development, and associated personnel time. Include grant numbers and funding agencies where
      applicable.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/fundingSourceForProcedureDevelopment
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/fundingSourceForProcedureDevelopment
      schema:name:
        const: Funding Source for Procedure Development
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_procedureReference:
    title: Procedure Reference(s)
    description: DOI or URL for peer-reviewed publications or technical reports describing, validating,
      or benchmarking this procedure.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/procedureReference
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/procedureReference
      schema:name:
        const: Procedure Reference(s)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_xRayTubeAnodeMaterial:
    title: X-ray Tube Anode Material
    description: Material of the X-ray tube anode (target). Determines the characteristic line energies
      superimposed on the bremsstrahlung continuum, which can affect phase contrast at specific energies.
      Multi-metal anodes (e.g., W/Mo/Cu) extend the usable energy range.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/xRayTubeAnodeMaterial
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/xRayTubeAnodeMaterial
      schema:name:
        const: X-ray Tube Anode Material
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_detectorArraySize:
    title: Detector Array Size
    description: Number of pixels in the detector array (width × height). Combined with detector pixel size
      and geometric magnification, determines the field of view.
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/detectorArraySize
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/detectorArraySize
      schema:name:
        const: Detector Array Size
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  labxct_detectorPixelSize:
    title: Detector Pixel Size
    description: Physical size of a single pixel on the detector in micrometres. This is a fixed hardware
      property of the detector array, distinct from the reconstructed voxel size (which depends on geometric
      magnification and binning).
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/detectorPixelSize
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/detectorPixelSize
      schema:name:
        const: Detector Pixel Size
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  labxct_opticalObjective:
    title: Optical Objective
    description: Optical magnification objective installed between the scintillator and CCD/CMOS detector.
      Applies only to instruments using optical magnification (e.g., Zeiss Xradia Versa series). For systems
      using only geometric magnification, report "Not applicable".
    type: object
    properties:
      '@id':
        const: ada:parameter/labxctTAPP/opticalObjective
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/labxctTAPP/opticalObjective
      schema:name:
        const: Optical Objective
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value

  laicpms_coupledProtocolDoi:
    title: Coupled Protocol DOI
    description: Registered protocol DOI for the coupled technique named above. Provides a stable, citable
      link to the companion method independent of whether a dataset has been deposited. If the coupled protocol
      has not yet been registered, enter the DOI of a publication describing the coupled method, or "pending".
      Enter "None" if no coupling is planned.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/coupledProtocolDoi
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/coupledProtocolDoi
      schema:name:
        const: Coupled Protocol DOI
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_coupledDatasetOrPublicationReference:
    title: Coupled Dataset or Publication Reference
    description: 'DOI or other persistent identifier for the co-registered dataset or publication where
      both datasets are reported together. Accepts: a dedicated dataset DOI (if separately deposited), a
      shared dataset DOI (if co-submitted in the same package), or a publication DOI. Use "same submission"
      if the coupled dataset is included in this data package, or "pending" if not yet assigned. If coupling
      is documented through a shared sample identifier only, that information is already captured in Sample
      Persistent Identifier (Group 2).'
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/coupledDatasetOrPublicationReference
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/coupledDatasetOrPublicationReference
      schema:name:
        const: Coupled Dataset or Publication Reference
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_samplePersistentIdentifier:
    title: Sample Persistent Identifier
    description: Globally unique, persistent identifier for the analysed sample. IGSN (International Geo
      Sample Number) is the recommended standard for geological and cosmochemical samples, as used by Astromat,
      EarthChem, and SESAR.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/samplePersistentIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/samplePersistentIdentifier
      schema:name:
        const: Sample Persistent Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_fusionFluxAndDilutionRatio:
    title: Fusion Flux and Dilution Ratio
    description: For protocols using fused glass, the flux type and sample:flux dilution ratio used to prepare
      the analytical glass.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/fusionFluxAndDilutionRatio
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/fusionFluxAndDilutionRatio
      schema:name:
        const: Fusion Flux and Dilution Ratio
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_preAblationSurfaceTreatment:
    title: Pre-Ablation Surface Treatment
    description: Protocol applied immediately before each analysis to remove surface contamination or condition
      the sample surface. Distinct from general sample preparation. For spot analysis, pre-ablation pulses
      are discarded before signal acquisition begins. For mapping, this step is typically omitted as the
      large area ablated averages out surface effects.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/preAblationSurfaceTreatment
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/preAblationSurfaceTreatment
      schema:name:
        const: Pre-Ablation Surface Treatment
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_instrumentIdentifier:
    title: Instrument Serial Number or Lab Identifier
    description: Serial number or laboratory-internal identifier for the specific instrument unit. Supports
      traceability to instrument service records.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/instrumentIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/instrumentIdentifier
      schema:name:
        const: Instrument Serial Number or Lab Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_torchDepth:
    title: Torch Depth
    description: Distance between the load coil and the sampling cone tip (mm), also called injector depth
      or torch position depending on the instrument manufacturer. Affects ion transmission efficiency, oxide
      formation, and doubly-charged species production. The protocol specifies a target value optimised
      during initial setup; the analyst confirms or fine-adjusts during session tuning.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/torchDepth
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/torchDepth
      schema:name:
        const: Torch Depth
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_massResolutionSetting:
    title: Mass Resolution Setting
    description: Operating mass resolution of the mass analyser. For quadrupole instruments this is fixed
      at unit resolution by instrument design. For sector-field instruments the analyst selects low, medium,
      or high resolution to balance sensitivity against spectral interference suppression.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/massResolutionSetting
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/massResolutionSetting
      schema:name:
        const: Mass Resolution Setting
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_spotGeometry:
    title: Laser Spot Geometry
    description: Shape and dimensions of the laser ablation spot in micrometres registered by the protocol.
      For circular spots, report diameter; for square or rectangular spots, report width × length. The protocol
      registers the typical geometry; analysts may adjust within protocol-allowed range.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/spotGeometry
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/spotGeometry
      schema:name:
        const: Laser Spot Geometry
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_laserEnergy:
    title: Laser Energy
    description: Laser pulse energy in millijoules as set at the laser output or measured at the sample
      surface. Less commonly reported than fluence because it does not account for spot area. Report only
      when the system displays energy directly. Laser fluence (J cm⁻²) is the preferred quantity and is
      captured in Default Laser Fluence.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/laserEnergy
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/laserEnergy
      schema:name:
        const: Laser Energy
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laicpms_laserFluence:
    title: Laser Fluence (Energy Density)
    description: Laser pulse energy per unit area at the sample surface in J cm⁻², as registered by the
      protocol. Fluence is the physically meaningful quantity controlling ablation rate, crater morphology,
      elemental fractionation, and particle size distribution. If the system reports only as % of maximum
      output, include that value and note the system maximum where known.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/laserFluence
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/laserFluence
      schema:name:
        const: Laser Fluence (Energy Density)
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laicpms_laserRepetitionRate:
    title: Laser Repetition Rate
    description: Laser pulse repetition rate in hertz registered by the protocol. For mapping methods, repetition
      rate together with scan speed and spot size determines pixel size and spatial resolution. Analysts
      may adjust within protocol-allowed bounds.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/laserRepetitionRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/laserRepetitionRate
      schema:name:
        const: Laser Repetition Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laicpms_ablationSpotDuration:
    title: Ablation Duration per Spot
    description: 'Total on-sample ablation (signal acquisition) time per individual spot in seconds, as
      set in the acquisition method. This is a protocol-level parameter for spot analysis: it reflects the
      deliberate trade-off between signal accumulation (longer = lower LOD), sample consumption, and session
      throughput. For transect analysis, the equivalent protocol-level parameter is scan speed (captured
      in Transect Rate, Mapping Rate or Step Size). For mapping analysis, total acquisition time is sample-area-dependent
      and therefore analysis-level, not captured here.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/ablationSpotDuration
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/ablationSpotDuration
      schema:name:
        const: Ablation Duration per Spot
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laicpms_transectOrMappingRateOrStepSize:
    title: Transect Rate, Mapping Rate or Step Size
    description: 'For continuous line scan (transect) and raster mapping: the stage translation speed in
      µm s⁻¹. This is the protocol-level parameter that, together with spot size and repetition rate, determines
      spatial resolution along the scan direction. For mapping, the mapping rate (mm² h⁻¹) may be reported
      as an alternative when scan speed is session-variable. For stepped line profiles: the distance between
      successive spot positions in µm.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/transectOrMappingRateOrStepSize
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/transectOrMappingRateOrStepSize
      schema:name:
        const: Transect Rate, Mapping Rate or Step Size
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_rasterLineSpacing:
    title: Raster Line Spacing (Mapping Only)
    description: Distance between adjacent raster lines in a 2D elemental map, measured perpendicular to
      the scan direction, in micrometres. Together with spot size, this determines whether adjacent lines
      are contiguous (line spacing = spot size), overlapping (line spacing < spot size), or have gaps (line
      spacing > spot size). Applies to raster mapping only.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/rasterLineSpacing
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/rasterLineSpacing
      schema:name:
        const: Raster Line Spacing (Mapping Only)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_carrierGasFlowRate:
    title: Carrier Gas and Flow Rate
    description: Gas used to transport ablated aerosol from the ablation cell to the ICP-MS torch, with
      the protocol-registered target flow rate(s). Helium is standard for most UV laser systems due to superior
      aerosol transport. Flow rates are protocol targets; actual session values may be adjusted within ±10%
      during tuning.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/carrierGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/carrierGasFlowRate
      schema:name:
        const: Carrier Gas and Flow Rate
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_plasmaMakeUpGasAddition:
    title: Plasma / Make-up Gas Addition
    description: Additional gas(es) mixed into the carrier stream downstream of the ablation cell, with
      the protocol-registered target flow rate. Ar make-up gas is standard. Small N₂ additions can enhance
      sensitivity for some elements. If N₂ is not added, state "None" explicitly to distinguish from not
      reported.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/plasmaMakeUpGasAddition
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/plasmaMakeUpGasAddition
      schema:name:
        const: Plasma / Make-up Gas Addition
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_coolantGasFlowRate:
    title: Coolant (Plasma) Gas Flow Rate
    description: Flow rate of the outer (coolant/plasma) argon gas stream that sustains the ICP plasma,
      in L/min. Determines plasma volume and stability. Set during initial plasma optimisation and confirmed
      at each session start.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/coolantGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/coolantGasFlowRate
      schema:name:
        const: Coolant (Plasma) Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laicpms_auxiliaryGasFlowRate:
    title: Auxiliary Gas Flow Rate
    description: Flow rate of the intermediate (auxiliary) argon gas stream that positions the plasma relative
      to the load coil, in L/min. Affects ion extraction efficiency and oxide production rates. Distinct
      from the carrier gas (which transports ablation aerosol) and the coolant (plasma) gas.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/auxiliaryGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/auxiliaryGasFlowRate
      schema:name:
        const: Auxiliary Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laicpms_rfPower:
    title: RF Power
    description: ICP radiofrequency forward power in watts. Fixed in the protocol; cannot be changed by
      analysts without defining a new protocol, because RF power affects plasma temperature, ionisation
      efficiency, oxide formation, and whether cool or normal plasma conditions are in effect.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/rfPower
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/rfPower
      schema:name:
        const: RF Power
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laicpms_signalSmoothing:
    title: Signal Smoothing
    description: 'Description of any signal smoothing device or approach installed between the ablation
      cell and the ICP-MS to reduce pulse-to-pulse signal variability. Note: active signal smoothing devices
      (e.g., squid, SCFAST) are generally incompatible with high-resolution raster mapping because they
      degrade spatial resolution by mixing aerosol from successive laser shots. For mapping analyses, report
      "None" explicitly.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/signalSmoothing
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/signalSmoothing
      schema:name:
        const: Signal Smoothing
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_icPlasmaTuning:
    title: ICP Tuning
    description: Description of the approach used to optimise ICP plasma conditions prior to analysis, including
      the reference material used for tuning and the acceptance criteria (e.g., oxide production threshold,
      sensitivity targets, mass calibration).
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/icPlasmaTuning
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/icPlasmaTuning
      schema:name:
        const: ICP Tuning
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_doublyChargedSpeciesMonitor:
    title: Doubly-Charged Species Monitor
    description: The mass ratio monitored to estimate doubly-charged ion (M²⁺) formation during instrument
      tuning. Doubly-charged ions appear at half the mass of the parent ion and can cause isobaric interferences
      on analytes in that mass region. The monitor species and the mass positions monitored should be stated
      explicitly. Analogous to Oxide Production Method and Threshold for oxide monitoring.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/doublyChargedSpeciesMonitor
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/doublyChargedSpeciesMonitor
      schema:name:
        const: Doubly-Charged Species Monitor
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_doublyChargedSpeciesProduction:
    title: Doubly-Charged Species Production
    description: Measured percentage of doubly-charged ion production for the monitored species at the time
      of instrument tuning. The protocol should specify the acceptable threshold (e.g., <1%, <3%); the measured
      value for each session is recorded here. Report both the threshold and the measured value where possible.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/doublyChargedSpeciesProduction
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/doublyChargedSpeciesProduction
      schema:name:
        const: Doubly-Charged Species Production
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_analysisSequence:
    title: Analysis Sequence
    description: Repeating order of primary calibration standard(s), quality control standard(s), and unknown
      analyses within a measurement session. Editable to allow minor adjustments while maintaining the bracketing
      strategy defined in the protocol.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/analysisSequence
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/analysisSequence
      schema:name:
        const: Analysis Sequence
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_collisionGasFlowRate:
    title: Collision Gas Flow Rate
    description: Flow rate of the collision gas (typically He) introduced into the collision/reaction cell,
      in mL/min. Controls the degree of ion thermalization and KED efficiency. Record 'None' if the CRC
      is in STD mode.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/collisionGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/collisionGasFlowRate
      schema:name:
        const: Collision Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laicpms_cellExitDiscriminationVoltage:
    title: Cell Exit Discrimination Voltage
    description: Bias voltage applied at the collision/reaction cell exit to discriminate between analyte
      ions and low-energy polyatomic interferences in KED mode, in volts (V). A negative bias preferentially
      retards slow polyatomic ions while transmitting faster analyte ions. Record 'None' if the CRC is in
      STD mode.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/cellExitDiscriminationVoltage
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/cellExitDiscriminationVoltage
      schema:name:
        const: Cell Exit Discrimination Voltage
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laicpms_reactionGasFlowRate:
    title: Reaction Gas Flow Rate
    description: Flow rate of the reactive gas introduced into the dynamic reaction cell (DRC), in mL/min.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/reactionGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/reactionGasFlowRate
      schema:name:
        const: Reaction Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laicpms_dwellTime:
    title: Dwell Time per Mass
    description: 'Count time (dwell time) per mass position for each measured isotope in milliseconds. Longer
      dwell times improve counting statistics and lower detection limits but reduce the number of isotopes
      measurable within a given scan cycle time. For mapping, scan cycle time directly determines spatial
      resolution at a given scan speed: shorter cycle time = finer spatial resolution.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/dwellTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/dwellTime
      schema:name:
        const: Dwell Time per Mass
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_backgroundCountTime:
    title: Background Count Time
    description: Total time spent measuring gas blank (background signal with laser off or shutter closed)
      before each ablation event, in seconds. For spot and transect analysis, a discrete background interval
      is measured before each ablation. For mapping, background is typically measured once per raster line
      or at the start of a map session rather than before each individual pixel. Editable to allow session-specific
      adjustment.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/backgroundCountTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/backgroundCountTime
      schema:name:
        const: Background Count Time
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laicpms_outlierFiltering:
    title: Spike / Outlier Filtering Approach
    description: Method used to identify and remove anomalous signal spikes arising from micronuggets, inclusions,
      cracks, or instrument artifacts during time-resolved signal processing. Editable because the specific
      implementation may vary between sessions while remaining within the protocol framework.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/outlierFiltering
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/outlierFiltering
      schema:name:
        const: Spike / Outlier Filtering Approach
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_nonlinearResponseCorrection:
    title: Pulse/Analog Detector Nonlinearity Correction
    description: Whether a correction was applied for nonlinear response at the transition between pulse-counting
      and analog detector modes.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/nonlinearResponseCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/nonlinearResponseCorrection
      schema:name:
        const: Pulse/Analog Detector Nonlinearity Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_memoryEffectMitigation:
    title: Memory Effect Mitigation
    description: Protocol applied to identify and minimise memory effects from high-concentration elements
      in the previous sample or standard that may contaminate subsequent analyses, or from incomplete aerosol
      washout between adjacent pixels in raster mapping mode. For mapping, the mitigation strategy involves
      controlling scan speed relative to washout time to ensure each pixel signal is sufficiently free of
      the preceding pixel's contribution.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/memoryEffectMitigation
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/memoryEffectMitigation
      schema:name:
        const: Memory Effect Mitigation
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_postAcquisitionNormalization:
    title: Normalization / Standards-Based Correction
    description: Any post-acquisition normalization applied to correct for systematic biases identified
      from secondary reference materials, or stoichiometric normalization applied per pixel in mapping.
      Distinct from the primary internal standard approach captured in Internal Standard Approach.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/postAcquisitionNormalization
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/postAcquisitionNormalization
      schema:name:
        const: Normalization / Standards-Based Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_primaryCalibrationStandardName:
    title: Primary Calibration Standard Name
    description: Primary reference material(s) used to calibrate the instrument and convert raw signal intensities
      to concentrations or isotope ratios. Include material name, source institution, and citation for the
      accepted values used. Editable because the specific lot or certification vintage may differ between
      sessions while the material type remains the same.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/primaryCalibrationStandardName
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/primaryCalibrationStandardName
      schema:name:
        const: Primary Calibration Standard Name
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_secondaryReferenceMaterial:
    title: Secondary Reference Materials
    description: Quality-control reference materials analysed as unknowns alongside samples in the same
      session to assess accuracy and monitor drift. Include material name, source, and citation for accepted
      values used for comparison. Editable because selection of secondary RMs may vary across sessions.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/secondaryReferenceMaterial
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/secondaryReferenceMaterial
      schema:name:
        const: Secondary Reference Materials
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_torchType:
    title: Torch Type
    description: Type of plasma torch installed. Injector inner diameter (typically 1.5–2.5 mm) affects
      aerosol transport efficiency and plasma conditions in LA-ICP-MS.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/torchType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/torchType
      schema:name:
        const: Torch Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_laserBeamEnergyProfile:
    title: Laser Beam Energy Profile
    description: Spatial energy distribution of the laser beam at the sample surface, and whether a beam
      homogenizer is installed. A flat-top (top-hat) profile produces more uniform ablation craters and
      more reproducible crater morphology than a Gaussian beam. This is a fixed hardware property of the
      laser system.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/laserBeamEnergyProfile
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/laserBeamEnergyProfile
      schema:name:
        const: Laser Beam Energy Profile
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_laserPulseDuration:
    title: Laser Pulse Duration
    description: 'Duration of each individual laser pulse, including units. Pulse duration determines the
      ablation regime: nanosecond (ns) pulses involve significant thermal effects and elemental fractionation;
      femtosecond (fs) pulses are non-thermal and substantially reduce elemental fractionation and matrix
      effects. This is a fixed hardware property of the laser system.'
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/laserPulseDuration
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/laserPulseDuration
      schema:name:
        const: Laser Pulse Duration
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_instrumentWarmUpSessionDurationLimit:
    title: Instrument Warm-up / Session Duration Limit
    description: Minimum warm-up time required after plasma ignition before analyses begin, and any maximum
      session duration enforced to maintain stable operating conditions. These constraints are part of the
      protocol and cannot be varied by the analyst.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/instrumentWarmUpSessionDurationLimit
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/instrumentWarmUpSessionDurationLimit
      schema:name:
        const: Instrument Warm-up / Session Duration Limit
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_eScanRange:
    title: E-scan Range
    description: Electric scan range used for peak acquisition, expressed as percentage of the centre mass
      (%). Varies the accelerating voltage to cover masses in the vicinity of the set magnetic mass without
      re-scanning the magnet. Record 'N/A' if E-scan acquisition mode is not used.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/eScanRange
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/eScanRange
      schema:name:
        const: E-scan Range
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  laicpms_tripleScanningMode:
    title: Triple Scanning Mode
    description: Whether each mass peak is scanned three times per cycle and the results averaged (Y/N).
      Used to reduce noise from short-term magnetic field instabilities on sector-field instruments. In
      LA-SF-ICP-MS, triple scanning affects the effective integration time per cycle and should be reported.
      Record 'N/A' if not applicable to the instrument.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/tripleScanningMode
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/tripleScanningMode
      schema:name:
        const: Triple Scanning Mode
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_reactionGasType:
    title: Reaction Gas Type
    description: Type of reactive gas introduced into the dynamic reaction cell (DRC) for interference removal
      through ion-molecule reactions. Common reaction gases include NH₃ (e.g., for Fe, Ca, K isotopes) and
      O₂ (e.g., for As, Ge). Record 'None' if DRC mode is not used.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/reactionGasType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/reactionGasType
      schema:name:
        const: Reaction Gas Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_multiRunSequentialAnalysisDesign:
    title: Multi-Run Sequential Analysis Design
    description: Whether the protocol uses a single acquisition pass or multiple sequential runs on the
      same sample location, each optimized for different analytical objectives. For multi-run designs, describe
      the number of runs, their purpose, key laser and instrument settings per run, and how outputs of one
      run feed into data reduction of another. Not applicable to raster mapping, where each spatial location
      is visited exactly once.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/multiRunSequentialAnalysisDesign
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/multiRunSequentialAnalysisDesign
      schema:name:
        const: Multi-Run Sequential Analysis Design
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  laicpms_matrixOffsetCorrection:
    title: Matrix Offset Correction (LIEF)
    description: Whether an empirical correction was applied to account for systematic differences in laser-induced
      elemental fractionation (LIEF) patterns between the external calibration standard and the sample matrix.
    type: object
    properties:
      '@id':
        const: ada:parameter/laicpmsTAPP/matrixOffsetCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/laicpmsTAPP/matrixOffsetCorrection
      schema:name:
        const: Matrix Offset Correction (LIEF)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value

  semComposition_coupledProcedureDoi:
    title: Coupled Procedure DOI
    description: Registered procedure DOI for the coupled technique named above. Provides a stable, citable
      link to the companion method independent of whether a dataset has been deposited. If the coupled procedure
      has not yet been registered, enter the DOI of a publication describing the coupled method, or "pending".
      Enter "None" if no coupling is planned.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/coupledProcedureDoi
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/coupledProcedureDoi
      schema:name:
        const: Coupled Procedure DOI
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_coupledDatasetOrPublicationReference:
    title: Coupled Dataset or Publication Reference
    description: 'DOI or other persistent identifier for the co-registered dataset or publication where
      both datasets are reported together. Accepts: a dedicated dataset DOI (if separately deposited), a
      shared dataset DOI (if co-submitted in the same package), or a publication DOI. Use "same submission"
      if the coupled dataset is included in this data package, or "pending" if not yet assigned. If coupling
      is documented through a shared sample identifier only, that information is already captured in Sample
      Persistent Identifier (Group 2).'
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/coupledDatasetOrPublicationReference
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/coupledDatasetOrPublicationReference
      schema:name:
        const: Coupled Dataset or Publication Reference
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_samplePreparationMethod:
    title: Sample Preparation Method
    description: Method by which samples were prepared for SEM analysis prior to loading in the instrument.
      Includes mounting medium (epoxy, carbon tape, stub), polishing steps (alumina, colloidal silica, argon
      ion mill), and conductive coating type and thickness. For VP-SEM/ESEM analyses, note whether an uncoated
      sample was used and the gas type used. FIB-specific in-session operations (protective coating deposition,
      milling conditions, lamella preparation) are documented separately in Group 4.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/samplePreparationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/samplePreparationMethod
      schema:name:
        const: Sample Preparation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_samplePersistentIdentifier:
    title: Sample Persistent Identifier
    description: Globally unique, persistent identifier for each sample listed in Sample Name. IGSN (International
      Geo Sample Number) is the recommended standard for geological and cosmochemical samples, as used by
      Astromat, EarthChem and SESAR. Where a sample and its sub-samples are separately registered, record
      the identifier at the level actually analysed.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/samplePersistentIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/samplePersistentIdentifier
      schema:name:
        const: Sample Persistent Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_targetSelectionCriteria:
    title: Target Selection Criteria
    description: 'The rules governing which part of the sample is analysed, and why. Covers the criteria
      applied when choosing grains, aliquots, spots, or a region of interest — size, morphology, clarity,
      freedom from inclusions or alteration, phase identity, or spatial position. Distinct from Target Material,
      which states the material type the procedure is designed for: this field states how, within such a
      sample, the analysed portion is picked out.'
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/targetSelectionCriteria
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/targetSelectionCriteria
      schema:name:
        const: Target Selection Criteria
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_preAnalysisImagingAndScreening:
    title: Pre-Analysis Imaging and Screening
    description: Imaging or other characterisation performed before the measurement in order to select or
      locate the analysed target, including the technique, instrument and settings used, and how individual
      analyses are linked back to the images. Distinct from any imaging the procedure performs as its own
      measurement. Where the imaging is performed on a separate instrument, it should also be recorded in
      the Group 1 coupling fields.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/preAnalysisImagingAndScreening
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/preAnalysisImagingAndScreening
      schema:name:
        const: Pre-Analysis Imaging and Screening
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_acceleratingVoltage:
    title: Accelerating Voltage
    description: Electron beam accelerating voltage in kilovolts. Affects X-ray generation depth (EDS/WDS),
      EBSD pattern quality, imaging resolution, and beam penetration. Low voltages (1-5 kV) improve surface
      sensitivity and reduce beam damage; high voltages (15-20 kV) improve X-ray generation for quantitative
      analysis.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/acceleratingVoltage
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/acceleratingVoltage
      schema:name:
        const: Accelerating Voltage
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  semComposition_beamCurrent:
    title: Beam Current
    description: Electron beam probe current. Higher current improves signal-to-noise for X-ray analysis
      (EDS/WDS, EBSD) and CL but may increase beam damage and reduce spatial resolution. Express in nA;
      for sub-nA values use decimal notation (e.g., 0.4 nA).
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/beamCurrent
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/beamCurrent
      schema:name:
        const: Beam Current
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  semComposition_beamDiameter:
    title: Beam Diameter
    description: Nominal electron beam diameter (spot size) at the sample surface, in nanometres or micrometres,
      as set by the condenser aperture and working distance. Controls the spatial resolution and X-ray excitation
      volume. For mapping modes, the effective spatial sampling interval is further defined by Step Size
      / Pixel Size.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/beamDiameter
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/beamDiameter
      schema:name:
        const: Beam Diameter
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_beamRasterDimensions:
    title: Beam Raster Dimensions
    description: Dimensions of the small area over which the beam is rastered during a single analysis point,
      reported as width × height in µm. Applicable when Beam Mode = Rastered; defines the effective spatial
      footprint of the measurement and distributes dose over a larger area to reduce beam damage on sensitive
      phases.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/beamRasterDimensions
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/beamRasterDimensions
      schema:name:
        const: Beam Raster Dimensions
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_beamDamageMinimization:
    title: Beam Damage Minimization
    description: 'Describes any measures taken to reduce electron beam damage to the sample during analysis.
      Examples: reduced accelerating voltage, lowered beam current, defocused or rastered beam, cooled stage,
      short acquisition sequences, or rotating between multiple points. Particularly important for volatile-bearing
      phases, hydrous minerals, glasses, organic materials, and biological samples.'
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/beamDamageMinimization
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/beamDamageMinimization
      schema:name:
        const: Beam Damage Minimization
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_driftCorrection:
    title: Drift Correction
    description: 'Describes whether and how stage or beam drift was monitored and corrected during the measurement
      session. Examples: periodic stage realignment to a fiducial marker, automated beam drift correction
      in acquisition software, or reanalysis of a reference point at regular intervals. Particularly relevant
      for long mapping runs and high-magnification sessions where positional accuracy affects data quality.'
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/driftCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/driftCorrection
      schema:name:
        const: Drift Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_workingDistance:
    title: Working Distance
    description: Distance between the objective lens pole piece and the specimen surface in millimetres.
      Affects spatial resolution, depth of focus, EDS X-ray take-off angle, and EBSD geometry.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/workingDistance
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/workingDistance
      schema:name:
        const: Working Distance
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  semComposition_chamberPressure:
    title: Chamber Pressure
    description: Chamber pressure and gas type during analysis. Required for variable pressure (VP-SEM)
      and environmental SEM (ESEM) modes. Report value and unit (Pa or Torr) and gas composition. Use 'None'
      for standard high-vacuum operation.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/chamberPressure
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/chamberPressure
      schema:name:
        const: Chamber Pressure
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_dwellTimePerPixel:
    title: Dwell Time per Pixel
    description: Time the electron beam dwells on each pixel during raster scanning (imaging modes) or on
      each step position during compositional mapping (EDS and WDS mapping modes), in microseconds or milliseconds.
      Longer dwell time improves signal-to-noise and counting statistics but increases total dose and can
      cause beam damage or contamination on sensitive materials. For WDS mapping, the dwell time is per
      spectrometer per pixel.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/dwellTimePerPixel
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/dwellTimePerPixel
      schema:name:
        const: Dwell Time per Pixel
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_edsLiveTimePerPointOrPixel:
    title: EDS Live Time per Point or Pixel
    description: EDS spectral acquisition live time per analysis point or per pixel in seconds. Longer live
      time improves counting statistics but increases beam damage risk and total acquisition time.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/edsLiveTimePerPointOrPixel
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/edsLiveTimePerPointOrPixel
      schema:name:
        const: EDS Live Time per Point or Pixel
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  semComposition_stepSizePixelSize:
    title: Step Size / Pixel Size
    description: Centre-to-centre distance between adjacent measurement points (WDS mapping) or pixels (EDS
      mapping) in µm. Defines the spatial sampling interval of the map and, together with the pixel-grid
      dimensions, determines the total mapped area. Smaller step sizes increase spatial resolution but extend
      acquisition time.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/stepSizePixelSize
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/stepSizePixelSize
      schema:name:
        const: Step Size / Pixel Size
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_peakCountingTime:
    title: Peak Counting Time
    description: Time spent counting X-ray intensity at the peak position, in seconds, on each spectrometer
      assignment. Procedure specifies standard values; analysts may adjust within procedure-defined bounds.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/peakCountingTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/peakCountingTime
      schema:name:
        const: Peak Counting Time
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  semComposition_backgroundCountingTime:
    title: Background Counting Time
    description: Total time spent counting at off-peak background position(s) in seconds, summed across
      all background positions.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/backgroundCountingTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/backgroundCountingTime
      schema:name:
        const: Background Counting Time
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  semComposition_backgroundPosition:
    title: Background Position(s)
    description: Location(s) of off-peak background measurement(s) relative to the peak, in mm or sin-theta,
      and whether on the high- or low-energy side.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/backgroundPosition
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/backgroundPosition
      schema:name:
        const: Background Position(s)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_backgroundCorrectionMethod:
    title: Background Correction Method
    description: 'Method used to estimate and subtract background X-ray intensity beneath the peak. For
      WDS: typically 2-point off-peak linear interpolation or Mean Atomic Number (MAN) background model.
      For EDS: spectral background fitting or top-hat filter applied during spectral processing.'
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/backgroundCorrectionMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/backgroundCorrectionMethod
      schema:name:
        const: Background Correction Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_timeDependentIntensityCorrection:
    title: Time-Dependent Intensity Correction
    description: Type of time-dependent intensity (TDI) correction applied to compensate for beam-induced
      volatilisation or migration of sensitive elements (e.g., Na, K, F in glasses, feldspars, carbonates).
      Most commonly applied in WDS point analysis; uncommon for EDS or X-ray mapping.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/timeDependentIntensityCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/timeDependentIntensityCorrection
      schema:name:
        const: Time-Dependent Intensity Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_halogenCorrectionOnOxygen:
    title: Halogen Correction on Oxygen
    description: Whether oxygen content was adjusted to account for halogen substitution (F and/or Cl replacing
      OH) in halogen-bearing phases such as apatite, amphibole, and mica, where oxygen is calculated by
      stoichiometry.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/halogenCorrectionOnOxygen
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/halogenCorrectionOnOxygen
      schema:name:
        const: Halogen Correction on Oxygen
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_blankCorrection:
    title: Blank Correction
    description: Method and reference material(s) used to determine and subtract blank signal contributions
      (e.g., carbon coat contribution to C signal, or background contamination for trace elements).
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/blankCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/blankCorrection
      schema:name:
        const: Blank Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_normalizationStandardsBasedCorrection:
    title: Normalization / Standards-Based Correction
    description: Post-acquisition normalization applied using secondary reference materials to correct for
      session-to-session calibration drift.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/normalizationStandardsBasedCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/normalizationStandardsBasedCorrection
      schema:name:
        const: Normalization / Standards-Based Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_calibrationFactorAndDeterminationMethod:
    title: Calibration Factor and Determination Method
    description: 'An externally-calibrated factor that converts the measured quantity into the reported
      quantity, how it was determined, and its uncertainty. Applies where the conversion depends on a factor
      calibrated against a reference of independently known value, rather than on the instrument response
      alone. Distinct from the fields that name the calibration material and that state which approach applies
      to which analyte, where the technique has them: this field records the resulting factor itself.'
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/calibrationFactorAndDeterminationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/calibrationFactorAndDeterminationMethod
      schema:name:
        const: Calibration Factor and Determination Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_constantsAndReferenceValuesUsed:
    title: Constants and Reference Values Used
    description: Physical constants and reference values used in data reduction to calculate the final reported
      quantity (e.g., decay constants for age calculation, standard isotope ratios, or other citable reference
      values used in a correction or calculation), together with their source. Distinct from the Group 6
      reference-material fields, which document accepted values for specific calibration/validation materials
      rather than universal physical constants. Record "None" if no citable, revisable physical constants
      feed into this procedure's data reduction.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/constantsAndReferenceValuesUsed
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/constantsAndReferenceValuesUsed
      schema:name:
        const: Constants and Reference Values Used
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_primaryCalibrationStandardName:
    title: Primary Calibration Standard Name
    description: Name(s) of the primary reference material(s) used for intensity calibration in EDS or WDS
      quantification. Include the material name, its source or supplier, and a citation for the accepted
      values used, since results calibrated against different published values for the same material are
      not directly comparable.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/primaryCalibrationStandardName
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/primaryCalibrationStandardName
      schema:name:
        const: Primary Calibration Standard Name
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_secondaryReferenceMaterials:
    title: Secondary Reference Materials
    description: Quality-control reference material(s) analyzed alongside unknowns to verify calibration
      accuracy. Include material name, assessed elements, number of analyses (n), and measured vs. accepted
      values where available.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/secondaryReferenceMaterials
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/secondaryReferenceMaterials
      schema:name:
        const: Secondary Reference Materials
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_fundingSourceForProcedureDevelopment:
    title: Funding Source for Procedure Development
    description: Grants and other funding sources that supported instrument acquisition, major upgrades,
      procedure development, and associated personnel time. Include grant numbers and funding agencies where
      applicable.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/fundingSourceForProcedureDevelopment
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/fundingSourceForProcedureDevelopment
      schema:name:
        const: Funding Source for Procedure Development
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_procedureReference:
    title: Procedure Reference(s)
    description: DOI or URL for peer-reviewed publications or technical reports describing, validating,
      or benchmarking this procedure.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/procedureReference
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/procedureReference
      schema:name:
        const: Procedure Reference(s)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_edsDetectorConfiguration:
    title: EDS Detector Configuration
    description: EDS detector type, manufacturer, active area, solid angle, window type, and geometry (take-off
      angle, position). Multiple detectors should be listed separately.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/edsDetectorConfiguration
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/edsDetectorConfiguration
      schema:name:
        const: EDS Detector Configuration
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_wdsSpectrometerConfiguration:
    title: WDS Spectrometer Configuration
    description: Number, type, and crystal range of WDS spectrometers on the instrument. Include manufacturer,
      model, and crystal range. For SEM-WDS configurations (third-party WDS on a non-EPMA platform), include
      WDS manufacturer and model.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/wdsSpectrometerConfiguration
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/wdsSpectrometerConfiguration
      schema:name:
        const: WDS Spectrometer Configuration
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_stageScanVsBeamScan:
    title: Stage Scan vs. Beam Scan
    description: For mapping modes, records whether the map was acquired by moving the stage while the beam
      is held fixed (stage scan) or by deflecting the beam across the field while the stage is stationary
      (beam scan). Stage scan is preferred for large areas or high-accuracy geometric fidelity; beam scan
      is faster for smaller fields but may introduce geometric distortion at the map edges.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/stageScanVsBeamScan
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/stageScanVsBeamScan
      schema:name:
        const: Stage Scan vs. Beam Scan
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_wdsSpectrometerChannel:
    title: WDS Spectrometer Channel
    description: WDS spectrometer position(s) assigned to each analyte, one entry per assignment. An analyte
      may be assigned to more than one spectrometer with intensities aggregated (aggregate intensity counting),
      and one spectrometer serves several analytes across a run, so the assignment — not the analyte — is
      the unit carrying the spectrometer setup. Different spectrometers may have different crystal configurations.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/wdsSpectrometerChannel
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/wdsSpectrometerChannel
      schema:name:
        const: WDS Spectrometer Channel
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_sequence:
    title: Sequence
    description: Order in which spectrometer assignments are acquired during point analysis. Relevant for
      minimizing beam damage (volatile elements measured first) and for sequential multi-channel setups.
      Not applicable to X-ray mapping, where all assigned spectrometers collect simultaneously at each pixel.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/sequence
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/sequence
      schema:name:
        const: Sequence
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_proportionalCounterDetector:
    title: Proportional Counter / Detector
    description: Type of detector used on each spectrometer assignment. Affects sensitivity and count rate
      linearity.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/proportionalCounterDetector
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/proportionalCounterDetector
      schema:name:
        const: Proportional Counter / Detector
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_wdsPhaSetting:
    title: WDS PHA Setting
    description: Pulse height analyzer (PHA) setting for the WDS detector. Integral mode accepts all pulses
      above a threshold; Differential mode selects a narrow energy window to reject higher-order reflections
      and escape peaks.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/wdsPhaSetting
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/wdsPhaSetting
      schema:name:
        const: WDS PHA Setting
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_analyteEstimationMethod:
    title: Analyte Estimation Method
    description: Whether elemental concentrations were calculated directly from measured X-ray intensities,
      or estimated by cation stoichiometry (e.g., oxygen calculated from cation proportions in silicates;
      carbon from stoichiometry in carbonates).
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/analyteEstimationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/analyteEstimationMethod
      schema:name:
        const: Analyte Estimation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_edsSpectralProcessingType:
    title: EDS Spectral Processing Type
    description: Method used to process EDS spectra and extract net peak intensities from raw spectral data.
      Applied before quantification (see Matrix Correction Method). Common approaches include background
      fitting and subtraction followed by peak integration, and filter fit or Gaussian deconvolution for
      overlapping peaks.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/edsSpectralProcessingType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/edsSpectralProcessingType
      schema:name:
        const: EDS Spectral Processing Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_interferingElements:
    title: Interfering Elements
    description: Element(s) whose X-ray lines overlap with the measured peak for one or more analytes, requiring
      a correction.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/interferingElements
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/interferingElements
      schema:name:
        const: Interfering Elements
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semComposition_interferenceCorrectionStandard:
    title: Interference Correction Standard
    description: Reference material used to quantify and calibrate the interference correction for each
      affected analyte.
    type: object
    properties:
      '@id':
        const: ada:parameter/semCompositionTAPP/interferenceCorrectionStandard
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semCompositionTAPP/interferenceCorrectionStandard
      schema:name:
        const: Interference Correction Standard
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value

  semFibsem_coupledProcedureDoi:
    title: Coupled Procedure DOI
    description: Registered procedure DOI for the coupled technique named above. Provides a stable, citable
      link to the companion method independent of whether a dataset has been deposited. If the coupled procedure
      has not yet been registered, enter the DOI of a publication describing the coupled method, or "pending".
      Enter "None" if no coupling is planned.
    type: object
    properties:
      '@id':
        const: ada:parameter/semFibsemTAPP/coupledProcedureDoi
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semFibsemTAPP/coupledProcedureDoi
      schema:name:
        const: Coupled Procedure DOI
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semFibsem_coupledDatasetOrPublicationReference:
    title: Coupled Dataset or Publication Reference
    description: 'DOI or other persistent identifier for the co-registered dataset or publication where
      both datasets are reported together. Accepts: a dedicated dataset DOI (if separately deposited), a
      shared dataset DOI (if co-submitted in the same package), or a publication DOI. Use "same submission"
      if the coupled dataset is included in this data package, or "pending" if not yet assigned. If coupling
      is documented through a shared sample identifier only, that information is already captured in Sample
      Persistent Identifier (Group 2).'
    type: object
    properties:
      '@id':
        const: ada:parameter/semFibsemTAPP/coupledDatasetOrPublicationReference
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semFibsemTAPP/coupledDatasetOrPublicationReference
      schema:name:
        const: Coupled Dataset or Publication Reference
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semFibsem_samplePreparationMethod:
    title: Sample Preparation Method
    description: Method by which samples were prepared for SEM analysis prior to loading in the instrument.
      Includes mounting medium (epoxy, carbon tape, stub), polishing steps (alumina, colloidal silica, argon
      ion mill), and conductive coating type and thickness. For VP-SEM/ESEM analyses, note whether an uncoated
      sample was used and the gas type used. FIB-specific in-session operations (protective coating deposition,
      milling conditions, lamella preparation) are documented separately in Group 4.
    type: object
    properties:
      '@id':
        const: ada:parameter/semFibsemTAPP/samplePreparationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semFibsemTAPP/samplePreparationMethod
      schema:name:
        const: Sample Preparation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semFibsem_samplePersistentIdentifier:
    title: Sample Persistent Identifier
    description: Globally unique, persistent identifier for each sample listed in Sample Name. IGSN (International
      Geo Sample Number) is the recommended standard for geological and cosmochemical samples, as used by
      Astromat, EarthChem and SESAR. Where a sample and its sub-samples are separately registered, record
      the identifier at the level actually analysed.
    type: object
    properties:
      '@id':
        const: ada:parameter/semFibsemTAPP/samplePersistentIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semFibsemTAPP/samplePersistentIdentifier
      schema:name:
        const: Sample Persistent Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semFibsem_targetSelectionCriteria:
    title: Target Selection Criteria
    description: 'The rules governing which part of the sample is analysed, and why. Covers the criteria
      applied when choosing grains, aliquots, spots, or a region of interest — size, morphology, clarity,
      freedom from inclusions or alteration, phase identity, or spatial position. Distinct from Target Material,
      which states the material type the procedure is designed for: this field states how, within such a
      sample, the analysed portion is picked out.'
    type: object
    properties:
      '@id':
        const: ada:parameter/semFibsemTAPP/targetSelectionCriteria
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semFibsemTAPP/targetSelectionCriteria
      schema:name:
        const: Target Selection Criteria
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semFibsem_preAnalysisImagingAndScreening:
    title: Pre-Analysis Imaging and Screening
    description: Imaging or other characterisation performed before the measurement in order to select or
      locate the analysed target, including the technique, instrument and settings used, and how individual
      analyses are linked back to the images. Distinct from any imaging the procedure performs as its own
      measurement. Where the imaging is performed on a separate instrument, it should also be recorded in
      the Group 1 coupling fields.
    type: object
    properties:
      '@id':
        const: ada:parameter/semFibsemTAPP/preAnalysisImagingAndScreening
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semFibsemTAPP/preAnalysisImagingAndScreening
      schema:name:
        const: Pre-Analysis Imaging and Screening
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semFibsem_acceleratingVoltage:
    title: Accelerating Voltage
    description: Electron beam accelerating voltage in kilovolts. Affects X-ray generation depth (EDS/WDS),
      EBSD pattern quality, imaging resolution, and beam penetration. Low voltages (1-5 kV) improve surface
      sensitivity and reduce beam damage; high voltages (15-20 kV) improve X-ray generation for quantitative
      analysis.
    type: object
    properties:
      '@id':
        const: ada:parameter/semFibsemTAPP/acceleratingVoltage
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semFibsemTAPP/acceleratingVoltage
      schema:name:
        const: Accelerating Voltage
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  semFibsem_beamCurrent:
    title: Beam Current
    description: Electron beam probe current. Higher current improves signal-to-noise for X-ray analysis
      (EDS/WDS, EBSD) and CL but may increase beam damage and reduce spatial resolution. Express in nA;
      for sub-nA values use decimal notation (e.g., 0.4 nA).
    type: object
    properties:
      '@id':
        const: ada:parameter/semFibsemTAPP/beamCurrent
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semFibsemTAPP/beamCurrent
      schema:name:
        const: Beam Current
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  semFibsem_workingDistance:
    title: Working Distance
    description: Distance between the objective lens pole piece and the specimen surface in millimetres.
      Affects spatial resolution, depth of focus, EDS X-ray take-off angle, and EBSD geometry.
    type: object
    properties:
      '@id':
        const: ada:parameter/semFibsemTAPP/workingDistance
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semFibsemTAPP/workingDistance
      schema:name:
        const: Working Distance
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  semFibsem_dwellTimePerPixel:
    title: Dwell Time per Pixel
    description: Time the electron beam dwells on each pixel during raster scanning (imaging modes) or on
      each step position during compositional mapping (EDS and WDS mapping modes), in microseconds or milliseconds.
      Longer dwell time improves signal-to-noise and counting statistics but increases total dose and can
      cause beam damage or contamination on sensitive materials. For WDS mapping, the dwell time is per
      spectrometer per pixel.
    type: object
    properties:
      '@id':
        const: ada:parameter/semFibsemTAPP/dwellTimePerPixel
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semFibsemTAPP/dwellTimePerPixel
      schema:name:
        const: Dwell Time per Pixel
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semFibsem_protectiveCoatingDeposition:
    title: Protective Coating Deposition
    description: 'Type and deposition conditions of the protective coating applied to the sample surface
      before FIB milling. E-beam deposition causes less surface damage than ion-beam deposition and should
      be applied as the initial layer. Typical coatings: platinum (Pt) or carbon (C). State material, deposition
      method, beam conditions, and approximate thickness.'
    type: object
    properties:
      '@id':
        const: ada:parameter/semFibsemTAPP/protectiveCoatingDeposition
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semFibsemTAPP/protectiveCoatingDeposition
      schema:name:
        const: Protective Coating Deposition
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semFibsem_coarseMillingConditions:
    title: Coarse Milling Conditions
    description: 'Ion beam voltage and current used for bulk material removal during FIB milling. For TEM
      specimen preparation: bulk trenching to isolate the lamella and intermediate thinning. For 3D tomography:
      face preparation and initial slice removal.'
    type: object
    properties:
      '@id':
        const: ada:parameter/semFibsemTAPP/coarseMillingConditions
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semFibsemTAPP/coarseMillingConditions
      schema:name:
        const: Coarse Milling Conditions
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semFibsem_finePolishingConditions:
    title: Fine Polishing Conditions
    description: Ion beam voltage and current for final thinning and surface polishing of the TEM lamella.
      Low-voltage polishing (2 kV or below) minimises Ga implantation depth, surface amorphisation, and
      curtaining artifacts.
    type: object
    properties:
      '@id':
        const: ada:parameter/semFibsemTAPP/finePolishingConditions
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semFibsemTAPP/finePolishingConditions
      schema:name:
        const: Fine Polishing Conditions
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semFibsem_foilThickness:
    title: Foil Thickness
    description: 'Target thickness of the electron-transparent TEM lamella after final FIB polishing, in
      nanometres. Actual thickness may differ from target. Typical range: 50-150 nm for standard TEM/STEM;
      200-600 nm for XANES or tomography sections.'
    type: object
    properties:
      '@id':
        const: ada:parameter/semFibsemTAPP/foilThickness
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semFibsemTAPP/foilThickness
      schema:name:
        const: Foil Thickness
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semFibsem_ionMillingConditions:
    title: Ion Milling Conditions (3D Tomography)
    description: Ion beam voltage and current used to mill each slice during FIB-SEM serial sectioning.
      These parameters determine material removal rate per slice and exposed surface quality.
    type: object
    properties:
      '@id':
        const: ada:parameter/semFibsemTAPP/ionMillingConditions
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semFibsemTAPP/ionMillingConditions
      schema:name:
        const: Ion Milling Conditions (3D Tomography)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  semFibsem_sliceThickness:
    title: Slice Thickness
    description: Thickness of each FIB-milled slice during serial sectioning in nanometres. Controls the
      Z-axis resolution of the 3D reconstruction.
    type: object
    properties:
      '@id':
        const: ada:parameter/semFibsemTAPP/sliceThickness
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semFibsemTAPP/sliceThickness
      schema:name:
        const: Slice Thickness
      schema:value:
