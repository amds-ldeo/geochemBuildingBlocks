        - '@id': ada:parameter/solutionQicpmsTAPP/procedureReference
      schema:name:
        const: Procedure Reference(s)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionQicpms_torchType:
    title: Torch Type
    description: Type of plasma torch used (e.g., standard quartz, high-matrix, low-flow).
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionQicpmsTAPP/torchType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionQicpmsTAPP/torchType
      schema:name:
        const: Torch Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionQicpms_samplerAndSkimmerConeMaterial:
    title: Sampler and Skimmer Cone Material
    description: Material composition of the sampler and skimmer cones. Nickel (Ni) is standard for most
      aqueous matrices. Platinum (Pt) is used for samples in HCl-rich or organic matrices due to greater
      corrosion resistance.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionQicpmsTAPP/samplerAndSkimmerConeMaterial
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionQicpmsTAPP/samplerAndSkimmerConeMaterial
      schema:name:
        const: Sampler and Skimmer Cone Material
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionQicpms_desolvationSystem:
    title: Desolvation System
    description: 'Desolvating nebulizer or membrane desolvator used upstream of the plasma to reduce solvent
      load. Lowers oxide production rates and increases sensitivity, and is commonly used for low-abundance
      analytes or small sample sizes. Note the trade-off: desolvation can introduce additional instrumental
      mass bias instability relative to wet plasma introduction. Record ''None'' if not used.'
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionQicpmsTAPP/desolvationSystem
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionQicpmsTAPP/desolvationSystem
      schema:name:
        const: Desolvation System
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionQicpms_reactionGasType:
    title: Reaction Gas Type
    description: Type of reactive gas introduced into the dynamic reaction cell (e.g., NH3, O2, CH4). Record
      'N/A' if DRC mode is not used. Record 'N/A' where Collision/Reaction Cell (CRC) Configuration does
      not include DRC.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionQicpmsTAPP/reactionGasType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionQicpmsTAPP/reactionGasType
      schema:name:
        const: Reaction Gas Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionQicpms_internalStandardConcentration:
    title: Internal Standard Concentration
    description: Target concentration of internal standard element(s) in all measured solutions (µg/L or
      ppb). Record 'N/A' where Internal Standard Element is 'None'.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionQicpmsTAPP/internalStandardConcentration
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionQicpmsTAPP/internalStandardConcentration
      schema:name:
        const: Internal Standard Concentration
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText

  solutionSficpms_coupledProcedureDoi:
    title: Coupled Procedure DOI
    description: Registered procedure DOI for the coupled technique named above. Provides a stable, citable
      link to the companion method independent of whether a dataset has been deposited. If the coupled procedure
      has not yet been registered, enter the DOI of a publication describing the coupled method, or "pending".
      Enter "None" if no coupling is planned.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/coupledProcedureDoi
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/coupledProcedureDoi
      schema:name:
        const: Coupled Procedure DOI
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionSficpms_coupledDatasetOrPublicationReference:
    title: Coupled Dataset or Publication Reference
    description: 'DOI or other persistent identifier for the co-registered dataset or publication where
      both datasets are reported together. Accepts: a dedicated dataset DOI (if separately deposited), a
      shared dataset DOI (if co-submitted in the same package), or a publication DOI. Use "same submission"
      if the coupled dataset is included in this data package, or "pending" if not yet assigned. If coupling
      is documented through a shared sample identifier only, that information is already captured in Sample
      Persistent Identifier (Group 2).'
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/coupledDatasetOrPublicationReference
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/coupledDatasetOrPublicationReference
      schema:name:
        const: Coupled Dataset or Publication Reference
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionSficpms_digestionTemperature:
    title: Digestion Temperature
    description: Temperature at which acid digestion was carried out (°C). Procedure specifies the target
      temperature.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/digestionTemperature
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/digestionTemperature
      schema:name:
        const: Digestion Temperature
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionSficpms_digestionDuration:
    title: Digestion Duration
    description: Duration of the primary acid digestion step (hours or days).
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/digestionDuration
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/digestionDuration
      schema:name:
        const: Digestion Duration
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionSficpms_sampleAliquotMassOrVolume:
    title: Sample Aliquot Mass or Volume
    description: Mass (mg) of solid material digested or volume (mL) of liquid taken for dissolution. Used
      for yield calculations and concentration back-calculation.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/sampleAliquotMassOrVolume
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/sampleAliquotMassOrVolume
      schema:name:
        const: Sample Aliquot Mass or Volume
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionSficpms_instrumentSerialNumberOrLabIdentifier:
    title: Instrument Serial Number or Lab Identifier
    description: Serial number or laboratory-internal identifier for the specific instrument unit. Supports
      traceability to instrument service records.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/instrumentSerialNumberOrLabIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/instrumentSerialNumberOrLabIdentifier
      schema:name:
        const: Instrument Serial Number or Lab Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionSficpms_torchDepth:
    title: Torch Depth
    description: Distance between the load coil and the sampling cone tip (mm), also called injector depth
      or torch position depending on the instrument manufacturer. Affects ion transmission efficiency, oxide
      formation, and doubly-charged species production. The procedure specifies a target value optimised
      during initial setup; the analyst confirms or fine-adjusts during session tuning.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/torchDepth
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/torchDepth
      schema:name:
        const: Torch Depth
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionSficpms_massResolutionSetting:
    title: Mass Resolution Setting
    description: Mass resolution mode(s) used in this procedure. Sector-field instruments allow selection
      of low resolution (LR; m/Δm ≈ 300–400), medium resolution (MR; m/Δm ≈ 2500–5000), or high resolution
      (HR; m/Δm ≈ 10,000). Multi-resolution procedures assign individual analytes to specific modes (documented
      in Group 4 under Mass Resolution Assignment). Procedure registers the mode(s) in use; analyst confirms
      at session start.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/massResolutionSetting
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/massResolutionSetting
      schema:name:
        const: Mass Resolution Setting
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionSficpms_sampleUptakeRate:
    title: Sample Uptake Rate
    description: Peristaltic pump speed or self-aspiration flow rate for sample introduction (µL/min or
      mL/min).
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/sampleUptakeRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/sampleUptakeRate
      schema:name:
        const: Sample Uptake Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionSficpms_rfPower:
    title: RF Power
    description: Radiofrequency forward power applied to the plasma (W). Controls ionization efficiency
      and oxide production rates.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/rfPower
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/rfPower
      schema:name:
        const: RF Power
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionSficpms_coolantGasFlowRate:
    title: Coolant (Plasma) Gas Flow Rate
    description: Flow rate of the outer (coolant) argon gas stream (L/min). Influences plasma temperature
      and oxide ion formation.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/coolantGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/coolantGasFlowRate
      schema:name:
        const: Coolant (Plasma) Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionSficpms_auxiliaryGasFlowRate:
    title: Auxiliary Gas Flow Rate
    description: Flow rate of the intermediate (auxiliary) argon gas stream between torch body and injector
      tube (L/min).
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/auxiliaryGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/auxiliaryGasFlowRate
      schema:name:
        const: Auxiliary Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionSficpms_nebulizerGasFlowRate:
    title: Nebulizer Gas Flow Rate
    description: Flow rate of the carrier argon gas delivered through the nebulizer (L/min). Controls aerosol
      transport and strongly influences signal sensitivity and stability. Adjusted daily to optimize signal.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/nebulizerGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/nebulizerGasFlowRate
      schema:name:
        const: Nebulizer Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionSficpms_makeUpGasFlowRate:
    title: Make-up Gas Flow Rate
    description: Supplementary argon flow added downstream of a desolvation system to maintain total gas
      delivery to the plasma (L/min). Record 'N/A' if no desolvation system is used. Record 'N/A' where
      Desolvation System is 'None'.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/makeUpGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/makeUpGasFlowRate
      schema:name:
        const: Make-up Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionSficpms_dwellTimePerMass:
    title: Dwell Time per Mass
    description: Integration time spent on each mass peak per sweep (ms). May differ between masses where
      per-mass dwell times are programmed.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/dwellTimePerMass
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/dwellTimePerMass
      schema:name:
        const: Dwell Time per Mass
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionSficpms_doublyChargedSpeciesMonitor:
    title: Doubly-Charged Species Monitor
    description: Mass ratio monitored to estimate doubly-charged ion (M2+) formation during instrument tuning.
      Doubly-charged ions appear at half the nominal mass of the parent ion and can interfere with lighter
      analyte masses. In SF-ICP-MS, doubly-charged species are not suppressed by collision cells and require
      monitoring through plasma tuning. Ba2+/Ba+ (m/z 69/138) is the most common proxy.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/doublyChargedSpeciesMonitor
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/doublyChargedSpeciesMonitor
      schema:name:
        const: Doubly-Charged Species Monitor
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionSficpms_doublyChargedSpeciesProduction:
    title: Doubly-Charged Species Production
    description: Measured percentage of doubly-charged ion production for the monitored species at the time
      of instrument tuning. Record both the acceptance threshold and the measured value. Elevated doubly-charged
      production indicates incomplete ionization and potential interference on elements at approximately
      half the mass of abundant matrix components.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/doublyChargedSpeciesProduction
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/doublyChargedSpeciesProduction
      schema:name:
        const: Doubly-Charged Species Production
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionSficpms_spikeOutlierFilteringApproach:
    title: Spike / Outlier Filtering Approach
    description: Criteria used to identify and exclude anomalous replicate measurements or data points from
      the calculated mean.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/spikeOutlierFilteringApproach
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/spikeOutlierFilteringApproach
      schema:name:
        const: Spike / Outlier Filtering Approach
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionSficpms_pulseAnalogDetectorNonlinearityCorrection:
    title: Pulse/Analog Detector Nonlinearity Correction
    description: Whether a correction was applied for nonlinear detector response at the transition between
      pulse-counting and analog (and Faraday, for triple-mode instruments) detection modes. For SF-ICP-MS
      instruments, the signal transitions between pulse counting (low concentrations) and analog detection
      (high concentrations). For triple-mode instruments (e.g., Thermo Element XR), an additional transition
      to Faraday cup detection occurs at the highest signal intensities. Cross-calibration factors between
      detector modes must be confirmed, typically measured each session.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/pulseAnalogDetectorNonlinearityCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/pulseAnalogDetectorNonlinearityCorrection
      schema:name:
        const: Pulse/Analog Detector Nonlinearity Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionSficpms_memoryEffectMitigation:
    title: Memory Effect Mitigation
    description: Procedure applied to identify and minimize carry-over of high-concentration elements between
      successive sample introductions. For solution ICP-MS, mitigation is implemented primarily at measurement
      time through extended rinse periods (see Wash Time Between Samples, Group 4). At data processing level,
      documents any flagging or exclusion of measurements preceded by high-concentration samples or standards
      where the required washout time may not have been achieved.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/memoryEffectMitigation
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/memoryEffectMitigation
      schema:name:
        const: Memory Effect Mitigation
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionSficpms_uncertaintyPropagationMethod:
    title: Uncertainty Propagation Method
    description: 'The approach used to propagate analytical uncertainty through the data reduction chain
      to the final reported value. State which sources are included in the propagation: counting statistics,
      calibration standard uncertainty, internal standard uncertainty, drift correction, and any systematic
      contributions. Distinct from Uncertainty Level, which states the convention at which the resulting
      uncertainty is quoted.'
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/uncertaintyPropagationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/uncertaintyPropagationMethod
      schema:name:
        const: Uncertainty Propagation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionSficpms_normalizationStandardsBasedCorrection:
    title: Normalization / Standards-Based Correction
    description: Post-acquisition normalization applied to output concentrations relative to a reference
      value (e.g., correction to a BHVO-2 working value).
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/normalizationStandardsBasedCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/normalizationStandardsBasedCorrection
      schema:name:
        const: Normalization / Standards-Based Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionSficpms_calibrationFactorAndDeterminationMethod:
    title: Calibration Factor and Determination Method
    description: 'An externally-calibrated factor that converts the measured quantity into the reported
      quantity, how it was determined, and its uncertainty. Applies where the conversion depends on a factor
      calibrated against a reference of independently known value, rather than on the instrument response
      alone. Distinct from the fields that name the calibration material and that state which approach applies
      to which analyte, where the technique has them: this field records the resulting factor itself.'
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/calibrationFactorAndDeterminationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/calibrationFactorAndDeterminationMethod
      schema:name:
        const: Calibration Factor and Determination Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionSficpms_constantsAndReferenceValuesUsed:
    title: Constants and Reference Values Used
    description: Physical constants and reference values used in data reduction to calculate the final reported
      quantity (e.g., decay constants for age calculation, standard isotope ratios, or other citable reference
      values used in a correction or calculation), together with their source. Distinct from the Group 6
      reference-material fields, which document accepted values for specific calibration/validation materials
      rather than universal physical constants. Record "None" if no citable, revisable physical constants
      feed into this procedure's data reduction.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/constantsAndReferenceValuesUsed
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/constantsAndReferenceValuesUsed
      schema:name:
        const: Constants and Reference Values Used
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionSficpms_primaryCalibrationStandardName:
    title: Primary Calibration Standard Name
    description: Name and reference material identifier of the external calibration standard used to convert
      signal intensities to elemental concentrations. Include the material name, its source or supplier,
      and a citation for the accepted values used, since results calibrated against different published
      values for the same material are not directly comparable.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/primaryCalibrationStandardName
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/primaryCalibrationStandardName
      schema:name:
        const: Primary Calibration Standard Name
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionSficpms_secondaryReferenceMaterials:
    title: Secondary Reference Materials
    description: Reference material(s) measured as unknowns to independently assess analytical accuracy.
      Specify material name and expected-value source.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/secondaryReferenceMaterials
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/secondaryReferenceMaterials
      schema:name:
        const: Secondary Reference Materials
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionSficpms_fundingSourceForProcedureDevelopment:
    title: Funding Source for Procedure Development
    description: Grants and other funding sources that supported instrument acquisition, major upgrades,
      procedure development, and associated personnel time. Include grant numbers and funding agencies where
      applicable.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/fundingSourceForProcedureDevelopment
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/fundingSourceForProcedureDevelopment
      schema:name:
        const: Funding Source for Procedure Development
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionSficpms_procedureReference:
    title: Procedure Reference(s)
    description: DOI or URL for peer-reviewed publications or technical reports describing, validating,
      or benchmarking this procedure.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/procedureReference
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/procedureReference
      schema:name:
        const: Procedure Reference(s)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionSficpms_torchType:
    title: Torch Type
    description: Type of plasma torch used (e.g., standard quartz, high-matrix, low-flow).
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/torchType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/torchType
      schema:name:
        const: Torch Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionSficpms_samplerAndSkimmerConeMaterial:
    title: Sampler and Skimmer Cone Material
    description: Material composition of the sampler and skimmer cones. Nickel (Ni) is standard for most
      aqueous matrices. Aluminium (Al) cones are used in some SF-ICP-MS labs for enhanced sensitivity at
      high resolution. Platinum (Pt) is used for HCl-rich matrices.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/samplerAndSkimmerConeMaterial
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/samplerAndSkimmerConeMaterial
      schema:name:
        const: Sampler and Skimmer Cone Material
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionSficpms_desolvationSystem:
    title: Desolvation System
    description: 'Desolvating nebulizer or membrane desolvator used upstream of the plasma to reduce solvent
      load. Lowers oxide production rates and increases sensitivity, and is commonly used for low-abundance
      analytes or small sample sizes. Note the trade-off: desolvation can introduce additional instrumental
      mass bias instability relative to wet plasma introduction. Record ''None'' if not used.'
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/desolvationSystem
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/desolvationSystem
      schema:name:
        const: Desolvation System
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionSficpms_eScanRange:
    title: E-scan Range
    description: Electric scan range used for peak acquisition, expressed as percentage of the centre mass
      (%). Varies the accelerating voltage to cover masses in the vicinity of the set magnetic mass without
      re-scanning the magnet. Record 'N/A' if E-scan acquisition mode is not used.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/eScanRange
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/eScanRange
      schema:name:
        const: E-scan Range
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionSficpms_tripleScanningMode:
    title: Triple Scanning Mode
    description: Whether each mass peak is scanned three times per cycle and the results averaged (Y/N).
      Used to reduce noise from short-term magnetic field instabilities on sector-field instruments. Triple
      scanning affects the effective integration time per cycle and should be reported. Record 'N/A' if
      not applicable to the instrument.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/tripleScanningMode
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/tripleScanningMode
      schema:name:
        const: Triple Scanning Mode
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionSficpms_internalStandardConcentration:
    title: Internal Standard Concentration
    description: Target concentration of internal standard element(s) in all measured solutions (µg/L or
      ppb). Record 'N/A' where Internal Standard Element is 'None'.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionSficpmsTAPP/internalStandardConcentration
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionSficpmsTAPP/internalStandardConcentration
      schema:name:
        const: Internal Standard Concentration
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText

  tem_coupledProcedureDoi:
    title: Coupled Procedure DOI
    description: Registered procedure DOI for the coupled technique named above. Provides a stable, citable
      link to the companion method independent of whether a dataset has been deposited. If the coupled procedure
      has not yet been registered, enter the DOI of a publication describing the coupled method, or "pending".
      Enter "None" if no coupling is planned.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/coupledProcedureDoi
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/coupledProcedureDoi
      schema:name:
        const: Coupled Procedure DOI
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_coupledDatasetOrPublicationReference:
    title: Coupled Dataset or Publication Reference
    description: 'DOI or other persistent identifier for the co-registered dataset or publication where
      both datasets are reported together. Accepts: a dedicated dataset DOI (if separately deposited), a
      shared dataset DOI (if co-submitted in the same package), or a publication DOI. Use "same submission"
      if the coupled dataset is included in this data package, or "pending" if not yet assigned. If coupling
      is documented through a shared sample identifier only, that information is already captured in Sample
      Persistent Identifier (Group 2).'
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/coupledDatasetOrPublicationReference
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/coupledDatasetOrPublicationReference
      schema:name:
        const: Coupled Dataset or Publication Reference
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_samplePersistentIdentifier:
    title: Sample Persistent Identifier
    description: Globally unique, persistent identifier for each sample listed in Sample Name. IGSN (International
      Geo Sample Number) is the recommended standard for geological and cosmochemical samples, as used by
      Astromat, EarthChem and SESAR. Where a sample and its sub-samples are separately registered, record
      the identifier at the level actually analysed.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/samplePersistentIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/samplePersistentIdentifier
      schema:name:
        const: Sample Persistent Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_targetSelectionCriteria:
    title: Target Selection Criteria
    description: 'The rules governing which part of the sample is analysed, and why. Covers the criteria
      applied when choosing grains, aliquots, spots, or a region of interest — size, morphology, clarity,
      freedom from inclusions or alteration, phase identity, or spatial position. Distinct from Target Material,
      which states the material type the procedure is designed for: this field states how, within such a
      sample, the analysed portion is picked out.'
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/targetSelectionCriteria
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/targetSelectionCriteria
      schema:name:
        const: Target Selection Criteria
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_preAnalysisImagingAndScreening:
    title: Pre-Analysis Imaging and Screening
    description: Imaging or other characterisation performed before the measurement in order to select or
      locate the analysed target, including the technique, instrument and settings used, and how individual
      analyses are linked back to the images. Distinct from any imaging the procedure performs as its own
      measurement. Where the imaging is performed on a separate instrument, it should also be recorded in
      the Group 1 coupling fields.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/preAnalysisImagingAndScreening
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/preAnalysisImagingAndScreening
      schema:name:
        const: Pre-Analysis Imaging and Screening
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_acceleratingVoltage:
    title: Accelerating Voltage
    description: Electron beam accelerating voltage in kilovolts (kV). For beam-sensitive materials (organic
      matter, phyllosilicates), 60–80 kV may be used to stay below the displacement threshold for C, N,
      O, and S. The procedure specifies the standard operating voltage; analysts record and justify deviations.
      Key parameter for the beam damage regime.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/acceleratingVoltage
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/acceleratingVoltage
      schema:name:
        const: Accelerating Voltage
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  tem_analyticalMode:
    title: Analytical Sub-mode
    description: 'Sub-mode(s) of imaging or diffraction performed under this procedure. TEM Imaging options:
      BF-TEM, DF-TEM, HRTEM, EFTEM. STEM Imaging options: HAADF, ABF, BF-STEM, ADF, MAADF. Electron Diffraction
      options: SAED, CBED, Nanobeam diffraction, Precession ED, 4D-STEM. Multiple values apply when the
      procedure covers more than one sub-mode within a given analytical mode.'
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/analyticalMode
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/analyticalMode
      schema:name:
        const: Analytical Sub-mode
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_temObjectiveAperture:
    title: TEM Objective Aperture
    description: Objective aperture diameter used to select the imaging beam condition in TEM mode. In BF-TEM,
      a small aperture blocks diffracted beams to enhance mass-thickness contrast; in DF-TEM, the aperture
      is displaced to select a specific diffracted beam; in HRTEM, no aperture is typically used.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/temObjectiveAperture
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/temObjectiveAperture
      schema:name:
        const: TEM Objective Aperture
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_eftemEnergyWindow:
    title: EFTEM Energy Window
    description: 'Energy window(s) used for EFTEM elemental mapping: center energy, width, and acquisition
      method (three-window or jump-ratio). Record ''N/A'' where EFTEM is not listed in Analytical Sub-mode.'
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/eftemEnergyWindow
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/eftemEnergyWindow
      schema:name:
        const: EFTEM Energy Window
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_haadfCollectionAngles:
    title: HAADF Collection Angles
    description: Inner and outer collection angles of the HAADF detector in milliradians (mrad). The inner
      angle determines the boundary between diffracted and thermally diffuse scattered electrons; larger
      inner angles yield stronger Z-contrast and reduced Bragg contrast. Inner angle is most critical and
      can be derived from camera length and detector geometry. In HAADF-STEM a shorter camera length increases
      the inner angle, yielding more thermally diffuse (Z-contrast) and less Bragg-diffraction signal.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/haadfCollectionAngles
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/haadfCollectionAngles
      schema:name:
        const: HAADF Collection Angles
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_stemProbeDiameter:
    title: STEM Probe Diameter
    description: 'Nominal or measured diameter of the focused electron probe at the sample, reported in
      nm. Serves as a direct spatial resolution proxy for STEM imaging and STEM-EDS/EELS analysis. Related
      to, but distinct from, Convergence Semi-Angle: the two quantities are connected via aberration coefficients,
      defocus, and probe current, which are not always published. Report whichever is known; if both are
      known, report both fields. Also governs STEM-EDS and STEM-EELS acquisition where those detectors are
      used.'
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/stemProbeDiameter
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/stemProbeDiameter
      schema:name:
        const: STEM Probe Diameter
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  tem_stemProbeCurrent:
    title: STEM Probe Current
    description: Probe current in picoamperes (pA) or nanoamperes (nA). Higher current improves EDS/EELS
      signal but increases beam damage risk, especially for organic matter and hydrous minerals. Also governs
      STEM-EDS and STEM-EELS acquisition where those detectors are used.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/stemProbeCurrent
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/stemProbeCurrent
      schema:name:
        const: STEM Probe Current
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  tem_stemDwellTimePerPixel:
    title: STEM Dwell Time per Pixel
    description: Time spent acquiring signal at each pixel during STEM scanning in milliseconds. Longer
      dwell improves signal-to-noise but increases total specimen dose; for dose-sensitive materials, minimize
      dwell and compensate with frame averaging. Also governs STEM-EDS and STEM-EELS acquisition where those
      detectors are used. For 4D-STEM dwell time see '4D-STEM Dwell Time per Probe Position'.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/stemDwellTimePerPixel
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/stemDwellTimePerPixel
      schema:name:
        const: STEM Dwell Time per Pixel
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  tem_stemScanDimensions:
    title: STEM Scan Dimensions
    description: Number of pixels in the STEM scan frame (X × Y pixels). Combined with calibrated pixel
      size, defines the field of view. Also governs STEM-EDS and STEM-EELS acquisition where those detectors
      are used.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/stemScanDimensions
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/stemScanDimensions
      schema:name:
        const: STEM Scan Dimensions
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  tem_stemFrameAveraging:
    title: STEM Frame Averaging
    description: Number of frames averaged (with drift correction if applicable) to produce the final STEM
      image. Averaging reduces noise while limiting per-frame dose. Also governs STEM-EDS and STEM-EELS
      acquisition where those detectors are used.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/stemFrameAveraging
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/stemFrameAveraging
      schema:name:
        const: STEM Frame Averaging
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_cameraLength:
    title: Camera Length
    description: 'Nominal camera length in millimeters used for diffraction pattern acquisition. Controls
      the mapping between reciprocal-space scattering angle and detector position; must be calibrated to
      convert pixel distances to d-spacings. In STEM mode, also sets HAADF/ABF detector collection angles.
      Calibration to absolute d-spacings is required — see ''Diffraction Calibration Reference''. Camera
      length choice affects HAADF Z-contrast purity: a shorter camera length (e.g. 30 mm) shifts the inner
      angle toward thermal diffuse scatter; a longer one (e.g. 150 mm) admits more Bragg scatter.'
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/cameraLength
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/cameraLength
      schema:name:
        const: Camera Length
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  tem_selectedAreaApertureSize:
    title: Selected-Area Aperture Size
    description: Diameter of the selected-area aperture used in SAED mode, defining the specimen region
      that contributes to the diffraction pattern.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/selectedAreaApertureSize
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/selectedAreaApertureSize
      schema:name:
        const: Selected-Area Aperture Size
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_precessionAngle:
    title: Precession Angle
    description: Precession semi-angle in degrees for precession electron diffraction (PED). Hollow-cone
      illumination reduces dynamical diffraction effects and produces more kinematical-like intensities.
      Not applicable to SAED, CBED, or standard 4D-STEM. Record 'N/A' where Precession ED is not listed
      in Analytical Sub-mode.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/precessionAngle
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/precessionAngle
      schema:name:
        const: Precession Angle
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  tem_stemScanGridAndArea4D:
    title: 4D-STEM Scan Grid and Area
    description: Number of probe positions in the 4D-STEM dataset (scan pixels × scan pixels) and the physical
      area covered. Probe step size is the physical area divided by scan pixel count. Record 'N/A' where
      4D-STEM is not listed in Analytical Sub-mode.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/stemScanGridAndArea4D
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/stemScanGridAndArea4D
      schema:name:
        const: 4D-STEM Scan Grid and Area
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_stemDwellTimePerProbePosition4D:
    title: 4D-STEM Dwell Time per Probe Position
    description: Time spent acquiring each diffraction pattern in the 4D-STEM dataset in milliseconds. Longer
      dwell improves signal-to-noise for weakly diffracting phases (e.g., smectite 001 reflection at ~1.24
      nm) but increases total specimen dose; risk of beam damage to phyllosilicates and organic matter must
      be balanced against data quality. Record 'N/A' where 4D-STEM is not listed in Analytical Sub-mode.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/stemDwellTimePerProbePosition4D
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/stemDwellTimePerProbePosition4D
      schema:name:
        const: 4D-STEM Dwell Time per Probe Position
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  tem_diffractionCameraLengthCalibrationMethod:
    title: Diffraction Camera Length Calibration Method
    description: Method used to calibrate the camera length constant and convert pixel distances in diffraction
      patterns to d-spacings or reciprocal lattice vectors.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/diffractionCameraLengthCalibrationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
