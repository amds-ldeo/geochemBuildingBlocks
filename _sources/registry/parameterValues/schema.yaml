    - schema:propertyID
    - schema:name
    - schema:value
  geochron_massResolutionSetting:
    title: Mass Resolution Setting
    description: Operating mass resolution of the mass analyser. Fixed at unit resolution for quadrupole
      instruments; selectable (low/medium/high) for sector-field instruments to balance sensitivity against
      interference suppression; not applicable in the same sense for multi-collector instruments running
      static low-resolution collection (see Faraday Cup Array Configuration and Collector Configuration
      for MC-specific detail).
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/massResolutionSetting
      '@type':
        const:
