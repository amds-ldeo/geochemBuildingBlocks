        const:
        - '@id': ada:parameter/geochronTAPP/faradayCupArrayConfiguration
      schema:name:
        const: Faraday Cup Array Configuration
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
