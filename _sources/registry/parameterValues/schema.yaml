    description: Depth of the ablation pit produced under the registered laser conditions, the method used
      to measure it, and the resulting per-pulse ablation rate. Characterises the achievable depth/time
      resolution of the procedure.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/ablationPitDepthAblationRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/ablationPitDepthAblationRate
      schema:name:
        const: Ablation Pit Depth/Ablation Rate
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_carrierGasAndFlowRate:
    title: Carrier Gas and Flow Rate
    description: Identity and plumbing configuration of the gas used to transport the ablated aerosol from
      the cell to the torch, including the procedure-registered flow rate(s).
    type: object
