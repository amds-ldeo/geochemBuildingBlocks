    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  empa_proportionalCounterDetector:
    title: Proportional Counter / Detector
    description: Type of detector used on each spectrometer assignment. Affects sensitivity and count rate
      linearity.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/proportionalCounterDetector
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/empaTAPP/proportionalCounterDetector
      schema:name:
        const: Proportional Counter / Detector
