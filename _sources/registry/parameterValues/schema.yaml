    description: Count time (dwell time) per mass position for each measured isotope, and the settling time
      allowed between mass jumps, as reported in Table 3 of Horstwood et al. (2016). Applies to sequential
      (Q/SF) mass-hopping acquisition; for simultaneous multi-collector acquisition see Number of Blocks
      per Measurement, Number of Cycles per Block, and Integration Time per Cycle.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/integrationTimePerPeakDwellTimesQuadrupoleSettlingTimeBetweenMassJumps
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/integrationTimePerPeakDwellTimesQuadrupoleSettlingTimeBetweenMassJumps
      schema:name:
        const: Integration Time per Peak/Dwell Times; Quadrupole Settling Time Between Mass Jumps
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_totalIntegrationTimePerOutputDataPoint:
    title: Total Integration Time per Output Data Point (s)
    description: Total duty-cycle time for one complete mass-scan sweep (sum of all per-isotope dwell times
      and settling times), which sets the time resolution of the down-hole signal. Applies to sequential
      (Q/SF) acquisition.
