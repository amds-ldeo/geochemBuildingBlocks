        - '@id': ada:parameter/temTAPP/diffractionCameraLengthCalibrationMethod
      schema:name:
        const: Diffraction Camera Length Calibration Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_edsAcquisitionMode:
    title: EDS Acquisition Mode
    description: Mode of EDS data acquisition. Record 'N/A' where EDS is not listed in Spectroscopic Detector(s).
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/edsAcquisitionMode
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/edsAcquisitionMode
      schema:name:
        const: EDS Acquisition Mode
      schema:value:
