  geochron_torchDepth:
    title: Torch Depth
    description: Distance between the load coil and the sampling cone tip (mm), also called injector depth
      or torch position. Affects ion transmission efficiency, oxide formation, and doubly-charged species
      production.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/torchDepth
