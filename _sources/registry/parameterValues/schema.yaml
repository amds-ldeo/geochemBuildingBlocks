      '@id':
        const: ada:parameter/solutionQicpmsTAPP/dwellTimePerMass
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionQicpmsTAPP/dwellTimePerMass
      schema:name:
        const: Dwell Time per Mass
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionQicpms_collisionGasFlowRate:
    title: Collision Gas Flow Rate
    description: Flow rate of the collision gas in KED mode (mL/min). Higher flow rates provide greater
      interference suppression at the cost of analyte sensitivity. Record 'N/A' if KED mode is not used.
      Record 'N/A' where Collision/Reaction Cell (CRC) Configuration does not include KED.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionQicpmsTAPP/collisionGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionQicpmsTAPP/collisionGasFlowRate
      schema:name:
        const: Collision Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionQicpms_cellExitDiscriminationVoltage:
    title: Cell Exit Discrimination Voltage
    description: Kinetic energy discrimination offset voltage applied at the exit of the collision cell
      (V). Controls the degree of polyatomic ion suppression. Record 'N/A' if KED mode is not used. Record
      'N/A' where Collision/Reaction Cell (CRC) Configuration does not include KED.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionQicpmsTAPP/cellExitDiscriminationVoltage
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionQicpmsTAPP/cellExitDiscriminationVoltage
      schema:name:
        const: Cell Exit Discrimination Voltage
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionQicpms_reactionGasFlowRate:
    title: Reaction Gas Flow Rate
    description: Flow rate of the reaction gas in DRC mode (mL/min). Record 'N/A' if DRC mode is not used.
      Record 'N/A' where Collision/Reaction Cell (CRC) Configuration does not include DRC.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionQicpmsTAPP/reactionGasFlowRate
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionQicpmsTAPP/reactionGasFlowRate
      schema:name:
        const: Reaction Gas Flow Rate
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionQicpms_doublyChargedSpeciesMonitor:
    title: Doubly-Charged Species Monitor
    description: Mass ratio monitored to estimate doubly-charged ion (M2+) formation during instrument tuning.
      Doubly-charged ions appear at half the nominal mass of the parent ion and can interfere with lighter
      analyte masses. Ba2+/Ba+ (m/z 69/138) and Ce2+/Ce+ (m/z 70/140) are the most common proxies for solution
      ICP-MS.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionQicpmsTAPP/doublyChargedSpeciesMonitor
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionQicpmsTAPP/doublyChargedSpeciesMonitor
      schema:name:
        const: Doubly-Charged Species Monitor
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionQicpms_doublyChargedSpeciesProduction:
    title: Doubly-Charged Species Production
    description: Measured percentage of doubly-charged ion production for the monitored species at the time
      of instrument tuning. Record both the acceptance threshold and the measured value. Elevated doubly-charged
      production indicates incomplete ionization and potential interference on elements at approximately
      half the mass of abundant matrix components.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionQicpmsTAPP/doublyChargedSpeciesProduction
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionQicpmsTAPP/doublyChargedSpeciesProduction
      schema:name:
        const: Doubly-Charged Species Production
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionQicpms_spikeOutlierFilteringApproach:
    title: Spike / Outlier Filtering Approach
    description: Criteria used to identify and exclude anomalous replicate measurements or data points from
      the calculated mean.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionQicpmsTAPP/spikeOutlierFilteringApproach
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionQicpmsTAPP/spikeOutlierFilteringApproach
      schema:name:
        const: Spike / Outlier Filtering Approach
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionQicpms_pulseAnalogDetectorNonlinearityCorrection:
    title: Pulse/Analog Detector Nonlinearity Correction
    description: Whether a correction was applied for nonlinear detector response at the transition between
      pulse-counting and analog detection modes. For Q-ICP-MS instruments with dual-mode SEM detectors,
      a cross-calibration factor is measured and applied at the pulse-to-analog crossover threshold. Accurate
      cross-calibration is critical for analytes spanning a wide concentration range in the same session.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionQicpmsTAPP/pulseAnalogDetectorNonlinearityCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionQicpmsTAPP/pulseAnalogDetectorNonlinearityCorrection
      schema:name:
        const: Pulse/Analog Detector Nonlinearity Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionQicpms_memoryEffectMitigation:
    title: Memory Effect Mitigation
    description: Procedure applied to identify and minimize carry-over of high-concentration elements between
      successive sample introductions. For solution ICP-MS, mitigation is implemented primarily at measurement
      time through extended rinse periods (see Wash Time Between Samples, Group 4). At data processing level,
      documents any flagging or exclusion of measurements preceded by high-concentration samples or standards
      where the required washout time may not have been achieved.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionQicpmsTAPP/memoryEffectMitigation
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionQicpmsTAPP/memoryEffectMitigation
      schema:name:
        const: Memory Effect Mitigation
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionQicpms_uncertaintyPropagationMethod:
    title: Uncertainty Propagation Method
    description: 'The approach used to propagate analytical uncertainty through the data reduction chain
      to the final reported value. State which sources are included in the propagation: counting statistics,
      calibration standard uncertainty, internal standard uncertainty, drift correction, and any systematic
      contributions. Distinct from Uncertainty Level, which states the convention at which the resulting
      uncertainty is quoted.'
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionQicpmsTAPP/uncertaintyPropagationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionQicpmsTAPP/uncertaintyPropagationMethod
      schema:name:
        const: Uncertainty Propagation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionQicpms_normalizationStandardsBasedCorrection:
    title: Normalization / Standards-Based Correction
    description: Post-acquisition normalization applied to output concentrations relative to a reference
      value (e.g., correction to a monitor element's certified value in the calibration standard).
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionQicpmsTAPP/normalizationStandardsBasedCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionQicpmsTAPP/normalizationStandardsBasedCorrection
      schema:name:
        const: Normalization / Standards-Based Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionQicpms_calibrationFactorAndDeterminationMethod:
    title: Calibration Factor and Determination Method
    description: 'An externally-calibrated factor that converts the measured quantity into the reported
      quantity, how it was determined, and its uncertainty. Applies where the conversion depends on a factor
      calibrated against a reference of independently known value, rather than on the instrument response
      alone. Distinct from the fields that name the calibration material and that state which approach applies
      to which analyte, where the technique has them: this field records the resulting factor itself.'
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionQicpmsTAPP/calibrationFactorAndDeterminationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionQicpmsTAPP/calibrationFactorAndDeterminationMethod
      schema:name:
        const: Calibration Factor and Determination Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionQicpms_constantsAndReferenceValuesUsed:
    title: Constants and Reference Values Used
    description: Physical constants and reference values used in data reduction to calculate the final reported
      quantity (e.g., decay constants for age calculation, standard isotope ratios, or other citable reference
      values used in a correction or calculation), together with their source. Distinct from the Group 6
      reference-material fields, which document accepted values for specific calibration/validation materials
      rather than universal physical constants. Record "None" if no citable, revisable physical constants
      feed into this procedure's data reduction.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionQicpmsTAPP/constantsAndReferenceValuesUsed
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionQicpmsTAPP/constantsAndReferenceValuesUsed
      schema:name:
        const: Constants and Reference Values Used
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionQicpms_primaryCalibrationStandardName:
    title: Primary Calibration Standard Name
    description: Name and reference material identifier of the external calibration standard used to convert
      signal intensities to elemental concentrations. Include the material name, its source or supplier,
      and a citation for the accepted values used, since results calibrated against different published
      values for the same material are not directly comparable.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionQicpmsTAPP/primaryCalibrationStandardName
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionQicpmsTAPP/primaryCalibrationStandardName
      schema:name:
        const: Primary Calibration Standard Name
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionQicpms_secondaryReferenceMaterials:
    title: Secondary Reference Materials
    description: Reference material(s) measured as unknowns to independently assess analytical accuracy.
      Specify material name and expected-value source.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionQicpmsTAPP/secondaryReferenceMaterials
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionQicpmsTAPP/secondaryReferenceMaterials
      schema:name:
        const: Secondary Reference Materials
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionQicpms_fundingSourceForProcedureDevelopment:
    title: Funding Source for Procedure Development
    description: Grants and other funding sources that supported instrument acquisition, major upgrades,
      procedure development, and associated personnel time. Include grant numbers and funding agencies where
      applicable.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionQicpmsTAPP/fundingSourceForProcedureDevelopment
      '@type':
        const:
