        - '@id': ada:parameter/semTAPP/samplePreparationMethod
      schema:name:
        const: Sample Preparation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_samplePersistentIdentifier:
    title: Sample Persistent Identifier
    description: Globally unique, persistent identifier for each sample listed in Sample Name. IGSN (International
      Geo Sample Number) is the recommended standard for geological and cosmochemical samples, as used by
      Astromat, EarthChem and SESAR. Where a sample and its sub-samples are separately registered, record
      the identifier at the level actually analysed.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/samplePersistentIdentifier
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/samplePersistentIdentifier
      schema:name:
        const: Sample Persistent Identifier
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_targetSelectionCriteria:
    title: Target Selection Criteria
    description: 'The rules governing which part of the sample is analysed, and why. Covers the criteria
      applied when choosing grains, aliquots, spots, or a region of interest — size, morphology, clarity,
      freedom from inclusions or alteration, phase identity, or spatial position. Distinct from Target Material,
      which states the material type the procedure is designed for: this field states how, within such a
      sample, the analysed portion is picked out.'
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/targetSelectionCriteria
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/targetSelectionCriteria
      schema:name:
        const: Target Selection Criteria
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_preAnalysisImagingAndScreening:
    title: Pre-Analysis Imaging and Screening
    description: Imaging or other characterisation performed before the measurement in order to select or
      locate the analysed target, including the technique, instrument and settings used, and how individual
      analyses are linked back to the images. Distinct from any imaging the procedure performs as its own
      measurement. Where the imaging is performed on a separate instrument, it should also be recorded in
      the Group 1 coupling fields.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/preAnalysisImagingAndScreening
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/preAnalysisImagingAndScreening
      schema:name:
        const: Pre-Analysis Imaging and Screening
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_acceleratingVoltage:
    title: Accelerating Voltage
    description: Electron beam accelerating voltage in kilovolts. Affects X-ray generation depth (EDS/WDS),
      EBSD pattern quality, imaging resolution, and beam penetration. Low voltages (1-5 kV) improve surface
      sensitivity and reduce beam damage; high voltages (15-20 kV) improve X-ray generation for quantitative
      analysis.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/acceleratingVoltage
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/acceleratingVoltage
      schema:name:
        const: Accelerating Voltage
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  sem_beamCurrent:
    title: Beam Current
    description: Electron beam probe current. Higher current improves signal-to-noise for X-ray analysis
      (EDS/WDS, EBSD) and CL but may increase beam damage and reduce spatial resolution. Express in nA;
      for sub-nA values use decimal notation (e.g., 0.4 nA).
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/beamCurrent
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/beamCurrent
      schema:name:
        const: Beam Current
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  sem_beamDiameter:
    title: Beam Diameter
    description: Nominal electron beam diameter (spot size) at the sample surface, in nanometres or micrometres,
      as set by the condenser aperture and working distance. Controls the spatial resolution and X-ray excitation
      volume. For mapping modes, the effective spatial sampling interval is further defined by Step Size
      / Pixel Size.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/beamDiameter
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/beamDiameter
      schema:name:
        const: Beam Diameter
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_beamRasterDimensions:
    title: Beam Raster Dimensions
    description: Dimensions of the small area over which the beam is rastered during a single analysis point,
      reported as width × height in µm. Applicable when Beam Mode = Rastered; defines the effective spatial
      footprint of the measurement and distributes dose over a larger area to reduce beam damage on sensitive
      phases.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/beamRasterDimensions
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/beamRasterDimensions
      schema:name:
        const: Beam Raster Dimensions
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_beamDamageMinimization:
    title: Beam Damage Minimization
    description: 'Describes any measures taken to reduce electron beam damage to the sample during analysis.
      Examples: reduced accelerating voltage, lowered beam current, defocused or rastered beam, cooled stage,
      short acquisition sequences, or rotating between multiple points. Particularly important for volatile-bearing
      phases, hydrous minerals, glasses, organic materials, and biological samples.'
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/beamDamageMinimization
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/beamDamageMinimization
      schema:name:
        const: Beam Damage Minimization
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_driftCorrection:
    title: Drift Correction
    description: 'Describes whether and how stage or beam drift was monitored and corrected during the measurement
      session. Examples: periodic stage realignment to a fiducial marker, automated beam drift correction
      in acquisition software, or reanalysis of a reference point at regular intervals. Particularly relevant
      for long mapping runs and high-magnification sessions where positional accuracy affects data quality.'
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/driftCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/driftCorrection
      schema:name:
        const: Drift Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_workingDistance:
    title: Working Distance
    description: Distance between the objective lens pole piece and the specimen surface in millimetres.
      Affects spatial resolution, depth of focus, EDS X-ray take-off angle, and EBSD geometry.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/workingDistance
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/workingDistance
      schema:name:
        const: Working Distance
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  sem_chamberPressure:
    title: Chamber Pressure
    description: Chamber pressure and gas type during analysis. Required for variable pressure (VP-SEM)
      and environmental SEM (ESEM) modes. Report value and unit (Pa or Torr) and gas composition. Use 'None'
      for standard high-vacuum operation.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/chamberPressure
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/chamberPressure
      schema:name:
        const: Chamber Pressure
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_dwellTimePerPixel:
    title: Dwell Time per Pixel
    description: Time the electron beam dwells on each pixel during raster scanning (imaging modes) or on
      each step position during compositional mapping (EDS and WDS mapping modes), in microseconds or milliseconds.
      Longer dwell time improves signal-to-noise and counting statistics but increases total dose and can
      cause beam damage or contamination on sensitive materials. For WDS mapping, the dwell time is per
      spectrometer per pixel.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/dwellTimePerPixel
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/dwellTimePerPixel
      schema:name:
        const: Dwell Time per Pixel
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_analyte:
    title: Analyte
    description: The chemical species this procedure is designed to determine, recorded at whatever resolution
      the chemistry is resolved — element(s) for this technique; valence species where a procedure resolves
      oxidation state; compounds where it resolves molecules. The procedure registers the full analyte suite;
      analysts record the specific subset actually measured in a given session, which may be narrower. Fields
      whose Keyed By column declares 'analyte' apply individually to each element in this list.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/analyte
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/analyte
      schema:name:
        const: Analyte
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_edsLiveTimePerPointOrPixel:
    title: EDS Live Time per Point or Pixel
    description: EDS spectral acquisition live time per analysis point or per pixel in seconds. Longer live
      time improves counting statistics but increases beam damage risk and total acquisition time.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/edsLiveTimePerPointOrPixel
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/edsLiveTimePerPointOrPixel
      schema:name:
        const: EDS Live Time per Point or Pixel
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  sem_stepSizePixelSize:
    title: Step Size / Pixel Size
    description: Centre-to-centre distance between adjacent measurement points (WDS mapping) or pixels (EDS
      mapping) in µm. Defines the spatial sampling interval of the map and, together with the pixel-grid
      dimensions, determines the total mapped area. Smaller step sizes increase spatial resolution but extend
      acquisition time.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/stepSizePixelSize
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/stepSizePixelSize
      schema:name:
        const: Step Size / Pixel Size
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_peakCountingTime:
    title: Peak Counting Time
    description: Time spent counting X-ray intensity at the peak position, in seconds, on each spectrometer
      assignment. Procedure specifies standard values; analysts may adjust within procedure-defined bounds.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/peakCountingTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/peakCountingTime
      schema:name:
        const: Peak Counting Time
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  sem_backgroundCountingTime:
    title: Background Counting Time
    description: Total time spent counting at off-peak background position(s) in seconds, summed across
      all background positions.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/backgroundCountingTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/backgroundCountingTime
      schema:name:
        const: Background Counting Time
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  sem_backgroundPosition:
    title: Background Position(s)
    description: Location(s) of off-peak background measurement(s) relative to the peak, in mm or sin-theta,
      and whether on the high- or low-energy side.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/backgroundPosition
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/backgroundPosition
      schema:name:
        const: Background Position(s)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_clIntegrationTime:
    title: CL Integration Time
    description: Acquisition time per pixel (hyperspectral map mode) or per spectrum (spectral point mode),
      in ms or s. Longer integration improves signal-to-noise but increases beam dose and acquisition time.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/clIntegrationTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/clIntegrationTime
      schema:name:
        const: CL Integration Time
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_ebsdStepSize:
    title: EBSD Step Size
    description: Distance between adjacent EBSD measurement points in the map in nm or µm. Must be smaller
      than the smallest grain of interest to resolve grain boundary positions and intragrain orientation
      gradients.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/ebsdStepSize
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/ebsdStepSize
      schema:name:
        const: EBSD Step Size
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_ebsdFrameTime:
    title: EBSD Frame Time
    description: Acquisition time per EBSD diffraction pattern frame in milliseconds. Longer frame time
      improves pattern quality and indexing rate but increases total acquisition time.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/ebsdFrameTime
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/ebsdFrameTime
      schema:name:
        const: EBSD Frame Time
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  sem_ebsdPhaseList:
    title: EBSD Phase List
    description: Mineral phases included in the EBSD reference pattern library for this procedure. The procedure
      specifies the expected phase suite for the target material; analysts may add phases for specific sample
      compositions.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/ebsdPhaseList
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/ebsdPhaseList
      schema:name:
        const: EBSD Phase List
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_protectiveCoatingDeposition:
    title: Protective Coating Deposition
    description: 'Type and deposition conditions of the protective coating applied to the sample surface
      before FIB milling. E-beam deposition causes less surface damage than ion-beam deposition and should
      be applied as the initial layer. Typical coatings: platinum (Pt) or carbon (C). State material, deposition
      method, beam conditions, and approximate thickness.'
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/protectiveCoatingDeposition
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/protectiveCoatingDeposition
      schema:name:
        const: Protective Coating Deposition
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_coarseMillingConditions:
    title: Coarse Milling Conditions
    description: 'Ion beam voltage and current used for bulk material removal during FIB milling. For TEM
      specimen preparation: bulk trenching to isolate the lamella and intermediate thinning. For 3D tomography:
      face preparation and initial slice removal.'
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/coarseMillingConditions
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/coarseMillingConditions
      schema:name:
        const: Coarse Milling Conditions
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_finePolishingConditions:
    title: Fine Polishing Conditions
    description: Ion beam voltage and current for final thinning and surface polishing of the TEM lamella.
      Low-voltage polishing (2 kV or below) minimises Ga implantation depth, surface amorphisation, and
      curtaining artifacts.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/finePolishingConditions
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/finePolishingConditions
      schema:name:
        const: Fine Polishing Conditions
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_foilThickness:
    title: Foil Thickness
    description: 'Target thickness of the electron-transparent TEM lamella after final FIB polishing, in
      nanometres. Actual thickness may differ from target. Typical range: 50-150 nm for standard TEM/STEM;
      200-600 nm for XANES or tomography sections.'
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/foilThickness
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/foilThickness
      schema:name:
        const: Foil Thickness
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_ionMillingConditions:
    title: Ion Milling Conditions (3D Tomography)
    description: Ion beam voltage and current used to mill each slice during FIB-SEM serial sectioning.
      These parameters determine material removal rate per slice and exposed surface quality.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/ionMillingConditions
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/ionMillingConditions
      schema:name:
        const: Ion Milling Conditions (3D Tomography)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_sliceThickness:
    title: Slice Thickness
    description: Thickness of each FIB-milled slice during serial sectioning in nanometres. Controls the
      Z-axis resolution of the 3D reconstruction.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/sliceThickness
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/sliceThickness
      schema:name:
        const: Slice Thickness
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  sem_backgroundCorrectionMethod:
    title: Background Correction Method
    description: 'Method used to estimate and subtract background X-ray intensity beneath the peak. For
      WDS: typically 2-point off-peak linear interpolation or Mean Atomic Number (MAN) background model.
      For EDS: spectral background fitting or top-hat filter applied during spectral processing.'
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/backgroundCorrectionMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/backgroundCorrectionMethod
      schema:name:
        const: Background Correction Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_timeDependentIntensityCorrection:
    title: Time-Dependent Intensity Correction
    description: Type of time-dependent intensity (TDI) correction applied to compensate for beam-induced
      volatilisation or migration of sensitive elements (e.g., Na, K, F in glasses, feldspars, carbonates).
      Most commonly applied in WDS point analysis; uncommon for EDS or X-ray mapping.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/timeDependentIntensityCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/timeDependentIntensityCorrection
      schema:name:
        const: Time-Dependent Intensity Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_halogenCorrectionOnOxygen:
    title: Halogen Correction on Oxygen
    description: Whether oxygen content was adjusted to account for halogen substitution (F and/or Cl replacing
      OH) in halogen-bearing phases such as apatite, amphibole, and mica, where oxygen is calculated by
      stoichiometry.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/halogenCorrectionOnOxygen
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/halogenCorrectionOnOxygen
      schema:name:
        const: Halogen Correction on Oxygen
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_blankCorrection:
    title: Blank Correction
    description: Method and reference material(s) used to determine and subtract blank signal contributions
