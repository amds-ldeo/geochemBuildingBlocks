    description: Method used to calibrate the relative gain (amplification factor) of each Faraday cup amplifier
      at the start of or during each analytical session. Relative gain differences between amplifiers cause
      systematic errors in isotope ratios if uncorrected. For instruments with ion-counting detectors, also
      describes the SEM-to-Faraday cross-calibration sequence.
