    description: ICP radiofrequency forward power. Session-tunable within procedure-defined bounds during
      plasma optimisation; consistent with the analogous, tunable treatment of RF Power across LA-Q/SF-ICP-MS
      and all three solution ICP-MS TAPPs.
    type: object
    properties:
      '@id':
