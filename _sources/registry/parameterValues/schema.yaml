    - schema:value
  sem_wdsSpectrometerConfiguration:
    title: WDS Spectrometer Configuration
    description: Number, type, and crystal range of WDS spectrometers on the instrument. Include manufacturer,
      model, and crystal range. For SEM-WDS configurations (third-party WDS on a non-EPMA platform), include
      WDS manufacturer and model.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/wdsSpectrometerConfiguration
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/wdsSpectrometerConfiguration
      schema:name:
        const: WDS Spectrometer Configuration
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_clDetectorConfiguration:
    title: CL Detector Configuration
    description: CL detector type, manufacturer, model, collection optics (e.g., parabolic mirror, elliptical
      mirror, light guide), and spectral detection configuration (PMT for panchromatic, CCD/EMCCD for spectral,
      multi-channel for pseudo-color CL).
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/clDetectorConfiguration
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/clDetectorConfiguration
      schema:name:
        const: CL Detector Configuration
      schema:value:
        type: string
    required:
