    description: Whether a collision or reaction cell is installed and its operating mode. Long-standard
      on quadrupole-based instruments; a small number of modern multi-collector instruments (e.g., Nu Instruments
      Sapphire, Thermo Scientific Neoma MS/MS) also add a hexapole collision/reaction cell upstream of the
