  sem_imageRegistration3D:
    title: 3D Image Registration
    description: Method used to align consecutive SEM image slices in the 3D stack to correct for drift,
      vibration, and curtaining artifacts. Include software used.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/imageRegistration3D
