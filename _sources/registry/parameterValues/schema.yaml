    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionQicpms_makeUpGasFlowRate:
    title: Make-up Gas Flow Rate
    description: Supplementary argon flow added downstream of a desolvation system to maintain total gas
      delivery to the plasma (L/min). Record 'N/A' if no desolvation system is used. Record 'N/A' where
      Desolvation System is 'None'.
    type: object
    properties:
      '@id':
