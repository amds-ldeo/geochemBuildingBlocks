    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_eelsAcquisitionMode:
    title: EELS Acquisition Mode
    description: Mode of EELS data acquisition. Record 'N/A' where EELS is not listed in Spectroscopic Detector(s).
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/eelsAcquisitionMode
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/eelsAcquisitionMode
      schema:name:
        const: EELS Acquisition Mode
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_eelsEdges:
    title: EELS Edges
    description: 'Ionization edge(s) acquired by EELS, specified by element symbol and edge label (e.g.,
      Fe L2,3; O K). Provides the EELS-specific counterpart to the Analyte field: while Analyte lists elements,
      EELS Edges documents which ionization edges were used and their approximate energy loss positions.
      The procedure registers the full intended edge suite; analysts confirm or narrow this list at analysis
      time. Record ''N/A'' where EELS is not listed in Spectroscopic Detector(s).'
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/eelsEdges
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/eelsEdges
      schema:name:
        const: EELS Edges
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_eelsAcquisitionTimePerSpectrum:
    title: EELS Acquisition Time per Spectrum
    description: Exposure time per individual EELS spectrum (or per pixel for spectrum images) in seconds.
      Record 'N/A' where EELS is not listed in Spectroscopic Detector(s).
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/eelsAcquisitionTimePerSpectrum
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/eelsAcquisitionTimePerSpectrum
      schema:name:
        const: EELS Acquisition Time per Spectrum
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  tem_eelsEnergyLossRange:
    title: EELS Energy Loss Range
    description: Energy loss range acquired, defined by onset energy and width in eV. The procedure documents
      the target range for the registered analyte edges; analysts record the actual range acquired. Record
      'N/A' where EELS is not listed in Spectroscopic Detector(s).
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/eelsEnergyLossRange
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/eelsEnergyLossRange
      schema:name:
        const: EELS Energy Loss Range
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_eelsBackgroundSubtractionMethod:
    title: EELS Background Subtraction Method
    description: Method used to subtract the background beneath the ionization edge of interest to extract
      the net edge signal. Record 'N/A' where EELS is not listed in Spectroscopic Detector(s).
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/eelsBackgroundSubtractionMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/eelsBackgroundSubtractionMethod
      schema:name:
        const: EELS Background Subtraction Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_eelsPluralScatteringCorrection:
    title: EELS Plural Scattering Correction
    description: Method applied to correct for multiple inelastic scattering events (plural scattering)
      that broaden edge fine structure. Critical for specimens thicker than ~0.5 inelastic mean free paths.
      Record 'N/A' where EELS is not listed in Spectroscopic Detector(s).
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/eelsPluralScatteringCorrection
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/eelsPluralScatteringCorrection
      schema:name:
        const: EELS Plural Scattering Correction
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_imageProcessingMethodsApplied:
    title: Image Processing Methods Applied
    description: Image processing steps applied to TEM or STEM images during or after acquisition. Non-linear
      processing steps that could affect quantitative interpretation should be documented explicitly.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/imageProcessingMethodsApplied
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/imageProcessingMethodsApplied
      schema:name:
        const: Image Processing Methods Applied
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_specimenThicknessDeterminationMethod:
    title: Specimen Thickness Determination Method
    description: Method used to estimate TEM foil thickness. Required for EELS quantification (log-ratio)
      and for assessing multiple-scattering severity.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/specimenThicknessDeterminationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/specimenThicknessDeterminationMethod
      schema:name:
        const: Specimen Thickness Determination Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_calibrationFactorAndDeterminationMethod:
    title: Calibration Factor and Determination Method
    description: 'An externally-calibrated factor that converts the measured quantity into the reported
      quantity, how it was determined, and its uncertainty. Applies where the conversion depends on a factor
      calibrated against a reference of independently known value, rather than on the instrument response
      alone. Distinct from the fields that name the calibration material and that state which approach applies
      to which analyte, where the technique has them: this field records the resulting factor itself.'
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/calibrationFactorAndDeterminationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/calibrationFactorAndDeterminationMethod
      schema:name:
        const: Calibration Factor and Determination Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_constantsAndReferenceValuesUsed:
    title: Constants and Reference Values Used
    description: Physical constants and reference values used in data reduction to calculate the final reported
      quantity (e.g., decay constants for age calculation, standard isotope ratios, or other citable reference
      values used in a correction or calculation), together with their source. Distinct from the Group 6
      reference-material fields, which document accepted values for specific calibration/validation materials
      rather than universal physical constants. Record "None" if no citable, revisable physical constants
      feed into this procedure's data reduction.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/constantsAndReferenceValuesUsed
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/constantsAndReferenceValuesUsed
      schema:name:
        const: Constants and Reference Values Used
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_edsCalibrationStandard:
    title: EDS Calibration Standard(s)
    description: Reference material(s) used to validate EDS quantification or determine experimental k-factors
      or zeta-factors. TEM-EDS is less standardized than EPMA; many procedures rely on manufacturer k-factors
      without external calibration. Record 'N/A' where EDS is not listed in Spectroscopic Detector(s).
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/edsCalibrationStandard
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/edsCalibrationStandard
      schema:name:
        const: EDS Calibration Standard(s)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_eelsEnergyCalibration:
    title: EELS Energy Calibration
    description: Method and reference used to calibrate the EELS energy axis. Accurate calibration is required
      for ELNES edge identification, chemical-state analysis, and inter-lab comparability. Record 'N/A'
      where EELS is not listed in Spectroscopic Detector(s).
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/eelsEnergyCalibration
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/eelsEnergyCalibration
      schema:name:
        const: EELS Energy Calibration
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_diffractionCalibrationReference:
    title: Diffraction Calibration Reference
    description: Reference material or internal standard used to calibrate the electron diffraction camera
      constant (camera length × electron wavelength), enabling conversion of pixel distances to d-spacings.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/diffractionCalibrationReference
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/diffractionCalibrationReference
      schema:name:
        const: Diffraction Calibration Reference
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_edsCountingStatisticsAccumulationCriterion:
    title: EDS Counting Statistics / Accumulation Criterion
    description: Quality criterion used to determine when sufficient EDS signal has been accumulated for
      a given pixel or point, in lieu of or in addition to a fixed live time. Expressed as a target relative
      uncertainty on major-element peak counts achieved by accumulating successive scan frames (e.g., "1%
      counting statistics on major elements"; ">10% counting statistics"). Distinct from EDS Live Time per
      Point or Pixel, which records a fixed-duration setting. Record 'N/A' where EDS is not listed in Spectroscopic
      Detector(s).
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/edsCountingStatisticsAccumulationCriterion
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/edsCountingStatisticsAccumulationCriterion
      schema:name:
        const: EDS Counting Statistics / Accumulation Criterion
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_fundingSourceForProcedureDevelopment:
    title: Funding Source for Procedure Development
    description: Grants and other funding sources that supported instrument acquisition, major upgrades,
      procedure development, and associated personnel time. Include grant numbers and funding agencies where
      applicable.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/fundingSourceForProcedureDevelopment
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/fundingSourceForProcedureDevelopment
      schema:name:
        const: Funding Source for Procedure Development
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_procedureReference:
    title: Procedure Reference(s)
    description: DOI or URL for peer-reviewed publications or technical reports describing, validating,
      or benchmarking this procedure.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/procedureReference
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/procedureReference
      schema:name:
        const: Procedure Reference(s)
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_eelsEnergyDispersion:
    title: EELS Energy Dispersion
    description: Energy dispersion of the EELS spectrometer in eV per channel. Controls the energy range
      acquired per readout and the effective energy resolution trade-off. Record 'N/A' where EELS is not
      listed in Spectroscopic Detector(s).
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/eelsEnergyDispersion
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/eelsEnergyDispersion
      schema:name:
        const: EELS Energy Dispersion
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  tem_eelsEnergyResolution:
    title: EELS Energy Resolution
    description: Full-width at half-maximum (FWHM) of the zero-loss peak in eV, measured at operating conditions.
      Reflects combined electron source energy spread and monochromator effect (if active). Critical for
      ELNES fine-structure interpretation. Record 'N/A' where EELS is not listed in Spectroscopic Detector(s).
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/eelsEnergyResolution
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/eelsEnergyResolution
      schema:name:
        const: EELS Energy Resolution
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  tem_stemOrientationMappingMethod4D:
    title: 4D-STEM Orientation Mapping Method
    description: Algorithm, software module, and reference crystal structure database used for automated
      crystal orientation mapping (ACOM) from 4D-STEM datasets. Record 'N/A' where 4D-STEM is not listed
      in Analytical Sub-mode.
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/stemOrientationMappingMethod4D
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/stemOrientationMappingMethod4D
      schema:name:
        const: 4D-STEM Orientation Mapping Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  tem_edsSpectralProcessingType:
    title: EDS Spectral Processing Type
    description: Method used to process EDS spectra and extract net peak intensities from raw spectral data.
      Applied before quantification (EDS Quantification Method). Common approaches include background fitting
      and subtraction followed by peak integration, and filter fit or Gaussian deconvolution for overlapping
      peaks. Record 'N/A' where EDS is not listed in Spectroscopic Detector(s).
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/edsSpectralProcessingType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/edsSpectralProcessingType
      schema:name:
        const: EDS Spectral Processing Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
