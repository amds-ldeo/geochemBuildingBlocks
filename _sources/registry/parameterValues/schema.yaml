      quantity (e.g., decay constants for age calculation, standard isotope ratios, or other citable reference
      values used in a correction or calculation), together with their source. Distinct from the Group 6
      reference-material fields, which document accepted values for specific calibration/validation materials
      rather than universal physical constants. Record "None" if no citable, revisable physical constants
      feed into this procedure's data reduction.
