  sem_segmentationMethod3D:
    title: 3D Segmentation Method
    description: Method and software used to segment phases and features in the aligned 3D image stack,
      transforming the grayscale stack into labelled 3D regions (pores, mineral phases, grain boundaries,
      organic matter).
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/segmentationMethod3D
      '@type':
