  sem_edsDetectorConfiguration:
    title: EDS Detector Configuration
    description: EDS detector type, manufacturer, active area, solid angle, window type, and geometry (take-off
      angle, position). Multiple detectors should be listed separately.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/edsDetectorConfiguration
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/edsDetectorConfiguration
      schema:name:
