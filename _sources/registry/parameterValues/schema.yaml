    properties:
      '@id':
        const: ada:parameter/geochronTAPP/totalIntegrationTimePerOutputDataPoint
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/totalIntegrationTimePerOutputDataPoint
      schema:name:
        const: Total Integration Time per Output Data Point (s)
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  geochron_numberOfBlocksPerMeasurement:
    title: Number of Blocks per Measurement
    description: Number of measurement blocks acquired per spot. Each block typically begins with a baseline
      (on-peak zero) measurement before the analytical cycles. Multiple blocks allow inspection of signal
      stability and within-measurement drift.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/numberOfBlocksPerMeasurement
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/numberOfBlocksPerMeasurement
      schema:name:
        const: Number of Blocks per Measurement
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_numberOfCyclesPerBlock:
    title: Number of Cycles per Block
    description: Number of measurement cycles acquired per block. One cycle corresponds to a single set
      of simultaneous Faraday cup readings integrated for the duration in Integration Time per Cycle.
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/numberOfCyclesPerBlock
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/numberOfCyclesPerBlock
      schema:name:
        const: Number of Cycles per Block
      schema:value:
        anyOf:
        - type: number
        - type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  geochron_integrationTimePerCycle:
    title: Integration Time per Cycle
    description: Duration of signal integration per measurement cycle. Total integration time per spot =
