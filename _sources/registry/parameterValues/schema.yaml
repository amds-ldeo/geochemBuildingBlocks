    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_procedureReference:
    title: Procedure Reference(s)
    description: DOI or URL for peer-reviewed publications or technical reports describing, validating,
      or benchmarking this procedure.
    type: object
    properties:
