    - schema:value
  solutionQicpms_coupledDatasetOrPublicationReference:
    title: Coupled Dataset or Publication Reference
    description: 'DOI or other persistent identifier for the co-registered dataset or publication where
      both datasets are reported together. Accepts: a dedicated dataset DOI (if separately deposited), a
      shared dataset DOI (if co-submitted in the same package), or a publication DOI. Use "same submission"
      if the coupled dataset is included in this data package, or "pending" if not yet assigned. If coupling
      is documented through a shared sample identifier only, that information is already captured in Sample
      Persistent Identifier (Group 2).'
    type: object
