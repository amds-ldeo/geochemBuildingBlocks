    description: 'Physical constants and reference values used in data reduction to calculate the final
      reported quantity (e.g., decay constants for age calculation, the 238U/235U ratio used to convert
      measured 235U-based data to 207Pb/235U, or other citable reference values), together with their source.
      Distinct from Reference Material Information (Group 6), which documents accepted values for specific
      calibration/validation materials rather than universal physical constants. Critical for traceability:
      community-recommended values for decay constants and isotope ratios are periodically revised (e.g.,
      the 238U/235U ratio revision by Hiess et al. 2012), and a reported age or ratio can only be correctly
      reinterpreted against a future revision if the constants originally used are known.'
