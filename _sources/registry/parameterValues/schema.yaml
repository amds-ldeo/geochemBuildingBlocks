    - schema:value
  tem_edsLiveTimePerPointOrPixel:
    title: EDS Live Time per Point or Pixel
    description: EDS spectral acquisition live time per analysis point (point/line mode) or per pixel (spectrum
      image) in seconds. Also referred to as "EDS Acquisition Time" in EPMA and some SEM-EDS contexts, where
      the per-pixel distinction is less relevant. Record 'N/A' where EDS is not listed in Spectroscopic
      Detector(s).
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/edsLiveTimePerPointOrPixel
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/edsLiveTimePerPointOrPixel
      schema:name:
        const: EDS Live Time per Point or Pixel
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  tem_edsEnergyRange:
    title: EDS Energy Range
    description: Energy range of EDS spectrum acquisition in keV. Record 'N/A' where EDS is not listed in
      Spectroscopic Detector(s).
    type: object
    properties:
      '@id':
        const: ada:parameter/temTAPP/edsEnergyRange
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/temTAPP/edsEnergyRange
      schema:name:
        const: EDS Energy Range
      schema:value:
        type: string
    required:
