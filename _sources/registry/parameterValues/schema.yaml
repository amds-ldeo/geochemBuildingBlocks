        - '@id': ada:parameter/semTAPP/proportionalCounterDetector
      schema:name:
        const: Proportional Counter / Detector
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_wdsPhaSetting:
    title: WDS PHA Setting
    description: Pulse height analyzer (PHA) setting for the WDS detector. Integral mode accepts all pulses
      above a threshold; Differential mode selects a narrow energy window to reject higher-order reflections
      and escape peaks.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/wdsPhaSetting
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/wdsPhaSetting
      schema:name:
        const: WDS PHA Setting
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_clGrating:
    title: CL Grating
    description: Diffraction grating specification for spectral or hyperspectral CL acquisition, including
      groove density and blaze wavelength. Not applicable to panchromatic-only acquisition.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/clGrating
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/clGrating
      schema:name:
        const: CL Grating
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_analyteEstimationMethod:
    title: Analyte Estimation Method
    description: Whether elemental concentrations were calculated directly from measured X-ray intensities,
      or estimated by cation stoichiometry (e.g., oxygen calculated from cation proportions in silicates;
      carbon from stoichiometry in carbonates).
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/analyteEstimationMethod
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/analyteEstimationMethod
      schema:name:
        const: Analyte Estimation Method
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_edsSpectralProcessingType:
    title: EDS Spectral Processing Type
    description: Method used to process EDS spectra and extract net peak intensities from raw spectral data.
      Applied before quantification (see Matrix Correction Method). Common approaches include background
      fitting and subtraction followed by peak integration, and filter fit or Gaussian deconvolution for
      overlapping peaks.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/edsSpectralProcessingType
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/edsSpectralProcessingType
      schema:name:
        const: EDS Spectral Processing Type
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_interferingElements:
    title: Interfering Elements
    description: Element(s) whose X-ray lines overlap with the measured peak for one or more analytes, requiring
      a correction.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/interferingElements
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/interferingElements
      schema:name:
        const: Interfering Elements
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  sem_interferenceCorrectionStandard:
    title: Interference Correction Standard
    description: Reference material used to quantify and calibrate the interference correction for each
      affected analyte.
    type: object
    properties:
      '@id':
        const: ada:parameter/semTAPP/interferenceCorrectionStandard
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/semTAPP/interferenceCorrectionStandard
      schema:name:
        const: Interference Correction Standard
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value

  solutionMcicpms_coupledProcedureDoi:
    title: Coupled Procedure DOI
    description: Registered procedure DOI for the coupled technique named above. Provides a stable, citable
      link to the companion method independent of whether a dataset has been deposited. If the coupled procedure
      has not yet been registered, enter the DOI of a publication describing the coupled method, or "pending".
      Enter "None" if no coupling is planned.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/coupledProcedureDoi
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/coupledProcedureDoi
      schema:name:
        const: Coupled Procedure DOI
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionMcicpms_coupledDatasetOrPublicationReference:
    title: Coupled Dataset or Publication Reference
    description: 'DOI or other persistent identifier for the co-registered dataset or publication where
      both datasets are reported together. Accepts: a dedicated dataset DOI (if separately deposited), a
      shared dataset DOI (if co-submitted in the same package), or a publication DOI. Use "same submission"
      if the coupled dataset is included in this data package, or "pending" if not yet assigned. If coupling
      is documented through a shared sample identifier only, that information is already captured in Sample
      Persistent Identifier (Group 2).'
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/coupledDatasetOrPublicationReference
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/coupledDatasetOrPublicationReference
      schema:name:
        const: Coupled Dataset or Publication Reference
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionMcicpms_digestionTemperature:
    title: Digestion Temperature
    description: Temperature at which acid digestion was carried out (°C). Procedure specifies the target
      temperature.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/digestionTemperature
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/digestionTemperature
      schema:name:
        const: Digestion Temperature
      schema:value:
        anyOf:
        - type: number
        - type: string
      schema:unitText:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
    - schema:unitText
  solutionMcicpms_digestionDuration:
    title: Digestion Duration
    description: Duration of the primary acid digestion step (hours or days).
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/digestionDuration
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/solutionMcicpmsTAPP/digestionDuration
      schema:name:
        const: Digestion Duration
      schema:value:
        type: string
    required:
    - '@id'
    - '@type'
    - schema:propertyID
    - schema:name
    - schema:value
  solutionMcicpms_sampleAliquotMassOrVolume:
    title: Sample Aliquot Mass or Volume
    description: Mass (mg) of solid material digested or volume (mL) of liquid taken for dissolution. Used
      for yield calculations and concentration back-calculation.
    type: object
    properties:
      '@id':
        const: ada:parameter/solutionMcicpmsTAPP/sampleAliquotMassOrVolume
      '@type':
