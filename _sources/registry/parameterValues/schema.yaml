    title: Faraday Cup Amplifier Resistor Values
    description: Resistance values (Ω) of the feedback resistors in the Faraday cup amplifiers. Standard
      amplifiers use 10¹¹ Ω resistors; high-gain amplifiers (10¹² or 10¹³ Ω) are fitted to selected cups
      to improve signal-to-noise for very low-intensity beams (e.g., low-abundance Pb isotopes in young
      or low-U material).
    type: object
    properties:
      '@id':
        const: ada:parameter/geochronTAPP/faradayCupAmplifierResistorValues
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
        const:
        - '@id': ada:parameter/geochronTAPP/faradayCupAmplifierResistorValues
      schema:name:
        const: Faraday Cup Amplifier Resistor Values
      schema:value:
