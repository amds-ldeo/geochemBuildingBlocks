    - schema:propertyID
    - schema:name
    - schema:value
  empa_wdsPhaSetting:
    title: WDS PHA Setting
    description: Pulse height analyzer (PHA) setting for the WDS detector. Integral mode accepts all pulses
      above a threshold; Differential mode selects a narrow energy window to reject higher-order reflections
      and escape peaks.
    type: object
    properties:
      '@id':
        const: ada:parameter/empaTAPP/wdsPhaSetting
      '@type':
        const:
        - schema:PropertyValue
      schema:propertyID:
