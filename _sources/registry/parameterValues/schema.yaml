    description: Approach used to convert measured ion signals to elemental concentrations, where concentration
      data are also a product of the procedure (e.g., isotope dilution combined with isotope ratio measurement).
      For procedures producing isotope ratios only (no concentration output), record 'Not applicable (isotope
      ratios only)'. For double-spike procedures that simultaneously yield concentrations, record the ID
      calculation approach. Where different elements use different strategies, record each.
