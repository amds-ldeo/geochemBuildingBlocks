    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  laMcicpmsUPb_reactionProductIonMassShiftTransition:
    title: Reaction Product Ion / Mass-Shift Transition
    description: Where a monitored mass is produced by a reaction in the collision/reaction cell, the precursor ion, the reagent gas and the product ion measured. Records the mass-shift chemistry relating the mass measured to the target species it reports, which the monitored mass alone does not state. Record 'N/A' where the target species is measured on its own mass.
