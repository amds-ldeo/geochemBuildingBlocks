    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  epma_xRayDetectionMethodPerMonitoredElement:
    title: X-ray Detection Method per Monitored Element
    description: 'The X-ray detection method used to measure the monitored element: wavelength-dispersive (WDS), in which a crystal spectrometer separates the X-rays by wavelength and a proportional counter counts them, or energy-dispersive (EDS), in which a solid-state detector sorts every photon by energy at once. Applies where a procedure uses both.'
    type: object
    properties:
      '@id':
        const: ada:monitoredPropertyColumn/epmaTAPP/xRayDetectionMethodPerMonitoredElement
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: xRayDetectionMethodPerMonitoredElement
      schema:name:
        const: X-ray Detection Method per Monitored Element
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: true
      ada:tier:
        const: M
      schema:defaultValue:
        anyOf:
        - &id007
          type: string
        - type: array
          items: *id007
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - schema:defaultValue
  epma_xRayLine:
    title: X-ray Line
    description: X-ray emission line measured.
    type: object
    properties:
