$schema: https://json-schema.org/draft/2020-12/schema
title: ADA Channel Column Specification Registry
description: Registry of reusable schema:PropertyValueSpecification channel column definitions derived from technique TAPP workbooks. Each $def constrains one column of the channel table, a channel being an instrument selection position -- a mass, a Faraday cup, an energy-loss edge, an X-ray line -- as distinct from the analyte measured on it. TAPP building blocks reference these definitions via fragment $refs so they resolve locally through the building-block register. The root only hosts $defs; it has no instantiable properties of its own.
type: object
$defs:
  epma_backgroundPosition:
    title: Background Position(s)
    description: Location(s) of off-peak background measurement(s) relative to the peak, in mm or sin-theta, and whether on the high- or low-energy side.
    type: object
    properties:
      '@id':
        const: ada:monitoredPropertyColumn/epmaTAPP/backgroundPosition
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: backgroundPosition
      schema:name:
        const: Background Position(s)
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: false
      ada:tier:
        const: R
      schema:defaultValue:
        anyOf:
        - &id001
          type: string
        - type: array
          items: *id001
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  epma_diffractingCrystal:
    title: Diffracting Crystal
    description: Analyzing crystal (monochromator).
    type: object
    properties:
      '@id':
        const: ada:monitoredPropertyColumn/epmaTAPP/diffractingCrystal
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: diffractingCrystal
      schema:name:
        const: Diffracting Crystal
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: true
      ada:tier:
        const: M
      schema:defaultValue:
        anyOf:
        - &id002
          type: string
        - type: array
          items: *id002
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - schema:defaultValue
  epma_dwellTimePerPixel:
    title: Dwell Time per Pixel
    description: 'Time spent acquiring X-ray signal at each pixel during X-ray mapping, in milliseconds. For WDS: one value per spectrometer assignment per pixel. For EDS: total live-time per spectrum per pixel, a single value.'
    type: object
    properties:
      '@id':
        const: ada:monitoredPropertyColumn/epmaTAPP/dwellTimePerPixel
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: dwellTimePerPixel
      schema:name:
        const: Dwell Time per Pixel
      ada:dataType:
        const: number
      schema:readonlyValue:
        const: false
      ada:tier:
        const: M
      schema:defaultValue:
        anyOf:
        - &id003
          anyOf:
          - type: number
          - type: string
        - type: array
          items: *id003
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
    - schema:defaultValue
  epma_proportionalCounterDetector:
    title: Proportional Counter / Detector
    description: Type of detector used.
    type: object
    properties:
      '@id':
        const: ada:monitoredPropertyColumn/epmaTAPP/proportionalCounterDetector
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: proportionalCounterDetector
      schema:name:
        const: Proportional Counter / Detector
      ada:dataType:
        const: string
      schema:readonlyValue:
        const: true
      ada:tier:
