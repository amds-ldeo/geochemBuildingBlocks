    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  epma_sequence:
    title: Sequence
    description: Order in which spectrometer assignments are acquired, and — where the element suite exceeds the number of spectrometers — the passes the acquisition is divided into. Within a single pass all assigned spectrometers collect simultaneously, including at every pixel in X-ray mapping; a suite larger than the spectrometer count therefore requires the acquisition to be run more than once, each pass covering a different subset of elements.
    type: object
    properties:
      '@id':
        const: ada:monitoredPropertyColumn/epmaTAPP/sequence
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
        const: sequence
      schema:name:
        const: Sequence
      ada:dataType:
        const: integer
      schema:readonlyValue:
        const: true
      ada:tier:
        const: R
      schema:defaultValue:
        anyOf:
        - &id005
          anyOf:
          - type: number
          - type: string
        - type: array
          items: *id005
    required:
    - '@id'
    - '@type'
    - schema:valueName
    - schema:name
    - ada:dataType
  epma_wdsPhaSetting:
    title: WDS PHA Setting
    description: Pulse height analyzer (PHA) setting for the WDS detector. Integral mode accepts all pulses above a threshold; Differential mode selects a narrow energy window to reject higher-order reflections and escape peaks.
    type: object
    properties:
      '@id':
        const: ada:monitoredPropertyColumn/epmaTAPP/wdsPhaSetting
      '@type':
        const:
        - schema:PropertyValueSpecification
      schema:valueName:
